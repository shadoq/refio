<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Join the Harbor Club</title>
  <style>
    body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; }
    .row { margin: 0.75rem 0; }
    .divider { display: block; width: 100%; height: 12px; }
  </style>
</head>
<body>
  <img src="logo.png" id="logo" width="96" height="96" alt="Harbor Club anchor logo">
  <h1>Join the Harbor Club</h1>
  <img src="wave.svg" class="divider" width="512" height="12" alt="">

  <form action="/signup" method="post" id="signup-form">
    <div class="row"><label for="fullname">Full name</label> <input type="text" name="fullname" id="full-name"></div>
    <div class="row"><label for="email">Email</label> <input type="email" name="email" id="email" placeholder="you@example.test"></div>
    <div class="row"><label for="password">Password</label> <input type="password" name="password" id="password"></div>
    <div class="row"><label for="country">Country</label>
      <select name="country" id="country">
        <option value="pl">Poland</option>
        <option value="no">Norway</option>
        <option value="nz">New Zealand</option>
      </select>
    </div>
    <fieldset class="row">
      <legend>Membership</legend>
      <input type="radio" name="plan" value="free" id="plan-free" checked> <label for="plan-free">Free</label>
      <input type="radio" name="plan" value="paid" id="plan-paid"> <label for="plan-paid">Paid</label>
    </fieldset>
    <div class="row"><label for="notes">Notes</label> <textarea name="notes" id="notes" rows="3"></textarea></div>
    <div class="row"><input type="checkbox" name="terms" value="yes" id="terms"> <label for="terms">I agree to the club rules</label></div>
    <input type="hidden" name="token" value="c0ffee">
    <button type="submit">Join the club</button>
    <button type="reset" id="reset-btn">Clear form</button>
  </form>
</body>
</html>
