name: "plan-exec-user-email"
description: "A planner writes the plan, a coder carries it out without leaving it."
on_failure: stop
max_minutes: 30
agents:
  - name: planner
    mode: plan
    max_iterations: 20
    task: >
      This is a small user service in app/. The tests in tests/test_api.py describe a new required email field that must contain @. Plan the change; tests/ must not be edited. Do not edit any file. Answer with the plan as a numbered list (1., 2., ...), one step per item, in the order the work must be done, naming in every step the exact files it changes. Name only files that exist, or new files in the places the task allows.
  - name: coder
    mode: agent
    depends_on: [planner]
    max_iterations: 30
    task: >
      Carry out the planner's plan, step by step. Change only the files the plan names. Do not edit anything under tests/. The work is done when `python -m unittest discover -s tests` passes.
