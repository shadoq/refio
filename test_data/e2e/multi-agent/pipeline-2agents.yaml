name: "Implement Calc.add"
description: "An analyst plans the change, then a coder implements it (depends on the analyst)."
agents:
  - name: analyst
    mode: plan
    task: >
      Read src/Calc.kt and write a short plan describing how Calc.add should be implemented so it
      returns the sum of its two arguments a and b. Do not edit any files - produce only the plan.
  - name: coder
    mode: agent
    depends_on: [analyst]
    task: >
      Implement Calc.add in src/Calc.kt so it returns the sum of a and b, replacing the TODO stub.
      Keep the rest of the file (including main) intact so the project still compiles and runs.
