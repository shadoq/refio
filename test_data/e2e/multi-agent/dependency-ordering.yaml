name: "Ordered pipeline for Mult.multiply"
description: "Three agents in a dependency chain: analyze -> implement -> document."
agents:
  - name: analyze
    mode: plan
    task: >
      Read src/Mult.kt and write a one-paragraph plan for implementing Mult.multiply to return the
      product of a and b. Do not edit any files.
  - name: implement
    mode: agent
    depends_on: [analyze]
    task: >
      Implement Mult.multiply in src/Mult.kt so it returns the product of a and b, replacing the TODO.
  - name: document
    mode: agent
    depends_on: [implement]
    task: >
      Add a one-line KDoc comment directly above the multiply function in src/Mult.kt describing what
      it returns. Do not change the implementation.
