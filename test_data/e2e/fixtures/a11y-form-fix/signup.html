<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Join the Harbor Club</title>
  <style>
    body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; }
    .row { margin: 0.75rem 0; }
    .divider { display: block; width: 100%; height: 12px; }
  </style>
</head>
<body>
  <img src="logo.png" id="logo" width="96" height="96">
  <h1>Join the Harbor Club</h1>
  <img src="wave.svg" class="divider" width="512" height="12">

  <form action="/signup" method="post" id="signup-form">
    <div class="row">Full name <input type="text" name="fullname" id="fullname"></div>
    <div class="row">Email <input type="email" name="email" id="email" placeholder="you@example.test"></div>
    <div class="row"><span>Password</span> <input type="password" name="password" id="password"></div>
    <div class="row">Country
      <select name="country" id="country">
        <option value="pl">Poland</option>
        <option value="no">Norway</option>
        <option value="nz">New Zealand</option>
      </select>
    </div>
    <div class="row">
      Membership:
      <input type="radio" name="plan" value="free" id="plan-free" checked> Free
      <input type="radio" name="plan" value="paid" id="plan-paid"> Paid
    </div>
    <div class="row">Notes <textarea name="notes" id="notes" rows="3"></textarea></div>
    <div class="row"><input type="checkbox" name="terms" value="yes"> I agree to the club rules</div>
    <input type="hidden" name="token" value="c0ffee">
    <button>Join the club</button>
    <button id="reset-btn">Clear form</button>
  </form>
</body>
</html>
