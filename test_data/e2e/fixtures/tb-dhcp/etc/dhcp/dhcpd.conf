# dhcpd.conf - site "northgate", ISC dhcpd 4.4
# Managed by the network team. The quarterly inventory task is described in
# docs/network.md.

option domain-name "northgate.internal";
option domain-name-servers 10.20.0.2, 10.20.0.3;
default-lease-time 600;
max-lease-time 7200;
authoritative;

# A host that left last year, kept for reference only:
# host old-laptop-99 {
#     hardware ethernet 00:11:22:33:99:99;
#     fixed-address 10.20.1.99;
#     fixed-prefix6 2001:db8:cafe:1099::/64;
# }

# Static reservations: two printers, two gate terminals, a roof sensor, the
# door controller and the storage NAS. Every reservation also hands out one
# delegated IPv6 prefix over DHCPv6.

host prn-lab-01 {
    hardware ethernet 00:11:22:33:44:01;
    fixed-address 10.20.1.11;
    fixed-prefix6 2001:db8:cafe:1001::/64;
}

host prn-lab-02 {
    hardware ethernet 00:11:22:33:44:02;
    fixed-address 10.20.1.12;
    fixed-prefix6 2001:db8:cafe:1002::/64;
}

host term-gate-01 {
    hardware ethernet 00:11:22:33:44:03;
    fixed-address 10.20.1.21;
    fixed-prefix6 2001:db8:cafe:1003::/64;
}

host term-gate-02 {
    hardware ethernet 00:11:22:33:44:04;
    fixed-address 10.20.1.22;
    fixed-prefix6 2001:db8:cafe:1004::/64;
}

host sensor-roof-01 {
    hardware ethernet 00:11:22:33:44:05;
    fixed-address 10.20.1.31;
    fixed-prefix6 2001:db8:cafe:1005::/64;
}

host door-ctrl-01 {
    hardware ethernet 00:11:22:33:44:06;
    fixed-address 10.20.1.41;
    fixed-prefix6 2001:db8:cafe:1006::/64;
}

host nas-01 {
    hardware ethernet 00:11:22:33:44:07;
    fixed-address 10.20.1.51;
    fixed-prefix6 2001:db8:cafe:1007::/64;
}

# The lab wing gets dynamic IPv4 addresses from this pool.
group {
    subnet 10.20.0.0 netmask 255.255.255.0 {
        option routers 10.20.0.1;
        range 10.20.0.100 10.20.0.180;
    }
}

# Guest devices land in a separate shared network with a smaller pool.
shared-network guest {
    subnet 10.20.8.0 netmask 255.255.255.0 {
        option routers 10.20.8.1;
        range 10.20.8.50 10.20.8.70;
    }
}

# Decommissioned overflow pool, commented out after the 2024 cleanup:
