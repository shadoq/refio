name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PYTHONHASHSEED is deliberately left unset: hash randomization is on
      # by default and this library must not depend on it. See
      # docs/incident/FLAKY-77.md before you ever consider pinning it.
      - run: python3 -m unittest discover -s tests -v
