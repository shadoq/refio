<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Network Visualization</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070f;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
    }
    canvas {
        background: #101a3a;
        box-shadow: 0 0 30px #101a3a;
    }
    #gui {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
    }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<div id="gui"></div>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
(() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // ----- Parameters ---------------------------------------------------------
    const params = {
        neuronCount: 4,
        growthSpeed: 1.5,
        maxDepth: 5,
        splitChance: 0.35,
        curvature: 0.4,
        maxLength: 80,
        synapseDist: 30,
        synapseGlow: 0.8,
        pulseSpeed: 2,
        pulseFreq: 0.5,
        pulseBrightness: 1,
        backgroundColor: '#05070f',
        branchColor: '#00e5ff',
        accentColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a',
    };

    // ----- Data structures ----------------------------------------------------
    let neurons = [];
    let branches = [];   // flat list of all growing branches
    let synapses = [];   // {a:{x,y}, b:{x,y}, glowPhase}
    let pulses = [];     // {synapse, progress}
    let paused = false;
    let lastTime = 0;
    const synapseMap = new Set(); // to avoid duplicate synapses

    // ----- Utility functions --------------------------------------------------
    const rand = (a, b) => Math.random() * (b - a) + a;
    const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
    const keyFromPoints = (p, q) => `${p.x.toFixed(1)}_${p.y.toFixed(1)}_${q.x.toFixed(1)}_${q.y.toFixed(1)}`;

    // ----- Core simulation ----------------------------------------------------
    function init() {
        neurons = [];
        branches = [];
        synapses = [];
        pulses = [];
        synapseMap.clear();
        // generate seed neurons near centre
        for (let i = 0; i < params.neuronCount; i++) {
            const x = W / 2 + rand(-50, 50);
            const y = H / 2 + rand(-50, 50);
            const neuron = {x, y};
            neurons.push(neuron);
            // initial branch for each neuron
            const angle = rand(0, Math.PI * 2);
            const branch = createBranch({x, y}, angle, 0);
            branches.push(branch);
        }
    }

    function createBranch(start, angle, depth) {
        return {
            points: [ {x: start.x, y: start.y} ],
            angle,
            depth,
            targetLength: rand(30, params.maxLength),
            curLength: 0,
            finished: false,
            thickness: Math.max(0.5, 3 - depth * 0.4),
        };
    }

    function updateGrowth(dt) {
        const step = params.growthSpeed * dt;
        const newBranches = [];
        for (const br of branches) {
            if (br.finished) continue;
            // apply slight curvature
            br.angle += (Math.random() - 0.5) * params.curvature;
            // extend
            const last = br.points[br.points.length - 1];
            const dx = Math.cos(br.angle) * step;
            const dy = Math.sin(br.angle) * step;
            const nxt = {x: last.x + dx, y: last.y + dy};
            br.points.push(nxt);
            br.curLength += step;
            if (br.curLength >= br.targetLength) {
                br.finished = true;
                // possibly split
                if (br.depth < params.maxDepth && Math.random() < params.splitChance) {
                    const splits = Math.random() < 0.5 ? 1 : 2;
                    for (let i = 0; i < splits; i++) {
                        const newAngle = br.angle + (Math.random() - 0.5) * Math.PI * 0.8;
                        const child = createBranch(nxt, newAngle, br.depth + 1);
                        newBranches.push(child);
                    }
                }
            }
        }
        branches.push(...newBranches);
    }

    function detectSynapses() {
        const tips = branches.map(br => br.points[br.points.length - 1]);
        for (let i = 0; i < tips.length; i++) {
            for (let j = i + 1; j < tips.length; j++) {
                const a = tips[i], b = tips[j];
                if (dist(a, b) < params.synapseDist) {
                    const mapKey = keyFromPoints(a, b);
                    if (!synapseMap.has(mapKey)) {
                        synapseMap.add(mapKey);
                        synapses.push({a, b, glowPhase: 0});
                    }
                }
            }
        }
    }

    function updateSynapses(dt) {
        for (const s of synapses) {
            s.glowPhase += dt * 0.5;
        }
        // pulse generation
        for (const s of synapses) {
            if (Math.random() < params.pulseFreq * dt) {
                pulses.push({synapse: s, progress: 0});
            }
        }
    }

    function updatePulses(dt) {
        const toRemove = [];
        for (const p of pulses) {
            const d = dist(p.synapse.a, p.synapse.b);
            p.progress += (params.pulseSpeed * dt) / d;
            if (p.progress >= 1) toRemove.push(p);
        }
        for (const p of toRemove) {
            const idx = pulses.indexOf(p);
            if (idx > -1) pulses.splice(idx, 1);
        }
    }

    // ----- Rendering -----------------------------------------------------------
    function render() {
        // background
        ctx.fillStyle = params.backgroundColor;
        ctx.fillRect(0, 0, W, H);

        // optional faint grid (scanlines)
        ctx.save();
        ctx.globalAlpha = 0.02;
        ctx.strokeStyle = 'rgba(0,229,255,0.08)';
        for (let y = 0; y < H; y += 20) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }
        ctx.restore();

        // branches
        ctx.lineCap = 'round';
        for (const br of branches) {
            const col = br.depth === params.maxDepth ? params.accentColor : params.branchColor;
            ctx.strokeStyle = col;
            ctx.shadowBlur = 12;
            ctx.shadowColor = col;
            ctx.lineWidth = br.thickness;
            for (let i = 1; i < br.points.length; i++) {
                const p0 = br.points[i - 1];
                const p1 = br.points[i];
                const mx = (p0.x + p1.x) / 2;
                const my = (p0.y + p1.y) / 2;
                const offset = (Math.random() - 0.5) * params.curvature * 10;
                const cp = {x: mx + offset, y: my + offset};
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.quadraticCurveTo(cp.x, cp.y, p1.x, p1.y);
                ctx.stroke();
            }
        }

        // synapses
        for (const s of synapses) {
            const glow = Math.abs(Math.sin(s.glowPhase)) * params.synapseGlow;
            ctx.strokeStyle = params.synapseColor;
            ctx.shadowBlur = 20 * glow;
            ctx.shadowColor = params.synapseColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(s.a.x, s.a.y);
            ctx.lineTo(s.b.x, s.b.y);
            ctx.stroke();
        }

        // pulses
        for (const p of pulses) {
            const t = p.progress;
            const x = p.synapse.a.x + (p.synapse.b.x - p.synapse.a.x) * t;
            const y = p.synapse.a.y + (p.synapse.b.y - p.synapse.a.y) * t;
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = params.pulseColor;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ----- Main loop -----------------------------------------------------------
    function animate(time) {
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        if (!paused) {
            updateGrowth(dt);
            detectSynapses();
            updateSynapses(dt);
            updatePulses(dt);
        }
        render();
        requestAnimationFrame(animate);
    }

    // ----- GUI -----------------------------------------------------------------
    const gui = new dat.GUI({ autoPlace: false });
    document.getElementById('gui').appendChild(gui.domElement);

    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 3, 8, 1).name('Neuron Count');
    growthFolder.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
    growthFolder.add(params, 'maxDepth', 2, 8, 1).name('Max Depth');
    growthFolder.add(params, 'splitChance', 0, 1, 0.01).name('Split Chance');
    growthFolder.add(params, 'curvature', 0, 1, 0.01).name('Curvature');
    growthFolder.add(params, 'maxLength', 30, 150, 1).name('Max Length');
    growthFolder.open();

    const synapseFolder = gui.addFolder('Synapses');
    synapseFolder.add(params, 'synapseDist', 10, 80, 1).name('Distance Threshold');
    synapseFolder.add(params, 'synapseGlow', 0, 2, 0.01).name('Glow Strength');
    synapseFolder.open();

    const pulseFolder = gui.addFolder('Pulses');
    pulseFolder.add(params, 'pulseSpeed', 0.5, 5, 0.1).name('Pulse Speed');
    pulseFolder.add(params, 'pulseFreq', 0.1, 2, 0.01).name('Pulse Frequency');
    pulseFolder.add(params, 'pulseBrightness', 0.5, 2, 0.01).name('Pulse Brightness');
    pulseFolder.open();

    const visualFolder = gui.addFolder('Visuals');
    visualFolder.addColor(params, 'backgroundColor').name('Background');
    visualFolder.addColor(params, 'branchColor').name('Branch Color');
    visualFolder.addColor(params, 'accentColor').name('Accent Color');
    visualFolder.addColor(params, 'synapseColor').name('Synapse Color');
    visualFolder.addColor(params, 'pulseColor').name('Pulse Color');
    visualFolder.open();

    const actions = {
        regenerate: () => { init(); },
        clear: () => {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            synapseMap.clear();
        },
        pauseResume: () => { paused = !paused; },
    };
    gui.add(actions, 'regenerate').name('Regenerate Network');
    gui.add(actions, 'clear').name('Clear Canvas');
    gui.add(actions, 'pauseResume').name('Pause/Resume');

    // ----- Start ---------------------------------------------------------------
    init();
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
