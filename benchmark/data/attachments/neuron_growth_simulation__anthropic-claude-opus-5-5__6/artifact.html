<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Neuron Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070f;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 800px;
    height: 800px;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
  }
  /* dat.gui accent styling */
  .dg, .dg .property-name, .dg .title, .dg li.title {
    color: #ffd400 !important;
    font-family: monospace !important;
  }
  .dg .c .slider-fg { background: #ffd400 !important; }
  .dg .c .slider { background: #101a3a !important; }
  .dg .c input[type=text] { color: #ffd400 !important; background: #101a3a !important; }
  .dg .cr.number { border-left: 3px solid #ffd400 !important; }
  .dg .cr.function { border-left: 3px solid #ff2bd6 !important; }
  .dg .cr.color { border-left: 3px solid #00e5ff !important; }
  .dg.main .close-button { color: #ffd400 !important; background: #05070f !important; }
  .dg li.title { background: #0a0f22 url(data:image/gif;base64,R0lGODlhBQAFAJEAAP////Pz8////////yH5BAEAAAIALAAAAAAFAAUAAAIIlI+hKgFxoCgAOw==) 6px 10px no-repeat !important; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
// ===================== Setup =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const MAX_BRANCHES = 400;
const MAX_SYNAPSES = 150;
const MARGIN = 20;
const STEP = 2;
const BG_GLOW = '#101a3a';
const SCAN_COLOR = 'rgba(0, 229, 255, 0.08)';

const params = {
  neuronCount: 4,
  growthSpeed: 1,
  maxDepth: 5,
  splitChance: 0.03,
  curvature: 0.25,
  maxLength: 90,
  synapseDist: 14,
  synapseGlow: 18,
  pulseSpeed: 0.02,
  pulseFreq: 0.08,
  pulseBright: 1,
  bg: '#05070f',
  branch: '#00e5ff',
  accent: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  regenerate: () => regenerate(),
  clear: () => clearAll(),
  togglePause: () => togglePause()
};

let neurons = [];
let branches = [];
let byId = {};
let synapses = [];
let synKeys = new Set();
let links = new Set();
let pulses = [];
let nextId = 0;
let paused = false;
let scanOffset = 0;
let frame = 0;

function rand(a, b) { return a + Math.random() * (b - a); }

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// ===================== GUI setup =====================
const gui = new dat.GUI();
const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 3, 6, 1).name('neuron count').onFinishChange(() => regenerate());
fGrowth.add(params, 'growthSpeed', 0.2, 4).name('growth speed');
fGrowth.add(params, 'maxDepth', 1, 8, 1).name('max depth');
fGrowth.add(params, 'splitChance', 0, 0.15).name('split chance');
fGrowth.add(params, 'curvature', 0, 1).name('curvature');
fGrowth.add(params, 'maxLength', 20, 200).name('max length');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(params, 'synapseDist', 4, 40).name('distance');
fSyn.add(params, 'synapseGlow', 0, 40).name('glow strength');

const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.005, 0.08).name('pulse speed');
fPulse.add(params, 'pulseFreq', 0, 0.5).name('pulse frequency');
fPulse.add(params, 'pulseBright', 0.2, 2).name('pulse brightness');

const fVis = gui.addFolder('Visuals');
fVis.addColor(params, 'bg').name('background');
fVis.addColor(params, 'branch').name('branch');
fVis.addColor(params, 'accent').name('accent branch');
fVis.addColor(params, 'synapse').name('synapse');
fVis.addColor(params, 'pulse').name('pulse');

gui.add(params, 'regenerate').name('regenerate network');
gui.add(params, 'clear').name('clear canvas');
const pauseCtrl = gui.add(params, 'togglePause').name('pause animation');

function togglePause() {
  paused = !paused;
  pauseCtrl.name(paused ? 'resume animation' : 'pause animation');
}

// ===================== Neuron growth =====================
function makeBranch(neuron, parent, depth, x, y, angle, maxLen, width, accent, spawnIdx) {
  if (branches.length >= MAX_BRANCHES) return null;
  const b = {
    id: nextId++,
    neuron: neuron,
    parent: parent,
    depth: depth,
    pts: [{ x, y }],
    angle: angle,
    len: 0,
    maxLen: maxLen,
    width: width,
    accent: accent,
    growing: true,
    turn: 0,
    spawnIdx: spawnIdx,
    acc: 0
  };
  branches.push(b);
  byId[b.id] = b;
  return b;
}

function clearAll() {
  neurons = [];
  branches = [];
  byId = {};
  synapses = [];
  synKeys.clear();
  links.clear();
  pulses = [];
}

function regenerate() {
  clearAll();
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < params.neuronCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 120;
    const n = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, id: i };
    neurons.push(n);
    const roots = 3 + Math.floor(Math.random() * 3);
    const base = Math.random() * Math.PI * 2;
    for (let k = 0; k < roots; k++) {
      const ang = base + (k / roots) * Math.PI * 2 + rand(-0.3, 0.3);
      makeBranch(n.id, null, 0, n.x, n.y, ang,
        params.maxLength * rand(0.7, 1.1), rand(1.8, 2.8), Math.random() < 0.15, 0);
    }
  }
}

function stepBranch(b) {
  const c = params.curvature;
  b.turn = b.turn * 0.9 + (Math.random() - 0.5) * c * 0.05;
  b.angle += b.turn + (Math.random() - 0.5) * c * 0.5;
  const last = b.pts[b.pts.length - 1];
  const nx = last.x + Math.cos(b.angle) * STEP;
  const ny = last.y + Math.sin(b.angle) * STEP;
  if (nx < MARGIN || nx > W - MARGIN || ny < MARGIN || ny > H - MARGIN) {
    b.growing = false;
    return;
  }
  b.pts.push({ x: nx, y: ny });
  b.len += STEP;

  // occasional side branch
  if (b.depth < params.maxDepth && branches.length < MAX_BRANCHES && Math.random() < params.splitChance) {
    const side = Math.random() < 0.5 ? -1 : 1;
    makeBranch(b.neuron, b.id, b.depth + 1, nx, ny, b.angle + side * rand(0.5, 1.2),
      b.maxLen * 0.6, Math.max(0.5, b.width * 0.6), Math.random() < 0.3, b.pts.length - 1);
  }

  if (b.len >= b.maxLen) {
    b.growing = false;
    // fork into two children
    if (b.depth < params.maxDepth) {
      for (let s = -1; s <= 1; s += 2) {
        makeBranch(b.neuron, b.id, b.depth + 1, nx, ny, b.angle + s * rand(0.3, 0.7),
          params.maxLength * rand(0.6, 0.9) * Math.pow(0.85, b.depth + 1),
          Math.max(0.5, b.width * rand(0.72, 0.88)), Math.random() < 0.2, b.pts.length - 1);
      }
    }
  }
}

function updateGrowth() {
  const n = branches.length;
  for (let i = 0; i < n; i++) {
    const b = branches[i];
    if (!b.growing) continue;
    b.acc += params.growthSpeed;
    while (b.acc >= 1 && b.growing) {
      b.acc -= 1;
      stepBranch(b);
    }
    if (b.pts.length > 1) detectSynapse(b);
  }
}

function isGrowing() {
  for (let i = 0; i < branches.length; i++) if (branches[i].growing) return true;
  return false;
}

// ===================== Synapse detection =====================
function detectSynapse(b) {
  if (synapses.length >= MAX_SYNAPSES) return;
  const tip = b.pts[b.pts.length - 1];
  const d = params.synapseDist;
  const d2 = d * d;
  for (let i = 0; i < branches.length; i++) {
    const o = branches[i];
    if (o.neuron === b.neuron || o === b) continue;
    const key = Math.min(b.id, o.id) + '-' + Math.max(b.id, o.id);
    if (synKeys.has(key)) continue;
    const pts = o.pts;
    let hit = -1;
    const lastIdx = pts.length - 1;
    const lp = pts[lastIdx];
    let dx = lp.x - tip.x, dy = lp.y - tip.y;
    if (dx * dx + dy * dy < d2) hit = lastIdx;
    else {
      for (let j = 0; j < lastIdx; j += 4) {
        dx = pts[j].x - tip.x; dy = pts[j].y - tip.y;
        if (dx * dx + dy * dy < d2) { hit = j; break; }
      }
    }
    if (hit >= 0) {
      synKeys.add(key);
      const p = pts[hit];
      synapses.push({
        a: b, b: o, idxA: b.pts.length - 1, idxB: hit,
        x: (tip.x + p.x) / 2, y: (tip.y + p.y) / 2,
        phase: Math.random() * Math.PI * 2, flash: 0
      });
      const na = Math.min(b.neuron, o.neuron), nb = Math.max(b.neuron, o.neuron);
      links.add(na + '-' + nb);
      if (synapses.length >= MAX_SYNAPSES) return;
    }
  }
}

// ===================== Pulse animation =====================
function chainPoints(br, upto) {
  const segs = [];
  let cur = br;
  let end = upto == null ? cur.pts.length - 1 : upto;
  while (cur) {
    segs.unshift(cur.pts.slice(0, end + 1));
    end = cur.spawnIdx;
    cur = cur.parent != null ? byId[cur.parent] : null;
  }
  const out = [];
  for (const s of segs) for (const p of s) out.push(p);
  return out;
}

function spawnPulse() {
  if (branches.length === 0) return;
  let path, syn = null;
  if (synapses.length > 0) {
    syn = synapses[Math.floor(Math.random() * synapses.length)];
    const pa = chainPoints(syn.a, syn.idxA);
    const pb = chainPoints(syn.b, syn.idxB).reverse();
    if (Math.random() < 0.5) path = pa.concat(pb);
    else path = pb.reverse().concat(pa.reverse());
  } else {
    const b = branches[Math.floor(Math.random() * branches.length)];
    path = chainPoints(b);
  }
  if (path.length < 2) return;
  pulses.push({ path, t: 0, speed: params.pulseSpeed, syn, trail: [] });
}

function pulsePos(p) {
  const n = p.path.length - 1;
  const f = Math.min(p.t, 1) * n;
  const i = Math.floor(f);
  const k = f - i;
  const a = p.path[i], b = p.path[Math.min(i + 1, n)];
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
}

function updatePulses() {
  if (Math.random() < params.pulseFreq) spawnPulse();
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const norm = Math.min(2, Math.max(0.3, 80 / p.path.length));
    p.t += params.pulseSpeed * norm;
    const pos = pulsePos(p);
    p.trail.push(pos);
    if (p.trail.length > 6) p.trail.shift();
    if (p.t >= 1) {
      if (p.syn) p.syn.flash = 1;
      pulses.splice(i, 1);
    }
  }
  for (const s of synapses) s.flash *= 0.93;
}

// ===================== Rendering =====================
function drawBackground() {
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.fillStyle = params.bg;
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
  g.addColorStop(0, hexToRgba(BG_GLOW, 0.9));
  g.addColorStop(1, hexToRgba(BG_GLOW, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBranch(b) {
  const pts = b.pts;
  if (pts.length < 2) return;
  const col = b.accent ? params.accent : params.branch;
  ctx.strokeStyle = col;
  ctx.shadowColor = col;
  ctx.lineWidth = b.width;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2;
    const my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const l = pts[pts.length - 1];
  ctx.lineTo(l.x, l.y);
  ctx.stroke();
}

function drawNetwork() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 8;
  ctx.globalAlpha = 0.85;
  for (const b of branches) drawBranch(b);

  // somas
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 20;
  for (const n of neurons) {
    ctx.shadowColor = params.branch;
    ctx.fillStyle = params.branch;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // synapses
  const time = frame * 0.05;
  for (const s of synapses) {
    const r = 3 + Math.sin(time + s.phase) + s.flash * 3;
    ctx.shadowColor = params.synapse;
    ctx.shadowBlur = params.synapseGlow * (1 + s.flash);
    ctx.fillStyle = params.synapse;
    ctx.globalAlpha = 0.8 + 0.2 * s.flash;
    ctx.beginPath();
    ctx.arc(s.x, s.y, Math.max(1, r), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.6 + 0.4 * s.flash;
    ctx.beginPath();
    ctx.arc(s.x, s.y, Math.max(0.5, r * 0.35), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPulses() {
  const br = params.pulseBright;
  ctx.shadowColor = params.pulse;
  for (const p of pulses) {
    const tr = p.trail;
    // trail
    for (let i = 0; i < tr.length; i++) {
      const a = ((i + 1) / tr.length) * 0.6 * br;
      ctx.globalAlpha = Math.min(1, a);
      ctx.shadowBlur = 6;
      ctx.fillStyle = params.pulse;
      ctx.beginPath();
      ctx.arc(tr[i].x, tr[i].y, 1 + i * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    if (tr.length === 0) continue;
    const pos = tr[tr.length - 1];
    // core
    ctx.globalAlpha = Math.min(1, br);
    ctx.shadowBlur = 18 * br;
    ctx.fillStyle = params.pulse;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // jitter sparks
    ctx.strokeStyle = params.pulse;
    ctx.lineWidth = 1;
    ctx.shadowBlur = 6;
    ctx.globalAlpha = Math.min(1, 0.7 * br);
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const a = Math.random() * Math.PI * 2;
      const l = rand(3, 8);
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x + Math.cos(a) * l, pos.y + Math.sin(a) * l);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawOverlay() {
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  // scanlines
  ctx.fillStyle = SCAN_COLOR;
  scanOffset = (scanOffset + 0.3) % 3;
  for (let y = scanOffset; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  // noise
  for (let i = 0; i < 150; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,229,255,0.07)';
    ctx.fillRect(Math.random() * W, Math.random() * H, rand(1, 2), rand(1, 2));
  }
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawStatus() {
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#ffd400';
  ctx.fillStyle = '#ffd400';
  ctx.globalAlpha = 0.9;
  ctx.font = '12px monospace';
  const state = paused ? 'PAUSED' : (isGrowing() ? 'GROWING' : 'STABLE');
  ctx.fillText('BRANCHES: ' + branches.length + '/' + MAX_BRANCHES, 16, 24);
  ctx.fillText('SYNAPSES: ' + synapses.length, 16, 40);
  ctx.fillText('STATE: ' + state, 16, 56);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function loop() {
  if (!paused) {
    frame++;
    updateGrowth();
    updatePulses();
  }
  drawBackground();
  drawNetwork();
  drawPulses();
  drawOverlay();
  drawStatus();
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}

regenerate();
requestAnimationFrame(loop);
</script>
</body>
</html>
