<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 28px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Input area */
    .input-area {
      display: flex;
      align-items: center;
      padding: 20px 20px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .input-area input[type="text"] {
      flex: 1;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input[type="text"]:focus {
      border-color: #667eea;
    }

    .input-area input[type="text"]::placeholder {
      color: #bbb;
    }

    .btn-add {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    .btn-add:active {
      transform: scale(0.97);
    }

    /* Filter tabs */
    .filters {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 14px 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      letter-spacing: 0.03em;
    }

    .filter-btn:hover {
      background: #fafafa;
      color: #555;
    }

    .filter-btn.active {
      color: #667eea;
      border-bottom: 3px solid #667eea;
    }

    /* Todo list */
    .todo-list {
      list-style: none;
      min-height: 60px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f5f5f5;
      gap: 14px;
      transition: background 0.15s;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item:hover {
      background: #fafafa;
    }

    /* Custom checkbox */
    .todo-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #d0d0d0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .todo-checkbox:checked {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .todo-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 7px;
      height: 11px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      color: #e74c3c;
      background: #ffeaea;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #ccc;
      font-size: 0.95rem;
    }

    .empty-state .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 10px;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid #f0f0f0;
      font-size: 0.85rem;
      color: #aaa;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .btn-clear:hover {
      color: #e74c3c;
      background: #ffeaea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Todos</h1>
    <div class="card">
      <!-- Input -->
      <div class="input-area">
        <input type="text" id="todoInput" placeholder="What needs to be done?" maxlength="200" />
        <button class="btn-add" id="addBtn">Add</button>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- List -->
      <ul class="todo-list" id="todoList"></ul>

      <!-- Footer -->
      <div class="footer">
        <span id="itemsLeft">0 items left</span>
        <button class="btn-clear" id="clearCompleted">Clear Completed</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'todo_app_todos';

      // --- State ---
      let todos = [];
      let currentFilter = 'all';

      // --- DOM refs ---
      const input       = document.getElementById('todoInput');
      const addBtn      = document.getElementById('addBtn');
      const todoList    = document.getElementById('todoList');
      const filterBtns  = document.querySelectorAll('.filter-btn');
      const itemsLeft   = document.getElementById('itemsLeft');
      const clearBtn    = document.getElementById('clearCompleted');

      // --- Persistence ---
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          todos = raw ? JSON.parse(raw) : [];
        } catch (e) {
          todos = [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      // --- Helpers ---
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function getFiltered() {
        if (currentFilter === 'active')    return todos.filter(t => !t.completed);
        if (currentFilter === 'completed') return todos.filter(t => t.completed);
        return todos;
      }

      // --- Render ---
      function render() {
        const filtered = getFiltered();
        todoList.innerHTML = '';

        if (filtered.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          const messages = {
            all:       { icon: '📝', text: 'No todos yet. Add one above!' },
            active:    { icon: '🎉', text: 'No active todos!' },
            completed: { icon: '📭', text: 'No completed todos yet.' },
          };
          const m = messages[currentFilter];
          empty.innerHTML = `<span class="icon">${m.icon}</span>${m.text}`;
          todoList.appendChild(empty);
        } else {
          filtered.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'todo-item' + (todo.completed ? ' completed' : '');
            li.dataset.id = todo.id;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'todo-checkbox';
            checkbox.checked = todo.completed;
            checkbox.setAttribute('aria-label', 'Mark as complete');
            checkbox.addEventListener('change', () => toggleTodo(todo.id));

            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerHTML = '&times;';
            delBtn.setAttribute('aria-label', 'Delete todo');
            delBtn.addEventListener('click', () => deleteTodo(todo.id));

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(delBtn);
            todoList.appendChild(li);
          });
        }

        // Update footer
        const activeCount = todos.filter(t => !t.completed).length;
        itemsLeft.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;

        const hasCompleted = todos.some(t => t.completed);
        clearBtn.style.visibility = hasCompleted ? 'visible' : 'hidden';
      }

      // --- Actions ---
      function addTodo() {
        const text = input.value.trim();
        if (!text) return;
        todos.push({ id: generateId(), text, completed: false });
        input.value = '';
        save();
        render();
      }

      function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          save();
          render();
        }
      }

      function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        save();
        render();
      }

      function clearCompleted() {
        todos = todos.filter(t => !t.completed);
        save();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        render();
      }

      // --- Event listeners ---
      addBtn.addEventListener('click', addTodo);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addTodo();
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      clearBtn.addEventListener('click', clearCompleted);

      // --- Init ---
      load();
      render();
    })();
  </script>
</body>
</html>
