<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-screen {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            display: none;
        }

        .menu-screen.active {
            display: block;
        }

        h1 {
            margin-top: 0;
            font-size: 3em;
            color: #4CAF50;
            text-shadow: 2px 2px 4px #000;
        }

        h2 {
            color: #fff;
        }

        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
            width: 250px;
        }

        .btn:hover {
            background-color: #4CAF50;
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 1.5em;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        .p1-score { color: #4CAF50; }
        .p2-score { color: #2196F3; }

        #game-over-screen h1 {
            color: #f44336;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="900"></canvas>
        
        <div id="score-board">
            <div class="p1-score">P1 (Green): <span id="score1">0</span></div>
            <div class="p2-score">P2 (Blue): <span id="score2">0</span></div>
        </div>

        <div id="ui-layer">
            <!-- Start Menu -->
            <div id="start-menu" class="menu-screen active">
                <h1>SNAKE</h1>
                <p>Select Game Mode:</p>
                <button class="btn" onclick="startGame('human')">Human vs Human</button>
                <button class="btn" onclick="startGame('cpu-human')">CPU vs Human</button>
                <button class="btn" onclick="startGame('cpu')">CPU vs CPU</button>
                <div class="controls-hint">
                    P1: WASD | P2: Arrow Keys
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="menu-screen">
                <h1>GAME OVER</h1>
                <h2 id="winner-text"></h2>
                <p>Press 'R' to Restart</p>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 30;
        const TILE_COUNT = 30; // 900px / 30px = 30 tiles
        const GAME_SPEED = 120; // ms per tick

        // --- State ---
        let gameInterval;
        let isGameRunning = false;
        let gameMode = 'human'; // 'human', 'cpu-human', 'cpu'
        
        let snake1 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            color: '#4CAF50',
            score: 0,
            dead: false
        };

        let snake2 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            color: '#2196F3',
            score: 0,
            dead: false
        };

        let food = { x: 0, y: 0 };

        // --- Initialization ---
        function initGame() {
            // Reset Snakes
            snake1.body = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            snake1.dx = 1; snake1.dy = 0;
            snake1.nextDx = 1; snake1.nextDy = 0;
            snake1.score = 0;
            snake1.dead = false;

            snake2.body = [{x: 14, y: 10}, {x: 15, y: 10}, {x: 16, y: 10}];
            snake2.dx = -1; snake2.dy = 0;
            snake2.nextDx = -1; snake2.nextDy = 0;
            snake2.score = 0;
            snake2.dead = false;

            spawnFood();
            updateScoreBoard();
            
            // Hide menus
            document.getElementById('start-menu').classList.remove('active');
            document.getElementById('game-over-screen').classList.remove('active');
            
            isGameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function startGame(mode) {
            gameMode = mode;
            initGame();
        }

        // --- Core Game Loop ---
        function gameLoop() {
            if (!isGameRunning) return;

            // Handle CPU Logic if needed
            if (gameMode === 'cpu' || gameMode === 'cpu-human') {
                // Snake 2 is CPU in cpu-human, Snake 1 is CPU in cpu
                if (gameMode === 'cpu-human') {
                    cpuMove(snake2, snake1);
                } else if (gameMode === 'cpu') {
                    cpuMove(snake1, snake2);
                    cpuMove(snake2, snake1);
                }
            }

            // Update Directions from buffer
            snake1.dx = snake1.nextDx;
            snake1.dy = snake1.nextDy;
            snake2.dx = snake2.nextDx;
            snake2.dy = snake2.nextDy;

            moveSnake(snake1);
            moveSnake(snake2);

            checkCollisions();

            if (snake1.dead && snake2.dead) {
                endGame("Draw!");
            } else if (snake1.dead) {
                endGame("Player 2 Wins!");
            } else if (snake2.dead) {
                endGame("Player 1 Wins!");
            }

            draw();
        }

        function moveSnake(snake) {
            if (snake.dead) return;

            const head = { x: snake.body[0].x + snake.dx, y: snake.body[0].y + snake.dy };
            
            // Check Wall Collision immediately upon moving head
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                snake.dead = true;
                return;
            }

            snake.body.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreBoard();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollisions() {
            // Self Collision
            if (checkSelfCollision(snake1)) snake1.dead = true;
            if (checkSelfCollision(snake2)) snake2.dead = true;

            // Head-to-Head Collision
            const h1 = snake1.body[0];
            const h2 = snake2.body[0];
            if (h1.x === h2.x && h1.y === h2.y) {
                snake1.dead = true;
                snake2.dead = true;
            }

            // Snake 1 hits Snake 2 body
            if (!snake1.dead && checkBodyCollision(snake1, snake2)) snake1.dead = true;
            
            // Snake 2 hits Snake 1 body
            if (!snake2.dead && checkBodyCollision(snake2, snake1)) snake2.dead = true;
        }

        function checkSelfCollision(snake) {
            const head = snake.body[0];
            for (let i = 1; i < snake.body.length; i++) {
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                    return true;
                }
            }
            return false;
        }

        function checkBodyCollision(attacker, defender) {
            const head = attacker.body[0];
            for (let part of defender.body) {
                if (head.x === part.x && head.y === part.y) {
                    return true;
                }
            }
            return false;
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                
                valid = true;
                // Check if on snake1
                for (let part of snake1.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
                // Check if on snake2
                for (let part of snake2.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
            }
        }

        // --- AI Logic (BFS) ---
        function cpuMove(snake, opponent) {
            if (snake.dead) return;

            const head = snake.body[0];
            const target = food;
            
            // Build obstacle map
            const obstacles = new Set();
            snake.body.forEach(p => obstacles.add(`${p.x},${p.y}`));
            opponent.body.forEach(p => obstacles.add(`${p.x},${p.y}`));

            const path = bfs(head, target, obstacles);

            if (path && path.length > 0) {
                const nextMove = path[0];
                snake.nextDx = nextMove.x - head.x;
                snake.nextDy = nextMove.y - head.y;
            } else {
                // Fallback: Try any valid move to survive longer
                const moves = [
                    {dx: 0, dy: -1}, {dx: 0, dy: 1}, 
                    {dx: -1, dy: 0}, {dx: 1, dy: 0}
                ];
                
                // Shuffle moves to avoid predictable patterns when stuck
                moves.sort(() => Math.random() - 0.5);

                for (let move of moves) {
                    const nx = head.x + move.dx;
                    const ny = head.y + move.dy;
                    
                    // Check bounds
                    if (nx < 0 || nx >= TILE_COUNT || ny < 0 || ny >= TILE_COUNT) continue;
                    
                    // Check obstacles
                    if (obstacles.has(`${nx},${ny}`)) continue;
                    
                    // Check if it's a reverse move (suicide)
                    if (move.dx === -snake.dx && move.dy === -snake.dy) continue;

                    snake.nextDx = move.dx;
                    snake.nextDy = move.dy;
                    return;
                }
            }
        }

        function bfs(start, target, obstacles) {
            const queue = [{ pos: start, path: [] }];
            const visited = new Set();
            visited.add(`${start.x},${start.y}`);

            while (queue.length > 0) {
                const { pos, path } = queue.shift();

                if (pos.x === target.x && pos.y === target.y) {
                    return path;
                }

                const moves = [
                    {x: 0, y: -1}, {x: 0, y: 1}, 
                    {x: -1, y: 0}, {x: 1, y: 0}
                ];

                for (let move of moves) {
                    const nx = pos.x + move.x;
                    const ny = pos.y + move.y;
                    const key = `${nx},${ny}`;

                    if (nx >= 0 && nx < TILE_COUNT && ny >= 0 && ny < TILE_COUNT && 
                        !obstacles.has(key) && !visited.has(key)) {
                        
                        visited.add(key);
                        queue.push({
                            pos: {x: nx, y: ny},
                            path: [...path, {x: nx, y: ny}]
                        });
                    }
                }
            }
            return null;
        }

        // --- Rendering ---
        function draw() {
            // Clear background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle)
            ctx.strokeStyle = '#111';
            for(let i=0; i<TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i*GRID_SIZE, 0);
                ctx.lineTo(i*GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i*GRID_SIZE);
                ctx.lineTo(canvas.width, i*GRID_SIZE);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE/2, 
                food.y * GRID_SIZE + GRID_SIZE/2, 
                GRID_SIZE/2 - 2, 0, Math.PI*2
            );
            ctx.fill();

            // Draw Snake 1
            drawSnake(snake1);

            // Draw Snake 2
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            for (let i = 0; i < snake.body.length; i++) {
                const part = snake.body[i];
                // Slightly smaller than grid for visual separation
                ctx.fillRect(
                    part.x * GRID_SIZE + 1, 
                    part.y * GRID_SIZE + 1, 
                    GRID_SIZE - 2, 
                    GRID_SIZE - 2
                );
                
                // Draw eyes on head
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 4;
                    // Simple logic to place eyes based on direction could go here
                    // For now, just center dot
                    ctx.fillRect(
                        part.x * GRID_SIZE + GRID_SIZE/2 - eyeSize/2,
                        part.y * GRID_SIZE + GRID_SIZE/2 - eyeSize/2,
                        eyeSize, eyeSize
                    );
                    ctx.fillStyle = snake.color;
                }
            }
        }

        function updateScoreBoard() {
            document.getElementById('score1').innerText = snake1.score;
            document.getElementById('score2').innerText = snake2.score;
        }

        function endGame(message) {
            isGameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('winner-text').innerText = message;
            document.getElementById('game-over-screen').classList.add('active');
        }

        // --- Input Handling ---
        document.addEventListener('keydown', (e) => {
            // Restart
            if (e.key.toLowerCase() === 'r' && !isGameRunning) {
                initGame();
                return;
            }

            if (!isGameRunning) return;

            // Player 1 (WASD) - Only if not CPU
            if (gameMode !== 'cpu') {
                switch(e.key.toLowerCase()) {
                    case 'w':
                        if (snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = -1; }
                        break;
                    case 's':
                        if (snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = 1; }
                        break;
                    case 'a':
                        if (snake1.dx === 0) { snake1.nextDx = -1; snake1.nextDy = 0; }
                        break;
                    case 'd':
                        if (snake1.dx === 0) { snake1.nextDx = 1; snake1.nextDy = 0; }
                        break;
                }
            }

            // Player 2 (Arrows) - Only if Human vs Human
            if (gameMode === 'human') {
                switch(e.key) {
                    case 'ArrowUp':
                        if (snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = -1; }
                        break;
                    case 'ArrowDown':
                        if (snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = 1; }
                        break;
                    case 'ArrowLeft':
                        if (snake2.dx === 0) { snake2.nextDx = -1; snake2.nextDy = 0; }
                        break;
                    case 'ArrowRight':
                        if (snake2.dx === 0) { snake2.nextDx = 1; snake2.nextDy = 0; }
                        break;
                }
            }
        });

        // Initial Draw
        draw();

    </script>
</body>
</html>
