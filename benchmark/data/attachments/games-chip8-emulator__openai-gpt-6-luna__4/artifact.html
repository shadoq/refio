<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHIP-8 Emulator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141c31;
      --panel-light: #1b2740;
      --text: #e9efff;
      --muted: #9aa9c7;
      --accent: #7cf2c4;
      --accent-dark: #163e3a;
      --border: #2a3856;
      --danger: #ff8d9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 40px;
      background: radial-gradient(ellipse at top, #16203a 0, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      background: var(--panel-light);
      color: var(--text);
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      background: #243451;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 104px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #75819a;
      box-shadow: 0 0 0 4px #75819a22;
    }

    .status.running .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px #7cf2c488;
    }

    .status.sound .status-dot {
      background: #ffd166;
      box-shadow: 0 0 12px #ffd16688;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(310px, 0.8fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(145deg, #17213a, var(--panel));
      box-shadow: 0 18px 45px #0003;
    }

    .machine {
      padding: 20px;
    }

    .screen-wrap {
      padding: 14px;
      border: 1px solid #2d3a54;
      border-radius: 12px;
      background: #080d18;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 1;
      background: #091710;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #263c32;
      border-radius: 4px;
    }

    .screen-caption {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 12px;
    }

    .controls .primary {
      border-color: #3b8c75;
      background: var(--accent-dark);
      color: #c9ffeb;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px 14px;
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .settings label,
    .settings output {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .settings input {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }

    .rom-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin-top: 14px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-light);
      cursor: pointer;
    }

    .file-label:hover {
      border-color: var(--accent);
    }

    #romFile {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .rom-name {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message {
      min-height: 1.35em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    .message.error {
      color: var(--danger);
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .debugger,
    .keypad-panel {
      padding: 18px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    .debug-top {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 13px;
    }

    .debug-cell {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #10182a;
    }

    .debug-cell span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .debug-cell strong,
    .register,
    .stack-value,
    .instruction {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .registers {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .register {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      padding: 7px 8px;
      border: 1px solid #25334e;
      border-radius: 7px;
      background: #10182a;
      font-size: 0.82rem;
    }

    .register span:first-child {
      color: var(--muted);
    }

    .register.flag {
      border-color: #54806f;
      background: #142b29;
    }

    .debug-row {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #10182a;
    }

    .debug-row span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .instruction {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    .stack-value {
      color: #d7e1f8;
      overflow-wrap: anywhere;
      font-size: 0.82rem;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 300px;
      margin: 0 auto;
    }

    .key {
      min-height: 47px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .key.active {
      border-color: var(--accent);
      background: #1c4b43;
      color: #d9fff0;
      box-shadow: 0 0 12px #7cf2c433;
    }

    .keymap-note {
      margin: 12px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.82rem;
    }

    kbd {
      padding: 1px 5px;
      border: 1px solid #465571;
      border-radius: 4px;
      background: #10182a;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px 28px;
      }

      header {
        align-items: start;
      }

      .side {
        grid-template-columns: 1fr;
      }

      .machine {
        padding: 14px;
      }

      .screen-wrap {
        padding: 8px;
      }

      .controls button {
        flex: 1 1 38%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>CHIP-8</h1>
        <p class="subtitle">A tiny virtual machine, ready to play.</p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Paused</span>
      </div>
    </header>

    <div class="layout">
      <section class="panel machine" aria-label="Emulator">
        <div class="screen-wrap">
          <canvas id="screen" width="64" height="32" aria-label="CHIP-8 display"></canvas>
          <div class="screen-caption">
            <span>64 × 32 display</span>
            <span id="soundStatus">Sound: off</span>
          </div>
        </div>

        <div class="controls" aria-label="Emulator controls">
          <button class="primary" id="runButton" type="button">Run</button>
          <button id="pauseButton" type="button">Pause</button>
          <button id="stepButton" type="button">Step</button>
          <button id="resetButton" type="button">Reset</button>
          <button id="demoButton" type="button">Load demo</button>
        </div>

        <div class="settings">
          <label for="speed">Instructions per frame</label>
          <output id="speedValue" for="speed">10</output>
          <input id="speed" type="range" min="1" max="1000" value="10">
        </div>

        <div class="rom-row">
          <label class="file-label" for="romFile">Load local ROM</label>
          <input id="romFile" type="file" accept=".ch8,.rom,.bin,application/octet-stream">
          <span class="rom-name" id="romName">Built-in demo</span>
        </div>
        <p class="message" id="message" aria-live="polite"></p>
      </section>

      <div class="side">
        <section class="panel debugger" aria-label="Debugger">
          <h2>Debugger</h2>
          <div class="debug-top">
            <div class="debug-cell"><span>Program counter</span><strong id="pcValue">0200</strong></div>
            <div class="debug-cell"><span>Index register</span><strong id="iValue">0000</strong></div>
            <div class="debug-cell"><span>Delay timer</span><strong id="delayValue">00</strong></div>
            <div class="debug-cell"><span>Sound timer</span><strong id="timerValue">00</strong></div>
          </div>
          <div class="registers" id="registers"></div>
          <div class="debug-row">
            <span>Current instruction</span>
            <div class="instruction" id="instructionValue">0200 · 6008 · LD V0, 0x08</div>
          </div>
          <div class="debug-row">
            <span>Call stack</span>
            <div class="stack-value" id="stackValue">Empty</div>
          </div>
        </section>

        <section class="panel keypad-panel" aria-label="Keypad">
          <h2>Keypad</h2>
          <div class="keypad" id="keypad"></div>
          <p class="keymap-note">
            Keyboard: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> /
            <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> /
            <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> /
            <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd>
          </p>
        </section>
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const ROM_BASE = 0x200;
      const MEMORY_SIZE = 4096;
      const DISPLAY_WIDTH = 64;
      const DISPLAY_HEIGHT = 32;
      const FONT_BASE = 0x050;
      const FONT = [
        0xF0, 0x90, 0x90, 0x90, 0xF0,
        0x20, 0x60, 0x20, 0x20, 0x70,
        0xF0, 0x10, 0xF0, 0x80, 0xF0,
        0xF0, 0x10, 0xF0, 0x10, 0xF0,
        0x90, 0x90, 0xF0, 0x10, 0x10,
        0xF0, 0x80, 0xF0, 0x10, 0xF0,
        0xF0, 0x80, 0xF0, 0x90, 0xF0,
        0xF0, 0x10, 0x20, 0x40, 0x40,
        0xF0, 0x90, 0xF0, 0x90, 0xF0,
        0xF0, 0x90, 0xF0, 0x10, 0xF0,
        0xF0, 0x90, 0xF0, 0x90, 0x90,
        0xE0, 0x90, 0xE0, 0x90, 0xE0,
        0xF0, 0x80, 0x80, 0x80, 0xF0,
        0xE0, 0x90, 0x90, 0x90, 0xE0,
        0xF0, 0x80, 0xF0, 0x80, 0xF0,
        0xF0, 0x80, 0xF0, 0x80, 0x80
      ];

      const DEMO_ROM = new Uint8Array([
        0x60, 0x08,
        0x61, 0x0C,
        0xA2, 0x10,
        0xD0, 0x15,
        0xF2, 0x0A,
        0x80, 0x24,
        0x00, 0xE0,
        0x12, 0x06,
        0x3C, 0x42, 0x81, 0x81, 0x7E
      ]);

      const KEY_MAP = {
        "1": 0x1, "2": 0x2, "3": 0x3, "4": 0xC,
        "q": 0x4, "w": 0x5, "e": 0x6, "r": 0xD,
        "a": 0x7, "s": 0x8, "d": 0x9, "f": 0xE,
        "z": 0xA, "x": 0x0, "c": 0xB, "v": 0xF
      };

      const elements = {
        canvas: document.getElementById("screen"),
        status: document.getElementById("status"),
        statusText: document.getElementById("statusText"),
        soundStatus: document.getElementById("soundStatus"),
        run: document.getElementById("runButton"),
        pause: document.getElementById("pauseButton"),
        step: document.getElementById("stepButton"),
        reset: document.getElementById("resetButton"),
        demo: document.getElementById("demoButton"),
        speed: document.getElementById("speed"),
        speedValue: document.getElementById("speedValue"),
        romFile: document.getElementById("romFile"),
        romName: document.getElementById("romName"),
        message: document.getElementById("message"),
        registers: document.getElementById("registers"),
        pc: document.getElementById("pcValue"),
        index: document.getElementById("iValue"),
        delay: document.getElementById("delayValue"),
        timer: document.getElementById("timerValue"),
        instruction: document.getElementById("instructionValue"),
        stack: document.getElementById("stackValue"),
        keypad: document.getElementById("keypad")
      };

      const context = elements.canvas.getContext("2d", { alpha: false });
      const image = context.createImageData(DISPLAY_WIDTH, DISPLAY_HEIGHT);
      const registers = [];
      const keyButtons = [];
      const pressedKeys = new Set();
      const keyQueue = [];

      let memory = new Uint8Array(MEMORY_SIZE);
      let v = new Uint8Array(16);
      let display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
      let stack = [];
      let i = 0;
      let pc = ROM_BASE;
      let delayTimer = 0;
      let soundTimer = 0;
      let running = false;
      let loadedRom = DEMO_ROM.slice();
      let loadedName = "Built-in demo";
      let timerAccumulator = 0;
      let lastFrameTime = 0;
      let animationId = 0;

      for (let register = 0; register < 16; register += 1) {
        const cell = document.createElement("div");
        cell.className = "register";
        cell.innerHTML = `<span>V${register.toString(16).toUpperCase()}</span><strong>00</strong>`;
        elements.registers.appendChild(cell);
        registers.push(cell);
      }

      const keyOrder = [
        [0x1, "1"], [0x2, "2"], [0x3, "3"], [0xC, "4"],
        [0x4, "Q"], [0x5, "W"], [0x6, "E"], [0xD, "R"],
        [0x7, "A"], [0x8, "S"], [0x9, "D"], [0xE, "F"],
        [0xA, "Z"], [0x0, "X"], [0xB, "C"], [0xF, "V"]
      ];

      keyOrder.forEach(([key, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "key";
        button.textContent = `${key.toString(16).toUpperCase()} · ${label}`;
        button.setAttribute("aria-label", `CHIP-8 key ${key.toString(16).toUpperCase()} (keyboard ${label})`);
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          setKey(key, true);
        });
        button.addEventListener("pointerup", () => setKey(key, false));
        button.addEventListener("pointercancel", () => setKey(key, false));
        button.addEventListener("lostpointercapture", () => setKey(key, false));
        elements.keypad.appendChild(button);
        keyButtons[key] = button;
      });

      function setMessage(text, error = false) {
        elements.message.textContent = text;
        elements.message.classList.toggle("error", error);
      }

      function updateStatus() {
        const soundActive = soundTimer > 0;
        elements.status.classList.toggle("running", running && !soundActive);
        elements.status.classList.toggle("sound", soundActive);
        elements.statusText.textContent = running ? "Running" : "Paused";
        elements.soundStatus.textContent = soundActive ? "Sound: active" : "Sound: off";
      }

      function setKey(key, down) {
        const wasDown = pressedKeys.has(key);
        if (down) {
          pressedKeys.add(key);
          if (!wasDown) {
            keyQueue.push(key);
          }
        } else {
          pressedKeys.delete(key);
        }
        if (keyButtons[key]) {
          keyButtons[key].classList.toggle("active", down);
          keyButtons[key].setAttribute("aria-pressed", String(down));
        }
      }

      function clearKeys() {
        Array.from(pressedKeys).forEach(key => setKey(key, false));
        keyQueue.length = 0;
      }

      function resetMachine() {
        running = false;
        memory = new Uint8Array(MEMORY_SIZE);
        memory.set(FONT, FONT_BASE);
        memory.set(loadedRom, ROM_BASE);
        v = new Uint8Array(16);
        display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
        stack = [];
        i = 0;
        pc = ROM_BASE;
        delayTimer = 0;
        soundTimer = 0;
        timerAccumulator = 0;
        clearKeys();
        setMessage(`${loadedName} ready.`);
        drawDisplay();
        updateDebugger();
        updateStatus();
      }

      function drawDisplay() {
        for (let pixel = 0; pixel < display.length; pixel += 1) {
          const offset = pixel * 4;
          if (display[pixel]) {
            image.data[offset] = 124;
            image.data[offset + 1] = 242;
            image.data[offset + 2] = 196;
          } else {
            image.data[offset] = 9;
            image.data[offset + 1] = 23;
            image.data[offset + 2] = 16;
          }
          image.data[offset + 3] = 255;
        }
        context.putImageData(image, 0, 0);
      }

      function byteAt(address) {
        if (!Number.isInteger(address) || address < 0 || address >= MEMORY_SIZE) {
          throw new Error(`Memory address out of bounds: ${hex(address, 3)}.`);
        }
        return memory[address];
      }

      function writeByte(address, value) {
        if (!Number.isInteger(address) || address < 0 || address >= MEMORY_SIZE) {
          throw new Error(`Memory address out of bounds: ${hex(address, 3)}.`);
        }
        memory[address] = value & 0xFF;
      }

      function hex(value, digits = 2) {
        return (value >>> 0).toString(16).toUpperCase().padStart(digits, "0");
      }

      function disassemble(opcode) {
        const nnn = opcode & 0x0FFF;
        const nn = opcode & 0x00FF;
        const n = opcode & 0x000F;
        const x = (opcode >> 8) & 0xF;
        const y = (opcode >> 4) & 0xF;
        const vx = `V${x.toString(16).toUpperCase()}`;
        const vy = `V${y.toString(16).toUpperCase()}`;

        switch (opcode & 0xF000) {
          case 0x0000:
            if (opcode === 0x00E0) return "CLS";
            if (opcode === 0x00EE) return "RET";
            if (opcode === 0x0000) return "NOP";
            return `SYS 0x${hex(nnn, 3)}`;
          case 0x1000: return `JP 0x${hex(nnn, 3)}`;
          case 0x2000: return `CALL 0x${hex(nnn, 3)}`;
          case 0x3000: return `SE ${vx}, 0x${hex(nn)}`;
          case 0x4000: return `SNE ${vx}, 0x${hex(nn)}`;
          case 0x5000: return n === 0 ? `SE ${vx}, ${vy}` : "INVALID";
          case 0x6000: return `LD ${vx}, 0x${hex(nn)}`;
          case 0x7000: return `ADD ${vx}, 0x${hex(nn)}`;
          case 0x8000:
            switch (n) {
              case 0x0: return `LD ${vx}, ${vy}`;
              case 0x1: return `OR ${vx}, ${vy}`;
              case 0x2: return `AND ${vx}, ${vy}`;
              case 0x3: return `XOR ${vx}, ${vy}`;
              case 0x4: return `ADD ${vx}, ${vy}`;
              case 0x5: return `SUB ${vx}, ${vy}`;
              case 0x6: return `SHR ${vx}`;
              case 0x7: return `SUBN ${vx}, ${vy}`;
              case 0xE: return `SHL ${vx}`;
              default: return "INVALID";
            }
          case 0x9000: return n === 0 ? `SNE ${vx}, ${vy}` : "INVALID";
          case 0xA000: return `LD I, 0x${hex(nnn, 3)}`;
          case 0xB000: return `JP V0, 0x${hex(nnn, 3)}`;
          case 0xC000: return `RND ${vx}, 0x${hex(nn)}`;
          case 0xD000: return `DRW ${vx}, ${vy}, 0x${hex(n)}`;
          case 0xE000:
            if (nn === 0x9E) return `SKP ${vx}`;
            if (nn === 0xA1) return `SKNP ${vx}`;
            return "INVALID";
          case 0xF000:
            switch (nn) {
              case 0x07: return `LD ${vx}, DT`;
              case 0x0A: return `LD ${vx}, K`;
              case 0x15: return `LD DT, ${vx}`;
              case 0x18: return `LD ST, ${vx}`;
              case 0x1E: return `ADD I, ${vx}`;
              case 0x29: return `LD F, ${vx}`;
              case 0x33: return `LD B, ${vx}`;
              case 0x55: return `LD [I], ${vx}`;
              case 0x65: return `LD ${vx}, [I]`;
              default: return "INVALID";
            }
          default: return "INVALID";
        }
      }

      function currentOpcode() {
        if (pc < 0 || pc + 1 >= MEMORY_SIZE) {
          return null;
        }
        return (memory[pc] << 8) | memory[pc + 1];
      }

      function updateDebugger() {
        elements.pc.textContent = hex(pc, 4);
        elements.index.textContent = hex(i, 4);
        elements.delay.textContent = hex(delayTimer);
        elements.timer.textContent = hex(soundTimer);
        registers.forEach((cell, register) => {
          cell.querySelector("strong").textContent = hex(v[register]);
          cell.classList.toggle("flag", register === 0xF);
        });
        elements.stack.textContent = stack.length
          ? stack.map((address, index) => `${index}: ${hex(address, 4)}`).join(" · ")
          : "Empty";

        const opcode = currentOpcode();
        elements.instruction.textContent = opcode === null
          ? `${hex(pc, 4)} · No instruction`
          : `${hex(pc, 4)} · ${hex(opcode, 4)} · ${disassemble(opcode)}`;
        updateStatus();
      }

      function validateTarget(address) {
        if (!Number.isInteger(address) || address < 0 || address > MEMORY_SIZE - 2) {
          throw new Error(`Program counter out of bounds: ${hex(address, 4)}.`);
        }
      }

      function executeInstruction() {
        validateTarget(pc);
        const opcode = (byteAt(pc) << 8) | byteAt(pc + 1);
        const nnn = opcode & 0x0FFF;
        const nn = opcode & 0x00FF;
        const n = opcode & 0x000F;
        const x = (opcode >> 8) & 0xF;
        const y = (opcode >> 4) & 0xF;
        const vx = v[x];
        const vy = v[y];
        pc += 2;

        switch (opcode & 0xF000) {
          case 0x0000:
            if (opcode === 0x00E0) {
              display.fill(0);
              drawDisplay();
            } else if (opcode === 0x00EE) {
              if (stack.length === 0) {
                throw new Error("Stack underflow on RET.");
              }
              pc = stack.pop();
            } else if (opcode !== 0x0000) {
              throw new Error(`Unsupported 0x0 instruction: ${hex(opcode, 4)}.`);
            }
            break;
          case 0x1000:
            pc = nnn;
            break;
          case 0x2000:
            if (stack.length >= 16) {
              throw new Error("Call stack overflow.");
            }
            stack.push(pc);
            pc = nnn;
            break;
          case 0x3000:
            if (vx === nn) pc += 2;
            break;
          case 0x4000:
            if (vx !== nn) pc += 2;
            break;
          case 0x5000:
            if (n !== 0) throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
            if (vx === vy) pc += 2;
            break;
          case 0x6000:
            v[x] = nn;
            break;
          case 0x7000:
            v[x] = (vx + nn) & 0xFF;
            break;
          case 0x8000:
            switch (n) {
              case 0x0: v[x] = vy; break;
              case 0x1: v[x] = vx | vy; break;
              case 0x2: v[x] = vx & vy; break;
              case 0x3: v[x] = vx ^ vy; break;
              case 0x4:
                v[x] = (vx + vy) & 0xFF;
                v[0xF] = vx + vy > 0xFF ? 1 : 0;
                break;
              case 0x5:
                v[x] = (vx - vy) & 0xFF;
                v[0xF] = vx >= vy ? 1 : 0;
                break;
              case 0x6:
                v[x] = vx >>> 1;
                v[0xF] = vx & 1;
                break;
              case 0x7:
                v[x] = (vy - vx) & 0xFF;
                v[0xF] = vy >= vx ? 1 : 0;
                break;
              case 0xE:
                v[x] = (vx << 1) & 0xFF;
                v[0xF] = (vx >> 7) & 1;
                break;
              default:
                throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
            }
            break;
          case 0x9000:
            if (n !== 0) throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
            if (vx !== vy) pc += 2;
            break;
          case 0xA000:
            i = nnn;
            break;
          case 0xB000:
            pc = nnn + v[0];
            break;
          case 0xC000:
            v[x] = Math.floor(Math.random() * 256) & nn;
            break;
          case 0xD000: {
            v[0xF] = 0;
            for (let row = 0; row < n; row += 1) {
              const sprite = byteAt(i + row);
              for (let bit = 0; bit < 8; bit += 1) {
                if ((sprite & (0x80 >> bit)) === 0) continue;
                const px = (vx + bit) % DISPLAY_WIDTH;
                const py = (vy + row) % DISPLAY_HEIGHT;
                const position = py * DISPLAY_WIDTH + px;
                if (display[position]) v[0xF] = 1;
                display[position] ^= 1;
              }
            }
            drawDisplay();
            break;
          }
          case 0xE000:
            if (nn === 0x9E) {
              if (pressedKeys.has(vx & 0xF)) pc += 2;
            } else if (nn === 0xA1) {
              if (!pressedKeys.has(vx & 0xF)) pc += 2;
            } else {
              throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
            }
            break;
          case 0xF000:
            switch (nn) {
              case 0x07:
                v[x] = delayTimer;
                break;
              case 0x0A: {
                const key = keyQueue.shift();
                if (key === undefined) {
                  pc -= 2;
                } else {
                  v[x] = key;
                }
                break;
              }
              case 0x15:
                delayTimer = vx;
                break;
              case 0x18:
                soundTimer = vx;
                break;
              case 0x1E:
                i = (i + vx) & 0xFFFF;
                break;
              case 0x29:
                i = FONT_BASE + ((vx & 0xF) * 5);
                break;
              case 0x33:
                writeByte(i, Math.floor(vx / 100));
                writeByte(i + 1, Math.floor((vx % 100) / 10));
                writeByte(i + 2, vx % 10);
                break;
              case 0x55:
                for (let register = 0; register <= x; register += 1) {
                  writeByte(i + register, v[register]);
                }
                break;
              case 0x65:
                for (let register = 0; register <= x; register += 1) {
                  v[register] = byteAt(i + register);
                }
                break;
              default:
                throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
            }
            break;
          default:
            throw new Error(`Invalid opcode: ${hex(opcode, 4)}.`);
        }

        validateTarget(pc);
      }

      function stopWithError(error) {
        running = false;
        setMessage(error.message || String(error), true);
        updateDebugger();
      }

      function runFrame(timestamp) {
        animationId = 0;
        if (!running) return;

        const elapsed = lastFrameTime ? Math.min(timestamp - lastFrameTime, 250) : 0;
        lastFrameTime = timestamp;
        timerAccumulator += elapsed;

        while (timerAccumulator >= 1000 / 60) {
          if (delayTimer > 0) delayTimer -= 1;
          if (soundTimer > 0) soundTimer -= 1;
          timerAccumulator -= 1000 / 60;
        }

        try {
          const batch = Number(elements.speed.value);
          for (let count = 0; count < batch && running; count += 1) {
            executeInstruction();
          }
        } catch (error) {
          stopWithError(error);
        }

        updateDebugger();
        if (running) {
          animationId = requestAnimationFrame(runFrame);
        }
      }

      function startRunning() {
        if (running) return;
        running = true;
        lastFrameTime = 0;
        updateStatus();
        animationId = requestAnimationFrame(runFrame);
      }

      function pauseRunning() {
        running = false;
        if (animationId) cancelAnimationFrame(animationId);
        animationId = 0;
        updateDebugger();
      }

      function loadRom(bytes, name) {
        if (bytes.length === 0) {
          setMessage("The selected ROM file is empty.", true);
          return;
        }
        if (bytes.length > MEMORY_SIZE - ROM_BASE) {
          setMessage(`ROM is too large (${bytes.length} bytes); maximum size is ${MEMORY_SIZE - ROM_BASE} bytes.`, true);
          return;
        }
        loadedRom = new Uint8Array(bytes);
        loadedName = name;
        elements.romName.textContent = name;
        resetMachine();
      }

      elements.run.addEventListener("click", startRunning);
      elements.pause.addEventListener("click", pauseRunning);
      elements.step.addEventListener("click", () => {
        pauseRunning();
        try {
          executeInstruction();
          setMessage("Executed one instruction.");
        } catch (error) {
          stopWithError(error);
        }
        updateDebugger();
      });
      elements.reset.addEventListener("click", resetMachine);
      elements.demo.addEventListener("click", () => {
        loadedRom = DEMO_ROM.slice();
        loadedName = "Built-in demo";
        elements.romName.textContent = loadedName;
        resetMachine();
      });
      elements.speed.addEventListener("input", () => {
        elements.speedValue.textContent = elements.speed.value;
      });
      elements.romFile.addEventListener("change", async event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          const bytes = new Uint8Array(await file.arrayBuffer());
          loadRom(bytes, file.name);
        } catch (error) {
          setMessage(`Could not load ROM: ${error.message || error}`, true);
        }
        event.target.value = "";
      });

      document.addEventListener("keydown", event => {
        const key = KEY_MAP[event.key.toLowerCase()];
        if (key === undefined) return;
        event.preventDefault();
        setKey(key, true);
      });

      document.addEventListener("keyup", event => {
        const key = KEY_MAP[event.key.toLowerCase()];
        if (key === undefined) return;
        event.preventDefault();
        setKey(key, false);
      });

      window.addEventListener("blur", clearKeys);

      resetMachine();
    })();
  </script>
</body>
</html>
