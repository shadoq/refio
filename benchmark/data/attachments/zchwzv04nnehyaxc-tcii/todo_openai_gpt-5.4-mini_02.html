<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-weak: #dbeafe;
      --danger: #dc2626;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .input-row {
      display: flex;
      gap: 12px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
    }

    .input-row input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .input-row button,
    .filters button,
    .todo button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    .input-row button {
      padding: 0 18px;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    .input-row button:hover,
    .filters button:hover,
    .todo button:hover {
      transform: translateY(-1px);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filters {
      display: inline-flex;
      gap: 8px;
      background: #f3f4f6;
      padding: 6px;
      border-radius: 14px;
    }

    .filters button {
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }

    .filters button.active {
      background: white;
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .stats {
      color: var(--muted);
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .todo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 28px;
      border-bottom: 1px solid #eef2f7;
    }

    .todo:last-child { border-bottom: none; }

    .todo input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: 0 0 auto;
    }

    .todo label {
      flex: 1;
      cursor: pointer;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo.completed label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      padding: 10px 12px;
      background: #fee2e2;
      color: var(--danger);
      font-weight: 700;
      flex: 0 0 auto;
    }

    .delete-btn:hover { background: #fecaca; }

    .empty {
      padding: 32px 28px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .input-row, .controls, .todo, header { padding-left: 18px; padding-right: 18px; }
      .input-row { flex-direction: column; }
      .input-row button { height: 48px; }
      .controls { align-items: stretch; }
      .filters { width: 100%; justify-content: space-between; }
      .filters button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Todo app">
    <header>
      <h1>Todo List</h1>
      <p class="subtitle">Add tasks, track progress, and keep everything saved locally.</p>
    </header>

    <form class="input-row" id="todoForm" autocomplete="off">
      <input id="todoInput" type="text" placeholder="What needs to be done?" aria-label="New todo" />
      <button type="submit">Add Todo</button>
    </form>

    <section class="controls" aria-label="Todo controls">
      <div class="filters" role="tablist" aria-label="Filter todos">
        <button type="button" class="active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="stats" id="stats">0 items</div>
    </section>

    <ul id="todoList" aria-live="polite" aria-label="Todo items"></ul>
    <div id="emptyState" class="empty">No todos yet. Add one above!</div>
  </main>

  <script>
    const STORAGE_KEY = 'todo_openai_gpt-5.4-mini_02';

    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const emptyState = document.getElementById('emptyState');
    const stats = document.getElementById('stats');
    const filterButtons = Array.from(document.querySelectorAll('.filters button'));

    let todos = loadTodos();
    let currentFilter = 'all';

    function loadTodos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(todo => !todo.completed);
      if (currentFilter === 'completed') return todos.filter(todo => todo.completed);
      return todos;
    }

    function updateStats() {
      const total = todos.length;
      const active = todos.filter(todo => !todo.completed).length;
      stats.textContent = total === 0 ? '0 items' : `${active} active, ${total - active} completed`;
    }

    function renderTodos() {
      todoList.innerHTML = '';
      const filtered = getFilteredTodos();
      emptyState.style.display = filtered.length ? 'none' : 'block';

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo${todo.completed ? ' completed' : ''}`;
        li.dataset.id = todo.id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'active' : 'completed'}`);
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const label = document.createElement('label');
        label.textContent = todo.text;
        label.addEventListener('click', () => toggleTodo(todo.id));

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.setAttribute('aria-label', `Delete ${todo.text}`);
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.append(checkbox, label, deleteBtn);
        todoList.appendChild(li);
      });

      updateStats();
    }

    function addTodo(text) {
      todos.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, completed: false });
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    todoForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      addTodo(text);
      todoInput.value = '';
      todoInput.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(btn => {
          const active = btn === button;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-pressed', String(active));
        });
        renderTodos();
      });
    });

    renderTodos();
  </script>
</body>
</html>
