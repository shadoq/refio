<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        /* Scanline effect overlay */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Vignette effect overlay */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                rgba(0,0,0,0) 60%,
                rgba(0,0,0,0.8) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        /* dat.gui overrides for neon theme */
        .dg.ac {
            z-index: 100 !important;
            font-family: 'Courier New', Courier, monospace !important;
        }
        .dg .cr.function .property-name {
            color: #00e5ff !important;
        }
        .dg .cr.function:hover .property-name {
            color: #d6ff00 !important;
        }
        .dg .cr.number input[type=text] {
            color: #fff36a !important;
            border: 1px solid #101a3a !important;
        }
        .dg .cr.color .picker {
            border: 1px solid #101a3a !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<div id="canvas-container">
    <canvas id="neuralCanvas" width="800" height="800"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
</div>

<script>
/**
 * NEURAL NETWORK SIMULATION
 * 
 * Architecture:
 * 1. Setup & Config
 * 2. GUI Setup
 * 3. Neuron & Branch Classes
 * 4. Synapse & Pulse Classes
 * 5. Simulation Logic (Growth, Connection, Animation)
 * 6. Rendering
 */

// --- 1. Setup & Config ---

const canvas = document.getElementById('neuralCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;

// Configuration Object for dat.gui
const params = {
    // Growth
    neuronCount: 4,
    growthSpeed: 2,
    maxDepth: 12,
    splitChance: 0.03,
    curvature: 0.5,
    maxBranchLength: 150,
    
    // Synapses
    synapseThreshold: 40,
    synapseGlow: 10,
    
    // Pulses
    pulseSpeed: 3,
    pulseFrequency: 0.02,
    pulseBrightness: 1.5,
    
    // Visuals
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    
    // Actions
    regenerate: () => initSimulation(),
    clear: () => clearCanvas(),
    pause: () => togglePause()
};

let isPaused = false;
let animationId;

// --- 2. GUI Setup ---

function setupGUI() {
    const gui = new dat.GUI();
    
    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
    fGrowth.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
    fGrowth.add(params, 'maxDepth', 5, 20, 1).name('Max Depth');
    fGrowth.add(params, 'splitChance', 0.0, 0.1, 0.001).name('Split Chance');
    fGrowth.add(params, 'curvature', 0.1, 1.0, 0.01).name('Curvature');
    fGrowth.add(params, 'maxBranchLength', 50, 300, 1).name('Max Length');
    fGrowth.open();

    const fSynapses = gui.addFolder('Synapses');
    fSynapses.add(params, 'synapseThreshold', 10, 100, 1).name('Distance Threshold');
    fSynapses.add(params, 'synapseGlow', 0, 30, 1).name('Glow Strength');
    fSynapses.open();

    const fPulses = gui.addFolder('Pulses');
    fPulses.add(params, 'pulseSpeed', 1, 10, 0.1).name('Pulse Speed');
    fPulses.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Frequency');
    fPulses.add(params, 'pulseBrightness', 0.5, 3.0, 0.1).name('Brightness');
    fPulses.open();

    const fVisuals = gui.addFolder('Visuals');
    fVisuals.addColor(params, 'bgColor').name('Background Color');
    fVisuals.addColor(params, 'branchColor').name('Main Branch Color');
    fVisuals.addColor(params, 'accentColor').name('Accent Color');
    fVisuals.addColor(params, 'synapseColor').name('Synapse Color');
    fVisuals.addColor(params, 'pulseColor').name('Pulse Color');
    fVisuals.open();

    const fActions = gui.addFolder('Actions');
    fActions.add(params, 'regenerate').name('Regenerate Network');
    fActions.add(params, 'clear').name('Clear Canvas');
    fActions.add(params, 'pause').name('Pause/Resume');
    fActions.open();
}

// --- 3. Neuron & Branch Classes ---

class Neuron {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.branches = [];
        this.growthProgress = 0; // 0 to 1
        this.isGrowing = true;
        this.color = params.branchColor;
    }

    startGrowth() {
        // Create initial trunk
        const angle = Math.random() * Math.PI * 2;
        const branch = new Branch(this.x, this.y, angle, 0, params.maxDepth);
        this.branches.push(branch);
    }

    update() {
        if (!this.isGrowing) return;

        let allFinished = true;
        this.branches.forEach(branch => {
            if (!branch.finished) {
                branch.update();
                allFinished = false;
            }
        });

        if (allFinished) {
            this.isGrowing = false;
        }
    }

    draw(ctx) {
        this.branches.forEach(branch => branch.draw(ctx));
        
        // Draw neuron body
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 15;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Branch {
    constructor(x, y, angle, depth, maxDepth) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.depth = depth;
        this.maxDepth = maxDepth;
        this.finished = false;
        this.segments = []; // Array of {x, y}
        this.currentLength = 0;
        this.maxLen = params.maxBranchLength * (1 - depth / maxDepth); // Shorter as depth increases
        this.thickness = Math.max(0.5, 3 - depth * 0.2);
        this.children = [];
        this.growthStep = params.growthSpeed;
        
        // Initial segment
        this.segments.push({x: x, y: y});
    }

    update() {
        if (this.finished) return;

        // Calculate next point based on angle and length
        const nextX = this.x + Math.cos(this.angle) * this.growthStep;
        const nextY = this.y + Math.sin(this.angle) * this.growthStep;

        this.segments.push({x: nextX, y: nextY});
        this.x = nextX;
        this.y = nextY;
        this.currentLength += this.growthStep;

        // Check if branch should stop growing
        if (this.currentLength >= this.maxLen || this.depth >= this.maxDepth) {
            this.finished = true;
            return;
        }

        // Randomly change angle (curvature)
        const curvatureChange = (Math.random() - 0.5) * params.curvature;
        this.angle += curvatureChange;

        // Chance to split
        if (Math.random() < params.splitChance) {
            const splitAngle = this.angle + (Math.random() > 0.5 ? 0.5 : -0.5) * (Math.PI / 3);
            const child = new Branch(this.x, this.y, splitAngle, this.depth + 1, this.maxDepth);
            this.children.push(child);
        }
    }

    draw(ctx) {
        if (this.segments.length < 2) return;

        ctx.beginPath();
        ctx.moveTo(this.segments[0].x, this.segments[0].y);
        
        // Draw smooth curve through segments
        for (let i = 1; i < this.segments.length - 1; i++) {
            const xc = (this.segments[i].x + this.segments[i+1].x) / 2;
            const yc = (this.segments[i].y + this.segments[i+1].y) / 2;
            ctx.quadraticCurveTo(this.segments[i].x, this.segments[i].y, xc, yc);
        }
        // Connect last point
        const last = this.segments[this.segments.length - 1];
        ctx.lineTo(last.x, last.y);

        ctx.strokeStyle = this.depth === 0 ? params.branchColor : params.accentColor;
        ctx.lineWidth = this.thickness;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 5;
        ctx.shadowColor = this.depth === 0 ? params.branchColor : params.accentColor;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw children
        this.children.forEach(child => child.draw(ctx));
    }

    getTip() {
        const last = this.segments[this.segments.length - 1];
        return {x: last.x, y: last.y};
    }
}

// --- 4. Synapse & Pulse Classes ---

class Synapse {
    constructor(branch1, branch2) {
        this.tip1 = branch1.getTip();
        this.tip2 = branch2.getTip();
        this.branch1 = branch1;
        this.branch2 = branch2;
        this.pulses = [];
        this.glowPhase = Math.random() * Math.PI * 2;
    }

    update() {
        // Update tips to follow growing branches
        this.tip1 = this.branch1.getTip();
        this.tip2 = this.branch2.getTip();
        this.glowPhase += 0.05;
    }

    draw(ctx) {
        const glowIntensity = (Math.sin(this.glowPhase) + 1) / 2 * params.synapseGlow;
        
        ctx.beginPath();
        ctx.moveTo(this.tip1.x, this.tip1.y);
        ctx.lineTo(this.tip2.x, this.tip2.y);
        
        ctx.strokeStyle = `rgba(255, 43, 214, ${0.3 + glowIntensity/20})`;
        ctx.lineWidth = 1;
        ctx.shadowBlur = glowIntensity;
        ctx.shadowColor = params.synapseColor;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw pulses
        this.pulses.forEach(pulse => pulse.updateAndDraw(ctx));
    }

    addPulse() {
        if (Math.random() < params.pulseFrequency) {
            const direction = Math.random() > 0.5 ? 1 : -1;
            this.pulses.push(new Pulse(this, direction));
        }
    }
}

class Pulse {
    constructor(synapse, direction) {
        this.synapse = synapse;
        this.direction = direction; // 1 or -1
        this.progress = direction === 1 ? 0 : 1;
        this.speed = params.pulseSpeed * 0.01;
        this.active = true;
    }

    updateAndDraw(ctx) {
        if (!this.active) return;

        this.progress += this.speed * this.direction;

        if (this.progress < 0 || this.progress > 1) {
            this.active = false;
            return;
        }

        const x = this.synapse.tip1.x + (this.synapse.tip2.x - this.synapse.tip1.x) * this.progress;
        const y = this.synapse.tip1.y + (this.synapse.tip2.y - this.synapse.tip1.y) * this.progress;

        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 10 * params.pulseBrightness;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// --- 5. Simulation Logic ---

let neurons = [];
let synapses = [];
let synapsePairs = new Set(); // To prevent duplicate synapses

function initSimulation() {
    clearCanvas();
    neurons = [];
    synapses = [];
    synapsePairs.clear();

    const centerX = width / 2;
    const centerY = height / 2;
    const spread = 100;

    for (let i = 0; i < params.neuronCount; i++) {
        const x = centerX + (Math.random() - 0.5) * spread;
        const y = centerY + (Math.random() - 0.5) * spread;
        const neuron = new Neuron(x, y);
        neuron.startGrowth();
        neurons.push(neuron);
    }
}

function clearCanvas() {
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0, 0, width, height);
}

function togglePause() {
    isPaused = !isPaused;
    if (!isPaused) {
        animate();
    }
}

function detectSynapses() {
    // Get all tips from all branches of all neurons
    const tips = [];
    neurons.forEach(neuron => {
        neuron.branches.forEach(branch => {
            if (branch.finished) {
                tips.push({branch, tip: branch.getTip()});
            }
        });
    });

    // Check distances
    for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
            const t1 = tips[i];
            const t2 = tips[j];
            
            // Don't connect branches from the same neuron
            if (t1.branch === t2.branch) continue;
            
            // Check if already connected
            const key1 = `${t1.branch.x},${t1.branch.y}-${t2.branch.x},${t2.branch.y}`;
            const key2 = `${t2.branch.x},${t2.branch.y}-${t1.branch.x},${t1.branch.y}`;
            if (synapsePairs.has(key1) || synapsePairs.has(key2)) continue;

            const dx = t1.tip.x - t2.tip.x;
            const dy = t1.tip.y - t2.tip.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < params.synapseThreshold) {
                const synapse = new Synapse(t1.branch, t2.branch);
                synapses.push(synapse);
                synapsePairs.add(key1);
            }
        }
    }
}

// --- 6. Rendering & Animation Loop ---

function animate() {
    if (isPaused) return;

    // Clear and redraw background
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0, 0, width, height);

    // Update and draw neurons
    neurons.forEach(neuron => {
        neuron.update();
        neuron.draw(ctx);
    });

    // Detect new synapses periodically
    if (Math.random() < 0.1) {
        detectSynapses();
    }

    // Update and draw synapses
    synapses.forEach(synapse => {
        synapse.update();
        synapse.addPulse();
        synapse.draw(ctx);
    });

    // Clean up inactive pulses
    synapses.forEach(synapse => {
        synapse.pulses = synapse.pulses.filter(p => p.active);
    });

    animationId = requestAnimationFrame(animate);
}

// --- Initialization ---

setupGUI();
initSimulation();
animate();

</script>
</body>
</html>
