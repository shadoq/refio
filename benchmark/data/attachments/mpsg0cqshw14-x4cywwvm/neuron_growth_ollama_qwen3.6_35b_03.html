<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        /* Scanline effect overlay */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Vignette effect overlay */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                rgba(0,0,0,0) 60%,
                rgba(0,0,0,0.8) 100%
            );
            pointer-events: none;
            z-index: 11;
        }

        /* dat.gui custom styling */
        .dg.ac {
            z-index: 20 !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
</div>

<script>
    // --- Configuration & State ---
    const config = {
        // Growth
        neuronCount: 4,
        growthSpeed: 2,
        maxDepth: 12,
        splitChance: 0.03,
        curvature: 0.5,
        maxBranchLength: 300,
        
        // Synapses
        synapseThreshold: 15,
        synapseGlow: 10,
        
        // Pulses
        pulseSpeed: 3,
        pulseFrequency: 0.02,
        pulseBrightness: 1.5,
        
        // Visuals
        bgColor: '#05070f',
        branchColor: '#00e5ff',
        accentColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a',
        
        // Actions
        regenerate: () => initSimulation(),
        clearCanvas: () => {
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            branches = [];
            synapses = [];
            pulses = [];
        },
        pauseResume: () => {
            isPaused = !isPaused;
            btnPauseResume.textContent = isPaused ? "Resume" : "Pause";
        }
    };

    let isPaused = false;
    let btnPauseResume = null;

    // --- Canvas Setup ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // --- Data Structures ---
    let branches = [];
    let synapses = [];
    let pulses = [];

    class Branch {
        constructor(x, y, angle, depth, parent = null) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.depth = depth;
            this.parent = parent;
            this.children = [];
            this.length = 0;
            this.maxLen = config.maxBranchLength * (1 - (depth / config.maxDepth) * 0.5);
            this.thickness = Math.max(0.5, (config.maxDepth - depth) * 0.8);
            this.isDead = false;
            this.targetX = x + Math.cos(angle) * 5;
            this.targetY = y + Math.sin(angle) * 5;
            this.color = depth % 2 === 0 ? config.branchColor : config.accentColor;
            this.glowColor = depth % 2 === 0 ? config.branchColor : config.accentColor;
        }

        update() {
            if (this.isDead) return;

            // Grow towards target
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > config.growthSpeed) {
                this.x += (dx / dist) * config.growthSpeed;
                this.y += (dy / dist) * config.growthSpeed;
                this.length += config.growthSpeed;
            } else {
                // Reached target, check for growth completion
                if (this.length >= this.maxLen) {
                    this.isDead = true;
                    // Chance to split
                    if (this.depth < config.maxDepth && Math.random() < config.splitChance) {
                        this.split();
                    }
                } else {
                    // Extend target slightly to continue growth
                    this.targetX += Math.cos(this.angle) * 5;
                    this.targetY += Math.sin(this.angle) * 5;
                }
            }
        }

        split() {
            const angle1 = this.angle + (Math.random() - 0.5) * config.curvature;
            const angle2 = this.angle - (Math.random() - 0.5) * config.curvature;
            
            const child1 = new Branch(this.x, this.y, angle1, this.depth + 1, this);
            const child2 = new Branch(this.x, this.y, angle2, this.depth + 1, this);
            
            this.children.push(child1, child2);
            branches.push(child1, child2);
        }

        draw(ctx) {
            if (this.isDead && this.children.length === 0) return;

            ctx.beginPath();
            ctx.moveTo(this.parent ? this.parent.x : this.x, this.parent ? this.parent.y : this.y);
            ctx.lineTo(this.x, this.y);
            
            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.thickness;
            ctx.lineCap = 'round';
            
            // Glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.glowColor;
            
            ctx.stroke();
            
            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }
    }

    class Synapse {
        constructor(branch1, branch2) {
            this.b1 = branch1;
            this.b2 = branch2;
            this.age = 0;
            this.maxAge = 200 + Math.random() * 100;
            this.active = true;
        }

        update() {
            this.age++;
            if (this.age > this.maxAge) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;

            const alpha = Math.sin((this.age / this.maxAge) * Math.PI) * 0.8;
            
            ctx.beginPath();
            ctx.moveTo(this.b1.x, this.b1.y);
            ctx.lineTo(this.b2.x, this.b2.y);
            
            ctx.strokeStyle = `rgba(255, 43, 214, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.shadowBlur = config.synapseGlow;
            ctx.shadowColor = config.synapseColor;
            
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw node at connection points
            const nodeSize = 2 + Math.sin(this.age * 0.1) * 1;
            ctx.fillStyle = config.synapseColor;
            ctx.beginPath();
            ctx.arc(this.b1.x, this.b1.y, nodeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.b2.x, this.b2.y, nodeSize, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = config.pulseSpeed * 0.01;
            this.direction = Math.random() > 0.5 ? 1 : -1;
            this.active = true;
        }

        update() {
            this.progress += this.speed * this.direction;
            if (this.progress > 1 || this.progress < 0) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;

            const x = this.synapse.b1.x + (this.synapse.b2.x - this.synapse.b1.x) * this.progress;
            const y = this.synapse.b1.y + (this.synapse.b2.y - this.synapse.b1.y) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 3 * config.pulseBrightness, 0, Math.PI * 2);
            ctx.fillStyle = config.pulseColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = config.pulseColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // --- Simulation Logic ---

    function initSimulation() {
        branches = [];
        synapses = [];
        pulses = [];
        
        const centerX = W / 2;
        const centerY = H / 2;
        const spread = 100;

        for (let i = 0; i < config.neuronCount; i++) {
            const x = centerX + (Math.random() - 0.5) * spread;
            const y = centerY + (Math.random() - 0.5) * spread;
            const angle = Math.random() * Math.PI * 2;
            
            const root = new Branch(x, y, angle, 0);
            branches.push(root);
        }
    }

    function checkSynapses() {
        // Check tips of branches for proximity
        const tips = branches.filter(b => b.isDead && b.children.length === 0);
        
        for (let i = 0; i < tips.length; i++) {
            for (let j = i + 1; j < tips.length; j++) {
                const b1 = tips[i];
                const b2 = tips[j];
                
                const dx = b1.x - b2.x;
                const dy = b1.y - b2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < config.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.b1 === b1 && s.b2 === b2) || 
                        (s.b1 === b2 && s.b2 === b1)
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(b1, b2));
                    }
                }
            }
        }
    }

    function spawnPulses() {
        if (Math.random() < config.pulseFrequency) {
            if (synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                if (randomSynapse.active) {
                    pulses.push(new Pulse(randomSynapse));
                }
            }
        }
    }

    function drawGrid() {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        
        for (let x = 0; x <= W; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        }
        
        for (let y = 0; y <= H; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }
    }

    function animate() {
        if (!isPaused) {
            // Clear canvas
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, W, H);
            
            // Draw grid
            drawGrid();
            
            // Update and draw branches
            branches.forEach(branch => {
                branch.update();
                branch.draw(ctx);
            });
            
            // Check for new synapses
            checkSynapses();
            
            // Update and draw synapses
            synapses = synapses.filter(s => s.active);
            synapses.forEach(synapse => {
                synapse.update();
                synapse.draw(ctx);
            });
            
            // Spawn and update pulses
            spawnPulses();
            pulses = pulses.filter(p => p.active);
            pulses.forEach(pulse => {
                pulse.update();
                pulse.draw(ctx);
            });
        }
        
        requestAnimationFrame(animate);
    }

    // --- Initialization ---

    function setupGUI() {
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
        growthFolder.add(config, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
        growthFolder.add(config, 'maxDepth', 5, 20, 1).name('Max Depth');
        growthFolder.add(config, 'splitChance', 0.01, 0.1, 0.001).name('Split Chance');
        growthFolder.add(config, 'curvature', 0.1, 1.5, 0.1).name('Curvature');
        growthFolder.add(config, 'maxBranchLength', 100, 500, 10).name('Max Length');
        growthFolder.open();
        
        const synapseFolder = gui.addFolder('Synapses');
        synapseFolder.add(config, 'synapseThreshold', 5, 50, 1).name('Distance Threshold');
        synapseFolder.add(config, 'synapseGlow', 0, 30, 1).name('Glow Strength');
        synapseFolder.open();
        
        const pulseFolder = gui.addFolder('Pulses');
        pulseFolder.add(config, 'pulseSpeed', 1, 10, 0.1).name('Speed');
        pulseFolder.add(config, 'pulseFrequency', 0.001, 0.1, 0.001).name('Frequency');
        pulseFolder.add(config, 'pulseBrightness', 0.5, 3, 0.1).name('Brightness');
        pulseFolder.open();
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'bgColor').name('Background').onChange(() => {
            document.body.style.backgroundColor = config.bgColor;
        });
        visualsFolder.addColor(config, 'branchColor').name('Branch Color');
        visualsFolder.addColor(config, 'accentColor').name('Accent Color');
        visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
        visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
        visualsFolder.open();
        
        const actionsFolder = gui.addFolder('Actions');
        actionsFolder.add(config, 'regenerate').name('Regenerate Network');
        actionsFolder.add(config, 'clearCanvas').name('Clear Canvas');
        
        // Pause/Resume button
        const pauseObj = { pauseResume: config.pauseResume };
        btnPauseResume = actionsFolder.add(pauseObj, 'pauseResume').name('Pause/Resume');
        actionsFolder.open();
    }

    // Start
    setupGUI();
    initSimulation();
    animate();

</script>
</body>
</html>
