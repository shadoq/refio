<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Bloom Simulation</title>
  <style>
    :root {
      --bg: #05070f;
      --glow: #101a3a;
      --grid: rgba(0, 229, 255, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "Space Grotesk", "Overpass", system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(16, 26, 58, 0.85), rgba(5, 7, 15, 1));
      z-index: -3;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 75% 10%, rgba(255, 212, 0, 0.15), transparent 60%);
      mix-blend-mode: screen;
      z-index: -2;
    }
    .scene {
      width: 840px;
      height: 840px;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 20%, rgba(16, 26, 58, 0.92), rgba(5, 7, 15, 0.95));
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 20px 60px rgba(5, 7, 15, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 212, 0, 0.2);
      pointer-events: none;
    }
    canvas {
      width: 800px;
      height: 800px;
      border-radius: 20px;
      background: #05070f;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(5, 7, 15, 0.8);
    }
    #guiContainer {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 10;
    }
    .dg {
      font-family: "Space Grotesk", "Overpass", system-ui, sans-serif;
    }
    .dg .folder {
      background: rgba(5, 7, 15, 0.8);
    }
    .dg.main {
      border-radius: 12px;
      background: rgba(5, 7, 15, 0.8);
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="neuralCanvas" width="800" height="800"></canvas>
    <div id="guiContainer"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
  <script>
    const canvas = document.getElementById("neuralCanvas");
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;

    const settings = {
      neuronCount: 4,
      growthSpeed: 2.4,
      maxDepth: 5,
      splitChance: 0.29,
      curvature: 0.13,
      maxBranchLength: 220,
      synapseThreshold: 32,
      synapseGlow: 18,
      pulseSpeed: 0.01,
      pulseFrequency: 0.028,
      pulseBrightness: 1,
      backgroundColor: "#05070f",
      branchColor: "#00e5ff",
      accentBranchColor: "#d6ff00",
      synapseColor: "#ff2bd6",
      pulseColor: "#fff36a",
    };

    let branches = [];
    let growingBranches = [];
    let synapses = [];
    let pulses = [];
    let synapseSet = new Set();
    let branchIdCounter = 0;
    let paused = false;
    let lastTime = 0;

    const actions = {
      regenerateNetwork: () => {
        resetNetwork();
      },
      clearCanvas: () => {
        branches = [];
        growingBranches = [];
        synapses = [];
        pulses = [];
        synapseSet.clear();
      },
      toggleAnimation: () => {
        paused = !paused;
      },
    };

    const gui = new dat.GUI({ autoPlace: false, width: 320 });
    document.getElementById("guiContainer").appendChild(gui.domElement);
    const growthFolder = gui.addFolder("Growth");
    growthFolder.add(settings, "neuronCount", 3, 6, 1).name("Neuron Count");
    growthFolder.add(settings, "growthSpeed", 0.6, 5.5, 0.1).name("Branch Growth Speed");
    growthFolder.add(settings, "maxDepth", 2, 7, 1).name("Max Branch Depth");
    growthFolder.add(settings, "splitChance", 0.05, 0.6, 0.01).name("Branch Split Chance");
    growthFolder.add(settings, "curvature", 0.01, 0.45, 0.01).name("Branch Curvature");
    growthFolder.add(settings, "maxBranchLength", 80, 320, 5).name("Max Branch Length");
    growthFolder.open();

    const synapseFolder = gui.addFolder("Synapses");
    synapseFolder.add(settings, "synapseThreshold", 16, 70, 2).name("Synapse Distance");
    synapseFolder.add(settings, "synapseGlow", 6, 40, 1).name("Synapse Glow Strength");
    synapseFolder.open();

    const pulseFolder = gui.addFolder("Pulses");
    pulseFolder.add(settings, "pulseSpeed", 0.002, 0.03, 0.001).name("Pulse Speed");
    pulseFolder.add(settings, "pulseFrequency", 0.005, 0.08, 0.002).name("Pulse Frequency");
    pulseFolder.add(settings, "pulseBrightness", 0.3, 1.4, 0.05).name("Pulse Brightness");
    pulseFolder.open();

    const visualsFolder = gui.addFolder("Visuals");
    visualsFolder.addColor(settings, "backgroundColor").name("Background Color").onChange(updateVisuals);
    visualsFolder.addColor(settings, "branchColor").name("Branch Color");
    visualsFolder.addColor(settings, "accentBranchColor").name("Accent Branch Color");
    visualsFolder.addColor(settings, "synapseColor").name("Synapse Color");
    visualsFolder.addColor(settings, "pulseColor").name("Pulse Color");
    visualsFolder.open();

    gui.add(actions, "regenerateNetwork").name("Regenerate Network");
    gui.add(actions, "clearCanvas").name("Clear Canvas");
    gui.add(actions, "toggleAnimation").name("Pause / Resume Animation");

    function updateVisuals() {
      document.body.style.background = settings.backgroundColor;
    }

    function resetNetwork() {
      branches = [];
      growingBranches = [];
      synapses = [];
      pulses = [];
      synapseSet.clear();
      branchIdCounter = 0;
      generateSeeds();
    }

    function generateSeeds() {
      const count = Math.max(3, Math.min(6, Math.round(settings.neuronCount)));
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 24 + Math.random() * 30;
        const x = width / 2 + Math.cos(angle) * radius * 0.6;
        const y = height / 2 + Math.sin(angle) * radius * 0.6;
        const branchAngle = Math.random() * Math.PI * 2;
        spawnBranch({ x, y }, branchAngle, 0, settings.branchColor);
        spawnBranch({ x, y }, branchAngle + (Math.random() - 0.5) * 0.8, 0, settings.accentBranchColor);
      }
    }

    function spawnBranch(origin, angle, depth, color) {
      if (branches.length > 520) return null;
      const branch = {
        id: branchIdCounter++,
        points: [{ x: origin.x, y: origin.y }],
        angle,
        depth,
        length: 0,
        color,
        thickness: 1.7 + depth * 0.4 + Math.random() * 0.8,
        alive: true,
      };
      branches.push(branch);
      growingBranches.push(branch);
      return branch;
    }

    function growBranches() {
      if (growingBranches.length === 0) return;
      const nextActive = [];
      for (const branch of growingBranches) {
        if (!branch.alive) continue;
        if (branch.length >= settings.maxBranchLength || branch.depth >= settings.maxDepth) {
          branch.alive = false;
          continue;
        }
        const last = branch.points[branch.points.length - 1];
        branch.angle += (Math.random() - 0.5) * settings.curvature * 1.8;
        const step = settings.growthSpeed + Math.random() * 0.6;
        const next = {
          x: Math.min(Math.max(last.x + Math.cos(branch.angle) * step, 0), width),
          y: Math.min(Math.max(last.y + Math.sin(branch.angle) * step, 0), height),
        };
        branch.points.push(next);
        branch.length += step;
        branch.thickness = 1 + branch.depth * 0.4 + Math.random() * 0.4;

        if (Math.random() < 0.02 && branch.depth < settings.maxDepth - 1) {
          spawnBranch(next, branch.angle + (Math.random() - 0.5) * 1.5, branch.depth + 1, settings.accentBranchColor);
        }
        if (Math.random() < settings.splitChance && branch.depth < settings.maxDepth - 1) {
          const offset = (Math.random() - 0.5) * Math.PI * 0.7;
          spawnBranch(next, branch.angle + offset, branch.depth + 1, settings.branchColor);
        }
        if (branch.length < settings.maxBranchLength) {
          nextActive.push(branch);
        } else {
          branch.alive = false;
        }
      }
      growingBranches = nextActive;
    }

    function detectSynapses() {
      const tips = branches
        .filter((branch) => branch.points.length > 1)
        .map((branch) => ({
          branch,
          point: branch.points[branch.points.length - 1],
        }));
      for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
          const a = tips[i];
          const b = tips[j];
          const dx = a.point.x - b.point.x;
          const dy = a.point.y - b.point.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < settings.synapseThreshold) {
            const key = a.branch.id < b.branch.id ? `${a.branch.id}-${b.branch.id}` : `${b.branch.id}-${a.branch.id}`;
            if (!synapseSet.has(key)) {
              synapseSet.add(key);
              synapses.push({
                a: a.branch,
                b: b.branch,
                phase: Math.random() * Math.PI * 2,
                key,
              });
            }
          }
        }
      }
    }

    function updatePulses(delta) {
      if (synapses.length && Math.random() < settings.pulseFrequency * delta * 60) {
        const syn = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push({
          synapse: syn,
          t: 0,
          direction: Math.random() < 0.5 ? 1 : -1,
        });
      }
      pulses = pulses.filter((pulse) => {
        pulse.t += settings.pulseSpeed * delta * 60;
        return pulse.t <= 1;
      });
    }

    function drawGrid() {
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
      for (let x = 0; x <= width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function hexToRgb(hex) {
      const trimmed = hex.replace("#", "");
      const bigint = parseInt(trimmed, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return { r, g, b };
    }

    function drawScene(time) {
      ctx.save();
      ctx.fillStyle = settings.backgroundColor;
      ctx.fillRect(0, 0, width, height);
      const glow = ctx.createRadialGradient(width / 2, height / 2, 60, width / 2, height / 2, 520);
      glow.addColorStop(0, "rgba(16, 26, 58, 0.85)");
      glow.addColorStop(1, "rgba(5, 7, 15, 1)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      drawGrid();
      ctx.restore();

      for (const branch of branches) {
        if (branch.points.length < 2) continue;
        ctx.save();
        ctx.strokeStyle = branch.color;
        ctx.lineWidth = branch.thickness;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowBlur = 12;
        ctx.shadowColor = branch.color;
        ctx.beginPath();
        const first = branch.points[0];
        ctx.moveTo(first.x, first.y);
        for (let i = 1; i < branch.points.length; i++) {
          const prev = branch.points[i - 1];
          const curr = branch.points[i];
          const midX = (prev.x + curr.x) / 2;
          const midY = (prev.y + curr.y) / 2;
          ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
        }
        const last = branch.points[branch.points.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
        ctx.restore();
      }

      const synapseRgb = hexToRgb(settings.synapseColor);
      ctx.lineWidth = 1.2;
      for (const syn of synapses) {
        const aPoint = syn.a.points[syn.a.points.length - 1];
        const bPoint = syn.b.points[syn.b.points.length - 1];
        if (!aPoint || !bPoint) continue;
        const midX = (aPoint.x + bPoint.x) / 2;
        const midY = (aPoint.y + bPoint.y) / 2;
        ctx.save();
        ctx.strokeStyle = settings.synapseColor;
        ctx.fillStyle = settings.synapseColor;
        ctx.shadowBlur = settings.synapseGlow;
        ctx.shadowColor = settings.synapseColor;
        ctx.globalAlpha = 0.5 + Math.sin(time * 1.5 + syn.phase) * 0.2;
        ctx.beginPath();
        ctx.moveTo(aPoint.x, aPoint.y);
        ctx.lineTo(bPoint.x, bPoint.y);
        ctx.stroke();
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        const radius = 4 + Math.abs(Math.sin(time * 1.7 + syn.phase)) * 3;
        ctx.arc(midX, midY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const pulseRgb = hexToRgb(settings.pulseColor);
      for (const pulse of pulses) {
        const aPoint = pulse.synapse.a.points[pulse.synapse.a.points.length - 1];
        const bPoint = pulse.synapse.b.points[pulse.synapse.b.points.length - 1];
        if (!aPoint || !bPoint) continue;
        const t = pulse.direction > 0 ? pulse.t : 1 - pulse.t;
        const x = aPoint.x + (bPoint.x - aPoint.x) * t;
        const y = aPoint.y + (bPoint.y - aPoint.y) * t;
        const alpha =
          Math.min(1, settings.pulseBrightness * (0.3 + 0.7 * (1 - Math.abs(0.5 - pulse.t) * 2)));
        ctx.save();
        ctx.fillStyle = `rgba(${pulseRgb.r}, ${pulseRgb.g}, ${pulseRgb.b}, ${alpha})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = settings.pulseColor;
        ctx.beginPath();
        ctx.arc(x, y, 5 + Math.sin(pulse.t * Math.PI) * 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function animate(time) {
      const delta = (time - lastTime) * 0.001;
      lastTime = time;
      if (!paused) {
        growBranches();
        detectSynapses();
        updatePulses(Math.max(delta, 0.016));
      }
      drawScene(time * 0.001);
      requestAnimationFrame(animate);
    }

    updateVisuals();
    resetNetwork();
    requestAnimationFrame((time) => {
      lastTime = time;
      animate(time);
    });
  </script>
</body>
</html>
