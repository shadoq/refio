<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .todo-app {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 2px 4px rgba(0,0,0,.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      text-align: center;
    }
    #new-todo {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    li .text {
      flex: 1;
      margin-left: 8px;
    }
    li.completed .text {
      text-decoration: line-through;
      color: #777;
    }
    button.delete {
      background: none;
      border: none;
      color: #c00;
      cursor: pointer;
      font-size: 16px;
    }
    .filters {
      margin-top: 10px;
      text-align: center;
    }
    .filters .filter {
      background: none;
      border: none;
      margin: 0 5px;
      cursor: pointer;
      padding: 5px 10px;
      font-size: 14px;
    }
    .filters .filter.active {
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="todo-app">
    <h1>Todo</h1>
    <input id="new-todo" placeholder="What needs to be done?" autocomplete="off">
    <ul id="todo-list"></ul>
    <div class="filters">
      <button data-filter="all" class="filter active">All</button>
      <button data-filter="active" class="filter">Active</button>
      <button data-filter="completed" class="filter">Completed</button>
    </div>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'todos-ollama-gpt-oss-120b-06';
      let todos = [];
      let filter = 'all';

      function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function loadTodos() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
          try {
            todos = JSON.parse(data);
          } catch (e) {
            todos = [];
          }
        }
      }

      function render() {
        const list = document.getElementById('todo-list');
        list.innerHTML = '';

        const filtered = todos.filter(t => {
          if (filter === 'all') return true;
          if (filter === 'active') return !t.completed;
          if (filter === 'completed') return t.completed;
        });

        filtered.forEach(t => {
          const li = document.createElement('li');
          li.dataset.id = t.id;
          li.className = t.completed ? 'completed' : '';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = t.completed;
          checkbox.addEventListener('change', () => toggleTodo(t.id));

          const span = document.createElement('span');
          span.className = 'text';
          span.textContent = t.text;

          const delBtn = document.createElement('button');
          delBtn.className = 'delete';
          delBtn.textContent = '✕';
          delBtn.addEventListener('click', () => deleteTodo(t.id));

          li.appendChild(checkbox);
          li.appendChild(span);
          li.appendChild(delBtn);
          list.appendChild(li);
        });

        // Update filter button active state
        document.querySelectorAll('.filters .filter').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
      }

      function addTodo(text) {
        const todo = {
          id: Date.now().toString(),
          text: text.trim(),
          completed: false
        };
        todos.push(todo);
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        }
      }

      function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        render();
      }

      // Add new todo on Enter
      document.getElementById('new-todo').addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          const val = e.target.value;
          if (val.trim()) {
            addTodo(val);
            e.target.value = '';
          }
        }
      });

      // Filter buttons
      document.querySelectorAll('.filters .filter').forEach(btn => {
        btn.addEventListener('click', () => {
          filter = btn.dataset.filter;
          render();
        });
      });

      // Initialize
      loadTodos();
      render();
    })();
  </script>
</body>
</html>
