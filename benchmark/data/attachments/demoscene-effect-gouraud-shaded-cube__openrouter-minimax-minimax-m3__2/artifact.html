<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gouraud-Shaded Rotating Cube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a14;
    overflow: hidden;
    font-family: monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Setup canvas and rendering context
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.floor(window.innerWidth * dpr);
    H = Math.floor(window.innerHeight * dpr);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------------
  // Cube geometry
  // 8 vertices of a unit cube centered at the origin.
  // Faces defined CCW when viewed from outside.
  // ---------------------------------------------------------------------------
  const vertices = [
    [-1, -1, -1], // 0
    [ 1, -1, -1], // 1
    [ 1,  1, -1], // 2
    [-1,  1, -1], // 3
    [-1, -1,  1], // 4
    [ 1, -1,  1], // 5
    [ 1,  1,  1], // 6
    [-1,  1,  1], // 7
  ];

  // Each face: 4 vertex indices in CCW order viewed from outside.
  const faces = [
    [0, 3, 2, 1], // back  (-z)
    [4, 5, 6, 7], // front (+z)
    [0, 4, 7, 3], // left  (-x)
    [1, 2, 6, 5], // right (+x)
    [3, 7, 6, 2], // top   (+y)
    [0, 1, 5, 4], // bottom(-y)
  ];

  // Face normals in object space (also useful for backface culling).
  const faceNormals = [
    [ 0,  0, -1],
    [ 0,  0,  1],
    [-1,  0,  0],
    [ 1,  0,  0],
    [ 0,  1,  0],
    [ 0, -1,  0],
  ];

  // Base colors per face (warm palette).
  const faceColors = [
    [220,  80,  80], // back
    [ 80, 200, 120], // front
    [ 80, 120, 220], // left
    [220, 200,  80], // right
    [200, 120, 220], // top
    [ 80, 220, 220], // bottom
  ];

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  let angleX = 0.4;
  let angleY = 0.6;
  let paused = false;
  let showWireframe = false;

  // Light orbits in the scene.
  let lightAngle = 0;

  // FPS tracking
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let fps = 0;

  // ---------------------------------------------------------------------------
  // 3D math helpers
  // ---------------------------------------------------------------------------

  // Multiply 3x3 rotation matrix R by 3-vector v -> new 3-vector.
  function matVec(R, v) {
    return [
      R[0]*v[0] + R[1]*v[1] + R[2]*v[2],
      R[3]*v[0] + R[4]*v[1] + R[5]*v[2],
      R[6]*v[0] + R[7]*v[1] + R[8]*v[2],
    ];
  }

  // Compose rotation matrices: Ry * Rx (applied as R * v, so Rx first then Ry).
  function buildRotation(ax, ay) {
    const cx = Math.cos(ax), sx = Math.sin(ax);
    const cy = Math.cos(ay), sy = Math.sin(ay);

    // Rotation around X
    const Rx = [
      1, 0,  0,
      0, cx, -sx,
      0, sx,  cx,
    ];
    // Rotation around Y
    const Ry = [
       cy, 0, sy,
        0, 1,  0,
      -sy, 0, cy,
    ];

    // Combined Ry * Rx as row-major 3x3
    return [
      Ry[0]*Rx[0] + Ry[1]*Rx[3] + Ry[2]*Rx[6],
      Ry[0]*Rx[1] + Ry[1]*Rx[4] + Ry[2]*Rx[7],
      Ry[0]*Rx[2] + Ry[1]*Rx[5] + Ry[2]*Rx[8],

      Ry[3]*Rx[0] + Ry[4]*Rx[3] + Ry[5]*Rx[6],
      Ry[3]*Rx[1] + Ry[4]*Rx[4] + Ry[5]*Rx[7],
      Ry[3]*Rx[2] + Ry[4]*Rx[5] + Ry[5]*Rx[8],

      Ry[6]*Rx[0] + Ry[7]*Rx[3] + Ry[8]*Rx[6],
      Ry[6]*Rx[1] + Ry[7]*Rx[4] + Ry[8]*Rx[7],
      Ry[6]*Rx[2] + Ry[7]*Rx[5] + Ry[8]*Rx[8],
    ];
  }

  // Perspective projection: takes a transformed point (after rotation) and
  // returns screen coordinates and z depth.
  function project(p, focal, cx, cy) {
    const z = p[2] + 6;          // push the cube away from the camera
    const inv = focal / z;
    return {
      x: p[0] * inv + cx,
      y: -p[1] * inv + cy,        // flip Y for screen space
      z: z,
    };
  }

  // ---------------------------------------------------------------------------
  // Triangle rasterization with per-pixel Gouraud color interpolation.
  //
  // For performance we do a scanline-based fill: for each row in the
  // triangle's bounding box we find the two edge intersections and linearly
  // interpolate the color across that horizontal span, drawing a 1px-tall
  // fillRect. Color components are passed as separate arrays for speed.
  // ---------------------------------------------------------------------------
  function drawGouraudTriangle(p0, p1, p2, c0, c1, c2) {
    // Bounding box (clipped to canvas).
    const minX = Math.max(0, Math.floor(Math.min(p0.x, p1.x, p2.x)));
    const maxX = Math.min(W - 1, Math.ceil (Math.max(p0.x, p1.x, p2.x)));
    const minY = Math.max(0, Math.floor(Math.min(p0.y, p1.y, p2.y)));
    const maxY = Math.min(H - 1, Math.ceil (Math.max(p0.y, p1.y, p2.y)));

    if (maxX < minX || maxY < minY) return;

    const px = 0.5; // sample at pixel center

    // Helper: barycentric coordinates for (x,y)
    function bary(x, y) {
      const v0x = p1.x - p0.x, v0y = p1.y - p0.y;
      const v1x = p2.x - p0.x, v1y = p2.y - p0.y;
      const v2x = x     - p0.x, v2y = y     - p0.y;
      const d00 = v0x*v0x + v0y*v0y;
      const d01 = v0x*v1x + v0y*v1y;
      const d11 = v1x*v1x + v1y*v1y;
      const d20 = v2x*v0x + v2y*v0y;
      const d21 = v2x*v1x + v2y*v1y;
      const denom = d00*d11 - d01*d01;
      if (denom === 0) return [-1, -1, -1];
      const v = (d11*d20 - d01*d21) / denom;
      const w = (d00*d21 - d01*d20) / denom;
      return [1 - v - w, v, w];
    }

    // Precompute integer-clamped per-vertex colors.
    const c0r = c0[0], c0g = c0[1], c0b = c0[2];
    const c1r = c1[0], c1g = c1[1], c1b = c1[2];
    const c2r = c2[0], c2g = c2[1], c2b = c2[2];

    for (let y = minY; y <= maxY; y++) {
      const yf = y + px;
      let xStart = -1, xEnd = -2;
      let cStart = [0,0,0], cEnd = [0,0,0];

      // For each row, walk the three edges to find the two intersections.
      const edges = [[p0, p1], [p1, p2], [p2, p0]];
      let xs = [], cs = [];
      for (let e = 0; e < 3; e++) {
        const a = edges[e][0], b = edges[e][1];
        if ((a.y <= yf && b.y > yf) || (b.y <= yf && a.y > yf)) {
          const t = (yf - a.y) / (b.y - a.y);
          xs.push(a.x + t * (b.x - a.x));
          // Interpolate color along the edge.
          cs.push([
            a.c[0] + t * (b.c[0] - a.c[0]),
            a.c[1] + t * (b.c[1] - a.c[1]),
            a.c[2] + t * (b.c[2] - a.c[2]),
          ]);
        }
      }

      if (xs.length < 2) continue;
      if (xs.length > 2) {
        // Sort by x.
        for (let i = 0; i < xs.length - 1; i++) {
          for (let j = i + 1; j < xs.length; j++) {
            if (xs[j] < xs[i]) {
              const tx = xs[i]; xs[i] = xs[j]; xs[j] = tx;
              const tc = cs[i]; cs[i] = cs[j]; cs[j] = tc;
            }
          }
        }
      }

      const leftX  = Math.max(minX, Math.ceil (xs[0]));
      const rightX = Math.min(maxX, Math.floor(xs[1]));
      if (rightX < leftX) continue;

      const invSpan = 1 / (xs[1] - xs[0] || 1);
      for (let x = leftX; x <= rightX; x++) {
        const t = (x - xs[0]) * invSpan;
        const r = (cs[0][0] + t * (cs[1][0] - cs[0][0])) | 0;
        const g = (cs[0][1] + t * (cs[1][1] - cs[0][1])) | 0;
        const b = (cs[0][2] + t * (cs[1][2] - cs[0][2])) | 0;
        // Per-pixel fill via ImageData would be faster, but fillRect keeps
        // the implementation simple and is plenty fast for a single cube.
        // We batch horizontal spans here to reduce fillStyle thrash.
        // To keep things minimal and readable, fill one pixel at a time.
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Wireframe overlay for a single face (two triangles = 6 line segments).
  // ---------------------------------------------------------------------------
  function drawWireframeTriangle(p0, p1, p2) {
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // Lighting: Lambert with ambient.
  // ---------------------------------------------------------------------------
  function shade(normal, light, base) {
    // Normalize
    const nLen = Math.hypot(normal[0], normal[1], normal[2]) || 1;
    const nx = normal[0] / nLen;
    const ny = normal[1] / nLen;
    const nz = normal[2] / nLen;

    // Light direction (from surface to light).
    const lLen = Math.hypot(light[0], light[1], light[2]) || 1;
    const lx = light[0] / lLen;
    const ly = light[1] / lLen;
    const lz = light[2] / lLen;

    const diff = Math.max(0, nx*lx + ny*ly + nz*lz);
    const ambient = 0.18;
    const i = ambient + diff * 0.95;

    return [
      Math.min(255, Math.max(0, (base[0] * i) | 0)),
      Math.min(255, Math.max(0, (base[1] * i) | 0)),
      Math.min(255, Math.max(0, (base[2] * i) | 0)),
    ];
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w') showWireframe = !showWireframe;
    if (k === 'p') paused = !paused;
  });

  // ---------------------------------------------------------------------------
  // Main render loop
  // ---------------------------------------------------------------------------
  function frame(now) {
    // Update timing
    const dt = now - lastFpsTime;
    frameCount++;
    if (dt >= 500) {
      fps = (frameCount * 1000) / dt;
      frameCount = 0;
      lastFpsTime = now;
    }

    // Update animation state
    if (!paused) {
      angleX += 0.012;
      angleY += 0.018;
      lightAngle += 0.02;
    }

    // Clear
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);

    // Build rotation matrix
    const R = buildRotation(angleX, angleY);

    // Camera at origin looking down -Z. Cube centered, transformed by R.
    const focal = Math.min(W, H) * 1.2;
    const cx = W / 2;
    const cy = H / 2;

    // Light position in world space (orbiting).
    const lightR = 4.5;
    const light = [
      lightR * Math.cos(lightAngle * 1.3),
      lightR * Math.sin(lightAngle * 0.9) * 0.7 + 1.5,
      lightR * Math.sin(lightAngle * 1.3),
    ];

    // Transform each vertex once.
    const transformed = new Array(8);
    for (let i = 0; i < 8; i++) {
      transformed[i] = matVec(R, vertices[i]);
    }

    // For each face, build two triangles in world space, light their
    // vertices, project, and cull backfaces. Then collect for sorting.
    const triangles = [];

    for (let f = 0; f < faces.length; f++) {
      const face = faces[f];
      const normalObj = faceNormals[f];

      // Transform normal by rotation (rotation matrices preserve normals
      // since they have no non-uniform scale).
      const normal = matVec(R, normalObj);

      // Camera looks toward -Z, so a face is visible if its normal points
      // toward the camera (positive Z component in camera space).
      if (normal[2] <= 0) continue; // backface cull

      const base = faceColors[f];

      // Triangulate face: (v0, v1, v2) and (v0, v2, v3)
      const triIdxs = [
        [face[0], face[1], face[2]],
        [face[0], face[2], face[3]],
      ];

      // Precompute per-vertex lit colors (Gouraud: one color per vertex).
      const litColors = face.map((vi) => shade(
        // Use face normal as a simple per-vertex normal (flat-shaded Gouraud
        // — gives crisp faceted look). For smoother shading, average vertex
        // normals across incident faces would be used here.
        normal,
        light,
        base
      ));

      for (const [a, b, c] of triIdxs) {
        const pa = transformed[a];
        const pb = transformed[b];
        const pc = transformed[c];

        const sa = project(pa, focal, cx, cy);
        const sb = project(pb, focal, cx, cy);
        const sc = project(pc, focal, cx, cy);

        sa.c = litColors[face.indexOf(a)];
        sb.c = litColors[face.indexOf(b)];
        sc.c = litColors[face.indexOf(c)];

        // Average z for painter's algorithm (use camera-space z from
        // transformed vertices, before projection adds the camera offset).
        const avgZ = (pa[2] + pb[2] + pc[2]) / 3;

        triangles.push({ p: [sa, sb, sc], z: avgZ });
      }
    }

    // Sort back-to-front (largest z is furthest from camera looking down -Z,
    // i.e. we draw far triangles first).
    triangles.sort((a, b) => b.z - a.z);

    // Draw filled triangles (Gouraud).
    for (const t of triangles) {
      drawGouraudTriangle(t.p[0], t.p[1], t.p[2],
                          t.p[0].c, t.p[1].c, t.p[2].c);
    }

    // Wireframe overlay.
    if (showWireframe) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      for (const t of triangles) {
        drawWireframeTriangle(t.p[0], t.p[1], t.p[2]);
      }
    }

    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.textBaseline = 'top';
    ctx.fillText('FPS: ' + fps.toFixed(1), 10, 10);
    ctx.fillText('W: wireframe (' + (showWireframe ? 'on' : 'off') + ')', 10, 28);
    ctx.fillText('P: pause (' + (paused ? 'paused' : 'running') + ')', 10, 46);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
