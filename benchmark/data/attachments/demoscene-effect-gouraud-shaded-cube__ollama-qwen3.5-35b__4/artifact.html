class Vertex {
    constructor(x, y, z) {
        this.x = x; // Local coordinates
        this.y = y;
        this.z = z;
        
        // Transformed properties (updated every frame)
        this.tx = 0; 
        this.ty = 0;
        this.nz = 0; // Normalized Z for depth sorting
        
        // Lighting properties
        this.color = { r: 0, g: 0, b: 0 };
    }

    clone() { return new Vertex(this.x, this.y, this.z); }
}

class Triangle {
    constructor(v1, v2, v3) {
        this.vertices = [v1, v2, v3]; // References to shared vertex objects
        
        // Face normal (calculated once from local geometry for backface culling logic relative to world space)
        const ax = v2.x - v1.x;
        const ay = v2.y - v1.y;
        const az = v2.z - v1.z;
        
        const bx = v3.x - v1.x;
        const by = v3.y - v1.y;
        const bz = v3.z - v1.z;

        // Cross product for normal (ax, ay, az) x (bx, by, bz)
        this.normalX = ay * bz - az * by;
        this.normalY = az * bx - ax * bz;
        this.normalZ = ax * by - ay * bx;
        
        // Normalize the local normal for lighting calculations later if needed, 
        // though we'll project it first.
    }

    getCentroid() {
        return (this.vertices[0].x + this.vertices[1].x + this.vertices[2].x) / 3;
    }
}

// --- Math & Pipeline Functions ---

function rotateX(v, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    return new Vertex(v.x, v.y * cos - v.z * sin, v.y * sin + v.z * cos);
}

function rotateY(v, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    return new Vertex(v.x * cos + v.z * sin, v.y, -v.x * sin + v.z * cos);
}

// Project 3D point to 2D screen coordinates
function project(p) {
    // Camera at (0,0,0), looking down Z axis? 
    // If we use standard perspective: x' = f*x/z.
    // We need object in front of camera (z > 0).
    // Our cube is centered at origin initially. Let's shift it to z=400 for visibility.
    
    const camZ = fov; 
    const dist = p.z + camZ; // Shift so Z>0
    
    if(dist <= 1) return null; // Behind camera or too close

    const scale = fov / dist;
    return {
        x: width/2 + p.x * scale,
        y: height/2 - p.y * scale, // Invert Y for screen coords (Y+ is up in math, down on canvas)
        z: dist
    };
}

        const lxDir = Math.cos(lightAngle);
        const lyDir = Math.sin(lightAngle);
        const lzDir = 1; 
        
        // Normalize light dir (approx)
        const len = Math.sqrt(lxDir*lxDir + lyDir*lyDir + lzDir*lzDir);
        
        let intensity = n.x * lxDir/len + n.y * lyDir/len + n.z * lzDir/len;
        if(intensity < 0) intensity = 0.1; // Ambient
        
        const baseColor = {r:255, g:255, b:255}; // White cube
        return {
            r: Math.min(255, (baseColor.r * intensity)),
            g: Math.min(255, (baseColor.g * intensity)),
            b: Math.min(255, (baseColor.b * intensity))
        };
    });
}

function getNormal(v1,v2,v3) {
    const ax = v2.x - v1.x;
    const ay = v2.y - v1.y;
    const az = v2.z - v1.z;
    
    const bx = v3.x - v1.x;
    const by = v3.y - v1.y;
    const bz = v3.z - v1.z;

    return {
        x: ay*bz - az*by,
        y: az*bx - ax*bz,
        z: ax*by - ay*bx
    };
}

// --- Rendering Loop ---

function draw() {
    if (isPaused) requestAnimationFrame(draw); // Keep loop alive but don't update
    
    const now = performance.now();
    
    // FPS Calculation
    frameCount++;
    if(now - fpsTimer >= 1000) {
        currentFPS = Math.round(frameCount * 1000 / (now - fpsTimer));
        frameCount = 0;
        fpsTimer = now;
        
        const lightPosWorldX = Math.cos(lightAngle) * 250;
        const lightPosWorldY = Math.sin(lightAngle) * 150;
    }

    // Update Light Angle (Orbiting around Z axis)
    if (!isPaused) {
        lightAngle += 0.01;
        
        // Rotate Cube slowly
        rotationX += 0.005;
        rotationY += 0.008;
    }

    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, width, height);

    const lightDir = { x: Math.cos(lightAngle), y: Math.sin(lightAngle), z: 2 }; // Fixed direction vector relative to world? 
                                                                                   // Actually let's make it a point light orbiting.
    
    // Prepare vertices for this frame (Transformed)
    const transformedVertices = [];

    faces.forEach(face => {
        face.vertices[0].tx = rotateX(rotateY(new Vertex(vertices[face.indices ? 0 : -1], ...), rotationY).x, rotationX); 
        // Wait, my Triangle class stores references to the original vertex objects.
        // I need to transform those objects in place or clone them?
        // Better: Transform a copy for projection and culling.
    });

    // Let's do it properly: Clone vertices -> Rotate -> Project
    
    const projectedFaces = [];

    faces.forEach(face => {
        const v1 = face.vertices[0];
        const v2 = face.vertices[1];
        const v3 = face.vertices[2];

        // Transform local coordinates to world space (Rotate)
        let p1 = rotateX(rotateY(v1, rotationY), rotationX);
        let p2 = rotateX(rotateY(v2, rotationY), rotationX);
        let p3 = rotateX(rotateY(v3, rotationY), rotationX);

        // Backface Culling: Calculate normal in world space (or use precomputed local normal rotated)
        const n1x = v2.x - v1.x; const n1y = v2.y - v1.y; const n1z = v2.z - v1.z;
        const n2x = v3.x - v1.x; const n2y = v3.y - v1.y; const n2z = v3.z - v1.z;

        // Cross product of local edges (before rotation) gives normal in object space.
        // Rotate this normal to world space? Or just use the fact that we rotated vertices, so cross product of transformed vectors works too.
        
        let nx = n2y * n1z - n2z * n1y; 
        let ny = n2z * n1x - n2x * n1z;
        let nz = n2x * n1y - n2y * n1x;

        // Rotate normal vector (simplified: rotate components same as vertices)
        const nxRotatedX = nx, nyRotatedY = ny, nzRotatedZ = nz; 
        // Actually need to apply rotation matrix to the normal vector.
        
        let wx = nx * Math.cos(rotationY);
        let wy = nx * -Math.sin(rotationY);
        let wz = 0;

        // Apply X rotation to normal? No, Y then X order matters. 
        // Let's just compute cross product of transformed vertices directly for simplicity and accuracy.
        
        const axX = p2.x - p1.x; const ayX = p2.y - p1.y; const azX = p2.z - p1.z;
        const bxX = p3.x - p1.x; const byX = p3.y - p1.y; const bzX = p3.z - p1.z;

        nx = ayX * bzX - azX * byX;
        ny = azX * bxX - axX * bzX;
        nz = axX * byX - ayX * bxX;

        // View vector is (0, 0, 1) if camera at origin looking +Z? 
        // Or we can just check dot product with view direction.
        
        const dot = nx*0 + ny*0 + nz*(-1); // Assuming camera looks down -Z axis into screen?
                                            // Wait, my projection logic: x' = f*x/z. If z>0 is in front of camera (at 0), then we look towards +Z.
                                            // So view vector is (0,0,-1) or just check if normal points away from viewer.
        
        const viewDot = nx*0 + ny*0 + nz*(-1); 
        if(viewDot < 0) continue; // Backface culling

        // Project to screen
        const proj1 = project(p1);
        const proj2 = project(p2);
        const proj3 = project(p3);

        if(!proj1 || !proj2 || !proj3) continue;

        projectedFaces.push({ p: [proj1, proj2, proj3], v: face.vertices }); // Store original vertices for lighting
        
    });

    // Sort by depth (painter's algorithm)
    projectedFaces.sort((a,b) => {
        const zA = a.p[0].z; 
        const zB = b.p[0].z;
        return zB - zA; // Draw furthest first
    });

    // Render Faces (Gouraud Shading)
    
    projectedFaces.forEach(faceData => {
        const p1 = faceData.p[0];
        const p2 = faceData.p[1];
        const p3 = faceData.p[2];
        
        // Calculate Lighting Colors for vertices
        // We need to calculate the light direction relative to vertex normal.
        // Since we rotated vertices, we can use their transformed positions? 
        // No, lighting is based on surface orientation (normal).
        // Let's re-calculate normals in world space from original local geometry and rotate them.
        
        const v1 = faceData.v[0];
        const v2 = faceData.v[1];
        const v3 = faceData.v[2];

        // Local Normal (from cross product of edges)
        let nx = 0, ny = 0, nz = 0;
        
        // Re-calculate local normal from original vertices to avoid precision issues with transformed ones? 
        // Actually we can just use the precomputed logic in Triangle constructor if I stored it.
        // Let's recompute quickly:
        const axX = v2.x - v1.x, ayX = v2.y - v1.y, azX = v2.z - v1.z;
        const bxX = v3.x - v1.x, byX = v3.y - v1.y, bzX = v3.z - v1.z;

        nx = ayX * bzX - azX * byX;
        ny = azX * bxX - axX * bzX;
        nz = axX * byX - ayX * bxX;

        // Rotate Normal to World Space (Apply Y rotation then X rotation)
        let wx = nx, wy = 0, wz = 0;
        
        // Apply Rotation Matrix for Y axis: [cos, 0, sin], [0,1,0], [-sin,0,cos]
        const cosY = Math.cos(rotationY);
        const sinY = Math.sin(rotationY);
        wx = nx * cosY + nz * -sinY; // Wait matrix multiplication order. 
                                     // Vector (nx, ny, nz). Rotated: x' = x*cosZ? No Y rotation affects X and Z.
        
        let tempX = nx * cosY - nz * sinY;
        let tempZ = nx * sinY + nz * cosY;
        wx = tempX; wz = tempZ;

        // Apply Rotation Matrix for X axis: [1,0,0], [0,c,-s], [0,s,c]
        const cosX = Math.cos(rotationX);
        const sinX = Math.sin(rotationX);
        
        let finalY = wy * cosX - wz * sinX; // Wait Y and Z rotation. 
                                            // y' = y*cosZ? No X axis rotates around X (y,z plane).
                                            // So x stays same, y becomes y*c - z*s, z becomes y*s + z*c
        
        let finalYVal = wy * cosX - wz * sinX;
        let finalZVal = wy * sinX + wz * cosX;

        const normalWorld = {x: wx, y: finalYVal, z: finalZVal};
        
        // Normalize Normal (approx)
        const lenN = Math.sqrt(wx*wx + finalYVal*finalYVal + finalZVal*finalZVal);
        if(lenN === 0) return;

        normalWorld.x /= lenN;
        normalWorld.y /= lenN;
        normalWorld.z /= lenN;

        // Light Direction (Orbiting around Z axis, fixed height?)
        const lightX = Math.cos(lightAngle);
        const lightY = Math.sin(lightAngle);
        const lightZ = 1.0; 
        
        let intensity = normalWorld.x * lightX + normalWorld.y * lightY + normalWorld.z * lightZ;
        
        // Ambient term to prevent total darkness on back side (if we didn't cull) or just for effect
        if(intensity < 0.2) intensity = 0.2;

        const colorBase = {r:150, g:180, b:240}; // Blueish cube
        
        const col1 = { r: Math.min(255, colorBase.r * intensity), 
                       g: Math.min(255, colorBase.g * intensity), 
                       b: Math.min(255, colorBase.b * intensity) };
        
        const col2 = {...col1}; // Same face has same normal for flat shading? No Gouraud.
                                // Wait, if it's a cube face (flat), all vertices have the same normal. So colors are identical per vertex on that face.
                                // This results in uniform color fill with smooth edges between faces. 
                                // For true Gouraud we need curved surfaces or multiple normals at shared vertices.
                                // Since this is a cube, each triangle has one constant intensity? Yes.
        
        const col3 = {...col1};

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();

        // Fill with interpolated color (Gouraud) - Since colors are same per face for cube faces:
        const r = Math.floor((col1.r + col2.r + col3.r)/3);
        const g = Math.floor((col1.g + col2.g + col3.g)/3);
        const b = Math.floor((col1.b + col2.b + col3.b)/3);

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        
        if (!showWireframeOnly) {
            ctx.fill();
        } else {
             // If wireframe only, we still need to draw the edges. 
             // But usually "wireframe toggle" means show lines on top of filled or just lines.
             // Let's do: Filled faces with black outline if W is pressed? Or just outlines?
             // Instruction says "Wireframe toggle (W) to show edges only". So fill nothing, draw strokes.
        }

        ctx.lineWidth = 1;
        ctx.strokeStyle = '#fff';
        
        if(showWireframeOnly || !showWireframeOnly) { 
            // If filled, we might want a border? Or just the wireframe mode draws lines on top of everything else?
            // Let's draw edges always for clarity.
             ctx.stroke();
             
             // If not in "wireframe only" mode, maybe don't stroke if it looks too busy? 
             // But standard is: Filled faces + Wireframe overlay OR Just Wireframe.
             // My logic above draws filled then strokes on top. That's fine.
        }

    });

    // Draw FPS Counter
    ctx.fillStyle = '#0f0';
    ctx.font = '14px monospace';
    ctx.fillText(`FPS: ${currentFPS}`, 20, height - 20);
    
    requestAnimationFrame(draw);
}

// --- Input Handling ---

window.addEventListener('keydown', (e) => {
    if(e.key.toLowerCase() === 'w') {
        showWireframeOnly = !showWireframeOnly;
    } else if(e.key.toLowerCase() === 'p') {
        isPaused = !isPaused;
    }
});

// --- Initialization ---

initGeometry();
draw();

</script>
