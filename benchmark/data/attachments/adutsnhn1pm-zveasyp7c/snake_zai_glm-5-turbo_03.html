<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

#game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#score-display {
    display: none;
    width: 600px;
    justify-content: space-between;
    padding: 10px 20px;
    margin-bottom: 10px;
    background: #1a1a2e;
    border-radius: 8px;
    border: 1px solid #333;
}

.score-item {
    text-align: center;
}

.score-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.score-value {
    font-size: 24px;
    font-weight: bold;
}

#player1-score .score-value {
    color: #00ff88;
}

#player2-score .score-value {
    color: #ff6b6b;
}

canvas {
    border: 2px solid #333;
    border-radius: 4px;
    background: #111;
}

#menu-screen, #gameover-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.9);
    z-index: 10;
}

#gameover-screen {
    display: none;
}

h1 {
    font-size: 48px;
    margin-bottom: 40px;
    background: linear-gradient(45deg, #00ff88, #00aaff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

h2 {
    font-size: 32px;
    margin-bottom: 20px;
    color: #ff6b6b;
}

.menu-btn {
    display: block;
    width: 280px;
    padding: 15px 30px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #333;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
}

.menu-btn:hover {
    border-color: #00ff88;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
}

.menu-btn:active {
    transform: translateY(0);
}

#gameover-screen p {
    font-size: 20px;
    margin: 10px 0;
    color: #ccc;
}

#gameover-screen .winner-text {
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
}

.restart-hint {
    margin-top: 30px;
    font-size: 14px;
    color: #666;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.controls-info {
    margin-top: 40px;
    font-size: 12px;
    color: #555;
    text-align: center;
    line-height: 1.8;
}
</style>
</head>
<body>

<div id="game-container">
    <div id="score-display">
        <div class="score-item" id="player1-score">
            <div class="score-label">Player 1</div>
            <div class="score-value">0</div>
        </div>
        <div class="score-item" id="player2-score">
            <div class="score-label">Player 2</div>
            <div class="score-value">0</div>
        </div>
    </div>

    <canvas id="game-canvas" width="600" height="600"></canvas>

    <div id="menu-screen">
        <h1>SNAKE</h1>
        <button class="menu-btn" onclick="startGame('human-human')">Human vs Human</button>
        <button class="menu-btn" onclick="startGame('cpu-human')">CPU vs Human</button>
        <button class="menu-btn" onclick="startGame('cpu-cpu')">CPU vs CPU</button>
        <div class="controls-info">
            Player 1: W A S D<br>
            Player 2: Arrow Keys
        </div>
    </div>

    <div id="gameover-screen">
        <h2>Game Over</h2>
        <p class="winner-text" id="winner-text"></p>
        <p id="final-score-1"></p>
        <p id="final-score-2"></p>
        <p class="restart-hint">Press SPACE or ENTER to restart</p>
    </div>
</div>

<script>
const GRID_SIZE = 30;
const CELL_SIZE = 20;
const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const menuScreen = document.getElementById('menu-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const scoreDisplay = document.getElementById('score-display');
const player1ScoreEl = document.querySelector('#player1-score .score-value');
const player2ScoreEl = document.querySelector('#player2-score .score-value');
const winnerText = document.getElementById('winner-text');
const finalScore1 = document.getElementById('final-score-1');
const finalScore2 = document.getElementById('final-score-2');

let gameMode = null;
let gameLoop = null;
let gameRunning = false;
let snakes = [];
let food = null;
let gameSpeed = 120;

const DIRECTIONS = {
    UP: { x: 0, y: -1 },
    DOWN: { x: 0, y: 1 },
    LEFT: { x: -1, y: 0 },
    RIGHT: { x: 1, y: 0 }
};

const OPPOSITES = {
    UP: 'DOWN',
    DOWN: 'UP',
    LEFT: 'RIGHT',
    RIGHT: 'LEFT'
};

class Snake {
    constructor(startX, startY, direction, isCPU, color, headColor) {
        this.body = [
            { x: startX, y: startY },
            { x: startX - direction.x, y: startY - direction.y },
            { x: startX - direction.x * 2, y: startY - direction.y * 2 }
        ];
        this.direction = direction;
        this.nextDirection = direction;
        this.isCPU = isCPU;
        this.color = color;
        this.headColor = headColor;
        this.score = 0;
        this.alive = true;
        this.directionName = Object.keys(DIRECTIONS).find(k => 
            DIRECTIONS[k].x === direction.x && DIRECTIONS[k].y === direction.y
        );
    }

    setDirection(dirName) {
        if (OPPOSITES[dirName] !== this.directionName) {
            this.nextDirection = DIRECTIONS[dirName];
            this.directionName = dirName;
        }
    }

    update() {
        if (!this.alive) return;

        this.direction = this.nextDirection;
        const head = this.body[0];
        const newHead = {
            x: head.x + this.direction.x,
            y: head.y + this.direction.y
        };

        this.body.unshift(newHead);

        if (food && newHead.x === food.x && newHead.y === food.y) {
            this.score++;
            spawnFood();
        } else {
            this.body.pop();
        }
    }

    checkCollision(otherSnake) {
        if (!this.alive) return;
        const head = this.body[0];

        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
            this.alive = false;
            return;
        }

        for (let i = 1; i < this.body.length; i++) {
            if (head.x === this.body[i].x && head.y === this.body[i].y) {
                this.alive = false;
                return;
            }
        }

        if (otherSnake && otherSnake.alive) {
            for (let i = 0; i < otherSnake.body.length; i++) {
                if (head.x === otherSnake.body[i].x && head.y === otherSnake.body[i].y) {
                    this.alive = false;
                    return;
                }
            }
        }
    }

    cpuMove(otherSnake) {
        if (!this.alive || !food) return;

        const path = bfs(this.body[0], food, this, otherSnake);
        
        if (path && path.length > 1) {
            const next = path[1];
            const dx = next.x - this.body[0].x;
            const dy = next.y - this.body[0].y;
            
            if (dx === 1) this.setDirection('RIGHT');
            else if (dx === -1) this.setDirection('LEFT');
            else if (dy === 1) this.setDirection('DOWN');
            else if (dy === -1) this.setDirection('UP');
        } else {
            const safeDirs = getSafeDirections(this.body[0], this, otherSnake);
            if (safeDirs.length > 0) {
                this.setDirection(safeDirs[Math.floor(Math.random() * safeDirs.length)]);
            }
        }
    }

    draw() {
        if (!this.alive) return;

        for (let i = this.body.length - 1; i >= 0; i--) {
            const segment = this.body[i];
            const x = segment.x * CELL_SIZE;
            const y = segment.y * CELL_SIZE;

            if (i === 0) {
                ctx.fillStyle = this.headColor;
                ctx.shadowColor = this.headColor;
                ctx.shadowBlur = 8;
            } else {
                const alpha = 0.9 - (i / this.body.length) * 0.4;
                ctx.fillStyle = this.color.replace('1)', alpha + ')');
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, i === 0 ? 6 : 4);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

function getSnakeCells(snake, otherSnake) {
    const cells = new Set();
    for (const seg of snake.body) {
        cells.add(`${seg.x},${seg.y}`);
    }
    if (otherSnake && otherSnake.alive) {
        for (const seg of otherSnake.body) {
            cells.add(`${seg.x},${seg.y}`);
        }
    }
    return cells;
}

function bfs(start, target, snake, otherSnake) {
    const occupied = getSnakeCells(snake, otherSnake);
    occupied.delete(`${start.x},${start.y}`);

    const queue = [[start]];
    const visited = new Set();
    visited.add(`${start.x},${start.y}`);

    while (queue.length > 0) {
        const path = queue.shift();
        const current = path[path.length - 1];

        if (current.x === target.x && current.y === target.y) {
            return path;
        }

        for (const dir of Object.values(DIRECTIONS)) {
            const next = { x: current.x + dir.x, y: current.y + dir.y };
            const key = `${next.x},${next.y}`;

            if (next.x >= 0 && next.x < GRID_SIZE && 
                next.y >= 0 && next.y < GRID_SIZE && 
                !visited.has(key) && !occupied.has(key)) {
                visited.add(key);
                queue.push([...path, next]);
            }
        }
    }

    return null;
}

function getSafeDirections(pos, snake, otherSnake) {
    const safe = [];
    const occupied = getSnakeCells(snake, otherSnake);

    for (const [name, dir] of Object.entries(DIRECTIONS)) {
        const next = { x: pos.x + dir.x, y: pos.y + dir.y };
        const key = `${next.x},${next.y}`;
        if (next.x >= 0 && next.x < GRID_SIZE && 
            next.y >= 0 && next.y < GRID_SIZE && 
            !occupied.has(key) && OPPOSITES[name] !== snake.directionName) {
            safe.push(name);
        }
    }
    return safe;
}

function spawnFood() {
    const occupied = new Set();
    for (const snake of snakes) {
        for (const seg of snake.body) {
            occupied.add(`${seg.x},${seg.y}`);
        }
    }

    const available = [];
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            if (!occupied.has(`${x},${y}`)) {
                available.push({ x, y });
            }
        }
    }

    if (available.length > 0) {
        food = available[Math.floor(Math.random() * available.length)];
    }
}

function drawGrid() {
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
        ctx.stroke();
    }
}

function drawFood() {
    if (!food) return;
    const x = food.x * CELL_SIZE + CELL_SIZE / 2;
    const y = food.y * CELL_SIZE + CELL_SIZE / 2;
    const radius = CELL_SIZE / 2 - 2;

    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 12;
    
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, '#ff6666');
    gradient.addColorStop(0.7, '#ff3333');
    gradient.addColorStop(1, '#cc0000');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function updateScoreDisplay() {
    player1ScoreEl.textContent = snakes[0].score;
    player2ScoreEl.textContent = snakes[1] ? snakes[1].score : 0;
}

function gameStep() {
    if (!gameRunning) return;

    if (snakes[0].isCPU) snakes[0].cpuMove(snakes[1]);
    if (snakes[1] && snakes[1].isCPU) snakes[1].cpuMove(snakes[0]);

    for (const snake of snakes) {
        snake.update();
    }

    for (const snake of snakes) {
        snake.checkCollision(snakes[0] === snake ? snakes[1] : snakes[0]);
    }

    updateScoreDisplay();

    if (!snakes[0].alive || (snakes[1] && !snakes[1].alive)) {
        endGame();
        return;
    }

    draw();
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    drawGrid();
    drawFood();
    for (const snake of snakes) {
        snake.draw();
    }
}

function startGame(mode) {
    gameMode = mode;
    menuScreen.style.display = 'none';
    gameoverScreen.style.display = 'none';
    scoreDisplay.style.display = 'flex';

    const p1CPU = mode === 'cpu-human' || mode === 'cpu-cpu';
    const p2CPU = mode === 'cpu-cpu';

    snakes = [
        new Snake(5, 15, DIRECTIONS.RIGHT, p1CPU, 'rgba(0, 255, 136, 1)', '#00ff88'),
        new Snake(24, 15, DIRECTIONS.LEFT, p2CPU, 'rgba(255, 107, 107, 1)', '#ff6b6b')
    ];

    spawnFood();
    updateScoreDisplay();
    gameRunning = true;

    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(gameStep, gameSpeed);
    draw();
}

function endGame() {
    gameRunning = false;
    if (gameLoop) {
        clearInterval(gameLoop);
        gameLoop = null;
    }

    const s1 = snakes[0];
    const s2 = snakes[1];

    let winText = '';
    if (!s1.alive && !s2.alive) {
        winText = "It's a Draw!";
        winnerText.style.color = '#ffaa00';
    } else if (!s1.alive) {
        winText = s2.isCPU ? 'CPU Wins!' : 'Player 2 Wins!';
        winnerText.style.color = '#ff6b6b';
    } else {
        winText = s1.isCPU ? 'CPU Wins!' : 'Player 1 Wins!';
        winnerText.style.color = '#00ff88';
    }

    winnerText.textContent = winText;
    finalScore1.textContent = `Player 1 Score: ${s1.score}`;
    finalScore2.textContent = `Player 2 Score: ${s2.score}`;
    
    gameoverScreen.style.display = 'flex';
}

document.addEventListener('keydown', (e) => {
    if (!gameRunning) {
        if (e.code === 'Space' || e.code === 'Enter') {
            if (gameMode) {
                startGame(gameMode);
            }
            return;
        }
    }

    const key = e.key.toLowerCase();

    if (!snakes[0].isCPU) {
        switch (key) {
            case 'w': snakes[0].setDirection('UP'); break;
            case 's': snakes[0].setDirection('DOWN'); break;
            case 'a': snakes[0].setDirection('LEFT'); break;
            case 'd': snakes[0].setDirection('RIGHT'); break;
        }
    }

    if (snakes[1] && !snakes[1].isCPU) {
        switch (e.key) {
            case 'ArrowUp': snakes[1].setDirection('UP'); e.preventDefault(); break;
            case 'ArrowDown': snakes[1].setDirection('DOWN'); e.preventDefault(); break;
            case 'ArrowLeft': snakes[1].setDirection('LEFT'); e.preventDefault(); break;
            case 'ArrowRight': snakes[1].setDirection('RIGHT'); e.preventDefault(); break;
        }
    }
});

draw();
</script>

</body>
</html>
