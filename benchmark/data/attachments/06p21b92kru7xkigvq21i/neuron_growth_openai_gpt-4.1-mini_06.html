<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neuron Growth Simulation</title>
<style>
  /* Dark background and center canvas */
  body, html {
    margin: 0;
    height: 100%;
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #canvas {
    background: #05070f;
    display: block;
    box-shadow: 0 0 20px #101a3a;
    border-radius: 4px;
  }
  /* dat.gui styling override for neon accent */
  .dg.main {
    background: #05070f !important;
    color: #ffd400 !important;
    font-family: monospace;
  }
  .dg .property-name {
    color: #ffd400 !important;
  }
  .dg .cr.number input {
    color: #ffd400 !important;
    background: #101a3a !important;
    border: none !important;
  }
  .dg .c {
    border-color: #ffd400 !important;
  }
  .dg .close-button {
    color: #ffd400 !important;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// === Setup and global state ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;

// Neon palette
const palette = {
  background: '#05070f',
  backgroundGlow: '#101a3a',
  mainBranch: '#00e5ff',
  accentBranch: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  uiAccent: '#ffd400',
  grid: 'rgba(0,229,255,0.08)'
};

// Simulation parameters with defaults
const params = {
  neuronCount: 5,
  branchGrowthSpeed: 1.5,
  maxBranchDepth: 6,
  branchSplitChance: 0.25,
  branchCurvature: 0.3,
  maxBranchLength: 70,
  synapseDistanceThreshold: 15,
  synapseGlowStrength: 15,
  pulseSpeed: 0.008,
  pulseFrequency: 0.02,
  pulseBrightness: 1.2,
  backgroundColor: palette.background,
  branchColor: palette.mainBranch,
  accentBranchColor: palette.accentBranch,
  synapseColor: palette.synapse,
  pulseColor: palette.pulse
};

// State containers
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let growing = true;
let animationPaused = false;

// Utility functions
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function randomRange(min, max) { return Math.random() * (max - min) + min; }

// === Neuron & Branch data structures ===
class Branch {
  constructor(start, angle, depth, parent=null, length=null, thickness=null) {
    this.start = start; // {x,y}
    this.angle = angle; // radians
    this.depth = depth;
    this.parent = parent;
    this.length = length || randomRange(params.maxBranchLength*0.5, params.maxBranchLength);
    this.thickness = thickness || randomRange(0.8, 1.8);
    this.progress = 0; // growth progress 0..1
    this.children = [];
    this.end = {x: start.x, y: start.y};
    this.completed = false;
  }

  grow() {
    this.progress += params.branchGrowthSpeed / 100;
    if (this.progress > 1) {
      this.progress = 1;
      this.completed = true;
    }
    // Calculate end point with slight curvature
    const length = this.length * this.progress;
    const midAngle = this.angle + (Math.sin(this.progress * Math.PI) * params.branchCurvature * (Math.random() < 0.5 ? 1 : -1));
    this.end.x = this.start.x + length * Math.cos(midAngle);
    this.end.y = this.start.y + length * Math.sin(midAngle);
  }
}

class Neuron {
  constructor(pos) {
    this.pos = pos;
    this.branches = [];
  }

  startGrowth() {
    const mainBranch = new Branch(this.pos, randomRange(0, 2 * Math.PI), 0);
    this.branches.push(mainBranch);
    branches.push(mainBranch);
  }
}

// === Synapse detection & management ===
function detectSynapses() {
  synapses = [];
  // Find pairs of branch tips close enough
  for (let i = 0; i < branches.length; i++) {
    if (!branches[i].completed) continue;
    const a = branches[i].end;
    for (let j = i + 1; j < branches.length; j++) {
      if (!branches[j].completed) continue;
      const b = branches[j].end;
      if (dist(a, b) < params.synapseDistanceThreshold) {
        // Prevent duplicate synapses
        if (!synapses.find(s => (s.a === branches[i] && s.b === branches[j]) || (s.b === branches[i] && s.a === branches[j]))) {
          synapses.push({a: branches[i], b: branches[j], pulseTimers: []});
        }
      }
    }
  }
}

// === Pulse animation ===
function spawnPulse(synapse) {
  synapse.pulseTimers.push(0);
}

function updatePulses() {
  pulses.length = 0; // Clear pulses, rebuild from synapses
  synapses.forEach(syn => {
    const newTimers = [];
    syn.pulseTimers.forEach(t => {
      const newT = t + params.pulseSpeed;
      if (newT < 1) {
        newTimers.push(newT);
        // Calculate pulse position by lerp
        const pos = {
          x: lerp(syn.a.end.x, syn.b.end.x, newT),
          y: lerp(syn.a.end.y, syn.b.end.y, newT)
        };
        pulses.push({pos, brightness: params.pulseBrightness});
      }
    });
    syn.pulseTimers = newTimers;
    // Spawn new pulses randomly based on frequency
    if (Math.random() < params.pulseFrequency) {
      spawnPulse(syn);
    }
  });
}

// === Neuron growth ===
function growBranches() {
  if (!growing) return;
  let newBranches = [];
  let branchCount = branches.length;

  for (let br of branches) {
    if (!br.completed) {
      br.grow();
      // Possibly split if conditions met
      if (br.progress > 0.6 && br.children.length === 0 && br.depth < params.maxBranchDepth) {
        if (Math.random() < params.branchSplitChance) {
          // Create 1 or 2 side branches
          let splits = 1 + (Math.random() < 0.5 ? 1 : 0);
          for (let i = 0; i < splits; i++) {
            const angleOffset = (Math.random() * 0.8 + 0.4) * (Math.random() < 0.5 ? 1 : -1);
            const newAngle = br.angle + angleOffset;
            const newBranch = new Branch(br.end, newAngle, br.depth + 1, br, br.length * 0.6, br.thickness * 0.7);
            br.children.push(newBranch);
            newBranches.push(newBranch);
            branchCount++;
            if (branchCount > 800) break; // cap total branches
          }
        }
      }
    }
  }
  for (let nb of newBranches) {
    branches.push(nb);
  }
  if (branches.length > 800) growing = false; // cap total branches
  if (branches.every(b => b.completed)) growing = false;
}

// === Rendering ===
function drawVignette() {
  const grad = ctx.createRadialGradient(width/2, height/2, width/2*0.5, width/2, height/2, width/2);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);
}

function drawGrid() {
  ctx.strokeStyle = palette.grid;
  ctx.lineWidth = 1;
  for(let x = 0; x < width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for(let y = 0; y < height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
}

function drawBranches() {
  ctx.lineCap = 'round';
  branches.forEach(br => {
    if (br.progress > 0) {
      ctx.shadowColor = br.depth === 0 ? params.branchColor : params.accentBranchColor;
      ctx.shadowBlur = 10;
      ctx.strokeStyle = br.depth === 0 ? params.branchColor : params.accentBranchColor;
      ctx.lineWidth = br.thickness * (1 - br.depth / (params.maxBranchDepth + 1));
      ctx.beginPath();
      ctx.moveTo(br.start.x, br.start.y);
      // For organic curve, quadratic curve with control near mid
      const ctrlX = (br.start.x + br.end.x) / 2 + (Math.sin(br.angle * 10) * 10 * params.branchCurvature);
      const ctrlY = (br.start.y + br.end.y) / 2 + (Math.cos(br.angle * 10) * 10 * params.branchCurvature);
      ctx.quadraticCurveTo(ctrlX, ctrlY, br.end.x, br.end.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  });
}

function drawSynapses() {
  ctx.lineWidth = 2;
  synapses.forEach(syn => {
    ctx.strokeStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlowStrength;
    ctx.beginPath();
    ctx.moveTo(syn.a.end.x, syn.a.end.y);
    ctx.lineTo(syn.b.end.x, syn.b.end.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Draw glowing synapse point
    [syn.a.end, syn.b.end].forEach(pt => {
      ctx.fillStyle = params.synapseColor;
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = params.synapseGlowStrength * 1.2;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  });
}

function drawPulses() {
  pulses.forEach(p => {
    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.pos.x, p.pos.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function drawBackgroundNoise() {
  const imageData = ctx.getImageData(0, 0, width, height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    // subtle blue noise
    let noise = (Math.random() - 0.5) * 10;
    data[i] = Math.min(5 + noise, 10);     // R low blueish
    data[i+1] = Math.min(6 + noise, 12);   // G
    data[i+2] = Math.min(30 + noise, 50);  // B
    data[i+3] = 20;                        // alpha low
  }
  ctx.putImageData(imageData, 0, 0);
}

// === Main loop ===
function loop() {
  if (!animationPaused) {
    growBranches();
    detectSynapses();
    updatePulses();
  }
  // Draw
  ctx.clearRect(0, 0, width, height);
  // Background glow
  ctx.shadowBlur = 20;
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, width, height);
  ctx.shadowBlur = 0;

  drawBackgroundNoise();
  drawGrid();
  drawBranches();
  drawSynapses();
  drawPulses();
  drawVignette();

  requestAnimationFrame(loop);
}

// === GUI setup ===
const gui = new dat.GUI({width: 320});
const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(regenerate);
growthFolder.add(params, 'branchGrowthSpeed', 0.2, 5, 0.1).name('Branch Growth Speed');
growthFolder.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Branch Depth');
growthFolder.add(params, 'branchSplitChance', 0, 1, 0.01).name('Branch Split Chance');
growthFolder.add(params, 'branchCurvature', 0, 1, 0.01).name('Branch Curvature');
growthFolder.add(params, 'maxBranchLength', 10, 150, 1).name('Max Branch Length');
growthFolder.open();

const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDistanceThreshold', 5, 40, 1).name('Synapse Distance');
synapseFolder.add(params, 'synapseGlowStrength', 0, 40, 1).name('Synapse Glow');
synapseFolder.open();

const pulsesFolder = gui.addFolder('Pulses');
pulsesFolder.add(params, 'pulseSpeed', 0.001, 0.05, 0.001).name('Pulse Speed');
pulsesFolder.add(params, 'pulseFrequency', 0, 0.1, 0.001).name('Pulse Frequency');
pulsesFolder.add(params, 'pulseBrightness', 0.2, 3, 0.01).name('Pulse Brightness');
pulsesFolder.open();

const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'backgroundColor').name('Background Color');
visualsFolder.addColor(params, 'branchColor').name('Branch Color');
visualsFolder.addColor(params, 'accentBranchColor').name('Accent Branch Color');
visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
visualsFolder.open();

// Buttons
const controls = {
  regenerate: regenerate,
  clearCanvas: clearCanvas,
  pauseResume: pauseResume
};
gui.add(controls, 'regenerate').name('Regenerate Network');
gui.add(controls, 'clearCanvas').name('Clear Canvas');
gui.add(controls, 'pauseResume').name('Pause/Resume Animation');

// === Actions ===
function regenerate() {
  branches = [];
  synapses = [];
  pulses = [];
  neurons = [];
  growing = true;
  animationPaused = false;
  // Generate neurons near center
  const center = {x: width / 2, y: height / 2};
  for (let i = 0; i < params.neuronCount; i++) {
    const angle = (Math.PI * 2 / params.neuronCount) * i;
    const radius = randomRange(10, 40);
    const pos = {
      x: center.x + Math.cos(angle) * radius + randomRange(-10, 10),
      y: center.y + Math.sin(angle) * radius + randomRange(-10, 10)
    };
    const n = new Neuron(pos);
    neurons.push(n);
    n.startGrowth();
  }
}

function clearCanvas() {
  branches = [];
  synapses = [];
  pulses = [];
  neurons = [];
  growing = false;
  ctx.clearRect(0, 0, width, height);
}

function pauseResume() {
  animationPaused = !animationPaused;
}

// Start
regenerate();
loop();
</script>
</body>
</html>
