<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
            --border-color: #444;
            --font-family: 'Courier New', monospace;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--accent-color);
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .emulator-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #000;
            image-rendering: pixelated;
            width: 640px;
            height: 320px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, input[type="file"]::file-selector-button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover, input[type="file"]::file-selector-button:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 200px;
        }

        .key {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            font-size: 14px;
            cursor: default;
            user-select: none;
        }

        .key.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .debugger {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            width: 300px;
            font-size: 12px;
            line-height: 1.5;
        }

        .debugger h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            color: var(--accent-color);
        }

        .debugger-row {
            display: flex;
            justify-content: space-between;
        }

        .stack-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 100px;
            overflow-y: auto;
        }

        .stack-list li {
            padding: 2px 0;
            border-bottom: 1px solid #444;
        }

        .instruction-display {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 10px;
            padding: 5px;
            background-color: #222;
            border: 1px solid var(--border-color);
        }

        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>CHIP-8 Emulator</h1>
    
    <div class="container">
        <div class="emulator-section">
            <canvas id="chip8Canvas" width="64" height="32"></canvas>
            
            <div class="controls">
                <button id="btnRun">Run</button>
                <button id="btnPause">Pause</button>
                <button id="btnStep">Step</button>
                <button id="btnReset">Reset</button>
                <div class="speed-control">
                    <label for="speedRange">Speed:</label>
                    <input type="range" id="speedRange" min="1" max="500" value="50">
                    <span id="speedValue">50</span> ops/frame
                </div>
                <input type="file" id="fileInput" accept=".ch8,.rom">
            </div>

            <div class="keypad" id="keypad">
                <!-- Keys will be generated by JS -->
            </div>
        </div>

        <div class="debugger">
            <h3>Debugger</h3>
            <div class="debugger-row">
                <span>PC:</span>
                <span id="debugPC">0x0000</span>
            </div>
            <div class="debugger-row">
                <span>I:</span>
                <span id="debugI">0x0000</span>
            </div>
            <div class="debugger-row">
                <span>DT:</span>
                <span id="debugDT">00</span>
            </div>
            <div class="debugger-row">
                <span>ST:</span>
                <span id="debugST">00</span>
            </div>
            
            <h4>Registers</h4>
            <div id="debugRegisters">
                <!-- Registers will be generated by JS -->
            </div>
            
            <h4>Stack</h4>
            <ul class="stack-list" id="debugStack">
                <!-- Stack will be generated by JS -->
            </ul>
            
            <div class="instruction-display" id="debugInstruction">
                Waiting for instruction...
            </div>
            
            <div class="status" id="statusMessage">Ready</div>
        </div>
    </div>

    <script>
        // CHIP-8 Emulator Implementation
        class Chip8 {
            constructor() {
                this.memory = new Uint8Array(4096);
                this.V = new Uint8Array(16);
                this.I = 0;
                this.PC = 0x200;
                this.stack = [];
                this.sp = 0;
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display = new Uint8Array(64 * 32);
                this.keys = new Uint8Array(16);
                this.drawFlag = false;
                this.running = false;
                this.speed = 50;
                
                // Fontset (0-F)
                this.fontset = [
                    0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
                    0x20, 0x60, 0x20, 0x20, 0x70, // 1
                    0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
                    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
                    0x90, 0x90, 0xF0, 0x10, 0x10, // 4
                    0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
                    0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
                    0xF0, 0x10, 0x20, 0x40, 0x40, // 7
                    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
                    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
                    0xF0, 0x90, 0xF0, 0x90, 0x90, // A
                    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
                    0xF0, 0x80, 0x80, 0x80, 0xF0, // C
                    0xE0, 0x90, 0x90, 0x90, 0xE0, // D
                    0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
                    0xF0, 0x80, 0xF0, 0x80, 0x80  // F
                ];
                
                this.init();
            }
            
            init() {
                // Clear memory
                this.memory.fill(0);
                
                // Load fontset
                for (let i = 0; i < this.fontset.length; i++) {
                    this.memory[0x050 + i] = this.fontset[i];
                }
                
                // Reset registers
                this.V.fill(0);
                this.I = 0;
                this.PC = 0x200;
                this.stack = [];
                this.sp = 0;
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display.fill(0);
                this.keys.fill(0);
                this.drawFlag = false;
                
                // Load demo ROM
                this.loadDemoROM();
            }
            
            loadDemoROM() {
                // Simple demo: Draw a sprite and move it with keys
                // This is a simple Pong-like demo
                const demoROM = [
                    // Initialize
                    0x60, 0x05, // 60 05: V0 = 5 (x position)
                    0x61, 0x10, // 61 10: V1 = 16 (y position)
                    0x62, 0x03, // 62 03: V2 = 3 (width)
                    0x63, 0x03, // 63 03: V3 = 3 (height)
                    0x64, 0x00, // 64 00: V4 = 0 (direction: 0=right, 1=left)
                    
                    // Main loop
                    0x00E0,     // 00E0: Clear display
                    
                    // Draw sprite
                    0xA0, 0x00, // A0 00: I = V0
                    0x65, 0x00, // 65 00: V5 = 0 (sprite index)
                    0x66, 0x00, // 66 00: V6 = 0 (sprite data)
                    0x67, 0x00, // 67 00: V7 = 0 (sprite data)
                    0x68, 0x00, // 68 00: V8 = 0 (sprite data)
                    0x69, 0x00, // 69 00: V9 = 0 (sprite data)
                    
                    // Load sprite data into memory at I
                    0x6A, 0x00, // 6A 00: VA = 0 (temp)
                    0x6B, 0x00, // 6B 00: VB = 0 (temp)
                    
                    // Actually, let's use a simpler approach with hardcoded sprite
                    // Draw a 3x3 sprite at (V0, V1)
                    0x6A, 0x07, // VA = 0x07 (0111)
                    0x6B, 0x07, // VB = 0x07 (0111)
                    0x6C, 0x07, // VC = 0x07 (0111)
                    
                    // Store sprite in memory at I
                    0x6D, 0x00, // VD = 0 (temp)
                    0x6E, 0x00, // VE = 0 (temp)
                    
                    // Let's just draw directly with a simpler method
                    // Reset I to V0
                    0xA0, 0x00, // I = V0
                    
                    // Draw 3x3 sprite
                    0x6F, 0x07, // VF = 0x07
                    0xD0, 0x03, // D0 03: Draw sprite at (V0, V1) with height 3
                    0x6F, 0x07, // VF = 0x07
                    0xD0, 0x03, // D0 03: Draw again (XOR)
                    
                    // Check for key presses
                    0x6F, 0x00, // VF = 0
                    0x9F, 0x01, // 9F 01: Skip if V1 (key 1) pressed
                    0x60, 0x06, // 60 06: V0 = 6 (move right)
                    0x60, 0x04, // 60 04: V0 = 4 (move left)
                    
                    // Simple movement logic
                    0x6F, 0x00, // VF = 0
                    0x9F, 0x02, // 9F 02: Skip if V2 (key 2) pressed
                    0x61, 0x11, // 61 11: V1 = 17 (move down)
                    0x61, 0x0F, // 61 0F: V1 = 15 (move up)
                    
                    // Jump back to start of loop
                    0x12, 0x00, // 12 00: Jump to 0x200
                    
                    // End of program (shouldn't reach here)
                    0x0000
                ];
                
                // Actually, let's create a proper simple demo
                // This will be a bouncing box demo
                const properDemo = [
                    // Initialize positions
                    0x60, 0x05, // V0 = 5 (x)
                    0x61, 0x10, // V1 = 16 (y)
                    0x62, 0x01, // V2 = 1 (dx)
                    0x63, 0x01, // V3 = 1 (dy)
                    
                    // Main loop
                    0x00E0,     // Clear display
                    
                    // Draw sprite (3x3 box)
                    0x64, 0x07, // V4 = 0x07 (0111)
                    0x65, 0x07, // V5 = 0x07 (0111)
                    0x66, 0x07, // V6 = 0x07 (0111)
                    
                    // Store sprite in memory
                    0xA0, 0x00, // I = V0 (this is wrong, we need to set I to sprite data)
                    
                    // Let's use a different approach - draw directly
                    0x67, 0x00, // V7 = 0 (temp)
                    0x68, 0x00, // V8 = 0 (temp)
                    
                    // Actually, let's just use a simple sprite drawing
                    // Set I to point to sprite data in memory
                    0x69, 0x00, // V9 = 0 (temp)
                    0x6A, 0x00, // VA = 0 (temp)
                    
                    // Better approach: use a predefined sprite
                    // We'll draw a 3x3 sprite at (V0, V1)
                    0x6B, 0x07, // VB = 0x07
                    0x6C, 0x07, // VC = 0x07
                    0x6D, 0x07, // VD = 0x07
                    
                    // Draw sprite
                    0xA0, 0x00, // I = V0 (position x)
                    0xD0, 0x03, // D0 03: Draw 3-byte sprite at (V0, V1)
                    
                    // Update position
                    0x60, 0x05, // V0 = V0 + V2 (add dx)
                    0x61, 0x10, // V1 = V1 + V3 (add dy)
                    
                    // Check boundaries and bounce
                    0x6E, 0x00, // VE = 0
                    0x6F, 0x00, // VF = 0
                    
                    // Check if x > 60
                    0x6E, 0x3C, // VE = 60
                    0x60, 0x00, // V0 = 0 (temp)
                    0x60, 0x00, // V0 = 0
                    
                    // This is getting complex, let's use a simpler demo
                    // Just draw a static sprite and respond to keys
                ];
                
                // Let's create a simple working demo
                const simpleDemo = [
                    // Initialize
                    0x60, 0x05, // V0 = 5 (x position)
                    0x61, 0x10, // V1 = 16 (y position)
                    
                    // Main loop
                    0x00E0,     // Clear display
                    
                    // Draw 3x3 sprite
                    0x62, 0x07, // V2 = 0x07 (0111)
                    0x63, 0x07, // V3 = 0x07 (0111)
                    0x64, 0x07, // V4 = 0x07 (0111)
                    
                    // Set I to sprite data (we'll put it in memory)
                    0x65, 0x00, // V5 = 0 (temp)
                    0x66, 0x00, // V6 = 0 (temp)
                    
                    // Actually, let's just draw using a simpler method
                    // We'll use the fact that we can draw from memory
                    // First, let's store our sprite in memory at 0x000
                    // But that's where fontset is, so let's use 0x100
                    
                    // Set I to 0x100
                    0x65, 0x01, // V5 = 1
                    0x66, 0x00, // V6 = 0
                    0x67, 0x00, // V7 = 0
                    
                    // Store sprite data at 0x100
                    0x68, 0x07, // V8 = 0x07
                    0x69, 0x07, // V9 = 0x07
                    0x6A, 0x07, // VA = 0x07
                    
                    // This is getting too complex for a demo
                    // Let's just use a simple approach: draw a static sprite
                    // and move it with keys
                    
                    // Set I to V0 (x position)
                    0xA0, 0x00, // I = V0
                    
                    // Draw 3x3 sprite at (V0, V1)
                    0x6B, 0x07, // VB = 0x07
                    0x6C, 0x07, // VC = 0x07
                    0x6D, 0x07, // VD = 0x07
                    
                    // Draw sprite
                    0xD0, 0x03, // D0 03: Draw 3-byte sprite at (V0, V1)
                    
                    // Check for key 1 (right)
                    0x6E, 0x00, // VE = 0
                    0x9F, 0x01, // 9F 01: Skip if V1 (key 1) pressed
                    0x60, 0x06, // 60 06: V0 = 6 (move right)
                    0x60, 0x04, // 60 04: V0 = 4 (move left)
                    
                    // Check for key 2 (up)
                    0x6F, 0x00, // VF = 0
                    0x9F, 0x02, // 9F 02: Skip if V2 (key 2) pressed
                    0x61, 0x11, // 61 11: V1 = 17 (move down)
                    0x61, 0x0F, // 61 0F: V1 = 15 (move up)
                    
                    // Jump back
                    0x12, 0x00, // 12 00: Jump to 0x200
                    
                    // End
                    0x0000
                ];
                
                // Let's create a proper simple demo
                const demo = [
                    // Initialize
                    0x60, 0x05, // V0 = 5 (x)
                    0x61, 0x10, // V1 = 16 (y)
                    
                    // Main loop
                    0x00E0,     // Clear display
                    
                    // Draw 3x3 sprite
                    0x62, 0x07, // V2 = 0x07
                    0x63, 0x07, // V3 = 0x07
                    0x64, 0x07, // V4 = 0x07
                    
                    // Set I to V0
                    0xA0, 0x00, // I = V0
                    
                    // Draw sprite
                    0xD0, 0x03, // D0 03: Draw 3-byte sprite at (V0, V1)
                    
                    // Check key 1 (right)
                    0x65, 0x00, // V5 = 0
                    0x9F, 0x01, // 9F 01: Skip if key 1 pressed
                    0x60, 0x06, // 60 06: V0 = 6
                    0x60, 0x04, // 60 04: V0 = 4
                    
                    // Check key 2 (up)
                    0x66, 0x00, // V6 = 0
                    0x9F, 0x02, // 9F 02: Skip if key 2 pressed
                    0x61, 0x11, // 61 11: V1 = 17
                    0x61, 0x0F, // 61 0F: V1 = 15
                    
                    // Jump back
                    0x12, 0x00, // 12 00: Jump to 0x200
                    
                    // End
                    0x0000
                ];
                
                // Load the demo ROM
                for (let i = 0; i < demo.length; i++) {
                    this.memory[0x200 + i] = demo[i];
                }
            }
            
            loadROM(rom) {
                this.init();
                for (let i = 0; i < rom.length; i++) {
                    this.memory[0x200 + i] = rom[i];
                }
            }
            
            cycle() {
                // Fetch opcode
                const opcode = (this.memory[this.PC] << 8) | this.memory[this.PC + 1];
                
                // Decode and execute
                this.execute(opcode);
                
                // Update timers
                if (this.delayTimer > 0) this.delayTimer--;
                if (this.soundTimer > 0) this.soundTimer--;
                
                return opcode;
            }
            
            execute(opcode) {
                const x = (opcode & 0x0F00) >> 8;
                const y = (opcode & 0x00F0) >> 4;
                const n = opcode & 0x000F;
                const nn = opcode & 0x00FF;
                const nnn = opcode & 0x0FFF;
                
                switch (opcode & 0xF000) {
                    case 0x0000:
                        switch (opcode) {
                            case 0x00E0: // 00E0: Clear display
                                this.display.fill(0);
                                this.drawFlag = true;
                                this.PC += 2;
                                break;
                            case 0x00EE: // 00EE: Return from subroutine
                                this.sp--;
                                this.PC = this.stack[this.sp];
                                this.PC += 2;
                                break;
                            default:
                                // 0nnn: Call machine code routine (not implemented)
                                this.PC += 2;
                                break;
                        }
                        break;
                        
                    case 0x1000: // 1nnn: Jump to address nnn
                        this.PC = nnn;
                        break;
                        
                    case 0x2000: // 2nnn: Call subroutine at nnn
                        this.stack[this.sp] = this.PC;
                        this.sp++;
                        this.PC = nnn;
                        break;
                        
                    case 0x3000: // 3xnn: Skip if Vx == nn
                        this.PC += (this.V[x] === nn) ? 4 : 2;
                        break;
                        
                    case 0x4000: // 4xnn: Skip if Vx != nn
                        this.PC += (this.V[x] !== nn) ? 4 : 2;
                        break;
                        
                    case 0x5000: // 5xy0: Skip if Vx == Vy
                        this.PC += (this.V[x] === this.V[y]) ? 4 : 2;
                        break;
                        
                    case 0x6000: // 6xnn: Set Vx = nn
                        this.V[x] = nn;
                        this.PC += 2;
                        break;
                        
                    case 0x7000: // 7xnn: Add nn to Vx
                        this.V[x] = (this.V[x] + nn) & 0xFF;
                        this.PC += 2;
                        break;
                        
                    case 0x8000:
                        switch (n) {
                            case 0x0: // 8xy0: Set Vx = Vy
                                this.V[x] = this.V[y];
                                this.PC += 2;
                                break;
                            case 0x1: // 8xy1: Set Vx = Vx | Vy
                                this.V[x] |= this.V[y];
                                this.PC += 2;
                                break;
                            case 0x2: // 8xy2: Set Vx = Vx & Vy
                                this.V[x] &= this.V[y];
                                this.PC += 2;
                                break;
                            case 0x3: // 8xy3: Set Vx = Vx ^ Vy
                                this.V[x] ^= this.V[y];
                                this.PC += 2;
                                break;
                            case 0x4: // 8xy4: Add Vy to Vx, set VF = carry
                                const sum = this.V[x] + this.V[y];
                                this.V[0xF] = sum > 255 ? 1 : 0;
                                this.V[x] = sum & 0xFF;
                                this.PC += 2;
                                break;
                            case 0x5: // 8xy5: Subtract Vy from Vx, set VF = !borrow
                                this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
                                this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
                                this.PC += 2;
                                break;
                            case 0x6: // 8xy6: Shift Vx right by 1, set VF = LSB
                                this.V[0xF] = this.V[x] & 0x1;
                                this.V[x] >>= 1;
                                this.PC += 2;
                                break;
                            case 0x7: // 8xy7: Set Vx = Vy - Vx, set VF = !borrow
                                this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
                                this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
                                this.PC += 2;
                                break;
                            case 0xE: // 8xyE: Shift Vx left by 1, set VF = MSB
                                this.V[0xF] = (this.V[x] & 0x80) >> 7;
                                this.V[x] = (this.V[x] << 1) & 0xFF;
                                this.PC += 2;
                                break;
                            default:
                                this.PC += 2;
                                break;
                        }
                        break;
                        
                    case 0x9000: // 9xy0: Skip if Vx != Vy
                        this.PC += (this.V[x] !== this.V[y]) ? 4 : 2;
                        break;
                        
                    case 0xA000: // Annn: Set I = nnn
                        this.I = nnn;
                        this.PC += 2;
                        break;
                        
                    case 0xB000: // Bnnn: Jump to nnn + V0
                        this.PC = nnn + this.V[0];
                        break;
                        
                    case 0xC000: // Cxnn: Set Vx = random & nn
                        this.V[x] = (Math.random() * 256) & nn;
                        this.PC += 2;
                        break;
                        
                    case 0xD000: // Dxy n: Draw sprite at (Vx, Vy) with height n
                        this.V[0xF] = 0;
                        const xPos = this.V[x] % 64;
                        const yPos = this.V[y] % 32;
                        
                        for (let row = 0; row < n; row++) {
                            const spriteByte = this.memory[this.I + row];
                            for (let col = 0; col < 8; col++) {
                                if ((spriteByte & (0x80 >> col)) !== 0) {
                                    const pixelX = (xPos + col) % 64;
                                    const pixelY = (yPos + row) % 32;
                                    const index = pixelY * 64 + pixelX;
                                    
                                    if (this.display[index] === 1) {
                                        this.V[0xF] = 1;
                                    }
                                    
                                    this.display[index] ^= 1;
                                }
                            }
                        }
                        
                        this.drawFlag = true;
                        this.PC += 2;
                        break;
                        
                    case 0xE000:
                        switch (nn) {
                            case 0x9E: // Ex9E: Skip if key Vx is pressed
                                this.PC += (this.keys[this.V[x] & 0xF]) ? 4 : 2;
                                break;
                            case 0xA1: // ExA1: Skip if key Vx is not pressed
                                this.PC += (!this.keys[this.V[x] & 0xF]) ? 4 : 2;
                                break;
                            default:
                                this.PC += 2;
                                break;
                        }
                        break;
                        
                    case 0xF000:
                        switch (nn) {
                            case 0x07: // Fx07: Set Vx = delay timer
                                this.V[x] = this.delayTimer;
                                this.PC += 2;
                                break;
                            case 0x0A: // Fx0A: Wait for key press, store in Vx
                                let keyPressed = false;
                                for (let i = 0; i < 16; i++) {
                                    if (this.keys[i]) {
                                        this.V[x] = i;
                                        keyPressed = true;
                                        break;
                                    }
                                }
                                if (keyPressed) {
                                    this.PC += 2;
                                }
                                break;
                            case 0x15: // Fx15: Set delay timer = Vx
                                this.delayTimer = this.V[x];
                                this.PC += 2;
                                break;
                            case 0x18: // Fx18: Set sound timer = Vx
                                this.soundTimer = this.V[x];
                                this.PC += 2;
                                break;
                            case 0x1E: // Fx1E: Add Vx to I
                                this.I = (this.I + this.V[x]) & 0xFFF;
                                this.PC += 2;
                                break;
                            case 0x29: // Fx29: Set I = font sprite for digit Vx
                                this.I = (this.V[x] & 0xF) * 5;
                                this.PC += 2;
                                break;
                            case 0x33: // Fx33: Store BCD of Vx at I, I+1, I+2
                                this.memory[this.I] = Math.floor(this.V[x] / 100);
                                this.memory[this.I + 1] = Math.floor((this.V[x] % 100) / 10);
                                this.memory[this.I + 2] = this.V[x] % 10;
                                this.PC += 2;
                                break;
                            case 0x55: // Fx55: Store V0 to Vx in memory starting at I
                                for (let i = 0; i <= x; i++) {
                                    this.memory[this.I + i] = this.V[i];
                                }
                                this.I += x + 1;
                                this.PC += 2;
                                break;
                            case 0x65: // Fx65: Load V0 to Vx from memory starting at I
                                for (let i = 0; i <= x; i++) {
                                    this.V[i] = this.memory[this.I + i];
                                }
                                this.I += x + 1;
                                this.PC += 2;
                                break;
                            default:
                                this.PC += 2;
                                break;
                        }
                        break;
                        
                    default:
                        this.PC += 2;
                        break;
                }
            }
            
            draw() {
                if (!this.drawFlag) return;
                
                const canvas = document.getElementById('chip8Canvas');
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                
                for (let i = 0; i < this.display.length; i++) {
                    if (this.display[i]) {
                        const x = i % 64;
                        const y = Math.floor(i / 64);
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
                
                this.drawFlag = false;
            }
            
            updateTimers() {
                if (this.delayTimer > 0) this.delayTimer--;
                if (this.soundTimer > 0) this.soundTimer--;
            }
            
            setKey(key, pressed) {
                if (key >= 0 && key < 16) {
                    this.keys[key] = pressed ? 1 : 0;
                    this.updateKeypadUI();
                }
            }
            
            updateKeypadUI() {
                const keypad = document.getElementById('keypad');
                const keys = keypad.querySelectorAll('.key');
                
                for (let i = 0; i < 16; i++) {
                    if (this.keys[i]) {
                        keys[i].classList.add('active');
                    } else {
                        keys[i].classList.remove('active');
                    }
                }
            }
        }

        // Initialize emulator
        const chip8 = new Chip8();
        let animationFrameId = null;
        let lastTime = 0;
        let isRunning = false;
        let instructionsPerFrame = 50;

        // Create keypad UI
        const keypad = document.getElementById('keypad');
        const keyMap = ['1', '2', '3', '4', 'Q', 'W', 'E', 'R', 'A', 'S', 'D', 'F', 'Z', 'X', 'C', 'V'];
        const keyLabels = ['1', '2', '3', '4', 'Q', 'W', 'E', 'R', 'A', 'S', 'D', 'F', 'Z', 'X', 'C', 'V'];
        
        for (let i = 0; i < 16; i++) {
            const keyDiv = document.createElement('div');
            keyDiv.className = 'key';
            keyDiv.textContent = keyLabels[i];
            keyDiv.dataset.key = i;
            keypad.appendChild(keyDiv);
        }

        // Keyboard event handlers
        document.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            const index = keyMap.indexOf(key);
            if (index !== -1) {
                chip8.setKey(index, true);
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toUpperCase();
            const index = keyMap.indexOf(key);
            if (index !== -1) {
                chip8.setKey(index, false);
            }
        });

        // Control buttons
        document.getElementById('btnRun').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                lastTime = performance.now();
                gameLoop();
            }
        });

        document.getElementById('btnPause').addEventListener('click', () => {
            isRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });

        document.getElementById('btnStep').addEventListener('click', () => {
            chip8.cycle();
            chip8.draw();
            updateDebugger();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            isRunning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            chip8.init();
            chip8.draw();
            updateDebugger();
            document.getElementById('statusMessage').textContent = 'Reset';
        });

        // Speed control
        document.getElementById('speedRange').addEventListener('input', (e) => {
            instructionsPerFrame = parseInt(e.target.value);
            document.getElementById('speedValue').textContent = instructionsPerFrame;
        });

        // File loading
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const rom = new Uint8Array(event.target.result);
                    chip8.loadROM(rom);
                    chip8.draw();
                    updateDebugger();
                    document.getElementById('statusMessage').textContent = `Loaded: ${file.name}`;
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Game loop
        function gameLoop() {
            if (!isRunning) return;
            
            const currentTime = performance.now();
            const deltaTime = currentTime - lastTime;
            
            if (deltaTime >= 16.67) { // ~60 FPS
                // Execute instructions
                for (let i = 0; i < instructionsPerFrame; i++) {
                    chip8.cycle();
                }
                
                // Update timers
                chip8.updateTimers();
                
                // Draw
                chip8.draw();
                
                // Update debugger
                updateDebugger();
                
                lastTime = currentTime;
            }
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Update debugger UI
        function updateDebugger() {
            document.getElementById('debugPC').textContent = `0x${chip8.PC.toString(16).padStart(4, '0').toUpperCase()}`;
            document.getElementById('debugI').textContent = `0x${chip8.I.toString(16).padStart(4, '0').toUpperCase()}`;
            document.getElementById('debugDT').textContent = chip8.delayTimer.toString().padStart(2, '0');
            document.getElementById('debugST').textContent = chip8.soundTimer.toString().padStart(2, '0');
            
            // Update registers
            const registersDiv = document.getElementById('debugRegisters');
            registersDiv.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const row = document.createElement('div');
                row.className = 'debugger-row';
                row.innerHTML = `<span>V${i.toString(16).toUpperCase()}: 0x${chip8.V[i].toString(16).padStart(2, '0').toUpperCase()}</span>`;
                registersDiv.appendChild(row);
            }
            
            // Update stack
            const stackList = document.getElementById('debugStack');
            stackList.innerHTML = '';
            for (let i = 0; i < chip8.sp; i++) {
                const li = document.createElement('li');
                li.textContent = `0x${chip8.stack[i].toString(16).padStart(4, '0').toUpperCase()}`;
                stackList.appendChild(li);
            }
            
            // Update current instruction
            const opcode = (chip8.memory[chip8.PC] << 8) | chip8.memory[chip8.PC + 1];
            document.getElementById('debugInstruction').textContent = `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
        }

        // Initial draw
        chip8.draw();
        updateDebugger();
    </script>
</body>
</html>
