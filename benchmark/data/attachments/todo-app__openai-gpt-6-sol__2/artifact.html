<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf7f2">
  <title>Today, made simple. — Todo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292723;
      background: #faf7f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f4a37d;
      outline-offset: 3px;
    }

    .page {
      width: min(100% - 40px, 640px);
      margin: 0 auto;
      padding: clamp(48px, 10vh, 112px) 0 48px;
    }

    .intro {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #bc6245;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.35rem);
      font-weight: 750;
      letter-spacing: -0.055em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 14px 0 0;
      color: #77716a;
      font-size: 1rem;
      line-height: 1.6;
    }

    .card {
      overflow: hidden;
      border: 1px solid #eee8df;
      border-radius: 20px;
      background: #fffefd;
      box-shadow: 0 18px 55px rgb(71 52 31 / 7%), 0 3px 12px rgb(71 52 31 / 3%);
    }

    .add-form {
      display: flex;
      gap: 12px;
      padding: 24px;
      border-bottom: 1px solid #f0ebe5;
    }

    .task-input {
      width: 100%;
      min-width: 0;
      padding: 13px 16px;
      border: 1px solid #e9e3dc;
      border-radius: 11px;
      background: #fcfaf7;
      color: #292723;
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .task-input::placeholder {
      color: #9b948c;
    }

    .task-input:focus {
      border-color: #db896b;
      background: #fff;
    }

    .add-button {
      flex: none;
      padding: 0 20px;
      border: 1px solid #ce7655;
      border-radius: 11px;
      background: #d97957;
      color: #fff;
      font-weight: 650;
      white-space: nowrap;
      transition: background 0.2s, transform 0.2s;
    }

    .add-button:hover {
      background: #c96b4a;
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 68px;
      padding: 14px 24px;
      border-bottom: 1px solid #f3eee9;
    }

    .task-checkbox {
      flex: none;
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: #d97957;
      cursor: pointer;
    }

    .task-label {
      flex: 1;
      min-width: 0;
      color: #39352f;
      line-height: 1.5;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .task.is-complete .task-label {
      color: #a09a93;
      text-decoration: line-through;
      text-decoration-color: #aaa39a;
    }

    .delete-button {
      display: grid;
      flex: none;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #aaa29a;
      font-size: 1.4rem;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }

    .delete-button:hover {
      background: #fff0e9;
      color: #bd6247;
    }

    .empty-state {
      padding: 54px 24px 58px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 17px;
      border-radius: 15px;
      background: #fff0e8;
      color: #d97957;
      font-size: 1.5rem;
    }

    .empty-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .empty-description {
      margin: 7px 0 0;
      color: #837c74;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 24px;
      border-top: 1px solid #f0ebe5;
    }

    .remaining {
      margin: 0;
      color: #817a72;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .filter-button {
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #777068;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }

    .filter-button:hover {
      background: #faf3ee;
      color: #a9573d;
    }

    .filter-button[aria-pressed="true"] {
      border-color: #f2dfd3;
      background: #fff0e8;
      color: #ad5639;
    }

    @media (max-width: 480px) {
      .page {
        width: min(100% - 28px, 640px);
        padding-top: 48px;
      }

      .add-form {
        gap: 8px;
        padding: 16px;
      }

      .add-button {
        padding: 0 15px;
      }

      .task {
        padding-right: 16px;
        padding-left: 16px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Your little corner of calm</p>
      <h1>Today, made simple.</h1>
      <p class="subtitle">Keep the important things in sight, one task at a time.</p>
    </header>

    <section class="card" aria-label="Todo list">
      <form class="add-form" id="add-form">
        <input class="task-input" id="task-input" type="text" placeholder="What needs to get done?" aria-label="New task" autocomplete="off" maxlength="240">
        <button class="add-button" type="submit">Add task</button>
      </form>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">✓</span>
        <p class="empty-title" id="empty-title"></p>
        <p class="empty-description" id="empty-description"></p>
      </div>

      <footer class="footer">
        <p class="remaining" id="remaining" aria-live="polite"></p>
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = "today-made-simple-todos";
      const form = document.getElementById("add-form");
      const input = document.getElementById("task-input");
      const list = document.getElementById("task-list");
      const emptyState = document.getElementById("empty-state");
      const emptyTitle = document.getElementById("empty-title");
      const emptyDescription = document.getElementById("empty-description");
      const remaining = document.getElementById("remaining");
      const filterButtons = document.querySelectorAll(".filter-button");
      const emptyMessages = {
        all: ["A fresh start.", "Add a task above to get things moving."],
        active: ["All caught up!", "There are no active tasks right now."],
        completed: ["Nothing completed yet.", "Finished tasks will show up here."]
      };

      let fallbackId = 0;
      let currentFilter = "all";

      function createId() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        fallbackId += 1;
        return `${Date.now()}-${fallbackId}-${Math.random().toString(36).slice(2)}`;
      }

      function loadTodos() {
        try {
          const stored = JSON.parse(localStorage.getItem(storageKey));
          if (!Array.isArray(stored)) return [];
          return stored
            .filter(todo =>
              todo !== null &&
              typeof todo === "object" &&
              typeof todo.id === "string" &&
              todo.id.length > 0 &&
              typeof todo.text === "string" &&
              todo.text.trim().length > 0 &&
              typeof todo.completed === "boolean"
            )
            .map(todo => ({
              id: todo.id,
              text: todo.text.trim(),
              completed: todo.completed
            }));
        } catch {
          return [];
        }
      }

      const todos = loadTodos();

      function saveTodos() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(todos));
        } catch {
          // Tasks remain available for this session if storage is unavailable.
        }
      }

      function render() {
        const visible = todos.filter(todo =>
          currentFilter === "all" ||
          (currentFilter === "active" && !todo.completed) ||
          (currentFilter === "completed" && todo.completed)
        );

        list.replaceChildren();

        for (const todo of visible) {
          const item = document.createElement("li");
          item.className = todo.completed ? "task is-complete" : "task";

          const checkbox = document.createElement("input");
          checkbox.className = "task-checkbox";
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.id = `task-${todo.id}`;
          checkbox.setAttribute("aria-label", `${todo.completed ? "Mark as active" : "Mark as complete"}: ${todo.text}`);
          checkbox.addEventListener("change", () => {
            todo.completed = checkbox.checked;
            saveTodos();
            render();
          });

          const label = document.createElement("label");
          label.className = "task-label";
          label.htmlFor = checkbox.id;
          label.textContent = todo.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", `Delete task: ${todo.text}`);
          deleteButton.addEventListener("click", () => {
            todos.splice(todos.indexOf(todo), 1);
            saveTodos();
            render();
          });

          item.append(checkbox, label, deleteButton);
          list.append(item);
        }

        emptyState.hidden = visible.length !== 0;
        if (visible.length === 0) {
          emptyTitle.textContent = emptyMessages[currentFilter][0];
          emptyDescription.textContent = emptyMessages[currentFilter][1];
        }

        const activeCount = todos.filter(todo => !todo.completed).length;
        remaining.textContent = `${activeCount} ${activeCount === 1 ? "task" : "tasks"} remaining`;

        for (const button of filterButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }

        todos.push({ id: createId(), text, completed: false });
        input.value = "";
        saveTodos();
        render();
        input.focus();
      });

      for (const button of filterButtons) {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          render();
        });
      }

      render();
    })();
  </script>
</body>
</html>
