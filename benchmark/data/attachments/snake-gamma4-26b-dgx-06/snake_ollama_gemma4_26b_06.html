<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Pro - Multi-Mode</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --p1-color: #4caf50;
            --p2-color: #f44336;
            --food-color: #ffeb3b;
            --accent-color: #2196f3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 5px solid #444;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            transition: opacity 0.3s;
        }

        .menu-panel {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
        }

        h1 { margin-top: 0; color: var(--accent-color); }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: transform 0.1s, background 0.2s;
        }

        .menu-btn:hover {
            background: #1976d2;
            transform: scale(1.05);
        }

        #score-board {
            position: absolute;
            top: -40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2em;
        }

        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        .hidden { display: none !important; }

        #game-over-text {
            font-size: 2em;
            margin-bottom: 20px;
            color: var(--p2-color);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">
            <span class="p1-score">P1: <span id="score1">0</span></span>
            <span class="p2-score">P2: <span id="score2">0</span></span>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Start Menu -->
        <div id="ui-layer">
            <div id="start-menu" class="menu-panel">
                <h1>SNAKE PRO</h1>
                <button class="menu-btn" onclick="startGame('HvsH')">Human vs Human</button>
                <button class="menu-btn" onclick="startGame('CvsH')">CPU vs Human</button>
                <button class="menu-btn" onclick="startGame('CvsC')">CPU vs CPU</button>
                <div class="controls-hint">
                    P1: WASD | P2: Arrow Keys
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="menu-panel hidden">
                <div id="game-over-text">GAME OVER</div>
                <div id="winner-text" style="margin-bottom: 20px;"></div>
                <button class="menu-btn" onclick="resetToMenu()">Main Menu</button>
                <p style="font-size: 0.8em; color: #888;">Press any key to restart</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const tileSize = canvas.width / gridSize;

        let gameLoop;
        let gameActive = false;
        let gameMode = 'HvsH'; // HvsH, CvsH, CvsC
        let food = { x: 15, y: 15 };

        let player1 = {
            body: [{x: 5, y: 15}, {x: 4, y: 15}, {x: 3, y: 15}],
            dir: {x: 1, y: 0},
            nextDir: {x: 1, y: 0},
            color: '#4caf50',
            score: 0,
            isCPU: false,
            isDead: false
        };

        let player2 = {
            body: [{x: 25, y: 15}, {x: 26, y: 15}, {x: 27, y: 15}],
            dir: {x: -1, y: 0},
            nextDir: {x: -1, y: 0},
            color: '#f44336',
            score: 0,
            isCPU: false,
            isDead: false
        };

        // Input Handling
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (gameActive === false && !document.getElementById('start-menu').classList.contains('hidden')) {
                // Allow restart with any key if game over
                if (document.getElementById('game-over-screen').classList.contains('hidden') === false) {
                    resetToMenu();
                }
            }
            handleInput();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function handleInput() {
            // Player 1: WASD
            if (!player1.isCPU) {
                if (keys['w'] && player1.dir.y === 0) player1.nextDir = {x: 0, y: -1};
                if (keys['s'] && player1.dir.y === 0) player1.nextDir = {x: 0, y: 1};
                if (keys['a'] && player1.dir.x === 0) player1.nextDir = {x: -1, y: 0};
                if (keys['d'] && player1.dir.x === 0) player1.nextDir = {x: 1, y: 0};
            }

            // Player 2: Arrows
            if (!player2.isCPU) {
                if (keys['arrowup'] && player2.dir.y === 0) player2.nextDir = {x: 0, y: -1};
                if (keys['arrowdown'] && player2.dir.y === 0) player2.nextDir = {x: 0, y: 1};
                if (keys['arrowleft'] && player2.dir.x === 0) player2.nextDir = {x: -1, y: 0};
                if (keys['arrowright'] and player2.dir.x === 0) player2.nextDir = {x: 1, y: 0};
                // Fix for arrow keys logic in JS
                if (keys['arrowup'] && player2.dir.y === 0) player2.nextDir = {x: 0, y: -1};
                if (keys['arrowdown'] && player2.dir.y === 0) player2.nextDir = {x: 0, y: 1};
                if (keys['arrowleft'] && player2.dir.x === 0) player2.nextDir = {x: -1, y: 0};
                if (keys['arrowright'] && player2.dir.x === 0) player2.nextDir = {x: 1, y: 0};
            }
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('start-menu').classList.add('hidden');
            document.toElement = document.getElementById('game-over-screen'); // dummy
            document.getElementById('game-over-screen').classList.add('hidden');
            
            player1.isCPU = (mode === 'CvsH' || mode === 'CvsC');
            player2.isCPU = (mode === 'CvsC');
            
            resetPlayers();
            spawnFood();
            gameActive = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        function resetPlayers() {
            player1.body = [{x: 5, y: 15}, {x: 4, y: 15}, {x: 3, y: 15}];
            player1.dir = {x: 1, y: 0};
            player1.nextDir = {x: 1, y: 0};
            player1.score = 0;
            player1.isDead = false;

            player2.body = [{x: 25, y: 1            5}, {x: 26, y: 15}, {x: 27, y: 15}];
            player2.dir = {x: -1, y: 0};
            player2.nextDir = {x: -1, y: 0};
            player2.score = 0;
            player2.isDead = false;

            updateScoreUI();
        }

        function resetToMenu() {
            gameActive = false;
            clearInterval(gameLoop);
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('start-menu').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            // Don't spawn food on snake bodies
            if (checkCollision(player1.body, food) || checkCollision(player2.body, food)) {
                spawnFood();
            }
        }

        function checkCollision(body, target) {
            return body.some(part => part.x === target.x && part.y === target.y);
        }

        function update() {
            if (!gameActive) return;

            updatePlayer(player1);
            updatePlayer(player2);

            checkFoodCollision(player1);
            checkFoodCollision(player2);

            checkWallCollision(player1);
            checkWallCollision(player2);
            checkSelfCollision(player1);
            checkSelfCollision(player2);

            // Check if one player died and the other is still alive
            if (player1.isDead && player2.isDead) endGame("Draw!");
            else if (player1.isDead) endGame("Player 2 Wins!");
            else if (player2.isDead) endGame("Player 1 Wins!");

            draw();
        }

        function updatePlayer(p) {
            if (p.isDead) return;

            if (p.isCPU) {
                runAI(p);
            }

            p.dir = p.nextDir;
            const head = { x: p.body[0].x + p.dir.x, y: p.body[0].y + p.dir.y };
            p.body.unshift(head);
            p.body.pop();
        }

        function runAI(p) {
            // Simple AI: Move towards food
            const head = p.body[0];
            let dx = food.x - head.x;
            let dy = food.y - head.y;

            let newDir = { x: 0, y: 0 };

            // Prioritize horizontal then vertical
            if (Math.abs(dx) > Math.abs(dy)) {
                newDir.x = dx > 0 ? 1 : -1;
            } else {
                newDir.y = dy > 0 ? 1 : -1;
            }

            // Prevent 180 degree turns
            if ((newDir.x !== 0 && p.dir.x === -newDir.x) || 
                (newDir.y !== 0 && p.dir.y === -newDir.y)) {
                // Try alternative
                if (newDir.x !== 0) {
                    newDir.x = 0;
                    newDir.y = dy > 0 ? 1 : -1;
                } else {
                    newDir.y = 0;
                    newDir.x = dx > 0 ? 1 : -1;
                }
            }
            
            p.nextDir = newDir;
        }

        function checkFoodCollision(p) {
            if (p.isDead) return;
            if (p.body[0].x === food.x && p.body[0].y === food.y) {
                p.score += 10;
                p.body.push({ ...p.body[p.body.length - 1] });
                updateScoreUI();
                spawnFood();
            }
        }

        function checkWallCollision(p) {
            if (p.isDead) return;
            const head = p.body[0];
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                p.isDead = true;
            }
        }

        function checkSelfCollision(p) {
            if (p.isDead) return;
            const head = p.body[0];
            for (let i = 1; i < p.body.length; i++) {
                if (p.body[i].x === head.x && p.body[i].y === head.y) {
                    p.isDead = true;
                    break;
                }
            }
        }

        function updateScoreUI() {
            document.getElementById('score1').innerText = player1.score;
            document.getElementById('score2').innerText = player2.score;
        }

        function endGame(message) {
            gameActive = false;
            clearInterval(gameLoop);
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-text').innerText = "GAME OVER";
            document.getElementById('winner-text').innerText = message;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (subtle)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(food.x * tileSize + tileSize/2, food.y * tileSize + tileSize/2, tileSize/2.5, 0, Math.PI * 2);
            ctx.fill();

            // Draw Players
            drawSnake(player1);
            drawSnake(player2);
        }

        function drawSnake(p) {
            if (p.isDead) return;
            ctx.fillStyle = p.color;
            p.body.forEach((part, index) => {
                // Head is slightly different
                if (index === 0) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(part.x * tileSize + 1, part.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        // Initial Draw
        draw();
    </script>
</body>
</html>
