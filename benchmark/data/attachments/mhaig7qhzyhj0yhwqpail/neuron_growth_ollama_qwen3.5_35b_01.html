<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px #101a3a;
            border-radius: 4px;
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 229, 255, 0.08) 0px,
                rgba(0, 229, 255, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            mix-blend-mode: overlay;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                transparent 0%,
                transparent 60%,
                rgba(0, 0, 0, 0.6) 100%
            );
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuronCanvas" width="800" height="800"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        let neurons = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let animationId = null;

        const colors = {
            background: '#05070f',
            backgroundGlow: '#101a3a',
            branch: '#00e5ff',
            accent: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            ui: '#ffd400'
        };

        const params = {
            growth: {
                neuronCount: 4,
                growthSpeed: 1.5,
                maxDepth: 8,
                splitChance: 0.3,
                curvature: 0.3,
                maxBranchLength: 120
            },
            synapses: {
                distanceThreshold: 60,
                glowStrength: 20
            },
            pulses: {
                pulseSpeed: 2,
                pulseFrequency: 0.02,
                pulseBrightness: 1
            },
            visuals: {
                bgColor: colors.background,
                branchColor: colors.branch,
                accentColor: colors.accent,
                synapseColor: colors.synapse,
                pulseColor: colors.pulse
            }
        };

        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(params.growth, 'neuronCount', 3, 6).name('Neuron Count').onChange(regenerateNetwork);
        growthFolder.add(params.growth, 'growthSpeed', 0.5, 3).name('Growth Speed');
        growthFolder.add(params.growth, 'maxDepth', 5, 12).name('Max Depth').onChange(regenerateNetwork);
        growthFolder.add(params.growth, 'splitChance', 0.1, 0.6).name('Split Chance');
        growthFolder.add(params.growth, 'curvature', 0.1, 0.8).name('Curvature');
        growthFolder.add(params.growth, 'maxBranchLength', 80, 200).name('Max Length').onChange(regenerateNetwork);
        
        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(params.synapses, 'distanceThreshold', 30, 100).name('Distance Threshold').onChange(regenerateNetwork);
        synapsesFolder.add(params.synapses, 'glowStrength', 10, 40).name('Glow Strength');
        
        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(params.pulses, 'pulseSpeed', 1, 5).name('Pulse Speed');
        pulsesFolder.add(params.pulses, 'pulseFrequency', 0.01, 0.05).name('Pulse Frequency');
        pulsesFolder.add(params.pulses, 'pulseBrightness', 0.5, 2).name('Pulse Brightness');
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(params.visuals, 'bgColor').name('Background').onChange(updateColors);
        visualsFolder.addColor(params.visuals, 'branchColor').name('Branch Color').onChange(updateColors);
        visualsFolder.addColor(params.visuals, 'accentColor').name('Accent Color').onChange(updateColors);
        visualsFolder.addColor(params.visuals, 'synapseColor').name('Synapse Color').onChange(updateColors);
        visualsFolder.addColor(params.visuals, 'pulseColor').name('Pulse Color').onChange(updateColors);
        
        gui.add({
            regenerate: () => regenerateNetwork(),
            clear: () => clearCanvas(),
            togglePause: () => togglePause()
        }, 'regenerate').name('Regenerate Network');
        gui.add({ clear: () => clearCanvas() }, 'clear').name('Clear Canvas');
        gui.add({ togglePause: () => togglePause() }, 'togglePause').name('Pause/Resume');

        function updateColors() {
            canvas.style.backgroundColor = params.visuals.bgColor;
        }

        function togglePause() {
            isPaused = !isPaused;
            if (!isPaused && !animationId) {
                animate();
            }
        }

        function clearCanvas() {
            neurons = [];
            synapses = [];
            pulses = [];
            ctx.clearRect(0, 0, width, height);
        }

        function regenerateNetwork() {
            clearCanvas();
            const count = Math.floor(params.growth.neuronCount);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const distance = 30;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                neurons.push({
                    x: x,
                    y: y,
                    angle: angle,
                    depth: 0,
                    length: 0,
                    thickness: 3,
                    isSeed: true,
                    children: []
                });
            }
        }

        function getBranchColor(depth, isAccent) {
            if (isAccent && depth % 2 === 0) {
                return params.visuals.accentColor;
            }
            return params.visuals.branchColor;
        }

        function growBranch(neuron, targetDepth) {
            if (neuron.depth >= targetDepth || neuron.length >= params.growth.maxBranchLength) {
                return;
            }

            const speed = params.growth.growthSpeed;
            const curvature = params.growth.curvature;
            const maxLen = params.growth.maxBranchLength;

            neuron.length += speed;
            neuron.angle += (Math.random() - 0.5) * curvature;
            neuron.x += Math.cos(neuron.angle) * speed;
            neuron.y += Math.sin(neuron.angle) * speed;

            neuron.thickness = Math.max(0.5, 3 - neuron.depth * 0.3);

            if (neuron.length >= maxLen || neuron.depth >= targetDepth) {
                return;
            }

            if (Math.random() < params.growth.splitChance && neuron.depth < targetDepth - 1) {
                const child = {
                    x: neuron.x,
                    y: neuron.y,
                    angle: neuron.angle + (Math.random() - 0.5) * 1.5,
                    depth: neuron.depth + 1,
                    length: 0,
                    thickness: neuron.thickness * 0.7,
                    isSeed: false,
                    children: []
                };
                neuron.children.push(child);
                growBranch(child, targetDepth);
            }

            if (neuron.children.length === 0 && neuron.depth < targetDepth - 1 && Math.random() < 0.3) {
                const child = {
                    x: neuron.x,
                    y: neuron.y,
                    angle: neuron.angle + (Math.random() - 0.5) * 2,
                    depth: neuron.depth + 1,
                    length: 0,
                    thickness: neuron.thickness * 0.6,
                    isSeed: false,
                    children: []
                };
                neuron.children.push(child);
                growBranch(child, targetDepth);
            }
        }

        function drawBranch(neuron, depth) {
            ctx.beginPath();
            ctx.moveTo(neuron.x, neuron.y);
            
            if (neuron.children.length > 0) {
                const child = neuron.children[0];
                const midX = (neuron.x + child.x) / 2;
                const midY = (neuron.y + child.y) / 2;
                ctx.quadraticCurveTo(neuron.x, neuron.y, midX, midY);
                
                for (let i = 1; i < neuron.children.length; i++) {
                    const nextChild = neuron.children[i];
                    const nextMidX = (child.x + nextChild.x) / 2;
                    const nextMidY = (child.y + nextChild.y) / 2;
                    ctx.quadraticCurveTo(child.x, child.y, nextMidX, nextMidY);
                    child.x = nextChild.x;
                    child.y = nextChild.y;
                }
            }

            const color = getBranchColor(depth, false);
            ctx.strokeStyle = color;
            ctx.lineWidth = neuron.thickness;
            ctx.lineCap = 'round';
            ctx.shadowBlur = params.synapses.glowStrength;
            ctx.shadowColor = color;
            ctx.stroke();
            ctx.shadowBlur = 0;

            neuron.children.forEach(child => {
                drawBranch(child, depth + 1);
            });
        }

        function checkSynapses() {
            const threshold = params.synapses.distanceThreshold;
            const allTips = getAllTips(neurons);
            
            for (let i = 0; i < allTips.length; i++) {
                for (let j = i + 1; j < allTips.length; j++) {
                    const tip1 = allTips[i];
                    const tip2 = allTips[j];
                    const dx = tip1.x - tip2.x;
                    const dy = tip1.y - tip2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < threshold) {
                        const synapseExists = synapses.some(s => 
                            (s.tip1 === tip1 && s.tip2 === tip2) || 
                            (s.tip1 === tip2 && s.tip2 === tip1)
                        );
                        
                        if (!synapseExists) {
                            synapses.push({
                                tip1: tip1,
                                tip2: tip2,
                                progress: 0,
                                lastPulse: 0
                            });
                        }
                    }
                }
            }
        }

        function getAllTips(neuronsList) {
            let tips = [];
            neuronsList.forEach(neuron => {
                if (neuron.children.length === 0) {
                    tips.push(neuron);
                } else {
                    tips = tips.concat(getAllTips(neuron.children));
                }
            });
            return tips;
        }

        function drawSynapses() {
            synapses.forEach(synapse => {
                const dx = synapse.tip2.x - synapse.tip1.x;
                const dy = synapse.tip2.y - synapse.tip1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 0) {
                    const pulseX = synapse.tip1.x + dx * synapse.progress;
                    const pulseY = synapse.tip1.y + dy * synapse.progress;
                    
                    ctx.beginPath();
                    ctx.moveTo(synapse.tip1.x, synapse.tip1.y);
                    ctx.lineTo(synapse.tip2.x, synapse.tip2.y);
                    ctx.strokeStyle = params.visuals.synapseColor;
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = params.synapses.glowStrength;
                    ctx.shadowColor = params.visuals.synapseColor;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    
                    if (synapse.progress > 0.1 && synapse.progress < 0.9) {
                        ctx.beginPath();
                        ctx.arc(pulseX, pulseY, 3, 0, Math.PI * 2);
                        ctx.fillStyle = params.visuals.pulseColor;
                        ctx.shadowBlur = params.synapses.glowStrength * 1.5;
                        ctx.shadowColor = params.visuals.pulseColor;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            });
        }

        function animatePulses() {
            const now = Date.now();
            
            synapses.forEach(synapse => {
                if (Math.random() < params.pulses.pulseFrequency) {
                    synapse.lastPulse = now;
                }
                
                if (now - synapse.lastPulse < 1000) {
                    synapse.progress += params.pulses.pulseSpeed * 0.016;
                    if (synapse.progress >= 1) {
                        synapse.progress = 0;
                        synapse.lastPulse = now;
                    }
                }
            });
        }

        function draw() {
            ctx.fillStyle = params.visuals.bgColor;
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = params.visuals.backgroundGlow;
            
            neurons.forEach(neuron => {
                drawBranch(neuron, 0);
            });
            
            ctx.restore();
            
            drawSynapses();
        }

        function animate() {
            if (!isPaused) {
                neurons.forEach(neuron => {
                    growBranch(neuron, params.growth.maxDepth);
                });
                
                checkSynapses();
                animatePulses();
                draw();
            }
            
            animationId = requestAnimationFrame(animate);
        }

        regenerateNetwork();
        animate();
    </script>
</body>
</html>
