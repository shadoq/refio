<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 32px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    h1 {
      text-align: center;
      color: rgba(255,255,255,0.95);
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Input area */
    .input-row {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .toggle-all {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #764ba2;
      flex-shrink: 0;
    }

    #new-todo {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.1rem;
      color: #333;
      background: transparent;
      caret-color: #764ba2;
    }

    #new-todo::placeholder { color: #bbb; font-style: italic; }

    .add-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .add-btn:hover { opacity: 0.88; }
    .add-btn:active { transform: scale(0.96); }

    /* Todo list */
    #todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #f5f5f5;
      gap: 14px;
      animation: slideIn 0.22s ease;
      transition: background 0.15s;
    }

    .todo-item:hover { background: #fafafa; }
    .todo-item:last-child { border-bottom: none; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-check {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #764ba2;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1.05rem;
      color: #333;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
      opacity: 0;
    }

    .todo-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #e74c3c; background: #fdecea; }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .item-count {
      font-size: 0.85rem;
      color: #999;
      min-width: 80px;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.85rem;
      color: #777;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: #ccc; }
    .filter-btn.active {
      border-color: #764ba2;
      color: #764ba2;
      font-weight: 600;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      color: #999;
      cursor: pointer;
      transition: color 0.2s;
      min-width: 80px;
      text-align: right;
    }

    .clear-btn:hover { color: #e74c3c; }
    .clear-btn:empty { visibility: hidden; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #ccc;
      font-size: 0.95rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>todos</h1>
    <div class="card">
      <div class="input-row">
        <input type="checkbox" class="toggle-all" id="toggle-all" title="Mark all complete"/>
        <input type="text" id="new-todo" placeholder="What needs to be done?" maxlength="200" autocomplete="off"/>
        <button class="add-btn" id="add-btn">Add</button>
      </div>

      <ul id="todo-list"></ul>

      <div class="footer" id="footer" style="display:none;">
        <span class="item-count" id="item-count"></span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="clear-btn" id="clear-completed"></button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todos_app_v1';

    let todos = [];
    let filter = 'all';

    // --- Persistence ---
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        todos = raw ? JSON.parse(raw) : [];
      } catch { todos = []; }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // --- Helpers ---
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function getFiltered() {
      if (filter === 'active')    return todos.filter(t => !t.done);
      if (filter === 'completed') return todos.filter(t => t.done);
      return todos;
    }

    // --- Render ---
    function render() {
      const list = document.getElementById('todo-list');
      const footer = document.getElementById('footer');
      const itemCount = document.getElementById('item-count');
      const clearBtn = document.getElementById('clear-completed');
      const toggleAll = document.getElementById('toggle-all');

      const filtered = getFiltered();
      const activeCount = todos.filter(t => !t.done).length;
      const completedCount = todos.filter(t => t.done).length;

      // List
      list.innerHTML = '';
      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.textContent = todos.length === 0
          ? 'No todos yet — add one above!'
          : 'Nothing here.';
        list.appendChild(li);
      } else {
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.done ? ' completed' : '');
          li.dataset.id = todo.id;

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'todo-check';
          cb.checked = todo.done;
          cb.addEventListener('change', () => toggleTodo(todo.id));

          const span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.innerHTML = '&times;';
          del.title = 'Delete';
          del.addEventListener('click', () => deleteTodo(todo.id));

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      // Footer
      if (todos.length === 0) {
        footer.style.display = 'none';
      } else {
        footer.style.display = 'flex';
        itemCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
        clearBtn.textContent = completedCount > 0 ? `Clear completed (${completedCount})` : '';
        toggleAll.checked = todos.length > 0 && activeCount === 0;
      }

      // Active filter button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
    }

    // --- Actions ---
    function addTodo(text) {
      text = text.trim();
      if (!text) return;
      todos.push({ id: uid(), text, done: false });
      save();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) { todo.done = !todo.done; save(); render(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.done);
      save();
      render();
    }

    function toggleAll() {
      const allDone = todos.every(t => t.done);
      todos.forEach(t => t.done = !allDone);
      save();
      render();
    }

    // --- Events ---
    document.getElementById('new-todo').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addTodo(e.target.value);
        e.target.value = '';
      }
    });

    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('new-todo');
      addTodo(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('toggle-all').addEventListener('change', toggleAll);
    document.getElementById('clear-completed').addEventListener('click', clearCompleted);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        render();
      });
    });

    // --- Init ---
    load();
    render();
    document.getElementById('new-todo').focus();
  </script>
</body>
</html>
