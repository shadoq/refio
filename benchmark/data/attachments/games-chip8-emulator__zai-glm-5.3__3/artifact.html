<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP-8 Emulator</title>
<style>
  body { background:#181818; color:#ddd; font-family: monospace; margin:20px; }
  h1 { font-size:1.3em; }
  #main { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  canvas { width:640px; height:320px; image-rendering:pixelated; border:1px solid #555; background:#000; }
  #controls { margin:10px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:#333; color:#eee; border:1px solid #666; padding:6px 14px; cursor:pointer; }
  button:hover { background:#444; }
  input[type=number] { width:70px; background:#222; color:#eee; border:1px solid #555; }
  #keypad { display:grid; grid-template-columns:repeat(4,64px); gap:6px; margin-top:12px; }
  #keypad button { padding:10px 0; font-size:1em; line-height:1.2; }
  #keypad button small { display:block; color:#8ab; font-size:0.7em; }
  #keypad button.active { background:#2a6; color:#fff; }
  #dbg { background:#111; border:1px solid #444; padding:12px; white-space:pre; font-size:0.85em; min-width:320px; }
  #romname { color:#8ab; }
</style>
</head>
<body>
<h1>CHIP-8 Emulator</h1>
<div id="main">
  <div>
    <canvas id="screen" width="64" height="32"></canvas>
    <div id="controls">
      <button id="btnRun">Run</button>
      <button id="btnPause">Pause</button>
      <button id="btnStep">Step</button>
      <button id="btnReset">Reset</button>
      <input type="file" id="romfile">
      <label>IPF <input type="number" id="ipf" min="1" max="5000" value="10"></label>
    </div>
    <div id="keypad"></div>
    <div id="romname">ROM: demo</div>
  </div>
  <div id="dbg"></div>
</div>
<script>
"use strict";
// ---------------- Demo ROM (assembled by hand) ----------------
// V1=X, V2=Y. Draw ball sprite, wait ~2 frames, erase, move on keys
// 2=up, 8=down, 4=left, 6=right, redraw, loop.
const DEMO_ROM = new Uint8Array([
  0xA2,0x32,       // 200: LD I, sprite (sprite at 0x232)
  0xD1,0x25,       // 202: DRW V1,V2,5
  // loop (204):
  0x60,0x02,       // 204: LD V0,2
  0xF0,0x15,       // 206: LD DT,V0
  // wait (208):
  0xF0,0x07,       // 208: LD V0,DT
  0x30,0x00,       // 20A: SE V0,0
  0x12,0x08,       // 20C: JP wait
  0xA2,0x32,       // 20E: LD I, sprite
  0xD1,0x25,       // 210: DRW (erase)
  0x63,0x02,0xE3,0xA1,0x72,0xFC, // 212: key2 up   -> V2 -= 4
  0x63,0x08,0xE3,0xA1,0x72,0x04, // 218: key8 down -> V2 += 4
  0x63,0x04,0xE3,0xA1,0x71,0xFC, // 21E: key4 left -> V1 -= 4
  0x63,0x06,0xE3,0xA1,0x71,0x04, // 224: key6 right-> V1 += 4
  0xA2,0x32,       // 22A: LD I, sprite
  0xD1,0x25,       // 22C: DRW V1,V2,5
  0x12,0x04,       // 22E: JP loop
  0x00,0x00,       // 230: pad (sprite begins at 232)
  0x0E,0x1F,0x1B,0x1F,0x0E // 232: ball sprite (5x5)
]);

// ---------------- Font ----------------
const FONT = [
0xF0,0x90,0x90,0x90,0xF0,0x20,0x60,0x20,0x20,0x70,0xF0,0x10,0xF0,0x80,0xF0,
0xF0,0x10,0xF0,0x10,0xF0,0x90,0x90,0xF0,0x10,0x10,0xF0,0x80,0xF0,0x10,0xF0,
0xF0,0x80,0xF0,0x90,0xF0,0xF0,0x10,0x20,0x40,0x40,0xF0,0x90,0xF0,0x90,0xF0,
0xF0,0x90,0xF0,0x10,0xF0,0xF0,0x90,0xF0,0x90,0x90,0xE0,0x90,0xE0,0x90,0xE0,
0xF0,0x80,0x80,0x80,0xF0,0xE0,0x90,0x90,0x90,0xE0,0xF0,0x80,0xF0,0x80,0xF0,
0xF0,0x80,0xF0,0x80,0x80
];

// ---------------- State ----------------
let mem, V, I, pc, stack, dt, st, keys, waiting, disp;
let rom = DEMO_ROM, romName = "demo";
let running = false, halted = false;
const FONT_ADDR = 0x050;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const IMG = ctx.createImageData ? ctx.createImageData(64,32) : {data:new Uint8ClampedArray(64*32*4)};
const dbg = document.getElementById("dbg");

function reset() {
  mem = new Uint8Array(4096);
  mem.set(FONT, FONT_ADDR);
  mem.set(rom, 0x200);
  V = new Uint8Array(16);
  I = 0; pc = 0x200;
  stack = []; dt = 0; st = 0;
  keys = new Array(16).fill(false);
  waiting = false; halted = false; running = false;
  disp = new Uint8Array(64*32);
  render(); updateDbg();
}

// ---------------- Timers 60 Hz ----------------
let audioCtx = null;
setInterval(() => {
  if (dt > 0) dt--;
  if (st > 0) {
    st--;
    try {
      if (audioCtx === null) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.frequency.value = 440; g.gain.value = 0.05;
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 1/60);
    } catch (e) {} // audio unavailable — ignore
  }
}, 1000/60);

// ---------------- Decode helper ----------------
function decode(op) {
  const x = (op>>8)&0xF, y = (op>>4)&0xF, n = op&0xF,
        nn = op&0xFF, nnn = op&0xFFF;
  const hx = (v)=>v.toString(16).toUpperCase().padStart(2,"0");
  switch (op>>12) {
    case 0x0: return op===0x00E0?"CLS":op===0x00EE?"RET":`SYS ${hx(nnn)}`;
    case 0x1: return `JP ${hx(nnn)}`;
    case 0x2: return `CALL ${hx(nnn)}`;
    case 0x3: return `SE V${x}, ${hx(nn)}`;
    case 0x4: return `SNE V${x}, ${hx(nn)}`;
    case 0x5: return `SE V${x}, V${y}`;
    case 0x6: return `LD V${x}, ${hx(nn)}`;
    case 0x7: return `ADD V${x}, ${hx(nn)}`;
    case 0x8: switch(n){
      case 0x0:return`LD V${x}, V${y}`; case 0x1:return`OR V${x}, V${y}`;
      case 0x2:return`AND V${x}, V${y}`; case 0x3:return`XOR V${x}, V${y}`;
      case 0x4:return`ADD V${x}, V${y}`; case 0x5:return`SUB V${x}, V${y}`;
      case 0x6:return`SHR V${x}`; case 0x7:return`SUBN V${x}, V${y}`;
      case 0xE:return`SHL V${x}`;}
    case 0x9: return `SNE V${x}, V${y}`;
    case 0xA: return `LD I, ${hx(nnn)}`;
    case 0xB: return `JP V0 + ${hx(nnn)}`;
    case 0xC: return `RND V${x}, ${hx(nn)}`;
    case 0xD: return `DRW V${x}, V${y}, ${n}`;
    case 0xE: return nn===0x9E?`SKP V${x}`:nn===0xA1?`SKNP V${x}`:`?? ${hx(op)}`;
    case 0xF: switch(nn){
      case 0x07:return`LD V${x}, DT`; case 0x0A:return`LD V${x}, K`;
      case 0x15:return`LD DT, V${x}`; case 0x18:return`LD ST, V${x}`;
      case 0x1E:return`ADD I, V${x}`; case 0x29:return`LD F, V${x}`;
      case 0x33:return`BCD V${x}`;   case 0x55:return`LD [I], V${x}`;
      case 0x65:return`LD V${x}, [I]`;}
  }
  return `?? ${hx(op)}`;
}

// ---------------- CPU step ----------------
function step() {
  if (halted) return;
  const op = (mem[pc]<<8)|mem[pc+1];
  const x=(op>>8)&0xF, y=(op>>4)&0xF, n=op&0xF, nn=op&0xFF, nnn=op&0xFFF;
  pc += 2;
  switch (op>>12) {
    case 0x0:
      if (op===0x00E0) { disp.fill(0); }
      else if (op===0x00EE) pc = stack.pop();
      else break;
      break;
    case 0x1: pc = nnn; break;
    case 0x2: if (stack.length>=16){halt();break;} stack.push(pc); pc = nnn; break;
    case 0x3: if (V[x]===nn) pc+=2; break;
    case 0x4: if (V[x]!==nn) pc+=2; break;
    case 0x5: if (V[x]===V[y]) pc+=2; break;
    case 0x6: V[x]=nn; break;
    case 0x7: V[x]=(V[x]+nn)&0xFF; break;
    case 0x8: switch(n){
      case 0x0: V[x]=V[y]; break;
      case 0x1: V[x]|=V[y]; break;
      case 0x2: V[x]&=V[y]; break;
      case 0x3: V[x]^=V[y]; break;
      case 0x4: {const s=V[x]+V[y]; V[x]=s&0xFF; V[0xF]=s>255?1:0;} break;
      case 0x5: {const d=V[x]-V[y]; V[0xF]=d<0?0:1; V[x]=d&0xFF;} break;
      case 0x6: V[0xF]=V[x]&1; V[x]>>=1; break;
      case 0x7: {const d=V[y]-V[x]; V[0xF]=d<0?0:1; V[x]=d&0xFF;} break;
      case 0xE: V[0xF]=(V[x]>>7)&1; V[x]=(V[x]<<1)&0xFF; break;
      default: pc-=2; halt(); return;
    } break;
    case 0x9: if (V[x]!==V[y]) pc+=2; break;
    case 0xA: I=nnn; break;
    case 0xB: pc=(nnn+V[0])&0xFFF; break;
    case 0xC: V[x]=(Math.random()*256|0)&nn; break;
    case 0xD: {
      V[0xF]=0;
      for (let r=0;r<n;r++){
        const row = mem[(I+r)&0xFFF];
        const py = (V[y]+r)&31;
        for (let c=0;c<8;c++){
          if (row&(0x80>>c)){
            const px = (V[x]+c)&63;
            const idx = py*64+px;
            if (disp[idx]) V[0xF]=1;
            disp[idx] ^= 1;
          }
        }
      }
      render();
    } break;
    case 0xE:
      if (nn===0x9E){ if(keys[V[x]]) pc+=2; }
      else if (nn===0xA1){ if(!keys[V[x]]) pc+=2; }
      else { pc-=2; halt(); return; }
      break;
    case 0xF: switch(nn){
      case 0x07: V[x]=dt; break;
      case 0x0A: {
        let k = keys.findIndex(v=>v);
        if (k<0){ pc-=2; } else V[x]=k;
      } break;
      case 0x15: dt=V[x]; break;
      case 0x18: st=V[x]; break;
      case 0x1E: I=(I+V[x])&0xFFF; break;
      case 0x29: I=FONT_ADDR+(V[x]&0xF)*5; break;
      case 0x33: mem[I]=V[x]/100|0; mem[I+1]=(V[x]/10|0)%10; mem[I+2]=V[x]%10; break;
      case 0x55: for(let i=0;i<=x;i++) mem[(I+i)&0xFFF]=V[i]; break;
      case 0x65: for(let i=0;i<=x;i++) V[i]=mem[(I+i)&0xFFF]; break;
      default: pc-=2; halt(); return;
    } break;
    default: pc-=2; halt(); return;
  }
}

function halt(){ halted=true; running=false; updateDbg(); }

// ---------------- Main loop ----------------
function frame(){
  if (running && !halted){
    const ipf = Math.max(1, Math.min(5000, +document.getElementById("ipf").value||10));
    for (let i=0;i<ipf && !halted;i++) step();
    updateDbg();
  }
  requestAnimationFrame(frame);
}

// ---------------- Debugger ----------------
function render(){
  const d = IMG.data;
  for (let i=0;i<64*32;i++){
    const on = disp[i];
    d[i*4]=on?15:0; d[i*4+1]=on?240:0; d[i*4+2]=on?15:0; d[i*4+3]=255;
  }
  ctx.putImageData(IMG,0,0);
}
const hx2=(v)=>v.toString(16).toUpperCase().padStart(2,"0");
const hx3=(v)=>v.toString(16).toUpperCase().padStart(3,"0");
const hx4=(v)=>v.toString(16).toUpperCase().padStart(4,"0");
function updateDbg(){
  const op = (mem[pc]<<8)|mem[pc+1];
  let s = "Registers:\n";
  for (let r=0;r<16;r+=4){
    s += [0,1,2,3].map(i=>`V${(r+i).toString(16).toUpperCase()}=${hx2(V[r+i])}`).join(" ")+"\n";
  }
  s += `I=${hx3(I)}  PC=${hx3(pc)}  OP=${hx4(op)}\n`;
  s += `INS: ${decode(op)}\n`;
  s += `DT=${hx2(dt)}  ST=${hx2(st)}  ${halted?"HALTED":""}\n`;
  s += "Stack: "+(stack.length?stack.map(hx3).join(" "):"(empty)");
  dbg.textContent = s;
}

// ---------------- Controls ----------------
document.getElementById("btnRun").onclick = ()=>{ if(!halted) running=true; };
document.getElementById("btnPause").onclick = ()=>{ running=false; updateDbg(); };
document.getElementById("btnStep").onclick = ()=>{ running=false; if(!halted){step();updateDbg();} };
document.getElementById("btnReset").onclick = ()=>reset();
document.getElementById("romfile").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    rom = new Uint8Array(rd.result); romName = f.name;
    document.getElementById("romname").textContent = "ROM: "+romName;
    reset();
  };
  rd.readAsArrayBuffer(f);
};

// ---------------- Keypad ----------------
const KEYMAP = ["1","2","3","4","q","w","e","r","a","s","d","f","z","x","c","v"];
// layout: 1 2 3 C / 4 5 6 D / 7 8 9 E / A 0 B F
const LAYOUT = [0x1,0x2,0x3,0xC, 0x4,0x5,0x6,0xD, 0x7,0x8,0x9,0xE, 0xA,0x0,0xB,0xF];
const padDiv = document.getElementById("keypad");
const padBtns = [];
for (const k of LAYOUT){
  const b = document.createElement("button");
  b.innerHTML = k.toString(16).toUpperCase() + "<small>"+KEYMAP[k]+"</small>";
  const on = (e)=>{ e.preventDefault(); keys[k]=true; b.classList.add("active"); };
  const off = (e)=>{ e.preventDefault(); keys[k]=false; b.classList.remove("active"); };
  b.addEventListener("mousedown",on); b.addEventListener("mouseup",off);
  b.addEventListener("mouseleave",off);
  b.addEventListener("touchstart",on,{passive:false});
  b.addEventListener("touchend",off,{passive:false});
  padDiv.appendChild(b); padBtns[k]=b;
}
window.addEventListener("keydown",(e)=>{
  const k = KEYMAP.indexOf(e.key.toLowerCase());
  if (k>=0){ keys[k]=true; padBtns[k].classList.add("active"); e.preventDefault(); }
});
window.addEventListener("keyup",(e)=>{
  const k = KEYMAP.indexOf(e.key.toLowerCase());
  if (k>=0){ keys[k]=false; padBtns[k].classList.remove("active"); e.preventDefault(); }
});

// ---------------- Start ----------------
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
