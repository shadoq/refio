<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Neuron Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  body {
    background: #05070f;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #scene {
    border: 1px solid rgba(0, 229, 255, 0.25);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
  }
</style>
</head>
<body>
<canvas id="scene" width="800" height="800"></canvas>
<script>
'use strict';

// ==================== Setup ====================
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = 400, CY = 400;

const cfg = {
  neuronCount: 5,
  growthSpeed: 2,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.35,
  maxBranchLength: 40,
  synapseDist: 40,
  synapseGlow: 12,
  pulseSpeed: 2,
  pulseFrequency: 3,
  pulseBrightness: 14,
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  regenerate() {},
  clearCanvas() {},
  pauseResume() {}
};

// Data model: lightweight arrays and objects only
const somas = [];        // [{x,y,neuron}]
const segments = [];     // [{x1,y1,cx,cy,x2,y2,thick,depth,accent,neuron}]
const tips = [];         // active growing ends [{id,x,y,angle,depth,segLeft,neuron,thick,acc}]
const terminals = [];    // finished tips [{id,x,y,neuron}]
const synapses = [];     // [{x1,y1,x2,y2,phase}]
const pulses = [];       // [{syn,t,dir,speed}]
const connectedPairs = new Set(); // "minId_maxId" keys, prevents duplicate synapses
let nextId = 0;
let paused = false;
let spawnAcc = 0;

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// Pre-rendered scanline overlay (slightly taller than canvas for drift wrap)
const scanCanvas = document.createElement('canvas');
scanCanvas.width = W;
scanCanvas.height = H + 3;
const sctx = scanCanvas.getContext('2d');
sctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
sctx.lineWidth = 1;
for (let y = 0.5; y < H + 3; y += 3) {
  sctx.beginPath();
  sctx.moveTo(0, y);
  sctx.lineTo(W, y);
  sctx.stroke();
}

// Pre-rendered vignette overlay
const vigCanvas = document.createElement('canvas');
vigCanvas.width = W;
vigCanvas.height = H;
const vctx = vigCanvas.getContext('2d');
const vgrad = vctx.createRadialGradient(CX, CY, 180, CX, CY, 570);
vgrad.addColorStop(0, 'rgba(0,0,0,0)');
vgrad.addColorStop(1, 'rgba(0,0,0,0.55)');
vctx.fillStyle = vgrad;
vctx.fillRect(0, 0, W, H);

// ==================== GUI setup ====================
const gui = new dat.GUI({ width: 300 });
const fGrowth = gui.addFolder('Growth');
fGrowth.add(cfg, 'neuronCount', 1, 8).step(1).onFinishChange(generate);
fGrowth.add(cfg, 'growthSpeed', 0.2, 6);
fGrowth.add(cfg, 'maxDepth', 1, 10).step(1).onFinishChange(generate);
fGrowth.add(cfg, 'splitChance', 0, 1).onFinishChange(generate);
fGrowth.add(cfg, 'curvature', 0, 1).onFinishChange(generate);
fGrowth.add(cfg, 'maxBranchLength', 10, 120).step(1).onFinishChange(generate);
fGrowth.open();
const fSyn = gui.addFolder('Synapses');
fSyn.add(cfg, 'synapseDist', 5, 120);
fSyn.add(cfg, 'synapseGlow', 0, 30);
fSyn.open();
const fPulses = gui.addFolder('Pulses');
fPulses.add(cfg, 'pulseSpeed', 0.2, 6);
fPulses.add(cfg, 'pulseFrequency', 0, 12);
fPulses.add(cfg, 'pulseBrightness', 0, 30);
fPulses.open();
const fVis = gui.addFolder('Visuals');
fVis.addColor(cfg, 'bgColor');
fVis.addColor(cfg, 'branchColor');
fVis.addColor(cfg, 'accentColor');
fVis.addColor(cfg, 'synapseColor');
fVis.addColor(cfg, 'pulseColor');
fVis.open();
gui.add(cfg, 'regenerate').name('Regenerate Network');
gui.add(cfg, 'clearCanvas').name('Clear Canvas');
gui.add(cfg, 'pauseResume').name('Pause / Resume');

// ==================== Neuron growth ====================
function generate() {
  somas.length = 0;
  segments.length = 0;
  tips.length = 0;
  terminals.length = 0;
  synapses.length = 0;
  pulses.length = 0;
  connectedPairs.clear();
  nextId = 0;
  for (let i = 0; i < cfg.neuronCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 90;
    const sx = CX + Math.cos(a) * r;
    const sy = CY + Math.sin(a) * r;
    somas.push({ x: sx, y: sy, neuron: i });
    const n = 2 + Math.floor(Math.random() * 3); // 2-4 initial tips
    for (let j = 0; j < n; j++) {
      tips.push({
        id: nextId++, x: sx, y: sy,
        angle: Math.random() * Math.PI * 2,
        depth: 0,
        segLeft: 10 + Math.random() * cfg.maxBranchLength,
        neuron: i,
        thick: 2.2 + Math.random(),
        acc: 0
      });
    }
  }
}

// One growth step for a single tip; returns false when the tip is finished
function growTip(tip) {
  tip.angle += (Math.random() - 0.5) * cfg.curvature * 0.9;
  const nx = tip.x + Math.cos(tip.angle) * 6;
  const ny = tip.y + Math.sin(tip.angle) * 6;
  const mx = (tip.x + nx) / 2;
  const my = (tip.y + ny) / 2;
  const dx = nx - tip.x, dy = ny - tip.y;
  const len = Math.hypot(dx, dy) || 1;
  const off = (Math.random() - 0.5) * cfg.curvature * 14;
  const cx = mx + (-dy / len) * off;
  const cy = my + (dx / len) * off;
  segments.push({
    x1: tip.x, y1: tip.y, cx: cx, cy: cy, x2: nx, y2: ny,
    thick: tip.thick * (0.92 + Math.random() * 0.16),
    depth: tip.depth,
    accent: Math.random() < 0.18,
    neuron: tip.neuron
  });
  tip.x = nx;
  tip.y = ny;
  tip.segLeft--;

  // occasional smaller side branch
  if (Math.random() < 0.03 && tip.depth < cfg.maxDepth) {
    tips.push({
      id: nextId++, x: tip.x, y: tip.y,
      angle: tip.angle + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.7),
      depth: tip.depth + 1,
      segLeft: 8 + Math.random() * cfg.maxBranchLength * 0.5,
      neuron: tip.neuron,
      thick: tip.thick * 0.8,
      acc: 0
    });
  }

  // live proximity check against existing terminals while still growing
  checkSynapses(tip.x, tip.y, tip.id, tip.neuron);

  if (tip.segLeft > 0) return true;

  if (tip.depth < cfg.maxDepth && Math.random() < cfg.splitChance) {
    // split into two child tips with fresh, depth-scaled segLeft
    for (let k = 0; k < 2; k++) {
      tips.push({
        id: nextId++, x: tip.x, y: tip.y,
        angle: tip.angle + (k === 0 ? -1 : 1) * (0.4 + Math.random() * 0.5),
        depth: tip.depth + 1,
        segLeft: (10 + Math.random() * cfg.maxBranchLength) * Math.max(0.35, 1 - (tip.depth + 1) * 0.12),
        neuron: tip.neuron,
        thick: tip.thick * 0.75,
        acc: 0
      });
    }
  } else {
    // tip terminates: become a terminal and look for synapses
    terminals.push({ id: tip.id, x: tip.x, y: tip.y, neuron: tip.neuron });
    checkSynapses(tip.x, tip.y, tip.id, tip.neuron);
  }
  return false;
}

function updateGrowth() {
  for (let i = tips.length - 1; i >= 0; i--) {
    const tip = tips[i];
    tip.acc += cfg.growthSpeed;
    let alive = true;
    while (tip.acc >= 1 && alive) {
      tip.acc -= 1;
      alive = growTip(tip);
      if (segments.length > 1200 || synapses.length > 250) {
        tips.length = 0; // hard performance cap: stop all growth
        return;
      }
    }
    if (!alive) tips.splice(i, 1);
  }
}

// ==================== Synapse detection ====================
function checkSynapses(x, y, id, neuron) {
  for (let i = 0; i < terminals.length; i++) {
    const t = terminals[i];
    if (t.neuron === neuron || t.id === id) continue;
    const dx = x - t.x, dy = y - t.y;
    if (dx * dx + dy * dy < cfg.synapseDist * cfg.synapseDist) {
      const a = Math.min(id, t.id), b = Math.max(id, t.id);
      const key = a + '_' + b;
      if (!connectedPairs.has(key) && synapses.length < 250) {
        connectedPairs.add(key);
        synapses.push({ x1: x, y1: y, x2: t.x, y2: t.y, phase: Math.random() * Math.PI * 2 });
      }
    }
  }
}

// ==================== Pulse animation ====================
function updatePulses(dt) {
  spawnAcc += cfg.pulseFrequency * dt;
  while (spawnAcc >= 1 && pulses.length < 60 && synapses.length > 0) {
    spawnAcc -= 1;
    pulses.push({
      syn: synapses[Math.floor(Math.random() * synapses.length)],
      t: 0,
      dir: Math.random() < 0.5 ? 1 : -1,
      speed: cfg.pulseSpeed * (0.7 + Math.random() * 0.6)
    });
  }
  if (spawnAcc > 3) spawnAcc = 3;
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed * dt;
    if (p.t >= 1) {
      if (Math.random() < 0.1) {
        p.t = 0;
        p.dir *= -1;
      } else {
        pulses.splice(i, 1);
      }
    }
  }
}

function pulsePos(p, t) {
  const s = p.syn;
  const u = p.dir === 1 ? t : 1 - t;
  return [s.x1 + (s.x2 - s.x1) * u, s.y1 + (s.y2 - s.y1) * u];
}

// ==================== Rendering ====================
function render(time) {
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // 1. background fill
  ctx.fillStyle = cfg.bgColor;
  ctx.fillRect(0, 0, W, H);

  // 2. soft background glow
  const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, 550);
  glow.addColorStop(0, hexToRgba('#101a3a', 0.55));
  glow.addColorStop(1, hexToRgba('#101a3a', 0));
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 3. drifting scanlines
  ctx.globalAlpha = 0.6;
  const off = (time * 8) % 3;
  ctx.drawImage(scanCanvas, 0, off - 3);
  ctx.globalAlpha = 1;

  // 4. branches with neon glow
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.9;
  ctx.shadowBlur = 8;
  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    const col = s.accent ? cfg.accentColor : cfg.branchColor;
    ctx.strokeStyle = col;
    ctx.shadowColor = col;
    ctx.lineWidth = s.thick;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.quadraticCurveTo(s.cx, s.cy, s.x2, s.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // 5. somas
  ctx.fillStyle = cfg.branchColor;
  ctx.shadowColor = cfg.branchColor;
  ctx.shadowBlur = 18;
  for (let i = 0; i < somas.length; i++) {
    ctx.beginPath();
    ctx.arc(somas[i].x, somas[i].y, 5.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 6. synapses: faint link line plus glowing endpoint dots
  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const pf = 0.7 + 0.3 * Math.sin(time * 3 + s.phase);
    ctx.strokeStyle = cfg.synapseColor;
    ctx.shadowColor = cfg.synapseColor;
    ctx.shadowBlur = cfg.synapseGlow * pf;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = cfg.synapseColor;
    const r = 2.5 + 1.5 * pf;
    ctx.beginPath();
    ctx.arc(s.x1, s.y1, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x2, s.y2, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 7. pulses: bright spark head with two fading trail dots
  ctx.fillStyle = cfg.pulseColor;
  ctx.shadowColor = cfg.pulseColor;
  ctx.shadowBlur = cfg.pulseBrightness;
  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const pos = pulsePos(p, p.t);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(pos[0], pos[1], 2.2, 0, Math.PI * 2);
    ctx.fill();
    const t1 = pulsePos(p, Math.max(0, p.t - 0.06));
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(t1[0], t1[1], 1.6, 0, Math.PI * 2);
    ctx.fill();
    const t2 = pulsePos(p, Math.max(0, p.t - 0.12));
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(t2[0], t2[1], 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // 8. gritty animated specks
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,229,255,0.05)';
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }

  // 9. vignette
  ctx.drawImage(vigCanvas, 0, 0);
}

// ==================== Wiring ====================
cfg.regenerate = generate;
cfg.clearCanvas = function () {
  segments.length = 0;
  synapses.length = 0;
  pulses.length = 0;
  tips.length = 0;
  terminals.length = 0;
  somas.length = 0;
  connectedPairs.clear();
};
cfg.pauseResume = function () { paused = !paused; };

let lastTime = -1;
function loop(ts) {
  const time = ts / 1000;
  let dt = lastTime < 0 ? 0.016 : time - lastTime;
  lastTime = time;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (!paused) {
    updateGrowth();
    updatePulses(dt);
  }
  render(time); // render even when paused so color tweaks show
  requestAnimationFrame(loop);
}

generate();
requestAnimationFrame(loop);
</script>
</body>
</html>
