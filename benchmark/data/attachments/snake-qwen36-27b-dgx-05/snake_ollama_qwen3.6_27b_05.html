<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-screen {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            display: none;
        }

        .menu-screen.active {
            display: block;
        }

        h1 {
            margin-top: 0;
            font-size: 3em;
            color: #4CAF50;
            text-shadow: 2px 2px 4px #000;
        }

        h2 {
            color: #ff5252;
        }

        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
            width: 250px;
        }

        .btn:hover {
            background-color: #444;
            border-color: #777;
            transform: scale(1.05);
        }

        .btn.selected {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 1.5em;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        .p1-score { color: #4CAF50; }
        .p2-score { color: #ff5252; }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #aaa;
        }

        .key {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="score-board">
            <div class="p1-score">P1: <span id="score1">0</span></div>
            <div class="p2-score">P2: <span id="score2">0</span></div>
        </div>

        <div id="ui-layer">
            <!-- Start Menu -->
            <div id="start-menu" class="menu-screen active">
                <h1>SNAKE BATTLE</h1>
                <p>Select Game Mode:</p>
                <button class="btn" onclick="selectMode(0)">Human vs Human</button>
                <button class="btn" onclick="selectMode(1)">CPU vs Human</button>
                <button class="btn" onclick="selectMode(2)">CPU vs CPU</button>
                <div class="controls-hint">
                    <p>P1 Controls: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></p>
                    <p>P2 Controls: <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span></p>
                    <p>Press <span class="key">Enter</span> to Start</p>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over" class="menu-screen">
                <h1>GAME OVER</h1>
                <h2 id="winner-text"></h2>
                <p>Final Scores:</p>
                <p class="p1-score">Player 1: <span id="final-score1">0</span></p>
                <p class="p2-score">Player 2: <span id="final-score2">0</span></p>
                <button class="btn" onclick="resetGame()">Play Again</button>
                <div class="controls-hint">
                    Press <span class="key">R</span> to Restart
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 30;
        const TILE_SIZE = canvas.width / GRID_SIZE;
        const GAME_SPEED = 100; // ms per frame

        // --- Game State ---
        let gameLoopId = null;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let gameMode = 0; // 0: HvH, 1: CPUvH, 2: CPUvCPU
        
        let snake1 = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            color: '#4CAF50',
            score: 0,
            dead: false
        };

        let snake2 = {
            body: [],
            direction: { x: -1, y: 0 },
            nextDirection: { x: -1, y: 0 },
            color: '#ff5252',
            score: 0,
            dead: false
        };

        let food = { x: 0, y: 0 };

        // --- Initialization ---
        function init() {
            document.addEventListener('keydown', handleInput);
            updateScoreDisplay();
        }

        function resetGame() {
            // Reset Snakes
            snake1.body = [{ x: 5, y: 15 }, { x: 4, y: 15 }, { x: 3, y: 15 }];
            snake1.direction = { x: 1, y: 0 };
            snake1.nextDirection = { x: 1, y: 0 };
            snake1.score = 0;
            snake1.dead = false;

            snake2.body = [{ x: 24, y: 15 }, { x: 25, y: 15 }, { x: 26, y: 15 }];
            snake2.direction = { x: -1, y: 0 };
            snake2.nextDirection = { x: -1, y: 0 };
            snake2.score = 0;
            snake2.dead = false;

            spawnFood();
            updateScoreDisplay();
            
            // Hide Menus
            document.getElementById('start-menu').classList.remove('active');
            document.getElementById('game-over').classList.remove('active');

            gameState = 'PLAYING';
            
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(gameLoop, GAME_SPEED);
        }

        function selectMode(mode) {
            gameMode = mode;
            // Visual feedback for selection could be added here
            resetGame();
        }

        // --- Core Game Logic ---
        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            // CPU Logic for Snake 1
            if (gameMode === 1 || gameMode === 2) {
                cpuMove(snake1, snake2);
            }

            // CPU Logic for Snake 2
            if (gameMode === 2) {
                cpuMove(snake2, snake1);
            }

            moveSnake(snake1);
            moveSnake(snake2);

            checkCollisions();
            draw();
        }

        function moveSnake(snake) {
            if (snake.dead) return;

            // Apply buffered direction
            snake.direction = snake.nextDirection;

            const head = { ...snake.body[0] };
            head.x += snake.direction.x;
            head.y += snake.direction.y;

            // Wall Collision Check (handled in checkCollisions, but we can mark dead here if preferred)
            // For now, we let checkCollisions handle the state update
            
            snake.body.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreDisplay();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollisions() {
            let s1Dead = false;
            let s2Dead = false;

            // Snake 1 Collisions
            if (!snake1.dead) {
                if (checkWallCollision(snake1.body[0])) s1Dead = true;
                if (checkSelfCollision(snake1)) s1Dead = true;
                if (checkEnemyCollision(snake1, snake2)) s1Dead = true;
            }

            // Snake 2 Collisions
            if (!snake2.dead) {
                if (checkWallCollision(snake2.body[0])) s2Dead = true;
                if (checkSelfCollision(snake2)) s2Dead = true;
                if (checkEnemyCollision(snake2, snake1)) s2Dead = true;
            }

            // Head-to-Head Collision
            if (!s1Dead && !s2Dead) {
                if (snake1.body[0].x === snake2.body[0].x && snake1.body[0].y === snake2.body[0].y) {
                    s1Dead = true;
                    s2Dead = true;
                }
            }

            snake1.dead = s1Dead;
            snake2.dead = s2Dead;

            if (s1Dead || s2Dead) {
                endGame();
            }
        }

        function checkWallCollision(pos) {
            return pos.x < 0 || pos.x >= GRID_SIZE || pos.y < 0 || pos.y >= GRID_SIZE;
        }

        function checkSelfCollision(snake) {
            const head = snake.body[0];
            // Start from 1 because index 0 is the head
            for (let i = 1; i < snake.body.length; i++) {
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                    return true;
                }
            }
            return false;
        }

        function checkEnemyCollision(snake, enemy) {
            if (enemy.dead) return false;
            const head = snake.body[0];
            for (let part of enemy.body) {
                if (head.x === part.x && head.y === part.y) {
                    return true;
                }
            }
            return false;
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                valid = true;
                // Check if food spawns on snake 1
                for (let part of snake1.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
                // Check if food spawns on snake 2
                for (let part of snake2.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            clearInterval(gameLoopId);
            
            const winnerText = document.getElementById('winner-text');
            if (snake1.dead && snake2.dead) {
                winnerText.textContent = "It's a Draw!";
            } else if (snake1.dead) {
                winnerText.textContent = "Player 2 Wins!";
            } else if (snake2.dead) {
                winnerText.textContent = "Player 1 Wins!";
            }

            document.getElementById('final-score1').textContent = snake1.score;
            document.getElementById('final-score2').textContent = snake2.score;
            
            document.getElementById('game-over').classList.add('active');
        }

        // --- Input Handling ---
        function handleInput(e) {
            if (gameState === 'MENU') {
                if (e.key === 'Enter') {
                    resetGame();
                }
                return;
            }

            if (gameState === 'GAMEOVER') {
                if (e.key.toLowerCase() === 'r') {
                    resetGame();
                }
                return;
            }

            // Player 1 Controls (WASD)
            if (gameMode === 0 || gameMode === 2) { // P1 is human in HvH, but in CPUvCPU P1 is CPU. Wait, logic check:
                // Mode 0: H vs H -> P1 Human
                // Mode 1: CPU vs H -> P1 CPU
                // Mode 2: CPU vs CPU -> P1 CPU
                // So P1 is human only in Mode 0.
            }
            
            // Actually, let's map controls based on mode explicitly to avoid confusion
            // P1 Human: Mode 0
            if (gameMode === 0) {
                if (e.key === 'w' || e.key === 'W') changeDirection(snake1, 0, -1);
                if (e.key === 's' || e.key === 'S') changeDirection(snake1, 0, 1);
                if (e.key === 'a' || e.key === 'A') changeDirection(snake1, -1, 0);
                if (e.key === 'd' || e.key === 'D') changeDirection(snake1, 1, 0);
            }

            // P2 Human: Mode 0 and Mode 1
            if (gameMode === 0 || gameMode === 1) {
                if (e.key === 'ArrowUp') changeDirection(snake2, 0, -1);
                if (e.key === 'ArrowDown') changeDirection(snake2, 0, 1);
                if (e.key === 'ArrowLeft') changeDirection(snake2, -1, 0);
                if (e.key === 'ArrowRight') changeDirection(snake2, 1, 0);
            }
        }

        function changeDirection(snake, dx, dy) {
            // Prevent reversing directly
            if (snake.direction.x + dx === 0 && snake.direction.y + dy === 0) return;
            snake.nextDirection = { x: dx, y: dy };
        }

        // --- CPU AI (BFS) ---
        function cpuMove(snake, enemy) {
            if (snake.dead) return;

            const start = snake.body[0];
            const target = food;
            
            // Build obstacle map
            const obstacles = new Set();
            
            // Add own body
            for (let part of snake.body) {
                obstacles.add(`${part.x},${part.y}`);
            }
            // Add enemy body
            for (let part of enemy.body) {
                obstacles.add(`${part.x},${part.y}`);
            }

            // BFS to find shortest path to food
            const path = bfs(start, target, obstacles);

            if (path && path.length > 0) {
                const nextMove = path[0];
                const dx = nextMove.x - start.x;
                const dy = nextMove.y - start.y;
                snake.nextDirection = { x: dx, y: dy };
            } else {
                // No path to food, try to survive by moving to any valid neighbor
                const neighbors = getNeighbors(start);
                let bestMove = null;
                
                // Simple survival: pick a move that doesn't kill immediately
                for (let n of neighbors) {
                    if (!obstacles.has(`${n.x},${n.y}`)) {
                        // Prefer moves that have more open space (simple heuristic)
                        // For now, just pick the first valid one
                        bestMove = n;
                        break;
                    }
                }

                if (bestMove) {
                    const dx = bestMove.x - start.x;
                    const dy = bestMove.y - start.y;
                    snake.nextDirection = { x: dx, y: dy };
                }
                // If no valid move, it will die on next update, which is correct
            }
        }

        function bfs(start, target, obstacles) {
            const queue = [{ pos: start, path: [] }];
            const visited = new Set();
            visited.add(`${start.x},${start.y}`);

            while (queue.length > 0) {
                const { pos, path } = queue.shift();

                if (pos.x === target.x && pos.y === target.y) {
                    return path;
                }

                const neighbors = getNeighbors(pos);
                for (let n of neighbors) {
                    const key = `${n.x},${n.y}`;
                    if (!visited.has(key) && !obstacles.has(key)) {
                        visited.add(key);
                        const newPath = [...path, n];
                        queue.push({ pos: n, path: newPath });
                    }
                }
            }
            return null;
        }

        function getNeighbors(pos) {
            const dirs = [
                { x: 0, y: -1 },
                { x: 0, y: 1 },
                { x: -1, y: 0 },
                { x: 1, y: 0 }
            ];
            const neighbors = [];
            for (let d of dirs) {
                const nx = pos.x + d.x;
                const ny = pos.y + d.y;
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    neighbors.push({ x: nx, y: ny });
                }
            }
            return neighbors;
        }

        // --- Rendering ---
        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_SIZE);
                ctx.lineTo(canvas.width, i * TILE_SIZE);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ffff00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffff00';
            ctx.fillRect(food.x * TILE_SIZE + 2, food.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            ctx.shadowBlur = 0;

            // Draw Snake 1
            drawSnake(snake1);

            // Draw Snake 2
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            for (let i = 0; i < snake.body.length; i++) {
                const part = snake.body[i];
                // Head is slightly larger or different color
                if (i === 0) {
                    ctx.fillStyle = lightenColor(snake.color, 20);
                } else {
                    ctx.fillStyle = snake.color;
                }
                ctx.fillRect(part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            }
        }

        function lightenColor(color, percent) {
            // Simple hex lightener
            const num = parseInt(color.replace("#",""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        function updateScoreDisplay() {
            document.getElementById('score1').textContent = snake1.score;
            document.getElementById('score2').textContent = snake2.score;
        }

        // Start
        init();

    </script>
</body>
</html>
