<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neuron Growth Simulation</title>
<style>
  /* Dark background with neon glow center */
  body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  #container {
    position: relative;
    width: 800px;
    height: 800px;
    box-shadow: 0 0 60px 20px #101a3a inset;
    border-radius: 6px;
    background: #05070f;
  }
  canvas {
    display: block;
    background: #05070f;
    filter: contrast(1.2) brightness(1.1);
    border-radius: 6px;
  }
  /* dat.gui panel color override for accent color #ffd400 */
  .dg.ac {
    background: #05070f !important;
    color: #ffd400 !important;
  }
  .dg.ac .close-button,
  .dg.ac .close-button:hover {
    color: #ffd400 !important;
  }
  .dg.ac .cr.number,
  .dg.ac .c {
    color: #ffd400 !important;
  }
  .dg.ac .cr.function {
    color: #ffd400 !important;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="neuronCanvas" width="800" height="800"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
// === Setup & Globals ===
const canvas = document.getElementById('neuronCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width, height = canvas.height;

// Neon palette colors
const palette = {
  background: '#05070f',
  backgroundGlow: '#101a3a',
  mainBranch: '#00e5ff',
  accentBranch: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  uiAccent: '#ffd400',
  gridScanline: 'rgba(0, 229, 255, 0.08)'
};

// Simulation data
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];

let animationPaused = false;

// Parameters with default values
const params = {
  neuronCount: 4,
  branchGrowthSpeed: 2.5, // pixels per frame
  maxBranchDepth: 5,
  branchSplitChance: 0.18,
  branchCurvature: 0.3, // 0-1
  maxBranchLength: 120,
  synapseDistanceThreshold: 20,
  synapseGlowStrength: 15,
  pulseSpeed: 0.03, // portion per frame
  pulseFrequency: 0.008, // probability per frame
  pulseBrightness: 0.8,
  backgroundColor: palette.background,
  branchColor: palette.mainBranch,
  accentBranchColor: palette.accentBranch,
  synapseColor: palette.synapse,
  pulseColor: palette.pulse
};

// Utility: random float in [min,max)
function randRange(min, max) {
  return Math.random() * (max - min) + min;
}

// Utility: distance between points
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// === Neuron Growth ===
class Branch {
  constructor(start, angle, depth, parent) {
    this.start = start; // {x,y}
    this.angle = angle; // radians
    this.depth = depth; // recursion depth
    this.length = 0; // current length grown
    this.maxLength = randRange(params.maxBranchLength * 0.5, params.maxBranchLength);
    this.parent = parent; // parent branch
    this.children = [];
    this.thickness = randRange(1, 3) * (1 - depth / params.maxBranchDepth) + 0.3;
    this.growing = true;
    this.end = { x: start.x, y: start.y };
    this.curveControl = {
      x: this.start.x + Math.cos(this.angle + Math.PI / 2) * randRange(-30, 30),
      y: this.start.y + Math.sin(this.angle + Math.PI / 2) * randRange(-30, 30)
    };
  }

  grow() {
    if (!this.growing) return false;
    this.length += params.branchGrowthSpeed;
    if (this.length >= this.maxLength) {
      this.length = this.maxLength;
      this.growing = false;
      return false; // finished growing
    }
    this.end.x = this.start.x + Math.cos(this.angle) * this.length;
    this.end.y = this.start.y + Math.sin(this.angle) * this.length;
    return true;
  }

  trySplit() {
    if (this.depth >= params.maxBranchDepth) return;
    if (Math.random() < params.branchSplitChance) {
      let splitAngle = (Math.random() - 0.5) * Math.PI * params.branchCurvature;
      let newBranch = new Branch(this.end, this.angle + splitAngle, this.depth + 1, this);
      this.children.push(newBranch);
      branches.push(newBranch);
    }
  }
}

class Neuron {
  constructor(pos) {
    this.pos = pos; // {x,y}
    this.branches = [];
    this.maxBranches = 50;
  }

  init() {
    // First main branch
    let angle = randRange(0, Math.PI * 2);
    let mainBranch = new Branch(this.pos, angle, 0, null);
    this.branches.push(mainBranch);
    branches.push(mainBranch);
  }
  growBranches() {
    let growingBranches = 0;
    for (let branch of this.branches) {
      if (branch.growing) {
        let grew = branch.grow();
        if (grew) {
          growingBranches++;
          // Occasionally try to split
          if (Math.random() < 0.01) {
            branch.trySplit();
          }
        }
      }
    }
    // Add new child branches to neuron's branch list
    for (let branch of branches) {
      if (!this.branches.includes(branch) && branch.parent && this.branches.includes(branch.parent)) {
        this.branches.push(branch);
      }
    }
    // Limit total branches
    if (this.branches.length > this.maxBranches) {
      this.branches = this.branches.slice(0, this.maxBranches);
    }
    return growingBranches > 0;
  }
}

// === Synapse Detection ===
function detectSynapses() {
  synapses.length = 0;
  for (let i = 0; i < branches.length; i++) {
    let b1 = branches[i];
    // Only branch tips that finished growing
    if (b1.growing) continue;
    for (let j = i + 1; j < branches.length; j++) {
      let b2 = branches[j];
      if (b2.growing) continue;
      let d = dist(b1.end, b2.end);
      if (d > 0 && d < params.synapseDistanceThreshold) {
        // Prevent duplicates
        let exists = synapses.some(s =>
          (s.a === b1 && s.b === b2) || (s.a === b2 && s.b === b1)
        );
        if (!exists) {
          synapses.push({ a: b1, b: b2, glowPhase: Math.random() * Math.PI * 2 });
        }
      }
    }
  }
}

// === Pulse Animation ===
class Pulse {
  constructor(fromBranch, toBranch) {
    this.from = fromBranch;
    this.to = toBranch;
    this.progress = 0; // 0 to 1
  }
  update() {
    this.progress += params.pulseSpeed;
    if (this.progress >= 1) {
      this.progress = 1;
      return false; // pulse done
    }
    return true;
  }
  draw(ctx) {
    // Interpolate along quadratic Bezier curve (start, control, end)
    let t = this.progress;
    let p0 = this.from.end;
    let c = {
      x: (this.from.end.x + this.to.end.x) / 2 + (Math.sin(Date.now() * 0.005) * 10),
      y: (this.from.end.y + this.to.end.y) / 2 + (Math.cos(Date.now() * 0.005) * 10)
    };
    let p1 = this.to.end;

    let x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * c.x + t * t * p1.x;
    let y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * c.y + t * t * p1.y;

    ctx.save();
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 14 * params.pulseBrightness;
    ctx.fillStyle = params.pulseColor;
    ctx.beginPath();
    ctx.arc(x, y, 4 * params.pulseBrightness, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnRandomPulse() {
  if (synapses.length === 0) return;
  if (Math.random() < params.pulseFrequency) {
    let syn = synapses[Math.floor(Math.random() * synapses.length)];
    pulses.push(new Pulse(syn.a, syn.b));
  }
}

// === Rendering ===
function drawBackground() {
  // Fill background
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, width, height);

  // Scanlines
  ctx.strokeStyle = palette.gridScanline;
  ctx.lineWidth = 1;
  for (let y = 0; y < height; y += 4) {
    ctx.beginPath();
    ctx.moveTo(0, y + (Date.now() * 0.02 % 4));
    ctx.lineTo(width, y + (Date.now() * 0.02 % 4));
    ctx.stroke();
  }

  // Vignette
  let grd = ctx.createRadialGradient(width / 2, height / 2, width / 2 * 0.6, width / 2, height / 2, width / 2);
  grd.addColorStop(0, 'rgba(5,7,15,0)');
  grd.addColorStop(1, 'rgba(5,7,15,0.6)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, width, height);
}

function drawBranches() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let branch of branches) {
    let c = branch.depth === 0 ? params.branchColor : params.accentBranchColor;
    ctx.strokeStyle = c;
    ctx.lineWidth = branch.thickness;
    ctx.shadowColor = c;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(branch.start.x, branch.start.y);
    ctx.quadraticCurveTo(
      branch.curveControl.x, branch.curveControl.y,
      branch.end.x, branch.end.y
    );
    ctx.stroke();
  }
}

function drawSynapses() {
  for (let syn of synapses) {
    let glow = (Math.sin(Date.now() * 0.005 + syn.glowPhase) + 1) / 2;
    ctx.fillStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = glow * params.synapseGlowStrength;
    ctx.beginPath();
    ctx.arc(syn.a.end.x, syn.a.end.y, 5 + glow * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(syn.b.end.x, syn.b.end.y, 5 + glow * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function render() {
  drawBackground();
  drawBranches();
  drawSynapses();
  for (let p of pulses) {
    p.draw(ctx);
  }
}

// === Main Animation Loop ===
function animate() {
  if (!animationPaused) {
    // Grow neurons branches until stable
    let anyGrowing = false;
    for (let neuron of neurons) {
      anyGrowing = neuron.growBranches() || anyGrowing;
    }
    if (!anyGrowing && synapses.length === 0) {
      detectSynapses();
    }
    // Update pulses
    pulses = pulses.filter(p => p.update());
    spawnRandomPulse();
    // Render current state
    render();
  }
  requestAnimationFrame(animate);
}

// === Network Generation and Control ===
function clearNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  ctx.clearRect(0, 0, width, height);
}

function generateNetwork() {
  clearNetwork();
  let center = { x: width / 2, y: height / 2 };
  let count = Math.min(Math.max(3, params.neuronCount), 6);
  for (let i = 0; i < count; i++) {
    let pos = {
      x: center.x + randRange(-60, 60),
      y: center.y + randRange(-60, 60)
    };
    let neuron = new Neuron(pos);
    neuron.init();
    neurons.push(neuron);
  }
}

// === GUI Setup ===
const gui = new dat.GUI({ width: 320 });
gui.domElement.classList.add('ac');

const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(generateNetwork);
growthFolder.add(params, 'branchGrowthSpeed', 0.5, 6, 0.1).name('Branch Growth Speed');
growthFolder.add(params, 'maxBranchDepth', 1, 8, 1).name('Max Branch Depth');
growthFolder.add(params, 'branchSplitChance', 0, 0.5, 0.01).name('Branch Split Chance');
growthFolder.add(params, 'branchCurvature', 0, 1, 0.05).name('Branch Curvature');
growthFolder.add(params, 'maxBranchLength', 20, 180, 1).name('Max Branch Length');
growthFolder.open();

const synapsesFolder = gui.addFolder('Synapses');
synapsesFolder.add(params, 'synapseDistanceThreshold', 5, 40, 1).name('Synapse Distance Threshold');
synapsesFolder.add(params, 'synapseGlowStrength', 1, 30, 1).name('Synapse Glow Strength');
synapsesFolder.open();

const pulsesFolder = gui.addFolder('Pulses');
pulsesFolder.add(params, 'pulseSpeed', 0.005, 0.1, 0.005).name('Pulse Speed');
pulsesFolder.add(params, 'pulseFrequency', 0, 0.05, 0.001).name('Pulse Frequency');
pulsesFolder.add(params, 'pulseBrightness', 0, 1, 0.05).name('Pulse Brightness');
pulsesFolder.open();

const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'backgroundColor').name('Background Color');
visualsFolder.addColor(params, 'branchColor').name('Branch Color');
visualsFolder.addColor(params, 'accentBranchColor').name('Accent Branch Color');
visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
visualsFolder.open();

// Buttons
const actions = {
  regenerate: generateNetwork,
  clearCanvas: () => {
    clearNetwork();
    render();
  },
  pauseResume: () => {
    animationPaused = !animationPaused;
  }
};
gui.add(actions, 'regenerate').name('Regenerate Network');
gui.add(actions, 'clearCanvas').name('Clear Canvas');
gui.add(actions, 'pauseResume').name('Pause/Resume Animation');

// Initialize
generateNetwork();
animate();
</script>
</body>
</html>
