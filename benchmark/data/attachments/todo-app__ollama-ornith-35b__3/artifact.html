<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f7fb;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 24px;
    color: #2c3e50;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid #d1d9e6;
    border-radius: 8px;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: #4a90d9; }
  .input-row button {
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: #4a90d9;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s;
  }
  .input-row button:hover { background: #3a7bc8; }
  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #e8ecf2;
    border-radius: 8px;
    padding: 4px;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    font-size: .9rem;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    color: #5a6a7e;
    transition: all .2s;
  }
  .filters button.active {
    background: #fff;
    color: #4a90d9;
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    padding: 12px 14px;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .2s;
  }
  .todo-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #4a90d9;
  }
  .todo-item .text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }
  .todo-item .text.completed {
    text-decoration: line-through;
    color: #9aa5b4;
  }
  .todo-item .delete-btn {
    background: none;
    border: none;
    color: #c0392b;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
    padding: 0 4px;
  }
  .todo-item:hover .delete-btn { opacity: 1; }
  .empty {
    text-align: center;
    color: #9aa5b4;
    padding: 32px 0;
    font-size: 1rem;
  }
  .counter {
    text-align: center;
    margin-top: 16px;
    font-size: .85rem;
    color: #9aa5b4;
  }
</style>
</head>
<body>
<div class="app">
  <h1>📝 Todo App</h1>
  <div class="input-row">
    <input id="todoInput" type="text" placeholder="What needs to be done?" autofocus>
    <button id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
  <div class="counter" id="counter"></div>
</div>
<script>
  const STORAGE_KEY = 'todo_ollama_ornith_35b_todos';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('todoList');
  const counter = document.getElementById('counter');
  const filterBtns = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    input.value = '';
    save();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.completed = !todo.completed;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function getFiltered() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const filtered = getFiltered();
    if (filtered.length === 0) {
      list.innerHTML = '<li class="empty">No todos here.</li>';
    } else {
      list.innerHTML = filtered.map(t => `
        <li class="todo-item">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id})">
          <span class="text ${t.completed ? 'completed' : ''}">${escapeHtml(t.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${t.id})" title="Delete">&times;</button>
        </li>
      `).join('');
    }
    const remaining = todos.filter(t => !t.completed).length;
    counter.textContent = `${remaining} item${remaining !== 1 ? 's' : ''} left`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
