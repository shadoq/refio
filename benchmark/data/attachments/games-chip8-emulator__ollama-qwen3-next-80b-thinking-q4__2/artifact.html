<!DOCTYPE html>
<html>
<head>
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            font-family: monospace;
            background: #222;
            color: #eee;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #display {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 512px;
            height: 256px;
            border: 2px solid #444;
            background: #000;
        }
        #keypad {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            grid-template-rows: repeat(4, 60px);
            gap: 5px;
            margin: 10px 0;
        }
        .key {
            background: #444;
            border: 1px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }
        .key.pressed {
            background: #666;
        }
        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 5px 10px;
            background: #444;
            color: #eee;
            border: 1px solid #666;
            cursor: pointer;
        }
        #debugger {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            max-width: 600px;
        }
        .debug-section {
            background: #333;
            padding: 10px;
            border-radius: 4px;
        }
        .debug-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #ff8000;
        }
        .debug-value {
            margin: 2px 0;
            font-family: monospace;
        }
        #rom-loader {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="run">Run</button>
        <button id="pause">Pause</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
        <label for="speed">Speed:</label>
        <input type="range" id="speed" min="1" max="100" value="50">
    </div>
    <canvas id="display" width="64" height="32"></canvas>
    <div id="keypad">
        <div class="key" data-key="1">1</div>
        <div class="key" data-key="2">2</div>
        <div class="key" data-key="3">3</div>
        <div class="key" data-key="C">C</div>
        <div class="key" data-key="4">4</div>
        <div class="key" data-key="5">5</div>
        <div class="key" data-key="6">6</div>
        <div class="key" data-key="D">D</div>
        <div class="key" data-key="7">7</div>
        <div class="key" data-key="8">8</div>
        <div class="key" data-key="9">9</div>
        <div class="key" data-key="E">E</div>
        <div class="key" data-key="A">A</div>
        <div class="key" data-key="0">0</div>
        <div class="key" data-key="B">B</div>
        <div class="key" data-key="F">F</div>
    </div>
    <div id="debugger">
        <div class="debug-section">
            <div class="debug-title">Registers</div>
            <div class="debug-value">V0: 0x00</div>
            <div class="debug-value">V1: 0x00</div>
            <div class="debug-value">V2: 0x00</div>
            <div class="debug-value">V3: 0x00</div>
            <div class="debug-value">V4: 0x00</div>
            <div class="debug-value">V5: 0x00</div>
            <div class="debug-value">V6: 0x00</div>
            <div class="debug-value">V7: 0x00</div>
            <div class="debug-value">V8: 0x00</div>
            <div class="debug-value">V9: 0x00</div>
            <div class="debug-value">VA: 0x00</div>
            <div class="debug-value">VB: 0x00</div>
            <div class="debug-value">VC: 0x00</div>
            <div class="debug-value">VD: 0x00</div>
            <div class="debug-value">VE: 0x00</div>
            <div class="debug-value">VF: 0x00</div>
        </div>
        <div class="debug-section">
            <div class="debug-title">Other</div>
            <div class="debug-value">I: 0x0000</div>
            <div class="debug-value">PC: 0x0000</div>
            <div class="debug-value">Delay: 0</div>
            <div class="debug-value">Sound: 0</div>
            <div class="debug-title">Stack</div>
            <div class="debug-value">Empty</div>
        </div>
        <div class="debug-section" style="grid-column: span 2;">
            <div class="debug-title">Current Instruction</div>
            <div class="debug-value">0x0000</div>
        </div>
    </div>
    <input type="file" id="rom-loader" accept=".ch8,.bin">

    <script>
        // CHIP-8 Emulator
        const CHIP8 = {
            memory: new Uint8Array(4096),
            V: new Uint8Array(16),
            I: 0,
            PC: 0x200,
            stack: [],
            delayTimer: 0,
            soundTimer: 0,
            display: new Uint8Array(64 * 32),
            keyState: new Uint8Array(16),
            running: false,
            speed: 50,
            currentInstruction: 0,
            instructionCount: 0,
            font: [
                0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
                0x20, 0x60, 0x20, 0x20, 0x70, // 1
                0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
                0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
                0x90, 0x90, 0xF0, 0x10, 0x10, // 4
                0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
                0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
                0xF0, 0x10, 0x20, 0x40, 0x40, // 7
                0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
                0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
                0xF0, 0x90, 0xF0, 0x90, 0x90, // A
                0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
                0xF0, 0x80, 0x80, 0x80, 0xF0, // C
                0xE0, 0x90, 0x90, 0x90, 0xE0, // D
                0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
                0xF0, 0x80, 0xF0, 0x80, 0x80  // F
            ],
            demoROM: [
                0x00, 0xE0, // Clear display
                0x60, 0x0A, // V0 = 10
                0x61, 0x0A, // V1 = 10
                0xA2, 0x00, // I = 0x200
                0xD0, 0x14, // Draw sprite (4x4)
                0xF0, 0x0A, // Wait for key press
                0x30, 0x04, // Skip if V0 == 4 (left)
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x70, 0xFF, // V0 -= 1
                0xD0, 0x14, // Draw again
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x30, 0x06, // Skip if V0 == 6 (right)
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x70, 0x01, // V0 += 1
                0xD0, 0x14, // Draw again
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x30, 0x08, // Skip if V0 == 8 (up)
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x71, 0xFF, // V1 -= 1
                0xD0, 0x14, // Draw again
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x30, 0x0A, // Skip if V0 == 10 (down)
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x71, 0x01, // V1 += 1
                0xD0, 0x14, // Draw again
                0x10, 0x00, // Jump to 0x000 (placeholder)
                0x00, 0xE0, // Clear display (for reset)
                0x00, 0xEE  // Return from subroutine
            ],
            spriteData: [
                0x0F, 0x0F, 0x0F, 0x0F // 4x4 square
            ]
        };

        // Initialize the emulator
        function init() {
            // Load font into memory at 0x050
            for (let i = 0; i < CHIP8.font.length; i++) {
                CHIP8.memory[0x050 + i] = CHIP8.font[i];
            }
            
            // Load demo ROM into memory at 0x200
            for (let i = 0; i < CHIP8.demoROM.length; i++) {
                CHIP8.memory[0x200 + i] = CHIP8.demoROM[i];
            }
            
            // Load sprite data into memory at 0x200 + CHIP8.demoROM.length
            for (let i = 0; i < CHIP8.spriteData.length; i++) {
                CHIP8.memory[0x200 + CHIP8.demoROM.length + i] = CHIP8.spriteData[i];
            }
            
            // Reset state
            CHIP8.PC = 0x200;
            CHIP8.I = 0;
            CHIP8.stack.length = 0;
            CHIP8.delayTimer = 0;
            CHIP8.soundTimer = 0;
            CHIP8.V.fill(0);
            CHIP8.display.fill(0);
            CHIP8.keyState.fill(0);
            CHIP8.currentInstruction = 0;
            CHIP8.instructionCount = 0;
            updateDebugger();
        }

        // Update debugger display
        function updateDebugger() {
            const debugElements = document.querySelectorAll('.debug-value');
            debugElements[0].textContent = `V0: 0x${CHIP8.V[0].toString(16).padStart(2, '0')}`;
            debugElements[1].textContent = `V1: 0x${CHIP8.V[1].toString(16).padStart(2, '0')}`;
            debugElements[2].textContent = `V2: 0x${CHIP8.V[2].toString(16).padStart(2, '0')}`;
            debugElements[3].textContent = `V3: 0x${CHIP8.V[3].toString(16).padStart(2, '0')}`;
            debugElements[4].textContent = `V4: 0x${CHIP8.V[4].toString(16).padStart(2, '0')}`;
            debugElements[5].textContent = `V5: 0x${CHIP8.V[5].toString(16).padStart(2, '0')}`;
            debugElements[6].textContent = `V6: 0x${CHIP8.V[6].toString(16).padStart(2, '0')}`;
            debugElements[7].textContent = `V7: 0x${CHIP8.V[7].toString(16).padStart(2, '0')}`;
            debugElements[8].textContent = `V8: 0x${CHIP8.V[8].toString(16).padStart(2, '0')}`;
            debugElements[9].textContent = `V9: 0x${CHIP8.V[9].toString(16).padStart(2, '0')}`;
            debugElements[10].textContent = `VA: 0x${CHIP8.V[10].toString(16).padStart(2, '0')}`;
            debugElements[11].textContent = `VB: 0x${CHIP8.V[11].toString(16).padStart(2, '0')}`;
            debugElements[12].textContent = `VC: 0x${CHIP8.V[12].toString(16).padStart(2, '0')}`;
            debugElements[13].textContent = `VD: 0x${CHIP8.V[13].toString(16).padStart(2, '0')}`;
            debugElements[14].textContent = `VE: 0x${CHIP8.V[14].toString(16).padStart(2, '0')}`;
            debugElements[15].textContent = `VF: 0x${CHIP8.V[15].toString(16).padStart(2, '0')}`;
            debugElements[16].textContent = `I: 0x${CHIP8.I.toString(16).padStart(4, '0')}`;
            debugElements[17].textContent = `PC: 0x${CHIP8.PC.toString(16).padStart(4, '0')}`;
            debugElements[18].textContent = `Delay: ${CHIP8.delayTimer}`;
            debugElements[19].textContent = `Sound: ${CHIP8.soundTimer}`;
            
            let stackText = 'Empty';
            if (CHIP8.stack.length > 0) {
                stackText = CHIP8.stack.map(addr => `0x${addr.toString(16).padStart(4, '0')}`).join(', ');
            }
            debugElements[20].textContent = stackText;
            
            debugElements[21].textContent = `0x${CHIP8.currentInstruction.toString(16).padStart(4, '0')}`;
        }

        // Fetch next instruction
        function fetchInstruction() {
            const op = (CHIP8.memory[CHIP8.PC] << 8) | CHIP8.memory[CHIP8.PC + 1];
            CHIP8.currentInstruction = op;
            return op;
        }

        // Execute instruction
        function executeInstruction(op) {
            const x = (op & 0x0F00) >> 8;
            const y = (op & 0x00F0) >> 4;
            const n = op & 0x000F;
            const nn = op & 0x00FF;
            const nnn = op & 0x0FFF;
            
            switch (op & 0xF000) {
                case 0x0000:
                    if (op === 0x00E0) {
                        // Clear display
                        CHIP8.display.fill(0);
                    } else if (op === 0x00EE) {
                        // Return from subroutine
                        CHIP8.PC = CHIP8.stack.pop();
                    }
                    break;
                case 0x1000:
                    // Jump to address NNN
                    CHIP8.PC = nnn;
                    return;
                case 0x2000:
                    // Call subroutine at NNN
                    CHIP8.stack.push(CHIP8.PC);
                    CHIP8.PC = nnn;
                    return;
                case 0x3000:
                    // Skip if VX == NN
                    if (CHIP8.V[x] === nn) {
                        CHIP8.PC += 2;
                    }
                    break;
                case 0x4000:
                    // Skip if VX != NN
                    if (CHIP8.V[x] !== nn) {
                        CHIP8.PC += 2;
                    }
                    break;
                case 0x5000:
                    // Skip if VX == VY
                    if (CHIP8.V[x] === CHIP8.V[y]) {
                        CHIP8.PC += 2;
                    }
                    break;
                case 0x6000:
                    // Set VX = NN
                    CHIP8.V[x] = nn;
                    break;
                case 0x7000:
                    // Add NN to VX
                    CHIP8.V[x] = (CHIP8.V[x] + nn) & 0xFF;
                    break;
                case 0x8000:
                    switch (n) {
                        case 0x0:
                            // Set VX = VY
                            CHIP8.V[x] = CHIP8.V[y];
                            break;
                        case 0x1:
                            // VX = VX | VY
                            CHIP8.V[x] |= CHIP8.V[y];
                            break;
                        case 0x2:
                            // VX = VX & VY
                            CHIP8.V[x] &= CHIP8.V[y];
                            break;
                        case 0x3:
                            // VX = VX ^ VY
                            CHIP8.V[x] ^= CHIP8.V[y];
                            break;
                        case 0x4:
                            // VX += VY, set VF = carry
                            const sum = CHIP8.V[x] + CHIP8.V[y];
                            CHIP8.V[x] = sum & 0xFF;
                            CHIP8.V[0xF] = sum > 0xFF ? 1 : 0;
                            break;
                        case 0x5:
                            // VX -= VY, set VF = no borrow
                            CHIP8.V[0xF] = CHIP8.V[x] > CHIP8.V[y] ? 1 : 0;
                            CHIP8.V[x] = (CHIP8.V[x] - CHIP8.V[y] + 0x100) & 0xFF;
                            break;
                        case 0x6:
                            // VX >>= 1, VF = least significant bit
                            CHIP8.V[0xF] = CHIP8.V[x] & 1;
                            CHIP8.V[x] >>= 1;
                            break;
                        case 0x7:
                            // VX = VY - VX, set VF = no borrow
                            CHIP8.V[0xF] = CHIP8.V[y] > CHIP8.V[x] ? 1 : 0;
                            CHIP8.V[x] = (CHIP8.V[y] - CHIP8.V[x] + 0x100) & 0xFF;
                            break;
                        case 0xE:
                            // VX <<= 1, VF = most significant bit
                            CHIP8.V[0xF] = (CHIP8.V[x] >> 7) & 1;
                            CHIP8.V[x] = (CHIP8.V[x] << 1) & 0xFF;
                            break;
                    }
                    break;
                case 0x9000:
                    // Skip if VX != VY
                    if (CHIP8.V[x] !== CHIP8.V[y]) {
                        CHIP8.PC += 2;
                    }
                    break;
                case 0xA000:
                    // Set I = NNN
                    CHIP8.I = nnn;
                    break;
                case 0xB000:
                    // Jump to address NNN + V0
                    CHIP8.PC = nnn + CHIP8.V[0];
                    return;
                case 0xC000:
                    // VX = random & NN
                    CHIP8.V[x] = Math.floor(Math.random() * 256) & nn;
                    break;
                case 0xD000:
                    // Draw sprite at (VX, VY), height N
                    const xCoord = CHIP8.V[x] % 64;
                    const yCoord = CHIP8.V[y] % 32;
                    CHIP8.V[0xF] = 0;
                    
                    for (let row = 0; row < n; row++) {
                        const spriteByte = CHIP8.memory[CHIP8.I + row];
                        for (let col = 0; col < 8; col++) {
                            if (spriteByte & (0x80 >> col)) {
                                const pixelIndex = (yCoord + row) * 64 + (xCoord + col);
                                if (pixelIndex >= 0 && pixelIndex < CHIP8.display.length) {
                                    if (CHIP8.display[pixelIndex] === 1) {
                                        CHIP8.V[0xF] = 1;
                                    }
                                    CHIP8.display[pixelIndex] ^= 1;
                                }
                            }
                        }
                    }
                    break;
                case 0xE000:
                    if (nn === 0x9E) {
                        // Skip if key VX is pressed
                        if (CHIP8.keyState[CHIP8.V[x]] === 1) {
                            CHIP8.PC += 2;
                        }
                    } else if (nn === 0xA1) {
                        // Skip if key VX is not pressed
                        if (CHIP8.keyState[CHIP8.V[x]] === 0) {
                            CHIP8.PC += 2;
                        }
                    }
                    break;
                case 0xF000:
                    switch (nn) {
                        case 0x07:
                            // VX = delay timer
                            CHIP8.V[x] = CHIP8.delayTimer;
                            break;
                        case 0x0A:
                            // Wait for key press
                            let keyPressed = false;
                            for (let i = 0; i < 16; i++) {
                                if (CHIP8.keyState[i] === 1) {
                                    CHIP8.V[x] = i;
                                    keyPressed = true;
                                    break;
                                }
                            }
                            if (!keyPressed) {
                                CHIP8.PC -= 2; // Re-execute this instruction
                            }
                            break;
                        case 0x15:
                            // Set delay timer = VX
                            CHIP8.delayTimer = CHIP8.V[x];
                            break;
                        case 0x18:
                            // Set sound timer = VX
                            CHIP8.soundTimer = CHIP8.V[x];
                            break;
                        case 0x1E:
                            // I += VX
                            CHIP8.I += CHIP8.V[x];
                            break;
                        case 0x29:
                            // Set I = sprite address for VX
                            CHIP8.I = 0x050 + (CHIP8.V[x] * 5);
                            break;
                        case 0x33:
                            // Store BCD of VX in memory starting at I
                            const vx = CHIP8.V[x];
                            CHIP8.memory[CHIP8.I] = Math.floor(vx / 100);
                            CHIP8.memory[CHIP8.I + 1] = Math.floor((vx % 100) / 10);
                            CHIP8.memory[CHIP8.I + 2] = vx % 10;
                            break;
                        case 0x55:
                            // Store V0-VX in memory starting at I
                            for (let i = 0; i <= x; i++) {
                                CHIP8.memory[CHIP8.I + i] = CHIP8.V[i];
                            }
                            break;
                        case 0x65:
                            // Load V0-VX from memory starting at I
                            for (let i = 0; i <= x; i++) {
                                CHIP8.V[i] = CHIP8.memory[CHIP8.I + i];
                            }
                            break;
                    }
                    break;
            }
            
            CHIP8.PC += 2;
        }

        // Update timers
        function updateTimers() {
            if (CHIP8.delayTimer > 0) {
                CHIP8.delayTimer--;
            }
            if (CHIP8.soundTimer > 0) {
                CHIP8.soundTimer--;
                // Play sound (not implemented in this simple emulator)
            }
        }

        // Draw display to canvas
        function drawDisplay() {
            const canvas = document.getElementById('display');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 64; x++) {
                    const index = y * 64 + x;
                    if (CHIP8.display[index] === 1) {
                        ctx.fillStyle = '#0F0';
                        ctx.fillRect(x * 8, y * 8, 8, 8);
                    }
                }
            }
        }

        // Handle key events
        function handleKey(event, pressed) {
            const keyMap = {
                '1': 1, '2': 2, '3': 3, '4': 4,
                'q': 5, 'w': 6, 'e': 7, 'r': 8,
                'a': 9, 's': 0, 'd': 10, 'f': 11,
                'z': 12, 'x': 13, 'c': 14, 'v': 15
            };
            
            const key = event.key.toLowerCase();
            if (keyMap[key] !== undefined) {
                const keyCode = keyMap[key];
                CHIP8.keyState[keyCode] = pressed ? 1 : 0;
                
                // Update keypad visual
                const keyElement = document.querySelector(`.key[data-key="${keyCode}"]`);
                if (keyElement) {
                    keyElement.classList.toggle('pressed', pressed);
                }
            }
        }

        // Main emulator loop
        function emulatorLoop() {
            if (!CHIP8.running) return;
            
            // Execute one instruction
            const op = fetchInstruction();
            executeInstruction(op);
            CHIP8.instructionCount++;
            
            // Update timers at 60Hz
            if (CHIP8.instructionCount % (60 / (CHIP8.speed / 100)) === 0) {
                updateTimers();
            }
            
            // Update display
            drawDisplay();
            updateDebugger();
            
            // Continue loop
            setTimeout(emulatorLoop, 1000 / (60 * (CHIP8.speed / 100)));
        }

        // Start emulator
        function startEmulator() {
            CHIP8.running = true;
            emulatorLoop();
        }

        // Pause emulator
        function pauseEmulator() {
            CHIP8.running = false;
        }

        // Step one instruction
        function stepEmulator() {
            if (!CHIP8.running) {
                CHIP8.running = true;
                emulatorLoop();
                setTimeout(() => {
                    CHIP8.running = false;
                }, 0);
            }
        }

        // Reset emulator
        function resetEmulator() {
            pauseEmulator();
            init();
            drawDisplay();
            updateDebugger();
        }

        // Load ROM from file
        function loadROM(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                // Clear memory from 0x200 onwards
                for (let i = 0x200; i < 4096; i++) {
                    CHIP8.memory[i] = 0;
                }
                // Copy ROM data
                for (let i = 0; i < data.length && i < 4096 - 0x200; i++) {
                    CHIP8.memory[0x200 + i] = data[i];
                }
                resetEmulator();
            };
            reader.readAsArrayBuffer(file);
        }

        // Initialize event listeners
        document.getElementById('run').addEventListener('click', startEmulator);
        document.getElementById('pause').addEventListener('click', pauseEmulator);
        document.getElementById('step').addEventListener('click', stepEmulator);
        document.getElementById('reset').addEventListener('click', resetEmulator);
        document.getElementById('speed').addEventListener('input', function() {
            CHIP8.speed = this.value;
        });
        document.getElementById('rom-loader').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                loadROM(e.target.files[0]);
            }
        });
        
        // Key events
        window.addEventListener('keydown', function(e) {
            handleKey(e, true);
        });
        window.addEventListener('keyup', function(e) {
            handleKey(e, false);
        });
        
        // Keypad click events
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function() {
                const keyCode = parseInt(this.dataset.key);
                if (!isNaN(keyCode)) {
                    CHIP8.keyState[keyCode] = 1;
                    this.classList.add('pressed');
                }
            });
            key.addEventListener('mouseup', function() {
                const keyCode = parseInt(this.dataset.key);
                if (!isNaN(keyCode)) {
                    CHIP8.keyState[keyCode] = 0;
                    this.classList.remove('pressed');
                }
            });
        });
        
        // Initialize
        init();
        drawDisplay();
        updateDebugger();
    </script>
</body>
</html>
