<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Todo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #17233b;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(24px, 7vw, 80px) 20px;
      background: radial-gradient(circle at 50% 0%, #e9edff 0, #f6f7fb 420px);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 640px);
      margin: 0 auto;
    }

    .heading {
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5047ae;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #526078;
      line-height: 1.5;
    }

    .card {
      overflow: hidden;
      border: 1px solid #e1e5ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(30, 43, 84, 0.09);
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 24px;
      border-bottom: 1px solid #e9ecf3;
    }

    .todo-input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #cbd2e0;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #17233b;
    }

    .todo-input::placeholder {
      color: #68758b;
    }

    .todo-input:focus-visible {
      border-color: #6154c6;
      box-shadow: 0 0 0 3px rgba(97, 84, 198, 0.17);
    }

    .add-button {
      padding: 13px 21px;
      border: 1px solid #5144ae;
      border-radius: 10px;
      background: #5144ae;
      color: #fff;
      font-weight: 700;
      white-space: nowrap;
    }

    .add-button:hover {
      background: #40358f;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 24px;
      border-bottom: 1px solid #e9ecf3;
    }

    .count {
      margin: 0;
      color: #526078;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .filter-button {
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #46546d;
      font-size: 0.88rem;
      font-weight: 650;
    }

    .filter-button:hover {
      background: #f0effa;
    }

    .filter-button[aria-pressed="true"] {
      border-color: #e1ddf8;
      background: #eeebfb;
      color: #40358f;
    }

    .todo-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 66px;
      padding: 14px 24px;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #edf0f5;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      margin: 0;
      flex: none;
      accent-color: #5144ae;
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .todo-item.completed .todo-text {
      color: #68758b;
      text-decoration: line-through;
      text-decoration-color: #8993a5;
    }

    .delete-button {
      flex: none;
      padding: 7px 10px;
      border: 1px solid #e1e5ef;
      border-radius: 8px;
      background: #fff;
      color: #9b3045;
      font-size: 0.85rem;
      font-weight: 650;
    }

    .delete-button:hover {
      border-color: #f1c7cf;
      background: #fff2f4;
    }

    .empty-state {
      padding: 52px 24px;
      color: #526078;
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 7px;
      color: #17233b;
      font-size: 1.1rem;
    }

    .empty-state p {
      margin: 0;
      line-height: 1.5;
    }

    :focus-visible {
      outline: 3px solid #786ce1;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .add-form {
        padding: 18px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 16px 18px;
      }

      .todo-item {
        padding-right: 18px;
        padding-left: 18px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      button {
        transition: background-color 150ms ease, border-color 150ms ease;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="heading">
      <p class="eyebrow">Your space to focus</p>
      <h1>Things to do.</h1>
      <p class="subtitle">Keep the little things organized, one task at a time.</p>
    </header>

    <section class="card" aria-label="Todo list">
      <form class="add-form" id="add-form">
        <input class="todo-input" id="todo-input" type="text" aria-label="New todo" placeholder="What needs to get done?" autocomplete="off" required>
        <button class="add-button" type="submit">Add</button>
      </form>

      <div class="toolbar">
        <p class="count" id="count" aria-live="polite"></p>
        <div class="filters" role="group" aria-label="Filter todos">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul class="todo-list" id="todo-list" aria-label="Todos"></ul>
      <div class="empty-state" id="empty-state" hidden></div>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = "todo_openai-gpt-6-sol_01";
      const form = document.getElementById("add-form");
      const input = document.getElementById("todo-input");
      const list = document.getElementById("todo-list");
      const count = document.getElementById("count");
      const emptyState = document.getElementById("empty-state");
      const filterButtons = document.querySelectorAll(".filter-button");
      let filter = "all";
      let idCounter = 0;

      function newId() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return `${Date.now()}-${++idCounter}-${Math.random().toString(36).slice(2)}`;
      }

      function loadTodos() {
        try {
          const stored = JSON.parse(localStorage.getItem(storageKey));
          if (!Array.isArray(stored)) return [];
          const ids = new Set();
          return stored.reduce((valid, todo) => {
            if (!todo || typeof todo !== "object" || typeof todo.text !== "string" ||
                !todo.text.trim() || typeof todo.completed !== "boolean") return valid;
            let id = typeof todo.id === "string" && todo.id ? todo.id : newId();
            while (ids.has(id)) id = newId();
            ids.add(id);
            valid.push({ id, text: todo.text.trim(), completed: todo.completed });
            return valid;
          }, []);
        } catch {
          return [];
        }
      }

      let todos = loadTodos();

      function saveTodos() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(todos));
        } catch {
          // The app remains usable when storage is unavailable.
        }
      }

      function render() {
        const activeCount = todos.filter(todo => !todo.completed).length;
        count.textContent = `${activeCount} ${activeCount === 1 ? "item" : "items"} left`;

        filterButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });

        const visibleTodos = todos.filter(todo =>
          filter === "all" || (filter === "active" ? !todo.completed : todo.completed)
        );
        list.replaceChildren();

        visibleTodos.forEach(todo => {
          const item = document.createElement("li");
          item.className = `todo-item${todo.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "todo-checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `${todo.completed ? "Mark as active" : "Mark as complete"}: ${todo.text}`);
          checkbox.addEventListener("change", () => {
            todo.completed = checkbox.checked;
            saveTodos();
            render();
          });

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute("aria-label", `Delete: ${todo.text}`);
          deleteButton.addEventListener("click", () => {
            todos = todos.filter(item => item.id !== todo.id);
            saveTodos();
            render();
          });

          item.append(checkbox, text, deleteButton);
          list.append(item);
        });

        emptyState.hidden = visibleTodos.length !== 0;
        if (!visibleTodos.length) {
          const messages = {
            all: ["Nothing on your list yet.", "Add a task above to get started."],
            active: ["All caught up!", "There are no active tasks right now."],
            completed: ["No completed tasks yet.", "Tasks you finish will show up here."]
          };
          const heading = document.createElement("strong");
          const description = document.createElement("p");
          heading.textContent = messages[filter][0];
          description.textContent = messages[filter][1];
          emptyState.replaceChildren(heading, description);
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        todos.push({ id: newId(), text, completed: false });
        saveTodos();
        form.reset();
        input.focus();
        render();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
