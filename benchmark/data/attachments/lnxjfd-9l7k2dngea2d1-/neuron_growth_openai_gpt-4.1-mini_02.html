<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neuron Growth Simulation</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070f;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    color: #ffd400;
    font-family: monospace, monospace;
  }
  #container {
    position: relative;
  }
  canvas {
    display: block;
    background: #05070f;
    box-shadow: 0 0 60px 15px #101a3a inset;
    border-radius: 8px;
  }
  .dg.main {
    position: fixed !important;
    top: 10px !important;
    right: 10px !important;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas" width="800" height="800"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
// === Setup ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Neon palette
const palette = {
  bg: '#05070f',
  bgGlow: '#101a3a',
  branchMain: '#00e5ff',
  branchAccent: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  uiAccent: '#ffd400',
  scanline: 'rgba(0, 229, 255, 0.08)'
};

// Parameters for GUI and simulation
const params = {
  neuronCount: 4,
  growthSpeed: 2.5,          // pixels per frame
  maxBranchDepth: 6,
  branchSplitChance: 0.18,   // chance to split per growth step
  branchCurvature: 0.45,     // max curvature factor (0..1)
  maxBranchLength: 120,

  synapseDistThreshold: 18,
  synapseGlowStrength: 0.85,

  pulseSpeed: 0.008,         // progress per frame
  pulseFrequency: 0.07,      // chance per frame to spawn new pulse
  pulseBrightness: 1.0,

  backgroundColor: palette.bg,
  branchColor: palette.branchMain,
  accentBranchColor: palette.branchAccent,
  synapseColor: palette.synapse,
  pulseColor: palette.pulse,

  regenerateNetwork: () => { regenerateNetwork(); },
  clearCanvas: () => { clearCanvas(); },
  pauseResume: () => { togglePause(); }
};

// === Data Structures ===
class Branch {
  constructor(parent, start, dir, depth) {
    this.parent = parent; // parent Branch or null
    this.start = start;   // {x,y}
    this.dir = dir;       // normalized direction vector {x,y}
    this.points = [start]; // points for curve growth
    this.depth = depth;   // recursion depth
    this.length = 0;      // current length
    this.maxLength = params.maxBranchLength * (0.7 + Math.random() * 0.6);
    this.finished = false;
    this.thickness = 1 + Math.random() * 1.4;
    this.children = [];
  }

  grow() {
    if (this.finished) return;
    // Grow branch by growthSpeed
    const step = params.growthSpeed;
    let lastPoint = this.points[this.points.length - 1];

    // Apply curvature with random small angle changes
    const angleChange = (Math.random() - 0.5) * params.branchCurvature;
    let angle = Math.atan2(this.dir.y, this.dir.x) + angleChange;
    this.dir = {x: Math.cos(angle), y: Math.sin(angle)};

    let newPoint = {
      x: lastPoint.x + this.dir.x * step,
      y: lastPoint.y + this.dir.y * step
    };

    this.points.push(newPoint);
    this.length += step;

    // Limit length
    if (this.length > this.maxLength || this.depth >= params.maxBranchDepth) {
      this.finished = true;
    } else {
      // Possibly split
      if (Math.random() < params.branchSplitChance) {
        this.finished = true;
      }
    }
  }

  getTip() {
    return this.points[this.points.length - 1];
  }
}

class Neuron {
  constructor(pos) {
    this.pos = pos; // {x,y}
    this.branches = [];
    // Create initial branch direction randomly
    const angle = Math.random() * Math.PI * 2;
    this.branches.push(new Branch(null, pos, {x: Math.cos(angle), y: Math.sin(angle)}, 0));
  }

  grow() {
    const newBranches = [];
    this.branches.forEach(branch => {
      if (!branch.finished) {
        branch.grow();
        // Possibly generate side branches
        if (!branch.finished && Math.random() < params.branchSplitChance * 0.3 && branch.depth < params.maxBranchDepth - 1) {
          const tip = branch.getTip();
          const angle = Math.random() * Math.PI * 2;
          const dir = {x: Math.cos(angle), y: Math.sin(angle)};
          const newBranch = new Branch(branch, tip, dir, branch.depth + 1);
          newBranches.push(newBranch);
          branch.children.push(newBranch);
        }
      }
    });
    this.branches.push(...newBranches);
  }

  getTips() {
    return this.branches.filter(b => !b.finished).map(b => b.getTip());
  }
}

class Synapse {
  constructor(branchA, branchB) {
    this.branchA = branchA;
    this.branchB = branchB;
    this.pulseProgress = 0; // 0..1
    this.pulseActive = false;
  }

  startPulse() {
    this.pulseActive = true;
    this.pulseProgress = 0;
  }

  update() {
    if (this.pulseActive) {
      this.pulseProgress += params.pulseSpeed;
      if (this.pulseProgress >= 1) {
        this.pulseActive = false;
      }
    }
  }

  getPosition() {
    // Interpolate pulse position along synapse
    const aTip = this.branchA.getTip();
    const bTip = this.branchB.getTip();
    const t = this.pulseProgress;
    return {
      x: aTip.x * (1 - t) + bTip.x * t,
      y: aTip.y * (1 - t) + bTip.y * t
    };
  }
}

// === Global State ===
let neurons = [];
let synapses = [];
let pulses = [];
let paused = false;

// === Setup Functions ===
function regenerateNetwork() {
  neurons = [];
  synapses = [];
  pulses = [];

  // Generate 3-6 seed neurons near center
  const center = {x: W/2, y: H/2};
  const count = Math.min(Math.max(3, params.neuronCount), 6);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 20 + Math.random() * 30;
    const pos = {
      x: center.x + Math.cos(angle) * radius,
      y: center.y + Math.sin(angle) * radius
    };
    neurons.push(new Neuron(pos));
  }
}

function clearCanvas() {
  ctx.clearRect(0, 0, W, H);
}

function togglePause() {
  paused = !paused;
}

// === Synapse Detection ===
function detectSynapses() {
  synapses = [];
  const tips = [];
  neurons.forEach(neuron => {
    neuron.branches.forEach(branch => {
      if (!branch.finished) {
        tips.push(branch);
      }
    });
  });

  // Check pairs for proximity
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const aTip = tips[i].getTip();
      const bTip = tips[j].getTip();
      const dx = aTip.x - bTip.x;
      const dy = aTip.y - bTip.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < params.synapseDistThreshold) {
        // Check if synapse already exists between these branches
        if (!synapses.some(s => (s.branchA === tips[i] && s.branchB === tips[j]) || (s.branchA === tips[j] && s.branchB === tips[i]))) {
          synapses.push(new Synapse(tips[i], tips[j]));
        }
      }
    }
  }
}

// === Pulse Animation ===
function updatePulses() {
  // Update existing pulses
  synapses.forEach(syn => syn.update());

  // Possibly spawn new pulses randomly
  if (Math.random() < params.pulseFrequency) {
    const available = synapses.filter(s => !s.pulseActive);
    if (available.length > 0) {
      const syn = available[Math.floor(Math.random() * available.length)];
      syn.startPulse();
    }
  }
}

// === Rendering ===
function drawBranches() {
  neurons.forEach(neuron => {
    neuron.branches.forEach(branch => {
      const points = branch.points;
      if (points.length < 2) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // Choose color based on branch depth
      const color = (branch.depth < 2) ? params.branchColor : params.accentBranchColor;
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.lineWidth = branch.thickness;

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length - 1; i++) {
        // Quadratic curve approximation
        const cp = points[i];
        const next = points[i + 1];
        const cpx = cp.x;
        const cpy = cp.y;
        const x = (cp.x + next.x) / 2;
        const y = (cp.y + next.y) / 2;
        ctx.quadraticCurveTo(cpx, cpy, x, y);
      }
      // Line to last point
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
    });
  });
}

function drawSynapses() {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  synapses.forEach(syn => {
    const aTip = syn.branchA.getTip();
    const bTip = syn.branchB.getTip();
    // Glow
    ctx.strokeStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = 20 * params.synapseGlowStrength;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(aTip.x, aTip.y);
    ctx.lineTo(bTip.x, bTip.y);
    ctx.stroke();
  });
}

function drawPulses() {
  ctx.fillStyle = params.pulseColor;
  ctx.shadowColor = params.pulseColor;
  ctx.shadowBlur = 16 * params.pulseBrightness;
  synapses.forEach(syn => {
    if (syn.pulseActive) {
      const pos = syn.getPosition();
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawVignette() {
  const gradient = ctx.createRadialGradient(W/2, H/2, W/2 * 0.6, W/2, H/2, W/2);
  gradient.addColorStop(0, 'rgba(5,7,15,0)');
  gradient.addColorStop(1, 'rgba(5,7,15,0.6)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

function drawScanlines() {
  ctx.strokeStyle = palette.scanline;
  ctx.lineWidth = 1;
  for(let y = 0; y < H; y += 4) {
    ctx.beginPath();
    ctx.moveTo(0, y + (performance.now() * 0.02) % 4);
    ctx.lineTo(W, y + (performance.now() * 0.02) % 4);
    ctx.stroke();
  }
}

// === Main Loop ===
function animate() {
  if (!paused) {
    // Clear with background color
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, W, H);

    // Grow neurons until stable size
    let stillGrowing = false;
    neurons.forEach(n => {
      n.grow();
      if (n.branches.some(b => !b.finished)) stillGrowing = true;
    });

    detectSynapses();
    updatePulses();

    drawBranches();
    drawSynapses();
    drawPulses();
    drawVignette();
    drawScanlines();

    // If stable size reached, continue pulses only
    if (!stillGrowing) {
      // Just update pulses, synapses are static now
      // Pulses handled above
    }
  }
  requestAnimationFrame(animate);
}

// === GUI Setup ===
const gui = new dat.GUI({ width: 320 });

const folderGrowth = gui.addFolder('Growth');
folderGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(() => regenerateNetwork());
folderGrowth.add(params, 'growthSpeed', 0.5, 6, 0.1).name('Branch Growth Speed');
folderGrowth.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Branch Depth');
folderGrowth.add(params, 'branchSplitChance', 0, 0.5, 0.01).name('Branch Split Chance');
folderGrowth.add(params, 'branchCurvature', 0, 1, 0.01).name('Branch Curvature');
folderGrowth.add(params, 'maxBranchLength', 50, 200, 1).name('Max Branch Length');
folderGrowth.open();

const folderSynapses = gui.addFolder('Synapses');
folderSynapses.add(params, 'synapseDistThreshold', 5, 30, 1).name('Distance Threshold');
folderSynapses.add(params, 'synapseGlowStrength', 0, 2, 0.05).name('Glow Strength');
folderSynapses.open();

const folderPulses = gui.addFolder('Pulses');
folderPulses.add(params, 'pulseSpeed', 0.001, 0.03, 0.001).name('Pulse Speed');
folderPulses.add(params, 'pulseFrequency', 0, 0.3, 0.005).name('Pulse Frequency');
folderPulses.add(params, 'pulseBrightness', 0, 3, 0.05).name('Pulse Brightness');
folderPulses.open();

const folderVisuals = gui.addFolder('Visuals');
folderVisuals.addColor(params, 'backgroundColor').name('Background Color');
folderVisuals.addColor(params, 'branchColor').name('Branch Color');
folderVisuals.addColor(params, 'accentBranchColor').name('Accent Branch Color');
folderVisuals.addColor(params, 'synapseColor').name('Synapse Color');
folderVisuals.addColor(params, 'pulseColor').name('Pulse Color');
folderVisuals.open();

// Buttons
gui.add(params, 'regenerateNetwork').name('Regenerate Network');
gui.add(params, 'clearCanvas').name('Clear Canvas');
gui.add(params, 'pauseResume').name('Pause/Resume Animation');

// Initial setup
regenerateNetwork();
animate();
</script>
</body>
</html>
