<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #05070f 0%, #101a3a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #ffd400;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 800px;
            height: 800px;
            background: #05070f;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3), inset 0 0 30px rgba(0, 229, 255, 0.1);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #05070f;
        }
        
        .dg.ac {
            z-index: 1000;
        }
        
        .dg .dg-main {
            background: rgba(5, 7, 15, 0.95) !important;
            border: 1px solid #00e5ff !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2) !important;
        }
        
        .dg .dg-title {
            background: linear-gradient(90deg, #00e5ff, #d6ff00) !important;
            color: #05070f !important;
            text-shadow: none !important;
        }
        
        .dg .folder {
            border-left: 2px solid #d6ff00 !important;
        }
        
        .dg .folder .title {
            color: #d6ff00 !important;
            background: rgba(214, 255, 0, 0.1) !important;
        }
        
        .dg .folder .title:hover {
            background: rgba(214, 255, 0, 0.2) !important;
        }
        
        .dg li:not(.folder) {
            border-left: 2px solid #00e5ff !important;
            padding-left: 5px !important;
        }
        
        .dg .property-name {
            color: #00e5ff !important;
        }
        
        .dg input[type="text"],
        .dg input[type="number"],
        .dg select {
            background: rgba(0, 229, 255, 0.1) !important;
            color: #fff36a !important;
            border: 1px solid #00e5ff !important;
        }
        
        .dg input[type="text"]:focus,
        .dg input[type="number"]:focus {
            background: rgba(0, 229, 255, 0.2) !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5) !important;
        }
        
        .dg button {
            background: linear-gradient(90deg, #ff2bd6, #ffd400) !important;
            color: #05070f !important;
            border: 1px solid #ffd400 !important;
            font-weight: bold !important;
            text-shadow: none !important;
        }
        
        .dg button:hover {
            background: linear-gradient(90deg, #ffd400, #ff2bd6) !important;
            box-shadow: 0 0 15px rgba(255, 212, 0, 0.5) !important;
        }
        
        .dg .cr.number input[type="text"] {
            color: #fff36a !important;
        }
        
        .dg .cr.color .color-picker {
            background: rgba(0, 229, 255, 0.1) !important;
            border: 1px solid #00e5ff !important;
        }
        
        .dg .cr.color input[type="color"] {
            border: 1px solid #00e5ff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 800;
        
        // Configuration object
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 0.8,
            maxBranchDepth: 8,
            branchSplitChance: 0.3,
            branchCurvature: 0.15,
            maxBranchLength: 80,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 2,
            pulseFrequency: 0.05,
            pulseBrightness: 1,
            
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Controls
            isAnimating: true,
            regenerateNetwork: function() {
                neurons = [];
                branches = [];
                synapses = [];
                pulses = [];
                initializeNeurons();
            },
            clearCanvas: function() {
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            },
            pauseResume: function() {
                config.isAnimating = !config.isAnimating;
            }
        };
        
        // Data structures
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        
        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
            }
            
            grow() {
                if (this.branches.length === 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const branch = new Branch(this.x, this.y, angle, 0, this);
                    this.branches.push(branch);
                    branches.push(branch);
                }
                
                for (let branch of this.branches) {
                    branch.grow();
                }
            }
        }
        
        // Branch class
        class Branch {
            constructor(x, y, angle, depth, parent) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parent = parent;
                this.children = [];
                this.length = 0;
                this.maxLength = config.maxBranchLength * (1 - depth * 0.1);
                this.thickness = Math.max(1, 3 - depth * 0.3);
                this.isGrowing = true;
                this.curvature = (Math.random() - 0.5) * config.branchCurvature;
                this.endX = x;
                this.endY = y;
            }
            
            grow() {
                if (!this.isGrowing) {
                    for (let child of this.children) {
                        child.grow();
                    }
                    return;
                }
                
                if (this.length < this.maxLength) {
                    this.length += config.branchGrowthSpeed;
                    this.angle += this.curvature;
                    
                    this.endX = this.x + Math.cos(this.angle) * this.length;
                    this.endY = this.y + Math.sin(this.angle) * this.length;
                    
                    // Occasionally create side branches
                    if (Math.random() < config.branchSplitChance && this.depth < config.maxBranchDepth) {
                        const splitAngle = this.angle + (Math.random() - 0.5) * Math.PI * 0.6;
                        const child = new Branch(this.endX, this.endY, splitAngle, this.depth + 1, this);
                        this.children.push(child);
                        branches.push(child);
                    }
                } else {
                    this.isGrowing = false;
                }
                
                for (let child of this.children) {
                    child.grow();
                }
            }
            
            draw() {
                ctx.strokeStyle = this.depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = this.depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                ctx.shadowBlur = 8;
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.endX, this.endY);
                ctx.stroke();
                
                for (let child of this.children) {
                    child.draw();
                }
            }
        }
        
        // Synapse class
        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x1 = branch1.endX;
                this.y1 = branch1.endY;
                this.x2 = branch2.endX;
                this.y2 = branch2.endY;
                this.pulseActive = false;
                this.lastPulseTime = 0;
            }
            
            draw() {
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;
                
                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();
                
                // Draw synapse nodes
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength * 1.5;
                ctx.beginPath();
                ctx.arc(this.x1, this.y1, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x2, this.y2, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Pulse class
        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.duration = 1 / config.pulseSpeed;
            }
            
            update() {
                this.progress += 1 / 60;
                return this.progress < this.duration;
            }
            
            draw() {
                const t = this.progress / this.duration;
                const x = this.synapse.x1 + (this.synapse.x2 - this.synapse.x1) * t;
                const y = this.synapse.y1 + (this.synapse.y2 - this.synapse.y1) * t;
                
                ctx.fillStyle = config.pulseColor;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 20 * config.pulseBrightness;
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Initialize neurons
        function initializeNeurons() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const count = Math.max(3, Math.min(6, config.neuronCount));
            
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const distance = 50;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                neurons.push(new Neuron(x, y));
            }
        }
        
        // Check for synapses
        function checkSynapses() {
            const checked = new Set();
            
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    
                    const key = `${i}-${j}`;
                    if (checked.has(key)) continue;
                    checked.add(key);
                    
                    const dx = b1.endX - b2.endX;
                    const dy = b1.endY - b2.endY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < config.synapseDistanceThreshold && !b1.isGrowing && !b2.isGrowing) {
                        const exists = synapses.some(s => 
                            (s.branch1 === b1 && s.branch2 === b2) || 
                            (s.branch1 === b2 && s.branch2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                        }
                    }
                }
            }
        }
        
        // Update pulses
        function updatePulses() {
            for (let synapse of synapses) {
                if (Math.random() < config.pulseFrequency && !synapse.pulseActive) {
                    pulses.push(new Pulse(synapse));
                    synapse.pulseActive = true;
                }
            }
            
            pulses = pulses.filter(pulse => {
                if (!pulse.update()) {
                    pulse.synapse.pulseActive = false;
                    return false;
                }
                return true;
            });
        }
        
        // Draw background
        function drawBackground() {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Optional subtle grid
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }
        
        // Animation loop
        function animate() {
            drawBackground();
            
            if (config.isAnimating) {
                for (let neuron of neurons) {
                    neuron.grow();
                }
                
                checkSynapses();
                updatePulses();
            }
            
            ctx.shadowBlur = 0;
            
            for (let branch of branches) {
                branch.draw();
            }
            
            for (let synapse of synapses) {
                synapse.draw();
            }
            
            for (let pulse of pulses) {
                pulse.draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        // Setup dat.gui
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 1, 10, 1);
        growthFolder.add(config, 'branchGrowthSpeed', 0.1, 3, 0.1);
        growthFolder.add(config, 'maxBranchDepth', 2, 15, 1);
        growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05);
        growthFolder.add(config, 'branchCurvature', 0, 0.5, 0.05);
        growthFolder.add(config, 'maxBranchLength', 20, 200, 10);
        growthFolder.open();
        
        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 150, 5);
        synapsesFolder.add(config, 'synapseGlowStrength', 5, 50, 1);
        synapsesFolder.open();
        
        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(config, 'pulseSpeed', 0.5, 5, 0.1);
        pulsesFolder.add(config, 'pulseFrequency', 0, 0.2, 0.01);
        pulsesFolder.add(config, 'pulseBrightness', 0.1, 2, 0.1);
        pulsesFolder.open();
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'backgroundColor');
        visualsFolder.addColor(config, 'branchColor');
        visualsFolder.addColor(config, 'accentBranchColor');
        visualsFolder.addColor(config, 'synapseColor');
        visualsFolder.addColor(config, 'pulseColor');
        visualsFolder.open();
        
        gui.add(config, 'regenerateNetwork').name('Regenerate Network');
        gui.add(config, 'clearCanvas').name('Clear Canvas');
        gui.add(config, 'pauseResume').name('Pause/Resume');
        
        // Initialize and start
        initializeNeurons();
        animate();
    </script>
</body>
</html>
