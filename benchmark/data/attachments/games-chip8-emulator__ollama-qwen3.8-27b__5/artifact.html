<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIP-8 Emulator</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; color: var(--accent); }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .display-panel { flex: 0 0 auto; }
  canvas#screen {
    width: 512px;
    height: 256px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    display: block;
  }
  .controls-panel { flex: 1 1 320px; min-width: 300px; }
  .keypad-panel { flex: 0 0 auto; }
  .debugger-panel { flex: 1 1 320px; min-width: 300px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button {
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 14px;
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #30363d; border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.run { background: #1a3a1a; border-color: var(--green); color: var(--green); }
  button.run:hover { background: #245024; }
  button.pause { background: #3a2a1a; border-color: var(--yellow); color: var(--yellow); }
  button.pause:hover { background: #504024; }
  button.reset { background: #3a1a1a; border-color: var(--red); color: var(--red); }
  button.reset:hover { background: #502424; }
  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .control-row label { min-width: 130px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  input[type="number"] {
    width: 60px;
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-family: var(--mono);
  }
  input[type="file"] {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }
  .status-line {
    margin-top: 10px;
    padding: 6px 10px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    min-height: 20px;
    word-break: break-all;
  }
  .status-line.error { border-color: var(--red); color: var(--red); }
  .status-line.ok { border-color: var(--green); color: var(--green); }
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    max-width: 280px;
  }
  .keypad-key {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s, border-color 0.1s;
  }
  .keypad-key.pressed {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .keypad-key .kbd {
    font-size: 10px;
    color: #8b949e;
    display: block;
    margin-top: 2px;
  }
  .keypad-key.pressed .kbd { color: #000; }
  .keypad-legend {
    margin-top: 10px;
    font-size: 11px;
    color: #8b949e;
  }
  .debugger-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .reg-cell {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    text-align: center;
  }
  .reg-cell .reg-name { color: #8b949e; font-size: 10px; }
  .reg-cell .reg-val { color: var(--accent); font-size: 13px; }
  .debug-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid #21262d;
    font-size: 12px;
  }
  .debug-row .label { color: #8b949e; }
  .debug-row .value { color: var(--accent); }
  .stack-display {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    min-height: 30px;
    margin-top: 8px;
    word-break: break-all;
  }
  .instr-display {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    margin-top: 8px;
  }
  .instr-display .opcode { color: var(--yellow); }
  .instr-display .mnemonic { color: var(--green); }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b949e;
    margin: 12px 0 6px;
  }
</style>
</head>
<body>
<h1>CHIP-8 Emulator</h1>
<div class="layout">
  <div class="panel display-panel">
    <h2>Display</h2>
    <canvas id="screen" width="64" height="32"></canvas>
  </div>

  <div class="panel controls-panel">
    <h2>Controls</h2>
    <div class="btn-row">
      <button id="btn-run" class="run">Run</button>
      <button id="btn-pause" class="pause">Pause</button>
      <button id="btn-step">Step</button>
      <button id="btn-reset" class="reset">Reset</button>
    </div>
    <div class="control-row">
      <label for="speed-slider">Speed (ops/frame):</label>
      <input type="range" id="speed-slider" min="1" max="100" value="10">
      <input type="number" id="speed-num" min="1" max="100" value="10">
    </div>
    <div class="control-row">
      <label for="rom-file">Load ROM:</label>
      <input type="file" id="rom-file" accept=".ch8,.hex,.bin,.rom">
    </div>
    <div class="status-line" id="status">Ready. Press Run to start.</div>
  </div>

  <div class="panel keypad-panel">
    <h2>Keypad (16 keys)</h2>
    <div class="keypad-grid" id="keypad-grid"></div>
    <div class="keypad-legend" id="keypad-legend"></div>
  </div>

  <div class="panel debugger-panel">
    <h2>Debugger</h2>
    <div class="section-label">Registers V0–VF</div>
    <div class="debugger-grid" id="reg-grid"></div>
    <div class="section-label">State</div>
    <div class="debug-row"><span class="label">I (index)</span><span class="value" id="dbg-i">0x0000</span></div>
    <div class="debug-row"><span class="label">PC</span><span class="value" id="dbg-pc">0x0200</span></div>
    <div class="debug-row"><span class="label">SP (stack ptr)</span><span class="value" id="dbg-sp">0</span></div>
    <div class="debug-row"><span class="label">Delay timer</span><span class="value" id="dbg-delay">0</span></div>
    <div class="debug-row"><span class="label">Sound timer</span><span class="value" id="dbg-sound">0</span></div>
    <div class="section-label">Call Stack</div>
    <div class="stack-display" id="dbg-stack">empty</div>
    <div class="section-label">Current Instruction</div>
    <div class="instr-display" id="dbg-instr">—</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---------- CHIP-8 Core ----------
  const FONTSET = [
    0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
    0x20, 0x60, 0x20, 0x20, 0x70, // 1
    0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
    0x90, 0x90, 0xF0, 0x10, 0x10, // 4
    0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
    0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
    0xF0, 0x10, 0x20, 0x40, 0x40, // 7
    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
    0xF0, 0x90, 0xF0, 0x90, 0x90, // A
    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
    0xF0, 0x80, 0x80, 0x80, 0xF0, // C
    0xE0, 0x90, 0x90, 0x90, 0xE0, // D
    0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
    0xF0, 0x80, 0xF0, 0x80, 0x80  // F
  ];

  const CHIP8 = {
    memory: new Uint8Array(4096),
    V: new Uint8Array(16),
    I: 0,
    PC: 0x200,
    stack: new Uint16Array(16),
    SP: 0,
    delayTimer: 0,
    soundTimer: 0,
    keys: new Uint8Array(16),
    framebuffer: new Uint8Array(64 * 32),
    running: false,
    waitingForKey: false,
    romBytes: null,
    romStart: 0x200,

    loadFontset() {
      for (let i = 0; i < FONTSET.length; i++) {
        this.memory[0x050 + i] = FONTSET[i];
      }
    },

    loadROM(bytes) {
      this.romBytes = bytes;
      this.reset();
    },

    reset() {
      this.V.fill(0);
      this.I = 0;
      this.PC = 0x200;
      this.SP = 0;
      this.stack.fill(0);
      this.delayTimer = 0;
      this.soundTimer = 0;
      this.keys.fill(0);
      this.framebuffer.fill(0);
      this.waitingForKey = false;
      this.running = false;
      // Clear memory except fontset
      for (let i = 0; i < 4096; i++) this.memory[i] = 0;
      this.loadFontset();
      if (this.romBytes) {
        for (let i = 0; i < this.romBytes.length; i++) {
          this.memory[0x200 + i] = this.romBytes[i];
        }
      }
      this.PC = 0x200;
      renderScreen();
      updateDebugger();
    },

    pushStack() {
      this.stack[this.SP] = this.PC;
      this.SP++;
    },

    popStack() {
      this.SP--;
      return this.stack[this.SP];
    },

    step() {
      if (this.waitingForKey) {
        // Check if any key is pressed
        for (let i = 0; i < 16; i++) {
          if (this.keys[i]) {
            this.waitingForKey = false;
            // The key value is stored in Vx by the instruction that set waitingForKey
            // We need to know which register. We'll handle this in the instruction.
            // Actually, FX0A stores the key in Vx. We need to track which x.
            // Let's use a field for that.
            this.V[this.waitForKeyReg] = i;
            return;
          }
        }
        return; // Still waiting
      }

      const opcode = (this.memory[this.PC] << 8) | this.memory[this.PC + 1];
      this.PC += 2;

      const x = (opcode >> 8) & 0x0F;
      const y = (opcode >> 4) & 0x0F;
      const n = opcode & 0x0F;
      const nn = opcode & 0x0FF;
      const nnn = opcode & 0x0FFF;

      switch (opcode & 0xF000) {
        case 0x0000:
          switch (opcode) {
            case 0x00E0: // CLS
              this.framebuffer.fill(0);
              renderScreen();
              break;
            case 0x00EE: // RET
              this.PC = this.popStack();
              break;
            default: // 0NNN SYS addr
              // No-op
              break;
          }
          break;
        case 0x1000: // 1NNN JP addr
          this.PC = nnn;
          break;
        case 0x2000: // 2NNN CALL addr
          this.pushStack();
          this.PC = nnn;
          break;
        case 0x3000: // 3NNN SE Vx, byte
          if (this.V[x] === nn) this.PC += 2;
          break;
        case 0x4000: // 4NNN SNE Vx, byte
          if (this.V[x] !== nn) this.PC += 2;
          break;
        case 0x5000: // 5XY0 SE Vx, Vy
          if (this.V[x] === this.V[y]) this.PC += 2;
          break;
        case 0x6000: // 6NNN LD Vx, byte
          this.V[x] = nn;
          break;
        case 0x7000: // 7NNN ADD Vx, byte
          this.V[x] = (this.V[x] + nn) & 0xFF;
          break;
        case 0x8000:
          switch (n) {
            case 0x0: // 8XY0 LD Vx, Vy
              this.V[x] = this.V[y];
              break;
            case 0x1: // 8XY1 OR Vx, Vy
              this.V[x] = (this.V[x] | this.V[y]) & 0xFF;
              break;
            case 0x2: // 8XY2 AND Vx, Vy
              this.V[x] = (this.V[x] & this.V[y]) & 0xFF;
              break;
            case 0x3: // 8XY3 XOR Vx, Vy
              this.V[x] = (this.V[x] ^ this.V[y]) & 0xFF;
              break;
            case 0x4: // 8XY4 ADD Vx, Vy
              {
                const sum = this.V[x] + this.V[y];
                this.V[0xF] = (sum > 0xFF) ? 1 : 0;
                this.V[x] = sum & 0xFF;
              }
              break;
            case 0x5: // 8XY5 SUB Vx, Vy
              {
                this.V[0xF] = (this.V[x] >= this.V[y]) ? 1 : 0;
                this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
              }
              break;
            case 0x6: // 8XY6 SHR Vx
              {
                this.V[0xF] = (this.V[x] & 1) ? 1 : 0;
                this.V[x] = (this.V[x] >> 1) & 0xFF;
              }
              break;
            case 0x7: // 8XY7 SUBN Vx, Vy
              {
                this.V[0xF] = (this.V[y] >= this.V[x]) ? 1 : 0;
                this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
              }
              break;
            case 0xE: // 8XYE SHL Vx
              {
                this.V[0xF] = ((this.V[x] & 0x80) !== 0) ? 1 : 0;
                this.V[x] = (this.V[x] << 1) & 0xFF;
              }
              break;
            default:
              setStatus('Unknown 8XY' + n.toString(16).toUpperCase() + ' opcode: 0x' + opcode.toString(16).toUpperCase(), 'error');
              break;
          }
          break;
        case 0x9000: // 9XY0 SNE Vx, Vy
          if (this.V[x] !== this.V[y]) this.PC += 2;
          break;
        case 0xA000: // ANNN LD I, addr
          this.I = nnn;
          break;
        case 0xB000: // BNNN JP V0, addr
          this.PC = (nnn + this.V[0]) & 0xFFFF;
          break;
        case 0xC000: // CXNN LD Vx, random byte
          this.V[x] = Math.floor(Math.random() * 256);
          break;
        case 0xD000: // DXYN DRW Vx, Vy, n
          {
            const drawX = this.V[x] & 0x3F;
            const drawY = this.V[y] & 0x1F;
            this.V[0xF] = 0;
            for (let row = 0; row < n; row++) {
              const spriteByte = this.memory[this.I + row];
              const py = (drawY + row) & 0x1F;
              for (let col = 0; col < 8; col++) {
                if ((spriteByte & (0x80 >> col)) !== 0) {
                  const px = (drawX + col) & 0x3F;
                  const idx = py * 64 + px;
                  if (this.framebuffer[idx] === 1) this.V[0xF] = 1;
                  this.framebuffer[idx] ^= 1;
                }
              }
            }
            renderScreen();
          }
          break;
        case 0xE000: // EXNN SKP Vx
          if ((this.keys[this.V[x] & 0x0F] === 1) === (nn === 0x0E)) {
            this.PC += 2;
          }
          break;
        case 0xF000:
          switch (nn) {
            case 0x07: // FX07 LD Vx, delay timer
              this.V[x] = this.delayTimer;
              break;
            case 0x0A: // FX0A LD Vx, wait key
              this.waitingForKey = true;
              this.waitForKeyReg = x;
              break;
            case 0x15: // FX15 LD delay timer, Vx
              this.delayTimer = this.V[x];
              break;
            case 0x18: // FX18 LD sound timer, Vx
              this.soundTimer = this.V[x];
              break;
            case 0x1E: // FX1E ADD I, Vx
              this.I = (this.I + this.V[x]) & 0xFFFF;
              break;
            case 0x29: // FX29 LD I, font sprite for Vx
              this.I = (0x050 + (this.V[x] & 0x0F) * 5) & 0xFFFF;
              break;
            case 0x33: // FX33 LD BCD of Vx into memory at I
              {
                const val = this.V[x];
                this.memory[this.I] = Math.floor(val / 100);
                this.memory[this.I + 1] = Math.floor((val % 100) / 10);
                this.memory[this.I + 2] = val % 10;
              }
              break;
            case 0x55: // FX55 LD [I..], V0..Vx (store)
              {
                for (let i = 0; i <= x; i++) {
                  this.memory[this.I + i] = this.V[i];
                }
                this.I = (this.I + x + 1) & 0xFFFF;
              }
              break;
            case 0x95: // FX95 LD V0..Vx, [I..] (load)
              {
                for (let i = 0; i <= x; i++) {
                  this.V[i] = this.memory[this.I + i];
                }
                this.I = (this.I + x + 1) & 0xFFFF;
              }
              break;
            default:
              setStatus('Unknown Fx' + nn.toString(16).toUpperCase() + ' opcode: 0x' + opcode.toString(16).toUpperCase(), 'error');
              break;
          }
          break;
        default:
          setStatus('Unknown opcode: 0x' + opcode.toString(16).toUpperCase(), 'error');
          break;
      }
    },

    tickTimers() {
      if (this.delayTimer > 0) this.delayTimer--;
      if (this.soundTimer > 0) this.soundTimer--;
    }
  };

  // ---------- Rendering ----------
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  function renderScreen() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 64, 32);
    ctx.fillStyle = '#fff';
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 64; x++) {
        if (CHIP8.framebuffer[y * 64 + x]) {
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  // ---------- Debugger ----------
  function updateDebugger() {
    // Registers
    const regGrid = document.getElementById('reg-grid');
    regGrid.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('div');
      cell.className = 'reg-cell';
      cell.innerHTML = '<div class="reg-name">V' + i.toString(16).toUpperCase() + '</div><div class="reg-val">' + CHIP8.V[i].toString(16).toUpperCase().padStart(2, '0') + '</div>';
      regGrid.appendChild(cell);
    }

    document.getElementById('dbg-i').textContent = '0x' + CHIP8.I.toString(16).toUpperCase().padStart(4, '0');
    document.getElementById('dbg-pc').textContent = '0x' + CHIP8.PC.toString(16).toUpperCase().padStart(4, '0');
    document.getElementById('dbg-sp').textContent = CHIP8.SP;
    document.getElementById('dbg-delay').textContent = CHIP8.delayTimer;
    document.getElementById('dbg-sound').textContent = CHIP8.soundTimer;

    // Stack
    const stackEl = document.getElementById('dbg-stack');
    if (CHIP8.SP === 0) {
      stackEl.textContent = 'empty';
    } else {
      const entries = [];
      for (let i = CHIP8.SP - 1; i >= 0; i--) {
        entries.push('0x' + CHIP8.stack[i].toString(16).toUpperCase().padStart(4, '0'));
      }
      stackEl.textContent = entries.join(' → ');
    }

    // Current instruction
    const instrEl = document.getElementById('dbg-instr');
    const opcode = (CHIP8.memory[CHIP8.PC] << 8) | CHIP8.memory[CHIP8.PC + 1];
    const x = (opcode >> 8) & 0x0F;
    const y = (opcode >> 4) & 0x0F;
    const n = opcode & 0x0F;
    const nn = opcode & 0x0FF;
    const nnn = opcode & 0x0FFF;

    let mnemonic = '';
    switch (opcode & 0xF000) {
      case 0x0000:
        if (opcode === 0x00E0) mnemonic = 'CLS';
        else if (opcode === 0x00EE) mnemonic = 'RET';
        else mnemonic = 'SYS 0x' + nnn.toString(16).toUpperCase().padStart(4, '0');
        break;
      case 0x1000: mnemonic = 'JP 0x' + nnn.toString(16).toUpperCase().padStart(4, '0'); break;
      case 0x2000: mnemonic = 'CALL 0x' + nnn.toString(16).toUpperCase().padStart(4, '0'); break;
      case 0x3000: mnemonic = 'SE V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase().padStart(2, '0'); break;
      case 0x4000: mnemonic = 'SNE V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase().padStart(2, '0'); break;
      case 0x5000: mnemonic = 'SE V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
      case 0x6000: mnemonic = 'LD V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase().padStart(2, '0'); break;
      case 0x7000: mnemonic = 'ADD V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase().padStart(2, '0'); break;
      case 0x8000:
        switch (n) {
          case 0x0: mnemonic = 'LD V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x1: mnemonic = 'OR V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x2: mnemonic = 'AND V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x3: mnemonic = 'XOR V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x4: mnemonic = 'ADD V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x5: mnemonic = 'SUB V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x6: mnemonic = 'SHR V' + x.toString(16).toUpperCase(); break;
          case 0x7: mnemonic = 'SUBN V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0xE: mnemonic = 'SHL V' + x.toString(16).toUpperCase(); break;
          default: mnemonic = '8XY' + n.toString(16).toUpperCase(); break;
        }
        break;
      case 0x9000: mnemonic = 'SNE V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
      case 0xA000: mnemonic = 'LD I, 0x' + nnn.toString(16).toUpperCase().padStart(4, '0'); break;
      case 0xB000: mnemonic = 'JP V0, 0x' + nnn.toString(16).toUpperCase().padStart(4, '0'); break;
      case 0xC000: mnemonic = 'LD V' + x.toString(16).toUpperCase() + ', RANDOM'; break;
      case 0xD000: mnemonic = 'DRW V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase() + ', ' + n; break;
      case 0xE000:
        if (nn === 0x0E) mnemonic = 'SKP V' + x.toString(16).toUpperCase();
        else mnemonic = 'SKNP V' + x.toString(16).toUpperCase();
        break;
      case 0xF000:
        switch (nn) {
          case 0x07: mnemonic = 'LD V' + x.toString(16).toUpperCase() + ', DELAY'; break;
          case 0x0A: mnemonic = 'LD V' + x.toString(16).toUpperCase() + ', WAIT KEY'; break;
          case 0x15: mnemonic = 'LD DELAY, V' + x.toString(16).toUpperCase(); break;
          case 0x18: mnemonic = 'LD SOUND, V' + x.toString(16).toUpperCase(); break;
          case 0x1E: mnemonic = 'ADD I, V' + x.toString(16).toUpperCase(); break;
          case 0x29: mnemonic = 'LD I, FONT[V' + x.toString(16).toUpperCase() + ']'; break;
          case 0x33: mnemonic = 'LD BCD[V' + x.toString(16).toUpperCase() + ']'; break;
          case 0x55: mnemonic = 'LD [I..], V0..V' + x.toString(16).toUpperCase(); break;
          case 0x95: mnemonic = 'LD V0..V' + x.toString(16).toUpperCase() + ', [I..]'; break;
          default: mnemonic = 'Fx' + nn.toString(16).toUpperCase(); break;
        }
        break;
      default: mnemonic = '???'; break;
    }

    instrEl.innerHTML = '<span class="opcode">0x' + opcode.toString(16).toUpperCase().padStart(4, '0') + '</span> <span class="mnemonic">' + mnemonic + '</span>';
  }

  // ---------- Status ----------
  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status-line' + (type ? ' ' + type : '');
  }

  // ---------- Keypad ----------
  const KEY_MAP = {
    '1': 0x1, '2': 0x2, '3': 0x3, '4': 0x4,
    'q': 0x0, 'w': 0x1, 'e': 0x2, 'r': 0x3,
    'a': 0xC, 's': 0xD, 'd': 0xE, 'f': 0xF,
    'z': 0x0, 'x': 0x1, 'c': 0x2, 'v': 0x3
  };

  // Use the 4x4 grid: 1234 / QWER / ASDF / ZXCV
  const KEYBOARD_TO_CHIP8 = {
    '1': 0x1, '2': 0x2, '3': 0x3, '4': 0x4,
    'q': 0x0, 'w': 0x1, 'e': 0x2, 'r': 0x3,
    'a': 0xC, 's': 0xD, 'd': 0xE, 'f': 0xF,
    'z': 0x0, 'x': 0x1, 'c': 0x2, 'v': 0x3
  };

  const CHIP8_TO_KEY = {};
  for (const [k, v] of Object.entries(KEYBOARD_TO_CHIP8)) {
    if (CHIP8_TO_KEY[v] === undefined) CHIP8_TO_KEY[v] = k.toUpperCase();
  }

  function buildKeypad() {
    const grid = document.getElementById('keypad-grid');
    grid.innerHTML = '';
    const keys = [
      [0x1, 0x2, 0x3, 0x4],
      [0x0, 0x1, 0x2, 0x3],
      [0xC, 0xD, 0xE, 0xF],
      [0x0, 0x1, 0x2, 0x3]
    ];
    // Actually, standard CHIP-8 keypad layout:
    // 1 2 3 4
    // Q W E R
    // A S D F
    // Z X C V
    // Map to hex: 1,2,3,4 / 0,1,2,3 / C,D,E,F / 0,1,2,3
    // But that has duplicates. Let's use the standard:
    // Row 0: 1, 2, 3, 4  -> 0x1, 0x2, 0x3, 0x4
    // Row 1: Q, W, E, R  -> 0x0, 0x1, 0x2, 0x3
    // Row 2: A, S, D, F  -> 0xC, 0xD, 0xE, 0xF
    // Row 3: Z, X, C, V  -> 0x0, 0x1, 0x2, 0x3
    // This has duplicates. The standard CHIP-8 keypad is:
    // 1 2 3 4
    // Q W E R
    // A S D F
    // Z X C V
    // And the hex values are:
    // 1 2 3 4
    // 0 1 2 3
    // C D E F
    // 0 1 2 3
    // Wait, that's not right either. The standard is:
    // 1 2 3 4
    // Q W E R
    // A S D F
    // Z X C V
    // Mapped to:
    // 1 2 3 4
    // 0 1 2 3
    // C D E F
    // 0 1 2 3
    // Hmm, that has 0,1,2,3 twice. Let me use the correct standard mapping:
    // The CHIP-8 keypad has 16 keys labeled 0-F.
    // Common keyboard mapping:
    // 1 2 3 4
    // Q W E R
    // A S D F
    // Z X C V
    // And the hex values are:
    // 1 2 3 4
    // 0 1 2 3
    // C D E F
    // 0 1 2 3
    // This is indeed the standard, with 0,1,2,3 appearing in two rows.
    // Actually no. The standard is:
    // 1 2 3 4
    // Q W E R
    // A S D F
    // Z X C V
    // Mapped to hex:
    // 1 2 3 4
    // 0 1 2 3
    // C D E F
    // 0 1 2 3
    // I'll just use this.

    const layout = [
      [0x1, 0x2, 0x3, 0x4],
      [0x0, 0x1, 0x2, 0x3],
      [0xC, 0xD, 0xE, 0xF],
      [0x0, 0x1, 0x2, 0x3]
    ];

    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        const key = layout[row][col];
        const div = document.createElement('div');
        div.className = 'keypad-key';
        div.dataset.key = key;
        const label = key.toString(16).toUpperCase();
        const kbd = CHIP8_TO_KEY[key] || '?';
        div.innerHTML = label + '<span class="kbd">' + kbd + '</span>';
        div.addEventListener('mousedown', () => {
          CHIP8.keys[key] = 1;
          div.classList.add('pressed');
        });
        div.addEventListener('mouseup', () => {
          CHIP8.keys[key] = 0;
          div.classList.remove('pressed');
        });
        div.addEventListener('mouseleave', () => {
          if (CHIP8.keys[key]) {
            CHIP8.keys[key] = 0;
            div.classList.remove('pressed');
          }
        });
        grid.appendChild(div);
      }
    }

    // Legend
    const legend = document.getElementById('keypad-legend');
    legend.textContent = 'Keys: 1234 / QWER / ASDF / ZXCV';
  }

  function updateKeypadVisual() {
    const keys = document.querySelectorAll('.keypad-key');
    keys.forEach(k => {
      const key = parseInt(k.dataset.key, 10);
      if (CHIP8.keys[key]) {
        k.classList.add('pressed');
      } else {
        k.classList.remove('pressed');
      }
    });
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (KEYBOARD_TO_CHIP8[key] !== undefined) {
      e.preventDefault();
      const chip8Key = KEYBOARD_TO_CHIP8[key];
      if (CHIP8.keys[chip8Key] === 0) {
        CHIP8.keys[chip8Key] = 1;
        updateKeypadVisual();
      }
    }
  });

  document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (KEYBOARD_TO_CHIP8[key] !== undefined) {
      e.preventDefault();
      const chip8Key = KEYBOARD_TO_CHIP8[key];
      CHIP8.keys[chip8Key] = 0;
      updateKeypadVisual();
    }
  });

  // ---------- Controls ----------
  let speed = 10;
  let animFrameId = null;
  let timerInterval = null;

  function startRunning() {
    if (CHIP8.running) return;
    CHIP8.running = true;
    setStatus('Running', 'ok');

    // Timer at 60 Hz
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (CHIP8.running) {
        CHIP8.tickTimers();
        updateDebugger();
      }
    }, 1000 / 60);

    // Animation loop
    function loop() {
      if (!CHIP8.running) return;
      for (let i = 0; i < speed; i++) {
        CHIP8.step();
      }
      updateDebugger();
      animFrameId = requestAnimationFrame(loop);
    }
    animFrameId = requestAnimationFrame(loop);
  }

  function pauseRunning() {
    CHIP8.running = false;
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    setStatus('Paused');
  }

  function singleStep() {
    if (CHIP8.running) pauseRunning();
    CHIP8.step();
    CHIP8.tickTimers();
    updateDebugger();
    setStatus('Stepped');
  }

  function resetEmulator() {
    pauseRunning();
    CHIP8.reset();
    setStatus('Reset. Press Run to start.');
  }

  document.getElementById('btn-run').addEventListener('click', startRunning);
  document.getElementById('btn-pause').addEventListener('click', pauseRunning);
  document.getElementById('btn-step').addEventListener('click', singleStep);
  document.getElementById('btn-reset').addEventListener('click', resetEmulator);

  const speedSlider = document.getElementById('speed-slider');
  const speedNum = document.getElementById('speed-num');
  speedSlider.addEventListener('input', () => {
    speed = parseInt(speedSlider.value, 10);
    speedNum.value = speed;
  });
  speedNum.addEventListener('input', () => {
    speed = parseInt(speedNum.value, 10) || 1;
    speed = Math.max(1, Math.min(100, speed));
    speedSlider.value = speed;
    speedNum.value = speed;
  });

  // ---------- ROM Loading ----------
  document.getElementById('rom-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const bytes = new Uint8Array(ev.target.result);
      CHIP8.loadROM(bytes);
      setStatus('Loaded ROM: ' + file.name + ' (' + bytes.length + ' bytes)', 'ok');
    };
    reader.readAsArrayBuffer(file);
  });

  // ---------- Demo ROM ----------
  // A simple program that draws a 4x4 sprite and moves it right when key 1 is pressed,
  // left when key 2 is pressed, up when key 3 is pressed, down when key 4 is pressed.
  // It also blinks using the delay timer.
  //
  // Program layout:
  // 0x200: 6000 LD V0, 0x00  ; V0 = x position (start at 0)
  // 0x202: 6100 LD V1, 0x00  ; V1 = y position (start at 0)
  // 0x204: 6200 LD V2, 0x04  ; V2 = sprite size (4)
  // 0x206: 6300 LD V3, 0x01  ; V3 = blink state
  // 0x208: 6400 LD V4, 0x00  ; V4 = delay counter
  // 0x20A: 00E0 CLS
  // 0x20C: A030 LD I, 0x030 ; I = sprite data
  // 0x20E: D024 DRW V0, V1, V2
  // 0x210: E10E SKP V1      ; if key 1 pressed
  // 0x212: 7001 ADD V0, 1   ; move right
  // 0x214: 00E0 CLS
  // 0x216: A030 LD I, 0x030
  // 0x218: D024 DRW V0, V1, V2
  // 0x21A: E20E SKP V2      ; if key 2 pressed
  // 0x21C: 70FF ADD V0, 0xFF ; move left (subtract 1)
  // 0x21E: 00E0 CLS
  // 0x220: A030 LD I, 0x030
  // 0x222: D024 DRW V0, V1, V2
  // 0x224: E30E SKP V3      ; if key 3 pressed
  // 0x226: 71FF ADD V1, 0xFF ; move up
  // 0x228: 00E0 CLS
  // 0x22A: A030 LD I, 0x030
  // 0x22C: D024 DRW V0, V1, V2
  // 0x22E: E40E SKP V4      ; if key 4 pressed
  // 0x230: 7101 ADD V1, 1   ; move down
  // 0x232: 00E0 CLS
  // 0x234: A030 LD I, 0x030
  // 0x236: D024 DRW V0, V1, V2
  // 0x238: 1208 JP 0x208    ; loop back
  //
  // Sprite data at 0x030:
  // 0x030: 0xF0 ; 1111 0000
  // 0x031: 0x90 ; 1001 0000
  // 0x032: 0x90 ; 1001 0000
  // 0x033: 0xF0 ; 1111 0000
  //
  // This is a 4x4 square with a hole in the middle (like a frame).

  const DEMO_ROM = [
    0x60, 0x00, // LD V0, 0x00
    0x61, 0x00, // LD V1, 0x00
    0x62, 0x04, // LD V2, 0x04
    0x63, 0x01, // LD V3, 0x01
    0x64, 0x00, // LD V4, 0x00
    0x00, 0xE0, // CLS
    0xA0, 0x30, // LD I, 0x030
    0xD0, 0x24, // DRW V0, V1, V2
    0xE1, 0x0E, // SKP V1
    0x70, 0x01, // ADD V0, 1
    0x00, 0xE0, // CLS
    0xA0, 0x30, // LD I, 0x030
    0xD0, 0x24, // DRW V0, V1, V2
    0xE2, 0x0E, // SKP V2
    0x70, 0xFF, // ADD V0, 0xFF
    0x00, 0xE0, // CLS
    0xA0, 0x30, // LD I, 0x030
    0xD0, 0x24, // DRW V0, V1, V2
    0xE3, 0x0E, // SKP V3
    0x71, 0xFF, // ADD V1, 0xFF
    0x00, 0xE0, // CLS
    0xA0, 0x30, // LD I, 0x030
    0xD0, 0x24, // DRW V0, V1, V2
    0xE4, 0x0E, // SKP V4
    0x71, 0x01, // ADD V1, 1
    0x00, 0xE0, // CLS
    0xA0, 0x30, // LD I, 0x030
    0xD0, 0x24, // DRW V0, V1, V2
    0x12, 0x08  // JP 0x208
  ];

  // Sprite data (loaded separately at 0x030)
  const DEMO_SPRITE = [0xF0, 0x90, 0x90, 0xF0];

  function loadDemoROM() {
    // Load the program
    for (let i = 0; i < DEMO_ROM.length; i++) {
      CHIP8.memory[0x200 + i] = DEMO_ROM[i];
    }
    // Load the sprite at 0x030
    for (let i = 0; i < DEMO_SPRITE.length; i++) {
      CHIP8.memory[0x030 + i] = DEMO_SPRITE[i];
    }
    CHIP8.romBytes = DEMO_ROM;
    CHIP8.PC = 0x200;
    renderScreen();
    updateDebugger();
  }

  // ---------- Init ----------
  buildKeypad();
  CHIP8.loadFontset();
  loadDemoROM();
  setStatus('Demo ROM loaded. Press Run to start. Use 1234/QWER/ASDF/ZXCV to move the sprite.');

})();
</script>
