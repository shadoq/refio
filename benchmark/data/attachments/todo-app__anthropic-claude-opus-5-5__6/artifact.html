<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f3f4f8;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #9097a8;
    --border: #e4e6ee;
    --accent: #5b5bf0;
    --accent-soft: #ececfe;
    --danger: #e5484d;
    --radius: 12px;
    --focus: 0 0 0 3px rgba(91, 91, 240, 0.35);
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(20, 24, 40, 0.08), 0 2px 6px rgba(20, 24, 40, 0.05);
    padding: 28px 24px 20px;
  }
  h1 {
    margin: 0 0 20px;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .add-form input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafbfd;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .add-form input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: var(--focus);
    background: #fff;
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  button:focus { outline: none; }
  button:focus-visible { box-shadow: var(--focus); }
  .add-btn {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    transition: background 0.15s, transform 0.05s;
  }
  .add-btn:hover { background: #4747e0; }
  .add-btn:active { transform: translateY(1px); }
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filter-btn:hover { background: #f5f6fa; }
  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .todo-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  .todo-item input[type="checkbox"]:focus-visible {
    outline: none;
    box-shadow: var(--focus);
    border-radius: 4px;
  }
  .todo-item label {
    flex: 1;
    min-width: 0;
    font-size: 1rem;
    word-break: break-word;
    cursor: pointer;
    transition: color 0.15s;
  }
  .todo-item.completed label {
    text-decoration: line-through;
    color: var(--muted);
  }
  .delete-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    opacity: 0.6;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .todo-item:hover .delete-btn,
  .delete-btn:focus-visible { opacity: 1; }
  .delete-btn:hover {
    color: var(--danger);
    background: #fdecec;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 8px;
    margin: 0;
    border-bottom: 1px solid var(--border);
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .clear-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .clear-btn:hover:not(:disabled) { color: var(--danger); }
  .clear-btn:disabled { opacity: 0.4; cursor: default; }
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 480px) {
    body { padding: 20px 10px; }
    .card { padding: 20px 16px 16px; }
    h1 { font-size: 1.5rem; }
    .add-btn { padding: 12px 16px; }
    .delete-btn { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Todos</h1>

    <form class="add-form" id="add-form" autocomplete="off">
      <label for="new-todo" class="visually-hidden">New todo</label>
      <input type="text" id="new-todo" placeholder="What needs to be done?" maxlength="500">
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter todos">
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
    <p class="empty" id="empty-state" hidden></p>

    <footer class="footer">
      <span id="items-left">0 items left</span>
      <button type="button" class="clear-btn" id="clear-completed">Clear completed</button>
    </footer>
  </main>

<script>
(function () {
  'use strict';

  var TODOS_KEY = 'todos-app.todos';
  var FILTER_KEY = 'todos-app.filter';
  var FILTERS = ['all', 'active', 'completed'];
  var EMPTY_MESSAGES = {
    all: 'No todos yet. Add one above!',
    active: 'Nothing active. Nice work!',
    completed: 'No completed todos yet.'
  };

  var form = document.getElementById('add-form');
  var input = document.getElementById('new-todo');
  var list = document.getElementById('todo-list');
  var emptyState = document.getElementById('empty-state');
  var itemsLeft = document.getElementById('items-left');
  var clearBtn = document.getElementById('clear-completed');
  var filterBtns = document.querySelectorAll('.filter-btn');

  function loadTodos() {
    try {
      var raw = localStorage.getItem(TODOS_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (t) {
        return t && typeof t.text === 'string' && t.id != null;
      }).map(function (t) {
        return { id: String(t.id), text: t.text, completed: !!t.completed };
      });
    } catch (e) {
      return [];
    }
  }

  function loadFilter() {
    try {
      var f = localStorage.getItem(FILTER_KEY);
      return FILTERS.indexOf(f) !== -1 ? f : 'all';
    } catch (e) {
      return 'all';
    }
  }

  var todos = loadTodos();
  var filter = loadFilter();

  function saveTodos() {
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function saveFilter() {
    try { localStorage.setItem(FILTER_KEY, filter); } catch (e) {}
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addTodo(text) {
    var trimmed = text.trim();
    if (!trimmed) return false;
    todos.push({ id: generateId(), text: trimmed, completed: false });
    saveTodos();
    render();
    return true;
  }

  function toggleTodo(id) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id === id) {
        todos[i].completed = !todos[i].completed;
        break;
      }
    }
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    saveTodos();
    render();
  }

  function setFilter(f) {
    if (FILTERS.indexOf(f) === -1) return;
    filter = f;
    saveFilter();
    render();
  }

  function getVisibleTodos() {
    if (filter === 'active') return todos.filter(function (t) { return !t.completed; });
    if (filter === 'completed') return todos.filter(function (t) { return t.completed; });
    return todos;
  }

  function createTodoElement(todo) {
    var li = document.createElement('li');
    li.className = 'todo-item' + (todo.completed ? ' completed' : '');
    li.dataset.id = todo.id;

    var checkboxId = 'todo-' + todo.id;

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = checkboxId;
    checkbox.checked = todo.completed;
    checkbox.addEventListener('change', function () { toggleTodo(todo.id); });

    var label = document.createElement('label');
    label.htmlFor = checkboxId;
    label.textContent = todo.text;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'delete-btn';
    del.textContent = '\u00D7';
    del.setAttribute('aria-label', 'Delete "' + todo.text + '"');
    del.addEventListener('click', function () { deleteTodo(todo.id); });

    li.appendChild(checkbox);
    li.appendChild(label);
    li.appendChild(del);
    return li;
  }

  function render() {
    while (list.firstChild) list.removeChild(list.firstChild);

    var visible = getVisibleTodos();
    var frag = document.createDocumentFragment();
    visible.forEach(function (t) { frag.appendChild(createTodoElement(t)); });
    list.appendChild(frag);

    if (visible.length === 0) {
      emptyState.textContent = EMPTY_MESSAGES[filter];
      emptyState.hidden = false;
      list.hidden = true;
    } else {
      emptyState.hidden = true;
      list.hidden = false;
    }

    var activeCount = todos.filter(function (t) { return !t.completed; }).length;
    itemsLeft.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    var hasCompleted = todos.some(function (t) { return t.completed; });
    clearBtn.disabled = !hasCompleted;

    for (var i = 0; i < filterBtns.length; i++) {
      var btn = filterBtns[i];
      btn.setAttribute('aria-pressed', btn.dataset.filter === filter ? 'true' : 'false');
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (addTodo(input.value)) {
      input.value = '';
    }
    input.focus();
  });

  for (var i = 0; i < filterBtns.length; i++) {
    filterBtns[i].addEventListener('click', function (e) {
      setFilter(e.currentTarget.dataset.filter);
    });
  }

  clearBtn.addEventListener('click', clearCompleted);

  window.addEventListener('storage', function (e) {
    if (e.key === TODOS_KEY) {
      todos = loadTodos();
      render();
    } else if (e.key === FILTER_KEY) {
      filter = loadFilter();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
