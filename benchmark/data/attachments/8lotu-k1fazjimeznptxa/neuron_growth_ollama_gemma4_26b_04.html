<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #05070f;
            box-shadow: 0 0 50px #101a3a;
            cursor: crosshair;
        }
        /* dat.gui customization to match theme */
        .dg.main {
            user-select: none;
        }
    </style>
</head>
<body>

<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
/**
 * NEURAL NETWORK GROWTH SIMULATION
 * A self-contained generative art piece.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// --- Configuration & State ---
const params = {
    // Growth
    neuronCount: 5,
    growthSpeed: 2,
    maxDepth: 5,
    splitChance: 0.2,
    curvature: 0.5,
    maxBranchLength: 60,
    
    // Synapses
    synapseDistanceThreshold: 40,
    synapseGlowStrength: 15,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,
    
    // Visuals
    bgColor: '#05070f',
    bgColorGlow: '#101a3a',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    gridColor: 'rgba(0, 229, 255, 0.08)',
    
    // Controls
    regenerate: () => initSimulation(),
    clear: () => clearCanvas(),
    pause: false
};

let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let animationFrameId;

// --- Classes ---

class Branch {
    constructor(x, y, angle, depth, thickness, parent = null) {
        this.startX = x;
        this.startY = y;
        this.endX = x;
        this.endY = y;
        this.angle = angle;
        this.depth = depth;
        this.thickness = thickness;
        this.parent = parent;
        this.progress = 0;
        this.isFinished = false;
        this.lengthTarget = params.maxBranchLength * (0.8 + Math.random() * 0.4);
        this.curveOffset = (Math.random() - 0.5) * params.curvature * 20;
    }

    update() {
        if (this.isFinished) return;

        const step = params.growthSpeed * (1 / (this.depth + 1));
        this.progress += step;

        if (this.progress >= 1) {
            this.progress = 1;
            this.isFinished = true;
            this.growChildren();
        }

        // Calculate current end position with a slight curve effect
        const currentLen = this.lengthTarget * this.progress;
        const dx = Math.cos(this.angle) * currentLen;
        const dy = Math.sin(this.angle) * currentLen;
        
        // Simple quadratic-like curve via mid-point offset
        const midX = this.startX + dx / 2 + Math.cos(this.angle + Math.PI/2) * this.curveOffset * this.progress;
        const midY = this.midY = this.startY + dy / 2 + Math.sin(this.angle + Math.PI/2) * this.curveOffset * this.progress;

        this.endX = this.startX + dx;
        this.endY = this.startY + dy;
        // Note: For a true smooth curve, we'd store midpoints, 
        // but for performance in a single file, we'll use a simple linear interpolation 
        // and let the "visual" be the line segment.
    }

    growChildren() {
        if (this.depth >= params.maxDepth) return;

        // Chance to split
        if (Math.random() < params.splitChance || this.depth < 1) {
            const numChildren = Math.random() > 0.7 ? 2 : 1;
            for (let i = 0; i < numChildren; i++) {
                const newAngle = this.angle + (Math.random() - 0.5) * params.curvature * 2;
                const newThickness = this.thickness * 0.8;
                branches.push(new Branch(this.endX, this.endY, newAngle, this.depth + 1, newThickness, this));
            }
        }
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = this.thickness;
        ctx.strokeStyle = this.depth % 2 === 0 ? params.branchColor : params.accentBranchColor;
        ctx.lineCap = 'round';
        ctx.moveTo(this.startX, this.startY);
        ctx.lineTo(this.endX, this.endY);
        ctx.stroke();

        // Add glow
        if (this.thickness > 1) {
            ctx.shadowBlur = 5;
            ctx.shadowColor = ctx.strokeStyle;
        }
    }
}

class Synapse {
    constructor(b1, b2) {
        this.b1 = b1;
        this.b2 = b2;
        this.id = Math.random();
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = 1;
        ctx.strokeStyle = params.synapseColor;
        ctx.shadowBlur = params.synapseGlowStrength;
        ctx.shadowColor = params.synapseColor;
        ctx.moveTo(this.b1.endX, this.b1.endY);
        ctx.lineTo(this.b2.endX, this.b2.endY);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
        this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
    }

    update() {
        this.progress += this.speed;
        if (this.progress >= 1) {
            return false; // Finished
        }
        return true;
    }

    draw(ctx) {
        const x = this.synapse.b1.endX + (this.synapse.b2.endX - this.synapse.b1.endX) * this.progress;
        const y = this.synapse.b1.endY + (this.synapse.b2.endY - this.synapse.b1.endY) * this.progress;

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// --- Core Logic ---

function initSimulation() {
    branches = [];
    synapses = [];
    pulses = [];
    
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i < params.neuronCount; i++) {
        const startX = centerX + (Math.random() - 0.5) * 100;
        const startY = centerY + (Math.random() - 0.5) * 100;
        const angle = Math.random() * Math.PI * 2;
        branches.push(new Branch(startX, startY, angle, 0, 4));
    }
}

function clearCanvas() {
    branches = [];
    synapses = [];
    pulses = [];
}

function checkSynapses() {
    // Only check finished branches to avoid massive complexity
    const finishedBranches = branches.filter(b => b.isFinished);
    
    for (let i = 0; i < finishedBranches.length; i++) {
        for (let j = i + 1; j < finishedBranches.length; j++) {
            const b1 = finishedBranches[i];
            const b2 = finishedBranches[j];
            
            // Avoid connecting branches from the same lineage too closely
            if (isRelated(b1, b2)) continue;

            const dist = Math.hypot(b1.endX - b2.endX, b1.endY - b2.endY);
            if (dist < params.synapseDistanceThreshold) {
                // Check if synapse already exists
                const exists = synapses.some(s => 
                    (s.b1 === b1 && s.b2 === b2) || (s.b1 === b2 && s.b2 === b1)
                );
                
                if (!exists) {
                    synapses.push(new Synapse(b1, b2));
                    // Randomly trigger a pulse
                    if (Math.random() < 0.5) {
                        pulses.push(new Pulse(synapses[synapses.length - 1]));
                    }
                }
            }
        }
    }
}

function isRelated(b1, b2) {
    let curr = b1.parent;
    while (curr) {
        if (curr === b2) return true;
        curr = curr.parent;
    }
    curr = b2.parent;
    while (curr) {
        if (curr === b1) return true;
        curr = curr.parent;
    }
    return false;
}

function drawGrid() {
    ctx.strokeStyle = params.gridColor;
    ctx.lineWidth = 1;
    const step = 50;
    for (let x = 0; x <= canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function animate() {
    if (!params.pause) {
        // Background
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Glow effect background
        const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
        grad.addColorStop(0, params.bgColorGlow);
        grad.addColorStop(1, params.bgColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGrid();

        // Update and Draw Branches
        branches.forEach(b => {
            b.update();
            b.draw(ctx);
        });

        // Check for new connections
        checkSynapses();

        // Update and Draw Synapses
        synapses.forEach(s => s.draw(ctx));

        // Update and Draw Pulses
        for (let i = pulses.length - 1; i >= 0; i--) {
            if (!pulses[i].update()) {
                pulses.splice(i, 1);
            } else {
                pulses[i].draw(ctx);
            }
        }

        // Randomly trigger new pulses based on frequency
        if (Math.random() < params.pulseFrequency && synapses.length > 0) {
            pulses.push(new Pulse(synapses[Math.floor(Math.random() * synapses.length)]));
        }
    }

    animationFrameId = requestAnimationFrame(animate);
}

// --- GUI Setup ---

const gui = new dat.GUI();

const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 1, 10).step(1).name('Neuron Count');
fGrowth.add(params, 'growthSpeed', 0.1, 10).name('Growth Speed');
fGrowth.add(params, 'maxDepth', 1, 10).step(1).name('Max Depth');
fGrowth.add(params, 'splitChance', 0, 1).name('Split Chance');
fGrowth.add(params, 'curvature', 0, 2).name('Curvature');
fGrowth.add(params, 'maxBranchLength', 10, 150).name('Max Length');
fGrowth.open();

const fSynapse = gui.addFolder('Synapses');
fSynapse.add(params, 'synapseDistanceThreshold', 5, 100).name('Threshold');
fSynapse.add(params, 'synapseGlowStrength', 0, 30).name('Glow Strength');
fSynapse.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.001, 0.1).name('Pulse Speed');
fPulse.add(params, 'pulseFrequency', 0, 0.05).name('Frequency');
fPulse.add(params, 'pulseBrightness', 0.1, 2).name('Brightness');
fPulse.open();

const fVisuals = gui.addFolder('Visuals');
fVisuals.addColor(params, 'bgColor').name('Background');
fVisuals.addColor(params, 'bgColorGlow').name('Glow Color');
fVisuals.addColor(params, 'branchColor').name('Branch Color');
fVisuals.addColor(params, 'accentBranchColor').name('Accent Color');
fVisuals.addColor(params, 'synapseColor').name('Synapse Color');
fVisuals.addColor(params, 'pulseColor').name('Pulse Color');
fVisuals.open();

const fActions = gui.addFolder('Actions');
fActions.add(params, 'regenerate').name('Regenerate');
fActions.add(params, 'clear').name('Clear Canvas');
fActions.add(params, 'pause').name('Pause/Resume');

// --- Start ---
initSimulation();
animate();

</script>
</body>
</html>
