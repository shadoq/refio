<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  #scoreBoard {
    display: flex;
    gap: 40px;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  #score1 {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88;
  }

  #score2 {
    color: #4488ff;
    text-shadow: 0 0 10px #4488ff;
  }

  #canvasWrapper {
    position: relative;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(100,100,255,0.3), 0 0 60px rgba(100,100,255,0.1);
  }

  canvas {
    display: block;
  }

  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    border-radius: 2px;
  }

  #overlay h1 {
    font-size: 42px;
    font-weight: bold;
    background: linear-gradient(90deg, #00ff88, #4488ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  #overlay h2 {
    font-size: 28px;
    margin-bottom: 5px;
  }

  .menu-option {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 12px 30px;
    font-size: 16px;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Courier New', monospace;
    width: 280px;
    text-align: center;
    letter-spacing: 1px;
  }

  .menu-option:hover, .menu-option.selected {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 15px rgba(100,200,255,0.3);
    transform: scale(1.03);
  }

  .menu-option .key-hint {
    color: #aaa;
    font-size: 13px;
    margin-right: 8px;
  }

  #overlay p {
    color: #aaa;
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
  }

  .result-text {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .winner-text {
    color: #ffd700;
    text-shadow: 0 0 15px #ffd700;
  }

  .score-display {
    font-size: 16px;
    color: #ccc;
    margin-bottom: 10px;
  }

  .snake1-color { color: #00ff88; }
  .snake2-color { color: #4488ff; }

  #subtitle {
    color: #888;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: -15px;
    margin-bottom: 5px;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="scoreBoard">
    <span id="score1">🟢 P1: 0</span>
    <span id="score2">🔵 P2: 0</span>
  </div>
  <div id="canvasWrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h1>SNAKE</h1>
      <p id="subtitle">SELECT GAME MODE</p>
      <button class="menu-option" id="btn1" onclick="startGame(1)">
        <span class="key-hint">[1]</span> Human vs Human
      </button>
      <button class="menu-option" id="btn2" onclick="startGame(2)">
        <span class="key-hint">[2]</span> CPU vs Human
      </button>
      <button class="menu-option" id="btn3" onclick="startGame(3)">
        <span class="key-hint">[3]</span> CPU vs CPU
      </button>
      <p>Use WASD for Player 1 · Arrow Keys for Player 2</p>
    </div>
  </div>
</div>

<script>
const GRID = 30;
const CELL = 20;
const CANVAS_SIZE = GRID * CELL;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const overlay = document.getElementById('overlay');
const score1El = document.getElementById('score1');
const score2El = document.getElementById('score2');

// Game state
let gameMode = 0; // 1=HvH, 2=CvH, 3=CvC
let gameState = 'menu'; // menu, playing, gameover
let lastTime = 0;
let gameSpeed = 120; // ms per tick
let accumulator = 0;
let animFrameId = null;

// Directions
const DIR = {
  UP:    { x: 0, y: -1 },
  DOWN:  { x: 0, y:  1 },
  LEFT:  { x: -1, y: 0 },
  RIGHT: { x: 1, y:  0 }
};

let snake1, snake2, food;

function createSnake(startX, startY, dir, color, headColor) {
  return {
    body: [
      { x: startX, y: startY },
      { x: startX - dir.x, y: startY - dir.y },
      { x: startX - dir.x * 2, y: startY - dir.y * 2 }
    ],
    dir: { ...dir },
    nextDir: { ...dir },
    color,
    headColor,
    score: 0,
    alive: true,
    grew: false
  };
}

function initGame() {
  snake1 = createSnake(8, 15, DIR.RIGHT, '#00cc66', '#00ff88');
  snake2 = createSnake(21, 15, DIR.LEFT, '#2266cc', '#4488ff');
  spawnFood();
}

function spawnFood() {
  const occupied = new Set();
  if (snake1) snake1.body.forEach(s => occupied.add(`${s.x},${s.y}`));
  if (snake2) snake2.body.forEach(s => occupied.add(`${s.x},${s.y}`));

  let pos;
  do {
    pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
}

// BFS pathfinding for CPU
function bfsPath(snake, targetSnake) {
  const head = snake.body[0];
  const target = food;

  const occupied = new Set();
  snake.body.forEach(s => occupied.add(`${s.x},${s.y}`));
  if (targetSnake && targetSnake.alive) {
    targetSnake.body.forEach(s => occupied.add(`${s.x},${s.y}`));
  }

  const queue = [{ x: head.x, y: head.y, path: [] }];
  const visited = new Set([`${head.x},${head.y}`]);
  const directions = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];

  while (queue.length > 0) {
    const current = queue.shift();

    for (const d of directions) {
      const nx = current.x + d.x;
      const ny = current.y + d.y;
      const key = `${nx},${ny}`;

      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
      if (occupied.has(key)) continue;
      if (visited.has(key)) continue;

      const newPath = [...current.path, d];

      if (nx === target.x && ny === target.y) {
        return newPath[0] || null;
      }

      visited.add(key);
      queue.push({ x: nx, y: ny, path: newPath });
    }
  }
  return null;
}

function getSafeDir(snake, otherSnake) {
  const head = snake.body[0];
  const occupied = new Set();
  snake.body.forEach(s => occupied.add(`${s.x},${s.y}`));
  if (otherSnake && otherSnake.alive) {
    otherSnake.body.forEach(s => occupied.add(`${s.x},${s.y}`));
  }

  const directions = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
  const safeDirs = [];

  for (const d of directions) {
    // Prevent 180 reversal
    if (d.x === -snake.dir.x && d.y === -snake.dir.y) continue;
    const nx = head.x + d.x;
    const ny = head.y + d.y;
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
    if (occupied.has(`${nx},${ny}`)) continue;
    safeDirs.push(d);
  }

  if (safeDirs.length === 0) return snake.dir;
  return safeDirs[Math.floor(Math.random() * safeDirs.length)];
}

function cpuMove(snake, otherSnake) {
  const bfsDir = bfsPath(snake, otherSnake);
  if (bfsDir) {
    // Validate it's not a 180
    if (!(bfsDir.x === -snake.dir.x && bfsDir.y === -snake.dir.y)) {
      snake.nextDir = bfsDir;
      return;
    }
  }
  snake.nextDir = getSafeDir(snake, otherSnake);
}

function moveSnake(snake, otherSnake) {
  if (!snake.alive) return;

  // Apply next direction (prevent 180)
  const nd = snake.nextDir;
  if (!(nd.x === -snake.dir.x && nd.y === -snake.dir.y)) {
    snake.dir = { ...nd };
  }

  const head = snake.body[0];
  const newHead = { x: head.x + snake.dir.x, y: head.y + snake.dir.y };

  // Wall collision
  if (newHead.x < 0 || newHead.x >= GRID || newHead.y < 0 || newHead.y >= GRID) {
    snake.alive = false;
    return;
  }

  // Self collision
  for (const seg of snake.body) {
    if (seg.x === newHead.x && seg.y === newHead.y) {
      snake.alive = false;
      return;
    }
  }

  // Other snake collision
  if (otherSnake && otherSnake.alive) {
    for (const seg of otherSnake.body) {
      if (seg.x === newHead.x && seg.y === newHead.y) {
        snake.alive = false;
        return;
      }
    }
  }

  snake.body.unshift(newHead);

  // Food check
  if (newHead.x === food.x && newHead.y === food.y) {
    snake.score++;
    snake.grew = true;
    spawnFood();
  } else {
    snake.body.pop();
  }
}

function updateGame() {
  // CPU decisions
  if (gameMode === 2 || gameMode === 3) {
    if (snake1.alive) cpuMove(snake1, snake2);
  }
  if (gameMode === 3) {
    if (snake2.alive) cpuMove(snake2, snake1);
  }

  moveSnake(snake1, snake2);
  moveSnake(snake2, snake1);

  // Update scores display
  score1El.textContent = `🟢 P1: ${snake1.score}`;
  score2El.textContent = `🔵 P2: ${snake2.score}`;

  // Check game over
  if (!snake1.alive || !snake2.alive) {
    endGame();
  }
}

function endGame() {
  gameState = 'gameover';

  let winnerText = '';
  let winnerClass = '';

  if (!snake1.alive && !snake2.alive) {
    winnerText = "IT'S A DRAW!";
    winnerClass = '';
  } else if (!snake1.alive) {
    winnerText = gameMode === 3 ? '🔵 CPU 2 WINS!' : '🔵 PLAYER 2 WINS!';
    winnerClass = 'snake2-color';
  } else {
    winnerText = gameMode === 3 ? '🟢 CPU 1 WINS!' : (gameMode === 2 ? '🟢 CPU WINS!' : '🟢 PLAYER 1 WINS!');
    winnerClass = 'snake1-color';
  }

  overlay.innerHTML = `
    <h1>GAME OVER</h1>
    <div class="result-text winner-text ${winnerClass}">${winnerText}</div>
    <div class="score-display">
      <span class="snake1-color">P1 Score: ${snake1.score}</span>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      <span class="snake2-color">P2 Score: ${snake2.score}</span>
    </div>
    <button class="menu-option" onclick="showMenu()" style="margin-top:10px">
      <span class="key-hint">[R]</span> Play Again
    </button>
    <p>Press R or click to return to menu</p>
  `;
  overlay.style.display = 'flex';
}

function showMenu() {
  gameState = 'menu';
  overlay.innerHTML = `
    <h1>SNAKE</h1>
    <p id="subtitle">SELECT GAME MODE</p>
    <button class="menu-option" id="btn1" onclick="startGame(1)">
      <span class="key-hint">[1]</span> Human vs Human
    </button>
    <button class="menu-option" id="btn2" onclick="startGame(2)">
      <span class="key-hint">[2]</span> CPU vs Human
    </button>
    <button class="menu-option" id="btn3" onclick="startGame(3)">
      <span class="key-hint">[3]</span> CPU vs CPU
    </button>
    <p>Use WASD for Player 1 · Arrow Keys for Player 2</p>
  `;
  overlay.style.display = 'flex';
}

function startGame(mode) {
  gameMode = mode;
  gameState = 'playing';
  overlay.style.display = 'none';
  initGame();
  score1El.textContent = '🟢 P1: 0';
  score2El.textContent = '🔵 P2: 0';
  lastTime = 0;
  accumulator = 0;
}

// Drawing
function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, CANVAS_SIZE);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(CANVAS_SIZE, i * CELL);
    ctx.stroke();
  }
}

function drawSnake(snake) {
  if (!snake) return;
  const len = snake.body.length;

  for (let i = len - 1; i >= 0; i--) {
    const seg = snake.body[i];
    const isHead = i === 0;
    const t = 1 - (i / len) * 0.5;

    if (isHead) {
      ctx.fillStyle = snake.headColor;
      ctx.shadowColor = snake.headColor;
      ctx.shadowBlur = 12;
    } else {
      ctx.fillStyle = snake.color;
      ctx.shadowColor = snake.color;
      ctx.shadowBlur = 4;
      ctx.globalAlpha = 0.6 + 0.4 * t;
    }

    const padding = isHead ? 1 : 2;
    const radius = isHead ? 4 : 3;
    roundRect(
      seg.x * CELL + padding,
      seg.y * CELL + padding,
      CELL - padding * 2,
      CELL - padding * 2,
      radius
    );
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // Draw eyes on head
  if (snake.alive && snake.body.length > 0) {
    drawEyes(snake);
  }
}

function drawEyes(snake) {
  const head = snake.body[0];
  const d = snake.dir;
  const cx = head.x * CELL + CELL / 2;
  const cy = head.y * CELL + CELL / 2;

  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 0;

  let eye1, eye2;
  const offset = 4;
  const eyeSize = 2.5;

  if (d.x === 1) { // right
    eye1 = { x: cx + 3, y: cy - offset };
    eye2 = { x: cx + 3, y: cy + offset };
  } else if (d.x === -1) { // left
    eye1 = { x: cx - 3, y: cy - offset };
    eye2 = { x: cx - 3, y: cy + offset };
  } else if (d.y === -1) { // up
    eye1 = { x: cx - offset, y: cy - 3 };
    eye2 = { x: cx + offset, y: cy - 3 };
  } else { // down
    eye1 = { x: cx - offset, y: cy + 3 };
    eye2 = { x: cx + offset, y: cy + 3 };
  }

  ctx.beginPath();
  ctx.arc(eye1.x, eye1.y, eyeSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eye2.x, eye2.y, eyeSize, 0, Math.PI * 2);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(eye1.x + d.x, eye1.y + d.y, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eye2.x + d.x, eye2.y + d.y, 1.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawFood() {
  if (!food) return;
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;
  const r = CELL / 2 - 3;

  // Pulsing glow
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 300);

  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 15 * pulse;
  ctx.fillStyle = '#ff3333';
  ctx.beginPath();
  ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function render() {
  // Background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  drawGrid();
  drawFood();
  drawSnake(snake1);
  drawSnake(snake2);
}

function gameLoop(timestamp) {
  animFrameId = requestAnimationFrame(gameLoop);

  if (!lastTime) lastTime = timestamp;
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  if (gameState === 'playing') {
    accumulator += delta;
    if (accumulator >= gameSpeed) {
      accumulator -= gameSpeed;
      updateGame();
    }
  }

  if (gameState === 'playing' || gameState === 'gameover') {
    render();
  }
}

// Input handling
document.addEventListener('keydown', (e) => {
  if (gameState === 'menu') {
    if (e.key === '1') startGame(1);
    else if (e.key === '2') startGame(2);
    else if (e.key === '3') startGame(3);
    return;
  }

  if (gameState === 'gameover') {
    if (e.key === 'r' || e.key === 'R') showMenu();
    return;
  }

  if (gameState === 'playing') {
    // Snake 1 controls (WASD) - only if human
    if (gameMode === 1) {
      switch(e.key.toLowerCase()) {
        case 'w': if (snake1.dir.y !== 1)  snake1.nextDir = DIR.UP;    break;
        case 's': if (snake1.dir.y !== -1) snake1.nextDir = DIR.DOWN;  break;
        case 'a': if (snake1.dir.x !== 1)  snake1.nextDir = DIR.LEFT;  break;
        case 'd': if (snake1.dir.x !== -1) snake1.nextDir = DIR.RIGHT; break;
      }
    }

    // Snake 2 controls (Arrow keys) - human in modes 1 and 2
    if (gameMode === 1 || gameMode === 2) {
      switch(e.key) {
        case 'ArrowUp':    e.preventDefault(); if (snake2.dir.y !== 1)  snake2.nextDir = DIR.UP;    break;
        case 'ArrowDown':  e.preventDefault(); if (snake2.dir.y !== -1) snake2.nextDir = DIR.DOWN;  break;
        case 'ArrowLeft':  e.preventDefault(); if (snake2.dir.x !== 1)  snake2.nextDir = DIR.LEFT;  break;
        case 'ArrowRight': e.preventDefault(); if (snake2.dir.x !== -1) snake2.nextDir = DIR.RIGHT; break;
      }
    }
  }
});

// Start the loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
