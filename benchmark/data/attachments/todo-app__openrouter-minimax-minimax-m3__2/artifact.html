<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    color: #2d3748;
  }

  .todo-card {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }

  .todo-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid #edf2f7;
  }

  .todo-header h1 {
    font-size: 24px;
    font-weight: 600;
    color: #2d3748;
    margin-bottom: 16px;
    text-align: center;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  .input-row input:focus {
    border-color: #4299e1;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
  }

  .input-row button {
    padding: 12px 20px;
    background: #4299e1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
  }

  .input-row button:hover {
    background: #3182ce;
  }

  .todo-list {
    list-style: none;
    max-height: 360px;
    overflow-y: auto;
  }

  .todo-list:empty {
    display: none;
  }

  .todo-item {
    display: flex;
    align-items: center;
    padding: 12px 24px;
    border-bottom: 1px solid #edf2f7;
    transition: background 0.15s;
    gap: 12px;
  }

  .todo-item:hover {
    background: #f7fafc;
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-checkbox {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #4299e1;
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    color: #2d3748;
    word-break: break-word;
    transition: color 0.15s, text-decoration 0.15s;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #a0aec0;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #cbd5e0;
    font-size: 20px;
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .delete-btn:hover {
    background: #fed7d7;
    color: #e53e3e;
  }

  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: #a0aec0;
    font-size: 15px;
  }

  .todo-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-top: 1px solid #edf2f7;
    background: #f7fafc;
    flex-wrap: wrap;
    gap: 8px;
  }

  .item-count {
    font-size: 13px;
    color: #718096;
    flex-shrink: 0;
  }

  .filters {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    font-size: 13px;
    color: #718096;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .filter-btn:hover {
    color: #2d3748;
  }

  .filter-btn.active {
    border-color: #4299e1;
    color: #4299e1;
  }

  .clear-btn {
    padding: 4px 10px;
    background: transparent;
    border: none;
    font-size: 13px;
    color: #718096;
    cursor: pointer;
    transition: color 0.15s;
    font-family: inherit;
  }

  .clear-btn:hover {
    color: #e53e3e;
  }

  .clear-btn.hidden {
    visibility: hidden;
  }
</style>
</head>
<body>
  <div class="todo-card">
    <div class="todo-header">
      <h1>Todos</h1>
      <div class="input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
        <button id="add-btn">Add</button>
      </div>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
    <div class="empty-state" id="empty-state" style="display: none;">
      No todos to show
    </div>

    <div class="todo-footer">
      <span class="item-count" id="item-count">0 items left</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button class="clear-btn hidden" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "todo_app_items_v1";
      const FILTER_KEY = "todo_app_filter_v1";

      let todos = [];
      let currentFilter = "all";

      const todoListEl = document.getElementById("todo-list");
      const emptyStateEl = document.getElementById("empty-state");
      const inputEl = document.getElementById("todo-input");
      const addBtnEl = document.getElementById("add-btn");
      const itemCountEl = document.getElementById("item-count");
      const clearBtnEl = document.getElementById("clear-btn");
      const filterBtns = document.querySelectorAll(".filter-btn");

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(
            (t) => t && typeof t.id === "string" && typeof t.text === "string"
          );
        } catch (e) {
          return [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          // ignore quota errors
        }
      }

      function loadFilter() {
        const stored = localStorage.getItem(FILTER_KEY);
        if (stored === "all" || stored === "active" || stored === "completed") {
          return stored;
        }
        return "all";
      }

      function saveFilter() {
        try {
          localStorage.setItem(FILTER_KEY, currentFilter);
        } catch (e) {
          // ignore
        }
      }

      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        todos.push({
          id: generateId(),
          text: trimmed,
          completed: false,
        });
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter((t) => t.id !== id);
        saveTodos();
        render();
      }

      function clearCompleted() {
        todos = todos.filter((t) => !t.completed);
        saveTodos();
        render();
      }

      function setFilter(filter) {
        if (filter !== "all" && filter !== "active" && filter !== "completed") {
          return;
        }
        currentFilter = filter;
        saveFilter();
        render();
      }

      function getFilteredTodos() {
        if (currentFilter === "active") {
          return todos.filter((t) => !t.completed);
        }
        if (currentFilter === "completed") {
          return todos.filter((t) => t.completed);
        }
        return todos;
      }

      function render() {
        const filtered = getFilteredTodos();

        todoListEl.innerHTML = "";
        filtered.forEach((todo) => {
          const li = document.createElement("li");
          li.className = "todo-item" + (todo.completed ? " completed" : "");
          li.dataset.id = todo.id;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "todo-checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.innerHTML = escapeHtml(todo.text);

          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.setAttribute("aria-label", "Delete todo");
          delBtn.textContent = "×";
          delBtn.addEventListener("click", () => deleteTodo(todo.id));

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(delBtn);
          todoListEl.appendChild(li);
        });

        const activeCount = todos.filter((t) => !t.completed).length;
        itemCountEl.textContent =
          activeCount + (activeCount === 1 ? " item left" : " items left");

        const completedCount = todos.filter((t) => t.completed).length;
        if (completedCount > 0) {
          clearBtnEl.classList.remove("hidden");
        } else {
          clearBtnEl.classList.add("hidden");
        }

        filterBtns.forEach((btn) => {
          if (btn.dataset.filter === currentFilter) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        if (filtered.length === 0) {
          emptyStateEl.style.display = "block";
          if (todos.length === 0) {
            emptyStateEl.textContent = "No todos yet. Add one above!";
          } else if (currentFilter === "active") {
            emptyStateEl.textContent = "No active todos";
          } else if (currentFilter === "completed") {
            emptyStateEl.textContent = "No completed todos";
          } else {
            emptyStateEl.textContent = "No todos to show";
          }
        } else {
          emptyStateEl.style.display = "none";
        }
      }

      addBtnEl.addEventListener("click", () => {
        addTodo(inputEl.value);
        inputEl.value = "";
        inputEl.focus();
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          addTodo(inputEl.value);
          inputEl.value = "";
        }
      });

      clearBtnEl.addEventListener("click", clearCompleted);

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => setFilter(btn.dataset.filter));
      });

      todos = loadTodos();
      currentFilter = loadFilter();
      render();
    })();
  </script>
</body>
</html>
