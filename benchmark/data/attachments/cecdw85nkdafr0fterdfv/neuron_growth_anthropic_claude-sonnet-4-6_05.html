<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #canvas-wrapper {
    position: relative;
    width: 800px;
    height: 800px;
    box-shadow: 0 0 60px rgba(0,229,255,0.15), 0 0 120px rgba(0,229,255,0.05);
  }
  canvas {
    display: block;
    border: 1px solid rgba(0,229,255,0.2);
  }
  .dg.ac {
    z-index: 999 !important;
  }
  .dg .c .slider {
    background: #101a3a !important;
  }
  .dg .cr.boolean:hover, .dg li:not(.folder):hover {
    background: #101a3a !important;
  }
</style>
</head>
<body>
<div id="canvas-wrapper">
  <canvas id="mainCanvas" width="800" height="800"></canvas>
</div>

<script>
// ============================================================
// SETUP
// ============================================================
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let animationId = null;
let isPaused = false;
let frameCount = 0;

// ============================================================
// PARAMETERS
// ============================================================
const params = {
  // Growth
  neuronCount: 4,
  growthSpeed: 2.5,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.45,
  maxBranchLength: 120,
  // Synapses
  synapseDistance: 40,
  synapseGlow: 12,
  // Pulses
  pulseSpeed: 1.8,
  pulseFrequency: 0.018,
  pulseBrightness: 1.0,
  // Visuals
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  showScanlines: true,
  showVignette: true,
  showGrid: true,
};

// ============================================================
// DATA STRUCTURES
// ============================================================
let branches = [];
let growingBranches = [];
let synapses = [];
let pulses = [];
let synapseSet = new Set();
let neurons = [];

// Branch object
function createBranch(x, y, angle, depth, thickness, isAccent) {
  return {
    x, y, angle, depth, thickness,
    isAccent,
    points: [{ x, y }],
    length: 0,
    maxLength: params.maxBranchLength * (0.5 + Math.random() * 0.7) * (1 - depth * 0.1),
    speed: params.growthSpeed * (0.7 + Math.random() * 0.6),
    curveDrift: (Math.random() - 0.5) * params.curvature,
    done: false,
    children: [],
    tip: { x, y },
    id: Math.random().toString(36).substr(2, 9),
  };
}

// ============================================================
// NEURON GROWTH
// ============================================================
function seedNeurons() {
  branches = [];
  growingBranches = [];
  synapses = [];
  pulses = [];
  synapseSet = new Set();
  neurons = [];

  const count = Math.floor(params.neuronCount);
  const cx = W / 2;
  const cy = H / 2;
  const spread = 160;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const r = Math.random() * spread;
    const nx = cx + Math.cos(angle) * r;
    const ny = cy + Math.sin(angle) * r;
    neurons.push({ x: nx, y: ny });

    const numAxons = 3 + Math.floor(Math.random() * 3);
    for (let j = 0; j < numAxons; j++) {
      const branchAngle = (j / numAxons) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
      const isAccent = Math.random() < 0.3;
      const b = createBranch(nx, ny, branchAngle, 0, 1.5 + Math.random() * 1.0, isAccent);
      branches.push(b);
      growingBranches.push(b);
    }
  }
}

function growBranch(b) {
  if (b.done) return;

  const steps = Math.ceil(b.speed);
  for (let s = 0; s < steps; s++) {
    b.angle += b.curveDrift * 0.08 + (Math.random() - 0.5) * 0.04;
    b.curveDrift += (Math.random() - 0.5) * 0.05;
    b.curveDrift *= 0.92;

    const stepSize = 1.5;
    const nx = b.tip.x + Math.cos(b.angle) * stepSize;
    const ny = b.tip.y + Math.sin(b.angle) * stepSize;

    if (nx < 5 || nx > W - 5 || ny < 5 || ny > H - 5) {
      b.done = true;
      return;
    }

    b.tip.x = nx;
    b.tip.y = ny;
    b.points.push({ x: nx, y: ny });
    b.length += stepSize;

    if (b.length >= b.maxLength) {
      b.done = true;

      if (b.depth < params.maxDepth && Math.random() < params.splitChance) {
        spawnChildren(b);
      }
      return;
    }

    if (b.length > 20 && Math.random() < 0.003 && b.depth < params.maxDepth) {
      spawnChildren(b);
    }
  }
}

function spawnChildren(parent) {
  const numChildren = Math.random() < 0.4 ? 2 : 1;
  for (let i = 0; i < numChildren; i++) {
    const spread = (Math.random() - 0.5) * 1.2;
    const childAngle = parent.angle + spread;
    const thickness = parent.thickness * (0.6 + Math.random() * 0.25);
    if (thickness < 0.2) continue;
    const isAccent = parent.isAccent ? Math.random() < 0.7 : Math.random() < 0.15;
    const child = createBranch(
      parent.tip.x, parent.tip.y,
      childAngle,
      parent.depth + 1,
      thickness,
      isAccent
    );
    child.maxLength = params.maxBranchLength * (0.3 + Math.random() * 0.5) * (1 - child.depth * 0.12);
    branches.push(child);
    growingBranches.push(child);
    parent.children.push(child);
  }
}

// ============================================================
// SYNAPSE DETECTION
// ============================================================
function detectSynapses() {
  const tips = [];
  for (const b of branches) {
    if (b.points.length > 5) {
      tips.push(b);
    }
  }

  const threshold = params.synapseDistance;
  const threshSq = threshold * threshold;

  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i];
      const b = tips[j];
      const tipA = a.tip;
      const tipB = b.tip;
      const dx = tipA.x - tipB.x;
      const dy = tipA.y - tipB.y;
      const distSq = dx * dx + dy * dy;

      if (distSq < threshSq) {
        const key = [a.id, b.id].sort().join('|');
        if (!synapseSet.has(key)) {
          synapseSet.add(key);
          synapses.push({
            ax: tipA.x, ay: tipA.y,
            bx: tipB.x, by: tipB.y,
            branchA: a, branchB: b,
            phase: Math.random() * Math.PI * 2,
            strength: 0,
          });
        }
      }
    }
  }
}

// ============================================================
// PULSE ANIMATION
// ============================================================
function spawnPulses() {
  if (synapses.length === 0) return;
  if (Math.random() < params.pulseFrequency) {
    const syn = synapses[Math.floor(Math.random() * synapses.length)];
    const forward = Math.random() < 0.5;
    pulses.push({
      synapse: syn,
      t: 0,
      forward,
      speed: params.pulseSpeed * (0.7 + Math.random() * 0.6) * 0.005,
    });
  }
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].t += pulses[i].speed;
    if (pulses[i].t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

// ============================================================
// RENDERING
// ============================================================
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function drawBackground() {
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Radial background glow
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
  grad.addColorStop(0, 'rgba(16,26,58,0.6)');
  grad.addColorStop(1, 'rgba(5,7,15,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Grid
  if (params.showGrid) {
    ctx.strokeStyle = 'rgba(0,229,255,0.06)';
    ctx.lineWidth = 0.5;
    const gridSize = 40;
    for (let x = 0; x < W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }
}

function drawBranches() {
  for (const b of branches) {
    if (b.points.length < 2) continue;

    const color = b.isAccent ? params.accentColor : params.branchColor;
    const rgb = hexToRgb(color);
    const alpha = 0.7 + b.thickness * 0.1;

    ctx.save();
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.lineWidth = b.thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 6 + b.thickness * 2;

    ctx.beginPath();
    ctx.moveTo(b.points[0].x, b.points[0].y);

    for (let i = 1; i < b.points.length - 1; i++) {
      const mx = (b.points[i].x + b.points[i + 1].x) / 2;
      const my = (b.points[i].y + b.points[i + 1].y) / 2;
      ctx.quadraticCurveTo(b.points[i].x, b.points[i].y, mx, my);
    }

    const last = b.points[b.points.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
    ctx.restore();
  }
}

function drawNeuronBodies() {
  for (const n of neurons) {
    ctx.save();
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 10);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.3, params.branchColor);
    grad.addColorStop(1, 'rgba(0,229,255,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = params.branchColor;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSynapses() {
  const t = frameCount * 0.03;
  for (const syn of synapses) {
    syn.strength = Math.min(1, syn.strength + 0.02);
    const pulse = 0.5 + 0.5 * Math.sin(t + syn.phase);
    const alpha = (0.3 + 0.4 * pulse) * syn.strength;
    const glow = params.synapseGlow * (0.5 + 0.5 * pulse);

    const rgb = hexToRgb(params.synapseColor);

    ctx.save();
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.lineWidth = 0.8 + pulse * 0.6;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = glow;
    ctx.setLineDash([3, 5]);
    ctx.lineDashOffset = -t * 8;
    ctx.beginPath();
    ctx.moveTo(syn.ax, syn.ay);
    ctx.lineTo(syn.bx, syn.by);
    ctx.stroke();
    ctx.restore();

    // Synapse endpoint dots
    ctx.save();
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${0.6 * syn.strength})`;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = glow * 1.5;
    ctx.beginPath();
    ctx.arc(syn.ax, syn.ay, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(syn.bx, syn.by, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPulses() {
  const rgb = hexToRgb(params.pulseColor);
  for (const p of pulses) {
    const t = p.forward ? p.t : 1 - p.t;
    const syn = p.synapse;
    const px = syn.ax + (syn.bx - syn.ax) * t;
    const py = syn.ay + (syn.by - syn.ay) * t;

    const brightness = params.pulseBrightness;

    ctx.save();
    // Outer glow
    const grad = ctx.createRadialGradient(px, py, 0, px, py, 10);
    grad.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${0.9 * brightness})`);
    grad.addColorStop(0.4, `rgba(${rgb.r},${rgb.g},${rgb.b},${0.4 * brightness})`);
    grad.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
    ctx.fillStyle = grad;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 18 * brightness;
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(255,255,255,${0.95 * brightness})`;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawScanlines() {
  if (!params.showScanlines) return;
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let y = 0; y < H; y += 3) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, y, W, 1);
  }
  ctx.restore();
}

function drawVignette() {
  if (!params.showVignette) return;
  const grad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawStats() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,212,0,0.55)';
  ctx.font = '10px monospace';
  ctx.fillText(`branches: ${branches.length}  synapses: ${synapses.length}  pulses: ${pulses.length}`, 10, H - 10);
  ctx.restore();
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  if (!isPaused) {
    frameCount++;

    drawBackground();

    // Grow branches
    const stillGrowing = [];
    for (const b of growingBranches) {
      growBranch(b);
      if (!b.done) stillGrowing.push(b);
    }
    growingBranches.length = 0;
    for (const b of stillGrowing) growingBranches.push(b);

    // Detect synapses periodically
    if (frameCount % 12 === 0) {
      detectSynapses();
    }

    // Spawn and update pulses
    spawnPulses();
    updatePulses();

    // Draw everything
    drawBranches();
    drawNeuronBodies();
    drawSynapses();
    drawPulses();
    drawScanlines();
    drawVignette();
    drawStats();
  }

  animationId = requestAnimationFrame(animate);
}

// ============================================================
// GUI SETUP
// ============================================================
function setupGUI() {
  const gui = new dat.GUI({ width: 280 });
  gui.domElement.style.position = 'fixed';
  gui.domElement.style.top = '10px';
  gui.domElement.style.right = '10px';

  // Growth folder
  const growthFolder = gui.addFolder('Growth');
  growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
  growthFolder.add(params, 'growthSpeed', 0.5, 6, 0.1).name('Growth Speed');
  growthFolder.add(params, 'maxDepth', 2, 10, 1).name('Max Depth');
  growthFolder.add(params, 'splitChance', 0.05, 0.8, 0.01).name('Split Chance');
  growthFolder.add(params, 'curvature', 0.0, 1.5, 0.01).name('Curvature');
  growthFolder.add(params, 'maxBranchLength', 40, 250, 5).name('Max Branch Len');
  growthFolder.open();

  // Synapses folder
  const synFolder = gui.addFolder('Synapses');
  synFolder.add(params, 'synapseDistance', 10, 120, 1).name('Distance Thresh');
  synFolder.add(params, 'synapseGlow', 2, 30, 0.5).name('Glow Strength');
  synFolder.open();

  // Pulses folder
  const pulseFolder = gui.addFolder('Pulses');
  pulseFolder.add(params, 'pulseSpeed', 0.2, 5, 0.1).name('Pulse Speed');
  pulseFolder.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Pulse Frequency');
  pulseFolder.add(params, 'pulseBrightness', 0.1, 2.0, 0.05).name('Pulse Brightness');
  pulseFolder.open();

  // Visuals folder
  const visFolder = gui.addFolder('Visuals');
  visFolder.addColor(params, 'bgColor').name('Background');
  visFolder.addColor(params, 'branchColor').name('Branch Color');
  visFolder.addColor(params, 'accentColor').name('Accent Color');
  visFolder.addColor(params, 'synapseColor').name('Synapse Color');
  visFolder.addColor(params, 'pulseColor').name('Pulse Color');
  visFolder.add(params, 'showScanlines').name('Scanlines');
  visFolder.add(params, 'showVignette').name('Vignette');
  visFolder.add(params, 'showGrid').name('Grid');
  visFolder.open();

  // Buttons
  const actions = {
    regenerate: () => {
      seedNeurons();
      frameCount = 0;
    },
    clearCanvas: () => {
      branches = [];
      growingBranches = [];
      synapses = [];
      pulses = [];
      synapseSet = new Set();
      neurons = [];
      ctx.fillStyle = params.bgColor;
      ctx.fillRect(0, 0, W, H);
    },
    pauseResume: () => {
      isPaused = !isPaused;
    },
  };

  gui.add(actions, 'regenerate').name('⟳ Regenerate Network');
  gui.add(actions, 'clearCanvas').name('✕ Clear Canvas');
  gui.add(actions, 'pauseResume').name('⏸ Pause / Resume');
}

// ============================================================
// INIT
// ============================================================
function init() {
  setupGUI();
  seedNeurons();
  animate();
}

init();
</script>
</body>
</html>
