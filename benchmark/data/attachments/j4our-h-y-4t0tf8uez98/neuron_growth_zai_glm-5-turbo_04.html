<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; }
  .dg.ac { z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script>

/* ============================================================
   SETUP
   ============================================================ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = 400, CY = 400;
const MAX_BRANCHES = 500;
const EPS = 0.001;

let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let tips = [];
let paused = false;
let frameCount = 0;
let totalBranches = 0;
let growthComplete = false;

/* ============================================================
   PARAMETERS & GUI
   ============================================================ */
const params = {
  neuronCount: 5,
  growthSpeed: 1.5,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.3,
  maxLength: 120,
  synapseDist: 25,
  synapseGlow: 15,
  pulseSpeed: 0.02,
  pulseFreq: 0.003,
  pulseBright: 1.0,
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  regenerate: function() { initNetwork(); },
  clear: function() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    tips = [];
    totalBranches = 0;
    growthComplete = false;
  },
  pause: function() { paused = !paused; }
};

const gui = new dat.GUI({ width: 280 });

const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6).step(1).name('Neuron Count');
growthFolder.add(params, 'growthSpeed', 0.2, 5).name('Growth Speed');
growthFolder.add(params, 'maxDepth', 2, 10).step(1).name('Max Depth');
growthFolder.add(params, 'splitChance', 0, 1).name('Split Chance');
growthFolder.add(params, 'curvature', 0, 1).name('Curvature');
growthFolder.add(params, 'maxLength', 30, 250).name('Max Length');
growthFolder.open();

const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDist', 5, 60).name('Distance');
synapseFolder.add(params, 'synapseGlow', 0, 40).name('Glow Strength');
synapseFolder.open();

const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params, 'pulseSpeed', 0.005, 0.08).name('Speed');
pulseFolder.add(params, 'pulseFreq', 0.001, 0.01).name('Frequency');
pulseFolder.add(params, 'pulseBright', 0.2, 2).name('Brightness');
pulseFolder.open();

const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'bgColor').name('Background');
visualsFolder.addColor(params, 'branchColor').name('Branch Color');
visualsFolder.addColor(params, 'accentColor').name('Accent Color');
visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
visualsFolder.open();

gui.add(params, 'regenerate').name('Regenerate Network');
gui.add(params, 'clear').name('Clear Canvas');
gui.add(params, 'pause').name('Pause / Resume');

/* ============================================================
   UTILITY
   ============================================================ */
function rand(a, b) {
  return a + Math.random() * (b - a);
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function rgbStr(c) {
  return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
}

function rgbaStr(c, a) {
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}

function dist(x1, y1, x2, y2) {
  const dx = x1 - x2, dy = y1 - y2;
  return Math.sqrt(dx * dx + dy * dy);
}

function quadPt(ox, oy, cx, cy, ex, ey, t) {
  const m = 1 - t;
  return {
    x: m * m * ox + 2 * m * t * cx + t * t * ex,
    y: m * m * oy + 2 * m * t * cy + t * t * ey
  };
}

/* ============================================================
   NETWORK INIT
   ============================================================ */
function initNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  tips = [];
  totalBranches = 0;
  growthComplete = false;
  frameCount = 0;

  const count = params.neuronCount;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + rand(-0.4, 0.4);
    const r = rand(25, 90);
    const nx = CX + Math.cos(angle) * r;
    const ny = CY + Math.sin(angle) * r;
    neurons.push({ x: nx, y: ny, radius: rand(4, 7), phase: Math.random() * Math.PI * 2 });

    const numAxons = Math.floor(rand(3, 6));
    for (let j = 0; j < numAxons; j++) {
      const bAngle = angle + rand(-1.3, 1.3);
      const bLen = rand(params.maxLength * 0.5, params.maxLength);
      branches.push(createBranch(nx, ny, bAngle, 0, bLen, Math.random() < 0.2, i));
      totalBranches++;
    }
  }
}

/* ============================================================
   BRANCH CREATION
   ============================================================ */
function createBranch(ox, oy, angle, depth, length, isAccent, neuronIdx) {
  const curv = (Math.random() - 0.5) * params.curvature * 2;
  const ctrlAngle = angle + curv;
  const halfLen = length / 2;
  const cx = ox + Math.cos(ctrlAngle) * halfLen;
  const cy = oy + Math.sin(ctrlAngle) * halfLen;
  const ex = ox + Math.cos(angle) * length;
  const ey = oy + Math.sin(angle) * length;
  const thickness = Math.max(0.4, (params.maxDepth - depth + 1) * 0.55 + rand(-0.2, 0.2));

  return {
    ox: ox, oy: oy,
    cx: cx, cy: cy,
    ex: ex, ey: ey,
    depth: depth,
    thickness: thickness,
    isAccent: isAccent,
    progress: 0,
    growing: true,
    hasSplit: false,
    sideSpawned: false,
    sideAt: rand(0.3, 0.7),
    id: Math.random().toString(36).substr(2, 9),
    neuronIdx: neuronIdx
  };
}

/* ============================================================
   GROWTH LOGIC
   ============================================================ */
function growBranches() {
  if (growthComplete) return;

  const speed = params.growthSpeed * 0.012;
  const pending = [];
  let anyGrowing = false;

  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (!b.growing) continue;
    anyGrowing = true;
    b.progress = Math.min(b.progress + speed, 1);

    if (b.progress >= 1) {
      b.growing = false;
      tips.push({ x: b.ex, y: b.ey, branchId: b.id, neuronIdx: b.neuronIdx });

      if (!b.hasSplit && b.depth < params.maxDepth && totalBranches < MAX_BRANCHES) {
        if (Math.random() < params.splitChance) {
          b.hasSplit = true;
          const baseAngle = Math.atan2(b.ey - b.oy, b.ex - b.ox);
          const spread = rand(0.3, 0.9);
          const shrink = 0.55 + rand(0, 0.2);
          const newLen = Math.max(12, b.depth < 2
            ? params.maxLength * rand(0.4, 0.75)
            : params.maxLength * shrink * (1 - b.depth / (params.maxDepth + 2)));
          pending.push(createBranch(b.ex, b.ey, baseAngle - spread, b.depth + 1, newLen, b.isAccent, b.neuronIdx));
          pending.push(createBranch(b.ex, b.ey, baseAngle + spread, b.depth + 1, newLen, b.isAccent, b.neuronIdx));
          totalBranches += 2;
        }
      }

      if (!b.sideSpawned && b.depth < params.maxDepth - 1 && totalBranches < MAX_BRANCHES) {
        if (Math.random() < 0.18) {
          b.sideSpawned = true;
          const baseAngle = Math.atan2(b.ey - b.oy, b.ex - b.ox);
          const sideDir = Math.random() < 0.5 ? 1 : -1;
          const sideAngle = baseAngle + sideDir * rand(0.7, 1.6);
          const pt = quadPt(b.ox, b.oy, b.cx, b.cy, b.ex, b.ey, b.sideAt);
          const sideLen = rand(10, params.maxLength * 0.3);
          pending.push(createBranch(pt.x, pt.y, sideAngle, b.depth + 2, sideLen, true, b.neuronIdx));
          totalBranches++;
        }
      }
    }
  }

  for (let i = 0; i < pending.length; i++) {
    branches.push(pending[i]);
  }

  if (!anyGrowing && pending.length === 0) {
    growthComplete = true;
  }
}

/* ============================================================
   SYNAPSE DETECTION
   ============================================================ */
function detectSynapses() {
  const threshold = params.synapseDist;
  const tSq = threshold * threshold;

  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      if (a.neuronIdx === b.neuronIdx) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < tSq) {
        const key = a.branchId < b.branchId ? a.branchId + '|' + b.branchId : b.branchId + '|' + a.branchId;
        let exists = false;
        for (let k = 0; k < synapses.length; k++) {
          if (synapses[k].key === key) { exists = true; break; }
        }
        if (!exists) {
          synapses.push({
            x1: a.x, y1: a.y,
            x2: b.x, y2: b.y,
            key: key,
            phase: Math.random() * Math.PI * 2,
            neuronA: a.neuronIdx,
            neuronB: b.neuronIdx
          });
        }
      }
    }
  }
}

/* ============================================================
   PULSE SPAWNING
   ============================================================ */
function spawnPulses() {
  if (synapses.length === 0) return;

  const freq = growthComplete ? params.pulseFreq * 1.5 : params.pulseFreq;
  if (Math.random() < freq * Math.min(synapses.length, 30)) {
    const s = synapses[Math.floor(Math.random() * synapses.length)];
    pulses.push({
      synapse: s,
      t: 0,
      speed: params.pulseSpeed * rand(0.7, 1.3),
      reverse: Math.random() < 0.5
    });
  }

  if (growthComplete && Math.random() < 0.004 && synapses.length > 2) {
    const startN = Math.floor(Math.random() * neurons.length);
    const connected = [];
    for (let i = 0; i < synapses.length; i++) {
      if (synapses[i].neuronA === startN || synapses[i].neuronB === startN) {
        connected.push(synapses[i]);
      }
    }
    if (connected.length > 0) {
      for (let i = 0; i < connected.length && i < 3; i++) {
        const s = connected[i];
        pulses.push({
          synapse: s,
          t: i * 0.15,
          speed: params.pulseSpeed * rand(0.8, 1.2),
          reverse: s.neuronA === startN ? false : true
        });
      }
    }
  }

  if (pulses.length > 60) {
    pulses.splice(0, pulses.length - 60);
  }
}

/* ============================================================
   PULSE UPDATE
   ============================================================ */
function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].t += pulses[i].speed;
    if (pulses[i].t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

/* ============================================================
   RENDERING
   ============================================================ */
function drawBackground() {
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);

  const glowRgb = hexToRgb('#101a3a');
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 380);
  grad.addColorStop(0, rgbaStr(glowRgb, 0.45));
  grad.addColorStop(0.6, rgbaStr(glowRgb, 0.12));
  grad.addColorStop(1, rgbaStr(glowRgb, 0));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let x = 40; x < W; x += 40) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = 40; y < H; y += 40) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();
}

function drawBranches() {
  const mainRgb = hexToRgb(params.branchColor);
  const accentRgb = hexToRgb(params.accentColor);

  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (b.progress <= 0) continue;

    const rgb = b.isAccent ? accentRgb : mainRgb;
    const alpha = Math.max(0.15, 1 - b.depth * 0.1);
    const blur = Math.max(EPS, 5 + (params.maxDepth - b.depth) * 1.8);
    const t = b.progress;
    const pMid = quadPt(b.ox, b.oy, b.cx, b.cy, b.ex, b.ey, t * 0.5);
    const pEnd = quadPt(b.ox, b.oy, b.cx, b.cy, b.ex, b.ey, t);
    const col = rgbStr(rgb);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col;
    ctx.lineWidth = b.thickness;
    ctx.lineCap = 'round';
    ctx.shadowColor = col;
    ctx.shadowBlur = blur;
    ctx.beginPath();
    ctx.moveTo(b.ox, b.oy);
    ctx.quadraticCurveTo(pMid.x, pMid.y, pEnd.x, pEnd.y);
    ctx.stroke();
    ctx.restore();
  }
}

function drawNeurons() {
  const mainRgb = hexToRgb(params.branchColor);
  const col = rgbStr(mainRgb);
  const time = frameCount * 0.025;

  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    const p = 0.6 + 0.4 * Math.sin(time + n.phase);
    const r = Math.max(EPS, n.radius * (0.9 + 0.1 * p));

    ctx.save();
    ctx.globalAlpha = 0.15 * p;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = col;
    ctx.shadowBlur = 30 * p;
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(EPS, r * 2.2), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 22 * p;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.75 * p;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(EPS, r * 0.35), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSynapses() {
  const synRgb = hexToRgb(params.synapseColor);
  const glow = Math.max(EPS, params.synapseGlow);
  const time = frameCount * 0.035;
  const col = rgbStr(synRgb);

  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const p = 0.35 + 0.65 * Math.abs(Math.sin(time + s.phase));

    ctx.save();
    ctx.globalAlpha = 0.25 * p;
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.8;
    ctx.shadowColor = col;
    ctx.shadowBlur = glow * p;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.restore();

    const mx = (s.x1 + s.x2) * 0.5;
    const my = (s.y1 + s.y2) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.5 * p;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(EPS, glow * p * 1.5);
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(EPS, 2.2 * p), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.3 * p;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(EPS, glow * 0.5);
    ctx.beginPath();
    ctx.arc(s.x1, s.y1, Math.max(EPS, 1.5 * p), 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x2, s.y2, Math.max(EPS, 1.5 * p), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPulses() {
  const pRgb = hexToRgb(params.pulseColor);
  const bright = params.pulseBright;
  const col = rgbStr(pRgb);

  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const s = p.synapse;
    const t = p.reverse ? 1 - p.t : p.t;
    const x = s.x1 + (s.x2 - s.x1) * t;
    const y = s.y1 + (s.y2 - s.y1) * t;
    const fade = Math.min(p.t * 5, 1) * Math.min((1 - p.t) * 5, 1);

    ctx.save();
    ctx.globalAlpha = bright * 0.4 * fade;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(EPS, 24 * bright);
    ctx.beginPath();
    ctx.arc(x, y, Math.max(EPS, 5 * fade), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = bright * fade;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(EPS, 14 * bright);
    ctx.beginPath();
    ctx.arc(x, y, Math.max(EPS, 3), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = bright * 0.7 * fade;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, Math.max(EPS, 1.5), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const trailT = p.reverse ? 1 - Math.max(0, p.t - 0.08) : Math.max(0, p.t - 0.08);
    const tx = s.x1 + (s.x2 - s.x1) * trailT;
    const ty = s.y1 + (s.y2 - s.y1) * trailT;
    ctx.save();
    ctx.globalAlpha = bright * 0.2 * fade;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(EPS, 10 * bright);
    ctx.beginPath();
    ctx.arc(tx, ty, Math.max(EPS, 2), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawTips() {
  const mainRgb = hexToRgb(params.branchColor);
  const col = rgbStr(mainRgb);
  const time = frameCount * 0.05;

  for (let i = 0; i < tips.length; i++) {
    const tip = tips[i];
    const flicker = 0.3 + 0.15 * Math.sin(time + i * 1.7);
    ctx.save();
    ctx.globalAlpha = flicker;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, Math.max(EPS, 1.5), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBloom() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.03;
  ctx.filter = 'blur(12px)';
  ctx.drawImage(canvas, 0, 0);
  ctx.filter = 'none';
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(CX, CY, W * 0.28, CX, CY, W * 0.71);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);
  if (paused) return;

  frameCount++;

  growBranches();

  if (frameCount % 8 === 0) {
    detectSynapses();
  }

  spawnPulses();
  updatePulses();

  drawBackground();
  drawBranches();
  drawTips();
  drawSynapses();
  drawPulses();
  drawNeurons();
  drawBloom();
  drawScanlines();
  drawVignette();
}

initNetwork();
animate();

</script>
</body>
</html>
