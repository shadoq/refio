<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #score-board {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #00ff88;
        }

        canvas {
            border: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            display: block;
            margin: 0 auto;
        }

        .menu, .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 2rem;
            border-radius: 10px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            display: none;
        }

        .menu.active, .game-over.active {
            display: block;
        }

        .menu h2, .game-over h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #00ff88;
        }

        .menu p, .game-over p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .menu button, .game-over button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .menu button:hover, .game-over button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        .mode-select {
            margin: 1rem 0;
        }

        .mode-select label {
            display: block;
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }

        .mode-select select {
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #00ff88;
            padding: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .instructions {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888;
        }

        .instructions kbd {
            background: #333;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SNAKE</h1>
        <div id="score-board">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="startMenu" class="menu active">
            <h2>Snake Game</h2>
            <p>Select Game Mode:</p>
            <div class="mode-select">
                <label for="gameMode">Mode:</label>
                <select id="gameMode">
                    <option value="human-human">Human vs Human</option>
                    <option value="cpu-human">CPU vs Human</option>
                    <option value="cpu-cpu">CPU vs CPU</option>
                </select>
            </div>
            <button id="startBtn">Start Game</button>
            <p class="instructions">
                <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrow Keys</kbd> to move
            </p>
        </div>

        <div id="gameOverScreen" class="game-over">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 30;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const startMenu = document.getElementById('startMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameModeSelect = document.getElementById('gameMode');

        let gameLoop;
        let score = 0;
        let gameMode = 'human-human';
        let isGameOver = false;

        // Human player 1
        let human1 = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 }
        };

        // Human player 2
        let human2 = {
            body: [],
            direction: { x: -1, y: 0 },
            nextDirection: { x: -1, y: 0 }
        };

        // CPU snake
        let cpuSnake = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 }
        };

        let food = { x: 15, y: 15 };

        function initSnake(body, direction) {
            const startX = Math.floor(Math.random() * (GRID_SIZE - 4)) + 2;
            const startY = Math.floor(Math.random() * (GRID_SIZE - 4)) + 2;
            const body = [];
            for (let i = 0; i < 5; i++) {
                body.push({ x: startX - i, y: startY });
            }
            return { body, direction, nextDirection: { ...direction } };
        }

        function initGame() {
            human1 = initSnake({ x: 2, y: 2 }, { x: 1, y: 0 });
            human2 = initSnake({ x: GRID_SIZE - 3, y: GRID_SIZE - 3 }, { x: -1, y: 0 });
            cpuSnake = initSnake({ x: GRID_SIZE - 3, y: 2 }, { x: 1, y: 0 });
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = true;
                // Check all snakes
                for (const snake of [human1, human2, cpuSnake]) {
                    for (const segment of snake.body) {
                        if (segment.x === food.x && segment.y === food.y) {
                            valid = false;
                            break;
                        }
                    }
                }
            }
        }

        function getSnakeBodies() {
            const bodies = [];
            for (const snake of [human1, human2, cpuSnake]) {
                for (const segment of snake.body) {
                    bodies.push(segment);
                }
            }
            return bodies;
        }

        function updateHuman(snake) {
            snake.direction = { ...snake.nextDirection };
            const head = { x: snake.body[0].x + snake.direction.x, y: snake.body[0].y + snake.direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return false;
            }

            // Check self collision
            for (const segment of snake.body) {
                if (segment.x === head.x && segment.y === head.y) {
                    return false;
                }
            }

            // Check other snakes collision
            const allBodies = getSnakeBodies();
            for (const other of allBodies) {
                if (other.x === head.x && other.y === head.y) {
                    return false;
                }
            }

            snake.body.unshift(head);
            return true;
        }

        function updateCpu(snake) {
            snake.direction = { ...snake.nextDirection };
            const head = { x: snake.body[0].x + snake.direction.x, y: snake.body[0].y + snake.direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return false;
            }

            // Check self collision
            for (const segment of snake.body) {
                if (segment.x === head.x && segment.y === head.y) {
                    return false;
                }
            }

            // Check other snakes collision
            const allBodies = getSnakeBodies();
            for (const other of allBodies) {
                if (other.x === head.x && other.y === head.y) {
                    return false;
                }
            }

            snake.body.unshift(head);
            return true;
        }

        function cpuFindFood(snake) {
            const head = snake.body[0];
            const dx = food.x - head.x;
            const dy = food.y - head.y;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) return { x: 1, y: 0 };
                else return { x: -1, y: 0 };
            } else {
                if (dy > 0) return { x: 0, y: 1 };
                else return { x: 0, y: -1 };
            }
        }

        function updateCpuAI(snake) {
            const targetDir = cpuFindFood(snake);
            const currentDir = snake.direction;

            // Avoid reversing
            if (targetDir.x === -currentDir.x && targetDir.y === -currentDir.y) {
                return;
            }

            snake.nextDirection = { ...targetDir };
        }

        function update() {
            if (isGameOver) return;

            const human1Alive = updateHuman(human1);
            const human2Alive = updateHuman(human2);
            const cpuAlive = updateCpu(cpuSnake);

            // Check food collision
            const allBodies = getSnakeBodies();
            for (const snake of [human1, human2, cpuSnake]) {
                if (snake.body[0].x === food.x && snake.body[0].y === food.y) {
                    score++;
                    scoreEl.textContent = score;
                    spawnFood();
                }
            }

            // Remove tail if not eating
            if (human1Alive) {
                if (human1.body[0].x === food.x && human1.body[0].y === food.y) {
                    // Don't remove tail
                } else {
                    human1.body.pop();
                }
            }
            if (human2Alive) {
                if (human2.body[0].x === food.x && human2.body[0].y === food.y) {
                    // Don't remove tail
                } else {
                    human2.body.pop();
                }
            }
            if (cpuAlive) {
                if (cpuSnake.body[0].x === food.x && cpuSnake.body[0].y === food.y) {
                    // Don't remove tail
                } else {
                    cpuSnake.body.pop();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x * CELL_SIZE + 1, food.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            ctx.shadowBlur = 0;

            // Draw human1
            ctx.fillStyle = '#00ff88';
            for (let i = 0; i < human1.body.length; i++) {
                const segment = human1.body[i];
                if (i === 0) {
                    ctx.fillStyle = '#00ff88';
                } else {
                    ctx.fillStyle = '#00cc6a';
                }
                ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            }

            // Draw human2
            ctx.fillStyle = '#ff0066';
            for (let i = 0; i < human2.body.length; i++) {
                const segment = human2.body[i];
                if (i === 0) {
                    ctx.fillStyle = '#ff0066';
                } else {
                    ctx.fillStyle = '#cc0055';
                }
                ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            }

            // Draw cpu
            ctx.fillStyle = '#ffaa00';
            for (let i = 0; i < cpuSnake.body.length; i++) {
                const segment = cpuSnake.body[i];
                if (i === 0) {
                    ctx.fillStyle = '#ffaa00';
                } else {
                    ctx.fillStyle = '#cc8800';
                }
                ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            }
        }

        function gameLoopCallback() {
            update();
            draw();
        }

        function startGame() {
            gameMode = gameModeSelect.value;
            isGameOver = false;
            initGame();
            startMenu.classList.remove('active');
            gameOverScreen.classList.remove('active');
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameLoop = setInterval(gameLoopCallback, 100);
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('active');
        }

        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            if (gameMode === 'human-human') {
                // Human 1
                if ((e.key === 'ArrowUp' || e.key === 'w') && human1.direction.y !== 1) {
                    human1.nextDirection = { x: 0, y: -1 };
                } else if ((e.key === 'ArrowDown' || e.key === 's') && human1.direction.y !== -1) {
                    human1.nextDirection = { x: 0, y: 1 };
                } else if ((e.key === 'ArrowLeft' || e.key === 'a') && human1.direction.x !== 1) {
                    human1.nextDirection = { x: -1, y: 0 };
                } else if ((e.key === 'ArrowRight' || e.key === 'd') && human1.direction.x !== -1) {
                    human1.nextDirection = { x: 1, y: 0 };
                }

                // Human 2
                if ((e.key === 'ArrowUp' || e.key === 'W') && human2.direction.y !== 1) {
                    human2.nextDirection = { x: 0, y: -1 };
                } else if ((e.key === 'ArrowDown' || e.key === 'S') && human2.direction.y !== -1) {
                    human2.nextDirection = { x: 0, y: 1 };
                } else if ((e.key === 'ArrowLeft' || e.key === 'A') && human2.direction.x !== 1) {
                    human2.nextDirection = { x: -1, y: 0 };
                } else if ((e.key === 'ArrowRight' || e.key === 'D') && human2.direction.x !== -1) {
                    human2.nextDirection = { x: 1, y: 0 };
                }
            } else if (gameMode === 'cpu-human') {
                // Human
                if ((e.key === 'ArrowUp' || e.key === 'w') && human1.direction.y !== 1) {
                    human1.nextDirection = { x: 0, y: -1 };
                } else if ((e.key === 'ArrowDown' || e.key === 's') && human1.direction.y !== -1) {
                    human1.nextDirection = { x: 0, y: 1 };
                } else if ((e.key === 'ArrowLeft' || e.key === 'a') && human1.direction.x !== 1) {
                    human1.nextDirection = { x: -1, y: 0 };
                } else if ((e.key === 'ArrowRight' || e.key === 'd') && human1.direction.x !== -1) {
                    human1.nextDirection = { x: 1, y: 0 };
                }

                // CPU
                updateCpuAI(cpuSnake);
            } else if (gameMode === 'cpu-cpu') {
                updateCpuAI(human1);
                updateCpuAI(human2);
                updateCpuAI(cpuSnake);
            }
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial draw
        initGame();
        draw();
    </script>
</body>
</html>
