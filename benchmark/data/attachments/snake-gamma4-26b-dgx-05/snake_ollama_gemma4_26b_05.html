<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Pro - Multi-Mode</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #ffffff;
            --p1-color: #4caf50;
            --p2-color: #f44336;
            --accent-color: #ffeb3b;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 5px solid #444;
            border-radius: 8px;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }

        .menu-content {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #555;
        }

        h1 {
            margin-top: 0;
            font-size: 3rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 15px 30px;
            margin: 10px 0;
            font-size: 1.2rem;
            cursor: pointer;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            background: #666;
            transform: scale(1.05);
        }

        .mode-btn.p1-theme { border-left: 8px solid var(--p1-color); }
        .mode-btn.p2-theme { border-left: 8px solid var(--p2-color); }

        #score-board {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        .hidden { display: none !important; }

        .game-over-text {
            font-size: 2.5rem;
            color: var(--p2-color);
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">
        <span class="p1-score" id="p1-display">P1: 0</span>
        <span class="p2-score" id="p2-display">P2: 0</span>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <!-- Start Menu -->
    <div id="start-menu" class="overlay">
        <div class="menu-content">
            <h1>SNAKE PRO</h1>
            <button class="mode-btn p1-theme" onclick="startGame('H_VS_H')">Human vs Human</button>
            <button class="mode-btn p1-theme" onclick="startGame('CPU_VS_H')">CPU vs Human</button>
            <button class="mode-btn p2-theme" onclick="startGame('CPU_VS_CPU')">CPU vs CPU</button>
            <div class="instructions">
                P1: WASD | P2: Arrow Keys<br>
                Press any key to restart during Game Over
            </div>
        </div>
            </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay hidden">
        <div class="menu-content">
            <div class="game-over-text">GAME OVER</div>
            <div id="winner-display" style="font-size: 1.5rem; margin-bottom: 20px;"></div>
            <button class="mode-btn" onclick="resetToMenu()">Main Menu</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 30;
    const tileSize = canvas.width / gridSize;

    // Game State
    let gameLoop;
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let mode = 'H_VS_H';
    let food = { x: 15, y: 15 };
    let players = [];
    let lastTick = 0;
    const tickRate = 120; // ms per move

    class Snake {
        constructor(id, color, type, controls) {
            this.id = id;
            this.color = color;
            this.type = type; // 'HUMAN' or 'CPU'
            this.controls = controls; // {up, down, left, right}
            this.reset();
        }

        reset() {
            this.body = [];
            this.direction = { x: 0, y: 0 };
            this.nextDirection = { x: 0, y: 0 };
            this.score = 0;
            
            // Initial position based on player ID
            if (this.id === 1) {
                this.body = [{ x: 5, y: 15 }, { x: 4, y: 15 }, { x: 3, y: 15 }];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
            } else {
                this.body = [{ x: 25, y: 15 }, { x: 26, y: 15 }, { x: 27, y: 15 }];
                this.direction = { x: -1, y: 0 };
                this.nextDirection = { x: -1, y: 0 };
            }
        }

        update() {
            this.direction = this.nextDirection;
            
            if (this.type === 'CPU') {
                this.runAI();
            }

            const head = { 
                x: this.body[0].x + this.direction.x, 
                y: this.body[0].y + this.direction.y 
            };

            this.body.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                this.score++;
                spawnFood();
                updateScoreboard();
            } else {
                this.body.pop();
            }
        }

        runAI() {
            // Simple Greedy AI: Move towards food
            const head = this.body[0];
            let dx = food.x - head.x;
            let dy = food.y - head.y;

            let newDir = { x: 0, y: 0 };

            // Prioritize horizontal then vertical movement
            if (dx !== 0) {
                newDir.x = dx > 0 ? 1 : -1;
            } else if (dy !== 0) {
                newDir.y = dy > 0 ? 1 : -1;
            }

            // Prevent 180 degree turns
            if (newDir.x !== 0 && this.direction.x === -newDir.x) {
                newDir.x = 0;
                newDir.y = dy > 0 ? 1 : -1;
            } else if (newDir.y !== 0 && this.direction.y === -newDir.y) {
                newDir.y = 0;
                newDir.x = dx > 0 ? 1 : -1;
            }

            if (newDir.x !== 0 || newDir.y !== 0) {
                this.nextDirection = newDir;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            this.body.forEach((part, index) => {
                // Make head slightly different
                if (index === 0) ctx.globalAlpha = 1.0;
                else ctx.globalAlpha = 0.7;
                
                ctx.fillRect(part.x * tileSize, part.y * tileSize, tileSize - 1, tileSize - 1);
            });
            ctx.globalAlpha = 1.0;
        }
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
        };
        // Don't spawn food on snake bodies
        players.forEach(p => {
            p.body.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        });
    }

    function startGame(selectedMode) {
        mode = selectedMode;
        gameState = 'PLAYING';
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        
        players = [];
        
        // Player 1 setup
        players.push(new Snake(1, '#4caf50', 'HUMAN', {
            up: 'w', down: 's', left: 'a', right: 'd'
        }));

        // Player 2 setup
        let p2Type = (mode === 'H_VS_H') ? 'HUMAN' : 'CPU';
        players.push(new Snake(2, '#f44336', p2Type, {
            up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight'
        }));

        spawnFood();
        updateScoreboard();
        
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(gameTick, tickRate);
    }

    function gameTick() {
        if (gameState !== 'PLAYING') return;

        players.forEach(p => p.update());

        checkCollisions();
        draw();
    }

    function checkCollisions() {
        const p1 = players[0];
        const p2 = players[1];

        players.forEach(p => {
            const head = p.body[0];
            
            // Wall collision
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                endGame();
            }

            // Self collision
            for (let i = 1; i < p.body.length; i++) {
                if (head.x === p.body[i].x && head.y === p.body[i].y) {
                    endGame();
                }
            }
        });

        // Player vs Player collision
        for (let i = 0; i < p1.body.length; i++) {
            for (let j = 0; j < p2.body.length; j++) {
                if (p1.body[i].x === p2.body[0].x && p1.body[i].y === p2.body[0].y) {
                    endGame();
                }
                if (p2.body[j].x === p1.body[0].x && p2.body[j].y === p1.body[0].y) {
                    endGame();
                }
            }
        }
    }

    function endGame() {
        gameState = 'GAMEOVER';
        clearInterval(gameLoop);
        
        const winnerDisplay = document.getElementById('winner-display');
        if (players[0].score > players[1].score) {
            winnerDisplay.innerText = "Player 1 Wins!";
            winnerDisplay.style.color = "var(--p1-color)";
        } else if (players[1].score > players[0].score) {
            winnerDisplay.innerText = "Player 2 Wins!";
            winnerDisplay.style.color = "var(--p2-color)";
        } else {
            winnerDisplay.innerText = "It's a Tie!";
            winnerDisplay.style.color = "white";
        }

        document.getElementById('game-over').classList.remove('hidden');
    }

    function resetToMenu() {
        gameState = 'MENU';
        document.getElementById('game-over').classList.add('hidden');
        document.getElementById('start-menu').classList.remove('hidden');
        updateScoreboard();
    }

    function updateScoreboard() {
        document.getElementById('p1-display').innerText = `P1: ${players[0]?.score || 0}`;
        document.getElementById('p2-display').innerText = `P2: ${players[1]?.score || 0}`;
    }

    function draw() {
        // Clear canvas
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (subtle)
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1;
        for(let i=0; i<=gridSize; i++) {
            ctx.beginPath();
            ctx.moveTo(i * tileSize, 0);
            ctx.lineTo(i * tileSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * tileSize);
            ctx.lineTo(canvas.width, i * tileSize);
            ctx.stroke();
        }

        // Draw Food
        ctx.fillStyle = '#ffeb3b';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(food.x * tileSize + tileSize/2, food.y * tileSize + tileSize/2, tileSize/3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Players
        players.forEach(p => p.draw());
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (gameState === 'GAMEOVER') {
            // Restart with any key
            startGame(mode);
            return;
        }

        const key = e.key.toLowerCase();
        
        players.forEach(p => {
            if (p.type === 'HUMAN') {
                if (p.controls.up === key && p.direction.y !== 1) p.nextDirection = { x: 0, y: -1 };
                if (p.controls.down === key && p.direction.y !== -1) p.nextDirection = { x: 0, y: 1 };
                if (p.controls.left === key && p.direction.x !== 1) p.nextDirection = { x: -1, y: 0 };
                if (p.controls.right === key && p.direction.x !== -1) p.nextDirection = { x: 1, y: 0 };
            }
        });

        // Arrow keys for P2 (if human)
        if (players[1] && players[1].type === 'HUMAN') {
            if (e.key === 'ArrowUp' && players[1].direction.y !== 1) players[1].nextDirection = { x: 0, y: -1 };
            if (e.key === 'ArrowDown' && players[1].direction.y !== -1) players[1].nextDirection = { x: 0, y: 1 };
            if (e.key === 'ArrowLeft' && players[1].direction.x !== 1) players[1].nextDirection = { x: -1, y: 0 };
            if (e.key === 'ArrowRight' && players[1].direction.x !== -1) players[1].nextDirection = { x: 1, y: 0 };
        }
    });

    // Initial Draw
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

</script>
</body>
</html>
