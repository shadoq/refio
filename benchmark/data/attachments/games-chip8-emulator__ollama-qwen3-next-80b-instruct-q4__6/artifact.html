<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        
        #display-container {
            margin: 20px auto;
            position: relative;
        }
        
        #display {
            border: 2px solid #444;
            background-color: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 512px;
            height: 256px;
            transform: scale(4);
            transform-origin: top left;
        }
        
        #keypad {
            display: grid;
            grid-template-columns: repeat(4, 64px);
            grid-template-rows: repeat(4, 64px);
            gap: 4px;
            margin: 20px;
        }
        
        .key {
            width: 64px;
            height: 64px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            user-select: none;
        }
        
        .key:active {
            background-color: #555;
        }
        
        #controls {
            display: flex;
            gap: 10px;
            margin: 10px;
        }
        
        button {
            padding: 8px 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #555;
        }
        
        #speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px;
        }
        
        #file-input-container {
            margin: 20px;
        }
        
        #file-input {
            display: none;
        }
        
        #file-label {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #file-label:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>CHIP-8 Emulator</h1>
    
    <div id="container">
        <div id="display-container">
            <canvas id="display" width="64" height="32"></canvas>
        </div>
        
        <div id="keypad">
            <div class="key" data-key="0">1</div>
            <div class="key" data-key="1">2</div>
            <div class="key" data-key="2">3</div>
            <div class="key" data-key="3">C</div>
            <div class="key" data-key="4">4</div>
            <div class="key" data-key="5">5</div>
            <div class="key" data-key="6">6</div>
            <div class="key" data-key="7">D</div>
            <div class="key" data-key="8">7</div>
            <div class="key" data-key="9">8</div>
            <div class="key" data-key="10">9</div>
            <div class="key" data-key="11">E</div>
            <div class="key" data-key="12">A</div>
            <div class="key" data-key="13">0</div>
            <div class="key" data-key="14">B</div>
            <div class="key" data-key="15">F</div>
        </div>
        
        <div id="controls">
            <button id="run">Run</button>
            <button id="pause">Pause</button>
            <button id="step">Step</button>
            <button id="reset">Reset</button>
        </div>
        
        <div id="speed-control">
            <label for="speed">Instructions per frame: </label>
            <input type="range" id="speed" min="1" max="500" value="100">
            <span id="speed-value">100</span>
        </div>
        
        <div id="file-input-container">
            <input type="file" id="file-input" accept=".ch8,.rom">
            <label for="file-input" id="file-label">Load ROM File</label>
        </div>
    </div>
    
    <div id="debug-panel">
        <div class="debug-section">
            <div class="debug-label">Registers (V0-VF):</div>
            <div class="debug-value" id="registers">00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Index Register (I):</div>
            <div class="debug-value" id="index">0000</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Program Counter (PC):</div>
            <div class="debug-value" id="pc">0200</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Stack:</div>
            <div class="debug-value" id="stack">[empty]</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Current Instruction:</div>
            <div class="debug-value" id="instruction">0000</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Delay Timer:</div>
            <div class="debug-value" id="delay-timer">00</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-label">Sound Timer:</div>
            <div class="debug-value" id="sound-timer">00</div>
        </div>
    </div>

        const INSTRUCTIONS_PER_FRAME = 100; // Default value
        
        // Memory array (4KB)
        const memory = new Uint8Array(MEMORY_SIZE);
        
        // Registers: V0-VF (16 registers, VF is used for carry flag)
        const V = new Uint8Array(16);
        
        // Index register (16-bit)
        let I = 0;
        
        // Program counter
        let PC = PROGRAM_START;
        
        // Stack for subroutine calls
        const stack = [];
        let SP = 0; // Stack pointer
        
        // Timers
        let delayTimer = 0;
        let soundTimer = 0;
        
        // Display (64x32 pixels)
        const canvas = document.getElementById('display');

        const keys = new Array(16).fill(false);

        // Load font set into memory
        for (let i = 0; i < fontSet.length; i++) {
            memory[FONT_SET_START + i] = fontSet[i];
