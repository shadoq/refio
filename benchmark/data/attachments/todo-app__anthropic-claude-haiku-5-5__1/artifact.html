<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    padding: 24px;
  }
  h1 {
    margin: 0 0 20px;
    text-align: center;
    color: #333;
    font-size: 28px;
  }
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .add-form input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
  }
  .add-form input[type="text"]:focus { border-color: #764ba2; }
  .add-form button {
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #764ba2;
    color: #fff;
    cursor: pointer;
  }
  .add-form button:hover { background: #667eea; }
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  .todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .todo-text {
    flex: 1;
    font-size: 16px;
    color: #333;
    word-break: break-word;
  }
  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #999;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 20px;
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
  }
  .delete-btn:hover { color: #c0392b; }
  .empty {
    text-align: center;
    color: #aaa;
    padding: 20px 0;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 14px;
    color: #666;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filters { display: flex; gap: 6px; }
  .filters button {
    padding: 5px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    color: #555;
  }
  .filters button.active {
    background: #764ba2;
    border-color: #764ba2;
    color: #fff;
  }
  .clear-btn {
    background: none;
    border: none;
    color: #764ba2;
    cursor: pointer;
    font-size: 14px;
    padding: 0;
  }
  .clear-btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>Todo List</h1>

  <form class="add-form" id="addForm">
    <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>

  <ul class="todo-list" id="todoList"></ul>
  <div class="empty" id="emptyMsg" hidden>No todos here.</div>

  <div class="footer">
    <span id="counter">0 items left</span>
    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <button type="button" class="clear-btn" id="clearCompleted">Clear completed</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "todos";
  let todos = loadTodos();
  let currentFilter = "all";

  const addForm = document.getElementById("addForm");
  const todoInput = document.getElementById("todoInput");
  const todoList = document.getElementById("todoList");
  const emptyMsg = document.getElementById("emptyMsg");
  const counter = document.getElementById("counter");
  const filterButtons = document.querySelectorAll(".filters button");
  const clearCompletedBtn = document.getElementById("clearCompleted");

  function loadTodos() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addTodo(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    todos.push({ id: generateId(), text: trimmed, completed: false });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;
    todo.completed = !todo.completed;
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.completed);
    saveTodos();
    render();
  }

  function getVisibleTodos() {
    if (currentFilter === "active") return todos.filter(t => !t.completed);
    if (currentFilter === "completed") return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    todoList.innerHTML = "";
    const visible = getVisibleTodos();

    visible.forEach(todo => {
      const li = document.createElement("li");
      li.className = "todo-item" + (todo.completed ? " completed" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.completed;
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      const span = document.createElement("span");
      span.className = "todo-text";
      span.textContent = todo.text;
      span.addEventListener("dblclick", () => toggleTodo(todo.id));

      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.type = "button";
      delBtn.title = "Delete";
      delBtn.setAttribute("aria-label", "Delete todo");
      delBtn.textContent = "×";
      delBtn.addEventListener("click", () => deleteTodo(todo.id));

      li.append(checkbox, span, delBtn);
      todoList.appendChild(li);
    });

    emptyMsg.hidden = visible.length !== 0;
    emptyMsg.textContent = todos.length === 0 ? "Nothing to do. Add a todo above!" : "No todos here.";

    const left = todos.filter(t => !t.completed).length;
    counter.textContent = left + (left === 1 ? " item left" : " items left");

    filterButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === currentFilter);
    });
  }

  addForm.addEventListener("submit", e => {
    e.preventDefault();
    addTodo(todoInput.value);
    todoInput.value = "";
    todoInput.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearCompletedBtn.addEventListener("click", clearCompleted);

  render();
</script>
</body>
</html>
