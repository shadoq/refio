<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        #score {
            position: absolute;
            top: 10px;
            color: white;
            font-size: 20px;
        }
        #startMenu, #gameOver {
            position: absolute;
            text-align: center;
            color: white;
            font-size: 24px;
            display: none;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="startMenu">
        <h1>Snake Game</h1>
        <button onclick="startGame('human_vs_human')">Human vs Human</button>
        <button onclick="startGame('cpu_vs_human')">CPU vs Human</button>
        <button onclick="startGame('cpu_vs_cpu')">CPU vs CPU</button>
    </div>
    <div id="gameOver">
        <h1>Game Over</h1>
        <p id="finalScore">Score: 0</p>
        <p>Press any key to restart</p>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const cellSize = 20;
        const canvasWidth = gridSize * cellSize;
        const canvasHeight = gridSize * cellSize;
        
        let gameMode = null;
        let snakes = [];
        let food = { x: 0, y: 0 };
        let score = 0;
        let gameRunning = false;
        let gameOver = false;
        
        function generateFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
                valid = true;
                for (const snake of snakes) {
                    for (const part of snake.body) {
                        if (part.x === food.x && part.y === food.y) {
                            valid = false;
                            break;
                        }
                    }
                    if (!valid) break;
                }
            }
        }
        
        function aiMove(snake) {
            const queue = [];
            const visited = new Set();
            const parent = new Map();
            
            const start = { x: snake.body[0].x, y: snake.body[0].y };
            queue.push(start);
            visited.add(`${start.x},${start.y}`);
            parent.set(`${start.x},${start.y}`, null);
            
            while (queue.length > 0) {
                const current = queue.shift();
                if (current.x === food.x && current.y === food.y) {
                    let path = [];
                    let node = current;
                    while (node !== start) {
                        path.push(node);
                        node = parent.get(`${node.x},${node.y}`);
                    }
                    if (path.length > 0) {
                        const nextStep = path[path.length - 1];
                        if (nextStep.x > start.x) snake.direction = 'right';
                        else if (nextStep.x < start.x) snake.direction = 'left';
                        else if (nextStep.y > start.y) snake.direction = 'down';
                        else if (nextStep.y < start.y) snake.direction = 'up';
                    }
                    return;
                }
                
                const directions = [
                    { dx: 0, dy: -1, dir: 'up' },
                    { dx: 0, dy: 1, dir: 'down' },
                    { dx: -1, dy: 0, dir: 'left' },
                    { dx: 1, dy: 0, dir: 'right' }
                ];
                
                for (const dir of directions) {
                    const nx = current.x + dir.dx;
                    const ny = current.y + dir.dy;
                    if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
                    
                    let obstacle = false;
                    for (const s of snakes) {
                        for (const part of s.body) {
                            if (nx === part.x && ny === part.y) {
                                obstacle = true;
                                break;
                            }
                        }
                        if (obstacle) break;
                    }
                    if (obstacle) continue;
                    
                    const key = `${nx},${ny}`;
                    if (visited.has(key)) continue;
                    
                    visited.add(key);
                    parent.set(key, current);
                    queue.push({ x: nx, y: ny });
                }
            }
            
            const directions = [
                { dx: 0, dy: -1, dir: 'up' },
                { dx: 0, dy: 1, dir: 'down' },
                { dx: -1, dy: 0, dir: 'left' },
                { dx: 1, dy: 0, dir: 'right' }
            ];
            for (const dir of directions) {
                const nx = snake.body[0].x + dir.dx;
                const ny = snake.body[0].y + dir.dy;
                if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
                
                let obstacle = false;
                for (const s of snakes) {
                    for (const part of s.body) {
                        if (nx === part.x && ny === part.y) {
                            obstacle = true;
                            break;
                        }
                    }
                    if (obstacle) break;
                }
                if (!obstacle) {
                    snake.direction = dir.dir;
                    return;
                }
            }
        }
        
        function update() {
            for (const snake of snakes) {
                if (snake.controlType === 'cpu') {
                    aiMove(snake);
                }
                
                const head = { ...snake.body[0] };
                switch (snake.direction) {
                    case 'up': head.y--; break;
                    case 'down': head.y++; break;
                    case 'left': head.x--; break;
                    case 'right': head.x++; break;
                }
                
                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    gameOver = true;
                    gameRunning = false;
                    return;
                }
                
                for (let i = 1; i < snake.body.length; i++) {
                    if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                        gameOver = true;
                        gameRunning = false;
                        return;
                    }
                }
                
                for (const otherSnake of snakes) {
                    if (otherSnake === snake) continue;
                    for (const part of otherSnake.body) {
                        if (head.x === part.x && head.y === part.y) {
                            gameOver = true;
                            gameRunning = false;
                            return;
                        }
                    }
                }
                
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    document.getElementById('score').textContent = `Score: ${score}`;
                    generateFood();
                } else {
                    snake.body.pop();
                }
                snake.body.unshift(head);
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            ctx.strokeStyle = '#333';
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvasHeight);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvasWidth, i * cellSize);
                ctx.stroke();
            }
            
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);
            
            for (const snake of snakes) {
                ctx.fillStyle = snake.controlType === 'player' ? 'green' : 'blue';
                for (let i = 0; i < snake.body.length; i++) {
                    const part = snake.body[i];
                    if (i === 0) {
                        ctx.fillStyle = 'yellow';
                    }
                    ctx.fillRect(part.x * cellSize, part.y * cellSize, cellSize, cellSize);
                }
            }
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            setTimeout(gameLoop, 100);
        }
        
        function startGame(mode) {
            gameMode = mode;
            snakes = [];
            if (mode === 'human_vs_human') {
                snakes.push({
                    body: [{x: 5, y: 15}],
                    direction: 'right',
                    controlType: 'player',
                    playerIndex: 0
                });
                snakes.push({
                    body: [{x: 25, y: 15}],
                    direction: 'left',
                    controlType: 'player',
                    playerIndex: 1
                });
            } else if (mode === 'cpu_vs_human') {
                snakes.push({
                    body: [{x: 5, y: 15}],
                    direction: 'right',
                    controlType: 'player',
                    playerIndex: 0
                });
                snakes.push({
                    body: [{x: 25, y: 15}],
                    direction: 'left',
                    controlType: 'cpu'
                });
            } else if (mode === 'cpu_vs_cpu') {
                snakes.push({
                    body: [{x: 5, y: 15}],
                    direction: 'right',
                    controlType: 'cpu'
                });
                snakes.push({
                    body: [{x: 25, y: 15}],
                    direction: 'left',
                    controlType: 'cpu'
                });
            }
            
            generateFood();
            score = 0;
            document.getElementById('score').textContent = `Score: ${score}`;
            document.getElementById('startMenu').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            gameOver = false;
            gameLoop();
        }
        
        function restart() {
            gameRunning = false;
            gameOver = false;
            document.getElementById('startMenu').style.display = 'block';
            document.getElementById('gameOver').style.display = 'none';
        }
        
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                restart();
                return;
            }
            if (!gameRunning) return;
            
            for (const snake of snakes) {
                if (snake.controlType !== 'player') continue;
                
                switch (e.key) {
                    case 'ArrowUp':
                        if (snake.playerIndex === 0 && snake.direction !== 'down') snake.direction = 'up';
                        break;
                    case 'ArrowDown':
                        if (snake.playerIndex === 0 && snake.direction !== 'up') snake.direction = 'down';
                        break;
                    case 'ArrowLeft':
                        if (snake.playerIndex === 0 && snake.direction !== 'right') snake.direction = 'left';
                        break;
                    case 'ArrowRight':
                        if (snake.playerIndex === 0 && snake.direction !== 'left') snake.direction = 'right';
                        break;
                    case 'w':
                        if (snake.playerIndex === 1 && snake.direction !== 'down') snake.direction = 'up';
                        break;
                    case 's':
                        if (snake.playerIndex === 1 && snake.direction !== 'up') snake.direction = 'down';
                        break;
                    case 'a':
                        if (snake.playerIndex === 1 && snake.direction !== 'right') snake.direction = 'left';
                        break;
                    case 'd':
                        if (snake.playerIndex === 1 && snake.direction !== 'left') snake.direction = 'right';
                        break;
                }
            }
        });
        
        document.getElementById('startMenu').style.display = 'block';
    </script>
</body>
</html>
