<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo App</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
  }
  #app {
    background: white;
    padding: 1rem 1.5rem 2rem;
    margin-top: 2rem;
    width: 320px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
  }
  h1 {
    margin: 0 0 1rem 0;
    font-weight: 700;
    font-size: 1.5rem;
    text-align: center;
  }
  #new-todo {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
  }
  ul#todo-list {
    list-style: none;
    padding: 0;
    margin: 1rem 0 0 0;
    max-height: 320px;
    overflow-y: auto;
  }
  ul#todo-list li {
    display: flex;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
  }
  ul#todo-list li.completed label {
    text-decoration: line-through;
    color: #999;
  }
  ul#todo-list li label {
    flex-grow: 1;
    cursor: pointer;
    user-select: none;
  }
  ul#todo-list li button.delete-btn {
    background: transparent;
    border: none;
    color: #cc3333;
    font-weight: bold;
    cursor: pointer;
    padding: 0 0.5rem;
    font-size: 1.2rem;
    line-height: 1;
  }
  #filters {
    display: flex;
    justify-content: center;
    margin-top: 1rem;
  }
  #filters button {
    border: none;
    background: #eee;
    margin: 0 0.25rem;
    padding: 0.3rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #filters button.active {
    background: #2196f3;
    color: white;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Todo App</h1>
  <input id="new-todo" type="text" placeholder="What needs to be done?" autocomplete="off" />
  <ul id="todo-list"></ul>
  <div id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
</div>

<script>
  (() => {
    const STORAGE_KEY = 'todo_openai_gpt_4_1_mini_04';
    let todos = [];
    let filter = 'all';

    const newTodoInput = document.getElementById('new-todo');
    const todoList = document.getElementById('todo-list');
    const filterButtons = document.querySelectorAll('#filters button');

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function loadTodos() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        todos = JSON.parse(data);
      } else {
        todos = [];
      }
    }

    function render() {
      todoList.innerHTML = '';
      let filteredTodos = todos;
      if (filter === 'active') {
        filteredTodos = todos.filter(todo => !todo.completed);
      } else if (filter === 'completed') {
        filteredTodos = todos.filter(todo => todo.completed);
      }

      filteredTodos.forEach(todo => {
        const li = document.createElement('li');
        li.className = todo.completed ? 'completed' : '';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', () => {
          todo.completed = checkbox.checked;
          saveTodos();
          render();
        });

        const label = document.createElement('label');
        label.textContent = todo.text;
        label.addEventListener('dblclick', () => {
          startEditing(todo, label);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '×';
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = 'Delete todo';
        deleteBtn.addEventListener('click', () => {
          todos = todos.filter(t => t !== todo);
          saveTodos();
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(label);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });

      filterButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
    }

    function addTodo(text) {
      if (text.trim() === '') return;
      todos.push({ text: text.trim(), completed: false });
      saveTodos();
      render();
    }

    function startEditing(todo, label) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = todo.text;
      input.className = 'edit-input';
      label.replaceWith(input);
      input.focus();

      function finish() {
        if (input.value.trim() === '') {
          todos = todos.filter(t => t !== todo);
        } else {
          todo.text = input.value.trim();
        }
        saveTodos();
        render();
      }

      input.addEventListener('blur', finish);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          input.blur();
        } else if (e.key === 'Escape') {
          render();
        }
      });
    }

    newTodoInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addTodo(newTodoInput.value);
        newTodoInput.value = '';
      }
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        render();
      });
    });

    loadTodos();
    render();
  })();
</script>
</body>
</html>
