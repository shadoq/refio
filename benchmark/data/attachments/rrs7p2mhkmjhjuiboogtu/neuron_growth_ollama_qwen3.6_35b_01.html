<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            border: 1px solid #101a3a;
        }
        /* Override dat.gui styles for neon theme */
        .dg.ac {
            z-index: 1000 !important;
            top: 10px !important;
            right: 10px !important;
            background-color: rgba(5, 7, 15, 0.9) !important;
            border: 1px solid #101a3a !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3) !important;
        }
        .dg .cr.function {
            background-color: #101a3a !important;
        }
        .dg .cr.function:hover {
            background-color: #00e5ff !important;
        }
        .dg .cr.function .property-name {
            color: #fff36a !important;
        }
        .dg .cr.function:hover .property-name {
            color: #05070f !important;
        }
        .dg .cr.number input[type=text] {
            background-color: #05070f !important;
            color: #00e5ff !important;
            border: 1px solid #101a3a !important;
        }
        .dg .cr.number input[type=text]:focus {
            border-color: #00e5ff !important;
        }
        .dg .cr.color {
            background-color: #05070f !important;
        }
        .dg .cr.color .property-name {
            color: #d6ff00 !important;
        }
        .dg .close-button {
            background-color: #101a3a !important;
            color: #00e5ff !important;
        }
        .dg .close-button:hover {
            background-color: #00e5ff !important;
            color: #05070f !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // Palette
    const COLORS = {
        bg: '#05070f',
        bgGlow: '#101a3a',
        branch: '#00e5ff',
        accent: '#d6ff00',
        synapse: '#ff2bd6',
        pulse: '#fff36a',
        ui: '#ffd400'
    };

    // Simulation Parameters
    const params = {
        // Growth
        neuronCount: 4,
        growthSpeed: 2,
        maxDepth: 8,
        splitChance: 0.05,
        curvature: 0.3,
        maxBranchLength: 150,
        
        // Synapses
        synapseThreshold: 20,
        synapseGlow: 10,
        
        // Pulses
        pulseSpeed: 3,
        pulseFrequency: 0.02,
        pulseBrightness: 1.5,
        
        // Visuals
        bgColor: COLORS.bg,
        branchColor: COLORS.branch,
        accentColor: COLORS.accent,
        synapseColor: COLORS.synapse,
        pulseColor: COLORS.pulse,
        
        // Actions
        regenerate: () => initSimulation(),
        clearCanvas: () => {
            branches = [];
            synapses = [];
            pulses = [];
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
        },
        pauseResume: () => {
            isPaused = !isPaused;
            if (!isPaused) loop();
        }
    };

    let isPaused = false;
    let branches = [];
    let synapses = [];
    let pulses = [];
    let neurons = [];

    // --- Classes ---

    class Neuron {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = Math.random() * Math.PI * 2;
            this.length = 0;
            this.maxLen = params.maxBranchLength * (0.8 + Math.random() * 0.4);
            this.thickness = Math.random() * 2 + 1;
            this.isDead = false;
            this.children = [];
            this.color = Math.random() > 0.7 ? params.accentColor : params.branchColor;
        }

        grow() {
            if (this.isDead) return;

            const step = params.growthSpeed;
            const prevX = this.x;
            const prevY = this.y;

            // Update angle with slight random walk (curvature)
            this.angle += (Math.random() - 0.5) * params.curvature;
            
            this.x += Math.cos(this.angle) * step;
            this.y += Math.sin(this.angle) * step;
            this.length += step;

            // Add segment to global list
            branches.push({
                x1: prevX, y1: prevY,
                x2: this.x, y2: this.y,
                thickness: this.thickness,
                color: this.color,
                depth: 0 // Root branches have depth 0
            });

            // Check bounds
            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height || this.length >= this.maxLen) {
                this.isDead = true;
                return;
            }

            // Split logic
            if (Math.random() < params.splitChance && this.children.length < 3) {
                const child = new Neuron(this.x, this.y);
                child.angle = this.angle + (Math.random() - 0.5) * 1.5;
                child.thickness = this.thickness * 0.7;
                child.maxLen = this.maxLen * 0.8;
                this.children.push(child);
            }

            // Recursively grow children
            this.children.forEach(child => child.grow());
        }
    }

    class Synapse {
        constructor(branchA, branchB) {
            this.branchA = branchA;
            this.branchB = branchB;
            this.pulsePhase = Math.random() * Math.PI * 2;
            this.active = true;
        }

        draw() {
            if (!this.active) return;

            const p = this.pulsePhase;
            const glow = params.synapseGlow * (0.5 + 0.5 * Math.sin(p));
            
            ctx.save();
            ctx.shadowBlur = glow;
            ctx.shadowColor = params.synapseColor;
            ctx.strokeStyle = params.synapseColor;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.6 + 0.4 * Math.sin(p);
            
            ctx.beginPath();
            ctx.moveTo(this.branchA.x2, this.branchA.y2);
            ctx.lineTo(this.branchB.x2, this.branchB.y2);
            ctx.stroke();
            ctx.restore();

            this.pulsePhase += 0.1;
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * 0.01;
            this.active = true;
        }

        update() {
            this.progress += this.speed;
            if (this.progress >= 1) {
                this.active = false;
            }
        }

        draw() {
            if (!this.active) return;

            const x = this.synapse.branchA.x2 + (this.synapse.branchB.x2 - this.synapse.branchA.x2) * this.progress;
            const y = this.synapse.branchA.y2 + (this.synapse.branchB.y2 - this.synapse.branchA.y2) * this.progress;

            ctx.save();
            ctx.shadowBlur = 15 * params.pulseBrightness;
            ctx.shadowColor = params.pulseColor;
            ctx.fillStyle = params.pulseColor;
            
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- Simulation Logic ---

    function initSimulation() {
        branches = [];
        synapses = [];
        pulses = [];
        neurons = [];

        // Create seed neurons
        const centerX = width / 2;
        const centerY = height / 2;
        const spread = 100;

        for (let i = 0; i < params.neuronCount; i++) {
            const x = centerX + (Math.random() - 0.5) * spread;
            const y = centerY + (Math.random() - 0.5) * spread;
            const neuron = new Neuron(x, y);
            neurons.push(neuron);
        }
    }

    function checkSynapses() {
        // Get all tips
        const tips = [];
        neurons.forEach(n => tips.push(n));
        // Add children tips
        neurons.forEach(n => {
            n.children.forEach(c => tips.push(c));
        });

        // Check distances
        for (let i = 0; i < tips.length; i++) {
            for (let j = i + 1; j < tips.length; j++) {
                const t1 = tips[i];
                const t2 = tips[j];
                
                // Only connect if both are alive and not the same parent
                if (t1.isDead || t2.isDead || t1 === t2) continue;
                if (t1 === t2.parent) continue; // Prevent self-loop if we tracked parents properly, but here simple check

                const dx = t1.x - t2.x;
                const dy = t1.y - t2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < params.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.branchA === t1 && s.branchB === t2) || 
                        (s.branchA === t2 && s.branchB === t1)
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(t1, t2));
                    }
                }
            }
        }
    }

    function spawnPulses() {
        if (Math.random() < params.pulseFrequency) {
            if (synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse));
            }
        }
    }

    function drawBackground() {
        // Clear with background color
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Draw subtle grid/scanlines
        ctx.save();
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        
        // Vertical lines
        for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }
        
        // Horizontal lines
        for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawVignette() {
        const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
    }

    function drawBranches() {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        branches.forEach(b => {
            ctx.save();
            ctx.shadowBlur = 5;
            ctx.shadowColor = b.color;
            ctx.strokeStyle = b.color;
            ctx.lineWidth = b.thickness;
            
            ctx.beginPath();
            ctx.moveTo(b.x1, b.y1);
            ctx.lineTo(b.x2, b.y2);
            ctx.stroke();
            ctx.restore();
        });
    }

    function update() {
        if (isPaused) return;

        // Grow neurons
        neurons.forEach(n => n.grow());
        // Grow children
        neurons.forEach(n => {
            n.children.forEach(c => c.grow());
        });

        // Check for new synapses periodically
        if (Math.random() < 0.1) {
            checkSynapses();
        }

        // Update pulses
        pulses.forEach(p => p.update());
        pulses = pulses.filter(p => p.active);

        // Spawn new pulses
        spawnPulses();
    }

    function draw() {
        drawBackground();
        drawBranches();
        
        // Draw synapses
        synapses.forEach(s => s.draw());
        
        // Draw pulses
        pulses.forEach(p => p.draw());

        drawVignette();
    }

    function loop() {
        if (!isPaused) {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    }

    // --- Initialization ---

    // Setup dat.gui
    const gui = new dat.GUI();
    
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
    growthFolder.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
    growthFolder.add(params, 'maxDepth', 5, 15, 1).name('Max Depth');
    growthFolder.add(params, 'splitChance', 0.01, 0.2, 0.01).name('Split Chance');
    growthFolder.add(params, 'curvature', 0.1, 1.0, 0.1).name('Curvature');
    growthFolder.add(params, 'maxBranchLength', 50, 300, 10).name('Max Length');
    growthFolder.open();

    const synapseFolder = gui.addFolder('Synapses');
    synapseFolder.add(params, 'synapseThreshold', 10, 50, 1).name('Distance Threshold');
    synapseFolder.add(params, 'synapseGlow', 5, 20, 1).name('Glow Strength');
    synapseFolder.open();

    const pulseFolder = gui.addFolder('Pulses');
    pulseFolder.add(params, 'pulseSpeed', 1, 10, 0.5).name('Speed');
    pulseFolder.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Frequency');
    pulseFolder.add(params, 'pulseBrightness', 0.5, 3, 0.1).name('Brightness');
    pulseFolder.open();

    const visualFolder = gui.addFolder('Visuals');
    visualFolder.addColor(params, 'bgColor').name('Background Color').onChange(() => {});
    visualFolder.addColor(params, 'branchColor').name('Branch Color');
    visualFolder.addColor(params, 'accentColor').name('Accent Color');
    visualFolder.addColor(params, 'synapseColor').name('Synapse Color');
    visualFolder.addColor(params, 'pulseColor').name('Pulse Color');
    visualFolder.open();

    const actionsFolder = gui.addFolder('Actions');
    actionsFolder.add(params, 'regenerate').name('Regenerate Network');
    actionsFolder.add(params, 'clearCanvas').name('Clear Canvas');
    actionsFolder.add(params, 'pauseResume').name('Pause/Resume');
    actionsFolder.open();

    // Start
    initSimulation();
    loop();

</script>
</body>
</html>
