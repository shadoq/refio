<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake 30x30 — Triple Mode</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2b;
    --accent: #4ade80;
    --accent2: #60a5fa;
    --accent3: #f472b6;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --danger: #ef4444;
    --grid-line: rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #131a2b 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(74,222,128,0.5);
    font-weight: 700;
  }
  #scoreboard {
    display: flex;
    gap: 24px;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    background: var(--panel);
    padding: 8px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .score-item { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.p1 { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.p2 { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .score-label { color: var(--muted); }
  .score-value { color: #fff; font-weight: 700; min-width: 24px; text-align: right; }
  .mode-tag {
    font-size: 12px;
    color: var(--muted);
    border-left: 1px solid rgba(255,255,255,0.1);
    padding-left: 16px;
  }

  #stage {
    position: relative;
    width: min(88vmin, 640px);
    height: min(88vmin, 640px);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #0d1220;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.5);
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 11, 20, 0.88);
    backdrop-filter: blur(6px);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 24px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 34px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(74,222,128,0.6);
  }
  .overlay h2.gameover { color: var(--danger); text-shadow: 0 0 24px rgba(239,68,68,0.6); }
  .subtitle { color: var(--muted); font-size: 14px; max-width: 420px; line-height: 1.5; }

  .modes { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  .mode-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mode-btn:hover, .mode-btn:focus {
    outline: none;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(74,222,128,0.25);
  }
  .mode-btn .key {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 3px 7px;
    border-radius: 4px;
    font-family: monospace;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 11px;
    color: var(--text);
  }
  .final-score { font-size: 20px; color: #fff; font-weight: 700; }
  .final-score span { color: var(--accent); }
  .winner { font-size: 16px; color: var(--accent3); letter-spacing: 2px; text-transform: uppercase; }

  #controls-help {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #controls-help span { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div id="app">
  <h1>Snake</h1>

  <div id="scoreboard">
    <div class="score-item">
      <span class="dot p1"></span>
      <span class="score-label" id="p1-label">P1</span>
      <span class="score-value" id="p1-score">0</span>
    </div>
    <div class="score-item">
      <span class="dot p2"></span>
      <span class="score-label" id="p2-label">P2</span>
      <span class="score-value" id="p2-score">0</span>
    </div>
    <div class="mode-tag" id="mode-tag">Menu</div>
  </div>

  <div id="stage">
    <canvas id="game" width="600" height="600"></canvas>

    <div class="overlay" id="menu">
      <h2>Snake</h2>
      <p class="subtitle">Classic snake on a 30×30 grid. Eat food, grow, and don't crash. Choose a mode:</p>
      <div class="modes">
        <button class="mode-btn" data-mode="hvh">
          <span>Human vs Human</span><span class="key">1</span>
        </button>
        <button class="mode-btn" data-mode="cvh">
          <span>CPU vs Human</span><span class="key">2</span>
        </button>
        <button class="mode-btn" data-mode="cvc">
          <span>CPU vs CPU</span><span class="key">3</span>
        </button>
      </div>
      <p class="hint">Press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> to start · P1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · P2: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></p>
    </div>

    <div class="overlay hidden" id="gameover">
      <h2 class="gameover">Game Over</h2>
      <div class="winner" id="winner-text"></div>
      <div class="final-score" id="final-score"></div>
      <p class="subtitle" id="gameover-sub"></p>
      <p class="hint">Press <kbd>R</kbd> or <kbd>Enter</kbd> to restart · <kbd>Esc</kbd> for menu</p>
    </div>
  </div>

  <div id="controls-help">
    <span>P1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
    <span>P2: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span>
    <span><kbd>R</kbd> Restart · <kbd>Esc</kbd> Menu</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- Constants ----------
  const GRID = 30;
  const CELL = 20;               // internal cell size in px (canvas 600x600)
  const TICK_MS = 110;           // game speed
  const DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };
  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  const MODES = {
    hvh: { name: "Human vs Human", p1: "human", p2: "human" },
    cvh: { name: "CPU vs Human",   p1: "cpu",   p2: "human" },
    cvc: { name: "CPU vs CPU",     p1: "cpu",   p2: "cpu" },
  };

  // ---------- DOM ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const menuEl = document.getElementById("menu");
  const gameoverEl = document.getElementById("gameover");
  const p1ScoreEl = document.getElementById("p1-score");
  const p2ScoreEl = document.getElementById("p2-score");
  const p1LabelEl = document.getElementById("p1-label");
  const p2LabelEl = document.getElementById("p2-label");
  const modeTagEl = document.getElementById("mode-tag");
  const winnerTextEl = document.getElementById("winner-text");
  const finalScoreEl = document.getElementById("final-score");
  const gameoverSubEl = document.getElementById("gameover-sub");

  // ---------- State ----------
  let state = "menu";            // menu | playing | gameover
  let mode = null;
  let snakes = [];               // [{body:[{x,y}], dir, nextDir, score, alive, color, isCpu}]
  let food = { x: 0, y: 0 };
  let accumulator = 0;
  let lastTime = 0;
  let pendingGameOver = null;    // { winnerIndex, reason }

  // ---------- Helpers ----------
  const key = (x, y) => x + "," + y;

  function randInt(n) { return Math.floor(Math.random() * n); }

  function spawnFood() {
    const occupied = new Set();
    snakes.forEach(s => s.body.forEach(seg => occupied.add(key(seg.x, seg.y))));
    const free = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!occupied.has(key(x, y))) free.push({ x, y });
      }
    }
    if (free.length === 0) { endGame({ winnerIndex: -1, reason: "Board full — draw!" }); return; }
    food = free[randInt(free.length)];
  }

  function resetSnake(index, color, isCpu) {
    // P1 starts on the left, P2 on the right
    const startX = index === 0 ? 6 : GRID - 7;
    const startY = Math.floor(GRID / 2);
    const body = [];
    for (let i = 0; i < 4; i++) {
      body.push({ x: startX - (index === 0 ? i : -i), y: startY });
    }
    return {
      body,
      dir: index === 0 ? "right" : "left",
      nextDir: index === 0 ? "right" : "left",
      score: 0,
      alive: true,
      color,
      isCpu,
      grow: 0,
    };
  }

  function startGame(selectedMode) {
    mode = MODES[selectedMode];
    if (!mode) return;
    snakes = [
      resetSnake(0, "#4ade80", mode.p1 === "cpu"),
      resetSnake(1, "#60a5fa", mode.p2 === "cpu"),
    ];
    // Fix body directions so heads don't overlap
    snakes[0].body = [{x:6,y:15},{x:5,y:15},{x:4,y:15},{x:3,y:15}];
    snakes[1].body = [{x:GRID-7,y:15},{x:GRID-6,y:15},{x:GRID-5,y:15},{x:GRID-4,y:15}];
    p1LabelEl.textContent = mode.p1 === "cpu" ? "CPU 1" : "P1";
    p2LabelEl.textContent = mode.p2 === "cpu" ? "CPU 2" : "P2";
    p1ScoreEl.textContent = "0";
    p2ScoreEl.textContent = "0";
    modeTagEl.textContent = mode.name;
    spawnFood();
    pendingGameOver = null;
    accumulator = 0;
    state = "playing";
    menuEl.classList.add("hidden");
    gameoverEl.classList.add("hidden");
  }

  function endGame(result) {
    if (state === "gameover") return;
    pendingGameOver = result;
    state = "gameover";

    const s1 = snakes[0] ? snakes[0].score : 0;
    const s2 = snakes[1] ? snakes[1].score : 0;
    let winner = "";
    if (result.winnerIndex === -1) {
      winner = "Draw";
    } else if (result.winnerIndex === 0) {
      winner = mode.p1 === "cpu" ? "CPU 1 Wins!" : "Player 1 Wins!";
    } else {
      winner = mode.p2 === "cpu" ? "CPU 2 Wins!" : "Player 2 Wins!";
    }
    winnerTextEl.textContent = winner;
    finalScoreEl.innerHTML = `P1: <span>${s1}</span> &nbsp;·&nbsp; P2: <span>${s2}</span>`;
    gameoverSubEl.textContent = result.reason || "";
    gameoverEl.classList.remove("hidden");
  }

  function showMenu() {
    state = "menu";
    mode = null;
    pendingGameOver = null;
    menuEl.classList.remove("hidden");
    gameoverEl.classList.add("hidden");
    modeTagEl.textContent = "Menu";
    p1ScoreEl.textContent = "0";
    p2ScoreEl.textContent = "0";
    p1LabelEl.textContent = "P1";
    p2LabelEl.textContent = "P2";
    // draw a static backdrop
    snakes = [resetSnake(0, "#4ade80", false), resetSnake(1, "#60a5fa", false)];
    snakes[0].body = [{x:6,y:15},{x:5,y:15},{x:4,y:15},{x:3,y:15}];
    snakes[1].body = [{x:GRID-7,y:15},{x:GRID-6,y:15},{x:GRID-5,y:15},{x:GRID-4,y:15}];
    food = { x: 15, y: 15 };
    draw();
  }

  // ---------- CPU AI (BFS shortest path to food with safety check) ----------
  function bfsPath(start, goal, blockedSet) {
    const startK = key(start.x, start.y);
    const goalK = key(goal.x, goal.y);
    if (startK === goalK) return [];
    const prev = new Map();
    prev.set(startK, null);
    const queue = [start];
    let qi = 0;
    while (qi < queue.length) {
      const cur = queue[qi++];
      for (const dName of ["up", "down", "left", "right"]) {
        const d = DIRS[dName];
        const nx = cur.x + d.x, ny = cur.y + d.y;
        if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) continue;
        const nk = key(nx, ny);
        if (prev.has(nk)) continue;
        if (blockedSet.has(nk) && nk !== goalK) continue;
        prev.set(nk, cur);
        if (nk === goalK) {
          // reconstruct
          const path = [];
          let node = { x: nx, y: ny };
          while (node && key(node.x, node.y) !== startK) {
            path.unshift(node);
            node = prev.get(key(node.x, node.y));
          }
          return path;
        }
        queue.push({ x: nx, y: ny });
      }
    }
    return null; // no path
  }

  function cellFreeFor(snake, x, y) {
    if (x < 0 || y < 0 || x >= GRID || y >= GRID) return false;
    const k = key(x, y);
    // other snakes' bodies block (their tails may move away, but be conservative for heads)
    for (const other of snakes) {
      const len = other.body.length;
      for (let i = 0; i < len; i++) {
        // allow following into a tail cell that will move (unless growing)
        const isTail = i === len - 1;
        if (isTail && other.grow === 0 && other !== snake) continue;
        if (isTail && other.grow === 0 && other === snake) continue;
        if (key(other.body[i].x, other.body[i].y) === k) return false;
      }
    }
    return true;
  }

  function cpuChooseDir(snake) {
    const head = snake.body[0];

    // Build blocked set: walls are implicit; blocks = all snake bodies except target food
    const blocked = new Set();
    for (const s of snakes) {
      const len = s.body.length;
      for (let i = 0; i < len; i++) {
        const isTail = i === len - 1 && s.grow === 0;
        if (isTail) continue; // tail will move away
        blocked.add(key(s.body[i].x, s.body[i].y));
      }
    }
    // head itself is fine
    blocked.delete(key(head.x, head.y));

    const path = bfsPath(head, food, blocked);

    let candidate = null;
    if (path && path.length > 0) {
      candidate = dirBetween(head, path[0]);
    }

    // Evaluate candidate: simulate one step and check we still have room to live
    const options = [];
    for (const dName of ["up", "down", "left", "right"]) {
      if (dName === OPPOSITE[snake.dir]) continue; // no reversing
      const d = DIRS[dName];
      const nx = head.x + d.x, ny = head.y + d.y;
      if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) continue;
      if (!cellFreeFor(snake, nx, ny)) continue;
      options.push(dName);
    }
    if (options.length === 0) {
      // forced move — pick anything legal (probably death)
      for (const dName of ["up", "down", "left", "right"]) {
        if (dName === OPPOSITE[snake.dir]) continue;
        const d = DIRS[dName];
        const nx = head.x + d.x, ny = head.y + d.y;
        if (nx >= 0 && ny >= 0 && nx < GRID && ny < GRID) return dName;
      }
      return snake.dir;
    }

    // Prefer the BFS candidate if it's legal
    if (candidate && options.includes(candidate)) {
      // Safety: check that after moving, we can still reach some free space (flood fill)
      const d = DIRS[candidate];
      const nx = head.x + d.x, ny = head.y + d.y;
      if (floodFillSize({ x: nx, y: ny }, snake) >= Math.min(snake.body.length + 2, 12)) {
        return candidate;
      }
    }

    // Fallback: choose the option with the most free space around the target cell
    let best = options[0];
    let bestScore = -Infinity;
    for (const dName of options) {
      const d = DIRS[dName];
      const nx = head.x + d.x, ny = head.y + d.y;
      const space = floodFillSize({ x: nx, y: ny }, snake);
      let score = space;
      if (dName === snake.dir) score += 1; // slight preference to keep moving
      if (space > bestScore) { bestScore = space; best = dName; }
    }
    return best;
  }

  function dirBetween(a, b) {
    if (b.x > a.x) return "right";
    if (b.x < a.x) return "left";
    if (b.y > a.y) return "down";
    if (b.y < a.y) return "up";
    return null;
  }

  function floodFillSize(start, snake) {
    const blocked = new Set();
    for (const s of snakes) {
      const len = s.body.length;
      for (let i = 0; i < len; i++) {
        const isTail = i === len - 1 && s.grow === 0;
        if (isTail) continue;
        blocked.add(key(s.body[i].x, s.body[i].y));
      }
    }
    blocked.delete(key(start.x, start.y));
    const seen = new Set([key(start.x, start.y)]);
    const queue = [start];
    let qi = 0;
    let count = 0;
    while (qi < queue.length) {
      const cur = queue[qi++];
      count++;
      for (const d of Object.values(DIRS)) {
        const nx = cur.x + d.x, ny = cur.y + d.y;
        if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) continue;
        const nk = key(nx, ny);
        if (seen.has(nk) || blocked.has(nk)) continue;
        seen.add(nk);
        queue.push({ x: nx, y: ny });
      }
    }
    return count;
  }

  // ---------- Input ----------
  const KEYMAP_P1 = {
    w: "up", a: "left", s: "down", d: "right",
  };
  const KEYMAP_P2 = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  };

  document.addEventListener("keydown", (e) => {
    const k = e.key;

    if (state === "menu") {
      if (k === "1") { startGame("hvh"); e.preventDefault(); return; }
      if (k === "2") { startGame("cvh"); e.preventDefault(); return; }
      if (k === "3") { startGame("cvc"); e.preventDefault(); return; }
      return;
    }

    if (state === "gameover") {
      if (k === "r" || k === "R" || k === "Enter") {
        // restart same mode
        if (mode) {
          const modeKey = Object.keys(MODES).find(mk => MODES[mk] === mode);
          startGame(modeKey);
        }
        e.preventDefault();
        return;
      }
      if (k === "Escape") { showMenu(); e.preventDefault(); return; }
      return;
    }

    if (state === "playing") {
      if (k === "Escape") { showMenu(); e.preventDefault(); return; }
      if (k === "r" || k === "R") {
        const modeKey = Object.keys(MODES).find(mk => MODES[mk] === mode);
        startGame(modeKey);
        e.preventDefault();
        return;
      }

      // P1: WASD (only if P1 is human)
      const lower = k.length === 1 ? k.toLowerCase() : k;
      if (KEYMAP_P1[lower] && !snakes[0].isCpu) {
        const d = KEYMAP_P1[lower];
        if (d !== OPPOSITE[snakes[0].dir]) snakes[0].nextDir = d;
        e.preventDefault();
        return;
      }
      // P2: Arrows (only if P2 is human)
      if (KEYMAP_P2[k] && !snakes[1].isCpu) {
        const d = KEYMAP_P2[k];
        if (d !== OPPOSITE[snakes[1].dir]) snakes[1].nextDir = d;
        e.preventDefault();
        return;
      }
    }
  });

  // Menu buttons
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => startGame(btn.dataset.mode));
  });

  // ---------- Game Logic ----------
  function step() {
    // 1. Compute CPU decisions first
    for (const s of snakes) {
      if (s.isCpu && s.alive) {
        s.nextDir = cpuChooseDir(s);
      }
    }

    // 2. Apply directions
    for (const s of snakes) {
      if (!s.alive) continue;
      if (s.nextDir !== OPPOSITE[s.dir]) s.dir = s.nextDir;
    }

    // 3. Compute new heads
    const newHeads = snakes.map(s => {
      if (!s.alive) return null;
      const d = DIRS[s.dir];
      return { x: s.body[0].x + d.x, y: s.body[0].y + d.y };
    });

    // 4. Wall collisions
    for (let i = 0; i < snakes.length; i++) {
      const s = snakes[i];
      if (!s.alive) continue;
      const h = newHeads[i];
      if (h.x < 0 || h.y < 0 || h.x >= GRID || h.y >= GRID) {
        s.alive = false;
      }
    }

    // 5. Self / other-snake body collisions (excluding tails that will move)
    for (let i = 0; i < snakes.length; i++) {
      const s = snakes[i];
      if (!s.alive) continue;
      const h = newHeads[i];
      for (let j = 0; j < snakes.length; j++) {
        const other = snakes[j];
        if (!other.alive) continue;
        const len = other.body.length;
        for (let seg = 0; seg < len; seg++) {
          const isTail = seg === len - 1 && other.grow === 0;
          if (isTail) continue;
          // skip own head position (it's moving)
          if (j === i && seg === 0) continue;
          if (other.body[seg].x === h.x && other.body[seg].y === h.y) {
            s.alive = false;
            break;
          }
        }
        if (!s.alive) break;
      }
    }

    // 6. Head-to-head collision
    if (snakes[0].alive && snakes[1].alive &&
        newHeads[0].x === newHeads[1].x && newHeads[0].y === newHeads[1].y) {
      snakes[0].alive = false;
      snakes[1].alive = false;
    }

    // 7. Move bodies & eat food
    for (let i = 0; i < snakes.length; i++) {
      const s = snakes[i];
      if (!s.alive) continue;
      const h = newHeads[i];
      s.body.unshift(h);
      if (h.x === food.x && h.y === food.y) {
        s.score += 1;
        s.grow += 1;
        p1ScoreEl.textContent = snakes[0].score;
        p2ScoreEl.textContent = snakes[1].score;
      }
      if (s.grow > 0) {
        s.grow -= 1;
      } else {
        s.body.pop();
      }
    }

    // 8. Respawn food if eaten
    const ate = snakes.some(s => s.alive && s.body[0].x === food.x && s.body[0].y === food.y);
    if (ate) spawnFood();

    // 9. Determine game over
    const aliveCount = snakes.filter(s => s.alive).length;
    if (aliveCount === 0) {
      endGame({ winnerIndex: -1, reason: "Both snakes crashed!" });
    } else if (aliveCount === 1) {
      const winnerIndex = snakes[0].alive ? 0 : 1;
      const dead = snakes[1 - winnerIndex];
      endGame({ winnerIndex, reason: `${dead.isCpu ? "CPU" : "Player"} ${1 - winnerIndex + 1} hit a wall or itself.` });
    }
  }

  // ---------- Rendering ----------
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
      const p = i * CELL;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(W, p); ctx.stroke();
    }

    // food
    if (food) {
      const fx = food.x * CELL, fy = food.y * CELL;
      const pad = 3;
      const pulse = 1 + Math.sin(performance.now() / 200) * 0.12;
      const size = (CELL - pad * 2) * pulse;
      const off = (CELL - size) / 2;
      ctx.fillStyle = "#f472b6";
      ctx.shadowColor = "#f472b6";
      ctx.shadowBlur = 14;
      roundRect(fx + off, fy + off, size, size, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // snakes
    snakes.forEach((s, idx) => {
      if (!s.alive && state === "playing") return;
      s.body.forEach((seg, i) => {
        const x = seg.x * CELL, y = seg.y * CELL;
        const isHead = i === 0;
        const alpha = s.alive ? 1 : 0.35;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = isHead ? lighten(s.color, 30) : s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = isHead ? 14 : 6;
        const pad = isHead ? 1 : 2;
        roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 5 : 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;

        // eyes on head
        if (isHead && s.alive) {
          drawEyes(seg, s.dir);
        }
      });
    });
  }

  function drawEyes(seg, dir) {
    const cx = seg.x * CELL + CELL / 2;
    const cy = seg.y * CELL + CELL / 2;
    const r = 2.4;
    let e1, e2;
    const off = 3.4;
    if (dir === "up")    { e1 = [cx - off, cy - 1]; e2 = [cx + off, cy - 1]; }
    else if (dir === "down")  { e1 = [cx - off, cy + 1]; e2 = [cx + off, cy + 1]; }
    else if (dir === "left")  { e1 = [cx - 1, cy - off]; e2 = [cx - 1, cy + off]; }
    else                  { e1 = [cx + 1, cy - off]; e2 = [cx + 1, cy + off]; }
    ctx.fillStyle = "#0b0f1a";
    ctx.beginPath(); ctx.arc(e1[0], e1[1], r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2[0], e2[1], r, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt;
    let g = ((n >> 8) & 0xff) + amt;
    let b = (n & 0xff) + amt;
    r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
    return `rgb(${r},${g},${b})`;
  }

  // ---------- Main Loop ----------
  function loop(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min(time - lastTime, 250);
    lastTime = time;

    if (state === "playing") {
      accumulator += dt;
      while (accumulator >= TICK_MS) {
        accumulator -= TICK_MS;
        if (state === "playing") step();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Boot ----------
  showMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
