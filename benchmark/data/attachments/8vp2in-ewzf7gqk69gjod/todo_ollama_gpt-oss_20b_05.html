<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>
<style>
body{font-family:sans-serif;margin:2rem;background:#f9f9f9;}
.container{max-width:500px;margin:auto;background:white;padding:1rem;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
h1{text-align:center;}
form{display:flex;margin-bottom:1rem;}
input[type="text"]{flex:1;padding:.5rem;border:1px solid #ccc;border-radius:3px;}
button{padding:.5rem 1rem;margin-left:.5rem;border:none;background:#28a745;color:white;border-radius:3px;cursor:pointer;}
button:hover{background:#218838;}
ul{list-style:none;padding:0;}
li{display:flex;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee;}
li:last-child{border-bottom:none;}
li.completed span{text-decoration:line-through;color:#777;}
li button.delete{margin-left:auto;background:#dc3545;}
li button.delete:hover{background:#c82333;}
#filters{display:flex;justify-content:center;margin-top:1rem;}
#filters button{background:none;border:none;color:#007bff;cursor:pointer;margin:0 .5rem;}
#filters button.active{font-weight:bold;text-decoration:underline;}
</style>
</head>
<body>
<div class="container">
<h1>Todo List</h1>
<form id="todo-form">
<input type="text" id="todo-input" placeholder="Add new todo" required>
<button type="submit">Add</button>
</form>
<ul id="todo-list"></ul>
<div id="filters">
<button data-filter="all" class="active">All</button>
<button data-filter="active">Active</button>
<button data-filter="completed">Completed</button>
</div>
</div>
<script>
(() => {
'use strict';
const STORAGE_KEY = 'todos';
let todos = [];
let filter = 'all';

function load() {
const data = localStorage.getItem(STORAGE_KEY);
todos = data ? JSON.parse(data) : [];
render();
}

function save() {
localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function addTodo(text) {
todos.push({id: Date.now(), text, completed: false});
save();
render();
}

function toggleTodo(id) {
const todo = todos.find(t => t.id === id);
if (todo) {
todo.completed = !todo.completed;
save();
render();
}
}

function deleteTodo(id) {
todos = todos.filter(t => t.id !== id);
save();
render();
}

function setFilter(newFilter) {
filter = newFilter;
document.querySelectorAll('#filters button').forEach(btn => {
btn.classList.toggle('active', btn.dataset.filter === filter);
});
render();
}

function getFilteredTodos() {
if (filter === 'active') return todos.filter(t => !t.completed);
if (filter === 'completed') return todos.filter(t => t.completed);
return todos;
}

function render() {
const list = document.getElementById('todo-list');
list.innerHTML = '';
getFilteredTodos().forEach(todo => {
const li = document.createElement('li');
li.className = todo.completed ? 'completed' : '';
li.dataset.id = todo.id;

const checkbox = document.createElement('input');
checkbox.type = 'checkbox';
checkbox.checked = todo.completed;
checkbox.addEventListener('change', () => toggleTodo(todo.id));

const span = document.createElement('span');
span.textContent = todo.text;
span.style.marginLeft = '0.5rem';

const delBtn = document.createElement('button');
delBtn.textContent = '✕';
delBtn.className = 'delete';
delBtn.addEventListener('click', () => deleteTodo(todo.id));

li.appendChild(checkbox);
li.appendChild(span);
li.appendChild(delBtn);
list.appendChild(li);
});
}

document.getElementById('todo-form').addEventListener('submit', e => {
e.preventDefault();
const input = document.getElementById('todo-input');
const text = input.value.trim();
if (text) {
addTodo(text);
input.value = '';
}
});

document.querySelectorAll('#filters button').forEach(btn => {
btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

load();
})();
</script>
</body>
</html>
