<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #05070f 0%, #101a3a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #canvas {
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 30px rgba(0, 229, 255, 0.1);
            display: block;
            background: #05070f;
        }

        .container {
            position: relative;
            width: 800px;
            height: 800px;
        }

        .dg {
            font-family: 'Courier New', monospace !important;
        }

        .dg.ac {
            z-index: 1000;
        }

        .dg .property-name {
            color: #ffd400 !important;
        }

        .dg .close-button {
            background: #00e5ff !important;
        }

        .dg li:not(.folder) {
            background: rgba(16, 26, 58, 0.8) !important;
            border-left: 2px solid #00e5ff !important;
        }

        .dg li.folder {
            border-left: 2px solid #d6ff00 !important;
        }

        .dg .folder .title {
            background: rgba(16, 26, 58, 0.9) !important;
            color: #d6ff00 !important;
        }

        .dg input[type="text"],
        .dg input[type="number"] {
            background: rgba(0, 229, 255, 0.1) !important;
            color: #00e5ff !important;
            border: 1px solid #00e5ff !important;
        }

        .dg button {
            background: #ffd400 !important;
            color: #05070f !important;
            border: 1px solid #ffd400 !important;
        }

        .dg button:hover {
            background: #d6ff00 !important;
        }

        .dg .slider {
            background: rgba(0, 229, 255, 0.1) !important;
        }

        .dg .slider-fg {
            background: #00e5ff !important;
        }

        .dg .color-button {
            border: 1px solid #ffd400 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="800" height="800"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuration object
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 0.8,
            maxBranchDepth: 8,
            branchSplitChance: 0.3,
            branchCurvature: 0.15,
            maxBranchLength: 80,

            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,

            // Pulses
            pulseSpeed: 2,
            pulseFrequency: 0.05,
            pulseBrightness: 1,

            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',

            // Controls
            paused: false,
            regenerate: function() {
                initializeNeurons();
            },
            clear: function() {
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            },
            pauseResume: function() {
                config.paused = !config.paused;
            }
        };

        // Data structures
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationFrame = 0;

        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.id = Math.random();
            }

            addBranch(branch) {
                this.branches.push(branch);
            }
        }

        // Branch class
        class Branch {
            constructor(x, y, angle, depth, parentNeuron, thickness = 2) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parentNeuron = parentNeuron;
                this.thickness = thickness + Math.random() * 0.5 - 0.25;
                this.length = 0;
                this.maxLength = config.maxBranchLength + Math.random() * 20 - 10;
                this.growing = true;
                this.children = [];
                this.tipX = x;
                this.tipY = y;
                this.curvature = (Math.random() - 0.5) * config.branchCurvature;
                this.id = Math.random();
            }

            grow() {
                if (!this.growing || this.length >= this.maxLength) {
                    this.growing = false;
                    return;
                }

                this.angle += this.curvature;
                const dx = Math.cos(this.angle) * config.branchGrowthSpeed;
                const dy = Math.sin(this.angle) * config.branchGrowthSpeed;

                this.tipX += dx;
                this.tipY += dy;
                this.length += config.branchGrowthSpeed;

                // Chance to split
                if (this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                    const splitAngle1 = this.angle + (Math.random() * 0.6 - 0.3);
                    const splitAngle2 = this.angle - (Math.random() * 0.6 - 0.3);
                    const newThickness = this.thickness * 0.7;

                    const child1 = new Branch(this.tipX, this.tipY, splitAngle1, this.depth + 1, this.parentNeuron, newThickness);
                    const child2 = new Branch(this.tipX, this.tipY, splitAngle2, this.depth + 1, this.parentNeuron, newThickness);

                    this.children.push(child1, child2);
                    branches.push(child1, child2);
                }
            }

            draw() {
                ctx.strokeStyle = this.depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = this.depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.tipX, this.tipY);
                ctx.stroke();

                ctx.shadowBlur = 0;
            }
        }

        // Synapse class
        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x1 = branch1.tipX;
                this.y1 = branch1.tipY;
                this.x2 = branch2.tipX;
                this.y2 = branch2.tipY;
                this.pulse = 0;
                this.id = Math.random();
            }

            update() {
                this.x1 = this.branch1.tipX;
                this.y1 = this.branch1.tipY;
                this.x2 = this.branch2.tipX;
                this.y2 = this.branch2.tipY;
            }

            draw() {
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;

                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();

                // Draw synapse nodes
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.beginPath();
                ctx.arc(this.x1, this.y1, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x2, this.y2, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
        }

        // Pulse class
        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.duration = 60;
                this.id = Math.random();
            }

            update() {
                this.progress += config.pulseSpeed;
            }

            draw() {
                if (this.progress > this.duration) return;

                const t = this.progress / this.duration;
                const x = this.synapse.x1 + (this.synapse.x2 - this.synapse.x1) * t;
                const y = this.synapse.y1 + (this.synapse.y2 - this.synapse.y1) * t;

                ctx.fillStyle = config.pulseColor;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 15 * config.pulseBrightness;

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            isComplete() {
                return this.progress > this.duration;
            }
        }

        function initializeNeurons() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (i / config.neuronCount) * Math.PI * 2;
                const distance = 50;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                const neuron = new Neuron(x, y);

                // Create initial branches
                for (let j = 0; j < 2; j++) {
                    const branchAngle = angle + (j - 0.5) * 0.8 + Math.random() * 0.3;
                    const branch = new Branch(x, y, branchAngle, 0, neuron);
                    neuron.addBranch(branch);
                    branches.push(branch);
                }

                neurons.push(neuron);
            }
        }

        function updateBranches() {
            for (let branch of branches) {
                if (branch.growing) {
                    branch.grow();
                }
            }
        }

        function checkSynapses() {
            const checked = new Set();

            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    // Avoid duplicate synapses
                    const key = [b1.id, b2.id].sort().join('-');
                    if (checked.has(key)) continue;
                    checked.add(key);

                    const dx = b1.tipX - b2.tipX;
                    const dy = b1.tipY - b2.tipY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.synapseDistanceThreshold && distance > 5) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.branch1.id === b1.id && s.branch2.id === b2.id) ||
                            (s.branch1.id === b2.id && s.branch2.id === b1.id)
                        );

                        if (!exists) {
                            const synapse = new Synapse(b1, b2);
                            synapses.push(synapse);

                            // Create pulse
                            if (Math.random() < config.pulseFrequency) {
                                pulses.push(new Pulse(synapse));
                            }
                        }
                    }
                }
            }
        }

        function updatePulses() {
            for (let pulse of pulses) {
                pulse.update();
            }
            pulses = pulses.filter(p => !p.isComplete());
        }

        function draw() {
            // Clear canvas with fade effect
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid scanlines (optional subtle effect)
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw branches
            for (let branch of branches) {
                branch.draw();
            }

            // Draw synapses
            for (let synapse of synapses) {
                synapse.update();
                synapse.draw();
            }

            // Draw pulses
            for (let pulse of pulses) {
                pulse.draw();
            }

            // Draw neuron soma
            ctx.fillStyle = config.branchColor;
            ctx.shadowColor = config.branchColor;
            ctx.shadowBlur = 12;
            for (let neuron of neurons) {
                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function animate() {
            if (!config.paused) {
                updateBranches();
                checkSynapses();
                updatePulses();
            }

            draw();
            animationFrame++;
            requestAnimationFrame(animate);
        }

        // Initialize GUI
        function initializeGUI() {
            const gui = new dat.GUI();

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 1, 10, 1);
            growthFolder.add(config, 'branchGrowthSpeed', 0.1, 3, 0.1);
            growthFolder.add(config, 'maxBranchDepth', 2, 15, 1);
            growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05);
            growthFolder.add(config, 'branchCurvature', 0, 0.5, 0.05);
            growthFolder.add(config, 'maxBranchLength', 20, 200, 10);
            growthFolder.open();

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 150, 5);
            synapsesFolder.add(config, 'synapseGlowStrength', 0, 50, 1);
            synapsesFolder.open();

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 0.1, 5, 0.1);
            pulsesFolder.add(config, 'pulseFrequency', 0, 0.2, 0.01);
            pulsesFolder.add(config, 'pulseBrightness', 0, 2, 0.1);
            pulsesFolder.open();

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor');
            visualsFolder.addColor(config, 'branchColor');
            visualsFolder.addColor(config, 'accentBranchColor');
            visualsFolder.addColor(config, 'synapseColor');
            visualsFolder.addColor(config, 'pulseColor');
            visualsFolder.open();

            // Control buttons
            gui.add(config, 'regenerate').name('Regenerate Network');
            gui.add(config, 'clear').name('Clear Canvas');
            gui.add(config, 'pauseResume').name('Pause/Resume');
        }

        // Start
        initializeNeurons();
        initializeGUI();
        animate();
    </script>
</body>
</html>
