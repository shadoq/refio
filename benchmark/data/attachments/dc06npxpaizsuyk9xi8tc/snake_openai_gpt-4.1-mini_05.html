<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Game - Multi Mode</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #222;
    color: #eee;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 600px;
    height: 600px;
    background-color: #000;
    border: 2px solid #555;
  }
  canvas {
    display: block;
    background-color: #111;
  }
  #scoreBoard {
    position: absolute;
    top: 5px;
    left: 5px;
    font-size: 18px;
    color: #0f0;
  }
  #scoreBoard div {
    margin: 2px 0;
  }
  #menuScreen, #gameOverScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 600px;
    height: 600px;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #eee;
  }
  #menuScreen h1, #gameOverScreen h1 {
    font-size: 48px;
    margin-bottom: 20px;
  }
  #menuScreen label, #menuScreen select {
    font-size: 20px;
    margin: 10px;
  }
  .btn {
    background-color: #0a0;
    border: none;
    color: white;
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
    margin-top: 20px;
    border-radius: 5px;
  }
  .btn:hover {
    background-color: #0f0;
    color: #000;
  }
</style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="scoreBoard" hidden>
      <div id="score1">Player 1: 0</div>
      <div id="score2">Player 2: 0</div>
    </div>
    <div id="menuScreen">
      <h1>Snake Game</h1>
      <label for="modeSelect">Select Game Mode:</label>
      <select id="modeSelect">
        <option value="human_vs_human">Human vs Human</option>
        <option value="cpu_vs_human">CPU vs Human</option>
        <option value="cpu_vs_cpu">CPU vs CPU</option>
      </select>
      <button id="startBtn" class="btn">Start Game</button>
      <div style="font-size:14px; color:#ccc; margin-top:10px; max-width:400px; text-align:center;">
        Controls:<br />
        Player 1: Arrow keys<br />
        Player 2 (if human): WASD keys<br />
        Restart after game over: press R
      </div>
    </div>
    <div id="gameOverScreen" hidden>
      <h1>Game Over</h1>
      <div id="winnerText" style="font-size:24px; margin-bottom:20px;"></div>
      <div>Press "R" to Restart</div>
    </div>
  </div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const gridSize = 30;
  const cellSize = canvas.width / gridSize;

  const scoreBoard = document.getElementById('scoreBoard');
  const score1Display = document.getElementById('score1');
  const score2Display = document.getElementById('score2');
  const menuScreen = document.getElementById('menuScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const winnerText = document.getElementById('winnerText');
  const modeSelect = document.getElementById('modeSelect');
  const startBtn = document.getElementById('startBtn');

  const directions = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    KeyW: { x: 0, y: -1 },
    KeyS: { x: 0, y: 1 },
    KeyA: { x: -1, y: 0 },
    KeyD: { x: 1, y: 0 },
  };

  // Game state
  let snakes = [];
  let foods = [];
  let scores = [0,0];
  let gameInterval = null;
  let gameSpeed = 100; // ms per frame
  let gameMode = 'human_vs_human';
  let gameRunning = false;

  // Helper Functions
  function randomPosition() {
    return {
      x: Math.floor(Math.random() * gridSize),
      y: Math.floor(Math.random() * gridSize)
    };
  }

  function positionsEqual(p1, p2) {
    return p1.x === p2.x && p1.y === p2.y;
  }

  // Snake class
  class Snake {
    constructor(startPos, direction, isCPU, controls) {
      this.body = [startPos];
      this.direction = direction; // {x,y}
      this.nextDirection = direction;
      this.isCPU = isCPU;
      this.controls = controls; // object with keys for controls if human
      this.growSegments = 0;
      this.alive = true;
    }

    setDirection(newDir) {
      // Prevent reverse direction
      if ((newDir.x === -this.direction.x && newDir.y === -this.direction.y) ||
          (newDir.x === 0 && newDir.y === 0)) {
        return;
      }
      this.nextDirection = newDir;
    }

    move() {
      if (!this.alive) return;
      this.direction = this.nextDirection;
      const head = this.body[0];
      const newHead = { x: head.x + this.direction.x, y: head.y + this.direction.y };

      // Check collisions with walls
      if (newHead.x < 0 || newHead.x >= gridSize || newHead.y < 0 || newHead.y >= gridSize) {
        this.alive = false;
        return;
      }

      // Check collisions with self
      for (let segment of this.body) {
        if (positionsEqual(segment, newHead)) {
          this.alive = false;
          return;
        }
      }

      // Move snake
      this.body.unshift(newHead);
      if (this.growSegments > 0) {
        this.growSegments--;
      } else {
        this.body.pop();
      }
    }

    grow() {
      this.growSegments++;
    }

    head() {
      return this.body[0];
    }

    occupiesPosition(pos) {
      for (let segment of this.body) {
        if (positionsEqual(segment, pos)) return true;
      }
      return false;
    }
  }

  // Food
  function placeFood() {
    let pos;
    do {
      pos = randomPosition();
    } while (snakes.some(snake => snake.occupiesPosition(pos)) || foods.some(food => positionsEqual(food, pos)));
    foods.push(pos);
  }

  // CPU snake AI: simple pathfinding - greedy move towards food
  function cpuDecideDirection(snake, food) {
    if (!snake.alive) return;
    const head = snake.head();
    const target = food;

    // Possible directions
    const possibleDirs = [
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: 0 },
      { x: 1, y: 0 }
    ];

    // Filter directions that don't reverse
    const filteredDirs = possibleDirs.filter(d => !(d.x === -snake.direction.x && d.y === -snake.direction.y));

    // Sort directions by distance to food
    filteredDirs.sort((a, b) => {
      let distA = Math.abs(head.x + a.x - target.x) + Math.abs(head.y + a.y - target.y);
      let distB = Math.abs(head.x + b.x - target.x) + Math.abs(head.y + b.y - target.y);
      return distA - distB;
    });

    for (let dir of filteredDirs) {
      const nextPos = { x: head.x + dir.x, y: head.y + dir.y };
      // Check wall collisions
      if (nextPos.x < 0 || nextPos.x >= gridSize || nextPos.y < 0 || nextPos.y >= gridSize) continue;

      // Check self collisions
      if (snake.body.some(seg => positionsEqual(seg, nextPos))) continue;

      // Check collisions with other snakes
      let collidesOther = false;
      for (let otherSnake of snakes) {
        if (otherSnake !== snake && otherSnake.body.some(seg => positionsEqual(seg, nextPos))) {
          collidesOther = true;
          break;
        }
      }
      if (collidesOther) continue;

      snake.setDirection(dir);
      return;
    }

    // No safe moves, keep current direction or stop
  }

  // Game loop
  function gameLoop() {
    if (!gameRunning) return;

    // CPU snakes decide directions
    snakes.forEach((snake, i) => {
      if (snake.isCPU && snake.alive) {
        cpuDecideDirection(snake, foods[i] || foods[0]);
      }
    });

    // Move snakes
    snakes.forEach(snake => snake.move());

    // Check collisions between snakes
    for (let i = 0; i < snakes.length; i++) {
      const s1 = snakes[i];
      if (!s1.alive) continue;
      for (let j = 0; j < snakes.length; j++) {
        if (i === j) continue;
        const s2 = snakes[j];
        if (!s2.alive) continue;
        // If s1 head hits s2 body
        if (s2.body.some(seg => positionsEqual(seg, s1.head()))) {
          s1.alive = false;
          break;
        }
      }
    }

    // Check food collisions
    snakes.forEach((snake, i) => {
      if (!snake.alive) return;
      for (let f = 0; f < foods.length; f++) {
        if (positionsEqual(snake.head(), foods[f])) {
          snake.grow();
          scores[i]++;
          foods.splice(f, 1);
          placeFood();
          break;
        }
      }
    });

    // Draw
    draw();

    // Check game over
    if (snakes.every(s => !s.alive)) {
      endGame();
    }
  }

  // Drawing
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw food
    foods.forEach(food => {
      ctx.fillStyle = '#f00';
      ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);
    });

    // Draw snakes
    snakes.forEach((snake, i) => {
      ctx.fillStyle = snake.isCPU ? (i === 0 ? '#00f' : '#0ff') : (i === 0 ? '#0f0' : '#ff0');
      snake.body.forEach(segment => {
        ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
      });
    });

    // Update scores
    score1Display.textContent = `Player 1: ${scores[0]}`;
    score2Display.textContent = `Player 2: ${scores[1]}`;
  }

  // Start game
  function startGame() {
    // Init snakes
    snakes = [];
    scores = [0, 0];
    foods = [];

    gameMode = modeSelect.value;

    // Setup snakes based on mode
    if (gameMode === 'human_vs_human') {
      snakes.push(new Snake({ x: 5, y: 15 }, directions.ArrowRight, false, { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }));
      snakes.push(new Snake({ x: 25, y: 15 }, directions.KeyA, false, { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }));
    } else if (gameMode === 'cpu_vs_human') {
      snakes.push(new Snake({ x: 5, y: 15 }, directions.ArrowRight, true, null));
      snakes.push(new Snake({ x: 25, y: 15 }, directions.KeyA, false, { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }));
    } else if (gameMode === 'cpu_vs_cpu') {
      snakes.push(new Snake({ x: 5, y: 15 }, directions.ArrowRight, true, null));
      snakes.push(new Snake({ x: 25, y: 15 }, directions.KeyA, true, null));
    }

    placeFood();

    scoreBoard.hidden = false;
    menuScreen.hidden = true;
    gameOverScreen.hidden = true;

    gameRunning = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, gameSpeed);
  }

  // End game
  function endGame() {
    gameRunning = false;
    clearInterval(gameInterval);

    // Determine winner
    let aliveCount = snakes.filter(s => s.alive).length;
    let winner = null;
    if (aliveCount === 1) {
      winner = snakes.findIndex(s => s.alive);
    } else if (aliveCount === 0) {
      // No alive snakes, find max score
      if (scores[0] > scores[1]) winner = 0;
      else if (scores[1] > scores[0]) winner = 1;
    }

    if (winner !== null) {
      winnerText.textContent = `Winner: Player ${winner + 1}`;
    } else {
      winnerText.textContent = `Draw!`;
    }

    gameOverScreen.hidden = false;
  }

  // Handle keyboard input
  window.addEventListener('keydown', e => {
    if (gameRunning) {
      snakes.forEach(snake => {
        if (!snake.isCPU && snake.alive && snake.controls) {
          if (e.code === snake.controls.up) snake.setDirection(directions[snake.controls.up]);
          else if (e.code === snake.controls.down) snake.setDirection(directions[snake.controls.down]);
          else if (e.code === snake.controls.left) snake.setDirection(directions[snake.controls.left]);
          else if (e.code === snake.controls.right) snake.setDirection(directions[snake.controls.right]);
        }
      });
    } else {
      // Restart game on R
      if (e.code === 'KeyR' && !menuScreen.hidden) {
        startGame();
      } else if (e.code === 'KeyR' && !gameRunning && !menuScreen.hidden) {
        startGame();
      } else if (e.code === 'KeyR' && !menuScreen.hidden) {
        startGame();
      } else if (e.code === 'KeyR' && !gameOverScreen.hidden) {
        startGame();
      }
    }
  });

  startBtn.addEventListener('click', () => {
    startGame();
  });

})();
</script>
</body>
</html>
