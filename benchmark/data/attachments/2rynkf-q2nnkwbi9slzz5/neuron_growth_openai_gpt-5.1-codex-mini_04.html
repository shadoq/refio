<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Neuron Growth</title>
  <style>
    :root {
      --bg-color: #05070f;
      --glow-color: #101a3a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-color);
      color: #f4f7ff;
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.04), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(255, 255, 255, 0.07), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }
    #scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 1;
    }
    #canvasWrap {
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(16, 26, 58, 0.9), rgba(5, 7, 15, 0.98));
      padding: 18px;
      border-radius: 26px;
      box-shadow: 0 30px 60px rgba(5, 7, 15, 0.45), inset 0 0 70px rgba(0, 229, 255, 0.2);
    }
    #neuronCanvas {
      display: block;
      width: 800px;
      height: 800px;
      border-radius: 20px;
      box-shadow:
        0 0 20px rgba(0, 229, 255, 0.54),
        0 0 45px rgba(255, 43, 214, 0.3),
        0 20px 30px rgba(0, 0, 0, 0.8);
      background: transparent;
    }
    #gui-container {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 5;
    }
    #gui-container .dg {
      border-radius: 10px;
      background: rgba(5, 7, 15, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }
    @media (max-width: 900px) {
      body {
        padding: 1rem;
      }
      #neuronCanvas {
        width: 90vw;
        height: 90vw;
      }
      #canvasWrap {
        padding: 12px;
      }
      #gui-container {
        position: static;
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="scene">
    <div id="canvasWrap">
      <canvas id="neuronCanvas" width="800" height="800"></canvas>
    </div>
    <div id="gui-container"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('neuronCanvas');
      const ctx = canvas.getContext('2d');
      const gridColor = 'rgba(0, 229, 255, 0.08)';
      const maxBranches = 520;
      let branchIdCounter = 0;
      let branchList = [];
      let pulses = [];
      let synapseStore = new Map();
      let synapses = [];
      let paused = false;
      let lastTimestamp = 0;

      const params = {
        neuronCount: 5,
        branchGrowthSpeed: 1.1,
        maxBranchDepth: 4,
        branchSplitChance: 0.28,
        branchCurvature: 0.6,
        maxBranchLength: 120,
        synapseDistanceThreshold: 38,
        synapseGlowStrength: 1.0,
        pulseSpeed: 0.02,
        pulseFrequency: 0.08,
        pulseBrightness: 1.0,
        backgroundColor: '#05070f',
        branchColor: '#00e5ff',
        accentBranchColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a'
      };

      function randRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function distance(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function updateTheme() {
        document.documentElement.style.setProperty('--bg-color', params.backgroundColor);
        document.body.style.background = params.backgroundColor;
      }

      function clearCanvasSurface() {
        branchList = [];
        pulses = [];
        synapseStore.clear();
        synapses = [];
        branchIdCounter = 0;
        lastTimestamp = 0;
        ctx.fillStyle = params.backgroundColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      class Branch {
        constructor(x, y, angle, depth, accent = false) {
          this.id = branchIdCounter++;
          this.points = [{ x, y }];
          this.angle = angle;
          this.depth = depth;
          this.accent = accent;
          this.maxLength = randRange(params.maxBranchLength * 0.6, params.maxBranchLength);
          this.thickness = Math.max(1, (params.maxBranchDepth - depth) * 0.9 + 1.3) + Math.random() * 0.8;
          this.length = 0;
          this.done = false;
          this.tip = { x, y };
        }
        update(delta) {
          if (this.done) {
            return [];
          }
          const step = (params.branchGrowthSpeed * 1 + Math.random() * 0.7) * delta;
          const last = this.points[this.points.length - 1];
          const variance = (Math.random() - 0.5) * params.branchCurvature;
          this.angle += variance * 0.4;
          const nx = last.x + Math.cos(this.angle) * step;
          const ny = last.y + Math.sin(this.angle) * step;
          const clampedX = Math.max(0, Math.min(canvas.width, nx));
          const clampedY = Math.max(0, Math.min(canvas.height, ny));
          this.points.push({ x: clampedX, y: clampedY });
          this.tip = { x: clampedX, y: clampedY };
          this.length += step;
          const boundaryHit = clampedX <= 0 || clampedX >= canvas.width || clampedY <= 0 || clampedY >= canvas.height;
          if (this.length >= this.maxLength || this.depth >= params.maxBranchDepth || boundaryHit) {
            this.done = true;
          }
          const newBranches = [];
          if (!this.done && this.depth < params.maxBranchDepth && branchList.length < maxBranches) {
            if (Math.random() < params.branchSplitChance * 0.02) {
              const angleOffset = (Math.random() - 0.5) * 1.8 + Math.sign(variance) * 0.2;
              newBranches.push(new Branch(clampedX, clampedY, this.angle + angleOffset, this.depth + 1, Math.random() < 0.5));
            }
            if (Math.random() < params.branchSplitChance * 0.01) {
              const smallAngle = this.angle + (Math.random() - 0.5) * 1.4;
              newBranches.push(new Branch(clampedX, clampedY, smallAngle, this.depth + 1, true));
            }
          }
          return newBranches;
        }
      }

      class Synapse {
        constructor(aBranch, bBranch) {
          this.aBranch = aBranch;
          this.bBranch = bBranch;
          this.key = aBranch.id < bBranch.id ? `${aBranch.id}-${bBranch.id}` : `${bBranch.id}-${aBranch.id}`;
          this.phase = Math.random() * Math.PI * 2;
        }
        getPoints() {
          return {
            a: this.aBranch.tip,
            b: this.bBranch.tip
          };
        }
      }

      class Pulse {
        constructor(synapse, direction = 1) {
          this.synapse = synapse;
          this.direction = direction;
          this.progress = direction === 1 ? 0 : 1;
          this.size = randRange(2.5, 5.5);
        }
        update(delta) {
          this.progress += this.direction * params.pulseSpeed * delta * 0.8;
        }
        getPosition() {
          const { a, b } = this.synapse.getPoints();
          const t = Math.min(1, Math.max(0, this.progress));
          return {
            x: lerp(a.x, b.x, t),
            y: lerp(a.y, b.y, t)
          };
        }
      }

      function spawnPulse(synapse) {
        const direction = Math.random() < 0.5 ? 1 : -1;
        pulses.push(new Pulse(synapse, direction));
      }

      function detectSynapses() {
        const newMap = new Map();
        const tips = branchList;
        for (let i = 0; i < tips.length; i++) {
          const branchA = tips[i];
          for (let j = i + 1; j < tips.length; j++) {
            const branchB = tips[j];
            if (branchA.id === branchB.id) {
              continue;
            }
            const d = distance(branchA.tip, branchB.tip);
            if (d <= params.synapseDistanceThreshold) {
              const key = branchA.id < branchB.id ? `${branchA.id}-${branchB.id}` : `${branchB.id}-${branchA.id}`;
              let synapse = synapseStore.get(key);
              if (!synapse) {
                synapse = new Synapse(branchA, branchB);
              }
              newMap.set(key, synapse);
            }
          }
        }
        synapseStore = newMap;
        synapses = Array.from(synapseStore.values());
      }

      function resetNetwork() {
        branchList = [];
        pulses = [];
        synapseStore.clear();
        synapses = [];
        branchIdCounter = 0;
        const center = { x: canvas.width / 2, y: canvas.height / 2 };
        const seeds = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
        for (let i = 0; i < seeds; i++) {
          const angle = Math.random() * Math.PI * 2;
          const distanceFromCenter = randRange(0, 45);
          const startX = center.x + Math.cos(angle) * distanceFromCenter;
          const startY = center.y + Math.sin(angle) * distanceFromCenter;
          const baseAngle = angle + randRange(-0.6, 0.6);
          branchList.push(new Branch(startX, startY, baseAngle, 0, false));
        }
      }

      function update(delta) {
        if (!branchList.length) {
          return;
        }
        const additions = [];
        for (const branch of branchList) {
          const spawned = branch.update(delta);
          for (const nextBranch of spawned) {
            if (branchList.length + additions.length < maxBranches) {
              additions.push(nextBranch);
            }
          }
        }
        if (additions.length) {
          branchList = branchList.concat(additions);
        }
        detectSynapses();
        for (const synapse of synapses) {
          if (Math.random() < params.pulseFrequency * delta * 0.5) {
            spawnPulse(synapse);
          }
        }
        pulses = pulses.filter((pulse) => {
          if (!synapseStore.has(pulse.synapse.key)) {
            return false;
          }
          pulse.update(delta);
          return pulse.progress > -0.25 && pulse.progress < 1.25;
        });
      }

      function draw(time) {
        const glow = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2, canvas.height / 2, 520);
        glow.addColorStop(0, '#101a3a');
        glow.addColorStop(0.75, '#101a3a');
        glow.addColorStop(1, params.backgroundColor);
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.restore();

        for (const branch of branchList) {
          if (branch.points.length < 2) {
            continue;
          }
          ctx.save();
          ctx.strokeStyle = branch.accent ? params.accentBranchColor : params.branchColor;
          ctx.lineWidth = branch.thickness;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(branch.points[0].x, branch.points[0].y);
          for (let i = 1; i < branch.points.length; i++) {
            const prev = branch.points[i - 1];
            const current = branch.points[i];
            const midX = (prev.x + current.x) / 2;
            const midY = (prev.y + current.y) / 2;
            ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
          }
          const tail = branch.points[branch.points.length - 1];
          ctx.lineTo(tail.x, tail.y);
          ctx.stroke();
          ctx.restore();
        }

        synapses.forEach((synapse) => {
          const { a, b } = synapse.getPoints();
          const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          const glowPhase = (Math.sin(time * 3 + synapse.phase) + 1) / 2;
          ctx.save();
          ctx.strokeStyle = params.synapseColor;
          ctx.lineWidth = 1.6;
          ctx.shadowColor = params.synapseColor;
          ctx.shadowBlur = 12 + glowPhase * 18 * params.synapseGlowStrength;
          ctx.globalAlpha = 0.15 + glowPhase * 0.5 * params.synapseGlowStrength;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.beginPath();
          ctx.globalAlpha = 0.6 + glowPhase * 0.4;
          ctx.fillStyle = params.synapseColor;
          ctx.arc(mid.x, mid.y, 2 + glowPhase * 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        pulses.forEach((pulse) => {
          const position = pulse.getPosition();
          ctx.save();
          ctx.fillStyle = params.pulseColor;
          ctx.shadowColor = params.pulseColor;
          ctx.shadowBlur = 14 + pulse.size * 2;
          ctx.globalAlpha = Math.min(1, 0.4 * params.pulseBrightness + 0.2);
          ctx.beginPath();
          ctx.arc(position.x, position.y, pulse.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      const gui = new dat.GUI({ autoPlace: false });
      document.getElementById('gui-container').appendChild(gui.domElement);

      const growthFolder = gui.addFolder('Growth');
      growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(resetNetwork);
      growthFolder.add(params, 'branchGrowthSpeed', 0.3, 2.8, 0.05).name('Growth Speed');
      growthFolder.add(params, 'maxBranchDepth', 2, 7, 1).name('Max Branch Depth').onChange(resetNetwork);
      growthFolder.add(params, 'branchSplitChance', 0, 0.6, 0.01).name('Branch Split Chance');
      growthFolder.add(params, 'branchCurvature', 0, 1.8, 0.05).name('Branch Curvature');
      growthFolder.add(params, 'maxBranchLength', 40, 220, 5).name('Max Branch Length');
      growthFolder.open();

      const synapseFolder = gui.addFolder('Synapses');
      synapseFolder.add(params, 'synapseDistanceThreshold', 12, 60, 1).name('Distance Threshold');
      synapseFolder.add(params, 'synapseGlowStrength', 0, 2, 0.05).name('Synapse Glow');
      synapseFolder.open();

      const pulsesFolder = gui.addFolder('Pulses');
      pulsesFolder.add(params, 'pulseSpeed', 0.002, 0.12, 0.002).name('Pulse Speed');
      pulsesFolder.add(params, 'pulseFrequency', 0, 0.24, 0.01).name('Pulse Frequency');
      pulsesFolder.add(params, 'pulseBrightness', 0.3, 1.8, 0.05).name('Pulse Brightness');
      pulsesFolder.open();

      const visualsFolder = gui.addFolder('Visuals');
      visualsFolder.addColor(params, 'backgroundColor').name('Background').onChange(updateTheme);
      visualsFolder.addColor(params, 'branchColor').name('Branch Color');
      visualsFolder.addColor(params, 'accentBranchColor').name('Accent Color');
      visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
      visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
      visualsFolder.open();

      const controls = {
        regenerate() {
          resetNetwork();
        },
        clearCanvas() {
          clearCanvasSurface();
        },
        pauseResume() {
          paused = !paused;
        }
      };

      gui.add(controls, 'regenerate').name('Regenerate Network');
      gui.add(controls, 'clearCanvas').name('Clear Canvas');
      gui.add(controls, 'pauseResume').name('Pause / Resume');

      function animate(timestamp) {
        requestAnimationFrame(animate);
        const delta = lastTimestamp ? Math.min(1.6, (timestamp - lastTimestamp) / 16.666) : 1;
        lastTimestamp = timestamp;
        if (!paused) {
          update(delta);
        }
        draw(timestamp * 0.001);
      }

      updateTheme();
      resetNetwork();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
