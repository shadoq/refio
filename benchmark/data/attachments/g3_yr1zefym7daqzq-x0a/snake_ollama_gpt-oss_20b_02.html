<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body{font-family:Arial, sans-serif;text-align:center;background:#222;color:#fff;margin:0;}
  #menu, #gameOver{display:none;}
  canvas{background:#000;margin:20px auto;display:block;}
  button{padding:10px 20px;margin:5px;font-size:16px;}
  #scoreboard{font-size:18px;margin:10px;}
</style>
</head>
<body>
<h1>Snake Game</h1>
<div id="menu">
  <p>Select Mode:</p>
  <button id="mode1">Human vs Human</button>
  <button id="mode2">CPU vs Human</button>
  <button id="mode3">CPU vs CPU</button>
</div>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<div id="scoreboard"></div>
<div id="gameOver">
  <p id="gameOverText"></p>
  <p>Press R to Restart</p>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreboard = document.getElementById('scoreboard');
const gameOverDiv = document.getElementById('gameOver');
const gameOverText = document.getElementById('gameOverText');
const menuDiv = document.getElementById('menu');

const gridSize = 30;
const cellSize = 20;
const moveInterval = 150;

let gameInterval = null;
let mode = null; // 1: HVH, 2: CVH, 3: CVCPU
let snakes = [];
let food = null;
let running = false;

class Snake {
  constructor(isCPU, controls) {
    this.body = [{x: Math.floor(gridSize/2), y: Math.floor(gridSize/2)}];
    this.direction = {x: 0, y: 0};
    this.pendingDir = {x: 0, y: 0};
    this.isCPU = isCPU;
    this.controls = controls; // {up, down, left, right}
    this.score = 0;
    this.alive = true;
    this.grow = false;
  }
  setDirection(dx, dy) {
    // Prevent reversing
    if (this.body.length > 1) {
      const head = this.body[0];
      const neck = this.body[1];
      if (head.x + dx === neck.x && head.y + dy === neck.y) return;
    }
    this.pendingDir = {x: dx, y: dy};
  }
  move() {
    if (!this.alive) return;
    if (this.isCPU) {
      this.cpuMove();
    } else {
      this.direction = this.pendingDir;
    }
    const newHead = {
      x: this.body[0].x + this.direction.x,
      y: this.body[0].y + this.direction.y
    };
    this.body.unshift(newHead);
    if (this.grow) {
      this.grow = false;
    } else {
      this.body.pop();
    }
  }
  cpuMove() {
    const head = this.body[0];
    let dx = 0, dy = 0;
    if (food.x > head.x) dx = 1;
    else if (food.x < head.x) dx = -1;
    if (food.y > head.y) dy = 1;
    else if (food.y < head.y) dy = -1;
    // If both dx and dy are zero, pick random
    if (dx === 0 && dy === 0) {
      const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      dx = dir.x; dy = dir.y;
    }
    this.direction = {x: dx, y: dy};
  }
}

function initGame(selectedMode) {
  mode = selectedMode;
  snakes = [];
  if (mode === 1) {
    snakes.push(new Snake(false, {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'}));
    snakes.push(new Snake(false, {up:'w', down:'s', left:'a', right:'d'}));
  } else if (mode === 2) {
    snakes.push(new Snake(false, {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'}));
    snakes.push(new Snake(true, null));
  } else if (mode === 3) {
    snakes.push(new Snake(true, null));
    snakes.push(new Snake(true, null));
  }
  placeFood();
  running = true;
  scoreboard.innerHTML = '';
  gameOverDiv.style.display = 'none';
  canvas.style.display = 'block';
  if (gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, moveInterval);
}

function placeFood() {
  let empty = true;
  while (empty) {
    const x = Math.floor(Math.random()*gridSize);
    const y = Math.floor(Math.random()*gridSize);
    empty = true;
    for (const s of snakes) {
      for (const p of s.body) {
        if (p.x === x && p.y === y) {
          empty = false;
          break;
        }
      }
      if (!empty) break;
    }
    if (empty) food = {x, y};
  }
}

function gameLoop() {
  for (const s of snakes) s.move();
  checkCollisions();
  draw();
  updateScoreboard();
}

function checkCollisions() {
  for (const s of snakes) {
    if (!s.alive) continue;
    const head = s.body[0];
    // Wall collision
    if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
      s.alive = false;
      continue;
    }
    // Self collision
    for (let i = 1; i < s.body.length; i++) {
      if (head.x === s.body[i].x && head.y === s.body[i].y) {
        s.alive = false;
        break;
      }
    }
    if (!s.alive) continue;
    // Other snake collision
    for (const other of snakes) {
      if (other === s || !other.alive) continue;
      for (const p of other.body) {
        if (head.x === p.x && head.y === p.y) {
          s.alive = false;
          break;
        }
      }
      if (!s.alive) break;
    }
    if (!s.alive) continue;
    // Food collision
    if (head.x === food.x && head.y === food.y) {
      s.grow = true;
      s.score += 1;
      placeFood();
    }
  }
  // Check if all dead
  if (snakes.every(s => !s.alive)) {
    endGame();
  }
}

function endGame() {
  running = false;
  clearInterval(gameInterval);
  canvas.style.display = 'none';
  let text = '';
  const scores = snakes.map(s => s.score);
  if (scores[0] > scores[1]) text = 'Snake 1 Wins!';
  else if (scores[1] > scores[0]) text = 'Snake 2 Wins!';
  else text = 'It\'s a Tie!';
  gameOverText.textContent = text;
  gameOverDiv.style.display = 'block';
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Draw food
  ctx.fillStyle = 'red';
  ctx.fillRect(food.x*cellSize, food.y*cellSize, cellSize, cellSize);
  // Draw snakes
  for (const s of snakes) {
    ctx.fillStyle = s.alive ? 'lime' : 'gray';
    for (const p of s.body) {
      ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
    }
  }
}

function updateScoreboard() {
  scoreboard.innerHTML = `Snake 1: ${snakes[0].score} | Snake 2: ${snakes[1].score}`;
}

function handleKey(e) {
  if (!running) {
    if (e.key.toLowerCase() === 'r') {
      initGame(mode);
    }
    return;
  }
  const key = e.key;
  // Human vs Human
  if (mode === 1) {
    if (key === snakes[0].controls.up) snakes[0].setDirection(0,-1);
    else if (key === snakes[0].controls.down) snakes[0].setDirection(0,1);
    else if (key === snakes[0].controls.left) snakes[0].setDirection(-1,0);
    else if (key === snakes[0].controls.right) snakes[0].setDirection(1,0);
    if (key === snakes[1].controls.up) snakes[1].setDirection(0,-1);
    else if (key === snakes[1].controls.down) snakes[1].setDirection(0,1);
    else if (key === snakes[1].controls.left) snakes[1].setDirection(-1,0);
    else if (key === snakes[1].controls.right) snakes[1].setDirection(1,0);
  } else if (mode === 2) {
    if (key === snakes[0].controls.up) snakes[0].setDirection(0,-1);
    else if (key === snakes[0].controls.down) snakes[0].setDirection(0,1);
    else if (key === snakes[0].controls.left) snakes[0].setDirection(-1,0);
    else if (key === snakes[0].controls.right) snakes[0].setDirection(1,0);
  } else if (mode === 3) {
    // No human controls
  }
  if (key.toLowerCase() === 'r' && !running) {
    initGame(mode);
  }
}

document.addEventListener('keydown', handleKey);

document.getElementById('mode1').addEventListener('click', () => {
  menuDiv.style.display = 'none';
  initGame(1);
});
document.getElementById('mode2').addEventListener('click', () => {
  menuDiv.style.display = 'none';
  initGame(2);
});
document.getElementById('mode3').addEventListener('click', () => {
  menuDiv.style.display = 'none';
  initGame(3);
});
</script>
</body>
</html>
