<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIP-8 Emulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
    padding: 10px;
  }
  h1 {
    text-align: center;
    color: #00d4ff;
    font-size: 22px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #00d4ff44;
  }
  .main-layout {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 540px;
  }
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 300px;
    max-width: 340px;
  }
  .panel {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 8px;
  }
  .panel-title {
    color: #00d4ff;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    border-bottom: 1px solid #0f3460;
    padding-bottom: 4px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    border: 2px solid #0f3460;
    background: #000;
  }
  .canvas-wrap {
    display: flex;
    justify-content: center;
  }
  .controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #00d4ff44;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: background 0.15s;
  }
  button:hover { background: #1a5276; }
  button.active { background: #1a6b3c; border-color: #2ecc71; }
  button:disabled { opacity: 0.4; cursor: default; }
  .speed-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  input[type=range] {
    width: 90px;
    accent-color: #00d4ff;
  }
  .file-label {
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #00d4ff44;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: background 0.15s;
  }
  .file-label:hover { background: #1a5276; }
  input[type=file] { display: none; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .key {
    background: #0f3460;
    border: 1px solid #1a4a7a;
    border-radius: 4px;
    padding: 6px 4px;
    text-align: center;
    font-size: 11px;
    line-height: 1.3;
    transition: background 0.05s;
    user-select: none;
  }
  .key.pressed { background: #00d4ff; color: #000; }
  .key-top { font-weight: bold; font-size: 12px; }
  .key-bot { color: #888; font-size: 10px; }
  .key.pressed .key-bot { color: #333; }
  .reg-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }
  .reg-cell {
    background: #0a1628;
    border: 1px solid #0f3460;
    border-radius: 3px;
    padding: 3px 5px;
    font-size: 11px;
  }
  .reg-name { color: #00d4ff; font-size: 10px; }
  .reg-val { color: #f0f0f0; }
  .stack-list {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .stack-item {
    background: #0a1628;
    border: 1px solid #0f3460;
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 11px;
    color: #aaa;
  }
  .info-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .info-cell {
    background: #0a1628;
    border: 1px solid #0f3460;
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 11px;
  }
  .info-label { color: #00d4ff; }
  .info-val { color: #f0f0f0; }
  .disasm {
    background: #0a1628;
    border: 1px solid #0f3460;
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 12px;
    color: #f0c040;
    min-height: 20px;
    word-break: break-all;
  }
  .status-bar {
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 2px;
  }
  .status-bar span { color: #00d4ff; }
</style>

<body>
<h1>CHIP-8 Emulator</h1>
<div class="main-layout">
  <div class="left-panel">
    <div class="panel">
      <div class="panel-title">Display</div>
      <div class="canvas-wrap">
        <canvas id="screen" width="640" height="320"></canvas>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Controls</div>
      <div class="controls">
        <button id="btnRun">▶ Run</button>
        <button id="btnPause">⏸ Pause</button>
        <button id="btnStep">⏭ Step</button>
        <button id="btnReset">↺ Reset</button>
        <label class="file-label">📂 Load ROM<input type="file" id="fileInput" accept=".ch8,.rom,.bin"></label>
        <button id="btnDemo">★ Demo ROM</button>
        <div class="speed-wrap">
          <span>Speed:</span>
          <input type="range" id="speedSlider" min="1" max="50" value="10">
          <span id="speedVal">10</span> i/f
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Keypad (CHIP-8 → Keyboard)</div>
      <div class="keypad" id="keypad"></div>
    </div>
    <div class="panel status-bar" id="statusBar">Status: <span id="statusText">Ready</span></div>
  </div>
  <div class="right-panel">
    <div class="panel">
      <div class="panel-title">CPU State</div>
      <div class="info-row">
        <div class="info-cell"><span class="info-label">PC: </span><span class="info-val" id="dbgPC">0x200</span></div>
        <div class="info-cell"><span class="info-label">I: </span><span class="info-val" id="dbgI">0x000</span></div>
        <div class="info-cell"><span class="info-label">DT: </span><span class="info-val" id="dbgDT">0</span></div>
        <div class="info-cell"><span class="info-label">ST: </span><span class="info-val" id="dbgST">0</span></div>
        <div class="info-cell"><span class="info-label">SP: </span><span class="info-val" id="dbgSP">0</span></div>
      </div>
      <div class="panel-title" style="margin-top:6px;">Registers</div>
      <div class="reg-grid" id="regGrid"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Stack</div>
      <div class="stack-list" id="stackList"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Current Instruction</div>
      <div class="disasm" id="disasm">---</div>
    </div>
  </div>
</div>

<script>
// ─── CHIP-8 FONT SET ───────────────────────────────────────────────────────
const FONT_SET = [
  0xF0,0x90,0x90,0x90,0xF0, // 0
  0x20,0x60,0x20,0x20,0x70, // 1
  0xF0,0x10,0xF0,0x80,0xF0, // 2
  0xF0,0x10,0xF0,0x10,0xF0, // 3
  0x90,0x90,0xF0,0x10,0x10, // 4
  0xF0,0x80,0xF0,0x10,0xF0, // 5
  0xF0,0x80,0xF0,0x90,0xF0, // 6
  0xF0,0x10,0x20,0x40,0x40, // 7
  0xF0,0x90,0xF0,0x90,0xF0, // 8
  0xF0,0x90,0xF0,0x10,0xF0, // 9
  0xF0,0x90,0xF0,0x90,0x90, // A
  0xE0,0x90,0xE0,0x90,0xE0, // B
  0xF0,0x80,0x80,0x80,0xF0, // C
  0xE0,0x90,0x90,0x90,0xE0, // D
  0xF0,0x80,0xF0,0x80,0xF0, // E
  0xF0,0x80,0xF0,0x80,0x80  // F
];

// ─── DEMO ROM ──────────────────────────────────────────────────────────────
// A CHIP-8 program that:
// 1. Draws a smiley face sprite at center screen
// 2. Moves it with keys 5(up),8(down),7(left),9(right) [mapped to W,S,A,D]
// Assembled CHIP-8 bytecode:
//
// ; Sprite data at 0x200 (8 bytes = smiley face)
// ; Program starts at 0x208
//
// Sprite (8x8 smiley, stored at 0x200):
//   0x3C = 00111100
//   0x42 = 01000010
//   0xA5 = 10100101
//   0x81 = 10000001
//   0xA5 = 10100101
//   0x99 = 10011001
//   0x42 = 01000010
//   0x3C = 00111100
//
// Program at 0x208:
//   6028  V0 = 28 (x=40, center)
//   6110  V1 = 10 (y=16, center)
//   A200  I = 0x200 (sprite addr)
//   D018  draw V0,V1,8
// loop:
//   6200  V2 = 0
//   E59E  skip if key V5 pressed  (key 5 = W)
//   -> check 8 (S), 7 (A), 9 (D)
// We'll use a simpler approach with key polling:
//   ; Check key 5 (W=up)
//   6205  V2=5
//   E29E  skip if key[V2] pressed
//   1228  jump past up-move
//   D018  erase
//   7100  V1 -= 1 (using 7x = Vx+kk, but we need subtract)
//   Actually use: V1 = V1 - 1 via 8xy5
//   ...
// Let's just encode the full thing as bytes directly:

const DEMO_ROM = new Uint8Array([
  // Sprite data at 0x200 (smiley face 8x8):
  0x3C, 0x42, 0xA5, 0x81, 0xA5, 0x99, 0x42, 0x3C,

  // Program starts at 0x208:
  // 6028: V0 = 0x28 = 40 (x position)
  0x60, 0x28,
  // 6110: V1 = 0x0C = 12 (y position)
  0x61, 0x0C,
  // A200: I = 0x200
  0xA2, 0x00,
  // D018: draw sprite at V0,V1, height=8
  0xD0, 0x18,

  // Main loop at 0x210:
  // Check key 5 (CHIP-8 key 5 = keyboard W) for UP
  // 6205: V2 = 5
  0x62, 0x05,
  // E29E: skip next if key[V2] pressed
  0xE2, 0x9E,
  // 1220: jump to check-down (skip the up movement)
  0x12, 0x20,
  // Erase old sprite: A200, D018
  0xA2, 0x00,
  0xD0, 0x18,
  // 71FF: V1 = V1 + 0xFF = V1 - 1
  0x71, 0xFF,
  // Clamp: if V1 > 200 (wrapped), set to 0
  // 3100: skip if V1 == 0 (already 0, no clamp needed for simplicity)
  // Redraw: A200, D018
  0xA2, 0x00,
  0xD0, 0x18,

  // Check key 8 (CHIP-8 key 8 = keyboard S) for DOWN at 0x220:
  0x62, 0x08,
  0xE2, 0x9E,
  0x12, 0x30,
  0xA2, 0x00,
  0xD0, 0x18,
  // 7101: V1 = V1 + 1
  0x71, 0x01,
  0xA2, 0x00,
  0xD0, 0x18,

  // Check key 7 (CHIP-8 key 7 = keyboard A) for LEFT at 0x230:
  0x62, 0x07,
  0xE2, 0x9E,
  0x12, 0x40,
  0xA2, 0x00,
  0xD0, 0x18,
  // 70FF: V0 = V0 - 1
  0x70, 0xFF,
  0xA2, 0x00,
  0xD0, 0x18,

  // Check key 9 (CHIP-8 key 9 = keyboard D) for RIGHT at 0x240:
  0x62, 0x09,
  0xE2, 0x9E,
  0x12, 0x50,
  0xA2, 0x00,
  0xD0, 0x18,
  // 7001: V0 = V0 + 1
  0x70, 0x01,
  0xA2, 0x00,
  0xD0, 0x18,

  // Jump back to main loop at 0x250:
  0x12, 0x10,
]);

// ─── KEYPAD LAYOUT ────────────────────────────────────────────────────────
// CHIP-8 keys 0-F mapped to keyboard
const KEY_MAP = {
  '1':0x1, '2':0x2, '3':0x3, '4':0xC,
  'q':0x4, 'w':0x5, 'e':0x6, 'r':0xD,
  'a':0x7, 's':0x8, 'd':0x9, 'f':0xE,
  'z':0xA, 'x':0x0, 'c':0xB, 'v':0xF
};

const KEY_LAYOUT = [
  {chip8:'1', kb:'1'}, {chip8:'2', kb:'2'}, {chip8:'3', kb:'3'}, {chip8:'C', kb:'4'},
  {chip8:'4', kb:'Q'}, {chip8:'5', kb:'W'}, {chip8:'6', kb:'E'}, {chip8:'D', kb:'R'},
  {chip8:'7', kb:'A'}, {chip8:'8', kb:'S'}, {chip8:'9', kb:'D'}, {chip8:'E', kb:'F'},
  {chip8:'A', kb:'Z'}, {chip8:'0', kb:'X'}, {chip8:'B', kb:'C'}, {chip8:'F', kb:'V'},
];

// ─── CHIP-8 EMULATOR ──────────────────────────────────────────────────────
class Chip8 {
  constructor() {
    this.memory = new Uint8Array(4096);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.PC = 0x200;
    this.stack = [];
    this.SP = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(64 * 32);
    this.keys = new Uint8Array(16);
    this.waitingForKey = -1; // register index waiting for key, -1 = not waiting
    this.drawFlag = false;
    this.halted = false;

    // Load font set at 0x050
    for (let i = 0; i < FONT_SET.length; i++) {
      this.memory[0x050 + i] = FONT_SET[i];
    }
  }

  loadROM(data) {
    for (let i = 0; i < data.length; i++) {
      this.memory[0x200 + i] = data[i];
    }
  }

  reset() {
    this.memory = new Uint8Array(4096);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.PC = 0x200;
    this.stack = [];
    this.SP = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(64 * 32);
    this.keys = new Uint8Array(16);
    this.waitingForKey = -1;
    this.drawFlag = false;
    this.halted = false;
    for (let i = 0; i < FONT_SET.length; i++) {
      this.memory[0x050 + i] = FONT_SET[i];
    }
  }

  fetch() {
    const hi = this.memory[this.PC];
    const lo = this.memory[this.PC + 1];
    return (hi << 8) | lo;
  }

  step() {
    if (this.halted) return;

    // Handle waiting for key press
    if (this.waitingForKey >= 0) {
      for (let k = 0; k < 16; k++) {
        if (this.keys[k]) {
          this.V[this.waitingForKey] = k;
          this.waitingForKey = -1;
          break;
        }
      }
      return; // Don't advance PC until key found
    }

    const opcode = this.fetch();
    this.PC += 2;
    this.execute(opcode);
  }

  execute(op) {
    const nnn = op & 0x0FFF;
    const kk  = op & 0x00FF;
    const n   = op & 0x000F;
    const x   = (op >> 8) & 0xF;
    const y   = (op >> 4) & 0xF;
    const hi  = (op >> 12) & 0xF;

    switch (hi) {
      case 0x0:
        if (op === 0x00E0) {
          // CLS
          this.display.fill(0);
          this.drawFlag = true;
        } else if (op === 0x00EE) {
          // RET
          if (this.stack.length > 0) {
            this.PC = this.stack.pop();
          }
        }
        // 0NNN: call machine code routine - ignored
        break;

      case 0x1:
        // JP addr
        this.PC = nnn;
        break;

      case 0x2:
        // CALL addr
        this.stack.push(this.PC);
        this.PC = nnn;
        break;

      case 0x3:
        // SE Vx, kk
        if (this.V[x] === kk) this.PC += 2;
        break;

      case 0x4:
        // SNE Vx, kk
        if (this.V[x] !== kk) this.PC += 2;
        break;

      case 0x5:
        // SE Vx, Vy
        if (this.V[x] === this.V[y]) this.PC += 2;
        break;

      case 0x6:
        // LD Vx, kk
        this.V[x] = kk;
        break;

      case 0x7:
        // ADD Vx, kk (no carry)
        this.V[x] = (this.V[x] + kk) & 0xFF;
        break;

      case 0x8:
        switch (n) {
          case 0x0: this.V[x] = this.V[y]; break;                          // LD
          case 0x1: this.V[x] |= this.V[y]; break;                         // OR
          case 0x2: this.V[x] &= this.V[y]; break;                         // AND
          case 0x3: this.V[x] ^= this.V[y]; break;                         // XOR
          case 0x4: {                                                        // ADD with carry
            const sum = this.V[x] + this.V[y];
            this.V[0xF] = sum > 255 ? 1 : 0;
            this.V[x] = sum & 0xFF;
            break;
          }
          case 0x5: {                                                        // SUB with borrow
            this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
            this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
            break;
          }
          case 0x6: {                                                        // SHR
            this.V[0xF] = this.V[x] & 0x1;
            this.V[x] = (this.V[x] >> 1) & 0xFF;
            break;
          }
          case 0x7: {                                                        // SUBN
            this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
            this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
            break;
          }
          case 0xE: {                                                        // SHL
            this.V[0xF] = (this.V[x] >> 7) & 0x1;
            this.V[x] = (this.V[x] << 1) & 0xFF;
            break;
          }
        }
        break;

      case 0x9:
        // SNE Vx, Vy
        if (this.V[x] !== this.V[y]) this.PC += 2;
        break;

      case 0xA:
        // LD I, addr
        this.I = nnn;
        break;

      case 0xB:
        // JP V0, addr
        this.PC = (nnn + this.V[0]) & 0xFFF;
        break;

      case 0xC: {
        // RND Vx, kk
        this.V[x] = (Math.random() * 256 | 0) & kk;
        break;
      }

      case 0xD: {
        // DRW Vx, Vy, n
        const xPos = this.V[x] & 63;
        const yPos = this.V[y] & 31;
        this.V[0xF] = 0;
        for (let row = 0; row < n; row++) {
          const spriteByte = this.memory[this.I + row];
          const py = (yPos + row) & 31;
          for (let col = 0; col < 8; col++) {
            if (spriteByte & (0x80 >> col)) {
              const px = (xPos + col) & 63;
              const idx = py * 64 + px;
              if (this.display[idx]) this.V[0xF] = 1;
              this.display[idx] ^= 1;
            }
          }
        }
        this.drawFlag = true;
        break;
      }

      case 0xE:
        if (kk === 0x9E) {
          // SKP Vx
          if (this.keys[this.V[x] & 0xF]) this.PC += 2;
        } else if (kk === 0xA1) {
          // SKNP Vx
          if (!this.keys[this.V[x] & 0xF]) this.PC += 2;
        }
        break;

      case 0xF:
        switch (kk) {
          case 0x07: this.V[x] = this.delayTimer; break;                   // LD Vx, DT
          case 0x0A: this.waitingForKey = x; break;                        // LD Vx, K
          case 0x15: this.delayTimer = this.V[x]; break;                   // LD DT, Vx
          case 0x18: this.soundTimer = this.V[x]; break;                   // LD ST, Vx
          case 0x1E: this.I = (this.I + this.V[x]) & 0xFFFF; break;       // ADD I, Vx
          case 0x29: this.I = 0x050 + (this.V[x] & 0xF) * 5; break;      // LD F, Vx
          case 0x33: {                                                       // LD B, Vx
            const val = this.V[x];
            this.memory[this.I]     = Math.floor(val / 100);
            this.memory[this.I + 1] = Math.floor((val % 100) / 10);
            this.memory[this.I + 2] = val % 10;
            break;
          }
          case 0x55: {                                                       // LD [I], Vx
            for (let i = 0; i <= x; i++) this.memory[this.I + i] = this.V[i];
            break;
          }
          case 0x65: {                                                       // LD Vx, [I]
            for (let i = 0; i <= x; i++) this.V[i] = this.memory[this.I + i];
            break;
          }
        }
        break;
    }
  }

  tickTimers() {
    if (this.delayTimer > 0) this.delayTimer--;
    if (this.soundTimer > 0) this.soundTimer--;
  }

  disassemble(addr) {
    const op = (this.memory[addr] << 8) | this.memory[addr + 1];
    const nnn = op & 0x0FFF;
    const kk  = op & 0x00FF;
    const n   = op & 0x000F;
    const x   = (op >> 8) & 0xF;
    const y   = (op >> 4) & 0xF;
    const hi  = (op >> 12) & 0xF;
    const h = v => v.toString(16).toUpperCase().padStart(2,'0');
    const h3 = v => v.toString(16).toUpperCase().padStart(3,'0');

    switch (hi) {
      case 0x0:
        if (op === 0x00E0) return `CLS`;
        if (op === 0x00EE) return `RET`;
        return `SYS ${h3(nnn)}`;
      case 0x1: return `JP ${h3(nnn)}`;
      case 0x2: return `CALL ${h3(nnn)}`;
      case 0x3: return `SE V${x.toString(16).toUpperCase()}, #${h(kk)}`;
      case 0x4: return `SNE V${x.toString(16).toUpperCase()}, #${h(kk)}`;
      case 0x5: return `SE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
      case 0x6: return `LD V${x.toString(16).toUpperCase()}, #${h(kk)}`;
      case 0x7: return `ADD V${x.toString(16).toUpperCase()}, #${h(kk)}`;
      case 0x8: {
        const vx = `V${x.toString(16).toUpperCase()}`;
        const vy = `V${y.toString(16).toUpperCase()}`;
        switch(n) {
          case 0: return `LD ${vx}, ${vy}`;
          case 1: return `OR ${vx}, ${vy}`;
          case 2: return `AND ${vx}, ${vy}`;
          case 3: return `XOR ${vx}, ${vy}`;
          case 4: return `ADD ${vx}, ${vy}`;
          case 5: return `SUB ${vx}, ${vy}`;
          case 6: return `SHR ${vx}`;
          case 7: return `SUBN ${vx}, ${vy}`;
          case 0xE: return `SHL ${vx}`;
        }
        break;
      }
      case 0x9: return `SNE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
      case 0xA: return `LD I, ${h3(nnn)}`;
      case 0xB: return `JP V0, ${h3(nnn)}`;
      case 0xC: return `RND V${x.toString(16).toUpperCase()}, #${h(kk)}`;
      case 0xD: return `DRW V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}, ${n}`;
      case 0xE:
        if (kk === 0x9E) return `SKP V${x.toString(16).toUpperCase()}`;
        if (kk === 0xA1) return `SKNP V${x.toString(16).toUpperCase()}`;
        break;
      case 0xF: {
        const vx = `V${x.toString(16).toUpperCase()}`;
        switch(kk) {
          case 0x07: return `LD ${vx}, DT`;
          case 0x0A: return `LD ${vx}, K`;
          case 0x15: return `LD DT, ${vx}`;
          case 0x18: return `LD ST, ${vx}`;
          case 0x1E: return `ADD I, ${vx}`;
          case 0x29: return `LD F, ${vx}`;
          case 0x33: return `LD B, ${vx}`;
          case 0x55: return `LD [I], ${vx}`;
          case 0x65: return `LD ${vx}, [I]`;
        }
        break;
      }
    }
    return `??? ${op.toString(16).toUpperCase().padStart(4,'0')}`;
  }
}

// ─── RENDERER ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const SCALE = 10;
const W = 64, H = 32;

function renderDisplay(display) {
  const imageData = ctx.createImageData(W * SCALE, H * SCALE);
  const data = imageData.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const on = display[y * W + x];
      const r = on ? 0 : 0;
      const g = on ? 212 : 0;
      const b = on ? 255 : 0;
      for (let sy = 0; sy < SCALE; sy++) {
        for (let sx = 0; sx < SCALE; sx++) {
          const idx = ((y * SCALE + sy) * W * SCALE + (x * SCALE + sx)) * 4;
          data[idx]   = r;
          data[idx+1] = g;
          data[idx+2] = b;
          data[idx+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// ─── DEBUGGER UI ──────────────────────────────────────────────────────────
function buildRegGrid() {
  const grid = document.getElementById('regGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement('div');
    cell.className = 'reg-cell';
    cell.innerHTML = `<div class="reg-name">V${i.toString(16).toUpperCase()}</div><div class="reg-val" id="reg${i}">00</div>`;
    grid.appendChild(cell);
  }
}

function updateDebugger(chip) {
  for (let i = 0; i < 16; i++) {
    const el = document.getElementById(`reg${i}`);
    if (el) el.textContent = chip.V[i].toString(16).toUpperCase().padStart(2,'0');
  }
  document.getElementById('dbgPC').textContent = '0x' + chip.PC.toString(16).toUpperCase().padStart(3,'0');
  document.getElementById('dbgI').textContent  = '0x' + chip.I.toString(16).toUpperCase().padStart(3,'0');
  document.getElementById('dbgDT').textContent = chip.delayTimer;
  document.getElementById('dbgST').textContent = chip.soundTimer;
  document.getElementById('dbgSP').textContent = chip.stack.length;

  // Stack
  const stackEl = document.getElementById('stackList');
  stackEl.innerHTML = '';
  if (chip.stack.length === 0) {
    stackEl.innerHTML = '<span style="color:#555">empty</span>';
  } else {
    chip.stack.forEach((addr, i) => {
      const item = document.createElement('div');
      item.className = 'stack-item';
      item.textContent = `[${i}] 0x${addr.toString(16).toUpperCase().padStart(3,'0')}`;
      stackEl.appendChild(item);
    });
  }

  // Disassemble current instruction
  const disasmEl = document.getElementById('disasm');
  if (chip.PC >= 0x200 && chip.PC < 4094) {
    const op = (chip.memory[chip.PC] << 8) | chip.memory[chip.PC + 1];
    const opHex = op.toString(16).toUpperCase().padStart(4,'0');
    const mnem = chip.disassemble(chip.PC);
    disasmEl.textContent = `0x${chip.PC.toString(16).toUpperCase().padStart(3,'0')}: ${opHex}  ${mnem}`;
  } else {
    disasmEl.textContent = '---';
  }
}

// ─── KEYPAD UI ────────────────────────────────────────────────────────────
function buildKeypad() {
  const kp = document.getElementById('keypad');
  kp.innerHTML = '';
  KEY_LAYOUT.forEach(k => {
    const div = document.createElement('div');
    div.className = 'key';
    div.id = `key_${k.chip8}`;
    div.innerHTML = `<div class="key-top">${k.chip8}</div><div class="key-bot">[${k.kb}]</div>`;
    kp.appendChild(div);
  });
}

function updateKeyUI(chip8Key, pressed) {
  const el = document.getElementById(`key_${chip8Key.toString(16).toUpperCase()}`);
  if (el) {
    if (pressed) el.classList.add('pressed');
    else el.classList.remove('pressed');
  }
}

// ─── MAIN EMULATOR LOOP ───────────────────────────────────────────────────
const chip = new Chip8();
let running = false;
let romLoaded = false;
let currentROM = null;
let animFrame = null;
let lastTimerTick = 0;
let ipsValue = 10;

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function loadAndReset(romData) {
  chip.reset();
  chip.loadROM(romData);
  currentROM = romData;
  romLoaded = true;
  renderDisplay(chip.display);
  updateDebugger(chip);
  setStatus('ROM loaded. Press Run.');
}

function mainLoop(timestamp) {
  if (!running) return;

  // Tick timers at ~60Hz
  if (timestamp - lastTimerTick >= 1000/60) {
    chip.tickTimers();
    lastTimerTick = timestamp;
  }

  // Execute instructions per frame
  for (let i = 0; i < ipsValue; i++) {
    chip.step();
  }

  // Render if needed
  if (chip.drawFlag) {
    renderDisplay(chip.display);
    chip.drawFlag = false;
  }

  updateDebugger(chip);
  animFrame = requestAnimationFrame(mainLoop);
}

function doRun() {
  if (!romLoaded) { setStatus('No ROM loaded!'); return; }
  if (running) return;
  running = true;
  document.getElementById('btnRun').classList.add('active');
  setStatus('Running');
  lastTimerTick = performance.now();
  animFrame = requestAnimationFrame(mainLoop);
}

function doPause() {
  running = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  document.getElementById('btnRun').classList.remove('active');
  setStatus('Paused');
  updateDebugger(chip);
}

function doStep() {
  if (!romLoaded) { setStatus('No ROM loaded!'); return; }
  if (running) doPause();
  chip.step();
  chip.tickTimers();
  if (chip.drawFlag) {
    renderDisplay(chip.display);
    chip.drawFlag = false;
  }
  updateDebugger(chip);
  setStatus('Stepped to 0x' + chip.PC.toString(16).toUpperCase().padStart(3,'0'));
}

function doReset() {
  doPause();
  if (currentROM) {
    chip.reset();
    chip.loadROM(currentROM);
    renderDisplay(chip.display);
    updateDebugger(chip);
    setStatus('Reset. Press Run.');
  } else {
    chip.reset();
    renderDisplay(chip.display);
    updateDebugger(chip);
    setStatus('Reset.');
  }
}

// ─── EVENT LISTENERS ──────────────────────────────────────────────────────
document.getElementById('btnRun').addEventListener('click', doRun);
document.getElementById('btnPause').addEventListener('click', doPause);
document.getElementById('btnStep').addEventListener('click', doStep);
document.getElementById('btnReset').addEventListener('click', doReset);

document.getElementById('btnDemo').addEventListener('click', () => {
  doPause();
  loadAndReset(DEMO_ROM);
  setStatus('Demo ROM loaded. Press Run. Use W/A/S/D to move smiley.');
});

document.getElementById('speedSlider').addEventListener('input', function() {
  ipsValue = parseInt(this.value);
  document.getElementById('speedVal').textContent = ipsValue;
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    doPause();
    const data = new Uint8Array(ev.target.result);
    loadAndReset(data);
    setStatus(`Loaded: ${file.name} (${data.length} bytes)`);
  };
  reader.readAsArrayBuffer(file);
  this.value = '';
});

// Keyboard input
document.addEventListener('keydown', function(e) {
  const key = e.key.toLowerCase();
  if (KEY_MAP.hasOwnProperty(key)) {
    e.preventDefault();
    const chip8Key = KEY_MAP[key];
    chip.keys[chip8Key] = 1;
    updateKeyUI(chip8Key, true);
  }
});

document.addEventListener('keyup', function(e) {
  const key = e.key.toLowerCase();
  if (KEY_MAP.hasOwnProperty(key)) {
    e.preventDefault();
    const chip8Key = KEY_MAP[key];
    chip.keys[chip8Key] = 0;
    updateKeyUI(chip8Key, false);
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────
buildRegGrid();
buildKeypad();
renderDisplay(chip.display);
updateDebugger(chip);

// Auto-load demo ROM
loadAndReset(DEMO_ROM);
setStatus('Demo ROM loaded. Press Run. Use W/A/S/D to move smiley.');
</script>
</body>
