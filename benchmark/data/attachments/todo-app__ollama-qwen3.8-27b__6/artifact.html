<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden;
  }
  header {
    padding: 24px;
    text-align: center;
    color: #fff;
    background: #fff;
  }
  h1 { font-size: 28px; color: #333; letter-spacing: 1px; }
  .input-row {
    display: flex;
    padding: 16px;
    gap: 8px;
    border-bottom: 1px solid #eee;
  }
  #todo-input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  #todo-input:focus { border-color: #667eea; }
  #add-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  #add-btn:hover { background: #5568d3; }
  .filters {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    transition: all .2s;
  }
  .filter-btn.active {
    background: #667eea;
    border-color: #667eea;
    color: #fff;
  }
  ul { list-style: none; max-height: 380px; overflow-y: auto; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid #f2f2f2;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  li input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #667eea;
    cursor: pointer;
    flex-shrink: 0;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
    cursor: pointer;
  }
  li.completed .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: #d9534f;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    opacity: .6;
    transition: opacity .2s;
  }
  .delete-btn:hover { opacity: 1; }
  .empty {
    text-align: center;
    color: #bbb;
    padding: 32px 16px;
    font-size: 14px;
  }
  footer {
    padding: 12px 16px;
    text-align: center;
    color: #999;
    font-size: 13px;
    background: #fafafa;
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>Todo App</h1></header>
  <div class="input-row">
    <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
    <button id="add-btn">Add</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>
  <ul id="todo-list"></ul>
  <footer id="counter"></footer>
</div>

<script>
(function () {
  const STORAGE_KEY = 'todos-v1';
  let todos = [];
  let filter = 'all';

  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const counterEl = document.getElementById('counter');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      todos = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(todos)) todos = [];
    } catch (e) { todos = []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo(text) {
    text = text.trim();
    if (!text) return;
    todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text: text, completed: false });
    inputEl.value = '';
    render();
    inputEl.focus();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.completed = !t.completed; render(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    render();
  }

  function setFilter(f) {
    filter = f;
    filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

  function visibleTodos() {
    if (filter === 'active') return todos.filter(t => !t.completed);
    if (filter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    save();
    listEl.innerHTML = '';
    const items = visibleTodos();

    if (items.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = todos.length === 0 ? 'No todos yet. Add one above!' : 'Nothing here for this filter.';
      li.style.cursor = 'default';
      listEl.appendChild(li);
    } else {
      items.forEach(t => {
        const li = document.createElement('li');
        if (t.completed) li.classList.add('completed');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.completed;
        cb.addEventListener('change', () => toggleTodo(t.id));

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = t.text;
        span.addEventListener('click', () => toggleTodo(t.id));

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '\u2715';
        del.title = 'Delete';
        del.addEventListener('click', () => deleteTodo(t.id));

        li.append(cb, span, del);
        listEl.appendChild(li);
      });
    }

    const active = todos.filter(t => !t.completed).length;
    const completed = todos.length - active;
    counterEl.textContent = active + ' active \u00b7 ' + completed + ' completed';
  }

  addBtn.addEventListener('click', () => addTodo(inputEl.value));
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(inputEl.value); });
  filterBtns.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

  load();
  render();
})();
</script>
</body>
</html>
