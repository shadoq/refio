<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body { margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; overflow:hidden; }
#gameContainer { position:relative; width:600px; margin:20px auto; }
canvas { background:#000; display:block; }
.overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.8); display:flex; flex-direction:column;
  justify-content:center; align-items:center; color:#fff; font-size:24px;
}
.overlay button { margin:10px; padding:10px 20px; font-size:18px; cursor:pointer; }
#scoreBoard { position:absolute; top:5px; left:5px; color:#fff; font-size:18px; }
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="600" height="600"></canvas>
<div id="scoreBoard"></div>
<div id="startMenu" class="overlay">
  <div>Select Mode</div>
  <button data-mode="0">Human vs Human</button>
  <button data-mode="1">CPU vs Human</button>
  <button data-mode="2">CPU vs CPU</button>
</div>
<div id="gameOver" class="overlay" style="display:none;">
  <div id="gameOverText"></div>
  <div>Press Enter to restart</div>
</div>
</div>
<script>
(() => {
  const CELL_SIZE = 20;
  const GRID_SIZE = 30;
  const CANVAS_SIZE = CELL_SIZE * GRID_SIZE;
  const SPEED = 100; // ms per tick

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startMenu = document.getElementById('startMenu');
  const gameOverOverlay = document.getElementById('gameOver');
  const gameOverText = document.getElementById('gameOverText');
  const scoreBoard = document.getElementById('scoreBoard');

  let mode = 0; // 0:HvH,1:CPUvH,2:CPUvCPU
  let snakes = [];
  let food = {x:0,y:0};
  let intervalId = null;
  let gameRunning = false;

  const directions = {
    ArrowUp: {dx:0, dy:-1},
    ArrowDown: {dx:0, dy:1},
    ArrowLeft: {dx:-1, dy:0},
    ArrowRight: {dx:1, dy:0},
    w: {dx:0, dy:-1},
    s: {dx:0, dy:1},
    a: {dx:-1, dy:0},
    d: {dx:1, dy:0}
  };

  function createSnake(startX, startY, dirKey, color, isCPU, controlKeys) {
    return {
      body: [
        {x:startX, y:startY},
        {x:startX - dirKey.dx, y:startY - dirKey.dy},
        {x:startX - 2*dirKey.dx, y:startY - 2*dirKey.dy}
      ],
      direction: {dx: dirKey.dx, dy: dirKey.dy},
      pendingDirection: null,
      color,
      isCPU,
      controlKeys
    };
  }

  function initSnakes() {
    snakes = [];
    if (mode === 0) { // Human vs Human
      snakes.push(createSnake(5,15, directions.ArrowRight, 'lime', false, ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']));
      snakes.push(createSnake(24,15, directions.ArrowLeft, 'cyan', false, ['w','s','a','d']));
    } else if (mode === 1) { // CPU vs Human (snake0 human, snake1 CPU)
      snakes.push(createSnake(5,15, directions.ArrowRight, 'lime', false, ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']));
      snakes.push(createSnake(24,15, directions.ArrowLeft, 'orange', true, []));
    } else { // CPU vs CPU
      snakes.push(createSnake(5,15, directions.ArrowRight, 'lime', true, []));
      snakes.push(createSnake(24,15, directions.ArrowLeft, 'orange', true, []));
    }
  }

  function placeFood() {
    const occupied = new Set();
    snakes.forEach(s => s.body.forEach(seg => occupied.add(seg.x + ',' + seg.y)));
    let x, y;
    do {
      x = Math.floor(Math.random() * GRID_SIZE);
      y = Math.floor(Math.random() * GRID_SIZE);
    } while (occupied.has(x + ',' + y));
    food = {x, y};
  }

  function startGame(selectedMode) {
    mode = selectedMode;
    startMenu.style.display = 'none';
    initSnakes();
    placeFood();
    updateScoreBoard();
    gameRunning = true;
    intervalId = setInterval(gameLoop, SPEED);
  }

  function stopGame() {
    clearInterval(intervalId);
    intervalId = null;
    gameRunning = false;
  }

  function gameLoop() {
    // Update directions
    snakes.forEach(snake => {
      if (snake.isCPU) {
        snake.direction = computeCPUDirection(snake);
      } else if (snake.pendingDirection) {
        if (!isReverse(snake.direction, snake.pendingDirection)) {
          snake.direction = snake.pendingDirection;
        }
        snake.pendingDirection = null;
      }
    });

    // Compute new heads
    const newHeads = snakes.map(snake => ({
      x: snake.body[0].x + snake.direction.dx,
      y: snake.body[0].y + snake.direction.dy
    }));

    // Collision detection
    for (let i = 0; i < snakes.length; i++) {
      const head = newHeads[i];
      const snake = snakes[i];
      // Wall
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        endGame(i);
        return;
      }
      // Self
      if (snake.body.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame(i);
        return;
      }
      // Other snake
      const other = snakes[1 - i];
      if (other.body.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame(i);
        return;
      }
    }

    // Apply moves
    for (let i = 0; i < snakes.length; i++) {
      const snake = snakes[i];
      const head = newHeads[i];
      snake.body.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        placeFood(); // grow
      } else {
        snake.body.pop();
      }
    }

    // Head‑on collision
    if (newHeads[0].x === newHeads[1].x && newHeads[0].y === newHeads[1].y) {
      endGame(-1);
      return;
    }

    draw();
    updateScoreBoard();
  }

  function isReverse(dir, newDir) {
    return dir.dx === -newDir.dx && dir.dy === -newDir.dy;
  }

  function computeCPUDirection(snake) {
    const possible = [
      {dx:0, dy:-1},
      {dx:0, dy:1},
      {dx:-1, dy:0},
      {dx:1, dy:0}
    ];
    const safe = possible.filter(p => !(p.dx === -snake.direction.dx && p.dy === -snake.direction.dy));
    const filtered = safe.filter(p => {
      const nx = snake.body[0].x + p.dx;
      const ny = snake.body[0].y + p.dy;
      if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return false;
      if (snake.body.some(seg => seg.x === nx && seg.y === ny)) return false;
      const other = snakes.find(s => s !== snake);
      if (other.body.some(seg => seg.x === nx && seg.y === ny)) return false;
      return true;
    });
    if (filtered.length === 0) return snake.direction;
    const best = filtered.reduce((bestDir, cur) => {
      const curDist = Math.abs(snake.body[0].x + cur.dx - food.x) + Math.abs(snake.body[0].y + cur.dy - food.y);
      const bestDist = Math.abs(snake.body[0].x + bestDir.dx - food.x) + Math.abs(snake.body[0].y + bestDir.dy - food.y);
      return curDist < bestDist ? cur : bestDir;
    }, filtered[0]);
    return {dx: best.dx, dy: best.dy};
  }

  function endGame(loserIndex) {
    stopGame();
    let msg;
    if (loserIndex === -1) {
      msg = 'Both snakes collided!';
    } else {
      const winner = loserIndex === 0 ? 1 : 0;
      msg = `Snake ${winner + 1} wins!`;
    }
    const scores = snakes.map((s, i) => `Snake ${i + 1}: ${s.body.length - 3}`).join(' | ');
    gameOverText.innerHTML = `<div>${msg}</div><div>${scores}</div>`;
    gameOverOverlay.style.display = 'flex';
  }

  function draw() {
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    // Grid
    ctx.strokeStyle = '#222';
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
      ctx.stroke();
    }
    // Food
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    // Snakes
    snakes.forEach(snake => {
      ctx.fillStyle = snake.color;
      snake.body.forEach(seg => {
        ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });
    });
  }

  function updateScoreBoard() {
    const parts = snakes.map((s, i) => `Snake ${i + 1}: ${s.body.length - 3}`);
    scoreBoard.textContent = parts.join(' | ');
  }

  // Input handling
  document.addEventListener('keydown', e => {
    if (!gameRunning) {
      if (gameOverOverlay.style.display !== 'none' && e.key === 'Enter') {
        gameOverOverlay.style.display = 'none';
        startMenu.style.display = 'flex';
      }
      return;
    }
    snakes.forEach(snake => {
      if (!snake.isCPU && snake.controlKeys.includes(e.key)) {
        const dir = directions[e.key];
        if (dir && !isReverse(snake.direction, dir)) {
          snake.pendingDirection = {dx: dir.dx, dy: dir.dy};
        }
      }
    });
  });

  // Start menu buttons
  startMenu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const selected = parseInt(btn.getAttribute('data-mode'), 10);
      startGame(selected);
    });
  });

  // Show start menu initially
  startMenu.style.display = 'flex';
})();
</script>
</body>
</html>
