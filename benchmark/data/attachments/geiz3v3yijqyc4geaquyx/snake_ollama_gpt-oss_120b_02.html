<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
    color: #fff;
    font-family: sans-serif;
}
#gameContainer {
    position: relative;
}
canvas {
    background: #000;
    display: block;
}
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 24px;
}
button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}
#scoreBoard {
    position: absolute;
    top: 5px;
    left: 5px;
    color: #fff;
    font-size: 18px;
    z-index: 1;
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="scoreBoard"></div>
    <div id="startMenu" class="overlay">
        <h1>Snake Game</h1>
        <button data-mode="hh">Human vs Human</button>
        <button data-mode="ch">CPU vs Human</button>
        <button data-mode="cc">CPU vs CPU</button>
    </div>
    <div id="gameOver" class="overlay" style="display:none;">
        <h1>Game Over</h1>
        <div id="finalScores"></div>
        <p>Press any key to restart</p>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 30;
const cellSize = canvas.width / gridSize; // 20
let snakes = [];
let food = {x:0,y:0};
let gameInterval = null;
let currentMode = null; // 'hh','ch','cc'

function initGame(mode){
    currentMode = mode;
    snakes = [];

    // Snake 1
    snakes.push({
        positions: [{x:5, y:5}],
        direction: {x:1, y:0},
        pendingDirection: null,
        color: 'lime',
        isCPU: (mode === 'cc') ? true : false,
        score: 0,
        controls: {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'}
    });

    // Snake 2
    snakes.push({
        positions: [{x:24, y:24}],
        direction: {x:-1, y:0},
        pendingDirection: null,
        color: 'orange',
        isCPU: (mode === 'hh') ? false : true,
        score: 0,
        controls: {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD'}
    });

    // Adjust for CPU vs Human mode
    if (mode === 'ch'){
        snakes[0].isCPU = false;
        snakes[1].isCPU = true;
    }

    placeFood();
    updateScoreBoard();
}

function placeFood(){
    let empty = [];
    for(let x=0;x<gridSize;x++){
        for(let y=0;y<gridSize;y++){
            let occupied = false;
            for(let s of snakes){
                for(let p of s.positions){
                    if(p.x===x && p.y===y){occupied=true;break;}
                }
                if(occupied) break;
            }
            if(!occupied) empty.push({x,y});
        }
    }
    if(empty.length===0){food=null;return;}
    const idx = Math.floor(Math.random()*empty.length);
    food = empty[idx];
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Food
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x*cellSize, food.y*cellSize, cellSize, cellSize);
    // Snakes
    for(let s of snakes){
        ctx.fillStyle = s.color;
        for(let p of s.positions){
            ctx.fillRect(p.x*cellSize, p.y*cellSize, cellSize, cellSize);
        }
    }
}

function updateScoreBoard(){
    const board = document.getElementById('scoreBoard');
    board.textContent = `Score - Snake 1: ${snakes[0].score} | Snake 2: ${snakes[1].score}`;
}

function gameStep(){
    // Apply pending human directions
    for(let s of snakes){
        if(!s.isCPU && s.pendingDirection){
            if(!(s.pendingDirection.x === -s.direction.x && s.pendingDirection.y === -s.direction.y)){
                s.direction = s.pendingDirection;
            }
            s.pendingDirection = null;
        }
    }

    // CPU movement (greedy towards food)
    for(let s of snakes){
        if(s.isCPU){
            const head = s.positions[0];
            const moves = [
                {x:0,y:-1},
                {x:0,y:1},
                {x:-1,y:0},
                {x:1,y:0}
            ];
            const validMoves = moves.filter(m=> !(m.x===-s.direction.x && m.y===-s.direction.y));
            let best = s.direction;
            let bestDist = Math.abs(head.x + s.direction.x - food.x) + Math.abs(head.y + s.direction.y - food.y);
            for(let m of validMoves){
                const nx = head.x + m.x;
                const ny = head.y + m.y;
                if(nx<0||nx>=gridSize||ny<0||ny>=gridSize) continue;
                const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
                if(dist < bestDist){
                    bestDist = dist;
                    best = m;
                }
            }
            s.direction = best;
        }
    }

    // Move snakes
    for(let s of snakes){
        const newHead = {x: s.positions[0].x + s.direction.x, y: s.positions[0].y + s.direction.y};
        s.positions.unshift(newHead);
        if(food && newHead.x===food.x && newHead.y===food.y){
            s.score += 1;
            placeFood();
        } else {
            s.positions.pop();
        }
    }

    // Collision detection
    let gameOver = false;
    for(let i=0;i<snakes.length;i++){
        const s = snakes[i];
        const head = s.positions[0];
        // Wall
        if(head.x<0||head.x>=gridSize||head.y<0||head.y>=gridSize){
            gameOver = true; break;
        }
        // Self
        for(let j=1;j<s.positions.length;j++){
            if(head.x===s.positions[j].x && head.y===s.positions[j].y){
                gameOver = true; break;
            }
        }
        if(gameOver) break;
        // Other snake
        const other = snakes[1-i];
        for(let p of other.positions){
            if(head.x===p.x && head.y===p.y){
                gameOver = true; break;
            }
        }
        if(gameOver) break;
    }

    if(gameOver){
        endGame();
        return;
    }

    draw();
    updateScoreBoard();
}

function startLoop(){
    if(gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameStep, 100);
}

function endGame(){
    clearInterval(gameInterval);
    const goDiv = document.getElementById('gameOver');
    const finalDiv = document.getElementById('finalScores');
    finalDiv.textContent = `Final Scores - Snake 1: ${snakes[0].score} | Snake 2: ${snakes[1].score}`;
    goDiv.style.display = 'flex';
}

document.addEventListener('keydown', (e)=>{
    // Human controls
    for(let s of snakes){
        if(!s.isCPU){
            const ctrl = s.controls;
            if(e.code===ctrl.up) s.pendingDirection = {x:0,y:-1};
            else if(e.code===ctrl.down) s.pendingDirection = {x:0,y:1};
            else if(e.code===ctrl.left) s.pendingDirection = {x:-1,y:0};
            else if(e.code===ctrl.right) s.pendingDirection = {x:1,y:0};
        }
    }
    // Restart after game over
    const goDiv = document.getElementById('gameOver');
    if(goDiv.style.display !== 'none'){
        goDiv.style.display = 'none';
        document.getElementById('startMenu').style.display = 'flex';
    }
});

document.getElementById('startMenu').addEventListener('click', (e)=>{
    if(e.target.tagName.toLowerCase() === 'button'){
        const mode = e.target.getAttribute('data-mode');
        document.getElementById('startMenu').style.display = 'none';
        initGame(mode);
        startLoop();
    }
});
</script>
</body>
</html>
