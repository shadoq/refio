<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Game - Human vs Human / CPU vs Human / CPU vs CPU</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }
  #container {
    max-width: 600px;
    margin: 1rem auto;
    text-align: center;
  }
  canvas {
    background: #222;
    display: block;
    margin: 0 auto;
    border: 2px solid #555;
  }
  #startMenu, #gameOverScreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #startMenu h1, #gameOverScreen h1 {
    margin-bottom: 1rem;
    font-size: 2.5rem;
  }
  #startMenu label {
    display: block;
    margin: 0.5rem 0;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #startMenu input[type="radio"] {
    margin-right: 0.5rem;
  }
  #startButton, #restartButton {
    margin-top: 1.5rem;
    padding: 0.5rem 1.5rem;
    font-size: 1.2rem;
    background: #28a745;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    user-select: none;
  }
  #startButton:hover, #restartButton:hover {
    background: #218838;
  }
  #scoreBoard {
    margin: 0.5rem 0 1rem 0;
    font-size: 1.2rem;
    display: flex;
    justify-content: center;
    gap: 2rem;
  }
  #scoreBoard div {
    min-width: 120px;
  }
  #instructions {
    font-size: 0.9rem;
    color: #aaa;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="gameCanvas" width="600" height="600" tabindex="0"></canvas>
  <div id="scoreBoard" aria-live="polite" aria-atomic="true" aria-relevant="text">
    <div id="score1">Player 1 Score: 0</div>
    <div id="score2">Player 2 Score: 0</div>
  </div>
  <div id="instructions">
    Controls:<br />
    Player 1: Arrow keys<br />
    Player 2: WASD keys (if human)<br />
    Restart: R key (after game over)
  </div>
</div>

<div id="startMenu" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <h1 id="startTitle">Snake Game</h1>
  <form id="modeForm">
    <label><input type="radio" name="mode" value="human-human" checked /> Human vs Human</label>
    <label><input type="radio" name="mode" value="cpu-human" /> CPU vs Human</label>
    <label><input type="radio" name="mode" value="cpu-cpu" /> CPU vs CPU</label>
  </form>
  <button id="startButton" type="button">Start Game</button>
</div>

<div id="gameOverScreen" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle" style="display:none;">
  <h1 id="gameOverTitle">Game Over</h1>
  <div id="finalScores"></div>
  <div>Press 'R' to Restart</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const gridSize = 30;
  const cellSize = canvas.width / gridSize;
  const startMenu = document.getElementById('startMenu');
  const startButton = document.getElementById('startButton');
  const modeForm = document.getElementById('modeForm');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScores = document.getElementById('finalScores');
  const score1Display = document.getElementById('score1');
  const score2Display = document.getElementById('score2');

  // Directions
  const DIRS = {
    ArrowUp: {x:0, y:-1},
    ArrowDown: {x:0, y:1},
    ArrowLeft: {x:-1, y:0},
    ArrowRight: {x:1, y:0},
    KeyW: {x:0, y:-1},
    KeyS: {x:0, y:1},
    KeyA: {x:-1, y:0},
    KeyD: {x:1, y:0}
  };

  // Game state
  let snakes = [];
  let foods = [];
  let mode = 'human-human';
  let gameInterval = null;
  let gameSpeed = 100; // ms per frame
  let gameOver = false;

  // Snake class
  class Snake {
    constructor(id, startPos, startDir, isCPU) {
      this.id = id;
      this.body = [startPos];
      this.dir = startDir;
      this.nextDir = startDir;
      this.growAmount = 0;
      this.isCPU = isCPU;
      this.alive = true;
      this.score = 0;
    }

    setDirection(newDir) {
      // Prevent reversing direction
      if (this.alive && (newDir.x !== -this.dir.x || newDir.y !== -this.dir.y)) {
        this.nextDir = newDir;
      }
    }

    move() {
      if (!this.alive) return;
      this.dir = this.nextDir;
      const head = this.body[0];
      const newHead = {x: head.x + this.dir.x, y: head.y + this.dir.y};
      // Check wall collision
      if (newHead.x < 0 || newHead.x >= gridSize || newHead.y < 0 || newHead.y >= gridSize) {
        this.alive = false;
        return;
      }
      // Check self collision
      if (this.body.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        this.alive = false;
        return;
      }
      // Check collision with other snakes
      for (const other of snakes) {
        if (other.id !== this.id && other.alive) {
          if (other.body.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
            this.alive = false;
            return;
          }
        }
      }
      this.body.unshift(newHead);
      if (this.growAmount > 0) {
        this.growAmount--;
      } else {
        this.body.pop();
      }
    }

    grow() {
      this.growAmount += 1;
      this.score++;
    }
  }

  // Food class
  class Food {
    constructor(pos) {
      this.pos = pos;
    }
  }

  // Generate random empty position on grid
  function randomEmptyPosition() {
    let pos;
    let tries = 0;
    do {
      pos = {x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize)};
      tries++;
      if (tries > 1000) break; // fallback
    } while (
      snakes.some(snake => snake.body.some(seg => seg.x === pos.x && seg.y === pos.y)) ||
      foods.some(food => food.pos.x === pos.x && food.pos.y === pos.y)
    );
    return pos;
  }

  // Place food on the board
  function placeFood() {
    const pos = randomEmptyPosition();
    foods.push(new Food(pos));
  }

  // Draw functions
  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
  }

  function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    for (let i = 0; i <= gridSize; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize);
      ctx.lineTo(canvas.width, i * cellSize);
      ctx.stroke();
    }
  }

  function drawFood() {
    for (const food of foods) {
      drawCell(food.pos.x, food.pos.y, '#e74c3c');
    }
  }

  function drawSnakes() {
    for (const snake of snakes) {
      if (!snake.alive) continue;
      const baseHue = snake.id === 1 ? 120 : 200; // green or blue
      snake.body.forEach((seg, i) => {
        const lightness = 40 + (i / snake.body.length) * 40;
        drawCell(seg.x, seg.y, `hsl(${baseHue}, 70%, ${lightness}%)`);
      });
      // Draw eyes on head
      const head = snake.body[0];
      const eyeSize = cellSize / 6;
      const eyeOffsetX = cellSize / 4;
      const eyeOffsetY = cellSize / 4;
      ctx.fillStyle = '#000';
      if (snake.dir.x === 1) {
        // right
        ctx.beginPath();
        ctx.arc(head.x * cellSize + cellSize - eyeOffsetX, head.y * cellSize + eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.arc(head.x * cellSize + cellSize - eyeOffsetX, head.y * cellSize + cellSize - eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      } else if (snake.dir.x === -1) {
        // left
        ctx.beginPath();
        ctx.arc(head.x * cellSize + eyeOffsetX, head.y * cellSize + eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.arc(head.x * cellSize + eyeOffsetX, head.y * cellSize + cellSize - eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      } else if (snake.dir.y === 1) {
        // down
        ctx.beginPath();
        ctx.arc(head.x * cellSize + eyeOffsetX, head.y * cellSize + cellSize - eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.arc(head.x * cellSize + cellSize - eyeOffsetX, head.y * cellSize + cellSize - eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      } else if (snake.dir.y === -1) {
        // up
        ctx.beginPath();
        ctx.arc(head.x * cellSize + eyeOffsetX, head.y * cellSize + eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.arc(head.x * cellSize + cellSize - eyeOffsetX, head.y * cellSize + eyeOffsetY, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // CPU snake AI: simple pathfinding to closest food using BFS
  function cpuChooseDirection(snake) {
    if (!snake.alive) return;
    if (foods.length === 0) return;
    const head = snake.body[0];
    // BFS to find shortest path to any food
    const queue = [];
    const visited = new Set();
    queue.push({pos: head, path: []});
    visited.add(head.x + ',' + head.y);

    const obstacles = new Set();
    // Mark all snake segments as obstacles except tail (tail moves)
    for (const s of snakes) {
      if (!s.alive) continue;
      for (let i = 0; i < s.body.length - 1; i++) {
        const seg = s.body[i];
        obstacles.add(seg.x + ',' + seg.y);
      }
    }

    while (queue.length > 0) {
      const current = queue.shift();
      const {pos, path} = current;
      // Check if on food
      if (foods.some(f => f.pos.x === pos.x && f.pos.y === pos.y)) {
        // Return first step direction
        if (path.length > 0) {
          return path[0];
        } else {
          // Already on food, keep current direction
          return snake.dir;
        }
      }
      // Explore neighbors
      for (const d of [ {x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0} ]) {
        const nx = pos.x + d.x;
        const ny = pos.y + d.y;
        const key = nx + ',' + ny;
        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
        if (visited.has(key)) continue;
        if (obstacles.has(key)) continue;
        visited.add(key);
        queue.push({pos: {x:nx,y:ny}, path: path.concat([d])});
      }
    }
    // No path found, try to keep moving forward if possible
    const forwardPos = {x: head.x + snake.dir.x, y: head.y + snake.dir.y};
    if (forwardPos.x >= 0 && forwardPos.x < gridSize && forwardPos.y >= 0 && forwardPos.y < gridSize) {
      if (!obstacles.has(forwardPos.x + ',' + forwardPos.y)) {
        return snake.dir;
      }
    }
    // Otherwise try any safe direction
    for (const d of [ {x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0} ]) {
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      const key = nx + ',' + ny;
      if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
      if (!obstacles.has(key)) {
        return d;
      }
    }
    // No safe moves, keep current direction
    return snake.dir;
  }

  // Update game state
  function update() {
    if (gameOver) return;

    // CPU snakes choose direction
    for (const snake of snakes) {
      if (snake.isCPU && snake.alive) {
        const newDir = cpuChooseDirection(snake);
        if (newDir) {
          snake.setDirection(newDir);
        }
      }
    }

    // Move all snakes
    for (const snake of snakes) {
      snake.move();
    }

    // Check food collisions
    for (const snake of snakes) {
      if (!snake.alive) continue;
      const head = snake.body[0];
      for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        if (food.pos.x === head.x && food.pos.y === head.y) {
          snake.grow();
          foods.splice(i, 1);
          placeFood();
        }
      }
    }

    // Check if all snakes dead -> game over
    if (snakes.every(s => !s.alive)) {
      endGame();
    }

    updateScores();
  }

  function updateScores() {
    score1Display.textContent = `Player 1 Score: ${snakes[0]?.score || 0}`;
    score2Display.textContent = `Player 2 Score: ${snakes[1]?.score || 0}`;
  }

  // Draw everything
  function draw() {
    drawGrid();
    drawFood();
    drawSnakes();
  }

  // Game loop
  function gameLoop() {
    update();
    draw();
  }

  // Start game
  function startGame() {
    // Reset state
    gameOver = false;
    foods = [];
    snakes = [];
    updateScores();
    gameOverScreen.style.display = 'none';
    startMenu.style.display = 'none';

    // Setup snakes based on mode
    switch (mode) {
      case 'human-human':
        snakes.push(new Snake(1, {x: 5, y: 15}, {x: 1, y: 0}, false));
        snakes.push(new Snake(2, {x: 24, y: 15}, {x: -1, y: 0}, false));
        break;
      case 'cpu-human':
        snakes.push(new Snake(1, {x: 5, y: 15}, {x: 1, y: 0}, true));
        snakes.push(new Snake(2, {x: 24, y: 15}, {x: -1, y: 0}, false));
        break;
      case 'cpu-cpu':
        snakes.push(new Snake(1, {x: 5, y: 15}, {x: 1, y: 0}, true));
        snakes.push(new Snake(2, {x: 24, y: 15}, {x: -1, y: 0}, true));
        break;
    }

    // Place initial food
    placeFood();

    // Focus canvas for keyboard input
    canvas.focus();

    // Start game loop
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, gameSpeed);
  }

  // End game
  function endGame() {
    gameOver = true;
    clearInterval(gameInterval);
    gameInterval = null;
    finalScores.innerHTML = `
      <p>Player 1 Score: ${snakes[0]?.score || 0}</p>
      <p>Player 2 Score: ${snakes[1]?.score || 0}</p>
    `;
    gameOverScreen.style.display = 'flex';
  }

  // Keyboard input handling
  window.addEventListener('keydown', e => {
    if (gameOver) {
      if (e.key.toLowerCase() === 'r') {
        startMenu.style.display = 'flex';
        gameOverScreen.style.display = 'none';
      }
      return;
    }
    if (snakes.length === 0) return;

    // Player 1 controls (Arrow keys)
    if (!snakes[0].isCPU) {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
        snakes[0].setDirection(DIRS[e.code]);
        e.preventDefault();
      }
    }
    // Player 2 controls (WASD)
    if (snakes.length > 1 && !snakes[1].isCPU) {
      if (['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) {
        snakes[1].setDirection(DIRS[e.code]);
        e.preventDefault();
      }
    }
  });

  // Start button handler
  startButton.addEventListener('click', () => {
    const selected = modeForm.elements['mode'].value;
    mode = selected;
    startGame();
  });

  // Accessibility: focus canvas on load
  window.addEventListener('load', () => {
    canvas.setAttribute('tabindex', '0');
  });
})();
</script>
</body>
</html>
