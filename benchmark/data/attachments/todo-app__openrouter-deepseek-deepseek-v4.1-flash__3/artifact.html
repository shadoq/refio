<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #2d3748;
  }

  .app {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  .app-header {
    padding: 28px 28px 20px;
    background: linear-gradient(135deg, #5a67d8 0%, #805ad5 100%);
    color: #ffffff;
  }

  .app-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .app-header p {
    margin-top: 6px;
    font-size: 0.85rem;
    opacity: 0.85;
  }

  .input-row {
    display: flex;
    gap: 10px;
    padding: 20px 28px;
    border-bottom: 1px solid #edf2f7;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 0.95rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-row input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }

  .input-row button {
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .input-row button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
  }

  .input-row button:active {
    transform: translateY(0);
    opacity: 0.9;
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 16px 28px;
    border-bottom: 1px solid #edf2f7;
  }

  .filters button {
    flex: 1;
    padding: 9px 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #4a5568;
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filters button:hover {
    background: #edf2f7;
  }

  .filters button.active {
    color: #ffffff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
  }

  .todo-list {
    list-style: none;
    max-height: 380px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border-bottom: 1px solid #f0f4f8;
    transition: background 0.2s ease;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .todo-item:hover {
    background: #f9fbfd;
  }

  .todo-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #667eea;
  }

  .todo-item .todo-text {
    flex: 1;
    font-size: 0.95rem;
    word-break: break-word;
    transition: color 0.2s ease;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #a0aec0;
  }

  .todo-item .delete-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    color: #a0aec0;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .todo-item .delete-btn:hover {
    color: #e53e3e;
    background: #fff5f5;
  }

  .empty-state {
    padding: 40px 28px;
    text-align: center;
    color: #a0aec0;
    font-size: 0.9rem;
  }

  .app-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    font-size: 0.82rem;
    color: #718096;
    background: #f9fbfd;
  }

  .app-footer .clear-btn {
    font-size: 0.82rem;
    font-weight: 600;
    color: #718096;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .app-footer .clear-btn:hover {
    color: #e53e3e;
  }

  .app-footer .clear-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  @media (max-width: 480px) {
    .input-row,
    .filters,
    .todo-item,
    .app-footer,
    .app-header {
      padding-left: 18px;
      padding-right: 18px;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>My Todos</h1>
      <p>Stay organized and get things done</p>
    </header>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" maxlength="200">
      <button id="add-btn" type="button">Add</button>
    </div>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <footer class="app-footer">
      <span id="items-left">0 items left</span>
      <button type="button" id="clear-completed" class="clear-btn">Clear completed</button>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "todos";

      var todoInput = document.getElementById("todo-input");
      var addBtn = document.getElementById("add-btn");
      var todoList = document.getElementById("todo-list");
      var filtersEl = document.getElementById("filters");
      var itemsLeftEl = document.getElementById("items-left");
      var clearCompletedBtn = document.getElementById("clear-completed");

      var todos = [];
      var currentFilter = "all";

      function loadTodos() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              todos = parsed.filter(function (t) {
                return t && typeof t.text === "string";
              }).map(function (t) {
                return {
                  id: typeof t.id === "number" ? t.id : Date.now() + Math.random(),
                  text: t.text,
                  completed: !!t.completed
                };
              });
            }
          }
        } catch (e) {
          todos = [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          /* storage unavailable */
        }
      }

      function getFilteredTodos() {
        if (currentFilter === "active") {
          return todos.filter(function (t) { return !t.completed; });
        }
        if (currentFilter === "completed") {
          return todos.filter(function (t) { return t.completed; });
        }
        return todos;
      }

      function render() {
        todoList.innerHTML = "";

        var filtered = getFilteredTodos();

        if (filtered.length === 0) {
          var empty = document.createElement("li");
          empty.className = "empty-state";
          if (todos.length === 0) {
            empty.textContent = "No todos yet. Add one above to get started!";
          } else if (currentFilter === "active") {
            empty.textContent = "No active todos. Great job!";
          } else if (currentFilter === "completed") {
            empty.textContent = "No completed todos yet.";
          } else {
            empty.textContent = "Nothing to show.";
          }
          todoList.appendChild(empty);
        } else {
          filtered.forEach(function (todo) {
            var li = document.createElement("li");
            li.className = "todo-item" + (todo.completed ? " completed" : "");
            li.dataset.id = String(todo.id);

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = todo.completed;
            checkbox.setAttribute("aria-label", "Toggle todo");
            checkbox.dataset.action = "toggle";

            var span = document.createElement("span");
            span.className = "todo-text";
            span.textContent = todo.text;

            var delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "delete-btn";
            delBtn.textContent = "\u00D7";
            delBtn.setAttribute("aria-label", "Delete todo");
            delBtn.dataset.action = "delete";

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(delBtn);
            todoList.appendChild(li);
          });
        }

        var activeCount = todos.filter(function (t) { return !t.completed; }).length;
        itemsLeftEl.textContent = activeCount + (activeCount === 1 ? " item left" : " items left");

        var completedCount = todos.length - activeCount;
        clearCompletedBtn.disabled = completedCount === 0;
      }

      function addTodo() {
        var text = todoInput.value.trim();
        if (!text) {
          return;
        }
        todos.push({
          id: Date.now() + Math.random(),
          text: text,
          completed: false
        });
        todoInput.value = "";
        saveTodos();
        render();
        todoInput.focus();
      }

      function toggleTodo(id) {
        for (var i = 0; i < todos.length; i++) {
          if (String(todos[i].id) === String(id)) {
            todos[i].completed = !todos[i].completed;
            break;
          }
        }
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter(function (t) {
          return String(t.id) !== String(id);
        });
        saveTodos();
        render();
      }

      function clearCompleted() {
        todos = todos.filter(function (t) { return !t.completed; });
        saveTodos();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        var buttons = filtersEl.querySelectorAll("button");
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].dataset.filter === filter) {
            buttons[i].classList.add("active");
          } else {
            buttons[i].classList.remove("active");
          }
        }
        render();
      }

      addBtn.addEventListener("click", addTodo);

      todoInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          addTodo();
        }
      });

      todoList.addEventListener("click", function (e) {
        var target = e.target;
        var action = target.dataset ? target.dataset.action : null;
        if (!action) {
          return;
        }
        var li = target.closest(".todo-item");
        if (!li) {
          return;
        }
        var id = li.dataset.id;
        if (action === "toggle") {
          toggleTodo(id);
        } else if (action === "delete") {
          deleteTodo(id);
        }
      });

      todoList.addEventListener("change", function (e) {
        var target = e.target;
        if (target.dataset && target.dataset.action === "toggle") {
          var li = target.closest(".todo-item");
          if (li) {
            toggleTodo(li.dataset.id);
          }
        }
      });

      filtersEl.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (btn && btn.dataset.filter) {
          setFilter(btn.dataset.filter);
        }
      });

      clearCompletedBtn.addEventListener("click", clearCompleted);

      loadTodos();
      render();
    })();
  </script>
</body>
</html>
