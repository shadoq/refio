<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f5f5; }
  h1 { text-align: center; }
  #app { max-width: 600px; margin: 0 auto; background: #fff; padding: 1rem; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  #new-todo { width: 80%; padding: 0.5rem; }
  #add-btn { padding: 0.5rem 1rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  li:last-child { border-bottom: none; }
  li.completed span { text-decoration: line-through; color: #777; }
  .delete-btn { margin-left: auto; background: none; border: none; color: #d00; cursor: pointer; }
  .filters { margin-top: 1rem; text-align: center; }
  .filters button { margin: 0 0.5rem; padding: 0.3rem 0.7rem; }
  .filters button.active { background: #007bff; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <h1>Todo List</h1>
  <div>
    <input type="text" id="new-todo" placeholder="What needs to be done?">
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
</div>
<script>
  const STORAGE_KEY = 'todos';
  const todoListEl = document.getElementById('todo-list');
  const newTodoInput = document.getElementById('new-todo');
  const addBtn = document.getElementById('add-btn');
  const filterButtons = document.querySelectorAll('.filters button');
  let todos = [];
  let currentFilter = 'all';

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function load() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) todos = JSON.parse(data);
  }

  function render() {
    todoListEl.innerHTML = '';
    const filtered = todos.filter(t => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
    });
    filtered.forEach((t, idx) => {
      const li = document.createElement('li');
      if (t.completed) li.classList.add('completed');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = t.completed;
      checkbox.addEventListener('change', () => {
        t.completed = checkbox.checked;
        save();
        render();
      });
      const span = document.createElement('span');
      span.textContent = t.text;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.className = 'delete-btn';
      del.addEventListener('click', () => {
        todos.splice(idx, 1);
        save();
        render();
      });
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(del);
      todoListEl.appendChild(li);
    });
  }

  addBtn.addEventListener('click', () => {
    const text = newTodoInput.value.trim();
    if (!text) return;
    todos.push({ text, completed: false });
    newTodoInput.value = '';
    save();
    render();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  load();
  render();
</script>
</body>
</html>
