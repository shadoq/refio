<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; }
  #gameCanvas { background: #111; margin-top: 20px; }
  #menu, #gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #menu button, #gameOver button { padding: 10px 20px; margin: 10px; font-size: 18px; cursor: pointer; }
  #score { margin-top: 10px; font-size: 18px; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<div id="score"></div>
<div id="menu">
  <h1>Snake Game</h1>
  <button data-mode="hh">Human vs Human</button>
  <button data-mode="ch">CPU vs Human</button>
  <button data-mode="cc">CPU vs CPU</button>
</div>
<div id="gameOver" style="display:none;">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <button id="restartBtn">Restart</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');
const menuDiv = document.getElementById('menu');
const gameOverDiv = document.getElementById('gameOver');
const finalScoreP = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

const GRID_SIZE = 30;
const CELL_SIZE = 20;
const SPEED = 200; // ms per tick

let gameInterval = null;
let mode = null; // 'hh', 'ch', 'cc'
let food = null;

class Snake {
  constructor(color, isCPU = false) {
    this.color = color;
    this.isCPU = isCPU;
    this.reset();
  }
  reset() {
    this.body = [{x: Math.floor(GRID_SIZE/2), y: Math.floor(GRID_SIZE/2)}];
    this.dir = {x: 0, y: 0};
    this.nextDir = {x: 0, y: 0};
    this.alive = true;
    this.score = 0;
  }
  setDirection(dx, dy) {
    if (this.dir.x + dx === 0 && this.dir.y + dy === 0) return; // no reverse
    this.nextDir = {x: dx, y: dy};
  }
  move() {
    if (!this.alive) return;
    this.dir = this.nextDir;
    const newHead = {x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y};
    this.body.unshift(newHead);
    if (newHead.x === food.x && newHead.y === food.y) {
      this.score++;
      generateFood();
    } else {
      this.body.pop();
    }
  }
  checkCollision() {
    if (!this.alive) return;
    const head = this.body[0];
    // Wall collision
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      this.alive = false;
      return;
    }
    // Self collision
    for (let i = 1; i < this.body.length; i++) {
      if (head.x === this.body[i].x && head.y === this.body[i].y) {
        this.alive = false;
        return;
      }
    }
  }
  cpuMove(otherSnake) {
    if (!this.isCPU || !this.alive) return;
    const head = this.body[0];
    const dirs = [
      {x: 1, y: 0},
      {x: -1, y: 0},
      {x: 0, y: 1},
      {x: 0, y: -1}
    ];
    // Prefer direction towards food
    let bestDir = null;
    let minDist = Infinity;
    for (const d of dirs) {
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
      // Check collision with own body
      if (this.body.some(p => p.x === nx && p.y === ny)) continue;
      // Check collision with other snake
      if (otherSnake && otherSnake.body.some(p => p.x === nx && p.y === ny)) continue;
      const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
      if (dist < minDist) {
        minDist = dist;
        bestDir = d;
      }
    }
    if (bestDir) {
      this.setDirection(bestDir.x, bestDir.y);
    } else {
      // No safe move, pick any
      for (const d of dirs) {
        const nx = head.x + d.x;
        const ny = head.y + d.y;
        if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
        if (this.body.some(p => p.x === nx && p.y === ny)) continue;
        if (otherSnake && otherSnake.body.some(p => p.x === nx && p.y === ny)) continue;
        this.setDirection(d.x, d.y);
        break;
      }
    }
  }
}

let snake1 = null;
let snake2 = null;

function initGame() {
  snake1 = new Snake('#0f0', mode === 'ch' || mode === 'cc');
  snake2 = new Snake('#00f', mode === 'cc');
  if (mode === 'hh') {
    snake1.isCPU = false;
    snake2.isCPU = false;
  } else if (mode === 'ch') {
    snake1.isCPU = false;
    snake2.isCPU = true;
  } else if (mode === 'cc') {
    snake1.isCPU = true;
    snake2.isCPU = true;
  }
  generateFood();
  scoreDiv.textContent = `Snake 1: 0 | Snake 2: 0`;
}

function generateFood() {
  let valid = false;
  while (!valid) {
    const x = Math.floor(Math.random() * GRID_SIZE);
    const y = Math.floor(Math.random() * GRID_SIZE);
    if (!snake1.body.some(p => p.x === x && p.y === y) &&
        !snake2.body.some(p => p.x === x && p.y === y)) {
      food = {x, y};
      valid = true;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Draw food
  ctx.fillStyle = '#f00';
  ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
  // Draw snakes
  [snake1, snake2].forEach(snake => {
    if (!snake.alive) return;
    ctx.fillStyle = snake.color;
    snake.body.forEach((p, idx) => {
      ctx.fillRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    });
  });
}

function update() {
  if (!snake1.alive || !snake2.alive) {
    clearInterval(gameInterval);
    gameOver();
    return;
  }
  snake1.cpuMove(snake2);
  snake2.cpuMove(snake1);
  snake1.move();
  snake2.move();
  snake1.checkCollision();
  snake2.checkCollision();
  // Check collision between snakes
  if (snake1.alive && snake2.alive) {
    const head1 = snake1.body[0];
    const head2 = snake2.body[0];
    if (head1.x === head2.x && head1.y === head2.y) {
      snake1.alive = false;
      snake2.alive = false;
    } else {
      // Head-to-body
      if (snake2.body.some(p => p.x === head1.x && p.y === head1.y)) snake1.alive = false;
      if (snake1.body.some(p => p.x === head2.x && p.y === head2.y)) snake2.alive = false;
    }
  }
  scoreDiv.textContent = `Snake 1: ${snake1.score} | Snake 2: ${snake2.score}`;
  draw();
}

function gameOver() {
  const totalScore = snake1.score + snake2.score;
  finalScoreP.textContent = `Total Score: ${totalScore}`;
  gameOverDiv.style.display = 'flex';
}

function startGame() {
  menuDiv.style.display = 'none';
  gameOverDiv.style.display = 'none';
  initGame();
  draw();
  gameInterval = setInterval(update, SPEED);
}

menuDiv.addEventListener('click', e => {
  if (e.target.dataset.mode) {
    mode = e.target.dataset.mode;
    startGame();
  }
});

restartBtn.addEventListener('click', () => {
  startGame();
});

document.addEventListener('keydown', e => {
  if (!snake1.alive || !snake2.alive) return;
  // Human controls
  if (!snake1.isCPU) {
    switch (e.key) {
      case 'ArrowUp': snake1.setDirection(0, -1); break;
      case 'ArrowDown': snake1.setDirection(0, 1); break;
      case 'ArrowLeft': snake1.setDirection(-1, 0); break;
      case 'ArrowRight': snake1.setDirection(1, 0); break;
    }
  }
  if (!snake2.isCPU) {
    switch (e.key) {
      case 'w': case 'W': snake2.setDirection(0, -1); break;
      case 's': case 'S': snake2.setDirection(0, 1); break;
      case 'a': case 'A': snake2.setDirection(-1, 0); break;
      case 'd': case 'D': snake2.setDirection(1, 0); break;
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    startGame();
  }
});
</script>
</body>
</html>
