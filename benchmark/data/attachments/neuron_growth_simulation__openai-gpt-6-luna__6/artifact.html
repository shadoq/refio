<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Neuron Growth</title>
  <style>
    :root {
      color-scheme: dark;
      --ui: #ffd400;
      --background: #05070f;
      --glow: #101a3a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at center, var(--glow) 0%, var(--background) 72%);
      font-family: "Courier New", monospace;
    }

    canvas {
      display: block;
      width: min(800px, calc(100vw - 24px), calc(100vh - 24px));
      height: min(800px, calc(100vw - 24px), calc(100vh - 24px));
      border: 1px solid rgba(0, 229, 255, 0.22);
      background: var(--background);
      box-shadow: 0 0 32px rgba(16, 26, 58, 0.6), 0 0 8px rgba(0, 229, 255, 0.12);
    }

    .dg.main {
      max-height: calc(100vh - 12px);
      overflow-y: auto;
      color: var(--ui);
      text-shadow: 0 0 5px rgba(255, 212, 0, 0.35);
    }

    .dg.main::-webkit-scrollbar {
      width: 5px;
    }

    .dg.main::-webkit-scrollbar-thumb {
      background: rgba(255, 212, 0, 0.55);
    }

    .dg .cr,
    .dg .c input,
    .dg .c select {
      background: rgba(5, 7, 15, 0.94) !important;
    }

    .dg .property-name,
    .dg .title {
      color: var(--ui) !important;
    }

    .dg .c .slider-fg {
      background: var(--ui) !important;
    }

    .dg .c .slider {
      background: rgba(255, 212, 0, 0.18) !important;
    }

    .dg .button . at {
      color: var(--ui) !important;
    }

    @media (max-width: 600px) {
      .dg.main {
        transform: scale(0.8);
        transform-origin: top right;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="800" aria-label="Animated neon neuron network"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const SIZE = 800;
    const MAX_BRANCHES = 450;
    const MAX_SYNAPSES = 120;

    const params = {
      neuronCount: 4,
      growthSpeed: 12,
      maxDepth: 5,
      splitChance: 0.32,
      curvature: 0.65,
      maxBranchLength: 160,
      synapseDistance: 34,
      synapseGlow: 16,
      pulseSpeed: 0.42,
      pulseFrequency: 1.6,
      pulseBrightness: 1,
      backgroundColor: "#05070f",
      branchColor: "#00e5ff",
      accentBranchColor: "#d6ff00",
      synapseColor: "#ff2bd6",
      pulseColor: "#fff36a",
      regenerate: () => setup(),
      clearCanvas: () => clearNetwork(),
      togglePause: () => togglePause()
    };

    let neurons = [];
    let branches = [];
    let synapses = [];
    let pulses = [];
    let synapseKeys = new Set();
    let branchId = 0;
    let growthAccumulator = 0;
    let detectionAccumulator = 0;
    let pulseAccumulator = 0;
    let previousTime = 0;
    let paused = false;
    let cleared = false;
    let gui;

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function hexToRgba(hex, alpha) {
      const clean = hex.replace("#", "");
      const value = parseInt(clean.length === 3
        ? clean.split("").map(character => character + character).join("")
        : clean, 16);
      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function createBranch(neuronId, x, y, angle, depth, lengthBudget) {
      if (branches.length >= MAX_BRANCHES) return null;

      const branch = {
        id: branchId++,
        neuronId,
        x,
        y,
        angle,
        depth,
        length: 0,
        lengthBudget,
        width: Math.max(0.7, random(2.1, 4.1) * (1 - depth * 0.11)),
        segments: [],
        alive: true,
        splitAt: random(0.28, 0.72) * lengthBudget,
        splitChecked: false,
        accent: Math.random() < 0.2 || depth > 2
      };

      branches.push(branch);
      return branch;
    }

    function setup() {
      neurons = [];
      branches = [];
      synapses = [];
      pulses = [];
      synapseKeys = new Set();
      branchId = 0;
      growthAccumulator = 0;
      detectionAccumulator = 0;
      pulseAccumulator = 0;
      paused = false;
      cleared = false;

      const count = Math.max(3, Math.min(6, Math.round(params.neuronCount)));

      for (let i = 0; i < count; i++) {
        const neuron = {
          id: i,
          x: SIZE / 2 + random(-70, 70),
          y: SIZE / 2 + random(-70, 70)
        };
        neurons.push(neuron);

        const branchCount = Math.floor(random(4, 7));
        const baseAngle = random(0, Math.PI * 2);

        for (let j = 0; j < branchCount; j++) {
          const angle = baseAngle + (Math.PI * 2 * j / branchCount) + random(-0.25, 0.25);
          createBranch(i, neuron.x, neuron.y, angle, 0, params.maxBranchLength * random(0.72, 1.18));
        }
      }

      if (gui) {
        params.togglePause = () => togglePause();
        gui.updateDisplay();
      }
    }

    function clearNetwork() {
      neurons = [];
      branches = [];
      synapses = [];
      pulses = [];
      synapseKeys = new Set();
      growthAccumulator = 0;
      detectionAccumulator = 0;
      pulseAccumulator = 0;
      cleared = true;
      paused = false;
    }

    function togglePause() {
      if (cleared) return;
      paused = !paused;
    }

    function growBranches() {
      const activeBranches = branches.slice();

      for (const branch of activeBranches) {
        if (!branch.alive) continue;

        branch.angle += random(-0.19, 0.19) * params.curvature;
        const stepLength = random(2.1, 3.4);
        const nextX = branch.x + Math.cos(branch.angle) * stepLength;
        const nextY = branch.y + Math.sin(branch.angle) * stepLength;

        if (nextX < 8 || nextX > SIZE - 8 || nextY < 8 || nextY > SIZE - 8) {
          branch.alive = false;
          continue;
        }

        const dx = nextX - branch.x;
        const dy = nextY - branch.y;
        const bend = random(-1, 1) * params.curvature * 3.5;

        branch.segments.push({
          x1: branch.x,
          y1: branch.y,
          cx: (branch.x + nextX) / 2 - Math.sin(branch.angle) * bend,
          cy: (branch.y + nextY) / 2 + Math.cos(branch.angle) * bend,
          x2: nextX,
          y2: nextY
        });

        branch.x = nextX;
        branch.y = nextY;
        branch.length += Math.hypot(dx, dy);

        if (
          !branch.splitChecked &&
          branch.depth < params.maxDepth &&
          branches.length < MAX_BRANCHES &&
          branch.length >= branch.splitAt
        ) {
          branch.splitChecked = true;

          if (Math.random() < params.splitChance) {
            const side = Math.random() < 0.5 ? -1 : 1;
            createBranch(
              branch.neuronId,
              branch.x,
              branch.y,
              branch.angle + side * random(0.48, 1.12),
              branch.depth + 1,
              params.maxBranchLength * random(0.24, 0.58)
            );
          }
        }

        if (branch.length >= branch.lengthBudget || branches.length >= MAX_BRANCHES) {
          branch.alive = false;
        }
      }
    }

    function detectSynapses() {
      if (synapses.length >= MAX_SYNAPSES) return;

      for (let i = 0; i < branches.length; i++) {
        const first = branches[i];

        for (let j = i + 1; j < branches.length; j++) {
          const second = branches[j];
          if (first.neuronId === second.neuronId) continue;

          const dx = first.x - second.x;
          const dy = first.y - second.y;
          const distance = Math.hypot(dx, dy);

          if (distance > params.synapseDistance) continue;

          const key = first.id < second.id
            ? `${first.id}:${second.id}`
            : `${second.id}:${first.id}`;

          if (synapseKeys.has(key)) continue;

          synapseKeys.add(key);
          synapses.push({
            first,
            second,
            phase: random(0, Math.PI * 2),
            strength: random(0.65, 1)
          });

          if (synapses.length >= MAX_SYNAPSES) return;
        }
      }
    }

    function updatePulses(deltaTime) {
      for (let i = pulses.length - 1; i >= 0; i--) {
        pulses[i].progress += deltaTime * params.pulseSpeed;
        if (pulses[i].progress >= 1) pulses.splice(i, 1);
      }

      if (synapses.length === 0 || params.pulseFrequency <= 0) return;

      pulseAccumulator += deltaTime * params.pulseFrequency;

      while (pulseAccumulator >= 1) {
        pulseAccumulator -= 1;

        const synapse = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push({
          synapse,
          progress: 0,
          direction: Math.random() < 0.5 ? 1 : -1,
          size: random(2.2, 4)
        });
      }
    }

    function drawBackground(time) {
      ctx.fillStyle = params.backgroundColor;
      ctx.fillRect(0, 0, SIZE, SIZE);

      const glow = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 35, SIZE / 2, SIZE / 2, 570);
      glow.addColorStop(0, "#101a3a");
      glow.addColorStop(0.58, hexToRgba(params.backgroundColor, 0.12));
      glow.addColorStop(1, params.backgroundColor);
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, SIZE, SIZE);

      ctx.save();
      ctx.strokeStyle = "rgba(0, 229, 255, 0.035)";
      ctx.lineWidth = 1;
      for (let x = 40; x < SIZE; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, SIZE);
        ctx.stroke();
      }
      for (let y = 40; y < SIZE; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(SIZE, y);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(0, 229, 255, 0.035)";
      for (let y = 2; y < SIZE; y += 4) {
        ctx.fillRect(0, y, SIZE, 1);
      }

      for (let i = 0; i < 55; i++) {
        const x = Math.random() * SIZE;
        const y = Math.random() * SIZE;
        ctx.fillStyle = `rgba(180, 220, 255, ${Math.random() * 0.055})`;
        ctx.fillRect(x, y, 1, 1);
      }

      const vignette = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 240, SIZE / 2, SIZE / 2, 600);
      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(1, "rgba(0, 0, 0, 0.55)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, SIZE, SIZE);

      ctx.fillStyle = "rgba(255, 212, 0, 0.22)";
      ctx.font = "10px Courier New";
      ctx.fillText(`NEURAL FIELD // ${String(Math.floor(time / 1000)).padStart(4, "0")}`, 18, SIZE - 18);
      ctx.restore();
    }

    function renderBranches() {
      for (const branch of branches) {
        if (branch.segments.length === 0) continue;

        const color = branch.accent ? params.accentBranchColor : params.branchColor;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(branch.segments[0].x1, branch.segments[0].y1);

        for (const segment of branch.segments) {
          ctx.quadraticCurveTo(segment.cx, segment.cy, segment.x2, segment.y2);
        }

        ctx.strokeStyle = color;
        ctx.lineWidth = branch.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = color;
        ctx.shadowBlur = branch.accent ? 10 : 13;
        ctx.globalAlpha = branch.alive ? 0.95 : 0.78;
        ctx.stroke();

        ctx.shadowBlur = 2;
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "#e8fbff";
        ctx.lineWidth = Math.max(0.45, branch.width * 0.22);
        ctx.stroke();
        ctx.restore();
      }
    }

    function renderSynapses(time) {
      for (const synapse of synapses) {
        const { first, second } = synapse;
        const pulse = 0.55 + Math.sin(time * 0.004 + synapse.phase) * 0.22;
        const x = (first.x + second.x) / 2;
        const y = (first.y + second.y) / 2;

        ctx.save();
        ctx.globalAlpha = pulse * synapse.strength;
        ctx.strokeStyle = params.synapseColor;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = params.synapseGlow;
        ctx.beginPath();
        ctx.moveTo(first.x, first.y);
        ctx.lineTo(second.x, second.y);
        ctx.stroke();

        ctx.fillStyle = params.synapseColor;
        ctx.beginPath();
        ctx.arc(x, y, 2 + pulse * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function renderPulses() {
      for (const pulse of pulses) {
        const { first, second } = pulse.synapse;
        const progress = pulse.direction === 1 ? pulse.progress : 1 - pulse.progress;
        const x = first.x + (second.x - first.x) * progress;
        const y = first.y + (second.y - first.y) * progress;

        ctx.save();
        ctx.globalAlpha = Math.max(0.12, params.pulseBrightness);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowColor = params.pulseColor;
        ctx.shadowBlur = 15 * params.pulseBrightness;
        ctx.beginPath();
        ctx.arc(x, y, pulse.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function renderNeurons(time) {
      for (const neuron of neurons) {
        const radius = 5 + Math.sin(time * 0.003 + neuron.id) * 0.8;
        ctx.save();
        ctx.fillStyle = params.accentBranchColor;
        ctx.shadowColor = params.accentBranchColor;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(neuron.x, neuron.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f5ffff";
        ctx.beginPath();
        ctx.arc(neuron.x, neuron.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function render(time) {
      drawBackground(time);
      renderBranches();
      renderSynapses(time);
      renderPulses();
      renderNeurons(time);
    }

    function setupGUI() {
      if (!window.dat || !window.dat.GUI) return;

      gui = new window.dat.GUI({ width: 300 });
      const growth = gui.addFolder("Growth");
      growth.add(params, "neuronCount", 3, 6, 1).name("Neuron count").onFinishChange(() => setup());
      growth.add(params, "growthSpeed", 1, 40, 1).name("Growth speed");
      growth.add(params, "maxDepth", 1, 8, 1).name("Max branch depth");
      growth.add(params, "splitChance", 0, 0.8, 0.01).name("Branch split chance");
      growth.add(params, "curvature", 0, 1.5, 0.01).name("Branch curvature");
      growth.add(params, "maxBranchLength", 50, 300, 1).name("Max branch length");

      const synapseFolder = gui.addFolder("Synapses");
      synapseFolder.add(params, "synapseDistance", 8, 80, 1).name("Distance threshold");
      synapseFolder.add(params, "synapseGlow", 0, 36, 1).name("Synapse glow strength");

      const pulsesFolder = gui.addFolder("Pulses");
      pulsesFolder.add(params, "pulseSpeed", 0.08, 1.5, 0.01).name("Pulse speed");
      pulsesFolder.add(params, "pulseFrequency", 0, 8, 0.1).name("Pulse frequency");
      pulsesFolder.add(params, "pulseBrightness", 0.1, 2, 0.05).name("Pulse brightness");

      const visuals = gui.addFolder("Visuals");
      visuals.addColor(params, "backgroundColor").name("Background color");
      visuals.addColor(params, "branchColor").name("Branch color");
      visuals.addColor(params, "accentBranchColor").name("Accent branch color");
      visuals.addColor(params, "synapseColor").name("Synapse color");
      visuals.addColor(params, "pulseColor").name("Pulse color");

      gui.add(params, "regenerate").name("Regenerate network");
      gui.add(params, "clearCanvas").name("Clear canvas");
      gui.add(params, "togglePause").name("Pause / resume animation");

      growth.open();
    }

    function setupLoop(time) {
      const deltaTime = previousTime ? Math.min((time - previousTime) / 1000, 0.05) : 0;
      previousTime = time;

      if (!paused && !cleared) {
        growthAccumulator += deltaTime * params.growthSpeed;

        while (growthAccumulator >= 1) {
          growthAccumulator -= 1;
          growBranches();
        }

        detectionAccumulator += deltaTime;
        if (detectionAccumulator >= 0.22) {
          detectionAccumulator = 0;
          detectSynapses();
        }

        updatePulses(deltaTime);
      }

      render(time);
      requestAnimationFrame(setupLoop);
    }

    setupGUI();
    setup();
    requestAnimationFrame(setupLoop);
  </script>
</body>
</html>
