<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIFACT: Museum Night</title>
    <style>:root {
    --background: #070506;
    --velvet: #1a0710;
    --burgundy: #3a0f1d;
    --midnight-navy: #07111f;
    --gold: #d6ad60;
    --soft-gold: #f3d79b;
    --ivory-text: #f8efe2;
    --muted-text: #b9a999;
    --panel: rgba(255, 244, 220, 0.06);
    --border: rgba(214, 173, 96, 0.28);
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', 'system-ui', 'Segoe UI', sans-serif;
    background: var(--background);
    color: var(--ivory-text);
    line-height: 1.6;
}

h1, h2, h3, h4, h5, h6 {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--ivory-text);
}

/* Grain/noise overlay */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='none' stroke='none'/><pattern id='noise' width='10' height='10' patternUnits='userSpaceOnUse'><path d='M0,0 L10,10 M10,0 L0,10' stroke='rgba(255,255,255,0.05)' stroke-width='0.5'/></pattern><rect width='100%' height='100%' fill='url(#noise)'/></svg>');
    z-index: -1;
    pointer-events: none;
}

/* Other global styles */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
}

/* Glass panel effect */
.glass-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    backdrop-filter: blur(10px);
}

/* Soft spotlight gradient for hero */
.hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, transparent 50%, var(--velvet) 100%);
    z-index: 1;
}

/* Smooth scroll for nav links */
html {
    scroll-behavior: smooth;
/* Navbar styles */
.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--velvet);
  padding: 1rem 0;
}

.container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-links {
  display: flex;
  list-style: none;
  gap: 1.5rem;
}

.nav-links a {
  color: var(--ivory-text);
  text-decoration: none;
  transition: color 0.3s;
}

.nav-links a:hover {
  color: var(--gold);
}

.cta-button {
  background: var(--gold);
  color: var(--background);
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.3s;
}

.cta-button:hover {
  background: var(--soft-gold);
}

.mobile-menu {
  display: none;
}

/* For mobile: */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--velvet);
    padding: 1rem;
    gap: 1rem;
  }
  .nav-links.active {
    display: flex;
  }
  .mobile-menu {
    display: block;
  }
}
/* Hero styles */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
}

.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.3));
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: 3;
  color: var(--ivory-text);
  text-align: center;
  padding: 2rem;
  max-width: 800px;
  margin: 0 auto;
}

.cta-buttons {
  margin-top: 2rem;
  display: flex;
  justify-content: center;
  gap: 1rem;
}

.event-details p {
  margin: 0.5rem 0;
  font-size: 1.1rem;
}

/* Existing spotlight gradient */
.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, transparent 50%, var(--velvet) 100%);
  z-index: 1;
}
}</style>
</head>
<body>
    <nav class="navbar">
  <div class="container">
    <a href="#" class="logo">ARTIFACT</a>
    <ul class="nav-links">
      <li><a href="#program">Program</a></li>
      <li><a href="#artists">Artists</a></li>
      <li><a href="#venue">Venue</a></li>
      <li><a href="#tickets">Tickets</a></li>
      <li><a href="#faq">FAQ</a></li>
    </ul>
    <button class="cta-button">Get Tickets</button>
    <div class="mobile-menu">
      <button class="menu-toggle">☰</button>
    </div>
  </div>
</nav>
<section class="hero">
  <div class="hero-bg" style="background-image: url('https://source.unsplash.com/featured/2400x1400?museum,night')"></div>
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h1>Museum Night, Reimagined</h1>
    <h2>ARTIFACT: Museum Night</h2>
    <div class="event-details">
      <p>18 October 2026</p>
      <p>19:00–02:00</p>
      <p>The Old Gallery, Warsaw</p>
    </div>
    <div class="cta-buttons">
      <button class="cta-button">Get Tickets</button>
      <button class="cta-button">Save to Calendar</button>
    </div>
  </div>
</section>
<script></script>
</body>
</html>
