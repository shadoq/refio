<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --completed: #9ca3af;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 45%, #ecfeff 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.6rem, 2vw, 2rem);
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      background: inherit;
      color: inherit;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.15s ease, opacity 0.15s ease;
    }

    button:active { transform: translateY(1px); }

    .add-btn {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    .add-btn:hover { background: var(--accent-hover); }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-btn {
      background: #eef2ff;
      color: #3730a3;
      font-weight: 600;
      padding: 10px 14px;
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .clear-btn {
      background: transparent;
      color: var(--danger);
      padding: 0;
      font-weight: 600;
    }

    .clear-btn:hover { color: var(--danger-hover); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.85);
    }

    .todo-content {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .todo-text {
      word-break: break-word;
      line-height: 1.35;
      flex: 1;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--completed);
    }

    .delete-btn {
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .delete-btn:hover { background: #fecaca; }

    .empty {
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    @media (max-width: 520px) {
      .app { padding: 18px; }
      .input-row { flex-direction: column; }
      .meta { flex-direction: column; align-items: flex-start; }
      .todo-item { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todo App</h1>

    <form id="todo-form" class="input-row" autocomplete="off">
      <input id="todo-input" type="text" placeholder="Add a new todo..." aria-label="Todo text" />
      <button class="add-btn" type="submit">Add</button>
    </form>

    <div class="filters" role="tablist" aria-label="Todo filters">
      <button class="filter-btn active" type="button" data-filter="all">All</button>
      <button class="filter-btn" type="button" data-filter="active">Active</button>
      <button class="filter-btn" type="button" data-filter="completed">Completed</button>
    </div>

    <div class="meta">
      <span id="todo-count">0 items</span>
      <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
    </div>

    <ul id="todo-list" aria-label="Todo list"></ul>
    <p id="empty-state" class="empty" hidden>No todos yet. Add one above.</p>
  </main>

  <script>
    const STORAGE_KEY = 'todo_openai_gpt_5_4_mini_06';

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const count = document.getElementById('todo-count');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));

    let todos = loadTodos();
    let currentFilter = 'all';

    function loadTodos() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(todo => !todo.completed);
      if (currentFilter === 'completed') return todos.filter(todo => todo.completed);
      return todos;
    }

    function updateCounts() {
      const total = todos.length;
      const active = todos.filter(todo => !todo.completed).length;
      count.textContent = `${active} active, ${total} total`;
      clearCompletedBtn.hidden = !todos.some(todo => todo.completed);
    }

    function renderTodos() {
      list.innerHTML = '';
      const filtered = getFilteredTodos();

      emptyState.hidden = todos.length !== 0 && filtered.length !== 0;
      if (todos.length === 0) {
        emptyState.textContent = 'No todos yet. Add one above.';
        emptyState.hidden = false;
      } else if (filtered.length === 0) {
        emptyState.textContent = `No ${currentFilter} todos.`;
        emptyState.hidden = false;
      }

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item${todo.completed ? ' completed' : ''}`;
        li.dataset.id = todo.id;

        li.innerHTML = `
          <div class="todo-content">
            <input class="todo-checkbox" type="checkbox" ${todo.completed ? 'checked' : ''} aria-label="Mark todo complete" />
            <span class="todo-text"></span>
          </div>
          <button class="delete-btn" type="button" aria-label="Delete todo">Delete</button>
        `;

        li.querySelector('.todo-text').textContent = todo.text;

        li.querySelector('.todo-checkbox').addEventListener('change', () => {
          todo.completed = !todo.completed;
          saveTodos();
          renderTodos();
        });

        li.querySelector('.delete-btn').addEventListener('click', () => {
          todos = todos.filter(item => item.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        list.appendChild(li);
      });

      updateCounts();
      filterButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === currentFilter));
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      todos.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        text,
        completed: false,
      });

      input.value = '';
      saveTodos();
      renderTodos();
      input.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        renderTodos();
      });
    });

    clearCompletedBtn.addEventListener('click', () => {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      renderTodos();
    });

    renderTodos();
  </script>
</body>
</html>
