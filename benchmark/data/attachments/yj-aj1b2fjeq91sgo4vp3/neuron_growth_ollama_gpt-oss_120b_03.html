<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Neural Network</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #05070f;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
canvas {
  background: #05070f;
  box-shadow: 0 0 30px #101a3a;
}
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
/* ==================== Parameters ==================== */
const params = {
  neuronCount: 4,
  branchGrowthSpeed: 0.8,
  maxBranchDepth: 5,
  branchSplitChance: 0.3,
  branchCurvature: 0.5,
  maxBranchLength: 120,
  synapseDistanceThreshold: 20,
  synapseGlowStrength: 30,
  pulseSpeed: 2.5,
  pulseFrequency: 0.8,
  pulseBrightness: 1.0,
  backgroundColor: '#05070f',
  branchColor: '#00e5ff',
  accentBranchColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  pause: false
};

/* ==================== Canvas Setup ==================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ==================== Data Structures ==================== */
let neurons = [], branches = [], tips = [], synapses = [], pulses = [];
let lastPulseTime = 0;
let animationId;

/* ==================== Utility Functions ==================== */
function rand(min, max) { return Math.random() * (max - min) + min; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpPos(p1, p2, t) { return { x: lerp(p1.x, p2.x, t), y: lerp(p1.y, p2.y, t) }; }

/* ==================== GUI ==================== */
const gui = new dat.GUI({ width: 300 });
const growth = gui.addFolder('Growth');
growth.add(params, 'neuronCount', 3, 6, 1);
growth.add(params, 'branchGrowthSpeed', 0.1, 2);
growth.add(params, 'maxBranchDepth', 2, 8, 1);
growth.add(params, 'branchSplitChance', 0, 1);
growth.add(params, 'branchCurvature', 0, 1);
growth.add(params, 'maxBranchLength', 50, 200);
growth.open();

const syn = gui.addFolder('Synapses');
syn.add(params, 'synapseDistanceThreshold', 5, 40);
syn.add(params, 'synapseGlowStrength', 10, 60);
syn.open();

const pulse = gui.addFolder('Pulses');
pulse.add(params, 'pulseSpeed', 0.5, 5);
pulse.add(params, 'pulseFrequency', 0.1, 2);
pulse.add(params, 'pulseBrightness', 0.2, 2);
pulse.open();

const visuals = gui.addFolder('Visuals');
visuals.addColor(params, 'backgroundColor');
visuals.addColor(params, 'branchColor');
visuals.addColor(params, 'accentBranchColor');
visuals.addColor(params, 'synapseColor');
visuals.addColor(params, 'pulseColor');
visuals.open();

gui.add({ regenerate: regenerate }, 'regenerate');
gui.add({ clear: clearCanvas }, 'clear');
gui.add(params, 'pause').name('Pause/Resume');

/* ==================== Core Functions ==================== */
function regenerate() {
  clearAll();
  initNeurons();
}
function clearCanvas() {
  clearAll();
}
function clearAll() {
  neurons = []; branches = []; tips = []; synapses = []; pulses = [];
}
function initNeurons() {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < params.neuronCount; i++) {
    const angle = rand(0, Math.PI * 2);
    const r = rand(20, 60);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const neuron = { x, y };
    neurons.push(neuron);
    const root = createBranch(neuron, 0, null);
    branches.push(root);
    tips.push(root);
  }
}
function createBranch(start, depth, parent) {
  const angle = rand(0, Math.PI * 2);
  const length = rand(30, params.maxBranchLength);
  const ctrlDist = length * params.branchCurvature;
  const ctrlAngle = angle + rand(-Math.PI / 4, Math.PI / 4);
  const end = {
    x: start.x + Math.cos(angle) * length,
    y: start.y + Math.sin(angle) * length
  };
  const ctrl = {
    x: start.x + Math.cos(ctrlAngle) * ctrlDist,
    y: start.y + Math.sin(ctrlAngle) * ctrlDist
  };
  return {
    start,
    ctrl,
    end,
    progress: 0,
    depth,
    parent,
    children: [],
    lineWidth: lerp(2, 0.5, depth / params.maxBranchDepth)
  };
}
function growBranches(delta) {
  const newTips = [];
  tips.forEach(tip => {
    tip.progress += params.branchGrowthSpeed * delta;
    if (tip.progress >= 1) {
      tip.progress = 1;
      // possibly split
      if (tip.depth < params.maxBranchDepth && Math.random() < params.branchSplitChance) {
        const child1 = createBranch(tip.end, tip.depth + 1, tip);
        const child2 = createBranch(tip.end, tip.depth + 1, tip);
        tip.children.push(child1, child2);
        branches.push(child1, child2);
        newTips.push(child1, child2);
      } else if (tip.depth < params.maxBranchDepth) {
        const child = createBranch(tip.end, tip.depth + 1, tip);
        tip.children.push(child);
        branches.push(child);
        newTips.push(child);
      }
    } else {
      newTips.push(tip);
    }
  });
  tips = newTips;
}
function detectSynapses() {
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i].end, b = tips[j].end;
      if (dist(a, b) < params.synapseDistanceThreshold) {
        const exists = synapses.some(s => (s.a === a && s.b === b) || (s.a === b && s.b === a));
        if (!exists) synapses.push({ a, b, glow: 0 });
      }
    }
  }
}
function spawnPulses(time) {
  if (time - lastPulseTime > 1000 / params.pulseFrequency) {
    lastPulseTime = time;
    synapses.forEach(s => {
      pulses.push({ a: s.a, b: s.b, t: 0 });
    });
  }
}
function updatePulses(delta) {
  pulses = pulses.filter(p => {
    p.t += params.pulseSpeed * delta * 0.001;
    return p.t <= 1;
  });
}

/* ==================== Rendering ==================== */
function drawBackground() {
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grad.addColorStop(0, params.backgroundColor);
  grad.addColorStop(1, '#101a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}
function drawVignette() {
  const vign = ctx.createRadialGradient(W / 2, H / 2, W / 2 * 0.6, W / 2, H / 2, W / 2);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, W, H);
}
function drawBranches() {
  ctx.lineCap = 'round';
  branches.forEach(b => {
    const prog = Math.min(b.progress, 1);
    const cp = {
      x: lerp(b.start.x, b.ctrl.x, prog),
      y: lerp(b.start.y, b.ctrl.y, prog)
    };
    const ep = {
      x: lerp(b.start.x, b.end.x, prog),
      y: lerp(b.start.y, b.end.y, prog)
    };
    ctx.beginPath();
    ctx.moveTo(b.start.x, b.start.y);
    ctx.quadraticCurveTo(cp.x, cp.y, ep.x, ep.y);
    ctx.strokeStyle = params.branchColor;
    ctx.lineWidth = b.lineWidth;
    ctx.shadowColor = params.branchColor;
    ctx.shadowBlur = 12;
    ctx.stroke();
  });
}
function drawSynapses() {
  synapses.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.a.x, s.a.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlowStrength;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.b.x, s.b.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}
function drawPulses() {
  pulses.forEach(p => {
    const pos = lerpPos(p.a, p.b, p.t);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 15 * params.pulseBrightness;
    ctx.fill();
  });
}

/* ==================== Main Loop ==================== */
let lastTime = performance.now();
function animate(time) {
  const delta = time - lastTime;
  lastTime = time;
  if (!params.pause) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawBranches();
    detectSynapses();
    drawSynapses();
    spawnPulses(time);
    updatePulses(delta);
    drawPulses();
    drawVignette();
    growBranches(delta);
  }
  animationId = requestAnimationFrame(animate);
}
regenerate();
animate(performance.now());
</script>
</body>
</html>
