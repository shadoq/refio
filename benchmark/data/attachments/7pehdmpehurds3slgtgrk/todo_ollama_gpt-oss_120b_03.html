<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .todo-app {
    background: #fff;
    margin: 2rem;
    padding: 1.5rem;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 2rem;
    text-align: center;
    color: #333;
  }
  #new-todo {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
  }
  #todo-list {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
  }
  .todo-item {
    display: flex;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
  }
  .todo-item:last-child {
    border-bottom: none;
  }
  .todo-item input[type="checkbox"] {
    margin-right: 0.75rem;
    width: 1rem;
    height: 1rem;
  }
  .todo-text {
    flex: 1;
    word-break: break-word;
  }
  .todo-text.completed {
    text-decoration: line-through;
    color: #777;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #c00;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.5rem;
  }
  .filters {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .filter {
    background: transparent;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .filter.selected {
    border-color: #333;
    font-weight: bold;
  }
  @media (max-width: 400px) {
    .todo-app {
      margin: 1rem;
      padding: 1rem;
    }
    h1 {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>
<div class="todo-app">
  <h1>Todo</h1>
  <input id="new-todo" type="text" placeholder="What needs to be done?" autocomplete="off">
  <ul id="todo-list"></ul>
  <div class="filters">
    <button class="filter selected" data-filter="all">All</button>
    <button class="filter" data-filter="active">Active</button>
    <button class="filter" data-filter="completed">Completed</button>
  </div>
</div>
<script>
  const STORAGE_KEY = 'todos-ollama';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const newTodoInput = document.getElementById('new-todo');
  const todoList = document.getElementById('todo-list');
  const filterButtons = document.querySelectorAll('.filter');

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo(text) {
    const todo = {
      id: Date.now(),
      text: text.trim(),
      completed: false
    };
    todos.push(todo);
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    filterButtons.forEach(btn => btn.classList.toggle('selected', btn.dataset.filter === filter));
    render();
  }

  function render() {
    // Clear list
    todoList.innerHTML = '';
    // Filter todos
    const filtered = todos.filter(todo => {
      if (currentFilter === 'active') return !todo.completed;
      if (currentFilter === 'completed') return todo.completed;
      return true;
    });
    // Create list items
    filtered.forEach(todo => {
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.dataset.id = todo.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.className = 'todo-text' + (todo.completed ? ' completed' : '');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '&times;';
      delBtn.title = 'Delete';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      todoList.appendChild(li);
    });
  }

  // Add new todo on Enter
  newTodoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && newTodoInput.value.trim() !== '') {
      addTodo(newTodoInput.value);
      newTodoInput.value = '';
    }
  });

  // Filter buttons
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  // Initial render
  render();
</script>
</body>
</html>
