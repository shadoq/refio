    this.sound = false;
    this.running = false;
    this.needsRedraw = false;
    
    // Load font set
    for (let i = 0; i < FONT_SET.length; i++) {
      this.memory[0x050 + i] = FONT_SET[i];
    }
    
    // Load demo ROM
    this.loadROM(DEMO_ROM_COMPLETE);
  }
  
  loadROM(rom) {
    for (let i = 0; i < rom.length; i++) {
      this.memory[0x200 + i] = rom[i];
    }
    this.pc = 0x200;
    this.stack = [];
    this.sp = 0;
    this.V = new Uint8Array(16);
    this.I = 0;
    this.dt = 0;
    this.st = 0;
    this.display = new Uint8Array(64 * 32);
    this.needsRedraw = true;
  }
  
  loadROMFromFile(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    // Find where the ROM starts (usually 0x200)
    // For simplicity, we'll load it at 0x200
    for (let i = 0; i < bytes.length && i < MEMORY_SIZE - 0x200; i++) {
      this.memory[0x200 + i] = bytes[i];
    }
    this.pc = 0x200;
    this.stack = [];
    this.sp = 0;
    this.V = new Uint8Array(16);
    this.I = 0;
    this.dt = 0;
    this.st = 0;
    this.display = new Uint8Array(64 * 32);
    this.needsRedraw = true;
  }
  
  // Fetch next instruction (2 bytes)
  fetch() {
    const hi = this.memory[this.pc];
    const lo = this.memory[this.pc + 1];
    this.pc += 2;
    return (hi << 8) | lo;
  }
  
  // Decode and execute instruction
  execute(instr) {
    const op = instr >> 12;
    const x = (instr >> 8) & 0xF;
    const y = (instr >> 4) & 0xF;
    const n = instr & 0xF;
    const nn = instr & 0xFF;
    const nnn = instr & 0x0FFF;
    
    switch (op) {
      case 0x0:
        if (instr === 0x00E0) {
          // Clear screen
          this.display = new Uint8Array(64 * 32);
          this.needsRedraw = true;
        } else if (instr === 0x00EE) {
          // Return from subroutine
          if (this.sp > 0) {
            this.sp--;
            this.pc = this.stack[this.sp];
          }
        }
        break;
        
      case 0x1:
        // Jump to address NNN
        this.pc = nnn;
        break;
        
      case 0x2:
        // Call subroutine at NNN
        this.stack[this.sp] = this.pc;
        this.sp++;
        this.pc = nnn;
        break;
        
      case 0x3:
        // Skip next if VX == NN
        if (this.V[x] === nn) {
          this.pc += 2;
        }
        break;
        
      case 0x4:
        // Skip next if VX != NN
        if (this.V[x] !== nn) {
          this.pc += 2;
        }
        break;
        
      case 0x5:
        // Skip next if VX == VY
        if (this.V[x] === this.V[y]) {
          this.pc += 2;
        }
        break;
        
      case 0x6:
        // VX = NN
        this.V[x] = nn;
        break;
        
      case 0x7:
        // VX += NN
        this.V[x] = (this.V[x] + nn) & 0xFF;
        break;
        
      case 0x8:
        switch (n) {
          case 0x0:
            // VX = VY
            this.V[x] = this.V[y];
            break;
          case 0x1:
            // VX |= VY
            this.V[x] |= this.V[y];
            break;
          case 0x2:
            // VX &= VY
            this.V[x] &= this.V[y];
            break;
          case 0x3:
            // VX ^= VY
            this.V[x] ^= this.V[y];
            break;
          case 0x4:
            // VX += VY, VF = carry
            const sum = this.V[x] + this.V[y];
            this.V[0xF] = sum > 0xFF ? 1 : 0;
            this.V[x] = sum & 0xFF;
            break;
          case 0x5:
            // VX -= VY, VF = not borrow
            this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
            this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
            break;
          case 0x6:
            // VX >>= 1, VF = LSB
            this.V[0xF] = this.V[x] & 0x1;
            this.V[x] >>= 1;
            break;
          case 0x7:
            // VX = VY - VX, VF = not borrow
            this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
            this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
            break;
          case 0xE:
            // VX <<= 1, VF = MSB
            this.V[0xF] = (this.V[x] & 0x80) >> 7;
            this.V[x] = (this.V[x] << 1) & 0xFF;
            break;
        }
        break;
        
      case 0x9:
        // Skip next if VX != VY
        if (this.V[x] !== this.V[y]) {
          this.pc += 2;
        }
        break;
        
      case 0xA:
        // I = NNN
        this.I = nnn;
        break;
        
      case 0xB:
        // Jump to NNN + V0
        this.pc = nnn + this.V[0];
        break;
        
      case 0xC:
        // VX = random & NN
        this.V[x] = Math.floor(Math.random() * 256) & nn;
        break;
        
      case 0xD:
        // Draw sprite at (VX, VY) with N bytes from memory[I]
        this.drawSprite(this.V[x], this.V[y], n);
        break;
        
      case 0xE:
        if (instr === 0x00EE) {
          // Already handled above
        } else if (instr === 0x009E) {
          // Skip next if key VX is pressed
          if (this.keys[this.V[x]] !== 0) {
            this.pc += 2;
          }
        } else if (instr === 0x009F) {
          // Skip next if key VX is not pressed
          if (this.keys[this.V[x]] === 0) {
            this.pc += 2;
          }
        }
        break;
        
      case 0xF:
        switch (instr & 0xFF) {
          case 0x07:
            // VX = DT
            this.V[x] = this.dt;
            break;
          case 0x0A:
            // Wait for key press, store in VX
            this.waitForKey(x);
            break;
          case 0x15:
            // DT = VX
            this.dt = this.V[x];
            break;
          case 0x18:
            // ST = VX
            this.st = this.V[x];
            break;
          case 0x1E:
            // I += VX
            this.I = (this.I + this.V[x]) & 0xFFF;
            break;
          case 0x29:
            // I = font address for VX
            this.I = 0x050 + this.V[x] * 5;
            break;
          case 0x33:
            // BCD of VX at memory[I]
            const val = this.V[x];
            this.memory[this.I] = Math.floor(val / 100);
            this.memory[this.I + 1] = Math.floor((val % 100) / 10);
            this.memory[this.I + 2] = val % 10;
            break;
          case 0x55:
            // Store V0-VX at memory[I]
            for (let i = 0; i <= x; i++) {
              this.memory[this.I + i] = this.V[i];
            }
            // Some implementations increment I, but we'll follow modern behavior
            break;
          case 0x65:
            // Load V0-VX from memory[I]
            for (let i = 0; i <= x; i++) {
              this.V[i] = this.memory[this.I + i];
            }
            break;
        }
        break;
    }
  }
  
  drawSprite(x, y, n) {
    this.V[0xF] = 0;
    for (let row = 0; row < n; row++) {
      const spriteByte = this.memory[this.I + row];
      for (let col = 0; col < 8; col++) {
        const pixel = (spriteByte >> (7 - col)) & 1;
        if (pixel) {
          const px = (x + col) % 64;
          const py = (y + row) % 32;
          const idx = py * 64 + px;
          this.display[idx] ^= 1;
          if (this.display[idx] === 0) {
            this.V[0xF] = 1;
          }
        }
      }
    }
    this.needsRedraw = true;
  }
  
  waitForKey(vx) {
    // This is a blocking operation in real CHIP-8
    // In our emulator, we'll set a flag and handle it in the main loop
    this.waitingForKey = vx;
  }
  
  updateTimers() {
    if (this.dt > 0) {
      this.dt--;
    }
    if (this.st > 0) {
      this.st--;
      if (this.st === 0) {
        this.sound = false;
      }
    }
  }
  
  step() {
    if (this.waitingForKey !== null) {
      // Check if a key is pressed
      const vx = this.waitingForKey;
      if (this.keys[vx] !== 0) {
        this.V[vx] = this.keys[vx];
        this.waitingForKey = null;
      } else {
        // No key pressed yet, don't advance PC
        // We need to re-execute the wait instruction
        this.pc -= 2;
        return;
      }
    }
    
    const instr = this.fetch();
    this.execute(instr);
    this.updateTimers();
  }
  
  getState() {
    return {
      pc: this.pc,
      I: this.I,
      sp: this.sp,
      dt: this.dt,
      st: this.st,
      V: Array.from(this.V),
      stack: Array.from(this.stack),
      waitingForKey: this.waitingForKey
    };
  }
}

// ============================================================
// UI and Controls
// ============================================================

const canvas = document.getElementById('display');
const ctx = canvas.getContext('2d');
const chip8 = new Chip8();

// Key mapping: CHIP-8 keys to keyboard keys
const KEY_MAP = {
  '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
  'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
  'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
  'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
};

const KEY_LABELS = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', 'z', 'x', 'c', 'v'];

// Create keypad
const keypad = document.getElementById('keypad');
KEY_LABELS.forEach((label, i) => {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.dataset.key = i;
  btn.addEventListener('mousedown', () => {
    chip8.keys[i] = 1;
    btn.classList.add('active');
    chip8.sound = chip8.st > 0;
  });
  btn.addEventListener('mouseup', () => {
    chip8.keys[i] = 0;
    btn.classList.remove('active');
    chip8.sound = chip8.st > 0;
  });
  btn.addEventListener('mouseleave', () => {
    chip8.keys[i] = 0;
    btn.classList.remove('active');
    chip8.sound = chip8.st > 0;
  });
  keypad.appendChild(btn);
});

// Keyboard events
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (KEY_MAP[key] !== undefined) {
    e.preventDefault();
    chip8.keys[KEY_MAP[key]] = 1;
    chip8.sound = chip8.st > 0;
    // Update keypad button
    const buttons = keypad.querySelectorAll('button');
    buttons.forEach((btn, i) => {
      if (i === KEY_MAP[key]) {
        btn.classList.add('active');
      }
    });
  }
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (KEY_MAP[key] !== undefined) {
    e.preventDefault();
    chip8.keys[KEY_MAP[key]] = 0;
    chip8.sound = chip8.st > 0;
    // Update keypad button
    const buttons = keypad.querySelectorAll('button');
    buttons.forEach((btn, i) => {
      if (i === KEY_MAP[key]) {
        btn.classList.remove('active');
      }
    });
  }
});

// Controls
const runBtn = document.getElementById('run-btn');
const pauseBtn = document.getElementById('pause-btn');
const stepBtn = document.getElementById('step-btn');
const resetBtn = document.getElementById('reset-btn');
const speedSlider = document.getElementById('speed-slider');
const speedDisplay = document.getElementById('speed-display');
const romFileInput = document.getElementById('rom-file');
const statusEl = document.getElementById('status');

let running = false;
let speed = 5;

runBtn.addEventListener('click', () => {
  if (!running) {
    running = true;
    runBtn.textContent = 'Running...';
    runBtn.disabled = true;
    pauseBtn.disabled = false;
    statusEl.innerHTML = 'Status: <span>Running</span>';
    requestAnimationFrame(gameLoop);
  }
});

pauseBtn.addEventListener('click', () => {
  running = false;
  runBtn.textContent = 'Run';
  runBtn.disabled = false;
  pauseBtn.disabled = true;
  statusEl.innerHTML = 'Status: <span>Paused</span>';
});

stepBtn.addEventListener('click', () => {
  if (!running) {
    chip8.step();
    chip8.needsRedraw = true;
    updateDebugger();
    drawDisplay();
    statusEl.innerHTML = 'Status: <span>Stepped</span>';
  }
});

resetBtn.addEventListener('click', () => {
  running = false;
  runBtn.textContent = 'Run';
  runBtn.disabled = false;
  pauseBtn.disabled = true;
  chip8.loadROM(DEMO_ROM_COMPLETE);
  updateDebugger();
  drawDisplay();
  statusEl.innerHTML = 'Status: <span>Reset</span>';
});

speedSlider.addEventListener('input', () => {
  speed = parseInt(speedSlider.value);
  speedDisplay.textContent = speed;
});

romFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      chip8.loadROMFromFile(event.target.result);
      updateDebugger();
      drawDisplay();
      statusEl.innerHTML = 'Status: <span>ROM loaded</span>';
    };
    reader.readAsArrayBuffer(file);
  }
});

// Game loop
let lastTime = 0;
let instructionCount = 0;

function gameLoop(timestamp) {
  if (!running) return;
  
  const interval = 1000 / 60; // 60 Hz
  const stepsPerFrame = speed * 2; // Adjust based on speed slider
  
  if (timestamp - lastTime >= interval) {
    lastTime = timestamp;
    for (let i = 0; i < stepsPerFrame; i++) {
      chip8.step();
      instructionCount++;
    }
    chip8.needsRedraw = true;
    updateDebugger();
    drawDisplay();
  }
  
  if (running) {
    requestAnimationFrame(gameLoop);
  }
}

// Draw display
function drawDisplay() {
  if (!chip8.needsRedraw) return;
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 64, 32);
  
  ctx.fillStyle = '#00ff88';
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 64; x++) {
      if (chip8.display[y * 64 + x]) {
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  
  chip8.needsRedraw = false;
}

// Update debugger
function updateDebugger() {
  const state = chip8.getState();
  
  document.getElementById('dbg-pc').textContent = '0x' + state.pc.toString(16).padStart(3, '0').toUpperCase();
  document.getElementById('dbg-i').textContent = '0x' + state.I.toString(16).padStart(3, '0').toUpperCase();
  document.getElementById('dbg-sp').textContent = state.sp;
  document.getElementById('dbg-dt').textContent = state.dt;
  document.getElementById('dbg-st').textContent = state.st;
  
  // Registers
  const regsEl = document.getElementById('dbg-regs');
  regsEl.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const row = document.createElement('div');
    row.className = 'debug-row';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = 'V' + i.toString(16).toUpperCase() + ':';
    const value = document.createElement('span');
    value.className = 'value';
    value.textContent = '0x' + state.V[i].toString(16).padStart(2, '0').toUpperCase() + ' (' + state.V[i] + ')';
    row.appendChild(label);
    row.appendChild(value);
    regsEl.appendChild(row);
  }
  
  // Current instruction
  const instrEl = document.getElementById('dbg-instr');
  if (state.pc < 0x200 || state.pc >= MEMORY_SIZE - 1) {
    instrEl.textContent = '--';
  } else {
    const hi = chip8.memory[state.pc];
    const lo = chip8.memory[state.pc + 1];
    const instr = (hi << 8) | lo;
    const op = instr >> 12;
    const x = (instr >> 8) & 0xF;
    const y = (instr >> 4) & 0xF;
    const n = instr & 0xF;
    const nn = instr & 0xFF;
    const nnn = instr & 0x0FFF;
    
    let desc = '';
    switch (op) {
      case 0x0:
        if (instr === 0x00E0) desc = 'CLS';
        else if (instr === 0x00EE) desc = 'RET';
        else desc = 'UNKNOWN';
        break;
      case 0x1: desc = 'JP 0x' + nnn.toString(16).toUpperCase(); break;
      case 0x2: desc = 'CALL 0x' + nnn.toString(16).toUpperCase(); break;
      case 0x3: desc = 'SE V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase(); break;
      case 0x4: desc = 'SNE V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase(); break;
      case 0x5: desc = 'SE V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
      case 0x6: desc = 'LD V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase(); break;
      case 0x7: desc = 'ADD V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase(); break;
      case 0x8:
        switch (n) {
          case 0x0: desc = 'LD V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x1: desc = 'OR V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x2: desc = 'AND V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x3: desc = 'XOR V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x4: desc = 'ADD V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x5: desc = 'SUB V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0x6: desc = 'SHR V' + x.toString(16).toUpperCase(); break;
          case 0x7: desc = 'SUBN V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
          case 0xE: desc = 'SHL V' + x.toString(16).toUpperCase(); break;
          default: desc = 'UNKNOWN';
        }
        break;
      case 0x9: desc = 'SNE V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase(); break;
      case 0xA: desc = 'LD I, 0x' + nnn.toString(16).toUpperCase(); break;
      case 0xB: desc = 'JP V0, 0x' + nnn.toString(16).toUpperCase(); break;
      case 0xC: desc = 'RND V' + x.toString(16).toUpperCase() + ', 0x' + nn.toString(16).toUpperCase(); break;
      case 0xD: desc = 'DRW V' + x.toString(16).toUpperCase() + ', V' + y.toString(16).toUpperCase() + ', ' + n; break;
      case 0xE:
        if (instr === 0x009E) desc = 'SKP V' + x.toString(16).toUpperCase();
        else if (instr === 0x009F) desc = 'SKNP V' + x.toString(16).toUpperCase();
        else desc = 'UNKNOWN';
        break;
      case 0xF:
        switch (instr & 0xFF) {
          case 0x07: desc = 'LD V' + x.toString(16).toUpperCase() + ', DT'; break;
          case 0x0A: desc = 'LD V' + x.toString(16).toUpperCase() + ', K'; break;
          case 0x15: desc = 'LD DT, V' + x.toString(16).toUpperCase(); break;
          case 0x18: desc = 'LD ST, V' + x.toString(16).toUpperCase(); break;
          case 0x1E: desc = 'ADD I, V' + x.toString(16).toUpperCase(); break;
          case 0x29: desc = 'LD F, V' + x.toString(16).toUpperCase(); break;
          case 0x33: desc = 'BCD V' + x.toString(16).toUpperCase(); break;
          case 0x55: desc = 'LD [I], V' + x.toString(16).toUpperCase(); break;
          case 0x65: desc = 'LD V' + x.toString(16).toUpperCase() + ', [I]'; break;
          default: desc = 'UNKNOWN';
        }
        break;
      default: desc = 'UNKNOWN';
    }
    
    instrEl.textContent = '0x' + state.pc.toString(16).padStart(3, '0').toUpperCase() + ': ' +
      instr.toString(16).toUpperCase().padStart(4, '0') + ' - ' + desc;
  }
  
  // Stack
  const stackEl = document.getElementById('dbg-stack');
  stackEl.innerHTML = '';
  for (let i = 0; i < state.sp; i++) {
    const div = document.createElement('div');
    div.textContent = '0x' + state.stack[i].toString(16).padStart(3, '0').toUpperCase();
    stackEl.appendChild(div);
  }
  if (state.sp === 0) {
    stackEl.textContent = '(empty)';
  }
}

// Initial draw
drawDisplay();
updateDebugger();
pauseBtn.disabled = true;
statusEl.innerHTML = 'Status: <span>Ready</span>';
</script>
