<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #ef4444;
    --border: #e5e7eb;
    --completed: #9ca3af;
    --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 560px;
    height: fit-content;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 28px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .input-row input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .input-row button {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .input-row button:hover { background: var(--primary-hover); }
  .input-row button:active { transform: scale(0.98); }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 6px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.2s ease;
  }

  li:last-child { border-bottom: none; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
    cursor: pointer;
    flex-shrink: 0;
  }

  li .text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
    cursor: pointer;
    transition: color 0.15s;
  }

  li.completed .text {
    text-decoration: line-through;
    color: var(--completed);
  }

  li .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  li .delete-btn:hover {
    color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 0.95rem;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .count {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .filters {
    display: flex;
    gap: 6px;
  }

  .filters button {
    padding: 6px 12px;
    font-size: 0.875rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filters button:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .filters button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .clear-completed {
    padding: 6px 12px;
    font-size: 0.875rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .clear-completed:hover:not(:disabled) {
    border-color: var(--danger);
    color: var(--danger);
  }

  .clear-completed:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 480px) {
    .app { padding: 20px; }
    .footer { flex-direction: column; align-items: stretch; }
    .filters { justify-content: center; }
    .clear-completed { align-self: center; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Todo List</h1>

  <form id="todo-form" class="input-row">
    <label for="todo-input" style="position:absolute;left:-9999px;">Add a new todo</label>
    <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <ul id="todo-list" aria-live="polite"></ul>
  <div id="empty-state" class="empty" hidden>No todos here.</div>

  <div class="footer">
    <span id="count" class="count">0 items left</span>
    <div class="filters" role="group" aria-label="Filter todos">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <button type="button" id="clear-completed" class="clear-completed">Clear completed</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todo-app:v1';

  var state = {
    todos: [],
    filter: 'all'
  };

  var form = document.getElementById('todo-form');
  var input = document.getElementById('todo-input');
  var list = document.getElementById('todo-list');
  var emptyState = document.getElementById('empty-state');
  var countEl = document.getElementById('count');
  var clearBtn = document.getElementById('clear-completed');
  var filterBtns = document.querySelectorAll('.filters button');

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          state.todos = parsed.filter(function (t) {
            return t && typeof t.id === 'string' && typeof t.text === 'string';
          }).map(function (t) {
            return { id: t.id, text: t.text, completed: !!t.completed };
          });
        }
      }
    } catch (e) {
      state.todos = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.todos));
    } catch (e) { /* ignore quota errors */ }
  }

  function uid() {
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  }

  function addTodo(text) {
    var trimmed = text.trim();
    if (!trimmed) return;
    state.todos.push({ id: uid(), text: trimmed, completed: false });
    save();
    render();
  }

  function toggleTodo(id) {
    var t = state.todos.find(function (todo) { return todo.id === id; });
    if (t) {
      t.completed = !t.completed;
      save();
      render();
    }
  }

  function deleteTodo(id) {
    state.todos = state.todos.filter(function (todo) { return todo.id !== id; });
    save();
    render();
  }

  function clearCompleted() {
    state.todos = state.todos.filter(function (todo) { return !todo.completed; });
    save();
    render();
  }

  function setFilter(f) {
    state.filter = f;
    render();
  }

  function getVisible() {
    if (state.filter === 'active') {
      return state.todos.filter(function (t) { return !t.completed; });
    }
    if (state.filter === 'completed') {
      return state.todos.filter(function (t) { return t.completed; });
    }
    return state.todos.slice();
  }

  function render() {
    var visible = getVisible();

    list.innerHTML = '';
    visible.forEach(function (todo) {
      var li = document.createElement('li');
      if (todo.completed) li.classList.add('completed');

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.setAttribute('aria-label', 'Mark "' + todo.text + '" as ' + (todo.completed ? 'active' : 'completed'));
      checkbox.addEventListener('change', function () { toggleTodo(todo.id); });

      var span = document.createElement('span');
      span.className = 'text';
      span.textContent = todo.text;
      span.addEventListener('click', function () { toggleTodo(todo.id); });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.setAttribute('aria-label', 'Delete "' + todo.text + '"');
      del.innerHTML = '&times;';
      del.addEventListener('click', function () { deleteTodo(todo.id); });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });

    emptyState.hidden = visible.length !== 0;
    if (visible.length === 0) {
      if (state.todos.length === 0) {
        emptyState.textContent = 'No todos yet. Add one above!';
      } else if (state.filter === 'active') {
        emptyState.textContent = 'No active todos. All done!';
      } else {
        emptyState.textContent = 'No completed todos.';
      }
    }

    var remaining = state.todos.filter(function (t) { return !t.completed; }).length;
    countEl.textContent = remaining + (remaining === 1 ? ' item left' : ' items left');

    filterBtns.forEach(function (btn) {
      if (btn.getAttribute('data-filter') === state.filter) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    var completedCount = state.todos.length - remaining;
    clearBtn.disabled = completedCount === 0;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    addTodo(input.value);
    input.value = '';
    input.focus();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setFilter(btn.getAttribute('data-filter'));
    });
  });

  clearBtn.addEventListener('click', clearCompleted);

  load();
  render();
})();
</script>
</body>
</html>
