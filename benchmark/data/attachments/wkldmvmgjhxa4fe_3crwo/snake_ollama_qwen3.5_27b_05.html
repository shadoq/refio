<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .score {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 150px;
        }

        .score span {
            color: #4ade80;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #4ade80;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            background: #0a0a0a;
        }

        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
            z-index: 100;
        }

        .menu h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #4ade80;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: transparent;
            color: #4ade80;
            border: 2px solid #4ade80;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .menu-btn:hover {
            background: #4ade80;
            color: #0a0a0a;
            transform: scale(1.05);
        }

        .game-over {
            display: none;
        }

        .game-over h2 {
            color: #ef4444;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .controls-info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .hidden {
            display: none !important;
        }

        .mode-indicator {
            margin-bottom: 10px;
            font-size: 1rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME</h1>
        <div class="mode-indicator" id="modeIndicator"></div>
        <div class="score-board">
            <div class="score">Player 1: <span id="score1">0</span></div>
            <div class="score">Player 2: <span id="score2">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls-info">
            Player 1: Arrow Keys | Player 2: WASD | Restart: Enter/R
        </div>
    </div>

    <div class="menu" id="startMenu">
        <h2>SELECT MODE</h2>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="startGame('human-human')">Human vs Human</button>
            <button class="menu-btn" onclick="startGame('cpu-human')">CPU vs Human</button>
            <button class="menu-btn" onclick="startGame('cpu-cpu')">CPU vs CPU</button>
        </div>
    </div>

    <div class="menu game-over" id="gameOverMenu">
        <h2>GAME OVER</h2>
        <div class="final-score" id="finalScore"></div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="restartGame()">Play Again</button>
            <button class="menu-btn" onclick="showMainMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const tileCount = canvas.width / gridSize;
        const tileCountY = canvas.height / gridSize;

        let gameMode = '';
        let gameRunning = false;
        let gameLoop = null;
        let gameSpeed = 100;

        let snake1 = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            score: 0,
            color: '#4ade80',
            isCPU: false
        };

        let snake2 = {
            body: [],
            direction: { x: -1, y: 0 },
            nextDirection: { x: -1, y: 0 },
            score: 0,
            color: '#60a5fa',
            isCPU: false
        };

        let food = { x: 15, y: 15 };

        function initSnakes() {
            snake1.body = [
                { x: 5, y: 15 },
                { x: 4, y: 15 },
                { x: 3, y: 15 }
            ];
            snake1.direction = { x: 1, y: 0 };
            snake1.nextDirection = { x: 1, y: 0 };
            snake1.score = 0;

            snake2.body = [
                { x: 24, y: 15 },
                { x: 25, y: 15 },
                { x: 26, y: 15 }
            ];
            snake2.direction = { x: -1, y: 0 };
            snake2.nextDirection = { x: -1, y: 0 };
            snake2.score = 0;
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCountY);
                valid = true;
                for (let snake of [snake1, snake2]) {
                    for (let segment of snake.body) {
                        if (segment.x === food.x && segment.y === food.y) {
                            valid = false;
                            break;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            drawSnake(snake1);
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            for (let i = 0; i < snake.body.length; i++) {
                const segment = snake.body[i];
                const isHead = i === 0;
                const size = isHead ? gridSize - 2 : gridSize - 4;
                const offset = isHead ? 1 : 2;
                
                ctx.fillRect(
                    segment.x * gridSize + offset,
                    segment.y * gridSize + offset,
                    size,
                    size
                );

                if (isHead) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(segment.x * gridSize + gridSize/2 - 4, segment.y * gridSize + gridSize/2 - 2, 3, 0, Math.PI * 2);
                    ctx.arc(segment.x * gridSize + gridSize/2 + 4, segment.y * gridSize + gridSize/2 - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = snake.color;
                }
            }
        }

        function moveSnake(snake) {
            snake.direction = snake.nextDirection;
            const head = {
                x: snake.body[0].x + snake.direction.x,
                y: snake.body[0].y + snake.direction.y
            };

            snake.body.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScore();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollision(snake) {
            const head = snake.body[0];

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            for (let i = 1; i < snake.body.length; i++) {
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                    return true;
                }
            }

            const otherSnake = snake === snake1 ? snake2 : snake1;
            for (let segment of otherSnake.body) {
                if (head.x === segment.x && head.y === segment.y) {
                    return true;
                }
            }

            return false;
        }

        function updateScore() {
            document.getElementById('score1').textContent = snake1.score;
            document.getElementById('score2').textContent = snake2.score;
        }

        function gameStep() {
            if (!gameRunning) return;

            if (snake1.isCPU) {
                cpuMove(snake1);
            }
            if (snake2.isCPU) {
                cpuMove(snake2);
            }

            moveSnake(snake1);
            moveSnake(snake2);

            if (checkCollision(snake1) || checkCollision(snake2)) {
                gameOver();
                return;
            }

            draw();
        }

        function cpuMove(snake) {
            const head = snake.body[0];
            const directions = [
                { x: 0, y: -1 },
                { x: 0, y: 1 },
                { x: -1, y: 0 },
                { x: 1, y: 0 }
            ];

            let bestMove = null;
            let bestDistance = Infinity;

            for (let dir of directions) {
                if (dir.x === -snake.direction.x && dir.y === -snake.direction.y) continue;

                const newX = head.x + dir.x;
                const newY = head.y + dir.y;

                if (isSafe(snake, newX, newY)) {
                    const distance = Math.abs(newX - food.x) + Math.abs(newY - food.y);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestMove = dir;
                    }
                }
            }

            if (bestMove) {
                snake.nextDirection = bestMove;
            }
        }

        function isSafe(snake, x, y) {
            if (x < 0 || x >= tileCount || y < 0 || y >= tileCount) return false;

            for (let segment of snake.body) {
                if (segment.x === x && segment.y === y) return false;
            }

            const otherSnake = snake === snake1 ? snake2 : snake1;
            for (let segment of otherSnake.body) {
                if (segment.x === x && segment.y === y) return false;
            }

            return true;
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').style.display = 'none';

            let modeText = '';
            if (mode === 'human-human') {
                snake1.isCPU = false;
                snake2.isCPU = false;
                modeText = 'Mode: Human vs Human';
            } else if (mode === 'cpu-human') {
                snake1.isCPU = true;
                snake2.isCPU = false;
                modeText = 'Mode: CPU vs Human';
            } else {
                snake1.isCPU = true;
                snake2.isCPU = true;
                modeText = 'Mode: CPU vs CPU';
            }

            document.getElementById('modeIndicator').textContent = modeText;

            initSnakes();
            spawnFood();
            updateScore();
            draw();

            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);

            let winner = '';
            if (snake1.score > snake2.score) {
                winner = 'Player 1 Wins!';
            } else if (snake2.score > snake1.score) {
                winner = 'Player 2 Wins!';
            } else {
                winner = 'It\'s a Tie!';
            }

            document.getElementById('finalScore').innerHTML = 
                `Final Score:<br>Player 1: ${snake1.score}<br>Player 2: ${snake2.score}<br><br>${winner}`;
            document.getElementById('gameOverMenu').style.display = 'block';
        }

        function restartGame() {
            startGame(gameMode);
        }

        function showMainMenu() {
            document.getElementById('gameOverMenu').style.display = 'none';
            document.getElementById('startMenu').classList.remove('hidden');
            clearInterval(gameLoop);
            gameRunning = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
                if (!gameRunning && document.getElementById('gameOverMenu').style.display === 'block') {
                    restartGame();
                }
            }

            if (!gameRunning) return;

            if (!snake1.isCPU) {
                switch(e.key) {
                    case 'ArrowUp':
                        if (snake1.direction.y !== 1) snake1.nextDirection = { x: 0, y: -1 };
                        break;
                    case 'ArrowDown':
                        if (snake1.direction.y !== -1) snake1.nextDirection = { x: 0, y: 1 };
                        break;
                    case 'ArrowLeft':
                        if (snake1.direction.x !== 1) snake1.nextDirection = { x: -1, y: 0 };
                        break;
                    case 'ArrowRight':
                        if (snake1.direction.x !== -1) snake1.nextDirection = { x: 1, y: 0 };
                        break;
                }
            }

            if (!snake2.isCPU) {
                switch(e.key) {
                    case 'w':
                    case 'W':
                        if (snake2.direction.y !== 1) snake2.nextDirection = { x: 0, y: -1 };
                        break;
                    case 's':
                    case 'S':
                        if (snake2.direction.y !== -1) snake2.nextDirection = { x: 0, y: 1 };
                        break;
                    case 'a':
                    case 'A':
                        if (snake2.direction.x !== 1) snake2.nextDirection = { x: -1, y: 0 };
                        break;
                    case 'd':
                    case 'D':
                        if (snake2.direction.x !== -1) snake2.nextDirection = { x: 1, y: 0 };
                        break;
                }
            }
        });
    </script>
</body>
</html>
