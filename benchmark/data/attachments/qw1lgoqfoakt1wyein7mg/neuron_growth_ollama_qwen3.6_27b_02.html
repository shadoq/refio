<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
            border: 1px solid #101a3a;
        }
        .dg.ac {
            z-index: 1000 !important;
        }
    </style>
</head>
<body>
    <canvas id="simCanvas" width="800" height="800"></canvas>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        const params = {
            // Growth
            neuronCount: 4,
            growthSpeed: 2,
            maxDepth: 5,
            splitChance: 0.3,
            curvature: 0.5,
            maxLength: 100,
            
            // Synapses
            synapseThreshold: 40,
            synapseGlow: 15,
            
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.05,
            pulseBrightness: 1.0,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Actions
            regenerate: () => init(),
            clear: () => {
                branches = [];
                synapses = [];
                pulses = [];
                activeTips = [];
            },
            pause: () => {
                isPaused = !isPaused;
                if (!isPaused) loop();
            }
        };

        let isPaused = false;
        let branches = [];
        let synapses = [];
        let pulses = [];
        let activeTips = []; // Tips currently growing
        let growthStabilized = false;
        let pulseTimer = 0;

        // --- Classes ---

        class Branch {
            constructor(x, y, angle, depth, parent = null) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parent = parent;
                this.length = 0;
                this.maxLength = params.maxLength * (0.8 + Math.random() * 0.4);
                this.thickness = Math.max(0.5, (params.maxDepth - depth) * 0.8);
                this.isAccent = Math.random() < 0.1;
                this.finished = false;
                this.tipX = x;
                this.tipY = y;
                this.controlX = x + Math.cos(angle) * 10;
                this.controlY = y + Math.sin(angle) * 10;
            }

            update() {
                if (this.finished) return;

                this.length += params.growthSpeed;
                
                // Calculate new tip position based on quadratic curve logic approximation for growth
                // Simple linear growth towards target for performance, visual curve drawn in render
                const progress = this.length / this.maxLength;
                
                // Target point
                const targetX = this.x + Math.cos(this.angle) * this.maxLength;
                const targetY = this.y + Math.sin(this.angle) * this.maxLength;

                // Current tip
                this.tipX = this.x + (targetX - this.x) * progress;
                this.tipY = this.y + (targetY - this.y) * progress;

                if (this.length >= this.maxLength) {
                    this.finished = true;
                    // Chance to split
                    if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                        this.split();
                    }
                }
            }

            split() {
                const numSplits = Math.random() < 0.2 ? 3 : 2;
                for (let i = 0; i < numSplits; i++) {
                    const newAngle = this.angle + (Math.random() - 0.5) * params.curvature * 2;
                    const newBranch = new Branch(this.tipX, this.tipY, newAngle, this.depth + 1, this);
                    branches.push(newBranch);
                    activeTips.push(newBranch);
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                
                // Quadratic curve for organic look
                // Control point moves slightly to simulate organic sway
                const sway = Math.sin(Date.now() * 0.001 + this.x) * 2;
                const midX = (this.x + this.tipX) / 2 + Math.cos(this.angle + Math.PI/2) * sway;
                const midY = (this.y + this.tipY) / 2 + Math.sin(this.angle + Math.PI/2) * sway;

                ctx.quadraticCurveTo(midX, midY, this.tipX, this.tipY);
                
                ctx.strokeStyle = this.isAccent ? params.accentColor : params.branchColor;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                
                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.strokeStyle;
                
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset for performance
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.b1 = branch1;
                this.b2 = branch2;
                // Store connection points at creation time
                this.x1 = branch1.tipX;
                this.y1 = branch1.tipY;
                this.x2 = branch2.tipX;
                this.y2 = branch2.tipY;
                this.x = (this.x1 + this.x2) / 2;
                this.y = (this.y1 + this.y2) / 2;
                this.radius = 2 + Math.random() * 2;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            draw(ctx) {
                const pulse = Math.sin(Date.now() * 0.005 + this.pulsePhase) * 0.5 + 0.5;
                const glow = params.synapseGlow * pulse;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = params.synapseColor;
                ctx.shadowBlur = glow;
                ctx.shadowColor = params.synapseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(startX, startY, endX, endY) {
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.progress = 0;
                this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
                this.active = true;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw(ctx) {
                if (!this.active) return;
                
                const x = this.startX + (this.endX - this.startX) * this.progress;
                const y = this.startY + (this.endY - this.startY) * this.progress;
                
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.globalAlpha = params.pulseBrightness * (1 - this.progress);
                ctx.shadowBlur = 10;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        // --- Core Logic ---

        function init() {
            branches = [];
            synapses = [];
            pulses = [];
            activeTips = [];
            growthStabilized = false;
            pulseTimer = 0;

            const centerX = width / 2;
            const centerY = height / 2;
            const count = Math.floor(params.neuronCount);

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const dist = 50 + Math.random() * 50;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                
                // Create initial seed branches radiating outwards
                const numInitialBranches = 3 + Math.floor(Math.random() * 3);
                for (let j = 0; j < numInitialBranches; j++) {
                    const bAngle = angle + (Math.random() - 0.5);
                    const b = new Branch(x, y, bAngle, 0);
                    branches.push(b);
                    activeTips.push(b);
                }
            }
        }

        function checkSynapses() {
            // Only check active tips against all other tips/branches for performance
            // This is a simplified O(N^2) check, optimized by only checking tips
            const tipsToCheck = [...activeTips];
            
            // Also check recently finished branches
            branches.forEach(b => {
                if (b.finished && !tipsToCheck.includes(b)) {
                    tipsToCheck.push(b);
                }
            });

            for (let i = 0; i < tipsToCheck.length; i++) {
                for (let j = i + 1; j < tipsToCheck.length; j++) {
                    const b1 = tipsToCheck[i];
                    const b2 = tipsToCheck[j];
                    
                    const dx = b1.tipX - b2.tipX;
                    const dy = b1.tipY - b2.tipY;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < params.synapseThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.b1 === b1 && s.b2 === b2) || (s.b1 === b2 && s.b2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                            
                            // Trigger pulse
                            if (Math.random() < params.pulseFrequency) {
                                pulses.push(new Pulse(b1.tipX, b1.tipY, b2.tipX, b2.tipY));
                                pulses.push(new Pulse(b2.tipX, b2.tipY, b1.tipX, b1.tipY));
                            }
                        }
                    }
                }
            }
        }

        function spawnMaintenancePulses() {
            if (synapses.length === 0) return;
            
            pulseTimer++;
            // Spawn pulses periodically based on frequency
            // Higher frequency = more frequent pulses
            const spawnInterval = Math.max(5, Math.floor(60 / (params.pulseFrequency * 10)));
            
            if (pulseTimer % spawnInterval === 0) {
                // Pick a random synapse
                const synapse = synapses[Math.floor(Math.random() * synapses.length)];
                
                // Random direction
                if (Math.random() < 0.5) {
                    pulses.push(new Pulse(synapse.x1, synapse.y1, synapse.x2, synapse.y2));
                } else {
                    pulses.push(new Pulse(synapse.x2, synapse.y2, synapse.x1, synapse.y1));
                }
            }
        }

        function drawBackground() {
            // Clear with background color
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);

            // Vignette
            const gradient = ctx.createRadialGradient(width/2, height/2, width/4, width/2, height/2, width/1.5);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Scanlines
            ctx.fillStyle = 'rgba(0, 229, 255, 0.03)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 1);
            }

            // Subtle background noise for gritty feel
            if (Math.random() < 0.3) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }

        function loop() {
            if (isPaused) return;

            drawBackground();

            // Update and Draw Branches
            activeTips = activeTips.filter(b => !b.finished);
            
            branches.forEach(b => {
                b.update();
                b.draw(ctx);
            });

            // Check if growth has stabilized
            if (activeTips.length === 0 && !growthStabilized) {
                growthStabilized = true;
            }

            // Check for new connections (only during active growth)
            if (!growthStabilized) {
                checkSynapses();
            }

            // Draw Synapses
            synapses.forEach(s => s.draw(ctx));

            // Spawn maintenance pulses when growth is stable
            if (growthStabilized) {
                spawnMaintenancePulses();
            }

            // Update and Draw Pulses
            pulses = pulses.filter(p => p.active);
            pulses.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            requestAnimationFrame(loop);
        }

        // --- GUI Setup ---
        const gui = new dat.GUI();
        
        const folderGrowth = gui.addFolder('Growth');
        folderGrowth.add(params, 'neuronCount', 1, 10).step(1).name('Neuron Count');
        folderGrowth.add(params, 'growthSpeed', 0.1, 10).name('Growth Speed');
        folderGrowth.add(params, 'maxDepth', 1, 10).step(1).name('Max Depth');
        folderGrowth.add(params, 'splitChance', 0, 1).name('Split Chance');
        folderGrowth.add(params, 'curvature', 0, 2).name('Curvature');
        folderGrowth.add(params, 'maxLength', 20, 200).name('Max Length');
        folderGrowth.open();

        const folderSynapses = gui.addFolder('Synapses');
        folderSynapses.add(params, 'synapseThreshold', 10, 100).name('Distance Threshold');
        folderSynapses.add(params, 'synapseGlow', 0, 50).name('Glow Strength');
        folderSynapses.open();

        const folderPulses = gui.addFolder('Pulses');
        folderPulses.add(params, 'pulseSpeed', 0.001, 0.1).name('Speed');
        folderPulses.add(params, 'pulseFrequency', 0, 1).name('Frequency');
        folderPulses.add(params, 'pulseBrightness', 0, 2).name('Brightness');
        folderPulses.open();

        const folderVisuals = gui.addFolder('Visuals');
        folderVisuals.addColor(params, 'bgColor').name('Background');
        folderVisuals.addColor(params, 'branchColor').name('Branch Color');
        folderVisuals.addColor(params, 'accentColor').name('Accent Branch');
        folderVisuals.addColor(params, 'synapseColor').name('Synapse Color');
        folderVisuals.addColor(params, 'pulseColor').name('Pulse Color');
        folderVisuals.open();

        const folderActions = gui.addFolder('Actions');
        folderActions.add(params, 'regenerate').name('Regenerate Network');
        folderActions.add(params, 'clear').name('Clear Canvas');
        folderActions.add(params, 'pause').name('Pause/Resume');
        folderActions.open();

        // Start
        init();
        loop();

    </script>
</body>
</html>
