<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: #05070f;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: monospace;
}
#scene {
  background: #05070f;
  border: 1px solid rgba(0,229,255,0.25);
  border-radius: 6px;
  box-shadow: 0 0 25px rgba(0,229,255,0.25), 0 0 90px rgba(16,26,58,0.9);
}
</style>
</head>
<body>
<canvas id="scene" width="800" height="800"></canvas>
<script>
// --- Setup ---
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = 800, H = 800;
const cx = 400, cy = 400;

const BG_GLOW = '#101a3a';
const UI_ACCENT = '#ffd400';

const params = {
  neuronCount: 5,
  growthSpeed: 2.2,
  maxDepth: 5,
  splitChance: 0.32,
  curvature: 0.35,
  maxLength: 140,
  synapseDistance: 26,
  synapseGlow: 18,
  pulseSpeed: 2.5,
  pulseFrequency: 0.03,
  pulseBrightness: 1.0,
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a'
};

let neurons = [];
let branches = [];
let active = [];
let synapses = [];
let pulses = [];
let synapseKeys = new Set();
let branchId = 0;
let paused = false;
let time = 0;
let frameCount = 0;
let growthDone = false;
let justFinished = false;

ctx.lineCap = 'round';

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// scanline pattern (pre-rendered)
const scanlineCanvas = document.createElement('canvas');
scanlineCanvas.width = W;
scanlineCanvas.height = H;
const sctx = scanlineCanvas.getContext('2d');
sctx.fillStyle = 'rgba(0,229,255,0.08)';
for (let y = 0; y < H; y += 4) {
  sctx.fillRect(0, y, W, 1);
}

// vignette (pre-rendered)
const vignetteCanvas = document.createElement('canvas');
vignetteCanvas.width = W;
vignetteCanvas.height = H;
const vctx = vignetteCanvas.getContext('2d');
const vgrad = vctx.createRadialGradient(cx, cy, W * 0.45, cx, cy, Math.hypot(W, H) / 2);
vgrad.addColorStop(0, 'rgba(0,0,0,0)');
vgrad.addColorStop(1, 'rgba(0,0,0,0.55)');
vctx.fillStyle = vgrad;
vctx.fillRect(0, 0, W, H);

// --- GUI setup ---
function setupGUI() {
  const gui = new dat.GUI();

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(params, 'neuronCount', 3, 6, 1).onChange(regenerate);
  fGrowth.add(params, 'growthSpeed', 0.5, 8);
  fGrowth.add(params, 'maxDepth', 1, 8, 1).onChange(regenerate);
  fGrowth.add(params, 'splitChance', 0, 0.8).onChange(regenerate);
  fGrowth.add(params, 'curvature', 0, 1.2).onChange(regenerate);
  fGrowth.add(params, 'maxLength', 40, 300).onChange(regenerate);

  const fSyn = gui.addFolder('Synapses');
  fSyn.add(params, 'synapseDistance', 5, 80);
  fSyn.add(params, 'synapseGlow', 0, 40);

  const fPulse = gui.addFolder('Pulses');
  fPulse.add(params, 'pulseSpeed', 0.5, 8);
  fPulse.add(params, 'pulseFrequency', 0, 0.2);
  fPulse.add(params, 'pulseBrightness', 0.2, 2);

  const fVis = gui.addFolder('Visuals');
  fVis.addColor(params, 'bgColor');
  fVis.addColor(params, 'branchColor');
  fVis.addColor(params, 'accentColor');
  fVis.addColor(params, 'synapseColor');
  fVis.addColor(params, 'pulseColor');

  const actions = {
    'regenerate network': function() { regenerate(); },
    'clear canvas': function() { clearCanvas(); },
    'pause/resume animation': function() { paused = !paused; }
  };
  gui.add(actions, 'regenerate network');
  gui.add(actions, 'clear canvas');
  gui.add(actions, 'pause/resume animation');

  fGrowth.open();
  fSyn.open();
  fPulse.open();
  fVis.open();
}

// --- Neuron growth ---
function regenerate() {
  neurons = [];
  branches = [];
  active = [];
  synapses = [];
  pulses = [];
  synapseKeys = new Set();
  growthDone = false;
  justFinished = false;
  for (let i = 0; i < params.neuronCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 130 * Math.sqrt(Math.random());
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    neurons.push({ x: x, y: y, r: 4 + Math.random() * 2, phase: Math.random() * Math.PI * 2 });
    const n = 2 + Math.floor(Math.random() * 3);
    for (let j = 0; j < n; j++) {
      spawnBranch(x, y, Math.random() * Math.PI * 2, 0, 1.6 + Math.random() * 1.0);
    }
  }
}

function spawnBranch(x, y, angle, depth, width) {
  if (branches.length >= 600) {
    for (let i = 0; i < active.length; i++) active[i].done = true;
    active.length = 0;
    return;
  }
  const branch = {
    id: branchId++,
    points: [{ x: x, y: y }],
    angle: angle,
    depth: depth,
    len: 0,
    maxLen: params.maxLength * (0.45 + Math.random() * 0.55),
    width: width * (0.9 + Math.random() * 0.2),
    accent: Math.random() < 0.22,
    done: false
  };
  branches.push(branch);
  active.push(branch);
}

function growStep() {
  for (let i = active.length - 1; i >= 0; i--) {
    const b = active[i];
    if (!b) continue;
    b.angle += (Math.random() - 0.5) * 2 * params.curvature;
    const step = params.growthSpeed;
    const last = b.points[b.points.length - 1];
    const nx = last.x + Math.cos(b.angle) * step;
    const ny = last.y + Math.sin(b.angle) * step;
    b.points.push({ x: nx, y: ny });
    b.len += step;
    // occasional smaller side branch
    if (b.depth < params.maxDepth && Math.random() < 0.02) {
      const sa = b.angle + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.7);
      spawnBranch(nx, ny, sa, b.depth + 1, b.width * 0.7);
    }
    if (b.len >= b.maxLen) {
      b.done = true;
      if (b.depth < params.maxDepth && Math.random() < params.splitChance) {
        spawnBranch(nx, ny, b.angle + (0.4 + Math.random() * 0.5), b.depth + 1, b.width * 0.75);
        spawnBranch(nx, ny, b.angle - (0.4 + Math.random() * 0.5), b.depth + 1, b.width * 0.75);
      }
      active.splice(i, 1);
    }
  }
  if (active.length === 0 && !growthDone) {
    growthDone = true;
    justFinished = true;
  }
}

// --- Synapse detection ---
function detectSynapses() {
  const tips = [];
  for (let i = 0; i < branches.length; i++) {
    const p = branches[i].points[branches[i].points.length - 1];
    tips.push({ id: branches[i].id, x: p.x, y: p.y });
  }
  const d2max = params.synapseDistance * params.synapseDistance;
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      if (synapses.length >= 150) return;
      const dx = tips[i].x - tips[j].x;
      const dy = tips[i].y - tips[j].y;
      if (dx * dx + dy * dy < d2max) {
        const a = Math.min(tips[i].id, tips[j].id);
        const bId = Math.max(tips[i].id, tips[j].id);
        const key = a + '-' + bId;
        if (!synapseKeys.has(key)) {
          synapseKeys.add(key);
          synapses.push({
            a: a, b: bId,
            x1: tips[i].x, y1: tips[i].y,
            x2: tips[j].x, y2: tips[j].y,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }
}

// --- Pulse animation ---
function updatePulses() {
  if (synapses.length > 0 && pulses.length < 40 && Math.random() < params.pulseFrequency) {
    const syn = synapses[Math.floor(Math.random() * synapses.length)];
    pulses.push({ syn: syn, t: 0, dir: Math.random() < 0.5 ? 1 : -1 });
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += params.pulseSpeed * 0.008;
    if (p.t > 1) pulses.splice(i, 1);
  }
}

function pulsePos(p, t) {
  const tt = p.dir > 0 ? t : 1 - t;
  return {
    x: p.syn.x1 + (p.syn.x2 - p.syn.x1) * tt,
    y: p.syn.y1 + (p.syn.y2 - p.syn.y1) * tt
  };
}

// --- Rendering ---
function render() {
  // background
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);

  // background glow
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 560);
  g.addColorStop(0, hexToRgba(BG_GLOW, 0.55));
  g.addColorStop(1, hexToRgba(BG_GLOW, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // scanlines
  ctx.globalAlpha = 0.5;
  ctx.drawImage(scanlineCanvas, 0, 0);
  ctx.globalAlpha = 1;

  // branches
  for (let k = 0; k < branches.length; k++) {
    const b = branches[k];
    if (b.points.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(b.points[0].x, b.points[0].y);
    for (let i = 1; i < b.points.length - 1; i++) {
      const mx = (b.points[i].x + b.points[i + 1].x) / 2;
      const my = (b.points[i].y + b.points[i + 1].y) / 2;
      ctx.quadraticCurveTo(b.points[i].x, b.points[i].y, mx, my);
    }
    const last = b.points[b.points.length - 1];
    ctx.lineTo(last.x, last.y);
    const col = b.accent ? params.accentColor : params.branchColor;
    ctx.strokeStyle = col;
    ctx.lineWidth = b.width;
    ctx.shadowColor = col;
    ctx.shadowBlur = 10;
    ctx.globalAlpha = 0.9;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // neuron cores
  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    const r = n.r + Math.sin(time * 2 + n.phase) * 0.8;
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = UI_ACCENT;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = UI_ACCENT;
    ctx.shadowColor = UI_ACCENT;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // synapses
  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const pulse = 0.6 + 0.4 * Math.sin(time * 3 + s.phase);
    ctx.strokeStyle = params.synapseColor;
    ctx.globalAlpha = 0.25 * pulse;
    ctx.lineWidth = 1;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlow * 0.5;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    const mx = (s.x1 + s.x2) / 2;
    const my = (s.y1 + s.y2) / 2;
    ctx.globalAlpha = 1;
    ctx.fillStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlow * pulse;
    ctx.beginPath();
    ctx.arc(mx, my, 2.5 + 1.5 * pulse, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // pulses (electric sparks)
  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const pos = pulsePos(p, p.t);
    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 22 * params.pulseBrightness;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 2.2 * params.pulseBrightness, 0, Math.PI * 2);
    ctx.fill();
    const t1 = p.t - 0.06;
    if (t1 >= 0) {
      const tp = pulsePos(p, t1);
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 2.2 * params.pulseBrightness * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    const t2 = p.t - 0.12;
    if (t2 >= 0) {
      const tp = pulsePos(p, t2);
      ctx.globalAlpha = 0.15;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 2.2 * params.pulseBrightness * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // vignette
  ctx.drawImage(vignetteCanvas, 0, 0);
}

// --- Main loop ---
function loop() {
  requestAnimationFrame(loop);
  if (!paused) {
    time += 1 / 60;
    if (active.length > 0) growStep();
    frameCount++;
    if (frameCount % 10 === 0 || justFinished) {
      detectSynapses();
      justFinished = false;
    }
    updatePulses();
  }
  render();
}

function clearCanvas() {
  neurons = [];
  branches = [];
  active = [];
  synapses = [];
  pulses = [];
  synapseKeys = new Set();
  growthDone = true;
  justFinished = false;
  render();
}

setupGUI();
regenerate();
loop();
</script>
</body>
</html>
