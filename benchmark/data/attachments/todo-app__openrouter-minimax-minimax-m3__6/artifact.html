<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --completed: #9ca3af;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  main {
    max-width: 560px;
    margin: 48px auto;
    padding: 0 16px;
  }

  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  #todo-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }

  #todo-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  #add-btn {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
  }

  #add-btn:hover {
    background: var(--accent-hover);
  }

  #add-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .filters {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    padding: 6px 14px;
    font-size: 14px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .filter-btn:hover {
    color: var(--text);
    background: #f3f4f6;
  }

  .filter-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.08);
  }

  .filter-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  ul.todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }

  li.todo-item:last-child {
    border-bottom: none;
  }

  .todo-checkbox {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    transition: color 0.15s, text-decoration-color 0.15s;
  }

  li.completed .todo-text {
    text-decoration: line-through;
    color: var(--completed);
  }

  .delete-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn:hover {
    background: #fee2e2;
    color: var(--danger);
  }

  .delete-btn:focus-visible {
    outline: 2px solid var(--danger);
    outline-offset: 2px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
    gap: 8px;
    flex-wrap: wrap;
  }

  .clear-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: inherit;
  }

  .clear-btn:hover {
    color: var(--danger);
    background: #fee2e2;
  }

  .clear-btn:focus-visible {
    outline: 2px solid var(--danger);
    outline-offset: 2px;
  }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 480px) {
    main {
      margin: 16px auto;
    }
    .card {
      padding: 16px;
    }
    h1 {
      font-size: 22px;
    }
    .footer {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-label="Todo application">
    <h1>Todos</h1>

    <div class="input-row">
      <label for="todo-input" class="sr-only" style="position:absolute;left:-9999px;">New todo</label>
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="500"
      />
      <button id="add-btn" type="button" aria-label="Add todo">Add</button>
    </div>

    <div class="filters" role="tablist" aria-label="Filter todos">
      <button class="filter-btn active" data-filter="all" type="button" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" type="button" role="tab" aria-selected="false">Active</button>
      <button class="filter-btn" data-filter="completed" type="button" role="tab" aria-selected="false">Completed</button>
    </div>

    <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

    <div class="empty" id="empty-state" hidden></div>

    <div class="footer">
      <span id="count">0 items left</span>
      <button class="clear-btn" id="clear-btn" type="button" hidden>Clear completed</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todos';
  var FILTER_KEY = 'todo_filter';

  /** @type {{id:string,text:string,completed:boolean}[]} */
  var todos = [];
  var currentFilter = 'all';

  // ---------- Utilities ----------
  function generateId() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    // Fallback: timestamp + random
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function loadTodos() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed
        .filter(function (t) {
          return t && typeof t === 'object' && typeof t.text === 'string' && typeof t.completed === 'boolean';
        })
        .map(function (t) {
          return {
            id: typeof t.id === 'string' && t.id ? t.id : generateId(),
            text: t.text,
            completed: t.completed
          };
        });
    } catch (e) {
      console.warn('Failed to load todos:', e);
      return [];
    }
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      console.warn('Failed to save todos:', e);
    }
  }

  function loadFilter() {
    var f = localStorage.getItem(FILTER_KEY);
    if (f === 'all' || f === 'active' || f === 'completed') return f;
    return 'all';
  }

  function saveFilter() {
    try {
      localStorage.setItem(FILTER_KEY, currentFilter);
    } catch (e) { /* ignore */ }
  }

  // ---------- State mutations ----------
  function addTodo(text) {
    var trimmed = text.trim();
    if (!trimmed) return;
    todos.push({
      id: generateId(),
      text: trimmed,
      completed: false
    });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id === id) {
        todos[i].completed = !todos[i].completed;
        break;
      }
    }
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    saveTodos();
    render();
  }

  function setFilter(filter) {
    if (filter !== 'all' && filter !== 'active' && filter !== 'completed') return;
    currentFilter = filter;
    saveFilter();
    render();
  }

  // ---------- Rendering ----------
  var listEl = document.getElementById('todo-list');
  var countEl = document.getElementById('count');
  var clearBtn = document.getElementById('clear-btn');
  var emptyEl = document.getElementById('empty-state');
  var inputEl = document.getElementById('todo-input');
  var addBtn = document.getElementById('add-btn');
  var filterBtns = document.querySelectorAll('.filter-btn');

  function getFilteredTodos() {
    if (currentFilter === 'active') {
      return todos.filter(function (t) { return !t.completed; });
    }
    if (currentFilter === 'completed') {
      return todos.filter(function (t) { return t.completed; });
    }
    return todos.slice();
  }

  function render() {
    // Filter buttons
    filterBtns.forEach(function (btn) {
      var isActive = btn.getAttribute('data-filter') === currentFilter;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    // List
    var filtered = getFilteredTodos();
    listEl.replaceChildren();

    if (filtered.length === 0) {
      emptyEl.hidden = false;
      if (todos.length === 0) {
        emptyEl.textContent = 'No todos yet. Add one above!';
      } else if (currentFilter === 'active') {
        emptyEl.textContent = 'No active todos.';
      } else if (currentFilter === 'completed') {
        emptyEl.textContent = 'No completed todos.';
      } else {
        emptyEl.textContent = 'No todos.';
      }
    } else {
      emptyEl.hidden = true;
      var frag = document.createDocumentFragment();
      filtered.forEach(function (todo) {
        frag.appendChild(buildTodoItem(todo));
      });
      listEl.appendChild(frag);
    }

    // Count
    var activeCount = todos.reduce(function (n, t) { return n + (t.completed ? 0 : 1); }, 0);
    countEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    // Clear button
    var hasCompleted = todos.some(function (t) { return t.completed; });
    clearBtn.hidden = !hasCompleted;
  }

  function buildTodoItem(todo) {
    var li = document.createElement('li');
    li.className = 'todo-item' + (todo.completed ? ' completed' : '');
    li.setAttribute('data-id', todo.id);

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'todo-checkbox';
    checkbox.checked = todo.completed;
    checkbox.setAttribute('aria-label', todo.completed ? 'Mark as active' : 'Mark as completed');
    checkbox.addEventListener('change', function () {
      toggleTodo(todo.id);
    });

    var span = document.createElement('span');
    span.className = 'todo-text';
    span.textContent = todo.text;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'delete-btn';
    del.setAttribute('aria-label', 'Delete todo: ' + todo.text);
    del.textContent = '\u00D7'; // ×
    del.addEventListener('click', function () {
      deleteTodo(todo.id);
    });

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(del);
    return li;
  }

  // ---------- Event wiring ----------
  addBtn.addEventListener('click', function () {
    addTodo(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addTodo(inputEl.value);
      inputEl.value = '';
    }
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setFilter(btn.getAttribute('data-filter'));
    });
  });

  clearBtn.addEventListener('click', clearCompleted);

  // ---------- Init ----------
  todos = loadTodos();
  currentFilter = loadFilter();
  render();
})();
</script>
</body>
</html>
