<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --completed: #9ca3af;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 640px);
      background: var(--card);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
      color: var(--text);
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease;
    }

    button:active { transform: translateY(1px); }

    .add-btn {
      background: var(--primary);
      color: white;
      min-width: 110px;
    }

    .add-btn:hover { background: var(--primary-hover); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filters {
      display: inline-flex;
      gap: 8px;
      padding: 4px;
      background: #eef2ff;
      border-radius: 14px;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 10px;
      min-width: 84px;
    }

    .filter-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    li:hover {
      border-color: #c7d2fe;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.06);
    }

    .todo-text {
      flex: 1;
      word-break: break-word;
      line-height: 1.4;
    }

    .todo-text.completed {
      text-decoration: line-through;
      color: var(--completed);
    }

    .toggle {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      flex: 0 0 auto;
      cursor: pointer;
    }

    .delete-btn {
      background: #fef2f2;
      color: var(--danger);
      padding: 10px 12px;
      min-width: 42px;
    }

    .delete-btn:hover {
      background: #fee2e2;
      color: var(--danger-hover);
    }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 520px) {
      .app {
        padding: 20px;
        border-radius: 16px;
      }

      .input-row {
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }

      .toolbar {
        align-items: stretch;
      }

      .filters {
        width: 100%;
        justify-content: space-between;
      }

      .filter-btn {
        flex: 1;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Todo app">
    <h1>Todo List</h1>

    <form class="input-row" id="todo-form">
      <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" aria-label="Todo text" />
      <button class="add-btn" type="submit">Add Todo</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="Todo filters">
        <button class="filter-btn active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="active">Active</button>
        <button class="filter-btn" type="button" data-filter="completed">Completed</button>
      </div>
      <div class="meta" id="todo-count"></div>
    </div>

    <ul id="todo-list" aria-live="polite"></ul>
    <div class="empty" id="empty-state" hidden>No todos yet. Add one above to get started.</div>
  </main>

  <script>
    const STORAGE_KEY = 'todo_openai_gpt-5.4-mini_03';
    const FILTER_KEY = 'todo_openai_gpt-5.4-mini_03_filter';

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const count = document.getElementById('todo-count');
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));

    let todos = loadTodos();
    let currentFilter = localStorage.getItem(FILTER_KEY) || 'all';

    function loadTodos() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function saveFilter() {
      localStorage.setItem(FILTER_KEY, currentFilter);
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') return todos.filter(todo => !todo.completed);
      if (currentFilter === 'completed') return todos.filter(todo => todo.completed);
      return todos;
    }

    function updateFilterUI() {
      filterButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.filter === currentFilter);
      });
    }

    function updateCount() {
      const active = todos.filter(todo => !todo.completed).length;
      const completed = todos.length - active;
      count.textContent = `${active} active · ${completed} completed`;
    }

    function render() {
      updateFilterUI();
      updateCount();

      const filteredTodos = getFilteredTodos();
      list.innerHTML = '';

      emptyState.hidden = todos.length !== 0 && filteredTodos.length !== 0;

      if (filteredTodos.length === 0) {
        if (todos.length === 0) {
          emptyState.textContent = 'No todos yet. Add one above to get started.';
        } else {
          emptyState.textContent = 'No todos match this filter.';
        }
        return;
      }

      filteredTodos.forEach(todo => {
        const li = document.createElement('li');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'toggle';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'active' : 'completed'}`);

        const text = document.createElement('span');
        text.className = `todo-text${todo.completed ? ' completed' : ''}`;
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete-btn';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', `Delete "${todo.text}"`);

        checkbox.addEventListener('change', () => {
          todo.completed = checkbox.checked;
          saveTodos();
          render();
        });

        del.addEventListener('click', () => {
          todos = todos.filter(item => item.id !== todo.id);
          saveTodos();
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;

      todos.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        text: value,
        completed: false
      });

      input.value = '';
      saveTodos();
      render();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        saveFilter();
        render();
      });
    });

    render();
  </script>
</body>
</html>
