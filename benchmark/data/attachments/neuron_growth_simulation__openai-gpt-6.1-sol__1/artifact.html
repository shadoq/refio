<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEURAL FIELD</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #05070f;
      --yellow: #ffd400;
      --muted: #8992aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: #e6ecf5;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(0, 800px) minmax(250px, 1fr);
      gap: 24px;
      align-items: start;
      padding: 36px 24px;
    }

    main {
      grid-column: 2;
      min-width: 0;
      width: 100%;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--yellow);
      font-size: 10px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 4vw, 32px);
      font-weight: 500;
      letter-spacing: 5px;
    }

    .state {
      flex-shrink: 0;
      color: var(--yellow);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .state::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      background: var(--yellow);
      box-shadow: 0 0 10px rgba(255, 212, 0, 0.45);
    }

    .viewport {
      overflow: hidden;
      border: 1px solid rgba(255, 212, 0, 0.22);
      background: #05070f;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }

    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255, 212, 0, 0.15);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .readout strong {
      margin-left: 7px;
      color: var(--yellow);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    kbd {
      color: var(--yellow);
      font: inherit;
    }

    aside {
      grid-column: 3;
      width: 250px;
      margin-top: 70px;
    }

    .panel-label {
      margin: 0 0 12px;
      color: var(--yellow);
      font-size: 10px;
      letter-spacing: 2px;
    }

    #gui .dg.main {
      width: 250px !important;
    }

    #gui .dg {
      color: #d8deeb;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
      text-shadow: none;
    }

    #gui .dg .cr {
      border-bottom-color: #202638;
      background: #0c101d;
    }

    #gui .dg li.title {
      background-color: #151a29;
      color: var(--yellow);
      letter-spacing: 1px;
    }

    #gui .dg .cr.number,
    #gui .dg .cr.boolean,
    #gui .dg .cr.function,
    #gui .dg .cr.color {
      border-left-color: var(--yellow);
    }

    #gui .dg .c .slider {
      background: #22283a;
    }

    #gui .dg .c .slider-fg {
      background: var(--yellow);
    }

    #gui .dg .c input[type="text"] {
      background: #1b2130;
      color: var(--yellow);
    }

    #gui .dg .close-button {
      background: #151a29;
      color: var(--yellow);
    }

    #gui .dg .cr.function:hover {
      background: #242a37;
    }

    #gui .dg .property-name {
      width: 56%;
    }

    #gui .dg .c {
      width: 44%;
    }

    .notice {
      margin: 0;
      padding: 14px;
      border: 1px solid rgba(255, 212, 0, 0.25);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 1250px) {
      .layout {
        grid-template-columns: minmax(0, 800px);
        justify-content: center;
        padding: 24px 16px;
      }

      main,
      aside {
        grid-column: 1;
      }

      aside {
        width: 250px;
        margin: 0 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .state::before {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <main>
      <header>
        <div>
          <p class="eyebrow">LIVE GENERATIVE STUDY / 01</p>
          <h1>NEURAL FIELD</h1>
        </div>
        <span id="status" class="state" role="status">Growing</span>
      </header>
      <div class="viewport">
        <canvas id="field" width="800" height="800" aria-label="Animated branching neuron network with glowing synapses and traveling electrical pulses"></canvas>
      </div>
      <div class="readout" aria-label="Network counters">
        <span>Neurons<strong id="neuron-count">0</strong></span>
        <span>Branches<strong id="branch-count">0</strong></span>
        <span>Synapses<strong id="synapse-count">0</strong></span>
        <span>Pulses<strong id="pulse-count">0</strong></span>
      </div>
      <p class="caption">
        <span>Organic growth / cross-field signal exchange</span>
        <span><kbd>SPACE</kbd> pause / resume &nbsp; <kbd>R</kbd> regenerate</span>
      </p>
    </main>
    <aside aria-label="Simulation controls">
      <p class="panel-label">FIELD PARAMETERS</p>
      <div id="gui"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    (() => {
      'use strict';

      // Setup
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');
      const counters = {
        neurons: document.getElementById('neuron-count'),
        branches: document.getElementById('branch-count'),
        synapses: document.getElementById('synapse-count'),
        pulses: document.getElementById('pulse-count')
      };
      const MAX_BRANCHES = 450;
      const MAX_SYNAPSES = 180;
      const MAX_PULSES = 50;
      const STEP = 4;
      const TAU = Math.PI * 2;
      const random = (min, max) => min + Math.random() * (max - min);
      const integer = (min, max) => Math.floor(random(min, max + 1));
      const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const copy = point => ({ x: point.x, y: point.y });
      const params = {
        neuronCount: integer(3, 6),
        growthSpeed: 65,
        maxDepth: 5,
        splitChance: 0.62,
        curvature: 0.55,
        maxLength: 95,
        synapseDistance: 32,
        synapseGlow: 22,
        pulseSpeed: 150,
        pulseFrequency: 3,
        pulseBrightness: 1,
        backgroundColor: '#05070f',
        branchColor: '#00e5ff',
        accentColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a'
      };
      let neurons = [];
      let branches = [];
      let synapses = [];
      let pulses = [];
      let connectedPairs = new Set();
      let paused = false;
      let cleared = false;
      let visualTime = 0;
      let detectionTimer = 0;
      let pulseTimer = 0;
      let readoutTimer = 0;
      let lastTimestamp = null;

      function updateReadout() {
        status.textContent = cleared ? 'Cleared' : paused ? 'Paused' :
          branches.some(branch => branch.active) ? 'Growing' : 'Stable';
        counters.neurons.textContent = neurons.length;
        counters.branches.textContent = branches.length;
        counters.synapses.textContent = synapses.length;
        counters.pulses.textContent = pulses.length;
      }

      function resetState() {
        neurons = [];
        branches = [];
        synapses = [];
        pulses = [];
        connectedPairs = new Set();
        visualTime = 0;
        detectionTimer = 0;
        pulseTimer = 0;
        readoutTimer = 0;
        lastTimestamp = null;
      }

      function regenerate() {
        resetState();
        cleared = false;
        paused = false;
        const rotation = random(0, TAU);
        for (let i = 0; i < params.neuronCount; i++) {
          const angle = rotation + i * TAU / params.neuronCount + random(-0.22, 0.22);
          const radius = random(48, 88);
          const neuron = {
            x: 400 + Math.cos(angle) * radius,
            y: 400 + Math.sin(angle) * radius,
            phase: random(0, TAU)
          };
          neurons.push(neuron);
          const count = integer(4, 6);
          const offset = random(0, TAU);
          for (let j = 0; j < count; j++) {
            createBranch(null, i, neuron, offset + j * TAU / count + random(-0.2, 0.2), 0, random(1.6, 2.5));
          }
        }
        updateReadout();
      }

      function clearCanvas() {
        resetState();
        cleared = true;
        paused = false;
        updateReadout();
        render();
      }

      function togglePause() {
        if (cleared) return;
        paused = !paused;
        lastTimestamp = null;
        updateReadout();
      }

      // GUI setup
      if (window.dat && window.dat.GUI) {
        const gui = new window.dat.GUI({ autoPlace: false, width: 250 });
        document.getElementById('gui').appendChild(gui.domElement);
        const growth = gui.addFolder('Growth');
        growth.add(params, 'neuronCount', 3, 6, 1).name('neuron count').onFinishChange(regenerate);
        growth.add(params, 'growthSpeed', 10, 180, 1).name('branch growth speed');
        growth.add(params, 'maxDepth', 1, 8, 1).name('max branch depth').onFinishChange(regenerate);
        growth.add(params, 'splitChance', 0, 1, 0.01).name('branch split chance').onFinishChange(regenerate);
        growth.add(params, 'curvature', 0, 1.5, 0.01).name('branch curvature').onFinishChange(regenerate);
        growth.add(params, 'maxLength', 30, 180, 1).name('max branch length').onFinishChange(regenerate);
        const connections = gui.addFolder('Synapses');
        connections.add(params, 'synapseDistance', 10, 65, 1).name('synapse distance threshold');
        connections.add(params, 'synapseGlow', 5, 45, 1).name('synapse glow strength');
        const signals = gui.addFolder('Pulses');
        signals.add(params, 'pulseSpeed', 30, 400, 1).name('pulse speed');
        signals.add(params, 'pulseFrequency', 0, 12, 0.1).name('pulse frequency');
        signals.add(params, 'pulseBrightness', 0.2, 2, 0.05).name('pulse brightness');
        const visuals = gui.addFolder('Visuals');
        visuals.addColor(params, 'backgroundColor').name('background color').onChange(value => {
          document.documentElement.style.setProperty('--background', value);
        });
        visuals.addColor(params, 'branchColor').name('branch color');
        visuals.addColor(params, 'accentColor').name('accent branch color');
        visuals.addColor(params, 'synapseColor').name('synapse color');
        visuals.addColor(params, 'pulseColor').name('pulse color');
        const actions = {
          'regenerate network': regenerate,
          'clear canvas': clearCanvas,
          'pause/resume animation': togglePause
        };
        gui.add(actions, 'regenerate network');
        gui.add(actions, 'clear canvas');
        gui.add(actions, 'pause/resume animation');
        growth.open();
        connections.open();
        signals.open();
        visuals.open();
      } else {
        const notice = document.createElement('p');
        notice.className = 'notice';
        notice.textContent = 'Parameter controls unavailable. The simulation is running. Use Space to pause or resume and R to regenerate.';
        document.getElementById('gui').appendChild(notice);
      }

      document.addEventListener('keydown', event => {
        const target = event.target;
        if (target && (target.closest('input, textarea, select, button') || target.isContentEditable)) return;
        if (event.repeat) return;
        if (event.code === 'Space') {
          event.preventDefault();
          togglePause();
        } else if (event.key.toLowerCase() === 'r') {
          regenerate();
        }
      });

      // Neuron growth
      function createBranch(parent, seed, start, angle, depth, thickness) {
        if (branches.length >= MAX_BRANCHES || depth > params.maxDepth) return null;
        const branch = {
          id: branches.length,
          parent,
          parentIndex: parent ? parent.points.length - 1 : 0,
          seed,
          points: [copy(start)],
          angle,
          turn: random(-0.035, 0.035),
          depth,
          thickness: Math.max(0.45, thickness),
          length: 0,
          targetLength: params.maxLength * random(0.62, 1.1) * Math.pow(0.9, depth),
          carry: 0,
          active: true,
          accent: Math.random() < 0.18,
          sideCount: 0
        };
        branches.push(branch);
        return branch;
      }

      function finishBranch(branch, allowChildren) {
        branch.active = false;
        if (!allowChildren || branch.depth >= params.maxDepth || branches.length >= MAX_BRANCHES) return;
        const tip = branch.points[branch.points.length - 1];
        createBranch(branch, branch.seed, tip, branch.angle + random(-0.3, 0.3),
          branch.depth + 1, branch.thickness * random(0.74, 0.88));
        if (Math.random() < params.splitChance) {
          const side = Math.random() < 0.5 ? -1 : 1;
          createBranch(branch, branch.seed, tip, branch.angle + side * random(0.48, 1.05),
            branch.depth + 1, branch.thickness * random(0.6, 0.78));
        }
      }

      function grow(dt) {
        const count = branches.length;
        for (let i = 0; i < count; i++) {
          const branch = branches[i];
          if (!branch.active) continue;
          branch.carry += params.growthSpeed * dt;
          let steps = 0;
          while (branch.carry >= STEP && branch.active && steps++ < 12) {
            branch.carry -= STEP;
            const previous = branch.points[branch.points.length - 1];
            branch.turn = branch.turn * 0.82 + random(-0.045, 0.045) * params.curvature;
            branch.angle += branch.turn;
            const point = {
              x: previous.x + Math.cos(branch.angle) * STEP,
              y: previous.y + Math.sin(branch.angle) * STEP
            };
            if (point.x < 25 || point.x > 775 || point.y < 25 || point.y > 775) {
              finishBranch(branch, false);
              break;
            }
            branch.points.push(point);
            branch.length += STEP;
            if (branch.length >= branch.targetLength || branch.points.length >= 64) {
              finishBranch(branch, true);
            } else if (branch.length > 20 && branch.sideCount < 1 &&
                       branch.depth < params.maxDepth && Math.random() < 0.012 * params.splitChance) {
              const side = Math.random() < 0.5 ? -1 : 1;
              const child = createBranch(branch, branch.seed, point,
                branch.angle + side * random(0.7, 1.25),
                branch.depth + 1, branch.thickness * 0.56);
              if (child) branch.sideCount++;
            }
          }
        }
      }

      // Synapse detection
      function detectSynapses() {
        if (synapses.length >= MAX_SYNAPSES) return;
        const size = params.synapseDistance;
        const buckets = new Map();
        for (const branch of branches) {
          if (branch.length < 16) continue;
          const index = branch.points.length - 1;
          const point = branch.points[index];
          const gx = Math.floor(point.x / size);
          const gy = Math.floor(point.y / size);
          let linked = false;
          for (let x = gx - 1; x <= gx + 1 && !linked; x++) {
            for (let y = gy - 1; y <= gy + 1 && !linked; y++) {
              const neighbors = buckets.get(x + ',' + y);
              if (!neighbors) continue;
              for (const other of neighbors) {
                if (branch.seed === other.branch.seed) continue;
                const key = other.branch.id + ':' + branch.id;
                if (connectedPairs.has(key)) continue;
                const separation = distance(point, other.point);
                if (separation < 3 || separation > size) continue;
                const midpoint = {
                  x: (point.x + other.point.x) / 2,
                  y: (point.y + other.point.y) / 2
                };
                if (synapses.some(connection => distance(midpoint, connection.midpoint) < size * 0.62)) continue;
                synapses.push({
                  a: other.branch,
                  b: branch,
                  indexA: other.index,
                  indexB: index,
                  pointA: copy(other.point),
                  pointB: copy(point),
                  midpoint,
                  phase: random(0, TAU)
                });
                connectedPairs.add(key);
                linked = true;
                break;
              }
            }
          }
          if (synapses.length >= MAX_SYNAPSES) return;
          const key = gx + ',' + gy;
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push({ branch, index, point });
        }
      }

      // Pulse animation
      function seedToPoint(branch, index) {
        const chain = [];
        let current = branch;
        let endpoint = index;
        while (current && chain.length <= 9) {
          chain.push({ branch: current, index: endpoint });
          endpoint = current.parentIndex;
          current = current.parent;
        }
        const route = [];
        for (let i = chain.length - 1; i >= 0; i--) {
          const entry = chain[i];
          for (let j = 0; j <= entry.index; j++) {
            const point = entry.branch.points[j];
            if (!route.length || distance(route[route.length - 1], point) > 0.01) {
              route.push(copy(point));
            }
          }
        }
        return route;
      }

      function launchPulse() {
        if (pulses.length >= MAX_PULSES) return;
        let route;
        if (synapses.length) {
          const connection = synapses[integer(0, synapses.length - 1)];
          const first = seedToPoint(connection.a, connection.indexA);
          const second = seedToPoint(connection.b, connection.indexB);
          first[first.length - 1] = copy(connection.pointA);
          second[second.length - 1] = copy(connection.pointB);
          route = first.concat(second.reverse());
          if (Math.random() < 0.5) route.reverse();
        } else {
          const candidates = branches.filter(branch => branch.length > 20);
          if (!candidates.length) return;
          const branch = candidates[integer(0, candidates.length - 1)];
          route = seedToPoint(branch, branch.points.length - 1);
        }
        if (!route || route.length < 2) return;
        const cumulative = [0];
        for (let i = 1; i < route.length; i++) {
          cumulative.push(cumulative[i - 1] + distance(route[i - 1], route[i]));
        }
        const total = cumulative[cumulative.length - 1];
        if (total < 1) return;
        pulses.push({
          route,
          cumulative,
          total,
          distance: 0,
          cursor: 0,
          variation: random(0.88, 1.12)
        });
      }

      function animatePulses(dt) {
        pulseTimer += dt * params.pulseFrequency;
        let launches = 0;
        while (pulseTimer >= 1 && launches++ < 4) {
          pulseTimer -= 1;
          launchPulse();
        }
        for (let i = pulses.length - 1; i >= 0; i--) {
          const pulse = pulses[i];
          pulse.distance += dt * params.pulseSpeed * pulse.variation;
          if (pulse.distance > pulse.total + 30) {
            pulses.splice(i, 1);
            continue;
          }
          while (pulse.cursor < pulse.route.length - 2 &&
                 pulse.cumulative[pulse.cursor + 1] <= pulse.distance) {
            pulse.cursor++;
          }
        }
      }

      function pulsePoint(pulse, position) {
        const d = Math.max(0, Math.min(position, pulse.total));
        let index = pulse.cursor;
        while (index > 0 && pulse.cumulative[index] > d) index--;
        while (index < pulse.route.length - 2 && pulse.cumulative[index + 1] < d) index++;
        const span = pulse.cumulative[index + 1] - pulse.cumulative[index];
        const t = span > 0 ? (d - pulse.cumulative[index]) / span : 0;
        const a = pulse.route[index];
        const b = pulse.route[index + 1];
        return {
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t
        };
      }

      // Rendering
      function traceBranch(points) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const next = points[i + 1];
          ctx.quadraticCurveTo(points[i].x, points[i].y,
            (points[i].x + next.x) / 2, (points[i].y + next.y) / 2);
        }
        if (points.length > 1) {
          const end = points[points.length - 1];
          ctx.lineTo(end.x, end.y);
        }
      }

      function circle(x, y, radius) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fill();
      }

      function renderBackground() {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 0;
        ctx.fillStyle = params.backgroundColor;
        ctx.fillRect(0, 0, 800, 800);
        const glow = ctx.createRadialGradient(400, 380, 30, 400, 400, 540);
        glow.addColorStop(0, '#101a3a');
        glow.addColorStop(1, 'rgba(16, 26, 58, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 800, 800);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        for (let i = 40; i < 800; i += 40) {
          ctx.moveTo(i, 0);
          ctx.lineTo(i, 800);
          ctx.moveTo(0, i);
          ctx.lineTo(800, i);
        }
        ctx.stroke();
      }

      function render() {
        renderBackground();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = 'lighter';

        for (const branch of branches) {
          if (branch.points.length < 2) continue;
          const color = branch.accent ? params.accentColor : params.branchColor;
          ctx.strokeStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 7;
          ctx.globalAlpha = 0.62;
          ctx.lineWidth = branch.thickness;
          traceBranch(branch.points);
          ctx.stroke();
          if (branch.active) {
            const tip = branch.points[branch.points.length - 1];
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            circle(tip.x, tip.y, Math.max(1, branch.thickness * 0.7));
          }
        }

        ctx.strokeStyle = params.synapseColor;
        ctx.fillStyle = params.synapseColor;
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = params.synapseGlow;
        for (const connection of synapses) {
          const shimmer = 0.74 + Math.sin(visualTime * 2.2 + connection.phase) * 0.18;
          ctx.globalAlpha = shimmer;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(connection.pointA.x, connection.pointA.y);
          ctx.lineTo(connection.pointB.x, connection.pointB.y);
          ctx.stroke();
          circle(connection.pointA.x, connection.pointA.y, 2);
          circle(connection.pointB.x, connection.pointB.y, 2);
          circle(connection.midpoint.x, connection.midpoint.y, 1.6);
        }

        for (const neuron of neurons) {
          const breathing = 1 + Math.sin(visualTime * 1.6 + neuron.phase) * 0.12;
          ctx.strokeStyle = params.branchColor;
          ctx.fillStyle = params.branchColor;
          ctx.shadowColor = params.branchColor;
          ctx.shadowBlur = 20;
          ctx.globalAlpha = 0.8;
          circle(neuron.x, neuron.y, 3.7 * breathing);
          ctx.lineWidth = 0.8;
          ctx.globalAlpha = 0.45;
          ctx.beginPath();
          ctx.arc(neuron.x, neuron.y, 8 * breathing, 0, TAU);
          ctx.stroke();
        }

        ctx.fillStyle = params.pulseColor;
        ctx.strokeStyle = params.pulseColor;
        ctx.shadowColor = params.pulseColor;
        for (const pulse of pulses) {
          for (let i = 6; i >= 0; i--) {
            const position = pulse.distance - i * 4;
            if (position < 0 || position > pulse.total) continue;
            const point = pulsePoint(pulse, position);
            const strength = (1 - i / 7) * params.pulseBrightness;
            ctx.globalAlpha = Math.min(1, strength);
            ctx.shadowBlur = 10 + strength * 10;
            circle(point.x, point.y, i === 0 ? 2.7 : 1.7 - i * 0.15);
            if (i === 0) {
              const behind = pulsePoint(pulse, Math.max(0, position - 5));
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.moveTo(behind.x, behind.y);
              ctx.lineTo(point.x, point.y);
              ctx.stroke();
            }
          }
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        const vignette = ctx.createRadialGradient(400, 400, 240, 400, 400, 565);
        vignette.addColorStop(0, 'rgba(5, 7, 15, 0)');
        vignette.addColorStop(1, 'rgba(5, 7, 15, 0.78)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, 800, 800);
        ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.globalAlpha = 0.32;
        for (let y = 0; y < 800; y += 4) {
          ctx.fillRect(0, y, 800, 1);
        }
        ctx.globalAlpha = 1;
      }

      function frame(timestamp) {
        const dt = lastTimestamp === null ? 0 : Math.min(0.05, Math.max(0, (timestamp - lastTimestamp) / 1000));
        lastTimestamp = timestamp;
        if (!paused && !cleared) {
          visualTime += dt;
          grow(dt);
          detectionTimer += dt;
          if (detectionTimer >= 0.2) {
            detectionTimer %= 0.2;
            detectSynapses();
          }
          animatePulses(dt);
        }
        readoutTimer += dt;
        if (readoutTimer >= 0.15) {
          readoutTimer = 0;
          updateReadout();
        }
        render();
        requestAnimationFrame(frame);
      }

      regenerate();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
