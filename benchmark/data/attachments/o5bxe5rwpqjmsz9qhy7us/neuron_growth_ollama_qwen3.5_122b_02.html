<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            border: 1px solid #101a3a;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script>
        // Configuration
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 5,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 150,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.5,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a'
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // State
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let animationId;

        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.growthProgress = 0;
                this.maxGrowth = 100;
                this.isGrowing = true;
                this.depth = 0;
            }

            grow() {
                if (!this.isGrowing) return;

                this.growthProgress += config.branchGrowthSpeed;
                
                if (this.growthProgress >= this.maxGrowth) {
                    this.isGrowing = false;
                    this.finalizeBranches();
                }

                // Add new branch segments
                if (this.branches.length === 0) {
                    this.branches.push({
                        x: this.x,
                        y: this.y,
                        angle: Math.random() * Math.PI * 2,
                        length: 0,
                        maxLen: Math.random() * config.maxBranchLength + 50,
                        depth: 0,
                        children: [],
                        thickness: 2 + Math.random() * 2,
                        isAccent: Math.random() < 0.2
                    });
                }

                // Grow existing branches
                for (let i = this.branches.length - 1; i >= 0; i--) {
                    const branch = this.branches[i];
                    if (branch.length < branch.maxLen) {
                        branch.length += config.branchGrowthSpeed;
                        
                        // Update position
                        branch.x += Math.cos(branch.angle) * config.branchGrowthSpeed;
                        branch.y += Math.sin(branch.angle) * config.branchGrowthSpeed;
                        
                        // Add slight curvature
                        branch.angle += (Math.random() - 0.5) * config.branchCurvature * 0.1;
                        
                        // Try to split
                        if (Math.random() < config.branchSplitChance && branch.depth < config.maxBranchDepth) {
                            const newBranch = {
                                x: branch.x,
                                y: branch.y,
                                angle: branch.angle + (Math.random() - 0.5) * Math.PI / 2,
                                length: 0,
                                maxLen: branch.maxLen * 0.7,
                                depth: branch.depth + 1,
                                children: [],
                                thickness: branch.thickness * 0.8,
                                isAccent: branch.isAccent || Math.random() < 0.2
                            };
                            branch.children.push(newBranch);
                            this.branches.push(newBranch);
                        }
                    }
                }
            }

            finalizeBranches() {
                // Ensure all branches are finalized
                for (let branch of this.branches) {
                    if (branch.length < branch.maxLen) {
                        branch.length = branch.maxLen;
                        branch.x += Math.cos(branch.angle) * (branch.maxLen - branch.length);
                        branch.y += Math.sin(branch.angle) * (branch.maxLen - branch.length);
                    }
                }
            }

            draw() {
                for (let branch of this.branches) {
                    this.drawBranch(branch);
                }
            }

            drawBranch(branch) {
                ctx.beginPath();
                ctx.moveTo(branch.x, branch.y);
                
                // Draw to parent if exists
                if (branch.depth > 0) {
                    // Find parent
                    for (let other of this.branches) {
                        if (other.children.includes(branch)) {
                            ctx.lineTo(other.x, other.y);
                            break;
                        }
                    }
                } else {
                    ctx.lineTo(this.x, this.y);
                }
                
                ctx.strokeStyle = branch.isAccent ? config.accentBranchColor : config.branchColor;
                ctx.lineWidth = branch.thickness;
                ctx.shadowBlur = 10;
                ctx.shadowColor = branch.isAccent ? config.accentBranchColor : config.branchColor;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw children
                for (let child of branch.children) {
                    this.drawBranch(child);
                }
            }

            getTipPoints() {
                const tips = [];
                const findTips = (branch) => {
                    if (branch.children.length === 0) {
                        tips.push({ x: branch.x, y: branch.y });
                    } else {
                        for (let child of branch.children) {
                            findTips(child);
                        }
                    }
                };
                
                for (let branch of this.branches) {
                    findTips(branch);
                }
                return tips;
            }
        }

        // Synapse class
        class Synapse {
            constructor(neuron1, neuron2, tip1, tip2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.tip1 = tip1;
                this.tip2 = tip2;
                this.glow = 0;
                this.maxGlow = 1;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.tip1.x, this.tip1.y);
                ctx.lineTo(this.tip2.x, this.tip2.y);
                
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.shadowColor = config.synapseColor;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        // Pulse class
        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.speed = config.pulseSpeed / 100;
                this.active = true;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                
                const x = this.synapse.tip1.x + (this.synapse.tip2.x - this.synapse.tip1.x) * this.progress;
                const y = this.synapse.tip1.y + (this.synapse.tip2.y - this.synapse.tip1.y) * this.progress;
                
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = config.pulseColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = config.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Initialize simulation
        function init() {
            neurons = [];
            synapses = [];
            pulses = [];
            
            // Create seed neurons
            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (Math.PI * 2 / config.neuronCount) * i;
                const dist = 50 + Math.random() * 50;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                neurons.push(new Neuron(x, y));
            }
        }

        // Check for synapses
        function checkSynapses() {
            const allTips = [];
            
            // Collect all tips
            for (let neuron of neurons) {
                const tips = neuron.getTipPoints();
                for (let tip of tips) {
                    allTips.push({ ...tip, neuron });
                }
            }
            
            // Check distances
            for (let i = 0; i < allTips.length; i++) {
                for (let j = i + 1; j < allTips.length; j++) {
                    const tip1 = allTips[i];
                    const tip2 = allTips[j];
                    
                    // Skip if same neuron
                    if (tip1.neuron === tip2.neuron) continue;
                    
                    const dx = tip1.x - tip2.x;
                    const dy = tip1.y - tip2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < config.synapseDistanceThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.neuron1 === tip1.neuron && s.neuron2 === tip2.neuron) ||
                            (s.neuron1 === tip2.neuron && s.neuron2 === tip1.neuron)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(tip1.neuron, tip2.neuron, tip1, tip2));
                        }
                    }
                }
            }
        }

        // Generate pulses
        function generatePulses() {
            if (Math.random() < config.pulseFrequency) {
                if (synapses.length > 0) {
                    const synapse = synapses[Math.floor(Math.random() * synapses.length)];
                    pulses.push(new Pulse(synapse));
                }
            }
        }

        // Draw background effects
        function drawBackground() {
            // Clear with background color
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            
            const gridSize = 40;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Draw vignette
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, width / 2);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Animation loop
        function animate() {
            if (!isPaused) {
                drawBackground();
                
                // Grow neurons
                for (let neuron of neurons) {
                    neuron.grow();
                }
                
                // Check for new synapses
                checkSynapses();
                
                // Generate pulses
                generatePulses();
                
                // Update and draw synapses
                for (let synapse of synapses) {
                    synapse.draw();
                }
                
                // Update and draw pulses
                for (let i = pulses.length - 1; i >= 0; i--) {
                    const pulse = pulses[i];
                    pulse.update();
                    pulse.draw();
                    
                    if (!pulse.active) {
                        pulses.splice(i, 1);
                    }
                }
                
                // Draw neurons
                for (let neuron of neurons) {
                    neuron.draw();
                }
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // GUI setup
        function setupGUI() {
            const gui = new dat.GUI();
            
            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 3, 6).step(1).name('Neuron Count').onChange(init);
            growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config, 'maxBranchDepth', 1, 10).step(1).name('Max Depth');
            growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
            growthFolder.add(config, 'branchCurvature', 0, 2).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 50, 300).name('Max Length');
            growthFolder.open();
            
            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 100).name('Distance Threshold');
            synapsesFolder.add(config, 'synapseGlowStrength', 0, 30).name('Glow Strength');
            synapsesFolder.open();
            
            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulsesFolder.add(config, 'pulseFrequency', 0, 0.1).name('Pulse Frequency');
            pulsesFolder.add(config, 'pulseBrightness', 0.5, 3).name('Pulse Brightness');
            pulsesFolder.open();
            
            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'bgColor').name('Background');
            visualsFolder.addColor(config, 'branchColor').name('Branch Color');
            visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
            visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
            visualsFolder.open();
            
            // Buttons
            gui.add({ regenerate: init }, 'regenerate').name('Regenerate Network');
            gui.add({ clear: () => { neurons = []; synapses = []; pulses = []; } }, 'clear').name('Clear Canvas');
            gui.add({ togglePause: () => { isPaused = !isPaused; } }, 'togglePause').name('Pause/Resume');
        }

        // Start
        init();
        setupGUI();
        animate();
    </script>
</body>
</html>
