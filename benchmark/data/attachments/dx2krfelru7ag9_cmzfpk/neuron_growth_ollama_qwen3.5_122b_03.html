<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            border: 1px solid #101a3a;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script>
        // Configuration
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 6,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.5,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Actions
            regenerate: () => initSimulation(),
            clear: () => clearCanvas(),
            pause: false
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Simulation state
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let animationId;
        let isPaused = false;

        // GUI setup
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
        growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
        growthFolder.add(config, 'maxBranchDepth', 2, 10, 1).name('Max Depth');
        growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
        growthFolder.add(config, 'branchCurvature', 0, 1).name('Curvature');
        growthFolder.add(config, 'maxBranchLength', 50, 200).name('Max Length');
        growthFolder.open();

        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 100).name('Distance Threshold');
        synapsesFolder.add(config, 'synapseGlowStrength', 0, 30).name('Glow Strength');
        synapsesFolder.open();

        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(config, 'pulseSpeed', 0.5, 10).name('Pulse Speed');
        pulsesFolder.add(config, 'pulseFrequency', 0, 0.1).name('Pulse Frequency');
        pulsesFolder.add(config, 'pulseBrightness', 0.5, 3).name('Pulse Brightness');
        pulsesFolder.open();

        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'bgColor').name('Background');
        visualsFolder.addColor(config, 'branchColor').name('Branch Color');
        visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
        visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
        visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
        visualsFolder.open();

        const actionsFolder = gui.addFolder('Actions');
        actionsFolder.add(config, 'regenerate').name('Regenerate Network');
        actionsFolder.add(config, 'clear').name('Clear Canvas');
        actionsFolder.add(config, 'pause').name('Pause/Resume');
        actionsFolder.open();

        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.growthProgress = 0;
                this.isGrowing = true;
                this.maxDepth = Math.floor(Math.random() * 3) + config.maxBranchDepth - 2;
            }

            grow() {
                if (!this.isGrowing) return;

                // Add new branch segments
                if (this.branches.length === 0) {
                    this.branches.push({
                        x: this.x,
                        y: this.y,
                        angle: Math.random() * Math.PI * 2,
                        length: 0,
                        maxLen: Math.random() * config.maxBranchLength + 20,
                        depth: 0,
                        children: [],
                        thickness: 2 + Math.random() * 2
                    });
                }

                // Grow existing branches
                for (let i = this.branches.length - 1; i >= 0; i--) {
                    const branch = this.branches[i];
                    
                    if (branch.length < branch.maxLen) {
                        branch.length += config.branchGrowthSpeed;
                        
                        // Update angle with curvature
                        branch.angle += (Math.random() - 0.5) * config.branchCurvature * 0.5;
                        
                        // Calculate new position
                        const newX = branch.x + Math.cos(branch.angle) * config.branchGrowthSpeed;
                        const newY = branch.y + Math.sin(branch.angle) * config.branchGrowthSpeed;
                        
                        branch.x = newX;
                        branch.y = newY;
                    } else {
                        // Branch finished growing
                        if (branch.depth < this.maxDepth && Math.random() < config.branchSplitChance) {
                            // Create child branches
                            const numChildren = Math.floor(Math.random() * 2) + 1;
                            for (let j = 0; j < numChildren; j++) {
                                const childAngle = branch.angle + (Math.random() - 0.5) * Math.PI / 2;
                                this.branches.push({
                                    x: branch.x,
                                    y: branch.y,
                                    angle: childAngle,
                                    length: 0,
                                    maxLen: branch.maxLen * 0.7,
                                    depth: branch.depth + 1,
                                    children: [],
                                    thickness: branch.thickness * 0.8
                                });
                            }
                        }
                    }
                }

                // Check if all branches are done
                const allDone = this.branches.every(b => b.length >= b.maxLen);
                if (allDone) {
                    this.isGrowing = false;
                }
            }

            draw() {
                ctx.strokeStyle = this.branches.some(b => b.depth % 2 === 0) ? config.branchColor : config.accentBranchColor;
                ctx.lineWidth = 1;
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.strokeStyle;

                // Draw all branches
                for (let i = 0; i < this.branches.length - 1; i++) {
                    const current = this.branches[i];
                    const next = this.branches[i + 1];
                    
                    if (current.length < current.maxLen) {
                        // Draw partial branch
                        const progress = current.length / current.maxLen;
                        const endX = current.x + Math.cos(current.angle) * current.length;
                        const endY = current.y + Math.sin(current.angle) * current.length;
                        
                        ctx.beginPath();
                        ctx.moveTo(current.x, current.y);
                        ctx.lineTo(endX, endY);
                        ctx.stroke();
                    } else {
                        // Draw complete branch
                        ctx.beginPath();
                        ctx.moveTo(current.x, current.y);
                        
                        // Find next branch to connect to
                        const nextBranch = this.branches.find(b => 
                            b.x === current.x && b.y === current.y && b !== current
                        );
                        
                        if (nextBranch) {
                            // Quadratic curve for organic shape
                            const midX = (current.x + nextBranch.x) / 2;
                            const midY = (current.y + nextBranch.y) / 2;
                            ctx.quadraticCurveTo(midX, midY, nextBranch.x, nextBranch.y);
                        } else {
                            ctx.lineTo(next.x, next.y);
                        }
                        
                        ctx.stroke();
                    }
                }

                // Draw neuron body
                ctx.fillStyle = config.branchColor;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Synapse class
        class Synapse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.pulseProgress = 0;
                this.pulseActive = false;
                this.lastPulseTime = 0;
            }

            update() {
                // Trigger pulse randomly
                if (!this.pulseActive && Math.random() < config.pulseFrequency) {
                    this.pulseActive = true;
                    this.pulseProgress = 0;
                }

                // Update pulse
                if (this.pulseActive) {
                    this.pulseProgress += config.pulseSpeed * 0.01;
                    
                    if (this.pulseProgress >= 1) {
                        this.pulseActive = false;
                        this.pulseProgress = 0;
                    }
                }
            }

            draw() {
                // Draw synapse line
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.shadowColor = config.synapseColor;
                
                ctx.beginPath();
                ctx.moveTo(this.neuron1.x, this.neuron1.y);
                ctx.lineTo(this.neuron2.x, this.neuron2.y);
                ctx.stroke();

                // Draw pulse
                if (this.pulseActive) {
                    const x = this.neuron1.x + (this.neuron2.x - this.neuron1.x) * this.pulseProgress;
                    const y = this.neuron1.y + (this.neuron2.y - this.neuron1.y) * this.pulseProgress;
                    
                    ctx.fillStyle = config.pulseColor;
                    ctx.shadowBlur = 20 * config.pulseBrightness;
                    ctx.shadowColor = config.pulseColor;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Initialize simulation
        function initSimulation() {
            neurons = [];
            synapses = [];
            pulses = [];
            
            // Create seed neurons
            const numNeurons = config.neuronCount;
            const centerX = width / 2;
            const centerY = height / 2;
            
            for (let i = 0; i < numNeurons; i++) {
                const angle = (i / numNeurons) * Math.PI * 2;
                const radius = 50 + Math.random() * 100;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                neurons.push(new Neuron(x, y));
            }
            
            // Start growth
            neurons.forEach(neuron => neuron.grow());
        }

        // Check for synapses
        function checkSynapses() {
            const threshold = config.synapseDistanceThreshold;
            
            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const neuron1 = neurons[i];
                    const neuron2 = neurons[j];
                    
                    // Check if any branch tips are close enough
                    const tips1 = neuron1.branches.filter(b => b.length >= b.maxLen);
                    const tips2 = neuron2.branches.filter(b => b.length >= b.maxLen);
                    
                    for (const tip1 of tips1) {
                        for (const tip2 of tips2) {
                            const dx = tip1.x - tip2.x;
                            const dy = tip1.y - tip2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            
                            if (dist < threshold) {
                                // Check if synapse already exists
                                const exists = synapses.some(s => 
                                    (s.neuron1 === neuron1 && s.neuron2 === neuron2) ||
                                    (s.neuron1 === neuron2 && s.neuron2 === neuron1)
                                );
                                
                                if (!exists) {
                                    synapses.push(new Synapse(neuron1, neuron2));
                                }
                            }
                        }
                    }
                }
            }
        }

        // Clear canvas
        function clearCanvas() {
            ctx.clearRect(0, 0, width, height);
            neurons = [];
            synapses = [];
            pulses = [];
        }

        // Draw background effects
        function drawBackground() {
            // Background color
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // Scanlines
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            
            for (let y = 0; y < height; y += 4) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Vignette
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, width / 2
            );
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Animation loop
        function animate() {
            if (!isPaused) {
                drawBackground();
                
                // Grow neurons
                neurons.forEach(neuron => {
                    if (neuron.isGrowing) {
                        neuron.grow();
                    }
                });
                
                // Check for new synapses
                checkSynapses();
                
                // Update and draw synapses
                synapses.forEach(synapse => {
                    synapse.update();
                    synapse.draw();
                });
                
                // Draw neurons
                neurons.forEach(neuron => neuron.draw());
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // Handle pause toggle
        config.pause = false;
        Object.defineProperty(config, 'pause', {
            get: function() { return isPaused; },
            set: function(value) {
                isPaused = value;
            }
        });

        // Start simulation
        initSimulation();
        animate();
    </script>
</body>
</html>
