<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .app { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 2rem; margin-bottom: 24px; color: #2c3e50; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .input-row input {
    flex: 1; padding: 10px 14px; font-size: 1rem; border: 1px solid #ccc;
    border-radius: 6px; outline: none; transition: border-color .2s;
  }
  .input-row input:focus { border-color: #3498db; }
  .input-row button {
    padding: 10px 20px; font-size: 1rem; background: #3498db; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
    transition: background .2s;
  }
  .input-row button:hover { background: #2980b9; }
  .filters { display: flex; gap: 4px; margin-bottom: 16px; justify-content: center; }
  .filters button {
    padding: 6px 16px; font-size: .875rem; border: 1px solid #ccc; background: #fff;
    border-radius: 20px; cursor: pointer; transition: all .2s;
  }
  .filters button.active { background: #3498db; color: #fff; border-color: #3498db; }
  .filters button:hover:not(.active) { background: #ecf0f1; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #fff; border-bottom: 1px solid #eee; transition: background .15s;
  }
  li:hover { background: #fafafa; }
  li input[type="checkbox"] {
    width: 20px; height: 20px; cursor: pointer; accent-color: #3498db; flex-shrink: 0;
  }
  li .text {
    flex: 1; font-size: 1rem; word-break: break-word;
    transition: color .2s;
  }
  li.completed .text {
    text-decoration: line-through; color: #aaa;
  }
  li button.delete {
    background: none; border: none; color: #e74c3c; font-size: 1.2rem;
    cursor: pointer; padding: 0 4px; opacity: .5; transition: opacity .2s;
  }
  li button.delete:hover { opacity: 1; }
  .count { text-align: center; margin-top: 12px; font-size: .85rem; color: #888; }
</style>
</head>
<body>
<div class="app">
  <h1>Todos</h1>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="What needs to be done?" autofocus>
    <button id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul id="todoList"></ul>
  <div class="count" id="count"></div>
</div>
<script>
(function () {
  const STORAGE_KEY = 'todos_qwen3.6_35b';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('todoList');
  const countEl = document.getElementById('count');
  const filterBtns = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo(text) {
    text = text.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    save();
    render();
    input.value = '';
    input.focus();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.completed = !todo.completed;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function getFiltered() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const filtered = getFiltered();
    list.innerHTML = '';
    filtered.forEach(todo => {
      const li = document.createElement('li');
      if (todo.completed) li.classList.add('completed');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = todo.completed;
      cb.addEventListener('change', () => toggleTodo(todo.id));
      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = todo.text;
      const del = document.createElement('button');
      del.className = 'delete';
      del.textContent = '\u00D7';
      del.title = 'Delete';
      del.addEventListener('click', () => deleteTodo(todo.id));
      li.appendChild(cb);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });
    const active = todos.filter(t => !t.completed).length;
    countEl.textContent = todos.length ? active + ' item' + (active !== 1 ? 's' : '') + ' left' : '';
  }

  addBtn.addEventListener('click', () => addTodo(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(input.value); });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
