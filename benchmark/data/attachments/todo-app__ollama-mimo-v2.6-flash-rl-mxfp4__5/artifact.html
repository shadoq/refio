<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .container {
    background: #fff;
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  header {
    background: #fff;
    padding: 28px 28px 20px;
    border-bottom: 1px solid #eee;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    color: #333;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  #todo-input {
    flex: 1;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #e4e6eb;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #todo-input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }

  #add-btn {
    padding: 14px 22px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  #add-btn:hover {
    background: #5a6fd6;
  }

  #add-btn:active {
    transform: scale(0.97);
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 16px 28px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }

  .filter-btn {
    padding: 8px 16px;
    background: #fff;
    border: 1px solid #e4e6eb;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    border-color: #667eea;
    color: #667eea;
  }

  .filter-btn.active {
    background: #667eea;
    border-color: #667eea;
    color: #fff;
  }

  ul#todo-list {
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  ul#todo-list li {
    display: flex;
    align-items: center;
    padding: 16px 28px;
    border-bottom: 1px solid #f0f0f0;
    gap: 14px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid #d0d0d0;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: #fff;
  }

  .checkbox:hover {
    border-color: #667eea;
  }

  .checkbox.checked {
    background: #667eea;
    border-color: #667eea;
  }

  .checkbox.checked::after {
    content: "✓";
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }

  .todo-text {
    flex: 1;
    font-size: 16px;
    color: #333;
    word-break: break-word;
    line-height: 1.4;
    transition: color 0.2s;
  }

  .todo-text.completed {
    text-decoration: line-through;
    color: #a0a0a0;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #c0c0c0;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
    line-height: 1;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    color: #e74c3c;
    background: #fdeaea;
  }

  .empty-state {
    padding: 48px 28px;
    text-align: center;
    color: #a0a0a0;
    font-size: 15px;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #fafafa;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #888;
  }

  .clear-completed {
    background: none;
    border: none;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .clear-completed:hover {
    color: #e74c3c;
    background: #fdeaea;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>My Todos</h1>
    <div class="input-row">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-btn">Add</button>
    </div>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="todo-list"></ul>

  <footer>
    <span id="count">0 items left</span>
    <button class="clear-completed" id="clear-completed">Clear completed</button>
  </footer>
</div>

<script>
(function () {
  const STORAGE_KEY = 'todo_ollama-mimo-v2.6-flash-rl-mxfp4_01';

  let todos = [];
  let currentFilter = 'all';

  const input = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('todo-list');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-completed');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) todos = parsed;
      }
    } catch (e) {
      todos = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {}
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: text,
      completed: false
    });
    input.value = '';
    save();
    render();
    input.focus();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) {
      t.completed = !t.completed;
      save();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.completed);
    save();
    render();
  }

  function getVisible() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const visible = getVisible();
    list.innerHTML = '';

    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      if (todos.length === 0) {
        empty.textContent = 'No todos yet. Add one above!';
      } else if (currentFilter === 'active') {
        empty.textContent = 'No active todos. All done! 🎉';
      } else {
        empty.textContent = 'No completed todos yet.';
      }
      list.appendChild(empty);
    } else {
      visible.forEach(todo => {
        const li = document.createElement('li');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox' + (todo.completed ? ' checked' : '');
        checkbox.setAttribute('role', 'checkbox');
        checkbox.setAttribute('aria-checked', todo.completed ? 'true' : 'false');
        checkbox.addEventListener('click', () => toggleTodo(todo.id));

        const text = document.createElement('span');
        text.className = 'todo-text' + (todo.completed ? ' completed' : '');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '&times;';
        del.title = 'Delete';
        del.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    const activeCount = todos.filter(t => !t.completed).length;
    countEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    clearBtn.style.visibility = todos.some(t => t.completed) ? 'visible' : 'hidden';
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  clearBtn.addEventListener('click', clearCompleted);

  load();
  render();
})();
</script>
</body>
</html>
