<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todo App</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    display: flex;
    justify-content: center;
    padding: 40px 10px;
  }
  #todo-app {
    background: white;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    border-radius: 6px;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  form {
    display: flex;
    margin-bottom: 20px;
  }
  input[type=text] {
    flex-grow: 1;
    padding: 8px 10px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 4px 0 0 4px;
    outline: none;
  }
  input[type=text]:focus {
    border-color: #007BFF;
  }
  button {
    background: #007BFF;
    border: none;
    color: white;
    padding: 0 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 0 4px 4px 0;
  }
  button:hover {
    background: #0056b3;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  li:last-child {
    border-bottom: none;
  }
  li.completed label {
    text-decoration: line-through;
    color: #999;
  }
  label {
    flex-grow: 1;
    cursor: pointer;
  }
  input[type=checkbox] {
    margin-right: 10px;
    cursor: pointer;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #cc0000;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    padding: 0 5px;
  }
  .filter-group {
    display: flex;
    justify-content: center;
    margin-top: 15px;
  }
  .filter-group button {
    background: transparent;
    border: 1px solid #007BFF;
    color: #007BFF;
    margin: 0 5px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }
  .filter-group button.active,
  .filter-group button:hover {
    background-color: #007BFF;
    color: white;
  }
</style>
</head>
<body>
<div id="todo-app">
  <h1>Todo App</h1>
  <form id="todo-form">
    <input type="text" id="todo-input" placeholder="Add a new todo" autocomplete="off" />
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list"></ul>
  <div class="filter-group">
    <button type="button" data-filter="all" class="active">All</button>
    <button type="button" data-filter="active">Active</button>
    <button type="button" data-filter="completed">Completed</button>
  </div>
</div>
<script>
  (() => {
    const STORAGE_KEY = 'todo_openai_gpt-4.1-mini_02';

    let todos = [];
    let currentFilter = 'all';

    const todoListEl = document.getElementById('todo-list');
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const filterButtons = document.querySelectorAll('.filter-group button');

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function loadTodos() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        todos = JSON.parse(saved);
      }
    }

    function renderTodos() {
      todoListEl.innerHTML = '';
      let filteredTodos;
      if (currentFilter === 'active') {
        filteredTodos = todos.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filteredTodos = todos.filter(t => t.completed);
      } else {
        filteredTodos = todos;
      }

      filteredTodos.forEach(todo => {
        const li = document.createElement('li');
        li.className = todo.completed ? 'completed' : '';

        const label = document.createElement('label');
        label.textContent = todo.text;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', () => {
          todo.completed = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '×';
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = 'Delete todo';
        deleteBtn.addEventListener('click', () => {
          todos = todos.filter(t => t !== todo);
          saveTodos();
          renderTodos();
        });

        label.prepend(checkbox);
        li.appendChild(label);
        li.appendChild(deleteBtn);
        todoListEl.appendChild(li);
      });
    }

    todoForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (text) {
        todos.push({ text, completed: false });
        saveTodos();
        renderTodos();
        todoInput.value = '';
        todoInput.focus();
      }
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.getAttribute('data-filter');
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        renderTodos();
      });
    });

    loadTodos();
    renderTodos();
  })();
</script>
</body>
</html>
