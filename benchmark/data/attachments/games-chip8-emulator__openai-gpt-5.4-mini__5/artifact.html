<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIP-8 Emulator</title>
  <style>
    :root {
      --bg: #0e1014;
      --panel: #161a22;
      --panel-2: #1d2330;
      --text: #e8eefc;
      --muted: #98a2b3;
      --accent: #7aa2ff;
      --accent-2: #5be49b;
      --border: #2b3344;
      --danger: #ff6b6b;
      --warning: #ffd166;
      --screen: #0a0c10;
      --pixel: #e8eefc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #171b24 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 1.2fr) minmax(340px, 0.8fr);
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: rgba(22, 26, 34, 0.96);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    }

    .panel-header h1,
    .panel-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .panel-body {
      padding: 16px;
    }

    .screen-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 2 / 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: var(--screen);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .controls .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, input[type="file"], input[type="range"] {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #232a39, #1a2030);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.06s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover {
      border-color: #415071;
      background: linear-gradient(180deg, #273146, #1c2435);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: rgba(122, 162, 255, 0.55);
      background: linear-gradient(180deg, rgba(122, 162, 255, 0.22), rgba(122, 162, 255, 0.12));
    }

    button.danger {
      border-color: rgba(255, 107, 107, 0.55);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.18), rgba(255, 107, 107, 0.1));
    }

    .speed {
      display: grid;
      gap: 8px;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .speed label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
    }

    .file-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .file-row input[type="file"] {
      color: var(--muted);
      max-width: 100%;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .status span {
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .key {
      user-select: none;
      text-align: center;
      padding: 12px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #212838, #181e2a);
      color: var(--text);
      font-weight: 700;
      cursor: default;
      transition: background 0.1s ease, transform 0.1s ease, border-color 0.1s ease;
    }

    .key.down {
      background: linear-gradient(180deg, rgba(91, 228, 155, 0.28), rgba(91, 228, 155, 0.14));
      border-color: rgba(91, 228, 155, 0.55);
      transform: translateY(1px);
    }

    .debug-grid {
      display: grid;
      gap: 12px;
    }

    .regs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .reg {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .mono-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      color: #d6def2;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 48px;
    }

    .stack-list {
      display: grid;
      gap: 6px;
      font-family: "Courier New", monospace;
      font-size: 13px;
    }

    .stack-item {
      padding: 8px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend code {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="panel-header">
        <h1>CHIP-8 Emulator</h1>
        <div id="emuState" class="hint">Ready</div>
      </div>
      <div class="panel-body screen-wrap">
        <canvas id="screen" width="64" height="32"></canvas>

        <div class="controls">
          <button id="runBtn" class="primary">Run</button>
          <button id="pauseBtn">Pause</button>
          <button id="stepBtn">Single Step</button>
          <button id="resetBtn" class="danger">Reset</button>
        </div>

        <div class="speed">
          <label>
            <span>Instructions per frame</span>
            <span id="ipfValue">10</span>
          </label>
          <input id="ipf" type="range" min="1" max="40" value="10" />
        </div>

        <div class="file-row">
          <input id="romFile" type="file" accept=".ch8,.rom,.bin,application/octet-stream" />
          <button id="loadDemoBtn">Load Demo ROM</button>
        </div>

        <div class="status">
          <span>Timer: <strong id="timerInfo">60 Hz</strong></span>
          <span>Sound: <strong id="soundInfo">Off</strong></span>
          <span>Keys: <strong>1-4 Q-R A-F Z-V</strong></span>
        </div>

        <div>
          <div class="hint">Virtual keypad</div>
          <div id="keypad" class="keypad" aria-label="CHIP-8 keypad"></div>
          <div class="legend">
            <span><code>1 2 3 4</code> → 1 2 3 C</span>
            <span><code>Q W E R</code> → 4 5 6 D</span>
            <span><code>A S D F</code> → 7 8 9 E</span>
            <span><code>Z X C V</code> → A 0 B F</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Debugger</h2>
        <div id="instructionInfo" class="hint">No instruction</div>
      </div>
      <div class="panel-body debug-grid">
        <div class="regs" id="registers"></div>
        <div>
          <div class="hint">I / PC</div>
          <div id="ipDisplay" class="mono-box"></div>
        </div>
        <div>
          <div class="hint">Current instruction</div>
          <div id="currentInstruction" class="mono-box"></div>
        </div>
        <div>
          <div class="hint">Stack</div>
          <div id="stackView" class="stack-list"></div>
        </div>
        <div>
          <div class="hint">Memory / ROM info</div>
          <div id="romInfo" class="mono-box"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const WIDTH = 64;
      const HEIGHT = 32;
      const MEMORY_SIZE = 4096;
      const START_ADDRESS = 0x200;
      const FONT_ADDRESS = 0x050;
      const SCALE = 12;

      const FONT_SET = [
        0xF0,0x90,0x90,0x90,0xF0,
        0x20,0x60,0x20,0x20,0x70,
        0xF0,0x10,0xF0,0x80,0xF0,
        0xF0,0x10,0xF0,0x10,0xF0,
        0x90,0x90,0xF0,0x10,0x10,
        0xF0,0x80,0xF0,0x10,0xF0,
        0xF0,0x80,0xF0,0x90,0xF0,
        0xF0,0x10,0x20,0x40,0x40,
        0xF0,0x90,0xF0,0x90,0xF0,
        0xF0,0x90,0xF0,0x10,0xF0,
        0xF0,0x90,0xF0,0x90,0x90,
        0xE0,0x90,0xE0,0x90,0xE0,
        0xF0,0x80,0x80,0x80,0xF0,
        0xE0,0x90,0x90,0x90,0xE0,
        0xF0,0x80,0xF0,0x80,0xF0,
        0xF0,0x80,0xF0,0x80,0x80
      ];

      const DEMO_ROM = new Uint8Array([
        0x00, 0xE0,
        0x60, 0x00,
        0x61, 0x00,
        0x62, 0x0A,
        0xA0, 0x50,
        0xD0, 0x25,
        0x12, 0x0C,
        0x70, 0x01,
        0x30, 0x3C,
        0x12, 0x0E,
        0x60, 0x00,
        0x12, 0x06
      ]);

      const KEYMAP = {
        '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
        'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
        'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
        'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
      };

      const KEY_LABELS = ['1','2','3','C','4','5','6','D','7','8','9','E','A','0','B','F'];

      const canvas = document.getElementById('screen');
      const ctx = canvas.getContext('2d');
      const emuState = document.getElementById('emuState');
      const instructionInfo = document.getElementById('instructionInfo');
      const registersEl = document.getElementById('registers');
      const ipDisplay = document.getElementById('ipDisplay');
      const currentInstructionEl = document.getElementById('currentInstruction');
      const stackView = document.getElementById('stackView');
      const romInfo = document.getElementById('romInfo');
      const ipf = document.getElementById('ipf');
      const ipfValue = document.getElementById('ipfValue');
      const romFile = document.getElementById('romFile');
      const runBtn = document.getElementById('runBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const stepBtn = document.getElementById('stepBtn');
      const resetBtn = document.getElementById('resetBtn');
      const loadDemoBtn = document.getElementById('loadDemoBtn');
      const keypadEl = document.getElementById('keypad');
      const timerInfo = document.getElementById('timerInfo');
      const soundInfo = document.getElementById('soundInfo');

      const keypadButtons = new Map();
      for (let i = 0; i < 16; i++) {
        const div = document.createElement('div');
        div.className = 'key';
        div.textContent = KEY_LABELS[i];
        div.dataset.key = i.toString(16).toUpperCase();
        keypadEl.appendChild(div);
        keypadButtons.set(i, div);
      }

      class Chip8 {
        constructor() {
          this.memory = new Uint8Array(MEMORY_SIZE);
          this.V = new Uint8Array(16);
          this.I = 0;
          this.pc = START_ADDRESS;
          this.stack = [];
          this.delayTimer = 0;
          this.soundTimer = 0;
          this.keys = new Array(16).fill(false);
          this.display = new Uint8Array(WIDTH * HEIGHT);
          this.drawFlag = true;
          this.waitingForKey = false;
          this.waitRegister = 0;
          this.lastOpcode = 0;
          this.lastDecoded = '';
          this.romSize = 0;
          this.loadFont();
          this.resetState(false);
        }

        loadFont() {
          this.memory.set(FONT_SET, FONT_ADDRESS);
        }

        resetState(clearMemory = true) {
          if (clearMemory) {
            this.memory.fill(0);
            this.loadFont();
          }
          this.V.fill(0);
          this.I = 0;
          this.pc = START_ADDRESS;
          this.stack = [];
          this.delayTimer = 0;
          this.soundTimer = 0;
          this.keys.fill(false);
          this.display.fill(0);
          this.drawFlag = true;
          this.waitingForKey = false;
          this.waitRegister = 0;
          this.lastOpcode = 0;
          this.lastDecoded = 'CLS';
        }

        loadROM(bytes) {
          this.resetState(true);
          const limit = Math.min(bytes.length, MEMORY_SIZE - START_ADDRESS);
          this.memory.set(bytes.slice(0, limit), START_ADDRESS);
          this.romSize = limit;
          this.drawFlag = true;
        }

        setKey(index, pressed) {
          this.keys[index] = pressed;
          if (pressed && this.waitingForKey) {
            this.V[this.waitRegister] = index;
            this.waitingForKey = false;
          }
        }

        fetchOpcode() {
          return (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
        }

        step() {
          if (this.waitingForKey) {
            this.lastOpcode = this.fetchOpcode();
            this.lastDecoded = this.decodeOpcode(this.lastOpcode);
            return;
          }

          const opcode = this.fetchOpcode();
          this.lastOpcode = opcode;
          this.lastDecoded = this.decodeOpcode(opcode);
          this.pc = (this.pc + 2) & 0xFFF;

          const nnn = opcode & 0x0FFF;
          const nn = opcode & 0x00FF;
          const n = opcode & 0x000F;
          const x = (opcode >> 8) & 0x0F;
          const y = (opcode >> 4) & 0x0F;

          switch (opcode & 0xF000) {
            case 0x0000:
              switch (opcode) {
                case 0x00E0:
                  this.display.fill(0);
                  this.drawFlag = true;
                  break;
                case 0x00EE:
                  this.pc = this.stack.pop() || 0;
                  break;
                default:
                  break;
              }
              break;

            case 0x1000:
              this.pc = nnn;
              break;

            case 0x2000:
              this.stack.push(this.pc);
              this.pc = nnn;
              break;

            case 0x3000:
              if (this.V[x] === nn) this.pc = (this.pc + 2) & 0xFFF;
              break;

            case 0x4000:
              if (this.V[x] !== nn) this.pc = (this.pc + 2) & 0xFFF;
              break;

            case 0x5000:
              if (n === 0 && this.V[x] === this.V[y]) this.pc = (this.pc + 2) & 0xFFF;
              break;

            case 0x6000:
              this.V[x] = nn;
              break;

            case 0x7000:
              this.V[x] = (this.V[x] + nn) & 0xFF;
              break;

            case 0x8000:
              switch (n) {
                case 0x0:
                  this.V[x] = this.V[y];
                  break;
                case 0x1:
                  this.V[x] |= this.V[y];
                  this.V[0xF] = 0;
                  break;
                case 0x2:
                  this.V[x] &= this.V[y];
                  this.V[0xF] = 0;
                  break;
                case 0x3:
                  this.V[x] ^= this.V[y];
                  this.V[0xF] = 0;
                  break;
                case 0x4: {
                  const sum = this.V[x] + this.V[y];
                  this.V[0xF] = sum > 0xFF ? 1 : 0;
                  this.V[x] = sum & 0xFF;
                  break;
                }
                case 0x5: {
                  this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
                  this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
                  break;
                }
                case 0x6:
                  this.V[0xF] = this.V[x] & 0x1;
                  this.V[x] = (this.V[x] >> 1) & 0xFF;
                  break;
                case 0x7: {
                  this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
                  this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
                  break;
                }
                case 0xE:
                  this.V[0xF] = (this.V[x] >> 7) & 0x1;
                  this.V[x] = (this.V[x] << 1) & 0xFF;
                  break;
              }
              break;

            case 0x9000:
              if (n === 0 && this.V[x] !== this.V[y]) this.pc = (this.pc + 2) & 0xFFF;
              break;

            case 0xA000:
              this.I = nnn;
              break;

            case 0xB000:
              this.pc = (nnn + this.V[0]) & 0xFFF;
              break;

            case 0xC000:
              this.V[x] = (Math.floor(Math.random() * 256) & nn);
              break;

            case 0xD000: {
              const vx = this.V[x] % WIDTH;
              const vy = this.V[y] % HEIGHT;
              this.V[0xF] = 0;
              for (let row = 0; row < n; row++) {
                const sprite = this.memory[(this.I + row) & 0xFFF];
                for (let bit = 0; bit < 8; bit++) {
                  if ((sprite & (0x80 >> bit)) !== 0) {
                    const px = (vx + bit) % WIDTH;
                    const py = (vy + row) % HEIGHT;
                    const idx = px + py * WIDTH;
                    if (this.display[idx] === 1) this.V[0xF] = 1;
                    this.display[idx] ^= 1;
                  }
                }
              }
              this.drawFlag = true;
              break;
            }

            case 0xE000:
              switch (nn) {
                case 0x9E:
                  if (this.keys[this.V[x]]) this.pc = (this.pc + 2) & 0xFFF;
                  break;
                case 0xA1:
                  if (!this.keys[this.V[x]]) this.pc = (this.pc + 2) & 0xFFF;
                  break;
              }
              break;

            case 0xF000:
              switch (nn) {
                case 0x07:
                  this.V[x] = this.delayTimer;
                  break;
                case 0x0A:
                  this.waitingForKey = true;
                  this.waitRegister = x;
                  this.pc = (this.pc - 2) & 0xFFF;
                  break;
                case 0x15:
                  this.delayTimer = this.V[x];
                  break;
                case 0x18:
                  this.soundTimer = this.V[x];
                  break;
                case 0x1E:
                  this.I = (this.I + this.V[x]) & 0xFFF;
                  break;
                case 0x29:
                  this.I = FONT_ADDRESS + (this.V[x] * 5);
                  break;
                case 0x33:
                  this.memory[this.I] = Math.floor(this.V[x] / 100);
                  this.memory[(this.I + 1) & 0xFFF] = Math.floor((this.V[x] % 100) / 10);
                  this.memory[(this.I + 2) & 0xFFF] = this.V[x] % 10;
                  break;
                case 0x55:
                  for (let i = 0; i <= x; i++) this.memory[(this.I + i) & 0xFFF] = this.V[i];
                  break;
                case 0x65:
                  for (let i = 0; i <= x; i++) this.V[i] = this.memory[(this.I + i) & 0xFFF];
                  break;
              }
              break;
          }
        }

        tickTimers() {
          if (this.delayTimer > 0) this.delayTimer--;
          if (this.soundTimer > 0) this.soundTimer--;
        }

        decodeOpcode(opcode) {
          const nnn = opcode & 0x0FFF;
          const nn = opcode & 0x00FF;
          const n = opcode & 0x000F;
          const x = (opcode >> 8) & 0x0F;
          const y = (opcode >> 4) & 0x0F;
          const hx = x.toString(16).toUpperCase();
          const hy = y.toString(16).toUpperCase();
          const hnn = nn.toString(16).toUpperCase().padStart(2, '0');
          const hnnn = nnn.toString(16).toUpperCase().padStart(3, '0');
          switch (opcode & 0xF000) {
            case 0x0000:
              if (opcode === 0x00E0) return 'CLS';
              if (opcode === 0x00EE) return 'RET';
              return `SYS ${hnnn}`;
            case 0x1000: return `JP ${hnnn}`;
            case 0x2000: return `CALL ${hnnn}`;
            case 0x3000: return `SE V${hx}, ${hnn}`;
            case 0x4000: return `SNE V${hx}, ${hnn}`;
            case 0x5000: return n === 0 ? `SE V${hx}, V${hy}` : 'UNKNOWN';
            case 0x6000: return `LD V${hx}, ${hnn}`;
            case 0x7000: return `ADD V${hx}, ${hnn}`;
            case 0x8000:
              switch (n) {
                case 0x0: return `LD V${hx}, V${hy}`;
                case 0x1: return `OR V${hx}, V${hy}`;
                case 0x2: return `AND V${hx}, V${hy}`;
                case 0x3: return `XOR V${hx}, V${hy}`;
                case 0x4: return `ADD V${hx}, V${hy}`;
                case 0x5: return `SUB V${hx}, V${hy}`;
                case 0x6: return `SHR V${hx}`;
                case 0x7: return `SUBN V${hx}, V${hy}`;
                case 0xE: return `SHL V${hx}`;
              }
              return 'UNKNOWN';
            case 0x9000: return n === 0 ? `SNE V${hx}, V${hy}` : 'UNKNOWN';
            case 0xA000: return `LD I, ${hnnn}`;
            case 0xB000: return `JP V0, ${hnnn}`;
            case 0xC000: return `RND V${hx}, ${hnn}`;
            case 0xD000: return `DRW V${hx}, V${hy}, ${n}`;
            case 0xE000:
              if (nn === 0x9E) return `SKP V${hx}`;
              if (nn === 0xA1) return `SKNP V${hx}`;
              return 'UNKNOWN';
            case 0xF000:
              switch (nn) {
                case 0x07: return `LD V${hx}, DT`;
                case 0x0A: return `LD V${hx}, K`;
                case 0x15: return `LD DT, V${hx}`;
                case 0x18: return `LD ST, V${hx}`;
                case 0x1E: return `ADD I, V${hx}`;
                case 0x29: return `LD F, V${hx}`;
                case 0x33: return `LD B, V${hx}`;
                case 0x55: return `LD [I], V0-V${hx}`;
                case 0x65: return `LD V0-V${hx}, [I]`;
              }
              return 'UNKNOWN';
          }
          return 'UNKNOWN';
        }
      }

      const chip8 = new Chip8();
      let running = false;
      let lastTime = performance.now();
      let timerAccumulator = 0;
      let renderRequested = true;

      function drawScreen() {
        const image = ctx.createImageData(WIDTH, HEIGHT);
        for (let i = 0; i < chip8.display.length; i++) {
          const v = chip8.display[i] ? 255 : 0;
          const p = i * 4;
          image.data[p] = v;
          image.data[p + 1] = v;
          image.data[p + 2] = v;
          image.data[p + 3] = 255;
        }
        ctx.putImageData(image, 0, 0);
      }

      function updateDebugger() {
        registersEl.innerHTML = '';
        for (let i = 0; i < 16; i++) {
          const div = document.createElement('div');
          div.className = 'reg';
          div.innerHTML = `<span>V${i.toString(16).toUpperCase()}</span><strong>${chip8.V[i].toString(16).toUpperCase().padStart(2, '0')}</strong>`;
          registersEl.appendChild(div);
        }

        ipDisplay.textContent = `I: 0x${chip8.I.toString(16).toUpperCase().padStart(3, '0')}\nPC: 0x${chip8.pc.toString(16).toUpperCase().padStart(3, '0')}\nDT: 0x${chip8.delayTimer.toString(16).toUpperCase().padStart(2, '0')}\nST: 0x${chip8.soundTimer.toString(16).toUpperCase().padStart(2, '0')}`;

        currentInstructionEl.textContent = `0x${chip8.lastOpcode.toString(16).toUpperCase().padStart(4, '0')}   ${chip8.lastDecoded}`;

        stackView.innerHTML = '';
        if (chip8.stack.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'stack-item';
          empty.textContent = '(empty)';
          stackView.appendChild(empty);
        } else {
          chip8.stack.forEach((addr, idx) => {
            const item = document.createElement('div');
            item.className = 'stack-item';
            item.textContent = `${idx}: 0x${addr.toString(16).toUpperCase().padStart(3, '0')}`;
            stackView.appendChild(item);
          });
        }

        romInfo.textContent = `ROM size: ${chip8.romSize} bytes\nMemory start: 0x200\nFont set: 0x050-0x09F`;
        instructionInfo.textContent = running ? 'Running' : (chip8.waitingForKey ? 'Waiting for key' : 'Paused');
        emuState.textContent = running ? 'Running' : (chip8.waitingForKey ? 'Waiting for key' : 'Paused');
        timerInfo.textContent = '60 Hz';
        soundInfo.textContent = chip8.soundTimer > 0 ? 'On' : 'Off';
      }

      function setKeyVisual(key, pressed) {
        const btn = keypadButtons.get(key);
        if (btn) btn.classList.toggle('down', pressed);
      }

      function executeFrame() {
        const steps = parseInt(ipf.value, 10);
        for (let i = 0; i < steps; i++) chip8.step();
        renderRequested = true;
      }

      function loop(now) {
        const dt = now - lastTime;
        lastTime = now;
        timerAccumulator += dt;
        while (timerAccumulator >= 1000 / 60) {
          chip8.tickTimers();
          timerAccumulator -= 1000 / 60;
          renderRequested = true;
        }
        if (running) executeFrame();
        if (renderRequested || chip8.drawFlag) {
          drawScreen();
          renderRequested = false;
          chip8.drawFlag = false;
        }
        updateDebugger();
        requestAnimationFrame(loop);
      }

      runBtn.addEventListener('click', () => { running = true; });
      pauseBtn.addEventListener('click', () => { running = false; });
      stepBtn.addEventListener('click', () => {
        running = false;
        chip8.step();
        renderRequested = true;
      });
      resetBtn.addEventListener('click', () => {
        running = false;
        chip8.resetState(true);
        renderRequested = true;
      });
      loadDemoBtn.addEventListener('click', () => {
        chip8.loadROM(DEMO_ROM);
        running = false;
        renderRequested = true;
      });
      ipf.addEventListener('input', () => {
        ipfValue.textContent = ipf.value;
      });

      romFile.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const buffer = await file.arrayBuffer();
        chip8.loadROM(new Uint8Array(buffer));
        running = false;
        renderRequested = true;
      });

      window.addEventListener('keydown', (e) => {
        const key = KEYMAP[e.key.toLowerCase()];
        if (key === undefined) return;
        if (!e.repeat) chip8.setKey(key, true);
        setKeyVisual(key, true);
        e.preventDefault();
      });

      window.addEventListener('keyup', (e) => {
        const key = KEYMAP[e.key.toLowerCase()];
        if (key === undefined) return;
        chip8.setKey(key, false);
        setKeyVisual(key, false);
        e.preventDefault();
      });

      keypadButtons.forEach((btn, key) => {
        btn.addEventListener('mousedown', () => {
          chip8.setKey(key, true);
          setKeyVisual(key, true);
        });
        btn.addEventListener('mouseup', () => {
          chip8.setKey(key, false);
          setKeyVisual(key, false);
        });
        btn.addEventListener('mouseleave', () => {
          chip8.setKey(key, false);
          setKeyVisual(key, false);
        });
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          chip8.setKey(key, true);
          setKeyVisual(key, true);
        }, { passive: false });
        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          chip8.setKey(key, false);
          setKeyVisual(key, false);
        }, { passive: false });
      });

      chip8.loadROM(DEMO_ROM);
      ipfValue.textContent = ipf.value;
      drawScreen();
      updateDebugger();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
