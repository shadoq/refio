<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            box-shadow: 0 0 60px rgba(16, 26, 58, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script>
        // ==================== SETUP ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Color palette
        const colors = {
            background: '#05070f',
            backgroundGlow: '#101a3a',
            mainBranch: '#00e5ff',
            accentBranch: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            uiAccent: '#ffd400',
            scanline: 'rgba(0, 229, 255, 0.08)'
        };
        
        // Simulation state
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let isRunning = true;
        let generationComplete = false;
        let branchCount = 0;
        
        // ==================== GUI ====================
        const gui = new dat.GUI({ width: 300 });
        
        const params = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 8,
            branchSplitChance: 0.25,
            branchCurvature: 0.3,
            maxBranchLength: 150,
            
            // Synapses
            synapseDistance: 40,
            synapseGlow: 20,
            
            // Pulses
            pulseSpeed: 1.5,
            pulseFrequency: 0.02,
            pulseBrightness: 1.0,
            
            // Visuals
            bgColor: colors.background,
            branchColor: colors.mainBranch,
            accentColor: colors.accentBranch,
            synapseColor: colors.synapse,
            pulseColor: colors.pulse
        };
        
        gui.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').listen();
        gui.add(params, 'branchGrowthSpeed', 0.5, 5, 0.1).name('Growth Speed').listen();
        gui.add(params, 'maxBranchDepth', 3, 12, 1).name('Max Depth').listen();
        gui.add(params, 'branchSplitChance', 0.05, 0.5, 0.05).name('Split Chance').listen();
        gui.add(params, 'branchCurvature', 0.1, 0.8, 0.05).name('Curvature').listen();
        gui.add(params, 'maxBranchLength', 50, 200, 10).name('Max Length').listen();
        
        gui.add(params, 'synapseDistance', 10, 80, 5).name('Synapse Threshold').listen();
        gui.add(params, 'synapseGlow', 5, 50, 1).name('Synapse Glow').listen();
        
        gui.add(params, 'pulseSpeed', 0.5, 3, 0.1).name('Pulse Speed').listen();
        gui.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Pulse Frequency').listen();
        gui.add(params, 'pulseBrightness', 0.3, 2, 0.1).name('Pulse Brightness').listen();
        
        gui.addColor(params, 'bgColor').name('Background Color').listen();
        gui.addColor(params, 'branchColor').name('Branch Color').listen();
        gui.addColor(params, 'accentColor').name('Accent Color').listen();
        gui.addColor(params, 'synapseColor').name('Synapse Color').listen();
        gui.addColor(params, 'pulseColor').name('Pulse Color').listen();
        
        const buttons = {
            regenerate: () => resetAndGrow(),
            clear: () => clearCanvas(),
            pause: () => {
                isRunning = !isRunning;
                if (isRunning) animate();
            }
        };
        
        const folderButtons = gui.addFolder('Controls');
        folderButtons.add(buttons, 'regenerate').name('Regenerate Network');
        folderButtons.add(buttons, 'clear').name('Clear Canvas');
        folderButtons.add(buttons, 'pause').name(isRunning ? 'Pause' : 'Resume');
        
        // ==================== CLASSES ====================
        
        class Branch {
            constructor(start, end, parent = null) {
                this.start = start;
                this.end = end;
                this.parent = parent;
                this.progress = 0;
                this.target = end;
                this.thickness = Math.random() * 2 + 1;
                this.active = true;
                this.children = [];
            }
            
            grow() {
                if (!this.active) return;
                if (generationComplete) return;
                
                const speed = params.branchGrowthSpeed;
                this.progress += speed;
                
                if (this.progress >= 1) {
                    this.progress = 1;
                    this.end = this.target;
                    this.checkForSynapse();
                    this.checkForSideBranches();
                }
                
                if (this.progress < 1) {
                    this.updatePosition();
                }
            }
            
            updatePosition() {
                const t = this.progress;
                const x = this.start.x + (this.end.x - this.start.x) * t;
                const y = this.start.y + (this.end.y - this.start.y) * t;
                return { x, y };
            }
            
            checkForSynapse() {
                for (const synapse of synapses) {
                    if (!synapse.active) continue;
                    
                    const dx = this.end.x - synapse.branchStart.x;
                    const dy = this.end.y - synapse.branchStart.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance <= params.synapseDistance) {
                        if (!synapses.find(s => s.branchStart === this.end && s.branchEnd === synapse.branchStart)) {
                            synapses.push({
                                branchStart: this.end,
                                branchEnd: synapse.branchStart,
                                active: true
                            });
                        }
                    }
                }
            }
            
            checkForSideBranches() {
                if (Math.random() < 0.02) {
                    const angle = Math.random() * Math.PI * 2;
                    const length = Math.random() * params.maxBranchLength * 0.3;
                    const endX = this.end.x + Math.cos(angle) * length;
                    const endY = this.end.y + Math.sin(angle) * length;
                    
                    this.children.push(new Branch(this.end, { x: endX, y: endY }, this));
                    branchCount++;
                    
                    if (branchCount > 500) {
                        generationComplete = true;
                    }
                }
            }
        }
        
        class Pulse {
            constructor(start, end) {
                this.start = start;
                this.end = end;
                this.progress = 0;
                this.speed = params.pulseSpeed;
                this.active = true;
                this.life = 1.0;
            }
            
            update() {
                if (!this.active) return;
                
                this.progress += this.speed;
                this.life -= 0.02;
                
                if (this.progress >= 1 || this.life <= 0) {
                    this.active = false;
                }
            }
            
            getPosition() {
                const t = Math.min(this.progress, 1);
                return {
                    x: this.start.x + (this.end.x - this.start.x) * t,
                    y: this.start.y + (this.end.y - this.start.y) * t
                };
            }
        }
        
        // ==================== FUNCTIONS ====================
        
        function randomPoint() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height
            };
        }
        
        function randomDirection() {
            const angle = Math.random() * Math.PI * 2;
            const length = Math.random() * params.maxBranchLength;
            return {
                x: Math.cos(angle) * length,
                y: Math.sin(angle) * length
            };
        }
        
        function createNeuron(x, y) {
            return {
                x,
                y,
                branches: [],
                lastPulse: -1
            };
        }
        
        function resetAndGrow() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            branchCount = 0;
            generationComplete = false;
            
            const center = { x: canvas.width / 2, y: canvas.height / 2 };
            
            for (let i = 0; i < params.neuronCount; i++) {
                const angle = (i / params.neuronCount) * Math.PI * 2;
                const radius = 50 + Math.random() * 30;
                const neuron = createNeuron(
                    center.x + Math.cos(angle) * radius,
                    center.y + Math.sin(angle) * radius
                );
                neurons.push(neuron);
            }
            
            animate();
        }
        
        function clearCanvas() {
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            resetAndGrow();
        }
        
        function updateBranches() {
            for (const branch of branches) {
                branch.grow();
            }
        }
        
        function detectSynapses() {
            for (const branch of branches) {
                if (!branch.active) continue;
                
                for (const synapse of synapses) {
                    if (!synapse.active) continue;
                    
                    const dx = branch.end.x - synapse.branchStart.x;
                    const dy = branch.end.y - synapse.branchStart.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance <= params.synapseDistance) {
                        synapse.active = false;
                    }
                }
            }
            
            for (const branch of branches) {
                if (!branch.active) continue;
                
                for (const synapse of synapses) {
                    if (!synapse.active) continue;
                    
                    const dx = branch.end.x - synapse.branchEnd.x;
                    const dy = branch.end.y - synapse.branchEnd.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance <= params.synapseDistance) {
                        synapse.active = false;
                    }
                }
            }
            
            for (const synapse of synapses) {
                if (!synapse.active) {
                    const dx = synapse.branchStart.x - synapse.branchEnd.x;
                    const dy = synapse.branchStart.y - synapse.branchEnd.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance <= params.synapseDistance) {
                        synapse.active = true;
                        
                        if (Math.random() < params.pulseFrequency) {
                            pulses.push(new Pulse(synapse.branchStart, synapse.branchEnd));
                            pulses.push(new Pulse(synapse.branchEnd, synapse.branchStart));
                        }
                    }
                }
            }
        }
        
        function updatePulses() {
            for (const pulse of pulses) {
                pulse.update();
            }
            pulses = pulses.filter(p => p.active);
        }
        
        function drawBranch(branch) {
            if (!branch.active) return;
            
            const pos = branch.updatePosition();
            
            ctx.beginPath();
            ctx.moveTo(branch.start.x, branch.start.y);
            ctx.lineTo(pos.x, pos.y);
            
            ctx.strokeStyle = branch.parent ? params.accentColor : params.branchColor;
            ctx.lineWidth = branch.thickness;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        
        function drawSynapses() {
            for (const synapse of synapses) {
                if (!synapse.active) continue;
                
                const dx = synapse.branchStart.x - synapse.branchEnd.x;
                const dy = synapse.branchStart.y - synapse.branchEnd.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > params.synapseDistance) continue;
                
                const midX = (synapse.branchStart.x + synapse.branchEnd.x) / 2;
                const midY = (synapse.branchStart.y + synapse.branchEnd.y) / 2;
                
                ctx.beginPath();
                ctx.arc(midX, midY, 4, 0, Math.PI * 2);
                ctx.fillStyle = params.synapseColor;
                ctx.shadowBlur = params.synapseGlow;
                ctx.shadowColor = params.synapseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        function drawPulses() {
            for (const pulse of pulses) {
                const pos = pulse.getPosition();
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.shadowBlur = 8;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        function drawVignette() {
            const gradient = ctx.createRadialGradient(
                canvas.width / 2,
                canvas.height / 2,
                canvas.width * 0.6,
                canvas.width / 2,
                canvas.height / 2
            );
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function drawScanlines() {
            for (let y = 0; y < canvas.height; y += 4) {
                ctx.fillStyle = colors.scanline;
                ctx.fillRect(0, y, canvas.width, 1);
            }
        }
        
        function render() {
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawVignette();
            drawScanlines();
            
            for (const branch of branches) {
                drawBranch(branch);
            }
            
            drawSynapses();
            drawPulses();
        }
        
        function animate() {
            if (!isRunning) return;
            
            updateBranches();
            detectSynapses();
            updatePulses();
            render();
            
            requestAnimationFrame(animate);
        }
        
        // ==================== INITIALIZATION ====================
        resetAndGrow();
    </script>
</body>
</html>
