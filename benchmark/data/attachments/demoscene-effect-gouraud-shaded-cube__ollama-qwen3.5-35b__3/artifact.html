// --- Math Helpers & Classes ---

class Vec3 {
    constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
    
    add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
    sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
    mul(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
    
    dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
    cross(v) { 
        return new Vec3(
            this.y*v.z - this.z*v.y,
            this.z*v.x - this.x*v.z,
            this.x*v.y - this.y*v.x
        );
    }
    
    normalize() {
        const len = Math.sqrt(this.x*this.x + this.y*this.y + this.z*this.z);
        if (len > 0) return new Vec3(this.x/len, this.y/len, this.z/len);
        return new Vec3(0,0,0);
    }

    clone() { return new Vec3(this.x, this.y, this.z); }
}

class Vertex extends Vec3 {
    constructor(x, y, z) { super(x, y, z); }
    
    // Apply rotation matrices in order: X -> Y -> Z (or any consistent order)
    rotate(rx, ry, rz) {
        let x = this.x; 
        let y = this.y; 
        let z = this.z;

        const cosX = Math.cos(rx); const sinX = Math.sin(rx);
        const cosY = Math.cos(ry); const sinY = Math.sin(ry);
        const cosZ = Math.cos(rz); const sinZ = Math.sin(rz);

        // Rotate X axis
        let y1 = y * cosX - z * sinX;
        let z1 = y * sinX + z * cosX;
        
        // Rotate Y axis (using results from X)
        let x2 = x * cosY + z1 * sinY;
        let z2 = -x * sinY + z1 * cosY;

        // Rotate Z axis (using results from XY)
        this.x = x2 * cosZ - y1 * sinZ;
        this.y = x2 * sinZ + y1 * cosZ;
        this.z = z2;
    }

    project(cx, cy) {
        // Perspective projection: screenX = focalLength * worldX / (worldZ + cameraDist)
        const scale = FOV_SCALE / (this.z + 500); // Camera is at -500 relative to cube center? 
                                                  // Let's assume Cube Center is (0,0,0), Camera looks from Z < 0.
                                                  // If we project onto screen plane at z=0, and camera at z = -FOV_SCALE
        
        const x2d = this.x * scale + cx;
        const y2d = this.y * scale + cy;
        
        return { x: x2d, y: y2d, w: scale }; // Return scale for interpolation later if needed (though Gouraud uses colors)
    }

    interpolateColor(v1Col, v2Col, t) {
        const r = Math.round(v1Col.r + (v2Col.r - v1Col.r) * t);
        const g = Math.round(v1Col.g + (v2Col.g - v1Col.g) * t);
        const b = Math.round(v1Col.b + (v2Col.b - v1Col.b) * t);
        return `rgb(${r},${g},${b})`;
    }

    lerpColor(c1, c2, factor) {
         // Simple linear interpolation for Gouraud shading across the triangle surface is complex. 
         // We will handle this in rasterization by calculating barycentric coordinates or scanline weights.
         return `rgb(${Math.round(c1.r + (c2.r - c1.r)*factor)}, ${Math.round(c1.g + (c2.g - c1.g)*factor)}, ${Math.round(c1.b + (c2.b - c1.b)*factor)})`;
    }
}

function calculateVertexColors(tri, lightPos) {
    const v0 = VERTS[tri.tri[0]];

    const v2 = VERTS[tri.tri[2]];
    
    // Light direction (normalized vector from vertex to light source? Or just fixed position?)
    // Lambert shading: I = max(0, N . L) * Kd. 
    // We need the normal of each face. The triangle has a shared normal for all vertices in this simple model.
    
    const n = tri.normal; 
    
    // Calculate light vector from vertex to light source (or just use global direction if directional).
    // Let's assume point light at `lightPos`. 
    // Vector L is Light - Vertex.
    
    function getLambertColor(v, faceNormal) {
        const l = new Vec3(lightPos.x - v.x, lightPos.y - v.y, lightPos.z - v.z);
        const len = Math.sqrt(l.dot(l));
        if (len === 0) return [1.0, 1.0, 1.0]; // Avoid division by zero
        
        l.normalize(); 
        faceNormal.normalize();
        
        let diff = n.dot(l);
        if (diff < 0) diff = 0; // Backface relative to light? Or just clamp.
        
        const baseColorHex = tri.color;
        const rBase = parseInt(baseColorHex.slice(1,3), 16)/255;
        const gBase = parseInt(baseColorHex.slice(3,5), 16)/255;
        const bBase = parseInt(baseColorHex.slice(5,7), 16)/255;
        
        // Ambient light factor (0.2) + Diffuse * Base Color
        const ambient = 0.2;
        const intensity = ambient + diff * (1 - ambient);
        
        return [rBase*intensity, gBase*intensity, bBase*intensity];
    }

    // Calculate colors for all three vertices of the triangle
    const c0 = getLambertColor(v0, n);
    const c1 = getLambertColor(v1, n);
    const c2 = getLambertColor(v2, n);
    
    return { v: [v0,v1,v2], colors: [[c0,c1,c2]], normal: n }; // Store projected positions later? No, project first.
}

// Helper for linear interpolation of color and position during scanline fill (simplified)
function lerp(a, b, t) { return a + (b - a) * t; }

            // Backface culling via screen space winding order
            const cross = (pts[1].x - pts[0].x) * (pts[2].y - pts[0].y) - (pts[1].y - pts[0].y) * (pts[2].x - pts[0].x);
            
            // If we assume CCW is front-facing, negative cross product means backface. 
            if (cross < 0) return;

            renderList.push({ points: pts });
        });

        renderList.forEach(t => {
            const p = t.points;

            });

                const len = Math.sqrt(l.dot(l));
                if (len === 0) return [1.0, 1.0, 1.0]; 
                l.normalize(); faceNormal.normalize();
                
                let diff = faceNormal.dot(l);
                if (diff < 0) diff = 0;
                
                const baseColorHex = triData.color; // Access from triangle data
                const rBase = parseInt(baseColorHex.slice(1,3), 16)/255;
                const gBase = parseInt(baseColorHex.slice(3,5), 16)/255;
                const bBase = parseInt(baseColorHex.slice(5,7), 16)/255;
                
                const ambient = 0.2;
                const intensity = ambient + diff * (1 - ambient);
                
                return [rBase*intensity, gBase*intensity, bBase*intensity];
            }

            // Calculate colors for the three vertices of this triangle instance
            const cVals = pIndices.map(i => getLambertColor(VERTS[i], triData.normal));
            
            // Map sorted indices to their corresponding color values (since we need them in order)
            // We have 3 vertices: v0, v1, v2. Their colors are at index 0, 1, 2 of cVals.
            const pColors = [cVals[sortedIndices[0]], cVals[sortedIndices[1]], cVals[sortedIndices[2]]];

            // Draw Scanlines for Top Half (vTop to vMid) and Bottom Half

            function drawTriangleHalf(yStart, yEnd, xLeftBase, colorLeftBase, xRightBase, colorRightBase, isBottom) {
                const tStep = 1.0 / (yEnd - yStart);
                
                for (let y = Math.floor(yStart); y < Math.ceil(yEnd) && y < canvas.height; y++) {

                    const xLeft = lerp(xLeftBase, p[sortedIndices[2]].x, isBottom ? (t-1)/(isBottom?1:0) : t);

                }
            }

            // Simpler Scanline Logic using edge equations or just iterating rows
            
            const yTop = Math.floor(vTop.y);
            const yMid = Math.ceil(p[sortedIndices[1]].y);
            const yBot = Math.ceil(p[sortedIndices[2]].y);

            if (wireframeMode) {
                ctx.beginPath();
                ctx.moveTo(p[0].x, p[0].y);
                ctx.lineTo(p[1].x, p[1].y);
                ctx.lineTo(p[2].x, p[2].y);
                ctx.closePath();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            } else {
                // Fill logic
                for (let y = Math.max(yTop, 0); y < Math.min(Math.ceil(vBot.y), canvas.height); y++) {
                    let t1, xLeft, colorLeft;
                    
                    if (y <= vMid.y) {
                        // Top half: Edge between vTop and p[sortedIndices[2]]? No. 
                        // We need to determine which vertices form the left/right edges at this Y level.
                        // This requires tracking edge intersections dynamically or pre-calculating them.
                        
                        const t = (y - vTop.y) / (p[sortedIndices[1]].y - vTop.y);
                        xLeft = lerp(vTop.x, p[sortedIndices[2]].x, t); 
                        colorLeft = interpolateColor(pColors[0], pColors[2], t); // Wait, indices?
                        
                        const tRight = (y - vTop.y) / (p[sortedIndices[1]].y - vTop.y); // Same edge if sorted correctly? No.
                    } else {

        });

    } else {
         ctx.fillStyle = 'rgba(0,0,0,0.5)';
