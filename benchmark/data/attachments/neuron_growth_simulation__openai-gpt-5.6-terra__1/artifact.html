<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #05070f;
        color: #d6ff00;
        font-family: "Courier New", monospace;
    }
    #stage {
        position: relative;
        width: 800px;
        height: 800px;
        max-width: 100vw;
        max-height: 100vh;
    }
    canvas {
        display: block;
        width: 800px;
        height: 800px;
        max-width: 100%;
        max-height: 100%;
        background: #05070f;
        box-shadow: 0 0 45px rgba(0, 229, 255, 0.16);
    }
    .overlay {
        position: absolute;
        top: 18px;
        left: 20px;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        text-shadow: 0 0 10px #00e5ff;
    }
    .overlay h1 {
        margin: 0;
        color: #ffd400;
        font-size: 13px;
        font-weight: normal;
    }
    .overlay p {
        margin: 7px 0 0;
        color: rgba(214, 255, 0, 0.72);
        font-size: 9px;
        letter-spacing: 0.12em;
    }
    .notice {
        position: fixed;
        right: 18px;
        bottom: 18px;
        color: #ffd400;
        font: 11px "Courier New", monospace;
        text-shadow: 0 0 8px #ffd400;
    }
    .dg.ac {
        z-index: 10 !important;
    }
    .dg.main {
        border: 1px solid #ffd400 !important;
        box-shadow: 0 0 18px rgba(255, 212, 0, 0.38) !important;
    }
    .dg .title {
        color: #ffd400 !important;
        text-shadow: 0 0 6px #ffd400;
    }
    .dg li.title {
        background: #101a3a !important;
        border-left: 2px solid #ffd400 !important;
    }
    .dg li:not(.folder) {
        background: rgba(5, 7, 15, 0.94) !important;
        border-bottom: 1px solid rgba(0, 229, 255, 0.15) !important;
    }
    .dg .property-name {
        color: #d6ff00 !important;
    }
    .dg input, .dg select {
        color: #ffd400 !important;
        background: #05070f !important;
    }
    .dg .c .slider {
        background: #101a3a !important;
    }
    .dg .c .slider-fg {
        background: #ffd400 !important;
    }
    @media (max-width: 820px), (max-height: 820px) {
        #stage {
            transform: scale(min(calc(100vw / 800), calc(100vh / 800)));
            transform-origin: center;
        }
    }
</style>
</head>
<body>
<div id="stage">
    <canvas id="network" width="800" height="800"></canvas>
    <div class="overlay">
        <h1>Neural Growth Array</h1>
        <p>Organic signal topology</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
    // setup
    const canvas = document.getElementById("network");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const settings = {
        neuronCount: 4,
        growthSpeed: 0.72,
        maxDepth: 5,
        splitChance: 0.58,
        curvature: 0.52,
        maxBranchLength: 94,
        synapseDistance: 56,
        synapseGlow: 1.2,
        pulseSpeed: 0.62,
        pulseFrequency: 1.25,
        pulseBrightness: 1.15,
        backgroundColor: "#05070f",
        branchColor: "#00e5ff",
        accentBranchColor: "#d6ff00",
        synapseColor: "#ff2bd6",
        pulseColor: "#fff36a",
        regenerateNetwork: regenerateNetwork,
        clearCanvas: clearCanvas,
        pauseResume: pauseResume
    };

    let branches = [];
    let jobs = [];
    let synapses = [];
    let pulses = [];
    let paused = false;
    let blankScene = false;
    let branchId = 0;
    let lastTime = performance.now();
    let pulseClock = 0;

    function random(min, max) {
        return min + Math.random() * (max - min);
    }

    function pointOnBranch(branch, progress) {
        const t = Math.max(0, Math.min(1, progress));
        const a = (1 - t) * (1 - t);
        const b = 2 * (1 - t) * t;
        const c = t * t;
        return {
            x: a * branch.start.x + b * branch.control.x + c * branch.end.x,
            y: a * branch.start.y + b * branch.control.y + c * branch.end.y
        };
    }

    function makeBranch(start, angle, depth, neuron) {
        if (branches.length >= 380) return null;

        const length = random(settings.maxBranchLength * 0.43, settings.maxBranchLength);
        const curveAngle = angle + random(-1.2, 1.2) * settings.curvature;
        const end = {
            x: start.x + Math.cos(angle) * length,
            y: start.y + Math.sin(angle) * length
        };
        const control = {
            x: start.x + Math.cos(curveAngle) * length * 0.52,
            y: start.y + Math.sin(curveAngle) * length * 0.52
        };

        const branch = {
            id: branchId++,
            neuron: neuron,
            start: { x: start.x, y: start.y },
            control: control,
            end: end,
            angle: angle + random(-0.34, 0.34) * settings.curvature,
            growth: 0,
            depth: depth,
            thickness: random(0.75, 2.25) * (1 - depth * 0.075),
            accent: Math.random() < 0.19,
            finished: false
        };

        branches.push(branch);
        jobs.push(branch);
        return branch;
    }

    function regenerateNetwork() {
        branches = [];
        jobs = [];
        synapses = [];
        pulses = [];
        branchId = 0;
        pulseClock = 0;
        blankScene = false;

        for (let i = 0; i < settings.neuronCount; i++) {
            const seed = {
                x: W * 0.5 + random(-88, 88),
                y: H * 0.5 + random(-88, 88)
            };
            const roots = Math.floor(random(2, 4));
            for (let j = 0; j < roots; j++) {
                makeBranch(seed, random(0, Math.PI * 2), 0, i);
            }
        }
    }

    function clearCanvas() {
        branches = [];
        jobs = [];
        synapses = [];
        pulses = [];
        blankScene = true;
    }

    function pauseResume() {
        paused = !paused;
    }

    // GUI setup
    function buildGui() {
        if (!(window.dat && window.dat.GUI)) {
            const notice = document.createElement("div");
            notice.className = "notice";
            notice.textContent = "CONTROL PANEL UNAVAILABLE";
            document.body.appendChild(notice);
            return;
        }

        const gui = new dat.GUI({ width: 275 });
        const growth = gui.addFolder("Growth");
        const synapseFolder = gui.addFolder("Synapses");
        const pulseFolder = gui.addFolder("Pulses");
        const visuals = gui.addFolder("Visuals");

        const regenerateOnFinish = function(controller) {
            controller.onFinishChange(regenerateNetwork);
        };

        regenerateOnFinish(growth.add(settings, "neuronCount", 3, 6, 1).name("neuron count"));
        regenerateOnFinish(growth.add(settings, "growthSpeed", 0.08, 2, 0.01).name("branch growth speed"));
        regenerateOnFinish(growth.add(settings, "maxDepth", 1, 8, 1).name("max branch depth"));
        regenerateOnFinish(growth.add(settings, "splitChance", 0.05, 1, 0.01).name("branch split chance"));
        regenerateOnFinish(growth.add(settings, "curvature", 0, 1, 0.01).name("branch curvature"));
        regenerateOnFinish(growth.add(settings, "maxBranchLength", 25, 150, 1).name("max branch length"));

        synapseFolder.add(settings, "synapseDistance", 15, 120, 1).name("synapse distance").onFinishChange(rebuildSynapses);
        synapseFolder.add(settings, "synapseGlow", 0.1, 3, 0.05).name("synapse glow strength");

        pulseFolder.add(settings, "pulseSpeed", 0.08, 2, 0.01).name("pulse speed");
        pulseFolder.add(settings, "pulseFrequency", 0.05, 4, 0.05).name("pulse frequency");
        pulseFolder.add(settings, "pulseBrightness", 0.1, 3, 0.05).name("pulse brightness");

        visuals.addColor(settings, "backgroundColor").name("background color");
        visuals.addColor(settings, "branchColor").name("branch color");
        visuals.addColor(settings, "accentBranchColor").name("accent branch color");
        visuals.addColor(settings, "synapseColor").name("synapse color");
        visuals.addColor(settings, "pulseColor").name("pulse color");

        gui.add(settings, "regenerateNetwork").name("regenerate network");
        gui.add(settings, "clearCanvas").name("clear canvas");
        gui.add(settings, "pauseResume").name("pause/resume animation");

        growth.open();
        synapseFolder.open();
    }

    // neuron growth
    function finishBranch(branch) {
        branch.finished = true;
        const index = jobs.indexOf(branch);
        if (index !== -1) jobs.splice(index, 1);

        if (branch.depth < settings.maxDepth && branches.length < 380) {
            let children = Math.random() < settings.splitChance ? (Math.random() < 0.3 ? 3 : 2) : 1;
            if (Math.random() < 0.17) children++;
            children = Math.min(children, 3);

            for (let i = 0; i < children; i++) {
                const spread = children === 1 ? random(-0.62, 0.62) : (i - (children - 1) / 2) * random(0.48, 0.95);
                makeBranch(branch.end, branch.angle + spread + random(-0.22, 0.22), branch.depth + 1, branch.neuron);
            }
        }

        rebuildSynapses();
    }

    function growBranches(delta) {
        const limit = Math.min(jobs.length, 14);
        for (let i = limit - 1; i >= 0; i--) {
            const branch = jobs[i];
            branch.growth += delta * settings.growthSpeed * (0.55 + branch.depth * 0.06);
            if (branch.growth >= 1) {
                branch.growth = 1;
                finishBranch(branch);
            }
        }
    }

    // synapse detection
    function rebuildSynapses() {
        const completed = branches.filter(function(branch) {
            return branch.finished;
        }).slice(-180);

        const found = [];
        const keys = new Set();

        for (let i = 0; i < completed.length; i++) {
            for (let j = i + 1; j < completed.length; j++) {
                const a = completed[i];
                const b = completed[j];
                if (a.id === b.id) continue;

                const dx = a.end.x - b.end.x;
                const dy = a.end.y - b.end.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 8 && distance < settings.synapseDistance) {
                    const key = a.id < b.id ? a.id + ":" + b.id : b.id + ":" + a.id;
                    if (!keys.has(key)) {
                        keys.add(key);
                        found.push({
                            key: key,
                            a: { x: a.end.x, y: a.end.y },
                            b: { x: b.end.x, y: b.end.y },
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }
        }

        synapses = found.slice(0, 150);
    }

    // pulse animation
    function updatePulses(delta) {
        pulseClock += delta;
        const interval = 1 / Math.max(settings.pulseFrequency, 0.05);

        if (synapses.length && pulseClock >= interval) {
            pulseClock = 0;
            const synapse = synapses[Math.floor(Math.random() * synapses.length)];
            pulses.push({
                synapse: synapse,
                progress: 0,
                reverse: Math.random() < 0.5
            });
        }

        for (let i = pulses.length - 1; i >= 0; i--) {
            pulses[i].progress += delta * settings.pulseSpeed;
            if (pulses[i].progress > 1) pulses.splice(i, 1);
        }
    }

    // rendering
    function drawBackground(time) {
        ctx.fillStyle = settings.backgroundColor;
        ctx.fillRect(0, 0, W, H);

        const glow = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, 560);
        glow.addColorStop(0, "#101a3a");
        glow.addColorStop(0.45, "rgba(16, 26, 58, 0.35)");
        glow.addColorStop(1, "rgba(5, 7, 15, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
        ctx.lineWidth = 1;
        for (let y = 0; y < H; y += 8) {
            ctx.beginPath();
            ctx.moveTo(0, y + 0.5);
            ctx.lineTo(W, y + 0.5);
            ctx.stroke();
        }

        ctx.fillStyle = "rgba(0, 229, 255, 0.08)";
        for (let i = 0; i < 42; i++) {
            const x = (Math.sin(i * 98.2 + time * 0.00018) * 0.5 + 0.5) * W;
            const y = (Math.sin(i * 41.7 + time * 0.00027) * 0.5 + 0.5) * H;
            ctx.fillRect(x, y, 1, 1);
        }

        const vignette = ctx.createRadialGradient(W / 2, H / 2, 250, W / 2, H / 2, 650);
        vignette.addColorStop(0, "rgba(5, 7, 15, 0)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.72)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
    }

    function drawBranch(branch) {
        const progress = branch.growth;
        const color = branch.accent ? settings.accentBranchColor : settings.branchColor;
        const steps = Math.max(3, Math.ceil(progress * 22));

        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const point = pointOnBranch(branch, progress * i / steps);
            if (i === 0) ctx.moveTo(point.x, point.y);
            else ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(0.45, branch.thickness);
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.stroke();
    }

    function drawSynapses(time) {
        ctx.lineWidth = 0.75;
        for (let i = 0; i < synapses.length; i++) {
            const synapse = synapses[i];
            const shimmer = 0.38 + 0.32 * Math.sin(time * 0.004 + synapse.phase);
            ctx.beginPath();
            ctx.moveTo(synapse.a.x, synapse.a.y);
            ctx.lineTo(synapse.b.x, synapse.b.y);
            ctx.strokeStyle = settings.synapseColor;
            ctx.globalAlpha = shimmer;
            ctx.shadowColor = settings.synapseColor;
            ctx.shadowBlur = 12 * settings.synapseGlow;
            ctx.stroke();

            const x = (synapse.a.x + synapse.b.x) * 0.5;
            const y = (synapse.a.y + synapse.b.y) * 0.5;
            ctx.beginPath();
            ctx.arc(x, y, 1.4 + shimmer * 1.4, 0, Math.PI * 2);
            ctx.fillStyle = settings.synapseColor;
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawPulses() {
        for (let i = 0; i < pulses.length; i++) {
            const pulse = pulses[i];
            const t = pulse.reverse ? 1 - pulse.progress : pulse.progress;
            const x = pulse.synapse.a.x + (pulse.synapse.b.x - pulse.synapse.a.x) * t;
            const y = pulse.synapse.a.y + (pulse.synapse.b.y - pulse.synapse.a.y) * t;
            const radius = 2.2 + settings.pulseBrightness * 2.4;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = settings.pulseColor;
            ctx.shadowColor = settings.pulseColor;
            ctx.shadowBlur = 18 * settings.pulseBrightness;
            ctx.fill();
        }
    }

    function render(time) {
        drawBackground(time);

        ctx.save();
        drawSynapses(time);
        for (let i = 0; i < branches.length; i++) drawBranch(branches[i]);
        drawPulses();
        ctx.restore();

        ctx.shadowBlur = 0;
    }

    function animate(time) {
        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        if (!paused && !blankScene) {
            growBranches(delta);
            updatePulses(delta);
        }

        render(time);
        requestAnimationFrame(animate);
    }

    buildGui();
    regenerateNetwork();
    requestAnimationFrame(animate);
</script>
</body>
</html>
