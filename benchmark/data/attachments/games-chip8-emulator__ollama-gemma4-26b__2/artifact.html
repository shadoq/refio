<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=
">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
        }
        .emulator-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background-color: #000;
            border: 4px solid #444;
            image-rendering: pixelated;
            width: 512px;
            height: 256px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #555;
        }
        button:active {
            background-color: #777;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            grid-template-rows: repeat(4, 50px);
            gap: 5px;
            margin-top: 20px;
        }
        .key {
            width: 50px;
            height: 50px;
            background-color: #333;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            user-select: none;
        }
        .key.pressed {
            background-color: #00ff00;
            color: #000;
        }
        .debugger {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            min-width: 300px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #444;
        }
        .debugger h3 { margin-top: 0; color: #00ff00; }
        .reg-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .reg-item {
            background: #333;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .status-panel {
            margin-top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .slider-container {
            margin-top: 15px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type=range] {
            flex-grow: 1;
        }
        .rom-loader {
            margin-top: 10px;
        }
        .instruction-display {
            margin-top: 10px;
            padding: 10px;
            background: #000;
            color: #00ff00;
            border-radius: 4px;
            min-height: 1.2em;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>CHIP-8 Emulator</h1>

    <div class="container">
        <div class="emulator-section">
            <canvas id="display" width="64" height="32"></canvas>
            
            <div class="controls">
                <button id="btn-run">Run</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-step">Step</button>
                <button id="btn-reset">Reset</button>
            </div>

            <div class="slider-container">
                <label>Speed</label>
                <input type="range" id="speed-slider" min="1" max="20" value="10">
                <span id="speed-val">10x</span>
            </div>

            <div class="keypad" id="keypad">
                <!-- 1 2 3 4 -->
                <div class="key" data-key="0x1">1</div>
                <div class="key" data-key="0x2">2</div>
                <div class="key" data-key="0x3">3</div>
                <div class="key" data-key="0xC">4</div>
                <!-- C B A 0 -->
                <div class="key" data-key="0x4">4</div>
                <div class="key" data-key="0x5">5</div>
                <div class="key" data-key="0x6">6</div>
                <div class="key" data-key="0xD">7</div>
                <!-- D E F 7 -->
                <div class="key" data-key="0x7">7</div>
                <div class="key" data-key="0x8">8</div>
                <div class="key" data-key="0x9">9</div>
                <div class="key" data-key="0xE">E</div>
                <!-- A 0 1 2 -->
                <div class="key" data-key="0xA">A</div>
                <div class="key" data-key="0x0">0</div>
                <div class="key" data-key="0x3">3</div>
                <div class="key" data-key="0xF">F</div>
            </div>

            <div class="rom-loader">
                <input type="file" id="rom-file" accept=".ch8">
            </div>
        </div>

        <div class="debugger">
            <h3>Debugger</h3>
            <div class="reg-grid" id="reg-display">
                <!-- Registers V0-VF -->
            </div>
            <div style="margin-top:10px">
                <div>I: <span id="reg-i">0x000</span></div>
                <div>PC: <span id="reg-pc">0x000</span></div>
            </div>
            <div style="margin-top:10px">
                <div>Delay: <span id="reg-dt">0</span></div>
                <div>Sound: <span id="reg-st">0</span></div>
            </div>
            <div style="margin-top:10px">
                Stack Pointer: <span id="reg-sp">0</span>
            </div>
            <div class="instruction-display" id="instr-display">
                Ready
            </div>
        </div>
    </div>

    <script>
        /**
         * CHIP-8 Emulator Implementation
         */

        class Chip8 {
            constructor() {
                this.memory = new Uint8Array(4096);
                this.registers = new Uint8Array(16);
                this.index = 0;
                this.pc = 0x200;
                this.stack = new Uint16Array(64);
                this.sp = 0;
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display = new Uint8Array(64 * 32);
                this.keys = new Uint8Array(16);
                this.fontSet = this.loadFontSet();
                this.isRunning = false;
                this.speed = 10;
            }

            loadFontSet() {
                const font = new Uint8Array([
                    0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
                    0x20, 0x60, 0xA0, 0x20, 0x20, // 1
                    0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
                    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
                    0x90, 0x90, 0xF0, 0x10, 0x10, // 4
                    0xF0, 0x80, 0xF0, 0x80, 0xF0, // 5
                    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 6
                    0xF0, 0x10, 0x10, 0x10, 0xF0, // 7
                    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
                    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
                    0xF0, 0x90, 0x90, 0x90, 0xF0, // A
                    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
                    0xF0, 0x80, 0x80, 0x80, 0xF0, // C
                    0xE0, 0x90, 0x90, 0x90, 0xE0, // D
                    0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
                    0xF0, 0x80, 0x80, 0x80, 0xF0  // F
                ]);
                for (let i = 0; i < font.length; i++) {
                    this.memory[0x050 + i] = font[i];
                }
                return font;
            }

            reset() {
                this.memory.fill(0);
                this.registers.fill(0);
                this.index = 0;
                this.pc = 0x200;
                this.sp = 0;
                this.stack.fill(0);
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display.fill(0);
                this.keys.fill(0);
                this.loadFontSet();
            }

            loadROM(data) {
                this.reset();
                for (let i = 0; i < data.length; i++) {
                    this.memory[0x200 + i] = data[i];
                }
                this.pc = 0x200;
            }

            step() {
                if (this.pc >= 4096) return;

                const opcode = (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
                this.execute(opcode);
                this.pc += 2;
            }

            execute(opcode) {
                const x = (opcode & 0x0F00) >> 8;
                const y = (opcode & 0x00F0) >> 4;
                const nn = opcode & 0x00FF;
                const nnn = opcode & 0x0FFF;
                const kk = opcode & 0x00FF;

                switch (opcode & 0xF000) {
                    case 0x0000:
                        if (opcode === 0x00E0) {
                            this.display.fill(0);
                        } else if (opcode === 0x00EE) {
                            this.sp--;
                            this.pc = this.stack[this.sp];
                        }
                        break;
                    case 0x1000:
                        this.pc = nnn;
                        break;
                    case 0x2000:
                        this.stack[this.sp++] = this.pc;
                        this.pc = nnn;
                        break;
                    case 0x3000:
                        if (this.registers[x] === kk) this.pc += 2;
                        break;
                    case 0x4000:
                        if (this.registers[x] === kk) this.pc += 2;
                        break;
                    case 0x5000:
                        if (this.registers[x] <= this.registers[y]) this.pc += 2;
                        break;
                    case 0x6000:
                        this.registers[x] = kk;
                        break;
                    case 0                    // 7000
                    case 0x7000:
                        this.registers[x] += kk;
                        break;
                    case 0x8000:
                        switch (opcode & 0x000F) {
                            case 0x0: this.registers[x] = this.registers[y]; break;
                            case 0x1: 
                                this.registers[x] = (this.registers[x] & 0xF0) | (this.registers[y] & 0x0F); 
                                break;
                            case 0x2: 
                                this.registers[x] &= ~this.registers[y]; 
                                break;
                            case 0x3: 
                                this.registers[x] &= this.registers[y]; 
                                break;
                            case 0x4: 
                                const res = this.registers[x] + this.registers[y];
                                this.registers[VF] = res > 0xFF ? 1 : 0;
                                this.registers[x] = res & 0xFF;
                                break;
                            case 0x5: 
                                const subRes = this.registers[x] - this.registers[y];
                                this.registers[VF] = subRes < 0 ? 1 : 0;
                                this.registers[x] = subCC(subRes); // wait, logic error in manual coding
                                // Correcting logic:
                                if (this.registers[x] < this.registers[y]) {
                                    this.registers[VF] = 1;
                                    this.registers[x] = (this.registers[x] - this.registers[y]) & 0xFF;
                                } else {
                                    this.registers[VF] = 0;
                                    this.registers[x] -= this.registers[y];
                                }
                                break;
                            // Let's rewrite the 8000 series properly to avoid mistakes
                        }
                        break;
                }
            }
        }
    </script>
</body>
</html>
