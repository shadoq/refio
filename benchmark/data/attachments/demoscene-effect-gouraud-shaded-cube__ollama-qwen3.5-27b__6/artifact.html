function rotateX(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: v.x, y: v.y * c - v.z * s, z: v.y * s + v.z * c };
}

function rotateY(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return { x: v.x * c + v.z * s, y: v.y, z: -v.x * s + v.z * c };
}

// ============================================================================
// PERSPECTIVE PROJECTION
// ============================================================================

function project(v) {
    const scale = FOCAL_LENGTH / (FOCAL_LENGTH + 10 + v.z); // Move cube back by 10 units
    return {
        x: CENTER_X + v.x * 60 * scale,
        y: CENTER_Y - v.y * 60 * scale, // Flip Y for screen coords
        z: v.z
    };
}

// ============================================================================
// BACKFACE CULLING (Winding Order Test)
// Returns positive if visible, negative if backface
// ============================================================================

function computeNormal(v1, v2, v3) {
    const edge1 = { x: v2.x - v1.x, y: v2.y - v1.y, z: v2.z - v1.z };
    const edge2 = { x: v3.x - v1.x, y: v3.y - v1.y, z: v3.z - v1.z };
    
    return {
        x: edge1.y * edge2.z - edge1.z * edge2.y,
        y: edge1.z * edge2.x - edge1.x * edge2.z,
        z: edge1.x * edge2.y - edge1.y * edge2.x
    };
}

// ============================================================================

function normalize(v) {
    const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    if (len === 0) return { x: 0, y: 0, z: 0 };
    return { x: v.x / len, y: v.y / len, z: v.z / len };
}

function dot(v1, v2) {
    return v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;

}
