<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .emulator-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #display {
            border: 2px solid #4CAF50;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 256px;
            height: 128px;
            background-color: #000;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        .speed-control {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .speed-control label {
            margin-right: 10px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 15px;
            width: 256px;
        }
        .key {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }
        .key:active {
            background-color: #4CAF50;
        }
        .debug-panel {
            background-color: #1e1e1e;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            padding: 15px;
            width: 400px;
            max-height: 600px;
            overflow-y: auto;
        }
        .debug-panel h2 {
            color: #4CAF50;
            margin-top: 0;
            border-bottom: 1px solid #4CAF50;
            padding-bottom: 8px;
        }
        .register-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }
        .register-label {
            font-weight: bold;
            color: #BB86FC;
        }
        .register-value {
            color: #03DAC6;
        }
        .instruction {
            font-family: monospace;
            background-color: #2d2d2d;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            border-left: 4px solid #4CAF50;
        }
        .stack-container {
            margin-top: 10px;
        }
        .stack-item {
            padding: 3px 0;
            font-family: monospace;
        }
        .file-input {
            margin-top: 15px;
        }
        .status {
            margin-top: 10px;
            color: #BB86FC;
            font-style: italic;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>CHIP-8 Emulator</h1>
    
    <div class="container">
        <div class="emulator-container">
            <canvas id="display" width="64" height="32"></canvas>
            <div class="controls">
                <button id="run">Run</button>
                <button id="pause">Pause</button>
                <button id="step">Step</button>
                <button id="reset">Reset</button>
            </div>
            <div class="speed-control">
                <label for="speed">Speed (instr/frame):</label>
                <input type="range" id="speed" min="1" max="1000" value="100">
                <span id="speed-value">100</span>
            </div>
            <div class="keypad">
                <div class="key" data-key="1">1</div>
                <div class="key" data-key="2">2</div>
                <div class="key" data-key="3">3</div>
                <div class="key" data-key="C">C</div>
                <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div>
                <div class="key" data-key="6">6</div>
                <div class="key" data-key="D">D</div>
                <div class="key" data-key="7">7</div>
                <div class="key" data-key="8">8</div>
                <div class="key" data-key="9">9</div>
                <div class="key" data-key="E">E</div>
                <div class="key" data-key="A">A</div>
                <div class="key" data-key="0">0</div>
                <div class="key" data-key="B">B</div>
                <div class="key" data-key="F">F</div>
            </div>
            <div class="file-input">
                <input type="file" id="rom-loader" accept=".ch8,.rom,.bin">
                <button id="load-rom">Load ROM</button>
            </div>
            <div class="status" id="status">Ready</div>
        </div>
        
        <div class="debug-panel">
            <h2>Debugger</h2>
            <div class="register-row">
                <span class="register-label">PC:</span>
                <span class="register-value" id="pc">0x200</span>
            </div>
            <div class="register-row">
                <span class="register-label">I:</span>
                <span class="register-value" id="i">0x000</span>
            </div>
            <div class="register-row">
                <span class="register-label">DT:</span>
                <span class="register-value" id="dt">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">ST:</span>
                <span class="register-value" id="st">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VF:</span>
                <span class="register-value" id="vf">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V0:</span>
                <span class="register-value" id="v0">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V1:</span>
                <span class="register-value" id="v1">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V2:</span>
                <span class="register-value" id="v2">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V3:</span>
                <span class="register-value" id="v3">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V4:</span>
                <span class="register-value" id="v4">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V5:</span>
                <span class="register-value" id="v5">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V6:</span>
                <span class="register-value" id="v6">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V7:</span>
                <span class="register-value" id="v7">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V8:</span>
                <span class="register-value" id="v8">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">V9:</span>
                <span class="register-value" id="v9">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VA:</span>
                <span class="register-value" id="va">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VB:</span>
                <span class="register-value" id="vb">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VC:</span>
                <span class="register-value" id="vc">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VD:</span>
                <span class="register-value" id="vd">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VE:</span>
                <span class="register-value" id="ve">0</span>
            </div>
            <div class="register-row">
                <span class="register-label">VF:</span>
                <span class="register-value" id="vf">0</span>
            </div>
            
            <div class="instruction" id="current-instruction">--</div>
            
            <div class="stack-container">
                <h3>Stack</h3>
                <div id="stack"></div>
            </div>
        </div>
    </div>

    <script>
        // CHIP-8 Emulator Implementation
        const MEMORY_SIZE = 4096;
        const FONT_SET = [
            0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
            0x20, 0x60, 0x20, 0x20, 0x70, // 1
            0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
            0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
            0x90, 0x90, 0xF0, 0x10, 0x10, // 4
            0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
            0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
            0xF0, 0x10, 0x20, 0x40, 0x40, // 7
            0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
            0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
            0xF0, 0x90, 0xF0, 0x90, 0x90, // A
            0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
            0xF0, 0x80, 0x80, 0x80, 0xF0, // C
            0xE0, 0x90, 0x90, 0x90, 0xE0, // D
            0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
            0xF0, 0x80, 0xF0, 0x80, 0x80  // F
        ];
        
        // Demo ROM: Draws a smiley face and moves it with arrow keys
        // This program draws a smiley face at position (30,15) and moves it with keys 1,2,4,5
        // The smiley face is 8x8 pixels
        const DEMO_ROM = [
            // Initialize registers
            0x61, 0x00, 0x62, 0x00, 0x63, 0x00, 0x64, 0x00,  // V1=0, V2=0, V3=0, V4=0
            0x65, 0x1E, 0x66, 0x0F,  // V5=30 (x), V6=15 (y)
            0x67, 0x08, 0x68, 0x08,  // V7=8 (width), V8=8 (height)
            0x69, 0x01, 0x6A, 0x01, 0x6B, 0x01, 0x6C, 0x01,  // V9=1, VA=1, VB=1, VC=1
            0x6D, 0x01, 0x6E, 0x01, 0x6F, 0x01,  // VD=1, VE=1, VF=1
            
            // Load font data for smiley face (8x8)
            0x12, 0x20,  // GOTO 0x220
            0x61, 0x00,  // V1=0
            0x62, 0x00,  // V2=0
            0x63, 0x00,  // V3=0
            0x64, 0x00,  // V4=0
            0x65, 0x00,  // V5=0
            0x66, 0x00,  // V6=0
            0x67, 0x00,  // V7=0
            0x68, 0x00,  // V8=0
            0x69, 0x00,  // V9=0
            0x6A, 0x00,  // VA=0
            0x6B, 0x00,  // VB=0
            0x6C, 0x00,  // VC=0
            0x6D, 0x00,  // VD=0
            0x6E, 0x00,  // VE=0
            0x6F, 0x00,  // VF=0
            
            // Draw smiley face pattern (8x8)
            // Row 0: 01111110
            0x61, 0x7E,  // V1=0x7E
            // Row 1: 10000001
            0x62, 0x81,  // V2=0x81
            // Row 2: 10111101
            0x63, 0xBD,  // V3=0xBD
            // Row 3: 10111101
            0x64, 0xBD,  // V4=0xBD
            // Row 4: 10000001
            0x65, 0x81,  // V5=0x81
            // Row 5: 10111101
            0x66, 0xBD,  // V6=0xBD
            // Row 6: 10000001
            0x67, 0x81,  // V7=0x81
            // Row 7: 01111110
            0x68, 0x7E,  // V8=0x7E
            
            // Set index register to 0x500 (where we'll store the sprite)
            0xA5, 0x00,  // I=0x500
            
            // Store the sprite data
            0x51, 0x00,  // DRW V1, V0, 1 (draw row 0)
            0x52, 0x00,  // DRW V2, V0, 1 (draw row 1)
            0x53, 0x00,  // DRW V3, V0, 1 (draw row 2)
            0x54, 0x00,  // DRW V4, V0, 1 (draw row 3)
            0x55, 0x00,  // DRW V5, V0, 1 (draw row 4)
            0x56, 0x00,  // DRW V6, V0, 1 (draw row 5)
            0x57, 0x00,  // DRW V7, V0, 1 (draw row 6)
            0x58, 0x00,  // DRW V8, V0, 1 (draw row 7)
            
            // Main loop
            0x12, 0x20,  // GOTO 0x220
            0x61, 0x00,  // V1=0
            0x62, 0x00,  // V2=0
            0x63, 0x00,  // V3=0
            0x64, 0x00,  // V4=0
            0x65, 0x00,  // V5=0
            0x66, 0x00,  // V6=0
            0x67, 0x00,  // V7=0
            0x68, 0x00,  // V8=0
            0x69, 0x00,  // V9=0
            0x6A, 0x00,  // VA=0
            0x6B, 0x00,  // VB=0
            0x6C, 0x00,  // VC=0
            0x6D, 0x00,  // VD=0
            0x6E, 0x00,  // VE=0
            0x6F, 0x00,  // VF=0
            
            // Check for key press
            0xF0, 0x0A,  // LD V0, K (wait for key press)
            0x61, 0x00,  // V1=0
            0x62, 0x00,  // V2=0
            0x63, 0x00,  // V3=0
            0x64, 0x00,  // V4=0
            0x65, 0x00,  // V5=0
            0x66, 0x00,  // V6=0
            0x67, 0x00,  // V7=0
            0x68, 0x00,  // V8=0
            0x69, 0x00,  // V9=0
            0x6A, 0x00,  // VA=0
            0x6B, 0x00,  // VB=0
            0x6C, 0x00,  // VC=0
            0x6D, 0x00,  // VD=0
            0x6E, 0x00,  // VE=0
            0x6F, 0x00,  // VF=0
            
            // Clear screen
            0x00, 0xE0,  // CLS
            
            // Draw smiley face at new position
            0xA5, 0x00,  // I=0x500
            0x51, 0x00,  // DRW V1, V0, 1 (draw row 0)
            0x52, 0x00,  // DRW V2, V0, 1 (draw row 1)
            0x53, 0x00,  // DRW V3, V0, 1 (draw row 2)
            0x54, 0x00,  // DRW V4, V0, 1 (draw row 3)
            0x55, 0x00,  // DRW V5, V0, 1 (draw row 4)
            0x56, 0x00,  // DRW V6, V0, 1 (draw row 5)
            0x57, 0x00,  // DRW V7, V0, 1 (draw row 6)
            0x58, 0x00,  // DRW V8, V0, 1 (draw row 7)
            
            // Move based on key
            0x71, 0x01,  // ADD V1, 1 (move right)
            0x72, 0x01,  // ADD V2, 1 (move down)
            0x71, 0xFF,  // ADD V1, 255 (move left)
            0x72, 0xFF,  // ADD V2, 255 (move up)
            
            // Jump back to main loop
            0x12, 0x20,  // GOTO 0x220
            
            // Smiley face sprite data (8x8)
            // Row 0: 01111110
            0x7E,
            // Row 1: 10000001
            0x81,
            // Row 2: 10111101
            0xBD,
            // Row 3: 10111101
            0xBD,
            // Row 4: 10000001
            0x81,
            // Row 5: 10111101
            0xBD,
            // Row 6: 10000001
            0x81,
            // Row 7: 01111110
            0x7E
        ];
        
        // Key mapping for CHIP-8 keypad (16 keys)
        const KEY_MAP = {
            '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
            'q': 0x1, 'w': 0x2, 'e': 0x3, 'r': 0xC,
            '4': 0x4, '5': 0x5, '6': 0x6, 'd': 0xD,
            'a': 0x4, 's': 0x5, 'd': 0x6, 'f': 0xD,
            '7': 0x7, '8': 0x8, '9': 0x9, 'g': 0xE,
            'z': 0x7, 'x': 0x8, 'c': 0x9, 'v': 0xE,
            'A': 0xA, '0': 0x0, 'B': 0xB, 'F': 0xF,
            'y': 0xA, 'p': 0x0, 'h': 0xB, 'n': 0xF
        };
        
        // Initialize emulator state
        const memory = new Uint8Array(MEMORY_SIZE);
        const V = new Uint8Array(16); // V0-VF
        let I = 0; // Index register
        let PC = 0x200; // Program counter
        let delayTimer = 0;
        let soundTimer = 0;
        let stack = []; // Call stack
        let keyStates = new Array(16).fill(false); // Keypad states
        let running = false;
        let paused = false;
        let stepMode = false;
        let instructionsPerFrame = 100;
        let lastTime = 0;
        let frameCount = 0;
        
        // Display buffer (64x32 pixels)
        const display = new Uint8Array(64 * 32);
        
        // Initialize font set at 0x050
        for (let i = 0; i < FONT_SET.length; i++) {
            memory[0x050 + i] = FONT_SET[i];
        }
        
        // Initialize display canvas
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(64, 32);
        
        // Update display
        function updateDisplay() {
            for (let i = 0; i < 64 * 32; i++) {
                const pixel = display[i];
                const index = i * 4;
                imageData.data[index] = pixel * 255;     // R
                imageData.data[index + 1] = pixel * 255; // G
                imageData.data[index + 2] = pixel * 255; // B
                imageData.data[index + 3] = 255;         // A
            }
            ctx.putImageData(imageData, 0, 0);
        }
        
        // Load ROM
        function loadROM(romData) {
            // Clear memory
            memory.fill(0);
            V.fill(0);
            I = 0;
            PC = 0x200;
            delayTimer = 0;
            soundTimer = 0;
            stack = [];
            keyStates.fill(false);
            display.fill(0);
            updateDisplay();
            
            // Load font set
            for (let i = 0; i < FONT_SET.length; i++) {
                memory[0x050 + i] = FONT_SET[i];
            }
            
            // Load program
            for (let i = 0; i < romData.length && i < MEMORY_SIZE - 0x200; i++) {
                memory[0x200 + i] = romData[i];
            }
            
            // Update debugger
            updateDebugger();
            document.getElementById('status').textContent = 'ROM loaded successfully';
        }
        
        // Load demo ROM
        function loadDemoROM() {
            loadROM(DEMO_ROM);
        }
        
        // Decode and execute a single instruction
        function executeInstruction() {
            if (PC >= MEMORY_SIZE - 1) return;
            
            // Get current instruction (2 bytes)
            const opcode = (memory[PC] << 8) | memory[PC + 1];
            const x = (opcode & 0x0F00) >> 8; // X register
            const y = (opcode & 0x00F0) >> 4; // Y register
            const n = opcode & 0x000F; // N nibble
            const nn = opcode & 0x00FF; // NN byte
            const nnn = opcode & 0x0FFF; // NNN address
            
            // Store current instruction for debugger
            const instructionHex = '0x' + opcode.toString(16).padStart(4, '0');
            document.getElementById('current-instruction').textContent = instructionHex;
            
            // Execute instruction
            switch (opcode & 0xF000) {
                case 0x0000:
                    if (opcode === 0x00E0) {
                        // 00E0 - CLS
                        display.fill(0);
                        updateDisplay();
                        PC += 2;
                    } else if (opcode === 0x00EE) {
                        // 00EE - RET
                        PC = stack.pop() || 0x200;
                    } else {
                        // 0NNN - SYS addr
                        PC += 2;
                    }
                    break;
                    
                case 0x1000:
                    // 1NNN - JP addr
                    PC = nnn;
                    break;
                    
                case 0x2000:
                    // 2NNN - CALL addr
                    stack.push(PC + 2);
                    PC = nnn;
                    break;
                    
                case 0x3000:
                    // 3XNN - SE Vx, byte
                    if (V[x] === nn) {
                        PC += 4;
                    } else {
                        PC += 2;
                    }
                    break;
                    
                case 0x4000:
                    // 4XNN - SNE Vx, byte
                    if (V[x] !== nn) {
                        PC += 4;
                    } else {
                        PC += 2;
                    }
                    break;
                    
                case 0x5000:
                    // 5XY0 - SE Vx, Vy
                    if (V[x] === V[y]) {
                        PC += 4;
                    } else {
                        PC += 2;
                    }
                    break;
                    
                case 0x6000:
                    // 6XNN - LD Vx, byte
                    V[x] = nn;
                    PC += 2;
                    break;
                    
                case 0x7000:
                    // 7XNN - ADD Vx, byte
                    V[x] = (V[x] + nn) & 0xFF;
                    PC += 2;
                    break;
                    
                case 0x8000:
                    switch (n) {
                        case 0x0:
                            // 8XY0 - LD Vx, Vy
                            V[x] = V[y];
                            PC += 2;
                            break;
                        case 0x1:
                            // 8XY1 - OR Vx, Vy
                            V[x] |= V[y];
                            PC += 2;
                            break;
                        case 0x2:
                            // 8XY2 - AND Vx, Vy
                            V[x] &= V[y];
                            PC += 2;
                            break;
                        case 0x3:
                            // 8XY3 - XOR Vx, Vy
                            V[x] ^= V[y];
                            PC += 2;
                            break;
                        case 0x4:
                            // 8XY4 - ADD Vx, Vy
                            const sum = V[x] + V[y];
                            V[0xF] = sum > 0xFF ? 1 : 0; // Set VF to carry
                            V[x] = sum & 0xFF;
                            PC += 2;
                            break;
                        case 0x5:
                            // 8XY5 - SUB Vx, Vy
                            V[0xF] = V[x] > V[y] ? 1 : 0; // Set VF to borrow
                            V[x] = (V[x] - V[y] + 256) & 0xFF;
                            PC += 2;
                            break;
                        case 0x6:
                            // 8XY6 - SHR Vx {, Vy}
                            V[0xF] = V[x] & 0x1; // Set VF to least significant bit
                            V[x] >>= 1;
                            PC += 2;
                            break;
                        case 0x7:
                            // 8XY7 - SUBN Vx, Vy
                            V[0xF] = V[y] > V[x] ? 1 : 0; // Set VF to borrow
                            V[x] = (V[y] - V[x] + 256) & 0xFF;
                            PC += 2;
                            break;
                        case 0xE:
                            // 8XYE - SHL Vx {, Vy}
                            V[0xF] = (V[x] & 0x80) >> 7; // Set VF to most significant bit
                            V[x] = (V[x] << 1) & 0xFF;
                            PC += 2;
                            break;
                        default:
                            PC += 2;
                            break;
                    }
                    break;
                    
                case 0x9000:
                    // 9XY0 - SNE Vx, Vy
                    if (V[x] !== V[y]) {
                        PC += 4;
                    } else {
                        PC += 2;
                    }
                    break;
                    
                case 0xA000:
                    // ANNN - LD I, addr
                    I = nnn;
                    PC += 2;
                    break;
                    
                case 0xB000:
                    // BNNN - JP V0, addr
                    PC = nnn + V[0];
                    break;
                    
                case 0xC000:
                    // CXNN - RND Vx, byte
                    const random = Math.floor(Math.random() * 256);
                    V[x] = random & nn;
                    PC += 2;
                    break;
                    
                case 0xD000:
                    // DXYN - DRW Vx, Vy, nibble
                    const spriteHeight = n;
                    V[0xF] = 0; // Clear collision flag
                    
                    for (let row = 0; row < spriteHeight; row++) {
                        const spriteByte = memory[I + row];
                        for (let col = 0; col < 8; col++) {
                            if (spriteByte & (0x80 >> col)) {
                                const xCoord = (V[x] + col) % 64;
                                const yCoord = (V[y] + row) % 32;
                                const pixelIndex = yCoord * 64 + xCoord;
                                
                                // XOR with existing pixel
                                if (display[pixelIndex] === 1) {
                                    V[0xF] = 1; // Set collision flag
                                }
                                display[pixelIndex] ^= 1;
                            }
                        }
                    }
                    updateDisplay();
                    PC += 2;
                    break;
                    
                case 0xE000:
                    if (nn === 0x9E) {
                        // EX9E - SKP Vx
                        if (keyStates[V[x]]) {
                            PC += 4;
                        } else {
                            PC += 2;
                        }
                    } else if (nn === 0xA1) {
                        // EXA1 - SKNP Vx
                        if (!keyStates[V[x]]) {
                            PC += 4;
                        } else {
                            PC += 2;
                        }
                    } else {
                        PC += 2;
                    }
                    break;
                    
                case 0xF000:
                    if (nn === 0x07) {
                        // FX07 - LD Vx, DT
                        V[x] = delayTimer;
                        PC += 2;
                    } else if (nn === 0x0A) {
                        // FX0A - LD Vx, K
                        // Wait for key press
                        // We'll handle this in the main loop
                        paused = true;
                        stepMode = true;
                        PC += 2;
                    } else if (nn === 0x15) {
                        // FX15 - LD DT, Vx
                        delayTimer = V[x];
                        PC += 2;
                    } else if (nn === 0x18) {
                        // FX18 - LD ST, Vx
                        soundTimer = V[x];
                        PC += 2;
                    } else if (nn === 0x1E) {
                        // FX1E - ADD I, Vx
                        const sum = I + V[x];
                        V[0xF] = sum > 0xFFF ? 1 : 0; // Set VF to carry
                        I = sum & 0xFFF;
                        PC += 2;
                    } else if (nn === 0x29) {
                        // FX29 - LD F, Vx
                        I = V[x] * 5; // Font data is 5 bytes per digit
                        PC += 2;
                    } else if (nn === 0x33) {
                        // FX33 - LD B, Vx
                        // BCD conversion: Vx = hundreds, tens, units
                        const value = V[x];
                        memory[I] = Math.floor(value / 100);
                        memory[I + 1] = Math.floor((value % 100) / 10);
                        memory[I + 2] = value % 10;
                        PC += 2;
                    } else if (nn === 0x55) {
                        // FX55 - LD [I], Vx
                        for (let i = 0; i <= x; i++) {
                            memory[I + i] = V[i];
                        }
                        I += x + 1;
                        PC += 2;
                    } else if (nn === 0x65) {
                        // FX65 - LD Vx, [I]
                        for (let i = 0; i <= x; i++) {
                            V[i] = memory[I + i];
                        }
                        I += x + 1;
                        PC += 2;
                    } else {
                        PC += 2;
                    }
                    break;
                    
                default:
                    PC += 2;
                    break;
            }
            
            // Update debugger
            updateDebugger();
        }
        
        // Update debugger panel
        function updateDebugger() {
            document.getElementById('pc').textContent = '0x' + PC.toString(16).padStart(3, '0');
            document.getElementById('i').textContent = '0x' + I.toString(16).padStart(3, '0');
            document.getElementById('dt').textContent = delayTimer;
            document.getElementById('st').textContent = soundTimer;
            document.getElementById('vf').textContent = V[0xF];
            
            for (let i = 0; i < 16; i++) {
                document.getElementById('v' + (i === 10 ? 'A' : i === 11 ? 'B' : i === 12 ? 'C' : i === 13 ? 'D' : i === 14 ? 'E' : i === 15 ? 'F' : i)).textContent = V[i];
            }
            
            // Update stack
            const stackContainer = document.getElementById('stack');
            stackContainer.innerHTML = '';
            for (let i = stack.length - 1; i >= 0; i--) {
                const item = document.createElement('div');
                item.className = 'stack-item';
                item.textContent = '0x' + stack[i].toString(16).padStart(3, '0');
                stackContainer.appendChild(item);
            }
        }
        
        // Main execution loop
        function executeFrame() {
            if (!running || paused) return;
            
            // Execute multiple instructions per frame
            for (let i = 0; i < instructionsPerFrame; i++) {
                executeInstruction();
                
                // If we've reached the end of memory, stop
                if (PC >= MEMORY_SIZE - 1) {
                    running = false;
                    paused = true;
                    break;
                }
                
                // If we're in step mode, pause after one instruction
                if (stepMode) {
                    stepMode = false;
                    paused = true;
                    break;
                }
            }
            
            // Update timers (60 Hz)
            if (delayTimer > 0) delayTimer--;
            if (soundTimer > 0) {
                soundTimer--;
                // Simple beep sound (optional - could use Web Audio API)
            }
            
            // Update display
            updateDisplay();
        }
        
        // Game loop
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;
            
            // Run at approximately 60 FPS
            if (elapsed > 16.67) { // ~60 FPS
                executeFrame();
                lastTime = timestamp;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.getElementById('run').addEventListener('click', () => {
            running = true;
            paused = false;
            document.getElementById('status').textContent = 'Running';
        });
        
        document.getElementById('pause').addEventListener('click', () => {
            running = false;
            paused = true;
            document.getElementById('status').textContent = 'Paused';
        });
        
        document.getElementById('step').addEventListener('click', () => {
            if (!running) {
                running = true;
                paused = false;
                stepMode = true;
                document.getElementById('status').textContent = 'Stepping';
            }
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            loadDemoROM();
            running = false;
            paused = false;
            stepMode = false;
            document.getElementById('status').textContent = 'Reset';
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            instructionsPerFrame = parseInt(e.target.value);
            document.getElementById('speed-value').textContent = instructionsPerFrame;
        });
        
        document.getElementById('rom-loader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const arrayBuffer = event.target.result;
                const romData = new Uint8Array(arrayBuffer);
                loadROM(romData);
            };
            reader.readAsArrayBuffer(file);
        });
        
        document.getElementById('load-rom').addEventListener('click', () => {
            document.getElementById('rom-loader').click();
        });
        
        // Key event listeners
        document.addEventListener('keydown', (e) => {
            if (KEY_MAP[e.key] !== undefined) {
                const key = KEY_MAP[e.key];
                if (!keyStates[key]) {
                    keyStates[key] = true;
                    // Handle FX0A (wait for key press)
                    if (paused && PC > 0 && memory[PC] === 0xF0 && memory[PC + 1] === 0x0A) {
                        const x = (memory[PC] & 0x0F00) >> 8;
                        V[x] = key;
                        paused = false;
                        running = true;
                        stepMode = false;
                        executeInstruction();
                    }
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (KEY_MAP[e.key] !== undefined) {
                keyStates[KEY_MAP[e.key]] = false;
            }
        });
        
        // Keypad buttons
        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('mousedown', () => {
                const key = button.getAttribute('data-key');
                if (KEY_MAP[key] !== undefined) {
                    keyStates[KEY_MAP[key]] = true;
                    // Handle FX0A (wait for key press)
                    if (paused && PC > 0 && memory[PC] === 0xF0 && memory[PC + 1] === 0x0A) {
                        const x = (memory[PC] & 0x0F00) >> 8;
                        V[x] = KEY_MAP[key];
                        paused = false;
                        running = true;
                        stepMode = false;
                        executeInstruction();
                    }
                }
            });
            
            button.addEventListener('mouseup', () => {
                const key = button.getAttribute('data-key');
                if (KEY_MAP[key] !== undefined) {
                    keyStates[KEY_MAP[key]] = false;
                }
            });
            
            button.addEventListener('mouseleave', () => {
                const key = button.getAttribute('data-key');
                if (KEY_MAP[key] !== undefined) {
                    keyStates[KEY_MAP[key]] = false;
                }
            });
        });
        
        // Initialize
        loadDemoROM();
        updateDebugger();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
