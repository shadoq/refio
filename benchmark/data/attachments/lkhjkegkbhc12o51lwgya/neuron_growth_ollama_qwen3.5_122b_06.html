<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }
        canvas {
            display: block;
            background-color: #05070f;
        }
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, rgba(5, 7, 15, 0.8) 100%);
        }
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 229, 255, 0.03),
                rgba(0, 229, 255, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuralCanvas" width="800" height="800"></canvas>
        <div class="vignette"></div>
        <div class="scanlines"></div>
    </div>

    <script>
        // Configuration
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 8,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.5,
            
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a'
        };

        // Canvas setup
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // State
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let animationId;
        let lastTime = 0;

        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.growthProgress = 0;
                this.isGrowing = true;
                this.maxDepth = config.maxBranchDepth;
                this.currentDepth = 0;
            }

            grow() {
                if (!this.isGrowing) return;

                this.growthProgress += config.branchGrowthSpeed;

                if (this.growthProgress >= config.maxBranchLength) {
                    this.isGrowing = false;
                    this.finalizeBranch();
                    return;
                }

                // Create new branch segment
                const angle = Math.random() * Math.PI * 2;
                const length = this.growthProgress % 20;
                const newX = this.x + Math.cos(angle) * length;
                const newY = this.y + Math.sin(angle) * length;

                this.branches.push({
                    x: newX,
                    y: newY,
                    angle: angle,
                    length: length,
                    depth: this.currentDepth,
                    isTip: true
                });

                // Check for splits
                if (Math.random() < config.branchSplitChance && this.currentDepth < this.maxDepth) {
                    this.split();
                }

                this.currentDepth++;
            }

            split() {
                const newNeuron = new Neuron(this.x, this.y);
                newNeuron.currentDepth = this.currentDepth + 1;
                newNeuron.maxDepth = this.maxDepth;
                neurons.push(newNeuron);
            }

            finalizeBranch() {
                // Mark last segment as tip
                if (this.branches.length > 0) {
                    this.branches[this.branches.length - 1].isTip = true;
                }
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = config.branchColor;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.branchColor;

                if (this.branches.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    
                    for (let i = 0; i < this.branches.length; i++) {
                        const branch = this.branches[i];
                        ctx.lineTo(branch.x, branch.y);
                    }
                    
                    ctx.stroke();
                }

                // Draw tips with accent color
                ctx.strokeStyle = config.accentBranchColor;
                ctx.lineWidth = 3;
                ctx.shadowColor = config.accentBranchColor;
                
                for (let i = 0; i < this.branches.length; i++) {
                    const branch = this.branches[i];
                    if (branch.isTip) {
                        ctx.beginPath();
                        ctx.arc(branch.x, branch.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            getTips() {
                return this.branches.filter(b => b.isTip);
            }
        }

        // Synapse class
        class Synapse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.glow = 0;
                this.maxGlow = 1;
                this.pulseTimer = 0;
            }

            update() {
                this.pulseTimer += config.pulseFrequency;
                
                if (this.pulseTimer >= 1) {
                    this.pulseTimer = 0;
                    this.createPulse();
                }

                if (this.glow > 0) {
                    this.glow -= 0.02;
                }
            }

            createPulse() {
                pulses.push(new Pulse(this.neuron1, this.neuron2));
            }

            draw() {
                const x1 = this.neuron1.x;
                const y1 = this.neuron1.y;
                const x2 = this.neuron2.x;
                const y2 = this.neuron2.y;

                ctx.save();
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.shadowBlur = config.synapseGlowStrength + this.glow * 10;
                ctx.shadowColor = config.synapseColor;
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // Draw connection points
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(x1, y1, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Pulse class
        class Pulse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.progress = 0;
                this.speed = config.pulseSpeed / 100;
            }

            update() {
                this.progress += this.speed;
                return this.progress >= 1;
            }

            draw() {
                const x1 = this.neuron1.x;
                const y1 = this.neuron1.y;
                const x2 = this.neuron2.x;
                const y2 = this.neuron2.y;

                const x = x1 + (x2 - x1) * this.progress;
                const y = y1 + (y2 - y1) * this.progress;

                ctx.save();
                ctx.fillStyle = config.pulseColor;
                ctx.shadowBlur = 20 * config.pulseBrightness;
                ctx.shadowColor = config.pulseColor;
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();

                // Trail effect
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Initialize simulation
        function init() {
            neurons = [];
            synapses = [];
            pulses = [];

            // Create seed neurons near center
            const count = Math.floor(config.neuronCount) || 4;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const distance = 50 + Math.random() * 100;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                
                const neuron = new Neuron(x, y);
                neuron.maxDepth = config.maxBranchDepth;
                neurons.push(neuron);
            }
        }

        // Check for synapses
        function checkSynapses() {
            const tips = [];
            
            neurons.forEach(neuron => {
                const neuronTips = neuron.getTips();
                neuronTips.forEach(tip => {
                    tips.push({ neuron, tip });
                });
            });

            for (let i = 0; i < tips.length; i++) {
                for (let j = i + 1; j < tips.length; j++) {
                    const t1 = tips[i];
                    const t2 = tips[j];
                    
                    const dx = t1.tip.x - t2.tip.x;
                    const dy = t1.tip.y - t2.tip.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.synapseDistanceThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.neuron1 === t1.neuron && s.neuron2 === t2.neuron) ||
                            (s.neuron1 === t2.neuron && s.neuron2 === t1.neuron)
                        );

                        if (!exists) {
                            synapses.push(new Synapse(t1.neuron, t2.neuron));
                        }
                    }
                }
            }
        }

        // Animation loop
        function animate(timestamp) {
            if (!isPaused) {
                // Clear canvas
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, width, height);

                // Update and draw neurons
                neurons.forEach(neuron => {
                    neuron.grow();
                    neuron.draw();
                });

                // Check for new synapses
                checkSynapses();

                // Update and draw synapses
                synapses.forEach(synapse => {
                    synapse.update();
                    synapse.draw();
                });

                // Update and draw pulses
                pulses = pulses.filter(pulse => {
                    const completed = pulse.update();
                    pulse.draw();
                    return !completed;
                });

                // Draw background glow
                ctx.save();
                ctx.fillStyle = 'rgba(16, 26, 58, 0.3)';
                ctx.shadowBlur = 50;
                ctx.shadowColor = 'rgba(0, 229, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, 200, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            animationId = requestAnimationFrame(animate);
        }

        // GUI setup
        function setupGUI() {
            const gui = new dat.GUI();

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 3, 6).step(1).name('Neuron Count').onChange(init);
            growthFolder.add(config, 'branchGrowthSpeed', 1, 5).name('Growth Speed');
            growthFolder.add(config, 'maxBranchDepth', 3, 12).step(1).name('Max Depth').onChange(() => {
                neurons.forEach(n => n.maxDepth = config.maxBranchDepth);
            });
            growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
            growthFolder.add(config, 'branchCurvature', 0, 1).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 50, 200).name('Max Length');
            growthFolder.open();

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 20, 100).name('Distance Threshold');
            synapsesFolder.add(config, 'synapseGlowStrength', 5, 30).name('Glow Strength');
            synapsesFolder.open();

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulsesFolder.add(config, 'pulseFrequency', 0.001, 0.1).name('Pulse Frequency');
            pulsesFolder.add(config, 'pulseBrightness', 0.5, 3).name('Pulse Brightness');
            pulsesFolder.open();

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor').name('Background');
            visualsFolder.addColor(config, 'branchColor').name('Branch Color');
            visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
            visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
            visualsFolder.open();

            // Buttons
            gui.add({ regenerate: init }, 'regenerate').name('Regenerate Network');
            gui.add({ clear: () => {
                neurons = [];
                synapses = [];
                pulses = [];
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, width, height);
            } }, 'clear').name('Clear Canvas');
            gui.add({ togglePause: () => {
                isPaused = !isPaused;
            } }, 'togglePause').name('Pause/Resume');
        }

        // Start
        setupGUI();
        init();
        animate(0);
    </script>
</body>
</html>
