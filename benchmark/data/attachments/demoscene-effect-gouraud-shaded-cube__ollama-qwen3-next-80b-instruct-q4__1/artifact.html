<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gouraud-Shaded Rotating Cube</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background-color: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">FPS: 0<br>Press W for wireframe, P to pause</div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        
        // Set canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Cube definition
        // 8 vertices of a cube centered at origin
        const vertices = [
            [-1, -1, -1], // 0
            [1, -1, -1],  // 1
            [1, 1, -1],   // 2
            [-1, 1, -1],  // 3
            [-1, -1, 1],  // 4
            [1, -1, 1],   // 5
            [1, 1, 1],    // 6
            [-1, 1, 1]    // 7
        ];
        
        // Faces as triangles (each face split into 2 triangles)
        // Each triangle is defined by 3 vertex indices
        const triangles = [
            // Front face (z = -1)
            [0, 1, 2], [0, 2, 3],
            // Back face (z = 1)
            [4, 7, 6], [4, 6, 5],
            // Right face (x = 1)
            [1, 5, 6], [1, 6, 2],
            // Left face (x = -1)
            [0, 3, 7], [0, 7, 4],
            // Top face (y = 1)
            [3, 2, 6], [3, 6, 7],
            // Bottom face (y = -1)
            [0, 4, 5], [0, 5, 1]
        ];
        
        // Light source - moving in a circle
        let lightAngle = 0;
        const lightRadius = 5;
        const lightSpeed = 0.01;
        
        // Camera parameters
        const cameraDistance = 8;
        const fov = 500;
        
        // Rotation angles
        let rotationX = 0;
        let rotationY = 0;
        let rotationZ = 0;
        let isPaused = false;
        
        // Wireframe mode
        let wireframe = false;
        
        // FPS tracking
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        
        // Matrix operations
        function multiplyMatrix(m1, m2) {
            const result = [];
            for (let i = 0; i < 3; i++) {
                result[i] = [];
                for (let j = 0; j < 3; j++) {
                    result[i][j] = 0;
                    for (let k = 0; k < 3; k++) {
                        result[i][j] += m1[i][k] * m2[k][j];
                    }
                }
            }
            return result;
        }
        
        function rotateX(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [1, 0, 0],
                [0, cos, -sin],
                [0, sin, cos]
            ];
        }
        
        function rotateY(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [cos, 0, sin],
                [0, 1, 0],
                [-sin, 0, cos]
            ];
        }
        
        function rotateZ(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [cos, -sin, 0],
                [sin, cos, 0],
                [0, 0, 1]
            ];
        }
        
        function transformPoint(point, matrix) {
            return [
                matrix[0][0] * point[0] + matrix[0][1] * point[1] + matrix[0][2] * point[2],
                matrix[1][0] * point[0] + matrix[1][1] * point[1] + matrix[1][2] * point[2],
                matrix[2][0] * point[0] + matrix[2][1] * point[1] + matrix[2][2] * point[2]
            ];
        }
        
        // Perspective projection
        function projectPoint(point) {
            const z = point[2] + cameraDistance;
            if (z <= 0) return null; // Behind camera
            const scale = fov / z;
            return [
                point[0] * scale,
                point[1] * scale
            ];
        }
        
        // Lambert lighting - dot product between normal and light direction
        function calculateLightIntensity(normal, lightDir) {
            // Normalize normal vector
            const normalLength = Math.sqrt(normal[0] * normal[0] + normal[1] * normal[1] + normal[2] * normal[2]);
            if (normalLength === 0) return 0;
            const normNormal = [
                normal[0] / normalLength,
                normal[1] / normalLength,
                normal[2] / normalLength
            ];
            
            // Normalize light direction
            const lightLength = Math.sqrt(lightDir[0] * lightDir[0] + lightDir[1] * lightDir[1] + lightDir[2] * lightDir[2]);
            if (lightLength === 0) return 0;
            const normLight = [
                lightDir[0] / lightLength,
                lightDir[1] / lightLength,
                lightDir[2] / lightLength
            ];
            
            // Dot product (Lambert's cosine law)
            const dot = normNormal[0] * normLight[0] + normNormal[1] * normLight[1] + normNormal[2] * normLight[2];
            
            // Clamp to [0, 1] for diffuse lighting
            return Math.max(0, dot);
        }
        
        // Calculate face normal
        function calculateNormal(v1, v2, v3) {
            // Two edges of the triangle
            const edge1 = [
                v2[0] - v1[0],
                v2[1] - v1[1],
                v2[2] - v1[2]
            ];
            
            const edge2 = [
                v3[0] - v1[0],
                v3[1] - v1[1],
                v3[2] - v1[2]
            ];
            
            // Cross product
            const normal = [
                edge1[1] * edge2[2] - edge1[2] * edge2[1],
                edge1[2] * edge2[0] - edge1[0] * edge2[2],
                edge1[0] * edge2[1] - edge1[1] * edge2[0]
            ];
            
            return normal;
        }
        
        // Gouraud shading - interpolate colors across triangle
        function drawTriangle(p1, p2, p3, c1, c2, c3) {
            // If any point is null (behind camera), skip
            if (!p1 || !p2 || !p3) return;
            
            // Draw wireframe if enabled
            if (wireframe) {
                ctx.beginPath();
                ctx.moveTo(p1[0] + canvas.width / 2, p1[1] + canvas.height / 2);
                ctx.lineTo(p2[0] + canvas.width / 2, p2[1] + canvas.height / 2);
                ctx.lineTo(p3[0] + canvas.width / 2, p3[1] + canvas.height / 2);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
            }
            
            // For Gouraud shading, we need to fill the triangle with interpolated colors
            // We'll use a simple scanline approach
            
            // Sort vertices by y-coordinate
            let vertices = [
                {point: p1, color: c1},
                {point: p2, color: c2},
                {point: p3, color: c3}
            ];
            
            vertices.sort((a, b) => a.point[1] - b.point[1]);
            
            const v0 = vertices[0];
            const v1 = vertices[1];
            const v2 = vertices[2];
            
            // If all points have same y, skip (degenerate triangle)
            if (v0.point[1] === v2.point[1]) return;
            
            // Calculate slopes and interpolate
            const dx01 = v1.point[0] - v0.point[0];
            const dy01 = v1.point[1] - v0.point[1];
            const dx02 = v2.point[0] - v0.point[0];
            const dy02 = v2.point[1] - v0.point[1];
            const dx12 = v2.point[0] - v1.point[0];
            const dy12 = v2.point[1] - v1.point[1];
            
            let slope01 = dy01 !== 0 ? dx01 / dy01 : 0;
            let slope02 = dy02 !== 0 ? dx02 / dy02 : 0;
            let slope12 = dy12 !== 0 ? dx12 / dy12 : 0;
            
            // Interpolate colors
            let color0 = v0.color;
            let color1 = v1.color;
            let color2 = v2.color;
            
            let leftX = v0.point[0];
            let rightX = v0.point[0];
            let leftColor = [...color0];
            let rightColor = [...color0];
            
            // Top to middle
            if (dy01 !== 0) {
                for (let y = Math.floor(v0.point[1]); y <= Math.floor(v1.point[1]); y++) {
                    // Interpolate color along left edge
                    const tLeft = (y - v0.point[1]) / dy01;
                    leftColor[0] = color0[0] + tLeft * (color1[0] - color0[0]);
                    leftColor[1] = color0[1] + tLeft * (color1[1] - color0[1]);
                    leftColor[2] = color0[2] + tLeft * (color1[2] - color0[2]);
                    
                    // Interpolate color along right edge
                    const tRight = (y - v0.point[1]) / dy02;
                    rightColor[0] = color0[0] + tRight * (color2[0] - color0[0]);
                    rightColor[1] = color0[1] + tRight * (color2[1] - color0[1]);
                    rightColor[2] = color0[2] + tRight * (color2[2] - color0[2]);
                    
                    leftX = v0.point[0] + slope01 * (y - v0.point[1]);
                    rightX = v0.point[0] + slope02 * (y - v0.point[1]);
                    
                    // Draw scanline
                    if (leftX > rightX) {
                        [leftX, rightX] = [rightX, leftX];
                        [leftColor, rightColor] = [rightColor, leftColor];
                    }
                    
                    // Create gradient along scanline
                    const width = Math.ceil(rightX - leftX);
                    if (width > 0) {
                        for (let x = Math.floor(leftX); x <= Math.floor(rightX); x++) {
                            const t = (x - leftX) / width;
                            const r = leftColor[0] + t * (rightColor[0] - leftColor[0]);
                            const g = leftColor[1] + t * (rightColor[1] - leftColor[1]);
                            const b = leftColor[2] + t * (rightColor[2] - leftColor[2]);
                            
                            ctx.fillStyle = `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
                            ctx.fillRect(x + canvas.width / 2, y + canvas.height / 2, 1, 1);
                        }
                    }
                }
            }
            
            // Middle to bottom
            if (dy12 !== 0) {
                leftX = v1.point[0];
                rightX = v2.point[0];
                leftColor = [...color1];
                rightColor = [...color2];
                
                for (let y = Math.floor(v1.point[1]); y <= Math.floor(v2.point[1]); y++) {
                    // Interpolate color along left edge
                    const tLeft = (y - v1.point[1]) / dy12;
                    leftColor[0] = color1[0] + tLeft * (color2[0] - color1[0]);
                    leftColor[1] = color1[1] + tLeft * (color2[1] - color1[1]);
                    leftColor[2] = color1[2] + tLeft * (color2[2] - color1[2]);
                    
                    // Interpolate color along right edge
                    const tRight = (y - v0.point[1]) / dy02;
                    rightColor[0] = color0[0] + tRight * (color2[0] - color0[0]);
                    rightColor[1] = color0[1] + tRight * (color2[1] - color0[1]);
                    rightColor[2] = color0[2] + tRight * (color2[2] - color0[2]);
                    
                    leftX = v1.point[0] + slope12 * (y - v1.point[1]);
                    rightX = v0.point[0] + slope02 * (y - v0.point[1]);
                    
                    // Draw scanline
                    if (leftX > rightX) {
                        [leftX, rightX] = [rightX, leftX];
                        [leftColor, rightColor] = [rightColor, leftColor];
                    }
                    
                    // Create gradient along scanline
                    const width = Math.ceil(rightX - leftX);
                    if (width > 0) {
                        for (let x = Math.floor(leftX); x <= Math.floor(rightX); x++) {
                            const t = (x - leftX) / width;
                            const r = leftColor[0] + t * (rightColor[0] - leftColor[0]);
                            const g = leftColor[1] + t * (rightColor[1] - leftColor[1]);
                            const b = leftColor[2] + t * (rightColor[2] - leftColor[2]);
                            
                            ctx.fillStyle = `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
                            ctx.fillRect(x + canvas.width / 2, y + canvas.height / 2, 1, 1);
                        }
                    }
                }
            }
        }
        
        // Animation loop
        function animate(currentTime) {
            // FPS calculation
            frameCount++;
            if (currentTime - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                frameCount = 0;
                lastTime = currentTime;
                info.textContent = `FPS: ${fps}\nPress W for wireframe, P to pause`;
            }
            
            // Update light position
            lightAngle += lightSpeed;
            const lightX = lightRadius * Math.cos(lightAngle);
            const lightY = lightRadius * Math.sin(lightAngle);
            const lightZ = lightRadius * Math.sin(lightAngle * 0.5);
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!isPaused) {
                // Update rotations
                rotationX += 0.005;
                rotationY += 0.007;
                rotationZ += 0.003;
            }
            
            // Create rotation matrices
            const rotX = rotateX(rotationX);
            const rotY = rotateY(rotationY);
            const rotZ = rotateZ(rotationZ);
            
            // Combine rotations
            const rotXY = multiplyMatrix(rotX, rotY);
            const rotXYZ = multiplyMatrix(rotXY, rotZ);
            
            // Transform vertices
            const transformedVertices = vertices.map(vertex => transformPoint(vertex, rotXYZ));
            
            // Calculate light direction from origin to light source
            const lightDir = [lightX, lightY, lightZ];
            
            // Draw triangles
            for (const triangle of triangles) {
                const v1 = transformedVertices[triangle[0]];
                const v2 = transformedVertices[triangle[1]];
                const v3 = transformedVertices[triangle[2]];
                
                // Backface culling
                const normal = calculateNormal(v1, v2, v3);
                const viewVector = [0, 0, -1]; // Looking along negative z
                const dotProduct = normal[0] * viewVector[0] + normal[1] * viewVector[1] + normal[2] * viewVector[2];
                
                // Only render if facing the camera (positive dot product)
                if (dotProduct <= 0) continue;
                
                // Calculate lighting for each vertex
                const lightIntensity1 = calculateLightIntensity(normal, lightDir);
                
                // Calculate normals for each vertex (average of adjacent faces)
                // For simplicity, we'll use the face normal for each vertex
                // In a real implementation, we'd calculate vertex normals from adjacent faces
                const normal1 = normal;
                const normal2 = normal;
                const normal3 = normal;
                
                // Calculate lighting for each vertex
                const intensity1 = calculateLightIntensity(normal1, lightDir);
                const intensity2 = calculateLightIntensity(normal2, lightDir);
                const intensity3 = calculateLightIntensity(normal3, lightDir);
                
                // Convert to RGB (white light, so all components are the same)
                // Use a base color and modulate by intensity
                // We'll use a blueish color for the cube
                const c1 = [100 * intensity1, 150 * intensity1, 255 * intensity1];
                const c2 = [100 * intensity2, 150 * intensity2, 255 * intensity2];
                const c3 = [100 * intensity3, 150 * intensity3, 255 * intensity3];
                
                // Project vertices
                const p1 = projectPoint(v1);
                const p2 = projectPoint(v2);
                const p3 = projectPoint(v3);
                
                // Draw triangle with Gouraud shading
                drawTriangle(p1, p2, p3, c1, c2, c3);
            }
            
            // Request next frame
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        document.addEventListener('keydown', (event) => {
            if (event.key === 'w' || event.key === 'W') {
                wireframe = !wireframe;
            } else if (event.key === 'p' || event.key === 'P') {
                isPaused = !isPaused;
            }
        });
        
        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
