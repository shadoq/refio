<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #05070f;
            box-shadow: 0 0 60px #101a3a;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script>
        // Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 800;
        const HEIGHT = 800;
        
        // Color palette
        const colors = {
            background: '#05070f',
            backgroundGlow: '#101a3a',
            branch: '#00e5ff',
            accentBranch: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            ui: '#ffd400',
            scanline: 'rgba(0, 229, 255, 0.08)'
        };

        // State
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let growingNeurons = [];
        let isPaused = false;
        let generationComplete = false;
        let frameCount = 0;

        // GUI
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        const synapseFolder = gui.addFolder('Synapses');
        const pulseFolder = gui.addFolder('Pulses');
        const visualFolder = gui.addFolder('Visuals');

        growthFolder.add(neurons, 'count', 3, 6, 0.1).name('Neuron Count').listen();
        growthFolder.add({ speed: 1 }, 'speed', 0.1, 5, 0.01).name('Growth Speed').listen();
        growthFolder.add({ depth: 6 }, 'depth', 2, 10, 1).name('Max Depth').listen();
        growthFolder.add({ splitChance: 0.3 }, 'splitChance', 0, 0.8, 0.01).name('Split Chance').listen();
        growthFolder.add({ curvature: 0.3 }, 'curvature', 0, 1, 0.01).name('Curvature').listen();
        growthFolder.add({ maxLength: 120 }, 'maxLength', 30, 200, 1).name('Max Length').listen();

        synapseFolder.add({ threshold: 30 }, 'threshold', 5, 80, 1).name('Distance Threshold').listen();
        synapseFolder.add({ glowStrength: 20 }, 'glowStrength', 0, 60, 1).name('Glow Strength').listen();

        pulseFolder.add({ speed: 2 }, 'speed', 0.5, 6, 0.1).name('Speed').listen();
        pulseFolder.add({ frequency: 0.002 }, 'frequency', 0.0005, 0.02, 0.0001).name('Frequency').listen();
        pulseFolder.add({ brightness: 20 }, 'brightness', 0, 60, 1).name('Brightness').listen();

        visualFolder.add({ bg: colors.background }, 'bg', colors.background, '#0a0c15').name('Background').listen();
        visualFolder.add({ branch: colors.branch }, 'branch', colors.branch, '#00e5ff').name('Branch Color').listen();
        visualFolder.add({ accent: colors.accentBranch }, 'accent', colors.accentBranch, '#d6ff00').name('Accent').listen();
        visualFolder.add({ syn: colors.synapse }, 'syn', colors.synapse, '#ff2bd6').name('Synapse Color').listen();
        visualFolder.add({ pulse: colors.pulse }, 'pulse', colors.pulse, '#fff36a').name('Pulse Color').listen();

        visualFolder.add({ regenerate: true }, 'regenerate').name('Regenerate').onChange(() => {
            if (it.regenerate) reset();
        });
        visualFolder.add({ clear: true }, 'clear').name('Clear Canvas').onChange(() => {
            if (it.clear) reset();
        });
        visualFolder.add({ pause: true }, 'pause').name('Pause/Resume').onChange(() => {
            if (it.pause) togglePause();
        });

        // Growth controls
        const growthControls = {
            speed: 1,
            depth: 6,
            splitChance: 0.3,
            curvature: 0.3,
            maxLength: 120
        };

        // Synapse controls
        const synapseControls = {
            threshold: 30,
            glowStrength: 20
        };

        // Pulse controls
        const pulseControls = {
            speed: 2,
            frequency: 0.002,
            brightness: 20
        };

        // Visual controls
        const visualControls = {
            bg: colors.background,
            branch: colors.branch,
            accent: colors.accentBranch,
            syn: colors.synapse,
            pulse: colors.pulse,
            regenerate: false,
            clear: false,
            pause: false
        };

        // Update GUI references
        growthFolder.add(growthControls, 'speed', 0.1, 5, 0.01).name('Growth Speed').listen();
        growthFolder.add(growthControls, 'depth', 2, 10, 1).name('Max Depth').listen();
        growthFolder.add(growthControls, 'splitChance', 0, 0.8, 0.01).name('Split Chance').listen();
        growthFolder.add(growthControls, 'curvature', 0, 1, 0.01).name('Curvature').listen();
        growthFolder.add(growthControls, 'maxLength', 30, 200, 1).name('Max Length').listen();

        synapseFolder.add(synapseControls, 'threshold', 5, 80, 1).name('Distance Threshold').listen();
        synapseFolder.add(synapseControls, 'glowStrength', 0, 60, 1).name('Glow Strength').listen();

        pulseFolder.add(pulseControls, 'speed', 0.5, 6, 0.1).name('Speed').listen();
        pulseFolder.add(pulseControls, 'frequency', 0.0005, 0.02, 0.0001).name('Frequency').listen();
        pulseFolder.add(pulseControls, 'brightness', 0, 60, 1).name('Brightness').listen();

        visualFolder.add(visualControls, 'bg', colors.background, '#0a0c15').name('Background').listen();
        visualFolder.add(visualControls, 'branch', colors.branch, '#00e5ff').name('Branch Color').listen();
        visualFolder.add(visualControls, 'accent', colors.accentBranch, '#d6ff00').name('Accent').listen();
        visualFolder.add(visualControls, 'syn', colors.synapse, '#ff2bd6').name('Synapse Color').listen();
        visualFolder.add(visualControls, 'pulse', colors.pulse, '#fff36a').name('Pulse Color').listen();
        visualFolder.add(visualControls, 'regenerate').name('Regenerate Network');
        visualFolder.add(visualControls, 'clear').name('Clear Canvas');
        visualFolder.add(visualControls, 'pause').name('Pause/Resume');

        // Helper functions
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomAngle() {
            return Math.random() * Math.PI * 2;
        }

        function distance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function reset() {
            neurons = [];
            synapses = [];
            pulses = [];
            growingNeurons = [];
            generationComplete = false;
            frameCount = 0;
            
            // Generate seed neurons
            const count = Math.floor(random(visualControls.count || 3, visualControls.count || 6));
            for (let i = 0; i < count; i++) {
                neurons.push({
                    x: WIDTH / 2 + random(-100, 100),
                    y: HEIGHT / 2 + random(-100, 100),
                    branches: [],
                    synapses: [],
                    maxDepth: 0
                });
            }
            
            // Start growth
            neurons.forEach(neuron => {
                growingNeurons.push({
                    neuron: neuron,
                    x: neuron.x,
                    y: neuron.y,
                    angle: randomAngle(),
                    length: 0,
                    depth: 0,
                    completed: false
                });
            });
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        // Animation
        function animate() {
            if (!isPaused) {
                ctx.fillStyle = visualControls.bg;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                // Draw background glow
                ctx.fillStyle = colors.backgroundGlow;
                ctx.globalAlpha = 0.1;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.globalAlpha = 1;

                // Draw scanlines
                ctx.strokeStyle = colors.scanline;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.3;
                for (let y = 0; y < HEIGHT; y += 4) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(WIDTH, y);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;

                // Draw synapses
                drawSynapses();

                // Draw branches
                drawBranches();

                // Draw pulses
                updateAndDrawPulses();

                // Grow branches
                if (!generationComplete) {
                    updateBranches();
                }

                frameCount++;
            }
            requestAnimationFrame(animate);
        }

        function drawSynapses() {
            synapses.forEach(synapse => {
                const glow = synapse.glow + Math.sin(frameCount * 0.05 + synapse.id) * 5;
                ctx.shadowBlur = synapse.glowStrength + glow;
                ctx.shadowColor = visualControls.syn;
                ctx.strokeStyle = visualControls.syn;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(synapse.x1, synapse.y1);
                ctx.lineTo(synapse.x2, synapse.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Synapse glow point
                ctx.shadowBlur = synapse.glowStrength + glow * 2;
                ctx.shadowColor = visualControls.syn;
                ctx.fillStyle = visualControls.syn;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(synapse.x, synapse.y, 3 + glow * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            });
        }

        function drawBranches() {
            neurons.forEach(neuron => {
                neuron.branches.forEach(branch => {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = visualControls.branch;
                    ctx.strokeStyle = visualControls.branch;
                    ctx.lineWidth = branch.thickness;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(branch.x1, branch.y1);
                    ctx.lineTo(branch.x2, branch.y2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                });
            });
        }

        function updateAndDrawPulses() {
            pulses = pulses.filter(pulse => {
                pulse.progress += pulse.speed * pulseControls.frequency;
                pulse.x = pulse.startX + (pulse.endX - pulse.startX) * pulse.progress;
                pulse.y = pulse.startY + (pulse.endY - pulse.startY) * pulse.progress;

                if (pulse.progress >= 1) {
                    return false;
                }

                ctx.shadowBlur = visualControls.brightness + 10;
                ctx.shadowColor = visualControls.pulse;
                ctx.fillStyle = visualControls.pulse;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(pulse.x, pulse.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                return true;
            });

            // Randomly spawn new pulses
            if (frameCount % Math.floor(1 / pulseControls.frequency) === 0 && pulses.length < 5) {
                if (synapses.length > 0) {
                    const randomSynapse = synapses[Math.floor(random(0, synapses.length))];
                    pulses.push({
                        startX: randomSynapse.x1,
                        startY: randomSynapse.y1,
                        endX: randomSynapse.x2,
                        endY: randomSynapse.y2,
                        progress: 0,
                        speed: random(0.8, 1.2)
                    });
                }
            }
        }

        function updateBranches() {
            growingNeurons = growingNeurons.filter(grow => {
                grow.length += growthControls.speed;
                grow.x = grow.x + Math.cos(grow.angle) * grow.length;
                grow.y = grow.y + Math.sin(grow.angle) * grow.length;

                // Add curvature
                grow.angle += random(-growthControls.curvature, growthControls.curvature);

                if (grow.length >= growthControls.maxLength) {
                    grow.completed = true;
                    return false;
                }

                // Check for synapse connections
                checkSynapses(grow);

                // Try to create a new branch
                if (Math.random() < growthControls.splitChance && grow.depth < growthControls.depth - 1) {
                    grow.branches.push({
                        x1: grow.x,
                        y1: grow.y,
                        x2: grow.x + Math.cos(grow.angle) * 5,
                        y2: grow.y + Math.sin(grow.angle) * 5,
                        thickness: random(0.5, 2)
                    });
                }

                return true;
            });

            growingNeurons.forEach(grow => {
                if (!grow.completed) {
                    grow.branches.push({
                        x1: grow.x,
                        y1: grow.y,
                        x2: grow.x + Math.cos(grow.angle) * 5,
                        y2: grow.y + Math.sin(grow.angle) * 5,
                        thickness: random(0.5, 2)
                    });
                }
            });
        }

        function checkSynapses(grow) {
            neurons.forEach(neuron => {
                if (neuron !== grow.neuron) {
                    neuron.branches.forEach(branch => {
                        const d = distance(grow.x, grow.y, branch.x2, branch.y2);
                        if (d < synapseControls.threshold) {
                            const existing = synapses.find(s => 
                                (Math.abs(s.x1 - grow.x) < 5 && Math.abs(s.y1 - grow.y) < 5) ||
                                (Math.abs(s.x2 - grow.x) < 5 && Math.abs(s.y2 - grow.y) < 5)
                            );
                            if (!existing) {
                                synapses.push({
                                    x1: grow.x,
                                    y1: grow.y,
                                    x2: branch.x2,
                                    y2: branch.y2,
                                    glow: 0,
                                    id: Math.random()
                                });
                            }
                        }
                    });
                }
            });
        }

        // Initialize
        reset();
        animate();
    </script>
</body>
</html>
