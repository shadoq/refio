<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP-8 Emulator</title>
<style>
  body {
    font-family: monospace;
    background: #1a1a2e;
    color: #eee;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  h1 { margin: 0; color: #00ff88; }
  .container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .left {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
  }
  canvas {
    border: 2px solid #00ff88;
    image-rendering: pixelated;
    background: #000;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 5px;
  }
  .key {
    width: 60px;
    height: 60px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: all 0.1s;
  }
  .key:hover { background: #1a1a5e; }
  .key.active {
    background: #00ff88;
    color: #000;
    border-color: #00ff88;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 8px 16px;
    background: #0f3460;
    color: #eee;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: monospace;
    font-size: 14px;
  }
  button:hover { background: #1a5276; }
  button:active { transform: scale(0.95); }
  button.active-btn { background: #00ff88; color: #000; }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .right {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 320px;
  }
  .panel {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 15px;
  }
  .panel h3 {
    margin: 0 0 10px 0;
    color: #00ff88;
    border-bottom: 1px solid #0f3460;
    padding-bottom: 5px;
  }
  .reg-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 3px 0;
  }
  .reg {
    background: #0a0a1a;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    min-width: 45px;
    text-align: center;
  }
  .reg-label { color: #888; font-size: 10px; }
  .reg-value { color: #00ff88; font-weight: bold; }
  .stack-display {
    font-size: 12px;
    word-break: break-all;
    background: #0a0a1a;
    padding: 8px;
    border-radius: 4px;
    max-height: 100px;
    overflow-y: auto;
  }
  .instruction {
    font-size: 13px;
    background: #0a0a1a;
    padding: 8px;
    border-radius: 4px;
    font-family: monospace;
  }
  .file-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  input[type="file"] {
    display: none;
  }
  .status {
    font-size: 12px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>
<h1>CHIP-8 Emulator</h1>
<div class="container">
  <div class="left">
    <canvas id="display" width="512" height="256"></canvas>
    <div class="keypad" id="keypad"></div>
    <div class="controls">
      <button id="runBtn" class="active-btn">Run</button>
      <button id="pauseBtn">Pause</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="speed-control">
      <label>Speed:</label>
      <input type="range" id="speedSlider" min="1" max="120" value="10">
      <span id="speedLabel">10</span>
    </div>
    <div class="file-controls">
      <button id="loadFileBtn">Load ROM</button>
      <input type="file" id="fileInput" accept=".ch8,.rom">
    </div>
    <div class="status" id="status">Ready</div>
  </div>
  <div class="right">
    <div class="panel">
      <h3>Registers</h3>
      <div class="reg-row" id="registers"></div>
    </div>
    <div class="panel">
      <h3>Index Register (I)</h3>
      <div class="reg"><span class="reg-label">I = </span><span class="reg-value" id="iReg">0x000</span></div>
    </div>
    <div class="panel">
      <h3>Program Counter (PC)</h3>
      <div class="reg"><span class="reg-label">PC = </span><span class="reg-value" id="pcReg">0x200</span></div>
    </div>
    <div class="panel">
      <h3>Stack</h3>
      <div class="stack-display" id="stackDisplay">Empty</div>
    </div>
    <div class="panel">
      <h3>Current Instruction</h3>
      <div class="instruction" id="instructionDisplay">-</div>
    </div>
  </div>
</div>

<script>
// CHIP-8 Emulator
const FONTSET = [
  0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
  0x20, 0x60, 0x20, 0x20, 0x70, // 1
  0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
  0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
  0x90, 0x90, 0xF0, 0x10, 0x10, // 4
  0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
  0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
  0xF0, 0x10, 0x20, 0x40, 0x40, // 7
  0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
  0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
  0xF0, 0x90, 0xF0, 0x90, 0x90, // A
  0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
  0xF0, 0x80, 0x80, 0x80, 0xF0, // C
  0xE0, 0x90, 0x90, 0x90, 0xE0, // D
  0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
  0xF0, 0x80, 0xF0, 0x80, 0x80  // F
];

const DISPLAY_WIDTH = 64;
const DISPLAY_HEIGHT = 32;
const MEMORY_SIZE = 4096;
const FONTSET_ADDRESS = 0x050;
const PROGRAM_ADDRESS = 0x200;

const KEY_MAPPING = {
  '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
  'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
  'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
  'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
};

class Chip8 {
  constructor() {
    this.memory = new Uint8Array(MEMORY_SIZE);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.pc = PROGRAM_ADDRESS;
    this.stack = [];
    this.sp = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
    this.key = new Uint8Array(16);
    this.drawFlag = false;
    this.running = false;
    
    this.loadFontset();
  }
  
  loadFontset() {
    for (let i = 0; i < FONTSET.length; i++) {
      this.memory[FONTSET_ADDRESS + i] = FONTSET[i];
    }
  }
  
  loadROM(rom) {
    for (let i = 0; i < rom.length; i++) {
      this.memory[PROGRAM_ADDRESS + i] = rom[i];
    }
    this.pc = PROGRAM_ADDRESS;
    this.stack = [];
    this.sp = 0;
    this.V = new Uint8Array(16);
    this.I = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
    this.drawFlag = false;
  }
  
  fetch() {
    return (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
  }
  
  execute(opcode) {
    const X = (opcode & 0x0F00) >> 8;
    const Y = (opcode & 0x00F0) >> 4;
    const N = opcode & 0x000F;
    const NN = opcode & 0x00FF;
    const NNN = opcode & 0x0FFF;
    
    // Decode and display current instruction
    this.decodedInstruction = this.decodeInstruction(opcode);
    
    switch (opcode & 0xF000) {
      case 0x0000:
        switch (NNN) {
          case 0x00E0: // 00E0 - Clear display
            this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
            this.drawFlag = true;
            break;
          case 0x00EE: // 00EE - Return from subroutine
            this.sp--;
            this.pc = this.stack[this.sp];
            break;
          default:
            console.log('Unknown opcode: ' + opcode.toString(16));
        }
        break;
        
      case 0x1000: // 1NNN - Jump to address NNN
        this.pc = NNN;
        break;
        
      case 0x2000: // 2NNN - Call subroutine at NNN
        this.stack[this.sp] = this.pc;
        this.sp++;
        this.pc = NNN;
        break;
        
      case 0x3000: // 3XNN - Skip if VX == NN
        if (this.V[X] === NN) {
          this.pc += 4;
        } else {
          this.pc += 2;
        }
        return;
        
      case 0x4000: // 4XNN - Skip if VX != NN
        if (this.V[X] !== NN) {
          this.pc += 4;
        } else {
          this.pc += 2;
        }
        return;
        
      case 0x5000: // 5XY0 - Skip if VX == VY
        if (this.V[X] === this.V[Y]) {
          this.pc += 4;
        } else {
          this.pc += 2;
        }
        return;
        
      case 0x6000: // 6XNN - Set VX = NN
        this.V[X] = NN;
        this.pc += 2;
        break;
        
      case 0x7000: // 7XNN - Add NN to VX
        this.V[X] = (this.V[X] + NN) & 0xFF;
        this.pc += 2;
        break;
        
      case 0x8000:
        switch (N) {
          case 0x0: // 8XY0 - Set VX = VY
            this.V[X] = this.V[Y];
            break;
          case 0x1: // 8XY1 - Set VX = VX | VY
            this.V[X] = this.V[X] | this.V[Y];
            break;
          case 0x2: // 8XY2 - Set VX = VX & VY
            this.V[X] = this.V[X] & this.V[Y];
            break;
          case 0x3: // 8XY3 - Set VX = VX ^ VY
            this.V[X] = this.V[X] ^ this.V[Y];
            break;
          case 0x4: // 8XY4 - Add VY to VX, set VF = carry
            const sum = this.V[X] + this.V[Y];
            this.V[0xF] = sum > 0xFF ? 1 : 0;
            this.V[X] = sum & 0xFF;
            break;
          case 0x5: // 8XY5 - Subtract VY from VX, set VF = NOT borrow
            this.V[0xF] = this.V[X] > this.V[Y] ? 1 : 0;
            this.V[X] = (this.V[X] - this.V[Y]) & 0xFF;
            break;
          case 0x6: // 8XY6 - Shift right VX, set VF = LSB
            this.V[0xF] = this.V[X] & 0x1;
            this.V[X] = this.V[X] >> 1;
            break;
          case 0x7: // 8XY7 - Subtract VX from VY, set VF = NOT borrow
            this.V[0xF] = this.V[Y] > this.V[X] ? 1 : 0;
            this.V[X] = (this.V[Y] - this.V[X]) & 0xFF;
            break;
          case 0x8: // 8XYE - Shift left VX, set VF = MSB
            this.V[0xF] = (this.V[X] & 0x80) >> 7;
            this.V[X] = (this.V[X] << 1) & 0xFF;
            break;
          default:
            console.log('Unknown opcode: ' + opcode.toString(16));
        }
        this.pc += 2;
        break;
        
      case 0x9000: // 9XY0 - Skip if VX != VY
        if (this.V[X] !== this.V[Y]) {
          this.pc += 4;
        } else {
          this.pc += 2;
        }
        return;
        
      case 0xA000: // ANNN - Set I = NNN
        this.I = NNN;
        this.pc += 2;
        break;
        
      case 0xB000: // BNNN - Jump to V0 + NNN
        this.pc = (this.V[0] + NNN) & 0xFFFF;
        break;
        
      case 0xC000: // CXNN - Set VX = random byte & NN
        this.V[X] = Math.floor(Math.random() * 256) & NN;
        this.pc += 2;
        break;
        
      case 0xD000: // DXYN - Draw sprite at I to (VX, VY)
        const x = this.V[X];
        const y = this.V[Y];
        const height = N;
        this.V[0xF] = 0;
        
        for (let row = 0; row < height; row++) {
          const spriteByte = this.memory[this.I + row];
          for (let col = 0; col < 8; col++) {
            if ((spriteByte & (0x80 >> col)) !== 0) {
              const pixelX = (x + col) % DISPLAY_WIDTH;
              const pixelY = (y + row) % DISPLAY_HEIGHT;
              const idx = pixelY * DISPLAY_WIDTH + pixelX;
              
              if (this.display[idx] === 1) {
                this.V[0xF] = 1;
              }
              this.display[idx] ^= 1;
            }
          }
        }
        this.drawFlag = true;
        this.pc += 2;
        break;
        
      case 0xE000:
        switch (NN) {
          case 0x9E: // EX9E - Skip if key VX is pressed
            if (this.key[this.V[X]] !== 0) {
              this.pc += 4;
            } else {
              this.pc += 2;
            }
            return;
          case 0xA1: // EXA1 - Skip if key VX is not pressed
            if (this.key[this.V[X]] === 0) {
              this.pc += 4;
            } else {
              this.pc += 2;
            }
            return;
          default:
            console.log('Unknown opcode: ' + opcode.toString(16));
        }
        break;
        
      case 0xF000:
        switch (NN) {
          case 0x07: // FX07 - Set VX = delay timer
            this.V[X] = this.delayTimer;
            break;
          case 0x0A: // FX0A - Wait for key press
            this.waitingForKey = true;
            this.waitingForKeyRegister = X;
            return;
          case 0x15: // FX15 - Set delay timer = VX
            this.delayTimer = this.V[X];
            break;
          case 0x18: // FX18 - Set sound timer = VX
            this.soundTimer = this.V[X];
            break;
          case 0x1E: // FX1E - Add VX to I
            this.I = (this.I + this.V[X]) & 0xFFFF;
            break;
          case 0x29: // FX29 - Set I = font address of VX
            this.I = FONTSET_ADDRESS + (this.V[X] * 5);
            break;
          case 0x33: // FX33 - BCD of VX at I
            const val = this.V[X];
            this.memory[this.I] = Math.floor(val / 100);
            this.memory[this.I + 1] = Math.floor((val % 100) / 10);
            this.memory[this.I + 2] = val % 10;
            break;
          case 0x55: // FX55 - Store V0-VX at I
            for (let i = 0; i <= X; i++) {
              this.memory[this.I + i] = this.V[i];
            }
            break;
          case 0x65: // FX65 - Load V0-VX from I
            for (let i = 0; i <= X; i++) {
              this.V[i] = this.memory[this.I + i];
            }
            break;
          default:
            console.log('Unknown opcode: ' + opcode.toString(16));
        }
        this.pc += 2;
        break;
        
      default:
        console.log('Unknown opcode: ' + opcode.toString(16));
    }
  }
  
  decodeInstruction(opcode) {
    const X = (opcode & 0x0F00) >> 8;
    const Y = (opcode & 0x00F0) >> 4;
    const N = opcode & 0x000F;
    const NN = opcode & 0x00FF;
    const NNN = opcode & 0x0FFF;
    
    const op = opcode & 0xF000;
    
    switch (op) {
      case 0x0000:
        if (NNN === 0x00E0) return '00E0 - CLS';
        if (NNN === 0x00EE) return '00EE - RET';
        return '0NNN - CALL BCD';
      case 0x1000: return `1NNN - JP ${NNN.toString(16).toUpperCase()}`;
      case 0x2000: return `2NNN - CALL ${NNN.toString(16).toUpperCase()}`;
      case 0x3000: return `3XNN - SE V${X.toString(16).toUpperCase()}, ${NN.toString(16).toUpperCase()}`;
      case 0x4000: return `4XNN - SNE V${X.toString(16).toUpperCase()}, ${NN.toString(16).toUpperCase()}`;
      case 0x5000: return `5XY0 - SE V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
      case 0x6000: return `6XNN - LD V${X.toString(16).toUpperCase()}, ${NN.toString(16).toUpperCase()}`;
      case 0x7000: return `7XNN - ADD V${X.toString(16).toUpperCase()}, ${NN.toString(16).toUpperCase()}`;
      case 0x8000:
        switch (N) {
          case 0x0: return `8XY0 - LD V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x1: return `8XY1 - OR V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x2: return `8XY2 - AND V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x3: return `8XY3 - XOR V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x4: return `8XY4 - ADD V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x5: return `8XY5 - SUB V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x6: return `8XY6 - SHR V${X.toString(16).toUpperCase()}`;
          case 0x7: return `8XY7 - SUBN V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
          case 0x8: return `8XYE - SHL V${X.toString(16).toUpperCase()}`;
          default: return opcode.toString(16).toUpperCase();
        }
      case 0x9000: return `9XY0 - SNE V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}`;
      case 0xA000: return `ANNN - LD I, ${NNN.toString(16).toUpperCase()}`;
      case 0xB000: return `BNNN - JP V0, ${NNN.toString(16).toUpperCase()}`;
      case 0xC000: return `CXNN - RND V${X.toString(16).toUpperCase()}, ${NN.toString(16).toUpperCase()}`;
      case 0xD000: return `DXYN - DRW V${X.toString(16).toUpperCase()}, V${Y.toString(16).toUpperCase()}, ${N}`;
      case 0xE000:
        if (NN === 0x9E) return `EX9E - SKP V${X.toString(16).toUpperCase()}`;
        if (NN === 0xA1) return `EXA1 - SKNP V${X.toString(16).toUpperCase()}`;
        return opcode.toString(16).toUpperCase();
      case 0xF000:
        switch (NN) {
          case 0x07: return `FX07 - LD V${X.toString(16).toUpperCase()}, DT`;
          case 0x0A: return `FX0A - LD V${X.toString(16).toUpperCase()}, K`;
          case 0x15: return `FX15 - LD DT, V${X.toString(16).toUpperCase()}`;
          case 0x18: return `FX18 - LD ST, V${X.toString(16).toUpperCase()}`;
          case 0x1E: return `FX1E - ADD I, V${X.toString(16).toUpperCase()}`;
          case 0x29: return `FX29 - LD F, V${X.toString(16).toUpperCase()}`;
          case 0x33: return `FX33 - BCD V${X.toString(16).toUpperCase()}`;
          case 0x55: return `FX55 - LD [I], V${X.toString(16).toUpperCase()}`;
          case 0x65: return `FX65 - LD V${X.toString(16).toUpperCase()}, [I]`;
          default: return opcode.toString(16).toUpperCase();
        }
      default:
        return opcode.toString(16).toUpperCase();
    }
  }
  
  step() {
    if (this.running) {
      const cycles = parseInt(document.getElementById('speedSlider').value);
      for (let i = 0; i < cycles; i++) {
        this.executeCycle();
        if (this.waitingForKey) {
          break;
        }
      }
    }
  }
  
  executeCycle() {
    const opcode = this.fetch();
    this.execute(opcode);
    
    // Update timers
    if (this.delayTimer > 0) {
      this.delayTimer--;
    }
    if (this.soundTimer > 0) {
      this.soundTimer--;
      if (this.soundTimer === 0) {
        // Play sound effect (beep)
      }
    }
  }
  
  updateDisplay() {
    const canvas = document.getElementById('display');
    const ctx = canvas.getContext('2d');
    const scale = canvas.width / DISPLAY_WIDTH;
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00ff88';
    for (let y = 0; y < DISPLAY_HEIGHT; y++) {
      for (let x = 0; x < DISPLAY_WIDTH; x++) {
        if (this.display[y * DISPLAY_WIDTH + x] === 1) {
          ctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }
  }
  
  updateDebugger() {
    // Update registers
    const regContainer = document.getElementById('registers');
    regContainer.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const regDiv = document.createElement('div');
      regDiv.className = 'reg';
      regDiv.innerHTML = `<span class="reg-label">V${i.toString(16).toUpperCase()}</span> <span class="reg-value">${this.V[i].toString(16).toUpperCase().padStart(2, '0')}</span>`;
      regContainer.appendChild(regDiv);
    }
    
    // Update I register
    document.getElementById('iReg').textContent = '0x' + this.I.toString(16).toUpperCase().padStart(3, '0');
    
    // Update PC
    document.getElementById('pcReg').textContent = '0x' + this.pc.toString(16).toUpperCase().padStart(3, '0');
    
    // Update stack
    const stackDisplay = document.getElementById('stackDisplay');
    if (this.stack.length === 0) {
      stackDisplay.textContent = 'Empty';
    } else {
      stackDisplay.textContent = this.stack.map(addr => '0x' + addr.toString(16).toUpperCase().padStart(3, '0')).join(', ');
    }
    
    // Update instruction
    document.getElementById('instructionDisplay').textContent = this.decodedInstruction || '-';
  }
  
  reset() {
    this.memory = new Uint8Array(MEMORY_SIZE);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.pc = PROGRAM_ADDRESS;
    this.stack = [];
    this.sp = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
    this.key = new Uint8Array(16);
    this.drawFlag = false;
    this.running = false;
    this.waitingForKey = false;
    this.loadFontset();
    this.updateDisplay();
    this.updateDebugger();
    document.getElementById('runBtn').classList.add('active-btn');
    document.getElementById('pauseBtn').classList.remove('active-btn');
    document.getElementById('status').textContent = 'Reset';
  }
}

// Create emulator instance
const emulator = new Chip8();

// Demo ROM - Draws a sprite and moves it based on key presses
// The sprite is drawn at position (V1, V2), waits for a key press,
// then moves the sprite based on which key was pressed.
const DEMO_ROM = [
  // Initialize
  0x60, 0x00,       // LD V0, 0      - sprite index (0 = digit 0)
  0x61, 0x20,       // LD V1, 32     - start X position  
  0x62, 0x10,       // LD V2, 16     - start Y position
  0x63, 0x01,       // LD V3, 1      - direction X
  0x64, 0x01,       // LD V4, 1      - direction Y
  0xA0, 0x00,       // LD I, 0x000   - point to sprite data (will be set by FX29)
  
  // Main loop
  0xF0, 0x29,       // LD F, V0      - Set I to font address of V0
  0xD0, 0x15,       // DRW V0, V1, 5  - draw sprite at (V1, V2)
  0xF0, 0x0A,       // LD V0, K       - wait for key press (stores in V0)
  
  // Key was pressed, now move based on which key
  // Check if key 1 (V1=0x1) was pressed - move right
  0x50, 0x15,       // SE V0, V1     - skip if V0 == V1 (key 1)
  0x63, 0x01,       // LD V3, 1      - direction X = 1 (right)
  0x10, 0x012,      // JP 0x012      - skip next check
  
  // Check if key 2 (V1=0x2) was pressed - move left
  0x50, 0x25,       // SE V0, V2     - skip if V0 == V2 (key 2)
  0x63, 0x00,       // LD V3, 0      - direction X = 0 (left, will be set to -1)
  0x63, 0xFF,       // LD V3, 0xFF   - actually set to 255 which is -1 mod 256
  0x10, 0x012,      // JP 0x012      - skip next check
  
  // Check if key 3 (V1=0x3) was pressed - move down
  0x50, 0x35,       // SE V0, V3     - skip if V0 == V3 (key 3)
  0x64, 0x01,       // LD V4, 1      - direction Y = 1 (down)
  0x10, 0x012,      // JP 0x012      - skip next check
  
  // Check if key 4 (V1=0xC) was pressed - move up
  0x50, 0xC5,       // SE V0, V4     - skip if V0 == V4 (key 4)
  0x64, 0x00,       // LD V4, 0      - direction Y = 0 (up, will be set to -1)
  0x64, 0xFF,       // LD V4, 0xFF   - actually set to 255 which is -1 mod 256
  
  // Move the sprite
  0x81, 0x15,       // ADD V1, V3     - move X by direction
  0x82, 0x15,       // ADD V2, V4     - move Y by direction
  
  // Check X bounds and reverse if needed
  0x60, 0x3F,       // LD V0, 63     - right bound
  0x50, 0x15,       // SE V0, V1     - skip if V0 == V1 (at right edge)
  0x63, 0x00,       // LD V3, 0      - direction X = 0
  0x63, 0xFF,       // LD V3, 0xFF   - direction X = -1 (reverse)
  0x10, 0x022,      // JP 0x022      - skip next check
  
  0x60, 0x00,       // LD V0, 0      - left bound
  0x50, 0x15,       // SE V0, V1     - skip if V0 == V1 (at left edge)
  0x63, 0x01,       // LD V3, 1      - direction X = 1 (reverse)
  0x10, 0x022,      // JP 0x022      - skip next check
  
  // Check Y bounds and reverse if needed
  0x60, 0x1F,       // LD V0, 31     - bottom bound
  0x50, 0x25,       // SE V0, V2     - skip if V0 == V2 (at bottom edge)
  0x64, 0x00,       // LD V4, 0      - direction Y = 0
  0x64, 0xFF,       // LD V4, 0xFF   - direction Y = -1 (reverse)
  0x10, 0x022,      // JP 0x022      - skip next check
  
  0x60, 0x00,       // LD V0, 0      - top bound
  0x50, 0x25,       // SE V0, V2     - skip if V0 == V2 (at top edge)
  0x64, 0x01,       // LD V4, 1      - direction Y = 1 (reverse)
  
  // Loop back to draw
  0x10, 0x009,      // JP 0x009      - jump back to main loop
  
  // Sprite data - a simple ball shape (5 bytes)
  0x00, 0x00, 0x00, 0x00, 0x00
];

// Load the demo ROM
emulator.loadROM(DEMO_ROM);

// Create keypad
const keypad = document.getElementById('keypad');
const keyLabels = ['1', '2', '3', 'C', '4', '5', '6', 'D', '7', '8', '9', 'E', 'A', '0', 'B', 'F'];
const keyRows = [
  ['1', '2', '3', 'C'],
  ['4', '5', '6', 'D'],
  ['7', '8', '9', 'E'],
  ['A', '0', 'B', 'F']
];

keyRows.forEach(row => {
  const rowDiv = document.createElement('div');
  rowDiv.style.display = 'flex';
  rowDiv.style.gap = '5px';
  row.forEach(key => {
    const keyDiv = document.createElement('div');
    keyDiv.className = 'key';
    keyDiv.textContent = key;
    keyDiv.dataset.key = key;
    
    keyDiv.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const chipKey = KEY_MAPPING[key.toLowerCase()];
      emulator.key[chipKey] = 1;
      keyDiv.classList.add('active');
    });
    
    keyDiv.addEventListener('mouseup', () => {
      const chipKey = KEY_MAPPING[key.toLowerCase()];
      emulator.key[chipKey] = 0;
      keyDiv.classList.remove('active');
    });
    
    keyDiv.addEventListener('mouseleave', () => {
      const chipKey = KEY_MAPPING[key.toLowerCase()];
      emulator.key[chipKey] = 0;
      keyDiv.classList.remove('active');
    });
    
    keypad.appendChild(keyDiv);
  });
});

// Keyboard mapping
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (KEY_MAPPING.hasOwnProperty(key)) {
    e.preventDefault();
    const chipKey = KEY_MAPPING[key];
    emulator.key[chipKey] = 1;
    document.querySelector(`.key[data-key="${key.toUpperCase()}"]`)?.classList.add('active');
  }
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (KEY_MAPPING.hasOwnProperty(key)) {
    e.preventDefault();
    const chipKey = KEY_MAPPING[key];
    emulator.key[chipKey] = 0;
    document.querySelector(`.key[data-key="${key.toUpperCase()}"]`)?.classList.remove('active');
  }
});

// Controls
const runBtn = document.getElementById('runBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stepBtn = document.getElementById('stepBtn');
const resetBtn = document.getElementById('resetBtn');
const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
const fileInput = document.getElementById('fileInput');
const loadFileBtn = document.getElementById('loadFileBtn');
const status = document.getElementById('status');

runBtn.addEventListener('click', () => {
  emulator.running = true;
  status.textContent = 'Running';
  runBtn.classList.add('active-btn');
  pauseBtn.classList.remove('active-btn');
});

pauseBtn.addEventListener('click', () => {
  emulator.running = false;
  status.textContent = 'Paused';
  runBtn.classList.remove('active-btn');
  pauseBtn.classList.add('active-btn');
});

stepBtn.addEventListener('click', () => {
  emulator.running = false;
  runBtn.classList.remove('active-btn');
  pauseBtn.classList.add('active-btn');
  emulator.step();
  status.textContent = 'Stepped';
});

resetBtn.addEventListener('click', () => {
  emulator.reset();
  emulator.loadROM(DEMO_ROM);
  status.textContent = 'Reset - Demo loaded';
});

speedSlider.addEventListener('input', () => {
  speedLabel.textContent = speedSlider.value;
});

loadFileBtn.addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const arrayBuffer = event.target.result;
      const rom = new Uint8Array(arrayBuffer);
      emulator.loadROM(rom);
      emulator.running = false;
      runBtn.classList.remove('active-btn');
      pauseBtn.classList.add('active-btn');
      status.textContent = `Loaded: ${file.name}`;
    };
    reader.readAsArrayBuffer(file);
  }
});

// Game loop
function gameLoop() {
  if (emulator.running) {
    emulator.step();
  }
  if (emulator.drawFlag) {
    emulator.updateDisplay();
    emulator.drawFlag = false;
  }
  emulator.updateDebugger();
  requestAnimationFrame(gameLoop);
}

// Initialize
emulator.updateDisplay();
emulator.updateDebugger();
gameLoop();
</script>
</body>
</html>
