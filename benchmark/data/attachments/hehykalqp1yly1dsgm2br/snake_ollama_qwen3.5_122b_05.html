<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle - 30x30</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #0a0a0a;
        }

        .menu, .gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            z-index: 10;
        }

        .menu h2, .gameOver h2 {
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .menu button, .gameOver button {
            display: block;
            width: 100%;
            padding: 15px 30px;
            margin: 10px 0;
            font-size: 1.1em;
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu button:hover, .gameOver button:hover {
            background: #00ff88;
            color: #000;
        }

        .score-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.2em;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #00ff88;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        .instructions {
            color: #aaa;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .player1-score {
            color: #00ff88;
        }

        .player2-score {
            color: #ff0066;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Snake Battle</h1>
        <div class="score-display" id="scoreDisplay">
            <span class="player1-score">Player 1: 0</span> | <span class="player2-score">Player 2: 0</span>
        </div>
        <canvas id="gameCanvas" width="900" height="900"></canvas>
        
        <div class="menu" id="startMenu">
            <h2>Select Game Mode</h2>
            <button onclick="startGame('human_vs_human')">Human vs Human</button>
            <button onclick="startGame('cpu_vs_human')">CPU vs Human</button>
            <button onclick="startGame('cpu_vs_cpu')">CPU vs CPU</button>
            <p class="instructions">
                Player 1: WASD keys<br>
                Player 2: Arrow keys<br>
                Press any key to restart after game over
            </p>
        </div>
        
        <div class="gameOver hidden" id="gameOverScreen">
            <h2>Game Over!</h2>
            <p id="winnerText" style="color: #00ff88; margin-bottom: 20px; font-size: 1.2em;"></p>
            <button onclick="restartGame()">Play Again</button>
            <button onclick="showMainMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 30;
        const CELL_SIZE = canvas.width / GRID_SIZE;
        const GAME_SPEED = 80;

        let gameMode = '';
        let gameLoop = null;
        let gameOver = false;

        let player1, player2;
        let food = null;

        class Snake {
            constructor(x, y, color, isCPU = false) {
                this.body = [{x, y}];
                this.direction = {x: 0, y: 0};
                this.nextDirection = {x: 0, y: 0};
                this.color = color;
                this.isCPU = isCPU;
                this.score = 0;
                this.alive = true;
            }

            setDirection(x, y) {
                if (this.direction.x + x !== 0 || this.direction.y + y !== 0) {
                    this.nextDirection = {x, y};
                }
            }

            update() {
                if (!this.alive) return;

                this.direction = {...this.nextDirection};

                if (this.direction.x === 0 && this.direction.y === 0) return;

                const head = {...this.body[0]};
                head.x += this.direction.x;
                head.y += this.direction.y;

                // Check wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    this.alive = false;
                    return;
                }

                // Check self collision
                for (let segment of this.body) {
                    if (head.x === segment.x && head.y === segment.y) {
                        this.alive = false;
                        return;
                    }
                }

                this.body.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    this.score += 10;
                    spawnFood();
                } else {
                    this.body.pop();
                }
            }

            draw() {
                if (!this.alive) return;
                
                ctx.fillStyle = this.color;
                for (let i = 0; i < this.body.length; i++) {
                    const segment = this.body[i];
                    ctx.fillRect(
                        segment.x * CELL_SIZE + 1,
                        segment.y * CELL_SIZE + 1,
                        CELL_SIZE - 2,
                        CELL_SIZE - 2
                    );
                    
                    // Draw head differently
                    if (i === 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(
                            segment.x * CELL_SIZE + 3,
                            segment.y * CELL_SIZE + 3,
                            CELL_SIZE - 6,
                            CELL_SIZE - 6
                        );
                        ctx.fillStyle = this.color;
                    }
                }
            }

            getCpuMove() {
                if (!this.alive) return;

                const head = this.body[0];
                const possibleMoves = [
                    {x: 0, y: -1}, // Up
                    {x: 0, y: 1},  // Down
                    {x: -1, y: 0}, // Left
                    {x: 1, y: 0}   // Right
                ];

                // Filter out moves that would cause immediate death
                const safeMoves = possibleMoves.filter(move => {
                    // Can't reverse direction
                    if (this.direction.x + move.x === 0 && this.direction.y + move.y === 0) {
                        return false;
                    }

                    const newX = head.x + move.x;
                    const newY = head.y + move.y;

                    // Check wall collision
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        return false;
                    }

                    // Check self collision
                    for (let segment of this.body) {
                        if (newX === segment.x && newY === segment.y) {
                            return false;
                        }
                    }

                    // Check collision with other snake
                    if (player2 && player2.alive) {
                        const otherSnake = this === player1 ? player2 : player1;
                        for (let segment of otherSnake.body) {
                            if (newX === segment.x && newY === segment.y) {
                                return false;
                            }
                        }
                    }

                    return true;
                });

                if (safeMoves.length === 0) return;

                // Find food
                let bestMove = safeMoves[0];
                let minDistance = Infinity;

                for (let move of safeMoves) {
                    const newX = head.x + move.x;
                    const newY = head.y + move.y;
                    const distance = Math.abs(newX - food.x) + Math.abs(newY - food.y);
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestMove = move;
                    }
                }

                this.nextDirection = bestMove;
            }
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };

                valid = true;

                // Check if food spawns on any snake
                for (let snake of [player1, player2].filter(s => s)) {
                    for (let segment of snake.body) {
                        if (segment.x === food.x && segment.y === food.y) {
                            valid = false;
                            break;
                        }
                    }
                    if (!valid) break;
                }
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        function drawFood() {
            ctx.fillStyle = '#ff0066';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function updateScoreDisplay() {
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.innerHTML = `
                <span class="player1-score">Player 1: ${player1.score}</span> | 
                <span class="player2-score">Player 2: ${player2.score}</span>
            `;
        }

        function gameUpdate() {
            if (gameOver) return;

            // CPU controls
            if (player1.isCPU) player1.getCpuMove();
            if (player2.isCPU) player2.getCpuMove();

            // Update snakes
            player1.update();
            player2.update();

            // Check if both snakes are dead
            if (!player1.alive || !player2.alive) {
                endGame();
                return;
            }

            // Draw everything
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawFood();
            player1.draw();
            player2.draw();
            updateScoreDisplay();
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);

            let winnerText = '';
            if (player1.alive && !player2.alive) {
                winnerText = 'Player 1 Wins!';
            } else if (!player1.alive && player2.alive) {
                winnerText = 'Player 2 Wins!';
            } else {
                winnerText = 'It\'s a Draw!';
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function startGame(mode) {
            gameMode = mode;
            gameOver = false;

            // Initialize snakes based on game mode
            if (mode === 'human_vs_human') {
                player1 = new Snake(5, 15, '#00ff88', false);
                player2 = new Snake(24, 15, '#ff0066', false);
                player1.setDirection(1, 0);
                player2.setDirection(-1, 0);
            } else if (mode === 'cpu_vs_human') {
                player1 = new Snake(5, 15, '#00ff88', true);
                player2 = new Snake(24, 15, '#ff0066', false);
                player1.setDirection(1, 0);
                player2.setDirection(-1, 0);
            } else if (mode === 'cpu_vs_cpu') {
                player1 = new Snake(5, 15, '#00ff88', true);
                player2 = new Snake(24, 15, '#ff0066', true);
                player1.setDirection(1, 0);
                player2.setDirection(-1, 0);
            }

            spawnFood();

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            gameLoop = setInterval(gameUpdate, GAME_SPEED);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame(gameMode);
        }

        function showMainMenu() {
            clearInterval(gameLoop);
            gameOver = false;
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                restartGame();
                return;
            }

            if (!player1.isCPU) {
                switch (e.key) {
                    case 'w':
                    case 'W':
                        if (player1.direction.y !== 1) player1.setDirection(0, -1);
                        break;
                    case 's':
                    case 'S':
                        if (player1.direction.y !== -1) player1.setDirection(0, 1);
                        break;
                    case 'a':
                    case 'A':
                        if (player1.direction.x !== 1) player1.setDirection(-1, 0);
                        break;
                    case 'd':
                    case 'D':
                        if (player1.direction.x !== -1) player1.setDirection(1, 0);
                        break;
                }
            }

            if (!player2.isCPU) {
                switch (e.key) {
                    case 'ArrowUp':
                        if (player2.direction.y !== 1) player2.setDirection(0, -1);
                        break;
                    case 'ArrowDown':
                        if (player2.direction.y !== -1) player2.setDirection(0, 1);
                        break;
                    case 'ArrowLeft':
                        if (player2.direction.x !== 1) player2.setDirection(-1, 0);
                        break;
                    case 'ArrowRight':
                        if (player2.direction.x !== -1) player2.setDirection(1, 0);
                        break;
                }
            }
        });

        // Initial draw
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();
    </script>
</body>
</html>
