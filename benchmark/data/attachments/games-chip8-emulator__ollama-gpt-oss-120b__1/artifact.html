<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP‑8 Emulator</title>
<style>
  body { font-family: Arial, sans-serif; background:#222; color:#ddd; display:flex; flex-direction:column; align-items:center; margin:0; padding:20px; }
  #container { display:grid; grid-template-columns: auto auto; gap:20px; }
  #display { background:#000; image-rendering:pixelated; border:2px solid #555; }
  #keypad { display:grid; grid-template-columns:repeat(4,40px); gap:5px; }
  #keypad button { width:40px; height:40px; font-size:14px; background:#444; color:#fff; border:none; border-radius:4px; }
  #keypad button.active { background:#0f0; color:#000; }
  #controls { display:flex; flex-direction:column; gap:10px; }
  #controls button, #controls input[type=range] { padding:5px 10px; font-size:14px; }
  #debugger { background:#111; padding:10px; border-radius:4px; max-height:400px; overflow:auto; font-family:monospace; font-size:12px; }
  #debugger pre { margin:0; }
</style>
</head>
<body>
<div id="container">
  <canvas id="display" width="64" height="32"></canvas>
  <div id="keypad">
    <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="C">C</button>
    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="D">D</button>
    <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="E">E</button>
    <button data-key="A">A</button><button data-key="0">0</button><button data-key="B">B</button><button data-key="F">F</button>
  </div>
  <div id="controls">
    <button id="runBtn">Run</button>
    <button id="pauseBtn">Pause</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn">Reset</button>
    <label>Speed: <input type="range" id="speedSlider" min="1" max="20" value="10"></label>
    <input type="file" id="romInput" accept=".ch8,.rom">
  </div>
  <div id="debugger">
    <pre id="registers"></pre>
    <pre id="stack"></pre>
    <pre id="timers"></pre>
    <pre id="currentInstr"></pre>
  </div>
</div>
<script>
(() => {
  const DISPLAY_W = 64, DISPLAY_H = 32, SCALE = 10;
  const canvas = document.getElementById('display');
  const ctx = canvas.getContext('2d');
  canvas.style.width = DISPLAY_W * SCALE + 'px';
  canvas.style.height = DISPLAY_H * SCALE + 'px';

  const memory = new Uint8Array(4096);
  const V = new Uint8Array(16);
  let I = 0;
  let pc = 0x200;
  const stack = new Uint16Array(16);
  let sp = 0;
  let delayTimer = 0, soundTimer = 0;
  const display = new Uint8Array(DISPLAY_W * DISPLAY_H);
  const keypad = new Uint8Array(16);
  const keyMap = {
    '1':0x1,'2':0x2,'3':0x3,'4':0xC,
    'q':0x4,'w':0x5,'e':0x6,'r':0xD,
    'a':0x7,'s':0x8,'d':0x9,'f':0xE,
    'z':0xA,'x':0x0,'c':0xB,'v':0xF,
    'arrowleft':0x4,'arrowright':0x6,'arrowup':0x8,'arrowdown':0x2
  };
  let waitingForKey = false, waitingKeyReg = 0;
  let drawFlag = false;
  let speed = 10;
  let running = false;
  let currentOpcode = 0;

  const fontSet = [
    0xF0,0x90,0x90,0x90,0xF0, // 0
    0x20,0x60,0x20,0x20,0x70, // 1
    0xF0,0x10,0xF0,0x80,0xF0, // 2
    0xF0,0x10,0xF0,0x10,0xF0, // 3
    0x90,0x90,0xF0,0x10,0x10, // 4
    0xF0,0x80,0xF0,0x10,0xF0, // 5
    0xF0,0x80,0xF0,0x90,0xF0, // 6
    0xF0,0x10,0x20,0x40,0x40, // 7
    0xF0,0x90,0xF0,0x90,0xF0, // 8
    0xF0,0x90,0xF0,0x10,0xF0, // 9
    0xF0,0x90,0xF0,0x90,0x90, // A
    0xE0,0x90,0xE0,0x90,0xE0, // B
    0xF0,0x80,0x80,0x80,0xF0, // C
    0xE0,0x90,0x90,0x90,0xE0, // D
    0xF0,0x80,0xF0,0x80,0xF0, // E
    0xF0,0x80,0xF0,0x80,0x80  // F
  ];

  const demoRom = new Uint8Array([
    0x00,0xE0, // CLS
    0xA3,0x00, // LD I,0x300
    0x60,0x00, // LD V0,0
    0x61,0x00, // LD V1,0
    0x63,0x01, // LD V3,1
    0xD0,0x15, // DRW V0,V1,5
    0xF2,0x0A, // LD V2,K
    0x32,0x24, // SE V2,0x04 (left)
    0x12,0x0C, // JP wait
    0x83,0x05, // SUB V0,V3 (left)
    0x12,0x0C, // JP wait
    0x32,0x26, // SE V2,0x06 (right)
    0x12,0x0C, // JP wait
    0x80,0x34, // ADD V0,V3 (right)
    0x12,0x0C, // JP wait
    0x00,0xE0, // CLS
    0xD0,0x15, // DRW V0,V1,5
    0x12,0x0C  // JP wait
  ]);

  function loadFont() {
    for (let i = 0; i < fontSet.length; i++) memory[0x50 + i] = fontSet[i];
  }

  function loadDemo() {
    memory.set(demoRom, 0x200);
  }

  function reset() {
    memory.fill(0);
    V.fill(0);
    I = 0;
    pc = 0x200;
    sp = 0;
    stack.fill(0);
    delayTimer = soundTimer = 0;
    display.fill(0);
    keypad.fill(0);
    waitingForKey = false;
    drawFlag = true;
    loadFont();
    loadDemo();
    updateDebugger();
    drawGraphics();
  }

  function drawGraphics() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0F0';
    for (let y = 0; y < DISPLAY_H; y++) {
      for (let x = 0; x < DISPLAY_W; x++) {
        if (display[x + y * DISPLAY_W]) {
          ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
        }
      }
    }
  }

  function updateDebugger() {
    const reg = document.getElementById('registers');
    const stk = document.getElementById('stack');
    const tim = document.getElementById('timers');
    const cur = document.getElementById('currentInstr');
    let txt = `PC: 0x${pc.toString(16).padStart(4,'0')}\nI : 0x${I.toString(16).padStart(4,'0')}\n`;
    for (let i = 0; i < 16; i++) {
      txt += `V${i.toString(16).toUpperCase()}: 0x${V[i].toString(16).padStart(2,'0')}\n`;
    }
    reg.textContent = txt;
    let s = 'Stack:\n';
    for (let i = 0; i < sp; i++) s += `${i}: 0x${stack[i].toString(16).padStart(4,'0')}\n`;
    stk.textContent = s;
    tim.textContent = `Delay: ${delayTimer}\nSound: ${soundTimer}`;
    cur.textContent = `Opcode: 0x${currentOpcode.toString(16).padStart(4,'0')}`;
  }

  function emulateCycle() {
    for (let i = 0; i < speed; i++) {
      if (waitingForKey) break;
      const opcode = (memory[pc] << 8) | memory[pc + 1];
      currentOpcode = opcode;
      pc += 2;
      executeOpcode(opcode);
    }
    if (drawFlag) { drawGraphics(); drawFlag = false; }
    updateDebugger();
  }

  function executeOpcode(op) {
    const x = (op & 0x0F00) >> 8;
    const y = (op & 0x00F0) >> 4;
    const n = op & 0x000F;
    const nn = op & 0x00FF;
    const nnn = op & 0x0FFF;
    switch (op & 0xF000) {
      case 0x0000:
        switch (op) {
          case 0x00E0: display.fill(0); drawFlag = true; break;
          case 0x00EE: sp--; pc = stack[sp]; break;
          default: break; // 0NNN ignored
        }
        break;
      case 0x1000: pc = nnn; break;
      case 0x2000: stack[sp] = pc; sp++; pc = nnn; break;
      case 0x3000: if (V[x] === nn) pc += 2; break;
      case 0x4000: if (V[x] !== nn) pc += 2; break;
      case 0x5000: if (V[x] === V[y]) pc += 2; break;
      case 0x6000: V[x] = nn; break;
      case 0x7000: V[x] = (V[x] + nn) & 0xFF; break;
      case 0x8000:
        switch (n) {
          case 0x0: V[x] = V[y]; break;
          case 0x1: V[x] |= V[y]; break;
          case 0x2: V[x] &= V[y]; break;
          case 0x3: V[x] ^= V[y]; break;
          case 0x4: {
            const sum = V[x] + V[y];
            V[0xF] = sum > 0xFF ? 1 : 0;
            V[x] = sum & 0xFF;
            break;
          }
          case 0x5: {
            V[0xF] = V[x] > V[y] ? 1 : 0;
            V[x] = (V[x] - V[y]) & 0xFF;
            break;
          }
          case 0x6: {
            V[0xF] = V[x] & 0x1;
            V[x] >>= 1;
            break;
          }
          case 0x7: {
            V[0xF] = V[y] > V[x] ? 1 : 0;
            V[x] = (V[y] - V[x]) & 0xFF;
            break;
          }
          case 0xE: {
            V[0xF] = (V[x] & 0x80) >> 7;
            V[x] = (V[x] << 1) & 0xFF;
            break;
          }
          default: break;
        }
        break;
      case 0x9000: if (V[x] !== V[y]) pc += 2; break;
      case 0xA000: I = nnn; break;
      case 0xB000: pc = nnn + V[0]; break;
      case 0xC000: V[x] = (Math.floor(Math.random() * 0xFF)) & nn; break;
      case 0xD000: {
        const height = n;
        V[0xF] = 0;
        for (let row = 0; row < height; row++) {
          const sprite = memory[I + row];
          for (let col = 0; col < 8; col++) {
            if ((sprite & (0x80 >> col)) !== 0) {
              const px = (V[x] + col) % DISPLAY_W;
              const py = (V[y] + row) % DISPLAY_H;
              const idx = px + py * DISPLAY_W;
              if (display[idx] === 1) V[0xF] = 1;
              display[idx] ^= 1;
            }
          }
        }
        drawFlag = true;
        break;
      }
      case 0xE000:
        switch (nn) {
          case 0x9E: if (keypad[V[x]]) pc += 2; break;
          case 0xA1: if (!keypad[V[x]]) pc += 2; break;
          default: break;
        }
        break;
      case 0xF000:
        switch (nn) {
          case 0x07: V[x] = delayTimer; break;
          case 0x0A:
            waitingForKey = true;
            waitingKeyReg = x;
            pc -= 2;
            break;
          case 0x15: delayTimer = V[x]; break;
          case 0x18: soundTimer = V[x]; break;
          case 0x1E: I = (I + V[x]) & 0xFFF; break;
          case 0x29: I = 0x50 + V[x] * 5; break;
          case 0x33: {
            memory[I] = Math.floor(V[x] / 100);
            memory[I + 1] = Math.floor((V[x] % 100) / 10);
            memory[I + 2] = V[x] % 10;
            break;
          }
          case 0x55:
            for (let i = 0; i <= x; i++) memory[I + i] = V[i];
            break;
          case 0x65:
            for (let i = 0; i <= x; i++) V[i] = memory[I + i];
            break;
          default: break;
        }
        break;
      default: break;
    }
  }

  // Timers
  setInterval(() => {
    if (delayTimer > 0) delayTimer--;
    if (soundTimer > 0) {
      soundTimer--;
      if (soundTimer === 0) console.log('BEEP');
    }
  }, 1000 / 60);

  // Key handling
  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
      const chipKey = keyMap[key];
      keypad[chipKey] = 1;
      const btn = document.querySelector(`button[data-key="${chipKey.toString(16).toUpperCase()}"]`);
      if (btn) btn.classList.add('active');
      if (waitingForKey) {
        V[waitingKeyReg] = chipKey;
        waitingForKey = false;
        pc += 2;
      }
    }
  });
  window.addEventListener('keyup', e => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
      const chipKey = keyMap[key];
      keypad[chipKey] = 0;
      const btn = document.querySelector(`button[data-key="${chipKey.toString(16).toUpperCase()}"]`);
      if (btn) btn.classList.remove('active');
    }
  });

  // Controls
  document.getElementById('runBtn').onclick = () => { if (!running) { running = true; requestAnimationFrame(loop); } };
  document.getElementById('pauseBtn').onclick = () => { running = false; };
  document.getElementById('stepBtn').onclick = () => { if (!running) emulateCycle(); };
  document.getElementById('resetBtn').onclick = () => { running = false; reset(); };
  document.getElementById('speedSlider').oninput = e => { speed = Number(e.target.value); };
  document.getElementById('romInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const arr = new Uint8Array(reader.result);
      memory.set(arr, 0x200);
      pc = 0x200;
    };
    reader.readAsArrayBuffer(file);
  };

  function loop() {
    if (!running) return;
    emulateCycle();
    requestAnimationFrame(loop);
  }

  // Initialize
  reset();
})();
</script>
</body>
</html>
