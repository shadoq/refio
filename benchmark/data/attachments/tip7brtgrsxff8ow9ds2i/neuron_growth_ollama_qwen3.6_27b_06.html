<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <canvas id="simCanvas" width="800" height="800"></canvas>

    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        const params = {
            // Growth
            neuronCount: 4,
            growthSpeed: 2,
            maxDepth: 6,
            splitChance: 0.3,
            curvature: 0.5,
            maxBranchLength: 100,
            
            // Synapses
            synapseThreshold: 40,
            synapseGlow: 10,
            
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.05,
            pulseBrightness: 1,
            
            // Visuals
            bgColor: '#05070f',
            bgGlow: '#101a3a',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            uiColor: '#ffd400',
            
            // Actions
            regenerate: () => init(),
            clear: () => {
                branches = [];
                synapses = [];
                pulses = [];
                neurons = [];
                init();
            },
            pause: () => {
                isPaused = !isPaused;
                if (!isPaused) loop();
            }
        };

        let isPaused = false;
        let branches = [];
        let synapses = [];
        let pulses = [];
        let neurons = [];
        let animationId;

        // --- Classes ---

        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 3;
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, parent = null) {
                this.startX = startX;
                this.startY = startY;
                this.x = startX;
                this.y = startY;
                this.angle = angle;
                this.depth = depth;
                this.length = 0;
                this.maxLength = params.maxBranchLength * (0.8 + Math.random() * 0.4);
                this.speed = params.growthSpeed * (0.8 + Math.random() * 0.4);
                this.isGrowing = true;
                this.children = [];
                this.parent = parent;
                this.thickness = Math.max(0.5, 3 - depth * 0.5);
                this.color = depth % 2 === 0 ? params.branchColor : params.accentColor;
                this.controlPoint = {
                    x: startX + Math.cos(angle) * 20,
                    y: startY + Math.sin(angle) * 20
                };
            }

            update() {
                if (!this.isGrowing) return;

                this.length += this.speed;
                this.x = this.startX + Math.cos(this.angle) * this.length;
                this.y = this.startY + Math.sin(this.angle) * this.length;

                // Organic curve adjustment
                this.controlPoint.x += (Math.random() - 0.5) * params.curvature;
                this.controlPoint.y += (Math.random() - 0.5) * params.curvature;

                if (this.length >= this.maxLength || this.depth >= params.maxDepth) {
                    this.isGrowing = false;
                    // Try to create synapses when growth stops
                    checkSynapses(this);
                    
                    // Chance to split
                    if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                        const newAngle1 = this.angle + (Math.random() - 0.5) * 1.5;
                        const newAngle2 = this.angle - (Math.random() - 0.5) * 1.5;
                        const child1 = new Branch(this.x, this.y, newAngle1, this.depth + 1, this);
                        const child2 = new Branch(this.x, this.y, newAngle2, this.depth + 1, this);
                        this.children.push(child1, child2);
                        branches.push(child1, child2);
                    }
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.quadraticCurveTo(this.controlPoint.x, this.controlPoint.y, this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x = (branch1.x + branch2.x) / 2;
                this.y = (branch1.y + branch2.y) / 2;
                this.radius = 2;
                this.glow = params.synapseGlow;
                this.color = params.synapseColor;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Update position if branches are still moving slightly or for visual effect
                this.x = (this.branch1.x + this.branch2.x) / 2;
                this.y = (this.branch1.y + this.branch2.y) / 2;
                this.pulsePhase += 0.05;
            }

            draw(ctx) {
                const pulseSize = this.radius + Math.sin(this.pulsePhase) * 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.glow;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(startBranch, endBranch) {
                this.startBranch = startBranch;
                this.endBranch = endBranch;
                this.progress = 0;
                this.speed = params.pulseSpeed;
                this.color = params.pulseColor;
                this.brightness = params.pulseBrightness;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.progress = 0;
                }
            }

            draw(ctx) {
                // Interpolate position along the path defined by branches
                // Simplified: linear interpolation between branch tips for pulse travel
                const startX = this.startBranch.x;
                const startY = this.startBranch.y;
                const endX = this.endBranch.x;
                const endY = this.endBranch.y;

                const x = startX + (endX - startX) * this.progress;
                const y = startY + (endY - startY) * this.progress;

                ctx.beginPath();
                ctx.arc(x, y, 2 * this.brightness, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // --- Functions ---

        function init() {
            branches = [];
            synapses = [];
            pulses = [];
            neurons = [];

            // Create seed neurons
            const count = params.neuronCount;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const radius = 50 + Math.random() * 50;
                const x = width / 2 + Math.cos(angle) * radius;
                const y = height / 2 + Math.sin(angle) * radius;
                neurons.push(new Neuron(x, y));
                
                // Initial branch from neuron
                const branchAngle = Math.random() * Math.PI * 2;
                const branch = new Branch(x, y, branchAngle, 0);
                branches.push(branch);
            }
        }

        function checkSynapses(branch) {
            // Check distance to other branch tips
            for (let other of branches) {
                if (other === branch || other.parent === branch.parent) continue; // Avoid self or siblings
                
                const dx = branch.x - other.x;
                const dy = branch.y - other.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < params.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.branch1 === branch && s.branch2 === other) || 
                        (s.branch1 === other && s.branch2 === branch)
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(branch, other));
                        // Create pulse
                        if (Math.random() < params.pulseFrequency) {
                            pulses.push(new Pulse(branch, other));
                        }
                    }
                }
            }
        }

        function drawBackground() {
            // Clear with background color
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);

            // Background glow
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/2);
            gradient.addColorStop(0, params.bgGlow);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Scanlines
            ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
            for (let i = 0; i < height; i += 4) {
                ctx.fillRect(0, i, width, 1);
            }

            // Vignette
            const vignette = ctx.createRadialGradient(width/2, height/2, width/3, width/2, height/2, width/1.5);
            vignette.addColorStop(0, 'transparent');
            vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, width, height);
        }

        function drawNeurons() {
            neurons.forEach(neuron => {
                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, neuron.radius, 0, Math.PI * 2);
                ctx.fillStyle = params.branchColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = params.branchColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function loop() {
            if (isPaused) return;

            drawBackground();

            // Update and draw branches
            branches.forEach(branch => {
                branch.update();
                branch.draw(ctx);
            });

            // Update and draw synapses
            synapses.forEach(synapse => {
                synapse.update();
                synapse.draw(ctx);
            });

            // Update and draw pulses
            // Randomly spawn new pulses
            if (synapses.length > 0 && Math.random() < params.pulseFrequency) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse.branch1, randomSynapse.branch2));
            }

            pulses.forEach(pulse => {
                pulse.update();
                pulse.draw(ctx);
            });

            // Clean up finished pulses
            pulses = pulses.filter(p => p.progress < 1);

            drawNeurons();

            animationId = requestAnimationFrame(loop);
        }

        // --- GUI Setup ---
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(params, 'neuronCount', 1, 10, 1).name('Neuron Count');
        growthFolder.add(params, 'growthSpeed', 0.1, 5).name('Growth Speed');
        growthFolder.add(params, 'maxDepth', 1, 10, 1).name('Max Depth');
        growthFolder.add(params, 'splitChance', 0, 1).name('Split Chance');
        growthFolder.add(params, 'curvature', 0, 2).name('Curvature');
        growthFolder.add(params, 'maxBranchLength', 10, 200).name('Max Length');
        growthFolder.open();

        const synapseFolder = gui.addFolder('Synapses');
        synapseFolder.add(params, 'synapseThreshold', 10, 100).name('Distance Threshold');
        synapseFolder.add(params, 'synapseGlow', 0, 30).name('Glow Strength');
        synapseFolder.open();

        const pulseFolder = gui.addFolder('Pulses');
        pulseFolder.add(params, 'pulseSpeed', 0.001, 0.1).name('Speed');
        pulseFolder.add(params, 'pulseFrequency', 0, 0.2).name('Frequency');
        pulseFolder.add(params, 'pulseBrightness', 0.1, 2).name('Brightness');
        pulseFolder.open();

        const visualFolder = gui.addFolder('Visuals');
        visualFolder.addColor(params, 'bgColor').name('Background');
        visualFolder.addColor(params, 'bgGlow').name('BG Glow');
        visualFolder.addColor(params, 'branchColor').name('Branch Color');
        visualFolder.addColor(params, 'accentColor').name('Accent Branch');
        visualFolder.addColor(params, 'synapseColor').name('Synapse Color');
        visualFolder.addColor(params, 'pulseColor').name('Pulse Color');
        visualFolder.open();

        const actionFolder = gui.addFolder('Actions');
        actionFolder.add(params, 'regenerate').name('Regenerate');
        actionFolder.add(params, 'clear').name('Clear');
        actionFolder.add(params, 'pause').name('Pause/Resume');
        actionFolder.open();

        // --- Start ---
        init();
        loop();

    </script>
</body>
</html>
