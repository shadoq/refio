<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Battle</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #scoreBoard {
    display: flex;
    justify-content: space-between;
    width: 600px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
  }

  .score-value {
    font-size: 28px;
    font-weight: bold;
  }

  #snake1Score .score-value { color: #39ff14; text-shadow: 0 0 10px #39ff14; }
  #snake2Score .score-value { color: #00bfff; text-shadow: 0 0 10px #00bfff; }

  .score-divider {
    display: flex;
    align-items: center;
    font-size: 20px;
    opacity: 0.3;
  }

  #canvas {
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 80px rgba(57,255,20,0.05);
    display: block;
  }

  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    backdrop-filter: blur(4px);
  }

  #overlayBox {
    background: linear-gradient(135deg, #0d0d1a, #1a1a2e);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 40px 50px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 0 60px rgba(0,0,0,0.9);
  }

  #overlayBox h1 {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #39ff14, #00bfff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #overlayBox h2 {
    font-size: 28px;
    margin-bottom: 20px;
    opacity: 0.9;
  }

  .subtitle {
    font-size: 13px;
    opacity: 0.4;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .mode-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  .mode-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 14px 24px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }

  .mode-btn:hover, .mode-btn.selected {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .mode-btn.hvh:hover, .mode-btn.hvh.selected {
    border-color: #39ff14;
    box-shadow: 0 0 20px rgba(57,255,20,0.2);
    color: #39ff14;
  }

  .mode-btn.cvh:hover, .mode-btn.cvh.selected {
    border-color: #ff6b35;
    box-shadow: 0 0 20px rgba(255,107,53,0.2);
    color: #ff6b35;
  }

  .mode-btn.cvc:hover, .mode-btn.cvc.selected {
    border-color: #00bfff;
    box-shadow: 0 0 20px rgba(0,191,255,0.2);
    color: #00bfff;
  }

  .start-btn {
    background: linear-gradient(135deg, #39ff14, #00bfff);
    border: none;
    color: #000;
    padding: 16px 48px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    margin-bottom: 24px;
  }

  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(57,255,20,0.3);
  }

  .instructions {
    font-size: 12px;
    opacity: 0.35;
    line-height: 1.8;
    letter-spacing: 1px;
  }

  .instructions span {
    opacity: 0.7;
  }

  #gameOverResult {
    font-size: 22px;
    margin-bottom: 16px;
    opacity: 0.9;
  }

  #gameOverScores {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 28px;
    padding: 16px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
  }

  .go-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .go-score-label { font-size: 11px; opacity: 0.5; letter-spacing: 2px; }
  .go-score-val { font-size: 32px; font-weight: bold; }
  .go-score-val.s1 { color: #39ff14; text-shadow: 0 0 10px #39ff14; }
  .go-score-val.s2 { color: #00bfff; text-shadow: 0 0 10px #00bfff; }

  .restart-hint {
    font-size: 12px;
    opacity: 0.35;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #modeLabel {
    font-size: 12px;
    opacity: 0.4;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="scoreBoard">
    <div class="score-item" id="snake1Score">
      <div class="score-label" id="s1label">Player 1</div>
      <div class="score-value">0</div>
    </div>
    <div class="score-divider">|</div>
    <div class="score-item" id="modeDisplay">
      <div class="score-label">Mode</div>
      <div id="modeLabel">—</div>
    </div>
    <div class="score-divider">|</div>
    <div class="score-item" id="snake2Score">
      <div class="score-label" id="s2label">Player 2</div>
      <div class="score-value">0</div>
    </div>
  </div>
  <canvas id="canvas" width="600" height="600"></canvas>
</div>

<div id="overlay">
  <div id="overlayBox">
    <!-- filled by JS -->
  </div>
</div>

<script>
const GRID = 30;
const CELL = 20;
const W = GRID * CELL;
const H = GRID * CELL;
const TICK = 150;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayBox = document.getElementById('overlayBox');

const S1_COLOR = '#39ff14';
const S1_HEAD  = '#7fff00';
const S1_DARK  = '#1a5c00';
const S2_COLOR = '#00bfff';
const S2_HEAD  = '#87dfff';
const S2_DARK  = '#003d5c';
const FOOD1_COLOR = '#ff4444';
const FOOD2_COLOR = '#ff9900';
const BG_COLOR = '#0d0d14';
const GRID_COLOR = 'rgba(255,255,255,0.03)';

let gameState = 'menu'; // menu | playing | gameover
let gameMode = 'hvh';   // hvh | cvh | cvc
let gameLoop = null;

let snake1, snake2, food1, food2, score1, score2;

const DIRS = {
  UP:    { x: 0, y: -1 },
  DOWN:  { x: 0, y:  1 },
  LEFT:  { x: -1, y: 0 },
  RIGHT: { x: 1, y:  0 },
};

function initGame() {
  snake1 = {
    body: [
      { x: 5, y: 15 },
      { x: 4, y: 15 },
      { x: 3, y: 15 },
    ],
    dir: DIRS.RIGHT,
    nextDir: DIRS.RIGHT,
    alive: true,
    cpu: gameMode === 'cvc',
  };
  snake2 = {
    body: [
      { x: 24, y: 15 },
      { x: 25, y: 15 },
      { x: 26, y: 15 },
    ],
    dir: DIRS.LEFT,
    nextDir: DIRS.LEFT,
    alive: true,
    cpu: gameMode === 'cvh' || gameMode === 'cvc',
  };
  score1 = 0;
  score2 = 0;
  food1 = spawnFood([...snake1.body, ...snake2.body]);
  food2 = spawnFood([...snake1.body, ...snake2.body, food1]);
  updateScoreDisplay();
}

function spawnFood(occupied) {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (occupied.some(p => p.x === pos.x && p.y === pos.y));
  return pos;
}

function updateScoreDisplay() {
  document.querySelector('#snake1Score .score-value').textContent = score1;
  document.querySelector('#snake2Score .score-value').textContent = score2;

  const s1label = document.getElementById('s1label');
  const s2label = document.getElementById('s2label');
  const modeLabel = document.getElementById('modeLabel');

  if (gameMode === 'hvh') {
    s1label.textContent = 'Player 1';
    s2label.textContent = 'Player 2';
    modeLabel.textContent = 'HvH';
  } else if (gameMode === 'cvh') {
    s1label.textContent = 'CPU';
    s2label.textContent = 'Player';
    modeLabel.textContent = 'CvH';
  } else {
    s1label.textContent = 'CPU 1';
    s2label.textContent = 'CPU 2';
    modeLabel.textContent = 'CvC';
  }
}

// BFS pathfinding
function bfsPath(head, target, obstacles) {
  const key = p => `${p.x},${p.y}`;
  const visited = new Set();
  visited.add(key(head));
  const queue = [{ pos: head, path: [] }];

  while (queue.length > 0) {
    const { pos, path } = queue.shift();
    for (const dir of Object.values(DIRS)) {
      const next = { x: pos.x + dir.x, y: pos.y + dir.y };
      if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) continue;
      if (obstacles.some(o => o.x === next.x && o.y === next.y)) continue;
      if (visited.has(key(next))) continue;
      const newPath = [...path, dir];
      if (next.x === target.x && next.y === target.y) return newPath;
      visited.add(key(next));
      queue.push({ pos: next, path: newPath });
    }
  }
  return null;
}

function cpuMove(snake, food, otherSnake) {
  const head = snake.body[0];
  // obstacles: own body (except tail which will move) + other snake body
  const obstacles = [
    ...snake.body.slice(0, -1),
    ...otherSnake.body.slice(0, -1),
  ];

  const path = bfsPath(head, food, obstacles);

  if (path && path.length > 0) {
    snake.nextDir = path[0];
    return;
  }

  // Fallback: pick any safe direction
  const dirs = Object.values(DIRS);
  // Shuffle for variety
  for (let i = dirs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
  }

  for (const dir of dirs) {
    // Don't reverse
    if (dir.x === -snake.dir.x && dir.y === -snake.dir.y) continue;
    const next = { x: head.x + dir.x, y: head.y + dir.y };
    if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) continue;
    if (obstacles.some(o => o.x === next.x && o.y === next.y)) continue;
    snake.nextDir = dir;
    return;
  }
  // No safe move found, keep current direction
}

function moveSnake(snake, food, otherSnake) {
  if (!snake.alive) return { ate: false };

  snake.dir = snake.nextDir;
  const head = snake.body[0];
  const newHead = { x: head.x + snake.dir.x, y: head.y + snake.dir.y };

  // Wall collision
  if (newHead.x < 0 || newHead.x >= GRID || newHead.y < 0 || newHead.y >= GRID) {
    snake.alive = false;
    return { ate: false };
  }

  // Self collision
  if (snake.body.some(p => p.x === newHead.x && p.y === newHead.y)) {
    snake.alive = false;
    return { ate: false };
  }

  // Other snake collision
  if (otherSnake.alive && otherSnake.body.some(p => p.x === newHead.x && p.y === newHead.y)) {
    snake.alive = false;
    return { ate: false };
  }

  snake.body.unshift(newHead);

  const ate = newHead.x === food.x && newHead.y === food.y;
  if (!ate) {
    snake.body.pop();
  }

  return { ate };
}

function gameTick() {
  // CPU decisions
  if (snake1.cpu && snake1.alive) cpuMove(snake1, food1, snake2);
  if (snake2.cpu && snake2.alive) cpuMove(snake2, food2, snake1);

  // Move snakes
  const result1 = moveSnake(snake1, food1, snake2);
  const result2 = moveSnake(snake2, food2, snake1);

  if (result1.ate) {
    score1++;
    food1 = spawnFood([...snake1.body, ...snake2.body, food2]);
    updateScoreDisplay();
  }
  if (result2.ate) {
    score2++;
    food2 = spawnFood([...snake1.body, ...snake2.body, food1]);
    updateScoreDisplay();
  }

  draw();

  if (!snake1.alive || !snake2.alive) {
    clearInterval(gameLoop);
    gameLoop = null;
    setTimeout(() => showGameOver(), 400);
  }
}

function draw() {
  // Background
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(W, i * CELL);
    ctx.stroke();
  }

  // Food 1
  drawFood(food1, FOOD1_COLOR);
  // Food 2
  drawFood(food2, FOOD2_COLOR);

  // Snakes
  drawSnake(snake1, S1_COLOR, S1_HEAD, S1_DARK);
  drawSnake(snake2, S2_COLOR, S2_HEAD, S2_DARK);
}

function drawFood(food, color) {
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;
  const r = CELL / 2 - 3;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSnake(snake, color, headColor, darkColor) {
  if (snake.body.length === 0) return;

  const alpha = snake.alive ? 1 : 0.35;
  ctx.save();
  ctx.globalAlpha = alpha;

  // Body segments
  for (let i = snake.body.length - 1; i >= 1; i--) {
    const seg = snake.body[i];
    const t = i / snake.body.length;
    const pad = 2 + t * 1;

    ctx.fillStyle = i % 2 === 0 ? color : darkColor;
    ctx.shadowColor = color;
    ctx.shadowBlur = snake.alive ? 6 : 0;

    roundRect(
      ctx,
      seg.x * CELL + pad,
      seg.y * CELL + pad,
      CELL - pad * 2,
      CELL - pad * 2,
      3
    );
    ctx.fill();
  }

  // Head
  const head = snake.body[0];
  ctx.fillStyle = headColor;
  ctx.shadowColor = headColor;
  ctx.shadowBlur = snake.alive ? 14 : 0;
  roundRect(ctx, head.x * CELL + 1, head.y * CELL + 1, CELL - 2, CELL - 2, 4);
  ctx.fill();

  // Eyes
  if (snake.alive) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    const eyeSize = 2.5;
    const dir = snake.dir;

    let eye1, eye2;
    if (dir.x === 1) {
      eye1 = { x: head.x * CELL + CELL - 5, y: head.y * CELL + 4 };
      eye2 = { x: head.x * CELL + CELL - 5, y: head.y * CELL + CELL - 6 };
    } else if (dir.x === -1) {
      eye1 = { x: head.x * CELL + 4, y: head.y * CELL + 4 };
      eye2 = { x: head.x * CELL + 4, y: head.y * CELL + CELL - 6 };
    } else if (dir.y === -1) {
      eye1 = { x: head.x * CELL + 4, y: head.y * CELL + 4 };
      eye2 = { x: head.x * CELL + CELL - 6, y: head.y * CELL + 4 };
    } else {
      eye1 = { x: head.x * CELL + 4, y: head.y * CELL + CELL - 5 };
      eye2 = { x: head.x * CELL + CELL - 6, y: head.y * CELL + CELL - 5 };
    }

    ctx.beginPath();
    ctx.arc(eye1.x, eye1.y, eyeSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eye2.x, eye2.y, eyeSize, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ---- Screens ----

function showMenu() {
  gameState = 'menu';
  overlay.style.display = 'flex';
  overlayBox.innerHTML = `
    <h1>SNAKE</h1>
    <div class="subtitle">Battle Arena</div>
    <div class="mode-buttons">
      <button class="mode-btn hvh selected" data-mode="hvh">⚔️ Human vs Human</button>
      <button class="mode-btn cvh" data-mode="cvh">🤖 CPU vs Human</button>
      <button class="mode-btn cvc" data-mode="cvc">🤖 CPU vs CPU 🤖</button>
    </div>
    <button class="start-btn" id="startBtn">START</button>
    <div class="instructions">
      <span>GREEN SNAKE</span> — W A S D keys<br>
      <span>BLUE SNAKE</span> — Arrow keys<br>
      CPU snakes use BFS pathfinding<br><br>
      Red food → Green snake &nbsp;|&nbsp; Orange food → Blue snake
    </div>
  `;

  let selectedMode = 'hvh';

  overlayBox.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      overlayBox.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMode = btn.dataset.mode;
    });
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    gameMode = selectedMode;
    startGame();
  });
}

function showGameOver() {
  gameState = 'gameover';
  overlay.style.display = 'flex';

  let winner = '';
  const s1name = gameMode === 'cvh' ? 'CPU' : gameMode === 'cvc' ? 'CPU 1' : 'Player 1';
  const s2name = gameMode === 'cvh' || gameMode === 'cvc' ? (gameMode === 'cvc' ? 'CPU 2' : 'Player') : 'Player 2';

  if (!snake1.alive && !snake2.alive) {
    winner = "🤝 It's a Draw!";
  } else if (!snake1.alive) {
    winner = `🏆 ${s2name} Wins!`;
  } else {
    winner = `🏆 ${s1name} Wins!`;
  }

  overlayBox.innerHTML = `
    <h2>GAME OVER</h2>
    <div id="gameOverResult">${winner}</div>
    <div id="gameOverScores">
      <div class="go-score">
        <div class="go-score-label">${s1name}</div>
        <div class="go-score-val s1">${score1}</div>
      </div>
      <div class="go-score">
        <div class="go-score-label">${s2name}</div>
        <div class="go-score-val s2">${score2}</div>
      </div>
    </div>
    <button class="start-btn" id="restartBtn">PLAY AGAIN</button>
    <div class="restart-hint">or press Enter / Space</div>
  `;

  document.getElementById('restartBtn').addEventListener('click', () => {
    startGame();
  });
}

function startGame() {
  overlay.style.display = 'none';
  gameState = 'playing';
  initGame();
  draw();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(gameTick, TICK);
}

// ---- Input ----

document.addEventListener('keydown', e => {
  if (gameState === 'playing') {
    // Snake 1 — WASD (only if human)
    if (!snake1.cpu) {
      if (e.key === 'w' || e.key === 'W') {
        if (snake1.dir !== DIRS.DOWN) snake1.nextDir = DIRS.UP;
      } else if (e.key === 's' || e.key === 'S') {
        if (snake1.dir !== DIRS.UP) snake1.nextDir = DIRS.DOWN;
      } else if (e.key === 'a' || e.key === 'A') {
        if (snake1.dir !== DIRS.RIGHT) snake1.nextDir = DIRS.LEFT;
      } else if (e.key === 'd' || e.key === 'D') {
        if (snake1.dir !== DIRS.LEFT) snake1.nextDir = DIRS.RIGHT;
      }
    }

    // Snake 2 — Arrows (only if human)
    if (!snake2.cpu) {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (snake2.dir !== DIRS.DOWN) snake2.nextDir = DIRS.UP;
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (snake2.dir !== DIRS.UP) snake2.nextDir = DIRS.DOWN;
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (snake2.dir !== DIRS.RIGHT) snake2.nextDir = DIRS.LEFT;
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (snake2.dir !== DIRS.LEFT) snake2.nextDir = DIRS.RIGHT;
      }
    }
  }

  if (gameState === 'gameover') {
    if (e.key === 'Enter' || e.key === ' ') {
      startGame();
    }
  }

  if (gameState === 'menu') {
    if (e.key === 'Enter') {
      const selected = overlayBox.querySelector('.mode-btn.selected');
      if (selected) gameMode = selected.dataset.mode;
      startGame();
    }
  }
});
