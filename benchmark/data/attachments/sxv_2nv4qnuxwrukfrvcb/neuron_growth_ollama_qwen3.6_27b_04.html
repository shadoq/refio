<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
            border: 1px solid #101a3a;
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        /* Vignette Overlay */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, #05070f 100%);
            z-index: 1;
        }

        /* Scanlines */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 2;
        }

        .dg.ac {
            z-index: 100 !important;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
    <div id="vignette"></div>
    <div id="scanlines"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

<script>
/**
 * Neural Network Growth Simulation
 * Uses Canvas API for rendering and dat.gui for controls.
 */

// --- Configuration & State ---
const config = {
    // Growth
    neuronCount: 4,
    growthSpeed: 2.0,
    maxDepth: 5,
    splitChance: 0.3,
    curvature: 0.5,
    maxLength: 150,
    
    // Synapses
    synapseThreshold: 40,
    synapseGlow: 15,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,
    
    // Visuals
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    
    // Actions
    regenerate: function() { init(); },
    clear: function() { clearCanvas(); },
    pause: function() { isPaused = !isPaused; },
    
    // Internal State
    isPaused: false
};

// --- Canvas Setup ---
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;

// --- Data Structures ---
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let animationId;
let isPaused = false;

class Neuron {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 3;
        this.id = Math.random().toString(36).substr(2, 9);
    }
    
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = config.branchColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = config.branchColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Branch {
    constructor(startX, startY, angle, depth, parentNeuronId) {
        this.startX = startX;
        this.startY = startY;
        this.x = startX;
        this.y = startY;
        this.angle = angle;
        this.depth = depth;
        this.length = 0;
        this.maxLength = Math.random() * config.maxLength * 0.5 + config.maxLength * 0.5;
        this.growthRate = config.growthSpeed * (Math.random() * 0.5 + 0.75);
        this.isGrowing = true;
        this.hasSplit = false;
        this.parentNeuronId = parentNeuronId;
        this.color = (Math.random() > 0.8) ? config.accentColor : config.branchColor;
        this.thickness = Math.max(0.5, 3 - depth * 0.5);
        
        // Store points for the full path
        this.points = [{x: startX, y: startY}];
    }

    update() {
        if (!this.isGrowing) return;

        this.length += this.growthRate;
        
        // Organic movement: slight angle jitter
        this.angle += (Math.random() - 0.5) * config.curvature * 0.1;

        // Calculate new position
        const nextX = this.x + Math.cos(this.angle) * this.growthRate;
        const nextY = this.y + Math.sin(this.angle) * this.growthRate;

        this.x = nextX;
        this.y = nextY;
        
        // Add new point to the path
        this.points.push({x: this.x, y: this.y});

        // Check bounds
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.isGrowing = false;
        }

        // Check max length
        if (this.length >= this.maxLength) {
            this.isGrowing = false;
            // Chance to split
            if (this.depth < config.maxDepth && !this.hasSplit && Math.random() < config.splitChance) {
                this.hasSplit = true;
                this.split();
            }
        }
    }

    split() {
        const angleOffset = (Math.random() - 0.5) * 1.5;
        const newBranch = new Branch(this.x, this.y, this.angle + angleOffset, this.depth + 1, this.parentNeuronId);
        branches.push(newBranch);
    }

    draw() {
        if (this.points.length < 2) return;

        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        
        // Draw smooth curve through all points
        for (let i = 1; i < this.points.length - 1; i++) {
            const xc = (this.points[i].x + this.points[i + 1].x) / 2;
            const yc = (this.points[i].y + this.points[i + 1].y) / 2;
            ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
        }
        
        // Connect to the last point
        if (this.points.length > 1) {
            ctx.lineTo(this.points[this.points.length - 1].x, this.points[this.points.length - 1].y);
        }
        
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.thickness;
        ctx.lineCap = 'round';
        
        // Glow effect
        ctx.shadowBlur = 5;
        ctx.shadowColor = this.color;
        
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Synapse {
    constructor(branch1, branch2) {
        this.branch1 = branch1;
        this.branch2 = branch2;
        this.x = (branch1.x + branch2.x) / 2;
        this.y = (branch1.y + branch2.y) / 2;
        this.radius = 2;
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.id = Math.random().toString(36).substr(2, 9);
    }

    update() {
        // Update position if branches are still growing
        this.x = (this.branch1.x + this.branch2.x) / 2;
        this.y = (this.branch1.y + this.branch2.y) / 2;
        
        this.pulsePhase += 0.05;
    }

    draw() {
        const glowSize = config.synapseGlow + Math.sin(this.pulsePhase) * 5;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = config.synapseColor;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = config.synapseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
        this.speed = config.pulseSpeed;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.active = true;
    }

    update() {
        this.progress += this.speed * this.direction;
        
        if (this.progress >= 1 || this.progress <= 0) {
            this.active = false;
        }
    }

    draw() {
        if (!this.active) return;

        // Interpolate position between branch tips
        const b1 = this.synapse.branch1;
        const b2 = this.synapse.branch2;
        
        // Determine start and end based on direction
        let startX, startY, endX, endY;
        
        if (this.direction === 1) {
            startX = b1.x; startY = b1.y;
            endX = b2.x; endY = b2.y;
        } else {
            startX = b2.x; startY = b2.y;
            endX = b1.x; endY = b1.y;
        }

        const curX = startX + (endX - startX) * this.progress;
        const curY = startY + (endY - startY) * this.progress;

        ctx.beginPath();
        ctx.arc(curX, curY, 3, 0, Math.PI * 2);
        ctx.fillStyle = config.pulseColor;
        ctx.shadowBlur = 10 * config.pulseBrightness;
        ctx.shadowColor = config.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// --- Core Functions ---

function init() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    
    // Clear canvas
    ctx.fillStyle = config.bgColor;
    ctx.fillRect(0, 0, width, height);

    // Generate Seed Neurons
    const centerX = width / 2;
    const centerY = height / 2;
    
    for (let i = 0; i < config.neuronCount; i++) {
        const angle = (Math.PI * 2 / config.neuronCount) * i;
        const dist = 50 + Math.random() * 50;
        const nx = centerX + Math.cos(angle) * dist;
        const ny = centerY + Math.sin(angle) * dist;
        neurons.push(new Neuron(nx, ny));
    }

    // Start Growth
    startGrowth();
}

function startGrowth() {
    neurons.forEach(neuron => {
        // Each neuron starts with 3-5 initial branches
        const numBranches = Math.floor(Math.random() * 3) + 3;
        for (let i = 0; i < numBranches; i++) {
            const angle = (Math.PI * 2 / numBranches) * i + (Math.random() - 0.5);
            branches.push(new Branch(neuron.x, neuron.y, angle, 0, neuron.id));
        }
    });
}

function checkSynapses() {
    // Only check tips of growing or recently stopped branches
    // To optimize, we only check branches that are currently active or recently finished
    const activeBranches = branches.filter(b => b.isGrowing || b.length > 0);
    
    for (let i = 0; i < activeBranches.length; i++) {
        for (let j = i + 1; j < activeBranches.length; j++) {
            const b1 = activeBranches[i];
            const b2 = activeBranches[j];
            
            // Don't connect branches from the same neuron directly to avoid clutter
            if (b1.parentNeuronId === b2.parentNeuronId) continue;

            const dx = b1.x - b2.x;
            const dy = b1.y - b2.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < config.synapseThreshold) {
                // Check if synapse already exists
                const exists = synapses.some(s => 
                    (s.branch1 === b1 && s.branch2 === b2) || 
                    (s.branch1 === b2 && s.branch2 === b1)
                );

                if (!exists) {
                    synapses.push(new Synapse(b1, b2));
                }
            }
        }
    }
}

function spawnPulses() {
    if (Math.random() < config.pulseFrequency && synapses.length > 0) {
        const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push(new Pulse(randomSynapse));
    }
}

function clearCanvas() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    ctx.fillStyle = config.bgColor;
    ctx.fillRect(0, 0, width, height);
}

function animate() {
    if (!isPaused) {
        // Semi-transparent fill for trail effect (optional, but clean clear is better for this style)
        // ctx.fillStyle = 'rgba(5, 7, 15, 0.1)';
        // ctx.fillRect(0, 0, width, height);
        
        // We redraw the background fully to keep lines crisp, but we could use trails.
        // For this simulation, let's keep the background static and redraw elements.
        ctx.fillStyle = config.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Draw Neurons
        neurons.forEach(n => n.draw());

        // Update and Draw Branches
        branches.forEach(b => {
            b.update();
            b.draw();
        });

        // Check for new synapses
        checkSynapses();

        // Update and Draw Synapses
        synapses.forEach(s => {
            s.update();
            s.draw();
        });

        // Spawn and Update Pulses
        spawnPulses();
        pulses.forEach(p => p.update());
        pulses = pulses.filter(p => p.active);
        pulses.forEach(p => p.draw());
    }

    animationId = requestAnimationFrame(animate);
}

// --- GUI Setup ---
function setupGUI() {
    const gui = new dat.GUI();
    
    const folderGrowth = gui.addFolder('Growth');
    folderGrowth.add(config, 'neuronCount', 1, 10, 1).name('Neuron Count').onChange(init);
    folderGrowth.add(config, 'growthSpeed', 0.1, 5.0).name('Growth Speed');
    folderGrowth.add(config, 'maxDepth', 1, 10, 1).name('Max Depth');
    folderGrowth.add(config, 'splitChance', 0, 1).name('Split Chance');
    folderGrowth.add(config, 'curvature', 0, 2).name('Curvature');
    folderGrowth.add(config, 'maxLength', 50, 300).name('Max Length');
    folderGrowth.open();

    const folderSynapses = gui.addFolder('Synapses');
    folderSynapses.add(config, 'synapseThreshold', 10, 100).name('Distance Threshold');
    folderSynapses.add(config, 'synapseGlow', 0, 30).name('Glow Strength');
    folderSynapses.open();

    const folderPulses = gui.addFolder('Pulses');
    folderPulses.add(config, 'pulseSpeed', 0.001, 0.1).name('Speed');
    folderPulses.add(config, 'pulseFrequency', 0.001, 0.1).name('Frequency');
    folderPulses.add(config, 'pulseBrightness', 0.1, 2.0).name('Brightness');
    folderPulses.open();

    const folderVisuals = gui.addFolder('Visuals');
    folderVisuals.addColor(config, 'bgColor').name('Background').onChange(v => {
        document.body.style.backgroundColor = v;
        config.bgColor = v;
    });
    folderVisuals.addColor(config, 'branchColor').name('Branch Color');
    folderVisuals.addColor(config, 'accentColor').name('Accent Branch');
    folderVisuals.addColor(config, 'synapseColor').name('Synapse Color');
    folderVisuals.addColor(config, 'pulseColor').name('Pulse Color');
    folderVisuals.open();

    const folderActions = gui.addFolder('Actions');
    folderActions.add(config, 'regenerate').name('Regenerate Network');
    folderActions.add(config, 'clear').name('Clear Canvas');
    folderActions.add(config, 'pause').name('Pause/Resume');
    folderActions.open();
}

// --- Initialization ---
window.onload = () => {
    setupGUI();
    init();
    animate();
};

</script>
</body>
</html>
