<!-- Self-contained Todo App: HTML + CSS + JS in a single file, no external dependencies -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .app {
    background: #ffffff;
    width: 100%;
    max-width: 500px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    padding: 24px;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #2c3e50;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  #todo-input {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #d0d4d9;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #todo-input:focus {
    border-color: #4a90d9;
  }

  #add-btn {
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #4a90d9;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #add-btn:hover {
    background: #3a78b8;
  }

  .filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .filter-btn {
    padding: 6px 14px;
    font-size: 0.9rem;
    border: 1px solid #d0d4d9;
    border-radius: 20px;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover {
    border-color: #4a90d9;
    color: #4a90d9;
  }

  .filter-btn.active {
    background: #4a90d9;
    border-color: #4a90d9;
    color: #fff;
  }

  #todo-list {
    list-style: none;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #eef0f2;
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #4a90d9;
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #9aa0a6;
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: #c0c4c9;
    font-size: 1rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    color: #e74c3c;
    background: #fdecea;
  }

  .empty-state {
    text-align: center;
    color: #9aa0a6;
    padding: 24px 0;
    font-size: 0.95rem;
  }

  .footer {
    margin-top: 16px;
    text-align: center;
    font-size: 0.85rem;
    color: #7a828a;
  }

  @media (max-width: 480px) {
    body {
      padding: 20px 10px;
    }

    .app {
      padding: 16px;
    }

    h1 {
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Todo App</h1>

    <div class="add-row">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-btn" type="button">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" type="button" data-filter="all">All</button>
      <button class="filter-btn" type="button" data-filter="active">Active</button>
      <button class="filter-btn" type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <div class="empty-state" id="empty-state" hidden>No todos here</div>

    <div class="footer" id="footer">0 items left</div>
  </div>

<script>
  const STORAGE_KEY = 'todos';

  let todos = loadTodos();
  let currentFilter = 'all';

  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const listEl = document.getElementById('todo-list');
  const emptyStateEl = document.getElementById('empty-state');
  const footerEl = document.getElementById('footer');
  const filterBtns = document.querySelectorAll('.filter-btn');

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (t) {
        return t && typeof t.text === 'string' && typeof t.completed === 'boolean';
      });
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    todos.push({
      id: Date.now() + Math.random().toString(16).slice(2),
      text: text,
      completed: false
    });
    inputEl.value = '';
    saveTodos();
    render();
    inputEl.focus();
  }

  function toggleTodo(id) {
    const todo = todos.find(function (t) { return t.id === id; });
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function getFilteredTodos() {
    if (currentFilter === 'active') {
      return todos.filter(function (t) { return !t.completed; });
    }
    if (currentFilter === 'completed') {
      return todos.filter(function (t) { return t.completed; });
    }
    return todos;
  }

  function render() {
    listEl.innerHTML = '';

    const visible = getFilteredTodos();

    visible.forEach(function (todo) {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.completed ? ' completed' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.addEventListener('change', function () {
        toggleTodo(todo.id);
      });

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = todo.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', 'Delete todo');
      deleteBtn.addEventListener('click', function () {
        deleteTodo(todo.id);
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      listEl.appendChild(li);
    });

    emptyStateEl.hidden = visible.length > 0;

    const remaining = todos.filter(function (t) { return !t.completed; }).length;
    footerEl.textContent = remaining + (remaining === 1 ? ' item left' : ' items left');
  }

  addBtn.addEventListener('click', addTodo);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      addTodo();
    }
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentFilter = btn.dataset.filter;
      filterBtns.forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      render();
    });
  });

  render();
</script>
</body>
</html>
