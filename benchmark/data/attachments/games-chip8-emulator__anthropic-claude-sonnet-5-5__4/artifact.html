<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CHIP-8 Emulator</title>
<style>
body{background:#111;color:#ddd;font:14px monospace;margin:10px}
h1{font-size:18px;margin:0 0 8px}
#wrap{display:flex;flex-wrap:wrap;gap:16px}
canvas{width:640px;height:320px;background:#000;image-rendering:pixelated;border:2px solid #4a4}
button,input,select{font:inherit;margin:2px}
button{background:#262;color:#fff;border:1px solid #4a4;padding:4px 10px;cursor:pointer}
button:hover{background:#383}
.pad{display:grid;grid-template-columns:repeat(4,56px);gap:4px;margin-top:6px}
.pad div{background:#333;border:1px solid #666;text-align:center;padding:6px 0;user-select:none;cursor:pointer}
.pad div.on{background:#4a4;color:#000}
.pad small{display:block;color:#9a9}
#dbg{min-width:300px}
#regs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
#regs span{background:#222;padding:2px 4px}
#cur{color:#ff8;margin:6px 0}
#beep{display:inline-block;width:10px;height:10px;background:#333;border-radius:5px}
#beep.on{background:#f55}
</style></head><body>
<h1>CHIP-8 Emulator</h1>
<div id="wrap">
<div>
<canvas id="scr" width="64" height="32"></canvas>
<div>
<button id="run">Run</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button>
Speed: <input type="range" id="ipf" min="1" max="50" value="10"> <span id="ipfv">10</span> instr/frame
</div>
<div>ROM: <input type="file" id="file"> <button id="demo">Load demo ROM</button> Sound <span id="beep"></span></div>
<div id="status"></div>
<div>Keypad (click or use keyboard):</div>
<div class="pad" id="pad"></div>
</div>
<div id="dbg">
<b>Debugger</b>
<div id="regs"></div>
<div id="misc"></div>
<div id="cur"></div>
<div id="stack"></div>
</div>
</div>
<script>
const DEMO=[0x6A,0x1E,0x6B,0x0E,0xA2,0x36,0xDA,0xB8,0x6C,0x02,0xFC,0x15,0xFD,0x07,0x3D,0x00,0x12,0x0C,0xDA,0xB8,
0x60,0x04,0xE0,0xA1,0x7A,0xFF,0x60,0x06,0xE0,0xA1,0x7A,0x01,0x60,0x02,0xE0,0xA1,0x7B,0xFF,0x60,0x08,0xE0,0xA1,0x7B,0x01,
0x6E,0x3F,0x8A,0xE2,0x6E,0x1F,0x8B,0xE2,0x12,0x06,0x3C,0x42,0xA5,0x81,0xA5,0x99,0x42,0x3C];
// demo: smiley moves with keys 4(left) 6(right) 2(up) 8(down)
const FONT=[0xF0,0x90,0x90,0x90,0xF0,0x20,0x60,0x20,0x20,0x70,0xF0,0x10,0xF0,0x80,0xF0,0xF0,0x10,0xF0,0x10,0xF0,
0x90,0x90,0xF0,0x10,0x10,0xF0,0x80,0xF0,0x10,0xF0,0xF0,0x80,0xF0,0x90,0xF0,0xF0,0x10,0x20,0x40,0x40,
0xF0,0x90,0xF0,0x90,0xF0,0xF0,0x90,0xF0,0x10,0xF0,0xF0,0x90,0xF0,0x90,0x90,0xE0,0x90,0xE0,0x90,0xE0,
0xF0,0x80,0x80,0x80,0xF0,0xE0,0x90,0x90,0x90,0xE0,0xF0,0x80,0xF0,0x80,0xF0,0xF0,0x80,0xF0,0x80,0x80];
const hex=(n,w)=>n.toString(16).toUpperCase().padStart(w,'0');
class Chip8{
 constructor(){this.rom=null;this.keys=new Array(16).fill(false);this.reset();}
 reset(){
  this.mem=new Uint8Array(4096);this.mem.set(FONT,0x50);
  if(this.rom)this.mem.set(this.rom,0x200);
  this.V=new Uint8Array(16);this.I=0;this.pc=0x200;this.stack=[];this.dt=0;this.st=0;
  this.fb=new Uint8Array(64*32);this.waitKey=-1;this.dirty=true;
 }
 load(b){this.rom=b;this.reset();}
 tick(){if(this.dt>0)this.dt--;if(this.st>0)this.st--;}
 fetch(){return(this.mem[this.pc&0xFFF]<<8)|this.mem[(this.pc+1)&0xFFF];}
 step(){
  const op=this.fetch();
  if(this.waitKey>=0){ // FX0A: wait for key press+release
   const k=this.keys.indexOf(true);
   if(this.waitKey===99){ if(k>=0)this.waitKey=k; return;}
   if(this.keys[this.waitKey])return;
   this.V[(op>>8)&15]=this.waitKey;this.waitKey=-1;this.pc+=2;return;
  }
  this.pc=(this.pc+2)&0xFFF;
  const x=(op>>8)&15,y=(op>>4)&15,n=op&15,nn=op&255,nnn=op&0xFFF,V=this.V;
  switch(op>>12){
  case 0:
   if(op===0x00E0){this.fb.fill(0);this.dirty=true;}
   else if(op===0x00EE){if(!this.stack.length)throw"Stack underflow";this.pc=this.stack.pop();}
   else throw"Unsupported SYS "+hex(op,4);
   break;
  case 1:this.pc=nnn;break;
  case 2:if(this.stack.length>=16)throw"Stack overflow";this.stack.push(this.pc);this.pc=nnn;break;
  case 3:if(V[x]===nn)this.pc+=2;break;
  case 4:if(V[x]!==nn)this.pc+=2;break;
  case 5:if(n===0){if(V[x]===V[y])this.pc+=2;}else throw"Bad opcode "+hex(op,4);break;
  case 6:V[x]=nn;break;
  case 7:V[x]=V[x]+nn;break;
  case 8:{
   const a=V[x],b=V[y];let r,f;
   switch(n){
   case 0:V[x]=b;break;
   case 1:V[x]=a|b;V[15]=0;break;
   case 2:V[x]=a&b;V[15]=0;break;
   case 3:V[x]=a^b;V[15]=0;break;
   case 4:r=a+b;V[x]=r;V[15]=r>255?1:0;break;
   case 5:V[x]=a-b;V[15]=a>=b?1:0;break;
   case 6:V[x]=b>>1;V[15]=b&1;break;
   case 7:V[x]=b-a;V[15]=b>=a?1:0;break;
   case 14:V[x]=b<<1;V[15]=(b>>7)&1;break;
   default:throw"Bad opcode "+hex(op,4);}
   break;}
  case 9:if(n===0){if(V[x]!==V[y])this.pc+=2;}else throw"Bad opcode "+hex(op,4);break;
  case 10:this.I=nnn;break;
  case 11:this.pc=(nnn+V[0])&0xFFF;break;
  case 12:V[x]=(Math.random()*256)&nn;break;
  case 13:{
   const px=V[x]%64,py=V[y]%32;V[15]=0;
   for(let r=0;r<n;r++){
    const yy=py+r;if(yy>=32)break;
    const bits=this.mem[(this.I+r)&0xFFF];
    for(let c=0;c<8;c++){
     const xx=px+c;if(xx>=64)break;
     if(bits&(0x80>>c)){const i=yy*64+xx;if(this.fb[i])V[15]=1;this.fb[i]^=1;}
    }
   }
   this.dirty=true;break;}
  case 14:
   if(nn===0x9E){if(this.keys[V[x]&15])this.pc+=2;}
   else if(nn===0xA1){if(!this.keys[V[x]&15])this.pc+=2;}
   else throw"Bad opcode "+hex(op,4);
   break;
  case 15:
   switch(nn){
   case 0x07:V[x]=this.dt;break;
   case 0x0A:this.pc=(this.pc-2)&0xFFF;this.waitKey=99;break;
   case 0x15:this.dt=V[x];break;
   case 0x18:this.st=V[x];break;
   case 0x1E:this.I=(this.I+V[x])&0xFFFF;break;
   case 0x29:this.I=0x50+(V[x]&15)*5;break;
   case 0x33:{const v=V[x];this.mem[this.I&0xFFF]=Math.floor(v/100);this.mem[(this.I+1)&0xFFF]=Math.floor(v/10)%10;this.mem[(this.I+2)&0xFFF]=v%10;break;}
   case 0x55:for(let i=0;i<=x;i++)this.mem[(this.I+i)&0xFFF]=V[i];break;
   case 0x65:for(let i=0;i<=x;i++)V[i]=this.mem[(this.I+i)&0xFFF];break;
   default:throw"Bad opcode "+hex(op,4);}
   break;
  }
 }
 static dis(op){
  const x="V"+hex((op>>8)&15,1),y="V"+hex((op>>4)&15,1),n=hex(op&15,1),nn=hex(op&255,2),nnn=hex(op&0xFFF,3);
  switch(op>>12){
  case 0:return op===0xE0?"CLS":op===0xEE?"RET":"SYS "+nnn;
  case 1:return"JP "+nnn;case 2:return"CALL "+nnn;
  case 3:return`SE ${x}, ${nn}`;case 4:return`SNE ${x}, ${nn}`;case 5:return`SE ${x}, ${y}`;
  case 6:return`LD ${x}, ${nn}`;case 7:return`ADD ${x}, ${nn}`;
  case 8:return["LD","OR","AND","XOR","ADD","SUB","SHR","SUBN",,,,,,,"SHL"][op&15]?`${["LD","OR","AND","XOR","ADD","SUB","SHR","SUBN",,,,,,,"SHL"][op&15]} ${x}, ${y}`:"???";
  case 9:return`SNE ${x}, ${y}`;case 10:return"LD I, "+nnn;case 11:return"JP V0, "+nnn;
  case 12:return`RND ${x}, ${nn}`;case 13:return`DRW ${x}, ${y}, ${n}`;
  case 14:return(op&255)===0x9E?`SKP ${x}`:(op&255)===0xA1?`SKNP ${x}`:"???";
  case 15:return({7:`LD ${x}, DT`,0xA:`LD ${x}, K`,0x15:`LD DT, ${x}`,0x18:`LD ST, ${x}`,0x1E:`ADD I, ${x}`,0x29:`LD F, ${x}`,0x33:`LD B, ${x}`,0x55:`LD [I], ${x}`,0x65:`LD ${x}, [I]`})[op&255]||"???";
  }
 }
}
const c8=new Chip8();c8.rom=Uint8Array.from(DEMO);c8.reset();
const cv=document.getElementById('scr'),ctx=cv.getContext('2d');
let running=true,err="",ac=null,osc=null;
const $=id=>document.getElementById(id);
// keypad: layout of hex keys on 4x4 and keyboard keys
const LAY=[[1,2,3,0xC],[4,5,6,0xD],[7,8,9,0xE],[0xA,0,0xB,0xF]];
const KB=[['1','2','3','4'],['q','w','e','r'],['a','s','d','f'],['z','x','c','v']];
const kmap={};const padEls=[];
LAY.forEach((row,r)=>row.forEach((k,c)=>{
 kmap[KB[r][c]]=k;
 const d=document.createElement('div');d.innerHTML=hex(k,1)+'<small>'+KB[r][c].toUpperCase()+'</small>';
 const set=v=>{c8.keys[k]=v;d.classList.toggle('on',v);};
 d.onmousedown=e=>{e.preventDefault();set(true)};
 d.onmouseup=d.onmouseleave=()=>set(false);
 d.ontouchstart=e=>{e.preventDefault();set(true)};d.ontouchend=()=>set(false);
 padEls[k]=d;$('pad').appendChild(d);
}));
function key(e,v){
 const k=kmap[e.key.toLowerCase()];
 if(k===undefined||e.target.tagName==='INPUT'&&e.target.type!=='range')return;
 e.preventDefault();c8.keys[k]=v;padEls[k].classList.toggle('on',v);
}
addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
addEventListener('blur',()=>{c8.keys.fill(false);padEls.forEach(d=>d.classList.remove('on'));});
function draw(){
 const img=ctx.createImageData(64,32);
 for(let i=0;i<2048;i++){const o=i*4,v=c8.fb[i];img.data[o]=v?80:0;img.data[o+1]=v?255:0;img.data[o+2]=v?80:0;img.data[o+3]=255;}
 ctx.putImageData(img,0,0);c8.dirty=false;
}
function debug(){
 let h="";for(let i=0;i<16;i++)h+=`<span>V${hex(i,1)}: ${hex(c8.V[i],2)}</span>`;
 $('regs').innerHTML=h;
 $('misc').textContent=`I: ${hex(c8.I,4)}  PC: ${hex(c8.pc,4)}  DT: ${c8.dt}  ST: ${c8.st}  SP: ${c8.stack.length}`;
 const op=c8.fetch();
 $('cur').textContent=`> ${hex(c8.pc,4)}: ${hex(op,4)}  ${Chip8.dis(op)}`+(c8.waitKey>=0?"  (waiting for key)":"");
 $('stack').textContent="Stack: "+(c8.stack.length?c8.stack.map(a=>hex(a,3)).join(" "):"(empty)");
 $('status').textContent=err?"Error: "+err:running?"Running":"Paused";
 $('beep').classList.toggle('on',c8.st>0);
}
function exec(){try{c8.step();}catch(e){err=e;running=false;}}
function beep(){
 try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(c8.st>0&&!osc){osc=ac.createOscillator();osc.frequency.value=440;const g=ac.createGain();g.gain.value=0.05;osc.connect(g);g.connect(ac.destination);osc.start();}
  else if(c8.st===0&&osc){osc.stop();osc=null;}
 }catch(e){}
}
let last=0,acc=0;
function frame(t){
 acc+=t-last;last=t;if(acc>200)acc=200;
 while(acc>=1000/60){
  acc-=1000/60;
  if(running){const n=+$('ipf').value;for(let i=0;i<n&&running;i++)exec();c8.tick();}
 }
 if(c8.dirty)draw();
 beep();debug();requestAnimationFrame(frame);
}
$('ipf').oninput=()=>$('ipfv').textContent=$('ipf').value;
$('run').onclick=()=>{err="";running=true;if(ac&&ac.state==='suspended')ac.resume();};
$('pause').onclick=()=>running=false;
$('step').onclick=()=>{running=false;err="";exec();c8.tick();};
$('reset').onclick=()=>{c8.reset();err="";running=true;};
$('demo').onclick=()=>{c8.load(Uint8Array.from(DEMO));err="";running=true;};
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{
  const b=new Uint8Array(r.result);
  if(b.length>4096-0x200){err="ROM too large";return;}
  c8.load(b);err="";running=true;};
 r.readAsArrayBuffer(f);e.target.blur();
};
requestAnimationFrame(t=>{last=t;frame(t);});
</script></body></html>
