<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b5bd6">
  <title>Focus List</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f6ff;
      --surface: #ffffff;
      --text: #202136;
      --muted: #6c6d83;
      --border: #e4e5f2;
      --primary: #5b5bd6;
      --primary-dark: #4747bb;
      --primary-soft: #eeeeff;
      --danger: #c83e5b;
      --danger-soft: #fff0f3;
      --shadow: 0 18px 50px rgba(45, 45, 105, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 5% 5%, rgba(126, 109, 255, 0.15), transparent 28rem),
        radial-gradient(circle at 96% 88%, rgba(79, 191, 178, 0.13), transparent 25rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(91, 91, 214, 0.35);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(100% - 2rem, 720px);
      margin: 0 auto;
      padding: clamp(2rem, 7vw, 5.5rem) 0 2rem;
    }

    .app-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(228, 229, 242, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .app-header {
      padding: clamp(1.5rem, 5vw, 2.6rem) clamp(1.25rem, 5vw, 2.75rem) 1.5rem;
      background: linear-gradient(135deg, #5b5bd6 0%, #7877ec 100%);
      color: #ffffff;
    }

    .eyebrow {
      margin: 0 0 0.55rem;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .subtitle {
      max-width: 35rem;
      margin: 0.9rem 0 0;
      color: rgba(255, 255, 255, 0.85);
      font-size: 1rem;
      line-height: 1.5;
    }

    .content {
      padding: clamp(1.25rem, 5vw, 2.75rem);
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
    }

    .todo-input {
      min-width: 0;
      height: 3.15rem;
      padding: 0 1rem;
      color: var(--text);
      background: #fbfbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .todo-input::placeholder {
      color: #9a9bae;
    }

    .todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(91, 91, 214, 0.1);
      outline: none;
    }

    .add-button {
      min-height: 3.15rem;
      padding: 0 1.15rem;
      color: #ffffff;
      background: var(--primary);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button:hover {
      background: var(--primary-dark);
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.5rem 0 1rem;
    }

    .filters {
      display: inline-flex;
      gap: 0.3rem;
      padding: 0.25rem;
      background: #f4f4fb;
      border-radius: 10px;
    }

    .filter-button {
      padding: 0.5rem 0.7rem;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 700;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .filter-button[aria-pressed="true"] {
      color: var(--primary);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(46, 46, 101, 0.12);
    }

    .task-count {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .todo-list {
      display: grid;
      gap: 0.65rem;
      min-height: 3rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 0.9rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 13px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .todo-item:hover {
      border-color: #cbcced;
    }

    .todo-checkbox {
      width: 1.2rem;
      height: 1.2rem;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .todo-item.completed {
      background: #fcfcfe;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 0.4rem 0.55rem;
      color: var(--danger);
      background: transparent;
      border: 0;
      border-radius: 7px;
      font-size: 0.86rem;
      font-weight: 700;
      transition: background 160ms ease;
    }

    .delete-button:hover {
      background: var(--danger-soft);
    }

    .empty-state {
      margin: 0;
      padding: 2.25rem 1rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      background: #fafaff;
      border: 1px dashed #d8d9eb;
      border-radius: 13px;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.15rem;
    }

    .clear-button {
      padding: 0.55rem 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .clear-button:hover:not(:disabled) {
      color: var(--danger);
    }

    .clear-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    @media (max-width: 430px) {
      .add-form {
        grid-template-columns: 1fr;
      }

      .add-button {
        width: 100%;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="app-card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Daily clarity</p>
        <h1 id="app-title">Focus List</h1>
        <p class="subtitle">Make space for what matters, one task at a time.</p>
      </header>

      <div class="content">
        <form class="add-form" id="todo-form">
          <label class="sr-only" for="todo-input">New task</label>
          <input class="todo-input" id="todo-input" type="text" placeholder="What needs your focus?" autocomplete="off" maxlength="500">
          <button class="add-button" type="submit">Add task</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Filter tasks">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <p class="task-count" id="task-count" aria-live="polite"></p>
        </div>

        <ul class="todo-list" id="todo-list" aria-label="Tasks"></ul>
        <p class="empty-state" id="empty-state" hidden></p>

        <div class="footer">
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>
      </div>
    </section>
  </main>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    (() => {
      const STORAGE_KEY = "focus-list-todos";
      const FILTER_KEY = "focus-list-filter";
      const validFilters = ["all", "active", "completed"];

      const form = document.getElementById("todo-form");
      const input = document.getElementById("todo-input");
      const list = document.getElementById("todo-list");
      const emptyState = document.getElementById("empty-state");
      const taskCount = document.getElementById("task-count");
      const clearCompletedButton = document.getElementById("clear-completed");
      const filterButtons = Array.from(document.querySelectorAll(".filter-button"));

      let todos = loadTodos();
      let currentFilter = loadFilter();

      function loadTodos() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!Array.isArray(stored)) return [];

          return stored
            .filter((todo) => todo && typeof todo.text === "string" && typeof todo.completed === "boolean")
            .map((todo) => ({
              id: typeof todo.id === "string" ? todo.id : createId(),
              text: todo.text,
              completed: todo.completed
            }));
        } catch {
          return [];
        }
      }

      function loadFilter() {
        try {
          const stored = localStorage.getItem(FILTER_KEY);
          return validFilters.includes(stored) ? stored : "all";
        } catch {
          return "all";
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch {
          // Ignore unavailable storage.
        }
      }

      function saveFilter() {
        try {
          localStorage.setItem(FILTER_KEY, currentFilter);
        } catch {
          // Ignore unavailable storage.
        }
      }

      function createId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) {
          return crypto.randomUUID();
        }

        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function getVisibleTodos() {
        if (currentFilter === "active") {
          return todos.filter((todo) => !todo.completed);
        }

        if (currentFilter === "completed") {
          return todos.filter((todo) => todo.completed);
        }

        return todos;
      }

      function getEmptyMessage() {
        if (currentFilter === "active") {
          return "No active tasks. Enjoy the breathing room.";
        }

        if (currentFilter === "completed") {
          return "No completed tasks yet. Your progress will appear here.";
        }

        return "Your list is clear. Add a task to begin.";
      }

      function render() {
        const visibleTodos = getVisibleTodos();
        const activeCount = todos.filter((todo) => !todo.completed).length;
        const completedCount = todos.length - activeCount;

        list.replaceChildren();

        visibleTodos.forEach((todo) => {
          const item = document.createElement("li");
          item.className = `todo-item${todo.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "todo-checkbox";
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `Mark "${todo.text}" as ${todo.completed ? "active" : "completed"}`);
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute("aria-label", `Delete "${todo.text}"`);
          deleteButton.addEventListener("click", () => deleteTodo(todo.id));

          item.append(checkbox, text, deleteButton);
          list.append(item);
        });

        emptyState.textContent = getEmptyMessage();
        emptyState.hidden = visibleTodos.length !== 0;
        list.hidden = visibleTodos.length === 0;

        taskCount.textContent = activeCount === 1 ? "1 task remaining" : `${activeCount} tasks remaining`;
        clearCompletedButton.disabled = completedCount === 0;

        filterButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
      }

      function addTodo(text) {
        const cleanText = text.trim();

        if (!cleanText) {
          input.focus();
          return;
        }

        todos.unshift({
          id: createId(),
          text: cleanText,
          completed: false
        });

        saveTodos();
        render();
        input.value = "";
        input.focus();
      }

      function toggleTodo(id) {
        todos = todos.map((todo) =>
          todo.id === id ? { ...todo, completed: !todo.completed } : todo
        );
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter((todo) => todo.id !== id);
        saveTodos();
        render();
      }

      function clearCompleted() {
        todos = todos.filter((todo) => !todo.completed);
        saveTodos();
        render();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        addTodo(input.value);
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          saveFilter();
          render();
        });
      });

      clearCompletedButton.addEventListener("click", clearCompleted);

      render();
    })();
  </script>
</body>
</html>
