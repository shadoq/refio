<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        #canvas-container {
            position: relative;
            width: 800px;
            height: 800px;
        }
        
        canvas {
            display: block;
            border: 2px solid #101a3a;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        
        #gui-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" width="800" height="800"></canvas>
        <div id="gui-container"></div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION & PARAMETERS
        // ============================================
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 5,
            branchSplitChance: 0.15,
            branchCurvature: 0.3,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.5,
            
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a'
        };

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const centerX = W / 2;
        const centerY = H / 2;

        // ============================================
        // STATE
        // ============================================
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let isGrowing = true;
        let animationId = null;

        // ============================================
        // NEURON CLASS
        // ============================================
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.id = Math.random().toString(36).substr(2, 9);
            }

            grow() {
                if (!isGrowing) return;

                // Grow existing branches
                this.branches.forEach(branch => {
                    if (branch.length < config.maxBranchLength && branch.depth < config.maxBranchDepth) {
                        branch.grow();
                    }
                });

                // Check for new branches
                this.branches.forEach(branch => {
                    if (branch.active && Math.random() < config.branchSplitChance) {
                        this.splitBranch(branch);
                    }
                });

                // Remove completed branches
                this.branches = this.branches.filter(b => b.active);
            }

            splitBranch(parentBranch) {
                const tip = parentBranch.points[parentBranch.points.length - 1];
                const newBranch = new Branch(
                    tip.x,
                    tip.y,
                    parentBranch.depth + 1,
                    parentBranch.angle + (Math.random() - 0.5) * config.branchCurvature * 2,
                    parentBranch.thickness * 0.8
                );
                this.branches.push(newBranch);
            }

            draw() {
                this.branches.forEach(branch => branch.draw());
            }

            getTips() {
                const tips = [];
                this.branches.forEach(branch => {
                    if (branch.active && branch.points.length > 0) {
                        const lastPoint = branch.points[branch.points.length - 1];
                        tips.push({
                            x: lastPoint.x,
                            y: lastPoint.y,
                            neuron: this,
                            branch: branch
                        });
                    }
                });
                return tips;
            }
        }

        // ============================================
        // BRANCH CLASS
        // ============================================
        class Branch {
            constructor(x, y, depth, angle, thickness) {
                this.x = x;
                this.y = y;
                this.depth = depth;
                this.angle = angle;
                this.thickness = Math.max(0.5, thickness || (1.5 - depth * 0.2));
                this.points = [{ x, y }];
                this.length = 0;
                this.active = true;
                this.sideBranches = [];
            }

            grow() {
                const step = config.branchGrowthSpeed;
                const newX = this.x + Math.cos(this.angle) * step;
                const newY = this.y + Math.sin(this.angle) * step;

                // Add slight curvature variation
                this.angle += (Math.random() - 0.5) * config.branchCurvature * 0.5;

                this.points.push({ x: newX, y: newY });
                this.x = newX;
                this.y = newY;
                this.length += step;

                // Check if branch should end
                if (this.length >= config.maxBranchLength || 
                    this.depth >= config.maxBranchDepth ||
                    newX < 0 || newX > W || newY < 0 || newY > H) {
                    this.active = false;
                }
            }

            draw() {
                if (this.points.length < 2) return;

                ctx.save();
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Color based on depth
                if (this.depth === 0) {
                    ctx.strokeStyle = config.branchColor;
                    ctx.shadowColor = config.branchColor;
                } else {
                    ctx.strokeStyle = config.accentBranchColor;
                    ctx.shadowColor = config.accentBranchColor;
                }

                ctx.shadowBlur = 10;

                // Draw smooth curve through points
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);

                for (let i = 1; i < this.points.length - 2; i++) {
                    const xc = (this.points[i].x + this.points[i + 1].x) / 2;
                    const yc = (this.points[i].y + this.points[i + 1].y) / 2;
                    ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
                }

                if (this.points.length > 2) {
                    const last = this.points[this.points.length - 1];
                    ctx.quadraticCurveTo(
                        this.points[this.points.length - 2].x,
                        this.points[this.points.length - 2].y,
                        last.x,
                        last.y
                    );
                }

                ctx.stroke();
                ctx.restore();
            }
        }

        // ============================================
        // SYNAPSE CLASS
        // ============================================
        class Synapse {
            constructor(point1, point2, neuron1, neuron2) {
                this.point1 = point1;
                this.point2 = point2;
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.strength = 1;
                this.lastPulseTime = 0;
            }

            draw() {
                const dx = this.point2.x - this.point1.x;
                const dy = this.point2.y - this.point1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                ctx.save();
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.globalAlpha = 0.6 + Math.sin(Date.now() * 0.005) * 0.2;

                ctx.beginPath();
                ctx.moveTo(this.point1.x, this.point1.y);
                ctx.lineTo(this.point2.x, this.point2.y);
                ctx.stroke();

                // Draw connection points
                ctx.fillStyle = config.synapseColor;
                ctx.beginPath();
                ctx.arc(this.point1.x, this.point1.y, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.point2.x, this.point2.y, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            tryPulse() {
                if (isPaused) return;
                
                const now = Date.now();
                if (now - this.lastPulseTime > 1000 / config.pulseFrequency) {
                    if (Math.random() < config.pulseFrequency) {
                        pulses.push(new Pulse(this));
                        this.lastPulseTime = now;
                    }
                }
            }
        }

        // ============================================
        // PULSE CLASS
        // ============================================
        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.active = true;
            }

            update() {
                if (isPaused) return;

                this.progress += config.pulseSpeed / 
                    Math.sqrt(
                        Math.pow(this.synapse.point2.x - this.synapse.point1.x, 2) +
                        Math.pow(this.synapse.point2.y - this.synapse.point1.y, 2)
                    );

                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw() {
                const x = this.synapse.point1.x + 
                    (this.synapse.point2.x - this.synapse.point1.x) * this.progress;
                const y = this.synapse.point1.y + 
                    (this.synapse.point2.y - this.synapse.point1.y) * this.progress;

                ctx.save();
                ctx.fillStyle = config.pulseColor;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 20 * config.pulseBrightness;

                // Draw pulse as a bright dot
                const size = 2 + Math.sin(this.progress * Math.PI) * 3;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();

                // Add a glow ring
                ctx.strokeStyle = config.pulseColor;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(x, y, size + 4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // ============================================
        // SYNAPSE DETECTION
        // ============================================
        function detectSynapses() {
            const allTips = [];
            neurons.forEach(neuron => {
                allTips.push(...neuron.getTips());
            });

            for (let i = 0; i < allTips.length; i++) {
                for (let j = i + 1; j < allTips.length; j++) {
                    const tip1 = allTips[i];
                    const tip2 = allTips[j];

                    // Skip if from same neuron
                    if (tip1.neuron === tip2.neuron) continue;

                    // Check if already connected
                    const alreadyConnected = synapses.some(s =>
                        (s.point1 === tip1 && s.point2 === tip2) ||
                        (s.point1 === tip2 && s.point2 === tip1)
                    );

                    if (alreadyConnected) continue;

                    const dx = tip2.x - tip1.x;
                    const dy = tip2.y - tip1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < config.synapseDistanceThreshold) {
                        synapses.push(new Synapse(tip1, tip2, tip1.neuron, tip2.neuron));
                    }
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            neurons = [];
            synapses = [];
            pulses = [];

            // Create seed neurons near center
            const numNeurons = Math.floor(config.neuronCount);
            const spread = 80;

            for (let i = 0; i < numNeurons; i++) {
                const angle = (Math.PI * 2 * i) / numNeurons;
                const dist = Math.random() * spread;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;

                const neuron = new Neuron(x, y);
                // Create initial branch for each neuron
                const initialBranch = new Branch(x, y, 0, Math.random() * Math.PI * 2, 2);
                neuron.branches.push(initialBranch);
                neurons.push(neuron);
            }

            isGrowing = true;
        }

        // ============================================
        // RENDERING
        // ============================================
        function drawBackground() {
            // Main background
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, W, H);

            // Subtle grid/scanline effect
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;

            // Vertical lines
            for (let x = 0; x < W; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }

            // Horizontal lines
            for (let y = 0; y < H; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            ctx.restore();

            // Vignette effect
            const gradient = ctx.createRadialGradient(
                centerX, centerY, W * 0.3,
                centerX, centerY, W * 0.7
            );
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);
        }

        function animate() {
            if (!isPaused) {
                // Clear and draw background
                drawBackground();

                // Grow neurons
                if (isGrowing) {
                    neurons.forEach(neuron => neuron.grow());
                    detectSynapses();

                    // Check if growth should stop
                    const activeBranches = neurons.reduce((sum, n) => 
                        sum + n.branches.filter(b => b.active).length, 0
                    );

                    if (activeBranches === 0 || synapses.length > 50) {
                        isGrowing = false;
                    }
                }

                // Draw neurons
                neurons.forEach(neuron => neuron.draw());

                // Draw synapses
                synapses.forEach(synapse => {
                    synapse.draw();
                    synapse.tryPulse();
                });

                // Update and draw pulses
                pulses = pulses.filter(p => p.active);
                pulses.forEach(pulse => {
                    pulse.update();
                    pulse.draw();
                });
            }

            animationId = requestAnimationFrame(animate);
        }

        // ============================================
        // GUI SETUP
        // ============================================
        function setupGUI() {
            const gui = new dat.GUI({ autoPlace: false });
            document.getElementById('gui-container').appendChild(gui.domElement);

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 3, 6).step(1).name('Neuron Count');
            growthFolder.add(config, 'branchGrowthSpeed', 1, 5).name('Growth Speed');
            growthFolder.add(config, 'maxBranchDepth', 2, 8).step(1).name('Max Depth');
            growthFolder.add(config, 'branchSplitChance', 0.05, 0.3).name('Split Chance');
            growthFolder.add(config, 'branchCurvature', 0.1, 0.6).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 50, 200).name('Max Length');

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 20, 80).name('Distance Threshold');
            synapsesFolder.add(config, 'synapseGlowStrength', 5, 30).name('Glow Strength');

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 1, 8).name('Pulse Speed');
            pulsesFolder.add(config, 'pulseFrequency', 0.005, 0.05).name('Pulse Frequency');
            pulsesFolder.add(config, 'pulseBrightness', 0.5, 3).name('Pulse Brightness');

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor').name('Background');
            visualsFolder.addColor(config, 'branchColor').name('Branch Color');
            visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
            visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');

            // Buttons
            gui.add({ regenerate: () => init() }, 'regenerate').name('Regenerate Network');
            gui.add({ clear: () => { 
                neurons = [];
                synapses = [];
                pulses = [];
                drawBackground();
            } }, 'clear').name('Clear Canvas');
            gui.add({ toggle: () => { isPaused = !isPaused; } }, 'toggle').name('Pause/Resume');

            growthFolder.open();
            synapsesFolder.open();
            pulsesFolder.open();
            visualsFolder.open();
        }

        // ============================================
        // MAIN
        // ============================================
        init();
        setupGUI();
        animate();
    </script>
</body>
</html>
