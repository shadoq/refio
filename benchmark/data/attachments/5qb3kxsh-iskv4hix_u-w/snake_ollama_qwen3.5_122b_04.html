<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle - 30x30</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .menu, .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            z-index: 100;
        }

        .menu h2, .game-over h2 {
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .menu button, .game-over button {
            display: block;
            width: 250px;
            padding: 15px 20px;
            margin: 10px 0;
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .menu button:hover, .game-over button:hover {
            background: #00ff88;
            color: #1a1a2e;
        }

        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .instructions {
            color: #888;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .player-score {
            position: absolute;
            font-size: 1.2em;
            font-weight: bold;
        }

        .player1-score {
            color: #00ff88;
            top: 60px;
            left: 20px;
        }

        .player2-score {
            color: #ff6b6b;
            top: 60px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Battle 🐍</h1>
        <div class="score-display hidden" id="scoreDisplay"></div>
        <div class="player-score player1-score hidden" id="player1Score"></div>
        <div class="player-score player2-score hidden" id="player2Score"></div>
        <canvas id="gameCanvas" width="900" height="900"></canvas>
        
        <div class="menu" id="menu">
            <h2>Select Game Mode</h2>
            <button onclick="startGame('human_vs_human')">Human vs Human</button>
            <button onclick="startGame('cpu_vs_human')">CPU vs Human</button>
            <button onclick="startGame('cpu_vs_cpu')">CPU vs CPU</button>
            <p class="instructions">
                Player 1: WASD keys<br>
                Player 2: Arrow keys<br>
                Press any direction key to start
            </p>
        </div>

        <div class="game-over hidden" id="gameOver">
            <h2>Game Over!</h2>
            <p id="winnerText" style="color: #fff; margin-bottom: 20px; font-size: 1.2em;"></p>
            <button onclick="restartGame()">Play Again (Press any direction key)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const cellSize = canvas.width / gridSize;
        
        let gameMode = '';
        let gameRunning = false;
        let gameLoop = null;
        let gameSpeed = 100;

        const menu = document.getElementById('menu');
        const gameOverScreen = document.getElementById('gameOver');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const player1ScoreEl = document.getElementById('player1Score');
        const player2ScoreEl = document.getElementById('player2Score');
        const winnerText = document.getElementById('winnerText');

        class Snake {
            constructor(x, y, color, isCPU = false) {
                this.body = [{x, y}];
                this.color = color;
                this.direction = {x: 0, y: 0};
                this.nextDirection = {x: 0, y: 0};
                this.alive = true;
                this.score = 0;
                this.isCPU = isCPU;
                this.name = color === '#00ff88' ? 'Player 1' : 'Player 2';
            }

            setDirection(x, y) {
                if (this.direction.x + x === 0 && this.direction.y + y === 0) return;
                this.nextDirection = {x, y};
            }

            update() {
                if (!this.alive) return;
                
                this.direction = this.nextDirection;
                
                if (this.direction.x === 0 && this.direction.y === 0) return;

                const head = {
                    x: this.body[0].x + this.direction.x,
                    y: this.body[0].y + this.direction.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    this.alive = false;
                    return;
                }

                // Check self collision
                for (let segment of this.body) {
                    if (head.x === segment.x && head.y === segment.y) {
                        this.alive = false;
                        return;
                    }
                }

                this.body.unshift(head);
            }

            eat(food) {
                const head = {
                    x: this.body[0].x + this.direction.x,
                    y: this.body[0].y + this.direction.y
                };
                
                if (head.x === food.x && head.y === food.y) {
                    this.score++;
                    return true;
                }
                return false;
            }

            grow() {
                const tail = this.body[this.body.length - 1];
                this.body.push({...tail});
            }

            draw() {
                if (!this.alive) return;
                
                ctx.fillStyle = this.color;
                for (let i = 0; i < this.body.length; i++) {
                    const segment = this.body[i];
                    ctx.fillRect(
                        segment.x * cellSize + 1,
                        segment.y * cellSize + 1,
                        cellSize - 2,
                        cellSize - 2
                    );
                    
                    // Draw head differently
                    if (i === 0) {
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(
                            segment.x * cellSize + cellSize/2,
                            segment.y * cellSize + cellSize/2,
                            cellSize/4,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                        ctx.fillStyle = this.color;
                    }
                }
            }

            getHead() {
                return this.body[0];
            }
        }

        class Food {
            constructor() {
                this.position = this.spawn();
            }

            spawn(snakes = []) {
                let position;
                let valid = false;

                while (!valid) {
                    position = {
                        x: Math.floor(Math.random() * gridSize),
                        y: Math.floor(Math.random() * gridSize)
                    };

                    valid = true;
                    for (let snake of snakes) {
                        for (let segment of snake.body) {
                            if (position.x === segment.x && position.y === segment.y) {
                                valid = false;
                                break;
                            }
                        }
                        if (!valid) break;
                    }
                }

                return position;
            }

            draw() {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(
                    this.position.x * cellSize + cellSize/2,
                    this.position.y * cellSize + cellSize/2,
                    cellSize/2 - 4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
        }

        class CPUController {
            constructor(snake) {
                this.snake = snake;
            }

            update() {
                if (!this.snake.alive) return;

                const head = this.snake.getHead();
                const food = game.food.position;

                // Simple AI: move towards food while avoiding obstacles
                const possibleMoves = [
                    {x: 0, y: -1}, // up
                    {x: 0, y: 1},  // down
                    {x: -1, y: 0}, // left
                    {x: 1, y: 0}   // right
                ];

                // Filter out moves that would cause immediate death
                const safeMoves = possibleMoves.filter(move => {
                    // Can't reverse direction
                    if (move.x + this.snake.direction.x === 0 && move.y + this.snake.direction.y === 0) {
                        return false;
                    }

                    const newX = head.x + move.x;
                    const newY = head.y + move.y;

                    // Check wall collision
                    if (newX < 0 || newX >= gridSize || newY < 0 || newY >= gridSize) {
                        return false;
                    }

                    // Check self collision
                    for (let segment of this.snake.body) {
                        if (newX === segment.x && newY === segment.y) {
                            return false;
                        }
                    }

                    // Check other snake collision
                    for (let otherSnake of game.snakes) {
                        if (otherSnake !== this.snake && otherSnake.alive) {
                            for (let segment of otherSnake.body) {
                                if (newX === segment.x && newY === segment.y) {
                                    return false;
                                }
                            }
                        }
                    }

                    return true;
                });

                if (safeMoves.length === 0) return;

                // Sort moves by distance to food
                safeMoves.sort((a, b) => {
                    const distA = Math.abs(head.x + a.x - food.x) + Math.abs(head.y + a.y - food.y);
                    const distB = Math.abs(head.x + b.x - food.x) + Math.abs(head.y + b.y - food.y);
                    return distA - distB;
                });

                // Pick the best move
                this.snake.setDirection(safeMoves[0].x, safeMoves[0].y);
            }
        }

        class Game {
            constructor(mode) {
                this.mode = mode;
                this.snakes = [];
                this.food = null;
                this.gameOver = false;

                this.init();
            }

            init() {
                // Create snakes based on game mode
                if (this.mode === 'human_vs_human' || this.mode === 'cpu_vs_human') {
                    this.snakes.push(new Snake(5, 15, '#00ff88', false)); // Player 1
                    this.snakes.push(new Snake(24, 15, '#ff6b6b', this.mode === 'cpu_vs_human')); // Player 2
                } else if (this.mode === 'cpu_vs_cpu') {
                    this.snakes.push(new Snake(5, 15, '#00ff88', true)); // CPU 1
                    this.snakes.push(new Snake(24, 15, '#ff6b6b', true)); // CPU 2
                }

                this.food = new Food();
                this.cpuControllers = this.snakes
                    .filter(snake => snake.isCPU)
                    .map(snake => new CPUController(snake));

                // Set initial directions
                this.snakes[0].setDirection(1, 0);
                if (this.snakes[1]) {
                    this.snakes[1].setDirection(-1, 0);
                }

                this.updateUI();
            }

            update() {
                if (this.gameOver) return;

                // Update CPU snakes
                for (let controller of this.cpuControllers) {
                    controller.update();
                }

                // Update all snakes
                for (let snake of this.snakes) {
                    snake.update();
                }

                // Check food consumption
                for (let snake of this.snakes) {
                    if (snake.alive && snake.eat(this.food)) {
                        snake.grow();
                        this.food = new Food(this.snakes);
                    }
                }

                // Check collisions between snakes
                for (let i = 0; i < this.snakes.length; i++) {
                    const snake1 = this.snakes[i];
                    if (!snake1.alive) continue;

                    for (let j = 0; j < this.snakes.length; j++) {
                        if (i === j) continue;
                        const snake2 = this.snakes[j];
                        if (!snake2.alive) continue;

                        const head1 = snake1.getHead();
                        for (let segment of snake2.body) {
                            if (head1.x === segment.x && head1.y === segment.y) {
                                snake1.alive = false;
                            }
                        }
                    }
                }

                // Check game over
                const aliveSnakes = this.snakes.filter(s => s.alive);
                if (aliveSnakes.length === 0) {
                    this.endGame('Draw!');
                } else if (aliveSnakes.length === 1 && this.snakes.length > 1) {
                    this.endGame(aliveSnakes[0].name + ' Wins!');
                }
            }

            draw() {
                // Clear canvas
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw grid
                ctx.strokeStyle = '#2a2a4e';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= gridSize; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellSize, 0);
                    ctx.lineTo(i * cellSize, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * cellSize);
                    ctx.lineTo(canvas.width, i * cellSize);
                    ctx.stroke();
                }

                // Draw food
                this.food.draw();

                // Draw snakes
                for (let snake of this.snakes) {
                    snake.draw();
                }
            }

            updateUI() {
                if (this.mode === 'human_vs_human' || this.mode === 'cpu_vs_human') {
                    player1ScoreEl.textContent = `P1: ${this.snakes[0].score}`;
                    player1ScoreEl.classList.remove('hidden');
                    
                    if (this.snakes[1]) {
                        player2ScoreEl.textContent = `P2: ${this.snakes[1].score}`;
                        player2ScoreEl.classList.remove('hidden');
                    }
                }
            }

            endGame(winner) {
                this.gameOver = true;
                winnerText.textContent = winner;
                gameOverScreen.classList.remove('hidden');
            }
        }

        let game = null;

        function startGame(mode) {
            gameMode = mode;
            menu.classList.add('hidden');
            scoreDisplay.classList.remove('hidden');
            
            if (mode === 'human_vs_human' || mode === 'cpu_vs_human') {
                player1ScoreEl.classList.remove('hidden');
                player2ScoreEl.classList.remove('hidden');
            }

            game = new Game(mode);
            gameRunning = true;
            
            gameLoop = setInterval(() => {
                game.update();
                game.draw();
                game.updateUI();
            }, gameSpeed);
        }

        function restartGame() {
            clearInterval(gameLoop);
            gameRunning = false;
            gameOverScreen.classList.add('hidden');
            player1ScoreEl.classList.add('hidden');
            player2ScoreEl.classList.add('hidden');
            scoreDisplay.classList.add('hidden');
            menu.classList.remove('hidden');
            game = null;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && !game) {
                // Start game on first key press if in menu
                if (menu.classList.contains('hidden') === false) {
                    return;
                }
            }

            if (!game || !gameRunning) return;

            switch(e.key) {
                case 'w':
                case 'W':
                    game.snakes[0].setDirection(0, -1);
                    break;
                case 's':
                case 'S':
                    game.snakes[0].setDirection(0, 1);
                    break;
                case 'a':
                case 'A':
                    game.snakes[0].setDirection(-1, 0);
                    break;
                case 'd':
                case 'D':
                    game.snakes[0].setDirection(1, 0);
                    break;
                case 'ArrowUp':
                    if (game.snakes[1] && !game.snakes[1].isCPU) {
                        game.snakes[1].setDirection(0, -1);
                    }
                    break;
                case 'ArrowDown':
                    if (game.snakes[1] && !game.snakes[1].isCPU) {
                        game.snakes[1].setDirection(0, 1);
                    }
                    break;
                case 'ArrowLeft':
                    if (game.snakes[1] && !game.snakes[1].isCPU) {
                        game.snakes[1].setDirection(-1, 0);
                    }
                    break;
                case 'ArrowRight':
                    if (game.snakes[1] && !game.snakes[1].isCPU) {
                        game.snakes[1].setDirection(1, 0);
                    }
                    break;
            }

            // Restart on any direction key if game is over
            if (game.gameOver && ['w','s','a','d','W','S','A','D','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                restartGame();
            }
        });

        // Initial draw
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
