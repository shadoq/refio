<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Input area */
    .input-area {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .toggle-all-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      color: #ccc;
      transition: color 0.2s;
      flex-shrink: 0;
      line-height: 1;
      padding: 2px;
    }

    .toggle-all-btn:hover,
    .toggle-all-btn.active {
      color: #764ba2;
    }

    #new-todo {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.1rem;
      color: #333;
      background: transparent;
      caret-color: #764ba2;
    }

    #new-todo::placeholder {
      color: #bbb;
      font-style: italic;
    }

    /* Todo list */
    #todo-list {
      list-style: none;
      max-height: 420px;
      overflow-y: auto;
    }

    #todo-list::-webkit-scrollbar {
      width: 6px;
    }

    #todo-list::-webkit-scrollbar-track {
      background: #f9f9f9;
    }

    #todo-list::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 3px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #f5f5f5;
      gap: 14px;
      animation: slideIn 0.25s ease;
      transition: background 0.15s;
    }

    .todo-item:hover {
      background: #fafafa;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom checkbox */
    .todo-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #ddd;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .todo-checkbox:checked {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .todo-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 3px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .todo-checkbox:hover:not(:checked) {
      border-color: #764ba2;
    }

    /* Todo text */
    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
      line-height: 1.4;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #bbb;
    }

    /* Delete button */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ddd;
      font-size: 1.3rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
      opacity: 0;
    }

    .todo-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #e74c3c;
      background: #ffeaea;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
      flex-wrap: wrap;
      gap: 10px;
    }

    .items-left {
      font-size: 0.85rem;
      color: #999;
      min-width: 80px;
    }

    /* Filter buttons */
    .filters {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: #764ba2;
      color: #764ba2;
    }

    .filter-btn.active {
      border-color: #764ba2;
      color: #764ba2;
      font-weight: 600;
    }

    /* Clear completed */
    .clear-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      color: #bbb;
      cursor: pointer;
      transition: color 0.2s;
      min-width: 80px;
      text-align: right;
    }

    .clear-btn:hover {
      color: #e74c3c;
    }

    .clear-btn:disabled {
      opacity: 0;
      pointer-events: none;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #ccc;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>todos</h1>
    <div class="card">
      <div class="input-area">
        <button class="toggle-all-btn" id="toggle-all" title="Mark all complete">❯</button>
        <input
          type="text"
          id="new-todo"
          placeholder="What needs to be done?"
          autocomplete="off"
          autofocus
        />
      </div>

      <ul id="todo-list"></ul>

      <div class="footer" id="footer" style="display:none;">
        <span class="items-left" id="items-left">0 items left</span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="clear-btn" id="clear-completed">Clear completed</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = 'todos_app_v1';

      // State
      let todos = [];
      let filter = 'all';

      // DOM refs
      const newTodoInput = document.getElementById('new-todo');
      const todoList = document.getElementById('todo-list');
      const footer = document.getElementById('footer');
      const itemsLeft = document.getElementById('items-left');
      const clearBtn = document.getElementById('clear-completed');
      const toggleAllBtn = document.getElementById('toggle-all');
      const filterBtns = document.querySelectorAll('.filter-btn');

      // Load from localStorage
      function load() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          todos = stored ? JSON.parse(stored) : [];
        } catch {
          todos = [];
        }
      }

      // Save to localStorage
      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      // Generate unique id
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      // Render
      function render() {
        const filtered = todos.filter(todo => {
          if (filter === 'active') return !todo.completed;
          if (filter === 'completed') return todo.completed;
          return true;
        });

        todoList.innerHTML = '';

        if (filtered.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.innerHTML = `
            <div class="icon">${filter === 'completed' ? '🎉' : filter === 'active' ? '✅' : '📝'}</div>
            <p>${
              filter === 'completed'
                ? 'No completed todos yet'
                : filter === 'active'
                ? 'No active todos!'
                : 'Add your first todo above'
            }</p>
          `;
          todoList.appendChild(empty);
        } else {
          filtered.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'todo-item' + (todo.completed ? ' completed' : '');
            li.dataset.id = todo.id;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'todo-checkbox';
            checkbox.checked = todo.completed;
            checkbox.addEventListener('change', () => toggleTodo(todo.id));

            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '&#x2715;';
            delBtn.title = 'Delete todo';
            delBtn.addEventListener('click', () => deleteTodo(todo.id));

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(delBtn);
            todoList.appendChild(li);
          });
        }

        // Footer
        const activeCount = todos.filter(t => !t.completed).length;
        const completedCount = todos.filter(t => t.completed).length;

        footer.style.display = todos.length > 0 ? 'flex' : 'none';
        itemsLeft.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
        clearBtn.disabled = completedCount === 0;

        // Toggle all button
        const allCompleted = todos.length > 0 && todos.every(t => t.completed);
        toggleAllBtn.classList.toggle('active', allCompleted);
      }

      // Add todo
      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        todos.push({ id: uid(), text: trimmed, completed: false });
        save();
        render();
      }

      // Toggle todo
      function toggleTodo(id) {
        todos = todos.map(t =>
          t.id === id ? { ...t, completed: !t.completed } : t
        );
        save();
        render();
      }

      // Delete todo
      function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        save();
        render();
      }

      // Toggle all
      function toggleAll() {
        const allCompleted = todos.every(t => t.completed);
        todos = todos.map(t => ({ ...t, completed: !allCompleted }));
        save();
        render();
      }

      // Clear completed
      function clearCompleted() {
        todos = todos.filter(t => !t.completed);
        save();
        render();
      }

      // Set filter
      function setFilter(f) {
        filter = f;
        filterBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === f);
        });
        render();
      }

      // Event listeners
      newTodoInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          addTodo(newTodoInput.value);
          newTodoInput.value = '';
        }
      });

      toggleAllBtn.addEventListener('click', toggleAll);
      clearBtn.addEventListener('click', clearCompleted);

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      // Init
      load();
      render();
    })();
  </script>
</body>
</html>
