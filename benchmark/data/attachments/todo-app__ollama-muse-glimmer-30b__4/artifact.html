<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;background:#f5f7fb;color:#1f2937;display:flex;justify-content:center;padding:40px 16px}
.container{width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}
header{padding:24px 24px 16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
header h1{font-size:22px;font-weight:700}
.input-row{display:flex;gap:8px;padding:16px 24px;border-bottom:1px solid #eee}
input[type=text]{flex:1;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none}
input[type=text]:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
button.add{background:#6366f1;color:#fff;border:none;padding:0 18px;border-radius:10px;font-weight:600;cursor:pointer}
button.add:hover{background:#5458e3}
.filters{display:flex;gap:6px;padding:12px 24px;background:#fafafa;border-bottom:1px solid #eee}
.filters button{background:none;border:none;padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer;color:#4b5563}
.filters button.active{background:#eef2ff;color:#3730a3;font-weight:600}
.list{list-style:none;padding:0}
.todo{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid #f3f4f6}
.todo:last-child{border-bottom:none}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:#6366f1;cursor:pointer}
.todo-text{flex:1;font-size:15px;word-break:break-word}
.todo.completed .todo-text{text-decoration:line-through;color:#9ca3af}
.delete{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px;line-height:1}
.delete:hover{color:#ef4444}
.empty{padding:40px;text-align:center;color:#9ca3af;font-size:14px}
footer{padding:12px 24px;font-size:12px;color:#9ca3af;text-align:center}
</style>
</head>
<body>
<div class="container">
<header><h1>Todo App</h1></header>
<div class="input-row">
<input id="newTodo" type="text" placeholder="Add a new task..." />
<button class="add" id="addBtn">Add</button>
</div>
<div class="filters">
<button data-filter="all" class="active">All</button>
<button data-filter="active">Active</button>
<button data-filter="completed">Completed</button>
</div>
<ul id="list" class="list"></ul>
<div id="empty" class="empty" style="display:none">No tasks yet. Add one above.</div>
<footer>Persisted in localStorage</footer>
</div>
<script>
const STORAGE_KEY='todo_app_v1';
let todos = [];
let filter = 'all';

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const inputEl = document.getElementById('newTodo');
const addBtn = document.getElementById('addBtn');

function load(){
  try{ todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch{ todos=[]; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

function render(){
  listEl.innerHTML='';
  const filtered = todos.filter(t=>{
    if(filter==='active') return !t.done;
    if(filter==='completed') return t.done;
    return true;
  });
  if(filtered.length===0){
    emptyEl.style.display='block';
  }else{
    emptyEl.style.display='none';
    filtered.forEach(t=>{
      const li=document.createElement('li');
      li.className='todo'+(t.done?' completed':'');
      li.innerHTML=`
        <input type="checkbox" ${t.done?'checked':''} data-id="${t.id}">
        <span class="todo-text">${escapeHtml(t.text)}</span>
        <button class="delete" data-id="${t.id}" aria-label="Delete">✕</button>
      `;
      listEl.appendChild(li);
    });
  }
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

function addTodo(text){
  text=text.trim();
  if(!text) return;
  todos.unshift({id:Date.now(),text,done:false});
  save(); render();
}
addBtn.addEventListener('click',()=>{ addTodo(inputEl.value); inputEl.value=''; inputEl.focus(); });
inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ addTodo(inputEl.value); inputEl.value=''; } });

listEl.addEventListener('click',e=>{
  const id = Number(e.target.dataset.id);
  if(!id) return;
  if(e.target.type==='checkbox'){
    const t = todos.find(x=>x.id===id);
    if(t){ t.done=!t.done; save(); render(); }
  }else if(e.target.classList.contains('delete')){
    todos = todos.filter(x=>x.id!==id);
    save(); render();
  }
});

document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

load(); render();
</script>
</body>
</html>
