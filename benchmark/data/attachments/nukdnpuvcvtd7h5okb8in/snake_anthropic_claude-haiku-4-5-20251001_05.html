<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 2.5em;
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .info-panel {
            display: flex;
            gap: 40px;
            color: white;
            font-size: 1.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid white;
        }

        .mode-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid white;
        }

        #startMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-content {
            text-align: center;
            color: white;
        }

        .menu-content h2 {
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .game-over-content {
            text-align: center;
            color: white;
        }

        .game-over-content h2 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .game-over-content p {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .game-over-content .final-scores {
            font-size: 1.3em;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 5px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .hidden {
            display: none !important;
        }

        .controls-info {
            color: white;
            text-align: center;
            font-size: 0.9em;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="startMenu">
        <div class="menu-content">
            <h2>🐍 SNAKE GAME 🐍</h2>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="startGame('human-human')">Human vs Human</button>
                <button class="menu-btn" onclick="startGame('human-cpu')">Human vs CPU</button>
                <button class="menu-btn" onclick="startGame('cpu-cpu')">CPU vs CPU</button>
            </div>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="game-over-content">
            <h2>GAME OVER</h2>
            <p id="gameOverMessage"></p>
            <div class="final-scores" id="finalScores"></div>
            <button class="restart-btn" onclick="showMenu()">Return to Menu</button>
            <p style="margin-top: 20px; font-size: 0.9em;">Press SPACE to restart</p>
        </div>
    </div>

    <div class="container">
        <h1>🐍 SNAKE GAME 🐍</h1>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="info-panel">
            <div class="score-box">
                <span id="scoreDisplay">Score: 0</span>
            </div>
            <div class="mode-box">
                <span id="modeDisplay">Mode: -</span>
            </div>
        </div>
        <div class="controls-info">
            <p>Player 1: Arrow Keys | Player 2: WASD</p>
            <p>Press SPACE to restart after game over</p>
        </div>
    </div>

    <script>
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const GAME_SPEED = 100;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            mode: null,
            running: false,
            gameOver: false,
            snake1: [],
            snake2: [],
            food: null,
            score1: 0,
            score2: 0,
            direction1: { x: 1, y: 0 },
            direction2: { x: -1, y: 0 },
            nextDirection1: { x: 1, y: 0 },
            nextDirection2: { x: -1, y: 0 }
        };

        let gameLoopInterval = null;

        function initializeGame() {
            gameState.snake1 = [
                { x: 5, y: 15 },
                { x: 4, y: 15 },
                { x: 3, y: 15 }
            ];
            gameState.snake2 = [
                { x: 25, y: 15 },
                { x: 26, y: 15 },
                { x: 27, y: 15 }
            ];
            gameState.direction1 = { x: 1, y: 0 };
            gameState.direction2 = { x: -1, y: 0 };
            gameState.nextDirection1 = { x: 1, y: 0 };
            gameState.nextDirection2 = { x: -1, y: 0 };
            gameState.score1 = 0;
            gameState.score2 = 0;
            gameState.running = true;
            gameState.gameOver = false;
            spawnFood();
        }

        function spawnFood() {
            let newFood;
            let valid = false;
            while (!valid) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = !isPositionOccupied(newFood);
            }
            gameState.food = newFood;
        }

        function isPositionOccupied(pos) {
            return gameState.snake1.some(s => s.x === pos.x && s.y === pos.y) ||
                   gameState.snake2.some(s => s.x === pos.x && s.y === pos.y);
        }

        function moveSnake(snakeIndex) {
            const snake = snakeIndex === 1 ? gameState.snake1 : gameState.snake2;
            const direction = snakeIndex === 1 ? gameState.direction1 : gameState.direction2;
            const nextDirection = snakeIndex === 1 ? gameState.nextDirection1 : gameState.nextDirection2;

            gameState['direction' + snakeIndex] = nextDirection;

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                endGame(snakeIndex === 1 ? 2 : 1);
                return;
            }

            if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                endGame(snakeIndex === 1 ? 2 : 1);
                return;
            }

            if (gameState.mode !== 'cpu-cpu' && snakeIndex === 2) {
                if (gameState.snake1.some(s => s.x === newHead.x && s.y === newHead.y)) {
                    endGame(1);
                    return;
                }
            } else if (gameState.mode !== 'cpu-cpu' && snakeIndex === 1) {
                if (gameState.snake2.some(s => s.x === newHead.x && s.y === newHead.y)) {
                    endGame(2);
                    return;
                }
            }

            snake.unshift(newHead);

            if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
                if (snakeIndex === 1) {
                    gameState.score1 += 10;
                } else {
                    gameState.score2 += 10;
                }
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function endGame(winner) {
            gameState.running = false;
            gameState.gameOver = true;
            clearInterval(gameLoopInterval);

            let message = '';
            if (gameState.mode === 'human-human') {
                message = winner === 1 ? 'Player 1 Wins!' : 'Player 2 Wins!';
            } else if (gameState.mode === 'human-cpu') {
                message = winner === 1 ? 'You Win!' : 'CPU Wins!';
            } else if (gameState.mode === 'cpu-cpu') {
                message = winner === 1 ? 'CPU 1 Wins!' : 'CPU 2 Wins!';
            }

            document.getElementById('gameOverMessage').textContent = message;
            document.getElementById('finalScores').innerHTML = 
                `<div>Player 1 Score: ${gameState.score1}</div><div>Player 2 Score: ${gameState.score2}</div>`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function findPathToFood(snake) {
            const head = snake[0];
            const food = gameState.food;

            const directions = [
                { x: 1, y: 0 },
                { x: -1, y: 0 },
                { x: 0, y: 1 },
                { x: 0, y: -1 }
            ];

            let bestDirection = directions[0];
            let bestDistance = Math.abs(head.x - food.x) + Math.abs(head.y - food.y);

            for (let dir of directions) {
                const newPos = { x: head.x + dir.x, y: head.y + dir.y };

                if (newPos.x < 0 || newPos.x >= GRID_SIZE || newPos.y < 0 || newPos.y >= GRID_SIZE) {
                    continue;
                }

                if (snake.some(s => s.x === newPos.x && s.y === newPos.y)) {
                    continue;
                }

                const distance = Math.abs(newPos.x - food.x) + Math.abs(newPos.y - food.y);

                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestDirection = dir;
                }
            }

            return bestDirection;
        }

        function updateCPU() {
            if (gameState.mode === 'human-cpu' || gameState.mode === 'cpu-cpu') {
                const cpuSnakeIndex = gameState.mode === 'human-cpu' ? 2 : 2;
                const cpuDirection = findPathToFood(gameState.snake2);
                gameState.nextDirection2 = cpuDirection;
            }

            if (gameState.mode === 'cpu-cpu') {
                const cpuDirection = findPathToFood(gameState.snake1);
                gameState.nextDirection1 = cpuDirection;
            }
        }

        function gameLoop() {
            if (!gameState.running) return;

            updateCPU();
            moveSnake(1);
            if (gameState.running) moveSnake(2);

            draw();
            updateUI();
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff6b6b';
            gameState.snake1.forEach((segment, index) => {
                ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                if (index === 0) {
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(segment.x * CELL_SIZE + 3, segment.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
                    ctx.fillStyle = '#ff6b6b';
                }
            });

            ctx.fillStyle = '#4ecdc4';
            gameState.snake2.forEach((segment, index) => {
                ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                if (index === 0) {
                    ctx.fillStyle = '#2ba89f';
                    ctx.fillRect(segment.x * CELL_SIZE + 3, segment.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6);
                    ctx.fillStyle = '#4ecdc4';
                }
            });

            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.arc(gameState.food.x * CELL_SIZE + CELL_SIZE / 2, gameState.food.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = `Score: P1: ${gameState.score1} | P2: ${gameState.score2}`;
            
            let modeText = '';
            if (gameState.mode === 'human-human') modeText = 'Human vs Human';
            else if (gameState.mode === 'human-cpu') modeText = 'Human vs CPU';
            else if (gameState.mode === 'cpu-cpu') modeText = 'CPU vs CPU';
            
            document.getElementById('modeDisplay').textContent = `Mode: ${modeText}`;
        }

        function startGame(mode) {
            gameState.mode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            initializeGame();
            draw();
            updateUI();

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function showMenu() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameState.running = false;
            document.getElementById('startMenu').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }

        document.addEventListener('keydown', (e) => {
            if (!gameState.running && !gameState.gameOver) return;

            if (gameState.gameOver && e.code === 'Space') {
                e.preventDefault();
                showMenu();
                return;
            }

            if (!gameState.running) return;

            const key = e.key.toLowerCase();

            if (gameState.mode === 'human-human' || gameState.mode === 'human-cpu') {
                if (e.key === 'ArrowUp' && gameState.direction1.y === 0) {
                    gameState.nextDirection1 = { x: 0, y: -1 };
                    e.preventDefault();
                } else if (e.key === 'ArrowDown' && gameState.direction1.y === 0) {
                    gameState.nextDirection1 = { x: 0, y: 1 };
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft' && gameState.direction1.x === 0) {
                    gameState.nextDirection1 = { x: -1, y: 0 };
                    e.preventDefault();
                } else if (e.key === 'ArrowRight' && gameState.direction1.x === 0) {
                    gameState.nextDirection1 = { x: 1, y: 0 };
                    e.preventDefault();
                }
            }

            if (gameState.mode === 'human-human') {
                if (key === 'w' && gameState.direction2.y === 0) {
                    gameState.nextDirection2 = { x: 0, y: -1 };
                    e.preventDefault();
                } else if (key === 's' && gameState.direction2.y === 0) {
                    gameState.nextDirection2 = { x: 0, y: 1 };
                    e.preventDefault();
                } else if (key === 'a' && gameState.direction2.x === 0) {
                    gameState.nextDirection2 = { x: -1, y: 0 };
                    e.preventDefault();
                } else if (key === 'd' && gameState.direction2.x === 0) {
                    gameState.nextDirection2 = { x: 1, y: 0 };
                    e.preventDefault();
                }
            }
        });

        window.addEventListener('load', () => {
            document.getElementById('startMenu').classList.remove('hidden');
        });
    </script>
</body>
</html>
