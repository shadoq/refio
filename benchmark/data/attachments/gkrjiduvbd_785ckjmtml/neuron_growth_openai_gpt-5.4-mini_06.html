<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Neuron Growth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 26, 58, 0.35), transparent 60%);
      pointer-events: none;
    }
    canvas {
      width: 800px;
      height: 800px;
      image-rendering: auto;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.12);
    }
  </style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const P = {
    neuronCount: 4,
    growthSpeed: 0.9,
    maxDepth: 6,
    splitChance: 0.18,
    curvature: 0.28,
    maxLength: 92,
    synapseDistance: 52,
    synapseGlow: 1.25,
    pulseSpeed: 0.35,
    pulseFrequency: 0.6,
    pulseBrightness: 1.2,
    background: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    regenerate() { init(); },
    clearCanvas() { clearOnly = true; },
    pauseResume() { paused = !paused; }
  };
  const gui = new dat.GUI();
  const g1 = gui.addFolder('Growth'), g2 = gui.addFolder('Synapses'), g3 = gui.addFolder('Pulses'), g4 = gui.addFolder('Visuals');
  g1.add(P, 'neuronCount', 3, 6, 1);
  g1.add(P, 'growthSpeed', 0.2, 2, 0.01);
  g1.add(P, 'maxDepth', 2, 8, 1);
  g1.add(P, 'splitChance', 0, 0.5, 0.01);
  g1.add(P, 'curvature', 0, 0.8, 0.01);
  g1.add(P, 'maxLength', 30, 160, 1);
  g2.add(P, 'synapseDistance', 20, 120, 1);
  g2.add(P, 'synapseGlow', 0.2, 3, 0.01);
  g3.add(P, 'pulseSpeed', 0.05, 1.2, 0.01);
  g3.add(P, 'pulseFrequency', 0.1, 2, 0.01);
  g3.add(P, 'pulseBrightness', 0.2, 3, 0.01);
  g4.addColor(P, 'background');
  g4.addColor(P, 'branchColor');
  g4.addColor(P, 'accentColor');
  g4.addColor(P, 'synapseColor');
  g4.addColor(P, 'pulseColor');
  g4.add(P, 'regenerate');
  g4.add(P, 'clearCanvas');
  g4.add(P, 'pauseResume');
  [g1, g2, g3, g4].forEach(f => f.open());

  let branches, synapses, pulses, clearOnly = false, paused = false, t = 0;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hexToRgb = h => {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const rgba = (hex, a) => `rgba(${hexToRgb(hex).join(',')},${a})`;
  const dist2 = (a, b) => {
    const dx = a.x - b.x, dy = a.y - b.y;
    return dx * dx + dy * dy;
  };

  function makeBranch(root, angle, depth, parent = null) {
    return {
      root, parent, x: root.x, y: root.y, px: root.x, py: root.y,
      angle, targetAngle: angle, depth, len: 0,
      maxLen: rnd(P.maxLength * 0.45, P.maxLength * (1 - depth * 0.08)),
      width: clamp(4 - depth * 0.45 + rnd(-0.5, 0.5), 0.7, 4),
      points: [{ x: root.x, y: root.y }],
      children: [],
      done: false
    };
  }

  function spawnChildren(b) {
    if (b.depth >= P.maxDepth) return;
    const count = Math.random() < P.splitChance ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const a = b.angle + rnd(-0.95, 0.95);
      const child = makeBranch({ x: b.x, y: b.y }, a, b.depth + 1, b);
      b.children.push(child);
      branches.push(child);
    }
  }

  function init() {
    branches = [];
    synapses = [];
    pulses = [];
    clearOnly = false;
    const cx = 400, cy = 400;
    for (let i = 0; i < P.neuronCount; i++) {
      const a = (Math.PI * 2 * i) / P.neuronCount + rnd(-0.5, 0.5);
      const r = rnd(0, 85);
      const root = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
      const b = makeBranch(root, rnd(0, Math.PI * 2), 0);
      branches.push(b);
    }
  }

  function stepGrowth() {
    const active = branches.filter(b => !b.done);
    for (const b of active) {
      const jitter = rnd(-P.curvature, P.curvature);
      b.targetAngle += jitter * 0.08;
      b.angle += (b.targetAngle - b.angle) * 0.08;
      const sp = P.growthSpeed * rnd(0.8, 1.2);
      const nx = b.x + Math.cos(b.angle) * sp, ny = b.y + Math.sin(b.angle) * sp;
      b.px = b.x; b.py = b.y; b.x = nx; b.y = ny;
      b.len += sp;
      b.points.push({ x: nx, y: ny });
      if (b.points.length > 30) b.points.shift();
      if (Math.random() < 0.008) spawnChildren(b);
      if (b.len >= b.maxLen) {
        b.done = true;
        spawnChildren(b);
      }
    }
  }

  function detectSynapses() {
    const tips = branches.filter(b => b.done || b.children.length === 0);
    const th = P.synapseDistance * P.synapseDistance;
    for (let i = 0; i < tips.length; i++) {
      for (let j = i + 1; j < tips.length; j++) {
        if (dist2(tips[i], tips[j]) < th) {
          const key = tips[i]._id + ':' + tips[j]._id;
          if (!synapses.some(s => s.key === key)) {
            synapses.push({ a: tips[i], b: tips[j], key, phase: Math.random() * Math.PI * 2 });
          }
        }
      }
    }
  }

  function addPulse() {
    if (synapses.length && Math.random() < P.pulseFrequency * 0.06) {
      const s = synapses[(Math.random() * synapses.length) | 0];
      pulses.push({ s, u: 0, dir: Math.random() < 0.5 ? 1 : -1 });
    }
  }

  function assignIds() {
    branches.forEach((b, i) => b._id = i);
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 800; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 800); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke();
    }
  }

  function drawBranch(b) {
    const pts = b.points;
    if (pts.length < 2) return;
    ctx.strokeStyle = b.depth % 3 === 0 ? P.accentColor : P.branchColor;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 14 - b.depth * 1.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = b.width;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) * 0.5, my = (pts[i].y + pts[i + 1].y) * 0.5;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const p = pts[pts.length - 1];
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawSynapse(s) {
    const a = s.a, b = s.b, p = (Math.sin(t * 0.004 + s.phase) * 0.5 + 0.5) * P.synapseGlow;
    ctx.strokeStyle = rgba(P.synapseColor, 0.25 + p * 0.35);
    ctx.shadowColor = P.synapseColor;
    ctx.shadowBlur = 18 * P.synapseGlow;
    ctx.lineWidth = 1.2 + p;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    ctx.shadowColor = P.pulseColor;
    ctx.strokeStyle = rgba(P.pulseColor, 0.85);
    ctx.lineWidth = 2;
    const u = (Math.sin(t * 0.001 * P.pulseSpeed + s.phase) * 0.5 + 0.5);
    const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u;
    ctx.beginPath();
    ctx.arc(x, y, 2.2 + p * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(P.pulseColor, 0.8 * P.pulseBrightness);
    ctx.fill();
  }

  function drawOverlay() {
    const g = ctx.createRadialGradient(400, 400, 200, 400, 400, 480);
    g.addColorStop(0, 'rgba(16, 26, 58, 0.02)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 800, 800);
    ctx.fillStyle = 'rgba(0, 229, 255, 0.05)';
    for (let y = 0; y < 800; y += 3) ctx.fillRect(0, y, 800, 1);
  }

  function render() {
    ctx.fillStyle = P.background;
    ctx.fillRect(0, 0, 800, 800);
    if (!clearOnly) {
      drawGrid();
      for (const b of branches) drawBranch(b);
      for (const s of synapses) drawSynapse(s);
      drawOverlay();
    }
  }

  function loop(ts) {
    t = ts;
    if (!paused && !clearOnly) {
      stepGrowth();
      assignIds();
      detectSynapses();
      addPulse();
      pulses = pulses.filter(p => (p.u += 0.012 * P.pulseSpeed) < 1);
    }
    render();
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
