<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 {
      text-align: center;
    }
    .todo-input {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    #new-todo {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
    }
    #add-btn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
    }
    #todo-list {
      list-style: none;
      padding: 0;
    }
    #todo-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem;
      border-bottom: 1px solid #ddd;
    }
    #todo-list li.completed span {
      text-decoration: line-through;
      color: #777;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #c00;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .filters {
      text-align: center;
      margin-top: 1rem;
    }
    .filter {
      margin: 0 0.5rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f9f9f9;
    }
    .filter.selected {
      background: #ddd;
    }
  </style>
</head>
<body>
  <h1>Todo App</h1>
  <div class="todo-input">
    <input id="new-todo" placeholder="What needs to be done?" autocomplete="off" />
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
  <div class="filters">
    <button data-filter="all" class="filter selected">All</button>
    <button data-filter="active" class="filter">Active</button>
    <button data-filter="completed" class="filter">Completed</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const STORAGE_KEY = 'todos';
      let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let currentFilter = 'all';

      const todoListEl = document.getElementById('todo-list');
      const newTodoInput = document.getElementById('new-todo');
      const addBtn = document.getElementById('add-btn');
      const filterButtons = document.querySelectorAll('.filter');

      const saveTodos = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));

      const render = () => {
        todoListEl.innerHTML = '';
        const filtered = todos.filter(todo => {
          if (currentFilter === 'active') return !todo.completed;
          if (currentFilter === 'completed') return todo.completed;
          return true;
        });
        filtered.forEach(todo => {
          const li = document.createElement('li');
          li.dataset.id = todo.id;
          if (todo.completed) li.classList.add('completed');

          const leftDiv = document.createElement('div');
          leftDiv.style.display = 'flex';
          leftDiv.style.alignItems = 'center';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.style.marginRight = '0.5rem';

          const span = document.createElement('span');
          span.textContent = todo.text;

          leftDiv.appendChild(checkbox);
          leftDiv.appendChild(span);

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = '✕';
          delBtn.title = 'Delete';

          li.appendChild(leftDiv);
          li.appendChild(delBtn);
          todoListEl.appendChild(li);
        });
      };

      const addTodo = text => {
        const todo = { id: Date.now().toString(), text, completed: false };
        todos.push(todo);
        saveTodos();
        render();
      };

      const toggleTodo = id => {
        const todo = todos.find(t => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          saveTodos();
          render();
        }
      };

      const deleteTodo = id => {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        render();
      };

      const setFilter = filter => {
        currentFilter = filter;
        filterButtons.forEach(btn => {
          btn.classList.toggle('selected', btn.dataset.filter === filter);
        });
        render();
      };

      addBtn.addEventListener('click', () => {
        const text = newTodoInput.value.trim();
        if (text) {
          addTodo(text);
          newTodoInput.value = '';
        }
      });

      newTodoInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addBtn.click();
        }
      });

      todoListEl.addEventListener('change', e => {
        if (e.target.type === 'checkbox') {
          const li = e.target.closest('li');
          toggleTodo(li.dataset.id);
        }
      });

      todoListEl.addEventListener('click', e => {
        if (e.target.classList.contains('delete-btn')) {
          const li = e.target.closest('li');
          deleteTodo(li.dataset.id);
        }
      });

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      render();
    });
  </script>
</body>
</html>
