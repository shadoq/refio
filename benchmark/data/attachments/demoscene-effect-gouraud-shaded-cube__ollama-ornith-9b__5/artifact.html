<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gouraud-Shaded Rotating Cube</title>
<style>
  body { margin: 0; background: #111; overflow: hidden; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace;
    font-size: 14px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">FPS: <span id="fps">0</span> | Press W to toggle wireframe, P to pause</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// ---- 3D math helpers ----
const M = {
  // rotation around Y axis (spin)
  rotY: (a) => ({
    cos: Math.cos(a), sin: Math.sin(a),
    m: [[1, 0, 0], [0, a.cos, -a.sin], [0, a.sin, a.cos]]
  }),
  // rotation around X axis (tilt)
  rotX: (a) => ({
    cos: Math.cos(a), sin: Math.sin(a),
    m: [[a.cos, 0, a.sin], [0, 1, 0], [-a.sin, 0, a.cos]]
  }),
  // perspective projection
  project: (v, fov, near, far) => {
    const scale = fov / (fov + v.z * near);
    return { x: v.x * scale, y: v.y * scale, z: v.z * scale, scale };
  }
};

// ---- cube geometry ----
const cubeSize = 100;
const cubeVerts = [
  [-cubeSize/2, -cubeSize/2, -cubeSize/2],  // 0  front-bottom-left
  [cubeSize/2, -cubeSize/2, -cubeSize/2],   // 1  front-bottom-right
  [cubeSize/2, cubeSize/2, -cubeSize/2],    // 2  front-top-right
  [-cubeSize/2, cubeSize/2, -cubeSize/2],   // 3  front-top-left
  [-cubeSize/2, -cubeSize/2, cubeSize/2],   // 4  back-bottom-left
  [cubeSize/2, -cubeSize/2, cubeSize/2],    // 5  back-bottom-right
  [cubeSize/2, cubeSize/2, cubeSize/2],     // 6  back-top-right
  [-cubeSize/2, cubeSize/2, cubeSize/2],    // 7  back-top-left
];

const cubeTriangles = [
  [0,1,2], [0,2,3], // front
  [5,4,7], [5,7,6], // back
  [3,0,1], [3,1,5], [3,5,6], [3,6,7], // right
  [4,0,3], [4,3,7], [4,7,5], [4,5,1], // left
  [1,2,6], [1,6,5], [2,7,3], [2,3,0]  // top
];

const numVerts = cubeVerts.length;
const numTris = cubeTriangles.length;

// per-vertex normal
const norms = [];
for (let i = 0; i < numVerts; i++) {
  norms.push([0,0,0]);
}
// compute normals from triangles sharing each vertex
for (let t = 0; t < numTris; t++) {
  const [a, b, c] = cubeTriangles[t];
  // cross product of (B-A) x (C-A)
  const ax = cubeVerts[a][0], ay = cubeVerts[a][1], az = cubeVerts[a][2];
  const bx = cubeVerts[b][0], by = cubeVerts[b][1], bz = cubeVerts[b][2];
  const cx = cubeVerts[c][0], cy = cubeVerts[c][1], cz = cubeVerts[c][2];
  const nx = (by-ay)*(cz-az) - (bz-az)*(cy-ay);
  const ny = (bx-ax)*(cz-az) - (bz-az)*(cx-ax);
  const nz = (bx-ax)*(cy-ay) - (by-ay)*(cx-ax);
  norms[a][0] += nx; norms[a][1] += ny; norms[a][2] += nz;
  norms[b][0] += nx; norms[b][1] += ny; norms[b][2] += nz;
  norms[c][0] += nx; norms[c][1] += ny; norms[c][2] += nz;
}
// normalize
for (let i = 0; i < numVerts; i++) {
  const n = norms[i];
  const len = Math.sqrt(n[0]*n[0] + n[1]*n[1] + n[2]*n[2]);
  n[0] /= len; n[1] /= len; n[2] /= len;
}

// ---- lighting / colors ----
let lightDir = [-0.5, -0.7, -0.3];
let lightColor = [0.8, 0.9, 1.0];

function applyLighting(pos, norm) {
  // dot product of normal with light direction
  const d = norm[0]*lightDir[0] + norm[1]*lightDir[1] + norm[2]*lightDir[2];
  const ambient = 0.2;
  const diffuse = Math.max(0, d);
  const intensity = ambient + diffuse * 0.8;
  return [
    lightColor[0] * intensity,
    lightColor[1] * intensity,
    lightColor[2] * intensity
  ];
}

// ---- state ----
let rotY = 0, rotX = 0;
let paused = false;
let wireframe = false;
let fps = 0, frameCount = 0, lastFpsTime = 0;
let animId = null;

function animate(timestamp) {
  animId = requestAnimationFrame(animate);
  const dt = timestamp - lastFpsTime;
  lastFpsTime = timestamp;
  frameCount++;
  if (dt >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = timestamp;
    fpsEl.textContent = fps;
  }

  if (!paused) {
    rotY += 0.01;
    rotX += 0.005;
  }

  // clear
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // project vertices
  const fov = 400, near = 0.1;
  const projVerts = [];
  for (let i = 0; i < numVerts; i++) {
    const v = cubeVerts[i];
    // rotate around Y
    const ry = M.rotY(rotY);
    const x1 = v[0] * ry.m[0][0] + v[1] * ry.m[0][1] + v[2] * ry.m[0][2];
    const y1 = v[0] * ry.m[1][0] + v[1] * ry.m[1][1] + v[2] * ry.m[1][2];
    const z1 = v[0] * ry.m[2][0] + v[1] * ry.m[2][1] + v[2] * ry.m[2][2];
    // rotate around X
    const rx = M.rotX(rotX);
    const x2 = x1 * rx.m[0][0] + y1 * rx.m[0][1] + z1 * rx.m[0][2];
    const y2 = x1 * rx.m[1][0] + y1 * rx.m[1][1] + z1 * rx.m[1][2];
    const z2 = x1 * rx.m[2][0] + y1 * rx.m[2][1] + z1 * rx.m[2][2];
    const p = M.project({ x: x2, y: y2, z: z2 }, fov, near, 1000);
    projVerts.push({ x: p.x, y: p.y, scale: p.scale, nx: norms[i][0], ny: norms[i][1], nz: norms[i][2] });
  }

  // render triangles
  for (let t = 0; t < numTris; t++) {
    const [a, b, c] = cubeTriangles[t];
    const [va, vb, vc] = [projVerts[a], projVerts[b], projVerts[c]];
    const [na, nb, nc] = [projVerts[a].nx, projVerts[a].ny, projVerts[a].nz],
          [projVerts[b].nx, projVerts[b].ny, projVerts[b].nz],
          [projVerts[c].nx, projVerts[c].ny, projVerts[c].nz];

    // backface culling: compute signed area in screen space
    const crossX = (vb.x - va.x) * (vc.y - va.y) - (vb.y - va.y) * (vc.x - va.x);
    if (crossX < 0) continue; // backface

    // Gouraud shading: interpolate colors across each triangle
    const ca = applyLighting([va.x, va.y, va.z], [na, nb, nc]);
    const cb = applyLighting([vb.x, vb.y, vb.z], [nb, nb, nc]);
    const cc = applyLighting([vc.x, vc.y, vc.z], [nc, nb, nc]);

    const w = canvas.width, h = canvas.height;
    // rasterize triangle with barycentric interpolation
    ctx.beginPath();
    ctx.moveTo(va.x, va.y);
    ctx.lineTo(vb.x, vb.y);
    ctx.lineTo(vc.x, vc.y);
    ctx.closePath();

    // scanline fill with color interpolation
    const yMin = Math.max(0, Math.floor(Math.min(va.y, vb.y, vc.y)));
    const yMax = Math.min(h, Math.ceil(Math.max(va.y, vb.y, vc.y)));
    for (let y = yMin; y < yMax; y++) {
      // compute left and right edges
      const left = Math.min(va.x, vb.x, vc.x);
      const right = Math.max(va.x, vb.x, vc.x);
      // use a simple approach: fill between edges
      // find intersection of scanline with each edge
      const edges = [[va, vb], [vb, vc], [vc, va]];
      const edgeX = [];
      for (const [e1, e2] of edges) {
        const dy = e2.y - e1.y;
        if (Math.abs(dy) < 0.1) continue;
        const t = (y - e1.y) / dy;
        const x = e1.x + t * (e2.x - e1.x);
        if (x > left) {
          left = x;
          // interpolate colors
          const r = e1.r + t * (e2.r - e1.r);
          const g = e1.g + t * (e2.g - e1.g);
          const b = e1.b + t * (e2.b - e1.b);
          edgeX.push({ x, r, g, b });
        }
      }
      // simple approach: just draw a filled triangle with interpolated gradient
      // For performance, use a simpler Gouraud approach: sample 3 points and interpolate
      // Instead, let's do a true rasterization with barycentric coords
      // For now, use a simpler method: draw filled path and use a gradient
      // Actually, let's implement proper rasterization:
      // We'll compute the three edge equations and find intersections
      
      // For each scanline, find left and right intersection points
      let leftX = -Infinity, rightX = Infinity;
      let leftR, leftG, leftB, rightR, rightG, rightB;
      
      // edge equations: for edge from P1 to P2
      // x = P1.x + t*(P2.x - P1.x), y = P1.y + t*(P2.y - P1.y)
      // t = (y - P1.y) / (P2.y - P1.y)
      // x(t) = P1.x + (y - P1.y)/(P2.y - P1.y) * (P2.x - P1.x)
      
      for (let i = 0; i < 3; i++) {
        const e1 = edges[i][0], e2 = edges[i][1];
        const dy = e2.y - e1.y;
        if (Math.abs(dy) < 0.001) continue;
        const t = (y - e1.y) / dy;
        const x = e1.x + t * (e2.x - e1.x);
        if (x >= leftX) {
          leftX = x;
          leftR = e1.r + t * (e2.r - e1.r);
          leftG = e1.g + t * (e2.g - e1.g);
          leftB = e1.b + t * (e2.b - e1.b);
        }
        if (x <= rightX) {
          rightX = x;
          rightR = e1.r + t * (e2.r - e1.r);
          rightG = e1.g + t * (e2.g - e1.g);
          rightB = e1.b + t * (e2.b - e1.b);
        }
      }
      
      for (let x = Math.ceil(leftX); x < Math.floor(rightX); x++) {
        // interpolate color along scanline
        const t = (x - leftX) / (rightX - leftX);
        const r = leftR + t * (rightR - leftR);
        const g = leftG + t * (rightG - leftG);
        const b = leftB + t * (rightB - leftB);
        ctx.fillStyle = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  // wireframe overlay
  if (wireframe) {
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < numVerts; i++) {
      const v = projVerts[i];
      if (i === 0) ctx.moveTo(v.x, v.y);
      else ctx.lineTo(v.x, v.y);
    }
    ctx.closePath();
    ctx.stroke();
  }
}

requestAnimationFrame(animate);
</script>
</body>
</html>
