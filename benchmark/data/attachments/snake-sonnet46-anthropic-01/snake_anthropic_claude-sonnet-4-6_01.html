<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  #gameContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #scoreBoard {
    display: flex;
    gap: 40px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
  }

  .score-value {
    font-size: 28px;
    font-weight: 700;
  }

  #score1 { color: #00e676; }
  #score2 { color: #ff6b6b; }

  #canvasWrapper {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 230, 118, 0.15), 0 0 80px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.08);
  }

  #gameCanvas {
    display: block;
    background: #0d0d1a;
  }

  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 15, 0.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 24px;
    backdrop-filter: blur(4px);
  }

  #overlay h1 {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00e676, #00bcd4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    margin-bottom: 8px;
  }

  #overlay h2 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  #overlay p {
    font-size: 14px;
    opacity: 0.6;
    letter-spacing: 1px;
  }

  .mode-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 280px;
  }

  .mode-btn {
    padding: 14px 24px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }

  .mode-btn:hover, .mode-btn.selected {
    background: rgba(0, 230, 118, 0.15);
    border-color: #00e676;
    color: #00e676;
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
  }

  .start-btn {
    padding: 16px 48px;
    background: linear-gradient(135deg, #00e676, #00bcd4);
    border: none;
    color: #0a0a0f;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 8px;
    text-transform: uppercase;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
  }

  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 230, 118, 0.4);
  }

  .result-scores {
    display: flex;
    gap: 40px;
    margin: 8px 0;
  }

  .result-score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .result-score-item .label {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .result-score-item .value {
    font-size: 36px;
    font-weight: 700;
  }

  .winner-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 10px 24px;
    border-radius: 6px;
    text-transform: uppercase;
  }

  .winner-p1 {
    color: #00e676;
    background: rgba(0, 230, 118, 0.1);
    border: 1px solid rgba(0, 230, 118, 0.3);
  }

  .winner-p2 {
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
  }

  .winner-tie {
    color: #ffd740;
    background: rgba(255, 215, 64, 0.1);
    border: 1px solid rgba(255, 215, 64, 0.3);
  }

  .controls-hint {
    display: flex;
    gap: 32px;
    font-size: 12px;
    opacity: 0.4;
    letter-spacing: 1px;
  }

  .key-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .key-hint span:first-child {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .keys {
    display: flex;
    gap: 4px;
  }

  .key {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .death-indicator {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .dead-badge {
    background: rgba(255, 50, 50, 0.2);
    border: 1px solid rgba(255, 50, 50, 0.4);
    color: #ff5555;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="scoreBoard">
    <div class="score-item">
      <span class="score-label" id="label1">Player 1</span>
      <span class="score-value" id="score1">0</span>
    </div>
    <div class="score-item">
      <span class="score-label" id="label2">Player 2</span>
      <span class="score-value" id="score2">0</span>
    </div>
  </div>
  <div id="canvasWrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script>
(function() {
  const GRID = 30;
  const CELL = 20;
  const CANVAS_SIZE = GRID * CELL;
  const GAME_SPEED = 110; // ms per tick

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  const overlay = document.getElementById('overlay');
  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const label1El = document.getElementById('label1');
  const label2El = document.getElementById('label2');

  const DIRS = {
    UP:    { x: 0,  y: -1 },
    DOWN:  { x: 0,  y:  1 },
    LEFT:  { x: -1, y:  0 },
    RIGHT: { x: 1,  y:  0 },
  };

  const OPPOSITE = { UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT' };

  // Colors
  const COLORS = {
    snake1Head: '#00e676',
    snake1Body: '#00c853',
    snake1Dark: '#007c3a',
    snake2Head: '#ff6b6b',
    snake2Body: '#e53935',
    snake2Dark: '#8b0000',
    food: '#ffd740',
    foodGlow: '#ff8f00',
    grid: 'rgba(255,255,255,0.03)',
    bg: '#0d0d1a',
  };

  // Game state
  let gameMode = 'hvh'; // 'hvh', 'cvh', 'cvc'
  let gameState = 'menu'; // 'menu', 'playing', 'gameover'
  let gameLoop = null;
  let tickCount = 0;
  let foodPulse = 0;

  let snake1, snake2, food;
  let score1, score2;

  // Input queues
  let inputQueue1 = [];
  let inputQueue2 = [];

  // ─── Snake factory ───────────────────────────────────────────────────────────
  function createSnake(startX, startY, dir, length) {
    const body = [];
    const d = DIRS[dir];
    for (let i = 0; i < length; i++) {
      body.push({ x: startX - d.x * i, y: startY - d.y * i });
    }
    return {
      body,
      dir,
      nextDir: dir,
      alive: true,
      grew: false,
      deathReason: '',
    };
  }

  // ─── Food ────────────────────────────────────────────────────────────────────
  function spawnFood() {
    const occupied = new Set();
    snake1.body.forEach(s => occupied.add(`${s.x},${s.y}`));
    snake2.body.forEach(s => occupied.add(`${s.x},${s.y}`));

    let pos;
    let attempts = 0;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
      attempts++;
    } while (occupied.has(`${pos.x},${pos.y}`) && attempts < 1000);
    return pos;
  }

  // ─── BFS Pathfinding ─────────────────────────────────────────────────────────
  function bfsNextDir(snake, target, otherSnake) {
    const occupied = new Set();
    const s1body = snake.body;
    const s2body = otherSnake.body;

    // Exclude tails since they'll move away (unless they just grew)
    const s1end = snake.grew ? s1body.length : s1body.length - 1;
    const s2end = otherSnake.grew ? s2body.length : s2body.length - 1;

    for (let i = 0; i < s1end; i++) occupied.add(`${s1body[i].x},${s1body[i].y}`);
    for (let i = 0; i < s2end; i++) occupied.add(`${s2body[i].x},${s2body[i].y}`);

    const head = snake.body[0];
    const queue = [{ x: head.x, y: head.y, path: [] }];
    const visited = new Set([`${head.x},${head.y}`]);

    while (queue.length > 0) {
      const curr = queue.shift();

      for (const [dirName, d] of Object.entries(DIRS)) {
        const nx = curr.x + d.x;
        const ny = curr.y + d.y;
        const key = `${nx},${ny}`;

        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
        if (occupied.has(key) || visited.has(key)) continue;

        const newPath = [...curr.path, dirName];

        if (nx === target.x && ny === target.y) {
          return newPath[0] || null;
        }

        visited.add(key);
        queue.push({ x: nx, y: ny, path: newPath });
      }
    }
    return null;
  }

  function countReachable(startX, startY, occupied) {
    const visited = new Set();
    const queue = [{ x: startX, y: startY }];
    visited.add(`${startX},${startY}`);
    let count = 0;
    while (queue.length > 0) {
      const curr = queue.shift();
      count++;
      for (const d of Object.values(DIRS)) {
        const nx = curr.x + d.x;
        const ny = curr.y + d.y;
        const key = `${nx},${ny}`;
        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
        if (occupied.has(key) || visited.has(key)) continue;
        visited.add(key);
        queue.push({ x: nx, y: ny });
      }
    }
    return count;
  }

  function getSafeDir(snake, otherSnake) {
    const head = snake.body[0];
    const occupied = new Set();
    snake.body.forEach((s, i) => { if (i > 0) occupied.add(`${s.x},${s.y}`); });
    otherSnake.body.forEach(s => occupied.add(`${s.x},${s.y}`));

    // Score each direction by reachable space
    let bestDir = null;
    let bestScore = -1;

    const dirOrder = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
    for (const dirName of dirOrder) {
      if (dirName === OPPOSITE[snake.dir]) continue;
      const d = DIRS[dirName];
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      const key = `${nx},${ny}`;
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
      if (occupied.has(key)) continue;

      const reachable = countReachable(nx, ny, occupied);
      if (reachable > bestScore) {
        bestScore = reachable;
        bestDir = dirName;
      }
    }

    return bestDir || snake.dir;
  }

  function cpuDecide(snake, otherSnake, foodPos) {
    const pathDir = bfsNextDir(snake, foodPos, otherSnake);
    if (pathDir && pathDir !== OPPOSITE[snake.dir]) {
      // Verify the path doesn't trap us in a tiny space
      const head = snake.body[0];
      const d = DIRS[pathDir];
      const nx = head.x + d.x;
      const ny = head.y + d.y;

      const occupied = new Set();
      snake.body.forEach((s, i) => { if (i > 0) occupied.add(`${s.x},${s.y}`); });
      otherSnake.body.forEach(s => occupied.add(`${s.x},${s.y}`));

      const reachable = countReachable(nx, ny, occupied);
      // Only follow path if we have enough space (at least half our body length)
      if (reachable >= Math.floor(snake.body.length / 2)) {
        return pathDir;
      }
    }
    return getSafeDir(snake, otherSnake);
  }

  // ─── Game Init ───────────────────────────────────────────────────────────────
  function initGame() {
    snake1 = createSnake(7, 15, 'RIGHT', 4);
    snake2 = createSnake(22, 15, 'LEFT', 4);
    score1 = 0;
    score2 = 0;
    inputQueue1 = [];
    inputQueue2 = [];
    tickCount = 0;
    foodPulse = 0;

    food = spawnFood();
    updateScoreDisplay();
  }

  // ─── Game Tick ───────────────────────────────────────────────────────────────
  function tick() {
    if (gameState !== 'playing') return;

    tickCount++;
    foodPulse = (foodPulse + 0.15) % (Math.PI * 2);

    // Process input queues
    if (inputQueue1.length > 0) {
      const nextDir = inputQueue1.shift();
      if (nextDir !== OPPOSITE[snake1.dir]) snake1.nextDir = nextDir;
    }
    if (inputQueue2.length > 0) {
      const nextDir = inputQueue2.shift();
      if (nextDir !== OPPOSITE[snake2.dir]) snake2.nextDir = nextDir;
    }

    // CPU decisions
    const isCPU1 = (gameMode === 'cvc') || (gameMode === 'cvh');
    const isCPU2 = (gameMode === 'cvc');

    if (isCPU1 && snake1.alive) {
      const dir = cpuDecide(snake1, snake2, food);
      snake1.nextDir = dir;
    }
    if (isCPU2 && snake2.alive) {
      const dir = cpuDecide(snake2, snake1, food);
      snake2.nextDir = dir;
    }

    // Apply directions
    if (snake1.alive) snake1.dir = snake1.nextDir;
    if (snake2.alive) snake2.dir = snake2.nextDir;

    // Move snakes
    moveSnake(snake1);
    moveSnake(snake2);

    // Check collisions
    checkCollisions();

    // Check food
    checkFood();

    // Update display
    updateScoreDisplay();
    render();

    // Check game over
    if (!snake1.alive || !snake2.alive) {
      endGame();
    }
  }

  function moveSnake(snake) {
    if (!snake.alive) return;
    const head = snake.body[0];
    const d = DIRS[snake.dir];
    const newHead = { x: head.x + d.x, y: head.y + d.y };
    snake.body.unshift(newHead);
    if (!snake.grew) {
      snake.body.pop();
    } else {
      snake.grew = false;
    }
  }

  function checkCollisions() {
    // Wall collisions
    for (const snake of [snake1, snake2]) {
      if (!snake.alive) continue;
      const head = snake.body[0];
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        snake.alive = false;
        snake.deathReason = 'wall';
      }
    }

    // Self collision
    for (const snake of [snake1, snake2]) {
      if (!snake.alive) continue;
      const head = snake.body[0];
      for (let i = 1; i < snake.body.length; i++) {
        if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
          snake.alive = false;
          snake.deathReason = 'self';
          break;
        }
      }
    }

    // Cross collision
    if (snake1.alive && snake2.alive) {
      const h1 = snake1.body[0];
      const h2 = snake2.body[0];

      // Head vs head
      if (h1.x === h2.x && h1.y === h2.y) {
        snake1.alive = false;
        snake2.alive = false;
        snake1.deathReason = 'head-on';
        snake2.deathReason = 'head-on';
        return;
      }

      // Snake1 head vs snake2 body
      if (snake1.alive) {
        for (let i = 1; i < snake2.body.length; i++) {
          if (h1.x === snake2.body[i].x && h1.y === snake2.body[i].y) {
            snake1.alive = false;
            snake1.deathReason = 'other';
            break;
          }
        }
      }

      // Snake2 head vs snake1 body
      if (snake2.alive) {
        for (let i = 1; i < snake1.body.length; i++) {
          if (h2.x === snake1.body[i].x && h2.y === snake1.body[i].y) {
            snake2.alive = false;
            snake2.deathReason = 'other';
            break;
          }
        }
      }
    }
  }

  function checkFood() {
    const h1 = snake1.body[0];
    const h2 = snake2.body[0];

    if (snake1.alive && h1.x === food.x && h1.y === food.y) {
      snake1.grew = true;
      score1++;
      food = spawnFood();
    } else if (snake2.alive && h2.x === food.x && h2.y === food.y) {
      snake2.grew = true;
      score2++;
      food = spawnFood();
    }
  }

  // ─── Rendering ───────────────────────────────────────────────────────────────
  function render() {
    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // Grid lines
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, CANVAS_SIZE);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(CANVAS_SIZE, i * CELL);
      ctx.stroke();
    }

    // Food
    drawFood();

    // Snakes (draw dead one first so live one appears on top)
    if (!snake1.alive && snake2.alive) {
      drawSnake(snake1, COLORS.snake1Head, COLORS.snake1Body, COLORS.snake1Dark);
      drawSnake(snake2, COLORS.snake2Head, COLORS.snake2Body, COLORS.snake2Dark);
    } else {
      drawSnake(snake2, COLORS.snake2Head, COLORS.snake2Body, COLORS.snake2Dark);
      drawSnake(snake1, COLORS.snake1Head, COLORS.snake1Body, COLORS.snake1Dark);
    }
  }

  function drawFood() {
    const x = food.x * CELL + CELL / 2;
    const y = food.y * CELL + CELL / 2;
    const pulse = 0.85 + Math.sin(foodPulse) * 0.15;
    const r = (CELL / 2 - 2) * pulse;

    // Outer glow
    const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
    grd.addColorStop(0, 'rgba(255, 215, 64, 0.25)');
    grd.addColorStop(1, 'rgba(255, 215, 64, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Food circle
    const foodGrd = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
    foodGrd.addColorStop(0, '#ffe57f');
    foodGrd.addColorStop(1, '#ff8f00');
    ctx.fillStyle = foodGrd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake(snake, headColor, bodyColor, darkColor) {
    if (snake.body.length === 0) return;

    const alpha = snake.alive ? 1 : 0.3;
    ctx.globalAlpha = alpha;

    // Draw body segments (back to front)
    for (let i = snake.body.length - 1; i >= 1; i--) {
      const seg = snake.body[i];
      const t = i / snake.body.length;
      const padding = 2 + t * 1.5;
      const radius = Math.max(2, 4 - t * 2);

      ctx.fillStyle = i % 2 === 0 ? bodyColor : darkColor;
      roundRect(
        ctx,
        seg.x * CELL + padding,
        seg.y * CELL + padding,
        CELL - padding * 2,
        CELL - padding * 2,
        radius
      );
    }

    // Draw head
    const head = snake.body[0];

    // Head glow when alive
    if (snake.alive) {
      ctx.shadowColor = headColor;
      ctx.shadowBlur = 10;
    }

    ctx.fillStyle = headColor;
    roundRect(ctx, head.x * CELL + 1, head.y * CELL + 1, CELL - 2, CELL - 2, 5);

    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Eyes
    drawEyes(head, snake.dir);

    ctx.globalAlpha = 1;
  }

  function drawEyes(head, dir) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const eyeR = 2.5;
    const pupilR = 1.4;

    let eye1, eye2;
    switch (dir) {
      case 'RIGHT':
        eye1 = { x: cx + 4, y: cy - 4 };
        eye2 = { x: cx + 4, y: cy + 4 };
        break;
      case 'LEFT':
        eye1 = { x: cx - 4, y: cy - 4 };
        eye2 = { x: cx - 4, y: cy + 4 };
        break;
      case 'UP':
        eye1 = { x: cx - 4, y: cy - 4 };
        eye2 = { x: cx + 4, y: cy - 4 };
        break;
      case 'DOWN':
        eye1 = { x: cx - 4, y: cy + 4 };
        eye2 = { x: cx + 4, y: cy + 4 };
        break;
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eye1.x, eye1.y, eyeR, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eye2.x, eye2.y, eyeR, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(eye1.x, eye1.y, pupilR, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eye2.x, eye2.y, pupilR, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  }

  // ─── Score Display ───────────────────────────────────────────────────────────
  function updateScoreDisplay() {
    score1El.textContent = score1;
    score2El.textContent = score2;
  }

  function setLabels() {
    if (gameMode === 'hvh') {
      label1El.textContent = 'Player 1';
      label2El.textContent = 'Player 2';
    } else if (gameMode === 'cvh') {
      label1El.textContent = 'CPU';
      label2El.textContent = 'Player';
    } else {
      label1El.textContent = 'CPU 1';
      label2El.textContent = 'CPU 2';
    }
  }

  function getNames() {
    if (gameMode === 'hvh') return ['Player 1', 'Player 2'];
    if (gameMode === 'cvh') return ['CPU', 'Player'];
    return ['CPU 1', 'CPU 2'];
  }

  // ─── Screens ─────────────────────────────────────────────────────────────────
  function showMenu() {
    gameState = 'menu';
    overlay.style.display = 'flex';

    const controlsHTML = gameMode !== 'cvc' ? `
      <div class="controls-hint">
        ${gameMode !== 'cvh' ? `
        <div class="key-hint">
          <span>Player 1</span>
          <div class="keys">
            <span class="key">W</span>
            <span class="key">A</span>
            <span class="key">S</span>
            <span class="key">D</span>
          </div>
        </div>` : ''}
        <div class="key-hint">
          <span>Player 2</span>
          <div class="keys">
            <span class="key">↑</span>
            <span class="key">←</span>
            <span class="key">↓</span>
            <span class="key">→</span>
          </div>
        </div>
      </div>
    ` : `<p style="opacity:0.4;font-size:12px;letter-spacing:1px">Watch the CPUs battle it out!</p>`;

    overlay.innerHTML = `
      <h1>🐍 Snake</h1>
      <div class="mode-buttons">
        <button class="mode-btn ${gameMode === 'hvh' ? 'selected' : ''}" data-mode="hvh">👥 Human vs Human</button>
        <button class="mode-btn ${gameMode === 'cvh' ? 'selected' : ''}" data-mode="cvh">🤖 CPU vs Human</button>
        <button class="mode-btn ${gameMode === 'cvc' ? 'selected' : ''}" data-mode="cvc">🤖 CPU vs CPU</button>
      </div>
      <button class="start-btn" id="startBtn">▶ Start Game</button>
      ${controlsHTML}
      <p>Press <strong>Enter</strong> to start</p>
    `;

    overlay.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        gameMode = btn.dataset.mode;
        overlay.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        // Re-render menu to update controls hint
        showMenu();
      });
    });

    document.getElementById('startBtn').addEventListener('click', startGame);

    renderIdle();
  }

  function renderIdle() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, CANVAS_SIZE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(CANVAS_SIZE, i * CELL); ctx.stroke();
    }
  }

  function getDeathMessage(snake, name) {
    switch (snake.deathReason) {
      case 'wall': return `${name} hit a wall`;
      case 'self': return `${name} bit itself`;
      case 'other': return `${name} collided with the other snake`;
      case 'head-on': return `Head-on collision!`;
      default: return `${name} crashed`;
    }
  }

  function showGameOver() {
    gameState = 'gameover';
    overlay.style.display = 'flex';

    const [n1, n2] = getNames();

    let winnerHTML = '';
    if (!snake1.alive && !snake2.alive) {
      winnerHTML = `<div class="winner-text winner-tie">🤝 It's a Tie!</div>`;
    } else if (snake2.alive || score1 > score2) {
      winnerHTML = `<div class="winner-text winner-p1">🏆 ${n1} Wins!</div>`;
    } else if (snake1.alive || score2 > score1) {
      winnerHTML = `<div class="winner-text winner-p2">🏆 ${n2} Wins!</div>`;
    } else {
      winnerHTML = `<div class="winner-text winner-tie">🤝 It's a Tie!</div>`;
    }

    let reason = '';
    if (!snake1.alive && !snake2.alive) {
      if (snake1.deathReason === 'head-on') {
        reason = 'Head-on collision — both snakes crashed!';
      } else {
        reason = `Both snakes crashed!`;
      }
    } else if (!snake1.alive) {
      reason = getDeathMessage(snake1, n1) + '!';
    } else {
      reason = getDeathMessage(snake2, n2) + '!';
    }

    overlay.innerHTML = `
      <h2>Game Over</h2>
      <p>${reason}</p>
      ${winnerHTML}
      <div class="result-scores">
        <div class="result-score-item">
          <span class="label" style="color:#00e676">${n1}</span>
          <span class="value" style="color:#00e676">${score1}</span>
        </div>
        <div class="result-score-item">
          <span class="label" style="color:#ff6b6b">${n2}</span>
          <span class="value" style="color:#ff6b6b">${score2}</span>
        </div>
      </div>
      <button class="start-btn" id="restartBtn">↺ Play Again</button>
      <p style="margin-top:-8px">Press <strong>Enter</strong> or <strong>Space</strong> to restart</p>
    `;

    document.getElementById('restartBtn').addEventListener('click', () => showMenu());
  }

  // ─── Game Control ────────────────────────────────────────────────────────────
  function startGame() {
    overlay.style.display = 'none';
    gameState = 'playing';
    setLabels();
    initGame();
    render();

    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(tick, GAME_SPEED);
  }

  function endGame() {
    if (gameLoop) {
      clearInterval(gameLoop);
      gameLoop = null;
    }
    render();
    setTimeout(showGameOver, 500);
  }

  // ─── Input Handling ──────────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (gameState === 'gameover' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      showMenu();
      return;
    }
    if (gameState === 'menu' && e.key === 'Enter') {
      e.preventDefault();
      startGame();
      return;
    }

    if (gameState !== 'playing') return;

    // Player 1: WASD
    const isCPU1 = (gameMode === 'cvc') || (gameMode === 'cvh');
    if (!isCPU1) {
      switch (e.key.toLowerCase()) {
        case 'w': if (inputQueue1.length < 2) inputQueue1.push('UP'); break;
        case 's': if (inputQueue1.length < 2) inputQueue1.push('DOWN'); break;
        case 'a': if (inputQueue1.length < 2) inputQueue1.push('LEFT'); break;
        case 'd': if (inputQueue1.length < 2) inputQueue1.push('RIGHT'); break;
      }
    }

    // Player 2: Arrow keys
    const isCPU2 = (gameMode === 'cvc');
    if (!isCPU2) {
      switch (e.key) {
        case 'ArrowUp':    e.preventDefault(); if (inputQueue2.length < 2) inputQueue2.push('UP'); break;
        case 'ArrowDown':  e.preventDefault(); if (inputQueue2.length < 2) inputQueue2.push('DOWN'); break;
        case 'ArrowLeft':  e.preventDefault(); if (inputQueue2.length < 2) inputQueue2.push('LEFT'); break;
        case 'ArrowRight': e.preventDefault(); if (inputQueue2.length < 2) inputQueue2.push('RIGHT'); break;
      }
    }
  });

  // ─── Boot ────────────────────────────────────────────────────────────────────
  showMenu();

})();
</script>
</body>
</html>
