<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    color: #2d3748;
  }

  .app {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  .app__header {
    padding: 28px 28px 20px;
    background: #ffffff;
    border-bottom: 1px solid #edf2f7;
  }

  .app__title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #2d3748;
    letter-spacing: -0.02em;
  }

  .app__subtitle {
    font-size: 0.85rem;
    color: #a0aec0;
    margin-top: 4px;
  }

  .todo-form {
    display: flex;
    gap: 10px;
    padding: 20px 28px;
    background: #f7fafc;
    border-bottom: 1px solid #edf2f7;
  }

  .todo-form__input {
    flex: 1;
    padding: 12px 16px;
    font-size: 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: #ffffff;
    color: #2d3748;
  }

  .todo-form__input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }

  .todo-form__input::placeholder {
    color: #a0aec0;
  }

  .todo-form__button {
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    background: #667eea;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .todo-form__button:hover {
    background: #5a67d8;
  }

  .todo-form__button:active {
    transform: scale(0.97);
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 16px 28px;
    background: #ffffff;
    border-bottom: 1px solid #edf2f7;
  }

  .filters__button {
    flex: 1;
    padding: 9px 12px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #718096;
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filters__button:hover {
    background: #edf2f7;
    color: #4a5568;
  }

  .filters__button.is-active {
    background: #667eea;
    border-color: #667eea;
    color: #ffffff;
  }

  .todo-list {
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border-bottom: 1px solid #edf2f7;
    transition: background 0.15s ease;
  }

  .todo-item:hover {
    background: #f7fafc;
  }

  .todo-item__checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #667eea;
  }

  .todo-item__text {
    flex: 1;
    font-size: 1rem;
    color: #2d3748;
    word-break: break-word;
    transition: color 0.2s ease;
  }

  .todo-item.is-completed .todo-item__text {
    text-decoration: line-through;
    color: #a0aec0;
  }

  .todo-item__delete {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    color: #cbd5e0;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .todo-item__delete:hover {
    color: #e53e3e;
    background: #fff5f5;
  }

  .empty-state {
    padding: 48px 28px;
    text-align: center;
    color: #a0aec0;
    font-size: 0.95rem;
  }

  .empty-state__icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
  }

  .app__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 28px;
    background: #f7fafc;
    border-top: 1px solid #edf2f7;
    font-size: 0.85rem;
    color: #718096;
  }

  .app__count {
    font-weight: 600;
  }

  .clear-completed {
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #718096;
    background: transparent;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .clear-completed:hover {
    color: #e53e3e;
    border-color: #feb2b2;
    background: #fff5f5;
  }

  .clear-completed:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    color: #a0aec0;
    border-color: #e2e8f0;
    background: transparent;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 8px;
    }

    .app__header,
    .todo-form,
    .filters,
    .todo-item,
    .app__footer {
      padding-left: 18px;
      padding-right: 18px;
    }

    .app__title {
      font-size: 1.35rem;
    }

    .todo-form__button {
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Todo List</h1>
      <p class="app__subtitle">Stay organized and get things done</p>
    </header>

    <form class="todo-form" id="todoForm">
      <input
        type="text"
        class="todo-form__input"
        id="todoInput"
        placeholder="What needs to be done?"
        aria-label="New todo text"
        autocomplete="off"
      >
      <button type="submit" class="todo-form__button" aria-label="Add todo">Add</button>
    </form>

    <nav class="filters" aria-label="Filter todos">
      <button type="button" class="filters__button is-active" data-filter="all" aria-label="Show all todos">All</button>
      <button type="button" class="filters__button" data-filter="active" aria-label="Show active todos">Active</button>
      <button type="button" class="filters__button" data-filter="completed" aria-label="Show completed todos">Completed</button>
    </nav>

    <ul class="todo-list" id="todoList" aria-label="Todo items"></ul>

    <footer class="app__footer">
      <span class="app__count" id="todoCount" aria-live="polite">0 items left</span>
      <button type="button" class="clear-completed" id="clearCompleted" aria-label="Clear completed todos">Clear completed</button>
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "todo-app-items";

      var form = document.getElementById("todoForm");
      var input = document.getElementById("todoInput");
      var list = document.getElementById("todoList");
      var countEl = document.getElementById("todoCount");
      var clearBtn = document.getElementById("clearCompleted");
      var filterButtons = document.querySelectorAll(".filters__button");

      var todos = [];
      var currentFilter = "all";

      function loadTodos() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              todos = parsed.filter(function (t) {
                return t && typeof t.text === "string";
              }).map(function (t) {
                return {
                  id: t.id || Date.now() + Math.random(),
                  text: t.text,
                  completed: !!t.completed
                };
              });
            }
          }
        } catch (e) {
          todos = [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          /* storage unavailable */
        }
      }

      function getFilteredTodos() {
        if (currentFilter === "active") {
          return todos.filter(function (t) { return !t.completed; });
        }
        if (currentFilter === "completed") {
          return todos.filter(function (t) { return t.completed; });
        }
        return todos;
      }

      function render() {
        var filtered = getFilteredTodos();
        list.innerHTML = "";

        if (filtered.length === 0) {
          var empty = document.createElement("li");
          empty.className = "empty-state";
          var icon = document.createElement("span");
          icon.className = "empty-state__icon";
          icon.textContent = "📝";
          var msg = document.createElement("span");
          if (todos.length === 0) {
            msg.textContent = "No todos yet. Add one above to get started!";
          } else if (currentFilter === "active") {
            msg.textContent = "No active todos. Great job!";
          } else {
            msg.textContent = "No completed todos yet.";
          }
          empty.appendChild(icon);
          empty.appendChild(msg);
          list.appendChild(empty);
        } else {
          filtered.forEach(function (todo) {
            var li = document.createElement("li");
            li.className = "todo-item" + (todo.completed ? " is-completed" : "");
            li.setAttribute("data-id", String(todo.id));

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "todo-item__checkbox";
            checkbox.checked = todo.completed;
            checkbox.setAttribute("aria-label", "Mark todo as " + (todo.completed ? "active" : "completed"));
            checkbox.addEventListener("change", function () {
              toggleTodo(todo.id);
            });

            var span = document.createElement("span");
            span.className = "todo-item__text";
            span.textContent = todo.text;

            var del = document.createElement("button");
            del.type = "button";
            del.className = "todo-item__delete";
            del.textContent = "✕";
            del.setAttribute("aria-label", "Delete todo: " + todo.text);
            del.addEventListener("click", function () {
              deleteTodo(todo.id);
            });

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(del);
            list.appendChild(li);
          });
        }

        var activeCount = todos.filter(function (t) { return !t.completed; }).length;
        countEl.textContent = activeCount + (activeCount === 1 ? " item left" : " items left");

        var completedCount = todos.length - activeCount;
        clearBtn.disabled = completedCount === 0;
      }

      function addTodo(text) {
        var trimmed = text.trim();
        if (!trimmed) return;
        todos.push({
          id: Date.now() + Math.random(),
          text: trimmed,
          completed: false
        });
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        todos = todos.map(function (t) {
          if (t.id === id) {
            return { id: t.id, text: t.text, completed: !t.completed };
          }
          return t;
        });
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter(function (t) { return t.id !== id; });
        saveTodos();
        render();
      }

      function clearCompleted() {
        todos = todos.filter(function (t) { return !t.completed; });
        saveTodos();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterButtons.forEach(function (btn) {
          var isActive = btn.getAttribute("data-filter") === filter;
          btn.classList.toggle("is-active", isActive);
          btn.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
        render();
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        addTodo(input.value);
        input.value = "";
        input.focus();
      });

      clearBtn.addEventListener("click", clearCompleted);

      filterButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setFilter(btn.getAttribute("data-filter"));
        });
      });

      loadTodos();
      setFilter("all");
    })();
  </script>
</body>
</html>
