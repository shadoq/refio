<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuron Growth Simulation</title>
<style>
  body {margin:0; background:#05070f; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;}
  canvas {background:#05070f; box-shadow:0 0 20px #101a3a; border-radius:10px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;

  const params = {
    neuronCount: 4,
    branchGrowthSpeed: 1.0,
    maxBranchDepth: 5,
    branchSplitChance: 0.3,
    branchCurvature: 0.5,
    maxBranchLength: 100,
    synapseDistanceThreshold: 20,
    synapseGlowStrength: 0.5,
    pulseSpeed: 1.0,
    pulseFrequency: 0.5,
    pulseBrightness: 1.0,
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    pause: false
  };

  let neurons = [];
  let synapses = [];
  let pulses = [];
  let tips = [];
  let animationId;
  let lastTime = 0;
  let pulseTimer = 0;
  let paused = false;
  let branchIdCounter = 0;
  function nextBranchId() { return branchIdCounter++; }

  class Branch {
    constructor(start, direction, depth, parent = null, isAccent = false) {
      this.id = nextBranchId();
      this.start = start;
      this.direction = direction;
      this.depth = depth;
      this.parent = parent;
      this.isAccent = isAccent;
      this.children = [];
      this.length = 0;
      this.targetLength = Math.random() * params.maxBranchLength + 10;
      this.thickness = Math.random() * 1.5 + 0.5;
      this.growing = true;
      this.control = {
        x: start.x + Math.cos(direction) * this.targetLength * params.branchCurvature,
        y: start.y + Math.sin(direction) * this.targetLength * params.branchCurvature
      };
    }

    end() {
      return {
        x: this.start.x + Math.cos(this.direction) * this.length,
        y: this.start.y + Math.sin(this.direction) * this.length
      };
    }

    update() {
      if (!this.growing) return;
      this.length += params.branchGrowthSpeed;
      if (this.length >= this.targetLength) {
        this.length = this.targetLength;
        this.growing = false;
        if (this.depth < params.maxBranchDepth) {
          const newDir = this.direction + (Math.random() - 0.5) * 0.5;
          const child = new Branch(this.end(), newDir, this.depth + 1, this, false);
          this.children.push(child);
          if (Math.random() < params.branchSplitChance) {
            const sideDir = this.direction + (Math.random() - 0.5) * Math.PI / 2;
            const sideChild = new Branch(this.end(), sideDir, this.depth + 1, this, true);
            this.children.push(sideChild);
          }
        }
      }
    }

    draw(ctx) {
      const end = this.end();
      ctx.beginPath();
      ctx.moveTo(this.start.x, this.start.y);
      ctx.quadraticCurveTo(this.control.x, this.control.y, end.x, end.y);
      ctx.lineWidth = this.thickness;
      ctx.strokeStyle = this.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.stroke();
      for (const child of this.children) {
        child.draw(ctx);
      }
    }
  }

  class Neuron {
    constructor(position) {
      this.position = position;
      this.branches = [];
      const dir = Math.random() * Math.PI * 2;
      const branch = new Branch(position, dir, 0);
      this.branches.push(branch);
    }

    update() {
      for (const branch of this.branches) {
        this.updateBranch(branch);
      }
    }

    updateBranch(branch) {
      branch.update();
      if (!branch.growing && !tips.includes(branch)) {
        tips.push(branch);
      }
      for (const child of branch.children) {
        this.updateBranch(child);
      }
    }

    draw(ctx) {
      for (const branch of this.branches) {
        branch.draw(ctx);
      }
    }
  }

  class Synapse {
    constructor(a, b) {
      this.a = a;
      this.b = b;
      this.createdAt = Date.now();
    }

    draw(ctx) {
      const posA = this.a.end();
      const posB = this.b.end();
      const glow = params.synapseGlowStrength * 20;
      ctx.beginPath();
      ctx.moveTo(posA.x, posA.y);
      ctx.lineTo(posB.x, posB.y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = params.synapseColor;
      ctx.shadowBlur = glow;
      ctx.shadowColor = params.synapseColor;
      ctx.stroke();
    }
  }

  class Pulse {
    constructor(synapse) {
      this.synapse = synapse;
      this.startTime = Date.now();
      this.duration = 1000 / params.pulseSpeed;
    }

    update() {
      const now = Date.now();
      this.progress = (now - this.startTime) / this.duration;
    }

    draw(ctx) {
      if (this.progress > 1) return;
      const posA = this.synapse.a.end();
      const posB = this.synapse.b.end();
      const x = posA.x + (posB.x - posA.x) * this.progress;
      const y = posA.y + (posB.y - posA.y) * this.progress;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = params.pulseColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = params.pulseColor;
      ctx.fill();
    }
  }

  function initGUI() {
    const gui = new dat.GUI();
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
    growthFolder.add(params, 'branchGrowthSpeed', 0.1, 5, 0.1).name('Growth Speed');
    growthFolder.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
    growthFolder.add(params, 'branchSplitChance', 0, 1, 0.01).name('Split Chance');
    growthFolder.add(params, 'branchCurvature', 0, 1, 0.01).name('Curvature');
    growthFolder.add(params, 'maxBranchLength', 10, 200, 1).name('Max Length');
    const synapsesFolder = gui.addFolder('Synapses');
    synapsesFolder.add(params, 'synapseDistanceThreshold', 5, 50, 1).name('Distance Threshold');
    synapsesFolder.add(params, 'synapseGlowStrength', 0, 1, 0.01).name('Glow Strength');
    const pulsesFolder = gui.addFolder('Pulses');
    pulsesFolder.add(params, 'pulseSpeed', 0.1, 5, 0.1).name('Pulse Speed');
    pulsesFolder.add(params, 'pulseFrequency', 0.1, 2, 0.1).name('Pulse Frequency');
    pulsesFolder.add(params, 'pulseBrightness', 0, 2, 0.1).name('Brightness');
    const visualsFolder = gui.addFolder('Visuals');
    visualsFolder.addColor(params, 'backgroundColor').name('Background');
    visualsFolder.addColor(params, 'branchColor').name('Branch Color');
    visualsFolder.addColor(params, 'accentBranchColor').name('Accent Color');
    visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
    visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
    gui.add({ regenerate: regenerateNetwork }, 'regenerate').name('Regenerate Network');
    gui.add({ clear: clearCanvas }, 'clear').name('Clear Canvas');
    gui.add({ pauseResume: togglePause }, 'pauseResume').name('Pause/Resume');
  }

  function generateNeurons() {
    neurons = [];
    tips = [];
    synapses = [];
    pulses = [];
    const centerX = width / 2;
    const centerY = height / 2;
    for (let i = 0; i < params.neuronCount; i++) {
      const offsetX = (Math.random() - 0.5) * 50;
      const offsetY = (Math.random() - 0.5) * 50;
      const neuron = new Neuron({ x: centerX + offsetX, y: centerY + offsetY });
      neurons.push(neuron);
    }
  }

  function detectSynapses() {
    const existing = new Set();
    for (let i = 0; i < tips.length; i++) {
      const a = tips[i];
      const posA = a.end();
      for (let j = i + 1; j < tips.length; j++) {
        const b = tips[j];
        const posB = b.end();
        const dist = Math.hypot(posA.x - posB.x, posA.y - posB.y);
        if (dist <= params.synapseDistanceThreshold) {
          const key = a.id < b.id ? `${a.id}-${b.id}` : `${b.id}-${a.id}`;
          if (!existing.has(key)) {
            existing.add(key);
            synapses.push(new Synapse(a, b));
          }
        }
      }
    }
  }

  function update(delta) {
    if (paused) return;
    for (const neuron of neurons) {
      neuron.update();
    }
    if (tips.length > 0) {
      detectSynapses();
      tips = [];
    }
    pulseTimer += delta;
    if (pulseTimer >= 1000 / params.pulseFrequency) {
      pulseTimer = 0;
      if (synapses.length > 0) {
        const syn = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push(new Pulse(syn));
      }
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.update();
      if (p.progress >= 1) pulses.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, width, height);
    for (const neuron of neurons) {
      neuron.draw(ctx);
    }
    for (const syn of synapses) {
      syn.draw(ctx);
    }
    for (const p of pulses) {
      p.draw(ctx);
    }
  }

  function animate(time) {
    const delta = time - lastTime;
    lastTime = time;
    update(delta);
    draw();
    animationId = requestAnimationFrame(animate);
  }

  function clearCanvas() {
    neurons = [];
    synapses = [];
    pulses = [];
    tips = [];
    branchIdCounter = 0;
  }

  function regenerateNetwork() {
    clearCanvas();
    generateNeurons();
  }

  function togglePause() {
    paused = !paused;
  }

  function init() {
    initGUI();
    generateNeurons();
    lastTime = performance.now();
    animate(lastTime);
  }

  init();
})();
</script>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
</body>
</html>
