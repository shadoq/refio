<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        canvas {
            display: block;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }

        .score-p1 {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .score-p2 {
            color: #4488ff;
            text-shadow: 0 0 10px #4488ff;
        }

        #start-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 20;
        }

        #start-menu h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #00ff66;
            text-shadow: 0 0 20px #00ff66, 0 0 40px #00ff66;
            letter-spacing: 4px;
        }

        #start-menu h2 {
            font-size: 20px;
            margin-bottom: 50px;
            color: #888;
            text-shadow: 0 0 10px #888;
        }

        .menu-btn {
            display: block;
            width: 280px;
            padding: 15px 20px;
            margin: 10px 0;
            background: transparent;
            border: 2px solid #444;
            color: #ccc;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            border-color: #00ff66;
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
        }

        .menu-btn:nth-child(4):hover {
            border-color: #4488ff;
            color: #4488ff;
            text-shadow: 0 0 10px #4488ff;
            box-shadow: 0 0 15px rgba(68, 136, 255, 0.2);
        }

        .menu-btn:nth-child(5):hover {
            border-color: #ff44ff;
            color: #ff44ff;
            text-shadow: 0 0 10px #ff44ff;
            box-shadow: 0 0 15px rgba(255, 68, 255, 0.2);
        }

        #controls-info {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
            text-align: center;
            line-height: 1.8;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
        }

        #game-over h1 {
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px currentColor;
        }

        #game-over .result {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #game-over .final-scores {
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 2;
        }

        #game-over .restart-hint {
            font-size: 16px;
            color: #888;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div id="score-display">
            <span class="score-p1" id="p1-score">P1: 0</span>
            <span class="score-p2" id="p2-score">P2: 0</span>
        </div>
        <div id="start-menu">
            <h1>SNAKE</h1>
            <h2>BATTLE</h2>
            <button class="menu-btn" data-mode="hvh">HUMAN vs HUMAN</button>
            <button class="menu-btn" data-mode="cvh">CPU vs HUMAN</button>
            <button class="menu-btn" data-mode="cvc">CPU vs CPU</button>
            <div id="controls-info">
                PLAYER 1: W A S D<br>
                PLAYER 2: ARROW KEYS
            </div>
        </div>
        <div id="game-over">
            <h1 id="winner-text">GAME OVER</h1>
            <div class="final-scores" id="final-scores"></div>
            <div class="restart-hint">Press SPACE to restart</div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = 600;
        const TICK_INTERVAL = 150;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');
        const startMenu = document.getElementById('start-menu');
        const gameOverScreen = document.getElementById('game-over');
        const winnerText = document.getElementById('winner-text');
        const finalScoresEl = document.getElementById('final-scores');

        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        const OPPOSITES = {
            UP: 'DOWN',
            DOWN: 'UP',
            LEFT: 'RIGHT',
            RIGHT: 'LEFT'
        };

        class Snake {
            constructor(startX, startY, direction, color, glowColor, isCPU) {
                this.body = [
                    { x: startX, y: startY },
                    { x: startX - DIRECTIONS[direction].x, y: startY - DIRECTIONS[direction].y },
                    { x: startX - DIRECTIONS[direction].x * 2, y: startY - DIRECTIONS[direction].y * 2 }
                ];
                this.direction = direction;
                this.nextDirection = direction;
                this.color = color;
                this.glowColor = glowColor;
                this.isCPU = isCPU;
                this.score = 0;
                this.alive = true;
                this.grow = false;
            }

            setDirection(dir) {
                if (OPPOSITES[dir] !== this.direction) {
                    this.nextDirection = dir;
                }
            }

            move() {
                this.direction = this.nextDirection;
                const head = this.body[0];
                const dir = DIRECTIONS[this.direction];
                const newHead = { x: head.x + dir.x, y: head.y + dir.y };

                this.body.unshift(newHead);
                if (this.grow) {
                    this.grow = false;
                } else {
                    this.body.pop();
                }
            }

            getHead() {
                return this.body[0];
            }

            occupies(x, y) {
                return this.body.some(seg => seg.x === x && seg.y === y);
            }

            checkWallCollision() {
                const head = this.getHead();
                return head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
            }

            checkSelfCollision() {
                const head = this.getHead();
                return this.body.slice(1).some(seg => seg.x === head.x && seg.y === head.y);
            }

            checkCollisionWith(otherSnake) {
                const head = this.getHead();
                return otherSnake.occupies(head.x, head.y);
            }

            draw(ctx) {
                if (!this.alive) return;
                for (let i = this.body.length - 1; i >= 0; i--) {
                    const seg = this.body[i];
                    const alpha = i === 0 ? 1 : 0.4 + 0.6 * (1 - i / this.body.length);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha;
                    ctx.shadowColor = this.glowColor;
                    ctx.shadowBlur = i === 0 ? 12 : 4;
                    const padding = i === 0 ? 1 : 2;
                    ctx.fillRect(
                        seg.x * CELL_SIZE + padding,
                        seg.y * CELL_SIZE + padding,
                        CELL_SIZE - padding * 2,
                        CELL_SIZE - padding * 2
                    );
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        class CPUAI {
            static getNextDirection(snake, food, otherSnake) {
                const head = snake.getHead();
                const path = CPUAI.bfs(head, food, snake, otherSnake);

                if (path && path.length > 0) {
                    const next = path[0];
                    return CPUAI.dirFromTo(head, next);
                }

                return CPUAI.safeRandomMove(snake, otherSnake);
            }

            static bfs(start, target, snake, otherSnake) {
                const visited = new Set();
                const queue = [[start]];
                visited.add(`${start.x},${start.y}`);

                const blocked = new Set();
                for (const seg of snake.body) {
                    blocked.add(`${seg.x},${seg.y}`);
                }
                for (const seg of otherSnake.body) {
                    blocked.add(`${seg.x},${seg.y}`);
                }
                blocked.delete(`${start.x},${start.y}`);

                while (queue.length > 0) {
                    const path = queue.shift();
                    const current = path[path.length - 1];

                    if (current.x === target.x && current.y === target.y) {
                        return path.slice(1);
                    }

                    const dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    for (const dirName of dirs) {
                        const d = DIRECTIONS[dirName];
                        const nx = current.x + d.x;
                        const ny = current.y + d.y;
                        const key = `${nx},${ny}`;

                        if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE &&
                            !visited.has(key) && !blocked.has(key)) {
                            visited.add(key);
                            queue.push([...path, { x: nx, y: ny }]);
                        }
                    }
                }

                return null;
            }

            static dirFromTo(from, to) {
                const dx = to.x - from.x;
                const dy = to.y - from.y;
                if (dx === 1) return 'RIGHT';
                if (dx === -1) return 'LEFT';
                if (dy === 1) return 'DOWN';
                if (dy === -1) return 'UP';
                return null;
            }

            static safeRandomMove(snake, otherSnake) {
                const head = snake.getHead();
                const dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                const safeDirs = [];

                for (const dirName of dirs) {
                    if (OPPOSITES[dirName] === snake.direction) continue;
                    const d = DIRECTIONS[dirName];
                    const nx = head.x + d.x;
                    const ny = head.y + d.y;

                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE &&
                        !snake.occupies(nx, ny) && !otherSnake.occupies(nx, ny)) {
                        safeDirs.push(dirName);
                    }
                }

                if (safeDirs.length > 0) {
                    return safeDirs[Math.floor(Math.random() * safeDirs.length)];
                }

                const nonOpposite = dirs.filter(d => OPPOSITES[d] !== snake.direction);
                return nonOpposite[Math.floor(Math.random() * nonOpposite.length)];
            }
        }

        class Game {
            constructor(mode) {
                this.mode = mode;
                this.p1CPU = mode === 'cvh' || mode === 'cvc';
                this.p2CPU = mode === 'cvc';
                this.snake1 = new Snake(5, 15, 'RIGHT', '#00ff66', '#00ff66', this.p1CPU);
                this.snake2 = new Snake(24, 15, 'LEFT', '#4488ff', '#4488ff', this.p2CPU);
                this.food = null;
                this.gameLoop = null;
                this.running = false;
                this.spawnFood();
            }

            spawnFood() {
                const occupied = new Set();
                for (const seg of this.snake1.body) {
                    occupied.add(`${seg.x},${seg.y}`);
                }
                for (const seg of this.snake2.body) {
                    occupied.add(`${seg.x},${seg.y}`);
                }

                const available = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        if (!occupied.has(`${x},${y}`)) {
                            available.push({ x, y });
                        }
                    }
                }

                if (available.length === 0) {
                    this.endGame();
                    return;
                }

                this.food = available[Math.floor(Math.random() * available.length)];
            }

            update() {
                if (!this.running) return;

                if (this.snake1.alive && this.snake1.isCPU) {
                    const dir = CPUAI.getNextDirection(this.snake1, this.food, this.snake2);
                    if (dir) this.snake1.setDirection(dir);
                }

                if (this.snake2.alive && this.snake2.isCPU) {
                    const dir = CPUAI.getNextDirection(this.snake2, this.food, this.snake1);
                    if (dir) this.snake2.setDirection(dir);
                }

                if (this.snake1.alive) this.snake1.move();
                if (this.snake2.alive) this.snake2.move();

                this.checkCollisions();
                this.checkFood();
                this.updateScoreDisplay();
                this.draw();

                if (!this.snake1.alive || !this.snake2.alive) {
                    this.endGame();
                }
            }

            checkCollisions() {
                if (this.snake1.alive) {
                    if (this.snake1.checkWallCollision() || this.snake1.checkSelfCollision()) {
                        this.snake1.alive = false;
                    } else if (this.snake2.alive && this.snake1.checkCollisionWith(this.snake2)) {
                        this.snake1.alive = false;
                    }
                }

                if (this.snake2.alive) {
                    if (this.snake2.checkWallCollision() || this.snake2.checkSelfCollision()) {
                        this.snake2.alive = false;
                    } else if (this.snake1.alive && this.snake2.checkCollisionWith(this.snake1)) {
                        this.snake2.alive = false;
                    }
                }

                if (this.snake1.alive && this.snake2.alive) {
                    const h1 = this.snake1.getHead();
                    const h2 = this.snake2.getHead();
                    if (h1.x === h2.x && h1.y === h2.y) {
                        this.snake1.alive = false;
                        this.snake2.alive = false;
                    }
                }
            }

            checkFood() {
                if (this.food === null) return;

                if (this.snake1.alive) {
                    const h1 = this.snake1.getHead();
                    if (h1.x === this.food.x && h1.y === this.food.y) {
                        this.snake1.grow = true;
                        this.snake1.score += 10;
                        this.spawnFood();
                        return;
                    }
                }

                if (this.snake2.alive) {
                    const h2 = this.snake2.getHead();
                    if (h2.x === this.food.x && h2.y === this.food.y) {
                        this.snake2.grow = true;
                        this.snake2.score += 10;
                        this.spawnFood();
                    }
                }
            }

            updateScoreDisplay() {
                p1ScoreEl.textContent = `P1: ${this.snake1.score}`;
                p2ScoreEl.textContent = `P2: ${this.snake2.score}`;
            }

            draw() {
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                    ctx.stroke();
                }

                if (this.food) {
                    ctx.fillStyle = '#ff4444';
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(
                        this.food.x * CELL_SIZE + CELL_SIZE / 2,
                        this.food.y * CELL_SIZE + CELL_SIZE / 2,
                        CELL_SIZE / 2 - 3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                this.snake1.draw(ctx);
                this.snake2.draw(ctx);
            }

            start() {
                this.running = true;
                scoreDisplay.style.display = 'flex';
                startMenu.style.display = 'none';
                gameOverScreen.style.display = 'none';
                this.draw();
                this.gameLoop = setInterval(() => this.update(), TICK_INTERVAL);
            }

            stop() {
                this.running = false;
                clearInterval(this.gameLoop);
            }

            endGame() {
                this.stop();
                this.draw();

                let winnerColor;
                let resultText;

                if (!this.snake1.alive && !this.snake2.alive) {
                    winnerColor = '#ffaa00';
                    resultText = 'DRAW';
                } else if (!this.snake1.alive) {
                    winnerColor = '#4488ff';
                    resultText = 'PLAYER 2 WINS';
                } else {
                    winnerColor = '#00ff66';
                    resultText = 'PLAYER 1 WINS';
                }

                winnerText.textContent = resultText;
                winnerText.style.color = winnerColor;
                winnerText.style.textShadow = `0 0 20px ${winnerColor}`;

                let p1Label = this.p1CPU ? 'CPU 1' : 'Player 1';
                let p2Label = this.p2CPU ? 'CPU 2' : 'Player 2';

                finalScoresEl.innerHTML =
                    `<span style="color:#00ff66;text-shadow:0 0 8px #00ff66">${p1Label}: ${this.snake1.score}</span><br>` +
                    `<span style="color:#4488ff;text-shadow:0 0 8px #4488ff">${p2Label}: ${this.snake2.score}</span>`;

                gameOverScreen.style.display = 'flex';
            }
        }

        let game = null;

        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                game = new Game(mode);
                game.start();
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!game || !game.running) {
                if (e.code === 'Space' && game) {
                    e.preventDefault();
                    const mode = game.mode;
                    game = new Game(mode);
                    game.start();
                }
                return;
            }

            const s1 = game.snake1;
            const s2 = game.snake2;

            switch (e.code) {
                case 'KeyW': if (!s1.isCPU) s1.setDirection('UP'); break;
                case 'KeyS': if (!s1.isCPU) s1.setDirection('DOWN'); break;
                case 'KeyA': if (!s1.isCPU) s1.setDirection('LEFT'); break;
                case 'KeyD': if (!s1.isCPU) s1.setDirection('RIGHT'); break;
                case 'ArrowUp': if (!s2.isCPU) { s2.setDirection('UP'); e.preventDefault(); } break;
                case 'ArrowDown': if (!s2.isCPU) { s2.setDirection('DOWN'); e.preventDefault(); } break;
                case 'ArrowLeft': if (!s2.isCPU) { s2.setDirection('LEFT'); e.preventDefault(); } break;
                case 'ArrowRight': if (!s2.isCPU) { s2.setDirection('RIGHT'); e.preventDefault(); } break;
            }
        });
    </script>
</body>
</html>
