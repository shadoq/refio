<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
            border: 1px solid #101a3a;
        }
        canvas {
            display: block;
            background-color: #05070f;
        }
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="800"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // --- Configuration & State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        const params = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 1.5,
            maxBranchDepth: 6,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistance: 40,
            synapseGlowStrength: 20,
            
            // Pulses
            pulseSpeed: 4,
            pulseFrequency: 0.02,
            pulseBrightness: 1.0,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Controls
            paused: false,
            regenerate: function() { initSimulation(); },
            clear: function() { clearCanvas(); },
            togglePause: function() { params.paused = !params.paused; }
        };

        // --- Data Structures ---
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationId;
        let pulseTimer = 0;

        // --- Classes ---
        class Branch {
            constructor(startX, startY, angle, depth, parent = null) {
                this.x = startX;
                this.y = startY;
                this.angle = angle;
                this.depth = depth;
                this.parent = parent;
                this.length = 0;
                this.maxLen = params.maxBranchLength + (Math.random() * 40 - 20);
                this.growthSpeed = params.branchGrowthSpeed;
                this.active = true;
                this.finished = false;
                this.color = params.branchColor;
                this.isAccent = Math.random() < 0.1;
                if (this.isAccent) this.color = params.accentColor;
                
                // For smooth curves
                this.targetAngle = angle;
                this.curveOffset = (Math.random() - 0.5) * params.branchCurvature * 2;
            }

            update() {
                if (!this.active || this.finished) return;

                // Grow
                this.length += this.growthSpeed;
                
                // Calculate new tip position
                const currentAngle = this.angle + this.curveOffset;
                this.x += Math.cos(currentAngle) * this.growthSpeed;
                this.y += Math.sin(currentAngle) * this.growthSpeed;

                // Check if finished growing
                if (this.length >= this.maxLen) {
                    this.finished = true;
                    this.active = false;
                    return;
                }

                // Randomly change direction slightly
                if (Math.random() < 0.05) {
                    this.targetAngle += (Math.random() - 0.5) * 0.5;
                }
                // Smoothly interpolate angle
                this.angle += (this.targetAngle - this.angle) * 0.1;

                // Check for split
                if (Math.random() < params.branchSplitChance && this.depth < params.maxBranchDepth) {
                    const splitAngle = this.angle + (Math.random() - 0.5) * 1.5;
                    const newBranch = new Branch(this.x, this.y, splitAngle, this.depth + 1, this);
                    branches.push(newBranch);
                }
            }

            draw(ctx) {
                if (!this.parent) return; // Drawn by parent connection

                ctx.beginPath();
                ctx.moveTo(this.parent.x, this.parent.y);
                ctx.lineTo(this.x, this.y);
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = Math.max(0.5, 2 - this.depth * 0.2);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.b1 = branch1;
                this.b2 = branch2;
                this.active = true;
                this.pulseTime = 0;
            }

            draw(ctx) {
                if (!this.active) return;

                const midX = (this.b1.x + this.b2.x) / 2;
                const midY = (this.b1.y + this.b2.y) / 2;

                // Draw connection line
                ctx.beginPath();
                ctx.moveTo(this.b1.x, this.b1.y);
                ctx.lineTo(this.b2.x, this.b2.y);
                ctx.strokeStyle = params.synapseColor;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.3;
                ctx.shadowBlur = params.synapseGlowStrength;
                ctx.shadowColor = params.synapseColor;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;

                // Draw glowing node
                ctx.beginPath();
                ctx.arc(midX, midY, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.synapseColor;
                ctx.shadowBlur = params.synapseGlowStrength;
                ctx.shadowColor = params.synapseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(startX, startY, endX, endY) {
                this.x = startX;
                this.y = startY;
                this.endX = endX;
                this.endY = endY;
                this.progress = 0;
                this.speed = params.pulseSpeed / 100; // Normalized speed
                this.active = true;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                    return;
                }
                // Interpolate position
                this.x = this.x + (this.endX - this.x) * this.speed;
                this.y = this.y + (this.endY - this.y) * this.speed;
            }

            draw(ctx) {
                if (!this.active) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.globalAlpha = params.pulseBrightness;
                ctx.shadowBlur = 15;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        // --- Core Functions ---
        function initSimulation() {
            clearCanvas();
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];

            // Create seed neurons
            for (let i = 0; i < params.neuronCount; i++) {
                const angle = (Math.PI * 2 / params.neuronCount) * i + Math.random() * 0.5;
                const dist = 50 + Math.random() * 50;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                
                // Initial branch
                const b = new Branch(x, y, Math.random() * Math.PI * 2, 0);
                branches.push(b);
            }
        }

        function clearCanvas() {
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
        }

        function checkSynapses() {
            // Only check active branches against other active branches
            for (let i = 0; i < branches.length; i++) {
                const b1 = branches[i];
                if (!b1.active) continue;

                for (let j = i + 1; j < branches.length; j++) {
                    const b2 = branches[j];
                    if (!b2.active) continue;

                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < params.synapseDistance) {
                        // Prevent duplicates (simple check)
                        const exists = synapses.some(s => 
                            (s.b1 === b1 && s.b2 === b2) || (s.b1 === b2 && s.b2 === b1)
                        );
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                        }
                    }
                }
            }
        }

        function generatePulses() {
            pulseTimer += params.pulseFrequency;
            if (pulseTimer > 1) {
                pulseTimer = 0;
                if (synapses.length > 0) {
                    const syn = synapses[Math.floor(Math.random() * synapses.length)];
                    // Random direction
                    if (Math.random() > 0.5) {
                        pulses.push(new Pulse(syn.b1.x, syn.b1.y, syn.b2.x, syn.b2.y));
                    } else {
                        pulses.push(new Pulse(syn.b2.x, syn.b2.y, syn.b1.x, syn.b1.y));
                    }
                }
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            ctx.beginPath();
            for (let x = 0; x <= width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = 0; y <= height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();
        }

        function animate() {
            if (!params.paused) {
                // Clear and redraw background
                ctx.fillStyle = params.bgColor;
                ctx.fillRect(0, 0, width, height);
                
                drawGrid();

                // Update and draw branches
                branches.forEach(b => {
                    b.update();
                    b.draw(ctx);
                });

                // Check for new connections
                checkSynapses();

                // Draw synapses
                synapses.forEach(s => s.draw(ctx));

                // Generate and draw pulses
                generatePulses();
                pulses = pulses.filter(p => p.active);
                pulses.forEach(p => {
                    p.update();
                    p.draw(ctx);
                });
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // --- GUI Setup ---
        const gui = new dat.GUI({ width: 300 });
        
        const folderGrowth = gui.addFolder('Growth');
        folderGrowth.add(params, 'neuronCount', 1, 10, 1).name('Neuron Count').onChange(initSimulation);
        folderGrowth.add(params, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
        folderGrowth.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Depth').onChange(initSimulation);
        folderGrowth.add(params, 'branchSplitChance', 0.01, 0.5).name('Split Chance');
        folderGrowth.add(params, 'branchCurvature', 0, 2).name('Curvature');
        folderGrowth.add(params, 'maxBranchLength', 50, 200).name('Max Length');
        folderGrowth.open();

        const folderSynapses = gui.addFolder('Synapses');
        folderSynapses.add(params, 'synapseDistance', 10, 100).name('Distance Threshold');
        folderSynapses.add(params, 'synapseGlowStrength', 0, 50).name('Glow Strength');
        folderSynapses.open();

        const folderPulses = gui.addFolder('Pulses');
        folderPulses.add(params, 'pulseSpeed', 1, 20).name('Speed');
        folderPulses.add(params, 'pulseFrequency', 0.001, 0.1).name('Frequency');
        folderPulses.add(params, 'pulseBrightness', 0, 2).name('Brightness');
        folderPulses.open();

        const folderVisuals = gui.addFolder('Visuals');
        folderVisuals.addColor(params, 'bgColor').name('Background').onChange(() => {
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
        });
        folderVisuals.addColor(params, 'branchColor').name('Branch Color');
        folderVisuals.addColor(params, 'accentColor').name('Accent Color');
        folderVisuals.addColor(params, 'synapseColor').name('Synapse Color');
        folderVisuals.addColor(params, 'pulseColor').name('Pulse Color');
        folderVisuals.open();

        gui.add(params, 'regenerate').name('Regenerate Network');
        gui.add(params, 'clear').name('Clear Canvas');
        gui.add(params, 'togglePause').name('Pause/Resume');

        // --- Start ---
        initSimulation();
        animate();

    </script>
</body>
</html>
