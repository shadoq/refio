<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        h1 {
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .mode-selector label {
            color: #aaa;
        }
        .mode-selector select {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            background: #16213e;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
        }
        .mode-selector select:hover {
            background: #1f3a6f;
        }
        .mode-selector select:focus {
            outline: none;
            background: #2a4a7f;
        }
        #gameCanvas {
            border: 3px solid #4ecca3;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
        }
        .score-board {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        .score {
            font-size: 18px;
            color: #4ecca3;
        }
        .score span {
            font-weight: bold;
            font-size: 22px;
        }
        #startMenu, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 40px 60px;
            border-radius: 15px;
            border: 2px solid #4ecca3;
            text-align: center;
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.4);
            z-index: 100;
        }
        #startMenu h2, #gameOverScreen h2 {
            color: #4ecca3;
            margin-bottom: 20px;
            font-size: 32px;
        }
        #startMenu p, #gameOverScreen p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 16px;
        }
        #startMenu button, #gameOverScreen button {
            padding: 15px 40px;
            font-size: 18px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #startMenu button:hover, #gameOverScreen button:hover {
            background: #3db892;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.6);
        }
        #startMenu button:focus, #gameOverScreen button:focus {
            outline: none;
            background: #3db892;
        }
        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .instructions kbd {
            background: #2a4a7f;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>SNAKE GAME</h1>
        <div class="mode-selector">
            <label for="gameMode">Game Mode:</label>
            <select id="gameMode">
                <option value="human-human">Human vs Human</option>
                <option value="cpu-human">CPU vs Human</option>
                <option value="cpu-cpu">CPU vs CPU</option>
            </select>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="score-board">
            <div class="score">Player 1: <span id="score1">0</span></div>
            <div class="score">Player 2: <span id="score2">0</span></div>
        </div>
        <div id="startMenu">
            <h2>🐍 SNAKE GAME 🐍</h2>
            <p>Select a game mode and press Start!</p>
            <button id="startBtn">START GAME</button>
            <p class="instructions">Use <kbd>Arrow Keys</kbd> or <kbd>WASD</kbd> to control Player 1</p>
            <p class="instructions">Use <kbd>NumPad 8/4/6/2</kbd> or <kbd>W/A/S/D</kbd> to control Player 2</p>
        </div>
        <div id="gameOverScreen" style="display: none;">
            <h2>GAME OVER!</h2>
            <p id="gameOverMessage"></p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game Constants
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const GAME_SPEED = 100; // milliseconds

        // Game State
        let gameMode = 'human-human';
        let gameLoop = null;
        let snake1 = [], snake2 = [];
        let food = { x: 0, y: 0 };
        let direction1 = { x: 1, y: 0 }; // Player 1 moving right
        let direction2 = { x: 0, y: -1 }; // Player 2 moving up
        let nextDirection1 = { x: 1, y: 0 };
        let nextDirection2 = { x: 0, y: -1 };
        let scores = { p1: 0, p2: 0 };
        let isGameRunning = false;

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const startMenu = document.getElementById('startMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameModeSelect = document.getElementById('gameMode');

        // Initialize snakes
        function initSnakes() {
            snake1 = [];
            snake2 = [];
            
            // Player 1 starts in the middle, moving right
            for (let i = 0; i < 5; i++) {
                snake1.push({ x: Math.floor(GRID_SIZE / 2) - 2 + i, y: Math.floor(GRID_SIZE / 2) });
            }
            
            // Player 2 starts in the middle, moving up
            for (let i = 0; i < 5; i++) {
                snake2.push({ x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) - 2 + i });
            }
        }

        // Spawn food
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                // Check if food spawns on snake
                validPosition = !snake1.some(segment => segment.x === food.x && segment.y === food.y) &&
                               !snake2.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // Draw the game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#1f3a6f';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Player 1 snake
            snake1.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#4ecca3' : '#3db892';
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });

            // Draw Player 2 snake
            snake2.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#448aff' : '#357abd';
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });
        }

        // Move snake
        function moveSnake(snake, direction) {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // Check for wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return null;
            }
            
            // Check for self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                return null;
            }
            
            snake.unshift(head);
            
            // Check if ate food
            if (head.x === food.x && head.y === food.y) {
                scores.p1++;
                score1El.textContent = scores.p1;
                spawnFood();
            } else {
                snake.pop();
            }
            
            return head;
        }

        // CPU AI for player 2
        function cpuMove(snake, otherSnake) {
            const head = snake[0];
            const possibleMoves = [
                { x: 0, y: -1 }, // Up
                { x: 0, y: 1 },  // Down
                { x: -1, y: 0 }, // Left
                { x: 1, y: 0 }   // Right
            ];
            
            // Filter valid moves (not wall, not self, not other snake)
            const validMoves = possibleMoves.filter(move => {
                const newHead = { x: head.x + move.x, y: head.y + move.y };
                const isWall = newHead.x < 0 || newHead.x >= GRID_SIZE || 
                              newHead.y < 0 || newHead.y >= GRID_SIZE;
                const isSelf = snake.some(segment => segment.x === newHead.x && segment.y === newHead.y);
                const isOther = otherSnake.some(segment => segment.x === newHead.x && segment.y === newHead.y);
                return !isWall && !isSelf && !isOther;
            });
            
            if (validMoves.length === 0) {
                return { x: 0, y: 0 }; // Stay in place
            }
            
            // Find best move (closest to food)
            let bestMove = validMoves[0];
            let bestDistance = Infinity;
            
            validMoves.forEach(move => {
                const newHead = { x: head.x + move.x, y: head.y + move.y };
                const distance = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestMove = move;
                }
            });
            
            return bestMove;
        }

        // Check for game over
        function checkGameOver() {
            const head1 = snake1[0];
            const head2 = snake2[0];
            
            // Check if Player 1 hit Player 2's body
            if (snake2.some(segment => segment.x === head1.x && segment.y === head1.y)) {
                return 'Player 2';
            }
            
            // Check if Player 2 hit Player 1's body
            if (snake1.some(segment => segment.x === head2.x && segment.y === head2.y)) {
                return 'Player 1';
            }
            
            return null;
        }

        // Game update
        function update() {
            if (!isGameRunning) return;
            
            // Get current directions
            const currentDir1 = nextDirection1;
            const currentDir2 = nextDirection2;
            
            // Prevent 180-degree turns
            if (currentDir1.x !== 0 && currentDir1.x === -nextDirection1.x) {
                nextDirection1.x = 0;
            }
            if (currentDir2.x !== 0 && currentDir2.x === -nextDirection2.x) {
                nextDirection2.x = 0;
            }
            if (currentDir1.y !== 0 && currentDir1.y === -nextDirection1.y) {
                nextDirection1.y = 0;
            }
            if (currentDir2.y !== 0 && currentDir2.y === -nextDirection2.y) {
                nextDirection2.y = 0;
            }
            
            // Move snakes
            const head1 = moveSnake(snake1, currentDir1);
            const head2 = moveSnake(snake2, currentDir2);
            
            // Check for game over
            const winner = checkGameOver();
            if (winner) {
                gameOver();
                return;
            }
            
            draw();
        }

        // Game loop
        function gameLoopFunction() {
            update();
        }

        // Start game
        function startGame() {
            gameMode = gameModeSelect.value;
            gameModeSelect.disabled = true;
            initSnakes();
            spawnFood();
            scores.p1 = 0;
            scores.p2 = 0;
            score1El.textContent = scores.p1;
            score2El.textContent = scores.p2;
            
            // Set initial directions based on game mode
            if (gameMode === 'cpu-human') {
                direction1 = { x: 1, y: 0 };
                nextDirection1 = { x: 1, y: 0 };
                direction2 = { x: 0, y: -1 };
                nextDirection2 = { x: 0, y: -1 };
            } else if (gameMode === 'cpu-cpu') {
                direction1 = { x: 1, y: 0 };
                nextDirection1 = { x: 1, y: 0 };
                direction2 = { x: 0, y: -1 };
                nextDirection2 = { x: 0, y: -1 };
            } else {
                direction1 = { x: 1, y: 0 };
                nextDirection1 = { x: 1, y: 0 };
                direction2 = { x: 0, y: -1 };
                nextDirection2 = { x: 0, y: -1 };
            }
            
            isGameRunning = true;
            startMenu.style.display = 'none';
            gameOverScreen.style.display = 'none';
            draw();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameLoopFunction, GAME_SPEED);
        }

        // Game over
        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            
            let message = '';
            if (checkGameOver()) {
                message = `Player ${checkGameOver()} hit the other player!`;
            } else {
                message = 'Game Over!';
            }
            
            gameOverMessage.textContent = message + `\n\nPlayer 1 Score: ${scores.p1}\nPlayer 2 Score: ${scores.p2}`;
            gameOverScreen.style.display = 'block';
        }

        // Restart game
        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            
            // Player 1 controls (WASD or Arrow Keys)
            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    if (nextDirection1.y === 0) {
                        nextDirection1 = { x: 0, y: -1 };
                    }
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    if (nextDirection1.x === 0) {
                        nextDirection1 = { x: -1, y: 0 };
                    }
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (nextDirection1.y === 0) {
                        nextDirection1 = { x: 0, y: 1 };
                    }
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (nextDirection1.x === 0) {
                        nextDirection1 = { x: 1, y: 0 };
                    }
                    e.preventDefault();
                    break;
            }
            
            // Player 2 controls (WASD or Numpad) for human mode only
            if (gameMode === 'human-human') {
                switch (e.key.toLowerCase()) {
                    case 'arrowup':
                    case 'w':
                        if (nextDirection2.y === 0) {
                            nextDirection2 = { x: 0, y: -1 };
                        }
                        e.preventDefault();
                        break;
                    case 'arrowleft':
                    case 'a':
                        if (nextDirection2.x === 0) {
                            nextDirection2 = { x: -1, y: 0 };
                        }
                        e.preventDefault();
                        break;
                    case 'arrowdown':
                    case 's':
                        if (nextDirection2.y === 0) {
                            nextDirection2 = { x: 0, y: 1 };
                        }
                        e.preventDefault();
                        break;
                    case 'arrowright':
                    case 'd':
                        if (nextDirection2.x === 0) {
                            nextDirection2 = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        break;
                }
                
                // Numpad controls
                switch (e.key) {
                    case 'ArrowUp':
                    case '8':
                        if (nextDirection2.y === 0) {
                            nextDirection2 = { x: 0, y: -1 };
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                    case '4':
                        if (nextDirection2.x === 0) {
                            nextDirection2 = { x: -1, y: 0 };
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case '2':
                        if (nextDirection2.y === 0) {
                            nextDirection2 = { x: 0, y: 1 };
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case '6':
                        if (nextDirection2.x === 0) {
                            nextDirection2 = { x: 1, y: 0 };
                        }
                        e.preventDefault();
                        break;
                }
            }
        });

        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);
        gameModeSelect.addEventListener('change', () => {
            gameModeSelect.disabled = false;
        });

        // Draw initial state
        initSnakes();
        spawnFood();
        draw();
    </script>
</body>
</html>
