<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            text-align: center;
        }

        canvas {
            border: 3px solid #4a4a6a;
            background-color: #0f0f1a;
            display: block;
            margin: 0 auto;
        }

        #score-display {
            margin: 15px 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-around;
            width: 600px;
            margin: 10px auto;
        }

        .score-box {
            background-color: #2a2a4a;
            padding: 8px 15px;
            border-radius: 5px;
            min-width: 120px;
        }

        .score-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        #menu, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #menu h1, #game-over h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background-color: #2a2a4a;
            color: #eee;
            border: 2px solid #4a4a6a;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            min-width: 250px;
        }

        .menu-btn:hover {
            background-color: #4a4a6a;
            transform: scale(1.05);
        }

        .menu-btn.selected {
            background-color: #4ecca3;
            color: #1a1a2e;
            border-color: #4ecca3;
        }

        #game-over h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #game-over p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .controls-info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: left;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 5px;
        }

        .controls-info h3 {
            margin-bottom: 10px;
            color: #4ecca3;
        }

        .controls-info p {
            margin: 5px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">
            <div class="score-box">
                <div class="score-label">Player 1</div>
                <div class="score-value" id="score1">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Player 2</div>
                <div class="score-value" id="score2">0</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="menu">
            <h1>SNAKE GAME</h1>
            <div class="menu-options">
                <button class="menu-btn selected" data-mode="human_vs_human">Human vs Human</button>
                <button class="menu-btn" data-mode="cpu_vs_human">CPU vs Human</button>
                <button class="menu-btn" data-mode="cpu_vs_cpu">CPU vs CPU</button>
            </div>
            <div class="controls-info">
                <h3>Controls:</h3>
                <p><strong>Player 1:</strong> Arrow Keys (↑ ↓ ← →)</p>
                <p><strong>Player 2:</strong> WASD (W A S D)</p>
                <p><strong>Start Game:</strong> Press any key after selecting mode</p>
            </div>
        </div>
        
        <div id="game-over" class="hidden">
            <h2>GAME OVER</h2>
            <p id="winner-text"></p>
            <p>Press any key to restart</p>
        </div>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const GAME_SPEED = 100; // ms per frame

        // Game state
        let canvas, ctx;
        let gameLoop;
        let gameMode = 'human_vs_human';
        let isGameRunning = false;
        let gameOver = false;
        
        // Snake states
        let snake1 = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            color: '#4ecca3',
            score: 0,
            isCpu: false
        };
        
        let snake2 = {
            body: [],
            direction: { x: -1, y: 0 },
            nextDirection: { x: -1, y: 0 },
            color: '#ff6b6b',
            score: 0,
            isCpu: false
        };
        
        let food = { x: 0, y: 0 };
        
        // Initialize canvas
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;
            
            // Setup menu buttons
            setupMenuButtons();
            
            // Setup keyboard controls
            setupKeyboardControls();
            
            // Initial draw
            draw();
        }
        
        function setupMenuButtons() {
            const buttons = document.querySelectorAll('.menu-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    gameMode = btn.dataset.mode;
                });
            });
        }
        
        function setupKeyboardControls() {
            document.addEventListener('keydown', (e) => {
                if (!isGameRunning && !gameOver) {
                    // Start game on any key press from menu
                    startGame();
                    return;
                }
                
                if (gameOver) {
                    // Restart game on any key press
                    resetGame();
                    return;
                }
                
                // Player 1 controls (Arrow keys)
                if (!snake1.isCpu) {
                    switch(e.key) {
                        case 'ArrowUp':
                            if (snake1.direction.y !== 1) snake1.nextDirection = { x: 0, y: -1 };
                            break;
                        case 'ArrowDown':
                            if (snake1.direction.y !== -1) snake1.nextDirection = { x: 0, y: 1 };
                            break;
                        case 'ArrowLeft':
                            if (snake1.direction.x !== 1) snake1.nextDirection = { x: -1, y: 0 };
                            break;
                        case 'ArrowRight':
                            if (snake1.direction.x !== -1) snake1.nextDirection = { x: 1, y: 0 };
                            break;
                    }
                }
                
                // Player 2 controls (WASD)
                if (!snake2.isCpu) {
                    switch(e.key.toLowerCase()) {
                        case 'w':
                            if (snake2.direction.y !== 1) snake2.nextDirection = { x: 0, y: -1 };
                            break;
                        case 's':
                            if (snake2.direction.y !== -1) snake2.nextDirection = { x: 0, y: 1 };
                            break;
                        case 'a':
                            if (snake2.direction.x !== 1) snake2.nextDirection = { x: -1, y: 0 };
                            break;
                        case 'd':
                            if (snake2.direction.x !== -1) snake2.nextDirection = { x: 1, y: 0 };
                            break;
                    }
                }
            });
        }
        
        function startGame() {
            isGameRunning = true;
            gameOver = false;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            
            // Reset snakes based on game mode
            resetSnakes();
            
            // Start game loop
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, GAME_SPEED);
        }
        
        function resetGame() {
            clearInterval(gameLoop);
            isGameRunning = false;
            gameOver = false;
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            resetSnakes();
            draw();
        }
        
        function resetSnakes() {
            // Reset snake 1
            snake1.body = [
                { x: 5, y: 15 },
                { x: 4, y: 15 },
                { x: 3, y: 15 }
            ];
            snake1.direction = { x: 1, y: 0 };
            snake1.nextDirection = { x: 1, y: 0 };
            snake1.score = 0;
            snake1.isCpu = (gameMode === 'cpu_vs_human' || gameMode === 'cpu_vs_cpu');
            
            // Reset snake 2
            snake2.body = [
                { x: 24, y: 15 },
                { x: 25, y: 15 },
                { x: 26, y: 15 }
            ];
            snake2.direction = { x: -1, y: 0 };
            snake2.nextDirection = { x: -1, y: 0 };
            snake2.score = 0;
            snake2.isCpu = (gameMode === 'human_vs_human' || gameMode === 'cpu_vs_cpu');
            
            // Place food
            placeFood();
            
            // Update score display
            updateScoreDisplay();
        }
        
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                validPosition = true;
                
                // Check if food is on any snake
                for (let snake of [snake1, snake2]) {
                    for (let segment of snake.body) {
                        if (segment.x === food.x && segment.y === food.y) {
                            validPosition = false;
                            break;
                        }
                    }
                    if (!validPosition) break;
                }
            }
        }
        
        function update() {
            if (!isGameRunning || gameOver) return;
            
            // Update CPU snakes
            if (snake1.isCpu) {
                snake1.nextDirection = getCpuDirection(snake1, snake2);
            }
            if (snake2.isCpu) {
                snake2.nextDirection = getCpuDirection(snake2, snake1);
            }
            
            // Update directions
            snake1.direction = snake1.nextDirection;
            snake2.direction = snake2.nextDirection;
            
            // Move snakes
            moveSnake(snake1);
            moveSnake(snake2);
            
            // Check collisions
            if (checkCollisions()) {
                endGame();
                return;
            }
            
            // Check if snakes ate food
            checkFood();
            
            // Draw everything
            draw();
        }
        
        function moveSnake(snake) {
            const head = { ...snake.body[0] };
            head.x += snake.direction.x;
            head.y += snake.direction.y;
            
            snake.body.unshift(head);
            
            // Check if ate food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreDisplay();
                placeFood();
            } else {
                snake.body.pop();
            }
        }
        
        function checkCollisions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];
            
            // Check wall collisions
            if (head1.x < 0 || head1.x >= GRID_SIZE || head1.y < 0 || head1.y >= GRID_SIZE) {
                return true;
            }
            if (head2.x < 0 || head2.x >= GRID_SIZE || head2.y < 0 || head2.y >= GRID_SIZE) {
                return true;
            }
            
            // Check self collisions
            for (let i = 1; i < snake1.body.length; i++) {
                if (head1.x === snake1.body[i].x && head1.y === snake1.body[i].y) {
                    return true;
                }
            }
            for (let i = 1; i < snake2.body.length; i++) {
                if (head2.x === snake2.body[i].x && head2.y === snake2.body[i].y) {
                    return true;
                }
            }
            
            // Check head-to-head collision
            if (head1.x === head2.x && head1.y === head2.y) {
                return true;
            }
            
            // Check head-to-body collisions
            for (let i = 0; i < snake2.body.length; i++) {
                if (head1.x === snake2.body[i].x && head1.y === snake2.body[i].y) {
                    return true;
                }
            }
            for (let i = 0; i < snake1.body.length; i++) {
                if (head2.x === snake1.body[i].x && head2.y === snake1.body[i].y) {
                    return true;
                }
            }
            
            return false;
        }
        
        function checkFood() {
            // Already handled in moveSnake
        }
        
        function endGame() {
            gameOver = true;
            isGameRunning = false;
            clearInterval(gameLoop);
            
            const winnerText = document.getElementById('winner-text');
            
            if (snake1.score > snake2.score) {
                winnerText.textContent = 'Player 1 Wins!';
                winnerText.style.color = snake1.color;
            } else if (snake2.score > snake1.score) {
                winnerText.textContent = 'Player 2 Wins!';
                winnerText.style.color = snake2.color;
            } else {
                winnerText.textContent = 'It\'s a Tie!';
                winnerText.style.color = '#fff';
            }
            
            document.getElementById('game-over').classList.remove('hidden');
        }
        
        function updateScoreDisplay() {
            document.getElementById('score1').textContent = snake1.score;
            document.getElementById('score2').textContent = snake2.score;
        }
        
        function getCpuDirection(snake, opponent) {
            const head = snake.body[0];
            const directions = [
                { x: 0, y: -1 }, // Up
                { x: 0, y: 1 },  // Down
                { x: -1, y: 0 }, // Left
                { x: 1, y: 0 }   // Right
            ];
            
            // Filter out invalid directions (walls, self, opponent body)
            const validDirections = directions.filter(dir => {
                const newX = head.x + dir.x;
                const newY = head.y + dir.y;
                
                // Check walls
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }
                
                // Check self collision (excluding tail which will move)
                for (let i = 0; i < snake.body.length - 1; i++) {
                    if (newX === snake.body[i].x && newY === snake.body[i].y) {
                        return false;
                    }
                }
                
                // Check opponent collision
                for (let i = 0; i < opponent.body.length; i++) {
                    if (newX === opponent.body[i].x && newY === opponent.body[i].y) {
                        return false;
                    }
                }
                
                return true;
            });
            
            if (validDirections.length === 0) {
                return snake.direction; // No valid moves, continue current direction
            }
            
            // Use BFS to find shortest path to food
            const path = bfs(head, food, snake, opponent);
            
            if (path && path.length > 0) {
                const nextStep = path[0];
                return {
                    x: nextStep.x - head.x,
                    y: nextStep.y - head.y
                };
            }
            
            // If no path to food, choose random valid direction
            return validDirections[Math.floor(Math.random() * validDirections.length)];
        }
        
        function bfs(start, target, snake, opponent) {
            const queue = [[start]];
            const visited = new Set();
            visited.add(`${start.x},${start.y}`);
            
            while (queue.length > 0) {
                const path = queue.shift();
                const current = path[path.length - 1];
                
                if (current.x === target.x && current.y === target.y) {
                    return path.slice(1); // Return path excluding start
                }
                
                const directions = [
                    { x: 0, y: -1 },
                    { x: 0, y: 1 },
                    { x: -1, y: 0 },
                    { x: 1, y: 0 }
                ];
                
                for (const dir of directions) {
                    const newX = current.x + dir.x;
                    const newY = current.y + dir.y;
                    const key = `${newX},${newY}`;
                    
                    // Check bounds
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        continue;
                    }
                    
                    // Check if visited
                    if (visited.has(key)) {
                        continue;
                    }
                    
                    // Check self collision (excluding tail)
                    let isSelfCollision = false;
                    for (let i = 0; i < snake.body.length - 1; i++) {
                        if (newX === snake.body[i].x && newY === snake.body[i].y) {
                            isSelfCollision = true;
                            break;
                        }
                    }
                    if (isSelfCollision) continue;
                    
                    // Check opponent collision
                    let isOpponentCollision = false;
                    for (let i = 0; i < opponent.body.length; i++) {
                        if (newX === opponent.body[i].x && newY === opponent.body[i].y) {
                            isOpponentCollision = true;
                            break;
                        }
                    }
                    if (isOpponentCollision) continue;
                    
                    visited.add(key);
                    queue.push([...path, { x: newX, y: newY }]);
                }
            }
            
            return null; // No path found
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw snake 1
            drawSnake(snake1);
            
            // Draw snake 2
            drawSnake(snake2);
        }
        
        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            
            for (let i = 0; i < snake.body.length; i++) {
                const segment = snake.body[i];
                
                // Draw segment
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
                
                // Draw eyes on head
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (snake.direction.x === 1) { // Right
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (snake.direction.x === -1) { // Left
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset - eyeSize, segment.y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset - eyeSize, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (snake.direction.y === -1) { // Up
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset, segment.y * CELL_SIZE + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset - eyeSize, segment.y * CELL_SIZE + eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (snake.direction.y === 1) { // Down
                        ctx.fillRect(segment.x * CELL_SIZE + eyeOffset, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * CELL_SIZE + CELL_SIZE - eyeOffset - eyeSize, segment.y * CELL_SIZE + CELL_SIZE - eyeOffset, eyeSize, eyeSize);
                    }
                    
                    ctx.fillStyle = snake.color;
                }
            }
        }
        
        // Initialize game
        window.onload = init;
    </script>
</body>
</html>
