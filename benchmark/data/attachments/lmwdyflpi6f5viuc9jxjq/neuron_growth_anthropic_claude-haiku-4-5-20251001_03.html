<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #05070f 0%, #101a3a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 800px;
            height: 800px;
            background: #05070f;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3), inset 0 0 30px rgba(0, 229, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .gui-container {
            position: fixed;
            right: 20px;
            top: 20px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
        }

        .dat-gui {
            background-color: rgba(5, 7, 15, 0.95) !important;
            border: 1px solid #00e5ff !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2) !important;
        }

        .dat-gui .dg {
            color: #00e5ff !important;
        }

        .dat-gui .dg.main {
            background-color: rgba(5, 7, 15, 0.95) !important;
        }

        .dat-gui .dg.main .close-button {
            background-color: #00e5ff !important;
        }

        .dat-gui .dg .property-name {
            color: #ffd400 !important;
        }

        .dat-gui .dg input[type=text],
        .dat-gui .dg input[type=number] {
            background-color: rgba(16, 26, 58, 0.8) !important;
            border: 1px solid #00e5ff !important;
            color: #00e5ff !important;
        }

        .dat-gui .dg input[type=text]:focus,
        .dat-gui .dg input[type=number]:focus {
            background-color: rgba(16, 26, 58, 1) !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5) !important;
        }

        .dat-gui .dg .slider {
            background-color: rgba(16, 26, 58, 0.8) !important;
        }

        .dat-gui .dg .slider-fg {
            background-color: #00e5ff !important;
        }

        .dat-gui .dg .folder {
            border-left: 2px solid #d6ff00 !important;
        }

        .dat-gui .dg .folder .title {
            background-color: rgba(214, 255, 0, 0.1) !important;
            color: #d6ff00 !important;
        }

        .dat-gui .dg button {
            background-color: rgba(255, 212, 0, 0.2) !important;
            border: 1px solid #ffd400 !important;
            color: #ffd400 !important;
            text-shadow: 0 0 5px rgba(255, 212, 0, 0.5) !important;
        }

        .dat-gui .dg button:hover {
            background-color: rgba(255, 212, 0, 0.4) !important;
            box-shadow: 0 0 10px rgba(255, 212, 0, 0.5) !important;
        }

        .dat-gui .dg .cr.color {
            border: 1px solid #ff2bd6 !important;
        }

        .dat-gui .dg .cr.color .color-border {
            border: 1px solid #ff2bd6 !important;
        }

        .dat-gui .dg .cr.color input[type=color] {
            border: 1px solid #ff2bd6 !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 229, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 229, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;

        const config = {
            neuronCount: 4,
            branchGrowthSpeed: 0.5,
            maxBranchDepth: 8,
            branchSplitChance: 0.3,
            branchCurvature: 0.15,
            maxBranchLength: 80,
            synapseDistanceThreshold: 60,
            synapseGlowStrength: 15,
            pulseSpeed: 2,
            pulseFrequency: 0.02,
            pulseBrightness: 1,
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            paused: false
        };

        let neurons = [];
        let synapses = [];
        let pulses = [];
        let animationId = null;
        let frameCount = 0;

        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.branchTips = [];
                this.growing = true;
                this.initBranches();
            }

            initBranches() {
                const branchCount = Math.floor(Math.random() * 3) + 2;
                for (let i = 0; i < branchCount; i++) {
                    const angle = (Math.PI * 2 * i) / branchCount + (Math.random() - 0.5) * 0.5;
                    this.branches.push(new Branch(this.x, this.y, angle, 0, this));
                }
            }

            update() {
                if (!this.growing) return;

                let anyGrowing = false;
                for (let branch of this.branches) {
                    if (branch.grow()) {
                        anyGrowing = true;
                    }
                }
                this.growing = anyGrowing;

                this.branchTips = [];
                this.collectBranchTips(this.branches);
            }

            collectBranchTips(branches) {
                for (let branch of branches) {
                    if (branch.children.length === 0) {
                        this.branchTips.push(branch);
                    }
                    this.collectBranchTips(branch.children);
                }
            }

            draw(ctx) {
                for (let branch of this.branches) {
                    branch.draw(ctx);
                }
            }
        }

        class Branch {
            constructor(x, y, angle, depth, neuron) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.neuron = neuron;
                this.length = 0;
                this.maxLength = config.maxBranchLength * (1 - depth * 0.1);
                this.thickness = Math.max(1, 3 - depth * 0.3);
                this.children = [];
                this.growing = true;
                this.segments = [];
            }

            grow() {
                if (!this.growing || this.length >= this.maxLength) {
                    this.growing = false;
                    return false;
                }

                this.length += config.branchGrowthSpeed;

                const curvature = (Math.random() - 0.5) * config.branchCurvature;
                this.angle += curvature;

                const endX = this.x + Math.cos(this.angle) * this.length;
                const endY = this.y + Math.sin(this.angle) * this.length;

                this.segments.push({ x: endX, y: endY });

                if (this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                    const childAngle1 = this.angle + (Math.random() * 0.6 - 0.3);
                    const childAngle2 = this.angle - (Math.random() * 0.6 - 0.3);
                    this.children.push(new Branch(endX, endY, childAngle1, this.depth + 1, this.neuron));
                    this.children.push(new Branch(endX, endY, childAngle2, this.depth + 1, this.neuron));
                }

                for (let child of this.children) {
                    child.grow();
                }

                return true;
            }

            draw(ctx) {
                if (this.segments.length === 0) return;

                const isAccent = Math.random() > 0.7;
                const color = isAccent ? config.accentBranchColor : config.branchColor;

                ctx.strokeStyle = color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                for (let segment of this.segments) {
                    ctx.lineTo(segment.x, segment.y);
                }
                ctx.stroke();

                for (let child of this.children) {
                    child.draw(ctx);
                }
            }

            getTip() {
                if (this.segments.length === 0) {
                    return { x: this.x, y: this.y };
                }
                return this.segments[this.segments.length - 1];
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.tip1 = branch1.getTip();
                this.tip2 = branch2.getTip();
                this.pulseActive = false;
                this.glowIntensity = 0;
            }

            update() {
                this.glowIntensity = Math.sin(frameCount * 0.05) * 0.5 + 0.5;
                if (Math.random() < config.pulseFrequency) {
                    this.pulseActive = true;
                }
            }

            draw(ctx) {
                const distance = Math.hypot(this.tip2.x - this.tip1.x, this.tip2.y - this.tip1.y);

                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.4 + this.glowIntensity * 0.3;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength * (0.5 + this.glowIntensity);

                ctx.beginPath();
                ctx.moveTo(this.tip1.x, this.tip1.y);
                ctx.quadraticCurveTo(
                    (this.tip1.x + this.tip2.x) / 2 + (Math.random() - 0.5) * 20,
                    (this.tip1.y + this.tip2.y) / 2 + (Math.random() - 0.5) * 20,
                    this.tip2.x,
                    this.tip2.y
                );
                ctx.stroke();

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.progress += config.pulseSpeed * 0.01;
            }

            draw(ctx) {
                if (this.progress > 1) return;

                const tip1 = this.synapse.tip1;
                const tip2 = this.synapse.tip2;

                let x, y;
                if (this.direction > 0) {
                    x = tip1.x + (tip2.x - tip1.x) * this.progress;
                    y = tip1.y + (tip2.y - tip1.y) * this.progress;
                } else {
                    x = tip2.x + (tip1.x - tip2.x) * this.progress;
                    y = tip2.y + (tip1.y - tip2.y) * this.progress;
                }

                ctx.fillStyle = config.pulseColor;
                ctx.globalAlpha = (1 - this.progress) * config.pulseBrightness;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 15;

                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            isActive() {
                return this.progress <= 1;
            }
        }

        function initNetwork() {
            neurons = [];
            synapses = [];
            pulses = [];

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const spread = 100;

            for (let i = 0; i < config.neuronCount; i++) {
                const x = centerX + (Math.random() - 0.5) * spread;
                const y = centerY + (Math.random() - 0.5) * spread;
                neurons.push(new Neuron(x, y));
            }
        }

        function detectSynapses() {
            const newSynapses = [];
            const synapseSet = new Set();

            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const tips1 = neurons[i].branchTips;
                    const tips2 = neurons[j].branchTips;

                    for (let tip1 of tips1) {
                        for (let tip2 of tips2) {
                            const t1 = tip1.getTip();
                            const t2 = tip2.getTip();
                            const distance = Math.hypot(t2.x - t1.x, t2.y - t1.y);

                            if (distance < config.synapseDistanceThreshold) {
                                const key = `${i}-${j}-${tip1}-${tip2}`;
                                if (!synapseSet.has(key)) {
                                    newSynapses.push(new Synapse(tip1, tip2));
                                    synapseSet.add(key);
                                }
                            }
                        }
                    }
                }
            }

            synapses = newSynapses;
        }

        function update() {
            if (config.paused) return;

            for (let neuron of neurons) {
                neuron.update();
            }

            detectSynapses();

            for (let synapse of synapses) {
                synapse.update();
            }

            for (let pulse of pulses) {
                pulse.update();
            }

            pulses = pulses.filter(p => p.isActive());

            for (let synapse of synapses) {
                if (synapse.pulseActive && Math.random() < 0.1) {
                    pulses.push(new Pulse(synapse));
                    synapse.pulseActive = false;
                }
            }

            frameCount++;
        }

        function draw() {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowColor = config.branchColor;
            ctx.shadowBlur = 20;

            for (let neuron of neurons) {
                neuron.draw(ctx);
            }

            ctx.shadowBlur = 0;

            for (let synapse of synapses) {
                synapse.draw(ctx);
            }

            for (let pulse of pulses) {
                pulse.draw(ctx);
            }
        }

        function animate() {
            update();
            draw();
            animationId = requestAnimationFrame(animate);
        }

        function setupGUI() {
            const gui = new dat.GUI({ autoPlace: false });
            document.querySelector('.gui-container').appendChild(gui.domElement);

            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 1, 10, 1);
            growthFolder.add(config, 'branchGrowthSpeed', 0.1, 2, 0.1);
            growthFolder.add(config, 'maxBranchDepth', 2, 15, 1);
            growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05);
            growthFolder.add(config, 'branchCurvature', 0, 0.5, 0.05);
            growthFolder.add(config, 'maxBranchLength', 20, 200, 10);
            growthFolder.open();

            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 20, 200, 5);
            synapsesFolder.add(config, 'synapseGlowStrength', 5, 50, 1);
            synapsesFolder.open();

            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 0.5, 5, 0.1);
            pulsesFolder.add(config, 'pulseFrequency', 0, 0.1, 0.01);
            pulsesFolder.add(config, 'pulseBrightness', 0.1, 2, 0.1);
            pulsesFolder.open();

            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor');
            visualsFolder.addColor(config, 'branchColor');
            visualsFolder.addColor(config, 'accentBranchColor');
            visualsFolder.addColor(config, 'synapseColor');
            visualsFolder.addColor(config, 'pulseColor');
            visualsFolder.open();

            gui.add(config, 'paused').name('Pause/Resume');
            gui.add({ regenerate: initNetwork }, 'regenerate').name('Regenerate Network');
            gui.add({ clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); } }, 'clear').name('Clear Canvas');

            gui.open();
        }

        initNetwork();
        setupGUI();
        animate();
    </script>
</body>
</html>
