<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --success: #10b981;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid rgba(229, 231, 235, 0.8);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 28px 28px 18px;
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.5vw, 2.1rem);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .content {
      padding: 24px 28px 28px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .todo-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
      color: var(--text);
    }

    .todo-input:focus {
      border-color: rgba(37, 99, 235, 0.45);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .add-btn {
      border: 0;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.2s ease, opacity 0.2s ease;
      min-width: 110px;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    .add-btn:active {
      transform: translateY(1px);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: rgba(37, 99, 235, 0.25);
    }

    .filter-btn:hover {
      border-color: rgba(37, 99, 235, 0.25);
      color: var(--primary);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      font-size: 0.95rem;
    }

    .clear-btn:hover {
      text-decoration: underline;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .todo-item:hover {
      border-color: rgba(37, 99, 235, 0.2);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
    }

    .toggle {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      margin: 0;
      transition: all 0.2s ease;
      position: relative;
    }

    .toggle:checked {
      border-color: var(--success);
      background: var(--success);
    }

    .toggle:checked::after {
      content: "";
      width: 6px;
      height: 10px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg) translate(-1px, -1px);
      display: block;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: 0;
      background: var(--danger-soft);
      color: var(--danger);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      flex: 0 0 auto;
      transition: transform 0.08s ease, background 0.2s ease;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .delete-btn:active {
      transform: translateY(1px);
    }

    .empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: #fafafa;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .header,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .input-row {
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }

      .meta {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Todo Application">
    <section class="header">
      <h1>Todo List</h1>
      <p class="subtitle">Add tasks, filter them, and keep everything saved locally.</p>
    </section>

    <section class="content">
      <form id="todoForm" class="input-row" autocomplete="off">
        <input id="todoInput" class="todo-input" type="text" placeholder="What needs to be done?" aria-label="New todo" />
        <button class="add-btn" type="submit">Add Todo</button>
      </form>

      <div class="filters" role="tablist" aria-label="Todo filters">
        <button class="filter-btn active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="active">Active</button>
        <button class="filter-btn" type="button" data-filter="completed">Completed</button>
      </div>

      <div class="meta">
        <span id="itemCount">0 items left</span>
        <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
      </div>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty" hidden>No todos yet. Add one above to get started.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "todo_openai_gpt_5_4_mini_01_todos";
    const todoForm = document.getElementById("todoForm");
    const todoInput = document.getElementById("todoInput");
    const todoList = document.getElementById("todoList");
    const emptyState = document.getElementById("emptyState");
    const itemCount = document.getElementById("itemCount");
    const clearCompletedBtn = document.getElementById("clearCompleted");
    const filterButtons = Array.from(document.querySelectorAll(".filter-btn"));

    let todos = loadTodos();
    let currentFilter = "all";

    function loadTodos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function createTodo(text) {
      todos.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        text: text.trim(),
        completed: false
      });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      render();
    }

    function getFilteredTodos() {
      if (currentFilter === "active") return todos.filter(todo => !todo.completed);
      if (currentFilter === "completed") return todos.filter(todo => todo.completed);
      return todos;
    }

    function updateCounts() {
      const activeCount = todos.filter(todo => !todo.completed).length;
      itemCount.textContent = `${activeCount} item${activeCount === 1 ? "" : "s"} left`;
    }

    function render() {
      const filteredTodos = getFilteredTodos();
      todoList.innerHTML = "";

      emptyState.hidden = todos.length !== 0;

      if (filteredTodos.length === 0 && todos.length !== 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No todos match this filter.";
        todoList.appendChild(li);
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement("li");
          li.className = `todo-item${todo.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "toggle";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `Mark "${todo.text}" as ${todo.completed ? "active" : "complete"}`);
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "delete-btn";
          deleteBtn.setAttribute("aria-label", `Delete "${todo.text}"`);
          deleteBtn.textContent = "×";
          deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      updateCounts();
    }

    todoForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      createTodo(text);
      todoInput.value = "";
      todoInput.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(btn => btn.classList.toggle("active", btn === button));
        render();
      });
    });

    clearCompletedBtn.addEventListener("click", clearCompleted);

    render();
  </script>
</body>
</html>
