<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }
        
        .game-title {
            font-size: 28px;
            font-weight: bold;
            color: #4ecca3;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #4ecca3;
            border-radius: 5px;
            background: transparent;
            color: #4ecca3;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .mode-btn:hover {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        .mode-btn.active {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        .score-board {
            display: flex;
            gap: 30px;
            font-size: 16px;
            min-width: 300px;
            justify-content: center;
        }
        
        .score-item {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #4ecca3;
        }
        
        .score-label {
            color: #888;
            font-size: 12px;
        }
        
        .score-value {
            color: #4ecca3;
            font-weight: bold;
            font-size: 18px;
        }
        
        .game-canvas {
            border: 3px solid #4ecca3;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .overlay-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .overlay-title.start {
            color: #4ecca3;
        }
        
        .overlay-title.gameover {
            color: #e94560;
        }
        
        .overlay-title.won {
            color: #ffd700;
        }
        
        .overlay-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }
        
        .overlay-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .overlay-btn:hover {
            background: #3db892;
            transform: scale(1.05);
        }
        
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        
        .key {
            display: inline-block;
            padding: 3px 8px;
            background: #2a2a4e;
            border-radius: 3px;
            margin: 0 2px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-title">🐍 SNAKE GAME</div>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="pvc">Player vs CPU</button>
            <button class="mode-btn" data-mode="hvc">Human vs CPU</button>
            <button class="mode-btn" data-mode="ccp">CPU vs CPU</button>
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">High Score</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" class="game-canvas" width="600" height="600"></canvas>
        
        <div class="overlay" id="overlay">
            <h1 class="overlay-title start" id="overlayTitle">Snake Game</h1>
            <p class="overlay-message" id="overlayMessage">Press Start to Play</p>
            <button class="overlay-btn" id="startBtn">START GAME</button>
            <div class="instructions">
                Controls: <span class="key">←</span> <span class="key">→</span> <span class="key">↑</span> <span class="key">↓</span> to move<br>
                <span class="key">Space</span> to pause/resume | <span class="key">R</span> to restart<br>
                <span class="key">P</span> to toggle player mode
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const GAME_SPEED = 100; // milliseconds
        
        // Game State
        let gameLoop = null;
        let lastRenderTime = 0;
        let isPaused = false;
        let isGameOver = false;
        let gameMode = 'pvc'; // pvc, hvc, ccp
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let playerEnabled = true;
        
        // Entities
        let snakes = [];
        let foods = [];
        let particles = [];
        
        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMessage = document.getElementById('overlayMessage');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const modeButtons = document.querySelectorAll('.mode-btn');
        
        // Initialize
        highScoreDisplay.textContent = highScore;
        
        // Snake Class
        class Snake {
            constructor(id, x, y, color, isPlayer = false) {
                this.id = id;
                this.segments = [{x, y}];
                this.direction = {x: 1, y: 0}; // Moving right
                this.nextDirection = {x: 1, y: 0};
                this.color = color;
                this.isPlayer = isPlayer;
                this.alive = true;
                this.speed = isPlayer ? 1 : 0.9; // Player is slightly faster
            }
            
            changeDirection(x, y) {
                if (this.isPlayer) {
                    // Prevent reversing
                    if (this.direction.x + x === 0 && this.direction.y + y === 0) return;
                    this.nextDirection = {x, y};
                }
            }
            
            update() {
                if (!this.alive) return;
                
                this.direction = {...this.nextDirection};
                const head = {
                    x: this.segments[0].x + this.direction.x,
                    y: this.segments[0].y + this.direction.y
                };
                
                this.segments.unshift(head);
                this.segments.pop();
            }
            
            grow() {
                const tail = this.segments[this.segments.length - 1];
                this.segments.push({x: tail.x, y: tail.y});
            }
            
            checkCollision() {
                if (!this.alive) return;
                
                const head = this.segments[0];
                
                // Wall collision
                if (head.x < 0 || head.x >= GRID_SIZE || 
                    head.y < 0 || head.y >= GRID_SIZE) {
                    this.alive = false;
                    return 'wall';
                }
                
                // Self collision (skip first few segments to avoid immediate death)
                for (let i = 4; i < this.segments.length; i++) {
                    if (head.x === this.segments[i].x && head.y === this.segments[i].y) {
                        this.alive = false;
                        return 'self';
                    }
                }
                
                return null;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                this.segments.forEach((segment, index) => {
                    // Make head slightly larger
                    const padding = index === 0 ? 1 : 2;
                    ctx.fillRect(
                        segment.x * CELL_SIZE + padding,
                        segment.y * CELL_SIZE + padding,
                        CELL_SIZE - padding * 2,
                        CELL_SIZE - padding * 2
                    );
                });
                
                // Draw eyes on head
                if (this.alive) {
                    const head = this.segments[0];
                    const eyeSize = 4;
                    const eyeOffset = 5;
                    
                    ctx.fillStyle = '#fff';
                    
                    // Determine eye positions based on direction
                    let eye1X, eye1Y, eye2X, eye2Y;
                    
                    if (this.direction.x === 1) { // Right
                        eye1X = head.x * CELL_SIZE + CELL_SIZE - eyeOffset;
                        eye1Y = head.y * CELL_SIZE + eyeOffset;
                        eye2X = head.x * CELL_SIZE + CELL_SIZE - eyeOffset;
                        eye2Y = head.y * CELL_SIZE + CELL_SIZE - eyeOffset;
                    } else if (this.direction.x === -1) { // Left
                        eye1X = head.x * CELL_SIZE + eyeOffset;
                        eye1Y = head.y * CELL_SIZE + eyeOffset;
                        eye2X = head.x * CELL_SIZE + eyeOffset;
                        eye2Y = head.y * CELL_SIZE + CELL_SIZE - eyeOffset;
                    } else if (this.direction.y === -1) { // Up
                        eye1X = head.x * CELL_SIZE + eyeOffset;
                        eye1Y = head.y * CELL_SIZE + eyeOffset;
                        eye2X = head.x * CELL_SIZE + CELL_SIZE - eyeOffset;
                        eye2Y = head.y * CELL_SIZE + eyeOffset;
                    } else { // Down
                        eye1X = head.x * CELL_SIZE + eyeOffset;
                        eye1Y = head.y * CELL_SIZE + CELL_SIZE - eyeOffset;
                        eye2X = head.x * CELL_SIZE + CELL_SIZE - eyeOffset;
                        eye2Y = head.y * CELL_SIZE + CELL_SIZE - eyeOffset;
                    }
                    
                    ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
                    ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);
                }
            }
        }
        
        // Food Class
        class Food {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.pulse = 0;
            }
            
            draw() {
                const pulseScale = 1 + Math.sin(this.pulse) * 0.1;
                this.pulse += 0.1;
                
                ctx.save();
                ctx.translate(
                    (this.x + 0.5) * CELL_SIZE,
                    (this.y + 0.5) * CELL_SIZE
                );
                ctx.scale(pulseScale, pulseScale);
                
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.arc(0, 0, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Shine effect
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(-2, -2, CELL_SIZE / 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Particle Class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 4,
                    y: (Math.random() - 0.5) * 4
                };
                this.alpha = 1;
            }
            
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.03;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.restore();
            }
        }
        
        // Spawn food at random position
        function spawnFood() {
            let x, y, occupied;
            do {
                occupied = false;
                x = Math.floor(Math.random() * GRID_SIZE);
                y = Math.floor(Math.random() * GRID_SIZE);
                
                // Check if position is occupied by any snake
                for (const snake of snakes) {
                    for (const segment of snake.segments) {
                        if (segment.x === x && segment.y === y) {
                            occupied = true;
                            break;
                        }
                    }
                    if (occupied) break;
                }
            } while (occupied);
            
            foods.push(new Food(x, y));
        }
        
        // Create initial snakes based on game mode
        function initializeSnakes() {
            snakes = [];
            foods = [];
            
            const colors = ['#4ecca3', '#e94560', '#ffd700'];
            
            // Determine snake positions and modes
            if (gameMode === 'pvc') {
                // Player vs CPU
                snakes.push(new Snake(0, 5, 5, colors[0], true));
                snakes.push(new Snake(1, 24, 5, colors[1], false));
            } else if (gameMode === 'hvc') {
                // Human vs CPU (two players)
                snakes.push(new Snake(0, 5, 5, colors[0], true));
                snakes.push(new Snake(1, 24, 5, colors[1], true));
                snakes.push(new Snake(2, 5, 24, colors[2], false));
            } else if (gameMode === 'ccp') {
                // CPU vs CPU
                snakes.push(new Snake(0, 5, 5, colors[0], false));
                snakes.push(new Snake(1, 24, 5, colors[1], false));
                snakes.push(new Snake(2, 5, 24, colors[2], false));
            }
            
            // Spawn initial food
            spawnFood();
        }
        
        // CPU AI for simple snakes
        function updateCpuSnake(snake) {
            if (!snake.isPlayer || !snake.alive) return;
            
            const head = snake.segments[0];
            const possibleMoves = [
                {x: 0, y: -1}, // Up
                {x: 0, y: 1},  // Down
                {x: -1, y: 0}, // Left
                {x: 1, y: 0}   // Right
            ];
            
            // Filter out invalid moves (walls, self)
            const validMoves = possibleMoves.filter(move => {
                const newX = head.x + move.x;
                const newY = head.y + move.y;
                
                // Check walls
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }
                
                // Check self collision
                for (let i = 4; i < snake.segments.length; i++) {
                    if (snake.segments[i].x === newX && snake.segments[i].y === newY) {
                        return false;
                    }
                }
                
                return true;
            });
            
            if (validMoves.length === 0) return;
            
            // Find closest food
            let closestFood = null;
            let minDistance = Infinity;
            
            for (const food of foods) {
                const distance = Math.abs(food.x - head.x) + Math.abs(food.y - head.y);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestFood = food;
                }
            }
            
            if (closestFood) {
                // Find move that gets closer to food
                for (const move of validMoves) {
                    const newX = head.x + move.x;
                    const newY = head.y + move.y;
                    const newDistance = Math.abs(closestFood.x - newX) + Math.abs(closestFood.y - newY);
                    
                    if (newDistance < minDistance) {
                        snake.nextDirection = move;
                        return;
                    }
                }
            }
            
            // If no clear path to food, pick any valid move
            snake.nextDirection = validMoves[0];
        }
        
        // Check for food collisions
        function checkFoodCollisions() {
            for (const snake of snakes) {
                if (!snake.alive) continue;
                
                for (let i = 0; i < foods.length; i++) {
                    const food = foods[i];
                    const head = snake.segments[0];
                    
                    if (head.x === food.x && head.y === food.y) {
                        snake.grow();
                        score += 10;
                        scoreDisplay.textContent = score;
                        
                        // Update high score
                        if (score > highScore) {
                            highScore = score;
                            highScoreDisplay.textContent = highScore;
                            localStorage.setItem('snakeHighScore', highScore);
                        }
                        
                        // Create particles
                        for (let j = 0; j < 5; j++) {
                            particles.push(new Particle(
                                food.x * CELL_SIZE + CELL_SIZE / 2,
                                food.y * CELL_SIZE + CELL_SIZE / 2,
                                '#e94560'
                            ));
                        }
                        
                        foods.splice(i, 1);
                        spawnFood();
                        break;
                    }
                }
            }
        }
        
        // Check for snake collisions
        function checkSnakeCollisions() {
            for (const snake of snakes) {
                if (!snake.alive) continue;
                
                const collisionType = snake.checkCollision();
                if (collisionType) {
                    createExplosion(snake.segments[0].x, snake.segments[0].y, snake.color);
                    snake.alive = false;
                    isGameOver = true;
                    showGameOver();
                }
            }
        }
        
        // Create explosion particles
        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x * CELL_SIZE + CELL_SIZE / 2, y * CELL_SIZE + CELL_SIZE / 2, color));
            }
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw food
            foods.forEach(food => food.draw());
            
            // Draw snakes
            snakes.forEach(snake => snake.draw());
            
            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // Update game state
        function update(time = 0) {
            if (isPaused) return;
            
            const deltaTime = time - lastRenderTime;
            
            if (deltaTime >= GAME_SPEED) {
                // Update player snake
                if (snakes[0] && snakes[0].isPlayer && snakes[0].alive) {
                    snakes[0].update();
                }
                
                // Update CPU snakes
                for (let i = 1; i < snakes.length; i++) {
                    if (snakes[i] && !snakes[i].isPlayer) {
                        updateCpuSnake(snakes[i]);
                        if (snakes[i].alive) {
                            snakes[i].update();
                        }
                    }
                }
                
                // Check collisions
                checkFoodCollisions();
                checkSnakeCollisions();
                
                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                }
                
                lastRenderTime = time;
            }
            
            draw();
            requestAnimationFrame(update);
        }
        
        // Show game over screen
        function showGameOver() {
            overlayTitle.textContent = 'Game Over!';
            overlayTitle.className = 'overlay-title gameover';
            overlayMessage.textContent = `Final Score: ${score}`;
            startBtn.textContent = 'RESTART';
            overlay.classList.remove('hidden');
        }
        
        // Start game
        function startGame() {
            isGameOver = false;
            isPaused = false;
            score = 0;
            scoreDisplay.textContent = score;
            overlay.classList.add('hidden');
            
            // Reset snakes
            initializeSnakes();
            
            // Start game loop
            lastRenderTime = performance.now();
            update();
        }
        
        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                isPaused = !isPaused;
                overlay.classList.toggle('hidden', !isPaused);
                if (!isPaused) {
                    overlayTitle.textContent = 'Snake Game';
                    overlayTitle.className = 'overlay-title start';
                    overlayMessage.textContent = '';
                    startBtn.textContent = 'START GAME';
                }
            } else if (e.code === 'KeyR' && isGameOver) {
                e.preventDefault();
                startGame();
            } else if (e.code === 'KeyP') {
                // Toggle player mode for all snakes
                playerEnabled = !playerEnabled;
                for (const snake of snakes) {
                    snake.isPlayer = playerEnabled;
                }
            }
            
            // Handle direction keys
            if (!isPaused && !isGameOver) {
                const snake = snakes[0];
                if (snake && snake.isPlayer) {
                    switch (e.code) {
                        case 'ArrowUp':
                            snake.changeDirection(0, -1);
                            e.preventDefault();
                            break;
                        case 'ArrowDown':
                            snake.changeDirection(0, 1);
                            e.preventDefault();
                            break;
                        case 'ArrowLeft':
                            snake.changeDirection(-1, 0);
                            e.preventDefault();
                            break;
                        case 'ArrowRight':
                            snake.changeDirection(1, 0);
                            e.preventDefault();
                            break;
                    }
                }
            }
        });
        
        // Mode button handlers
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                gameMode = btn.dataset.mode;
                
                // Update button styles
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // If game is running, stop it
                if (!isPaused && !isGameOver) {
                    overlayMessage.textContent = `Mode changed to: ${gameMode === 'pvc' ? 'Player vs CPU' : gameMode === 'hvc' ? 'Human vs CPU' : 'CPU vs CPU'}`;
                    overlay.classList.remove('hidden');
                }
            });
        });
        
        // Start button handler
        startBtn.addEventListener('click', () => {
            startGame();
        });
        
        // Initial draw
        draw();
    </script>
</body>
</html>
