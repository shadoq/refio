<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(16, 26, 58, 0.5);
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 229, 255, 0.08),
                rgba(0, 229, 255, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                transparent 40%,
                rgba(5, 7, 15, 0.8) 100%
            );
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuralCanvas" width="800" height="800"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // Configuration and State
        const config = {
            growth: {
                neuronCount: 4,
                branchSpeed: 1.5,
                maxDepth: 8,
                splitChance: 0.3,
                curvature: 0.5,
                maxBranchLength: 200
            },
            synapses: {
                distanceThreshold: 60,
                glowStrength: 20
            },
            pulses: {
                pulseSpeed: 3,
                pulseFrequency: 0.02,
                pulseBrightness: 1.0
            },
            visuals: {
                bgColor: '#05070f',
                branchColor: '#00e5ff',
                accentColor: '#d6ff00',
                synapseColor: '#ff2bd6',
                pulseColor: '#fff36a'
            }
        };

        const colors = {
            background: '#05070f',
            backgroundGlow: '#101a3a',
            mainBranch: '#00e5ff',
            accentBranch: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            uiAccent: '#ffd400'
        };

        let canvas, ctx;
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationId;
        let isPaused = false;
        let gui;

        // Initialize
        function init() {
            canvas = document.getElementById('neuralCanvas');
            ctx = canvas.getContext('2d');
            
            setupGUI();
            regenerateNetwork();
            animate();
        }

        // GUI Setup
        function setupGUI() {
            gui = new dat.GUI({ width: 300 });
            
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config.growth, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(regenerateNetwork);
            growthFolder.add(config.growth, 'branchSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config.growth, 'maxDepth', 5, 12, 1).name('Max Depth').onChange(regenerateNetwork);
            growthFolder.add(config.growth, 'splitChance', 0.1, 0.8).name('Split Chance');
            growthFolder.add(config.growth, 'curvature', 0.1, 1.0).name('Curvature');
            growthFolder.add(config.growth, 'maxBranchLength', 100, 400).name('Max Length').onChange(regenerateNetwork);
            
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config.synapses, 'distanceThreshold', 30, 100).name('Distance Threshold').onChange(regenerateNetwork);
            synapsesFolder.add(config.synapses, 'glowStrength', 5, 50).name('Glow Strength');
            
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config.pulses, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulsesFolder.add(config.pulses, 'pulseFrequency', 0.01, 0.1).name('Pulse Frequency');
            pulsesFolder.add(config.pulses, 'pulseBrightness', 0.5, 2.0).name('Pulse Brightness');
            
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config.visuals, 'bgColor').name('Background').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'branchColor').name('Branch Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'accentColor').name('Accent Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'synapseColor').name('Synapse Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'pulseColor').name('Pulse Color').onChange(updateColors);
            
            const actionsFolder = gui.addFolder('Actions');
            actionsFolder.add({ regenerate: regenerateNetwork }, 'regenerate').name('Regenerate Network');
            actionsFolder.add({ clear: clearCanvas }, 'clear').name('Clear Canvas');
            actionsFolder.add({ toggle: togglePause }, 'toggle').name('Pause/Resume');
            
            gui.open();
        }

        function updateColors() {
            canvas.style.backgroundColor = config.visuals.bgColor;
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            synapses = [];
            pulses = [];
        }

        function regenerateNetwork() {
            clearCanvas();
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const seedRadius = 50;
            
            for (let i = 0; i < config.growth.neuronCount; i++) {
                const angle = (i / config.growth.neuronCount) * Math.PI * 2;
                const radius = seedRadius * (0.5 + Math.random() * 0.5);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                neurons.push({
                    x: x,
                    y: y,
                    depth: 0,
                    angle: Math.random() * Math.PI * 2,
                    length: 0,
                    thickness: 3 + Math.random() * 2,
                    color: Math.random() > 0.7 ? colors.accentBranch : colors.mainBranch
                });
            }
            
            // Initial branches from seeds
            neurons.forEach(neuron => {
                branches.push({
                    x: neuron.x,
                    y: neuron.y,
                    angle: neuron.angle,
                    length: 0,
                    targetLength: config.growth.maxBranchLength * (0.7 + Math.random() * 0.3),
                    thickness: neuron.thickness,
                    depth: 0,
                    color: neuron.color,
                    curvature: (Math.random() - 0.5) * config.growth.curvature,
                    splitChance: config.growth.splitChance,
                    parent: neuron
                });
            });
        }

        // Animation Loop
        function animate() {
            if (!isPaused) {
                update();
            }
            draw();
            animationId = requestAnimationFrame(animate);
        }

        function update() {
            // Update branches
            for (let i = branches.length - 1; i >= 0; i--) {
                const branch = branches[i];
                
                if (branch.depth < config.growth.maxDepth && branch.length < branch.targetLength) {
                    branch.length += config.growth.branchSpeed;
                    branch.angle += branch.curvature * 0.02;
                    
                    // Random curvature variation
                    if (Math.random() < 0.05) {
                        branch.curvature = (Math.random() - 0.5) * config.growth.curvature;
                    }
                    
                    // Random split
                    if (branch.depth < config.growth.maxDepth - 1 && 
                        Math.random() < branch.splitChance) {
                        const newBranch = {
                            x: branch.x,
                            y: branch.y,
                            angle: branch.angle + (Math.random() - 0.5) * 1.5,
                            length: 0,
                            targetLength: branch.targetLength * (0.6 + Math.random() * 0.4),
                            thickness: branch.thickness * 0.7,
                            depth: branch.depth + 1,
                            color: Math.random() > 0.5 ? colors.accentBranch : colors.mainBranch,
                            curvature: (Math.random() - 0.5) * config.growth.curvature,
                            splitChance: branch.splitChance * 0.8,
                            parent: branch
                        };
                        branches.push(newBranch);
                    }
                } else if (branch.depth >= config.growth.maxDepth || branch.length >= branch.targetLength) {
                    // Remove completed branches
                    branches.splice(i, 1);
                }
            }
            
            // Update branch positions
            branches.forEach(branch => {
                branch.x += Math.cos(branch.angle) * config.growth.branchSpeed;
                branch.y += Math.sin(branch.angle) * config.growth.branchSpeed;
            });
            
            // Check for synapses
            checkSynapses();
            
            // Update pulses
            updatePulses();
        }

        function checkSynapses() {
            const threshold = config.synapses.distanceThreshold;
            
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    
                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < threshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.branch1 === b1 && s.branch2 === b2) ||
                            (s.branch1 === b2 && s.branch2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push({
                                branch1: b1,
                                branch2: b2,
                                progress: 0,
                                lastPulse: 0
                            });
                        }
                    }
                }
            }
        }

        function updatePulses() {
            // Randomly spawn pulses
            if (Math.random() < config.pulses.pulseFrequency && synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push({
                    synapse: randomSynapse,
                    progress: 0,
                    speed: config.pulses.pulseSpeed
                });
            }
            
            // Update existing pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.progress += pulse.speed * 0.02;
                
                if (pulse.progress >= 1) {
                    pulses.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = config.visuals.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw branches
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            branches.forEach(branch => {
                ctx.beginPath();
                ctx.moveTo(branch.x, branch.y);
                
                // Draw to previous position for smooth animation
                const prevX = branch.x - Math.cos(branch.angle) * config.growth.branchSpeed;
                const prevY = branch.y - Math.sin(branch.angle) * config.growth.branchSpeed;
                
                ctx.lineTo(prevX, prevY);
                ctx.lineWidth = branch.thickness;
                ctx.strokeStyle = branch.color;
                ctx.shadowBlur = config.synapses.glowStrength;
                ctx.shadowColor = branch.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            
            // Draw synapses
            synapses.forEach(synapse => {
                const dx = synapse.branch1.x - synapse.branch2.x;
                const dy = synapse.branch1.y - synapse.branch2.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                ctx.beginPath();
                ctx.moveTo(synapse.branch1.x, synapse.branch1.y);
                ctx.lineTo(synapse.branch2.x, synapse.branch2.y);
                ctx.lineWidth = 2;
                ctx.strokeStyle = colors.synapse;
                ctx.shadowBlur = config.synapses.glowStrength;
                ctx.shadowColor = colors.synapse;
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Draw synapse glow
                ctx.beginPath();
                ctx.arc(synapse.branch1.x, synapse.branch1.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = colors.synapse;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(synapse.branch2.x, synapse.branch2.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = colors.synapse;
                ctx.fill();
            });
            
            // Draw pulses
            pulses.forEach(pulse => {
                const synapse = pulse.synapse;
                const progress = pulse.progress;
                
                const x = synapse.branch1.x + (synapse.branch2.x - synapse.branch1.x) * progress;
                const y = synapse.branch1.y + (synapse.branch2.y - synapse.branch1.y) * progress;
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = colors.pulse;
                ctx.shadowBlur = config.synapses.glowStrength * pulseBrightness();
                ctx.shadowColor = colors.pulse;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // Draw seed neurons
            neurons.forEach(neuron => {
                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = colors.mainBranch;
                ctx.shadowBlur = config.synapses.glowStrength;
                ctx.shadowColor = colors.mainBranch;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function pulseBrightness() {
            return config.pulses.pulseBrightness;
        }

        // Start the simulation
        init();
    </script>
</body>
</html>
