<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Growth Simulation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.css">
  <style>
    :root {
      color-scheme: dark;
      --background: #05070f;
      --glow: #101a3a;
      --accent: #ffd400;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at center, var(--glow) 0%, var(--background) 68%),
        var(--background);
      color: #e8f7ff;
      font-family: "Courier New", monospace;
    }

    main {
      width: min(100%, 800px);
      position: relative;
      border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.12), 0 0 90px rgba(16, 26, 58, 0.6);
      background: #05070f;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      background: #05070f;
    }

    .label {
      position: absolute;
      top: 16px;
      left: 18px;
      z-index: 1;
      color: #ffd400;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-shadow: 0 0 10px rgba(255, 212, 0, 0.65);
      pointer-events: none;
    }

    .dat.gui {
      color: #e8f7ff;
    }

    .dg.main {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 5;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .dg.main .close-button {
      background: #101a3a;
      color: #ffd400;
    }

    @media (max-width: 1100px) {
      .dg.main {
        top: auto;
        bottom: 16px;
        right: 16px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      .dg.main {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="label">NEURAL NETWORK // LIVE GROWTH</div>
    <canvas id="canvas" width="800" height="800" aria-label="Animated neon neuron growth simulation"></canvas>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;

      const settings = {
        neuronCount: 4,
        growthSpeed: 1.4,
        maxDepth: 8,
        splitChance: 0.085,
        curvature: 0.22,
        maxBranchLength: 150,
        synapseDistance: 34,
        synapseGlow: 16,
        pulseSpeed: 115,
        pulseFrequency: 1.7,
        pulseBrightness: 1,
        backgroundColor: "#05070f",
        branchColor: "#00e5ff",
        accentBranchColor: "#d6ff00",
        synapseColor: "#ff2bd6",
        pulseColor: "#fff36a",
        glow: 15,
        scanlines: true,
        regenerateNetwork: () => regenerate(),
        clearCanvas: () => clearNetwork(),
        pauseResume: () => togglePause()
      };

      const branches = [];
      const synapses = [];
      const synapseKeys = new Set();
      const pulses = [];
      let nextBranchId = 0;
      let pulseClock = 0;
      let paused = false;
      let lastTime = performance.now();
      let frameCount = 0;

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function makeBranch(x, y, angle, depth, parent = null) {
        if (branches.length >= 600 || depth > settings.maxDepth) return null;
        const branch = {
          id: nextBranchId++,
          parent,
          depth,
          angle,
          x,
          y,
          points: [{ x, y }],
          length: 0,
          targetLength: random(settings.maxBranchLength * 0.55, settings.maxBranchLength),
          width: Math.max(0.65, 3.8 - depth * 0.38) * random(0.82, 1.15),
          color: depth % 3 === 2 ? settings.accentBranchColor : settings.branchColor,
          splitAt: random(0.25, 0.82),
          splitDone: false,
          finished: false
        };
        branches.push(branch);
        return branch;
      }

      function regenerate() {
        branches.length = 0;
        synapses.length = 0;
        synapseKeys.clear();
        pulses.length = 0;
        nextBranchId = 0;
        pulseClock = 0;

        const count = Math.round(clamp(settings.neuronCount, 3, 6));
        const cx = width / 2;
        const cy = height / 2;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i / count) + random(-0.45, 0.45);
          const radius = random(8, 28);
          makeBranch(
            cx + Math.cos(angle) * radius,
            cy + Math.sin(angle) * radius,
            angle + random(-0.4, 0.4),
            0
          );
        }
      }

      function clearNetwork() {
        branches.length = 0;
        synapses.length = 0;
        synapseKeys.clear();
        pulses.length = 0;
        pulseClock = 0;
      }

      function togglePause() {
        paused = !paused;
        settings.pauseResume = paused ? () => togglePause() : () => togglePause();
      }

      function branchTip(branch) {
        return branch.points[branch.points.length - 1];
      }

      function spawnChild(branch, side = 1) {
        if (branches.length >= 600 || branch.depth >= settings.maxDepth) return;
        const tip = branchTip(branch);
        const spread = random(0.45, 1.05) * side;
        makeBranch(tip.x, tip.y, branch.angle + spread, branch.depth + 1, branch.id);
      }

      function growBranch(branch, dt) {
        if (branch.finished) return;
        const stepDistance = Math.min(3.2, 1.7 * settings.growthSpeed * dt * 60);
        const remaining = branch.targetLength - branch.length;
        if (remaining <= 0) {
          branch.finished = true;
          return;
        }

        const step = Math.min(stepDistance, remaining);
        branch.angle += random(-settings.curvature, settings.curvature) * 0.1;
        const previous = branchTip(branch);
        const x = previous.x + Math.cos(branch.angle) * step;
        const y = previous.y + Math.sin(branch.angle) * step;
        branch.points.push({ x, y });
        branch.length += step;

        if (
          !branch.splitDone &&
          branch.depth < settings.maxDepth &&
          branch.length >= branch.targetLength * branch.splitAt
        ) {
          branch.splitDone = true;
          if (Math.random() < settings.splitChance) {
            spawnChild(branch, Math.random() < 0.5 ? -1 : 1);
            if (Math.random() < 0.22 && branches.length < 598) {
              spawnChild(branch, Math.random() < 0.5 ? -1 : 1);
            }
          }
        }

        if (branch.length >= branch.targetLength) branch.finished = true;
        if (x < -60 || x > width + 60 || y < -60 || y > height + 60) {
          branch.finished = true;
        }
      }

      function detectSynapses() {
        const threshold = settings.synapseDistance;
        for (let i = 0; i < branches.length; i++) {
          const a = branches[i];
          if (a.points.length < 8) continue;
          const tipA = branchTip(a);
          for (let j = i + 1; j < branches.length; j++) {
            const b = branches[j];
            if (b.points.length < 8 || a.parent === b.id || b.parent === a.id) continue;
            const key = a.id < b.id ? `${a.id}:${b.id}` : `${b.id}:${a.id}`;
            if (synapseKeys.has(key)) continue;
            const tipB = branchTip(b);
            const dx = tipA.x - tipB.x;
            const dy = tipA.y - tipB.y;
            if (dx * dx + dy * dy <= threshold * threshold) {
              synapseKeys.add(key);
              synapses.push({
                key,
                a: a.id,
                b: b.id,
                x1: tipA.x,
                y1: tipA.y,
                x2: tipB.x,
                y2: tipB.y,
                phase: random(0, Math.PI * 2)
              });
            }
          }
        }
      }

      function pathLength(branch) {
        let total = 0;
        for (let i = 1; i < branch.points.length; i++) {
          const dx = branch.points[i].x - branch.points[i - 1].x;
          const dy = branch.points[i].y - branch.points[i - 1].y;
          total += Math.hypot(dx, dy);
        }
        return total;
      }

      function pointAlongBranch(branch, distance) {
        let remaining = distance;
        for (let i = 1; i < branch.points.length; i++) {
          const from = branch.points[i - 1];
          const to = branch.points[i];
          const segmentLength = Math.hypot(to.x - from.x, to.y - from.y);
          if (remaining <= segmentLength) {
            const t = segmentLength ? remaining / segmentLength : 0;
            return {
              x: from.x + (to.x - from.x) * t,
              y: from.y + (to.y - from.y) * t
            };
          }
          remaining -= segmentLength;
        }
        return branchTip(branch);
      }

      function spawnPulse() {
        const candidates = branches.filter(branch => pathLength(branch) > 22);
        if (!candidates.length) return;
        const branch = candidates[Math.floor(Math.random() * candidates.length)];
        pulses.push({
          kind: "branch",
          branchId: branch.id,
          distance: 0,
          link: null,
          t: 0,
          direction: 1
        });
      }

      function updatePulses(dt) {
        pulseClock += dt * settings.pulseFrequency;
        while (pulseClock >= 1) {
          spawnPulse();
          pulseClock -= 1;
        }

        const speed = settings.pulseSpeed * dt;
        for (let i = pulses.length - 1; i >= 0; i--) {
          const pulse = pulses[i];
          if (pulse.kind === "branch") {
            const branch = branches.find(item => item.id === pulse.branchId);
            if (!branch) {
              pulses.splice(i, 1);
              continue;
            }
            pulse.distance += speed;
            const total = pathLength(branch);
            if (pulse.distance >= total) {
              const connected = synapses.filter(link => link.a === branch.id || link.b === branch.id);
              if (connected.length && Math.random() < 0.75) {
                const link = connected[Math.floor(Math.random() * connected.length)];
                pulses[i] = {
                  kind: "link",
                  branchId: branch.id,
                  distance: 0,
                  link,
                  t: link.a === branch.id ? 0 : 1,
                  direction: link.a === branch.id ? 1 : -1
                };
              } else {
                pulses.splice(i, 1);
              }
            }
          } else {
            const linkLength = Math.hypot(pulse.link.x2 - pulse.link.x1, pulse.link.y2 - pulse.link.y1);
            pulse.t += pulse.direction * (speed / Math.max(1, linkLength));
            if (pulse.t < 0 || pulse.t > 1) pulses.splice(i, 1);
          }
        }

        if (pulses.length > 90) pulses.splice(0, pulses.length - 90);
      }

      function drawBackground(time) {
        ctx.fillStyle = settings.backgroundColor;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width / 2, height / 2, 70, width / 2, height / 2, 530);
        glow.addColorStop(0, "rgba(16, 26, 58, 0.44)");
        glow.addColorStop(1, "rgba(5, 7, 15, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
        ctx.lineWidth = 1;
        for (let y = 0; y < height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(width, y + 0.5);
          ctx.stroke();
        }
        if (settings.scanlines) {
          ctx.fillStyle = "rgba(0, 229, 255, 0.025)";
          for (let y = (time * 0.035) % 5; y < height; y += 5) {
            ctx.fillRect(0, y, width, 1);
          }
        }
        ctx.restore();

        const vignette = ctx.createRadialGradient(width / 2, height / 2, 260, width / 2, height / 2, 590);
        vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.5)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
      }

      function drawBranch(branch) {
        if (branch.points.length < 2) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(branch.points[0].x, branch.points[0].y);
        for (let i = 1; i < branch.points.length - 1; i++) {
          const current = branch.points[i];
          const next = branch.points[i + 1];
          const midX = (current.x + next.x) * 0.5;
          const midY = (current.y + next.y) * 0.5;
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        }
        const last = branchTip(branch);
        ctx.lineTo(last.x, last.y);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = branch.color;
        ctx.lineWidth = branch.width;
        ctx.shadowColor = branch.color;
        ctx.shadowBlur = settings.glow;
        ctx.stroke();
        ctx.shadowBlur = 2;
        ctx.lineWidth = Math.max(0.45, branch.width * 0.35);
        ctx.strokeStyle = "rgba(235, 255, 255, 0.72)";
        ctx.stroke();
        ctx.restore();
      }

      function drawSynapses(time) {
        for (const link of synapses) {
          const pulse = 0.5 + 0.5 * Math.sin(time * 0.004 + link.phase);
          ctx.save();
          ctx.globalAlpha = 0.5 + pulse * 0.45;
          ctx.strokeStyle = settings.synapseColor;
          ctx.lineWidth = 1.2 + pulse * 1.1;
          ctx.shadowColor = settings.synapseColor;
          ctx.shadowBlur = settings.synapseGlow;
          ctx.beginPath();
          ctx.moveTo(link.x1, link.y1);
          ctx.lineTo(link.x2, link.y2);
          ctx.stroke();
          ctx.fillStyle = settings.synapseColor;
          ctx.beginPath();
          ctx.arc((link.x1 + link.x2) * 0.5, (link.y1 + link.y2) * 0.5, 2 + pulse * 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawPulses() {
        for (const pulse of pulses) {
          let point;
          if (pulse.kind === "branch") {
            const branch = branches.find(item => item.id === pulse.branchId);
            if (!branch) continue;
            point = pointAlongBranch(branch, pulse.distance);
          } else {
            point = {
              x: pulse.link.x1 + (pulse.link.x2 - pulse.link.x1) * pulse.t,
              y: pulse.link.y1 + (pulse.link.y2 - pulse.link.y1) * pulse.t
            };
          }

          ctx.save();
          ctx.globalAlpha = clamp(settings.pulseBrightness, 0.1, 2);
          ctx.fillStyle = settings.pulseColor;
          ctx.shadowColor = settings.pulseColor;
          ctx.shadowBlur = 22;
          ctx.beginPath();
          ctx.arc(point.x, point.y, 3.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function draw(time) {
        drawBackground(time);
        for (const branch of branches) drawBranch(branch);
        drawSynapses(time);
        drawPulses();
      }

      function animate(time) {
        const dt = Math.min(0.04, Math.max(0, (time - lastTime) / 1000));
        lastTime = time;

        if (!paused) {
          for (let i = 0; i < branches.length; i++) {
            growBranch(branches[i], dt);
          }
          if (++frameCount % 12 === 0) detectSynapses();
          updatePulses(dt);
        }

        draw(time);
        requestAnimationFrame(animate);
      }

      const gui = new dat.GUI({ width: 300 });
      const growth = gui.addFolder("Growth");
      growth.add(settings, "neuronCount", 3, 6, 1).name("Neuron count").onFinishChange(regenerate);
      growth.add(settings, "growthSpeed", 0.2, 4, 0.1).name("Branch growth speed");
      growth.add(settings, "maxDepth", 2, 12, 1).name("Max branch depth").onFinishChange(regenerate);
      growth.add(settings, "splitChance", 0, 0.25, 0.005).name("Branch split chance");
      growth.add(settings, "curvature", 0, 0.8, 0.01).name("Branch curvature");
      growth.add(settings, "maxBranchLength", 50, 260, 5).name("Max branch length");
      growth.open();

      const synapseFolder = gui.addFolder("Synapses");
      synapseFolder.add(settings, "synapseDistance", 10, 75, 1).name("Distance threshold");
      synapseFolder.add(settings, "synapseGlow", 0, 35, 1).name("Synapse glow strength");

      const pulsesFolder = gui.addFolder("Pulses");
      pulsesFolder.add(settings, "pulseSpeed", 20, 260, 5).name("Pulse speed");
      pulsesFolder.add(settings, "pulseFrequency", 0.1, 8, 0.1).name("Pulse frequency");
      pulsesFolder.add(settings, "pulseBrightness", 0.1, 2, 0.05).name("Pulse brightness");

      const visuals = gui.addFolder("Visuals");
      visuals.addColor(settings, "backgroundColor").name("Background color");
      visuals.addColor(settings, "branchColor").name("Branch color");
      visuals.addColor(settings, "accentBranchColor").name("Accent branch color");
      visuals.addColor(settings, "synapseColor").name("Synapse color");
      visuals.addColor(settings, "pulseColor").name("Pulse color");
      visuals.add(settings, "glow", 0, 30, 1).name("Branch glow");
      visuals.add(settings, "scanlines").name("Scanlines");

      gui.add(settings, "regenerateNetwork").name("Regenerate network");
      gui.add(settings, "clearCanvas").name("Clear canvas");
      gui.add(settings, "pauseResume").name("Pause / resume");

      regenerate();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
