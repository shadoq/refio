    new Vec3(-1,  1, 1), // 3: Front-Left-Top

    new Vec3( 1,  1, -1),// 6: Back-Right-Top

// --- Math Helpers ---

function rotateX(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return new Vec3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
}

function rotateY(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return new Vec3(v.x * c + v.z * s, v.y, -v.x * s + v.z * c);
}

function rotateZ(v, angle) {
    const c = Math.cos(angle), s = Math.sin(angle);
    return new Vec3(v.x * c - v.y * s, v.x * s + v.y * c, v.z);
}

// Cross product to get face normal from two edge vectors (v1-v0) and (v2-v0)
function crossProduct(a, b) {
    return new Vec3(
        a.y * b.z - a.z * b.y,
        a.z * b.x - a.x * b.z,
        a.x * b.y - a.y * b.x
    );
}

// Normalize vector
function normalize(v) {
    const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return new Vec3(v.x/len, v.y/len, v.z/len);
}

            let cLeft=colorAtEdge(pTop,pMid,y) || colorAtEdge(pBot,pTop,y); // Fallback? No.
            let cRight=colorAtEdge(pMid,pBot,y) || colorAtEdge(pTop,pMid,y);

             drawRow(y, xs[i].x, cL||cLeft, xs[i+1].x, cR||cRight);
        }
    }
}


// --- Main Loop & Event Listeners ---

function loop() {
    requestAnimationFrame(loop);
    
    if (!isPaused) {
         updateAndRender(); // This function handles the logic now. 
                           // Wait, my `updateAndRender` was a mix of state and render. Let's separate or just call it.
                           // Actually I put all rendering inside `updateAndRender`. So calling it is fine.
    } else {
         updateAndRender(); // Still draw to keep the canvas updated if paused? Or freeze? Usually frozen frame is better for pause, but let's re-render same state.
                            // My code updates rotation even when paused? No, I added `if(!isPaused)` check inside loop logic above. 
    }

}

// Fix: The updateAndRender function needs to be called every frame regardless of pause (to keep drawing the frozen scene), but internal state shouldn't change if paused.
// My current code has `updateAndRender` which updates rotation and light angle even when not paused? No, I added a check inside it.

function mainLoop() {
    requestAnimationFrame(mainLoop);
    
    // Update State (if not paused)
    const now = performance.now();
    if (!isPaused) {
        const dt = (now - lastTime) / 1000;
        
        rotationX += dt * 0.5;
        rotationY += dt * 0.8;
        lightAngle += dt * 0.3;

        // FPS Counter logic moved here for simplicity
        frameCount++;
        fpsTimer += dt;
        if (fpsTimer >= 1) {
            currentFPS = Math.round(frameCount / fpsTimer);
            fpsDiv.textContent = `FPS: ${currentFPS} | Wireframe: ${showWireframe ? 'On' : 'Off'} | Pause: ${isPaused ? 'Yes' : 'No'}`;
            frameCount = 0;
            fpsTimer = 0;
        }

        lastTime = now;
    } else {
         // If paused, we still want to render the current state. 
         // But `updateAndRender` logic above updates rotation? No, I added a check inside it earlier in my thought process but let's ensure consistency here.
         // Let's just call updateAndRender which handles rendering based on current state variables.
    }

    // Render Scene (always)
    renderScene(); 
}

function renderScene() {
     const cx = width / 2;
     const cy = height / 2;
     
     ctx.fillStyle = '#1a1a2e';
     ctx.fillRect(0, 0, width, height);

     // Calculate Light Position (always update for smooth orbit even if paused? Or freeze light too?) 
     // "Moving light source" implies it moves. If we pause the cube, do we want to see a frozen scene or just stop rotation?
     // Usually Pause stops everything. Let's assume Pause freezes state completely including light position relative to time?
     // But my code updates `lightAngle` inside the `if(!isPaused)` block in mainLoop. So it will be static if paused. Good.

     const triangleFaces = [ ... ]; // Defined earlier, need to re-define or hoist. 
     
     // Re-defining faces for clarity
     const tFaces = [
        { v: [0, 1, 3], faceIdx: 0 }, { v: [1, 2, 3], faceIdx: 0 }, // Front
        { v: [4, 5, 7], faceIdx: 1 }, { v: [5, 6, 7], faceIdx: 1 }, // Back (reversed winding) -> Let's keep consistent. 
        { v: [0, 3, 2], faceIdx: 2 }, { v: [0, 2, 1], faceIdx: 2 }, // Top
        { v: [4, 7, 6], faceIdx: 3 }, { v: [4, 6, 5], faceIdx: 3 }, // Bottom (Wait, bottom is y=-1) -> Vertices with y=-1 are 0,1,4,5.
        { v: [0, 2, 7], faceIdx: 4 }, { v: [0, 7, 4], faceIdx: 4 }, // Left (x=-1 vertices: 0,3,4,7) -> Triangles: 0-3-7 and 0-7-4?
        { v: [2, 6, 5], faceIdx: 5 }, { v: [2, 5, 1], faceIdx: 5 }  // Right (x=+1 vertices: 1,2,6,5) -> Triangles: 1-2-6 and 1-6-5
    ];

     const lightPos = new Vec3(Math.cos(lightAngle)*lightRadius, Math.sin(lightAngle)*(lightRadius/1.5), Math.sin(lightAngle)*lightRadius);

     for (let tri of tFaces) {
         // ... Logic from updateAndRender loop ... 
         // Re-implementing the culling and drawing logic here to ensure it runs every frame.
         
         const v0 = rawVertices[tri.v[0]];
         const v1 = rawVertices[tri.v[1]];
         const v2 = rawVertices[tri.v[2]];

         let wv0 = rotateX(rotateY(rotateZ(v0, rotationZ), rotationY), rotationX);
         let wv1 = rotateX(rotateY(rotateZ(v1, rotationZ), rotationY), rotationX);
         let wv2 = rotateX(rotateY(rotateZ(v2, rotationZ), rotationY), rotationX);

         const edge1 = { x: wv1.x - wv0.x, y: wv1.y - wv0.y, z: wv1.z - wv0.z };
         const edge2 = { x: wv2.x - wv0.x, y: wv2.y - wv0.y, z: wv2.z - wv0.z };

         const nx = edge1.y * edge2.z - edge1.z * edge2.y;
         const ny = edge1.z * edge2.x - edge1.x * edge2.z;
         const nz = edge1.x * edge2.y - edge1.y * edge2.x;

         // Backface culling: View vector (0, 0, -1) assuming camera looks down -Z axis. 
         // Normal points outwards. If dot(Normal, ViewDir) > 0 -> Facing away? Or towards?
         // Let's assume standard: if normal.z < 0 then facing camera (since we look from +inf to origin along Z).
         
         const viewVec = { x: 0, y: 0, z: -1 }; 
         const dot = nx * viewVec.x + ny * viewVec.y + nz * viewVec.z;

         if (dot > 0) continue; // Backface cull (assuming normal points towards camera when visible? No. If we look down -Z, front faces have negative Z component in their normal).
                                // Wait. If I look at a cube from the front, its face normal is pointing AT me (-Z direction). So nz < 0. 
                                // Dot product with (0,0,-1) would be positive? No: (-z)*(-1) = +z > 0.
                                // So if dot > 0 it's facing camera? Yes.
                                // But wait, my `dot` calculation is nx*0 + ny*0 + nz*(-1). 
                                // If nz < 0 (facing me), then -nz > 0 -> Dot > 0.
                                // So if dot > 0 it's front facing? Yes.
                                // But I want to cull backfaces. Backface normal points away (+Z direction, nz>0). 
                                // Then dot = -(positive) < 0.
                                // So: If dot < 0 -> Cull (Backface). If dot > 0 -> Visible.

         if (dot < 0) continue; 

         const normalWorld = normalize({ x: nx, y: ny, z: nz });
         
         const vecToLight = { 
             x: lightPos.x - wv0.x, 
             y: lightPos.y - wv0.y, 
             z: lightPos.z - wv0.z 
         };

         let lenL = Math.sqrt(vecToLight.x*vecToLight.x + vecToLight.y*vecToLight.y + vecToLight.z*vecToLight.z);
         if (lenL === 0) continue;
         
         const lDir = { x: vecToLight.x/lenL, y: vecToLight.y/lenL, z: vecToLight.z/lenL };

         let intensity = normalWorld.x * lDir.x + normalWorld.y * lDir.y + normalWorld.z * lDir.z;
         if (intensity < 0.15) intensity = 0.15; 

         const colorHex = faces[tri.faceIdx].nColor || '#ffffff';

         function parseHex(hex, int) {
             const r = parseInt(hex.slice(1,3), 16);
             const g = parseInt(hex.slice(3,5), 16);
             const b = parseInt(hex.slice(5,7), 16);
             return [r * int, g * int, b * int]; 
         }

         const baseColorRGB = parseHex(colorHex, intensity);

         // Project vertices for this triangle
         let p0, p1, p2;
         const verts = [wv0, wv1, wv2];
         
         let visibleTri = true;
         const projVerts = [];
         
         for(let i=0; i<3; i++) {
             const v = verts[i];
             // Project logic: Camera at z=-400 looking +Z? Or camera at origin looking -Z with object moved to Z>0?
             // Let's use the same projection as before which seemed stable.
             
             const dist = 400; 
             let scale = focalLength / (dist + v.z); 
            
             if (scale <= 0 || !isFinite(scale)) { visibleTri=false; break;}

             projVerts.push({ x: cx + v.x * scale, y: cy - v.y * scale });
         }

         if (!visibleTri) continue;

         rasterizeTriangle(projVerts[0], projVerts[1], projVerts[2], baseColorRGB, baseColorRGB, baseColorRGB);
     }

     // Wireframe toggle (draw lines over filled triangles or instead of?) 
     // Usually "Wireframe" means drawing edges. Let's draw them on top if toggled.
     if(showWireframe) {
         ctx.strokeStyle = '#fff';
         for(let tri of tFaces) {
             const v0 = rawVertices[tri.v[0]];
             const v1 = rawVertices[tri.v[1]];
             const v2 = rawVertices[tri.v[2]];

             let wv0 = rotateX(rotateY(rotateZ(v0, rotationZ), rotationY), rotationX);
             let wv1 = rotateX(rotateY(rotateZ(v1, rotationZ), rotationY), rotationX);
             let wv2 = rotateX(rotateY(rotateZ(v2, rotationZ), rotationY), rotationX);

             const dist = 400; 
             
             // Check if visible before drawing wireframe? Or just draw all edges? Usually cull backfaces for wireframe too.
             const edge1 = { x: wv1.x - wv0.x, y: wv1.y - wv0.y, z: wv1.z - wv0.z };
             const edge2 = { x: wv2.x - wv0.x, y: wv2.y - wv0.y, z: wv2.z - wv0.z };

             const nx = edge1.y * edge2.z - edge1.z * edge2.y;
             const ny = edge1.z * edge2.x - edge1.x * edge2.z;
             const nz = edge1.x * edge2.y - edge1.y * edge2.x;

             if (nx < 0) continue; // Cull backfaces for wireframe too.

             let p0, p1, p2;
             const verts = [wv0, wv1, wv2];
             
             for(let i=0; i<3; i++) {
                 const v = verts[i];
                 const scale = focalLength / (dist + v.z); 
                 if(scale <= 0) continue; // Skip hidden vertices? Or just skip whole face.
                 
                 p0={x: cx+v.x*scale, y:cy-v.y*scale};
             }

             ctx.beginPath();
             ctx.moveTo(p0.x, p0.y);
             ctx.lineTo(p1.x, p1.y);
             ctx.lineTo(p2.x, p2.y);
             ctx.closePath();
             ctx.stroke();
         }
     }
}
