<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #05070f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const config = {
            neuronCount: 5,
            growthSpeed: 1,
            maxBranchDepth: 6,
            branchSplitChance: 0.3,
            branchCurvature: 0.3,
            maxBranchLength: 150,
            synapseDistance: 40,
            synapseGlow: 20,
            pulseSpeed: 0.05,
            pulseFrequency: 0.002,
            pulseBrightness: 1,
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a'
        };

        // State
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let frameCount = 0;

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Utility functions
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomColor() {
            return `hsl(${random(0, 360)}, 100%, 50%)`;
        }

        // Neuron class
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = random(8, 12);
                this.color = config.branchColor;
                this.pulseOffset = random(0, Math.PI * 2);
            }

            draw() {
                const pulse = Math.sin(frameCount * config.pulseFrequency + this.pulseOffset) * config.pulseBrightness;
                const glowSize = this.radius + pulse * 3;
                
                ctx.shadowBlur = 20 + pulse * 5;
                ctx.shadowColor = config.branchColor;
                ctx.fillStyle = config.branchColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Branch class
        class Branch {
            constructor(startX, startY, depth, parentColor) {
                this.x = startX;
                this.y = startY;
                this.targetX = startX;
                this.targetY = startY;
                this.depth = depth;
                this.color = parentColor;
                this.thickness = random(1, 3);
                this.growthProgress = 0;
                this.growthSpeed = config.growthSpeed;
                this.isComplete = false;
                this.children = [];
                this.curvature = config.branchCurvature;
                this.maxLength = config.maxBranchLength;
            }

            update() {
                if (this.growthProgress >= this.maxLength) {
                    this.isComplete = true;
                    return;
                }

                const angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
                const dx = Math.cos(angle) * this.growthSpeed;
                const dy = Math.sin(angle) * this.growthSpeed;
                
                this.x += dx;
                this.y += dy;
                this.growthProgress += this.growthSpeed;

                // Add curvature
                if (Math.random() < this.curvature) {
                    const randomAngle = random(-0.5, 0.5);
                    const randomDist = random(5, 15);
                    this.targetX += Math.cos(randomAngle) * randomDist;
                    this.targetY += Math.sin(randomAngle) * randomDist;
                }

                // Check for splits
                if (this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                    const childBranch = new Branch(this.x, this.y, this.depth + 1, this.color);
                    childBranch.targetX = this.targetX + random(-20, 20);
                    childBranch.targetY = this.targetY + random(-20, 20);
                    childBranch.growthProgress = 0;
                    childBranch.growthSpeed = this.growthSpeed * 0.7;
                    this.children.push(childBranch);
                }
            }

            draw() {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.beginPath();
                ctx.moveTo(this.x - Math.cos(Math.atan2(this.targetY - this.y, this.targetX - this.x)) * this.growthProgress,
                          this.y - Math.sin(Math.atan2(this.targetY - this.y, this.targetX - this.x)) * this.growthProgress);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
                
                ctx.shadowBlur = 0;

                // Draw children
                this.children.forEach(child => child.draw());
            }
        }

        // Synapse class
        class Synapse {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.pulse = 0;
                this.maxPulse = 1;
            }

            update() {
                this.pulse += config.pulseSpeed;
                if (this.pulse >= this.maxPulse) {
                    this.pulse = 0;
                }
            }

            draw() {
                const glow = this.pulse * this.maxPulse;
                ctx.shadowBlur = glow * 2;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3 + glow, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Pulse class
        class Pulse {
            constructor(startX, startY, targetX, targetY, color) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.progress = 0;
            }

            update() {
                this.progress += config.pulseSpeed;
                if (this.progress >= 1) {
                    this.progress = 1;
                }
            }

            draw() {
                const x = this.x + (this.targetX - this.x) * this.progress;
                const y = this.y + (this.targetY - this.y) * this.progress;
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Create initial neurons
        function createNeurons() {
            neurons = [];
            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (i / config.neuronCount) * Math.PI * 2;
                const radius = 100 + random(0, 100);
                const x = canvas.width / 2 + Math.cos(angle) * radius;
                const y = canvas.height / 2 + Math.sin(angle) * radius;
                neurons.push(new Neuron(x, y));
            }
        }

        // Create branches from neurons
        function createBranches() {
            branches = [];
            neurons.forEach(neuron => {
                const branch = new Branch(neuron.x, neuron.y, 0, neuron.color);
                branch.targetX = neuron.x + random(-50, 50);
                branch.targetY = neuron.y + random(-50, 50);
                branches.push(branch);
            });
        }

        // Check for synapses
        function checkSynapses() {
            const synapseMap = new Map();
            
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];
                    
                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < config.synapseDistance) {
                        const key = `${Math.min(i, j)}-${Math.max(i, j)}`;
                        if (!synapseMap.has(key)) {
                            synapseMap.set(key, new Synapse((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, config.synapseColor));
                        }
                    }
                }
            }
            
            synapses = Array.from(synapseMap.values());
        }

        // Create pulses between connected neurons
        function createPulses() {
            pulses = [];
            neurons.forEach((neuron, i) => {
                neurons.forEach((otherNeuron, j) => {
                    if (i < j) {
                        const dx = otherNeuron.x - neuron.x;
                        const dy = otherNeuron.y - neuron.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < config.synapseDistance * 2) {
                            pulses.push(new Pulse(neuron.x, neuron.y, otherNeuron.x, otherNeuron.y, config.pulseColor));
                        }
                    }
                });
            });
        }

        // Main animation loop
        function animate() {
            if (!isPaused) {
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw grid
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                }
                ctx.stroke();
                
                // Draw neurons
                neurons.forEach(neuron => neuron.draw());
                
                // Draw branches
                branches.forEach(branch => {
                    branch.update();
                    branch.draw();
                });
                
                // Draw synapses
                synapses.forEach(synapse => {
                    synapse.update();
                    synapse.draw();
                });
                
                // Draw pulses
                pulses.forEach(pulse => {
                    pulse.update();
                    pulse.draw();
                });
                
                frameCount++;
            }
            
            requestAnimationFrame(animate);
        }

        // Initialize
        createNeurons();
        createBranches();
        checkSynapses();
        createPulses();
        animate();

        // GUI setup
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 3, 10, 1).listen();
        growthFolder.add(config, 'growthSpeed', 0.1, 5).listen();
        growthFolder.add(config, 'maxBranchDepth', 1, 10, 1).listen();
        growthFolder.add(config, 'branchSplitChance', 0, 1).listen();
        growthFolder.add(config, 'branchCurvature', 0, 1).listen();
        growthFolder.add(config, 'maxLength', 50, 300, 10).listen();
        
        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(config, 'synapseDistance', 10, 100, 1).listen();
        synapsesFolder.add(config, 'synapseGlow', 0, 50).listen();
        
        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(config, 'pulseSpeed', 0.01, 0.2).listen();
        pulsesFolder.add(config, 'pulseFrequency', 0.001, 0.01).listen();
        pulsesFolder.add(config, 'pulseBrightness', 0, 2).listen();
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'backgroundColor').listen();
        visualsFolder.addColor(config, 'branchColor').listen();
        visualsFolder.addColor(config, 'accentBranchColor').listen();
        visualsFolder.addColor(config, 'synapseColor').listen();
        visualsFolder.addColor(config, 'pulseColor').listen();
        
        const buttonsFolder = gui.addFolder('Controls');
        buttonsFolder.add({ regenerate: () => {
            createNeurons();
            createBranches();
            checkSynapses();
            createPulses();
        }}, 'regenerate').name('Regenerate Network');
        buttonsFolder.add({ clear: () => {
            branches = [];
            synapses = [];
            pulses = [];
        }}, 'clear').name('Clear Canvas');
        buttonsFolder.add({ togglePause: () => {
            isPaused = !isPaused;
        }}, 'togglePause').name(isPaused ? 'Resume' : 'Pause');
        
        gui.addFolder(''); // Empty folder to separate sections
    </script>
</body>
</html>
