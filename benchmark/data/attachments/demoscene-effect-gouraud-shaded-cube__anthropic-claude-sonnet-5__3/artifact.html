<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gouraud Shaded Rotating Cube — Canvas 2D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #14171f 0%, #0a0b0f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Consolas', 'Courier New', monospace;
    overflow: hidden;
  }

  #container {
    position: relative;
  }

  canvas {
    display: block;
    background: #000;
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 60px rgba(60,140,255,0.15),
      0 20px 60px rgba(0,0,0,0.6);
  }

  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #d7ecff;
    font-size: 13px;
    line-height: 1.6;
    background: rgba(10, 14, 22, 0.55);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(120, 180, 255, 0.15);
    white-space: pre;
    pointer-events: none;
    backdrop-filter: blur(2px);
  }

  #hud .paused {
    color: #ff6666;
    font-weight: bold;
  }

  #hud .on {
    color: #6dffb0;
  }

  #hud .off {
    color: #999;
  }
</style>
</head>
<body>

<div id="container">
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="hud">Loading...</div>
</div>

<script>
(function () {
  "use strict";

  // =====================================================================
  // SETUP
  // =====================================================================
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const FOCAL = 700;      // focal length for perspective projection
  const CAM_DIST = 5;     // camera pushed back along +z from the object

  // Offscreen pixel buffer + z-buffer (stores 1/z, larger = closer)
  const imageData = ctx.createImageData(WIDTH, HEIGHT);
  const pixels = imageData.data;
  const zbuffer = new Float32Array(WIDTH * HEIGHT);

  const BG_R = 10, BG_G = 12, BG_B = 18;

  // =====================================================================
  // MATH HELPERS (vec3 operations)
  // =====================================================================
  function vec3(x, y, z) { return { x: x, y: y, z: z }; }
  function sub(a, b) { return vec3(a.x - b.x, a.y - b.y, a.z - b.z); }
  function add(a, b) { return vec3(a.x + b.x, a.y + b.y, a.z + b.z); }
  function scale(a, s) { return vec3(a.x * s, a.y * s, a.z * s); }
  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function cross(a, b) {
    return vec3(
      a.y * b.z - a.z * b.y,
      a.z * b.x - a.x * b.z,
      a.x * b.y - a.y * b.x
    );
  }
  function length(a) { return Math.sqrt(dot(a, a)); }
  function normalize(a) {
    const len = length(a) || 1e-9;
    return vec3(a.x / len, a.y / len, a.z / len);
  }

  // Rotation about X, Y, Z axes (right-handed)
  function rotateX(v, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return vec3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
  }
  function rotateY(v, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return vec3(v.x * c + v.z * s, v.y, -v.x * s + v.z * c);
  }
  function rotateZ(v, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return vec3(v.x * c - v.y * s, v.x * s + v.y * c, v.z);
  }
  // Combined rotation applied in X -> Y -> Z order
  function rotateVertex(v, ax, ay, az) {
    let p = rotateX(v, ax);
    p = rotateY(p, ay);
    p = rotateZ(p, az);
    return p;
  }

  // =====================================================================
  // CUBE GEOMETRY
  // =====================================================================
  // 8 vertices of a unit cube (+-1 on each axis)
  const baseVertices = [
    vec3(-1, -1, -1), // 0
    vec3(1, -1, -1),  // 1
    vec3(1, 1, -1),   // 2
    vec3(-1, 1, -1),  // 3
    vec3(-1, -1, 1),  // 4
    vec3(1, -1, 1),   // 5
    vec3(1, 1, 1),    // 6
    vec3(-1, 1, 1)    // 7
  ];

  // Each face: 4 vertex indices (consistent winding = outward normal),
  // plus a distinct base color.
  const faces = [
    { idx: [0, 3, 2, 1], color: [235, 60, 60] },   // front  (-z) red
    { idx: [4, 5, 6, 7], color: [60, 220, 90] },   // back   (+z) green
    { idx: [1, 2, 6, 5], color: [70, 120, 240] },  // right  (+x) blue
    { idx: [0, 4, 7, 3], color: [240, 220, 50] },  // left   (-x) yellow
    { idx: [3, 7, 6, 2], color: [230, 70, 230] },  // top    (+y) magenta
    { idx: [0, 1, 5, 4], color: [60, 220, 220] }   // bottom (-y) cyan
  ];

  // Split each quad face into 2 triangles (index triplets into face.idx)
  const TRI_A = [0, 1, 2];
  const TRI_B = [0, 2, 3];

  // =====================================================================
  // PROJECTION
  // =====================================================================
  // Projects a camera-space point (z > 0, forward) to screen space.
  function project(v) {
    const invZ = 1 / v.z;
    return {
      x: WIDTH / 2 + v.x * FOCAL * invZ,
      y: HEIGHT / 2 - v.y * FOCAL * invZ,
      invZ: invZ
    };
  }

  // =====================================================================
  // LIGHTING
  // =====================================================================
  // Lambertian diffuse + ambient term, evaluated per vertex using the
  // (flat) face normal and the current light position.
  function litColor(vertexWorldPos, normal, lightPos, baseColor) {
    const toLight = normalize(sub(lightPos, vertexWorldPos));
    const diffuse = Math.max(0, dot(normal, toLight));
    const ambient = 0.15;
    const intensity = Math.min(1, ambient + diffuse * 0.9);
    return [
      baseColor[0] * intensity,
      baseColor[1] * intensity,
      baseColor[2] * intensity
    ];
  }

  // =====================================================================
  // RASTERIZER
  // =====================================================================
  // Standard edge-function based barycentric rasterizer with a
  // per-pixel z-buffer test (using 1/z for perspective-correct
  // color interpolation).
  function edgeFunction(a, b, c) {
    return (c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x);
  }

  // p0, p1, p2 each: {x, y, invZ, cr, cg, cb} where cr/cg/cb are
  // (color channel * invZ), pre-multiplied for perspective-correct
  // interpolation.
  function rasterizeTriangle(p0, p1, p2) {
    const minX = Math.max(0, Math.floor(Math.min(p0.x, p1.x, p2.x)));
    const maxX = Math.min(WIDTH - 1, Math.ceil(Math.max(p0.x, p1.x, p2.x)));
    const minY = Math.max(0, Math.floor(Math.min(p0.y, p1.y, p2.y)));
    const maxY = Math.min(HEIGHT - 1, Math.ceil(Math.max(p0.y, p1.y, p2.y)));

    if (minX > maxX || minY > maxY) return;

    const area = edgeFunction(p0, p1, p2);
    if (Math.abs(area) < 1e-6) return;
    const invArea = 1 / area;

    for (let y = minY; y <= maxY; y++) {
      const py = y + 0.5;
      for (let x = minX; x <= maxX; x++) {
        const px = x + 0.5;
        const sample = { x: px, y: py };

        const w0 = edgeFunction(p1, p2, sample);
        const w1 = edgeFunction(p2, p0, sample);
        const w2 = edgeFunction(p0, p1, sample);

        // Inside test: all same sign (handles either winding order)
        if ((w0 >= 0 && w1 >= 0 && w2 >= 0) || (w0 <= 0 && w1 <= 0 && w2 <= 0)) {
          const b0 = w0 * invArea, b1 = w1 * invArea, b2 = w2 * invArea;

          const invZ = b0 * p0.invZ + b1 * p1.invZ + b2 * p2.invZ;
          const pixIdx = y * WIDTH + x;

          if (invZ > zbuffer[pixIdx]) {
            zbuffer[pixIdx] = invZ;

            const r = (b0 * p0.cr + b1 * p1.cr + b2 * p2.cr) / invZ;
            const g = (b0 * p0.cg + b1 * p1.cg + b2 * p2.cg) / invZ;
            const bch = (b0 * p0.cb + b1 * p1.cb + b2 * p2.cb) / invZ;

            const off = pixIdx * 4;
            pixels[off] = r;
            pixels[off + 1] = g;
            pixels[off + 2] = bch;
            pixels[off + 3] = 255;
          }
        }
      }
    }
  }

  function clearBuffers() {
    zbuffer.fill(0);
    for (let i = 0; i < pixels.length; i += 4) {
      pixels[i] = BG_R;
      pixels[i + 1] = BG_G;
      pixels[i + 2] = BG_B;
      pixels[i + 3] = 255;
    }
  }

  // =====================================================================
  // STATE
  // =====================================================================
  let rotX = 0, rotY = 0, rotZ = 0;
  let lightTime = 0;
  let wireframe = false;
  let paused = false;

  let lastTime = performance.now();
  let fps = 60;
  const FPS_SMOOTHING = 0.1;

  // =====================================================================
  // INPUT
  // =====================================================================
  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'w') wireframe = !wireframe;
    if (k === 'p') paused = !paused;
  });

  // =====================================================================
  // MAIN RENDER LOOP
  // =====================================================================
  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.1); // clamp to avoid huge jumps (tab switch, etc.)

    // Smoothed FPS (EMA)
    const instFps = dt > 0 ? 1 / dt : fps;
    fps = fps + (instFps - fps) * FPS_SMOOTHING;

    if (!paused) {
      rotX += dt * 0.6;
      rotY += dt * 0.9;
      rotZ += dt * 0.35;
      lightTime += dt;
    }

    // Moving light source (lissajous orbit around the cube)
    const lightPos = vec3(
      Math.cos(lightTime * 0.8) * 3.5,
      Math.sin(lightTime * 0.55) * 2.2,
      Math.sin(lightTime * 0.8) * 3.5
    );

    // Rotate all vertices into world space (object-centered at origin)
    const worldVerts = baseVertices.map(function (v) {
      return rotateVertex(v, rotX, rotY, rotZ);
    });

    // Camera-space verts: translate along z so the object sits in front
    // of the camera (camera is conceptually at the origin, looking +z)
    const camVerts = worldVerts.map(function (v) {
      return vec3(v.x, v.y, v.z + CAM_DIST);
    });

    // Projected screen-space verts (shared across faces)
    const screenVerts = camVerts.map(project);

    clearBuffers();

    const wireLines = []; // collect edges to stroke afterwards

    for (let f = 0; f < faces.length; f++) {
      const face = faces[f];
      const idx = face.idx;

      // Face normal from world-space (rotation-only) vertices
      const p0 = worldVerts[idx[0]];
      const p1 = worldVerts[idx[1]];
      const p2 = worldVerts[idx[2]];
      const normal = normalize(cross(sub(p1, p0), sub(p2, p0)));

      // Backface culling: compare normal against view direction from
      // camera (origin) to the face centroid in camera space.
      const c0 = camVerts[idx[0]], c1 = camVerts[idx[1]];
      const c2 = camVerts[idx[2]], c3 = camVerts[idx[3]];
      const centroid = scale(add(add(c0, c1), add(c2, c3)), 0.25);
      const facing = dot(normal, centroid);
      if (facing >= 0) continue; // facing away from camera -> cull

      // Per-vertex Gouraud color for each of the 4 face vertices
      const vertColors = idx.map(function (vi) {
        return litColor(worldVerts[vi], normal, lightPos, face.color);
      });

      // Build render-ready vertex data (screen pos + premultiplied color)
      function buildVert(localI) {
        const globalVi = idx[localI];
        const sp = screenVerts[globalVi];
        const col = vertColors[localI];
        return {
          x: sp.x,
          y: sp.y,
          invZ: sp.invZ,
          cr: col[0] * sp.invZ,
          cg: col[1] * sp.invZ,
          cb: col[2] * sp.invZ
        };
      }

      const va = idx.map(function (_, i) { return buildVert(i); });

      const triA = [va[TRI_A[0]], va[TRI_A[1]], va[TRI_A[2]]];
      const triB = [va[TRI_B[0]], va[TRI_B[1]], va[TRI_B[2]]];

      rasterizeTriangle(triA[0], triA[1], triA[2]);
      rasterizeTriangle(triB[0], triB[1], triB[2]);

      if (wireframe) {
        for (let e = 0; e < 4; e++) {
          const a = va[e];
          const b = va[(e + 1) % 4];
          wireLines.push([a.x, a.y, b.x, b.y]);
        }
      }
    }

    // Push pixel buffer to the canvas
    ctx.putImageData(imageData, 0, 0);

    // Wireframe overlay
    if (wireframe && wireLines.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < wireLines.length; i++) {
        const l = wireLines[i];
        ctx.moveTo(l[0], l[1]);
        ctx.lineTo(l[2], l[3]);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Light source marker (small glowing dot) for visual feedback
    const lightCam = vec3(lightPos.x, lightPos.y, lightPos.z + CAM_DIST);
    if (lightCam.z > 0.1) {
      const lp = project(lightCam);
      if (lp.x > -20 && lp.x < WIDTH + 20 && lp.y > -20 && lp.y < HEIGHT + 20) {
        ctx.save();
        const grad = ctx.createRadialGradient(lp.x, lp.y, 0, lp.x, lp.y, 10);
        grad.addColorStop(0, 'rgba(255,250,200,0.9)');
        grad.addColorStop(1, 'rgba(255,250,200,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(lp.x, lp.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    updateHud();

    requestAnimationFrame(frame);
  }

  // =====================================================================
  // HUD
  // =====================================================================
  function updateHud() {
    const wfState = wireframe
      ? '<span class="on">ON</span>'
      : '<span class="off">OFF</span>';
    const pauseState = paused ? '<span class="paused">PAUSED</span>' : 'RUNNING';

    hud.innerHTML =
      'FPS: ' + Math.round(fps) + '\n' +
      'Wireframe: ' + wfState + '\n' +
      'State: ' + pauseState + '\n' +
      '\n' +
      'W: toggle wireframe, P: pause/resume';
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
