<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2f;
      --text: #e8ecff;
      --muted: #95a0c9;
      --snake1: #4ade80;
      --snake2: #60a5fa;
      --food: #f87171;
      --grid: rgba(255, 255, 255, 0.05);
      --accent: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a2040, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(92vw, 760px);
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(23, 27, 47, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }

    .hud .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .hud .score {
      display: flex;
      gap: 18px;
      align-items: center;
      font-size: 15px;
      color: var(--muted);
      flex-wrap: wrap;
      justify-content: flex-end;
      text-align: right;
    }

    .score strong {
      color: var(--text);
    }

    .board-wrap {
      position: relative;
      width: min(92vw, 720px);
      aspect-ratio: 1 / 1;
      background: rgba(10, 13, 25, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 10, 18, 0.78);
      backdrop-filter: blur(8px);
      padding: 20px;
    }

    .hidden {
      display: none;
    }

    .panel {
      width: min(90%, 500px);
      background: rgba(23, 27, 47, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .panel h1,
    .panel h2 {
      margin: 0 0 12px;
      line-height: 1.1;
    }

    .panel p {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .menu {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #334155, #1f2937);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button.primary {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
    }

    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
    }

    .mode {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .hud {
        align-items: flex-start;
        flex-direction: column;
      }

      .hud .score {
        justify-content: flex-start;
        text-align: left;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <div class="title">Snake</div>
      <div class="score">
        <div>Mode: <strong id="modeLabel" class="mode">Menu</strong></div>
        <div>P1: <strong id="score1">0</strong></div>
        <div>P2: <strong id="score2">0</strong></div>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="game" width="600" height="600"></canvas>

      <div id="menuOverlay" class="overlay">
        <div class="panel">
          <h1>Snake</h1>
          <p>Classic 30×30 grid Snake with human and CPU modes.</p>
          <div class="menu">
            <button class="primary" data-mode="human-vs-human">Human vs Human</button>
            <button data-mode="cpu-vs-human">CPU vs Human</button>
            <button data-mode="cpu-vs-cpu">CPU vs CPU</button>
          </div>
          <div class="hint">Controls: P1 Arrow Keys / P2 WASD. Press R to restart after game over.</div>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay hidden">
        <div class="panel">
          <h2 id="gameOverTitle">Game Over</h2>
          <p id="gameOverText"></p>
          <div class="hint">Press R to restart or choose a mode from the menu.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const GRID_SIZE = 30;
      const CELL_SIZE = 20;
      const TICK_MS = 120;

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const menuOverlay = document.getElementById('menuOverlay');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const modeLabel = document.getElementById('modeLabel');
      const score1El = document.getElementById('score1');
      const score2El = document.getElementById('score2');
      const gameOverTitle = document.getElementById('gameOverTitle');
      const gameOverText = document.getElementById('gameOverText');

      canvas.width = GRID_SIZE * CELL_SIZE;
      canvas.height = GRID_SIZE * CELL_SIZE;

      let mode = null;
      let running = false;
      let gameOver = false;
      let lastTime = 0;
      let accumulator = 0;

      const directions = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 },
        W: { x: 0, y: -1 },
        S: { x: 0, y: 1 },
        A: { x: -1, y: 0 },
        D: { x: 1, y: 0 }
      };

      let snakes = [];
      let foods = [];
      let pendingDirections = [];

      function makeSnake(x, y, dir, color) {
        return {
          body: [{ x, y }, { x: x - dir.x, y: y - dir.y }, { x: x - dir.x * 2, y: y - dir.y * 2 }],
          dir: { ...dir },
          nextDir: { ...dir },
          color,
          alive: true,
          score: 0
        };
      }

      function resetGame(selectedMode) {
        mode = selectedMode;
        running = true;
        gameOver = false;
        lastTime = 0;
        accumulator = 0;
        menuOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        modeLabel.textContent = selectedMode.replace(/-/g, ' ');
        snakes = [];
        pendingDirections = [];
        const left = makeSnake(8, 15, { x: 1, y: 0 }, '#4ade80');
        const right = makeSnake(21, 15, { x: -1, y: 0 }, '#60a5fa');

        if (selectedMode === 'human-vs-human') {
          snakes = [left, right];
        } else if (selectedMode === 'cpu-vs-human') {
          snakes = [left, right];
        } else {
          snakes = [left, right];
        }

        foods = [];
        spawnFood();
        spawnFood();
        updateScores();
        draw();
      }

      function restartToMenu() {
        running = false;
        gameOver = false;
        mode = null;
        modeLabel.textContent = 'Menu';
        menuOverlay.classList.remove('hidden');
        gameOverOverlay.classList.add('hidden');
        draw();
      }

      function updateScores() {
        score1El.textContent = snakes[0] ? snakes[0].score : 0;
        score2El.textContent = snakes[1] ? snakes[1].score : 0;
      }

      function spawnFood() {
        for (let attempts = 0; attempts < 1000; attempts++) {
          const food = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE)
          };
          const occupied = snakes.some(s => s.body.some(p => p.x === food.x && p.y === food.y)) || foods.some(f => f.x === food.x && f.y === food.y);
          if (!occupied) {
            foods.push(food);
            return;
          }
        }
      }

      function isInside(x, y) {
        return x >= 0 && y >= 0 && x < GRID_SIZE && y < GRID_SIZE;
      }

      function dirEquals(a, b) {
        return a.x === b.x && a.y === b.y;
      }

      function opposite(a, b) {
        return a.x === -b.x && a.y === -b.y;
      }

      function chooseCpuDirection(snake, otherSnake) {
        const head = snake.body[0];
        let target = foods[0] || { x: 0, y: 0 };
        let bestDist = Infinity;
        for (const food of foods) {
          const dist = Math.abs(food.x - head.x) + Math.abs(food.y - head.y);
          if (dist < bestDist) {
            bestDist = dist;
            target = food;
          }
        }

        const options = [
          { x: 0, y: -1 },
          { x: 0, y: 1 },
          { x: -1, y: 0 },
          { x: 1, y: 0 }
        ];

        const safe = options.filter(dir => {
          if (opposite(dir, snake.dir)) return false;
          const nx = head.x + dir.x;
          const ny = head.y + dir.y;
          if (!isInside(nx, ny)) return false;
          const selfBody = snake.body.slice(0, -1);
          if (selfBody.some(p => p.x === nx && p.y === ny)) return false;
          if (otherSnake && otherSnake.body.some(p => p.x === nx && p.y === ny)) return false;
          return true;
        });

        safe.sort((a, b) => {
          const da = Math.abs((head.x + a.x) - target.x) + Math.abs((head.y + a.y) - target.y);
          const db = Math.abs((head.x + b.x) - target.x) + Math.abs((head.y + b.y) - target.y);
          return da - db;
        });

        return safe[0] || snake.dir;
      }

      function applyInputs() {
        if (pendingDirections[0] && snakes[0] && !snakes[0].cpu) {
          snakes[0].nextDir = pendingDirections[0];
        }
        if (pendingDirections[1] && snakes[1] && !snakes[1].cpu) {
          snakes[1].nextDir = pendingDirections[1];
        }
        pendingDirections = [];
      }

      function step() {
        if (!running || gameOver) return;

        applyInputs();

        if (mode === 'cpu-vs-human') {
          snakes[0].cpu = true;
          snakes[1].cpu = false;
        } else if (mode === 'cpu-vs-cpu') {
          snakes[0].cpu = true;
          snakes[1].cpu = true;
        } else {
          snakes[0].cpu = false;
          snakes[1].cpu = false;
        }

        if (snakes[0].cpu) snakes[0].nextDir = chooseCpuDirection(snakes[0], snakes[1]);
        if (snakes[1].cpu) snakes[1].nextDir = chooseCpuDirection(snakes[1], snakes[0]);

        for (const snake of snakes) {
          if (!opposite(snake.nextDir, snake.dir)) {
            snake.dir = { ...snake.nextDir };
          }
        }

        const newHeads = snakes.map(snake => ({
          x: snake.body[0].x + snake.dir.x,
          y: snake.body[0].y + snake.dir.y
        }));

        const willEat = newHeads.map(head => foods.findIndex(food => food.x === head.x && food.y === head.y));

        for (let i = 0; i < snakes.length; i++) {
          const snake = snakes[i];
          const head = newHeads[i];
          if (!isInside(head.x, head.y)) {
            endGame(i === 0 ? 2 : 1, 'hit a wall');
            return;
          }
        }

        for (let i = 0; i < snakes.length; i++) {
          const snake = snakes[i];
          const head = newHeads[i];
          const selfBody = snake.body.slice(0, willEat[i] === -1 ? -1 : undefined);
          if (selfBody.some(p => p.x === head.x && p.y === head.y)) {
            endGame(i === 0 ? 2 : 1, 'collided with itself');
            return;
          }
          const other = snakes[1 - i];
          const otherBody = other.body.slice(0, willEat[1 - i] === -1 ? -1 : undefined);
          if (otherBody.some(p => p.x === head.x && p.y === head.y)) {
            endGame(i === 0 ? 2 : 1, 'collided with the other snake');
            return;
          }
        }

        for (let i = 0; i < snakes.length; i++) {
          const snake = snakes[i];
          snake.body.unshift(newHeads[i]);
          if (willEat[i] !== -1) {
            foods.splice(willEat[i], 1);
            snake.score++;
            spawnFood();
          } else {
            snake.body.pop();
          }
        }

        updateScores();
        draw();
      }

      function endGame(winner, reason) {
        running = false;
        gameOver = true;
        gameOverOverlay.classList.remove('hidden');
        if (mode === 'human-vs-human') {
          gameOverTitle.textContent = 'Game Over';
          gameOverText.textContent = `Player ${winner} wins: ${reason}.`;
        } else if (mode === 'cpu-vs-human') {
          gameOverTitle.textContent = 'Game Over';
          gameOverText.textContent = `${winner === 1 ? 'CPU' : 'Player'} wins: ${reason}.`;
        } else {
          gameOverTitle.textContent = 'Game Over';
          gameOverText.textContent = `${winner === 1 ? 'CPU 1' : 'CPU 2'} wins: ${reason}.`;
        }
      }

      function drawGrid() {
        ctx.fillStyle = '#0b0f1c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
          const p = i * CELL_SIZE;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      }

      function draw() {
        drawGrid();

        for (const food of foods) {
          ctx.fillStyle = 'var(--food)';
          ctx.fillStyle = '#f87171';
          ctx.beginPath();
          ctx.roundRect(food.x * CELL_SIZE + 3, food.y * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6, 5);
          ctx.fill();
        }

        snakes.forEach((snake, index) => {
          snake.body.forEach((segment, segmentIndex) => {
            ctx.fillStyle = index === 0 ? '#4ade80' : '#60a5fa';
            if (segmentIndex === 0) {
              ctx.fillStyle = index === 0 ? '#86efac' : '#93c5fd';
            }
            ctx.beginPath();
            ctx.roundRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2, 5);
            ctx.fill();
          });
        });

        if (!running && !gameOver) {
          drawGrid();
        }
      }

      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const delta = timestamp - lastTime;
        lastTime = timestamp;
        if (running) {
          accumulator += delta;
          while (accumulator >= TICK_MS) {
            step();
            accumulator -= TICK_MS;
          }
          draw();
        }
        requestAnimationFrame(loop);
      }

      document.querySelectorAll('button[data-mode]').forEach(button => {
        button.addEventListener('click', () => resetGame(button.dataset.mode));
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          if (mode) {
            resetGame(mode);
          } else {
            menuOverlay.classList.remove('hidden');
            gameOverOverlay.classList.add('hidden');
          }
          return;
        }

        if (!running) return;

        const dir = directions[e.key];
        if (!dir) return;

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          if (snakes[0] && !snakes[0].cpu) {
            pendingDirections[0] = dir;
          }
        } else if (['w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
          if (snakes[1] && !snakes[1].cpu) {
            pendingDirections[1] = dir;
          }
        }
      });

      restartToMenu();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
