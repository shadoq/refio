<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Neuron Growth</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: #05070f;
    font-family: "Space Mono", "Roboto Mono", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 55%);
    pointer-events: none;
    opacity: 0.6;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: linear-gradient(180deg, rgba(5, 7, 15, 0.8) 0%, rgba(5, 7, 15, 0) 45%, rgba(5, 7, 15, 0.7) 100%);
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .canvas-shell {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  canvas {
    width: 800px;
    height: 800px;
    background: transparent;
    box-shadow:
      0 0 35px rgba(0, 229, 255, 0.5),
      inset 0 0 40px rgba(16, 26, 58, 0.6);
    border-radius: 12px;
    border: 1px solid rgba(0, 229, 255, 0.25);
  }
  .dg.main {
    position: fixed !important;
    top: 20px;
    right: 20px;
    background: rgba(5, 7, 15, 0.92);
    border: 1px solid #ffd400;
    box-shadow: 0 0 30px rgba(255, 212, 0, 0.35);
    color: #fff;
    z-index: 5;
  }
  .dg .cr.function button {
    background: rgba(255, 212, 0, 0.15);
    border: 1px solid rgba(255, 212, 0, 0.5);
    color: #ffd400;
    font-weight: 600;
  }
  .dg .c input {
    color: #ffd400 !important;
  }
</style>
</head>
<body>
  <div class="canvas-shell">
    <canvas id="neuronCanvas" width="800" height="800"></canvas>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    const canvas = document.getElementById("neuronCanvas");
    const ctx = canvas.getContext("2d");
    const gridColor = "rgba(0, 229, 255, 0.08)";
    const glowColor = "#101a3a";
    let branches = [];
    let synapses = [];
    let pulses = [];
    let paused = false;
    let lastTimestamp = performance.now();
    let totalBranches = 0;
    const maxBranchCount = 450;
    const params = {
      neuronCount: 4,
      growthSpeed: 1.1,
      maxBranchDepth: 5,
      branchSplitChance: 0.4,
      branchCurvature: 0.65,
      maxBranchLength: 120,
      synapseDistanceThreshold: 36,
      synapseGlowStrength: 1,
      pulseSpeed: 1.7,
      pulseFrequency: 2.4,
      pulseBrightness: 1.1,
      backgroundColor: "#05070f",
      branchColor: "#00e5ff",
      accentBranchColor: "#d6ff00",
      synapseColor: "#ff2bd6",
      pulseColor: "#fff36a",
      regenerateNetwork: () => {},
      clearCanvas: () => {},
      pauseResume: () => {}
    };
    document.body.style.backgroundColor = params.backgroundColor;
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }
    function spawnBranch(start, angle, depth) {
      if (depth >= params.maxBranchDepth) {
        return null;
      }
      if (totalBranches >= maxBranchCount) {
        return null;
      }
      const branch = {
        points: [{ x: start.x, y: start.y }],
        angle,
        depth,
        currentLength: 0,
        targetLength: randomRange(params.maxBranchLength * 0.6, params.maxBranchLength),
        alive: true,
        thickness: randomRange(1.2, 2.6)
      };
      branches.push(branch);
      totalBranches++;
      return branch;
    }
    function spawnChildren(parentBranch, tipPoint) {
      if (parentBranch.depth + 1 >= params.maxBranchDepth) {
        return;
      }
      const childCount = 1 + (Math.random() < params.branchSplitChance ? 1 : 0);
      for (let i = 0; i < childCount; i++) {
        if (totalBranches >= maxBranchCount) {
          break;
        }
        const offset = (Math.random() - 0.5) * 1.8;
        spawnBranch(tipPoint, parentBranch.angle + offset, parentBranch.depth + 1);
      }
    }
    function createSeeds() {
      branches = [];
      synapses = [];
      pulses = [];
      totalBranches = 0;
      const seedCount = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
      for (let i = 0; i < seedCount; i++) {
        const startAngle = Math.random() * Math.PI * 2;
        const offsetRadius = randomRange(10, 60);
        const start = {
          x: canvas.width / 2 + Math.cos(startAngle) * offsetRadius,
          y: canvas.height / 2 + Math.sin(startAngle) * offsetRadius
        };
        const branchAngle = Math.random() * Math.PI * 2;
        spawnBranch(start, branchAngle, 0);
      }
      lastTimestamp = performance.now();
    }
    function growBranches(delta) {
      if (!branches.length) {
        return;
      }
      const stepBase = (params.growthSpeed * 0.35 + 0.25) * (delta / 16);
      const lengthScale = params.maxBranchLength * 0.12;
      for (const branch of branches) {
        if (!branch.alive) {
          continue;
        }
        const wiggle = (Math.random() - 0.5) * params.branchCurvature;
        branch.angle += wiggle * 0.4;
        const direction = branch.angle;
        const step = stepBase * lengthScale;
        const lastPoint = branch.points[branch.points.length - 1];
        const nextPoint = {
          x: lastPoint.x + Math.cos(direction) * step,
          y: lastPoint.y + Math.sin(direction) * step
        };
        if (
          nextPoint.x < 0 ||
          nextPoint.x > canvas.width ||
          nextPoint.y < 0 ||
          nextPoint.y > canvas.height
        ) {
          branch.alive = false;
          continue;
        }
        branch.points.push(nextPoint);
        branch.currentLength += Math.hypot(nextPoint.x - lastPoint.x, nextPoint.y - lastPoint.y);
        if (
          branch.currentLength >= branch.targetLength ||
          branch.points.length > 160
        ) {
          branch.alive = false;
          if (branch.depth + 1 < params.maxBranchDepth) {
            spawnChildren(branch, nextPoint);
          }
        } else if (
          Math.random() < params.branchSplitChance * 0.003 &&
          branch.depth + 1 < params.maxBranchDepth
        ) {
          spawnBranch(
            nextPoint,
            direction + randomRange(-1.2, 1.2) * params.branchCurvature,
            branch.depth + 1
          );
        }
      }
    }
    function updateSynapses() {
      if (!branches.length) {
        return;
      }
      const tips = branches
        .filter((branch) => branch.points.length)
        .map((branch) => ({
          branch,
          pos: branch.points[branch.points.length - 1]
        }));
      const threshold = params.synapseDistanceThreshold;
      for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
          const a = tips[i];
          const b = tips[j];
          if (a.branch === b.branch) {
            continue;
          }
          const dx = a.pos.x - b.pos.x;
          const dy = a.pos.y - b.pos.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= threshold) {
            const exists = synapses.some(
              (syn) =>
                (syn.branchA === a.branch && syn.branchB === b.branch) ||
                (syn.branchA === b.branch && syn.branchB === a.branch)
            );
            if (!exists && synapses.length < 160) {
              synapses.push({
                branchA: a.branch,
                branchB: b.branch
              });
            }
          }
        }
      }
    }
    function emitPulses(delta) {
      if (!synapses.length) {
        return;
      }
      const rate = params.pulseFrequency * (delta / 1000);
      if (Math.random() < rate) {
        const synapse = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push({
          synapse,
          progress: 0,
          direction: Math.random() < 0.5 ? 1 : -1
        });
        if (pulses.length > 220) {
          pulses.shift();
        }
      }
    }
    function updatePulses(delta) {
      const advance = params.pulseSpeed * 0.005 * (delta / 16);
      for (let i = pulses.length - 1; i >= 0; i--) {
        const pulse = pulses[i];
        pulse.progress += advance;
        if (pulse.progress >= 1) {
          pulses.splice(i, 1);
        }
      }
    }
    function drawBackground() {
      ctx.save();
      ctx.fillStyle = params.backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const gradient = ctx.createRadialGradient(
        canvas.width / 2,
        canvas.height / 2,
        120,
        canvas.width / 2,
        canvas.height / 2,
        720
      );
      gradient.addColorStop(0, glowColor);
      gradient.addColorStop(1, params.backgroundColor);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      for (let y = 0; y <= canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      for (let x = 0; x <= canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawBranches() {
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      for (const branch of branches) {
        if (branch.points.length < 2) {
          continue;
        }
        const color = branch.depth > 2 ? params.accentBranchColor : params.branchColor;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, branch.thickness);
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(branch.points[0].x, branch.points[0].y);
        for (let i = 1; i < branch.points.length; i++) {
          ctx.lineTo(branch.points[i].x, branch.points[i].y);
        }
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    function drawSynapses() {
      const time = performance.now();
      ctx.lineWidth = 1.2;
      for (const syn of synapses) {
        const pointA = syn.branchA.points[syn.branchA.points.length - 1];
        const pointB = syn.branchB.points[syn.branchB.points.length - 1];
        if (!pointA || !pointB) {
          continue;
        }
        const midX = (pointA.x + pointB.x) / 2;
        const midY = (pointA.y + pointB.y) / 2;
        const pulse = (Math.sin(time * 0.003) + 1) * 0.5;
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = params.synapseColor;
        ctx.globalAlpha = Math.min(1, 0.5 + pulse * 0.3 * params.synapseGlowStrength);
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = 12 * params.synapseGlowStrength;
        ctx.beginPath();
        ctx.moveTo(pointA.x, pointA.y);
        ctx.lineTo(pointB.x, pointB.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.fillStyle = params.synapseColor;
        ctx.arc(midX, midY, 4 + params.synapseGlowStrength, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    function drawPulses() {
      ctx.shadowColor = params.pulseColor;
      ctx.shadowBlur = 22;
      for (const pulse of pulses) {
        const fromBranch = pulse.direction > 0 ? pulse.synapse.branchA : pulse.synapse.branchB;
        const toBranch = pulse.direction > 0 ? pulse.synapse.branchB : pulse.synapse.branchA;
        const fromPoint = fromBranch.points[fromBranch.points.length - 1];
        const toPoint = toBranch.points[toBranch.points.length - 1];
        if (!fromPoint || !toPoint) {
          continue;
        }
        const t = Math.min(1, pulse.progress);
        const x = fromPoint.x + (toPoint.x - fromPoint.x) * t;
        const y = fromPoint.y + (toPoint.y - fromPoint.y) * t;
        ctx.globalAlpha = Math.min(1, params.pulseBrightness);
        ctx.fillStyle = params.pulseColor;
        ctx.beginPath();
        ctx.arc(x, y, 3 + 3 * (1 - t), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    function update(delta) {
      growBranches(delta);
      updateSynapses();
      emitPulses(delta);
      updatePulses(delta);
    }
    function draw() {
      drawBackground();
      drawBranches();
      drawSynapses();
      drawPulses();
    }
    function loop(timestamp) {
      if (paused) {
        return;
      }
      const delta = Math.min(timestamp - lastTimestamp, 50);
      lastTimestamp = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }
    function togglePause() {
      paused = !paused;
      if (!paused) {
        lastTimestamp = performance.now();
        requestAnimationFrame(loop);
      }
    }
    params.regenerateNetwork = () => createSeeds();
    params.clearCanvas = () => {
      branches = [];
      synapses = [];
      pulses = [];
      totalBranches = 0;
      ctx.fillStyle = params.backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    params.pauseResume = () => togglePause();
    const gui = new dat.GUI({ width: 320 });
    const growth = gui.addFolder("Growth");
    growth.add(params, "neuronCount", 3, 6, 1).name("neuron count");
    growth.add(params, "growthSpeed", 0.2, 3, 0.05).name("branch growth speed");
    growth.add(params, "maxBranchDepth", 1, 7, 1).name("max branch depth");
    growth.add(params, "branchSplitChance", 0, 0.8, 0.01).name("branch split chance");
    growth.add(params, "branchCurvature", 0.1, 1.4, 0.01).name("branch curvature");
    growth.add(params, "maxBranchLength", 40, 180, 1).name("max branch length");
    growth.open();
    const synapseFolder = gui.addFolder("Synapses");
    synapseFolder
      .add(params, "synapseDistanceThreshold", 20, 80, 1)
      .name("synapse distance threshold");
    synapseFolder
      .add(params, "synapseGlowStrength", 0, 2, 0.05)
      .name("synapse glow strength");
    synapseFolder.open();
    const pulseFolder = gui.addFolder("Pulses");
    pulseFolder.add(params, "pulseSpeed", 0.2, 4, 0.05).name("pulse speed");
    pulseFolder
      .add(params, "pulseFrequency", 0.2, 6, 0.1)
      .name("pulse frequency");
    pulseFolder
      .add(params, "pulseBrightness", 0.3, 2, 0.05)
      .name("pulse brightness");
    pulseFolder.open();
    const visualFolder = gui.addFolder("Visuals");
    visualFolder
      .addColor(params, "backgroundColor")
      .name("background color")
      .onChange((value) => {
        document.body.style.backgroundColor = value;
      });
    visualFolder.addColor(params, "branchColor").name("branch color");
    visualFolder.addColor(params, "accentBranchColor").name("accent branch color");
    visualFolder.addColor(params, "synapseColor").name("synapse color");
    visualFolder.addColor(params, "pulseColor").name("pulse color");
    visualFolder.open();
    gui.add(params, "regenerateNetwork").name("regenerate network");
    gui.add(params, "clearCanvas").name("clear canvas");
    gui.add(params, "pauseResume").name("pause/resume animation");
    createSeeds();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
