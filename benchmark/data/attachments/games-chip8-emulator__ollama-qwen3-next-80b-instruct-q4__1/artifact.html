<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            font-family: monospace;
            background-color: #111;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        #display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #display {
            border: 2px solid #444;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 512px;
            height: 256px;
            background-color: #000;
        }
        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 8px 12px;
            background-color: #333;
            color: #eee;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #444;
        }
        #speed-control {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        #speed-control label {
            margin-right: 10px;
        }
        #debugger {
            background-color: #222;
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            overflow-y: auto;
            max-height: 500px;
        }
        .debug-section {
            margin-bottom: 15px;
        }
        .debug-section h3 {
            margin: 0 0 10px 0;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .register-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 5px;
        }
        .register {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 40px;
        }
        .register span {
            font-size: 12px;
            color: #ccc;
        }
        .register-value {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }
        #keymap {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 15px;
            margin-bottom: 15px;
            width: 160px;
        }
        .key {
            background-color: #333;
            color: #eee;
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 12px;
        }
        .key.pressed {
            background-color: #555;
        }
        #file-input {
            margin: 15px 0;
        }
        #instruction-decode {
            font-family: monospace;
            background-color: #000;
            color: #0f0;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre;
            border: 1px solid #333;
        }
        .highlight {
            background-color: #333;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>CHIP-8 Emulator</h1>
    
    <div id="controls">
        <button id="run-btn">Run</button>
        <button id="pause-btn">Pause</button>
        <button id="step-btn">Step</button>
        <button id="reset-btn">Reset</button>
        <input type="file" id="file-input" accept=".ch8,.rom">
    </div>
    
    <div id="speed-control">
        <label for="speed-slider">Speed (instructions/frame):</label>
        <input type="range" id="speed-slider" min="1" max="100" value="10">
        <span id="speed-value">10</span>
    </div>

                    <div class="register"><span>Ve</span><div class="register-value">00</div></div>
                    <div class="register"><span>Vf</span><div class="register-value">00</div></div>
                </div>
            </div>
            
            <div class="debug-section">
                <h3>Special Registers</h3>
                <div class="register-row">
                    <div class="register"><span>PC</span><div class="register-value">0200</div></div>
                    <div class="register"><span>I</span><div class="register-value">000</div></div>
                    <div class="register"><span>DT</span><div class="register-value">00</div></div>
                    <div class="register"><span>ST</span><div class="register-value">00</div></div>
                </div>
            </div>
            
            <div class="debug-section">
                <h3>Stack</h3>
                <div id="stack-display" style="font-family: monospace; font-size: 12px; color: #ccc; max-height: 100px; overflow-y: auto;">

            <div class="debug-section">
                <h3>Current Instruction</h3>
                <div id="instruction-decode">0000</div>
            </div>
