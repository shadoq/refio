<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Neon Duel</title>
<style>
  :root {
    --bg: #0b0f0c;
    --green: #3dff8c;
    --orange: #ff9f2e;
    --red: #ff5252;
    --text: #d7e2da;
    --muted: #6f7f74;
    --panel: #101813;
    --line: #23392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1100px 700px at 50% 18%, #131c16 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* ---------- HUD ---------- */
  .hud {
    width: min(600px, 92vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 4px 0;
  }
  .score { display: flex; align-items: baseline; gap: 8px; }
  .score .name { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .score .val { font-size: 26px; font-weight: 800; line-height: 1; }
  .score.p1 .val { color: var(--green); text-shadow: 0 0 12px rgba(61, 255, 140, .4); }
  .score.p2 .val { color: var(--orange); text-shadow: 0 0 12px rgba(255, 159, 46, .4); }
  .mid { text-align: center; }
  .mid .mode { display: block; font-size: 11px; letter-spacing: 3px; opacity: .85; }
  .mid .speed { display: block; font-size: 10px; letter-spacing: 1px; color: var(--muted); margin-top: 3px; }

  /* ---------- Stage & overlays ---------- */
  .stage { position: relative; }
  canvas {
    display: block;
    width: min(600px, 92vw, 66vh);
    height: auto;
    background: #0d1310;
    border: 1px solid #1e2c23;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(61, 255, 140, .07);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    background: rgba(5, 10, 7, .84);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    padding: 20px;
  }
  .overlay.hidden { display: none; }

  .title {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 12px;
    text-indent: 12px;
    color: var(--green);
    text-shadow: 0 0 22px rgba(61, 255, 140, .55);
  }
  .subtitle { color: var(--muted); letter-spacing: 3px; font-size: 12px; text-transform: uppercase; }

  .menu-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .mode-btn {
    width: 330px;
    max-width: 78vw;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: left;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .mode-btn:hover,
  .mode-btn.selected { border-color: var(--green); box-shadow: 0 0 14px rgba(61, 255, 140, .25); }
  .mode-btn .row { display: flex; align-items: baseline; gap: 8px; }
  .mode-btn .k { color: var(--green); font-weight: 800; }
  .mode-btn .name { font-weight: 700; letter-spacing: 1px; font-size: 14px; }
  .mode-btn .controls { font-size: 11px; color: var(--muted); }

  .go-title {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--red);
    text-shadow: 0 0 20px rgba(255, 82, 82, .5);
  }
  .go-winner { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .go-scores { color: var(--muted); letter-spacing: 1px; }
  .pause-title {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--text);
  }

  .hint { color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  kbd {
    background: #18231c;
    border: 1px solid #2b4033;
    border-bottom-width: 2px;
    padding: 1px 7px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 11px;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hud">
      <div class="score p1">
        <span class="name" id="p1-name">PLAYER 1</span>
        <span class="val" id="score1">0</span>
      </div>
      <div class="mid">
        <span class="mode" id="mode-label">HUMAN vs HUMAN</span>
        <span class="speed" id="speed-label">Speed 1.00×</span>
      </div>
      <div class="score p2">
        <span class="val" id="score2">0</span>
        <span class="name" id="p2-name">PLAYER 2</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="600" height="600"></canvas>

      <!-- Start menu -->
      <div class="overlay" id="menu">
        <div class="title">SNAKE</div>
        <div class="subtitle">30 × 30 Grid · Two-Snake Duel</div>
        <div class="menu-buttons">
          <button class="mode-btn" data-mode="0">
            <span class="row"><span class="k">1</span><span class="name">HUMAN vs HUMAN</span></span>
            <span class="controls">P1: W A S D &nbsp;·&nbsp; P2: Arrow Keys</span>
          </button>
          <button class="mode-btn" data-mode="1">
            <span class="row"><span class="k">2</span><span class="name">CPU vs HUMAN</span></span>
            <span class="controls">Green CPU hunts the apple &nbsp;·&nbsp; You: Arrow Keys</span>
          </button>
          <button class="mode-btn" data-mode="2">
            <span class="row"><span class="k">3</span><span class="name">CPU vs CPU</span></span>
            <span class="controls">Spectator mode · sit back and watch</span>
          </button>
        </div>
        <div class="hint">Press <kbd>1</kbd> / <kbd>2</kbd> / <kbd>3</kbd> to start &nbsp;·&nbsp; <kbd>Enter</kbd> starts the selected mode</div>
      </div>

      <!-- Game over -->
      <div class="overlay hidden" id="gameover">
        <div class="go-title">GAME OVER</div>
        <div class="go-winner" id="go-winner">—</div>
        <div class="go-scores" id="go-scores">—</div>
        <div class="hint"><kbd>R</kbd> Restart &nbsp;·&nbsp; <kbd>M</kbd> Menu</div>
      </div>

      <!-- Pause -->
      <div class="overlay hidden" id="pause">
        <div class="pause-title">PAUSED</div>
        <div class="hint"><kbd>P</kbd> / <kbd>Space</kbd> Resume &nbsp;·&nbsp; <kbd>Esc</kbd> Menu</div>
      </div>
    </div>

    <footer class="hint">
      P1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      &nbsp;&nbsp; P2: <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
      &nbsp;&nbsp; <kbd>P</kbd> Pause
    </footer>
  </div>

<script>
'use strict';

/* ================= Constants ================= */
const GRID = 30;
const CELL = 20;
const SIZE = GRID * CELL;        // 600 × 600 canvas
const BASE_TICK = 110;           // ms per move at game start
const MIN_TICK = 65;             // fastest tick
const SPEEDUP_PER_FOOD = 1.5;    // ms shaved off per food eaten

const P1_COLOR = '#3dff8c';
const P2_COLOR = '#ff9f2e';

const COLORS = {
  boardA: '#0d1310',
  boardB: '#111a14',
  border: 'rgba(61, 255, 140, 0.22)',
  food: '#ff4d4d',
  leaf: '#3dff8c',
  dead: '#5c6660',
  eye: '#0a120d',
  pupil: '#eafff2'
};

const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 }
};
const ALL_DIRS = [DIRS.up, DIRS.down, DIRS.left, DIRS.right];

const MODES = [
  { label: 'HUMAN vs HUMAN', p1Cpu: false, p2Cpu: false },
  { label: 'CPU vs HUMAN',   p1Cpu: true,  p2Cpu: false },
  { label: 'CPU vs CPU',     p1Cpu: true,  p2Cpu: true }
];

const KEYMAP_P1 = { KeyW: DIRS.up, KeyS: DIRS.down, KeyA: DIRS.left, KeyD: DIRS.right };
const KEYMAP_P2 = { ArrowUp: DIRS.up, ArrowDown: DIRS.down, ArrowLeft: DIRS.left, ArrowRight: DIRS.right };

/* ================= DOM ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const el = {
  p1Name: document.getElementById('p1-name'),
  p2Name: document.getElementById('p2-name'),
  score1: document.getElementById('score1'),
  score2: document.getElementById('score2'),
  modeLabel: document.getElementById('mode-label'),
  speed: document.getElementById('speed-label'),
  menu: document.getElementById('menu'),
  gameover: document.getElementById('gameover'),
  pause: document.getElementById('pause'),
  goWinner: document.getElementById('go-winner'),
  goScores: document.getElementById('go-scores'),
  modeBtns: Array.from(document.querySelectorAll('.mode-btn'))
};

/* ================= State ================= */
const state = {
  screen: 'menu',      // 'menu' | 'play' | 'over'
  mode: 0,
  menuIndex: 0,
  snakes: [],
  food: { x: 15, y: 15 },
  tickMs: BASE_TICK,
  acc: 0,
  lastTime: 0,
  paused: false,
  totalFood: 0
};

/* ================= Helpers ================= */
const keyOf = (p) => p.x + ',' + p.y;
const isOpposite = (a, b) => a.x === -b.x && a.y === -b.y;
const isSame = (a, b) => a.x === b.x && a.y === b.y;

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

/* ================= World setup ================= */
function makeSnake(id, name, color, body, dir, isCpu) {
  return { id, name, color, body, dir, isCpu, pending: [], score: 0, alive: true };
}

function resetWorld(modeIndex) {
  const m = MODES[modeIndex];
  state.mode = modeIndex;
  state.snakes = [
    makeSnake('p1', m.p1Cpu ? 'CPU' : 'PLAYER 1', P1_COLOR,
      [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }], DIRS.right, m.p1Cpu),
    makeSnake('p2', m.p2Cpu ? 'CPU' : 'PLAYER 2', P2_COLOR,
      [{ x: 24, y: 20 }, { x: 25, y: 20 }, { x: 26, y: 20 }], DIRS.left, m.p2Cpu)
  ];
  state.tickMs = BASE_TICK;
  state.acc = 0;
  state.paused = false;
  state.totalFood = 0;
  respawnFood();
}

function occupiedSet() {
  const occ = new Set();
  for (const s of state.snakes) for (const seg of s.body) occ.add(keyOf(seg));
  return occ;
}

function respawnFood() {
  const occ = occupiedSet();
  const free = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (!occ.has(x + ',' + y)) free.push({ x, y });
    }
  }
  if (!free.length) { endGame(null); return; } // board completely full
  state.food = free[(Math.random() * free.length) | 0];
}

/* ================= CPU AI ================= */
function cpuChooseDirection(snake) {
  const occ = occupiedSet();
  const head = snake.body[0];
  const candidates = ALL_DIRS.filter(d => !isOpposite(d, snake.dir)); // no 180° turns
  const safe = candidates.filter(d => {
    const nx = head.x + d.x, ny = head.y + d.y;
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) return false;
    return !occ.has(nx + ',' + ny); // tail cell treated as occupied (kept simple)
  });
  if (!safe.length) return snake.dir; // trapped: keep direction and crash
  // prefer the smallest Manhattan distance to the food, tie-break randomly
  let bestDist = Infinity;
  let ties = [];
  for (const d of safe) {
    const dist = Math.abs(head.x + d.x - state.food.x) + Math.abs(head.y + d.y - state.food.y);
    if (dist < bestDist) { bestDist = dist; ties = [d]; }
    else if (dist === bestDist) ties.push(d);
  }
  return ties[(Math.random() * ties.length) | 0];
}

/* ================= Tick logic ================= */
function applyHumanQueue(snake) {
  while (snake.pending.length) {
    const d = snake.pending.shift();
    if (!isSame(d, snake.dir) && !isOpposite(d, snake.dir)) {
      snake.dir = d;
      break;
    }
  }
}

function tick() {
  // 1) choose directions (CPU decides now, humans consume their input queue)
  for (const s of state.snakes) {
    if (!s.alive) continue;
    if (s.isCpu) s.dir = cpuChooseDirection(s);
    else applyHumanQueue(s);
  }

  // 2) compute intended new heads (all snakes move simultaneously)
  const moves = state.snakes.filter(s => s.alive).map(s => ({
    s,
    head: { x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y }
  }));

  // 3) determine deaths
  const dying = new Set();
  const occ = occupiedSet(); // tails treated as occupied (simple approximation)
  for (const m of moves) {
    const { s, head } = m;
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { dying.add(s); continue; }
    if (occ.has(keyOf(head))) dying.add(s); // wall of any snake body
  }
  // head-to-head: both heads enter the same cell → both die
  if (moves.length === 2 && keyOf(moves[0].head) === keyOf(moves[1].head)) {
    dying.add(moves[0].s);
    dying.add(moves[1].s);
  }
  // head-to-head swap: each head moves into the other's current head cell → both die
  if (moves.length === 2) {
    const [a, b] = moves;
    if (keyOf(a.head) === keyOf(b.s.body[0]) && keyOf(b.head) === keyOf(a.s.body[0])) {
      dying.add(a.s);
      dying.add(b.s);
    }
  }

  // 4) apply movement / growth / eating
  for (const m of moves) {
    if (dying.has(m.s)) { m.s.alive = false; continue; }
    m.s.body.unshift(m.head);
    if (m.head.x === state.food.x && m.head.y === state.food.y) {
      m.s.score++;
      state.totalFood++;
      state.tickMs = Math.max(MIN_TICK, BASE_TICK - state.totalFood * SPEEDUP_PER_FOOD);
      respawnFood();
      if (state.screen !== 'play') return; // board-full edge case ended the game
    } else {
      m.s.body.pop();
    }
  }

  // 5) end of game?
  const alive = state.snakes.filter(s => s.alive);
  if (alive.length < 2) endGame(alive.length === 1 ? alive[0] : null);
}

/* ================= Screens / UI ================= */
function show(target, on) { target.classList.toggle('hidden', !on); }

function startGame(modeIndex) {
  resetWorld(modeIndex);
  state.screen = 'play';
  state.menuIndex = modeIndex;
  show(el.menu, false);
  show(el.gameover, false);
  show(el.pause, false);
  el.modeLabel.textContent = MODES[modeIndex].label;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function endGame(winner) {
  state.screen = 'over';
  state.paused = false;
  if (winner) {
    el.goWinner.textContent = winner.name + ' WINS!';
    el.goWinner.style.color = winner.color;
    el.goWinner.style.textShadow = '0 0 16px ' + winner.color + '88';
  } else {
    el.goWinner.textContent = 'DRAW';
    el.goWinner.style.color = 'var(--text)';
    el.goWinner.style.textShadow = 'none';
  }
  const [a, b] = state.snakes;
  el.goScores.textContent = a.name + ': ' + a.score + '   —   ' + b.score + ' :' + b.name;
  show(el.gameover, true);
}

function showMenu() {
  state.screen = 'menu';
  state.paused = false;
  show(el.menu, true);
  show(el.gameover, false);
  show(el.pause, false);
  updateMenuSelection();
}

function setPaused(p) {
  if (state.screen !== 'play') return;
  state.paused = p;
  show(el.pause, p);
}

function updateMenuSelection() {
  el.modeBtns.forEach((btn, i) => btn.classList.toggle('selected', i === state.menuIndex));
}

/* ================= Input ================= */
function queueDirection(snake, d) {
  if (!d) return;
  if (state.screen !== 'play' || state.paused) return;
  if (!snake.alive || snake.isCpu) return;
  const last = snake.pending.length ? snake.pending[snake.pending.length - 1] : snake.dir;
  if (isSame(d, last) || isOpposite(d, last)) return; // reject equal / reverse
  if (snake.pending.length >= 2) return;              // queue holds at most 2 turns
  snake.pending.push(d);
}

document.addEventListener('keydown', (e) => {
  // keep the page from scrolling on arrows / space
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();

  if (state.screen === 'menu') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') startGame(0);
    else if (e.code === 'Digit2' || e.code === 'Numpad2') startGame(1);
    else if (e.code === 'Digit3' || e.code === 'Numpad3') startGame(2);
    else if (e.code === 'Enter' || e.code === 'Space') startGame(state.menuIndex);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      state.menuIndex = (state.menuIndex + MODES.length - 1) % MODES.length;
      updateMenuSelection();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      state.menuIndex = (state.menuIndex + 1) % MODES.length;
      updateMenuSelection();
    }
    return;
  }

  if (state.screen === 'over') {
    if (e.code === 'KeyR' || e.code === 'Enter') startGame(state.mode);
    else if (e.code === 'KeyM' || e.code === 'Escape') showMenu();
    return;
  }

  // playing
  if (e.code === 'KeyP' || e.code === 'Space') { setPaused(!state.paused); return; }
  if (e.code === 'Escape' || e.code === 'KeyM') { showMenu(); return; }
  queueDirection(state.snakes[0], KEYMAP_P1[e.code]);
  queueDirection(state.snakes[1], KEYMAP_P2[e.code]);
});

el.modeBtns.forEach((btn, i) => {
  btn.addEventListener('click', () => startGame(i));
  btn.addEventListener('mouseenter', () => { state.menuIndex = i; updateMenuSelection(); });
});

// auto-pause when the tab/window loses focus
window.addEventListener('blur', () => {
  if (state.screen === 'play' && !state.paused) setPaused(true);
});

/* ================= Game loop ================= */
function frame(time) {
  requestAnimationFrame(frame);
  const dt = state.lastTime ? Math.min(time - state.lastTime, 250) : 0;
  state.lastTime = time;
  if (state.screen === 'play' && !state.paused) {
    state.acc += dt;
    while (state.acc >= state.tickMs) {
      state.acc -= state.tickMs;
      tick();
      if (state.screen !== 'play') { state.acc = 0; break; }
    }
  }
  render();
}

/* ================= Rendering ================= */
// pre-rendered checkerboard background
const bgCanvas = document.createElement('canvas');
bgCanvas.width = SIZE;
bgCanvas.height = SIZE;
(function paintBackground() {
  const c = bgCanvas.getContext('2d');
  c.fillStyle = COLORS.boardA;
  c.fillRect(0, 0, SIZE, SIZE);
  c.fillStyle = COLORS.boardB;
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if ((x + y) % 2 === 0) c.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
  c.strokeStyle = COLORS.border;
  c.lineWidth = 2;
  c.strokeRect(1, 1, SIZE - 2, SIZE - 2);
})();

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCircle(c, x, y, r) {
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
}

function drawFood() {
  const cx = state.food.x * CELL + CELL / 2;
  const cy = state.food.y * CELL + CELL / 2;
  ctx.shadowColor = 'rgba(255, 77, 77, 0.6)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = COLORS.food;
  drawCircle(ctx, cx, cy + 1, CELL * 0.32);
  ctx.shadowBlur = 0;
  // leaf
  ctx.fillStyle = COLORS.leaf;
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy - 5.5, 3.4, 1.7, -Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();
  // highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
  drawCircle(ctx, cx - 2.6, cy - 1.4, 1.7);
}

function drawSnake(s) {
  const base = s.alive ? s.color : COLORS.dead;
  const n = s.body.length;
  for (let i = n - 1; i >= 0; i--) {
    const seg = s.body[i];
    const x = seg.x * CELL;
    const y = seg.y * CELL;
    const fade = 1 - (i / Math.max(n - 1, 1)) * 0.55; // brighter head, fading tail
    ctx.fillStyle = hexToRgba(base, s.alive ? 0.35 + 0.65 * fade : 0.8);
    if (i === 0) {
      ctx.shadowColor = base;
      ctx.shadowBlur = 12;
    }
    roundRectPath(ctx, x + 1.5, y + 1.5, CELL - 3, CELL - 3, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  // eyes on the head, oriented by direction
  const head = s.body[0];
  const d = s.dir;
  const px = -d.y, py = d.x; // perpendicular
  const cx = head.x * CELL + CELL / 2;
  const cy = head.y * CELL + CELL / 2;
  for (const sign of [-1, 1]) {
    const ex = cx + d.x * 3.6 + px * 4.2 * sign;
    const ey = cy + d.y * 3.6 + py * 4.2 * sign;
    ctx.fillStyle = COLORS.eye;
    drawCircle(ctx, ex, ey, 2.2);
    ctx.fillStyle = COLORS.pupil;
    drawCircle(ctx, ex + d.x * 0.8, ey + d.y * 0.8, 1);
  }
}

function render() {
  ctx.drawImage(bgCanvas, 0, 0);
  drawFood();
  for (const s of state.snakes) drawSnake(s);
  // HUD values
  const [a, b] = state.snakes;
  if (a && b) {
    el.p1Name.textContent = a.name;
    el.p2Name.textContent = b.name;
    el.score1.textContent = a.score;
    el.score2.textContent = b.score;
    el.speed.textContent = 'Speed ' + (BASE_TICK / state.tickMs).toFixed(2) + '×';
  }
}

/* ================= Boot ================= */
resetWorld(0);
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
