<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  #container {
    position: relative;
    width: 800px;
    height: 800px;
  }
  canvas {
    display: block;
    border-radius: 4px;
  }
  .vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    border-radius: 4px;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(5,7,15,0.85) 100%);
  }
  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    border-radius: 4px;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,229,255,0.03) 2px,
      rgba(0,229,255,0.03) 4px
    );
  }
  .dg.ac { z-index: 10; }
  .dg .cr.color .c input[type=text] { font-size: 10px; }
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas" width="800" height="800"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
</div>

<script>
// ── Setup ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = W / 2, CY = H / 2;

let paused = false;
let animId = null;
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let totalBranchCount = 0;
const MAX_TOTAL_BRANCHES = 600;
let lastPulseTime = 0;
let globalTime = 0;

// ── Parameters ──
const params = {
  neuronCount: 5,
  growthSpeed: 1.8,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.4,
  maxBranchLength: 120,
  synapseThreshold: 30,
  synapseGlow: 12,
  pulseSpeed: 0.015,
  pulseFrequency: 800,
  pulseBrightness: 1.0,
  bgColor: '#05070f',
  bgGlowColor: '#101a3a',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  regenerate: function() { initNetwork(); },
  clearCanvas: function() {
    neurons = []; branches = []; synapses = []; pulses = []; totalBranchCount = 0;
  },
  pauseResume: function() { paused = !paused; }
};

// ── GUI ──
const gui = new dat.GUI({ width: 280 });

const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
fGrowth.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
fGrowth.add(params, 'maxDepth', 2, 8, 1).name('Max Depth');
fGrowth.add(params, 'splitChance', 0.05, 0.8, 0.05).name('Split Chance');
fGrowth.add(params, 'curvature', 0, 1, 0.05).name('Curvature');
fGrowth.add(params, 'maxBranchLength', 40, 200, 5).name('Max Branch Length');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(params, 'synapseThreshold', 10, 80, 1).name('Distance Threshold');
fSyn.add(params, 'synapseGlow', 2, 30, 1).name('Glow Strength');
fSyn.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.005, 0.05, 0.001).name('Pulse Speed');
fPulse.add(params, 'pulseFrequency', 200, 3000, 50).name('Pulse Frequency');
fPulse.add(params, 'pulseBrightness', 0.3, 2.0, 0.1).name('Pulse Brightness');
fPulse.open();

const fVis = gui.addFolder('Visuals');
fVis.addColor(params, 'bgColor').name('Background');
fVis.addColor(params, 'branchColor').name('Branch Color');
fVis.addColor(params, 'accentColor').name('Accent Branch');
fVis.addColor(params, 'synapseColor').name('Synapse Color');
fVis.addColor(params, 'pulseColor').name('Pulse Color');
fVis.open();

gui.add(params, 'regenerate').name('Regenerate Network');
gui.add(params, 'clearCanvas').name('Clear Canvas');
gui.add(params, 'pauseResume').name('Pause / Resume');

// ── Utility ──
function rand(min, max) { return Math.random() * (max - min) + min; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}
function rgbaStr(hex, a) {
  const c = hexToRgb(hex);
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}

// ── Neuron ──
function createNeuron(x, y) {
  return {
    x: x, y: y,
    radius: rand(4, 7),
    growing: true
  };
}

// ── Branch ──
function createBranch(neuron, x, y, angle, depth, parentThickness) {
  if (totalBranchCount >= MAX_TOTAL_BRANCHES) return null;
  totalBranchCount++;

  const thickness = Math.max(0.3, parentThickness * rand(0.55, 0.75));
  const length = params.maxBranchLength * rand(0.4, 1.0) / (1 + depth * 0.15);
  const curveOffset = (Math.random() - 0.5) * params.curvature * length * 0.6;
  const isAccent = Math.random() < 0.2;

  const endX = x + Math.cos(angle) * length;
  const endY = y + Math.sin(angle) * length;
  const cpX = (x + endX) / 2 + Math.cos(angle + Math.PI / 2) * curveOffset;
  const cpY = (y + endY) / 2 + Math.sin(angle + Math.PI / 2) * curveOffset;

  const branch = {
    neuron: neuron,
    sx: x, sy: y,
    cpX: cpX, cpY: cpY,
    ex: endX, ey: endY,
    thickness: thickness,
    depth: depth,
    progress: 0,
    growing: true,
    isAccent: isAccent,
    hasSpawned: false,
    id: totalBranchCount
  };

  branches.push(branch);
  return branch;
}

// ── Quadratic bezier point ──
function bezierPoint(sx, sy, cpx, cpy, ex, ey, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * sx + 2 * mt * t * cpx + t * t * ex,
    y: mt * mt * sy + 2 * mt * t * cpy + t * t * ey
  };
}

// ── Get branch tip ──
function getBranchTip(b) {
  return bezierPoint(b.sx, b.sy, b.cpX, b.cpY, b.ex, b.ey, b.progress);
}

// ── Init Network ──
function initNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  totalBranchCount = 0;
  lastPulseTime = 0;

  const count = params.neuronCount;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + rand(-0.3, 0.3);
    const r = rand(30, 80);
    const nx = CX + Math.cos(angle) * r;
    const ny = CY + Math.sin(angle) * r;
    const neuron = createNeuron(nx, ny);
    neurons.push(neuron);

    // Initial branches from neuron
    const numInitial = Math.floor(rand(3, 6));
    for (let j = 0; j < numInitial; j++) {
      const bAngle = (Math.PI * 2 / numInitial) * j + rand(-0.4, 0.4);
      createBranch(neuron, nx, ny, bAngle, 0, rand(2.5, 4));
    }
  }
}

// ── Synapse Detection ──
function synapseKey(id1, id2) {
  return id1 < id2 ? id1 + '_' + id2 : id2 + '_' + id1;
}

function detectSynapses() {
  const tips = [];
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (b.progress > 0.5) {
      const tip = getBranchTip(b);
      tips.push({ branch: b, x: tip.x, y: tip.y });
    }
  }

  const existingKeys = new Set();
  for (const s of synapses) existingKeys.add(synapseKey(s.b1.id, s.b2.id));

  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      if (a.branch.neuron === b.branch.neuron) continue;
      const d = dist(a, b);
      if (d < params.synapseThreshold) {
        const key = synapseKey(a.branch.id, b.branch.id);
        if (!existingKeys.has(key)) {
          existingKeys.add(key);
          synapses.push({
            b1: a.branch, b2: b.branch,
            x1: a.x, y1: a.y,
            x2: b.x, y2: b.y,
            phase: Math.random() * Math.PI * 2,
            dist: d
          });
        }
      }
    }
  }
}

// ── Pulse System ──
function spawnPulse() {
  if (synapses.length === 0) return;
  const s = synapses[Math.floor(Math.random() * synapses.length)];
  // Pick direction
  const forward = Math.random() < 0.5;
  pulses.push({
    synapse: s,
    t: 0,
    forward: forward,
    speed: params.pulseSpeed * rand(0.8, 1.2)
  });
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed;
    if (p.t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

// ── Growth Update ──
function updateGrowth() {
  const speed = params.growthSpeed * 0.008;
  let anyGrowing = false;

  for (const b of branches) {
    if (!b.growing) continue;
    anyGrowing = true;
    b.progress = Math.min(1, b.progress + speed * rand(0.7, 1.3));

    if (b.progress >= 1) {
      b.growing = false;
      b.progress = 1;
    }

    // Spawn children when sufficiently grown
    if (!b.hasSpawned && b.progress > 0.6 && b.depth < params.maxDepth) {
      b.hasSpawned = true;
      const tip = getBranchTip(b);
      const baseAngle = Math.atan2(b.ey - b.sy, b.ex - b.sx);

      // Main continuation
      if (Math.random() < params.splitChance && totalBranchCount < MAX_TOTAL_BRANCHES) {
        const a1 = baseAngle + rand(-0.4, 0.4);
        createBranch(b.neuron, tip.x, tip.y, a1, b.depth + 1, b.thickness);
      }

      // Side branch
      if (Math.random() < params.splitChance * 0.6 && totalBranchCount < MAX_TOTAL_BRANCHES) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const a2 = baseAngle + side * rand(0.5, 1.2);
        createBranch(b.neuron, tip.x, tip.y, a2, b.depth + 1, b.thickness * 0.7);
      }
    }
  }

  // Check if all neurons stopped growing
  if (!anyGrowing) {
    for (const n of neurons) n.growing = false;
  }

  detectSynapses();
}

// ── Rendering ──
function drawBackground() {
  // Base fill
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);

  // Central glow
  const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, 400);
  grd.addColorStop(0, rgbaStr(params.bgGlowColor || '#101a3a', 0.4));
  grd.addColorStop(1, 'rgba(5,7,15,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(0,229,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawBranches() {
  for (const b of branches) {
    if (b.progress <= 0) continue;

    const color = b.isAccent ? params.accentColor : params.branchColor;
    const alpha = 0.6 + 0.4 * (1 - b.depth / params.maxDepth);

    // Clip to current progress by drawing partial bezier
    // Approximate: draw to interpolated endpoint
    const tip = getBranchTip(b);
    // Recompute control point proportionally
    const t = b.progress;
    const mt = 1 - t;
    // Partial bezier: new cp and end
    const ncpX = mt * b.sx + t * b.cpX;
    const ncpY = mt * b.sy + t * b.cpY;

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 6 + b.thickness * 2;
    ctx.strokeStyle = rgbaStr(color, alpha);
    ctx.lineWidth = b.thickness;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.sx, b.sy);
    ctx.quadraticCurveTo(ncpX, ncpY, tip.x, tip.y);
    ctx.stroke();
    ctx.restore();
  }
}

function drawNeurons() {
  for (const n of neurons) {
    ctx.save();
    ctx.shadowColor = params.branchColor;
    ctx.shadowBlur = 20;
    ctx.fillStyle = params.branchColor;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fill();
    // Inner bright core
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSynapses() {
  for (const s of synapses) {
    const pulse = 0.5 + 0.5 * Math.sin(globalTime * 0.003 + s.phase);
    const glow = params.synapseGlow * (0.5 + pulse * 0.5);

    ctx.save();
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = glow;
    ctx.strokeStyle = rgbaStr(params.synapseColor, 0.3 + pulse * 0.4);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();

    // Synapse dot at midpoint
    const mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
    ctx.fillStyle = rgbaStr(params.synapseColor, 0.5 + pulse * 0.5);
    ctx.beginPath();
    ctx.arc(mx, my, 2 + pulse * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPulses() {
  for (const p of pulses) {
    const s = p.synapse;
    const t = p.forward ? p.t : 1 - p.t;
    const px = s.x1 + (s.x2 - s.x1) * t;
    const py = s.y1 + (s.y2 - s.y1) * t;
    const bright = params.pulseBrightness;

    ctx.save();
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 18 * bright;
    ctx.fillStyle = rgbaStr(params.pulseColor, bright);
    ctx.beginPath();
    ctx.arc(px, py, 3 * bright, 0, Math.PI * 2);
    ctx.fill();
    // White hot core
    ctx.shadowBlur = 0;
    ctx.fillStyle = rgbaStr('#ffffff', bright * 0.8);
    ctx.beginPath();
    ctx.arc(px, py, 1.5 * bright, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Trail
    const trailLen = 0.08;
    for (let i = 1; i <= 4; i++) {
      const tt = p.forward ? Math.max(0, t - trailLen * i) : Math.min(1, t + trailLen * i);
      const tx = s.x1 + (s.x2 - s.x1) * tt;
      const ty = s.y1 + (s.y2 - s.y1) * tt;
      const ta = bright * (1 - i * 0.22);
      if (ta <= 0) continue;
      ctx.save();
      ctx.shadowColor = params.pulseColor;
      ctx.shadowBlur = 8 * ta;
      ctx.fillStyle = rgbaStr(params.pulseColor, ta * 0.5);
      ctx.beginPath();
      ctx.arc(tx, ty, 2 * ta, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Main Loop ──
function animate(timestamp) {
  animId = requestAnimationFrame(animate);
  if (paused) return;

  globalTime = timestamp || 0;

  // Growth
  let anyNeuronGrowing = neurons.some(n => n.growing);
  if (anyNeuronGrowing) {
    updateGrowth();
  }

  // Auto-spawn pulses
  if (synapses.length > 0 && globalTime - lastPulseTime > params.pulseFrequency) {
    spawnPulse();
    // Occasionally spawn extra
    if (Math.random() < 0.3) spawnPulse();
    lastPulseTime = globalTime;
  }

  updatePulses();

  // Draw
  drawBackground();
  drawSynapses();
  drawBranches();
  drawNeurons();
  drawPulses();
}

// ── Start ──
initNetwork();
animate(0);
</script>
</body>
</html>
