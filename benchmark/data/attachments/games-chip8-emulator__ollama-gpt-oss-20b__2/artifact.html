<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CHIP‑8 Emulator</title>
<style>
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; }
canvas { display:block; margin:10px auto; background:#111; }
.controls { margin:10px; }
.controls button { margin-right:5px; }
.keypad { display:grid; grid-template-columns:repeat(4, 50px); grid-gap:5px; margin:10px; }
.keypad button { width:50px; height:50px; font-size:18px; }
.debugger { width:80%; max-width:800px; margin:10px; background:#222; padding:10px; border-radius:5px; }
.debugger table { width:100%; border-collapse:collapse; }
.debugger th, .debugger td { border:1px solid #555; padding:5px; text-align:center; }
</style>
</head>
<body>
<canvas id="chip8-canvas" width="640" height="320"></canvas>
<div class="controls">
<button id="run-btn">Run</button>
<button id="pause-btn">Pause</button>
<button id="step-btn">Step</button>
<button id="reset-btn">Reset</button>
<label for="speed-range">Speed:</label>
<input type="range" id="speed-range" min="1" max="1000" value="500">
<span id="speed-value">500</span> instr/s
</div>
<div class="keypad">
<button data-key="0x0">0</button>
<button data-key="0x1">1</button>
<button data-key="0x2">2</button>
<button data-key="0x3">3</button>
<button data-key="0x4">4</button>
<button data-key="0x5">5</button>
<button data-key="0x6">6</button>
<button data-key="0x7">7</button>
<button data-key="0x8">8</button>
<button data-key="0x9">9</button>
<button data-key="0xA">A</button>
<button data-key="0xB">B</button>
<button data-key="0xC">C</button>
<button data-key="0xD">D</button>
<button data-key="0xE">E</button>
<button data-key="0xF">F</button>
</div>
<div class="debugger">
<h3>Debugger</h3>
<table>
<tr><th>Register</th><th>Value</th></tr>
<tr><td>V0</td><td id="reg-V0">00</td></tr>
<tr><td>V1</td><td id="reg-V1">00</td></tr>
<tr><td>V2</td><td id="reg-V2">00</td></tr>
<tr><td>V3</td><td id="reg-V3">00</td></tr>
<tr><td>V4</td><td id="reg-V4">00</td></tr>
<tr><td>V5</td><td id="reg-V5">00</td></tr>
<tr><td>V6</td><td id="reg-V6">00</td></tr>
<tr><td>V7</td><td id="reg-V7">00</td></tr>
<tr><td>V8</td><td id="reg-V8">00</td></tr>
<tr><td>V9</td><td id="reg-V9">00</td></tr>
<tr><td>VA</td><td id="reg-VA">00</td></tr>
<tr><td>VB</td><td id="reg-VB">00</td></tr>
<tr><td>VC</td><td id="reg-VC">00</td></tr>
<tr><td>VD</td><td id="reg-VD">00</td></tr>
<tr><td>VE</td><td id="reg-VE">00</td></tr>
<tr><td>VF</td><td id="reg-VF">00</td></tr>
<tr><td>I</td><td id="reg-I">0000</td></tr>
<tr><td>PC</td><td id="reg-PC">0200</td></tr>
<tr><td>Stack</td><td id="reg-Stack">[]</td></tr>
<tr><td>Opcode</td><td id="reg-Opcode">0000</td></tr>
</table>
</div>
<script>
(() => {
  const MEMORY_SIZE = 4096;
  const FONTSET_START = 0x050;
  const PROGRAM_START = 0x200;
  const SPRITE_START = 0x250;
  const DISPLAY_WIDTH = 64;
  const DISPLAY_HEIGHT = 32;
  const SCALE = 10;
  const memory = new Uint8Array(MEMORY_SIZE);
  const V = new Uint8Array(16);
  let I = 0;
  let pc = PROGRAM_START;
  const stack = [];
  let delayTimer = 0;
  let soundTimer = 0;
  const display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
  const keys = new Array(16).fill(false);
  const keyMap = {
    '1':0x1, '2':0x2, '3':0x3, '4':0xC,
    'Q':0x4, 'W':0x5, 'E':0x6, 'R':0xD,
    'A':0x7, 'S':0x8, 'D':0x9, 'F':0xE,
    'Z':0xA, 'X':0x0, 'C':0xB, 'V':0xF
  };
  const canvas = document.getElementById('chip8-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const runBtn = document.getElementById('run-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const stepBtn = document.getElementById('step-btn');
  const resetBtn = document.getElementById('reset-btn');
  const speedRange = document.getElementById('speed-range');
  const speedValue = document.getElementById('speed-value');
  const regElems = {};
  for (let i=0;i<16;i++){
    regElems['V'+i.toString(16).toUpperCase()] = document.getElementById('reg-V'+i.toString(16).toUpperCase());
  }
  regElems['I'] = document.getElementById('reg-I');
  regElems['PC'] = document.getElementById('reg-PC');
  regElems['Stack'] = document.getElementById('reg-Stack');
  regElems['Opcode'] = document.getElementById('reg-Opcode');
  const fontSet = [
    0xF0,0x90,0x90,0x90,0xF0,
    0x20,0x60,0x20,0x20,0x70,
    0xF0,0x10,0xF0,0x80,0xF0,
    0xF0,0x10,0xF0,0x10,0xF0,
    0x90,0x90,0xF0,0x10,0x10,
    0xF0,0x80,0xF0,0x10,0xF0,
    0xF0,0x80,0xF0,0x90,0xF0,
    0xF0,0x10,0x20,0x40,0x40,
    0xF0,0x90,0xF0,0x90,0xF0,
    0xF0,0x90,0xF0,0x10,0xF0,
    0xF0,0x90,0xF0,0x90,0x90,
    0xE0,0x90,0xE0,0x90,0xE0,
    0xF0,0x80,0x80,0x80,0xF0,
    0xE0,0x90,0x90,0x90,0xE0,
    0xF0,0x80,0xF0,0x80,0xF0,
    0xF0,0x80,0xF0,0x80,0x80
  ];
  memory.set(fontSet, FONTSET_START);
  const demoRom = [
    0x60,0x00,
    0x61,0x01,
    0xA2,0x50,
    0xD0,0x15,
    0x12,0x0A,
    0xE1,0xA1,
    0x70,0x01,
    0x12,0x0A
  ];
  const spriteA = [0xF0,0x90,0x90,0x90,0xF0];
  function loadROM(romBytes, start=PROGRAM_START){
    memory.set(romBytes, start);
  }
  loadROM(demoRom);
  memory.set(spriteA, SPRITE_START);
  window.addEventListener('keydown', e=>{
    const key = keyMap[e.key.toUpperCase()];
    if(key!==undefined) keys[key]=true;
  });
  window.addEventListener('keyup', e=>{
    const key = keyMap[e.key.toUpperCase()];
    if(key!==undefined) keys[key]=false;
  });
  document.querySelectorAll('.keypad button').forEach(btn=>{
    const key = parseInt(btn.getAttribute('data-key'),16);
    btn.addEventListener('mousedown',()=>keys[key]=true);
    btn.addEventListener('mouseup',()=>keys[key]=false);
    btn.addEventListener('mouseleave',()=>keys[key]=false);
  });
  function drawDisplay(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#FFF';
    for(let y=0;y<DISPLAY_HEIGHT;y++){
      for(let x=0;x<DISPLAY_WIDTH;x++){
        if(display[y*DISPLAY_WIDTH+x]){
          ctx.fillRect(x*SCALE, y*SCALE, SCALE, SCALE);
        }
      }
    }
  }
  function cycle(){
    const opcode = (memory[pc]<<8) | memory[pc+1];
    regElems['Opcode'].textContent = opcode.toString(16).padStart(4,'0').toUpperCase();
    pc += 2;
    const nnn = opcode & 0x0FFF;
    const n = opcode & 0x000F;
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;
    const kk = opcode & 0x00FF;
    switch(opcode & 0xF000){
      case 0x0000:
        switch(opcode){
          case 0x00E0:
            display.fill(0);
            break;
          case 0x00EE:
            pc = stack.pop();
            break;
          default:
            break;
        }
        break;
      case 0x1000:
        pc = nnn;
        break;
      case 0x2000:
        stack.push(pc);
        pc = nnn;
        break;
      case 0x3000:
        if(V[x]===kk) pc+=2;
        break;
      case 0x4000:
        if(V[x]!==kk) pc+=2;
        break;
      case 0x5000:
        if(V[x]===V[y]) pc+=2;
        break;
      case 0x6000:
        V[x]=kk;
        break;
      case 0x7000:
        V[x]=(V[x]+kk)&0xFF;
        break;
      case 0x8000:
        switch(n){
          case 0x0:
            V[x]=V[y];
            break;
          case 0x1:
            V[x]|=V[y];
            break;
          case 0x2:
            V[x]&=V[y];
            break;
          case 0x3:
            V[x]^=V[y];
            break;
          case 0x4:
            {
              const sum = V[x]+V[y];
              V[0xF] = sum>0xFF?1:0;
              V[x]=sum&0xFF;
            }
            break;
          case 0x5:
            V[0xF] = V[x] > V[y] ? 1 : 0;
            V[x] = (V[x]-V[y]) & 0xFF;
            break;
          case 0x6:
            V[0xF] = V[x]&0x1;
            V[x] >>= 1;
            break;
          case 0x7:
            V[0xF] = V[y] > V[x] ? 1 : 0;
            V[x] = (V[y]-V[x]) & 0xFF;
            break;
          case 0xE:
            V[0xF] = (V[x] & 0x80) >> 7;
            V[x] = (V[x] << 1) & 0xFF;
            break;
          default:
            break;
        }
        break;
      case 0x9000:
        if(V[x]!==V[y]) pc+=2;
        break;
      case 0xA000:
        I = nnn;
        break;
      case 0xB000:
        pc = nnn + V[0];
        break;
      case 0xC000:
        V[x] = (Math.random()*256|0) & kk;
        break;
      case 0xD000:
        {
          const vx = V[x];
          const vy = V[y];
          V[0xF] = 0;
          for(let row=0;row<n;row++){
            const spriteByte = memory[I+row];
            for(let col=0;col<8;col++){
              const spritePixel = (spriteByte >> (7-col)) & 1;
              if(spritePixel){
                const xCoord = (vx + col) % DISPLAY_WIDTH;
                const yCoord = (vy + row) % DISPLAY_HEIGHT;
                const idx = yCoord*DISPLAY_WIDTH + xCoord;
                if(display[idx]){
                  V[0xF] = 1;
                }
                display[idx] ^= 1;
              }
            }
          }
        }
        break;
      case 0xE000:
        switch(kk){
          case 0x9E:
            if(keys[V[x]]) pc+=2;
            break;
          case 0xA1:
            if(!keys[V[x]]) pc+=2;
            break;
          default:
            break;
        }
        break;
      case 0xF000:
        switch(kk){
          case 0x07:
            V[x] = delayTimer;
            break;
          case 0x0A:
            {
              let keyPressed = false;
              for(let k=0;k<16;k++){
                if(keys[k]){
                  V[x] = k;
                  keyPressed = true;
                  break;
                }
              }
              if(!keyPressed) pc -= 2;
            }
            break;
          case 0x15:
            delayTimer = V[x];
            break;
          case 0x18:
            soundTimer = V[x];
            break;
          case 0x1E:
            I = (I + V[x]) & 0xFFFF;
            break;
          case 0x29:
            I = FONTSET_START + V[x]*5;
            break;
          case 0x33:
            memory[I] = Math.floor(V[x]/100);
            memory[I+1] = Math.floor((V[x]%100)/10);
            memory[I+2] = V[x]%10;
            break;
          case 0x55:
            for(let i=0;i<=x;i++){
              memory[I+i] = V[i];
            }
            break;
          case 0x65:
            for(let i=0;i<=x;i++){
              V[i] = memory[I+i];
            }
            break;
          default:
            break;
        }
        break;
      default:
        break;
    }
    if(delayTimer>0) delayTimer--;
    if(soundTimer>0){
      if(soundTimer===1){
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = ctxAudio.createOscillator();
        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(440, ctxAudio.currentTime);
        oscillator.connect(ctxAudio.destination);
        oscillator.start();
        oscillator.stop(ctxAudio.currentTime + 0.1);
      }
      soundTimer--;
    }
    drawDisplay();
    for(let i=0;i<16;i++){
      regElems['V'+i.toString(16).toUpperCase()].textContent = V[i].toString(16).padStart(2,'0').toUpperCase();
    }
    regElems['I'].textContent = I.toString(16).padStart(4,'0').toUpperCase();
    regElems['PC'].textContent = pc.toString(16).padStart(4,'0').toUpperCase();
    regElems['Stack'].textContent = '['+stack.map(v=>v.toString(16).padStart(4,'0')).join(', ')+']';
  }
  let intervalId = null;
  function start(){
    if(intervalId) return;
    intervalId = setInterval(cycle, 1000/parseInt(speedRange.value));
  }
  function pause(){
    if(intervalId){
      clearInterval(intervalId);
      intervalId = null;
    }
  }
  function step(){
    cycle();
  }
  function reset(){
    pause();
    pc = PROGRAM_START;
    I = 0;
    V.fill(0);
    stack.length = 0;
    delayTimer = 0;
    soundTimer = 0;
    display.fill(0);
    drawDisplay();
    loadROM(demoRom);
    memory.set(spriteA, SPRITE_START);
    for(let i=0;i<16;i++){
      regElems['V'+i.toString(16).toUpperCase()].textContent = '00';
    }
    regElems['I'].textContent = '0000';
    regElems['PC'].textContent = '0200';
    regElems['Stack'].textContent = '[]';
    regElems['Opcode'].textContent = '0000';
  }
  runBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  stepBtn.addEventListener('click', step);
  resetBtn.addEventListener('click', reset);
  speedRange.addEventListener('input', ()=>{
    speedValue.textContent = speedRange.value;
    if(intervalId){
      pause();
      start();
    }
  });
  reset();
})();
</script>
</body>
</html>
