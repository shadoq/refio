<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  .dg.ac { z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 800, CX = W / 2, CY = H / 2;

  const params = {
    neuronCount: 5,
    branchGrowthSpeed: 2.5,
    maxBranchDepth: 6,
    branchSplitChance: 0.35,
    branchCurvature: 0.4,
    maxBranchLength: 180,
    synapseDistanceThreshold: 30,
    synapseGlowStrength: 12,
    pulseSpeed: 0.015,
    pulseFrequency: 0.008,
    pulseBrightness: 1.0,
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    regenerate: function() { initNetwork(); },
    clearCanvas: function() { clearAll(); },
    pauseResume: function() { paused = !paused; }
  };

  let neurons = [];
  let branches = [];
  let synapses = [];
  let pulses = [];
  let paused = false;
  let animFrameId = null;
  let totalBranchCount = 0;
  const MAX_TOTAL_BRANCHES = 600;
  let time = 0;

  function clearAll() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    totalBranchCount = 0;
    time = 0;
    ctx.clearRect(0, 0, W, H);
  }

  function randomRange(min, max) {
    return min + Math.random() * (max - min);
  }

  function distance(x1, y1, x2, y2) {
    const dx = x1 - x2, dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function createNeuron(x, y) {
    return {
      x: x,
      y: y,
      radius: randomRange(4, 7),
      connections: []
    };
  }

  function createBranch(origin, angle, depth, parentEndX, parentEndY) {
    const isAccent = Math.random() < 0.25;
    const thickness = Math.max(0.5, 3.0 - depth * 0.4 + randomRange(-0.3, 0.3));
    const length = params.maxBranchLength * (1 - depth * 0.12) * randomRange(0.6, 1.0);
    const curveOffset = (Math.random() - 0.5) * params.branchCurvature * 60;

    const endX = parentEndX + Math.cos(angle) * length;
    const endY = parentEndY + Math.sin(angle) * length;
    const cpX = parentEndX + Math.cos(angle) * length * 0.5 + Math.cos(angle + Math.PI / 2) * curveOffset;
    const cpY = parentEndY + Math.sin(angle) * length * 0.5 + Math.sin(angle + Math.PI / 2) * curveOffset;

    const branch = {
      origin: origin,
      depth: depth,
      thickness: thickness,
      isAccent: isAccent,
      startX: parentEndX,
      startY: parentEndY,
      endX: endX,
      endY: endY,
      cpX: cpX,
      cpY: cpY,
      progress: 0,
      growing: true,
      tipX: parentEndX,
      tipY: parentEndY,
      hasSpawned: false,
      id: totalBranchCount++
    };
    return branch;
  }

  function spawnChildBranches(branch) {
    if (branch.depth >= params.maxBranchDepth) return;
    if (totalBranchCount >= MAX_TOTAL_BRANCHES) return;

    const dx = branch.endX - branch.startX;
    const dy = branch.endY - branch.startY;
    const baseAngle = Math.atan2(dy, dx);

    const numChildren = Math.random() < params.branchSplitChance ? 2 : 1;
    const spread = params.branchCurvature * 1.2;

    for (let i = 0; i < numChildren; i++) {
      if (totalBranchCount >= MAX_TOTAL_BRANCHES) break;
      const offsetAngle = (i === 0 ? -1 : 1) * spread * randomRange(0.3, 1.0);
      const childAngle = baseAngle + offsetAngle + (Math.random() - 0.5) * 0.3;
      const child = createBranch(branch.origin, childAngle, branch.depth + 1, branch.endX, branch.endY);
      branches.push(child);
    }
  }

  function initNetwork() {
    clearAll();
    const count = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + randomRange(-0.3, 0.3);
      const dist = randomRange(40, 120);
      const x = CX + Math.cos(angle) * dist;
      const y = CY + Math.sin(angle) * dist;
      const neuron = createNeuron(x, y);
      neurons.push(neuron);

      const numInitial = Math.floor(randomRange(2, 5));
      for (let j = 0; j < numInitial; j++) {
        if (totalBranchCount >= MAX_TOTAL_BRANCHES) break;
        const bAngle = (Math.PI * 2 / numInitial) * j + randomRange(-0.4, 0.4);
        const branch = createBranch(neuron, bAngle, 0, x, y);
        branches.push(branch);
      }
    }
  }

  function updateBranches() {
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (!b.growing) continue;
      b.progress += params.branchGrowthSpeed * 0.008 * (1 - b.depth * 0.1);
      if (b.progress >= 1) {
        b.progress = 1;
        b.growing = false;
        b.tipX = b.endX;
        b.tipY = b.endY;
        if (!b.hasSpawned) {
          b.hasSpawned = true;
          spawnChildBranches(b);
        }
      } else {
        const t = b.progress;
        const mt = 1 - t;
        b.tipX = mt * mt * b.startX + 2 * mt * t * b.cpX + t * t * b.endX;
        b.tipY = mt * mt * b.startY + 2 * mt * t * b.cpY + t * t * b.endY;
      }
    }
  }

  function detectSynapses() {
    const tips = [];
    for (let i = 0; i < branches.length; i++) {
      if (!branches[i].growing) {
        tips.push(branches[i]);
      }
    }
    for (let i = 0; i < tips.length; i++) {
      for (let j = i + 1; j < tips.length; j++) {
        if (tips[i].origin === tips[j].origin) continue;
        const key1 = tips[i].id + '_' + tips[j].id;
        const key2 = tips[j].id + '_' + tips[i].id;
        let duplicate = false;
        for (let s = 0; s < synapses.length; s++) {
          if (synapses[s].key === key1 || synapses[s].key === key2) {
            duplicate = true;
            break;
          }
        }
        if (duplicate) continue;
        const d = distance(tips[i].tipX, tips[i].tipY, tips[j].tipX, tips[j].tipY);
        if (d < params.synapseDistanceThreshold) {
          const key = key1;
          synapses.push({
            x1: tips[i].tipX, y1: tips[i].tipY,
            x2: tips[j].tipX, y2: tips[j].tipY,
            origin1: tips[i].origin, origin2: tips[j].origin,
            key: key, phase: Math.random() * Math.PI * 2
          });
          tips[i].origin.connections.push(tips[j].origin);
          tips[j].origin.connections.push(tips[i].origin);
        }
      }
    }
  }

  function updatePulses() {
    if (Math.random() < params.pulseFrequency && synapses.length > 0) {
      const s = synapses[Math.floor(Math.random() * synapses.length)];
      const reverse = Math.random() < 0.5;
      pulses.push({
        synapse: s,
        t: reverse ? 1 : 0,
        dir: reverse ? -1 : 1,
        alive: true
      });
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.t += p.dir * params.pulseSpeed;
      if (p.t < 0 || p.t > 1) {
        pulses.splice(i, 1);
      }
    }
  }

  function drawBackground() {
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0, 0, W, H);

    const grd = ctx.createRadialGradient(CX, CY, 50, CX, CY, 450);
    grd.addColorStop(0, hexToRgba('#101a3a', 0.5));
    grd.addColorStop(1, 'rgba(5,7,15,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(0,229,255,0.08)';
    ctx.lineWidth = 0.5;
    const gridSize = 40;
    for (let x = 0; x <= W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawScanlines() {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
  }

  function drawVignette() {
    const grd = ctx.createRadialGradient(CX, CY, W * 0.25, CX, CY, W * 0.7);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBranches() {
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (b.progress <= 0) continue;
      const color = b.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = b.thickness;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6 + (3 - b.depth) * 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.startX, b.startY);

      if (b.growing) {
        const t = b.progress;
        const mt = 1 - t;
        const tx = mt * mt * b.startX + 2 * mt * t * b.cpX + t * t * b.endX;
        const ty = mt * mt * b.startY + 2 * mt * t * b.cpY + t * t * b.endY;
        const midT = Math.max(0, t - 0.02);
        const midMt = 1 - midT;
        const mx = midMt * midMt * b.startX + 2 * midMt * midT * b.cpX + midT * midT * b.endX;
        const my = midMt * midMt * b.startY + 2 * midMt * midT * b.cpY + midT * midT * b.endY;
        ctx.quadraticCurveTo(
          b.startX + (b.cpX - b.startX) * t,
          b.startY + (b.cpY - b.startY) * t,
          tx, ty
        );
      } else {
        ctx.quadraticCurveTo(b.cpX, b.cpY, b.endX, b.endY);
      }
      ctx.stroke();
      ctx.restore();

      if (b.growing) {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.tipX, b.tipY, Math.max(0.5, b.thickness * 0.6), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawNeurons() {
    for (let i = 0; i < neurons.length; i++) {
      const n = neurons[i];
      ctx.save();
      ctx.fillStyle = params.branchColor;
      ctx.shadowColor = params.branchColor;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawSynapses() {
    for (let i = 0; i < synapses.length; i++) {
      const s = synapses[i];
      const pulse = 0.5 + 0.5 * Math.sin(time * 3 + s.phase);
      const alpha = 0.2 + pulse * 0.4;
      ctx.save();
      ctx.strokeStyle = hexToRgba(params.synapseColor, alpha);
      ctx.lineWidth = 1.2;
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = params.synapseGlowStrength * pulse;
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      ctx.restore();

      const mx = (s.x1 + s.x2) / 2;
      const my = (s.y1 + s.y2) / 2;
      ctx.save();
      ctx.fillStyle = hexToRgba(params.synapseColor, 0.3 + pulse * 0.5);
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = 8 + pulse * 6;
      ctx.beginPath();
      ctx.arc(mx, my, 2 + pulse * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPulses() {
    for (let i = 0; i < pulses.length; i++) {
      const p = pulses[i];
      const s = p.synapse;
      const t = p.t;
      const px = s.x1 + (s.x2 - s.x1) * t;
      const py = s.y1 + (s.y2 - s.y1) * t;
      ctx.save();
      ctx.fillStyle = params.pulseColor;
      ctx.shadowColor = params.pulseColor;
      ctx.shadowBlur = 14 * params.pulseBrightness;
      ctx.globalAlpha = params.pulseBrightness;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = hexToRgba(params.pulseColor, 0.4);
      ctx.lineWidth = 1;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(px, py, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function animate() {
    animFrameId = requestAnimationFrame(animate);
    if (paused) return;
    time += 0.016;

    updateBranches();
    detectSynapses();
    updatePulses();

    drawBackground();
    drawBranches();
    drawSynapses();
    drawPulses();
    drawNeurons();
    drawScanlines();
    drawVignette();
  }

  const gui = new dat.GUI({ width: 300 });
  const growthFolder = gui.addFolder('Growth');
  growthFolder.add(params, 'neuronCount', 3, 6).step(1).name('Neuron Count');
  growthFolder.add(params, 'branchGrowthSpeed', 0.5, 8).step(0.1).name('Growth Speed');
  growthFolder.add(params, 'maxBranchDepth', 2, 10).step(1).name('Max Depth');
  growthFolder.add(params, 'branchSplitChance', 0, 1).step(0.05).name('Split Chance');
  growthFolder.add(params, 'branchCurvature', 0, 1).step(0.05).name('Curvature');
  growthFolder.add(params, 'maxBranchLength', 40, 300).step(5).name('Max Length');
  growthFolder.open();

  const synapseFolder = gui.addFolder('Synapses');
  synapseFolder.add(params, 'synapseDistanceThreshold', 10, 80).step(1).name('Distance Threshold');
  synapseFolder.add(params, 'synapseGlowStrength', 0, 30).step(1).name('Glow Strength');
  synapseFolder.open();

  const pulseFolder = gui.addFolder('Pulses');
  pulseFolder.add(params, 'pulseSpeed', 0.005, 0.05).step(0.001).name('Speed');
  pulseFolder.add(params, 'pulseFrequency', 0.001, 0.03).step(0.001).name('Frequency');
  pulseFolder.add(params, 'pulseBrightness', 0.2, 2).step(0.1).name('Brightness');
  pulseFolder.open();

  const visualsFolder = gui.addFolder('Visuals');
  visualsFolder.addColor(params, 'bgColor').name('Background');
  visualsFolder.addColor(params, 'branchColor').name('Branch Color');
  visualsFolder.addColor(params, 'accentBranchColor').name('Accent Branch');
  visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
  visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
  visualsFolder.open();

  gui.add(params, 'regenerate').name('Regenerate Network');
  gui.add(params, 'clearCanvas').name('Clear Canvas');
  gui.add(params, 'pauseResume').name('Pause / Resume');

  initNetwork();
  animate();
})();
</script>
</body>
</html>
