<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CHIP-8 Emulator</title>
<style>
body{background:#14161c;color:#d8dde6;font:14px monospace;margin:0;padding:16px}
h1{font-size:18px;margin:0 0 10px}
#wrap{display:flex;flex-wrap:wrap;gap:16px}
canvas{background:#000;border:2px solid #456;image-rendering:pixelated;width:640px;height:320px;max-width:100%}
button,input,select{font:inherit;background:#2a3040;color:#eef;border:1px solid #567;padding:5px 10px;border-radius:3px}
button{cursor:pointer}button:hover{background:#3a4560}
.panel{background:#1d212b;border:1px solid #345;padding:10px;border-radius:4px}
#pad{display:grid;grid-template-columns:repeat(4,56px);gap:6px;margin-top:8px}
#pad div{background:#2a3040;border:1px solid #567;border-radius:4px;text-align:center;padding:6px 0;user-select:none;cursor:pointer}
#pad div.on{background:#3c9;color:#000}
#pad small{display:block;color:#9ab}
#regs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 14px}
.row{margin:8px 0}
#dis{color:#fc6;font-size:16px}
</style></head><body>
<h1>CHIP-8 Emulator</h1>
<div id="wrap">
<div>
 <canvas id="scr" width="64" height="32"></canvas>
 <div class="row">
  <button id="run">Run</button> <button id="pause">Pause</button> <button id="step">Step</button> <button id="reset">Reset</button>
  <button id="demo">Load demo</button>
 </div>
 <div class="row">Speed: <input type="range" id="ipf" min="1" max="60" value="12"> <span id="ipfv">12</span> instr/frame
 </div>
 <div class="row">ROM file: <input type="file" id="file"></div>
 <div class="row" id="status"></div>
</div>
<div>
 <div class="panel">Keypad (click or use keyboard)<div id="pad"></div>
 <p>Demo: W=up, S=down, A=left, D=right (hex 5/8/7/9)</p></div>
 <div class="panel" style="margin-top:10px"><b>Debugger</b>
  <div class="row">PC: <span id="pc"></span> &nbsp; I: <span id="i"></span> &nbsp; SP: <span id="sp"></span> &nbsp; DT: <span id="dt"></span> &nbsp; ST: <span id="st"></span></div>
  <div class="row">Opcode: <span id="dis"></span></div>
  <div id="regs"></div>
  <div class="row">Stack: <span id="stack"></span></div>
 </div>
</div>
</div>
<script>
const DEMO=[0x60,0x1C,0x61,0x0C,0xA2,0x30,0xD0,0x18,0x62,0x05,0xE2,0xA1,0x71,0xFF,0x62,0x08,0xE2,0xA1,0x71,0x01,
0x62,0x07,0xE2,0xA1,0x70,0xFF,0x62,0x09,0xE2,0xA1,0x70,0x01,0xD0,0x18,0x63,0x01,0xF3,0x15,0xF4,0x07,0x34,0x00,0x12,0x26,0x12,0x06];
// Assembled demo: code at 0x200, sprite placed at 0x230 below.
const DEMO_ROM=new Array(0x40).fill(0);
(function(){// real layout (addresses): see comments
 const c=[0x60,0x1C,0x61,0x0C,0xA2,0x30,
  0xD0,0x18,                 //206 erase
  0x62,0x05,0xE2,0xA1,0x71,0xFF,
  0x62,0x08,0xE2,0xA1,0x71,0x01,
  0x62,0x07,0xE2,0xA1,0x70,0xFF,
  0x62,0x09,0xE2,0xA1,0x70,0x01,
  0xD0,0x18,                 //220 draw
  0x63,0x01,0xF3,0x15,       //DT=1
  0xF4,0x07,0x34,0x00,0x12,0x26, //wait for DT==0
  0x12,0x06];                //loop
 c.forEach((b,i)=>DEMO_ROM[i]=b);
 [0x3C,0x42,0xA5,0x81,0xA5,0x99,0x42,0x3C].forEach((b,i)=>DEMO_ROM[0x30+i]=b);
})();
const FONT=[0xF0,0x90,0x90,0x90,0xF0,0x20,0x60,0x20,0x20,0x70,0xF0,0x10,0xF0,0x80,0xF0,0xF0,0x10,0xF0,0x10,0xF0,
0x90,0x90,0xF0,0x10,0x10,0xF0,0x80,0xF0,0x10,0xF0,0xF0,0x80,0xF0,0x90,0xF0,0xF0,0x10,0x20,0x40,0x40,
0xF0,0x90,0xF0,0x90,0xF0,0xF0,0x90,0xF0,0x10,0xF0,0xF0,0x90,0xF0,0x90,0x90,0xE0,0x90,0xE0,0x90,0xE0,
0xF0,0x80,0x80,0x80,0xF0,0xE0,0x90,0x90,0x90,0xE0,0xF0,0x80,0xF0,0x80,0xF0,0xF0,0x80,0xF0,0x80,0x80];
const hex=(n,w)=>n.toString(16).toUpperCase().padStart(w,'0');
class Chip8{
 constructor(){this.reset();}
 reset(){this.mem=new Uint8Array(4096);this.mem.set(FONT,0x50);this.V=new Uint8Array(16);this.I=0;this.pc=0x200;
  this.stack=[];this.dt=0;this.st=0;this.fb=new Uint8Array(64*32);this.keys=new Array(16).fill(false);this.dirty=true;}
 load(rom){this.reset();this.mem.set(rom.slice(0,4096-0x200),0x200);}
 step(){
  const m=this.mem,V=this.V,pc=this.pc;
  const op=(m[pc]<<8)|m[(pc+1)&4095];this.pc=(pc+2)&4095;
  const x=(op>>8)&15,y=(op>>4)&15,n=op&15,nn=op&255,nnn=op&0xFFF;
  switch(op>>12){
  case 0:if(op==0x00E0){this.fb.fill(0);this.dirty=true;}
   else if(op==0x00EE){if(this.stack.length)this.pc=this.stack.pop();}break;
  case 1:this.pc=nnn;break;
  case 2:if(this.stack.length<16)this.stack.push(this.pc);this.pc=nnn;break;
  case 3:if(V[x]==nn)this.pc+=2;break;
  case 4:if(V[x]!=nn)this.pc+=2;break;
  case 5:if(V[x]==V[y])this.pc+=2;break;
  case 6:V[x]=nn;break;
  case 7:V[x]+=nn;break;
  case 8:{const a=V[x],b=V[y];let f;
   switch(n){
   case 0:V[x]=b;break;case 1:V[x]=a|b;break;case 2:V[x]=a&b;break;case 3:V[x]=a^b;break;
   case 4:{const s=a+b;V[x]=s;V[15]=s>255?1:0;break;}
   case 5:V[x]=a-b;V[15]=a>=b?1:0;break;
   case 6:V[x]=a>>1;V[15]=a&1;break;
   case 7:V[x]=b-a;V[15]=b>=a?1:0;break;
   case 0xE:V[x]=a<<1;V[15]=a>>7;break;}
   break;}
  case 9:if(V[x]!=V[y])this.pc+=2;break;
  case 0xA:this.I=nnn;break;
  case 0xB:this.pc=(nnn+V[0])&0xFFF;break;
  case 0xC:V[x]=(Math.random()*256)&nn;break;
  case 0xD:{const px=V[x]%64,py=V[y]%32;V[15]=0;
   for(let r=0;r<n;r++){const yy=py+r;if(yy>=32)break;const b=m[(this.I+r)&4095];
    for(let c=0;c<8;c++){const xx=px+c;if(xx>=64)break;
     if(b&(0x80>>c)){const k=yy*64+xx;if(this.fb[k])V[15]=1;this.fb[k]^=1;}}}
   this.dirty=true;break;}
  case 0xE:if(nn==0x9E){if(this.keys[V[x]&15])this.pc+=2;}else if(nn==0xA1){if(!this.keys[V[x]&15])this.pc+=2;}break;
  case 0xF:switch(nn){
   case 0x07:V[x]=this.dt;break;
   case 0x0A:{const k=this.keys.indexOf(true);if(k>=0)V[x]=k;else this.pc=pc;break;}
   case 0x15:this.dt=V[x];break;
   case 0x18:this.st=V[x];break;
   case 0x1E:this.I=(this.I+V[x])&0xFFFF;break;
   case 0x29:this.I=0x50+(V[x]&15)*5;break;
   case 0x33:m[this.I&4095]=Math.floor(V[x]/100);m[(this.I+1)&4095]=Math.floor(V[x]/10)%10;m[(this.I+2)&4095]=V[x]%10;break;
   case 0x55:for(let i=0;i<=x;i++)m[(this.I+i)&4095]=V[i];this.I+=x+1;break;
   case 0x65:for(let i=0;i<=x;i++)V[i]=m[(this.I+i)&4095];this.I+=x+1;break;}
   break;}
  this.pc&=4095;
 }
 tick(){if(this.dt>0)this.dt--;if(this.st>0)this.st--;}
 static dis(op){
  const x='V'+hex((op>>8)&15,1),y='V'+hex((op>>4)&15,1),n=op&15,nn=hex(op&255,2),nnn=hex(op&0xFFF,3);
  switch(op>>12){
  case 0:return op==0xE0?'CLS':op==0xEE?'RET':'SYS '+nnn;
  case 1:return'JP '+nnn;case 2:return'CALL '+nnn;
  case 3:return`SE ${x}, ${nn}`;case 4:return`SNE ${x}, ${nn}`;case 5:return`SE ${x}, ${y}`;
  case 6:return`LD ${x}, ${nn}`;case 7:return`ADD ${x}, ${nn}`;
  case 8:return({0:'LD',1:'OR',2:'AND',3:'XOR',4:'ADD',5:'SUB',6:'SHR',7:'SUBN',0xE:'SHL'}[n]||'???')+` ${x}, ${y}`;
  case 9:return`SNE ${x}, ${y}`;case 0xA:return'LD I, '+nnn;case 0xB:return'JP V0, '+nnn;
  case 0xC:return`RND ${x}, ${nn}`;case 0xD:return`DRW ${x}, ${y}, ${n}`;
  case 0xE:return(op&255)==0x9E?`SKP ${x}`:(op&255)==0xA1?`SKNP ${x}`:'???';
  case 0xF:return({7:`LD ${x}, DT`,0xA:`LD ${x}, K`,0x15:`LD DT, ${x}`,0x18:`LD ST, ${x}`,0x1E:`ADD I, ${x}`,
   0x29:`LD F, ${x}`,0x33:`LD B, ${x}`,0x55:`LD [I], ${x}`,0x65:`LD ${x}, [I]`}[op&255]||'???');}
  return'???';}
}
const $=id=>document.getElementById(id);
const cpu=new Chip8(),ctx=$('scr').getContext('2d');
let running=true,acc=0,last=0,romName='demo ROM';
// keypad: hex -> keyboard key
const LAYOUT=[[1,'1'],[2,'2'],[3,'3'],[0xC,'4'],[4,'q'],[5,'w'],[6,'e'],[0xD,'r'],[7,'a'],[8,'s'],[9,'d'],[0xE,'f'],[0xA,'z'],[0,'x'],[0xB,'c'],[0xF,'v']];
const KEYMAP={};const padEls={};
LAYOUT.forEach(([h,k])=>{KEYMAP[k]=h;const d=document.createElement('div');d.innerHTML=hex(h,1)+'<small>'+k.toUpperCase()+'</small>';
 $('pad').appendChild(d);padEls[h]=d;
 const dn=e=>{e.preventDefault();setKey(h,true)},up=()=>setKey(h,false);
 d.addEventListener('mousedown',dn);d.addEventListener('mouseup',up);d.addEventListener('mouseleave',up);
 d.addEventListener('touchstart',dn);d.addEventListener('touchend',up);});
function setKey(h,v){cpu.keys[h]=v;padEls[h].classList.toggle('on',v);}
addEventListener('keydown',e=>{const h=KEYMAP[e.key.toLowerCase()];if(h!==undefined&&e.target.tagName!=='INPUT'){e.preventDefault();setKey(h,true);}});
addEventListener('keyup',e=>{const h=KEYMAP[e.key.toLowerCase()];if(h!==undefined){setKey(h,false);}});
addEventListener('blur',()=>{for(let i=0;i<16;i++)setKey(i,false);});
// regs UI
const regEls=[];for(let i=0;i<16;i++){const s=document.createElement('span');$('regs').appendChild(s);regEls.push(s);}
// audio
let ac=null,osc=null;
function beep(on){if(on&&!osc){try{ac=ac||new AudioContext();osc=ac.createOscillator();osc.frequency.value=440;const g=ac.createGain();g.gain.value=.05;osc.connect(g);g.connect(ac.destination);osc.start();}catch(e){osc=null;}}
 else if(!on&&osc){osc.stop();osc=null;}}
function render(){
 const img=ctx.createImageData(64,32);
 for(let i=0;i<2048;i++){const v=cpu.fb[i]?255:0;img.data[i*4]=v*0.3;img.data[i*4+1]=v;img.data[i*4+2]=v*0.6;img.data[i*4+3]=255;}
 ctx.putImageData(img,0,0);cpu.dirty=false;}
function debug(){
 const op=(cpu.mem[cpu.pc]<<8)|cpu.mem[(cpu.pc+1)&4095];
 $('pc').textContent=hex(cpu.pc,3);$('i').textContent=hex(cpu.I,4);$('sp').textContent=cpu.stack.length;
 $('dt').textContent=hex(cpu.dt,2);$('st').textContent=hex(cpu.st,2);
 $('dis').textContent=hex(op,4)+'  '+Chip8.dis(op);
 for(let i=0;i<16;i++)regEls[i].textContent='V'+hex(i,1)+': '+hex(cpu.V[i],2);
 $('stack').textContent=cpu.stack.length?cpu.stack.map(a=>hex(a,3)).join(' '):'(empty)';
 $('status').textContent=(running?'Running':'Paused')+' - '+romName;}
function frame(t){
 if(running){const n=+$('ipf').value;for(let i=0;i<n;i++)cpu.step();cpu.tick();}
 beep(running&&cpu.st>0);
 if(cpu.dirty)render();debug();requestAnimationFrame(frame);}
// limit to 60Hz regardless of display refresh
function loop(t){if(t-last>=16.6){last=t;frame(t);}else requestAnimationFrame(loop);}
const _raf=requestAnimationFrame;
function frame2(){}
function start(){const f=(t)=>{if(t-last>=16){last=t;
 if(running){const n=+$('ipf').value;for(let i=0;i<n;i++)cpu.step();cpu.tick();}
 beep(running&&cpu.st>0);if(cpu.dirty)render();debug();}
 _raf(f);};_raf(f);}
let currentROM=DEMO_ROM;
function loadROM(rom,name){currentROM=rom;romName=name;cpu.load(rom);render();debug();}
$('run').onclick=()=>{running=true;};
$('pause').onclick=()=>{running=false;beep(false);};
$('step').onclick=()=>{running=false;cpu.step();if(cpu.dirty)render();debug();};
$('reset').onclick=()=>{cpu.load(currentROM);render();debug();};
$('demo').onclick=()=>loadROM(DEMO_ROM,'demo ROM');
$('ipf').oninput=e=>{$('ipfv').textContent=e.target.value;};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>loadROM(new Uint8Array(r.result),f.name);r.readAsArrayBuffer(f);e.target.blur();};
loadROM(DEMO_ROM,'demo ROM');start();
</script></body></html>
