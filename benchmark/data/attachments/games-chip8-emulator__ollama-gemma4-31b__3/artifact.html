<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #screen-container {
            position: relative;
            border: 4px solid #333;
            background-color: #000;
        }
        canvas {
            image-rendering: pixelated;
            display: block;
        }
        .panel {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 300px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            background: #444;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #00ff41;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 40px);
            gap: 5px;
            margin-top: 10px;
        }
        .key {
            width: 40px;
            height: 40px;
            border: 1px solid #00ff41;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            user-select: none;
        }
        .key.active {
            background-color: #00ff41;
            color: #000;
        }
        .debug-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            font-size: 12px;
            margin-top: 10px;
        }
        .debug-item {
            border-bottom: 1px solid #444;
            padding: 2px 0;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="file"] {
            color: #00ff41;
        }
    </style>
</head>
<body>

    <h1>CHIP-8 EMULATOR</h1>

    <div class="controls">
        <button id="btnRun">Run</button>
        <button id="btnPause">Pause</button>
        <button id="btnStep">Step</button>
        <button id="btnReset">Reset</button>
        <div class="slider-container">
            <label>Speed:</label>
            <input type="range" id="speedRange" min="10" max="1000" value="500">
            <span id="speedVal">500</span> Hz
        </div>
        <input type="file" id="fileInput" accept=".ch8,.rom">
    </div>

    <div class="container">
        <div id="screen-container">
            <canvas id="chip8Canvas" width="64" height="32" style="width: 640px; height: 320px;"></canvas>
        </div>

        <div class="panel">
            <h3>Debugger</h3>
            <div>PC: <span id="debugPC">0x000</span> | I: <span id="debugI">0x000</span></div>
            <div id="debugInstr" style="margin: 10px 0; color: #ffcc00; font-weight: bold;">Instr: -</div>
            <div class="debug-grid" id="debugRegs">
                <!-- V0-VF generated here -->
            </div>
            <div style="margin-top: 10px;">
                Stack: <span id="debugStack">[]</span>
            </div>
            <div style="margin-top: 10px;">
                Timers: D:<span id="debugDT">0</span> S:<span id="debugST">0</span>
            </div>

            <div class="keypad" id="visualKeypad">
                <!-- 16 keys -->
            </div>
            <div style="font-size: 10px; margin-top: 5px; text-align: center;">
                Keys: 1-4, Q-R, A-F, Z-V
            </div>
        </div>
    </div>
