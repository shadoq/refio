<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #1a1a1a;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #scoreBoard {
            color: white;
            margin-top: 20px;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .score-item {
            display: inline-block;
            margin: 0 20px;
        }

        #menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #menu.hidden {
            display: none;
        }

        .menu-content {
            text-align: center;
            color: white;
        }

        .menu-content h2 {
            font-size: 48px;
            margin-bottom: 40px;
            color: #667eea;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .menu-content p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .mode-button {
            display: block;
            width: 300px;
            padding: 15px;
            margin: 15px auto;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .mode-button:hover {
            background: #764ba2;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .mode-button:active {
            transform: scale(0.98);
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #gameOverScreen.hidden {
            display: none;
        }

        .game-over-content {
            text-align: center;
            color: white;
        }

        .game-over-content h2 {
            font-size: 48px;
            margin-bottom: 30px;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .game-over-content p {
            font-size: 24px;
            margin: 15px 0;
            color: #ccc;
        }

        .game-over-content .final-scores {
            margin: 30px 0;
            font-size: 20px;
        }

        .restart-button {
            display: inline-block;
            padding: 15px 40px;
            margin-top: 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .restart-button:hover {
            background: #764ba2;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .restart-button:active {
            transform: scale(0.98);
        }

        .instructions {
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🐍 SNAKE GAME 🐍</h1>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="scoreBoard">
            <div class="score-item">Player 1: <span id="score1">0</span></div>
            <div class="score-item">Player 2: <span id="score2">0</span></div>
        </div>
        <div class="instructions">
            Use Arrow Keys or WASD to move | Press SPACE to restart
        </div>
    </div>

    <div id="menu">
        <div class="menu-content">
            <h2>SNAKE GAME</h2>
            <p>Select Game Mode:</p>
            <button class="mode-button" onclick="startGame('human-human')">Human vs Human</button>
            <button class="mode-button" onclick="startGame('human-cpu')">Human vs CPU</button>
            <button class="mode-button" onclick="startGame('cpu-cpu')">CPU vs CPU</button>
        </div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="game-over-content">
            <h2>GAME OVER</h2>
            <div class="final-scores">
                <p>Player 1 Score: <span id="finalScore1">0</span></p>
                <p>Player 2 Score: <span id="finalScore2">0</span></p>
                <p id="winnerText"></p>
            </div>
            <button class="restart-button" onclick="showMenu()">Back to Menu</button>
            <p style="margin-top: 20px; color: #999;">Press SPACE to restart</p>
        </div>
    </div>

    <script>
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const TICK_RATE = 100; // milliseconds

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            mode: null,
            running: false,
            gameOver: false,
            snake1: [],
            snake2: [],
            food: null,
            score1: 0,
            score2: 0,
            direction1: { x: 1, y: 0 },
            direction2: { x: -1, y: 0 },
            nextDirection1: { x: 1, y: 0 },
            nextDirection2: { x: -1, y: 0 }
        };

        let lastTickTime = 0;

        function initGame() {
            gameState.snake1 = [
                { x: 5, y: 15 },
                { x: 4, y: 15 },
                { x: 3, y: 15 }
            ];
            gameState.snake2 = [
                { x: 25, y: 15 },
                { x: 26, y: 15 },
                { x: 27, y: 15 }
            ];
            gameState.food = spawnFood();
            gameState.score1 = 0;
            gameState.score2 = 0;
            gameState.direction1 = { x: 1, y: 0 };
            gameState.direction2 = { x: -1, y: 0 };
            gameState.nextDirection1 = { x: 1, y: 0 };
            gameState.nextDirection2 = { x: -1, y: 0 };
            gameState.running = true;
            gameState.gameOver = false;
            lastTickTime = Date.now();
        }

        function spawnFood() {
            let food;
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = !isPositionOccupied(food);
            }
            return food;
        }

        function isPositionOccupied(pos) {
            return gameState.snake1.some(s => s.x === pos.x && s.y === pos.y) ||
                   gameState.snake2.some(s => s.x === pos.x && s.y === pos.y);
        }

        function updateGame() {
            if (!gameState.running || gameState.gameOver) return;

            // Update directions
            gameState.direction1 = gameState.nextDirection1;
            gameState.direction2 = gameState.nextDirection2;

            // CPU AI for snake 2
            if (gameState.mode === 'human-cpu' || gameState.mode === 'cpu-cpu') {
                gameState.nextDirection2 = findPathToFood(gameState.snake2, gameState.food);
            }

            // Move snakes
            moveSnake(1);
            moveSnake(2);

            // Check collisions
            checkCollisions();

            // Check food
            checkFoodCollision();

            updateScoreDisplay();
        }

        function moveSnake(snakeNum) {
            const snake = snakeNum === 1 ? gameState.snake1 : gameState.snake2;
            const direction = snakeNum === 1 ? gameState.direction1 : gameState.direction2;

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            snake.unshift(newHead);
            snake.pop();
        }

        function checkCollisions() {
            // Check snake 1 collisions
            if (isSnakeColliding(gameState.snake1)) {
                endGame();
                return;
            }

            // Check snake 2 collisions
            if (isSnakeColliding(gameState.snake2)) {
                endGame();
                return;
            }

            // Check snake 1 vs snake 2 head collision
            const head1 = gameState.snake1[0];
            const head2 = gameState.snake2[0];

            if (head1.x === head2.x && head1.y === head2.y) {
                endGame();
                return;
            }

            // Check if snake 1 head hits snake 2 body
            if (gameState.snake2.some(s => s.x === head1.x && s.y === head1.y)) {
                endGame();
                return;
            }

            // Check if snake 2 head hits snake 1 body
            if (gameState.snake1.some(s => s.x === head2.x && s.y === head2.y)) {
                endGame();
                return;
            }
        }

        function isSnakeColliding(snake) {
            const head = snake[0];

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return true;
            }

            // Check self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function checkFoodCollision() {
            const head1 = gameState.snake1[0];
            const head2 = gameState.snake2[0];

            if (head1.x === gameState.food.x && head1.y === gameState.food.y) {
                gameState.score1++;
                gameState.snake1.push({ ...gameState.snake1[gameState.snake1.length - 1] });
                gameState.food = spawnFood();
            }

            if (head2.x === gameState.food.x && head2.y === gameState.food.y) {
                gameState.score2++;
                gameState.snake2.push({ ...gameState.snake2[gameState.snake2.length - 1] });
                gameState.food = spawnFood();
            }
        }

        function findPathToFood(snake, food) {
            const head = snake[0];
            const queue = [[head, []]];
            const visited = new Set();
            visited.add(`${head.x},${head.y}`);

            while (queue.length > 0) {
                const [current, path] = queue.shift();

                if (current.x === food.x && current.y === food.y) {
                    if (path.length > 0) {
                        return path[0];
                    }
                    return gameState.direction2;
                }

                const directions = [
                    { x: 1, y: 0 },
                    { x: -1, y: 0 },
                    { x: 0, y: 1 },
                    { x: 0, y: -1 }
                ];

                for (const dir of directions) {
                    const next = {
                        x: current.x + dir.x,
                        y: current.y + dir.y
                    };

                    const key = `${next.x},${next.y}`;

                    if (next.x >= 0 && next.x < GRID_SIZE &&
                        next.y >= 0 && next.y < GRID_SIZE &&
                        !visited.has(key)) {

                        visited.add(key);
                        queue.push([next, [...path, dir]]);
                    }
                }
            }

            // If no path found, move randomly
            const directions = [
                { x: 1, y: 0 },
                { x: -1, y: 0 },
                { x: 0, y: 1 },
                { x: 0, y: -1 }
            ];

            const validDirections = directions.filter(dir => {
                const next = {
                    x: head.x + dir.x,
                    y: head.y + dir.y
                };
                return next.x >= 0 && next.x < GRID_SIZE &&
                       next.y >= 0 && next.y < GRID_SIZE &&
                       !snake.some(s => s.x === next.x && s.y === next.y);
            });

            return validDirections.length > 0 ? validDirections[0] : gameState.direction2;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(
                gameState.food.x * CELL_SIZE + CELL_SIZE / 2,
                gameState.food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw snake 1
            drawSnake(gameState.snake1, '#4ecdc4');

            // Draw snake 2
            drawSnake(gameState.snake2, '#ffe66d');
        }

        function drawSnake(snake, color) {
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const brightness = 1 - (i / snake.length) * 0.5;

                ctx.fillStyle = color;
                ctx.globalAlpha = brightness;
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
                ctx.globalAlpha = 1;

                // Draw eyes on head
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 2;
                    ctx.fillRect(
                        segment.x * CELL_SIZE + 4,
                        segment.y * CELL_SIZE + 4,
                        eyeSize,
                        eyeSize
                    );
                    ctx.fillRect(
                        segment.x * CELL_SIZE + CELL_SIZE - 6,
                        segment.y * CELL_SIZE + 4,
                        eyeSize,
                        eyeSize
                    );
                }
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score1').textContent = gameState.score1;
            document.getElementById('score2').textContent = gameState.score2;
        }

        function endGame() {
            gameState.running = false;
            gameState.gameOver = true;
            showGameOverScreen();
        }

        function showGameOverScreen() {
            document.getElementById('finalScore1').textContent = gameState.score1;
            document.getElementById('finalScore2').textContent = gameState.score2;

            let winnerText = '';
            if (gameState.score1 > gameState.score2) {
                winnerText = 'Player 1 Wins!';
            } else if (gameState.score2 > gameState.score1) {
                winnerText = 'Player 2 Wins!';
            } else {
                winnerText = 'It\'s a Tie!';
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function showMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameState.running = false;
        }

        function startGame(mode) {
            gameState.mode = mode;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            initGame();
        }

        function gameLoop(currentTime) {
            if (currentTime - lastTickTime >= TICK_RATE) {
                updateGame();
                lastTickTime = currentTime;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState.gameOver) {
                    showMenu();
                }
                return;
            }

            if (!gameState.running) return;

            const key = e.key.toLowerCase();

            // Player 1 controls (Arrow keys)
            if (e.key === 'ArrowUp' && gameState.direction1.y === 0) {
                gameState.nextDirection1 = { x: 0, y: -1 };
                e.preventDefault();
            } else if (e.key === 'ArrowDown' && gameState.direction1.y === 0) {
                gameState.nextDirection1 = { x: 0, y: 1 };
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' && gameState.direction1.x === 0) {
                gameState.nextDirection1 = { x: -1, y: 0 };
                e.preventDefault();
            } else if (e.key === 'ArrowRight' && gameState.direction1.x === 0) {
                gameState.nextDirection1 = { x: 1, y: 0 };
                e.preventDefault();
            }

            // Player 2 controls (WASD) - only if human
            if (gameState.mode === 'human-human') {
                if (key === 'w' && gameState.direction2.y === 0) {
                    gameState.nextDirection2 = { x: 0, y: -1 };
                    e.preventDefault();
                } else if (key === 's' && gameState.direction2.y === 0) {
                    gameState.nextDirection2 = { x: 0, y: 1 };
                    e.preventDefault();
                } else if (key === 'a' && gameState.direction2.x === 0) {
                    gameState.nextDirection2 = { x: -1, y: 0 };
                    e.preventDefault();
                } else if (key === 'd' && gameState.direction2.x === 0) {
                    gameState.nextDirection2 = { x: 1, y: 0 };
                    e.preventDefault();
                }
            }
        });

        // Start the game loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
