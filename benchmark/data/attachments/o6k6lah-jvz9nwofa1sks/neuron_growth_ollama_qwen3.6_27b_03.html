<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Configuration
        const params = {
            // Growth
            neuronCount: 4,
            growthSpeed: 2,
            maxDepth: 5,
            splitChance: 0.3,
            curvature: 0.5,
            maxLength: 100,
            
            // Synapses
            synapseThreshold: 40,
            synapseGlow: 10,
            
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.01,
            pulseBrightness: 1,
            
            // Visuals
            bgColor: '#05070f',
            bgGlow: '#101a3a',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            uiColor: '#ffd400',
            
            // Actions
            regenerate: () => init(),
            clear: () => {
                branches = [];
                synapses = [];
                pulses = [];
                neurons = [];
                init();
            },
            pause: () => {
                isPaused = !isPaused;
                if (!isPaused) loop();
            }
        };

        let isPaused = false;
        let branches = [];
        let synapses = [];
        let pulses = [];
        let neurons = [];
        let frameCount = 0;

        // Dat.GUI Setup
        const gui = new dat.GUI();
        const folderGrowth = gui.addFolder('Growth');
        folderGrowth.add(params, 'neuronCount', 1, 10, 1).name('Neuron Count').onChange(init);
        folderGrowth.add(params, 'growthSpeed', 0.1, 10).name('Growth Speed');
        folderGrowth.add(params, 'maxDepth', 1, 10, 1).name('Max Depth');
        folderGrowth.add(params, 'splitChance', 0, 1).name('Split Chance');
        folderGrowth.add(params, 'curvature', 0, 2).name('Curvature');
        folderGrowth.add(params, 'maxLength', 10, 200).name('Max Length');
        folderGrowth.open();

        const folderSynapses = gui.addFolder('Synapses');
        folderSynapses.add(params, 'synapseThreshold', 10, 100).name('Distance Threshold');
        folderSynapses.add(params, 'synapseGlow', 0, 50).name('Glow Strength');
        folderSynapses.open();

        const folderPulses = gui.addFolder('Pulses');
        folderPulses.add(params, 'pulseSpeed', 0.001, 0.1).name('Speed');
        folderPulses.add(params, 'pulseFrequency', 0.001, 0.1).name('Frequency');
        folderPulses.add(params, 'pulseBrightness', 0, 2).name('Brightness');
        folderPulses.open();

        const folderVisuals = gui.addFolder('Visuals');
        folderVisuals.addColor(params, 'bgColor').name('Background');
        folderVisuals.addColor(params, 'branchColor').name('Branch Color');
        folderVisuals.addColor(params, 'accentColor').name('Accent Color');
        folderVisuals.addColor(params, 'synapseColor').name('Synapse Color');
        folderVisuals.addColor(params, 'pulseColor').name('Pulse Color');
        folderVisuals.open();

        const folderActions = gui.addFolder('Actions');
        folderActions.add(params, 'regenerate').name('Regenerate');
        folderActions.add(params, 'clear').name('Clear');
        folderActions.add(params, 'pause').name('Pause/Resume');
        folderActions.open();

        // Classes
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = params.branchColor;
                ctx.shadowBlur = 20;
                ctx.shadowColor = params.branchColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, parent = null) {
                this.startX = startX;
                this.startY = startY;
                this.endX = startX;
                this.endY = startY;
                this.angle = angle;
                this.depth = depth;
                this.length = 0;
                this.maxLength = Math.random() * params.maxLength * 0.5 + params.maxLength * 0.5;
                this.growth = 0;
                this.done = false;
                this.parent = parent;
                this.children = [];
                this.thickness = Math.max(0.5, 4 - depth * 0.5);
                this.color = depth % 2 === 0 ? params.branchColor : params.accentColor;
                this.controlPoint = {
                    x: startX + Math.cos(angle + Math.PI / 2) * params.curvature * 10,
                    y: startY + Math.sin(angle + Math.PI / 2) * params.curvature * 10
                };
            }

            update() {
                if (this.done) return;

                this.growth += params.growthSpeed;
                this.length = Math.min(this.growth, this.maxLength);
                
                const progress = this.length / this.maxLength;
                // Quadratic Bezier interpolation
                const t = progress;
                const mt = 1 - t;
                this.endX = mt * mt * this.startX + 2 * mt * t * this.controlPoint.x + t * t * (this.startX + Math.cos(this.angle) * this.maxLength);
                this.endY = mt * mt * this.startY + 2 * mt * t * this.controlPoint.y + t * t * (this.startY + Math.sin(this.angle) * this.maxLength);

                if (this.length >= this.maxLength) {
                    this.done = true;
                    // Try to split
                    if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                        const numChildren = Math.random() < 0.5 ? 2 : 3;
                        for (let i = 0; i < numChildren; i++) {
                            const newAngle = this.angle + (Math.random() - 0.5) * 1.5;
                            const child = new Branch(this.endX, this.endY, newAngle, this.depth + 1, this);
                            this.children.push(child);
                            branches.push(child);
                        }
                    }
                }
            }

            draw() {
                if (this.length <= 0) return;
                
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.quadraticCurveTo(this.controlPoint.x, this.controlPoint.y, this.endX, this.endY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x = (branch1.endX + branch2.endX) / 2;
                this.y = (branch1.endY + branch2.endY) / 2;
                this.radius = 3;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.x = (this.branch1.endX + this.branch2.endX) / 2;
                this.y = (this.branch1.endY + this.branch2.endY) / 2;
                this.pulsePhase += 0.05;
            }

            draw() {
                const glow = Math.sin(this.pulsePhase) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + glow * 2, 0, Math.PI * 2);
                ctx.fillStyle = params.synapseColor;
                ctx.shadowBlur = params.synapseGlow * glow;
                ctx.shadowColor = params.synapseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.speed = params.pulseSpeed;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.active = true;
            }

            update() {
                this.progress += this.speed * this.direction;
                if (this.progress > 1 || this.progress < 0) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                
                const b1 = this.synapse.branch1;
                const b2 = this.synapse.branch2;
                
                // Interpolate position between branch tips
                const x = b1.endX + (b2.endX - b1.endX) * this.progress;
                const y = b1.endY + (b2.endY - b1.endY) * this.progress;
                
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.shadowBlur = 15 * params.pulseBrightness;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Initialization
        function init() {
            branches = [];
            synapses = [];
            pulses = [];
            neurons = [];
            
            const count = Math.floor(params.neuronCount);
            for (let i = 0; i < count; i++) {
                const x = width / 2 + (Math.random() - 0.5) * 200;
                const y = height / 2 + (Math.random() - 0.5) * 200;
                const neuron = new Neuron(x, y);
                neurons.push(neuron);
                
                // Initial branches
                const numBranches = Math.floor(Math.random() * 3) + 2;
                for (let j = 0; j < numBranches; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const branch = new Branch(x, y, angle, 0);
                    branches.push(branch);
                }
            }
        }

        // Synapse Detection
        function checkSynapses() {
            // Simple O(N^2) check for demo purposes, optimized for small N
            for (let i = 0; i < branches.length; i++) {
                if (!branches[i].done) continue;
                for (let j = i + 1; j < branches.length; j++) {
                    if (!branches[j].done) continue;
                    
                    const dx = branches[i].endX - branches[j].endX;
                    const dy = branches[i].endY - branches[j].endY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < params.synapseThreshold) {
                        // Check if synapse already exists
                        let exists = false;
                        for (let s of synapses) {
                            if ((s.branch1 === branches[i] && s.branch2 === branches[j]) ||
                                (s.branch1 === branches[j] && s.branch2 === branches[i])) {
                                exists = true;
                                break;
                            }
                        }
                        if (!exists) {
                            synapses.push(new Synapse(branches[i], branches[j]));
                        }
                    }
                }
            }
        }

        // Pulse Generation
        function generatePulses() {
            if (Math.random() < params.pulseFrequency && synapses.length > 0) {
                const synapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(synapse));
            }
        }

        // Drawing Helpers
        function drawBackground() {
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // Vignette
            const gradient = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, 400);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Scanlines
            ctx.fillStyle = 'rgba(0, 229, 255, 0.03)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 1);
            }
        }

        // Main Loop
        function loop() {
            if (isPaused) return;
            
            frameCount++;
            drawBackground();
            
            // Update and Draw Branches
            for (let branch of branches) {
                branch.update();
                branch.draw();
            }
            
            // Check Synapses
            checkSynapses();
            
            // Update and Draw Synapses
            for (let synapse of synapses) {
                synapse.update();
                synapse.draw();
            }
            
            // Generate and Draw Pulses
            generatePulses();
            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update();
                pulses[i].draw();
                if (!pulses[i].active) {
                    pulses.splice(i, 1);
                }
            }
            
            // Draw Neurons
            for (let neuron of neurons) {
                neuron.draw();
            }
            
            requestAnimationFrame(loop);
        }

        // Start
        init();
        loop();

    </script>
</body>
</html>
