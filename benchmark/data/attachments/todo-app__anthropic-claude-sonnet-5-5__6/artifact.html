<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo App</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:40px 16px}
.app{background:#fff;width:100%;max-width:480px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:24px;align-self:flex-start}
h1{margin:0 0 16px;text-align:center;color:#333}
form{display:flex;gap:8px}
input[type=text]{flex:1;padding:10px 12px;border:2px solid #ddd;border-radius:8px;font-size:16px}
input[type=text]:focus{outline:none;border-color:#667eea}
button{cursor:pointer;font-size:14px}
.add{padding:10px 16px;border:0;border-radius:8px;background:#667eea;color:#fff;font-weight:600}
.add:hover{background:#5568d3}
.filters{display:flex;justify-content:center;gap:6px;margin:16px 0}
.filters button{border:1px solid #ddd;background:#fff;border-radius:16px;padding:5px 14px}
.filters button.active{background:#667eea;color:#fff;border-color:#667eea}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee}
li span{flex:1;word-break:break-word;color:#333}
li.done span{text-decoration:line-through;color:#999}
li input{width:18px;height:18px;cursor:pointer}
.del{border:0;background:none;color:#e55;font-size:20px;line-height:1}
.del:hover{color:#b00}
.footer{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:#777}
.footer button{border:0;background:none;color:#777;text-decoration:underline}
.empty{text-align:center;color:#aaa;padding:20px 0}
</style>
</head>
<body>
<div class="app">
  <h1>Todo List</h1>
  <form id="form">
    <input type="text" id="input" placeholder="What needs to be done?" autocomplete="off" autofocus>
    <button class="add" type="submit">Add</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="active">Active</button>
    <button data-f="completed">Completed</button>
  </div>
  <ul id="list"></ul>
  <div class="footer">
    <span id="count"></span>
    <button id="clear">Clear completed</button>
  </div>
</div>
<script>
const KEY = 'todos-v1';
let todos = [];
try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }
let filter = 'all';

const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

function render() {
  const list = $('list');
  list.innerHTML = '';
  const shown = todos.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
  if (!shown.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Nothing here.';
    list.appendChild(p);
  }
  shown.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const sp = document.createElement('span');
    sp.textContent = t.text;
    const del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = '&times;';
    del.title = 'Delete';
    del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };
    li.append(cb, sp, del);
    list.appendChild(li);
  });
  const left = todos.filter(t => !t.done).length;
  $('count').textContent = left + (left === 1 ? ' item' : ' items') + ' left';
  $('clear').style.visibility = todos.some(t => t.done) ? 'visible' : 'hidden';
  document.querySelectorAll('#filters button').forEach(b =>
    b.classList.toggle('active', b.dataset.f === filter));
}

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  todos.push({ id: Date.now() + Math.random(), text, done: false });
  $('input').value = '';
  save(); render();
};
$('filters').onclick = e => {
  if (e.target.dataset.f) { filter = e.target.dataset.f; render(); }
};
$('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
render();
</script>
</body>
</html>
