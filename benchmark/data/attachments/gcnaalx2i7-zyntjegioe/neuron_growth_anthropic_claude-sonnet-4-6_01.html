<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #canvas-wrapper {
    position: relative;
    width: 800px;
    height: 800px;
    box-shadow: 0 0 60px rgba(0,229,255,0.15), 0 0 120px rgba(0,229,255,0.05);
  }
  canvas {
    display: block;
    border: 1px solid rgba(0,229,255,0.2);
  }
  .dg.ac {
    z-index: 9999 !important;
  }
  .dg .c .slider {
    background: #101a3a !important;
  }
  .dg .cr.boolean:hover, .dg li:not(.folder):hover {
    background: #101a3a !important;
  }
  .dg {
    color: #ffd400 !important;
  }
  .dg .title {
    background: #101a3a !important;
    color: #00e5ff !important;
  }
  .dg.main .close-button {
    background: #101a3a !important;
    color: #ffd400 !important;
  }
</style>
</head>
<body>
<div id="canvas-wrapper">
  <canvas id="mainCanvas" width="800" height="800"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 800;

  // ── Parameters ──────────────────────────────────────────────────────────────
  const params = {
    // Growth
    neuronCount: 4,
    growthSpeed: 2.5,
    maxDepth: 6,
    splitChance: 0.35,
    curvature: 0.45,
    maxBranchLength: 120,
    // Synapses
    synapseThreshold: 38,
    synapseGlow: 14,
    // Pulses
    pulseSpeed: 1.8,
    pulseFrequency: 0.018,
    pulseBrightness: 1.0,
    // Visuals
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    showScanlines: true,
    showVignette: true,
    // Actions
    regenerate: function() { init(); },
    clearCanvas: function() { clearAll(); },
    pauseResume: function() { togglePause(); }
  };

  // ── State ────────────────────────────────────────────────────────────────────
  let branches = [];
  let synapses = [];
  let pulses = [];
  let tips = [];
  let paused = false;
  let animId = null;
  let frameCount = 0;
  let synapseSet = new Set();

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }

  function dist(ax,ay,bx,by) {
    const dx=ax-bx, dy=ay-by;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function lerp(a,b,t) { return a+(b-a)*t; }

  function randRange(a,b) { return a+Math.random()*(b-a); }

  function randAngle() { return Math.random()*Math.PI*2; }

  // ── Branch class ─────────────────────────────────────────────────────────────
  class Branch {
    constructor(x, y, angle, depth, parentColor) {
      this.x = x;
      this.y = y;
      this.angle = angle;
      this.depth = depth;
      this.length = 0;
      this.maxLength = randRange(params.maxBranchLength * 0.4, params.maxBranchLength) * (1 - depth * 0.1);
      this.thickness = Math.max(0.4, 2.2 - depth * 0.28);
      this.done = false;
      this.children = [];
      this.childrenSpawned = false;
      this.color = (depth % 2 === 0) ? params.branchColor : params.accentColor;
      // Store actual color at creation time
      this.resolvedColor = this.color;
      // Curve control point offset
      this.cpOffsetX = randRange(-40,40) * params.curvature;
      this.cpOffsetY = randRange(-40,40) * params.curvature;
      // Points for drawing
      this.points = [{x, y}];
      this.tipX = x;
      this.tipY = y;
      // Slight angle drift per step
      this.angleDrift = randRange(-0.04, 0.04);
    }

    grow() {
      if (this.done) return;
      const step = params.growthSpeed * (1 - this.depth * 0.06);
      const effectiveStep = Math.max(0.5, step);

      this.angle += this.angleDrift + randRange(-0.05,0.05) * params.curvature;
      const nx = this.tipX + Math.cos(this.angle) * effectiveStep;
      const ny = this.tipY + Math.sin(this.angle) * effectiveStep;
      this.length += effectiveStep;
      this.tipX = nx;
      this.tipY = ny;
      this.points.push({x: nx, y: ny});

      // Keep points array manageable
      if (this.points.length > 300) {
        this.points = this.points.slice(-300);
      }

      if (this.length >= this.maxLength) {
        this.done = true;
        tips.push({x: this.tipX, y: this.tipY, branch: this});
      }

      // Spawn children mid-growth
      if (!this.childrenSpawned && this.length > this.maxLength * 0.5 && this.depth < params.maxDepth) {
        this.childrenSpawned = true;
        if (Math.random() < params.splitChance) {
          const spread = randRange(0.3, 0.9);
          const b1 = new Branch(this.tipX, this.tipY, this.angle - spread, this.depth+1);
          const b2 = new Branch(this.tipX, this.tipY, this.angle + spread, this.depth+1);
          this.children.push(b1, b2);
          branches.push(b1, b2);
        }
        // Occasional small side branch
        if (Math.random() < 0.25 && this.depth < params.maxDepth - 1) {
          const side = new Branch(this.tipX, this.tipY, this.angle + (Math.random()<0.5?1:-1)*randRange(0.8,1.4), this.depth+2);
          this.children.push(side);
          branches.push(side);
        }
      }
    }

    draw() {
      if (this.points.length < 2) return;
      const col = (this.depth % 2 === 0) ? params.branchColor : params.accentColor;
      const rgb = hexToRgb(col);
      const alpha = Math.max(0.3, 1 - this.depth * 0.1);

      ctx.save();
      ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
      ctx.lineWidth = this.thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = col;
      ctx.shadowBlur = Math.max(4, 12 - this.depth * 1.5);

      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);

      if (this.points.length === 2) {
        ctx.lineTo(this.points[1].x, this.points[1].y);
      } else {
        // Smooth catmull-rom style
        for (let i = 1; i < this.points.length - 1; i++) {
          const mx = (this.points[i].x + this.points[i+1].x) * 0.5;
          const my = (this.points[i].y + this.points[i+1].y) * 0.5;
          ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, mx, my);
        }
        const last = this.points[this.points.length-1];
        ctx.lineTo(last.x, last.y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Synapse ──────────────────────────────────────────────────────────────────
  class Synapse {
    constructor(x1,y1,x2,y2) {
      this.x1=x1; this.y1=y1;
      this.x2=x2; this.y2=y2;
      this.phase = Math.random()*Math.PI*2;
      this.pulseTimer = 0;
    }

    draw() {
      const col = params.synapseColor;
      const rgb = hexToRgb(col);
      const pulse = 0.4 + 0.6*Math.abs(Math.sin(this.phase + frameCount*0.03));

      ctx.save();
      ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${pulse*0.7})`;
      ctx.lineWidth = 0.8;
      ctx.setLineDash([3,5]);
      ctx.shadowColor = col;
      ctx.shadowBlur = params.synapseGlow * pulse;
      ctx.beginPath();
      ctx.moveTo(this.x1,this.y1);
      ctx.lineTo(this.x2,this.y2);
      ctx.stroke();

      // Endpoint dots
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${pulse})`;
      ctx.shadowBlur = params.synapseGlow * 1.5;
      ctx.beginPath();
      ctx.arc(this.x1,this.y1,2.5,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x2,this.y2,2.5,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Pulse ────────────────────────────────────────────────────────────────────
  class Pulse {
    constructor(synapse) {
      this.synapse = synapse;
      this.t = 0;
      this.done = false;
      this.reverse = Math.random() < 0.5;
    }

    update() {
      this.t += params.pulseSpeed * 0.012;
      if (this.t >= 1) this.done = true;
    }

    draw() {
      const s = this.synapse;
      const t = this.reverse ? 1-this.t : this.t;
      const x = lerp(s.x1, s.x2, t);
      const y = lerp(s.y1, s.y2, t);
      const col = params.pulseColor;
      const rgb = hexToRgb(col);
      const brightness = params.pulseBrightness;

      ctx.save();
      // Trail
      for (let i = 0; i < 6; i++) {
        const tt = Math.max(0, t - i*0.04);
        const tx = lerp(s.x1, s.x2, this.reverse ? 1-tt : tt);
        const ty = lerp(s.y1, s.y2, this.reverse ? 1-tt : tt);
        const alpha = (1 - i/6) * 0.6 * brightness;
        ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
        ctx.shadowColor = col;
        ctx.shadowBlur = 10 - i;
        ctx.beginPath();
        ctx.arc(tx, ty, 2.5 - i*0.3, 0, Math.PI*2);
        ctx.fill();
      }
      // Head
      ctx.fillStyle = `rgba(255,255,255,${0.95*brightness})`;
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  function init() {
    branches = [];
    synapses = [];
    pulses = [];
    tips = [];
    synapseSet.clear();
    frameCount = 0;

    const count = Math.round(params.neuronCount);
    const cx = W/2, cy = H/2;
    const spread = 120;

    for (let i = 0; i < count; i++) {
      const angle = (i/count)*Math.PI*2 + randRange(-0.3,0.3);
      const r = randRange(0, spread);
      const x = cx + Math.cos(angle)*r;
      const y = cy + Math.sin(angle)*r;

      // Each seed spawns 3-5 initial branches
      const numArms = Math.floor(randRange(3,6));
      for (let j = 0; j < numArms; j++) {
        const a = (j/numArms)*Math.PI*2 + randRange(-0.2,0.2);
        const b = new Branch(x, y, a, 0);
        branches.push(b);
      }

      // Draw seed node
    }
  }

  function clearAll() {
    branches = [];
    synapses = [];
    pulses = [];
    tips = [];
    synapseSet.clear();
    frameCount = 0;
    ctx.clearRect(0,0,W,H);
  }

  function togglePause() {
    paused = !paused;
    if (!paused) loop();
  }

  // ── Synapse detection ────────────────────────────────────────────────────────
  function checkSynapses() {
    const doneTips = tips;
    for (let i = 0; i < doneTips.length; i++) {
      for (let j = i+1; j < doneTips.length; j++) {
        const a = doneTips[i], b = doneTips[j];
        if (a.branch === b.branch) continue;
        const d = dist(a.x,a.y,b.x,b.y);
        if (d < params.synapseThreshold) {
          const key = `${Math.round(a.x)},${Math.round(a.y)}-${Math.round(b.x)},${Math.round(b.y)}`;
          const keyR = `${Math.round(b.x)},${Math.round(b.y)}-${Math.round(a.x)},${Math.round(a.y)}`;
          if (!synapseSet.has(key) && !synapseSet.has(keyR)) {
            synapseSet.add(key);
            synapses.push(new Synapse(a.x,a.y,b.x,b.y));
          }
        }
      }
    }
  }

  // ── Pulse spawning ───────────────────────────────────────────────────────────
  function spawnPulses() {
    if (synapses.length === 0) return;
    if (Math.random() < params.pulseFrequency) {
      const s = synapses[Math.floor(Math.random()*synapses.length)];
      pulses.push(new Pulse(s));
    }
  }

  // ── Draw background ──────────────────────────────────────────────────────────
  function drawBackground() {
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0,0,W,H);

    // Subtle radial glow center
    const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
    grad.addColorStop(0, 'rgba(16,26,58,0.6)');
    grad.addColorStop(1, 'rgba(5,7,15,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Grid / scanlines
    if (params.showScanlines) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,229,255,0.04)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 8) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Draw vignette ────────────────────────────────────────────────────────────
  function drawVignette() {
    if (!params.showVignette) return;
    const grad = ctx.createRadialGradient(W/2,H/2,W*0.35,W/2,H/2,W*0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  // ── Draw seed nodes ──────────────────────────────────────────────────────────
  function drawSeedNodes() {
    // Draw glowing dots at branch origins
    const origins = new Map();
    for (const b of branches) {
      if (b.depth === 0 && b.points.length > 0) {
        const key = `${Math.round(b.points[0].x)},${Math.round(b.points[0].y)}`;
        origins.set(key, b.points[0]);
      }
    }
    for (const [,pt] of origins) {
      ctx.save();
      ctx.shadowColor = params.branchColor;
      ctx.shadowBlur = 20;
      ctx.fillStyle = params.branchColor;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 35;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Main loop ────────────────────────────────────────────────────────────────
  function loop() {
    if (paused) return;

    drawBackground();

    // Grow branches
    let anyGrowing = false;
    for (const b of branches) {
      if (!b.done) {
        b.grow();
        anyGrowing = true;
      }
    }

    // Draw all branches
    for (const b of branches) {
      b.draw();
    }

    // Check synapses periodically
    if (frameCount % 8 === 0) {
      checkSynapses();
    }

    // Draw synapses
    for (const s of synapses) {
      s.draw();
    }

    // Spawn and update pulses
    spawnPulses();
    pulses = pulses.filter(p => !p.done);
    for (const p of pulses) {
      p.update();
      p.draw();
    }

    drawSeedNodes();
    drawVignette();

    // HUD
    drawHUD(anyGrowing);

    frameCount++;
    animId = requestAnimationFrame(loop);
  }

  // ── HUD ──────────────────────────────────────────────────────────────────────
  function drawHUD(growing) {
    ctx.save();
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,212,0,0.55)';
    ctx.shadowColor = '#ffd400';
    ctx.shadowBlur = 6;
    ctx.fillText(`BRANCHES: ${branches.length}`, 12, 20);
    ctx.fillText(`SYNAPSES: ${synapses.length}`, 12, 36);
    ctx.fillText(`PULSES: ${pulses.length}`, 12, 52);
    ctx.fillText(growing ? 'GROWING...' : 'STABLE', 12, 68);
    if (paused) {
      ctx.fillStyle = 'rgba(255,43,214,0.8)';
      ctx.shadowColor = '#ff2bd6';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('[ PAUSED ]', 12, 88);
    }
    ctx.restore();
  }

  // ── dat.GUI ──────────────────────────────────────────────────────────────────
  function setupGUI() {
    const gui = new dat.GUI({ width: 280 });
    gui.domElement.style.position = 'fixed';
    gui.domElement.style.top = '10px';
    gui.domElement.style.right = '10px';

    // Growth folder
    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 2, 8, 1).name('Neuron Count');
    fGrowth.add(params, 'growthSpeed', 0.5, 6, 0.1).name('Growth Speed');
    fGrowth.add(params, 'maxDepth', 2, 10, 1).name('Max Depth');
    fGrowth.add(params, 'splitChance', 0, 1, 0.01).name('Split Chance');
    fGrowth.add(params, 'curvature', 0, 1, 0.01).name('Curvature');
    fGrowth.add(params, 'maxBranchLength', 30, 250, 5).name('Max Length');
    fGrowth.open();

    // Synapses folder
    const fSyn = gui.addFolder('Synapses');
    fSyn.add(params, 'synapseThreshold', 10, 100, 1).name('Distance Threshold');
    fSyn.add(params, 'synapseGlow', 2, 40, 1).name('Glow Strength');
    fSyn.open();

    // Pulses folder
    const fPulse = gui.addFolder('Pulses');
    fPulse.add(params, 'pulseSpeed', 0.2, 5, 0.1).name('Pulse Speed');
    fPulse.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Pulse Frequency');
    fPulse.add(params, 'pulseBrightness', 0.1, 2, 0.05).name('Pulse Brightness');
    fPulse.open();

    // Visuals folder
    const fVis = gui.addFolder('Visuals');
    fVis.addColor(params, 'bgColor').name('Background');
    fVis.addColor(params, 'branchColor').name('Branch Color');
    fVis.addColor(params, 'accentColor').name('Accent Branch');
    fVis.addColor(params, 'synapseColor').name('Synapse Color');
    fVis.addColor(params, 'pulseColor').name('Pulse Color');
    fVis.add(params, 'showScanlines').name('Scanlines');
    fVis.add(params, 'showVignette').name('Vignette');
    fVis.open();

    // Action buttons
    const actions = {
      'Regenerate': function() { init(); },
      'Clear Canvas': function() { clearAll(); },
      'Pause / Resume': function() { togglePause(); }
    };
    gui.add(actions, 'Regenerate');
    gui.add(actions, 'Clear Canvas');
    gui.add(actions, 'Pause / Resume');
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────
  setupGUI();
  init();
  loop();

})();
</script>
</body>
</html>
