<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .input-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            outline: none;
        }

        .todo-input:focus {
            border-color: #667eea;
        }

        .add-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            padding: 15px 20px;
            gap: 8px;
            border-bottom: 1px solid #eee;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .todo-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .todo-item:hover {
            background: #f9f9f9;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 14px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
            transition: color 0.2s;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #aaa;
        }

        .delete-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #fee;
            color: #e74c3c;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .remaining-count {
            font-size: 14px;
            color: #666;
        }

        .clear-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #fee;
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .clear-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .input-section,
            .filter-section,
            .footer {
                padding: 15px;
            }

            .todo-item {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Todos</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="input-section">
            <div class="input-row">
                <input type="text" class="todo-input" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
                <button class="add-btn" id="addBtn">Add</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="footer">
            <span class="remaining-count" id="remainingCount">0 items left</span>
            <button class="clear-btn" id="clearBtn">Clear Completed</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const STORAGE_KEY = 'todos';
            let todos = [];
            let currentFilter = 'all';

            // DOM Elements
            const todoInput = document.getElementById('todoInput');
            const addBtn = document.getElementById('addBtn');
            const todoList = document.getElementById('todoList');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const remainingCount = document.getElementById('remainingCount');
            const clearBtn = document.getElementById('clearBtn');

            // Initialize
            function init() {
                loadTodos();
                render();
                setupEventListeners();
            }

            // Load todos from localStorage
            function loadTodos() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        todos = JSON.parse(stored);
                    }
                } catch (e) {
                    todos = [];
                }
            }

            // Save todos to localStorage
            function saveTodos() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
                } catch (e) {
                    console.error('Failed to save todos:', e);
                }
            }

            // Add a new todo
            function addTodo(text) {
                const trimmed = text.trim();
                if (!trimmed) return;

                const newTodo = {
                    id: Date.now(),
                    text: trimmed,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                todos.unshift(newTodo);
                saveTodos();
                render();
            }

            // Toggle todo completion
            function toggleTodo(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    saveTodos();
                    render();
                }
            }

            // Delete a todo
            function deleteTodo(id) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                render();
            }

            // Clear all completed todos
            function clearCompleted() {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                render();
            }

            // Get filtered todos
            function getFilteredTodos() {
                switch (currentFilter) {
                    case 'active':
                        return todos.filter(t => !t.completed);
                    case 'completed':
                        return todos.filter(t => t.completed);
                    default:
                        return todos;
                }
            }

            // Render the todo list
            function render() {
                const filteredTodos = getFilteredTodos();
                todoList.innerHTML = '';

                if (filteredTodos.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    
                    let icon = '📝';
                    let message = 'No todos yet. Add one above!';
                    
                    if (currentFilter === 'active') {
                        icon = '✅';
                        message = 'No active todos. Great job!';
                    } else if (currentFilter === 'completed') {
                        icon = '🎉';
                        message = 'No completed todos yet.';
                    }

                    emptyState.innerHTML = `
                        <div class="icon">${icon}</div>
                        <p>${message}</p>
                    `;
                    todoList.appendChild(emptyState);
                } else {
                    filteredTodos.forEach(todo => {
                        const li = document.createElement('li');
                        li.className = 'todo-item' + (todo.completed ? ' completed' : '');
                        li.dataset.id = todo.id;

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'todo-checkbox';
                        checkbox.checked = todo.completed;
                        checkbox.addEventListener('change', () => toggleTodo(todo.id));

                        const span = document.createElement('span');
                        span.className = 'todo-text';
                        span.textContent = todo.text;

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '✕';
                        deleteBtn.title = 'Delete todo';
                        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                        li.appendChild(checkbox);
                        li.appendChild(span);
                        li.appendChild(deleteBtn);
                        todoList.appendChild(li);
                    });
                }

                updateFooter();
            }

            // Update footer (remaining count and clear button state)
            function updateFooter() {
                const activeCount = todos.filter(t => !t.completed).length;
                const completedCount = todos.filter(t => t.completed).length;

                remainingCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
                clearBtn.disabled = completedCount === 0;
            }

            // Set the current filter
            function setFilter(filter) {
                currentFilter = filter;
                filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                render();
            }

            // Setup event listeners
            function setupEventListeners() {
                // Add button click
                addBtn.addEventListener('click', () => {
                    addTodo(todoInput.value);
                    todoInput.value = '';
                    todoInput.focus();
                });

                // Enter key in input
                todoInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        addTodo(todoInput.value);
                        todoInput.value = '';
                        todoInput.focus();
                    }
                });

                // Filter buttons
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        setFilter(btn.dataset.filter);
                    });
                });

                // Clear completed button
                clearBtn.addEventListener('click', clearCompleted);
            }

            // Start the app
            init();
        })();
    </script>
</body>
</html>
