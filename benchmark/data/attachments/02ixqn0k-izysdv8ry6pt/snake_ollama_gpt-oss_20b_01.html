<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#222; color:#fff; font-family:Arial, sans-serif; }
  canvas { background:#000; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID_SIZE = 30;
const CELL_SIZE = 20;
const DIRECTIONS = {
  ArrowUp: {x:0, y:-1},
  ArrowDown: {x:0, y:1},
  ArrowLeft: {x:-1, y:0},
  ArrowRight: {x:1, y:0},
  w: {x:0, y:-1},
  s: {x:0, y:1},
  a: {x:-1, y:0},
  d: {x:1, y:0}
};

class Snake {
  constructor(isCPU, color) {
    this.isCPU = isCPU;
    this.color = color;
    this.reset();
  }
  reset() {
    this.segments = [{x: Math.floor(GRID_SIZE/2), y: Math.floor(GRID_SIZE/2)}];
    this.dir = {x:0, y:0};
    this.pendingDir = {x:0, y:0};
    this.score = 0;
    this.alive = true;
  }
  setDirection(dir) {
    if (this.dir.x + dir.x === 0 && this.dir.y + dir.y === 0) return;
    this.pendingDir = dir;
  }
  update() {
    if (!this.alive) return;
    if (this.pendingDir.x !== 0 || this.pendingDir.y !== 0) {
      this.dir = this.pendingDir;
      this.pendingDir = {x:0, y:0};
    }
    const newHead = {x: this.segments[0].x + this.dir.x, y: this.segments[0].y + this.dir.y};
    this.segments.unshift(newHead);
  }
  grow() {
    // tail stays
  }
  shrink() {
    this.segments.pop();
  }
}

let snakes = [];
let food = null;
let mode = 0; // 0: human vs human, 1: cpu vs human, 2: cpu vs cpu
let gameState = 'menu';
let intervalId = null;

function initGame(selectedMode) {
  mode = selectedMode;
  gameState = 'playing';
  snakes = [];
  snakes.push(new Snake(false, 'lime'));
  snakes.push(new Snake(mode !== 0, 'orange'));
  snakes[0].segments = [{x: Math.floor(GRID_SIZE/4), y: Math.floor(GRID_SIZE/2)}];
  snakes[0].dir = {x:1, y:0};
  snakes[0].pendingDir = {x:1, y:0};
  snakes[1].segments = [{x: Math.floor(3*GRID_SIZE/4), y: Math.floor(GRID_SIZE/2)}];
  snakes[1].dir = {x:-1, y:0};
  snakes[1].pendingDir = {x:-1, y:0};
  snakes[0].score = 0;
  snakes[1].score = 0;
  snakes[0].alive = true;
  snakes[1].alive = true;
  generateFood();
  if (intervalId) clearInterval(intervalId);
  intervalId = setInterval(gameLoop, 200);
}

function generateFood() {
  let valid = false;
  while (!valid) {
    const x = Math.floor(Math.random() * GRID_SIZE);
    const y = Math.floor(Math.random() * GRID_SIZE);
    let occupied = false;
    for (let snake of snakes) {
      for (let seg of snake.segments) {
        if (seg.x === x && seg.y === y) {
          occupied = true;
          break;
        }
      }
      if (occupied) break;
    }
    if (!occupied) {
      food = {x, y};
      valid = true;
    }
  }
}

function getBestDirection(snake, food) {
  const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
  const safeDirs = dirs.filter(d => !(d.x + snake.dir.x === 0 && d.y + snake.dir.y === 0));
  safeDirs.sort((a,b) => {
    const da = Math.abs((snake.segments[0].x + a.x) - food.x) + Math.abs((snake.segments[0].y + a.y) - food.y);
    const db = Math.abs((snake.segments[0].x + b.x) - food.x) + Math.abs((snake.segments[0].y + b.y) - food.y);
    return da - db;
  });
  for (let d of safeDirs) {
    const nx = snake.segments[0].x + d.x;
    const ny = snake.segments[0].y + d.y;
    if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
    let collision = false;
    for (let s of snakes) {
      for (let seg of s.segments) {
        if (seg.x === nx && seg.y === ny) {
          collision = true;
          break;
        }
      }
      if (collision) break;
    }
    if (!collision) return d;
  }
  return snake.dir;
}

function gameLoop() {
  for (let snake of snakes) {
    if (snake.isCPU && snake.alive) {
      const dir = getBestDirection(snake, food);
      snake.setDirection(dir);
    }
  }
  for (let snake of snakes) {
    if (!snake.alive) continue;
    snake.update();
  }
  for (let snake of snakes) {
    if (!snake.alive) continue;
    const head = snake.segments[0];
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      snake.alive = false;
      continue;
    }
    for (let i = 1; i < snake.segments.length; i++) {
      const seg = snake.segments[i];
      if (head.x === seg.x && head.y === seg.y) {
        snake.alive = false;
        break;
      }
    }
    if (!snake.alive) continue;
    for (let other of snakes) {
      if (other === snake) continue;
      for (let seg of other.segments) {
        if (head.x === seg.x && head.y === seg.y) {
          snake.alive = false;
          break;
        }
      }
      if (!snake.alive) break;
    }
  }
  if (!snakes[0].alive || !snakes[1].alive) {
    clearInterval(intervalId);
    intervalId = null;
    gameState = 'gameover';
    render();
    return;
  }
  let foodEaten = false;
  for (let snake of snakes) {
    if (!snake.alive) continue;
    const head = snake.segments[0];
    if (head.x === food.x && head.y === food.y) {
      snake.score++;
      foodEaten = true;
    }
  }
  if (!foodEaten) {
    for (let snake of snakes) {
      if (!snake.alive) continue;
      snake.segments.pop();
    }
  } else {
    generateFood();
  }
  render();
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (gameState === 'menu') {
    ctx.fillStyle = '#fff';
    ctx.font = '36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Snake Game', canvas.width/2, canvas.height/2 - 60);
    ctx.font = '24px Arial';
    ctx.fillText('Select Mode:', canvas.width/2, canvas.height/2 - 20);
    ctx.fillText('1: Human vs Human', canvas.width/2, canvas.height/2 + 10);
    ctx.fillText('2: CPU vs Human', canvas.width/2, canvas.height/2 + 40);
    ctx.fillText('3: CPU vs CPU', canvas.width/2, canvas.height/2 + 70);
    ctx.fillText('Press 1, 2, or 3 to start', canvas.width/2, canvas.height/2 + 110);
  } else if (gameState === 'playing') {
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    for (let snake of snakes) {
      ctx.fillStyle = snake.color;
      for (let seg of snake.segments) {
        ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Snake 1: ${snakes[0].score}`, 10, 20);
    ctx.fillText(`Snake 2: ${snakes[1].score}`, 10, 40);
  } else if (gameState === 'gameover') {
    ctx.fillStyle = '#fff';
    ctx.font = '36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 40);
    ctx.font = '24px Arial';
    ctx.fillText(`Snake 1 Score: ${snakes[0].score}`, canvas.width/2, canvas.height/2);
    ctx.fillText(`Snake 2 Score: ${snakes[1].score}`, canvas.width/2, canvas.height/2 + 30);
    ctx.fillText('Press any key to restart', canvas.width/2, canvas.height/2 + 70);
  }
}

document.addEventListener('keydown', function(e) {
  if (gameState === 'menu') {
    if (e.key === '1') { initGame(0); }
    else if (e.key === '2') { initGame(1); }
    else if (e.key === '3') { initGame(2); }
  } else if (gameState === 'playing') {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      const dir = DIRECTIONS[e.key];
      snakes[0].setDirection(dir);
    }
    if (mode === 0 && ['w','a','s','d'].includes(e.key)) {
      const dir = DIRECTIONS[e.key];
      snakes[1].setDirection(dir);
    }
  } else if (gameState === 'gameover') {
    initGame(mode);
  }
});

render();
</script>
</body>
</html>
