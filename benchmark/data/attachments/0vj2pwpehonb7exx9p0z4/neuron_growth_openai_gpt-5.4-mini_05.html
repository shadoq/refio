<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Growth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    canvas {
      width: 800px;
      height: 800px;
      display: block;
      box-shadow: 0 0 60px rgba(16, 26, 58, 0.7);
      background: #05070f;
    }
  </style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
/* setup */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const P = {
  bg: '#05070f',
  glow: '#101a3a',
  main: '#00e5ff',
  accent: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  ui: '#ffd400'
};

const params = {
  neuronCount: 5,
  branchGrowthSpeed: 1.2,
  maxBranchDepth: 5,
  branchSplitChance: 0.18,
  branchCurvature: 0.35,
  maxBranchLength: 120,
  synapseDistanceThreshold: 26,
  synapseGlowStrength: 1.0,
  pulseSpeed: 0.008,
  pulseFrequency: 0.22,
  pulseBrightness: 1.2,
  backgroundColor: P.bg,
  branchColor: P.main,
  accentBranchColor: P.accent,
  synapseColor: P.synapse,
  pulseColor: P.pulse,
  regenerateNetwork: () => regenerate(),
  clearCanvas: () => clearCanvas(),
  pauseResumeAnimation: () => togglePause()
};

let paused = false;
let neurons = [];
let synapses = [];
let pulses = [];
let noiseDots = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function rint(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function mixPoint(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }

function makeNeuron(x, y, depth = 0) {
  const ang = Math.random() * Math.PI * 2;
  return {
    x, y, depth,
    baseAngle: ang,
    branches: [],
    tips: [],
    active: true
  };
}

function makeBranch(neuron, start, angle, depth) {
  const len = rand(params.maxBranchLength * 0.35, params.maxBranchLength);
  const thickness = rand(0.9, 2.3) * (1.2 - depth * 0.15);
  return {
    neuron,
    start,
    current: { x: start.x, y: start.y },
    targetAngle: angle,
    angle,
    depth,
    len,
    progress: 0,
    speed: rand(0.35, 0.8) * params.branchGrowthSpeed,
    thickness,
    points: [ { x: start.x, y: start.y } ],
    children: [],
    done: false,
    tip: null
  };
}

function regenerate() {
  neurons = [];
  synapses = [];
  pulses = [];
  noiseDots = [];
  const count = rint(3, 6);
  const cx = 400, cy = 400;
  for (let i = 0; i < count; i++) {
    const n = makeNeuron(cx + rand(-55, 55), cy + rand(-55, 55), 0);
    neurons.push(n);
    const branchCount = rint(2, 4);
    for (let j = 0; j < branchCount; j++) {
      const a = n.baseAngle + (j / branchCount) * Math.PI * 2 + rand(-0.6, 0.6);
      n.branches.push(makeBranch(n, { x: n.x, y: n.y }, a, 0));
    }
  }
  for (let i = 0; i < 120; i++) noiseDots.push({ x: Math.random() * 800, y: Math.random() * 800, a: Math.random() * 0.08 });
}

function clearCanvas() {
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, 800, 800);
}

function togglePause() {
  paused = !paused;
}

function setupGUI() {
  const gui = new dat.GUI({ width: 300 });
  const growth = gui.addFolder('Growth');
  growth.add(params, 'neuronCount', 3, 6, 1);
  growth.add(params, 'branchGrowthSpeed', 0.2, 3, 0.01);
  growth.add(params, 'maxBranchDepth', 1, 8, 1);
  growth.add(params, 'branchSplitChance', 0, 0.6, 0.01);
  growth.add(params, 'branchCurvature', 0, 1, 0.01);
  growth.add(params, 'maxBranchLength', 40, 220, 1);
  growth.add(params, 'regenerateNetwork');
  growth.add(params, 'clearCanvas');
  growth.add(params, 'pauseResumeAnimation');

  const syn = gui.addFolder('Synapses');
  syn.add(params, 'synapseDistanceThreshold', 10, 60, 1);
  syn.add(params, 'synapseGlowStrength', 0, 3, 0.01);

  const pulse = gui.addFolder('Pulses');
  pulse.add(params, 'pulseSpeed', 0.001, 0.03, 0.001);
  pulse.add(params, 'pulseFrequency', 0.02, 1, 0.01);
  pulse.add(params, 'pulseBrightness', 0.2, 3, 0.01);

  const vis = gui.addFolder('Visuals');
  vis.addColor(params, 'backgroundColor');
  vis.addColor(params, 'branchColor');
  vis.addColor(params, 'accentBranchColor');
  vis.addColor(params, 'synapseColor');
  vis.addColor(params, 'pulseColor');
  growth.open();
}

function branchStep(branch) {
  if (branch.done) return;
  branch.progress += 0.01 * branch.speed;
  const t = clamp(branch.progress, 0, 1);
  const wob = Math.sin(t * Math.PI * 2 + branch.depth) * params.branchCurvature * 20;
  const dx = Math.cos(branch.angle) * branch.len * t + Math.cos(branch.angle + Math.PI / 2) * wob * t;
  const dy = Math.sin(branch.angle) * branch.len * t + Math.sin(branch.angle + Math.PI / 2) * wob * t;
  branch.current = { x: branch.start.x + dx, y: branch.start.y + dy };
  branch.points.push({ x: branch.current.x, y: branch.current.y });
  if (branch.progress >= 1) {
    branch.done = true;
    branch.tip = { x: branch.current.x, y: branch.current.y, branch };
    if (branch.depth < params.maxBranchDepth && Math.random() < params.branchSplitChance) {
      const n = branch.neuron;
      const childCount = Math.random() < 0.5 ? 1 : 2;
      for (let i = 0; i < childCount; i++) {
        const da = rand(-0.9, 0.9);
        n.branches.push(makeBranch(n, { x: branch.current.x, y: branch.current.y }, branch.angle + da, branch.depth + 1));
      }
    }
  }
}

function updateGrowth() {
  for (const n of neurons) {
    for (const b of n.branches) {
      if (!b.done) branchStep(b);
    }
    n.tips = n.branches.filter(b => b.tip).map(b => b.tip);
  }
}

function addSynapse(a, b) {
  const key = a.branch.neuron.x < b.branch.neuron.x ? `${a.x},${a.y}|${b.x},${b.y}` : `${b.x},${b.y}|${a.x},${a.y}`;
  if (synapses.some(s => s.key === key)) return;
  synapses.push({ a, b, key, phase: Math.random() });
}

function updateSynapses() {
  const tips = neurons.flatMap(n => n.tips);
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      if (a.branch.neuron === b.branch.neuron) continue;
      if (dist(a, b) <= params.synapseDistanceThreshold) addSynapse(a, b);
    }
  }
}

function updatePulses() {
  if (Math.random() < params.pulseFrequency * 0.05 && synapses.length) {
    const s = synapses[rint(0, synapses.length - 1)];
    pulses.push({ s, t: 0, dir: Math.random() < 0.5 ? 1 : -1 });
  }
  for (const p of pulses) p.t += params.pulseSpeed;
  pulses = pulses.filter(p => p.t <= 1);
}

function drawGlowLine(a, b, color, w, alpha, blur) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = w;
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}

function drawBranch(branch) {
  const pts = branch.points;
  if (pts.length < 2) return;
  const color = branch.depth % 2 === 0 ? params.branchColor : params.accentBranchColor;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = branch.thickness;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const m = mixPoint(pts[i], pts[i + 1], 0.5);
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
  ctx.restore();
}

function drawSynapses() {
  for (const s of synapses) {
    const t = 0.5 + 0.5 * Math.sin((performance.now() * 0.004) + s.phase);
    const a = s.a, b = s.b;
    drawGlowLine(a, b, params.synapseColor, 1 + t * 1.2, 0.25 * params.synapseGlowStrength, 18 * params.synapseGlowStrength);
  }
}

function drawPulses() {
  for (const p of pulses) {
    const s = p.s;
    const t = p.dir > 0 ? p.t : 1 - p.t;
    const pt = mixPoint(s.a, s.b, clamp(t, 0, 1));
    const size = 4 + 6 * Math.sin(Math.PI * clamp(t, 0, 1));
    ctx.save();
    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 22;
    ctx.globalAlpha = params.pulseBrightness;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBackground() {
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, 800, 800);
  const g = ctx.createRadialGradient(400, 400, 30, 400, 400, 420);
  g.addColorStop(0, 'rgba(16,26,58,0.35)');
  g.addColorStop(1, 'rgba(5,7,15,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 800, 800);
  ctx.fillStyle = 'rgba(0,229,255,0.05)';
  for (let y = 0; y < 800; y += 4) ctx.fillRect(0, y, 800, 1);
  ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
  for (const n of noiseDots) ctx.fillRect(n.x, n.y, 1, 1);
}

function render() {
  drawBackground();
  for (const n of neurons) for (const b of n.branches) drawBranch(b);
  drawSynapses();
  drawPulses();
}

function animate() {
  if (!paused) {
    updateGrowth();
    updateSynapses();
    updatePulses();
  }
  render();
  requestAnimationFrame(animate);
}

setupGUI();
regenerate();
clearCanvas();
animate();
</script>
</body>
</html>
