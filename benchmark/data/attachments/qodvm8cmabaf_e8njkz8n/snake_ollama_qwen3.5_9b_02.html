<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .score {
            color: #fff;
            font-size: 1.2em;
        }
        .score span {
            color: #4CAF50;
            font-weight: bold;
            font-size: 1.5em;
        }
        .game-canvas {
            border: 3px solid #4CAF50;
            border-radius: 10px;
            background: #0f0f23;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .menu-content {
            text-align: center;
            color: #fff;
        }
        .menu-content h1 {
            font-size: 4em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #4CAF50;
        }
        .menu-content h2 {
            font-size: 2em;
            margin-bottom: 30px;
            color: #95a5a6;
        }
        .menu-content p {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-mode {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }
        .instructions {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            color: #ecf0f1;
        }
        .instructions h3 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .instructions ul {
            list-style: none;
        }
        .instructions li {
            margin: 8px 0;
            font-size: 1em;
        }
        .instructions kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #555;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score-board">
            <div class="score">Player 1 Score: <span id="score1">0</span></div>
            <div class="score">Player 2 Score: <span id="score2">0</span></div>
        </div>
        <canvas id="gameCanvas" class="game-canvas" width="600" height="600"></canvas>
        <div class="instructions">
            <h3>Controls:</h3>
            <ul>
                <li><kbd>Arrow Keys</kbd> or <kbd>WASD</kbd> - Move Player 1</li>
                <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> - Move Player 2</li>
                <li><kbd>Enter</kbd> - Start/Restart Game</li>
                <li><kbd>Esc</kbd> - Pause Game</li>
            </ul>
        </div>
    </div>

    <div id="startMenu" class="menu-overlay">
        <div class="menu-content">
            <h1>🐍 Snake Game</h1>
            <h2>Choose Game Mode</h2>
            <p>Select how you want to play:</p>
            <button class="btn btn-mode" data-mode="human-human">👤 vs 👤</button>
            <button class="btn btn-mode" data-mode="human-cpu">👤 vs 🤖</button>
            <button class="btn btn-mode" data-mode="cpu-cpu">🤖 vs 🤖</button>
        </div>
    </div>

    <div id="gameOverMenu" class="menu-overlay hidden">
        <div class="menu-content">
            <h1>Game Over!</h1>
            <p id="winnerText"></p>
            <p>Final Scores:</p>
            <p>Player 1: <span id="finalScore1" style="color:#4CAF50;font-size:1.5em;"></span></p>
            <p>Player 2: <span id="finalScore2" style="color:#4CAF50;font-size:1.5em;"></span></p>
            <button class="btn" data-action="restart">Play Again</button>
            <button class="btn btn-mode" data-action="menu">Main Menu</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const GAME_SPEED = 100; // ms per frame

        // Game State
        let gameLoop = null;
        let currentMode = 'human-human';
        let scores = { player1: 0, player2: 0 };
        let paused = false;

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Snake Class
        class Snake {
            constructor(x, y, controls, color) {
                this.x = x;
                this.y = y;
                this.direction = { x: 1, y: 0 }; // Moving right by default
                this.nextDirection = { x: 1, y: 0 };
                this.controls = controls;
                this.color = color;
                this.alive = true;
                this.score = 0;
            }

            move() {
                if (!this.alive) return;

                this.direction = this.nextDirection;
                this.x += this.direction.x;
                this.y += this.direction.y;

                // Wall collision
                if (this.x < 0 || this.x >= GRID_SIZE || this.y < 0 || this.y >= GRID_SIZE) {
                    this.alive = false;
                    return;
                }

                // Self collision
                for (let segment of this.segments) {
                    if (this.x === segment.x && this.y === segment.y && this.nextDirection.x !== 0 || this.nextDirection.y !== 0) {
                        this.alive = false;
                        return;
                    }
                }
            }

            grow() {
                // Add segment at the head position
                this.segments.push({ x: this.x, y: this.y });
                this.score += 10;
            }

            getSegments() {
                const segments = [];
                for (let i = 0; i < this.score / 10; i++) {
                    segments.push({ x: this.x - this.direction.x * i, y: this.y - this.direction.y * i });
                }
                return segments;
            }

            setNextDirection(x, y) {
                // Prevent 180 degree turns
                if (this.nextDirection.x !== 0 && x !== -this.nextDirection.x) {
                    this.nextDirection = { x, y };
                } else if (this.nextDirection.y !== 0 && y !== -this.nextDirection.y) {
                    this.nextDirection = { x, y };
                }
            }
        }

        // Food Class
        class Food {
            constructor() {
                this.x = Math.floor(Math.random() * GRID_SIZE);
                this.y = Math.floor(Math.random() * GRID_SIZE);
                this.color = '#ff6b6b';
            }

            respawn(snake1, snake2) {
                // Ensure food doesn't spawn on snakes
                let valid = false;
                while (!valid) {
                    this.x = Math.floor(Math.random() * GRID_SIZE);
                    this.y = Math.floor(Math.random() * GRID_SIZE);

                    // Check against both snakes
                    const snake1Segments = snake1.getSegments();
                    const snake2Segments = snake2.getSegments();

                    valid = !snake1Segments.some(s => s.x === this.x && s.y === this.y) &&
                             !snake2Segments.some(s => s.x === this.x && s.y === this.y);
                }
            }
        }

        // CPU AI
        class CPU {
            constructor(snake) {
                this.snake = snake;
                this.moveTimer = 0;
            }

            decideDirection() {
                if (!this.snake.alive) return;

                const possibleMoves = [
                    { x: 0, y: -1 }, // Up
                    { x: 0, y: 1 },  // Down
                    { x: -1, y: 0 }, // Left
                    { x: 1, y: 0 }   // Right
                ];

                // Filter out moves that would cause immediate death
                const validMoves = possibleMoves.filter(move => {
                    const newX = this.snake.x + move.x;
                    const newY = this.snake.y + move.y;

                    // Check walls
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        return false;
                    }

                    // Check collision with own body
                    const segments = this.snake.getSegments();
                    return !segments.some(s => s.x === newX && s.y === newY);
                });

                if (validMoves.length === 0) return;

                // Find food position
                const food = food;

                // Calculate distances
                let bestMove = validMoves[0];
                let bestScore = -Infinity;

                for (const move of validMoves) {
                    const newX = this.snake.x + move.x;
                    const newY = this.snake.y + move.y;

                    // Calculate distance to food (Manhattan distance)
                    const distToFood = Math.abs(newX - food.x) + Math.abs(newY - food.y);

                    // Calculate distance to opponent's body (avoid)
                    const opponentSegments = opponent.getSegments();
                    const distToOpponent = opponentSegments.length > 0 
                        ? Math.min(...opponentSegments.map(s => 
                            Math.abs(newX - s.x) + Math.abs(newY - s.y)
                        )) 
                        : Infinity;

                    // Score: prefer closer to food, but avoid opponent
                    const score = distToFood - distToOpponent / 2;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }
                }

                this.snake.setNextDirection(bestMove.x, bestMove.y);
            }
        }

        // Initialize Game
        let snake1 = new Snake(5, 5, { key: 'ArrowUp', alt: 'w', altDown: 'ArrowDown', altUp: 'w', altLeft: 'a', altRight: 'd' }, '#4CAF50');
        let snake2 = new Snake(20, 5, { key: 'ArrowDown', alt: 's', altDown: 'ArrowUp', altUp: 's', altLeft: 'd', altRight: 'a' }, '#2196F3');
        let food = new Food();
        let cpu1 = null;
        let cpu2 = null;
        let opponent = snake2;

        function initGame(mode) {
            currentMode = mode;
            scores = { player1: 0, player2: 0 };
            document.getElementById('score1').textContent = scores.player1;
            document.getElementById('score2').textContent = scores.player2;

            // Reset snakes
            snake1 = new Snake(5, 5, { key: 'ArrowUp', alt: 'w', altDown: 'ArrowDown', altUp: 'w', altLeft: 'a', altRight: 'd' }, '#4CAF50');
            snake2 = new Snake(20, 5, { key: 'ArrowDown', alt: 's', altDown: 'ArrowUp', altUp: 's', altLeft: 'd', altRight: 'a' }, '#2196F3');

            // Setup CPU
            if (mode === 'human-cpu' || mode === 'cpu-cpu') {
                cpu1 = new CPU(snake1);
            }
            if (mode === 'cpu-human' || mode === 'cpu-cpu') {
                cpu2 = new CPU(snake2);
            }

            // Set opponent
            if (mode === 'human-cpu') {
                opponent = snake2;
            } else if (mode === 'cpu-human') {
                opponent = snake1;
            }

            food.respawn(snake1, snake2);
            draw();
        }

        // Draw Function
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = food.color;
            ctx.beginPath();
            const foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
            const foodY = food.y * CELL_SIZE + CELL_SIZE / 2;
            ctx.arc(foodX, foodY, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw snakes
            drawSnake(snake1);
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            const segments = snake.getSegments();
            for (let i = 0; i < segments.length; i++) {
                const segment = segments[i];
                const x = segment.x * CELL_SIZE + 1;
                const y = segment.y * CELL_SIZE + 1;
                const size = CELL_SIZE - 2;

                // Gradient color for snake body
                const hue = i === 0 ? 95 : 90; // Green for snake1
                const color = `hsl(${hue}, 100%, ${50 - i * 2}%)`;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 4);
                ctx.fill();

                // Draw eyes on head
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 4;
                    const eyeOffset = 5;
                    
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.arc(x + CELL_SIZE - eyeOffset - eyeSize, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset + snake.direction.x, y + eyeOffset + snake.direction.y, 2, 0, Math.PI * 2);
                    ctx.arc(x + CELL_SIZE - eyeOffset - eyeSize + snake.direction.x, y + eyeOffset + snake.direction.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Update Function
        function update() {
            if (paused) return;

            // CPU decision making
            if (cpu1) {
                cpu1.moveTimer++;
                if (cpu1.moveTimer >= 10) {
                    cpu1.moveTimer = 0;
                    cpu1.decideDirection();
                }
            }
            if (cpu2) {
                cpu2.moveTimer++;
                if (cpu2.moveTimer >= 10) {
                    cpu2.moveTimer = 0;
                    cpu2.decideDirection();
                }
            }

            // Move snakes
            snake1.move();
            snake2.move();

            // Check collisions with food
            if (snake1.x === food.x && snake1.y === food.y) {
                snake1.grow();
                food.respawn(snake1, snake2);
                scores.player1 = snake1.score;
                document.getElementById('score1').textContent = scores.player1;
            }
            if (snake2.x === food.x && snake2.y === food.y) {
                snake2.grow();
                food.respawn(snake1, snake2);
                scores.player2 = snake2.score;
                document.getElementById('score2').textContent = scores.player2;
            }

            // Check game over conditions
            if (!snake1.alive || !snake2.alive) {
                endGame();
                return;
            }

            draw();
        }

        // Game Loop
        function gameLoopCallback() {
            update();
        }

        function startGameLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameLoopCallback, GAME_SPEED);
        }

        // End Game
        function endGame() {
            clearInterval(gameLoop);
            
            let winnerText = '';
            if (!snake1.alive && !snake2.alive) {
                winnerText = "It's a Draw!";
            } else if (!snake1.alive) {
                winnerText = "Player 2 Wins! 🏆";
            } else {
                winnerText = "Player 1 Wins! 🏆";
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('finalScore1').textContent = scores.player1;
            document.getElementById('finalScore2').textContent = scores.player2;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        // Input Handling
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('startMenu').classList.contains('hidden')) {
                // Only handle movement keys when game is active
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.key)) {
                    if (currentMode === 'human-human' || currentMode === 'human-cpu') {
                        snake1.setNextDirection(0, -1); // Up
                    } else if (currentMode === 'human-human' || currentMode === 'cpu-human') {
                        snake2.setNextDirection(0, 1); // Down
                    }
                }
            }
        });

        // Menu Button Handlers
        document.querySelectorAll('.btn-mode').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                document.getElementById('startMenu').classList.add('hidden');
                document.getElementById('gameOverMenu').classList.add('hidden');
                initGame(mode);
                startGameLoop();
            });
        });

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'restart') {
                    document.getElementById('gameOverMenu').classList.add('hidden');
                    initGame(currentMode);
                    startGameLoop();
                } else if (action === 'menu') {
                    document.getElementById('gameOverMenu').classList.add('hidden');
                    document.getElementById('startMenu').classList.remove('hidden');
                }
            });
        });

        // Keyboard controls for movement
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('startMenu').classList.contains('hidden')) {
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                        if (currentMode === 'human-human' || currentMode === 'human-cpu') {
                            snake1.setNextDirection(0, -1);
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                        if (currentMode === 'human-human' || currentMode === 'human-cpu') {
                            snake1.setNextDirection(0, 1);
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                    case 'a':
                        if (currentMode === 'human-human' || currentMode === 'human-cpu') {
                            snake1.setNextDirection(-1, 0);
                        }
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                        if (currentMode === 'human-human' || currentMode === 'human-cpu') {
                            snake1.setNextDirection(1, 0);
                        }
                        e.preventDefault();
                        break;
                    case 'W':
                        if (currentMode === 'human-human' || currentMode === 'cpu-human') {
                            snake2.setNextDirection(0, -1);
                        }
                        e.preventDefault();
                        break;
                    case 'S':
                        if (currentMode === 'human-human' || currentMode === 'cpu-human') {
                            snake2.setNextDirection(0, 1);
                        }
                        e.preventDefault();
                        break;
                    case 'A':
                        if (currentMode === 'human-human' || currentMode === 'cpu-human') {
                            snake2.setNextDirection(-1, 0);
                        }
                        e.preventDefault();
                        break;
                    case 'D':
                        if (currentMode === 'human-human' || currentMode === 'cpu-human') {
                            snake2.setNextDirection(1, 0);
                        }
                        e.preventDefault();
                        break;
                }
            }
        });

        // Pause/Resume with Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('startMenu').classList.contains('hidden')) {
                paused = !paused;
                if (!paused) {
                    startGameLoop();
                }
            }
        });

        // Initial draw
        initGame('human-human');
        draw();

    </script>
</body>
</html>
