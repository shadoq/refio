<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Multi-Player Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .title {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #00ff88;
        }

        .game-info {
            display: flex;
            gap: 40px;
            font-size: 1.2em;
        }

        .info-box {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .info-box span {
            color: #00ff88;
            font-weight: bold;
        }

        .game-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(30, 1fr);
            grid-template-rows: repeat(30, 1fr);
            gap: 1px;
            background: rgba(0,0,0,0.3);
            border: 3px solid #00ff88;
            border-radius: 10px;
            overflow: hidden;
        }

        .cell {
            width: 15px;
            height: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            transition: all 0.1s ease;
        }

        .snake {
            background: #00ff88;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .snake.head {
            background: #00cc6a;
            border-radius: 5px;
        }

        .food {
            background: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,68,68,0.5);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .cpu {
            background: #ff6600;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,102,0,0.5);
        }

        .cpu.head {
            background: #cc5200;
            border-radius: 5px;
        }

        .menu-overlay, .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay-content {
            text-align: center;
        }

        .overlay-title {
            font-size: 3em;
            margin-bottom: 30px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }

        .overlay-subtitle {
            font-size: 1.5em;
            margin-bottom: 40px;
            color: #aaa;
        }

        .menu-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,255,136,0.3);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,255,136,0.5);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .controls-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        .controls-info h3 {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .controls-info p {
            margin: 5px 0;
        }

        .key {
            display: inline-block;
            padding: 5px 10px;
            background: #333;
            border-radius: 5px;
            font-family: monospace;
            border: 1px solid #555;
        }

        .hidden {
            display: none !important;
        }

        .player-label {
            position: absolute;
            font-size: 10px;
            color: #00ff88;
            text-shadow: 0 0 5px rgba(0,255,136,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🐍 Snake Battle</h1>
        
        <div class="game-info">
            <div class="info-box">Player 1 Score: <span id="score1">0</span></div>
            <div class="info-box">Player 2 Score: <span id="score2">0</span></div>
        </div>

        <div class="game-area">
            <div id="board1" class="game-board"></div>
            <div id="board2" class="game-board"></div>
        </div>

        <div class="controls-info">
            <h3>Controls:</h3>
            <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> - Player 1</p>
            <p><span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span> - Player 2</p>
            <p><span class="key">1</span> - Switch to Player 1 controls</p>
            <p><span class="key">2</span> - Switch to Player 2 controls</p>
        </div>
    </div>

    <div id="menuOverlay" class="menu-overlay">
        <div class="overlay-content">
            <h2 class="overlay-title">Snake Battle</h2>
            <p class="overlay-subtitle">Choose Game Mode</p>
            <div class="menu-options">
                <button class="menu-btn" onclick="startGame('pvc')">CPU vs CPU</button>
                <button class="menu-btn" onclick="startGame('hvc')">Human vs CPU</button>
                <button class="menu-btn" onclick="startGame('hvh')">Human vs Human</button>
            </div>
            <p style="margin-top: 30px; color: #666;">Press <span class="key">Enter</span> to start</p>
        </div>
    </div>

    <div id="gameOverOverlay" class="menu-overlay hidden">
        <div class="overlay-content">
            <h2 class="overlay-title" id="gameOverTitle">Game Over!</h2>
            <p class="overlay-subtitle" id="gameOverMessage">Final Scores</p>
            <div class="menu-options">
                <button class="menu-btn" onclick="restartGame()">Play Again</button>
                <button class="menu-btn" onclick="showMenu()">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const GRID_SIZE = 30;
        const CELL_SIZE = 15;
        const GAME_SPEED = 100; // ms per tick
        const SNAKE_LENGTH = 5; // Initial length

        // Game State
        let gameMode = 'pvc'; // pvc, hvc, hvh
        let gameActive = false;
        let gameLoop = null;
        let lastTick = 0;

        // Player 1 (Human - WASD)
        let p1 = {
            body: [],
            direction: 'right',
            nextDirection: 'right',
            score: 0,
            controlled: true,
            label: 'P1'
        };

        // Player 2 (Human - Arrow keys)
        let p2 = {
            body: [],
            direction: 'up',
            nextDirection: 'up',
            score: 0,
            controlled: false,
            label: 'P2'
        };

        // Food position
        let food = { x: 0, y: 0 };

        // CPU AI
        let cpu1 = null;
        let cpu2 = null;

        // Initialize boards
        function initBoards() {
            const board1 = document.getElementById('board1');
            const board2 = document.getElementById('board2');
            
            board1.style.gridTemplateColumns = `repeat(${GRID_SIZE}, ${CELL_SIZE}px)`;
            board1.style.gridTemplateRows = `repeat(${GRID_SIZE}, ${CELL_SIZE}px)`;
            board1.innerHTML = '';
            
            board2.style.gridTemplateColumns = `repeat(${GRID_SIZE}, ${CELL_SIZE}px)`;
            board2.style.gridTemplateRows = `repeat(${GRID_SIZE}, ${CELL_SIZE}px)`;
            board2.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `p1-${x}-${y}`;
                    board1.appendChild(cell);
                    
                    const cell2 = document.createElement('div');
                    cell2.className = 'cell';
                    cell2.id = `p2-${x}-${y}`;
                    board2.appendChild(cell2);
                }
            }
        }

        // Spawn food at random position not occupied by snakes
        function spawnFood() {
            let validPosition = false;
            let x, y;
            
            while (!validPosition) {
                x = Math.floor(Math.random() * GRID_SIZE);
                y = Math.floor(Math.random() * GRID_SIZE);
                
                validPosition = true;
                
                // Check if position is occupied by any snake
                if (p1.body.some(segment => segment.x === x && segment.y === y)) {
                    validPosition = false;
                }
                if (p2.body.some(segment => segment.x === x && segment.y === y)) {
                    validPosition = false;
                }
            }
            
            food = { x, y };
            
            document.getElementById(`p1-${x}-${y}`).classList.add('food');
            document.getElementById(`p2-${x}-${y}`).classList.add('food');
        }

        // Initialize snake
        function initSnake(player) {
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            
            for (let i = 0; i < SNAKE_LENGTH; i++) {
                const x = startX - i;
                const y = startY;
                const segment = { x, y };
                player.body.push(segment);
                
                const cell = document.getElementById(`p1-${x}-${y}`);
                cell.className = 'cell snake';
                if (i === 0) cell.classList.add('head');
            }
        }

        // Initialize CPU AI
        function initCPU(player, isP1) {
            player.cpu = true;
            player.body = [];
            player.score = 0;
            
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2) + (isP1 ? 10 : -10);
            
            for (let i = 0; i < SNAKE_LENGTH; i++) {
                const x = startX + i;
                const y = startY;
                const segment = { x, y };
                player.body.push(segment);
                
                const cell = document.getElementById(`p1-${x}-${y}`);
                cell.className = 'cell cpu';
                if (i === 0) cell.classList.add('head');
            }
        }

        // Get CPU target (food or better position)
        function getCPUTarget(player) {
            // Find closest food
            let closestFood = null;
            let minDistance = Infinity;
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (x === food.x && y === food.y) {
                        const dist = Math.sqrt((x - player.head.x) ** 2 + (y - player.head.y) ** 2);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestFood = { x, y };
                        }
                    }
                }
            }
            
            return closestFood || player.head;
        }

        // CPU AI: Decide next move
        function cpuMove(player, target) {
            const head = player.head;
            const x = head.x;
            const y = head.y;
            
            // Available moves
            const moves = [
                { dx: 0, dy: -1, name: 'up' },
                { dx: 0, dy: 1, name: 'down' },
                { dx: -1, dy: 0, name: 'left' },
                { dx: 1, dy: 0, name: 'right' }
            ];
            
            // Filter out reverse direction
            const reverseMove = {
                dx: -player.direction.dx,
                dy: -player.direction.dy
            };
            
            const validMoves = moves.filter(move => {
                if (move.dx === -reverseMove.dx && move.dy === -reverseMove.dy) {
                    return false;
                }
                
                // Check if move is safe (not into body)
                const newHead = { x: x + move.dx, y: y + move.dy };
                const safe = !player.body.some(segment => 
                    segment.x === newHead.x && segment.y === newHead.y
                );
                
                return safe;
            });
            
            if (validMoves.length === 0) {
                // No safe moves, try to avoid immediate death
                return player.direction;
            }
            
            // Score moves by distance to target
            validMoves.sort((a, b) => {
                const targetPos = { x: target.x, y: target.y };
                const distA = Math.sqrt((x + a.dx - targetPos.x) ** 2 + (y + a.dy - targetPos.y) ** 2);
                const distB = Math.sqrt((x + b.dx - targetPos.x) ** 2 + (y + b.dy - targetPos.y) ** 2);
                return distA - distB;
            });
            
            // Choose best move
            return validMoves[0];
        }

        // Update snake position
        function updateSnake(player) {
            const head = { ...player.head };
            
            // Calculate new head position
            switch (player.direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return false; // Game over
            }
            
            // Check self collision (not for the tail which will move)
            const bodyWithoutTail = player.body.slice(0, -1);
            if (bodyWithoutTail.some(segment => segment.x === head.x && segment.y === head.y)) {
                return false; // Game over
            }
            
            // Move snake
            player.body.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                player.score++;
                document.getElementById(`score${player.label === 'P1' ? '1' : '2'}`).textContent = player.score;
                
                // Grow snake (don't remove tail)
                const cell = document.getElementById(`p1-${head.x}-${head.y}`);
                cell.className = 'cell snake head';
                
                spawnFood();
            } else {
                // Remove tail
                const tail = player.body.pop();
                const tailCell = document.getElementById(`p1-${tail.x}-${tail.y}`);
                tailCell.className = 'cell';
            }
            
            // Update head visual
            const headCell = document.getElementById(`p1-${head.x}-${head.y}`);
            headCell.className = 'cell snake head';
            
            // Update body visuals
            player.body.forEach((segment, index) => {
                const cell = document.getElementById(`p1-${segment.x}-${segment.y}`);
                cell.className = index === 0 ? 'cell snake head' : 'cell snake';
            });
            
            player.head = head;
            return true; // Still alive
        }

        // Update CPU snake
        function updateCPU(player) {
            const target = getCPUTarget(player);
            const move = cpuMove(player, target);
            
            if (!move) return false;
            
            player.direction = move.name;
            return updateSnake(player);
        }

        // Check collision with other snake
        function checkOtherSnakeCollision(player, other) {
            const head = player.body[0];
            return other.body.some(segment => 
                segment.x === head.x && segment.y === head.y
            );
        }

        // Update both snakes
        function updateGame() {
            let p1Alive, p2Alive;
            
            // Update P1
            if (gameMode === 'pvc' && !p1.controlled) {
                p1Alive = updateCPU(p1);
            } else if (gameMode === 'hvc' && !p2.controlled) {
                p2Alive = updateCPU(p2);
            } else {
                p1Alive = updateSnake(p1);
            }
            
            // Update P2
            if (gameMode === 'hvh') {
                p2Alive = updateSnake(p2);
            } else {
                p2Alive = updateCPU(p2);
            }
            
            // Check collisions
            if (p1Alive && p2Alive) {
                if (checkOtherSnakeCollision(p1, p2)) {
                    p2Alive = false;
                }
                if (checkOtherSnakeCollision(p2, p1)) {
                    p1Alive = false;
                }
            }
            
            // Game over conditions
            if (!p1Alive || !p2Alive) {
                endGame();
                return;
            }
            
            gameLoop = setTimeout(updateGame, GAME_SPEED);
        }

        // Handle keyboard input
        function handleKeyPress(key) {
            if (!gameActive) return;
            
            if (key === '1') {
                p1.controlled = true;
                p2.controlled = false;
                return;
            }
            
            if (key === '2') {
                p1.controlled = false;
                p2.controlled = true;
                return;
            }
            
            if (!p1.controlled) return;
            
            switch (key) {
                case 'w':
                case 'W':
                    if (p1.direction !== 'down') p1.nextDirection = 'up';
                    break;
                case 's':
                case 'S':
                    if (p1.direction !== 'up') p1.nextDirection = 'down';
                    break;
                case 'a':
                case 'A':
                    if (p1.direction !== 'right') p1.nextDirection = 'left';
                    break;
                case 'd':
                case 'D':
                    if (p1.direction !== 'left') p1.nextDirection = 'right';
                    break;
            }
        }

        // Handle arrow keys for P2
        function handleArrowKeys(key) {
            if (!gameActive) return;
            
            if (key === 'ArrowUp') {
                if (p2.direction !== 'down') p2.nextDirection = 'up';
            } else if (key === 'ArrowDown') {
                if (p2.direction !== 'up') p2.nextDirection = 'down';
            } else if (key === 'ArrowLeft') {
                if (p2.direction !== 'right') p2.nextDirection = 'left';
            } else if (key === 'ArrowRight') {
                if (p2.direction !== 'left') p2.nextDirection = 'right';
            }
        }

        // Start game
        function startGame(mode) {
            gameMode = mode;
            gameActive = true;
            lastTick = performance.now();
            
            // Hide menu
            document.getElementById('menuOverlay').classList.add('hidden');
            
            // Reset snakes
            p1.body = [];
            p2.body = [];
            p1.score = 0;
            p2.score = 0;
            p1.direction = 'right';
            p2.direction = 'up';
            p1.nextDirection = 'right';
            p2.nextDirection = 'up';
            
            document.getElementById('score1').textContent = '0';
            document.getElementById('score2').textContent = '0';
            
            // Initialize based on game mode
            if (gameMode === 'pvc') {
                initSnake(p1);
                initCPU(p2, false);
            } else if (gameMode === 'hvc') {
                initSnake(p1);
                initCPU(p2, false);
                p1.controlled = true;
                p2.controlled = false;
            } else { // hvh
                initSnake(p1);
                initSnake(p2);
            }
            
            spawnFood();
            updateGame();
        }

        // End game
        function endGame() {
            gameActive = false;
            clearTimeout(gameLoop);
            
            // Clear boards
            const cells1 = document.querySelectorAll('#board1 .cell');
            const cells2 = document.querySelectorAll('#board2 .cell');
            cells1.forEach(c => c.className = 'cell');
            cells2.forEach(c => c.className = 'cell');
            
            // Show game over screen
            const winner = p1.score > p2.score ? 'Player 1' : 
                          p2.score > p1.score ? 'Player 2' : 'Draw!';
            const message = `Player 1: ${p1.score} - Player 2: ${p2.score}\nWinner: ${winner}`;
            
            document.getElementById('gameOverTitle').textContent = 'Game Over!';
            document.getElementById('gameOverMessage').textContent = message;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        // Restart game
        function restartGame() {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            startGame(gameMode);
        }

        // Show menu
        function showMenu() {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('menuOverlay').classList.remove('hidden');
            gameActive = false;
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !gameActive) {
                startGame(gameMode);
            }
            
            if (gameActive) {
                handleKeyPress(e.key);
                handleArrowKeys(e.key);
            }
        });

        // Initialize
        initBoards();
        showMenu();
    </script>
</body>
</html>
