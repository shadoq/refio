<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 24px;
    text-align: center;
    color: #1a1a2e;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-row input:focus {
    border-color: #4a90d9;
  }

  .btn-add {
    padding: 12px 20px;
    background: #4a90d9;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }

  .btn-add:hover { background: #357abd; }
  .btn-add:active { background: #2a5f90; }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }

  .filter-btn {
    padding: 6px 16px;
    border: 1.5px solid #ccc;
    border-radius: 20px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    color: #555;
    transition: all 0.2s;
  }

  .filter-btn:hover { background: #f5f5f5; }
  .filter-btn.active {
    background: #4a90d9;
    color: #fff;
    border-color: #4a90d9;
  }

  .todo-list {
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #fafafa;
    border: 1px solid #f0f0f0;
    transition: all 0.2s;
  }

  .todo-item:hover {
    background: #f0f5ff;
    border-color: #d0d8e8;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #999;
  }

  .todo-item.completed {
    background: #f5f5f0;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
  }

  .todo-delete {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    line-height: 1;
    transition: background 0.15s;
  }

  .todo-delete:hover {
    background: #fdecea;
  }

  .empty-msg {
    text-align: center;
    color: #bbb;
    font-size: 15px;
    padding: 32px 0;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📝 Todo App</h1>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="Add a new todo..." autocomplete="off">
    <button class="btn-add" id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
</div>

<script>
  // Load todos from localStorage or start empty
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');

  const filterBtns = document.querySelectorAll('.filter-btn');
  let currentFilter = 'all';

  // Persist to localStorage whenever todos change
  function saveTodos() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  // Add a new todo
  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, completed: false });
    todoInput.value = '';
    saveTodos();
    render();
  }

  // Toggle complete
  function toggleTodo(id) {
    const t = todos.find(x => x.id === id);
    if (t) t.completed = !t.completed;
    saveTodos();
    render();
  }

  // Delete a todo
  function deleteTodo(id) {
    todos = todos.filter(x => x.id !== id);
    saveTodos();
    render();
  }

  // Filter todos
  function getFilteredTodos() {
    switch (currentFilter) {
      case 'active': return todos.filter(t => !t.completed);
      case 'completed': return todos.filter(t => t.completed);
      default: return todos;
    }
  }

  // Render the list
  function render() {
    const items = getFilteredTodos();
    if (items.length === 0) {
      todoList.innerHTML = '<li class="empty-msg">' + (currentFilter === 'active' ? 'No active todos' : currentFilter === 'completed' ? 'No completed todos' : 'No todos yet') + '</li>';
      return;
    }
    todoList.innerHTML = items.map(t =>
      '<li class="todo-item' + (t.completed ? ' completed' : '') + '">' +
        '<span class="todo-text">' + esc(t.text) + '</span>' +
        '<button class="todo-delete" onclick="deleteTodo(' + t.id + ')">&times;</button>' +
      '</li>'
    ).join('');
  }

  // Escape HTML to prevent XSS
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Event listeners
  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // Initial render
  render();
</script>
</body>
</html>
