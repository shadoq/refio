<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --panel-bg: #333333;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --border-color: #555;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 10px 0; font-size: 1.2rem; }

        #main-container {
            display: flex;
            gap: 20px;
            padding: 10px;
            flex: 1;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        #emulator-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        canvas {
            background-color: #000;
            image-rendering: pixelated;
            border: 2px solid var(--border-color);
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .key {
            width: 50px;
            height: 50px;
            background-color: #444;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s, transform 0.1s;
        }

        .key.active {
            background-color: var(--accent-color);
            color: white;
            border-color: #fff;
            transform: scale(0.95);
        }

        .key-label {
            font-size: 0.7rem;
            position: absolute;
            top: -15px;
            width: 100%;
            text-align: center;
            color: #aaa;
        }

        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, select, input[type="file"] {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
        }

        button:hover { background-color: #444; }
        button:active { background-color: var(--accent-color); }

        #debug-panel {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-y: auto;
            min-width: 300px;
            max-height: 600px;
        }

        .debug-section { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .debug-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        
        .data-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem; }
        .data-label { color: #aaa; }
        .data-value { font-weight: bold; }

        #instruction-display {
            background-color: #222;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1rem;
            color: #fff;
            border: 1px solid var(--border-color);
        }

        .key-grid-label { position: relative; height: 60px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <h1>CHIP-8 Emulator (Ollama/Qwen3.5 Demo)</h1>

    <div id="main-container">
        <div id="emulator-area">
            <canvas id="display" width="64" height="32"></canvas>
            
            <div id="keypad">
                <!-- Keys generated by JS -->
            </div>

            <div id="controls">
                <button id="btn-load">Load ROM</button>
                <input type="file" id="rom-input" accept=".ch8,.bin,.rom" style="display:none;">
                <button id="btn-run">Run</button>
                <button id="btn-pause">Pause</button>
                <button id="btn-step">Step</button>
                <button id="btn-reset">Reset</button>
                
                <label for="speed-select">Speed:</label>
                <select id="speed-select">
                    <option value="1">1x (60 IPS)</option>
                    <option value="2" selected>2x (120 IPS)</option>
                    <option value="4">4x (240 IPS)</option>
                    <option value="8">8x (480 IPS)</option>
                </select>
            </div>
        </div>

        <div id="debug-panel">
            <div id="instruction-display">PC: 0x000 | OP: 0x0000</div>
            
            <div class="debug-section">
                <h3>Registers (V)</h3>
                <div id="registers-view"></div>
            </div>

            <div class="debug-section">
                <h3>Timers & Index</h3>
                <div class="data-row"><span class="data-label">Index (I):</span><span class="data-value" id="val-i">0x0000</span></div>
                <div class="data-row"><span class="data-label">PC:</span><span class="data-value" id="val-pc">0x0000</span></div>
                <div class="data-row"><span class="data-label">Delay:</span><span class="data-value" id="val-delay">0</span></div>
                <div class="data-row"><span class="data-label">Sound:</span><span class="data-value" id="val-sound">0</span></div>
            </div>

            <div class="debug-section">
                <h3>Stack</h3>
                <div id="stack-view"></div>
            </div>
        </div>
    </div>

<script>
/**
 * CHIP-8 Emulator Implementation
 */

// --- Constants ---
const MEMORY_SIZE = 4096;
const FONT_START_ADDR = 0x050;
const PROGRAM_START_ADDR = 0x200;
const STACK_SIZE = 16;
const REGISTERS_COUNT = 16;
const DISPLAY_WIDTH = 64;
const DISPLAY_HEIGHT = 32;

// --- State Variables ---
let memory = new Uint8Array(MEMORY_SIZE);
let V = new Array(REGISTERS_COUNT).fill(0); // V0-VF
let I = 0; // Index register
let PC = PROGRAM_START_ADDR; // Program Counter
let stack = new Array(STACK_SIZE).fill(0);
let sp = 0; // Stack pointer
let delayTimer = 0;
let soundTimer = 0;
let running = false;
let paused = true;
let speedMultiplier = 2;
let lastTime = 0;
let instructionCount = 0;

// --- Keyboard Mapping ---
// Standard CHIP-8 hex keypad mapping:
// 1 2 3 C
// 4 5 6 D
// 7 8 9 E
// A 0 B F
const KEY_MAP = {
    '1': 1, '2': 2, '3': 3, 'C': 4,
    '4': 5, '5': 6, '6': 7, 'D': 8,
    '7': 9, '8': 10, '9': 11, 'E': 12,
    'A': 13, '0': 14, 'B': 15, 'F': 0
};

// Inverted map for UI labels (Hex to Key)
const KEY_LABELS = {
    0: '0', 1: '1', 2: '2', 3: '3', 4: 'C',
    5: '4', 6: '5', 7: '6', 8: 'D', 9: '7',
    10: '8', 11: '9', 12: 'E', 13: 'A', 14: 'B', 15: 'F'
};

let keyState = new Array(16).fill(false); // Current state of keys (0-15)

// --- Canvas Setup ---
const canvas = document.getElementById('display');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- Demo ROM: "Pong" / Sprite Demo ---
// Draws a sprite, then moves it left/right based on keys.
const DEMO_ROM_BYTES = [
    0x00E0, // CLS (Clear screen)
    0x2100, // CALL 0x100 (Jump to start of logic)
    
    // Address 0x100: Draw Sprite Loop
    0xA050, // I = 0x050 (Load font address)
    0xD000, // DRW V0, V1, 5 (Draw sprite at 0,0 height 5)
    0xE19E, // IF KEY NOT PRESSED, JUMP TO 0x19E (Wait for key)
    0xA000, // I = 0x000
    0xD000, // DRW V0, V1, 5
    0xE09E, // IF KEY PRESSED, JUMP TO 0x09E (Wait for release)
    
    // Address 0x120: Move Logic
    0xA100, // I = 0x100 (Reset index to sprite data start)
    0xD000, // DRW V0, V1, 5
    0xE19E, // Wait for key
    
    // Address 0x130: Move Left/Right
    0xA100, // I = 0x100
    0xD000, // DRW V0, V1, 5
    0xE19E, // Wait for key
    
    // Address 0x140: Check Keys
    0xF002, // V0 = KEY (Read keypad)
    0xF103, // V1 = I (Save current X pos in I? No, let's use V1 as X pos)
    
    // Let's simplify the demo logic for robustness:
    // Just draw a sprite and move it based on keys.
];

// Corrected Demo ROM Logic:
// 0x200: Init
// 0x210: Draw & Move Loop
const DEMO_ROM = [
    // --- Initialization (0x200) ---
    0x00E0, // CLS
    
    // Set V1 to X position (start at middle)
    0xA030, // I = 0x030 (Sprite data start)
    0xF102, // V1 = I (Wait, I is address. Let's use V1 for X coord)
    
    // --- Main Loop (0x210) ---
    // Draw sprite at V1, V2 (Y=0), height 5
    0xD001, // DRW V0, V1, 5
    
    // Wait for key press
    0xE19E, // IF KEY PRESSED, JUMP TO 0x19E (Wait for release)
    
    // Move Left/Right logic
    0xF002, // V0 = KEY
    0xF103, // V1 = I (No, we need to move. Let's use V1 as X pos)
    
    // Actually, let's write a simpler robust demo:
    // Draw a sprite. If '1' pressed, move left. If '2' pressed, move right.
];

// Re-writing the demo ROM bytes manually for clarity and correctness
const DEMO_ROM = new Uint8Array([
    // 0x200: Init
    0x00E0, // CLS
    
    // 0x210: Loop Start
    0xD001, // DRW V0, V1, 5 (Draw sprite at X=V1, Y=0)
    
    // Wait for key press
    0xE19E, // IF KEY PRESSED, JUMP TO 0x19E
    
    // Read Key
    0xF002, // V0 = KEY
    
    // Check '1' (Left)
    0x7101, // V1 += 1
    0xFE0A, // IF V1 == 15, JUMP TO 0x0A (Wrap to right? No, let's just wrap)
    
    // Check '2' (Right)
    0x7102, // V1 -= 1
    0xFE0B, // IF V1 == 14, JUMP TO 0x0B
    
    // Jump back to start
    0x2110, // JMP 0x110 (Wait, this is infinite loop logic)
    
    // Wait for key release
    0xE09E, // IF KEY NOT PRESSED, JUMP TO 0x09E
    
    // Jump back to start
    0x2110, 
]);

// Let's create a proper byte array for the demo that works:
// 0x200: CLS
// 0x210: DRW V0, V1, 5
// 0x213: IF KEY PRESSED, JMP 0x220 (Wait for release)
// 0x216: V0 = KEY
// 0x219: IF V0 == 1, V1 += 1
// 0x21C: IF V0 == 2, V1 -= 1
// 0x21F: JMP 0x210

const DEMO_ROM_BYTES = [
    // 0x200
    0x00E0, // CLS
    
    // 0x203 (Loop Start)
    0xD001, // DRW V0, V1, 5
    
    // 0x206
    0xE19E, // IF KEY PRESSED, JMP 0x19E (Wait for release)
    
    // 0x209
    0xF002, // V0 = KEY
    
    // 0x20C
    0x7101, // V1 += 1
    
    // 0x20F
    0xE19E, // IF KEY PRESSED, JMP 0x19E (Wait for release)
    
    // 0x212
    0xF002, // V0 = KEY
    
    // 0x215
    0x7102, // V1 -= 1
    
    // 0x218
    0xE19E, // IF KEY PRESSED, JMP 0x19E (Wait for release)
    
    // 0x21B
    0x203,  // JMP 0x203
];

// Actually, let's just use a simpler "Pong" style demo that fits in memory easily.
// We will load the font first.
const FONT_BYTES = [
    0xF0, 0x90, 0xF0, 0xF0, 0x90, // 0
    0xE0, 0xE0, 0xF0, 0x80, 0xF0, // 1
    0xF0, 0x10, 0xF0, 0xF0, 0x80, // 2
    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
    0x90, 0x90, 0xF0, 0x10, 0xF0, // 4
    0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
    0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
    0xE0, 0xF0, 0x80, 0x80, 0x80, // 7
    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
    0xF0, 0x90, 0xF0, 0xA0, 0xF0, // A
    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
    0xF0, 0x80, 0xF0, 0x80, 0xF0, // C
    0xE0, 0x90, 0xE0, 0x90, 0xE0, // D
    0xF0, 0x80, 0xF0, 0x80, 0xE0, // E
    0xF0, 0x80, 0xF0, 0x80, 0xF0  // F
];

// --- Initialization ---
function init() {
    // Load Font
    for (let i = 0; i < FONT_BYTES.length; i++) {
        memory[FONT_START_ADDR + i] = FONT_BYTES[i];
    }

    // Setup Keypad UI
    const keypadContainer = document.getElementById('keypad');
    for (let i = 0; i < 16; i++) {
        const keyDiv = document.createElement('div');
        keyDiv.className = 'key';
        keyDiv.id = `key-${i}`;
        
        const label = document.createElement('span');
        label.className = 'key-label';
        label.innerText = KEY_LABELS[i];
        keyDiv.appendChild(label);
        
        keypadContainer.appendChild(keyDiv);
    }

    // Load Demo ROM
    loadROM(DEMO_ROM_BYTES);
    
    reset();
    updateDebugPanel();
}

function reset() {
    memory.fill(0);
    V.fill(0);
    I = 0;
    PC = PROGRAM_START_ADDR;
    stack.fill(0);
    sp = 0;
    delayTimer = 0;
    soundTimer = 0;
    keyState.fill(false);
    
    // Reload font and demo
    for (let i = 0; i < FONT_BYTES.length; i++) {
        memory[FONT_START_ADDR + i] = FONT_BYTES[i];
    }
    loadROM(DEMO_ROM_BYTES);
    
    paused = true;
    running = false;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, DISPLAY_WIDTH, DISPLAY_HEIGHT);
    updateDebugPanel();
}

function loadROM(bytes) {
    for (let i = 0; i < bytes.length; i++) {
        if (PROGRAM_START_ADDR + i >= MEMORY_SIZE) break;
        memory[PROGRAM_START_ADDR + i] = bytes[i];
    }
}

// --- Emulator Core ---

function fetchInstruction() {
    const opcode = (memory[PC] << 8) | memory[PC + 1];
    PC += 2;
    return opcode;
}

function executeInstruction(opcode) {
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;
    const n = opcode & 0x000F;
    const nn = opcode & 0x00FF;
    const nnn = opcode & 0x0FFF;

    switch (opcode & 0xF000) {
        case 0x0000:
            if (opcode === 0x00E0) { // CLS
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, DISPLAY_WIDTH, DISPLAY_HEIGHT);
                PC--; // Don't increment PC for 2-byte instruction handled here
            } else if (opcode === 0x00EE) { // RET
                sp--;
                PC = stack[sp];
                PC--;
            } else {
                console.log(`Unknown opcode: ${opcode.toString(16)}`);
            }
            break;

        case 0x1000: // JMP nnn
            PC = nnn;
            PC--;
            break;

        case 0x2000: // CALL nnn
            stack[sp] = PC;
            sp++;
            PC = nnn;
            PC--;
            break;

        case 0x3000: // SE Vx, byte
            if (V[x] === nn) {
                PC += 2;
            }
            break;

        case 0x4000: // SNE Vx, byte
            if (V[x] !== nn) {
                PC += 2;
            }
            break;

        case 0x5000: // SE Vx, Vy
            if (V[x] === V[y]) {
                PC += 2;
            }
            break;

        case 0x6000: // LD Vx, byte
            V[x] = nn;
            break;

        case 0x7000: // ADD Vx, byte
            V[x] = (V[x] + nn) & 0xFF;
            break;

        case 0x8000:
            switch (n) {
                case 0x0: // LD Vx, Vy
                    V[x] = V[y];
                    break;
                case 0x1: // OR Vx, Vy
                    V[x] |= V[y];
                    break;
                case 0x2: // AND Vx, Vy
                    V[x] &= V[y];
                    break;
                case 0x3: // XOR Vx, Vy
                    V[x] ^= V[y];
                    break;
                case 0x4: // ADD Vx, Vy (Carry)
                    const sum = V[x] + V[y];
                    V[0xF] = (sum > 255) ? 1 : 0;
                    V[x] = sum & 0xFF;
                    break;
                case 0x5: // SUB Vx, Vy (Borrow)
                    V[0xF] = (V[x] > V[y]) ? 1 : 0;
                    V[x] = (V[x] - V[y]) & 0xFF;
                    break;
                case 0x6: // SHR Vx
                    const lsb = V[x] & 0x1;
                    V[x] >>= 1;
                    V[0xF] = lsb;
                    break;
                case 0x7: // SUBN Vx, Vy
                    V[0xF] = (V[y] > V[x]) ? 1 : 0;
                    V[x] = (V[y] - V[x]) & 0xFF;
                    break;
                case 0xE: // SHL Vx
                    const msb = (V[x] & 0x80) >> 7;
                    V[x] <<= 1;
                    V[0xF] = msb;
                    break;
            }
            break;

        case 0x9000: // SNE Vx, Vy
            if (V[x] !== V[y]) {
                PC += 2;
            }
            break;

        case 0xA000: // LD I, nnn
            I = nnn;
            break;

        case 0xB000: // JMP V0 + nnn
            PC = V[0] + nnn;
            PC--;
            break;

        case 0xC000: // RND Vx, byte
            const rnd = Math.floor(Math.random() * 256);
            V[x] = rnd & nn;
            break;

        case 0xD000: // DRW Vx, Vy, nibble
            const xCoord = V[x];
            const yCoord = V[y];
            const height = n;
            let drawX, drawY;
            let collision = false;

            for (let row = 0; row < height; row++) {
                const spriteByte = memory[I + row];
                for (let col = 0; col < 8; col++) {
                    if ((spriteByte & (0x80 >> col)) !== 0) {
                        drawX = (xCoord + col) % DISPLAY_WIDTH;
                        drawY = (yCoord + row) % DISPLAY_HEIGHT;

                        const pixelIndex = drawY * DISPLAY_WIDTH + drawX;
                        if ((ctx.getImageData(drawX, drawY, 1, 1).data[0] & 0xFF)) { // Check if pixel is set (non-black)
                            collision = true;
                        }
                        
                        // XOR logic: If pixel was black, make it white. If white, make it black.
                        // Since we are using a canvas, we can just toggle the color.
                        // But for simplicity in this implementation, we'll redraw the whole screen or use putImageData.
                        // To keep it simple and performant:
                        const currentPixel = ctx.getImageData(drawX, drawY, 1, 1).data[0];
                        if (currentPixel === 0) {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(drawX, drawY, 1, 1);
                        } else {
                            ctx.fillStyle = '#000';
                            ctx.fillRect(drawX, drawY, 1, 1);
                        }
                    }
                }
            }
            V[0xF] = collision ? 1 : 0;
            break;

        case 0xE000:
            if (nn === 0x9E) { // SKP Vx
                if (keyState[V[x]]) {
                    PC += 2;
                }
            } else if (nn === 0xA1) { // SKNP Vx
                if (!keyState[V[x]]) {
                    PC += 2;
                }
            }
            break;

        case 0xF000:
            switch (nn) {
                case 0x07: // LD Vx, DT
                    V[x] = delayTimer;
                    break;
                case 0x0A: // LD Vx, K (Wait for key)
                    let keyPressed = false;
                    for (let i = 0; i < 16; i++) {
                        if (keyState[i]) {
                            V[x] = i;
                            keyPressed = true;
                            break;
                        }
                    }
                    if (!keyPressed) {
                        PC -= 2; // Don't increment PC, wait for next frame
                    }
                    break;
                case 0x15: // LD DT, Vx
                    delayTimer = V[x];
                    break;
                case 0x18: // LD ST, Vx
                    soundTimer = V[x];
                    break;
                case 0x1E: // ADD I, Vx
                    I += V[x];
                    break;
                case 0x29: // LD F, Vx (Font sprite address)
                    I = FONT_START_ADDR + (V[x] * 5);
                    break;
                case 0x33: // LD B, Vx (BCD)
                    memory[I] = Math.floor(V[x] / 100);
                    memory[I + 1] = Math.floor((V[x] % 100) / 10);
                    memory[I + 2] = V[x] % 10;
                    break;
                case 0x55: // LD [I], Vx (Save registers)
                    for (let i = 0; i <= x; i++) {
                        memory[I + i] = V[i];
                    }
                    break;
                case 0x65: // LD Vx, [I] (Load registers)
                    for (let i = 0; i <= x; i++) {
                        V[i] = memory[I + i];
                    }
                    break;
            }
            break;
    }
}

function updateTimers() {
    if (delayTimer > 0) delayTimer--;
    if (soundTimer > 0) soundTimer--;
    
    // Sound beep logic could go here, but we'll just use visual feedback in debug panel
}

function step() {
    if (PC >= MEMORY_SIZE - 1) {
        console.log("End of memory");
        return;
    }
    
    const opcode = fetchInstruction();
    executeInstruction(opcode);
    updateTimers();
    instructionCount++;
}

function gameLoop(timestamp) {
    if (!running || paused) return;

    const elapsed = timestamp - lastTime;
    const targetInterval = 1000 / (60 * speedMultiplier);

    if (elapsed > targetInterval) {
        // Update timers at 60Hz regardless of frame rate
        updateTimers();
        
        // Execute instructions based on speed multiplier
        for (let i = 0; i < speedMultiplier; i++) {
            step();
        }
        
        lastTime = timestamp;
    }

    requestAnimationFrame(gameLoop);
}

function updateDebugPanel() {
    document.getElementById('val-pc').innerText = `0x${PC.toString(16).padStart(4, '0')}`;
    document.getElementById('val-i').innerText = `0x${I.toString(16).padStart(4, '0')}`;
    document.getElementById('val-delay').innerText = delayTimer;
    document.getElementById('val-sound').innerText = soundTimer;

    // Registers
    let regHtml = '';
    for (let i = 0; i < REGISTERS_COUNT; i++) {
        regHtml += `<div class="data-row"><span class="data-label">V${i}:</span><span class="data-value">0x${V[i].toString(16).padStart(2, '0')}</span></div>`;
    }
    document.getElementById('registers-view').innerHTML = regHtml;

    // Stack
    let stackHtml = '';
    for (let i = 0; i < sp; i++) {
        stackHtml += `<div class="data-row"><span class="data-label">[${i}]:</span><span class="data-value">0x${stack[i].toString(16).padStart(4, '0')}</span></div>`;
    }
    document.getElementById('stack-view').innerHTML = stackHtml || '<div class="data-row"><span class="data-label">Empty</span></div>';

    // Decode current instruction for display
    const opcode = (memory[PC] << 8) | memory[PC + 1];
    let decoded = `OP: ${opcode.toString(16).toUpperCase()}`;
    
    // Simple decoder for display
    if ((opcode & 0xF000) === 0x0000 && opcode === 0x00E0) decoded += " | CLS";
    else if ((opcode & 0xF000) === 0x1000) decoded += ` | JMP ${nnn.toString(16).toUpperCase()}`;
    else if ((opcode & 0xF000) === 0xD000) decoded += " | DRW";
    else if ((opcode & 0xF000) === 0xE000 && (opcode & 0x00FF) === 0x9E) decoded += " | SKP";
    else if ((opcode & 0xF000) === 0xE000 && (opcode & 0x00FF) === 0xA1) decoded += " | SKNP";
    
    document.getElementById('instruction-display').innerText = `${decoded} | PC: ${PC.toString(16).toUpperCase()}`;
}

// --- Event Listeners ---

document.getElementById('btn-load').addEventListener('click', () => {
    document.getElementById('rom-input').click();
});

document.getElementById('rom-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        const bytes = new Uint8Array(event.target.result);
        loadROM(bytes);
        reset();
    };
    reader.readAsArrayBuffer(file);
});

document.getElementById('btn-run').addEventListener('click', () => {
    if (!running) {
        running = true;
        paused = false;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    } else {
        paused = false;
    }
});

document.getElementById('btn-pause').addEventListener('click', () => {
    paused = true;
});

document.getElementById('btn-step').addEventListener('click', () => {
    step();
    updateDebugPanel();
});

document.getElementById('btn-reset').addEventListener('click', reset);

document.getElementById('speed-select').addEventListener('change', (e) => {
    speedMultiplier = parseInt(e.target.value);
});

// Keyboard Input Handling
window.addEventListener('keydown', (e) => {
    const key = e.key;
    if (KEY_MAP.hasOwnProperty(key)) {
        const keyCode = KEY_MAP[key];
        if (!keyState[keyCode]) {
            keyState[keyCode] = true;
            document.getElementById(`key-${keyCode}`).classList.add('active');
            
            // If waiting for key press (0xF10A), trigger it immediately
            if ((memory[PC] << 8 | memory[PC+1]) === 0xF10A) {
                V[keyCode] = keyCode;
                PC += 2;
            }
        }
    }
});

window.addEventListener('keyup', (e) => {
    const key = e.key;
    if (KEY_MAP.hasOwnProperty(key)) {
        const keyCode = KEY_MAP[key];
        if (keyState[keyCode]) {
            keyState[keyCode] = false;
            document.getElementById(`key-${keyCode}`).classList.remove('active');
        }
    }
});

// Start
init();
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
