<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            display: flex;
            gap: 20px;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .display-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        canvas {
            border: 3px solid #00ff00;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
            transform: none;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="range"] {
            width: 150px;
        }

        input[type="file"] {
            padding: 5px;
        }

        .speed-display {
            min-width: 80px;
            text-align: right;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 200px;
        }

        .key {
            aspect-ratio: 1;
            background: #333;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.1s;
        }

        .key:hover {
            background: #444;
        }

        .key.pressed {
            background: #00ff00;
            color: #000;
        }

        .debugger {
            background: #0a0a0a;
            border: 2px solid #00ff00;
            padding: 15px;
            border-radius: 3px;
            font-size: 12px;
            max-height: 600px;
            overflow-y: auto;
            min-width: 300px;
        }

        .debug-section {
            margin-bottom: 15px;
        }

        .debug-title {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 3px;
        }

        .debug-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 11px;
        }

        .debug-label {
            color: #00aa00;
            min-width: 60px;
        }

        .debug-value {
            color: #00ff00;
            font-weight: bold;
            text-align: right;
            flex: 1;
        }

        .instruction-display {
            background: #1a1a1a;
            padding: 10px;
            border: 1px solid #00ff00;
            border-radius: 3px;
            margin-top: 10px;
        }

        .instruction-hex {
            color: #ffff00;
            font-weight: bold;
            font-size: 13px;
        }

        .instruction-mnemonic {
            color: #00ff00;
            font-size: 12px;
            margin-top: 5px;
        }

        .status {
            padding: 10px;
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 3px;
            font-size: 12px;
        }

        .status.running {
            color: #00ff00;
        }

        .status.paused {
            color: #ffff00;
        }

        .status.stopped {
            color: #ff6600;
        }

        @media (max-width: 1200px) {
            body {
                flex-direction: column;
            }

            .debugger {
                max-height: 300px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display-section">
            <h1 style="color: #00ff00;">CHIP-8 Emulator</h1>
            <canvas id="display" width="640" height="320"></canvas>
            
            <div class="status" id="status">Status: Stopped</div>
            
            <div class="controls">
                <button id="runBtn" onclick="emulator.run()">▶ Run</button>
                <button id="pauseBtn" onclick="emulator.pause()" disabled>⏸ Pause</button>
                <button id="stepBtn" onclick="emulator.step()">⏭ Step</button>
                <button id="resetBtn" onclick="emulator.reset()">⟲ Reset</button>
            </div>

            <div class="control-group">
                <label>Speed (instructions/frame):</label>
                <input type="range" id="speedSlider" min="1" max="50" value="10" onchange="updateSpeed()">
                <span class="speed-display" id="speedDisplay">10</span>
            </div>

            <div class="control-group">
                <label>Load ROM:</label>
                <input type="file" id="romFile" accept=".ch8,.bin" onchange="loadRomFile(event)">
                <button onclick="loadDemoRom()">Load Demo</button>
            </div>

            <div class="keypad" id="keypad"></div>
        </div>
    </div>

    <div class="debugger" id="debugger">
        <div class="debug-section">
            <div class="debug-title">Registers</div>
            <div id="registersDebug"></div>
        </div>
        <div class="debug-section">
            <div class="debug-title">Special Registers</div>
            <div class="debug-row">
                <span class="debug-label">PC:</span>
                <span class="debug-value" id="pcDebug">0x0000</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">I:</span>
                <span class="debug-value" id="iDebug">0x0000</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">DT:</span>
                <span class="debug-value" id="dtDebug">0x00</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">ST:</span>
                <span class="debug-value" id="stDebug">0x00</span>
            </div>
        </div>
        <div class="debug-section">
            <div class="debug-title">Stack</div>
            <div id="stackDebug"></div>
        </div>
        <div class="debug-section">
            <div class="debug-title">Current Instruction</div>
            <div class="instruction-display">
                <div class="instruction-hex" id="instructionHex">0x0000</div>
                <div class="instruction-mnemonic" id="instructionMnemonic">NOP</div>
            </div>
        </div>
    </div>

    <script>
        // CHIP-8 Emulator
        class Chip8 {
            constructor() {
                this.memory = new Uint8Array(4096);
                this.registers = new Uint8Array(16);
                this.indexRegister = 0;
                this.programCounter = 0x200;
                this.stack = [];
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display = new Uint8Array(64 * 32);
                this.keys = new Uint8Array(16);
                this.running = false;
                this.paused = false;
                this.speed = 10;
                this.cycleCount = 0;
                this.lastInstruction = 0;

                this.loadFontSet();
            }

            loadFontSet() {
                const fontSet = [
                    0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
                    0x20, 0x60, 0x20, 0x20, 0x70, // 1
                    0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
                    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
                    0x90, 0x90, 0xF0, 0x10, 0x10, // 4
                    0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
                    0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
                    0xF0, 0x10, 0x20, 0x40, 0x40, // 7
                    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
                    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
                    0xF0, 0x90, 0xF0, 0x90, 0x90, // A
                    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
                    0xF0, 0x80, 0x80, 0x80, 0xF0, // C
                    0xE0, 0x90, 0x90, 0x90, 0xE0, // D
                    0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
                    0xF0, 0x80, 0xF0, 0x80, 0x80  // F
                ];

                for (let i = 0; i < fontSet.length; i++) {
                    this.memory[0x50 + i] = fontSet[i];
                }
            }

            loadProgram(program) {
                for (let i = 0; i < program.length; i++) {
                    this.memory[0x200 + i] = program[i];
                }
            }

            fetch() {
                const high = this.memory[this.programCounter];
                const low = this.memory[this.programCounter + 1];
                return (high << 8) | low;
            }

            decode(opcode) {
                return {
                    opcode: opcode,
                    nnn: opcode & 0x0FFF,
                    nn: opcode & 0x00FF,
                    n: opcode & 0x000F,
                    x: (opcode & 0x0F00) >> 8,
                    y: (opcode & 0x00F0) >> 4
                };
            }

            execute(decoded) {
                const { opcode, nnn, nn, n, x, y } = decoded;
                this.lastInstruction = opcode;

                switch (opcode & 0xF000) {
                    case 0x0000:
                        if (opcode === 0x00E0) {
                            this.display.fill(0);
                        } else if (opcode === 0x00EE) {
                            this.programCounter = this.stack.pop();
                        }
                        break;

                    case 0x1000:
                        this.programCounter = nnn - 2;
                        break;

                    case 0x2000:
                        this.stack.push(this.programCounter);
                        this.programCounter = nnn - 2;
                        break;

                    case 0x3000:
                        if (this.registers[x] === nn) {
                            this.programCounter += 2;
                        }
                        break;

                    case 0x4000:
                        if (this.registers[x] !== nn) {
                            this.programCounter += 2;
                        }
                        break;

                    case 0x5000:
                        if (this.registers[x] === this.registers[y]) {
                            this.programCounter += 2;
                        }
                        break;

                    case 0x6000:
                        this.registers[x] = nn;
                        break;

                    case 0x7000:
                        this.registers[x] = (this.registers[x] + nn) & 0xFF;
                        break;

                    case 0x8000:
                        switch (n) {
                            case 0x0:
                                this.registers[x] = this.registers[y];
                                break;
                            case 0x1:
                                this.registers[x] |= this.registers[y];
                                break;
                            case 0x2:
                                this.registers[x] &= this.registers[y];
                                break;
                            case 0x3:
                                this.registers[x] ^= this.registers[y];
                                break;
                            case 0x4:
                                const sum = this.registers[x] + this.registers[y];
                                this.registers[0xF] = sum > 0xFF ? 1 : 0;
                                this.registers[x] = sum & 0xFF;
                                break;
                            case 0x5:
                                this.registers[0xF] = this.registers[x] >= this.registers[y] ? 1 : 0;
                                this.registers[x] = (this.registers[x] - this.registers[y]) & 0xFF;
                                break;
                            case 0x6:
                                this.registers[0xF] = this.registers[x] & 0x1;
                                this.registers[x] >>= 1;
                                break;
                            case 0x7:
                                this.registers[0xF] = this.registers[y] >= this.registers[x] ? 1 : 0;
                                this.registers[x] = (this.registers[y] - this.registers[x]) & 0xFF;
                                break;
                            case 0xE:
                                this.registers[0xF] = (this.registers[x] & 0x80) >> 7;
                                this.registers[x] = (this.registers[x] << 1) & 0xFF;
                                break;
                        }
                        break;

                    case 0x9000:
                        if (this.registers[x] !== this.registers[y]) {
                            this.programCounter += 2;
                        }
                        break;

                    case 0xA000:
                        this.indexRegister = nnn;
                        break;

                    case 0xB000:
                        this.programCounter = nnn + this.registers[0] - 2;
                        break;

                    case 0xC000:
                        this.registers[x] = (Math.random() * 256 | 0) & nn;
                        break;

                    case 0xD000: {
                        const spriteHeight = n;
                        this.registers[0xF] = 0;
                        for (let row = 0; row < spriteHeight; row++) {
                            const spriteByte = this.memory[this.indexRegister + row];
                            for (let col = 0; col < 8; col++) {
                                const bit = (spriteByte >> (7 - col)) & 1;
                                if (bit) {
                                    const px = (this.registers[x] + col) % 64;
                                    const py = (this.registers[y] + row) % 32;
                                    const index = py * 64 + px;
                                    if (this.display[index]) {
                                        this.registers[0xF] = 1;
                                    }
                                    this.display[index] ^= 1;
                                }
                            }
                        }
                        break;
                    }

                    case 0xE000:
                        if (nn === 0x9E) {
                            if (this.keys[this.registers[x]]) {
                                this.programCounter += 2;
                            }
                        } else if (nn === 0xA1) {
                            if (!this.keys[this.registers[x]]) {
                                this.programCounter += 2;
                            }
                        }
                        break;

                    case 0xF000:
                        switch (nn) {
                            case 0x07:
                                this.registers[x] = this.delayTimer;
                                break;
                            case 0x0A: {
                                let keyPressed = false;
                                for (let i = 0; i < 16; i++) {
                                    if (this.keys[i]) {
                                        this.registers[x] = i;
                                        keyPressed = true;
                                        break;
                                    }
                                }
                                if (!keyPressed) {
                                    this.programCounter -= 2;
                                }
                                break;
                            }
                            case 0x15:
                                this.delayTimer = this.registers[x];
                                break;
                            case 0x18:
                                this.soundTimer = this.registers[x];
                                break;
                            case 0x1E:
                                this.indexRegister = (this.indexRegister + this.registers[x]) & 0xFFFF;
                                break;
                            case 0x29:
                                this.indexRegister = 0x50 + this.registers[x] * 5;
                                break;
                            case 0x33: {
                                const value = this.registers[x];
                                this.memory[this.indexRegister] = Math.floor(value / 100);
                                this.memory[this.indexRegister + 1] = Math.floor((value % 100) / 10);
                                this.memory[this.indexRegister + 2] = value % 10;
                                break;
                            }
                            case 0x55:
                                for (let i = 0; i <= x; i++) {
                                    this.memory[this.indexRegister + i] = this.registers[i];
                                }
                                break;
                            case 0x65:
                                for (let i = 0; i <= x; i++) {
                                    this.registers[i] = this.memory[this.indexRegister + i];
                                }
                                break;
                        }
                        break;
                }

                this.programCounter = (this.programCounter + 2) & 0xFFFF;
            }

            cycle() {
                if (!this.running || this.paused) return;

                for (let i = 0; i < this.speed; i++) {
                    const opcode = this.fetch();
                    const decoded = this.decode(opcode);
                    this.execute(decoded);
                }

                this.cycleCount++;
                if (this.cycleCount % 6 === 0) {
                    if (this.delayTimer > 0) this.delayTimer--;
                    if (this.soundTimer > 0) this.soundTimer--;
                }
            }

            step() {
                if (this.paused || !this.running) {
                    const opcode = this.fetch();
                    const decoded = this.decode(opcode);
                    this.execute(decoded);
                }
            }

            reset() {
                this.registers.fill(0);
                this.memory.fill(0);
                this.indexRegister = 0;
                this.programCounter = 0x200;
                this.stack = [];
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display.fill(0);
                this.keys.fill(0);
                this.running = false;
                this.paused = false;
                this.cycleCount = 0;
                this.loadFontSet();
            }

            run() {
                this.running = true;
                this.paused = false;
            }

            pause() {
                this.paused = true;
            }

            setKey(key, pressed) {
                if (key >= 0 && key < 16) {
                    this.keys[key] = pressed ? 1 : 0;
                }
            }
        }

        // Demo ROM - Simple sprite drawing and movement
        const demoRom = [
            0x12, 0x04, // 0x200: JP 0x204
            0x00, 0x00, // 0x202: padding
            0x60, 0x20, // 0x204: LD V0, 0x20
            0x61, 0x10, // 0x206: LD V1, 0x10
            0xA2, 0x0A, // 0x208: LD I, 0x20A
            0xD0, 0x15, // 0x20A: DRW V0, V1, 5
            0x12, 0x0A, // 0x20C: JP 0x20A
            0xF0, 0x90, 0x90, 0x90, 0xF0 // Sprite data (digit 0)
        ];

        // Global emulator instance
        let emulator = new Chip8();
        let animationId = null;

        function initializeKeypad() {
            const keypadDiv = document.getElementById('keypad');
            const keyMap = [
                ['1', '2', '3', 'C'],
                ['4', '5', '6', 'D'],
                ['7', '8', '9', 'E'],
                ['A', '0', 'B', 'F']
            ];

            const keyboardMap = {
                '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
                'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
                'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
                'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
            };

            keypadDiv.innerHTML = '';
            keyMap.forEach(row => {
                row.forEach(key => {
                    const keyValue = parseInt(key, 16);
                    const btn = document.createElement('div');
                    btn.className = 'key';
                    btn.textContent = key;
                    btn.id = `key-${keyValue}`;
                    btn.onmousedown = () => {
                        emulator.setKey(keyValue, true);
                        btn.classList.add('pressed');
                    };
                    btn.onmouseup = () => {
                        emulator.setKey(keyValue, false);
                        btn.classList.remove('pressed');
                    };
                    btn.onmouseleave = () => {
                        emulator.setKey(keyValue, false);
                        btn.classList.remove('pressed');
                    };
                    keypadDiv.appendChild(btn);
                });
            });

            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (keyboardMap.hasOwnProperty(key)) {
                    const keyValue = keyboardMap[key];
                    emulator.setKey(keyValue, true);
                    const btn = document.getElementById(`key-${keyValue}`);
                    if (btn) btn.classList.add('pressed');
                    e.preventDefault();
                }
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (keyboardMap.hasOwnProperty(key)) {
                    const keyValue = keyboardMap[key];
                    emulator.setKey(keyValue, false);
                    const btn = document.getElementById(`key-${keyValue}`);
                    if (btn) btn.classList.remove('pressed');
                    e.preventDefault();
                }
            });
        }

        function updateDisplay() {
            const canvas = document.getElementById('display');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';

            const pixelSize = canvas.width / 64;
            for (let i = 0; i < 64 * 32; i++) {
                if (emulator.display[i]) {
                    const x = (i % 64) * pixelSize;
                    const y = Math.floor(i / 64) * pixelSize;
                    ctx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }

        function updateDebugger() {
            // Registers
            let registersHtml = '';
            for (let i = 0; i < 16; i++) {
                const value = emulator.registers[i].toString(16).toUpperCase().padStart(2, '0');
                registersHtml += `<div class="debug-row"><span class="debug-label">V${i.toString(16).toUpperCase()}:</span><span class="debug-value">0x${value}</span></div>`;
            }
            document.getElementById('registersDebug').innerHTML = registersHtml;

            // Special registers
            document.getElementById('pcDebug').textContent = '0x' + emulator.programCounter.toString(16).toUpperCase().padStart(4, '0');
            document.getElementById('iDebug').textContent = '0x' + emulator.indexRegister.toString(16).toUpperCase().padStart(4, '0');
            document.getElementById('dtDebug').textContent = '0x' + emulator.delayTimer.toString(16).toUpperCase().padStart(2, '0');
            document.getElementById('stDebug').textContent = '0x' + emulator.soundTimer.toString(16).toUpperCase().padStart(2, '0');

            // Stack
            let stackHtml = '';
            if (emulator.stack.length === 0) {
                stackHtml = '<div class="debug-row"><span class="debug-label">Empty</span></div>';
            } else {
                emulator.stack.forEach((addr, idx) => {
                    stackHtml += `<div class="debug-row"><span class="debug-label">[${idx}]:</span><span class="debug-value">0x${addr.toString(16).toUpperCase().padStart(4, '0')}</span></div>`;
                });
            }
            document.getElementById('stackDebug').innerHTML = stackHtml;

            // Current instruction
            const opcode = emulator.lastInstruction;
            const hex = opcode.toString(16).toUpperCase().padStart(4, '0');
            document.getElementById('instructionHex').textContent = '0x' + hex;
            document.getElementById('instructionMnemonic').textContent = disassemble(opcode);

            // Status
            const statusDiv = document.getElementById('status');
            if (emulator.running && !emulator.paused) {
                statusDiv.textContent = 'Status: Running';
                statusDiv.className = 'status running';
            } else if (emulator.paused) {
                statusDiv.textContent = 'Status: Paused';
                statusDiv.className = 'status paused';
            } else {
                statusDiv.textContent = 'Status: Stopped';
                statusDiv.className = 'status stopped';
            }

            // Update button states
            document.getElementById('runBtn').disabled = emulator.running && !emulator.paused;
            document.getElementById('pauseBtn').disabled = !emulator.running || emulator.paused;
        }

        function disassemble(opcode) {
            const nnn = opcode & 0x0FFF;
            const nn = opcode & 0x00FF;
            const n = opcode & 0x000F;
            const x = (opcode & 0x0F00) >> 8;
            const y = (opcode & 0x00F0) >> 4;

            switch (opcode & 0xF000) {
                case 0x0000:
                    return opcode === 0x00E0 ? 'CLS' : opcode === 0x00EE ? 'RET' : 'SYS';
                case 0x1000: return `JP 0x${nnn.toString(16).toUpperCase()}`;
                case 0x2000: return `CALL 0x${nnn.toString(16).toUpperCase()}`;
                case 0x3000: return `SE V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).toUpperCase()}`;
                case 0x4000: return `SNE V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).toUpperCase()}`;
                case 0x5000: return `SE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
                case 0x6000: return `LD V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).toUpperCase()}`;
                case 0x7000: return `ADD V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).toUpperCase()}`;
                case 0x8000:
                    const ops8 = ['LD', 'OR', 'AND', 'XOR', 'ADD', 'SUB', 'SHR', 'SUBN', '', '', '', '', '', '', 'SHL'];
                    return `${ops8[n]} V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
                case 0x9000: return `SNE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
                case 0xA000: return `LD I, 0x${nnn.toString(16).toUpperCase()}`;
                case 0xB000: return `JP V0, 0x${nnn.toString(16).toUpperCase()}`;
                case 0xC000: return `RND V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).toUpperCase()}`;
                case 0xD000: return `DRW V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}, 0x${n.toString(16).toUpperCase()}`;
                case 0xE000:
                    return nn === 0x9E ? `SKP V${x.toString(16).toUpperCase()}` : `SKNP V${x.toString(16).toUpperCase()}`;
                case 0xF000:
                    const opsF = {
                        0x07: 'LD', 0x0A: 'LD', 0x15: 'LD', 0x18: 'LD', 0x1E: 'ADD',
                        0x29: 'LD', 0x33: 'LD', 0x55: 'LD', 0x65: 'LD'
                    };
                    return `${opsF[nn] || '?'} V${x.toString(16).toUpperCase()}`;
                default: return 'UNKNOWN';
            }
        }

        function updateSpeed() {
            const speed = parseInt(document.getElementById('speedSlider').value);
            emulator.speed = speed;
            document.getElementById('speedDisplay').textContent = speed;
        }

        function loadDemoRom() {
            emulator.reset();
            emulator.loadProgram(demoRom);
            updateDisplay();
            updateDebugger();
        }

        function loadRomFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                emulator.reset();
                emulator.loadProgram(data);
                updateDisplay();
                updateDebugger();
            };
            reader.readAsArrayBuffer(file);
        }

        function gameLoop() {
            emulator.cycle();
            updateDisplay();
            updateDebugger();
            animationId = requestAnimationFrame(gameLoop);
        }

        // Initialize
        window.addEventListener('load', () => {
            initializeKeypad();
            loadDemoRom();
            gameLoop();
        });
    </script>
</body>
</html>
