<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Pro - Multi-Mode</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #e0e0e0;
            --p1-color: #4caf50;
            --p2-color: #f44336;
            --food-color: #ffeb3b;
            --accent-color: #2196f3;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            font-size: 1.5rem;
            font-weight: bold;
            background: var(--panel-color);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .score-p1 { color: var(--p1-color); }
        .score-p2 { color: var(--p2-color); }

        #game-canvas {
            background-color: #000;
            border: 4px solid var(--panel-color);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 4px;
            text-align: center;
        }

        .overlay h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background: var(--panel-color);
            color: white;
            border: 2px solid var(--accent-color);
            border-radius: 5px;
            transition: all 0.2s;
            width: 250px;
        }

        button:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        #game-over-msg {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #restart-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="scoreboard">
        <div class="score-p1">P1: <span id="p1-score">0</span></div>
        <div class="score-p2">P2: <span id="p2-score">0</span></div>
    </div>

    <canvas id="game-canvas" width="600" height="600"></canvas>

    <!-- Start Menu -->
    <div id="start-menu" class="overlay">
        <h1>SNAKE PRO</h1>
        <div class="menu-options">
            <button onclick="startGame('human-human')">Human vs Human</button>
            <button onclick="startGame('cpu-human')">CPU vs Human</button>
            <button onclick="startGame('cpu-cpu')">CPU vs CPU</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
        <div id="game-over-msg">GAME OVER</div>
        <div id="final-scores" style="font-size: 1.5rem; margin-bottom: 20px;"></div>
        <div id="restart-hint">Press any key to return to menu</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const startMenu = document.getElementById('start-menu');
    const gameOverScreen = document.getElementById('game-over-screen');
    const gameOverMsg = document.getElementById('game-over-msg');
    const finalScoresEl = document.getElementById('final-scores');

    const GRID_SIZE = 30;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let gameLoop;
    let gameRunning = false;
    let mode = 'human-human'; // human-human, cpu-human, cpu-cpu
    let food = { x: 5, y: 5 };
    
    let snake1 = [];
    let snake2 = [];
    let dir1 = { x: 1, y: 0 };
    let dir2 = { x: -1, y: 0 };
    let nextDir1 = { x: 1, y: 0 };
    let nextDir2 = { x: -1, y: 0 };
    let score1 = 0;
    let score2 = 0;

    // Input handling
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (!gameRunning && (gameOverScreen.classList.contains('hidden') === false)) {
            resetToMenu();
        }
        handleInput();
    });
    window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
    });

    function handleInput() {
        if (!gameRunning) return;

        // Player 1 (WASD)
        if (keys['w'] && dir1.y === 0) nextDir1 = { x: 0, y: -1 };
        if (keys['s'] && dir1.y === 0) nextDir1 = { x: 0, y: 1 };
        if (keys['a'] && dir1.x === 0) nextDir1 = { x: -1, y: 0 };
        if (keys['d'] && dir1.x === 0) nextDir1 = { x: 1, y: 0 };

        // Player 2 (Arrows)
        if (keys['arrowup'] && dir2.y === 0) nextDir2 = { x: 0, y: -1 };
        if (keys['arrowdown'] && dir2.y === 0) nextDir2 = { x: 0, y: 1 };
        if (keys['arrowleft'] && dir2.x === 0) nextDir2 = { x: -1, y: 0 };
        if (keys['arrowright'] && dir2.x === 0) nextDir2 = { x: 1, y: 0 };
    }

    function startGame(selectedMode) {
        mode = selectedMode;
        resetGame();
        startMenu.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        gameRunning = true;
        gameLoop = setInterval(update, 100);
    }

    function resetToMenu() {
        gameRunning = false;
        clearInterval(gameLoop);
        gameOverScreen.classList.add('hidden');
        startMenu.classList.remove('hidden');
    }

    function resetGame() {
        score1 = 0;
        score2 = 0;
        p1ScoreEl.innerText = '0';
        p2ScoreEl.innerText = '0';
        
        snake1 = [{ x: 10, y: 15 }, { x: 9, y: 15 }, { x: 8, y: 15 }];
        snake2 = [{ x: 20, y: 15 }, { x: 21, y: 15 }, { x: 22, y: 15 }];
        
        dir1 = { x: 1, y: 0 };
        dir2 = { x: -1, y: 0 };
        nextDir1 = { x: 1, y: 0 };
        nextDir2 = { x: -1, y: 0 };

        spawnFood();
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * GRID_SIZE),
            y: Math.floor(Math.random() * GRID_SIZE)
        };
        // Don't spawn on snakes
        if (isCollision(food, snake1) || isCollision(food, snake2)) {
            spawnFood();
        }
    }

    function isCollision(point, snake) {
        return snake.some(segment => segment.x === point.x && segment.y === point.y);
    }

    function update() {
        // Apply direction changes
        dir1 = nextDir1;
        dir2 = nextDir2;

        // CPU Logic
        if (mode === 'cpu-human' || mode === 'cpu-cpu') {
            moveAI(snake2, dir2, nextDir2);
        }
        if (mode === 'cpu-cpu') {
            moveAI(snake1, dir1, nextDir1);
        }

        // Move Snakes
        moveSnake(snake1, dir1);
        moveSnake(snake2, dir2);

        // Check Food
        checkFood(snake1, 1);
        checkFood(snake2, 2);

        // Check Wall/Self Collision
        let p1Dead = checkDeath(snake1);
        let p2Dead = checkDeath(snake2);

        if (p1Dead || p2Dead) {
            endGame(p1Dead, p2Dead);
            return;
        }

        draw();
    }

    function moveSnake(snake, dir) {
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        snake.unshift(head);
        snake.pop();
    }

    function moveAI(snake, dir, nextDirRef) {
        const head = snake[0];
        let dx = food.x - head.x;
        let dy = food.y - head.y;

        let moveX = 0;
        let moveY = 0;

        if (Math.abs(dx) > Math.abs(dy)) {
            moveX = dx > 0 ? 1 : -1;
        } else {
            moveY = dy > 0 ? 1 : -1;
        }

        // Prevent 180 degree turns
        if (moveX !== 0 && dir.x === -moveX) {
            moveX = 0;
            moveY = dy > 0 ? 1 : -1;
        }
        if (moveY !== 0 && dir.y === -moveY) {
            moveY = 0;
            moveX = dx > 0 ? 1 : -1;
        }

        if (moveX !== 0) nextDirRef.x = moveX;
        if (moveY !== 0) nextDirRef.y = moveY;
    }

    function checkFood(snake, playerNum) {
        const head = snake[0];
        if (head.x === food.x && head.y === food.y) {
            // Grow snake
            const tail = snake[snake.length - 1];
            snake.push({ ...tail });
            
            if (playerNum === 1) {
                score1++;
                p1ScoreEl.innerText = score1;
            } else {
                score2++;
                p2ScoreEl.innerText = score2;
            }
            spawnFood();
        }
    }

    function checkDeath(snake) {
        const head = snake[0];
        // Wall collision
        if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) return true;
        // Self collision
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) return true;
        }
        // Other snake collision
        const otherSnake = snake === snake1 ? snake2 : snake1;
        if (isCollision(head, otherSnake)) return true;

        return false;
    }

    function endGame(p1Dead, p2Dead) {
        gameRunning = false;
        clearInterval(gameLoop);
        gameOverScreen.classList.remove('hidden');
        
        if (p1Dead && p2Dead) {
            gameOverMsg.innerText = "DRAW!";
            finalScoresEl.innerText = `P1: ${score1} | P2: ${score2}`;
        } else if (p1Dead) {
            gameOverMsg.innerText = "PLAYER 2 WINS!";
            finalScoresEl.innerText = `P1: ${score1} | P2: ${score2}`;
        } else {
            gameOverMsg.innerText = "PLAYER 1 WINS!";
            finalScoresEl.innerText = `P1: ${score1} | P2: ${score2}`;
        }
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (subtle)
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1;
        for(let i=0; i<=GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL_SIZE, 0);
            ctx.lineTo(i * CELL_SIZE, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * CELL_SIZE);
            ctx.lineTo(canvas.width, i * CELL_SIZE);
            ctx.stroke();
        }

        // Draw Food
        ctx.fillStyle = varColor('--food-color');
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2.5, 0, Math.PI*2);
        ctx.fill();

        // Draw Snake 1
        ctx.fillStyle = varColor('--p1-color');
        snake1.forEach((segment, index) => {
            ctx.globalAlpha = index === 0 ? 1 : 0.7;
            ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        });

        // Draw Snake 2
        ctx.fillStyle = varColor('--p2-color');
        snake2.forEach((segment, index) => {
            ctx.globalAlpha = index === 0 ? 1 : 0.7;
            ctx.fillRect(segment.x * CELL_SIZE + 1, segment.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
        });
        ctx.globalAlpha = 1;
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // Initial draw
    draw();

</script>
</body>
</html>
