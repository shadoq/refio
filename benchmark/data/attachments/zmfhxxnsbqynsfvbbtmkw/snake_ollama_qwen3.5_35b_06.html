<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
        }

        .menu {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .menu h2 {
            margin-bottom: 20px;
            color: #00ff88;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .score {
            color: #00ff88;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            background: #0a0a1a;
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }

        .game-over h2 {
            color: #ff4444;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9em;
            color: #aaa;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME 🐍</h1>
        
        <div class="menu" id="startMenu">
            <h2>Select Game Mode</h2>
            <div class="mode-buttons">
                <button onclick="startGame('hvh')">Human vs Human</button>
                <button onclick="startGame('cvh')">CPU vs Human</button>
                <button onclick="startGame('cvc')">CPU vs CPU</button>
            </div>
            <div class="instructions">
                <p>Use Arrow Keys to control Player 1</p>
                <p>Use WASD to control Player 2</p>
                <p>Press any key to restart after game over</p>
            </div>
        </div>

        <div id="gameInfo" class="game-info hidden">
            <div class="score">Player 1: <span id="score1">0</span></div>
            <div class="score">Player 2: <span id="score2">0</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="600" class="hidden"></canvas>

        <div id="gameOver" class="game-over">
            <h2>GAME OVER</h2>
            <p id="winnerText"></p>
            <button onclick="showMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const gridCount = 30;
        
        let gameInterval;
        let gameMode;
        let isGameOver = false;
        
        let snake1, snake2, food;
        let direction1, direction2;
        let score1, score2;
        
        function initGame() {
            snake1 = {
                body: [{x: 5, y: 15}, {x: 4, y: 15}, {x: 3, y: 15}],
                color: '#00ff88',
                isCpu: false
            };
            
            snake2 = {
                body: [{x: 24, y: 15}, {x: 25, y: 15}, {x: 26, y: 15}],
                color: '#ff4444',
                isCpu: false
            };
            
            direction1 = {x: 1, y: 0};
            direction2 = {x: -1, y: 0};
            
            score1 = 0;
            score2 = 0;
            isGameOver = false;
            
            spawnFood();
            updateScoreDisplay();
        }
        
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * gridCount),
                    y: Math.floor(Math.random() * gridCount)
                };
                
                validPosition = true;
                for (let segment of snake1.body) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
                for (let segment of snake2.body) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }
        
        function startGame(mode) {
            gameMode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameInfo').classList.remove('hidden');
            canvas.classList.remove('hidden');
            document.getElementById('gameOver').style.display = 'none';
            
            initGame();
            
            if (mode === 'cvh' || mode === 'cvc') {
                snake2.isCpu = true;
            }
            
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            
            gameInterval = setInterval(gameLoop, 100);
        }
        
        function gameLoop() {
            if (isGameOver) return;
            
            updateSnake(snake1, direction1, 1);
            updateSnake(snake2, direction2, 2);
            
            checkCollisions();
            draw();
        }
        
        function updateSnake(snake, dir, playerNum) {
            if (snake.isCpu) {
                dir = getBestDirection(snake, playerNum === 1 ? snake2 : snake1);
            }
            
            const head = {
                x: snake.body[0].x + dir.x,
                y: snake.body[0].y + dir.y
            };
            
            snake.body.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                if (playerNum === 1) {
                    score1++;
                } else {
                    score2++;
                }
                spawnFood();
                updateScoreDisplay();
            } else {
                snake.body.pop();
            }
        }
        
        function getBestDirection(snake, opponent) {
            const head = snake.body[0];
            const possibleMoves = [
                {x: 0, y: -1}, // Up
                {x: 0, y: 1},  // Down
                {x: -1, y: 0}, // Left
                {x: 1, y: 0}   // Right
            ];
            
            let bestMove = null;
            let bestDistance = Infinity;
            
            for (let move of possibleMoves) {
                const newX = head.x + move.x;
                const newY = head.y + move.y;
                
                if (isValidPosition(newX, newY, snake, opponent)) {
                    const distance = Math.abs(newX - food.x) + Math.abs(newY - food.y);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestMove = move;
                    }
                }
            }
            
            if (!bestMove) {
                for (let move of possibleMoves) {
                    const newX = head.x + move.x;
                    const newY = head.y + move.y;
                    if (isValidPosition(newX, newY, snake, opponent)) {
                        bestMove = move;
                        break;
                    }
                }
            }
            
            return bestMove || {x: 0, y: 0};
        }
        
        function isValidPosition(x, y, snake, opponent) {
            if (x < 0 || x >= gridCount || y < 0 || y >= gridCount) {
                return false;
            }
            
            for (let segment of snake.body) {
                if (segment.x === x && segment.y === y) {
                    return false;
                }
            }
            
            for (let segment of opponent.body) {
                if (segment.x === x && segment.y === y) {
                    return false;
                }
            }
            
            return true;
        }
        
        function checkCollisions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];
            
            if (head1.x < 0 || head1.x >= gridCount || head1.y < 0 || head1.y >= gridCount) {
                endGame('Player 2 Wins!');
                return;
            }
            
            if (head2.x < 0 || head2.x >= gridCount || head2.y < 0 || head2.y >= gridCount) {
                endGame('Player 1 Wins!');
                return;
            }
            
            for (let i = 1; i < snake1.body.length; i++) {
                if (head1.x === snake1.body[i].x && head1.y === snake1.body[i].y) {
                    endGame('Player 2 Wins!');
                    return;
                }
            }
            
            for (let i = 1; i < snake2.body.length; i++) {
                if (head2.x === snake2.body[i].x && head2.y === snake2.body[i].y) {
                    endGame('Player 1 Wins!');
                    return;
                }
            }
            
            if (head1.x === head2.x && head1.y === head2.y) {
                if (snake1.body.length > snake2.body.length) {
                    endGame('Player 1 Wins!');
                } else if (snake2.body.length > snake1.body.length) {
                    endGame('Player 2 Wins!');
                } else {
                    endGame('It\'s a Tie!');
                }
                return;
            }
        }
        
        function endGame(message) {
            isGameOver = true;
            clearInterval(gameInterval);
            document.getElementById('winnerText').textContent = message;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < gridCount; i++) {
                for (let j = 0; j < gridCount; j++) {
                    ctx.strokeStyle = '#1a1a3a';
                    ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
                }
            }
            
            ctx.fillStyle = snake1.color;
            for (let segment of snake1.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            }
            
            ctx.fillStyle = snake2.color;
            for (let segment of snake2.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            }
            
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        function updateScoreDisplay() {
            document.getElementById('score1').textContent = score1;
            document.getElementById('score2').textContent = score2;
        }
        
        function showMenu() {
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('startMenu').classList.remove('hidden');
            document.getElementById('gameInfo').classList.add('hidden');
            canvas.classList.add('hidden');
            if (gameInterval) {
                clearInterval(gameInterval);
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                showMenu();
                return;
            }
            
            if (gameMode === 'hvh' || gameMode === 'cvh') {
                switch(e.key) {
                    case 'ArrowUp':
                        if (direction1.y !== 1) direction1 = {x: 0, y: -1};
                        break;
                    case 'ArrowDown':
                        if (direction1.y !== -1) direction1 = {x: 0, y: 1};
                        break;
                    case 'ArrowLeft':
                        if (direction1.x !== 1) direction1 = {x: -1, y: 0};
                        break;
                    case 'ArrowRight':
                        if (direction1.x !== -1) direction1 = {x: 1, y: 0};
                        break;
                    case 'w':
                    case 'W':
                        if (direction2.y !== 1) direction2 = {x: 0, y: -1};
                        break;
                    case 's':
                    case 'S':
                        if (direction2.y !== -1) direction2 = {x: 0, y: 1};
                        break;
                    case 'a':
                    case 'A':
                        if (direction2.x !== 1) direction2 = {x: -1, y: 0};
                        break;
                    case 'd':
                    case 'D':
                        if (direction2.x !== -1) direction2 = {x: 1, y: 0};
                        break;
                }
            }
        });
    </script>
</body>
</html>
