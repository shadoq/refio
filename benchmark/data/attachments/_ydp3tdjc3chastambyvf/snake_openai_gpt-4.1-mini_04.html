<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snake Game - OpenAI GPT-4.1 Mini</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  h1 {
    margin: 1rem 0 0.5rem 0;
    font-weight: 700;
  }
  #game-container {
    position: relative;
    margin-top: 1rem;
    width: 600px;
    height: 600px;
    background: #222;
    border: 3px solid #555;
    display: grid;
    grid-template-columns: repeat(30, 1fr);
    grid-template-rows: repeat(30, 1fr);
  }
  .cell {
    width: 100%;
    height: 100%;
  }
  .snake1 {
    background-color: #4caf50;
  }
  .snake2 {
    background-color: #2196f3;
  }
  .food {
    background-color: #f44336;
  }
  #scoreboard {
    margin-top: 0.8rem;
    font-size: 1.2rem;
    display: flex;
    justify-content: space-around;
    width: 600px;
  }
  #menu, #gameover {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    color: #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #menu h2, #gameover h2 {
    margin-bottom: 1rem;
  }
  #menu label {
    margin: 0.5rem 0;
    font-size: 1.1rem;
  }
  #menu select {
    font-size: 1rem;
    padding: 0.2rem 0.4rem;
    margin-left: 0.5rem;
  }
  #menu button {
    margin-top: 1.5rem;
    padding: 0.6rem 1.2rem;
    font-size: 1.2rem;
    background: #4caf50;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #menu button:hover {
    background: #388e3c;
  }
  #gameover button {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    font-size: 1.1rem;
    background: #f44336;
    border: none;
    border-radius: 4px;
    color: white;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #gameover button:hover {
    background: #d32f2f;
  }
  #instructions {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #bbb;
    max-width: 600px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Snake Game</h1>
<div id="scoreboard" aria-live="polite" aria-atomic="true">
  <div>Player 1 Score: <span id="score1">0</span></div>
  <div>Player 2 Score: <span id="score2">0</span></div>
</div>
<div id="game-container" role="grid" aria-label="Snake game grid" tabindex="0"></div>

<div id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <h2 id="menu-title">Select Game Mode</h2>
  <label for="mode-select">Game Mode:
    <select id="mode-select" aria-describedby="mode-desc">
      <option value="human-human">Human vs Human</option>
      <option value="cpu-human">CPU vs Human</option>
      <option value="cpu-cpu">CPU vs CPU</option>
    </select>
  </label>
  <div id="mode-desc" style="display:none;">Choose the game mode for the Snake game.</div>
  <button id="start-button" aria-label="Start Game">Start Game</button>
</div>

<div id="gameover" role="dialog" aria-modal="true" aria-labelledby="gameover-title" hidden>
  <h2 id="gameover-title">Game Over</h2>
  <div id="gameover-message"></div>
  <button id="restart-button" aria-label="Restart Game">Restart</button>
</div>

<div id="instructions">
  <p><strong>Controls:</strong> Player 1: Arrow Keys | Player 2: WASD</p>
  <p>Press the buttons above to start or restart the game.</p>
</div>

<script>
(() => {
  const GRID_SIZE = 30;
  const CELL_COUNT = GRID_SIZE * GRID_SIZE;
  const gameContainer = document.getElementById('game-container');
  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const menu = document.getElementById('menu');
  const modeSelect = document.getElementById('mode-select');
  const startButton = document.getElementById('start-button');
  const gameover = document.getElementById('gameover');
  const gameoverMessage = document.getElementById('gameover-message');
  const restartButton = document.getElementById('restart-button');

  // Create grid cells
  const cells = [];
  for (let i = 0; i < CELL_COUNT; i++) {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', `Cell ${Math.floor(i/GRID_SIZE)+1},${(i%GRID_SIZE)+1}`);
    gameContainer.appendChild(cell);
    cells.push(cell);
  }

  // Directions
  const DIRECTIONS = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    KeyW: { x: 0, y: -1 },
    KeyS: { x: 0, y: 1 },
    KeyA: { x: -1, y: 0 },
    KeyD: { x: 1, y: 0 },
  };

  // Game state
  let snakes = [];
  let foods = [];
  let scores = [0, 0];
  let directions = [];
  let nextDirections = [];
  let gameMode = 'human-human';
  let gameInterval = null;
  let gameSpeed = 100; // ms per move
  let gameRunning = false;

  // Utility functions
  function posToIndex(pos) {
    return pos.y * GRID_SIZE + pos.x;
  }
  function isInside(pos) {
    return pos.x >= 0 && pos.x < GRID_SIZE && pos.y >= 0 && pos.y < GRID_SIZE;
  }
  function positionsEqual(a, b) {
    return a.x === b.x && a.y === b.y;
  }
  function randomPosition(excludePositions) {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID_SIZE), y: Math.floor(Math.random() * GRID_SIZE) };
    } while (excludePositions.some(p => positionsEqual(p, pos)));
    return pos;
  }

  // Initialize snakes and food
  function initGame() {
    snakes = [
      // Snake 1 starts near top-left, moving right
      [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }],
      // Snake 2 starts near bottom-right, moving left
      [{ x: 24, y: 24 }, { x: 25, y: 24 }, { x: 26, y: 24 }]
    ];
    directions = [
      { x: 1, y: 0 },
      { x: -1, y: 0 }
    ];
    nextDirections = [
      { x: 1, y: 0 },
      { x: -1, y: 0 }
    ];
    scores = [0, 0];
    foods = [];
    placeFood();
    placeFood();
    updateScores();
    gameRunning = true;
  }

  // Place food on grid avoiding snakes and existing food
  function placeFood() {
    const occupied = snakes.flat().concat(foods);
    const foodPos = randomPosition(occupied);
    foods.push(foodPos);
  }

  // Draw the game state
  function draw() {
    // Clear all cells
    cells.forEach(cell => {
      cell.classList.remove('snake1', 'snake2', 'food');
      cell.style.borderRadius = '';
    });

    // Draw food
    foods.forEach(food => {
      const idx = posToIndex(food);
      cells[idx].classList.add('food');
      cells[idx].style.borderRadius = '50%';
    });

    // Draw snakes
    snakes.forEach((snake, i) => {
      snake.forEach((segment, idx) => {
        const idxCell = posToIndex(segment);
        cells[idxCell].classList.add(i === 0 ? 'snake1' : 'snake2');
        // Rounded corners for head and tail
        if (idx === 0) {
          cells[idxCell].style.borderRadius = '50% 50% 50% 50% / 60% 60% 40% 40%';
        } else if (idx === snake.length - 1) {
          cells[idxCell].style.borderRadius = '40% 40% 60% 60% / 50% 50% 50% 50%';
        }
      });
    });
  }

  // Update score display
  function updateScores() {
    score1El.textContent = scores[0];
    score2El.textContent = scores[1];
  }

  // Check collision with walls or self or other snake
  function checkCollision(snakeIndex, pos) {
    if (!isInside(pos)) return true;
    // Check self collision
    if (snakes[snakeIndex].some(segment => positionsEqual(segment, pos))) return true;
    // Check collision with other snake
    const otherIndex = snakeIndex === 0 ? 1 : 0;
    if (snakes[otherIndex].some(segment => positionsEqual(segment, pos))) return true;
    return false;
  }

  // Move snake forward, return if ate food
  function moveSnake(snakeIndex) {
    const snake = snakes[snakeIndex];
    const dir = nextDirections[snakeIndex];
    // Prevent reversing direction
    if (snake.length > 1) {
      const opposite = { x: -directions[snakeIndex].x, y: -directions[snakeIndex].y };
      if (dir.x === opposite.x && dir.y === opposite.y) {
        // Ignore reversing direction
        nextDirections[snakeIndex] = directions[snakeIndex];
      }
    }
    directions[snakeIndex] = nextDirections[snakeIndex];

    const head = snake[0];
    const newHead = { x: head.x + directions[snakeIndex].x, y: head.y + directions[snakeIndex].y };

    if (checkCollision(snakeIndex, newHead)) {
      return false; // collision, game over for this snake
    }

    snake.unshift(newHead);

    // Check if ate food
    const foodIndex = foods.findIndex(food => positionsEqual(food, newHead));
    if (foodIndex !== -1) {
      foods.splice(foodIndex, 1);
      scores[snakeIndex]++;
      placeFood();
      updateScores();
    } else {
      snake.pop();
    }
    return true;
  }

  // Keyboard input handling for human players
  function handleKeyDown(e) {
    if (!gameRunning) return;
    const key = e.code;
    if (gameMode === 'human-human') {
      // Player 1: Arrows, Player 2: WASD
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
        e.preventDefault();
        nextDirections[0] = DIRECTIONS[key];
      } else if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(key)) {
        e.preventDefault();
        nextDirections[1] = DIRECTIONS[key];
      }
    } else if (gameMode === 'cpu-human') {
      // Player 1 CPU, Player 2 Human (WASD)
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(key)) {
        e.preventDefault();
        nextDirections[1] = DIRECTIONS[key];
      }
    } else if (gameMode === 'human-human') {
      // fallback, no other keys
    }
  }

  // CPU snake AI: simple pathfinding to closest food using BFS
  function cpuNextDirection(snakeIndex) {
    const snake = snakes[snakeIndex];
    const head = snake[0];
    if (foods.length === 0) return directions[snakeIndex];
    // Find closest food by Manhattan distance
    let closestFood = foods[0];
    let minDist = Math.abs(head.x - closestFood.x) + Math.abs(head.y - closestFood.y);
    for (let i = 1; i < foods.length; i++) {
      const f = foods[i];
      const dist = Math.abs(head.x - f.x) + Math.abs(head.y - f.y);
      if (dist < minDist) {
        minDist = dist;
        closestFood = f;
      }
    }

    // BFS to find shortest path to closestFood avoiding snakes
    const queue = [];
    const visited = new Set();
    const prev = new Map();

    function posKey(pos) {
      return pos.x + ',' + pos.y;
    }

    queue.push(head);
    visited.add(posKey(head));

    let found = false;
    while (queue.length > 0) {
      const current = queue.shift();
      if (positionsEqual(current, closestFood)) {
        found = true;
        break;
      }
      for (const d of Object.values(DIRECTIONS).slice(0,4)) {
        const nextPos = { x: current.x + d.x, y: current.y + d.y };
        if (!isInside(nextPos)) continue;
        if (visited.has(posKey(nextPos))) continue;
        // Check collision with snakes except tail (tail moves)
        let collision = false;
        for (let s = 0; s < snakes.length; s++) {
          const snakeBody = snakes[s];
          // Exclude tail segment because it moves away next turn
          const bodyToCheck = snakeBody.slice(0, snakeBody.length - 1);
          if (bodyToCheck.some(seg => positionsEqual(seg, nextPos))) {
            collision = true;
            break;
          }
        }
        if (collision) continue;
        visited.add(posKey(nextPos));
        prev.set(posKey(nextPos), current);
        queue.push(nextPos);
      }
    }

    if (!found) {
      // No path found, try to keep moving in current direction if possible
      const dir = directions[snakeIndex];
      const nextPos = { x: head.x + dir.x, y: head.y + dir.y };
      if (!checkCollision(snakeIndex, nextPos)) return dir;
      // else try any safe direction
      for (const d of Object.values(DIRECTIONS).slice(0,4)) {
        const np = { x: head.x + d.x, y: head.y + d.y };
        if (!checkCollision(snakeIndex, np)) return d;
      }
      // no safe moves, keep current direction
      return dir;
    }

    // Reconstruct path from closestFood to head
    let step = closestFood;
    let beforeStep = null;
    while (!positionsEqual(step, head)) {
      beforeStep = step;
      step = prev.get(posKey(step));
    }
    // Direction from head to beforeStep
    return { x: beforeStep.x - head.x, y: beforeStep.y - head.y };
  }

  // Game loop
  function gameTick() {
    // Update CPU directions
    if (gameMode === 'cpu-human') {
      nextDirections[0] = cpuNextDirection(0);
    } else if (gameMode === 'cpu-cpu') {
      nextDirections[0] = cpuNextDirection(0);
      nextDirections[1] = cpuNextDirection(1);
    }

    // Move snakes
    let alive = [true, true];
    for (let i = 0; i < 2; i++) {
      if ((gameMode === 'human-human') || (gameMode === 'cpu-human' && i === 1) || (gameMode === 'cpu-cpu')) {
        alive[i] = moveSnake(i);
      } else {
        // Human player not playing this snake, do nothing
        alive[i] = true;
      }
    }

    draw();

    // Check game over conditions
    if (!alive[0] && !alive[1]) {
      endGame('Both snakes collided! It\'s a tie!');
    } else if (!alive[0]) {
      endGame('Player 1 collided! Player 2 wins!');
    } else if (!alive[1]) {
      endGame('Player 2 collided! Player 1 wins!');
    }
  }

  // End game and show game over screen
  function endGame(message) {
    gameRunning = false;
    clearInterval(gameInterval);
    gameoverMessage.textContent = message;
    gameover.hidden = false;
    gameContainer.setAttribute('aria-hidden', 'true');
    gameover.focus();
  }

  // Start game
  function startGame() {
    gameMode = modeSelect.value;
    menu.hidden = true;
    gameover.hidden = true;
    gameContainer.setAttribute('aria-hidden', 'false');
    initGame();
    draw();
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameTick, gameSpeed);
    gameContainer.focus();
  }

  // Restart game
  function restartGame() {
    gameover.hidden = true;
    menu.hidden = false;
    gameContainer.setAttribute('aria-hidden', 'true');
    scores = [0, 0];
    updateScores();
  }

  // Event listeners
  startButton.addEventListener('click', startGame);
  restartButton.addEventListener('click', restartGame);
  window.addEventListener('keydown', e => {
    if (!gameRunning && (e.code === 'Enter' || e.code === 'Space')) {
      if (gameover.hidden) {
        startGame();
      } else {
        restartGame();
      }
    }
    handleKeyDown(e);
  });

  // Focus game container on load for keyboard input
  window.addEventListener('load', () => {
    gameContainer.setAttribute('tabindex', '0');
  });
})();
</script>
</body>
</html>
