<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      padding: 28px;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      color: #2d3748;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #add-btn:hover {
      opacity: 0.9;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 8px 18px;
      border: 1px solid #cbd5e0;
      border-radius: 999px;
      background: #ffffff;
      color: #4a5568;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .filter-btn.active {
      background: #667eea;
      border-color: #667eea;
      color: #ffffff;
    }

    #todo-list {
      list-style: none;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid #edf2f7;
    }

    #todo-list li:last-child {
      border-bottom: none;
    }

    #todo-list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      cursor: pointer;
      word-break: break-word;
    }

    .todo-text.completed {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: #a0aec0;
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e53e3e;
      background: #fff5f5;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
    }

    .empty {
      display: block;
      text-align: center;
      color: #a0aec0;
      padding: 24px 0;
      font-size: 0.95rem;
    }

    @media (max-width: 420px) {
      .app {
        padding: 20px;
      }

      .input-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Todo App</h1>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="What needs to be done?" aria-label="New todo">
      <button id="add-btn">Add</button>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer" id="footer">0 items left</div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "todos";

      var todos = loadTodos();
      var currentFilter = "all";

      var input = document.getElementById("todo-input");
      var addBtn = document.getElementById("add-btn");
      var filterBar = document.getElementById("filter-bar");
      var list = document.getElementById("todo-list");
      var footer = document.getElementById("footer");

      function loadTodos() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            return parsed;
          }
          return [];
        } catch (e) {
          return [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {
          /* storage unavailable; ignore */
        }
      }

      function getFilteredTodos() {
        if (currentFilter === "active") {
          return todos.filter(function (t) { return t.completed === false; });
        }
        if (currentFilter === "completed") {
          return todos.filter(function (t) { return t.completed === true; });
        }
        return todos.slice();
      }

      function addTodo() {
        var text = input.value.trim();
        if (!text) return;
        todos.push({
          id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
          text: text,
          completed: false
        });
        input.value = "";
        render();
      }

      function toggleTodo(id) {
        for (var i = 0; i < todos.length; i++) {
          if (todos[i].id === id) {
            todos[i].completed = !todos[i].completed;
            break;
          }
        }
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter(function (t) { return t.id !== id; });
        render();
      }

      function render() {
        list.textContent = "";

        var visible = getFilteredTodos();

        if (visible.length === 0) {
          var empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = currentFilter === "all" ? "No todos yet. Add one above!" : "Nothing here.";
          list.appendChild(empty);
        }

        visible.forEach(function (todo) {
          var li = document.createElement("li");

          var checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", function () {
            toggleTodo(todo.id);
          });

          var textSpan = document.createElement("span");
          textSpan.className = "todo-text" + (todo.completed ? " completed" : "");
          textSpan.textContent = todo.text;
          textSpan.addEventListener("click", function () {
            toggleTodo(todo.id);
          });

          var deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", function () {
            deleteTodo(todo.id);
          });

          li.appendChild(checkbox);
          li.appendChild(textSpan);
          li.appendChild(deleteBtn);
          list.appendChild(li);
        });

        var remaining = todos.filter(function (t) { return !t.completed; }).length;
        footer.textContent = remaining + (remaining === 1 ? " item" : " items") + " left";

        saveTodos();
      }

      addBtn.addEventListener("click", addTodo);

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          addTodo();
        }
      });

      filterBar.addEventListener("click", function (e) {
        var btn = e.target.closest(".filter-btn");
        if (!btn) return;
        currentFilter = btn.getAttribute("data-filter");
        var buttons = filterBar.querySelectorAll(".filter-btn");
        buttons.forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        render();
      });

      render();
    })();
  </script>
</body>
</html>
