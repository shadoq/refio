<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Network Visualization</title>
<style>
  body{margin:0;background:#05070f;display:flex;justify-content:center;align-items:center;height:100vh;}
  canvas{display:block;background:#05070f;}
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let neurons=[],branches=[],synapses=[],lastTime=0,paused=false;

// Parameters
const params={
  neuronCount:5,
  branchGrowthSpeed:0.02,
  maxBranchDepth:5,
  branchSplitChance:0.3,
  branchCurvature:0.5,
  maxBranchLength:80,
  synapseDistanceThreshold:30,
  synapseGlowStrength:0.5,
  pulseSpeed:0.5,
  pulseFrequency:1,
  pulseBrightness:1,
  backgroundColor:'#05070f',
  branchColor:'#00e5ff',
  accentBranchColor:'#d6ff00',
  synapseColor:'#ff2bd6',
  pulseColor:'#fff36a'
};

// Classes
class Branch{
  constructor(start,end,control,depth,parent){
    this.start=start;this.end=end;this.control=control;this.depth=depth;this.parent=parent;
    this.progress=0;this.thickness=1+Math.random()*1.5;
    this.color=params.branchColor;
  }
  update(dt){this.progress+=params.branchGrowthSpeed*dt; if(this.progress>1)this.progress=1;}
  isComplete(){return this.progress>=1;}
  getTip(){return this.end;}
}
class Neuron{constructor(pos){this.position=pos;this.branches=[];}}
class Synapse{
  constructor(a,b){this.a=a;this.b=b;this.glow=params.synapseGlowStrength;this.pulses=[];this.timer=0;this.key='';}
}
class Pulse{
  constructor(syn){this.synapse=syn;this.progress=0;this.direction=1;}
  update(dt){this.progress+=this.direction*params.pulseSpeed*dt; if(this.progress>=1||this.progress<=0){this.direction*=-1; this.progress=Math.max(0,Math.min(1,this.progress));}}
  getPosition(){const {a,b}=this.synapse;return{x:a.x+(b.x-a.x)*this.progress,y:a.y+(b.y-a.y)*this.progress};}
}

// Initialization
function init(){
  neurons=[];branches=[];synapses=[];
  generateNeurons();
  lastTime=performance.now();
  if(!paused) requestAnimationFrame(animate);
}
function generateNeurons(){
  const center={x:canvas.width/2,y:canvas.height/2};
  for(let i=0;i<params.neuronCount;i++){
    const offset={x:(Math.random()-0.5)*100,y:(Math.random()-0.5)*100};
    const pos={x:center.x+offset.x,y:center.y+offset.y};
    const neuron=new Neuron(pos);
    neurons.push(neuron);
    const root=createBranch(pos,pos,pos,0,null);
    root.color=params.branchColor;
    neuron.branches.push(root);
    branches.push(root);
  }
}
function createBranch(start,end,control,depth,parent){
  const branch=new Branch(start,end,control,depth,parent);
  return branch;
}
function createChildBranch(parent){
  const start=parent.end;
  const length=20+Math.random()*(params.maxBranchLength-20);
  const angle=Math.atan2(parent.end.y-parent.start.y,parent.end.x-parent.start.x);
  const offsetAngle=(Math.random()-0.5)*Math.PI/2;
  const childAngle=angle+offsetAngle;
  const end={x:start.x+length*Math.cos(childAngle),y:start.y+length*Math.sin(childAngle)};
  const control={x:(start.x+end.x)/2+(Math.random()-0.5)*params.branchCurvature*length,
                 y:(start.y+end.y)/2+(Math.random()-0.5)*params.branchCurvature*length};
  const branch=createBranch(start,end,control,parent.depth+1,parent);
  branch.color=params.accentBranchColor;
  return branch;
}
function detectSynapses(){
  const tips=branches.filter(b=>b.isComplete()).map(b=>b.end);
  const existing=new Set(synapses.map(s=>s.key));
  for(let i=0;i<tips.length;i++){
    for(let j=i+1;j<tips.length;j++){
      const a=tips[i],b=tips[j];
      const dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
      if(dist<params.synapseDistanceThreshold){
        const key=`${Math.round(a.x)},${Math.round(a.y)}-${Math.round(b.x)},${Math.round(b.y)}`;
        if(!existing.has(key)){
          const syn=new Synapse(a,b);syn.key=key;
          synapses.push(syn);existing.add(key);
        }
      }
    }
  }
}
function animate(time){
  const dt=(time-lastTime)/1000;lastTime=time;
  branches.forEach(b=>{
    if(!b.isComplete()){
      b.update(dt);
      if(b.isComplete()){
        if(b.depth<params.maxBranchDepth){
          const num=Math.floor(Math.random()*3)+1;
          for(let i=0;i<num;i++) if(Math.random()<params.branchSplitChance) branches.push(createChildBranch(b));
        }
      }
    }
  });
  detectSynapses();
  synapses.forEach(s=>{
    s.timer+=dt;
    if(s.timer>1/params.pulseFrequency){s.pulses.push(new Pulse(s));s.timer=0;}
    s.pulses.forEach(p=>p.update(dt));
  });
  draw();
  if(!paused) requestAnimationFrame(animate);
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=params.backgroundColor;ctx.fillRect(0,0,canvas.width,canvas.height);
  branches.forEach(b=>{
    if(!b.isComplete()) return;
    ctx.lineWidth=b.thickness;
    ctx.strokeStyle=b.color;
    ctx.shadowColor=b.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(b.start.x,b.start.y);
    ctx.quadraticCurveTo(b.control.x,b.control.y,b.end.x,b.end.y);
    ctx.stroke();
  });
  synapses.forEach(s=>{
    ctx.lineWidth=2;
    ctx.strokeStyle=params.synapseColor;
    ctx.shadowColor=params.synapseColor;ctx.shadowBlur=12*params.synapseGlowStrength;
    ctx.beginPath();ctx.moveTo(s.a.x,s.a.y);ctx.lineTo(s.b.x,s.b.y);ctx.stroke();
    s.pulses.forEach(p=>{
      const pos=p.getPosition();
      ctx.globalAlpha=params.pulseBrightness;
      ctx.fillStyle=params.pulseColor;
      ctx.shadowColor=params.pulseColor;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(pos.x,pos.y,4,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  });
}
function clearCanvas(){neurons=[];branches=[];synapses=[];}
function togglePause(){paused=!paused;if(!paused){lastTime=performance.now();requestAnimationFrame(animate);}}
window.onload=init;

// GUI
const gui=new dat.GUI();
const gGrowth=gui.addFolder('Growth');
gGrowth.add(params,'neuronCount',3,6,1).onChange(init);
gGrowth.add(params,'branchGrowthSpeed',0.01,0.1,0.01);
gGrowth.add(params,'maxBranchDepth',1,10,1);
gGrowth.add(params,'branchSplitChance',0.1,0.9,0.05);
gGrowth.add(params,'branchCurvature',0.1,1,0.05);
gGrowth.add(params,'maxBranchLength',20,120,5);
const gSynapse=gui.addFolder('Synapses');
gSynapse.add(params,'synapseDistanceThreshold',10,100,5);
gSynapse.add(params,'synapseGlowStrength',0.1,1,0.05);
const gPulse=gui.addFolder('Pulses');
gPulse.add(params,'pulseSpeed',0.1,1,0.05);
gPulse.add(params,'pulseFrequency',0.1,5,0.1);
gPulse.add(params,'pulseBrightness',0.5,2,0.1);
const gVisual=gui.addFolder('Visuals');
gVisual.addColor(params,'backgroundColor');
gVisual.addColor(params,'branchColor');
gVisual.addColor(params,'accentBranchColor');
gVisual.addColor(params,'synapseColor');
gVisual.addColor(params,'pulseColor');
gui.add({regenerate:init},'regenerate').name('Regenerate Network');
gui.add({clear:clearCanvas},'clear').name('Clear Canvas');
gui.add({pause:togglePause},'pause').name('Pause/Resume');
</script>
</body>
</html>
