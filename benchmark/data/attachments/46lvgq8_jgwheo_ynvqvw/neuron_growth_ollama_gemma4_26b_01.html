<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px #101a3a;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        canvas {
            display: block;
            background-color: #05070f;
        }

        /* Scanline effect overlay */
        #canvas-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
</div>

<script>
/**
 * NEURAL NETWORK GROWTH SIMULATION
 * A self-contained generative art piece.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// --- Configuration & State ---
const params = {
    // Growth
    neuronCount: 5,
    growthSpeed: 2,
    maxDepth: 5,
    splitChance: 0.15,
    curvature: 0.5,
    maxBranchLength: 60,
    
    // Synapses
    synapseThreshold: 40,
    synapseGlow: 10,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,
    
    // Visuals
    bgColor: '#05070f',
    bgGlow: '#101a3a',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    
    // Actions
    regenerate: () => initSimulation(),
    clear: () => clearCanvas(),
    pause: () => { paused = !paused; }
};

let paused = false;
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let animationFrameId;

// --- Classes ---

class Branch {
    constructor(startPos, angle, depth, thickness, parent = null) {
        this.startPos = { ...startPos };
        this.angle = angle;
        this.depth = depth;
        this.thickness = thickness;
        this.parent = parent;
        
        this.currentLength = 0;
        this.targetLength = params.maxBranchLength * (1 - (depth * 0.15));
        this.endPos = { ...startPos };
        
        this.isGrowing = true;
        this.children = [];
        this.controlPoint = null; // For quadratic curves
    }

    update() {
        if (!this.isGrowing) return;

        const step = params.growthSpeed;
        this.currentLength += step;

        // Calculate new end position
        this.endPos.x = this.startPos.x + Math.cos(this.angle) * this.currentLength;
        this.endPos.y = this.startPos.y + Math.sin(this.angle) * this.currentLength;

        // Create control point for organic curve
        if (this.currentLength > step * 2) {
            const midX = (this.startPos.x + this.endPos.x) / 2;
            const midY = (this.startPos.y + this.endPos.y) / 2;
            const offset = params.curvature * 10;
            this.controlPoint = {
                x: midX + Math.cos(this.angle + Math.PI/2) * offset,
                y: midymY + Math.sin(this.angle + Math.PI/2) * offset
            };
        }

        if (this.currentLength >= this.targetLength) {
            this.isGrowing = false;
            this.checkSplit();
            this.checkSynapses();
        }
    }

    checkSplit() {
        if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
            const numSplits = Math.random() > 0.8 ? 2 : 1;
            for (let i = 0; i < numSplits; i++) {
                const newAngle = this.angle + (Math.random() - 0.5) * 1.2;
                const newThickness = this.thickness * 0.8;
                const child = new Branch(
                    { ...this.endPos },
                    newAngle,
                    this.depth + 1,
                    newThickness,
                    this
                );
                this.children.push(child);
                branches.push(child);
            }
        }
    }

    checkSynapses() {
        // Check distance to other branch ends
        branches.forEach(other => {
            if (other === this || other.isGrowing) return;
            
            const dist = Math.hypot(this.endPos.x - other.endPos.x, this.endPos.y - other.endPos.y);
            if (dist < params.synapseThreshold) {
                // Check if synapse already exists
                const exists = synapses.some(s => 
                    (s.a === this && s.b === other) || (s.a === other && s.b === this)
                );
                if (!exists) {
                    synapses.push({ a: this, b: other, progress: 0 });
                }
            }
        });
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = this.thickness;
        ctx.strokeStyle = this.depth % 2 === 0 ? params.branchColor : params.accentColor;
        ctx.lineCap = 'round';
        
        ctx.moveTo(this.startPos.x, this.startPos.y);
        
        if (this.depth > 0 && this.currentLength > 5) {
            // Simple quadratic curve approximation using the endPos
            // For a true smooth curve, we'd need to store control points per segment
            // Here we use a simple line for performance, but add a slight jitter
            ctx.lineTo(this.endPos.x, this.endPos.y);
        } else {
            ctx.lineTo(this.endPos.x, this.endPos.y);
        }
        ctx.stroke();

        // Draw children
        this.children.forEach(child => child.draw(ctx));
    }
}

class Neuron {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.rootBranches = [];
    }

    grow() {
        const initialAngles = [0, Math.PI/2, Math.PI, Math.PI * 1.5];
        initialAngles.forEach(angle => {
            const b = new Branch({x: this.x, y: this.y}, angle, 0, 4, this);
            this.rootBranches.push(b);
            branches.push(b);
        });
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 15;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        this.rootBranches.forEach(b => b.draw(ctx));
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
        this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
    }

    update() {
        this.progress += this.speed;
        if (this.progress >= 1) {
            return false; // Finished
        }
        return true;
    }

    draw(ctx) {
        const start = this.synapse.a.endPos;
        const end = this.synapse.b.endPos;
        const x = start.x + (end.x - start.x) * this.progress;
        const y = start.y + (end.y - start.y) * this.progress;

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// --- Core Logic ---

function initSimulation() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    
    const count = Math.floor(params.neuronCount) + 2;
    for (let i = 0; i < count; i++) {
        const x = canvas.width/2 + (Math.random() - 0.5) * 200;
        const y = canvas.height/gsub_y(i); // helper
        const n = new Neuron(x, y);
        neurons.push(n);
        n.grow();
    }
}

function gsub_y(i) {
    return canvas.height/2 + (Math.random() - 0.5) * 200;
}

function clearCanvas() {
    branches = [];
    synapses = [];
    pulses = [];
    neurons = [];
    initSimulation();
}

function update() {
    if (paused) return;

    // Update branches
    branches.forEach(b => b.update());

    // Update synapses (trigger pulses)
    synapses.forEach(s => {
        if (Math.random() < params.pulseFrequency && !pulses.some(p => p.synapse === s)) {
            pulses.push(new Pulse(s));
        }
    });

    // Update pulses
    for (let i = pulses.length - 1; i >= 0; i--) {
        if (!pulses[i].update()) {
            pulses.splice(i, 1);
        }
    }
}

function draw() {
    // Background
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Background Glow
    const grad = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, 0,
        canvas.width/2, canvas.height/2, canvas.width/1.2
    );
    grad.addColorStop(0, params.bgGlow);
    grad.addColorStop(1, params.bgColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Synapses
    ctx.lineWidth = 1;
    ctx.shadowBlur = params.synapseGlow;
    ctx.shadowColor = params.synapseColor;
    ctx.strokeStyle = params.synapseColor;
    ctx.globalAlpha = 0.4;
    
    synapses.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.a.endPos.x, s.a.endPos.y);
        ctx.lineTo(s.b.endPos.x, s.b.endPos.y);
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;

    // Draw Branches and Neurons
    neurons.forEach(n => n.draw(ctx));

    // Draw Pulses
    ctx.globalAlpha = params.pulseBrightness;
    pulses.forEach(p => p.draw(ctx));
    ctx.globalAlpha = 1.0;

    // Grid/Scanline overlay (subtle)
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let i=0; i<canvas.height; i+=50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }
}

function loop() {
    update();
    draw();
    animationFrameId = requestAnimationFrame(loop);
}

// --- GUI Setup ---

function setupGUI() {
    const gui = new dat.GUI();
    
    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 1, 10).step(1).name('Neuron Count');
    f1Growth.add(params, 'growthSpeed', 0.5, 5).name('Growth Speed');
    fGrowth.add(params, 'maxDepth', 1, 8).step(1).name('Max Depth');
    fGrowth.add(params, 'splitChance', 0, 0.5).name('Split Chance');
    fGrowth.add(params, 'maxBranchLength', 20, 150).name('Max Length');
    fGrowth.add(params, 'curvature', 0, 1).name('Curvature');
    fGrowth.open();

    const fSynapse = gui.addFolder('Synapses');
    fSynapse.add(params, 'synapseThreshold', 10, 100).name('Threshold');
    fSynapse.add(params, 'synapseGlow', 0, 20).name('Glow Strength');
    fSynapse.open();

    const fPulse = gui.addFolder('Pulses');
    fPulse.add(params, 'pulseSpeed', 0.001, 0.05).name('Pulse Speed');
    fPulse.add(params, 'pulseFrequency', 0, 0.05).name('Frequency');
    fPulse.add(params, 'pulseBrightness', 0.1, 2.0).name('Brightness');
    fPulse.open();

    const fVisuals = gui.addFolder('Visuals');
    fVisuals.addColor(params, 'bgColor').name('Background');
    fVisuals.addColor(params, 'branchColor').name('Branch');
    fVisuals.addColor(params, 'accentColor').name('Accent');
    fVisuals.addColor(params, 'synapseColor').name('Synapse');
    fVisuals.addColor(params, 'pulseColor').name('Pulse');
    fVisuals.open();

    const fActions = gui.addFolder('Actions');
    fActions.add(params, 'regenerate').name('Regenerate');
    fActions.add(params, 'clear').name('Clear Canvas');
    fActions.add(params, 'pause').name('Pause/Resume');
    fopen(fActions);
}

// Initialize
initSimulation();
setupGUI();
loop();

</script>
</body>
</html>
