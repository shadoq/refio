<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    color: #333;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    font-size: 1rem;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: #3498db; }
  .input-row button {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    background: #3498db;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s;
  }
  .input-row button:hover { background: #2980b9; }
  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #e9ecef;
    border-radius: 8px;
    padding: 4px;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    font-size: .9rem;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    transition: all .2s;
    color: #666;
  }
  .filters button.active {
    background: #fff;
    color: #3498db;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: opacity .2s;
  }
  .todo-item .checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid #ccc;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
  }
  .todo-item .checkbox:hover { border-color: #3498db; }
  .todo-item.done .checkbox {
    background: #27ae60;
    border-color: #27ae60;
  }
  .todo-item.done .checkbox::after {
    content: '✓';
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .todo-item .text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }
  .todo-item.done .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .todo-item .delete-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #ccc;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
  }
  .todo-item .delete-btn:hover { background: #fee; color: #e74c3c; }
  .empty {
    text-align: center;
    padding: 40px 0;
    color: #aaa;
    font-size: 1rem;
  }
  .counter {
    text-align: center;
    margin-top: 12px;
    font-size: .85rem;
    color: #999;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Todos</h1>
  <div class="input-row">
    <input type="text" id="todo-input" placeholder="What needs to be done?" autofocus>
    <button id="add-btn">Add</button>
  </div>
  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todo-list"></ul>
  <div class="counter" id="counter"></div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'todos_app_data';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  const input = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('todo-list');
  const counter = document.getElementById('counter');
  const filterBtns = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo(text) {
    text = text.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function getFiltered() {
    if (currentFilter === 'active') return todos.filter(t => !t.done);
    if (currentFilter === 'completed') return todos.filter(t => t.done);
    return todos;
  }

  function render() {
    const filtered = getFiltered();
    if (filtered.length === 0) {
      const msg = currentFilter === 'all' ? 'No todos yet. Add one above!'
        : currentFilter === 'active' ? 'No active todos.'
        : 'No completed todos.';
      list.innerHTML = '<li class="empty">' + msg + '</li>';
    } else {
      list.innerHTML = filtered.map(t =>
        '<li class="todo-item' + (t.done ? ' done' : '') + '">' +
          '<span class="checkbox" data-id="' + t.id + '"></span>' +
          '<span class="text">' + escapeHtml(t.text) + '</span>' +
          '<button class="delete-btn" data-id="' + t.id + '" title="Delete">&times;</button>' +
        '</li>'
      ).join('');
    }
    const active = todos.filter(t => !t.done).length;
    counter.textContent = todos.length ? active + ' item' + (active !== 1 ? 's' : '') + ' left' : '';
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  addBtn.addEventListener('click', () => addTodo(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(input.value); });

  list.addEventListener('click', e => {
    const id = Number(e.target.dataset.id);
    if (e.target.classList.contains('checkbox')) toggleTodo(id);
    if (e.target.classList.contains('delete-btn')) deleteTodo(id);
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
