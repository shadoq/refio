<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #eee;
  overflow: hidden;
}
#game-wrapper {
  position: relative;
}
canvas {
  border: 3px solid #16213e;
  border-radius: 4px;
  background: #0f3460;
  display: block;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 30, 0.88);
  z-index: 10;
  transition: opacity 0.3s;
}
#ui-overlay.hidden { display: none; }
#ui-overlay h1 {
  font-size: 42px;
  color: #e94560;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
}
#ui-overlay h2 {
  font-size: 26px;
  color: #e94560;
  margin-bottom: 8px;
}
#ui-overlay p {
  font-size: 16px;
  color: #aaa;
  margin: 4px 0;
}
#ui-overlay .subtitle {
  font-size: 18px;
  color: #ccc;
  margin-bottom: 24px;
}
.menu-btn {
  display: block;
  width: 260px;
  padding: 14px 0;
  margin: 8px 0;
  font-size: 18px;
  font-weight: 600;
  border: 2px solid #e94560;
  background: transparent;
  color: #e94560;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.menu-btn:hover, .menu-btn:focus {
  background: #e94560;
  color: #fff;
  outline: none;
}
#scoreboard {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 602px;
  margin-bottom: 8px;
  padding: 6px 12px;
  background: #16213e;
  border-radius: 6px;
  font-size: 18px;
  font-weight: 600;
}
.score-p1 { color: #00d2ff; }
.score-p2 { color: #ffd700; }
#controls-info {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
  text-align: center;
}
</style>
</head>
<body>

<div id="scoreboard">
  <span class="score-p1" id="score1">Player 1: 0</span>
  <span id="mode-label">Mode</span>
  <span class="score-p2" id="score2">Player 2: 0</span>
</div>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay">
    <h1>🐍 Snake Battle</h1>
    <p class="subtitle">Choose a game mode</p>
    <button class="menu-btn" onclick="startGame('hvh')">🎮 Human vs Human</button>
    <button class="menu-btn" onclick="startGame('cvh')">🤖 CPU vs Human</button>
    <button class="menu-btn" onclick="startGame('cvc')">🤖 CPU vs CPU</button>
    <p style="margin-top:18px; color:#555; font-size:13px;">P1: W/A/S/D &nbsp;|&nbsp; P2: Arrow Keys</p>
  </div>
</div>

<div id="controls-info">
  Press <b>R</b> to restart &nbsp;|&nbsp; Press <b>Esc</b> for menu
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('ui-overlay');
const score1El = document.getElementById('score1');
const score2El = document.getElementById('score2');
const modeLabel = document.getElementById('mode-label');

const GRID = 30;
const CELL = 20;
canvas.width = GRID * CELL;
canvas.height = GRID * CELL;

const COLORS = {
  bg: '#0f3460',
  grid: '#162447',
  snake1Head: '#00d2ff',
  snake1Body: '#0099cc',
  snake2Head: '#ffd700',
  snake2Body: '#cc9900',
  food: '#e94560',
  foodGlow: 'rgba(233, 69, 96, 0.3)',
  wall: '#1a1a2e'
};

let gameRunning = false;
let animFrame = null;
let lastTime = 0;
let tickInterval = 100;
let mode = '';
let snakes = [];
let foods = [];
let gameOverShown = false;

class Snake {
  constructor(sx, sy, dx, dy, colorHead, colorBody, isCPU, id) {
    this.body = [];
    for (let i = 0; i < 3; i++) this.body.push({ x: sx - dx * i, y: sy - dy * i });
    this.dir = { x: dx, y: dy };
    this.nextDir = { x: dx, y: dy };
    this.colorHead = colorHead;
    this.colorBody = colorBody;
    this.isCPU = isCPU;
    this.id = id;
    this.alive = true;
    this.score = 0;
    this.grow = 0;
  }

  setDir(dx, dy) {
    if (this.dir.x + dx === 0 && this.dir.y + dy === 0) return;
    this.nextDir = { x: dx, y: dy };
  }

  head() { return this.body[0]; }

  update() {
    if (!this.alive) return;
    this.dir = { ...this.nextDir };
    const h = this.head();
    const nh = { x: h.x + this.dir.x, y: h.y + this.dir.y };

    if (nh.x < 0 || nh.x >= GRID || nh.y < 0 || nh.y >= GRID) {
      this.alive = false;
      return;
    }

    this.body.unshift(nh);

    for (const f of foods) {
      if (f.x === nh.x && f.y === nh.y) {
        this.score++;
        this.grow += 2;
        spawnFood(f);
        return;
      }
    }

    if (this.grow > 0) {
      this.grow--;
    } else {
      this.body.pop();
    }
  }

  checkCollision(otherSnake) {
    if (!this.alive) return;
    const h = this.head();
    const bodies = [...this.body.slice(1), ...otherSnake.body];
    for (const seg of bodies) {
      if (seg.x === h.x && seg.y === h.y) {
        this.alive = false;
        return;
      }
    }
  }

  cpuThink() {
    if (!this.alive) return;
    const h = this.head();
    const target = this.findClosestFood();
    if (!target) return;

    const allBodies = [];
    for (const s of snakes) {
      if (s.alive) for (let i = 1; i < s.body.length; i++) allBodies.push(s.body[i]);
    }

    const directions = [
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: 0 },
      { x: 1, y: 0 }
    ];

    let bestDir = null;
    let bestDist = Infinity;

    for (const d of directions) {
      if (this.dir.x + d.x === 0 && this.dir.y + d.y === 0) continue;
      const nx = h.x + d.x;
      const ny = h.y + d.y;
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
      let blocked = false;
      for (const seg of allBodies) {
        if (seg.x === nx && seg.y === ny) { blocked = true; break; }
      }
      if (blocked) continue;
      const dist = Math.abs(nx - target.x) + Math.abs(ny - target.y);
      if (dist < bestDist) {
        bestDist = dist;
        bestDir = d;
      }
    }

    if (bestDir) {
      this.setDir(bestDir.x, bestDir.y);
    } else {
      for (const d of directions) {
        if (this.dir.x + d.x === 0 && this.dir.y + d.y === 0) continue;
        const nx = h.x + d.x;
        const ny = h.y + d.y;
        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
        let blocked = false;
        for (const seg of allBodies) {
          if (seg.x === nx && seg.y === ny) { blocked = true; break; }
        }
        if (!blocked) { this.setDir(d.x, d.y); return; }
      }
    }
  }

  findClosestFood() {
    const h = this.head();
    let closest = null;
    let minDist = Infinity;
    for (const f of foods) {
      const dist = Math.abs(f.x - h.x) + Math.abs(f.y - h.y);
      if (dist < minDist) { minDist = dist; closest = f; }
    }
    return closest;
  }

  draw() {
    for (let i = this.body.length - 1; i >= 0; i--) {
      const seg = this.body[i];
      const x = seg.x * CELL;
      const y = seg.y * CELL;
      if (i === 0) {
        ctx.fillStyle = this.alive ? this.colorHead : '#555';
        ctx.shadowColor = this.colorHead;
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = this.alive ? this.colorBody : '#444';
        ctx.shadowBlur = 0;
      }
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 5 : 3);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

function spawnFood(replace) {
  const occupied = new Set();
  for (const s of snakes) {
    for (const seg of s.body) occupied.add(seg.x + ',' + seg.y);
  }
  for (const f of foods) occupied.add(f.x + ',' + f.y);

  let attempts = 0;
  let fx, fy;
  do {
    fx = Math.floor(Math.random() * GRID);
    fy = Math.floor(Math.random() * GRID);
    attempts++;
  } while (occupied.has(fx + ',' + fy) && attempts < 1000);

  if (replace) {
    replace.x = fx;
    replace.y = fy;
  } else {
    foods.push({ x: fx, y: fy });
  }
}

function drawGrid() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, GRID * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(GRID * CELL, i * CELL);
    ctx.stroke();
  }
}

function drawFoods() {
  for (const f of foods) {
    const cx = f.x * CELL + CELL / 2;
    const cy = f.y * CELL + CELL / 2;
    ctx.shadowColor = COLORS.food;
    ctx.shadowBlur = 12;
    ctx.fillStyle = COLORS.food;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLORS.foodGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL / 2 + 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateScoreboard() {
  score1El.textContent = snakes[0] ? `P1${snakes[0].isCPU ? ' (CPU)' : ''}: ${snakes[0].score}` : '';
  score2El.textContent = snakes[1] ? `P2${snakes[1].isCPU ? ' (CPU)' : ''}: ${snakes[1].score}` : '';
}

function gameLoop(timestamp) {
  if (!gameRunning) return;
  animFrame = requestAnimationFrame(gameLoop);

  if (timestamp - lastTime < tickInterval) return;
  lastTime = timestamp;

  for (const s of snakes) {
    if (s.isCPU) s.cpuThink();
  }

  for (const s of snakes) s.update();

  for (const s of snakes) {
    for (const other of snakes) {
      if (s === other) continue;
      s.checkCollision(other);
    }
  }

  updateScoreboard();
  drawGrid();
  drawFoods();
  for (const s of snakes) s.draw();

  const alive = snakes.filter(s => s.alive);
  if (alive.length <= 1 && snakes.length > 1 || alive.length === 0) {
    gameRunning = false;
    gameOverShown = true;
    showGameOver(alive);
  }
}

function showGameOver(alive) {
  overlay.classList.remove('hidden');
  let msg = '';
  if (alive.length === 0) {
    msg = "It's a Draw!";
  } else if (alive.length === 1) {
    const winner = alive[0].id === 1 ? 'Player 1' : 'Player 2';
    msg = `${winner} Wins!`;
  }
  overlay.innerHTML = `
    <h1>Game Over</h1>
    <h2>${msg}</h2>
    <p style="font-size:20px; margin:10px 0;">
      <span class="score-p1">P1: ${snakes[0].score}</span>
      &nbsp;&nbsp;
      <span class="score-p2">P2: ${snakes[1] ? snakes[1].score : 0}</span>
    </p>
    <p style="color:#888; margin: 12px 0;">Press <b>R</b> to restart or <b>Esc</b> for menu</p>
    <button class="menu-btn" onclick="backToMenu()">📋 Main Menu</button>
    <button class="menu-btn" onclick="restartGame()">🔄 Play Again</button>
  `;
}

function backToMenu() {
  gameRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>🐍 Snake Battle</h1>
    <p class="subtitle">Choose a game mode</p>
    <button class="menu-btn" onclick="startGame('hvh')">🎮 Human vs Human</button>
    <button class="menu-btn" onclick="startGame('cvh')">🤖 CPU vs Human</button>
    <button class="menu-btn" onclick="startGame('cvc')">🤖 CPU vs CPU</button>
    <p style="margin-top:18px; color:#555; font-size:13px;">P1: W/A/S/D &nbsp;|&nbsp; P2: Arrow Keys</p>
  `;
  modeLabel.textContent = 'Mode';
  score1El.textContent = 'Player 1: 0';
  score2El.textContent = 'Player 2: 0';
  drawGrid();
}

function startGame(m) {
  mode = m;
  snakes = [];
  foods = [];
  gameOverShown = false;

  const p1CPU = m === 'cvh' || m === 'cvc';
  const p2CPU = m === 'cvc';

  const s1 = new Snake(5, 5, 1, 0, COLORS.snake1Head, COLORS.snake1Body, p1CPU, 1);
  const s2 = new Snake(24, 24, -1, 0, COLORS.snake2Head, COLORS.snake2Body, p2CPU, 2);
  snakes = [s1, s2];

  foods = [];
  spawnFood();
  spawnFood();

  const labels = { hvh: 'Human vs Human', cvh: 'CPU vs Human', cvc: 'CPU vs CPU' };
  modeLabel.textContent = labels[m];

  overlay.classList.add('hidden');
  gameRunning = true;
  lastTime = 0;
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(gameLoop);
}

function restartGame() {
  if (mode) startGame(mode);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (gameOverShown || gameRunning) restartGame();
    return;
  }
  if (e.key === 'Escape') {
    backToMenu();
    return;
  }

  if (!gameRunning || !snakes[0]) return;

  // Player 1: WASD
  switch (e.key.toLowerCase()) {
    case 'w': snakes[0].setDir(0, -1); break;
    case 's': snakes[0].setDir(0, 1); break;
    case 'a': snakes[0].setDir(-1, 0); break;
    case 'd': snakes[0].setDir(1, 0); break;
  }

  // Player 2: Arrows (only if human)
  if (snakes[1] && !snakes[1].isCPU && snakes[1].alive) {
    switch (e.key) {
      case 'ArrowUp': snakes[1].setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': snakes[1].setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': snakes[1].setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': snakes[1].setDir(1, 0); e.preventDefault(); break;
    }
  }
});

// Initial draw
drawGrid();
</script>
</body>
</html>
