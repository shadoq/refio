<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .todo-shell {
      background: #fff;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 32px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #0f172a;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5f5;
      font-size: 16px;
    }

    .input-row button {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .input-row button:hover {
      transform: translateY(-1px);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      color: #0f172a;
    }

    .filters button.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    li label {
      flex: 1;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    li input[type=checkbox] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    li .todo-text {
      font-size: 16px;
      color: #111827;
      transition: color 0.2s ease;
    }

    li.completed .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    li button.delete {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 20px 0;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <section class="todo-shell">
    <h1>Todo List</h1>
    <div class="input-row">
      <input id="new-todo" placeholder="Add new todo" />
      <button id="add-btn" aria-label="Add todo">Add</button>
    </div>
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state">No tasks yet.</p>
  </section>

  <script>
    const listEl = document.getElementById("todo-list");
    const inputEl = document.getElementById("new-todo");
    const addBtn = document.getElementById("add-btn");
    const filterBtns = document.querySelectorAll(".filters button");
    const emptyStateEl = document.getElementById("empty-state");

    let todos = JSON.parse(localStorage.getItem("todos")) || [];
    let currentFilter = "all";

    const render = () => {
      listEl.innerHTML = "";
      const filteredTodos = todos.filter((todo) => {
        if (currentFilter === "active") return !todo.completed;
        if (currentFilter === "completed") return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        emptyStateEl.style.display = "block";
      } else {
        emptyStateEl.style.display = "none";
      }

      filteredTodos.forEach((todo) => {
        const li = document.createElement("li");
        li.className = todo.completed ? "completed" : "";

        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.addEventListener("change", () => {
          todo.completed = checkbox.checked;
          saveTodos();
          render();
        });

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete";
        deleteBtn.textContent = "×";
        deleteBtn.addEventListener("click", () => {
          todos = todos.filter((t) => t.id !== todo.id);
          saveTodos();
          render();
        });

        label.appendChild(checkbox);
        label.appendChild(span);
        li.appendChild(label);
        li.appendChild(deleteBtn);
        listEl.appendChild(li);
      });
    };

    const saveTodos = () => {
      localStorage.setItem("todos", JSON.stringify(todos));
    };

    addBtn.addEventListener("click", () => {
      const text = inputEl.value.trim();
      if (text === "") return;
      todos.push({ id: crypto.randomUUID(), text, completed: false });
      inputEl.value = "";
      saveTodos();
      render();
    });

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addBtn.click();
      }
    });

    filterBtns.forEach((button) => {
      button.addEventListener("click", () => {
        filterBtns.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        currentFilter = button.getAttribute("data-filter");
        render();
      });
    });

    render();
  </script>
</body>
</html>
