<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Neuron Growth</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(16,26,58,0.35), rgba(5,7,15,0.95) 65%);
  pointer-events: none;
}
canvas {
  width: 800px;
  height: 800px;
  display: block;
  background: #05070f;
  box-shadow: 0 0 45px rgba(0,229,255,0.08), 0 0 120px rgba(255,43,214,0.05);
}
.dg {
  z-index: 10 !important;
}
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2;
const P = {
  bg:'#05070f', glow:'#101a3a', branch:'#00e5ff', accent:'#d6ff00',
  syn:'#ff2bd6', pulse:'#fff36a', ui:'#ffd400'
};
const s = {
  neuronCount: 5, branchGrowthSpeed: 0.9, maxBranchDepth: 4, branchSplitChance: 0.22,
  branchCurvature: 0.28, maxBranchLength: 120, synapseDistanceThreshold: 34,
  synapseGlowStrength: 1.2, pulseSpeed: 0.65, pulseFrequency: 0.65, pulseBrightness: 1.2,
  backgroundColor: P.bg, branchColor: P.branch, accentBranchColor: P.accent,
  synapseColor: P.syn, pulseColor: P.pulse
};
let running = true, neurons = [], synapses = [], pulses = [], nextId = 1, lastT = 0;

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
function lerp(a,b,t){ return a + (b-a)*t; }
function lerpPt(a,b,t){ return {x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t)}; }
function keyOf(a,b){ return a.id < b.id ? a.id + ':' + b.id : b.id + ':' + a.id; }

function makeBranch(parent, x, y, ang, depth, neuron){
  return { id: nextId++, parent, neuron, x, y, px:x, py:y, ang, depth, len:0, target: rand(18,42), seg: [], w: rand(1.2, 2.6), done:false, childCount:0, tip:x===undefined?{x,y}:{x,y} };
}
function makeNeuron(x,y){
  const n = { id: nextId++, x, y, branches: [], color: Math.random()<0.5 ? s.branchColor : s.accentBranchColor };
  const base = Math.random() * Math.PI * 2;
  const count = 3 + Math.floor(Math.random()*3);
  for(let i=0;i<count;i++) n.branches.push(makeBranch(null, x, y, base + i*(Math.PI*2/count) + rand(-0.4,0.4), 0, n));
  return n;
}
function regenerate(){
  neurons = []; synapses = []; pulses = []; nextId = 1;
  const count = 3 + Math.floor(Math.random()*4);
  for(let i=0;i<count;i++) neurons.push(makeNeuron(CX + rand(-40,40), CY + rand(-40,40)));
}
function clearCanvas(){ synapses = []; pulses = []; }
function toggleRun(){ running = !running; }

function stepBranch(b, dt){
  if(b.done) return;
  const sp = s.branchGrowthSpeed * dt * 58;
  b.len += sp;
  const t = clamp(b.len / b.target, 0, 1);
  const wob = Math.sin((b.len*0.08) + b.depth*1.7) * 0.12;
  const cur = b.ang + wob * s.branchCurvature;
  const nx = b.x + Math.cos(cur) * sp;
  const ny = b.y + Math.sin(cur) * sp;
  b.seg.push({x:nx, y:ny});
  b.tip = {x:nx, y:ny};
  if(b.seg.length > 16) b.seg.shift();
  if(b.len >= b.target){
    b.done = true;
    b.tip = {x:nx, y:ny};
    if(b.depth < s.maxBranchDepth && b.childCount < 3){
      const chance = s.branchSplitChance + (Math.random()*0.2);
      if(Math.random() < chance){
        const c = 1 + (Math.random() < 0.45 ? 1 : 0);
        for(let i=0;i<c;i++){
          const na = cur + rand(-0.9,0.9);
          const nb = makeBranch(b, nx, ny, na, b.depth + 1, b.neuron);
          nb.target = rand(16, Math.max(22, s.maxBranchLength * (0.82 - b.depth*0.12)));
          b.neuron.branches.push(nb);
          b.childCount++;
        }
      }
    }
  }
}

function update(dt){
  for(const n of neurons) for(const b of n.branches) stepBranch(b, dt);
  const tips = [];
  for(const n of neurons) for(const b of n.branches) if(b.done) tips.push({branch:b, neuron:n, x:b.tip.x, y:b.tip.y});
  for(let i=0;i<tips.length;i++) for(let j=i+1;j<tips.length;j++){
    const a = tips[i], b = tips[j];
    if(a.neuron === b.neuron) continue;
    if(dist(a,b) < s.synapseDistanceThreshold){
      const k = keyOf(a.branch, b.branch);
      if(!synapses.some(v => v.k === k)){
        synapses.push({k, a:{x:a.x,y:a.y}, b:{x:b.x,y:b.y}, phase:Math.random()*Math.PI*2, born:performance.now()});
      }
    }
  }
  if(Math.random() < s.pulseFrequency * dt * 0.8 && synapses.length){
    const syn = synapses[(Math.random()*synapses.length)|0];
    pulses.push({syn, t:0, dir: Math.random()<0.5 ? 1 : -1});
  }
  for(let i=pulses.length-1;i>=0;i--){
    const p = pulses[i];
    p.t += dt * s.pulseSpeed;
    if(p.t >= 1) pulses.splice(i,1);
  }
}

function drawBackground(time){
  ctx.fillStyle = s.backgroundColor;
  ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 360);
  g.addColorStop(0, 'rgba(16,26,58,0.55)');
  g.addColorStop(1, 'rgba(5,7,15,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 1;
  for(let y=0;y<H;y+=24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y + ((time*18)%3), W, 1);
}

function drawBranch(b){
  const pts = [{x:b.x,y:b.y}, ...b.seg];
  if(pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const p = pts[i], n = pts[i+1];
    ctx.quadraticCurveTo(p.x, p.y, (p.x+n.x)/2, (p.y+n.y)/2);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last.x, last.y);
  ctx.lineWidth = b.w * (b.depth<2 ? 1.2 : 1);
  ctx.strokeStyle = b.depth % 2 ? s.accentBranchColor : s.branchColor;
  ctx.shadowBlur = 18;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawSynapse(sy, time){
  const p = 0.5 + 0.5 * Math.sin(time*4 + sy.phase);
  const a = sy.a, b = sy.b;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo((a.x+b.x)/2 + Math.sin(time*2+sy.phase)*4, (a.y+b.y)/2 + Math.cos(time*2+sy.phase)*4, b.x, b.y);
  ctx.lineWidth = 1.3 + p * 1.8;
  ctx.strokeStyle = s.synapseColor;
  ctx.shadowBlur = 26 * s.synapseGlowStrength;
  ctx.shadowColor = s.synapseColor;
  ctx.globalAlpha = 0.25 + p * 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawPulse(pu, time){
  const sy = pu.syn;
  const a = sy.a, b = sy.b;
  const t = pu.dir > 0 ? pu.t : 1 - pu.t;
  const p = lerpPt(a, b, t);
  ctx.beginPath();
  ctx.arc(p.x, p.y, 3.2 + Math.sin(time*10+t*12)*0.8, 0, Math.PI*2);
  ctx.fillStyle = s.pulseColor;
  ctx.shadowBlur = 28;
  ctx.shadowColor = s.pulseColor;
  ctx.globalAlpha = s.pulseBrightness;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function draw(time){
  drawBackground(time);
  for(const sy of synapses) drawSynapse(sy, time);
  for(const n of neurons) for(const b of n.branches) drawBranch(b);
  for(const p of pulses) drawPulse(p, time);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const n of neurons){
    for(const b of n.branches){
      if(!b.done) continue;
      ctx.beginPath();
      ctx.arc(b.tip.x, b.tip.y, 2.2, 0, Math.PI*2);
      ctx.fillStyle = n.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = n.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,212,0,0.04)';
  ctx.fillRect(0,0,W,H);
}

function loop(t){
  const time = t * 0.001;
  const dt = Math.min(0.033, time - lastT || 0.016);
  lastT = time;
  if(running) update(dt);
  draw(time);
  requestAnimationFrame(loop);
}

const gui = new dat.GUI({ name:'Neuron Controls', width: 320 });
gui.domElement.style.position = 'fixed';
gui.domElement.style.top = '10px';
gui.domElement.style.right = '10px';
gui.domElement.style.background = 'rgba(5,7,15,0.88)';
gui.domElement.style.color = '#ffd400';
gui.domElement.style.boxShadow = '0 0 24px rgba(0,229,255,0.18)';
const f1 = gui.addFolder('Growth');
f1.add(s, 'neuronCount', 1, 10, 1);
f1.add(s, 'branchGrowthSpeed', 0.1, 2.5, 0.01);
f1.add(s, 'maxBranchDepth', 1, 8, 1);
f1.add(s, 'branchSplitChance', 0, 1, 0.01);
f1.add(s, 'branchCurvature', 0, 1, 0.01);
f1.add(s, 'maxBranchLength', 20, 220, 1);
const f2 = gui.addFolder('Synapses');
f2.add(s, 'synapseDistanceThreshold', 8, 80, 1);
f2.add(s, 'synapseGlowStrength', 0, 3, 0.01);
const f3 = gui.addFolder('Pulses');
f3.add(s, 'pulseSpeed', 0.1, 2.5, 0.01);
f3.add(s, 'pulseFrequency', 0, 3, 0.01);
f3.add(s, 'pulseBrightness', 0, 3, 0.01);
const f4 = gui.addFolder('Visuals');
f4.addColor(s, 'backgroundColor');
f4.addColor(s, 'branchColor');
f4.addColor(s, 'accentBranchColor');
f4.addColor(s, 'synapseColor');
f4.addColor(s, 'pulseColor');
gui.add({ regenerateNetwork: regenerate, clearCanvas, pauseResumeAnimation: toggleRun }, 'regenerateNetwork');
gui.add({ regenerateNetwork: regenerate, clearCanvas, pauseResumeAnimation: toggleRun }, 'clearCanvas');
gui.add({ regenerateNetwork: regenerate, clearCanvas, pauseResumeAnimation: toggleRun }, 'pauseResumeAnimation');
f1.open(); f2.open(); f3.open(); f4.open();

regenerate();
requestAnimationFrame(loop);
</script>
</body>
</html>
