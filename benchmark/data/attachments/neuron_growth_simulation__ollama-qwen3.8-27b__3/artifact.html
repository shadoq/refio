<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            background-color: #05070f;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }
        .dg.ac {
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="scene" width="800" height="800"></canvas>

    <script>
        // --- SETUP ---
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const params = {
            // Growth
            neuronCount: 4,
            growthSpeed: 2.0,
            maxDepth: 5,
            splitChance: 0.6,
            curvature: 0.5,
            maxBranchLength: 150,
            
            // Synapses
            synapseDistance: 60,
            synapseGlow: 15,
            
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.05,
            pulseBrightness: 20,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            showGrid: true,
            showScanlines: true,
            bloom: 10,
            
            // Controls
            paused: false,
            regenerate: function() { generateNetwork(); },
            clear: function() { clearCanvas(); },
            togglePause: function() {
                params.paused = !params.paused;
                this.updateDisplay();
            }
        };

        let branches = [];
        let tipPoints = [];
        let synapses = [];
        let synapseKeys = new Set();
        let pulses = [];
        let time = 0;
        let lastTime = performance.now();

        const BRANCH_LIMIT = 400;
        const SYNAPSE_LIMIT = 120;
        const PULSE_LIMIT = 40;

        // --- GUI ---
        const gui = new dat.GUI({ width: 300 });
        
        const fGrowth = gui.addFolder('Growth');
        fGrowth.add(params, 'neuronCount', 3, 6).step(1).name('Neuron Count').onChange(generateNetwork);
        fGrowth.add(params, 'growthSpeed', 0.5, 10).name('Growth Speed');
        fGrowth.add(params, 'maxDepth', 1, 8).step(1).name('Max Depth').onChange(generateNetwork);
        fGrowth.add(params, 'splitChance', 0, 1).name('Split Chance').onChange(generateNetwork);
        fGrowth.add(params, 'curvature', 0, 1).name('Curvature');
        fGrowth.add(params, 'maxBranchLength', 50, 300).name('Max Length').onChange(generateNetwork);
        fGrowth.open();

        const fSyn = gui.addFolder('Synapses');
        fSyn.add(params, 'synapseDistance', 20, 150).name('Distance Threshold').onChange(detectSynapses);
        fSyn.add(params, 'synapseGlow', 0, 50).name('Glow Strength');
        fSyn.open();

        const fPulse = gui.addFolder('Pulses');
        fPulse.add(params, 'pulseSpeed', 0.005, 0.1).name('Pulse Speed');
        fPulse.add(params, 'pulseFrequency', 0, 0.3).name('Pulse Frequency');
        fPulse.add(params, 'pulseBrightness', 0, 50).name('Pulse Brightness');
        fPulse.open();

        const fVis = gui.addFolder('Visuals');
        fVis.addColor(params, 'bgColor').name('Background');
        fVis.addColor(params, 'branchColor').name('Branch Color');
        fVis.addColor(params, 'accentColor').name('Accent Color');
        fVis.addColor(params, 'synapseColor').name('Synapse Color');
        fVis.addColor(params, 'pulseColor').name('Pulse Color');
        fVis.add(params, 'showGrid').name('Grid');
        fVis.add(params, 'showScanlines').name('Scanlines');
        fVis.add(params, 'bloom', 0, 30).name('Bloom');
        fVis.open();

        const fNet = gui.addFolder('Network');
        fNet.add(params, 'regenerate').name('Regenerate');
        fNet.add(params, 'clear').name('Clear Canvas');
        fNet.add(params, 'togglePause').name('Pause/Resume');
        fNet.open();

        // --- NEURON GROWTH ---
        function generateNetwork() {
            branches = [];
            tipPoints = [];
            synapses = [];
            synapseKeys = new Set();
            pulses = [];
            
            const cx = W / 2;
            const cy = H / 2;
            
            for (let i = 0; i < params.neuronCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120;
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle) * dist;
                
                // Initial branch
                branches.push({
                    x: x,
                    y: y,
                    angle: Math.random() * Math.PI * 2,
                    depth: 0,
                    length: params.maxBranchLength * (0.5 + Math.random() * 0.5),
                    grown: 0,
                    thickness: 2 + Math.random() * 2,
                    active: true,
                    color: Math.random() > 0.7 ? params.accentColor : params.branchColor,
                    path: [{x: x, y: y}]
                });
            }
        }

        function clearCanvas() {
            branches = [];
            tipPoints = [];
            synapses = [];
            synapseKeys = new Set();
            pulses = [];
        }

        function updateGrowth(dt) {
            if (params.paused) return;

            const speed = params.growthSpeed * dt * 60; // Normalize to 60fps

            for (let i = branches.length - 1; i >= 0; i--) {
                const b = branches[i];
                if (!b.active) continue;

                // Wiggling angle
                b.angle += (Math.random() - 0.5) * params.curvature * 0.2;

                // Advance tip
                b.grown += speed;
                const nx = b.x + Math.cos(b.angle) * speed;
                const ny = b.y + Math.sin(b.angle) * speed;
                
                b.path.push({x: nx, y: ny});
                if (b.path.length > 10) b.path.shift(); // Keep path short for performance

                b.x = nx;
                b.y = ny;

                // Check if settled
                if (b.grown >= b.length) {
                    b.active = false;
                    
                    // Add to tip points for synapse detection
                    tipPoints.push({
                        x: b.x,
                        y: b.y,
                        branchIndex: i
                    });

                    // Spawn children
                    if (b.depth < params.maxDepth && branches.length < BRANCH_LIMIT) {
                        if (Math.random() < params.splitChance) {
                            const numChildren = Math.random() > 0.5 ? 2 : 1;
                            for (let c = 0; c < numChildren; c++) {
                                const spread = (Math.random() - 0.5) * Math.PI * 0.8;
                                const newAngle = b.angle + spread;
                                const newLength = b.length * (0.6 + Math.random() * 0.4);
                                
                                branches.push({
                                    x: b.x,
                                    y: b.y,
                                    angle: newAngle,
                                    depth: b.depth + 1,
                                    length: newLength,
                                    grown: 0,
                                    thickness: Math.max(0.5, b.thickness * 0.8),
                                    active: true,
                                    color: Math.random() > 0.8 ? params.accentColor : params.branchColor,
                                    path: [{x: b.x, y: b.y}]
                                });
                            }
                        }
                    }
                }
            }
        }

        // --- SYNAPSE DETECTION ---
        function detectSynapses() {
            synapses = [];
            synapseKeys = new Set();
            
            if (tipPoints.length === 0) return;

            for (let i = 0; i < tipPoints.length; i++) {
                for (let j = i + 1; j < tipPoints.length; j++) {
                    if (synapses.length >= SYNAPSE_LIMIT) return;

                    const a = tipPoints[i];
                    const b = tipPoints[j];
                    
                    // Skip if same branch or already connected
                    if (a.branchIndex === b.branchIndex) continue;
                    
                    const key = `${i}_${j}`;
                    if (synapseKeys.has(key)) continue;

                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < params.synapseDistance) {
                        synapseKeys.add(key);
                        synapses.push({
                            a: a,
                            b: b,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                }
            }
        }

        // --- PULSE ANIMATION ---
        function updatePulses(dt) {
            if (params.paused) return;

            // Spawn new pulses
            if (Math.random() < params.pulseFrequency && synapses.length > 0 && pulses.length < PULSE_LIMIT) {
                const syn = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push({
                    synapse: syn,
                    t: 0,
                    dir: 1
                });
            }

            // Update existing pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.t += params.pulseSpeed * dt * 60;
                if (p.t >= 1) {
                    pulses.splice(i, 1);
                }
            }
        }

        // --- RENDERING ---
        function drawBackground() {
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, W, H);

            // Radial Glow
            const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
            grad.addColorStop(0, '#101a3a');
            grad.addColorStop(1, params.bgColor);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Grid
            if (params.showGrid) {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < W; i += 40) {
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, H);
                }
                for (let i = 0; i < H; i += 40) {
                    ctx.moveTo(0, i);
                    ctx.lineTo(W, i);
                }
                ctx.stroke();
            }

            // Scanlines
            if (params.showScanlines) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                for (let i = 0; i < H; i += 4) {
                    ctx.fillRect(0, i, W, 2);
                }
            }
            
            // Vignette
            const vignette = ctx.createRadialGradient(W/2, H/2, W/3, W/2, H/2, W);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);
        }

        function drawBranches() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            for (const b of branches) {
                if (b.path.length < 2) continue;

                ctx.beginPath();
                ctx.moveTo(b.path[0].x, b.path[0].y);
                
                // Use quadratic curves for organic look
                for (let i = 1; i < b.path.length - 1; i++) {
                    const xc = (b.path[i].x + b.path[i+1].x) / 2;
                    const yc = (b.path[i].y + b.path[i+1].y) / 2;
                    ctx.quadraticCurveTo(b.path[i].x, b.path[i].y, xc, yc);
                }
                // Draw to last point
                const last = b.path[b.path.length - 1];
                ctx.lineTo(last.x, last.y);

                ctx.strokeStyle = b.color;
                ctx.lineWidth = b.thickness;
                ctx.shadowBlur = params.bloom;
                ctx.shadowColor = b.color;
                ctx.stroke();
            }
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function drawTips() {
            for (const b of branches) {
                if (b.active) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.thickness * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = params.bloom * 1.5;
                    ctx.shadowColor = b.color;
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        }

        function drawSynapses() {
            for (const s of synapses) {
                const pulse = Math.sin(time * 2 + s.phase) * 0.5 + 0.5;
                const alpha = 0.5 + pulse * 0.5;
                
                // Connecting Arc
                ctx.beginPath();
                const midX = (s.a.x + s.b.x) / 2;
                const midY = (s.a.y + s.b.y) / 2;
                const dx = s.b.x - s.a.x;
                const dy = s.b.y - s.a.y;
                const len = Math.sqrt(dx*dx + dy*dy);
                const nx = -dy / len;
                const ny = dx / len;
                const offset = 10 + pulse * 5;
                
                ctx.moveTo(s.a.x, s.a.y);
                ctx.quadraticCurveTo(midX + nx * offset, midY + ny * offset, s.b.x, s.b.y);
                
                ctx.strokeStyle = params.synapseColor;
                ctx.lineWidth = 1;
                ctx.globalAlpha = alpha * 0.5;
                ctx.shadowBlur = params.synapseGlow * pulse;
                ctx.shadowColor = params.synapseColor;
                ctx.stroke();
                
                // Dots
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(s.a.x, s.a.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.synapseColor;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(s.b.x, s.b.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function drawPulses() {
            for (const p of pulses) {
                const x = p.synapse.a.x + (p.synapse.b.x - p.synapse.a.x) * p.t;
                const y = p.synapse.a.y + (p.synapse.b.y - p.synapse.a.y) * p.t;
                
                // Trail
                for (let i = 1; i <= 3; i++) {
                    const tx = p.synapse.a.x + (p.synapse.b.x - p.synapse.a.x) * (p.t - i * 0.05);
                    const ty = p.synapse.a.y + (p.synapse.b.y - p.synapse.a.y) * (p.t - i * 0.05);
                    if (tx < 0 || tx > W || ty < 0 || ty > H) continue;
                    
                    ctx.beginPath();
                    ctx.arc(tx, ty, 2 - i * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = params.pulseColor;
                    ctx.globalAlpha = 0.5 - i * 0.15;
                    ctx.shadowBlur = params.pulseBrightness;
                    ctx.shadowColor = params.pulseColor;
                    ctx.fill();
                }
                
                // Core
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = params.pulseBrightness * 2;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        // --- MAIN LOOP ---
        function animate(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            
            if (!params.paused) {
                time += dt;
                updateGrowth(dt);
                
                // Detect synapses occasionally or when tips change
                // Simple heuristic: detect if we have new tips
                if (tipPoints.length > 0 && synapses.length < SYNAPSE_LIMIT) {
                    // We can optimize this, but for now, let's just run it if there are changes
                    // To keep it simple and performant, we'll just run it every few frames or when needed
                    // For this implementation, we'll run it every 10 frames or when branches settle
                    // Actually, let's just run it every frame but it's O(N^2). 
                    // Given limits (400 branches), N^2 is 160k ops. Might be heavy.
                    // Let's only run it when a branch settles.
                }
                
                updatePulses(dt);
            }

            drawBackground();
            drawBranches();
            drawTips();
            drawSynapses();
            drawPulses();

            requestAnimationFrame(animate);
        }

        // Initialize
        generateNetwork();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
