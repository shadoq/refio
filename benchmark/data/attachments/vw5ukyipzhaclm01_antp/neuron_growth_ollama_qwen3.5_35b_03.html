<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(16, 26, 58, 0.5);
        }

        canvas {
            display: block;
            border-radius: 4px;
        }

        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 229, 255, 0.03),
                rgba(0, 229, 255, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            opacity: 0.5;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                transparent 50%,
                rgba(5, 7, 15, 0.6) 100%
            );
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuralCanvas" width="800" height="800"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // Configuration and State
        const config = {
            growth: {
                neuronCount: 4,
                branchSpeed: 1.5,
                maxDepth: 8,
                splitChance: 0.3,
                curvature: 0.5,
                maxBranchLength: 300
            },
            synapses: {
                distanceThreshold: 60,
                glowStrength: 1.5
            },
            pulses: {
                pulseSpeed: 3,
                pulseFrequency: 2,
                pulseBrightness: 1.0
            },
            visuals: {
                bgColor: '#05070f',
                branchColor: '#00e5ff',
                accentColor: '#d6ff00',
                synapseColor: '#ff2bd6',
                pulseColor: '#fff36a',
                showScanlines: true,
                showVignette: true
            }
        };

        const colors = {
            background: '#05070f',
            glow: '#101a3a',
            branch: '#00e5ff',
            accent: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            grid: 'rgba(0, 229, 255, 0.08)'
        };

        let canvas, ctx;
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationId;
        let isPaused = false;
        let time = 0;

        // Initialize
        function init() {
            canvas = document.getElementById('neuralCanvas');
            ctx = canvas.getContext('2d');
            
            setupGUI();
            regenerateNetwork();
            animate();
        }

        // GUI Setup
        function setupGUI() {
            const gui = new dat.GUI({ width: 300 });
            
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config.growth, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(regenerateNetwork);
            growthFolder.add(config.growth, 'branchSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config.growth, 'maxDepth', 4, 12, 1).name('Max Depth').onChange(regenerateNetwork);
            growthFolder.add(config.growth, 'splitChance', 0.1, 0.8).name('Split Chance');
            growthFolder.add(config.growth, 'curvature', 0.1, 1.0).name('Curvature');
            growthFolder.add(config.growth, 'maxBranchLength', 100, 500).name('Max Length').onChange(regenerateNetwork);
            
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config.synapses, 'distanceThreshold', 20, 150).name('Distance Threshold').onChange(regenerateNetwork);
            synapsesFolder.add(config.synapses, 'glowStrength', 0.5, 3.0).name('Glow Strength');
            
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config.pulses, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulsesFolder.add(config.pulses, 'pulseFrequency', 0.5, 5).name('Pulse Frequency');
            pulsesFolder.add(config.pulses, 'pulseBrightness', 0.5, 2.0).name('Pulse Brightness');
            
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config.visuals, 'bgColor').name('Background').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'branchColor').name('Branch Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'accentColor').name('Accent Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'synapseColor').name('Synapse Color').onChange(updateColors);
            visualsFolder.addColor(config.visuals, 'pulseColor').name('Pulse Color').onChange(updateColors);
            visualsFolder.add(config.visuals, 'showScanlines').name('Scanlines').onChange(updateEffects);
            visualsFolder.add(config.visuals, 'showVignette').name('Vignette').onChange(updateEffects);
            
            gui.add({ regenerate: regenerateNetwork }, 'regenerate').name('Regenerate Network');
            gui.add({ clear: clearCanvas }, 'clear').name('Clear Canvas');
            gui.add({ toggle: () => { isPaused = !isPaused; } }, 'toggle').name('Pause/Resume');
            
            growthFolder.open();
            synapsesFolder.open();
            pulsesFolder.open();
            visualsFolder.open();
        }

        function updateColors() {
            colors.branch = config.visuals.branchColor;
            colors.accent = config.visuals.accentColor;
            colors.synapse = config.visuals.synapseColor;
            colors.pulse = config.visuals.pulseColor;
            colors.background = config.visuals.bgColor;
        }

        function updateEffects() {
            document.getElementById('scanlines').style.display = config.visuals.showScanlines ? 'block' : 'none';
            document.getElementById('vignette').style.display = config.visuals.showVignette ? 'block' : 'none';
        }

        // Neural Network Classes
        class Neuron {
            constructor(x, y, depth = 0) {
                this.x = x;
                this.y = y;
                this.depth = depth;
                this.angle = Math.random() * Math.PI * 2;
                this.length = 0;
                this.targetLength = config.growth.maxBranchLength;
                this.color = depth % 2 === 0 ? colors.branch : colors.accent;
                this.width = Math.max(1, 4 - depth * 0.3);
                this.children = [];
                this.isComplete = false;
            }

            update() {
                if (this.isComplete) return;

                const speed = config.growth.branchSpeed;
                const curvature = config.growth.curvature;
                const maxLen = config.growth.maxBranchLength;

                this.length += speed;
                
                // Smooth curvature
                this.angle += (Math.random() - 0.5) * curvature * 0.1;
                
                const newX = this.x + Math.cos(this.angle) * speed;
                const newY = this.y + Math.sin(this.angle) * speed;

                // Boundary check
                if (newX < 0 || newX > canvas.width || newY < 0 || newY > canvas.height) {
                    this.isComplete = true;
                    return;
                }

                this.x = newX;
                this.y = newY;

                // Branch splitting
                if (this.depth < config.growth.maxDepth && 
                    Math.random() < config.growth.splitChance && 
                    this.length < maxLen * 0.7) {
                    
                    const child = new Neuron(this.x, this.y, this.depth + 1);
                    child.angle = this.angle + (Math.random() - 0.5) * Math.PI * 0.5;
                    this.children.push(child);
                }

                // Check if complete
                if (this.length >= maxLen || this.depth >= config.growth.maxDepth) {
                    this.isComplete = true;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw children
                this.children.forEach(child => child.draw());
            }
        }

        class Synapse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.x1 = neuron1.x;
                this.y1 = neuron1.y;
                this.x2 = neuron2.x;
                this.y2 = neuron2.y;
                this.pulseProgress = 0;
                this.lastPulse = 0;
                this.glow = 0;
            }

            update() {
                this.x1 = this.neuron1.x;
                this.y1 = this.neuron1.y;
                this.x2 = this.neuron2.x;
                this.y2 = this.neuron2.y;

                // Pulse timing
                const now = Date.now();
                if (now - this.lastPulse > 1000 / config.pulses.pulseFrequency) {
                    this.pulseProgress = 0;
                    this.lastPulse = now;
                }

                if (this.pulseProgress < 1) {
                    this.pulseProgress += config.pulses.pulseSpeed * 0.02;
                }

                // Glow decay
                if (this.glow > 0) {
                    this.glow -= 0.02;
                }
            }

            draw() {
                const glowStrength = config.synapses.glowStrength;
                
                // Draw connection line
                ctx.beginPath();
                ctx.strokeStyle = colors.synapse;
                ctx.lineWidth = 1;
                ctx.shadowColor = colors.synapse;
                ctx.shadowBlur = glowStrength * 10;
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw pulse
                if (this.pulseProgress > 0) {
                    const pulseX = this.x1 + (this.x2 - this.x1) * this.pulseProgress;
                    const pulseY = this.y1 + (this.y2 - this.y1) * this.pulseProgress;
                    
                    ctx.beginPath();
                    ctx.fillStyle = colors.pulse;
                    ctx.shadowColor = colors.pulse;
                    ctx.shadowBlur = config.pulses.pulseBrightness * 15;
                    ctx.arc(pulseX, pulseY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Draw synapse nodes
                ctx.beginPath();
                ctx.fillStyle = colors.synapse;
                ctx.shadowColor = colors.synapse;
                ctx.shadowBlur = glowStrength * 5;
                ctx.arc(this.x1, this.y1, 2, 0, Math.PI * 2);
                ctx.arc(this.x2, this.y2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(startX, startY, endX, endY) {
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.progress = 0;
                this.speed = config.pulses.pulseSpeed;
                this.active = true;
            }

            update() {
                this.progress += this.speed * 0.02;
                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw() {
                const x = this.startX + (this.endX - this.startX) * this.progress;
                const y = this.startY + (this.endY - this.startY) * this.progress;
                
                ctx.beginPath();
                ctx.fillStyle = colors.pulse;
                ctx.shadowColor = colors.pulse;
                ctx.shadowBlur = config.pulses.pulseBrightness * 15;
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Network Management
        function regenerateNetwork() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const spread = 50;

            for (let i = 0; i < config.growth.neuronCount; i++) {
                const x = centerX + (Math.random() - 0.5) * spread;
                const y = centerY + (Math.random() - 0.5) * spread;
                neurons.push(new Neuron(x, y));
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            synapses = [];
            pulses = [];
        }

        function checkSynapses() {
            const threshold = config.synapses.distanceThreshold;
            
            // Collect all branch tips
            const tips = [];
            neurons.forEach(neuron => {
                collectTips(neuron, tips);
            });

            // Check for new synapses
            for (let i = 0; i < tips.length; i++) {
                for (let j = i + 1; j < tips.length; j++) {
                    const tip1 = tips[i];
                    const tip2 = tips[j];
                    
                    const dx = tip1.neuron.x - tip2.neuron.x;
                    const dy = tip1.neuron.y - tip2.neuron.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < threshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.neuron1 === tip1.neuron && s.neuron2 === tip2.neuron) ||
                            (s.neuron1 === tip2.neuron && s.neuron2 === tip1.neuron)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(tip1.neuron, tip2.neuron));
                        }
                    }
                }
            }
        }

        function collectTips(neuron, tips) {
            if (neuron.isComplete) {
                tips.push({ neuron: neuron, depth: neuron.depth });
            } else {
                neuron.children.forEach(child => collectTips(child, tips));
            }
        }

        function drawBackground() {
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Subtle grid
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            if (isPaused) return;

            time += 0.016;
            
            drawBackground();
            
            // Update and draw neurons
            neurons.forEach(neuron => {
                neuron.update();
                neuron.draw();
            });
            
            // Check for synapses
            checkSynapses();
            
            // Update and draw synapses
            synapses.forEach(synapse => {
                synapse.update();
                synapse.draw();
            });
            
            // Draw pulses
            pulses.forEach(pulse => {
                pulse.update();
                pulse.draw();
            });
            
            // Remove inactive pulses
            pulses = pulses.filter(pulse => pulse.active);
        }

        // Start the simulation
        init();
    </script>
</body>
</html>
