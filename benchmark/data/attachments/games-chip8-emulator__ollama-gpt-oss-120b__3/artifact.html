<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP‑8 Emulator</title>
<style>
  body { font-family: Arial, sans-serif; background:#222; color:#ddd; margin:0; display:flex; flex-direction:column; align-items:center; height:100vh; }
  #container { display:flex; flex-direction:column; align-items:center; margin-top:10px; }
  canvas { image-rendering:pixelated; border:2px solid #555; width:640px; height:320px; background:#000; }
  #controls { margin:10px; }
  #controls > * { margin:0 5px; }
  #debugger { width:640px; background:#111; padding:5px; font-size:12px; overflow:auto; max-height:200px; border:1px solid #444; }
  #debugger pre { margin:0; }
</style>
</head>
<body>
<div id="container">
  <canvas id="screen" width="64" height="32"></canvas>
  <div id="controls">
    <button id="runBtn">Run</button>
    <button id="pauseBtn">Pause</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn">Reset</button>
    <label>Speed: <input type="range" id="speedSlider" min="1" max="20" value="10"></label>
    <input type="file" id="romLoader" accept=".ch8,.bin">
  </div>
  <div id="debugger"><pre id="debugInfo"></pre></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(64, 32);
  const debugInfo = document.getElementById('debugInfo');

  const chip8 = {
    memory: new Uint8Array(4096),
    V: new Uint8Array(16),
    I: 0,
    PC: 0x200,
    stack: new Uint16Array(16),
    sp: 0,
    delayTimer: 0,
    soundTimer: 0,
    keys: new Uint8Array(16),
    display: new Uint8Array(64 * 32),
    drawFlag: false,
    currentOpcode: 0,
    waitForKey: false,
    waitKeyReg: 0,
  };

  const keyMap = {
    '1':0x1,'2':0x2,'3':0x3,'4':0xC,
    'q':0x4,'w':0x5,'e':0x6,'r':0xD,
    'a':0x7,'s':0x8,'d':0x9,'f':0xE,
    'z':0xA,'x':0x0,'c':0xB,'v':0xF
  };

  const fontSet = [
    0xF0,0x90,0x90,0x90,0xF0, // 0
    0x20,0x60,0x20,0x20,0x70, // 1
    0xF0,0x10,0xF0,0x80,0xF0, // 2
    0xF0,0x10,0xF0,0x10,0xF0, // 3
    0x90,0x90,0xF0,0x10,0x10, // 4
    0xF0,0x80,0xF0,0x10,0xF0, // 5
    0xF0,0x80,0xF0,0x90,0xF0, // 6
    0xF0,0x10,0x20,0x40,0x40, // 7
    0xF0,0x90,0xF0,0x90,0xF0, // 8
    0xF0,0x90,0xF0,0x10,0xF0, // 9
    0xF0,0x90,0xF0,0x90,0x90, // A
    0xE0,0x90,0xE0,0x90,0xE0, // B
    0xF0,0x80,0x80,0x80,0xF0, // C
    0xE0,0x90,0x90,0x90,0xE0, // D
    0xF0,0x80,0xF0,0x80,0xF0, // E
    0xF0,0x80,0xF0,0x80,0x80  // F
  ];

  function reset() {
    chip8.memory.fill(0);
    chip8.V.fill(0);
    chip8.I = 0;
    chip8.PC = 0x200;
    chip8.stack.fill(0);
    chip8.sp = 0;
    chip8.delayTimer = 0;
    chip8.soundTimer = 0;
    chip8.keys.fill(0);
    chip8.display.fill(0);
    chip8.drawFlag = true;
    chip8.waitForKey = false;
    chip8.waitKeyReg = 0;
    // load font set
    for (let i = 0; i < fontSet.length; i++) chip8.memory[0x50 + i] = fontSet[i];
    loadDemoROM();
  }

  function loadDemoROM() {
    // Program that draws a 8x5 square and moves it right on each key press
    const program = [
      0x00,0xE0, // CLS
      0x60,0x00, // LD V0,0
      0x61,0x00, // LD V1,0
      0xA3,0x00, // LD I,0x300 (sprite)
      0xD0,0x15, // DRW V0,V1,5
      0xF2,0x0A, // LD V2,K (wait key)
      0x70,0x01, // ADD V0,1
      0x00,0xE0, // CLS
      0xA3,0x00, // LD I,0x300
      0xD0,0x15, // DRW V0,V1,5
      0x12,0x0A  // JP 0x20A
    ];
    // Load program at 0x200
    for (let i = 0; i < program.length; i++) chip8.memory[0x200 + i] = program[i];
    // Sprite (5 bytes) at 0x300
    const sprite = [0xF0,0x90,0x90,0x90,0xF0];
    for (let i = 0; i < sprite.length; i++) chip8.memory[0x300 + i] = sprite[i];
  }

  function loadROM(buffer) {
    const rom = new Uint8Array(buffer);
    for (let i = 0; i < rom.length && (0x200 + i) < 4096; i++) {
      chip8.memory[0x200 + i] = rom[i];
    }
    chip8.PC = 0x200;
  }

  function fetchOpcode() {
    return (chip8.memory[chip8.PC] << 8) | chip8.memory[chip8.PC + 1];
  }

  function cycle() {
    if (chip8.waitForKey) return;
    const opcode = fetchOpcode();
    chip8.currentOpcode = opcode;
    chip8.PC += 2;
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;
    const n = opcode & 0x000F;
    const nn = opcode & 0x00FF;
    const nnn = opcode & 0x0FFF;

    switch (opcode & 0xF000) {
      case 0x0000:
        switch (opcode) {
          case 0x00E0: // CLS
            chip8.display.fill(0);
            chip8.drawFlag = true;
            break;
          case 0x00EE: // RET
            chip8.sp--;
            chip8.PC = chip8.stack[chip8.sp];
            break;
          default:
            // SYS addr - ignored
            break;
        }
        break;
      case 0x1000: // JP addr
        chip8.PC = nnn;
        break;
      case 0x2000: // CALL addr
        chip8.stack[chip8.sp] = chip8.PC;
        chip8.sp++;
        chip8.PC = nnn;
        break;
      case 0x3000: // SE Vx, byte
        if (chip8.V[x] === nn) chip8.PC += 2;
        break;
      case 0x4000: // SNE Vx, byte
        if (chip8.V[x] !== nn) chip8.PC += 2;
        break;
      case 0x5000: // SE Vx, Vy
        if (chip8.V[x] === chip8.V[y]) chip8.PC += 2;
        break;
      case 0x6000: // LD Vx, byte
        chip8.V[x] = nn;
        break;
      case 0x7000: // ADD Vx, byte
        chip8.V[x] = (chip8.V[x] + nn) & 0xFF;
        break;
      case 0x8000:
        switch (n) {
          case 0x0: // LD Vx, Vy
            chip8.V[x] = chip8.V[y];
            break;
          case 0x1: // OR Vx, Vy
            chip8.V[x] |= chip8.V[y];
            break;
          case 0x2: // AND Vx, Vy
            chip8.V[x] &= chip8.V[y];
            break;
          case 0x3: // XOR Vx, Vy
            chip8.V[x] ^= chip8.V[y];
            break;
          case 0x4: // ADD Vx, Vy
            {
              const sum = chip8.V[x] + chip8.V[y];
              chip8.V[0xF] = sum > 0xFF ? 1 : 0;
              chip8.V[x] = sum & 0xFF;
            }
            break;
          case 0x5: // SUB Vx, Vy
            chip8.V[0xF] = chip8.V[x] >= chip8.V[y] ? 1 : 0;
            chip8.V[x] = (chip8.V[x] - chip8.V[y] + 0x100) & 0xFF;
            break;
          case 0x6: // SHR Vx
            chip8.V[0xF] = chip8.V[x] & 0x1;
            chip8.V[x] >>= 1;
            break;
          case 0x7: // SUBN Vx, Vy
            chip8.V[0xF] = chip8.V[y] >= chip8.V[x] ? 1 : 0;
            chip8.V[x] = (chip8.V[y] - chip8.V[x] + 0x100) & 0xFF;
            break;
          case 0xE: // SHL Vx
            chip8.V[0xF] = (chip8.V[x] & 0x80) >> 7;
            chip8.V[x] = (chip8.V[x] << 1) & 0xFF;
            break;
        }
        break;
      case 0x9000: // SNE Vx, Vy
        if (chip8.V[x] !== chip8.V[y]) chip8.PC += 2;
        break;
      case 0xA000: // LD I, addr
        chip8.I = nnn;
        break;
      case 0xB000: // JP V0, addr
        chip8.PC = nnn + chip8.V[0];
        break;
      case 0xC000: // RND Vx, byte
        chip8.V[x] = (Math.floor(Math.random() * 0xFF)) & nn;
        break;
      case 0xD000: // DRW Vx, Vy, nibble
        drawSprite(chip8.V[x], chip8.V[y], n);
        break;
      case 0xE000:
        if (nn === 0x9E) { // SKP Vx
          if (chip8.keys[chip8.V[x]]) chip8.PC += 2;
        } else if (nn === 0xA1) { // SKNP Vx
          if (!chip8.keys[chip8.V[x]]) chip8.PC += 2;
        }
        break;
      case 0xF000:
        switch (nn) {
          case 0x07: // LD Vx, DT
            chip8.V[x] = chip8.delayTimer;
            break;
          case 0x0A: // LD Vx, K
            chip8.waitForKey = true;
            chip8.waitKeyReg = x;
            break;
          case 0x15: // LD DT, Vx
            chip8.delayTimer = chip8.V[x];
            break;
          case 0x18: // LD ST, Vx
            chip8.soundTimer = chip8.V[x];
            break;
          case 0x1E: // ADD I, Vx
            chip8.I = (chip8.I + chip8.V[x]) & 0xFFF;
            break;
          case 0x29: // LD F, Vx
            chip8.I = 0x50 + (chip8.V[x] * 5);
            break;
          case 0x33: // LD B, Vx
            {
              let value = chip8.V[x];
              chip8.memory[chip8.I] = Math.floor(value / 100);
              chip8.memory[chip8.I + 1] = Math.floor((value % 100) / 10);
              chip8.memory[chip8.I + 2] = value % 10;
            }
            break;
          case 0x55: // LD [I], Vx
            for (let i = 0; i <= x; i++) chip8.memory[chip8.I + i] = chip8.V[i];
            break;
          case 0x65: // LD Vx, [I]
            for (let i = 0; i <= x; i++) chip8.V[i] = chip8.memory[chip8.I + i];
            break;
        }
        break;
    }
  }

  function drawSprite(xPos, yPos, height) {
    chip8.V[0xF] = 0;
    for (let row = 0; row < height; row++) {
      const spriteByte = chip8.memory[chip8.I + row];
      for (let col = 0; col < 8; col++) {
        const pixel = (spriteByte >> (7 - col)) & 1;
        if (pixel) {
          const x = (xPos + col) % 64;
          const y = (yPos + row) % 32;
          const idx = x + y * 64;
          if (chip8.display[idx] === 1) chip8.V[0xF] = 1;
          chip8.display[idx] ^= 1;
        }
      }
    }
    chip8.drawFlag = true;
  }

  function renderScreen() {
    if (!chip8.drawFlag) return;
    const data = imgData.data;
    for (let i = 0; i < chip8.display.length; i++) {
      const color = chip8.display[i] ? 255 : 0;
      data[i * 4 + 0] = color;
      data[i * 4 + 1] = color;
      data[i * 4 + 2] = color;
      data[i * 4 + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    chip8.drawFlag = false;
  }

  function updateDebugger() {
    let html = '';
    html += 'PC: 0x' + chip8.PC.toString(16).padStart(3, '0') + '\\n';
    html += 'I : 0x' + chip8.I.toString(16).padStart(4, '0') + '\\n';
    html += 'Opcode: 0x' + chip8.currentOpcode.toString(16).padStart(4, '0') + '\\n';
    html += 'Delay: ' + chip8.delayTimer + '   Sound: ' + chip8.soundTimer + '\\n';
    html += 'Stack [' + chip8.sp + ']: ';
    for (let i = 0; i < chip8.sp; i++) {
      html += '0x' + chip8.stack[i].toString(16).padStart(4, '0') + ' ';
    }
    html += '\\n';
    for (let i = 0; i < 16; i++) {
      html += 'V' + i.toString(16).toUpperCase() + ': 0x' + chip8.V[i].toString(16).padStart(2, '0') + (i % 8 === 7 ? '\\n' : ' ');
    }
    debugInfo.textContent = html;
  }

  // Timers at 60Hz
  setInterval(() => {
    if (chip8.delayTimer > 0) chip8.delayTimer--;
    if (chip8.soundTimer > 0) chip8.soundTimer--;
  }, 1000 / 60);

  // Main loop
  let running = false;
  let speed = 10; // instructions per frame

  function loop() {
    if (running) {
      for (let i = 0; i < speed; i++) cycle();
      renderScreen();
      updateDebugger();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Controls
  document.getElementById('runBtn').addEventListener('click', () => { running = true; });
  document.getElementById('pauseBtn').addEventListener('click', () => { running = false; });
  document.getElementById('stepBtn').addEventListener('click', () => {
    if (!running) {
      cycle();
      renderScreen();
      updateDebugger();
    }
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    running = false;
    reset();
    updateDebugger();
    renderScreen();
  });
  document.getElementById('speedSlider').addEventListener('input', (e) => {
    speed = Number(e.target.value);
  });
  document.getElementById('romLoader').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      loadROM(reader.result);
      running = false;
      updateDebugger();
      renderScreen();
    };
    reader.readAsArrayBuffer(file);
  });

  // Keyboard handling
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
      chip8.keys[keyMap[key]] = 1;
      if (chip8.waitForKey) {
        chip8.V[chip8.waitKeyReg] = keyMap[key];
        chip8.waitForKey = false;
      }
    }
  });
  window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
      chip8.keys[keyMap[key]] = 0;
    }
  });

  // Initialize
  reset();
  updateDebugger();
  renderScreen();
})();
</script>
</body>
</html>
