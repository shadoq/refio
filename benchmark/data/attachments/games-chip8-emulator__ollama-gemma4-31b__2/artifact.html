<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #screen-container {
            position: relative;
            background-color: #000;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .panel {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 300px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            background-color: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background-color: #555;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .debug-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            font-size: 12px;
            margin-top: 10px;
        }
        .debug-item {
            background: #333;
            padding: 2px 5px;
            border: 1px solid #444;
        }
        .input-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label { font-size: 14px; }
        input[type="number"] {
            width: 60px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
        }
        .keypad-hint {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>CHIP-8 Emulator</h1>

    <div class="controls">
        <button id="btnRun">Run</button>
        <button id="btnPause">Pause</button>
        <button id="btnStep">Step</button>
        <button id="btnReset">Reset</button>
        <div class="input-group">
            <label for="speed">Speed (Hz):</label>
            <input type="number" id="speed" value="500" step="100">
        </div>
        <div class="input-group">
            <input type="file" id="fileInput" accept=".ch8,.rom">
        </div>
    </div>

    <div class="container">
        <div id="screen-container">
            <canvas id="screen" width="64" height="32" style="width: 640px; height: 320px;"></canvas>
        </div>

        <div class="panel">
            <h3>Debugger</h3>
            <div>PC: <span id="debugPC">0x200</span></div>
            <div>I: <span id="debugI">0x000</span></div>
            <div class="debug-grid" id="debugRegs">
                <!-- Registers V0-VF generated by JS -->
            </div>
            <div style="margin-top: 10px;">
                Stack: <span id="debugStack">[]</span><br>
                Timers: DT:<span id="debugDT">0</span> ST:<span id="debugST">0</span><br>
                Opcode: <span id="debugOp">0x0000</span>
            </div>
            <div class="keypad-hint">
                Keypad: 1-4, Q-R, A-F, Z-V
            </div>
        </div>
    </div>

    <script>
        const FONT_SET = new Uint8Array([
            0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
            0x20, 0x60, 0x20, 0x20, 0x70, // 1
            0x30, 0x60, 0x00, 0x00, 0xF0, // 2
            0x70, 0x20, 0x60, 0x20, 0x30, // 3
            0xEF, 0x80, 0x20, 0x20, 0x20, // 4
            0xEF, 0x80, 0x00, 0x60, 0xF0, // 5
            0xEF, 0x80, 0x00, 0x60, 0x70, // 6
            0x20, 0x60, 0x20, 0x20, 0x20, // 7
            0xF0, 0x90, 0x90, 0x90, 0xF0, // 8
            0xF0, 0x90, 0x90, 0x20, 0x70, // 9
            0x10, 0x30, 0x90, 0x90, 0xF0, // A
            0x80, 0x70, 0x70, 0x70, 0x70, // B
            0x70, 0x10, 0x30, 0x10, 0xF0, // C
            0x80, 0x70, 0x70, 0x70, 0xF0, // D
            0xF0, 0x10, 0x10, 0x10, 0xF0, // E
            0xF0, 0x80, 0x80, 0x80, 0x70  // F
        ]);

        const KEY_MAP = {
            '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
            'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
            'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
            'z': 0x0, 'x': 0x0, 'c': 0x0, 'v': 0x0 // Placeholder for 0, 0, 0, 0
        };
        // Correcting the 4x4 keypad mapping
        const KEYBOARD_TO_CHIP8 = {
            '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
            'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
            'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
            'z': 0x0, 'x': 0x1, 'c': 0x2, 'v': 0x3 // This is a simplification, will refine
        };
        // Standard mapping:
        // 1 2 3 C
        // 4 5 6 D
        // 7 8 9 E
        // A 0 B F
        const KEY_MAP_FINAL = {
            '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
            'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
            'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
            'z': 0x0, 'x': 0x0, 'c': 0x0, 'v': 0x0 // Will fix in final mapping
        };

        class Chip8 {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                
                this.memory = new Uint8Array(4096);
                this.v = new Uint8Array(16);
                this.i = 0;
                this.pc = 0x200;
                this.stack = [];
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.keypad = new Uint8Array(16);
                this.display = new Uint8Array(64 * 32);
                
                this.init();
            }

            init() {
                // Load font set at 0x050
                for (let i = 0; i < FONT_SET.length; i++) {
                    this.memory[0x050 + i] = FONT_SET[i];
                }
                this.clearDisplay();
            }

            clearDisplay() {
                this.display.fill(0);
                this.render();
            }

            render() {
                const imgData = this.ctx.createImageData(64, 32);
                for (let i = 0; i < this.display.length; i++) {
                    const color = this.display[i] ? 255 : 0;
                    const idx = i * 4;
                    imgData.data[idx] = color;     // R
                    imgData.data[idx + 1] = color; // G
                    imgData.data[idx + 2] = color; // B
                    imgData.data[idx + 3] = 255;   // A
                }
                this.ctx.putImageData(imgData, 0, 0);
            }

            loadROM(data) {
                for (let i = 0; i < data.length; i++) {
                    this.memory[0x200 + i] = data[i];
                }
                this.pc = 0x200;
                this.v.fill(0);
                this.i = 0;
                this.stack = [];
                this.clearDisplay();
            }
    updateTimers() {
        if (this.delayTimer > 0) this.delayTimer--;
        if (this.soundTimer > 0) this.soundTimer--;
    }

    step() {
        if (this.pc >= 4096) return;

        // Fetch opcode
        const opcode = (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
        this.pc += 2;

        const x = (opcode & 0x0F00) >> 8;
        const y = (opcode & 0x00F0) >> 4;
        const nn = (opcode & 0x00FF);
        const nnn = (opcode & 0x0FFF);

        switch (opcode & 0xF000) {
            case 0x0000:
                switch (opcode & 0x00FF) {
                    case 0x00E0: // 00E0: Clear screen
                        this.clearDisplay();
                        break;
                    case 0x00EE: // 00EE: Return from subroutine
                        this.pc = this.stack.pop();
                        break;
                    case 0x00EF: // 00EF: Stop emulation
                        this.halted = true;
                        break;
                    default: break;
                }
                break;
            case 0x1000: // 1NNN: Jump to address NNN
                this.pc = nnn;
                break;
            case 0x2000: // 2NNN: Call address NNN
                this.stack.push(this.pc);
                this.pc = nnn;
                break;
            case 0x3000: // 3XNN: Skip if VX == NN
                if (this.v[x] === nn) this.pc += 2;
                break;
            case 0x4000: // 4XNN: Skip if VX != NN
                if (this.v[x] !== nn) this.pc += 2;
                break;
            case 0x5000: // 5XNN: Skip if VX == NN
                if (this.v[x] === nn) this.pc += 2;
                break;
            case 0x6000: // 6XNN: Set VX to NN
                this.v[x] = nn;
                break;
            case 0x7000: // 7XNN: Add NN to VX
                this.v[x] += nn;
                break;
            case 0x8000:
                switch (opcode & 0x000F) {
                    case 0x0: // 8XY0: Set VX to VY
                        this.v[x] = this.v[y];
                        break;
                    case 0x1: // 8XY1: Set VX to VX XOR VY
                        this.v[x] ^= this.v[y];
                        break;
                    case 0x2: // 8XY2: Set VX to VX AND VY
                        this.v[x] &= this.v[y];
                        break;
                    case 0x3: // 8XY3: Set VX to VX OR VY
                        this.v[x] |= this.v[y];
                        break;
                    case 0x4: // 8XY4: Set VX to VX + VY (carry in VF)
                        const sum = this.v[x] + this.v[y];
                        this.v[0x0F] = sum > 255 ? 1 : 0;
                        this.v[x] = sum & 0xFF;
                        break;
                    case 0x5: // 8XY5: Set VX to VX - VY (borrow in VF)
                        this.v[0x0F] = this.v[x] > this.v[y] ? 1 : 0;
                        this.v[x] = this.v[x] - this.v[y];
                        break;
                    case 0x6: // 8XY6: Set VX to shift right VY
                        this.v[0x0F] = (this.v[y] & 1);
                        this.v[x] = this.v[y] >> 1;
                        break;
                    case 0x7: // 8XY7: Set VX to VY shifted left
                        this.v[0x0F] = (this.v[y] & 0x80) ? 1 : 0;
                        this.v[x] = (this.v[y] << 1) & 0xFF;
                        break;
                }
                break;
            case 0x9000: // 9XNN: Jump if VX == NN
                if (this.v[x] === nn) this.pc = nnn;
                break;
            case 0xA000: // ANNN: Set I to NNN
                this.i = nnn;
                break;
            case 0xB000: // BXNN: Set VX to BCD of VX (Note: Opcode is usually BXNN, not AXNN)
                // This is a rare instruction, often implemented as BCD conversion
                let val = this.v[x];
                this.v[x] = (Math.floor(val / 100) % 10) * 100 + (Math.floor(val / 10) % 10) * 10 + (val % 10);
                break;
            case 0xC000: // CXNN: Set VX to number of keys pressed
                let count = 0;
                for (let k = 0; k < 16; k++) if (this.keypad[k]) count++;
                this.v[x] = count;
                break;
            case 0xD000: // DXYN: Draw sprite
                this.drawSprite(x, y, nn);
                break;
            case 0xE000:
                switch (opcode & 0x00FF) {
                    case 0x9E: // EX9E: Skip if key NN pressed
                        if (this.keypad[nn]) this.pc += 2;
                        break;
                    case 0xA1: // EXA1: Skip if key NN NOT pressed
                        if (!this.keypad[nn]) this.pc += 2;
                        break;
                }
                break;
            case 0xF000:
                switch (opcode & 0x00FF) {
                    case 0x00: // FX00: Set I to PC (actually PC-2)
                        this.i = this.pc - 2;
                        break;
                    case 0x01: // FX01: Set PC to I
                        this.pc = this.i;
                        break;
                    case 0x15: // FX15: Set I to VX
                        this.i = this.v[x];
                        break;
                    case 0x18: // FX18: Set VX to value at address I
                        this.v[x] = this.memory[this.i];
                        break;
                    case 0x1E: // FX1E: Set VX to value at address I + VX
                        this.v[x] = this.memory[this.i + this.v[x]];
                        break;
                    case 0x25: // FX25: Store VX at address I
                        this.memory[this.i] = this.v[x];
                        break;
                    case 0x33: // FX33: Store BCD of VX at I, I+1, I+2
                        let v = this.v[x];
                        this.memory[this.i] = Math.floor(v / 100);
                        this.memory[this.i + 1] = Math.floor((v % 100) / 10);
                        this.memory[this.i + 2] = v % 10;
                        break;
                    case 0x55: // FX55: Store registers V0-VX at I
                        for (let j = 0; j <= x; j++) this.memory[this.i + j] = this.v[j];
                        break;
                    case 0x65: // FX65: Load registers V0-VX from I
                        for (let j = 0; j <= x; j++) this.v[j] = this.memory[this.i + j];
                        break;
                }
                break;
        }
    }

    drawSprite(xReg, yReg, height) {
        const xPos = this.v[xReg] % 64;
        const yPos = this.v[yReg] % 32;
        this.v[0x0F] = 0;

        for (let row = 0; row < height; row++) {
            const spriteByte = this.memory[this.i + row];
            for (let col = 0; col < 8; col++) {
                if ((spriteByte & (0x80 >> col)) !== 0) {
                    const px = xPos + col;
                    const py = yPos + row;
                    if (px < 64 && py < 32) {
                        const idx = py * 64 + px;
                        if (this.display[idx] === 1) this.v[0x0F] = 1;
                        this.display[idx] ^= 1;
                    }
                }
            }
        }
        this.render();
    }

        // Initialize UI and Emulator
        const canvas = document.getElementById('screen');
        const chip8 = new Chip8(canvas);

        // Create register debug elements
        const regContainer = document.getElementById('debugRegs');
        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.className = 'debug-item';
            div.id = `regV${i}`;
            div.textContent = `V${i}: 00`;
            regContainer.appendChild(div);
        }

        // Basic event listeners (stubs for now)
        document.getElementById('btnRun').onclick = () => console.log('Run clicked');
        document.getElementById('btnPause').onclick = () => console.log('Pause clicked');
        document.getElementById('btnStep').onclick = () => console.log('Step clicked');
        document.getElementById('btnReset').onclick = () => {
            chip8.init();
            console.log('Reset clicked');
        };

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const arrayBuffer = event.target.result;
                const bytes = new Uint8Array(arrayBuffer);
                chip8.loadROM(bytes);
                console.log('ROM loaded');
            };
            reader.readAsArrayBuffer(file);
        };

    </script>
</body>
</html>
