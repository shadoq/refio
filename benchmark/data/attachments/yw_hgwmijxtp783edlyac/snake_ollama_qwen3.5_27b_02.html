<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff88;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #0a0a0a;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 15px 0;
            color: #fff;
            font-size: 1.2rem;
        }

        .score-item {
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 5px;
            border: 1px solid #00ff88;
        }

        .score-label {
            color: #00ff88;
            font-weight: bold;
        }

        .menu-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            z-index: 100;
        }

        .menu-overlay h2 {
            color: #00ff88;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .menu-button {
            display: block;
            width: 250px;
            padding: 15px 20px;
            margin: 10px auto;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }

        .hidden {
            display: none !important;
        }

        .game-over-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ff4444;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
            z-index: 100;
            text-align: center;
        }

        .game-over-overlay h2 {
            color: #ff4444;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .winner-text {
            color: #00ff88;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .restart-text {
            color: #888;
            font-size: 0.9rem;
            margin-top: 15px;
        }

        .controls-info {
            color: #888;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .key {
            display: inline-block;
            padding: 3px 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            margin: 0 2px;
            font-family: monospace;
        }

        #gameWrapper {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Battle</h1>
        
        <div id="gameWrapper">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startMenu" class="menu-overlay">
                <h2>Select Game Mode</h2>
                <button class="menu-button" onclick="startGame('humanVsHuman')">Human vs Human</button>
                <button class="menu-button" onclick="startGame('cpuVsHuman')">CPU vs Human</button>
                <button class="menu-button" onclick="startGame('cpuVsCpu')">CPU vs CPU</button>
                
                <div class="controls-info">
                    <p><strong>Player 1 (Green):</strong> <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></p>
                    <p><strong>Player 2 (Blue):</strong> <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span></p>
                    <p><strong>Restart:</strong> <span class="key">R</span> or <span class="key">Enter</span></p>
                </div>
            </div>
            
            <div id="gameOverScreen" class="game-over-overlay hidden">
                <h2>Game Over!</h2>
                <div id="winnerText" class="winner-text"></div>
                <div class="score-item" style="margin-bottom: 15px;">
                    <span class="score-label">Player 1:</span> <span id="finalScore1">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Player 2:</span> <span id="finalScore2">0</span>
                </div>
                <p class="restart-text">Press <span class="key">R</span> or <span class="key">Enter</span> to restart</p>
            </div>
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <span class="score-label">Player 1:</span> <span id="score1">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Player 2:</span> <span id="score2">0</span>
            </div>
        </div>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 30;
        const CELL_SIZE = 15;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const GAME_SPEED = 100;
        const CPU_SPEED = 80;

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        // Game state
        let gameMode = '';
        let gameRunning = false;
        let gameOver = false;
        let gameLoop = null;
        let food = null;
        let player1 = null;
        let player2 = null;

        // Snake class
        class Snake {
            constructor(x, y, color, isCpu = false) {
                this.body = [{x, y}];
                this.direction = {x: 1, y: 0};
                this.nextDirection = {x: 1, y: 0};
                this.color = color;
                this.score = 0;
                this.isCpu = isCpu;
                this.alive = true;
            }

            reset(x, y, color, isCpu = false) {
                this.body = [{x, y}];
                this.direction = {x: 1, y: 0};
                this.nextDirection = {x: 1, y: 0};
                this.color = color;
                this.score = 0;
                this.isCpu = isCpu;
                this.alive = true;
            }

            update() {
                if (!this.alive) return;

                this.direction = {...this.nextDirection};

                const head = this.body[0];
                const newHead = {
                    x: head.x + this.direction.x,
                    y: head.y + this.direction.y
                };

                // Check wall collision
                if (newHead.x < 0 || newHead.x >= GRID_SIZE || 
                    newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    this.alive = false;
                    return;
                }

                // Check self collision
                if (this.body.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                    this.alive = false;
                    return;
                }

                // Check collision with other snake
                const otherSnake = this === player1 ? player2 : player1;
                if (otherSnake.alive && otherSnake.body.some(segment => 
                    segment.x === newHead.x && segment.y === newHead.y)) {
                    this.alive = false;
                    return;
                }

                this.body.unshift(newHead);

                // Check food collision
                if (newHead.x === food.x && newHead.y === food.y) {
                    this.score += 10;
                    spawnFood();
                } else {
                    this.body.pop();
                }

                updateScore();
            }

            draw() {
                if (!this.alive) return;

                ctx.fillStyle = this.color;
                this.body.forEach((segment, index) => {
                    // Head is slightly larger
                    const size = index === 0 ? CELL_SIZE - 1 : CELL_SIZE - 2;
                    const offset = index === 0 ? 1 : 2;
                    ctx.fillRect(
                        segment.x * CELL_SIZE + offset / 2,
                        segment.y * CELL_SIZE + offset / 2,
                        size,
                        size
                    );

                    // Draw eyes on head
                    if (index === 0) {
                        ctx.fillStyle = '#000';
                        const eyeSize = 3;
                        const eyeOffset = 4;
                        
                        if (this.direction.x !== 0) {
                            // Moving horizontally
                            ctx.fillRect(segment.x * CELL_SIZE + (this.direction.x > 0 ? eyeOffset : CELL_SIZE - eyeOffset - eyeSize), segment.y * CELL_SIZE + 3, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * CELL_SIZE + (this.direction.x > 0 ? eyeOffset : CELL_SIZE - eyeOffset - eyeSize), segment.y * CELL_SIZE + 9, eyeSize, eyeSize);
                        } else {
                            // Moving vertically
                            ctx.fillRect(segment.x * CELL_SIZE + 3, segment.y * CELL_SIZE + (this.direction.y > 0 ? eyeOffset : CELL_SIZE - eyeOffset - eyeSize), eyeSize, eyeSize);
                            ctx.fillRect(segment.x * CELL_SIZE + 9, segment.y * CELL_SIZE + (this.direction.y > 0 ? eyeOffset : CELL_SIZE - eyeOffset - eyeSize), eyeSize, eyeSize);
                        }
                        ctx.fillStyle = this.color;
                    }
                });
            }

            setDirection(x, y) {
                // Prevent reversing direction
                if (this.direction.x !== 0 && x === -this.direction.x) return;
                if (this.direction.y !== 0 && y === -this.direction.y) return;
                this.nextDirection = {x, y};
            }

            getCpuMove() {
                const head = this.body[0];
                const moves = [
                    {x: 0, y: -1}, // Up
                    {x: 0, y: 1},  // Down
                    {x: -1, y: 0}, // Left
                    {x: 1, y: 0}   // Right
                ];

                // Filter out invalid moves
                const validMoves = moves.filter(move => {
                    const newX = head.x + move.x;
                    const newY = head.y + move.y;
                    
                    // Check walls
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) return false;
                    
                    // Check self collision
                    if (this.body.some(segment => segment.x === newX && segment.y === newY)) return false;
                    
                    // Check other snake
                    const otherSnake = this === player1 ? player2 : player1;
                    if (otherSnake.alive && otherSnake.body.some(segment => 
                        segment.x === newX && segment.y === newY)) return false;
                    
                    return true;
                });

                if (validMoves.length === 0) return;

                // Sort moves by distance to food (A* simplified)
                validMoves.sort((a, b) => {
                    const posA = {x: head.x + a.x, y: head.y + a.y};
                    const posB = {x: head.x + b.x, y: head.y + b.y};
                    const distA = Math.abs(posA.x - food.x) + Math.abs(posA.y - food.y);
                    const distB = Math.abs(posB.x - food.x) + Math.abs(posB.y - food.y);
                    return distA - distB;
                });

                // Try the best move
                this.nextDirection = {...validMoves[0]};
            }
        }

        // Initialize players
        function initPlayers() {
            player1 = new Snake(5, 15, '#00ff88', gameMode === 'cpuVsHuman' || gameMode === 'cpuVsCpu');
            player2 = new Snake(24, 15, '#0088ff', gameMode === 'cpuVsHuman' || gameMode === 'cpuVsCpu');
            
            // Set initial directions
            player1.direction = {x: 1, y: 0};
            player1.nextDirection = {x: 1, y: 0};
            player2.direction = {x: -1, y: 0};
            player2.nextDirection = {x: -1, y: 0};
        }

        // Spawn food at random position
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };

                // Check if food spawns on any snake
                valid = true;
                if (player1.body.some(segment => segment.x === food.x && segment.y === food.y)) {
                    valid = false;
                }
                if (player2.body.some(segment => segment.x === food.x && segment.y === food.y)) {
                    valid = false;
                }
            }
        }

        // Draw food
        function drawFood() {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Shine effect
            ctx.fillStyle = '#ff8888';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2 - 3,
                food.y * CELL_SIZE + CELL_SIZE / 2 - 3,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // Draw grid
        function drawGrid() {
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        // Update score display
        function updateScore() {
            document.getElementById('score1').textContent = player1.score;
            document.getElementById('score2').textContent = player2.score;
        }

        // Game loop
        function gameUpdate() {
            if (!gameRunning || gameOver) return;

            // CPU moves
            if (player1.isCpu) player1.getCpuMove();
            if (player2.isCpu) player2.getCpuMove();

            // Update snakes
            player1.update();
            player2.update();

            // Draw everything
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            drawGrid();
            drawFood();
            player1.draw();
            player2.draw();

            // Check game over
            if (!player1.alive || !player2.alive) {
                endGame();
            }
        }

        // Start game
        function startGame(mode) {
            gameMode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            initPlayers();
            spawnFood();
            
            gameRunning = true;
            gameOver = false;
            updateScore();
            
            // Clear any existing loop
            if (gameLoop) clearInterval(gameLoop);
            
            // Set game speed based on mode
            const speed = gameMode === 'cpuVsCpu' ? CPU_SPEED : GAME_SPEED;
            gameLoop = setInterval(gameUpdate, speed);
        }

        // End game
        function endGame() {
            gameOver = true;
            gameRunning = false;
            clearInterval(gameLoop);
            
            const winnerText = document.getElementById('winnerText');
            if (player1.alive && !player2.alive) {
                winnerText.textContent = 'Player 1 Wins!';
                winnerText.style.color = '#00ff88';
            } else if (player2.alive && !player1.alive) {
                winnerText.textContent = 'Player 2 Wins!';
                winnerText.style.color = '#0088ff';
            } else {
                winnerText.textContent = "It's a Draw!";
                winnerText.style.color = '#ff8800';
            }
            
            document.getElementById('finalScore1').textContent = player1.score;
            document.getElementById('finalScore2').textContent = player2.score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // Restart game
        function restartGame() {
            if (gameOver) {
                startGame(gameMode);
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            // Player 1 controls (WASD)
            if (gameRunning && !player1.isCpu) {
                switch(e.key.toLowerCase()) {
                    case 'w':
                    case '↑':
                        if (player1.direction.y === 0) player1.setDirection(0, -1);
                        break;
                    case 's':
                    case '↓':
                        if (player1.direction.y === 0) player1.setDirection(0, 1);
                        break;
                    case 'a':
                    case '←':
                        if (player1.direction.x === 0) player1.setDirection(-1, 0);
                        break;
                    case 'd':
                    case '→':
                        if (player1.direction.x === 0) player1.setDirection(1, 0);
                        break;
                }
            }

            // Player 2 controls (Arrow keys)
            if (gameRunning && !player2.isCpu) {
                switch(e.key) {
                    case 'ArrowUp':
                        if (player2.direction.y === 0) player2.setDirection(0, -1);
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        if (player2.direction.y === 0) player2.setDirection(0, 1);
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        if (player2.direction.x === 0) player2.setDirection(-1, 0);
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        if (player2.direction.x === 0) player2.setDirection(1, 0);
                        e.preventDefault();
                        break;
                }
            }

            // Restart game
            if (gameOver && (e.key.toLowerCase() === 'r' || e.key === 'Enter')) {
                restartGame();
            }
        });

        // Initial draw
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        drawGrid();
    </script>
</body>
</html>
