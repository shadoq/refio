<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle - 30x30</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #000;
            display: block;
            border: 5px solid #ecf0f1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .menu-card {
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 3px solid #bdc3c7;
        }

        h1 { margin-top: 0; color: #f1c40f; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
            transition: background 0.2s;
        }

        button:hover { background-color: #27ae60; }

        #score-board {
            position: absolute;
            top: -50px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        #game-over-text {
            font-size: 48px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">
            <span id="score1">Player 1: 0</span>
            <span id="score2">Player 2: 0</span>
        </div>
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="ui-layer">
            <!-- Start Menu -->
            <div id="start-menu" class="menu-card">
                <h1>SNAKE BATTLE</h1>
                <div class="btn-group">
                    <button onclick="startGame('HVH')">Human vs Human</button>
                    <button onclick="startGame('CVH')">CPU vs Human</button>
                    <button onclick="startGame('CVC')">CPU vs CPU</button>
                </div>
                <div class="controls-hint">
                    P1: WASD | P2: Arrow Keys
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over" class="menu-card hidden">
                <div id="game-over-text">GAME OVER</div>
                <div id="winner-text" style="font-size: 24px; margin-bottom: 20px;"></div>
                <button onclick="showMenu()">Main Menu</button>
                <div class="controls-hint">Press 'R' or 'Space' to Restart</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const tileSize = canvas.width / gridSize;

        let gameLoop;
        let gameActive = false;
        let mode = ''; // 'HVH', 'CVH', 'CVC'

        let snake1, snake2, food;
        let scores = { p1: 0, p2: 0 };

        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        class Snake {
            constructor(x, y, color, isCPU, controls) {
                this.body = [{ x, y }];
                this.dir = DIRECTIONS.RIGHT;
                this.nextDir = DIRECTIONS.RIGHT;
                this.color = color;
                this.isCPU = isCPU;
                this.controls = controls;
                this.alive = true;
                this.score = 0;
            }

            update() {
                if (!this.alive) return;

                if (this.isCPU) {
                    this.think();
                }

                this.dir = this.nextDir;
                const head = { x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y };

                // Wall collision
                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    this.die();
                    return;
                }

                // Self/Other collision
                if (this.checkCollision(head)) {
                    this.die();
                    return;
                }

                this.body.unshift(head);

                // Food collision
                if (head.x === food.x && head.y === food.y) {
                    this.score++;
                    spawnFood();
                } else {
                    this.body.pop();
                }
            }

            checkCollision(head) {
                // Check self
                for (let segment of this.body) {
                    if (head.x === segment.x && head.y === segment.y) return true;
                }
                // Check other snake
                const other = (this === snake1) ? snake2 : snake1;
                for (let segment of other.body) {
                    if (head.x === segment.x && head.y === segment.y) return true;
                }
                return false;
            }

            die() {
                this.alive = false;
            }

            think() {
                const head = this.body[0];
                const dx = food.x - head.x;
                const dy = food.y - head.y;

                let preferredDir;
                if (Math.abs(dx) > Math.abs(dy)) {
                    preferredDir = dx > 0 ? DIRECTIONS.RIGHT : DIRECTIONS.LEFT;
                } else {
                    preferredDir = dy > 0 ? DIRECTIONS.DOWN : DIRECTIONS.UP;
                }

                // Basic avoidance: don't turn directly into a wall or self
                const nextPos = { x: head.x + preferredDir.x, y: head.y + preferredDir.y };
                if (nextPos.x < 0 || nextPos.x >= gridSize || nextPos.y < 0 || nextPos.y >= gridSize || this.checkCollision(nextPos)) {
                    // Try an alternative direction
                    const alternatives = Object.values(DIRECTIONS).filter(d => 
                        (d.x !== -this.dir.x || d.y !== -this.dir.y)
                    );
                    for (let alt of alternatives) {
                        const altPos = { x: head.x + alt.x, y: head.y + alt.y };
                        if (altPos.x >= 0 && altPos.x < gridSize && altPos.y >= 0 && altPos.y < gridSize && !this.checkCollision(altPos)) {
                            preferredDir = alt;
                            break;
                        }
                    }
                }
                this.nextDir = preferredDir;
            }

            draw() {
                ctx.fillStyle = this.color;
                this.body.forEach(seg => {
                    ctx.fillRect(seg.x * tileSize, seg.y * tileSize, tileSize - 1, tileSize - 1);
                });
            }
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            // Ensure food doesn't spawn on snakes
            const allSegments = [...snake1.body, ...snake2.body];
            if (allSegments.some(s => s.x === food.x && s.y === food.y)) {
                spawnFood();
            }
        }

        function startGame(selectedMode) {
            mode = selectedMode;
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');

            const isP1CPU = (mode === 'CVC' || mode === 'CVH');
            const isP2CPU = (mode === 'CVC' || mode === 'HVH' === false && mode !== 'CVH'); // Logic fix below
            
            // Correcting mode logic
            const p1CPU = (mode === 'CVC' || mode === 'CVH');
            const p2CPU = (mode === 'CVC'); 
            // Wait, the prompt says: 1. HVH, 2. CVH (CPU vs Human), 3. CVC.
            // Let's be explicit:
            const s1CPU = (mode === 'CVC' || mode === 'CVH');
            const s2CPU = (mode === 'CVC'); 
            // Actually, let's map them:
            // HVH: s1=Human, s2=Human
            // CVH: s1=CPU, s2=Human
            // CVC: s1=CPU, s2=CPU
            
            const s1IsCPU = (mode === 'CVC' || mode === 'CVH');
            const s2IsCPU = (mode === 'CVC');

            snake1 = new Snake(5, 15, '#2ecc71', s1IsCPU, { 
                up: 'w', down: 's', left: 'a', right: 'd' 
            });
            snake2 = new Snake(25, 15, '#3498db', s2IsCPU, { 
                up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' 
            });

            spawnFood();
            gameActive = true;
            scores = { p1: 0, p2: 0 };
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        function update() {
            if (!gameActive) return;

            snake1.update();
            snake2.update();

            // Update scores
            document.getElementById('score1').innerText = `Player 1: ${snake1.score}`;
            document.getElementById('score2').innerText = `Player 2: ${snake2.score}`;

            draw();

            if (!snake1.alive || !snake2.alive) {
                endGame();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 1, tileSize - 1);

            snake1.draw();
            snake2.draw();
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameLoop);
            
            const winnerText = document.getElementById('winner-text');
            if (!snake1.alive && !snake2.alive) {
                winnerText.innerText = "It's a Draw!";
            } else if (!snake1.alive) {
                winnerText.innerText = "Player 2 Wins!";
            } else {
                winnerText.innerText = "Player 1 Wins!";
            }

            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('game-over').classList.remove('hidden');
        }

        function showMenu() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('start-menu').classList.remove('hidden');
        }

        window.addEventListener('keydown', e => {
            // P1 Controls
            if (!snake1.isCPU) {
                if (e.key.toLowerCase() === 'w' && snake1.dir !== DIRECTIONS.DOWN) snake1.nextDir = DIRECTIONS.UP;
                if (e.key.toLowerCase() === 's' && snake1.dir !== DIRECTIONS.UP) snake1.nextDir = DIRECTIONS.DOWN;
                if (e.key.toLowerCase() === 'a' && snake1.dir !== DIRECTIONS.RIGHT) snake1.nextDir = DIRECTIONS.LEFT;
                if (e.key.toLowerCase() === 'd' && snake1.dir !== DIRECTIONS.LEFT) snake1.nextDir = DIRECTIONS.RIGHT;
            }

            // P2 Controls
            if (!snake2.isCPU) {
                if (e.key === 'ArrowUp' && snake2.dir !== DIRECTIONS.DOWN) snake2.nextDir = DIRECTIONS.UP;
                if (e.key === 'ArrowDown' && snake2.dir !== DIRECTIONS.UP) snake2.nextDir = DIRECTIONS.DOWN;
                if (e.key === 'ArrowLeft' && snake2.dir !== DIRECTIONS.RIGHT) snake2.nextDir = DIRECTIONS.LEFT;
                if (e.key === 'ArrowRight' && snake2.dir !== DIRECTIONS.LEFT) snake2.nextDir = DIRECTIONS.RIGHT;
            }

            // Restart
            if (!gameActive && (e.key === 'r' || e.key === 'R' || e.code === 'Space')) {
                if (mode) startGame(mode);
            }
        });
    </script>
</body>
</html>
