<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Growth</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 800px; height: 800px;
    box-shadow: 0 0 60px #101a3a, 0 0 120px rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.25);
  }
  canvas { display: block; background: #05070f; }
  .dg.ac { z-index: 10; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="800" height="800"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// ======================= SETUP =======================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = W / 2, CY = H / 2;

// Parameters (bound to dat.gui)
const params = {
  // Growth
  neuronCount: 4,
  growthSpeed: 6,
  maxDepth: 5,
  splitChance: 0.35,
  curvature: 0.6,
  maxBranchLength: 130,
  // Synapses
  synapseThreshold: 26,
  synapseGlow: 14,
  // Pulses
  pulseSpeed: 0.012,
  pulseFrequency: 1.4,
  pulseBrightness: 22,
  // Colors
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  // Actions
  regenerate: null,
  clear: null,
  togglePause: null
};

// Network state
let branches = [];    // {x1,y1,cx,cy,x2,y2, len, drawn, depth, color, width, tip:{x,y}, parent}
let synapses = [];    // {ax,ay,bx,by, a,b, phase}
let pulses = [];      // {a, b, t, dir}
let paused = false;
let lastTime = performance.now();
let pulseAcc = 0;

const rand = (a, b) => a + Math.random() * (b - a);

// ======================= NEURON GROWTH =======================
function spawnSeed(x, y, depth, color, width, angle) {
  branches.push({
    x1: x, y1: y,
    cx: 0, cy: 0, x2: 0, y2: 0,
    len: 0, drawn: 0,
    depth, color, width,
    angle,
    tip: { x, y },
    done: false
  });
}

function generateNetwork() {
  branches = [];
  synapses = [];
  pulses = [];
  const count = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2);
    const r = rand(0, 90);
    const x = CX + Math.cos(a) * r;
    const y = CY + Math.sin(a) * r;
    const startA = rand(0, Math.PI * 2);
    spawnSeed(x, y, 0, params.branchColor, rand(1.6, 2.6), startA);
    // each seed gets a few initial directions
    const arms = Math.round(rand(3, 5));
    for (let j = 1; j < arms; j++) {
      spawnSeed(x, y, 0, params.branchColor, rand(1.4, 2.4), startA + (Math.PI * 2 / arms) * j + rand(-0.4, 0.4));
    }
  }
  // init curve control points
  for (const b of branches) initBranchGeometry(b);
}

function initBranchGeometry(b) {
  // random length within max, scaled down by depth
  const scale = Math.max(0.35, 1 - b.depth * 0.13);
  b.len = rand(params.maxBranchLength * 0.4, params.maxBranchLength) * scale;
  // curve: perpendicular offset for quadratic control point
  const a = b.angle + rand(-0.5, 0.5) * params.curvature;
  const ex = b.x1 + Math.cos(a) * b.len;
  const ey = b.y1 + Math.sin(a) * b.len;
  const mx = (b.x1 + ex) / 2, my = (b.y1 + ey) / 2;
  const px = -Math.sin(a), py = Math.cos(a);
  const off = rand(-1, 1) * b.len * 0.35 * params.curvature;
  b.x1 = b.x1; b.y1 = b.y1;
  b.cx = mx + px * off; b.cy = my + py * off;
  b.x2 = ex; b.y2 = ey;
  b.tip = { x: ex, y: ey };
  b.angle = a;
}

// advance growth step by step
function growNetwork(dt) {
  let growing = false;
  const step = params.growthSpeed * dt * 60;

  for (const b of branches) {
    if (b.done) continue;
    if (b.drawn < 1) {
      b.drawn = Math.min(1, b.drawn + step / Math.max(20, b.len));
      growing = true;
    }
    if (b.drawn >= 1 && !b.done) {
      b.done = true;
      // possibly spawn side branches at the tip
      if (b.depth < params.maxDepth && branches.length < 900) {
        if (Math.random() < params.splitChance) {
          const n = Math.random() < 0.25 ? 2 : 1;
          for (let i = 0; i < n; i++) {
            const na = b.angle + rand(-1.1, 1.1) * (0.6 + params.curvature * 0.6);
            const nb = {
              x1: b.tip.x, y1: b.tip.y,
              depth: b.depth + 1,
              color: (b.depth + 1) % 2 === 0 && Math.random() < 0.5 ? params.accentColor : b.color,
              width: Math.max(0.5, b.width * rand(0.6, 0.85)),
              drawn: 0, done: false
            };
            branches.push(nb);
            initBranchGeometry(nb);
          }
        }
      }
    }
  }
  return growing;
}

// ======================= SYNAPSE DETECTION =======================
function detectSynapses() {
  const tips = branches.filter(b => b.done);
  const thr = params.synapseThreshold;
  const existing = new Set(synapses.map(s => s.a + '-' + s.b));
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      if (a.depth === 0 && b.depth === 0) continue; // skip seed-to-seed
      const dx = a.tip.x - b.tip.x, dy = a.tip.y - b.tip.y;
      if (dx * dx + dy * dy < thr * thr) {
        const key = branches.indexOf(a) + '-' + branches.indexOf(b);
        if (!existing.has(key)) {
          synapses.push({ a, b, phase: rand(0, Math.PI * 2) });
          existing.add(key);
        }
      }
    }
  }
}

// ======================= PULSE ANIMATION =======================
function spawnPulse() {
  if (synapses.length < 2) return;
  const syn = synapses[Math.floor(Math.random() * synapses.length)];
  // pick a path: start at one endpoint, walk connected synapses
  const path = [syn.a, syn.b];
  let current = syn.b;
  const used = new Set([synapses.indexOf(syn)]);
  const hops = 1 + Math.floor(Math.random() * 3);
  for (let h = 0; h < hops; h++) {
    const next = synapses.filter((s, idx) => !used.has(idx) && (s.a === current || s.b === current));
    if (!next.length) break;
    const s = next[Math.floor(Math.random() * next.length)];
    used.add(synapses.indexOf(s));
    const node = s.a === current ? s.b : s.a;
    path.push(node);
    current = node;
  }
  for (let i = 0; i < path.length - 1; i++) {
    pulses.push({ from: path[i], to: path[i + 1], t: 0 });
  }
}

function updatePulses(dt) {
  const sp = params.pulseSpeed * dt * 60;
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].t += sp;
    if (pulses[i].t >= 1) pulses.splice(i, 1);
  }
  // random activation frequency (per second)
  pulseAcc += dt * params.pulseFrequency;
  if (pulseAcc >= 1) {
    pulseAcc -= 1;
    if (Math.random() < 0.7) spawnPulse();
  }
}

// point on quadratic bezier
function qPoint(b, t) {
  const u = 1 - t;
  return {
    x: u * u * b.x1 + 2 * u * t * b.cx + t * t * b.x2,
    y: u * u * b.y1 + 2 * u * t * b.cy + t * t * b.y2
  };
}

// ======================= RENDERING =======================
function drawBackground() {
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);
  // soft central glow
  const g = ctx.createRadialGradient(CX, CY, 40, CX, CY, 520);
  g.addColorStop(0, 'rgba(16,26,58,0.55)');
  g.addColorStop(1, 'rgba(16,26,58,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // faint grid
  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawBranch(b) {
  if (b.drawn <= 0) return;
  ctx.save();
  ctx.strokeStyle = b.color;
  ctx.lineWidth = b.width;
  ctx.lineCap = 'round';
  ctx.shadowColor = b.color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(b.x1, b.y1);
  if (b.drawn >= 1) {
    ctx.quadraticCurveTo(b.cx, b.cy, b.x2, b.y2);
  } else {
    // partial draw: approximate with a line + curve up to drawn fraction
    const p = qPoint(b, Math.min(1, b.drawn));
    ctx.quadraticCurveTo(b.cx, b.cy, p.x, p.y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawSynapses(time) {
  for (const s of synapses) {
    const pulse = 0.6 + 0.4 * Math.sin(time * 0.002 + s.phase);
    ctx.save();
    ctx.strokeStyle = params.synapseColor;
    ctx.lineWidth = 1;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlow * pulse;
    ctx.beginPath();
    ctx.moveTo(s.a.tip.x, s.a.tip.y);
    ctx.lineTo(s.b.tip.x, s.b.tip.y);
    ctx.stroke();
    // glowing node dots
    for (const p of [s.a.tip, s.b.tip]) {
      ctx.fillStyle = params.synapseColor;
      ctx.shadowBlur = params.synapseGlow * 1.5 * pulse;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2 + pulse * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPulses() {
  for (const p of pulses) {
    const a = qPoint(p.from, 1);
    const b = qPoint(p.to, 1);
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    ctx.save();
    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = params.pulseBrightness;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    // trailing spark
    const t2 = Math.max(0, p.t - 0.12);
    const tx = a.x + (b.x - a.x) * t2;
    const ty = a.y + (b.y - a.y) * t2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(tx, ty, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawVignette() {
  const g = ctx.createRadialGradient(CX, CY, 260, CX, CY, 560);
  g.addColorStop(0, 'rgba(5,7,15,0)');
  g.addColorStop(1, 'rgba(5,7,15,0.85)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // scanlines
  ctx.fillStyle = 'rgba(0,229,255,0.03)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}

// ======================= MAIN LOOP =======================
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (!paused) {
    const growing = growNetwork(dt);
    updatePulses(dt);
    if (!growing) detectSynapses();
  }

  drawBackground();
  for (const b of branches) drawBranch(b);
  drawSynapses(now);
  drawPulses();
  drawVignette();

  requestAnimationFrame(frame);
}

// ======================= GUI SETUP =======================
function setupGUI() {
  const gui = new dat.GUI({ width: 280 });

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron count');
  fGrowth.add(params, 'growthSpeed', 1, 15, 0.5).name('Growth speed');
  fGrowth.add(params, 'maxDepth', 1, 8, 1).name('Max branch depth');
  fGrowth.add(params, 'splitChance', 0, 1, 0.01).name('Split chance');
  fGrowth.add(params, 'curvature', 0, 1.5, 0.01).name('Curvature');
  fGrowth.add(params, 'maxBranchLength', 40, 250, 1).name('Max branch length');
  fGrowth.open();

  const fSyn = gui.addFolder('Synapses');
  fSyn.add(params, 'synapseThreshold', 5, 60, 1).name('Distance threshold');
  fSyn.add(params, 'synapseGlow', 0, 40, 1).name('Glow strength');
  fSyn.open();

  const fPulse = gui.addFolder('Pulses');
  fPulse.add(params, 'pulseSpeed', 0.002, 0.05, 0.001).name('Pulse speed');
  fPulse.add(params, 'pulseFrequency', 0, 5, 0.1).name('Pulse frequency');
  fPulse.add(params, 'pulseBrightness', 0, 40, 1).name('Pulse brightness');
  fPulse.open();

  const fVis = gui.addFolder('Visuals');
  fVis.addColor(params, 'bgColor').name('Background');
  fVis.addColor(params, 'branchColor').name('Branch color');
  fVis.addColor(params, 'accentColor').name('Accent branch');
  fVis.addColor(params, 'synapseColor').name('Synapse color');
  fVis.addColor(params, 'pulseColor').name('Pulse color');

  gui.add(params, 'regenerate').name('Regenerate network');
  gui.add(params, 'clear').name('Clear canvas');
  gui.add(params, 'togglePause').name('Pause / resume');
}

// wire up action buttons
params.regenerate = () => { generateNetwork(); detectSynapses(); };
params.clear = () => { branches = []; synapses = []; pulses = []; };
params.togglePause = () => { paused = !paused; };

setupGUI();
generateNetwork();
requestAnimationFrame(frame);
</script>
</body>
</html>
