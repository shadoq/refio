<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    color: #333;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    color: #fff;
    font-size: 2.5rem;
    font-weight: 300;
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .todo-app {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  .input-section {
    display: flex;
    border-bottom: 1px solid #eee;
  }

  .input-section input {
    flex: 1;
    padding: 18px 20px;
    font-size: 1rem;
    border: none;
    outline: none;
    background: transparent;
    color: #333;
  }

  .input-section input::placeholder {
    color: #bbb;
  }

  .input-section button {
    padding: 18px 24px;
    background: #667eea;
    color: #fff;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .input-section button:hover {
    background: #5a6fd6;
  }

  .filters {
    display: flex;
    background: #f8f9fa;
    border-bottom: 1px solid #eee;
  }

  .filters button {
    flex: 1;
    padding: 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    color: #888;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }

  .filters button:hover {
    color: #555;
  }

  .filters button.active {
    color: #667eea;
    border-bottom-color: #667eea;
  }

  .todo-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s;
  }

  .todo-item:hover {
    background: #fafafa;
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid #ddd;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    margin-right: 14px;
  }

  .todo-checkbox:hover {
    border-color: #667eea;
  }

  .todo-item.completed .todo-checkbox {
    background: #667eea;
    border-color: #667eea;
  }

  .todo-checkbox::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .todo-item.completed .todo-checkbox::after {
    opacity: 1;
  }

  .todo-text {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #bbb;
  }

  .todo-delete {
    background: none;
    border: none;
    color: #ddd;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
    line-height: 1;
  }

  .todo-delete:hover {
    color: #e74c3c;
    background: #fdf0ef;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-size: 0.8rem;
    color: #aaa;
    background: #f8f9fa;
  }

  .clear-completed {
    background: none;
    border: none;
    color: #aaa;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .clear-completed:hover {
    color: #e74c3c;
    background: #fdf0ef;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #ccc;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>todos</h1>
  <div class="todo-app">
    <div class="input-section">
      <input type="text" id="todoInput" placeholder="What needs to be done?" autofocus>
      <button id="addBtn">+</button>
    </div>
    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="footer">
      <span id="itemCount">0 items left</span>
      <button class="clear-completed" id="clearCompleted">Clear completed</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo_zai_glm5_turbo_02';

  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  let currentFilter = 'all';

  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const itemCount = document.getElementById('itemCount');
  const clearCompleted = document.getElementById('clearCompleted');
  const filterButtons = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function getFilteredTodos() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function updateItemCount() {
    const active = todos.filter(t => !t.completed).length;
    itemCount.textContent = `${active} item${active !== 1 ? 's' : ''} left`;
  }

  function render() {
    const filtered = getFilteredTodos();
    todoList.innerHTML = '';

    if (filtered.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = currentFilter === 'all'
        ? 'No todos yet. Add one above!'
        : currentFilter === 'active'
          ? 'No active todos.'
          : 'No completed todos.';
      todoList.appendChild(empty);
    } else {
      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' completed' : '');

        const checkbox = document.createElement('div');
        checkbox.className = 'todo-checkbox';
        checkbox.addEventListener('click', () => toggleTodo(todo.id));

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'todo-delete';
        deleteBtn.textContent = '×';
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    updateItemCount();
    clearCompleted.style.display = todos.some(t => t.completed) ? '' : 'none';
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    todoInput.value = '';
    save();
    render();
    todoInput.focus();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) {
      todo.completed = !todo.completed;
      save();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  addBtn.addEventListener('click', addTodo);

  todoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearCompleted.addEventListener('click', () => {
    todos = todos.filter(t => !t.completed);
    save();
    render();
  });

  render();
</script>

</body>
</html>
