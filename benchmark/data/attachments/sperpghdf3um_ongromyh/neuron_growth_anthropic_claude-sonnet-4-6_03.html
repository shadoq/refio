<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #canvas {
    display: block;
    box-shadow: 0 0 60px rgba(0,229,255,0.15), 0 0 120px rgba(0,229,255,0.05);
    border: 1px solid rgba(0,229,255,0.12);
  }
  .dg.ac {
    z-index: 999 !important;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script>
(function() {
  'use strict';

  // ─── Canvas Setup ───────────────────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 800;

  // ─── Simulation State ────────────────────────────────────────────────────────
  let branches = [];
  let growthQueue = [];
  let synapses = [];
  let pulses = [];
  let synapseSet = new Set();
  let paused = false;
  let animId = null;
  let frameCount = 0;

  // ─── Parameters ──────────────────────────────────────────────────────────────
  const params = {
    // Growth
    neuronCount: 4,
    growthSpeed: 3,
    maxDepth: 5,
    splitChance: 0.35,
    curvature: 0.45,
    maxBranchLength: 120,
    // Synapses
    synapseDistance: 40,
    synapseGlow: 18,
    // Pulses
    pulseSpeed: 0.012,
    pulseFrequency: 0.018,
    pulseBrightness: 1.0,
    // Visuals
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    // Actions
    regenerate: regenerate,
    clearCanvas: clearAll,
    pauseResume: togglePause
  };

  // ─── dat.GUI Setup ───────────────────────────────────────────────────────────
  const gui = new dat.GUI({ width: 260 });
  gui.domElement.style.position = 'fixed';
  gui.domElement.style.top = '10px';
  gui.domElement.style.right = '10px';

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
  fGrowth.add(params, 'growthSpeed', 1, 8, 0.5).name('Growth Speed');
  fGrowth.add(params, 'maxDepth', 2, 8, 1).name('Max Depth');
  fGrowth.add(params, 'splitChance', 0.1, 0.8, 0.01).name('Split Chance');
  fGrowth.add(params, 'curvature', 0.0, 1.0, 0.01).name('Curvature');
  fGrowth.add(params, 'maxBranchLength', 40, 220, 5).name('Max Length');
  fGrowth.open();

  const fSynapses = gui.addFolder('Synapses');
  fSynapses.add(params, 'synapseDistance', 10, 100, 1).name('Distance Threshold');
  fSynapses.add(params, 'synapseGlow', 4, 40, 1).name('Glow Strength');
  fSynapses.open();

  const fPulses = gui.addFolder('Pulses');
  fPulses.add(params, 'pulseSpeed', 0.003, 0.04, 0.001).name('Pulse Speed');
  fPulses.add(params, 'pulseFrequency', 0.002, 0.06, 0.001).name('Pulse Frequency');
  fPulses.add(params, 'pulseBrightness', 0.2, 2.0, 0.05).name('Pulse Brightness');
  fPulses.open();

  const fVisuals = gui.addFolder('Visuals');
  fVisuals.addColor(params, 'backgroundColor').name('Background');
  fVisuals.addColor(params, 'branchColor').name('Branch Color');
  fVisuals.addColor(params, 'accentColor').name('Accent Color');
  fVisuals.addColor(params, 'synapseColor').name('Synapse Color');
  fVisuals.addColor(params, 'pulseColor').name('Pulse Color');
  fVisuals.open();

  const fActions = gui.addFolder('Controls');
  fActions.add(params, 'regenerate').name('⟳ Regenerate');
  fActions.add(params, 'clearCanvas').name('✕ Clear Canvas');
  fActions.add(params, 'pauseResume').name('⏸ Pause / Resume');
  fActions.open();

  // ─── Utility Functions ───────────────────────────────────────────────────────
  function rand(min, max) { return min + Math.random() * (max - min); }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r, g, b};
  }
  function colorWithAlpha(hex, alpha) {
    const {r,g,b} = hexToRgb(hex);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ─── Branch Creation ─────────────────────────────────────────────────────────
  function createBranch(x, y, angle, depth, parentColor) {
    const isAccent = Math.random() < 0.28;
    const color = isAccent ? params.accentColor : params.branchColor;
    const thickness = Math.max(0.4, (params.maxDepth - depth + 1) * 0.55 + rand(-0.2, 0.2));
    const maxLen = params.maxBranchLength * rand(0.5, 1.0) * (1 - depth * 0.1);
    return {
      points: [{x, y}],
      angle: angle,
      depth: depth,
      length: 0,
      maxLength: Math.max(20, maxLen),
      thickness: thickness,
      color: color,
      done: false,
      curveOffset: rand(-params.curvature, params.curvature) * 0.08,
      children: []
    };
  }

  function spawnSeeds() {
    const cx = W / 2, cy = H / 2;
    const count = Math.round(params.neuronCount);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + rand(-0.3, 0.3);
      const r = rand(20, 90);
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      const numAxons = randInt(2, 4);
      for (let j = 0; j < numAxons; j++) {
        const axonAngle = rand(0, Math.PI * 2);
        const b = createBranch(x, y, axonAngle, 0, null);
        branches.push(b);
        growthQueue.push(b);
      }
    }
  }

  // ─── Growth Step ─────────────────────────────────────────────────────────────
  function stepGrowth() {
    const speed = params.growthSpeed;
    const newQueue = [];

    for (let i = 0; i < growthQueue.length; i++) {
      const b = growthQueue[i];
      if (b.done) continue;

      for (let s = 0; s < speed; s++) {
        if (b.length >= b.maxLength) {
          b.done = true;
          break;
        }

        const last = b.points[b.points.length - 1];
        b.angle += b.curveOffset + rand(-params.curvature, params.curvature) * 0.06;
        const stepLen = rand(2.5, 5.0);
        const nx = last.x + Math.cos(b.angle) * stepLen;
        const ny = last.y + Math.sin(b.angle) * stepLen;

        // Soft boundary repulsion
        const margin = 30;
        if (nx < margin) b.angle = rand(-0.3, 0.3);
        else if (nx > W - margin) b.angle = Math.PI + rand(-0.3, 0.3);
        if (ny < margin) b.angle = Math.PI * 0.5 + rand(-0.3, 0.3);
        else if (ny > H - margin) b.angle = -Math.PI * 0.5 + rand(-0.3, 0.3);

        b.points.push({x: nx, y: ny});
        b.length += stepLen;

        // Occasional split
        if (b.depth < params.maxDepth && Math.random() < params.splitChance * 0.015) {
          const spreadAngle = rand(0.3, 0.9);
          const child1 = createBranch(nx, ny, b.angle + spreadAngle, b.depth + 1, b.color);
          const child2 = createBranch(nx, ny, b.angle - spreadAngle, b.depth + 1, b.color);
          branches.push(child1, child2);
          newQueue.push(child1, child2);

          // Occasional tiny side branch
          if (Math.random() < 0.3) {
            const side = createBranch(nx, ny, b.angle + rand(0.8, 1.4) * (Math.random()<0.5?1:-1), b.depth + 2, b.color);
            branches.push(side);
            newQueue.push(side);
          }
        }
      }

      if (!b.done) newQueue.push(b);
    }

    growthQueue = newQueue;
  }

  // ─── Synapse Detection ───────────────────────────────────────────────────────
  function detectSynapses() {
    const threshold = params.synapseDistance;
    const tips = [];

    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (b.points.length > 0) {
        const tip = b.points[b.points.length - 1];
        tips.push({x: tip.x, y: tip.y, branchIdx: i});
      }
    }

    for (let i = 0; i < tips.length; i++) {
      for (let j = i + 1; j < tips.length; j++) {
        const d = dist(tips[i].x, tips[i].y, tips[j].x, tips[j].y);
        if (d < threshold) {
          const key = `${tips[i].branchIdx}_${tips[j].branchIdx}`;
          if (!synapseSet.has(key)) {
            synapseSet.add(key);
            const mx = (tips[i].x + tips[j].x) * 0.5;
            const my = (tips[i].y + tips[j].y) * 0.5;
            synapses.push({
              x: mx, y: my,
              ax: tips[i].x, ay: tips[i].y,
              bx: tips[j].x, by: tips[j].y,
              phase: rand(0, Math.PI * 2),
              branchA: tips[i].branchIdx,
              branchB: tips[j].branchIdx
            });
          }
        }
      }
    }
  }

  // ─── Pulse Spawning ──────────────────────────────────────────────────────────
  function spawnPulses() {
    if (synapses.length === 0) return;
    if (Math.random() < params.pulseFrequency) {
      const syn = synapses[randInt(0, synapses.length - 1)];
      const forward = Math.random() < 0.5;
      pulses.push({
        synapse: syn,
        t: 0,
        forward: forward,
        speed: params.pulseSpeed * rand(0.7, 1.3),
        brightness: params.pulseBrightness
      });
    }
  }

  function updatePulses() {
    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i].t += pulses[i].speed;
      if (pulses[i].t >= 1) pulses.splice(i, 1);
    }
  }

  // ─── Rendering ───────────────────────────────────────────────────────────────
  function drawBackground() {
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, W, H);

    // Radial glow center
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.65);
    grad.addColorStop(0, 'rgba(16,26,58,0.55)');
    grad.addColorStop(1, 'rgba(5,7,15,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawScanlines() {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,229,255,0.035)';
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 4) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBranches() {
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (b.points.length < 2) continue;

      ctx.save();
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8 + b.depth * 1.5;

      ctx.beginPath();
      ctx.moveTo(b.points[0].x, b.points[0].y);

      for (let p = 1; p < b.points.length - 1; p++) {
        const mx = (b.points[p].x + b.points[p+1].x) * 0.5;
        const my = (b.points[p].y + b.points[p+1].y) * 0.5;
        ctx.quadraticCurveTo(b.points[p].x, b.points[p].y, mx, my);
      }
      const last = b.points[b.points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawSynapses() {
    const t = frameCount * 0.04;
    for (let i = 0; i < synapses.length; i++) {
      const s = synapses[i];
      const pulse = 0.5 + 0.5 * Math.sin(t + s.phase);
      const glow = params.synapseGlow * (0.6 + 0.4 * pulse);
      const alpha = 0.5 + 0.5 * pulse;

      // Connection line
      ctx.save();
      ctx.strokeStyle = colorWithAlpha(params.synapseColor, 0.25 + 0.2 * pulse);
      ctx.lineWidth = 0.8;
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = glow * 0.5;
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      ctx.moveTo(s.ax, s.ay);
      ctx.lineTo(s.bx, s.by);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Synapse node
      ctx.save();
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = glow;
      ctx.fillStyle = colorWithAlpha(params.synapseColor, alpha);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2.5 + pulse * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPulses() {
    for (let i = 0; i < pulses.length; i++) {
      const p = pulses[i];
      const s = p.synapse;
      const t = p.forward ? p.t : 1 - p.t;
      const px = lerp(s.ax, s.bx, t);
      const py = lerp(s.ay, s.by, t);
      const fade = Math.sin(p.t * Math.PI);
      const alpha = fade * p.brightness;
      const radius = 3.5 + fade * 2.5;

      ctx.save();
      ctx.shadowColor = params.pulseColor;
      ctx.shadowBlur = 20 * fade * p.brightness;
      ctx.fillStyle = colorWithAlpha(params.pulseColor, Math.min(1, alpha));
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // Inner bright core
      ctx.shadowBlur = 6;
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, alpha * 0.8)})`;
      ctx.beginPath();
      ctx.arc(px, py, radius * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawVignette() {
    const grad = ctx.createRadialGradient(W/2, H/2, W*0.35, W/2, H/2, W*0.75);
    grad.addColorStop(0, 'rgba(5,7,15,0)');
    grad.addColorStop(1, 'rgba(5,7,15,0.72)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // ─── Main Loop ───────────────────────────────────────────────────────────────
  function loop() {
    if (!paused) {
      frameCount++;
      drawBackground();
      drawScanlines();

      if (growthQueue.length > 0) {
        stepGrowth();
      }

      if (frameCount % 6 === 0) {
        detectSynapses();
      }

      spawnPulses();
      updatePulses();

      drawBranches();
      drawSynapses();
      drawPulses();
      drawVignette();
    }
    animId = requestAnimationFrame(loop);
  }

  // ─── Controls ────────────────────────────────────────────────────────────────
  function clearAll() {
    branches = [];
    growthQueue = [];
    synapses = [];
    pulses = [];
    synapseSet = new Set();
    frameCount = 0;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, W, H);
  }

  function regenerate() {
    clearAll();
    spawnSeeds();
  }

  function togglePause() {
    paused = !paused;
  }

  // ─── Init ────────────────────────────────────────────────────────────────────
  spawnSeeds();
  loop();

})();
</script>
</body>
</html>
