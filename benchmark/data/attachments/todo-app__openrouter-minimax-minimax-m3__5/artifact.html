<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    color: #2d3748;
  }

  .container {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 540px;
    padding: 32px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 24px;
    color: #2d3748;
    text-align: center;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #todo-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #todo-input:focus {
    border-color: #667eea;
  }

  #add-btn {
    padding: 12px 24px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #add-btn:hover {
    background: #5568d3;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
  }

  .filter-btn {
    padding: 8px 16px;
    background: transparent;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: #4a5568;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    border-color: #cbd5e0;
  }

  .filter-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }

  #todo-list {
    list-style: none;
    margin-bottom: 16px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    margin-bottom: 8px;
    transition: all 0.2s;
  }

  .todo-item:hover {
    border-color: #cbd5e0;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #a0aec0;
  }

  .todo-checkbox {
    width: 20px;
    height: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    color: #2d3748;
    word-break: break-word;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #e53e3e;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: #fed7d7;
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: #a0aec0;
    font-size: 15px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
    font-size: 14px;
    color: #718096;
  }

  #clear-completed {
    background: transparent;
    border: none;
    color: #667eea;
    cursor: pointer;
    font-size: 14px;
    transition: color 0.2s;
  }

  #clear-completed:hover {
    color: #5568d3;
    text-decoration: underline;
  }

  #clear-completed:disabled {
    color: #cbd5e0;
    cursor: not-allowed;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📝 My Todos</h1>

    <div class="input-group">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed" disabled>Clear completed</button>
    </div>
  </div>

<script>
  (function () {
    "use strict";

    const STORAGE_KEY = "todos_app_state_v1";

    /** @type {{id: string, text: string, completed: boolean, createdAt: number}[]} */
    let todos = [];
    let currentFilter = "all";

    const todoInput = document.getElementById("todo-input");
    const addBtn = document.getElementById("add-btn");
    const todoList = document.getElementById("todo-list");
    const itemsLeft = document.getElementById("items-left");
    const clearCompletedBtn = document.getElementById("clear-completed");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // ---------- Persistence ----------
    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        // Basic shape validation
        return parsed.filter(
          (t) =>
            t &&
            typeof t.id === "string" &&
            typeof t.text === "string" &&
            typeof t.completed === "boolean"
        );
      } catch (err) {
        console.warn("Failed to load todos from localStorage:", err);
        return [];
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (err) {
        console.warn("Failed to save todos to localStorage:", err);
      }
    }

    // ---------- Helpers ----------
    function generateId() {
      return (
        Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
      );
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function getFilteredTodos() {
      if (currentFilter === "active") {
        return todos.filter((t) => !t.completed);
      }
      if (currentFilter === "completed") {
        return todos.filter((t) => t.completed);
      }
      return todos;
    }

    // ---------- Rendering ----------
    function render() {
      const filtered = getFilteredTodos();

      todoList.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent =
          currentFilter === "all"
            ? "No todos yet. Add one above!"
            : currentFilter === "active"
            ? "No active todos."
            : "No completed todos.";
        todoList.appendChild(empty);
      } else {
        for (const todo of filtered) {
          const li = document.createElement("li");
          li.className = "todo-item" + (todo.completed ? " completed" : "");
          li.dataset.id = todo.id;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "todo-checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute(
            "aria-label",
            "Mark todo as " + (todo.completed ? "active" : "completed")
          );
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.setAttribute("aria-label", "Delete todo");
          deleteBtn.textContent = "✕";
          deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        }
      }

      // Footer counts
      const activeCount = todos.filter((t) => !t.completed).length;
      itemsLeft.textContent =
        activeCount + (activeCount === 1 ? " item left" : " items left");

      const completedCount = todos.filter((t) => t.completed).length;
      clearCompletedBtn.disabled = completedCount === 0;
    }

    // ---------- Mutations ----------
    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      todos.push({
        id: generateId(),
        text: trimmed,
        completed: false,
        createdAt: Date.now(),
      });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find((t) => t.id === id);
      if (!todo) return;
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      saveTodos();
      render();
    }

    function clearCompleted() {
      todos = todos.filter((t) => !t.completed);
      saveTodos();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
      render();
    }

    // ---------- Event wiring ----------
    addBtn.addEventListener("click", () => {
      addTodo(todoInput.value);
      todoInput.value = "";
      todoInput.focus();
    });

    todoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        addTodo(todoInput.value);
        todoInput.value = "";
      }
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => setFilter(btn.dataset.filter));
    });

    clearCompletedBtn.addEventListener("click", clearCompleted);

    // ---------- Init ----------
    todos = loadTodos();
    render();
  })();
</script>
</body>
</html>
