<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 2rem;
    text-align: center;
    color: #1a1a2e;
    margin-bottom: 24px;
    font-weight: 700;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: #4f46e5; }
  .input-row button {
    padding: 12px 20px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .input-row button:hover { background: #4338ca; }

  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #e5e7eb;
    border-radius: 10px;
    padding: 4px;
  }
  .filters button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-size: .875rem;
    font-weight: 600;
    color: #4b5563;
    cursor: pointer;
    transition: all .2s;
  }
  .filters button.active {
    background: #fff;
    color: #4f46e5;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }

  .todo-list { list-style: none; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #fff;
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    transition: box-shadow .2s;
  }
  .todo-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .todo-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #4f46e5;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-item .text {
    flex: 1;
    font-size: 1rem;
    color: #1f2937;
    word-break: break-word;
  }
  .todo-item.completed .text {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .todo-item .delete {
    background: none;
    border: none;
    color: #d1d5db;
    font-size: 1.25rem;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color .2s;
    flex-shrink: 0;
  }
  .todo-item .delete:hover { color: #ef4444; }

  .empty {
    text-align: center;
    color: #9ca3af;
    padding: 32px 0;
    font-size: .95rem;
  }

  .counter {
    text-align: center;
    color: #6b7280;
    font-size: .8rem;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>✅ Todo App</h1>
  <div class="input-row">
    <input id="todoInput" type="text" placeholder="What needs to be done?" autofocus>
    <button id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
  <div class="counter" id="counter"></div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'todo-app-data';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const input   = document.getElementById('todoInput');
  const addBtn  = document.getElementById('addBtn');
  const list    = document.getElementById('todoList');
  const counter = document.getElementById('counter');
  const filters = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    input.value = '';
    input.focus();
    save();
    render();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.completed = !t.completed;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function setFilter(f) {
    filter = f;
    filters.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

  function render() {
    const filtered = todos.filter(t => {
      if (filter === 'active') return !t.completed;
      if (filter === 'completed') return t.completed;
      return true;
    });

    if (filtered.length === 0) {
      const msg = todos.length === 0
        ? 'No todos yet. Add one above!'
        : `No ${filter} todos.`;
      list.innerHTML = `<li class="empty">${msg}</li>`;
    } else {
      list.innerHTML = filtered.map(t => `
        <li class="todo-item ${t.completed ? 'completed' : ''}">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="window.__toggle(${t.id})">
          <span class="text">${escapeHtml(t.text)}</span>
          <button class="delete" onclick="window.__delete(${t.id})" title="Delete">&times;</button>
        </li>
      `).join('');
    }

    const active = todos.filter(t => !t.completed).length;
    counter.textContent = `${active} item${active !== 1 ? 's' : ''} left`;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Expose handlers for inline event handlers
  window.__toggle = toggleTodo;
  window.__delete = deleteTodo;

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  filters.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

  render();
})();
</script>
</body>
</html>
