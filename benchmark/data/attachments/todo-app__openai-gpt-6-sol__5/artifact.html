<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17243b">
  <title>Todo — Make room for what matters</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243b;
      --muted: #65728a;
      --surface: #ffffff;
      --background: #f4f6fb;
      --border: #e5eaf2;
      --accent: #5548d9;
      --accent-hover: #4436bf;
      --focus: #8b80f4;
      --shadow: 0 24px 70px rgba(27, 38, 74, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 295px;
      padding: 58px 24px 105px;
      background: linear-gradient(125deg, #17243b 0%, #28315d 60%, #453978 100%);
      color: white;
      text-align: center;
    }

    .hero::before,
    .hero::after {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .hero::before {
      top: -190px;
      right: -85px;
      width: 420px;
      height: 420px;
      box-shadow: 0 0 0 65px rgba(255, 255, 255, 0.025);
    }

    .hero::after {
      bottom: -225px;
      left: -100px;
      width: 360px;
      height: 360px;
      box-shadow: 0 0 0 55px rgba(255, 255, 255, 0.025);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #c2baff;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 3.5rem);
      font-weight: 780;
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 14px 0 0;
      color: #d7dbea;
      font-size: 1rem;
    }

    .app {
      position: relative;
      width: min(100% - 32px, 680px);
      margin: -66px auto 64px;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(229, 234, 242, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .entry {
      padding: 30px 32px 26px;
    }

    .entry label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .entry-row {
      display: flex;
      gap: 10px;
    }

    .entry input {
      min-width: 0;
      flex: 1;
      padding: 13px 16px;
      border: 1px solid #dce2ed;
      border-radius: 11px;
      background: #fafbfe;
      color: var(--ink);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .entry input::placeholder {
      color: #929caf;
    }

    .entry input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(85, 72, 217, 0.16);
    }

    .add-button {
      flex-shrink: 0;
      padding: 12px 21px;
      border: 1px solid var(--accent);
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .add-button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 17px 32px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #fcfcff;
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f4f6fb;
    }

    .filter {
      padding: 6px 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      transition: background 0.2s, color 0.2s;
    }

    .filter:hover {
      color: var(--accent);
    }

    .filter[aria-pressed="true"] {
      background: white;
      color: var(--accent);
      box-shadow: 0 1px 5px rgba(27, 38, 74, 0.12);
    }

    .todo-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 70px;
      padding: 15px 32px;
      border-bottom: 1px solid var(--border);
    }

    .todo-item:last-child {
      border-bottom: 0;
    }

    .todo-check {
      width: 20px;
      height: 20px;
      margin: 0;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .todo-item.completed .todo-text {
      color: #929caf;
      text-decoration: line-through;
      text-decoration-color: #a7afbf;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #8994a8;
      font-size: 1.4rem;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }

    .delete-button:hover {
      background: #fff0f0;
      color: #ba4454;
    }

    .empty {
      padding: 55px 24px 60px;
      text-align: center;
    }

    .empty[hidden] {
      display: none;
    }

    .empty-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 17px;
      place-items: center;
      border-radius: 18px;
      background: #f0eeff;
      color: var(--accent);
      font-size: 1.7rem;
    }

    .empty h2 {
      margin: 0 0 5px;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .footer-note {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      .hero {
        min-height: 270px;
        padding-top: 50px;
      }

      .app {
        margin-top: -60px;
      }

      .entry {
        padding: 24px 20px;
      }

      .entry-row {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .toolbar {
        padding: 16px 20px;
      }

      .todo-item {
        padding: 15px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .entry input,
      .add-button,
      .filter,
      .delete-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">A little more clarity</p>
      <h1>Today, in focus.</h1>
      <p class="subtitle">Make room for what matters, one task at a time.</p>
    </div>
  </header>

  <main class="app">
    <section class="card" aria-label="Todo list">
      <form class="entry" id="todo-form">
        <label for="todo-input">What needs doing?</label>
        <div class="entry-row">
          <input id="todo-input" type="text" placeholder="Add a new task..." autocomplete="off" required>
          <button class="add-button" type="submit">Add task</button>
        </div>
      </form>

      <div class="toolbar">
        <p class="count" id="remaining-count" aria-live="polite"></p>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
      <div class="empty" id="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✦</div>
        <h2 id="empty-title"></h2>
        <p id="empty-description"></p>
      </div>
    </section>
    <p class="footer-note">Your tasks are saved in this browser.</p>
  </main>

  <script>
    (() => {
      const storageKey = "today-in-focus:todos";
      const form = document.getElementById("todo-form");
      const input = document.getElementById("todo-input");
      const list = document.getElementById("todo-list");
      const count = document.getElementById("remaining-count");
      const emptyState = document.getElementById("empty-state");
      const emptyTitle = document.getElementById("empty-title");
      const emptyDescription = document.getElementById("empty-description");
      const filterButtons = document.querySelectorAll("[data-filter]");

      let todos = [];
      let currentFilter = "all";

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved)) {
          todos = saved.filter(todo =>
            todo !== null &&
            typeof todo === "object" &&
            typeof todo.id === "string" &&
            typeof todo.text === "string" &&
            typeof todo.completed === "boolean"
          );
        }
      } catch (error) {
        todos = [];
      }

      function save() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(todos));
        } catch (error) {
          // Keep the app usable when browser storage is unavailable.
        }
      }

      function render() {
        const remaining = todos.filter(todo => !todo.completed).length;
        const visible = todos.filter(todo =>
          currentFilter === "all" ||
          (currentFilter === "active" && !todo.completed) ||
          (currentFilter === "completed" && todo.completed)
        );

        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} remaining`;

        filterButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });

        const fragment = document.createDocumentFragment();

        visible.forEach(todo => {
          const item = document.createElement("li");
          item.className = `todo-item${todo.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "todo-check";
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `Mark ${todo.text} as ${todo.completed ? "active" : "completed"}`);
          checkbox.addEventListener("change", () => {
            todo.completed = checkbox.checked;
            save();
            render();
            const updated = Array.from(list.querySelectorAll(".todo-check"))
              .find(control => control.dataset.id === todo.id);
            if (updated) updated.focus();
          });
          checkbox.dataset.id = todo.id;

          const text = document.createElement("label");
          text.className = "todo-text";
          text.textContent = todo.text;
          const checkboxId = `todo-${todo.id}`;
          checkbox.id = checkboxId;
          text.htmlFor = checkboxId;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.setAttribute("aria-label", `Delete ${todo.text}`);
          deleteButton.textContent = "×";
          deleteButton.addEventListener("click", () => {
            todos = todos.filter(entry => entry.id !== todo.id);
            save();
            render();
          });

          item.append(checkbox, text, deleteButton);
          fragment.append(item);
        });

        list.replaceChildren(fragment);

        emptyState.hidden = visible.length !== 0;
        if (visible.length === 0) {
          const messages = {
            all: ["A fresh start", "Add a task above to get things moving."],
            active: ["All caught up", "No active tasks right now. Nicely done!"],
            completed: ["Nothing completed yet", "Finished tasks will show up here."]
          };
          [emptyTitle.textContent, emptyDescription.textContent] = messages[currentFilter];
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.value = "";
          return;
        }

        todos.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false
        });
        input.value = "";
        save();
        render();
        input.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
