<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  :root {
    --bg:#0f172a;
    --card:#111827;
    --text:#e5e7eb;
    --muted:#9ca3af;
    --accent:#6366f1;
    --accent-hover:#4f46e5;
    --danger:#ef4444;
    --done:#10b981;
    --border:#1f2937;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
    background:linear-gradient(180deg,#0b1020,#0f172a 40%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
  }
  .app{
    width:100%;
    max-width:560px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    overflow:hidden;
  }
  header{
    padding:20px 24px;
    border-bottom:1px solid var(--border);
  }
  h1{
    margin:0;
    font-size:20px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .input-row{
    display:flex;
    gap:8px;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }
  input[type="text"]{
    flex:1;
    background:#0b1220;
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:15px;
    outline:none;
  }
  input[type="text"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(99,102,241,.2);
  }
  button{
    background:var(--accent);
    color:white;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  button:hover{background:var(--accent-hover)}
  button.secondary{
    background:#1f2937;
    color:var(--text);
  }
  button.secondary:hover{background:#273449}
  .filters{
    display:flex;
    gap:6px;
    padding:12px 24px;
    border-bottom:1px solid var(--border);
    background:#0b1220;
  }
  .filters button{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    padding:6px 12px;
    font-size:13px;
    border-radius:8px;
  }
  .filters button.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
  }
  ul{
    list-style:none;
    margin:0;
    padding:0;
  }
  li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 24px;
    border-bottom:1px solid #0b1220;
  }
  li:last-child{border-bottom:none}
  .todo-text{
    flex:1;
    font-size:15px;
    word-break:break-word;
  }
  .done .todo-text{
    text-decoration:line-through;
    color:var(--muted);
  }
  .checkbox{
    width:20px;
    height:20px;
    border:2px solid var(--border);
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .checkbox.checked{
    background:var(--done);
    border-color:var(--done);
    color:white;
  }
  .delete{
    background:transparent;
    color:var(--muted);
    border:none;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
  }
  .delete:hover{color:white;background:#1f2937}
  .footer{
    padding:12px 24px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .empty{
    text-align:center;
    padding:40px 24px;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="app" role="application" aria-label="Todo App">
  <header>
    <h1>Todo</h1>
  </header>
  <div class="input-row">
    <input id="newTodo" type="text" placeholder="Add a new task..." aria-label="New todo" />
    <button id="addBtn">Add</button>
  </div>
  <div class="filters" role="tablist" aria-label="Filter todos">
    <button data-filter="all" class="active" role="tab" aria-selected="true">All</button>
    <button data-filter="active" role="tab" aria-selected="false">Active</button>
    <button data-filter="completed" role="tab" aria-selected="false">Completed</button>
  </div>
  <ul id="list" aria-live="polite"></ul>
  <div class="empty" id="emptyState">No tasks yet. Add one above.</div>
  <div class="footer">
    <span id="count">0 items left</span>
    <button id="clearCompleted" class="secondary">Clear completed</button>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'todo_ollama_muse_glimmer_30b_01';
  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('newTodo');
  const addBtn = document.getElementById('addBtn');
  const filtersEl = document.querySelector('.filters');
  const emptyState = document.getElementById('emptyState');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clearCompleted');

  let todos = [];
  let filter = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) todos = JSON.parse(raw);
    } catch {}
    if (!Array.isArray(todos)) todos = [];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    listEl.innerHTML = '';
    const filtered = todos.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'completed') return t.done;
      return true;
    });

    if (filtered.length === 0) {
      emptyState.style.display = todos.length === 0 ? 'block' : 'none';
      listEl.style.display = todos.length === 0 ? 'none' : 'block';
    } else {
      emptyState.style.display = 'none';
      listEl.style.display = 'block';
    }

    filtered.forEach(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.dataset.id = t.id;

      const cb = document.createElement('div');
      cb.className = 'checkbox' + (t.done ? ' checked' : '');
      cb.setAttribute('role','checkbox');
      cb.setAttribute('aria-checked', t.done);
      cb.innerHTML = t.done ? '✓' : '';
      cb.addEventListener('click', () => toggle(t.id));

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = t.text;

      const del = document.createElement('button');
      del.className = 'delete';
      del.textContent = '✕';
      del.setAttribute('aria-label','Delete task');
      del.addEventListener('click', () => remove(t.id));

      li.append(cb, span, del);
      listEl.appendChild(li);
    });

    const left = todos.filter(t => !t.done).length;
    countEl.textContent = `${left} item${left !== 1 ? 's' : ''} left`;
  }

  function add(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    todos.unshift({ id: crypto.randomUUID(), text: trimmed, done: false, created: Date.now() });
    save();
    render();
    inputEl.value = '';
    inputEl.focus();
  }

  function toggle(id) {
    const t = todos.find(x => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    todos = todos.filter(x => x.id !== id);
    save();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.done);
    save();
    render();
  }

  addBtn.addEventListener('click', () => add(inputEl.value));
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') add(inputEl.value); });

  filtersEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    filter = btn.dataset.filter;
    [...filtersEl.children].forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active);
    });
    render();
  });

  clearBtn.addEventListener('click', clearCompleted);

  load();
  render();
})();
</script>
</body>
</html>
