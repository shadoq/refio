<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
            --border-color: #444;
            --font-mono: 'Courier New', monospace;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--accent-color);
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .emulator-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .canvas-container {
            border: 2px solid var(--border-color);
            padding: 5px;
            background: #000;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        input[type="range"] {
            width: 150px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .key {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3a3a3a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 14px;
            cursor: default;
            user-select: none;
        }

        .key.active {
            background-color: var(--accent-color);
            color: white;
        }

        .debugger {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            width: 300px;
            font-family: var(--font-mono);
            font-size: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .debugger h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .debug-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .debug-label {
            color: #888;
        }

        .debug-value {
            color: var(--accent-color);
        }

        .stack-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .stack-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #3a3a3a;
        }

        .file-input-container {
            margin: 10px 0;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 8px 16px;
            background: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .file-label:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        .instruction-display {
            background: #000;
            padding: 5px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CHIP-8 Emulator</h1>
    
    <div class="container">
        <div class="emulator-section">
            <div class="canvas-container">
                <canvas id="display" width="64" height="32" style="width: 640px; height: 320px;"></canvas>
            </div>
            
            <div class="controls">
                <button id="btnRun">Run</button>
                <button id="btnPause">Pause</button>
                <button id="btnStep">Step</button>
                <button id="btnReset">Reset</button>
            </div>
            
            <div class="slider-container">
                <label for="speedSlider">Speed:</label>
                <input type="range" id="speedSlider" min="1" max="500" value="50">
                <span id="speedValue">50</span> ops/frame
            </div>
            
            <div class="file-input-container">
                <label for="romInput" class="file-label">Load ROM File</label>
                <input type="file" id="romInput" accept=".ch8,.rom">
            </div>
            
            <div class="status" id="status">Ready</div>
        </div>
        
        <div class="debugger">
            <h3>Debugger</h3>
            
            <div class="debug-row">
                <span class="debug-label">PC:</span>
                <span class="debug-value" id="debugPC">0x000</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">I:</span>
                <span class="debug-value" id="debugI">0x000</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">Opcode:</span>
                <span class="debug-value" id="debugOpcode">0x0000</span>
            </div>
            <div class="instruction-display" id="instructionDisplay">--</div>
            
            <h3 style="margin-top: 15px;">Registers</h3>
            <div id="registers"></div>
            
            <h3 style="margin-top: 15px;">Timers</h3>
            <div class="debug-row">
                <span class="debug-label">Delay:</span>
                <span class="debug-value" id="debugDelay">0</span>
            </div>
            <div class="debug-row">
                <span class="debug-label">Sound:</span>
                <span class="debug-value" id="debugSound">0</span>
            </div>
            
            <h3 style="margin-top: 15px;">Stack</h3>
            <ul class="stack-list" id="stackList"></ul>
            
            <h3 style="margin-top: 15px;">Key State</h3>
            <div class="keypad" id="keypad"></div>
        </div>
    </div>

    <script>
        // CHIP-8 Emulator Implementation
        class Chip8 {
            constructor() {
                this.memory = new Uint8Array(4096);
                this.V = new Uint8Array(16);
                this.I = 0;
                this.PC = 0x200;
                this.stack = [];
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display = new Uint8Array(64 * 32);
                this.keys = new Uint8Array(16);
                this.running = false;
                this.speed = 50;
                this.lastTime = 0;
                this.timerInterval = null;
                
                // Fontset (0-15)
                this.fontset = [
                    0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
                    0x20, 0x60, 0x20, 0x20, 0x70, // 1
                    0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
                    0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
                    0x90, 0x90, 0xF0, 0x10, 0x10, // 4
                    0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
                    0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
                    0xF0, 0x10, 0x20, 0x40, 0x40, // 7
                    0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
                    0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
                    0xF0, 0x90, 0xF0, 0x90, 0x90, // A
                    0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
                    0xF0, 0x80, 0x80, 0x80, 0xF0, // C
                    0xE0, 0x90, 0x90, 0x90, 0xE0, // D
                    0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
                    0xF0, 0x80, 0xF0, 0x80, 0x80  // F
                ];
                
                this.init();
            }
            
            init() {
                // Clear memory
                this.memory.fill(0);
                
                // Load fontset
                for (let i = 0; i < this.fontset.length; i++) {
                    this.memory[0x050 + i] = this.fontset[i];
                }
                
                // Reset registers
                this.V.fill(0);
                this.I = 0;
                this.PC = 0x200;
                this.stack = [];
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.display.fill(0);
                this.keys.fill(0);
                this.running = false;
            }
            
            loadROM(rom) {
                this.init();
                for (let i = 0; i < rom.length; i++) {
                    this.memory[0x200 + i] = rom[i];
                }
                this.updateStatus("ROM loaded successfully");
            }
            
            cycle() {
                // Fetch opcode (2 bytes)
                const opcode = (this.memory[this.PC] << 8) | this.memory[this.PC + 1];
                
                // Decode and execute
                this.execute(opcode);
                
                // Update timers
                if (this.delayTimer > 0) this.delayTimer--;
                if (this.soundTimer > 0) this.soundTimer--;
                
                return opcode;
            }
            
            execute(opcode) {
                const x = (opcode & 0x0F00) >> 8;
                const y = (opcode & 0x00F0) >> 4;
                const n = opcode & 0x000F;
                const nn = opcode & 0x00FF;
                const nnn = opcode & 0x0FFF;
                
                switch (opcode & 0xF000) {
                    case 0x0000:
                        switch (opcode) {
                            case 0x00E0: // CLS
                                this.display.fill(0);
                                this.PC += 2;
                                break;
                            case 0x00EE: // RET
                                this.PC = this.stack.pop();
                                this.PC += 2;
                                break;
                            default:
                                // 0NNN - Call RCA 1802 program (not implemented)
                                this.PC += 2;
                        }
                        break;
                        
                    case 0x1000: // 1NNN - Jump to address NNN
                        this.PC = nnn;
                        break;
                        
                    case 0x2000: // 2NNN - Call subroutine at NNN
                        this.stack.push(this.PC);
                        this.PC = nnn;
                        break;
                        
                    case 0x3000: // 3XNN - Skip if VX == NN
                        this.PC += (this.V[x] === nn) ? 4 : 2;
                        break;
                        
                    case 0x4000: // 4XNN - Skip if VX != NN
                        this.PC += (this.V[x] !== nn) ? 4 : 2;
                        break;
                        
                    case 0x5000: // 5XY0 - Skip if VX == VY
                        this.PC += (this.V[x] === this.V[y]) ? 4 : 2;
                        break;
                        
                    case 0x6000: // 6XNN - Set VX = NN
                        this.V[x] = nn;
                        this.PC += 2;
                        break;
                        
                    case 0x7000: // 7XNN - Add NN to VX
                        this.V[x] = (this.V[x] + nn) & 0xFF;
                        this.PC += 2;
                        break;
                        
                    case 0x8000:
                        switch (n) {
                            case 0x0: // 8XY0 - Set VX = VY
                                this.V[x] = this.V[y];
                                this.PC += 2;
                                break;
                            case 0x1: // 8XY1 - VX = VX OR VY
                                this.V[x] |= this.V[y];
                                this.V[0xF] = 0;
                                this.PC += 2;
                                break;
                            case 0x2: // 8XY2 - VX = VX AND VY
                                this.V[x] &= this.V[y];
                                this.V[0xF] = 0;
                                this.PC += 2;
                                break;
                            case 0x3: // 8XY3 - VX = VX XOR VY
                                this.V[x] ^= this.V[y];
                                this.V[0xF] = 0;
                                this.PC += 2;
                                break;
                            case 0x4: // 8XY4 - Add VY to VX, set VF = carry
                                const sum = this.V[x] + this.V[y];
                                this.V[0xF] = sum > 255 ? 1 : 0;
                                this.V[x] = sum & 0xFF;
                                this.PC += 2;
                                break;
                            case 0x5: // 8XY5 - Subtract VY from VX, set VF = NOT borrow
                                this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
                                this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
                                this.PC += 2;
                                break;
                            case 0x6: // 8XY6 - Shift VX right by 1
                                this.V[0xF] = this.V[x] & 0x1;
                                this.V[x] >>= 1;
                                this.PC += 2;
                                break;
                            case 0x7: // 8XY7 - Set VX = VY - VX, set VF = NOT borrow
                                this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
                                this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
                                this.PC += 2;
                                break;
                            case 0xE: // 8XYE - Shift VX left by 1
                                this.V[0xF] = (this.V[x] & 0x80) >> 7;
                                this.V[x] <<= 1;
                                this.V[x] &= 0xFF;
                                this.PC += 2;
                                break;
                            default:
                                this.PC += 2;
                        }
                        break;
                        
                    case 0x9000: // 9XY0 - Skip if VX != VY
                        this.PC += (this.V[x] !== this.V[y]) ? 4 : 2;
                        break;
                        
                    case 0xA000: // ANNN - Set I = NNN
                        this.I = nnn;
                        this.PC += 2;
                        break;
                        
                    case 0xB000: // BNNN - Jump to NNN + V0
                        this.PC = nnn + this.V[0];
                        break;
                        
                    case 0xC000: // CXNN - Set VX = random byte AND NN
                        this.V[x] = (Math.random() * 256) & nn;
                        this.PC += 2;
                        break;
                        
                    case 0xD000: // DXYN - Draw sprite
                        const height = n;
                        const vx = this.V[x];
                        const vy = this.V[y];
                        this.V[0xF] = 0;
                        
                        for (let row = 0; row < height; row++) {
                            const spriteByte = this.memory[this.I + row];
                            for (let col = 0; col < 8; col++) {
                                if ((spriteByte & (0x80 >> col)) !== 0) {
                                    const px = (vx + col) % 64;
                                    const py = (vy + row) % 32;
                                    const idx = py * 64 + px;
                                    
                                    if (this.display[idx] === 1) {
                                        this.V[0xF] = 1;
                                    }
                                    
                                    this.display[idx] ^= 1;
                                }
                            }
                        }
                        this.PC += 2;
                        break;
                        
                    case 0xE000:
                        switch (nn) {
                            case 0x9E: // EX9E - Skip if key VX is pressed
                                this.PC += (this.keys[this.V[x]] !== 0) ? 4 : 2;
                                break;
                            case 0xA1: // EXA1 - Skip if key VX is not pressed
                                this.PC += (this.keys[this.V[x]] === 0) ? 4 : 2;
                                break;
                            default:
                                this.PC += 2;
                        }
                        break;
                        
                    case 0xF000:
                        switch (nn) {
                            case 0x07: // FX07 - Set VX = delay timer
                                this.V[x] = this.delayTimer;
                                this.PC += 2;
                                break;
                            case 0x0A: // FX0A - Wait for key press
                                let keyPressed = false;
                                for (let i = 0; i < 16; i++) {
                                    if (this.keys[i] !== 0) {
                                        this.V[x] = i;
                                        keyPressed = true;
                                        break;
                                    }
                                }
                                if (!keyPressed) {
                                    return; // Don't advance PC
                                }
                                this.PC += 2;
                                break;
                            case 0x15: // FX15 - Set delay timer = VX
                                this.delayTimer = this.V[x];
                                this.PC += 2;
                                break;
                            case 0x18: // FX18 - Set sound timer = VX
                                this.soundTimer = this.V[x];
                                this.PC += 2;
                                break;
                            case 0x1E: // FX1E - Add VX to I
                                this.I = (this.I + this.V[x]) & 0xFFF;
                                this.PC += 2;
                                break;
                            case 0x29: // FX29 - Set I = location of sprite for digit VX
                                this.I = 0x050 + (this.V[x] * 5);
                                this.PC += 2;
                                break;
                            case 0x33: // FX33 - Store BCD of VX at I, I+1, I+2
                                this.memory[this.I] = Math.floor(this.V[x] / 100);
                                this.memory[this.I + 1] = Math.floor((this.V[x] % 100) / 10);
                                this.memory[this.I + 2] = this.V[x] % 10;
                                this.PC += 2;
                                break;
                            case 0x55: // FX55 - Store V0 to VX in memory starting at I
                                for (let i = 0; i <= x; i++) {
                                    this.memory[this.I + i] = this.V[i];
                                }
                                this.I += x + 1;
                                this.PC += 2;
                                break;
                            case 0x65: // FX65 - Load V0 to VX from memory starting at I
                                for (let i = 0; i <= x; i++) {
                                    this.V[i] = this.memory[this.I + i];
                                }
                                this.I += x + 1;
                                this.PC += 2;
                                break;
                            default:
                                this.PC += 2;
                        }
                        break;
                        
                    default:
                        this.PC += 2;
                }
            }
            
            setKey(key, pressed) {
                if (key >= 0 && key <= 15) {
                    this.keys[key] = pressed ? 1 : 0;
                }
            }
            
            isRunning() {
                return this.running;
            }
            
            start() {
                this.running = true;
            }
            
            pause() {
                this.running = false;
            }
            
            reset() {
                this.init();
            }
        }

        // Demo ROM: A simple program that draws a sprite and moves it with keys
        // This is a manually assembled CHIP-8 program
        const demoROM = [
            // Initialize sprite position at V0 (x), V1 (y)
            0x60, 0x10, // V0 = 0x10 (20)
            0x61, 0x10, // V1 = 0x10 (20)
            
            // Main loop
            0x0000, 0x00E0, // CLS
            
            // Load sprite (digit 0) into I
            0xA0, 0x50, // I = 0x050
            
            // Draw sprite at (V0, V1) with height 5
            0xD0, 0x15, // Draw sprite
            
            // Check for key presses
            0x62, 0x00, // V2 = 0 (reset key check)
            
            // Check if key 1 (0x1) is pressed
            0x63, 0x01, // V3 = 1
            0x52, 0x30, // If V2 == V3, skip next
            0x62, 0x01, // V2 = 1 (key 1 pressed)
            
            // Check if key 2 (0x2) is pressed
            0x63, 0x02, // V3 = 2
            0x52, 0x30, // If V2 == V3, skip next
            0x62, 0x02, // V2 = 2 (key 2 pressed)
            
            // Check if key 3 (0x3) is pressed
            0x63, 0x03, // V3 = 3
            0x52, 0x30, // If V2 == V3, skip next
            0x62, 0x03, // V2 = 3 (key 3 pressed)
            
            // Check if key 4 (0x4) is pressed
            0x63, 0x04, // V3 = 4
            0x52, 0x30, // If V2 == V3, skip next
            0x62, 0x04, // V2 = 4 (key 4 pressed)
            
            // Move based on key pressed
            // If V2 == 1 (key 1), move up
            0x63, 0x01, // V3 = 1
            0x52, 0x30, // If V2 == V3, skip next
            0x71, 0xFF, // V1 = V1 - 1 (move up)
            
            // If V2 == 2 (key 2), move down
            0x63, 0x02, // V3 = 2
            0x52, 0x30, // If V2 == V3, skip next
            0x71, 0x01, // V1 = V1 + 1 (move down)
            
            // If V2 == 3 (key 3), move left
            0x63, 0x03, // V3 = 3
            0x52, 0x30, // If V2 == V3, skip next
            0x70, 0xFF, // V0 = V0 - 1 (move left)
            
            // If V2 == 4 (key 4), move right
            0x63, 0x04, // V3 = 4
            0x52, 0x30, // If V2 == V3, skip next
            0x70, 0x01, // V0 = V0 + 1 (move right)
            
            // Loop back
            0x10, 0x03, // Jump to start of main loop (0x203)
            
            // End of program (shouldn't reach here)
            0x00, 0x00
        ];

        // UI Controller
        class UI {
            constructor(chip8) {
                this.chip8 = chip8;
                this.canvas = document.getElementById('display');
                this.ctx = this.canvas.getContext('2d');
                this.statusEl = document.getElementById('status');
                this.speedSlider = document.getElementById('speedSlider');
                this.speedValue = document.getElementById('speedValue');
                
                // Debugger elements
                this.debugPC = document.getElementById('debugPC');
                this.debugI = document.getElementById('debugI');
                this.debugOpcode = document.getElementById('debugOpcode');
                this.instructionDisplay = document.getElementById('instructionDisplay');
                this.debugDelay = document.getElementById('debugDelay');
                this.debugSound = document.getElementById('debugSound');
                this.stackList = document.getElementById('stackList');
                this.registersDiv = document.getElementById('registers');
                this.keypadDiv = document.getElementById('keypad');
                
                // Controls
                this.btnRun = document.getElementById('btnRun');
                this.btnPause = document.getElementById('btnPause');
                this.btnStep = document.getElementById('btnStep');
                this.btnReset = document.getElementById('btnReset');
                this.romInput = document.getElementById('romInput');
                
                this.animationFrame = null;
                this.lastTime = 0;
                this.opsPerFrame = 50;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.setupKeymap();
                this.setupDemoROM();
                this.updateDebugger();
                this.drawDisplay();
            }
            
            setupEventListeners() {
                // Control buttons
                this.btnRun.addEventListener('click', () => {
                    if (!this.chip8.isRunning()) {
                        this.chip8.start();
                        this.updateStatus("Running");
                        this.startLoop();
                    }
                });
                
                this.btnPause.addEventListener('click', () => {
                    if (this.chip8.isRunning()) {
                        this.chip8.pause();
                        this.updateStatus("Paused");
                        this.stopLoop();
                    }
                });
                
                this.btnStep.addEventListener('click', () => {
                    if (!this.chip8.isRunning()) {
                        this.chip8.cycle();
                        this.updateDebugger();
                        this.drawDisplay();
                    }
                });
                
                this.btnReset.addEventListener('click', () => {
                    this.chip8.reset();
                    this.updateStatus("Reset");
                    this.updateDebugger();
                    this.drawDisplay();
                });
                
                // Speed slider
                this.speedSlider.addEventListener('input', (e) => {
                    this.opsPerFrame = parseInt(e.target.value);
                    this.speedValue.textContent = this.opsPerFrame;
                });
                
                // File input
                this.romInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const rom = new Uint8Array(event.target.result);
                            this.chip8.loadROM(rom);
                            this.updateStatus(`Loaded: ${file.name}`);
                            this.updateDebugger();
                            this.drawDisplay();
                        };
                        reader.readAsArrayBuffer(file);
                    }
                });
                
                // Keyboard events
                document.addEventListener('keydown', (e) => {
                    const key = this.getKeyFromEvent(e);
                    if (key !== null) {
                        this.chip8.setKey(key, true);
                        this.updateKeyDisplay(key, true);
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    const key = this.getKeyFromEvent(e);
                    if (key !== null) {
                        this.chip8.setKey(key, false);
                        this.updateKeyDisplay(key, false);
                    }
                });
            }
            
            getKeyFromEvent(e) {
                const keyMap = {
                    '1': 0x1, '2': 0x2, '3': 0x3, '4': 0x4,
                    'q': 0x5, 'w': 0x6, 'e': 0x7, 'r': 0x8,
                    'a': 0x9, 's': 0xA, 'd': 0xB, 'f': 0xC,
                    'z': 0xD, 'x': 0xE, 'c': 0xF, 'v': 0x0
                };
                
                const key = e.key.toLowerCase();
                return keyMap[key] !== undefined ? keyMap[key] : null;
            }
            
            setupKeymap() {
                const keyLabels = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', 'z', 'x', 'c', 'v'];
                const keyOrder = [0x1, 0x2, 0x3, 0x4, 0x5, 0x6, 0x7, 0x8, 0x9, 0xA, 0xB, 0xC, 0xD, 0xE, 0xF, 0x0];
                
                this.keypadDiv.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const keyDiv = document.createElement('div');
                    keyDiv.className = 'key';
                    keyDiv.id = `key-${keyOrder[i]}`;
                    keyDiv.textContent = keyLabels[i];
                    this.keypadDiv.appendChild(keyDiv);
                }
            }
            
            updateKeyDisplay(key, active) {
                const keyDiv = document.getElementById(`key-${key}`);
                if (keyDiv) {
                    if (active) {
                        keyDiv.classList.add('active');
                    } else {
                        keyDiv.classList.remove('active');
                    }
                }
            }
            
            setupDemoROM() {
                this.chip8.loadROM(demoROM);
                this.updateStatus("Demo ROM loaded. Use keys 1-4 to move the sprite.");
            }
            
            startLoop() {
                const loop = (timestamp) => {
                    if (!this.chip8.isRunning()) return;
                    
                    const deltaTime = timestamp - this.lastTime;
                    
                    if (deltaTime >= 16.67) { // ~60 FPS
                        // Execute multiple cycles per frame based on speed
                        for (let i = 0; i < this.opsPerFrame; i++) {
                            this.chip8.cycle();
                        }
                        
                        this.updateDebugger();
                        this.drawDisplay();
                        this.lastTime = timestamp;
                    }
                    
                    this.animationFrame = requestAnimationFrame(loop);
                };
                
                this.lastTime = performance.now();
                this.animationFrame = requestAnimationFrame(loop);
            }
            
            stopLoop() {
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                    this.animationFrame = null;
                }
            }
            
            updateStatus(message) {
                this.statusEl.textContent = message;
            }
            
            updateDebugger() {
                // Update PC and I
                this.debugPC.textContent = `0x${this.chip8.PC.toString(16).toUpperCase().padStart(3, '0')}`;
                this.debugI.textContent = `0x${this.chip8.I.toString(16).toUpperCase().padStart(3, '0')}`;
                
                // Get current opcode
                const opcode = (this.chip8.memory[this.chip8.PC] << 8) | this.chip8.memory[this.chip8.PC + 1];
                this.debugOpcode.textContent = `0x${opcode.toString(16).toUpperCase().padStart(4, '0')}`;
                
                // Decode instruction for display
                this.instructionDisplay.textContent = this.decodeInstruction(opcode);
                
                // Update timers
                this.debugDelay.textContent = this.chip8.delayTimer;
                this.debugSound.textContent = this.chip8.soundTimer;
                
                // Update registers
                this.updateRegisters();
                
                // Update stack
                this.updateStack();
            }
            
            decodeInstruction(opcode) {
                const x = (opcode & 0x0F00) >> 8;
                const y = (opcode & 0x00F0) >> 4;
                const n = opcode & 0x000F;
                const nn = opcode & 0x00FF;
                const nnn = opcode & 0x0FFF;
                
                switch (opcode & 0xF000) {
                    case 0x0000:
                        if (opcode === 0x00E0) return "CLS";
                        if (opcode === 0x00EE) return "RET";
                        return `SYS 0x${nnn.toString(16)}`;
                    case 0x1000: return `JP 0x${nnn.toString(16)}`;
                    case 0x2000: return `CALL 0x${nnn.toString(16)}`;
                    case 0x3000: return `SE V${x}, 0x${nn.toString(16)}`;
                    case 0x4000: return `SNE V${x}, 0x${nn.toString(16)}`;
                    case 0x5000: return `SE V${x}, V${y}`;
                    case 0x6000: return `LD V${x}, 0x${nn.toString(16)}`;
                    case 0x7000: return `ADD V${x}, 0x${nn.toString(16)}`;
                    case 0x8000:
                        switch (n) {
                            case 0x0: return `LD V${x}, V${y}`;
                            case 0x1: return `OR V${x}, V${y}`;
                            case 0x2: return `AND V${x}, V${y}`;
                            case 0x3: return `XOR V${x}, V${y}`;
                            case 0x4: return `ADD V${x}, V${y}`;
                            case 0x5: return `SUB V${x}, V${y}`;
                            case 0x6: return `SHR V${x}`;
                            case 0x7: return `SUBN V${x}, V${y}`;
                            case 0xE: return `SHL V${x}`;
                            default: return `???`;
                        }
                    case 0x9000: return `SNE V${x}, V${y}`;
                    case 0xA000: return `LD I, 0x${nnn.toString(16)}`;
                    case 0xB000: return `JP V0, 0x${nnn.toString(16)}`;
                    case 0xC000: return `RND V${x}, 0x${nn.toString(16)}`;
                    case 0xD000: return `DRW V${x}, V${y}, ${n}`;
                    case 0xE000:
                        if (n === 0x9E) return `SKP V${x}`;
                        if (n === 0xA1) return `SKNP V${x}`;
                        return `???`;
                    case 0xF000:
                        switch (nn) {
                            case 0x07: return `LD V${x}, DT`;
                            case 0x0A: return `LD V${x}, K`;
                            case 0x15: return `LD DT, V${x}`;
                            case 0x18: return `LD ST, V${x}`;
                            case 0x1E: return `ADD I, V${x}`;
                            case 0x29: return `LD F, V${x}`;
                            case 0x33: return `LD B, V${x}`;
                            case 0x55: return `LD [I], V${x}`;
                            case 0x65: return `LD V${x}, [I]`;
                            default: return `???`;
                        }
                    default: return `???`;
                }
            }
            
            updateRegisters() {
                this.registersDiv.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div');
                    row.className = 'debug-row';
                    row.innerHTML = `
                        <span class="debug-label">V${i.toString(16).toUpperCase()}:</span>
                        <span class="debug-value">0x${this.chip8.V[i].toString(16).toUpperCase().padStart(2, '0')}</span>
                    `;
                    this.registersDiv.appendChild(row);
                }
            }
            
            updateStack() {
                this.stackList.innerHTML = '';
                for (let i = 0; i < this.chip8.stack.length; i++) {
                    const item = document.createElement('li');
                    item.className = 'stack-item';
                    item.innerHTML = `
                        <span class="debug-label">SP${i}:</span>
                        <span class="debug-value">0x${this.chip8.stack[i].toString(16).toUpperCase().padStart(3, '0')}</span>
                    `;
                    this.stackList.appendChild(item);
                }
            }
            
            drawDisplay() {
                const imageData = this.ctx.createImageData(64, 32);
                const data = imageData.data;
                
                for (let i = 0; i < this.chip8.display.length; i++) {
                    const pixel = this.chip8.display[i];
                    const idx = i * 4;
                    
                    if (pixel === 1) {
                        data[idx] = 255;     // R
                        data[idx + 1] = 255; // G
                        data[idx + 2] = 255; // B
                        data[idx + 3] = 255; // A
                    } else {
                        data[idx] = 0;
                        data[idx + 1] = 0;
                        data[idx + 2] = 0;
                        data[idx + 3] = 255;
                    }
                }
                
                this.ctx.putImageData(imageData, 0, 0);
            }
        }

        // Initialize emulator
        const chip8 = new Chip8();
        const ui = new UI(chip8);
    </script>
</body>
</html>
