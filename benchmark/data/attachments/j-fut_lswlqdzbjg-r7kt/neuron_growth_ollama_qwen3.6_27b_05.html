<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
            border: 1px solid #101a3a;
        }
        .dg.ac {
            z-index: 1000 !important;
        }
    </style>
</head>
<body>
    <canvas id="simCanvas" width="800" height="800"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // Configuration and State
        const config = {
            // Growth
            neuronCount: 4,
            growthSpeed: 2.0,
            maxDepth: 5,
            splitChance: 0.3,
            curvature: 0.5,
            maxBranchLength: 100,
            
            // Synapses
            synapseThreshold: 40,
            synapseGlow: 15,
            
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.01,
            pulseBrightness: 1.0,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            uiColor: '#ffd400',
            
            // Actions
            regenerate: function() { init(); },
            clear: function() { clearCanvas(); },
            pause: function() { isPaused = !isPaused; },
            
            // Internal toggles for UI
            showScanlines: true,
            showVignette: true
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let isPaused = false;
        let animationId;

        // Entities
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];

        // Classes
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.growthTimer = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = config.branchColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.branchColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, parentNeuron) {
                this.startX = startX;
                this.startY = startY;
                this.x = startX;
                this.y = startY;
                this.angle = angle;
                this.depth = depth;
                this.length = 0;
                this.maxLength = Math.random() * config.maxBranchLength * 0.5 + config.maxBranchLength * 0.5;
                this.speed = config.growthSpeed;
                this.isGrowing = true;
                this.isFinished = false;
                this.thickness = Math.max(0.5, 3 - depth * 0.5);
                this.parentNeuron = parentNeuron;
                this.controlPoint = { x: 0, y: 0 };
                this.hasSplit = false;
                // Store path points for proper drawing
                this.points = [{x: startX, y: startY}];
            }

            update() {
                if (!this.isGrowing || this.isFinished) return;

                this.length += this.speed;
                
                // Calculate new position based on angle
                const dx = Math.cos(this.angle) * this.speed;
                const dy = Math.sin(this.angle) * this.speed;
                
                this.x += dx;
                this.y += dy;

                // Add point to path
                this.points.push({x: this.x, y: this.y});

                // Control point for quadratic curve (slightly ahead)
                this.controlPoint.x = this.x - Math.cos(this.angle) * 5;
                this.controlPoint.y = this.y - Math.sin(this.angle) * 5;

                // Check bounds
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.isFinished = true;
                    return;
                }

                // Check max length
                if (this.length >= this.maxLength) {
                    this.isFinished = true;
                    this.trySplit();
                }
            }

            trySplit() {
                if (this.depth >= config.maxDepth) return;
                if (this.hasSplit) return;
                
                if (Math.random() < config.splitChance) {
                    this.hasSplit = true;
                    const newAngle1 = this.angle + (Math.random() - 0.5) * config.curvature;
                    const newAngle2 = this.angle - (Math.random() - 0.5) * config.curvature;
                    
                    branches.push(new Branch(this.x, this.y, newAngle1, this.depth + 1, this.parentNeuron));
                    branches.push(new Branch(this.x, this.y, newAngle2, this.depth + 1, this.parentNeuron));
                }
            }

            draw() {
                if (this.points.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                
                // Draw smooth curve through all points
                for (let i = 1; i < this.points.length - 1; i++) {
                    const xc = (this.points[i].x + this.points[i+1].x) / 2;
                    const yc = (this.points[i].y + this.points[i+1].y) / 2;
                    ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
                }
                
                // Connect to last point
                if (this.points.length > 1) {
                    ctx.lineTo(this.points[this.points.length-1].x, this.points[this.points.length-1].y);
                }
                
                ctx.strokeStyle = this.depth % 2 === 0 ? config.branchColor : config.accentColor;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                
                // Glow effect
                ctx.shadowBlur = 5;
                ctx.shadowColor = ctx.strokeStyle;
                
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x = (branch1.x + branch2.x) / 2;
                this.y = (branch1.y + branch2.y) / 2;
                this.radius = 2;
                this.pulsePhase = Math.random() * Math.PI * 2;
                // Store endpoints for pulse travel
                this.startX = branch1.x;
                this.startY = branch1.y;
                this.endX = branch2.x;
                this.endY = branch2.y;
            }

            update() {
                this.pulsePhase += 0.05;
            }

            draw() {
                const glow = Math.sin(this.pulsePhase) * 0.5 + 0.5;
                const currentRadius = this.radius + glow * 2;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = config.synapseGlow * glow;
                ctx.shadowColor = config.synapseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(startX, startY, endX, endY) {
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.progress = 0;
                this.speed = config.pulseSpeed;
                this.active = true;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw() {
                const x = this.startX + (this.endX - this.startX) * this.progress;
                const y = this.startY + (this.endY - this.startY) * this.progress;
                
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = config.pulseColor;
                ctx.shadowBlur = 10 * config.pulseBrightness;
                ctx.shadowColor = config.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Initialization
        function init() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            
            // Create seed neurons
            for (let i = 0; i < config.neuronCount; i++) {
                const x = canvas.width / 2 + (Math.random() - 0.5) * 200;
                const y = canvas.height / 2 + (Math.random() - 0.5) * 200;
                neurons.push(new Neuron(x, y));
                
                // Initial branches
                const angle = Math.random() * Math.PI * 2;
                branches.push(new Branch(x, y, angle, 0, neurons[i]));
            }
        }

        function clearCanvas() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
        }

        // Synapse Detection
        function checkSynapses() {
            // Only check finished branches
            const finishedBranches = branches.filter(b => b.isFinished);
            
            for (let i = 0; i < finishedBranches.length; i++) {
                for (let j = i + 1; j < finishedBranches.length; j++) {
                    const b1 = finishedBranches[i];
                    const b2 = finishedBranches[j];
                    
                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < config.synapseThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.branch1 === b1 && s.branch2 === b2) || 
                            (s.branch1 === b2 && s.branch2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                            
                            // Create pulse
                            if (Math.random() < config.pulseFrequency) {
                                pulses.push(new Pulse(b1.x, b1.y, b2.x, b2.y));
                            }
                        }
                    }
                }
            }
        }

        // Continuous pulse spawning on existing synapses
        function spawnContinuousPulses() {
            if (synapses.length === 0) return;
            
            // Randomly spawn pulses on existing synapses
            if (Math.random() < config.pulseFrequency * 2) {
                const synapse = synapses[Math.floor(Math.random() * synapses.length)];
                // Random direction
                if (Math.random() < 0.5) {
                    pulses.push(new Pulse(synapse.startX, synapse.startY, synapse.endX, synapse.endY));
                } else {
                    pulses.push(new Pulse(synapse.endX, synapse.endY, synapse.startX, synapse.startY));
                }
            }
        }

        // Visual Effects
        function drawScanlines() {
            if (!config.showScanlines) return;
            
            ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
            for (let y = 0; y < canvas.height; y += 4) {
                ctx.fillRect(0, y, canvas.width, 2);
            }
        }

        function drawVignette() {
            if (!config.showVignette) return;
            
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 100,
                canvas.width / 2, canvas.height / 2, 400
            );
            gradient.addColorStop(0, 'rgba(5, 7, 15, 0)');
            gradient.addColorStop(1, 'rgba(5, 7, 15, 0.8)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Main Loop
        function animate() {
            if (!isPaused) {
                // Clear canvas
                ctx.fillStyle = config.bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Update and draw branches
                branches.forEach(branch => {
                    branch.update();
                    branch.draw();
                });
                
                // Check for new synapses
                checkSynapses();
                
                // Spawn continuous pulses on existing synapses
                spawnContinuousPulses();
                
                // Update and draw synapses
                synapses.forEach(synapse => {
                    synapse.update();
                    synapse.draw();
                });
                
                // Update and draw pulses
                pulses = pulses.filter(p => p.active);
                pulses.forEach(pulse => {
                    pulse.update();
                    pulse.draw();
                });
                
                // Draw neurons
                neurons.forEach(neuron => neuron.draw());
                
                // Visual effects
                drawScanlines();
                drawVignette();
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // Setup GUI
        function setupGUI() {
            const gui = new dat.GUI();
            
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 1, 10, 1).name('Neuron Count');
            growthFolder.add(config, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
            growthFolder.add(config, 'maxDepth', 1, 10, 1).name('Max Depth');
            growthFolder.add(config, 'splitChance', 0, 1, 0.01).name('Split Chance');
            growthFolder.add(config, 'curvature', 0, 2, 0.1).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 20, 200, 10).name('Max Length');
            
            const synapseFolder = gui.addFolder('Synapses');
            synapseFolder.add(config, 'synapseThreshold', 10, 100, 5).name('Distance Threshold');
            synapseFolder.add(config, 'synapseGlow', 0, 30, 1).name('Glow Strength');
            
            const pulseFolder = gui.addFolder('Pulses');
            pulseFolder.add(config, 'pulseSpeed', 0.005, 0.1, 0.001).name('Speed');
            pulseFolder.add(config, 'pulseFrequency', 0.001, 0.1, 0.001).name('Frequency');
            pulseFolder.add(config, 'pulseBrightness', 0.1, 2, 0.1).name('Brightness');
            
            const visualFolder = gui.addFolder('Visuals');
            visualFolder.addColor(config, 'bgColor').name('Background');
            visualFolder.addColor(config, 'branchColor').name('Branch Color');
            visualFolder.addColor(config, 'accentColor').name('Accent Color');
            visualFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualFolder.addColor(config, 'pulseColor').name('Pulse Color');
            visualFolder.add(config, 'showScanlines').name('Scanlines');
            visualFolder.add(config, 'showVignette').name('Vignette');
            
            const actionFolder = gui.addFolder('Actions');
            actionFolder.add(config, 'regenerate').name('Regenerate');
            actionFolder.add(config, 'clear').name('Clear Canvas');
            actionFolder.add(config, 'pause').name('Pause/Resume');
            
            // Open folders by default
            growthFolder.open();
            synapseFolder.open();
            pulseFolder.open();
            visualFolder.open();
        }

        // Start
        setupGUI();
        init();
        animate();
    </script>
</body>
</html>
