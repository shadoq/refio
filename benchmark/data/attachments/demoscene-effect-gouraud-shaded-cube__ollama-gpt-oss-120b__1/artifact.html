<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gouraud Shaded Rotating Cube</title>
<style>
body{margin:0;overflow:hidden;background:#222;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// utility functions
function vec3(x,y,z){return [x,y,z];}
function add(a,b){return [a[0]+b[0], a[1]+b[1], a[2]+b[2]];}
function sub(a,b){return [a[0]-b[0], a[1]-b[1], a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){
    return [
        a[1]*b[2]-a[2]*b[1],
        a[2]*b[0]-a[0]*b[2],
        a[0]*b[1]-a[1]*b[0]
    ];
}
function scale(v,s){return [v[0]*s, v[1]*s, v[2]*s];}
function length(v){return Math.hypot(v[0],v[1],v[2]);}
function normalize(v){
    const l=length(v);
    return l===0?[0,0,0]:[v[0]/l,v[1]/l,v[2]/l];
}

// rotation matrices (4x4) applied to vec3
function rotX(a){
    const c=Math.cos(a), s=Math.sin(a);
    return m=>[m[0], m[1]*c - m[2]*s, m[1]*s + m[2]*c];
}
function rotY(a){
    const c=Math.cos(a), s=Math.sin(a);
    return m=>[m[0]*c + m[2]*s, m[1], -m[0]*s + m[2]*c];
}

// cube definition
const vertices=[
    vec3(-1,-1,-1),
    vec3( 1,-1,-1),
    vec3( 1, 1,-1),
    vec3(-1, 1,-1),
    vec3(-1,-1, 1),
    vec3( 1,-1, 1),
    vec3( 1, 1, 1),
    vec3(-1, 1, 1)
];
const faces=[
    [0,1,2,3], // -z
    [4,5,6,7], // +z
    [0,1,5,4], // -y
    [2,3,7,6], // +y
    [0,3,7,4], // -x
    [1,2,6,5]  // +x
];

// compute per‑vertex normals (average of incident face normals)
const vertexNormals=Array(8).fill(null).map(()=>[0,0,0]);
for(const f of faces){
    const v0=vertices[f[0]], v1=vertices[f[1]], v2=vertices[f[2]];
    const n=cross(sub(v1,v0), sub(v2,v0));
    for(const idx of f){
        vertexNormals[idx]=add(vertexNormals[idx], n);
    }
}
for(let i=0;i<8;i++) vertexNormals[i]=normalize(vertexNormals[i]);

// split faces into triangles
const triangles=[];
for(const f of faces){
    // (a,b,c) and (a,c,d)
    const [a,b,c,d]=f;
    triangles.push([a,b,c]);
    triangles.push([a,c,d]);
}

// canvas setup
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
let width=canvas.width, height=canvas.height;

// rendering state
let showWireframe=false;
let paused=false;
window.addEventListener('keydown',e=>{
    if(e.key==='w' || e.key==='W') showWireframe=!showWireframe;
    else if(e.key==='p' || e.key==='P') paused=!paused;
});

let lastTime=performance.now();
let fps=0;

// main loop
function frame(now){
    const delta=(now-lastTime)/1000;
    lastTime=now;
    fps=1/delta;

    // clear image buffer
    width=canvas.width; height=canvas.height;
    const imgData=ctx.getImageData(0,0,width,height);
    const data=imgData.data;
    for(let i=0;i<data.length;i+=4){
        data[i]=30;   // dark background
        data[i+1]=30;
        data[i+2]=30;
        data[i+3]=255;
    }

    // update light position (orbit)
    const t=now*0.001;
    const lightPos=[Math.cos(t)*4, Math.sin(t*0.7)*2, Math.sin(t)*4];

    // rotation angles
    const angleX = paused?0: t*0.6;
    const angleY = paused?0: t*0.9;

    // transform vertices
    const transformed=[];
    const transformedNormals=[];
    for(let i=0;i<vertices.length;i++){
        let v=vertices[i];
        v=rotX(angleX)(v);
        v=rotY(angleY)(v);
        // translate cube away from camera
        v = add(v, [0,0,5]);
        transformed.push(v);

        // rotate normal (ignore translation)
        let n=vertexNormals[i];
        n=rotX(angleX)(n);
        n=rotY(angleY)(n);
        transformedNormals.push(normalize(n));
    }

    // compute per‑vertex colors using Lambertian reflectance
    const vertexColors=[];
    for(let i=0;i<transformed.length;i++){
        const pos=transformed[i];
        const n=transformedNormals[i];
        const l=normalize(sub(lightPos,pos));
        let intensity=Math.max(0, dot(n,l));
        // simple white material with ambient term
        const ambient=0.2;
        intensity = ambient + (1-ambient)*intensity;
        const col=[intensity*255,intensity*255,intensity*255];
        vertexColors.push(col);
    }

    // perspective projection helper
    function project(p){
        const f=1.5; // focal length
        const z=p[2];
        const scale=f/(f+z);
        return [
            (p[0]*scale)*width/2 + width/2,
            (-p[1]*scale)*height/2 + height/2
        ];
    }

    // backface culling and rasterization
    for(const tri of triangles){
        const i0=tri[0], i1=tri[1], i2=tri[2];
        const p0=transformed[i0], p1=transformed[i1], p2=transformed[i2];

        // compute face normal in world space
        const fn=cross(sub(p1,p0), sub(p2,p0));
        // view direction is (0,0,-1) looking towards -z; camera at origin
        if(dot(fn,[0,0,-1])>=0) continue; // cull backfaces

        const sp0=project(p0);
        const sp1=project(p1);
        const sp2=project(p2);

        const c0=vertexColors[i0];
        const c1=vertexColors[i1];
        const c2=vertexColors[i2];

        drawTriangle(sp0,c0,sp1,c1,sp2,c2,data,width,height);
        if(showWireframe){
            ctx.beginPath();
            ctx.moveTo(...sp0);
            ctx.lineTo(...sp1);
            ctx.lineTo(...sp2);
            ctx.closePath();
            ctx.strokeStyle='black';
            ctx.lineWidth=1;
            ctx.stroke();
        }
    }

    // put pixel buffer
    ctx.putImageData(imgData,0,0);

    // FPS overlay
    ctx.fillStyle='white';
    ctx.font='16px monospace';
    ctx.fillText('FPS: '+fps.toFixed(1),10,20);
    ctx.fillText('Wireframe: '+(showWireframe?'ON':'OFF'),10,40);
    ctx.fillText('Paused: '+(paused?'YES':'NO'),10,60);

    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// triangle rasterizer with barycentric interpolation
function edgeFunction(a,b,c){
    return (c[0]-a[0])*(b[1]-a[1]) - (c[1]-a[1])*(b[0]-a[0]);
}
function drawTriangle(p0,c0,p1,c1,p2,c2,data,w,h){
    const minX=Math.max(0, Math.floor(Math.min(p0[0],p1[0],p2[0])));
    const maxX=Math.min(w-1, Math.ceil(Math.max(p0[0],p1[0],p2[0])));
    const minY=Math.max(0, Math.floor(Math.min(p0[1],p1[1],p2[1])));
    const maxY=Math.min(h-1, Math.ceil(Math.max(p0[1],p1[1],p2[1])));

    const area=edgeFunction(p0,p1,p2);
    if(area===0) return;

    for(let y=minY; y<=maxY; ++y){
        for(let x=minX; x<=maxX; ++x){
            const p=[x+0.5, y+0.5];
            const w0=edgeFunction(p1,p2,p);
            const w1=edgeFunction(p2,p0,p);
            const w2=edgeFunction(p0,p1,p);
            if(w0>=0 && w1>=0 && w2>=0){
                const alpha=w0/area;
                const beta =w1/area;
                const gamma=w2/area;
                const r=alpha*c0[0]+beta*c1[0]+gamma*c2[0];
                const g=alpha*c0[1]+beta*c1[1]+gamma*c2[1];
                const b=alpha*c0[2]+beta*c1[2]+gamma*c2[2];
                const idx=(y*w + x)*4;
                data[idx]=r;
                data[idx+1]=g;
                data[idx+2]=b;
                data[idx+3]=255;
            }
        }
    }
}
</script>
</body>
</html>
