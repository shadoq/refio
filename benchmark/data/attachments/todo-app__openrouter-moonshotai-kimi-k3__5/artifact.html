<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      color: #333;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      padding: 28px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #4a4a8a;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .add-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #todo-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    #add-btn:hover {
      background: #5568d3;
    }

    #add-btn:active {
      transform: scale(0.97);
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #667eea;
      background: #f0f2ff;
      border: 2px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .filter-btn:hover {
      background: #e2e6ff;
    }

    .filter-btn.active {
      background: #667eea;
      color: #fff;
    }

    #todo-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s ease;
      animation: fadeIn 0.25s ease;
    }

    .todo-item:hover {
      background: #fafbff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e74c3c;
      background: #fdecea;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 30px 10px;
      font-size: 0.95rem;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .add-row {
        flex-direction: column;
      }

      #add-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Todo App</h1>

    <div class="add-row">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>
    <p class="empty-state" id="empty-state" hidden>No todos to show.</p>

    <div class="footer">
      <span id="items-left">0 items left</span>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todos';

    let todos = [];
    let currentFilter = 'all';

    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const itemsLeft = document.getElementById('items-left');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function generateId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        todos = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        todos = [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: generateId(), text: text, completed: false });
      input.value = '';
      input.focus();
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find(function (t) { return t.id === id; });
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos();
        render();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(function (t) { return t.id !== id; });
      saveTodos();
      render();
    }

    function getFilteredTodos() {
      if (currentFilter === 'active') {
        return todos.filter(function (t) { return !t.completed; });
      }
      if (currentFilter === 'completed') {
        return todos.filter(function (t) { return t.completed; });
      }
      return todos;
    }

    function render() {
      list.innerHTML = '';

      const visible = getFilteredTodos();

      visible.forEach(function (todo) {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', function () {
          toggleTodo(todo.id);
        });

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;
        span.addEventListener('click', function () {
          toggleTodo(todo.id);
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '×';
        delBtn.setAttribute('aria-label', 'Delete todo');
        delBtn.addEventListener('click', function () {
          deleteTodo(todo.id);
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      });

      emptyState.hidden = visible.length > 0;

      const remaining = todos.filter(function (t) { return !t.completed; }).length;
      itemsLeft.textContent = remaining + (remaining === 1 ? ' item left' : ' items left');

      filterBtns.forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
      });
    }

    addBtn.addEventListener('click', addTodo);

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        addTodo();
      }
    });

    filterBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    loadTodos();
    render();
  </script>
</body>
</html>
