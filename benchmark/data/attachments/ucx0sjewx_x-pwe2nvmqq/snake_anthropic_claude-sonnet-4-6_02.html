<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #scoreboard {
    display: flex;
    justify-content: space-between;
    width: 600px;
    padding: 10px 20px;
    background: #12121a;
    border-radius: 10px;
    border: 1px solid #2a2a3a;
  }

  .score-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.6;
  }

  .score-value {
    font-size: 28px;
    font-weight: bold;
  }

  .score-box.snake1 .score-value { color: #4cff72; }
  .score-box.snake2 .score-value { color: #4ab8ff; }

  #canvas {
    border: 2px solid #2a2a3a;
    border-radius: 4px;
    display: block;
  }

  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.96);
    z-index: 10;
  }

  .screen.hidden { display: none; }

  .screen h1 {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #4cff72, #4ab8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .screen h2 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #e0e0e0;
  }

  .screen p {
    font-size: 14px;
    opacity: 0.5;
    margin-top: 24px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 16px;
    opacity: 0.5;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  .mode-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 320px;
  }

  .mode-btn {
    padding: 16px 24px;
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mode-btn:hover {
    background: #1a1a2a;
    border-color: #4cff72;
    transform: translateX(4px);
  }

  .mode-btn .mode-desc {
    font-size: 12px;
    opacity: 0.5;
    font-weight: 400;
  }

  .result-box {
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    padding: 30px 50px;
    text-align: center;
    margin-bottom: 10px;
  }

  .winner-text {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .winner-text.snake1 { color: #4cff72; }
  .winner-text.snake2 { color: #4ab8ff; }
  .winner-text.draw { color: #ffcc44; }

  .final-scores {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-top: 10px;
  }

  .final-score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .final-score-item .label {
    font-size: 12px;
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .final-score-item .val {
    font-size: 32px;
    font-weight: bold;
  }

  .final-score-item.s1 .val { color: #4cff72; }
  .final-score-item.s2 .val { color: #4ab8ff; }

  .controls-hint {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0.4;
    font-size: 12px;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="scoreboard">
    <div class="score-box snake1">
      <span class="score-label" id="label1">Snake 1</span>
      <span class="score-value" id="score1">0</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0.3;font-size:12px;letter-spacing:2px;">VS</div>
    <div class="score-box snake2">
      <span class="score-label" id="label2">Snake 2</span>
      <span class="score-value" id="score2">0</span>
    </div>
  </div>
  <canvas id="canvas" width="600" height="600"></canvas>
</div>

<!-- Start Screen -->
<div class="screen" id="start-screen">
  <h1>SNAKE</h1>
  <div class="subtitle">SELECT GAME MODE</div>
  <div class="mode-buttons">
    <button class="mode-btn" onclick="startGame('hvh')">
      👤 Human vs Human
      <span class="mode-desc">Player 1: WASD &nbsp;|&nbsp; Player 2: Arrow Keys</span>
    </button>
    <button class="mode-btn" onclick="startGame('cvh')">
      🤖 CPU vs Human
      <span class="mode-desc">CPU Snake 1 &nbsp;|&nbsp; Player 2: Arrow Keys</span>
    </button>
    <button class="mode-btn" onclick="startGame('cvc')">
      🤖 CPU vs CPU
      <span class="mode-desc">Watch two AIs battle it out</span>
    </button>
  </div>
  <div class="controls-hint">
    <span>Player 1: W A S D</span>
    <span>Player 2: ↑ ↓ ← →</span>
  </div>
</div>

<!-- Game Over Screen -->
<div class="screen hidden" id="gameover-screen">
  <h2>GAME OVER</h2>
  <div class="result-box">
    <div class="winner-text" id="winner-text">Draw!</div>
    <div class="final-scores">
      <div class="final-score-item s1">
        <span class="label" id="go-label1">Snake 1</span>
        <span class="val" id="go-score1">0</span>
      </div>
      <div class="final-score-item s2">
        <span class="label" id="go-label2">Snake 2</span>
        <span class="val" id="go-score2">0</span>
      </div>
    </div>
  </div>
  <p>PRESS R OR ENTER TO PLAY AGAIN</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const GRID = 30;
const CELL = canvas.width / GRID;

let gameMode = null;
let gameState = 'menu'; // 'menu', 'playing', 'gameover'
let gameLoop = null;
let SPEED = 150;

let snake1, snake2, food1, food2;
let score1, score2;
let dir1, dir2;
let nextDir1, nextDir2;
let alive1, alive2;

// ─── Colors ───────────────────────────────────────────────────────────────────
const COLORS = {
  bg: '#0d0d14',
  grid: '#13131e',
  s1Head: '#2dff5e',
  s1Body: '#1aaa3e',
  s1Dark: '#0d5520',
  s2Head: '#2ab5ff',
  s2Body: '#1478cc',
  s2Dark: '#0a3d6e',
  food1: '#ff4455',
  food2: '#ff9922',
  foodGlow1: 'rgba(255,68,85,0.4)',
  foodGlow2: 'rgba(255,153,34,0.4)',
};

// ─── Utility ──────────────────────────────────────────────────────────────────
function rnd(n) { return Math.floor(Math.random() * n); }

function randomCell(exclude = []) {
  let pos;
  let attempts = 0;
  do {
    pos = { x: rnd(GRID), y: rnd(GRID) };
    attempts++;
    if (attempts > 2000) break;
  } while (exclude.some(e => e.x === pos.x && e.y === pos.y));
  return pos;
}

function occupiedCells() {
  return [...(snake1 || []), ...(snake2 || []),
          ...(food1 ? [food1] : []), ...(food2 ? [food2] : [])];
}

function opposite(d) {
  if (d.x === 1) return { x: -1, y: 0 };
  if (d.x === -1) return { x: 1, y: 0 };
  if (d.y === 1) return { x: 0, y: -1 };
  return { x: 0, y: 1 };
}

// ─── BFS Pathfinding ──────────────────────────────────────────────────────────
function bfsPath(start, target, obstacles) {
  const key = (p) => `${p.x},${p.y}`;
  const visited = new Set();
  visited.add(key(start));
  const queue = [{ pos: start, path: [] }];
  const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const obsSet = new Set(obstacles.map(key));

  while (queue.length > 0) {
    const { pos, path } = queue.shift();
    for (const d of dirs) {
      const nx = pos.x + d.x;
      const ny = pos.y + d.y;
      const np = { x: nx, y: ny };
      const nk = key(np);
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
      if (visited.has(nk) || obsSet.has(nk)) continue;
      const newPath = [...path, d];
      if (nx === target.x && ny === target.y) return newPath;
      visited.add(nk);
      queue.push({ pos: np, path: newPath });
    }
  }
  return null;
}

function safeMoves(head, obstacles) {
  const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const obsSet = new Set(obstacles.map(p => `${p.x},${p.y}`));
  return dirs.filter(d => {
    const nx = head.x + d.x;
    const ny = head.y + d.y;
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) return false;
    return !obsSet.has(`${nx},${ny}`);
  });
}

function cpuMove(snake, food, otherSnake) {
  if (!snake || snake.length === 0) return { x: 1, y: 0 };
  const head = snake[0];
  // Obstacles: own body (except tail which will move), other snake body
  const obstacles = [...snake.slice(1), ...(otherSnake || [])];
  const path = bfsPath(head, food, obstacles);
  if (path && path.length > 0) return path[0];
  // Fallback: pick a safe random move
  const moves = safeMoves(head, obstacles);
  if (moves.length > 0) return moves[rnd(moves.length)];
  // No safe move — keep going (will die)
  return snake.length > 1
    ? { x: head.x - snake[1].x, y: head.y - snake[1].y }
    : { x: 1, y: 0 };
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function initGame(mode) {
  gameMode = mode;
  score1 = 0;
  score2 = 0;
  alive1 = true;
  alive2 = true;

  // Snake 1 starts left side, moving right
  snake1 = [
    { x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 },
    { x: 3, y: 10 }, { x: 2, y: 10 }
  ];
  dir1 = { x: 1, y: 0 };
  nextDir1 = { x: 1, y: 0 };

  // Snake 2 starts right side, moving left
  snake2 = [
    { x: 23, y: 19 }, { x: 24, y: 19 }, { x: 25, y: 19 },
    { x: 26, y: 19 }, { x: 27, y: 19 }
  ];
  dir2 = { x: -1, y: 0 };
  nextDir2 = { x: -1, y: 0 };

  // Place food
  food1 = randomCell(occupiedCells());
  food2 = randomCell(occupiedCells());

  updateScoreboard();
}

function updateScoreboard() {
  document.getElementById('score1').textContent = score1;
  document.getElementById('score2').textContent = score2;

  const labels = {
    hvh: ['Player 1', 'Player 2'],
    cvh: ['CPU', 'Player 2'],
    cvc: ['CPU 1', 'CPU 2'],
  };
  const [l1, l2] = labels[gameMode] || ['Snake 1', 'Snake 2'];
  document.getElementById('label1').textContent = l1;
  document.getElementById('label2').textContent = l2;
  document.getElementById('go-label1').textContent = l1;
  document.getElementById('go-label2').textContent = l2;
}

// ─── Game Logic ───────────────────────────────────────────────────────────────
function step() {
  if (gameState !== 'playing') return;

  // CPU decisions
  if (gameMode === 'cvh' || gameMode === 'cvc') {
    if (alive1) nextDir1 = cpuMove(snake1, food1, snake2);
  }
  if (gameMode === 'cvc') {
    if (alive2) nextDir2 = cpuMove(snake2, food2, snake1);
  }

  // Prevent 180 turns
  if (!(nextDir1.x === -dir1.x && nextDir1.y === -dir1.y)) dir1 = nextDir1;
  if (!(nextDir2.x === -dir2.x && nextDir2.y === -dir2.y)) dir2 = nextDir2;

  // Move snakes
  if (alive1) moveSnake(1);
  if (alive2) moveSnake(2);

  // Check game over
  if (!alive1 || !alive2) {
    endGame();
    return;
  }

  draw();
}

function moveSnake(id) {
  const snake = id === 1 ? snake1 : snake2;
  const dir = id === 1 ? dir1 : dir2;
  const food = id === 1 ? food1 : food2;
  const otherSnake = id === 1 ? snake2 : snake1;

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    if (id === 1) alive1 = false; else alive2 = false;
    return;
  }

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    if (id === 1) alive1 = false; else alive2 = false;
    return;
  }

  // Other snake collision (head-on or body)
  if (otherSnake && otherSnake.some(s => s.x === head.x && s.y === head.y)) {
    if (id === 1) alive1 = false; else alive2 = false;
    return;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    if (id === 1) {
      score1++;
      food1 = randomCell(occupiedCells());
    } else {
      score2++;
      food2 = randomCell(occupiedCells());
    }
    updateScoreboard();
  } else {
    snake.pop();
  }
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function draw() {
  // Background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // Food
  drawFood(food1, COLORS.food1, COLORS.foodGlow1);
  drawFood(food2, COLORS.food2, COLORS.foodGlow2);

  // Snakes
  if (alive2) drawSnake(snake2, COLORS.s2Head, COLORS.s2Body, COLORS.s2Dark);
  if (alive1) drawSnake(snake1, COLORS.s1Head, COLORS.s1Body, COLORS.s1Dark);
}

function drawFood(food, color, glow) {
  if (!food) return;
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;
  const r = CELL / 2 - 2;

  // Glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 4);
  grad.addColorStop(0, glow);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
  ctx.fill();

  // Dot
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

function drawSnake(snake, headColor, bodyColor, darkColor) {
  if (!snake || snake.length === 0) return;
  const pad = 1;

  for (let i = snake.length - 1; i >= 0; i--) {
    const seg = snake[i];
    const x = seg.x * CELL + pad;
    const y = seg.y * CELL + pad;
    const size = CELL - pad * 2;
    const t = i / snake.length;

    if (i === 0) {
      // Head
      ctx.fillStyle = headColor;
      roundRect(ctx, x, y, size, size, 4);
      ctx.fill();

      // Eyes
      const dir = snake.length > 1
        ? { x: snake[0].x - snake[1].x, y: snake[0].y - snake[1].y }
        : { x: 1, y: 0 };
      drawEyes(seg, dir, headColor);
    } else {
      // Body gradient
      const r1 = parseInt(bodyColor.slice(1, 3), 16);
      const g1 = parseInt(bodyColor.slice(3, 5), 16);
      const b1 = parseInt(bodyColor.slice(5, 7), 16);
      const r2 = parseInt(darkColor.slice(1, 3), 16);
      const g2 = parseInt(darkColor.slice(3, 5), 16);
      const b2 = parseInt(darkColor.slice(5, 7), 16);
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const b = Math.round(b1 + (b2 - b1) * t);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      roundRect(ctx, x + 1, y + 1, size - 2, size - 2, 3);
      ctx.fill();
    }
  }
}

function drawEyes(seg, dir, color) {
  const cx = seg.x * CELL + CELL / 2;
  const cy = seg.y * CELL + CELL / 2;
  const eyeR = 2.5;
  const pupilR = 1.5;
  const offset = CELL * 0.22;
  const forward = CELL * 0.15;

  let e1, e2;
  if (dir.x === 1) {
    e1 = { x: cx + forward, y: cy - offset };
    e2 = { x: cx + forward, y: cy + offset };
  } else if (dir.x === -1) {
    e1 = { x: cx - forward, y: cy - offset };
    e2 = { x: cx - forward, y: cy + offset };
  } else if (dir.y === -1) {
    e1 = { x: cx - offset, y: cy - forward };
    e2 = { x: cx + offset, y: cy - forward };
  } else {
    e1 = { x: cx - offset, y: cy + forward };
    e2 = { x: cx + offset, y: cy + forward };
  }

  [e1, e2].forEach(e => {
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(e.x + dir.x * 0.8, e.y + dir.y * 0.8, pupilR, 0, Math.PI * 2);
    ctx.fill();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Game Flow ────────────────────────────────────────────────────────────────
function startGame(mode) {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  initGame(mode);
  gameState = 'playing';
  draw();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(step, SPEED);
}

function endGame() {
  gameState = 'gameover';
  clearInterval(gameLoop);
  draw();

  const goScreen = document.getElementById('gameover-screen');
  const winnerEl = document.getElementById('winner-text');
  const labels = {
    hvh: ['Player 1', 'Player 2'],
    cvh: ['CPU', 'Player 2'],
    cvc: ['CPU 1', 'CPU 2'],
  };
  const [l1, l2] = labels[gameMode] || ['Snake 1', 'Snake 2'];

  document.getElementById('go-score1').textContent = score1;
  document.getElementById('go-score2').textContent = score2;

  if (!alive1 && !alive2) {
    winnerEl.textContent = "It's a Draw!";
    winnerEl.className = 'winner-text draw';
  } else if (!alive1) {
    winnerEl.textContent = `${l2} Wins! 🎉`;
    winnerEl.className = 'winner-text snake2';
  } else {
    winnerEl.textContent = `${l1} Wins! 🎉`;
    winnerEl.className = 'winner-text snake1';
  }

  goScreen.classList.remove('hidden');
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (gameState === 'gameover') {
    if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
      startGame(gameMode);
    }
    return;
  }

  if (gameState !== 'playing') return;

  // Player 1: WASD (only in hvh)
  if (gameMode === 'hvh') {
    switch (e.key) {
      case 'w': case 'W': nextDir1 = { x: 0, y: -1 }; break;
      case 's': case 'S': nextDir1 = { x: 0, y: 1 }; break;
      case 'a': case 'A': nextDir1 = { x: -1, y: 0 }; break;
      case 'd': case 'D': nextDir1 = { x: 1, y: 0 }; break;
    }
  }

  // Player 2: Arrow keys (hvh and cvh)
  if (gameMode === 'hvh' || gameMode === 'cvh') {
    switch (e.key) {
      case 'ArrowUp':    e.preventDefault(); nextDir2 = { x: 0, y: -1 }; break;
      case 'ArrowDown':  e.preventDefault(); nextDir2 = { x: 0, y: 1 }; break;
      case 'ArrowLeft':  e.preventDefault(); nextDir2 = { x: -1, y: 0 }; break;
      case 'ArrowRight': e.preventDefault(); nextDir2 = { x: 1, y: 0 }; break;
    }
  }
});

// ─── Initial draw ─────────────────────────────────────────────────────────────
ctx.fillStyle = COLORS.bg;
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
