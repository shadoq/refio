<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Showdown</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Space Mono", "Segoe UI", system-ui, monospace;
      background-color: #070b12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(0, 191, 255, 0.2), transparent 40%),
        linear-gradient(135deg, #070b12, #0f172a 60%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #f8fafc;
    }

    .app {
      width: min(90vw, 780px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .scoreboard {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.8);
      font-size: 0.95rem;
    }

    .scoreboard div strong {
      font-weight: 600;
    }

    .game-area {
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .board {
      width: min(90vw, 720px);
      max-width: 720px;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(30, 1fr);
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      background: #050a14;
      overflow: hidden;
      position: relative;
    }

    .cell {
      border: 1px solid rgba(255, 255, 255, 0.04);
      background: #050a14;
      transition: background 0.15s ease;
    }

    .cell.snake1 {
      background: linear-gradient(135deg, #00f5d4, #00b2ff);
      box-shadow: 0 0 8px rgba(0, 181, 255, 0.6);
    }

    .cell.snake2 {
      background: linear-gradient(135deg, #ff6b81, #ff3860);
      box-shadow: 0 0 8px rgba(255, 56, 96, 0.6);
    }

    .cell.food {
      background: radial-gradient(circle, #fff6b8, #ffd83d);
      box-shadow: 0 0 12px rgba(255, 216, 61, 0.8);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 2;
    }

    .overlay.hidden {
      display: none;
    }

    .menu-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.65);
    }

    .menu-card h1,
    .menu-card h2 {
      margin: 0 0 0.5rem;
      font-size: 1.9rem;
      letter-spacing: 0.08em;
    }

    .menu-card p {
      margin: 0.5rem 0 1rem;
      color: rgba(248, 250, 252, 0.9);
      font-size: 0.95rem;
    }

    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .mode-buttons button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .mode-buttons button:hover,
    .mode-buttons button:focus-visible {
      border-color: #10b981;
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .board {
        width: 100%;
      }

      .scoreboard {
        justify-content: center;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="scoreboard">
      <div><strong>Mode:</strong> <span id="modeLabel">Select a mode</span></div>
      <div><strong>Snake 1 Score:</strong> <span id="score1">0</span> (<span id="type1">-</span>)</div>
      <div><strong>Snake 2 Score:</strong> <span id="score2">0</span> (<span id="type2">-</span>)</div>
    </header>

    <div class="game-area">
      <div id="board" class="board"></div>

      <div id="startMenu" class="overlay">
        <div class="menu-card">
          <h1>Snake Showdown</h1>
          <p>Player 1: Arrow keys • Player 2: WASD<br />CPU snakes hunt food instinctively.</p>
          <div class="mode-buttons">
            <button data-mode="human-human">Human vs Human</button>
            <button data-mode="cpu-human">CPU vs Human</button>
            <button data-mode="cpu-cpu">CPU vs CPU</button>
          </div>
          <p>Pick a mode to begin the classic 30x30 clash.</p>
        </div>
      </div>

      <div id="gameOver" class="overlay hidden">
        <div class="menu-card">
          <h2 id="gameOverMessage">Game Over</h2>
          <p>Press any key to restart in the same mode.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 30;
    const INITIAL_LENGTH = 3;
    const TICK_RATE = 120;
    const DIRECTION_VECTORS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const MODE_LABELS = {
      "human-human": "Human vs Human",
      "cpu-human": "CPU vs Human",
      "cpu-cpu": "CPU vs CPU"
    };
    const MODE_CONTROLS = {
      "human-human": ["human", "human"],
      "cpu-human": ["cpu", "human"],
      "cpu-cpu": ["cpu", "cpu"]
    };
    const directionNames = ["up", "down", "left", "right"];

    const boardElement = document.getElementById("board");
    const startMenu = document.getElementById("startMenu");
    const gameOverLayer = document.getElementById("gameOver");
    const modeLabel = document.getElementById("modeLabel");
    const score1El = document.getElementById("score1");
    const score2El = document.getElementById("score2");
    const type1El = document.getElementById("type1");
    const type2El = document.getElementById("type2");
    const gameOverMessage = document.getElementById("gameOverMessage");

    const cells = [];
    let snakes = [];
    let food = null;
    let gameInterval = null;
    let gameState = "menu";
    let currentControls = ["human", "human"];
    let lastModeKey = null;

    function buildBoard() {
      boardElement.innerHTML = "";
      cells.length = 0;
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        boardElement.appendChild(cell);
        cells.push(cell);
      }
      renderBoard();
    }

    function showMenu() {
      gameState = "menu";
      startMenu.classList.remove("hidden");
      gameOverLayer.classList.add("hidden");
      modeLabel.textContent = "Select a mode";
      updateScores();
    }

    function startGame(modeKey) {
      clearInterval(gameInterval);
      currentControls = MODE_CONTROLS[modeKey];
      lastModeKey = modeKey;
      modeLabel.textContent = MODE_LABELS[modeKey];
      startMenu.classList.add("hidden");
      gameOverLayer.classList.add("hidden");
      food = null;
      snakes = [
        createSnake(4, 4, "right", currentControls[0]),
        createSnake(GRID_SIZE - 5, GRID_SIZE - 5, "left", currentControls[1])
      ];
      placeFood();
      renderBoard();
      updateScores();
      gameState = "running";
      gameInterval = setInterval(updateGame, TICK_RATE);
    }

    function createSnake(startX, startY, directionName, controlType) {
      const direction = DIRECTION_VECTORS[directionName];
      const body = [];
      for (let i = 0; i < INITIAL_LENGTH; i++) {
        body.push({
          x: startX - direction.x * i,
          y: startY - direction.y * i
        });
      }
      return {
        body,
        direction,
        control: controlType,
        alive: true
      };
    }

    function renderBoard() {
      cells.forEach(cell => {
        cell.className = "cell";
      });
      snakes.forEach((snake, index) => {
        snake.body.forEach(segment => {
          if (segment.x < 0 || segment.x >= GRID_SIZE || segment.y < 0 || segment.y >= GRID_SIZE) {
            return;
          }
          const idx = segment.y * GRID_SIZE + segment.x;
          const cell = cells[idx];
          if (!cell) return;
          cell.classList.add(`snake${index + 1}`);
        });
      });
      if (food) {
        const foodIdx = food.y * GRID_SIZE + food.x;
        const foodCell = cells[foodIdx];
        if (foodCell) {
          foodCell.classList.add("food");
        }
      }
    }

    function updateScores() {
      const snakeOne = snakes[0];
      const snakeTwo = snakes[1];
      const scoreOne = snakeOne ? Math.max(0, snakeOne.body.length - INITIAL_LENGTH) : 0;
      const scoreTwo = snakeTwo ? Math.max(0, snakeTwo.body.length - INITIAL_LENGTH) : 0;
      score1El.textContent = scoreOne;
      score2El.textContent = scoreTwo;
      type1El.textContent = snakeOne ? (snakeOne.control === "cpu" ? "CPU" : "Human") : "-";
      type2El.textContent = snakeTwo ? (snakeTwo.control === "cpu" ? "CPU" : "Human") : "-";
    }

    function updateGame() {
      if (gameState !== "running") return;
      const occupied = new Set();
      snakes.forEach(snake => {
        snake.body.forEach(segment => {
          occupied.add(`${segment.x},${segment.y}`);
        });
      });
      snakes.forEach((snake, index) => {
        if (!snake.alive) return;
        if (snake.control === "cpu") {
          snake.direction = chooseCpuDirection(snake, occupied);
        }
      });

      const newHeads = snakes.map(snake => {
        if (!snake.alive) return null;
        const head = snake.body[0];
        if (!head) return null;
        return {
          x: head.x + snake.direction.x,
          y: head.y + snake.direction.y
        };
      });

      const willGrow = newHeads.map((head, idx) => {
        if (!head || !food) return false;
        return head.x === food.x && head.y === food.y;
      });

      const aliveIndexes = snakes.map((snake, idx) => (snake.alive ? idx : -1)).filter(idx => idx !== -1);
      if (aliveIndexes.length > 1) {
        const [first, second] = aliveIndexes;
        const headA = newHeads[first];
        const headB = newHeads[second];
        if (headA && headB && headA.x === headB.x && headA.y === headB.y) {
          snakes[first].alive = false;
          snakes[second].alive = false;
        }
      }

      snakes.forEach((snake, idx) => {
        if (!snake.alive) return;
        const nextHead = newHeads[idx];
        if (!nextHead) return;
        if (
          nextHead.x < 0 ||
          nextHead.x >= GRID_SIZE ||
          nextHead.y < 0 ||
          nextHead.y >= GRID_SIZE
        ) {
          snake.alive = false;
          return;
        }
        const key = `${nextHead.x},${nextHead.y}`;
        const tail = snake.body[snake.body.length - 1];
        const tailKey = `${tail.x},${tail.y}`;
        if (occupied.has(key) && (key !== tailKey || willGrow[idx])) {
          snake.alive = false;
          return;
        }
        snake.body.unshift(nextHead);
        if (!willGrow[idx]) {
          snake.body.pop();
        } else {
          food = null;
        }
      });

      if (!food) {
        placeFood();
      }

      renderBoard();
      updateScores();

      const survivors = snakes.filter(snake => snake.alive);
      if (survivors.length <= 1) {
        finalizeGame(survivors);
      }
    }

    function finalizeGame(survivors) {
      clearInterval(gameInterval);
      gameInterval = null;
      gameState = "over";
      let message = "Draw!";
      if (survivors.length === 1) {
        const winnerIndex = snakes.indexOf(survivors[0]);
        const winnerType = survivors[0].control === "cpu" ? "CPU" : "Human";
        message = `Snake ${winnerIndex + 1} (${winnerType}) wins!`;
      }
      gameOverMessage.textContent = message;
      gameOverLayer.classList.remove("hidden");
    }

    function placeFood() {
      const reserved = new Set();
      snakes.forEach(snake => {
        snake.body.forEach(segment => {
          reserved.add(`${segment.x},${segment.y}`);
        });
      });
      let attempts = 0;
      while (attempts < 2000) {
        const x = Math.floor(Math.random() * GRID_SIZE);
        const y = Math.floor(Math.random() * GRID_SIZE);
        const key = `${x},${y}`;
        if (!reserved.has(key)) {
          food = { x, y };
          return;
        }
        attempts++;
      }
      food = null;
    }

    function chooseCpuDirection(snake, occupied) {
      if (!snake.body.length) return snake.direction;
      if (!food) return snake.direction;
      const head = snake.body[0];
      const dx = food.x - head.x;
      const dy = food.y - head.y;
      const preference = [];
      if (Math.abs(dx) >= Math.abs(dy)) {
        if (dx > 0) preference.push("right");
        else if (dx < 0) preference.push("left");
        if (dy > 0) preference.push("down");
        else if (dy < 0) preference.push("up");
      } else {
        if (dy > 0) preference.push("down");
        else if (dy < 0) preference.push("up");
        if (dx > 0) preference.push("right");
        else if (dx < 0) preference.push("left");
      }
      directionNames.forEach(name => {
        if (!preference.includes(name)) preference.push(name);
      });
      for (const directionName of preference) {
        const candidate = DIRECTION_VECTORS[directionName];
        if (isOpposite(candidate, snake.direction)) continue;
        const nx = head.x + candidate.x;
        const ny = head.y + candidate.y;
        if (canMoveTo(nx, ny, snake, occupied)) {
          return candidate;
        }
      }
      return snake.direction;
    }

    function canMoveTo(x, y, snake, occupied) {
      if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return false;
      const key = `${x},${y}`;
      if (!occupied.has(key)) return true;
      const tail = snake.body[snake.body.length - 1];
      if (!tail) return false;
      const tailKey = `${tail.x},${tail.y}`;
      return key === tailKey;
    }

    function isOpposite(a, b) {
      if (!a || !b) return false;
      return a.x + b.x === 0 && a.y + b.y === 0;
    }

    document.addEventListener("keydown", event => {
      if (gameState === "over") {
        if (lastModeKey) {
          startGame(lastModeKey);
        }
        return;
      }
      if (gameState !== "running") return;
      const key = event.key;
      let handled = false;
      if (currentControls[0] === "human") {
        const arrowDirections = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right"
        };
        if (arrowDirections[key]) {
          setSnakeDirection(0, arrowDirections[key]);
          handled = true;
        }
      }
      if (currentControls[1] === "human") {
        const wasd = {
          w: "up",
          a: "left",
          s: "down",
          d: "right"
        };
        const lowered = key.toLowerCase();
        if (wasd[lowered]) {
          setSnakeDirection(1, wasd[lowered]);
          handled = true;
        }
      }
      if (handled) {
        event.preventDefault();
      }
    });

    function setSnakeDirection(index, directionName) {
      const snake = snakes[index];
      if (!snake || !snake.alive) return;
      const candidate = DIRECTION_VECTORS[directionName];
      if (isOpposite(candidate, snake.direction)) return;
      snake.direction = candidate;
    }

    document.querySelectorAll("#startMenu button").forEach(button => {
      button.addEventListener("click", () => {
        const mode = button.dataset.mode;
        if (!mode || !MODE_LABELS[mode]) return;
        startGame(mode);
      });
    });

    buildBoard();
    showMenu();
  </script>
</body>
</html>
