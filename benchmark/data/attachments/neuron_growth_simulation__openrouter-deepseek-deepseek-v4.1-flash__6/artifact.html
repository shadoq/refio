<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neural Growth</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070f;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 800px;
    height: 800px;
    box-shadow: 0 0 60px rgba(16,26,58,0.9), 0 0 140px rgba(0,229,255,0.08);
    border-radius: 4px;
  }
  .dg.main {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace !important;
  }
  .dg.main .cr {
    background: rgba(5,7,15,0.85) !important;
    border-left: 3px solid #ffd400 !important;
  }
  .dg.main .cr .property-name {
    color: #ffd400 !important;
  }
  .dg.main .cr.number .slider {
    background: rgba(0,229,255,0.15) !important;
  }
  .dg.main .cr.number .slider-fg {
    background: #00e5ff !important;
  }
  .dg.main .close-button {
    color: #ffd400 !important;
    background: rgba(5,7,15,0.9) !important;
  }
  .dg.main .title {
    color: #ffd400 !important;
    background: rgba(5,7,15,0.9) !important;
  }
  #legend {
    position: fixed;
    top: 14px;
    left: 16px;
    color: #ffd400;
    opacity: 0.55;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 10px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="cv" width="800" height="800"></canvas>
<div id="legend">Neural Growth</div>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
/* ---------- SETUP ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const params = {
  neuronCount: 5,
  growthSpeed: 2.4,
  maxDepth: 5,
  splitChance: 0.35,
  curvature: 0.45,
  maxBranchLength: 90,
  synapseDist: 26,
  synapseGlow: 14,
  pulseSpeed: 1.0,
  pulseFreq: 0.6,
  pulseBright: 1.0,
  background: '#05070f',
  bgGlow: '#101a3a',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  showGrid: true,
  scanlines: true,
  vignette: true,
  glow: true
};

let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let paused = false;
let frame = 0;
const maxBranches = 900;
const maxPulses = 60;
let synapseKeys = new Set();

function rand(a, b) { return a + Math.random() * (b - a); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }

/* ---------- NEURON GROWTH ---------- */
function makeBranch(x, y, angle, depth, width, color, parent, delay) {
  return {
    x: x, y: y, px: x, py: y,
    angle: angle,
    speed: params.growthSpeed * rand(0.7, 1.3),
    depth: depth,
    maxDepth: params.maxDepth,
    width: width,
    color: color,
    alive: true,
    traveled: 0,
    target: params.maxBranchLength * rand(0.6, 1.2),
    curve: params.curvature,
    wobble: rand(0, Math.PI * 2),
    parent: parent,
    delay: delay || 0
  };
}

function spawnChildren(branch) {
  if (branch.depth >= params.maxDepth) return;
  if (branches.length >= maxBranches) return;
  const n = Math.random() < params.splitChance ? (Math.random() < 0.4 ? 2 : 1) : 0;
  for (let i = 0; i < n; i++) {
    if (branches.length >= maxBranches) break;
    const a = branch.angle + rand(-0.9, 0.9);
    const w = Math.max(0.4, branch.width * 0.72);
    const col = Math.random() < 0.25 ? params.accentColor : params.branchColor;
    branches.push(makeBranch(branch.x, branch.y, a, branch.depth + 1, w, col, branch, Math.floor(rand(2, 14))));
  }
}

function generateNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  synapseKeys = new Set();
  frame = 0;

  const count = Math.floor(rand(3, 7));
  for (let i = 0; i < count; i++) {
    const ang = rand(0, Math.PI * 2);
    const rad = rand(0, 120);
    const nx = 400 + Math.cos(ang) * rad;
    const ny = 400 + Math.sin(ang) * rad;
    const neuron = { x: nx, y: ny, r: rand(3, 6) };
    neurons.push(neuron);
    const nb = Math.floor(rand(2, 4));
    for (let j = 0; j < nb; j++) {
      const a = rand(0, Math.PI * 2);
      const col = Math.random() < 0.25 ? params.accentColor : params.branchColor;
      branches.push(makeBranch(nx, ny, a, 0, rand(0.6, 2.2), col, neuron, Math.floor(rand(0, 10))));
    }
  }
}

function growBranches() {
  let anyAlive = false;
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (!b.alive) continue;
    if (b.delay > 0) { b.delay--; anyAlive = true; continue; }
    anyAlive = true;

    b.px = b.x;
    b.py = b.y;

    b.angle += Math.sin(frame * 0.05 + b.wobble) * b.curve * 0.06 + rand(-0.03, 0.03);
    const step = b.speed;
    b.x += Math.cos(b.angle) * step;
    b.y += Math.sin(b.angle) * step;
    b.traveled += step;

    if (b.traveled >= b.target || b.depth >= b.maxDepth) {
      b.alive = false;
      spawnChildren(b);
    }
  }
  if (!anyAlive) {
    for (let i = 0; i < branches.length; i++) {
      if (branches[i].alive) return;
    }
  }
}

/* ---------- SYNAPSE DETECTION ---------- */
function detectSynapses() {
  const tips = [];
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    tips.push({ x: b.x, y: b.y, parent: b.parent, idx: i });
  }
  const limit = Math.min(tips.length, 220);
  for (let i = 0; i < limit; i++) {
    for (let j = i + 1; j < limit; j++) {
      const a = tips[i], b = tips[j];
      if (a.parent === b.parent) continue;
      if (dist(a.x, a.y, b.x, b.y) < params.synapseDist) {
        const key = Math.min(a.idx, b.idx) + '-' + Math.max(a.idx, b.idx);
        if (synapseKeys.has(key)) continue;
        synapseKeys.add(key);
        synapses.push({
          a: a, b: b,
          phase: rand(0, Math.PI * 2),
          strength: rand(0.5, 1)
        });
      }
    }
  }
}

/* ---------- PULSE ANIMATION ---------- */
function spawnPulses() {
  if (synapses.length === 0) return;
  if (pulses.length >= maxPulses) return;
  if (Math.random() < params.pulseFreq * 0.08) {
    const s = synapses[Math.floor(Math.random() * synapses.length)];
    pulses.push({
      synapse: s,
      t: 0,
      speed: params.pulseSpeed * rand(0.6, 1.4),
      dir: Math.random() < 0.5 ? 1 : -1
    });
  }
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed * 0.02;
    if (p.t > 1) pulses.splice(i, 1);
  }
}

/* ---------- RENDERING ---------- */
let bgGrad = null;
let bgGradKey = '';
let vignetteGrad = null;

function render() {
  ctx.fillStyle = params.background;
  ctx.fillRect(0, 0, W, H);

  const key = params.bgGlow;
  if (key !== bgGradKey) {
    bgGradKey = key;
    bgGrad = ctx.createRadialGradient(400, 400, 40, 400, 400, 520);
    bgGrad.addColorStop(0, params.bgGlow);
    bgGrad.addColorStop(1, 'rgba(5,7,15,0)');
  }
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  if (params.showGrid) {
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  if (params.scanlines) {
    ctx.fillStyle = 'rgba(0, 229, 255, 0.03)';
    for (let i = 0; i < 6; i++) {
      const y = (frame * 0.6 + i * 140) % (H + 40) - 20;
      ctx.fillRect(0, y, W, 2);
    }
  }

  ctx.lineCap = 'round';
  const glowAmt = params.glow ? 1 : 0;

  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (b.px === b.x && b.py === b.y) continue;
    const dx = b.x - b.px, dy = b.y - b.py;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const cx = (b.px + b.x) / 2 + nx * b.curve * 6;
    const cy = (b.py + b.y) / 2 + ny * b.curve * 6;

    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.width;
    ctx.shadowBlur = 10 * glowAmt;
    ctx.shadowColor = b.color;
    ctx.beginPath();
    ctx.moveTo(b.px, b.py);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = Math.max(0.3, b.width * 0.4);
    ctx.beginPath();
    ctx.moveTo(b.px, b.py);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    ctx.shadowBlur = 20 * glowAmt;
    ctx.shadowColor = params.branchColor;
    ctx.fillStyle = params.branchColor;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const bright = 0.5 + 0.5 * Math.sin(frame * 0.06 + s.phase);
    const g = params.synapseGlow * bright * s.strength;
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = params.synapseColor;
    ctx.lineWidth = 1 + bright;
    ctx.shadowBlur = g * glowAmt;
    ctx.shadowColor = params.synapseColor;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();

    const mx = (s.a.x + s.b.x) / 2;
    const my = (s.a.y + s.b.y) / 2;
    const halo = ctx.createRadialGradient(mx, my, 0, mx, my, 10);
    halo.addColorStop(0, params.synapseColor);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.25 * bright;
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(mx, my, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const t = p.dir > 0 ? p.t : 1 - p.t;
    const x = lerp(p.synapse.a.x, p.synapse.b.x, t);
    const y = lerp(p.synapse.a.y, p.synapse.b.y, t);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 18 * params.pulseBright * glowAmt;
    ctx.shadowColor = params.pulseColor;
    ctx.fillStyle = params.pulseColor;
    ctx.beginPath();
    ctx.arc(x, y, 2.5 * params.pulseBright, 0, Math.PI * 2);
    ctx.fill();

    const tx = lerp(p.synapse.a.x, p.synapse.b.x, t - 0.05 * p.dir);
    const ty = lerp(p.synapse.a.y, p.synapse.b.y, t - 0.05 * p.dir);
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = params.pulseColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  if (!vignetteGrad) {
    vignetteGrad = ctx.createRadialGradient(400, 400, 200, 400, 400, 560);
    vignetteGrad.addColorStop(0, 'rgba(5,7,15,0)');
    vignetteGrad.addColorStop(1, 'rgba(5,7,15,0.85)');
  }
  if (params.vignette) {
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 0.06;
  ctx.fillStyle = params.accentColor;
  for (let i = 0; i < 120; i++) {
    ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }
  ctx.globalAlpha = 1;
}

/* ---------- GUI SETUP ---------- */
function setupGUI() {
  const gui = new dat.GUI({ width: 300 });

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(params, 'neuronCount', 3, 8, 1);
  fGrowth.add(params, 'growthSpeed', 0.2, 8, 0.1);
  fGrowth.add(params, 'maxDepth', 1, 8, 1);
  fGrowth.add(params, 'splitChance', 0, 1, 0.01);
  fGrowth.add(params, 'curvature', 0, 1, 0.01);
  fGrowth.add(params, 'maxBranchLength', 20, 220, 1);

  const fSyn = gui.addFolder('Synapses');
  fSyn.add(params, 'synapseDist', 8, 80, 1);
  fSyn.add(params, 'synapseGlow', 0, 40, 1);

  const fPulse = gui.addFolder('Pulses');
  fPulse.add(params, 'pulseSpeed', 0.1, 4, 0.1);
  fPulse.add(params, 'pulseFreq', 0.05, 3, 0.05);
  fPulse.add(params, 'pulseBright', 0.2, 2, 0.05);

  const fVis = gui.addFolder('Visuals');
  fVis.addColor(params, 'background');
  fVis.addColor(params, 'bgGlow');
  fVis.addColor(params, 'branchColor');
  fVis.addColor(params, 'accentColor');
  fVis.addColor(params, 'synapseColor');
  fVis.addColor(params, 'pulseColor');
  fVis.add(params, 'showGrid');
  fVis.add(params, 'scanlines');
  fVis.add(params, 'vignette');
  fVis.add(params, 'glow');

  const actions = {
    regenerate: function () { generateNetwork(); },
    clear: function () {
      neurons = []; branches = []; synapses = []; pulses = [];
      synapseKeys = new Set();
      ctx.fillStyle = params.background;
      ctx.fillRect(0, 0, W, H);
    },
    pause: function () { paused = !paused; pauseCtrl.name(paused ? 'resume' : 'pause'); }
  };

  gui.add(actions, 'regenerate').name('regenerate network');
  gui.add(actions, 'clear').name('clear canvas');
  const pauseCtrl = gui.add(actions, 'pause').name('pause');

  gui.remember(params);
}

/* ---------- ANIMATION LOOP ---------- */
function loop() {
  requestAnimationFrame(loop);
  if (!paused) {
    frame++;
    growBranches();
    if (frame % 4 === 0) detectSynapses();
    spawnPulses();
    updatePulses();
  }
  render();
}

generateNetwork();
setupGUI();
loop();
</script>
</body>
</html>
