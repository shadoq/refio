<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gouraud-Shaded Rotating Cube</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        canvas { 
            background-color: #000; 
            border: 1px solid #333; 
        }
        #fps { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: white; 
            font-family: monospace; 
            font-size: 14px; 
            background-color: rgba(0,0,0,0.5); 
            padding: 5px; 
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="fps">FPS: 0</div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');
        
        // Set canvas size
        canvas.width = window.innerWidth * 0.8;
        canvas.height = window.innerHeight * 0.8;
        
        // Cube vertices (8 vertices, each with x, y, z coordinates)
        // Cube centered at origin with side length 2
        const vertices = [
            [-1, -1, -1], // 0
            [1, -1, -1],  // 1
            [1, 1, -1],   // 2
            [-1, 1, -1],  // 3
            [-1, -1, 1],  // 4
            [1, -1, 1],   // 5
            [1, 1, 1],    // 6
            [-1, 1, 1]    // 7
        ];
        
        // Define faces as triangles (12 triangles total)
        // Each face of the cube is split into 2 triangles
        const triangles = [
            // Front face (z = -1)
            [0, 1, 2], [0, 2, 3],
            // Back face (z = 1)
            [4, 7, 6], [4, 6, 5],
            // Right face (x = 1)
            [1, 5, 6], [1, 6, 2],
            // Left face (x = -1)
            [7, 3, 0], [7, 0, 4],
            // Top face (y = 1)
            [3, 2, 6], [3, 6, 7],
            // Bottom face (y = -1)
            [0, 4, 5], [0, 5, 1]
        ];
        
        // Lighting
        const lightPosition = [3, 3, 3]; // Initial light position
        const lightColor = [1, 1, 1]; // White light
        const ambientLight = 0.2; // Ambient light component
        
        // Rotation angles
        let rotationX = 0;
        let rotationY = 0;
        let rotationZ = 0;
        let rotationSpeed = 0.01;
        
        // Animation control
        let isPaused = false;
        let isWireframe = false;
        
        // FPS tracking
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;
        
        // Matrix operations
        function multiplyMatrix(matrix, vector) {
            return [
                matrix[0][0] * vector[0] + matrix[0][1] * vector[1] + matrix[0][2] * vector[2],
                matrix[1][0] * vector[0] + matrix[1][1] * vector[1] + matrix[1][2] * vector[2],
                matrix[2][0] * vector[0] + matrix[2][1] * vector[1] + matrix[2][2] * vector[2]
            ];
        }
        
        function createRotationX(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [1, 0, 0],
                [0, cos, -sin],
                [0, sin, cos]
            ];
        }
        
        function createRotationY(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [cos, 0, sin],
                [0, 1, 0],
                [-sin, 0, cos]
            ];
        }
        
        function createRotationZ(angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return [
                [cos, -sin, 0],
                [sin, cos, 0],
                [0, 0, 1]
            ];
        }
        
        // Perspective projection
        function project(vertex, fov = 500, viewerDistance = 5) {
            const scale = fov / (viewerDistance + vertex[2]);
            return [
                vertex[0] * scale,
                vertex[1] * scale,
                vertex[2]
            ];
        }
        
        // Lambert lighting model - calculate intensity for a vertex
        function calculateLighting(vertex, normal) {
            // Normalize the normal vector
            const normalLength = Math.sqrt(normal[0] * normal[0] + normal[1] * normal[1] + normal[2] * normal[2]);
            if (normalLength === 0) return 0;
            const normalizedNormal = [
                normal[0] / normalLength,
                normal[1] / normalLength,
                normal[2] / normalLength
            ];
            
            // Calculate light direction vector (from vertex to light)
            const lightDir = [
                lightPosition[0] - vertex[0],
                lightPosition[1] - vertex[1],
                lightPosition[2] - vertex[2]
            ];
            
            // Normalize light direction
            const lightLength = Math.sqrt(lightDir[0] * lightDir[0] + lightDir[1] * lightDir[1] + lightDir[2] * lightDir[2]);
            if (lightLength === 0) return 0;
            const normalizedLightDir = [
                lightDir[0] / lightLength,
                lightDir[1] / lightLength,
                lightDir[2] / lightLength
            ];
            
            // Calculate dot product (Lambert's cosine law)
            const intensity = Math.max(0, normalizedNormal[0] * normalizedLightDir[0] + 
                                       normalizedNormal[1] * normalizedLightDir[1] + 
                                       normalizedNormal[2] * normalizedLightDir[2]);
            
            // Add ambient light
            return ambientLight + (1 - ambientLight) * intensity;
        }
        
        // Calculate face normal using cross product
        function calculateNormal(v1, v2, v3) {
            // Create two edge vectors
            const edge1 = [
                v2[0] - v1[0],
                v2[1] - v1[1],
                v2[2] - v1[2]
            ];
            
            const edge2 = [
                v3[0] - v1[0],
                v3[1] - v1[1],
                v3[2] - v1[2]
            ];
            
            // Cross product
            const normal = [
                edge1[1] * edge2[2] - edge1[2] * edge2[1],
                edge1[2] * edge2[0] - edge1[0] * edge2[2],
                edge1[0] * edge2[1] - edge1[1] * edge2[0]
            ];
            
            return normal;
        }
        
        // Backface culling - check if face is facing the camera
        function isFaceVisible(v1, v2, v3, cameraPosition = [0, 0, 0]) {
            // Calculate face normal
            const normal = calculateNormal(v1, v2, v3);
            
            // Calculate face center
            const faceCenter = [
                (v1[0] + v2[0] + v3[0]) / 3,
                (v1[1] + v2[1] + v3[1]) / 3,
                (v1[2] + v2[2] + v3[2]) / 3
            ];
            
            // Vector from face center to camera
            const viewDir = [
                cameraPosition[0] - faceCenter[0],
                cameraPosition[1] - faceCenter[1],
                cameraPosition[2] - faceCenter[2]
            ];
            
            // Dot product of normal and view direction
            const dotProduct = normal[0] * viewDir[0] + normal[1] * viewDir[1] + normal[2] * viewDir[2];
            
            // If dot product is positive, face is facing camera
            return dotProduct > 0;
        }
        
        // Function to render a triangle with Gouraud shading
        function renderTriangle(v1, v2, v3, color1, color2, color3) {
            // Sort vertices by y-coordinate for scanline rendering
            let points = [
                {x: v1[0], y: v1[1], color: color1},
                {x: v2[0], y: v2[1], color: color2},
                {x: v3[0], y: v3[1], color: color3}
            ];
            
            // Sort by y-coordinate
            points.sort((a, b) => a.y - b.y);
            
            const top = points[0];
            const middle = points[1];
            const bottom = points[2];
            
            // Handle degenerate case
            if (top.y === bottom.y) return;
            
            // Calculate the left and right edges
            let left, right;
            
            // Determine if middle point is on left or right edge
            if (middle.x - top.x === 0) {
                // Vertical line
                left = top;
                right = bottom;
            } else {
                // Calculate slope
                const slopeTopMiddle = (middle.x - top.x) / (middle.y - top.y);
                const slopeTopBottom = (bottom.x - top.x) / (bottom.y - top.y);
                
                if (slopeTopMiddle < slopeTopBottom) {
                    left = top;
                    right = bottom;
                } else {
                    left = bottom;
                    right = top;
                }
            }
            
            // Scanline rendering
            const startY = Math.floor(top.y);
            const endY = Math.floor(bottom.y);
            
            for (let y = startY; y <= endY; y++) {
                // Calculate x positions at this y for both edges
                let leftX, rightX;
                let leftColor, rightColor;
                
                // Left edge
                if (y <= middle.y) {
                    // Top to middle
                    if (middle.y !== top.y) {
                        const t = (y - top.y) / (middle.y - top.y);
                        leftX = top.x + t * (middle.x - top.x);
                        leftColor = [
                            top.color[0] + t * (middle.color[0] - top.color[0]),
                            top.color[1] + t * (middle.color[1] - top.color[1]),
                            top.color[2] + t * (middle.color[2] - top.color[2])
                        ];
                    } else {
                        leftX = top.x;
                        leftColor = top.color;
                    }
                } else {
                    // Middle to bottom
                    if (bottom.y !== middle.y) {
                        const t = (y - middle.y) / (bottom.y - middle.y);
                        leftX = middle.x + t * (bottom.x - middle.x);
                        leftColor = [
                            middle.color[0] + t * (bottom.color[0] - middle.color[0]),
                            middle.color[1] + t * (bottom.color[1] - middle.color[1]),
                            middle.color[2] + t * (bottom.color[2] - middle.color[2])
                        ];
                    } else {
                        leftX = middle.x;
                        leftColor = middle.color;
                    }
                }
                
                // Right edge
                if (y <= middle.y) {
                    // Top to bottom
                    if (bottom.y !== top.y) {
                        const t = (y - top.y) / (bottom.y - top.y);
                        rightX = top.x + t * (bottom.x - top.x);
                        rightColor = [
                            top.color[0] + t * (bottom.color[0] - top.color[0]),
                            top.color[1] + t * (bottom.color[1] - top.color[1]),
                            top.color[2] + t * (bottom.color[2] - top.color[2])
                        ];
                    } else {
                        rightX = top.x;
                        rightColor = top.color;
                    }
                } else {
                    // Middle to bottom
                    if (bottom.y !== middle.y) {
                        const t = (y - middle.y) / (bottom.y - middle.y);
                        rightX = middle.x + t * (bottom.x - middle.x);
                        rightColor = [
                            middle.color[0] + t * (bottom.color[0] - middle.color[0]),
                            middle.color[1] + t * (bottom.color[1] - middle.color[1]),
                            middle.color[2] + t * (bottom.color[2] - middle.color[2])
                        ];
                    } else {
                        rightX = middle.x;
                        rightColor = middle.color;
                    }
                }
                
                // Swap if needed
                if (leftX > rightX) {
                    [leftX, rightX] = [rightX, leftX];
                    [leftColor, rightColor] = [rightColor, leftColor];
                }
                
                // Draw horizontal line
                const startX = Math.floor(leftX);
                const endX = Math.floor(rightX);
                
                for (let x = startX; x <= endX; x++) {
                    if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
                        // Interpolate color
                        if (rightX !== leftX) {
                            const t = (x - leftX) / (rightX - leftX);
                            const r = leftColor[0] + t * (rightColor[0] - leftColor[0]);
                            const g = leftColor[1] + t * (rightColor[1] - leftColor[1]);
                            const b = leftColor[2] + t * (rightColor[2] - leftColor[2]);
                            
                            // Clamp colors to [0,1]
                            const clampedR = Math.max(0, Math.min(1, r));
                            const clampedG = Math.max(0, Math.min(1, g));
                            const clampedB = Math.max(0, Math.min(1, b));
                            
                            // Convert to 0-255
                            const r255 = Math.floor(clampedR * 255);
                            const g255 = Math.floor(clampedG * 255);
                            const b255 = Math.floor(clampedB * 255);
                            
                            ctx.fillStyle = `rgb(${r255}, ${g255}, ${b255})`;
                            ctx.fillRect(x, y, 1, 1);
                        }
                    }
                }
            }
        }
        
        // Main render function
        function render() {
            if (isPaused) {
                requestAnimationFrame(render);
                return;
            }
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update rotation
            rotationX += rotationSpeed;
            rotationY += rotationSpeed * 0.7;
            rotationZ += rotationSpeed * 0.5;
            
            // Update light position (orbit around cube)
            const lightRadius = 4;
            const lightAngle = Date.now() * 0.0002;
            lightPosition[0] = Math.cos(lightAngle) * lightRadius;
            lightPosition[1] = Math.sin(lightAngle) * lightRadius;
            lightPosition[2] = Math.sin(lightAngle * 0.7) * lightRadius * 0.5;
            
            // Apply rotations to vertices
            const rotatedVertices = [];
            const rotationMatrix = multiplyMatrix(
                multiplyMatrix(createRotationX(rotationX), createRotationY(rotationY)), 
                createRotationZ(rotationZ)
            );
            
            for (let i = 0; i < vertices.length; i++) {
                const rotated = multiplyMatrix(rotationMatrix, vertices[i]);
                rotatedVertices.push(rotated);
            }
            
            // Calculate normals for each triangle
            const triangleNormals = [];
            const triangleColors = [];
            
            for (let i = 0; i < triangles.length; i++) {
                const [v1Idx, v2Idx, v3Idx] = triangles[i];
                const v1 = rotatedVertices[v1Idx];
                const v2 = rotatedVertices[v2Idx];
                const v3 = rotatedVertices[v3Idx];
                
                // Calculate face normal
                const normal = calculateNormal(v1, v2, v3);
                triangleNormals.push(normal);
                
                // Calculate lighting for each vertex
                const intensity1 = calculateLighting(v1, normal);
                const intensity2 = calculateLighting(v2, normal);
                const intensity3 = calculateLighting(v3, normal);
                
                // Apply lighting to color (white light)
                const color1 = [lightColor[0] * intensity1, lightColor[1] * intensity1, lightColor[2] * intensity1];
                const color2 = [lightColor[0] * intensity2, lightColor[1] * intensity2, lightColor[2] * intensity2];
                const color3 = [lightColor[0] * intensity3, lightColor[1] * intensity3, lightColor[2] * intensity3];
                
                triangleColors.push([color1, color2, color3]);
            }
            
            // Backface culling and rendering
            for (let i = 0; i < triangles.length; i++) {
                const [v1Idx, v2Idx, v3Idx] = triangles[i];
                const v1 = rotatedVertices[v1Idx];
                const v2 = rotatedVertices[v2Idx];
                const v3 = rotatedVertices[v3Idx];
                const normal = triangleNormals[i];
                
                // Backface culling: check if face is facing the camera
                // Vector from camera (0,0,0) to face center
                const faceCenter = [
                    (v1[0] + v2[0] + v3[0]) / 3,
                    (v1[1] + v2[1] + v3[1]) / 3,
                    (v1[2] + v2[2] + v3[2]) / 3
                ];
                
                // Vector from face center to camera
                const viewDir = [
                    0 - faceCenter[0],
                    0 - faceCenter[1],
                    0 - faceCenter[2]
                ];
                
                // Dot product of normal and view direction
                const dotProduct = normal[0] * viewDir[0] + normal[1] * viewDir[1] + normal[2] * viewDir[2];
                
                // If dot product is negative, face is facing camera (camera is at origin, facing negative Z)
                if (dotProduct < 0) {
                    // Project vertices to 2D
                    const p1 = project(v1);
                    const p2 = project(v2);
                    const p3 = project(v3);
                    
                    // Scale and translate to canvas center
                    const scale = canvas.width / 6; // Scale to fit canvas
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    
                    const screen1 = [
                        p1[0] * scale + centerX,
                        p1[1] * scale + centerY
                    ];
                    const screen2 = [
                        p2[0] * scale + centerX,
                        p2[1] * scale + centerY
                    ];
                    const screen3 = [
                        p3[0] * scale + centerX,
                        p3[1] * scale + centerY
                    ];
                    
                    // Render triangle
                    if (isWireframe) {
                        // Draw wireframe
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(screen1[0], screen1[1]);
                        ctx.lineTo(screen2[0], screen2[1]);
                        ctx.lineTo(screen3[0], screen3[1]);
                        ctx.closePath();
                        ctx.stroke();
                    } else {
                        // Gouraud shading
                        const colors = triangleColors[i];
                        renderTriangle(screen1, screen2, screen3, colors[0], colors[1], colors[2]);
                    }
                }
            }
            
            // Update FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                fpsDisplay.textContent = `FPS: ${fps}`;
            }
            
            requestAnimationFrame(render);
        }
        
        // Event listeners
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') {
                isWireframe = !isWireframe;
            } else if (e.key.toLowerCase() === 'p') {
                isPaused = !isPaused;
            }
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * 0.8;
            canvas.height = window.innerHeight * 0.8;
        });
        
        // Start animation
        render();
    </script>
</body>
</html>
