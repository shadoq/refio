<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px #101a3a;
            border: 2px solid #ffd40033;
        }
        canvas {
            display: block;
            background-color: #05070f;
        }
        .dg.main {
            user-select: none;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const params = {
        neuronCount: 5,
        growthSpeed: 1.5,
        maxDepth: 6,
        splitChance: 0.3,
        curvature: 0.5,
        maxLength: 60,
        synapseDistance: 30,
        synapseGlow: 15,
        pulseSpeed: 0.02,
        pulseFrequency: 0.01,
        pulseBrightness: 1.0,
        bgColor: '#05070f',
        branchColor: '#00e5ff',
        accentColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a',
        regenerate: () => initSimulation(),
        clear: () => {
            branches = [];
            synapses = [];
            pulses = [];
        },
        paused: false
    };

    let branches = [];
    let synapses = [];
    let pulses = [];
    let frameCount = 0;

    class Branch {
        constructor(x, y, angle, depth, parent = null) {
            this.startX = x;
            this.startY = y;
            this.endX = x;
            this.endY = y;
            this.angle = angle;
            this.depth = depth;
            this.parent = parent;
            this.length = 0;
            this.maxLength = Math.random() * params.maxLength + 20;
            this.growthFinished = false;
            this.thickness = Math.max(0.5, (params.maxDepth - depth) * 0.8);
            this.color = (depth % 3 === 0) ? params.accentColor : params.branchColor;
            
            // For quadratic curves
            this.cpX = x + Math.cos(angle) * (this.maxLength / 2);
            this.cpY = y + Math.sin(angle) * (this.maxLength / 2);
            this.targetX = x + Math.cos(angle) * this.maxLength;
            this.targetY = y + Math.sin(angle) * this.maxLength;
            
            // Add some curvature
            this.targetX += (Math.random() - 0.5) * params.curvature * 50;
            this.targetY += (Math.random() - 0.5) * params.curvature * 50;
        }

        update() {
            if (this.growthFinished) return;

            this.length += params.growthSpeed;
            const progress = Math.min(this.length / this.maxLength, 1);
            
            // Interpolate end point along quadratic curve
            // B(t) = (1-t)^2 P0 + 2(1-t)t P1 + t^2 P2
            const t = progress;
            this.endX = Math.pow(1 - t, 2) * this.startX + 2 * (1 - t) * t * this.cpX + Math.pow(t, 2) * this.targetX;
            this.endY = Math.pow(1 - t, 2) * this.startY + 2 * (1 - t) * t * this.cpY + Math.pow(t, 2) * this.targetY;

            if (progress >= 1) {
                this.growthFinished = true;
                this.checkSplit();
                this.checkSynapse();
            }
        }

        checkSplit() {
            if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                const numSplits = Math.random() > 0.8 ? 3 : 2;
                for (let i = 0; i < numSplits; i++) {
                    const angleOffset = (Math.random() - 0.5) * Math.PI * 0.8;
                    const newAngle = Math.atan2(this.endY - this.cpY, this.endX - this.cpX) + angleOffset;
                    branches.push(new Branch(this.endX, this.endY, newAngle, this.depth + 1, this));
                }
            }
        }

        checkSynapse() {
            branches.forEach(other => {
                if (other === this || other.parent === this || this.parent === other) return;
                if (!other.growthFinished) return;

                const dist = Math.hypot(this.endX - other.endX, this.endY - other.endY);
                if (dist < params.synapseDistance) {
                    // Avoid duplicates
                    const exists = synapses.some(s => (s.a === this && s.b === other) || (s.a === other && s.b === this));
                    if (!exists) {
                        synapses.push({ a: this, b: other, life: 0 });
                    }
                }
            });
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.quadraticCurveTo(this.cpX, this.cpY, this.endX, this.endY);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.thickness;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
        }

        update() {
            this.progress += this.speed;
            if (this.progress >= 1) return false;
            return true;
        }

        draw() {
            const a = this.synapse.a;
            const b = this.synapse.b;
            
            // Simple linear interpolation for pulse position between endpoints
            const x = a.endX + (b.endX - a.endX) * this.progress;
            const y = a.endY + (b.endY - a.endY) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = params.pulseColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function initSimulation() {
        branches = [];
        synapses = [];
        pulses = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        for (let i = 0; i < params.neuronCount; i++) {
            const x = centerX + (Math.random() - 0.5) * 100;
            const y = centerY + (Math.random() - 0.5) * 100;
            const angle = Math.random() * Math.PI * 2;
            branches.push(new Branch(x, y, angle, 0));
        }
    }

    function drawBackground() {
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid/Scanlines
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
        }
        for (let i = 0; i < canvas.height; i += 40) {
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
        }
        ctx.stroke();

        // Vignette
        const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 500);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function animate() {
        if (!params.paused) {
            frameCount++;
            
            // Update logic
            branches.forEach(b => b.update());
            
            // Handle pulses
            if (Math.random() < params.pulseFrequency && synapses.length > 0) {
                const syn = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(syn));
            }
            pulses = pulses.filter(p => p.update());
        }

        // Render
        drawBackground();

        branches.forEach(b => b.draw());

        synapses.forEach(s => {
            ctx.beginPath();
            ctx.moveTo(s.a.endX, s.a.endY);
            ctx.lineTo(s.b.endX, s.b.endY);
            ctx.strokeStyle = params.synapseColor;
            ctx.lineWidth = 1;
            ctx.shadowBlur = params.synapseGlow;
            ctx.shadowColor = params.synapseColor;
            ctx.globalAlpha = 0.4 + Math.sin(frameCount * 0.05) * 0.2;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        });

        pulses.forEach(p => p.draw());

        requestAnimationFrame(animate);
    }

    // GUI Setup
    const gui = new dat.GUI();
    
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 1, 15, 1).onFinishChange(initSimulation);
    growthFolder.add(params, 'growthSpeed', 0.1, 5.0);
    growthFolder.add(params, 'maxDepth', 1, 10, 1);
    growthFolder.add(params, 'splitChance', 0, 1);
    growthFolder.add(params, 'curvature', 0, 1);
    growthFolder.add(params, 'maxLength', 10, 150);
    growthFolder.open();

    const synapseFolder = gui.addFolder('Synapses');
    synapseFolder.add(params, 'synapseDistance', 5, 100);
    synapseFolder.add(params, 'synapseGlow', 0, 30);
    synapseFolder.open();

    const pulseFolder = gui.addFolder('Pulses');
    pulseFolder.add(params, 'pulseSpeed', 0.001, 0.1);
    pulseFolder.add(params, 'pulseFrequency', 0, 0.1);
    pulseFolder.add(params, 'pulseBrightness', 0, 2);
    pulseFolder.open();

    const visualFolder = gui.addFolder('Visuals');
    visualFolder.addColor(params, 'bgColor');
    visualFolder.addColor(params, 'branchColor');
    visualFolder.addColor(params, 'accentColor');
    visualFolder.addColor(params, 'synapseColor');
    visualFolder.addColor(params, 'pulseColor');
    visualFolder.open();

    gui.add(params, 'paused').name('Paused');
    gui.add(params, 'regenerate').name('Regenerate Network');
    gui.add(params, 'clear').name('Clear Canvas');

    initSimulation();
    animate();
</script>
</body>
</html>
