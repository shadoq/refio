<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --fg: #2d3748;
      --accent: #42b983;
      --accent-hover: #38a16f;
      --card: #ffffff;
      --border: #e2e8f0;
      --danger: #e53e3e;
      --radius: 8px;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #718096;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--card);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(66, 185, 131, 0.15);
    }

    button {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: 2px solid #2b6e4a;
      outline-offset: 2px;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 0.5rem 0.75rem;
      background: transparent;
      color: #a0aec0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--fg);
      border-color: var(--border);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .todo-item:hover {
      border-color: var(--accent);
    }

    .todo-item.completed {
      background: #edf2f7;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .todo-item .toggle {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-right: 0.75rem;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 50%;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .todo-item.completed .toggle {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-item .toggle svg {
      width: 10px;
      height: 10px;
      fill: white;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .todo-item.completed .toggle svg {
      opacity: 1;
    }

    .todo-item .todo-text {
      flex: 1;
      font-size: 0.9375rem;
    }

    .todo-item .delete-btn {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      transition: color 0.2s;
    }

    .todo-item .delete-btn:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: #a0aec0;
      padding: 2rem;
      font-style: italic;
    }

    .stats {
      color: #718096;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stats span {
      color: var(--fg);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Todo</h1>
    <div class="subtitle">Organize your tasks</div>

    <div class="input-group">
      <input type="text" id="new-todo" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-todo" aria-label="Add todo">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" id="todo-list">
      <!-- Todo items rendered here -->
    </ul>

    <div class="stats" id="stats">0 items left</div>
  </div>

  <script>
    // Load todos from localStorage or use empty array
    const STORAGE_KEY = 'todo-app-v1';
    
    function loadTodos() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        console.error('Failed to load todos:', e);
        return [];
      }
    }
    
    function saveTodos(todos) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        console.error('Failed to save todos:', e);
      }
    }

    let todos = loadTodos();

    // DOM elements
    const newTodoInput = document.getElementById('new-todo');
    const addTodoBtn = document.getElementById('add-todo');
    const todoList = document.getElementById('todo-list');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const statsEl = document.getElementById('stats');

    // Render todos
    function renderTodos(filter = 'all') {
      const filtered = filterTodos(todos, filter);
      
      if (filtered.length === 0) {
        todoList.innerHTML = '<li class="empty-state">No todos yet — add one above</li>';
      } else {
        todoList.innerHTML = filtered.map((todo, index) => `
          <li class="todo-item${todo.completed ? ' completed' : ''}" data-index="${index}">
            <div class="toggle" 
                 onclick="toggleTodo(${index})"
                 role="checkbox"
                 aria-checked="${todo.completed}"
                 tabindex="0"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTodo(${index})}">
              <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3">
                <path d="M20 6L9 17L4 12"/>
              </svg>
            </div>
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            <button class="delete-btn" onclick="deleteTodo(${index})" aria-label="Delete todo">&times;</button>
          </li>
        `).join('');
      }
      
      updateStats();
    }

    // Filter todos
    function filterTodos(todos, filter) {
      if (filter === 'all') return todos;
      if (filter === 'active') return todos.filter(t => !t.completed);
      if (filter === 'completed') return todos.filter(t => t.completed);
      return todos;
    }

    // Update stats
    function updateStats() {
      const activeCount = todos.filter(t => !t.completed).length;
      statsEl.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
    }

    // Add todo
    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      
      todos = [...todos, { text: trimmed, completed: false }];
      saveTodos(todos);
      renderTodos();
      newTodoInput.value = '';
    }

    // Toggle todo completion
    function toggleTodo(index) {
      todos = todos.map((todo, i) => 
        i === index ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos(todos);
      renderTodos();
    }

    // Delete todo
    function deleteTodo(index) {
      todos = todos.filter((_, i) => i !== index);
      saveTodos(todos);
      renderTodos();
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    addTodoBtn.addEventListener('click', () => addTodo(newTodoInput.value));
    
    newTodoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTodo(newTodoInput.value);
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTodos(btn.dataset.filter);
      });
    });

    // Initial render
    renderTodos();
  </script>
</body>
</html>
