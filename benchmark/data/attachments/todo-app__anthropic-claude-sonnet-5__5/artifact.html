<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  header {
    padding: 28px 28px 16px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 18px;
    font-size: 28px;
    font-weight: 700;
    color: #333;
    letter-spacing: -0.5px;
  }

  .add-form {
    display: flex;
    gap: 8px;
  }

  .add-form input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .add-form input[type="text"]:focus {
    border-color: #764ba2;
    box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
  }

  .add-form button {
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .add-form button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(118, 75, 162, 0.35);
  }

  .add-form button:active {
    transform: translateY(0);
  }

  .filters {
    display: flex;
    gap: 8px;
    padding: 0 28px 16px;
  }

  .filter-btn {
    flex: 1;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
    color: #666;
    background: #f5f5f7;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .filter-btn:hover {
    background: #ebebef;
  }

  .filter-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 400px;
    overflow-y: auto;
    border-top: 1px solid #eee;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s ease;
  }

  .todo-item:hover {
    background: #fafafa;
  }

  .todo-item:hover .delete-btn {
    opacity: 1;
  }

  .checkbox {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 2px solid #ccc;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s ease, background 0.2s ease;
    background: #fff;
  }

  .checkbox:hover {
    border-color: #764ba2;
  }

  .checkbox.checked {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-color: transparent;
  }

  .checkbox.checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
    transition: color 0.2s ease, opacity 0.2s ease;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #aaa;
    opacity: 0.7;
  }

  .delete-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: #ccc;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .delete-btn:hover {
    background: #ffe0e0;
    color: #e05555;
  }

  .empty-state {
    padding: 48px 28px;
    text-align: center;
    color: #aaa;
    font-size: 15px;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #888;
  }

  .clear-completed {
    border: none;
    background: transparent;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    transition: color 0.2s ease;
  }

  .clear-completed:hover {
    color: #e05555;
  }

  .clear-completed:disabled {
    visibility: hidden;
  }

  .todo-list::-webkit-scrollbar {
    width: 8px;
  }

  .todo-list::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Todo List</h1>
      <form class="add-form" id="add-form">
        <input type="text" id="new-todo-input" placeholder="What needs to be done?" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <footer>
      <span id="items-left">0 items left</span>
      <button class="clear-completed" id="clear-completed">Clear completed</button>
    </footer>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'todos-app-v1';
  var todos = [];
  var currentFilter = 'all';

  var listEl = document.getElementById('todo-list');
  var formEl = document.getElementById('add-form');
  var inputEl = document.getElementById('new-todo-input');
  var itemsLeftEl = document.getElementById('items-left');
  var clearCompletedBtn = document.getElementById('clear-completed');
  var filterBtns = document.querySelectorAll('.filter-btn');

  function loadTodos() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          todos = parsed;
        }
      }
    } catch (e) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function addTodo(text) {
    var trimmed = text.trim();
    if (!trimmed) return;
    todos.push({ id: generateId(), text: trimmed, completed: false });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    var todo = todos.find(function (t) { return t.id === id; });
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    saveTodos();
    render();
  }

  function getFilteredTodos() {
    if (currentFilter === 'active') {
      return todos.filter(function (t) { return !t.completed; });
    }
    if (currentFilter === 'completed') {
      return todos.filter(function (t) { return t.completed; });
    }
    return todos;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    var filtered = getFilteredTodos();

    if (filtered.length === 0) {
      var message = todos.length === 0 ? 'No todos yet. Add one above!' : 'Nothing here.';
      listEl.innerHTML = '<li class="empty-state">' + message + '</li>';
    } else {
      listEl.innerHTML = filtered.map(function (todo) {
        return (
          '<li class="todo-item' + (todo.completed ? ' completed' : '') + '" data-id="' + todo.id + '">' +
            '<div class="checkbox' + (todo.completed ? ' checked' : '') + '" data-action="toggle"></div>' +
            '<span class="todo-text">' + escapeHtml(todo.text) + '</span>' +
            '<button class="delete-btn" data-action="delete" aria-label="Delete todo">&times;</button>' +
          '</li>'
        );
      }).join('');
    }

    var activeCount = todos.filter(function (t) { return !t.completed; }).length;
    itemsLeftEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    var hasCompleted = todos.some(function (t) { return t.completed; });
    clearCompletedBtn.disabled = !hasCompleted;
  }

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    addTodo(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  listEl.addEventListener('click', function (e) {
    var itemEl = e.target.closest('.todo-item');
    if (!itemEl) return;
    var id = itemEl.getAttribute('data-id');
    var action = e.target.getAttribute('data-action');

    if (action === 'toggle') {
      toggleTodo(id);
    } else if (action === 'delete') {
      deleteTodo(id);
    }
  });

  clearCompletedBtn.addEventListener('click', function () {
    clearCompleted();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentFilter = btn.getAttribute('data-filter');
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });

  loadTodos();
  render();
})();
</script>
</body>
</html>
