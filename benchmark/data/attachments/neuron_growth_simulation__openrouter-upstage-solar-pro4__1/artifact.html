<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Neuron Growth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas {
    border: 1px solid rgba(0, 229, 255, 0.15);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), inset 0 0 60px rgba(16, 26, 58, 0.4);
    display: block;
  }
  #gui-wrapper {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
  }
  .dg.ac {
    z-index: 200 !important;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<div id="gui-wrapper"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;

  // ── Neon palette ──
  const PALETTE = {
    bg: '#05070f',
    bgGlow: '#101a3a',
    branch: '#00e5ff',
    accent: '#d6ff00',
    synapse: '#ff2bd6',
    pulse: '#fff36a',
    ui: '#ffd400',
    grid: 'rgba(0, 229, 255, 0.08)'
  };

  // ── State ──
  let neurons = [];
  let branches = [];
  let synapses = [];
  let pulses = [];
  let paused = false;
  let frame = 0;
  let branchIdCounter = 0;

  // ── Config (GUI) ──
  const config = {
    neuronCount: 4,
    growthSpeed: 1.2,
    maxDepth: 6,
    splitChance: 0.18,
    curvature: 0.35,
    maxLength: 140,
    synapseDist: 35,
    synapseGlow: 1.0,
    pulseSpeed: 1.6,
    pulseFreq: 0.012,
    pulseBrightness: 1.0,
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a'
  };

  // ── Utility ──
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function hslStr(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }

  // ── Branch class ──
  class Branch {
    constructor(x, y, angle, depth, parentId, side) {
      this.id = branchIdCounter++;
      this.x = x;
      this.y = y;
      this.angle = angle;
      this.depth = depth;
      this.parentId = parentId;
      this.side = side || 0;
      this.length = 0;
      this.maxLen = config.maxLength * rand(0.7, 1.3);
      this.thickness = Math.max(0.6, 3.2 - depth * 0.45 + rand(-0.3, 0.3));
      this.curveOffset = rand(-0.4, 0.4) * config.curvature;
      this.curvePhase = rand(0, Math.PI * 2);
      this.alive = true;
      this.grown = false;
      this.killAngle = this.angle + rand(-0.6, 0.6);
      this.points = [{ x, y }];
      this.color = depth <= 1 ? config.branchColor : config.accentColor;
      this.noiseSeed = rand(0, 100);
    }

    grow() {
      if (!this.alive) return;
      const step = config.growthSpeed * rand(0.8, 1.2);
      this.length += step;
      if (this.length >= this.maxLen) {
        this.alive = false;
        this.grown = true;
        return;
      }
      const t = this.length / this.maxLen;
      const wobble = Math.sin(t * Math.PI * 3 + this.curvePhase) * this.curveOffset * (1 - t * 0.5);
      const angle = this.angle + wobble + (t * 0.3) * Math.sin(this.noiseSeed + frame * 0.02);
      const nx = this.x + Math.cos(angle) * step;
      const ny = this.y + Math.sin(angle) * step;
      this.x = nx;
      this.y = ny;
      this.points.push({ x: nx, y: ny });
    }

    draw() {
      if (this.points.length < 2) return;
      ctx.save();
      ctx.lineWidth = this.thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 8 + this.thickness * 2;
      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);
      for (let i = 1; i < this.points.length; i++) {
        const p0 = this.points[i - 1];
        const p1 = this.points[i];
        const cpx = (p0.x + p1.x) / 2 + (Math.sin(i * 0.5 + this.curvePhase) * 2);
        const cpy = (p0.y + p1.y) / 2 + (Math.cos(i * 0.5 + this.curvePhase) * 2);
        ctx.quadraticCurveTo(cpx, cpy, p1.x, p1.y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Neuron (seed) ──
  class Neuron {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.branches = [];
      this.id = branchIdCounter++;
    }

    spawnInitialBranches() {
      const count = randInt(3, 6);
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + rand(-0.3, 0.3);
        const b = new Branch(this.x, this.y, angle, 0, this.id, 0);
        b.maxLen = config.maxLength * rand(0.8, 1.4);
        this.branches.push(b);
        branches.push(b);
      }
    }
  }

  // ── Pulse ──
  class Pulse {
    constructor(x, y, color, life) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.life = life || 1.0;
      this.maxLife = this.life;
      this.radius = 2;
      this.alive = true;
    }

    update() {
      this.life -= 0.012 * config.pulseSpeed;
      this.radius += 0.6 * config.pulseSpeed;
      if (this.life <= 0) this.alive = false;
    }

    draw() {
      const alpha = clamp(this.life / this.maxLife, 0, 1) * config.pulseBrightness;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.3;
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Synapse ──
  class Synapse {
    constructor(a, b) {
      this.a = a;
      this.b = b;
      this.age = 0;
      this.glow = 0;
      this.alive = true;
    }

    update() {
      this.age++;
      this.glow = Math.min(1, this.glow + 0.02);
    }

    draw() {
      const strength = config.synapseGlow;
      const alpha = clamp(0.4 + this.glow * 0.6, 0, 1) * strength;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = config.synapseColor;
      ctx.shadowBlur = 12 * strength + 6;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = config.synapseColor;
      ctx.beginPath();
      ctx.moveTo(this.a.x, this.a.y);
      ctx.lineTo(this.b.x, this.b.y);
      ctx.stroke();
      // endpoint dots
      ctx.shadowBlur = 8;
      ctx.fillStyle = config.synapseColor;
      ctx.globalAlpha = alpha * 0.8;
      ctx.beginPath();
      ctx.arc(this.a.x, this.a.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.b.x, this.b.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Network generation ──
  function generateNetwork() {
    neurons = [];
    branches = [];
    synapses = [];
    pulses = [];
    branchIdCounter = 0;

    const count = config.neuronCount;
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const radius = rand(20, 80);
      const x = CX + Math.cos(angle) * radius;
      const y = CY + Math.sin(angle) * radius;
      const n = new Neuron(x, y);
      n.spawnInitialBranches();
      neurons.push(n);
    }
  }

  // ── Branch splitting ──
  function trySplit(branch) {
    if (branch.depth >= config.maxDepth) return;
    if (!branch.alive) return;
    if (branch.length < branch.maxLen * 0.3) return;
    if (Math.random() > config.splitChance) return;
    const count = randInt(1, 2);
    for (let i = 0; i < count; i++) {
      const side = i === 0 ? -1 : 1;
      const newAngle = branch.angle + side * rand(0.5, 1.2);
      const child = new Branch(branch.x, branch.y, newAngle, branch.depth + 1, branch.id, side);
      child.maxLen = branch.maxLen * rand(0.5, 0.85);
      child.color = branch.depth + 1 <= 1 ? config.branchColor : config.accentColor;
      branch.points.push({ x: branch.x, y: branch.y });
      branches.push(child);
    }
  }

  // ── Synapse detection ──
  function detectSynapses() {
    const threshold = config.synapseDist;
    const candidates = [];
    for (const b of branches) {
      if (!b.alive && b.points.length > 0) {
        const tip = b.points[b.points.length - 1];
        candidates.push({ x: tip.x, y: tip.y, branch: b });
      }
    }
    for (let i = 0; i < candidates.length; i++) {
      for (let j = i + 1; j < candidates.length; j++) {
        const a = candidates[i];
        const b = candidates[j];
        if (dist(a, b) < threshold) {
          // avoid duplicates
          const key = Math.min(a.branch.id, b.branch.id) + '_' + Math.max(a.branch.id, b.branch.id);
          if (!synapses.some(s => (s.a.id === a.branch.id && s.b.id === b.branch.id) ||
                                    (s.a.id === b.branch.id && s.b.id === a.branch.id))) {
            synapses.push(new Synapse(a, b));
          }
        }
      }
    }
  }

  // ── Pulse spawning ──
  function spawnPulses() {
    if (Math.random() < config.pulseFreq) {
      const src = branches[randInt(0, branches.length - 1)];
      if (src && src.points.length > 0) {
        const tip = src.points[src.points.length - 1];
        pulses.push(new Pulse(tip.x, tip.y, config.pulseColor, rand(0.6, 1.0)));
      }
    }
  }

  // ── Background grid / scanlines ──
  function drawBackground() {
    ctx.fillStyle = config.bgColor;
    ctx.fillRect(0, 0, W, H);

    // subtle radial glow
    const grad = ctx.createRadialGradient(CX, CY, 20, CX, CY, 420);
    grad.addColorStop(0, PALETTE.bgGlow);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // grid
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = PALETTE.grid;
    ctx.lineWidth = 0.5;
    const step = 40;
    for (let x = 0; x <= W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();

    // scanlines
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#000';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
    ctx.restore();
  }

  // ── Main loop ──
  function update() {
    if (paused) return;

    frame++;

    // grow branches
    for (const b of branches) {
      if (b.alive) {
        b.grow();
        if (b.alive && b.length > b.maxLen * 0.3) {
          trySplit(b);
        }
      }
    }

    // detect synapses periodically
    if (frame % 6 === 0) {
      detectSynapses();
    }

    // update synapses
    for (const s of synapses) {
      s.update();
    }

    // spawn pulses
    spawnPulses();

    // update pulses
    for (const p of pulses) {
      p.update();
    }
    pulses = pulses.filter(p => p.alive);

    // limit pulses
    if (pulses.length > 120) {
      pulses.splice(0, pulses.length - 120);
    }
  }

  function draw() {
    drawBackground();

    // draw branches
    for (const b of branches) {
      b.draw();
    }

    // draw synapses
    for (const s of synapses) {
      s.draw();
    }

    // draw pulses
    for (const p of pulses) {
      p.draw();
    }

    // draw neuron seed points
    ctx.save();
    ctx.shadowColor = config.branchColor;
    ctx.shadowBlur = 15;
    ctx.fillStyle = config.branchColor;
    for (const n of neurons) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 25;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.arc(n.x, n.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // vignette
    const vig = ctx.createRadialGradient(CX, CY, 200, CX, CY, 500);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(5,7,15,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ── GUI ──
  const gui = new dat.GUI({ autoPlace: false });
  gui.domElement.style.marginTop = '8px';
  document.getElementById('gui-wrapper').appendChild(gui.domElement);

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(config, 'neuronCount', 1, 8, 1).name('neuron count').onChange(() => { if (!paused) generateNetwork(); });
  fGrowth.add(config, 'growthSpeed', 0.2, 3.0, 0.1).name('branch growth speed');
  fGrowth.add(config, 'maxDepth', 1, 9, 1).name('max branch depth');
  fGrowth.add(config, 'splitChance', 0.02, 0.5, 0.01).name('branch split chance');
  fGrowth.add(config, 'curvature', 0.05, 1.0, 0.05).name('branch curvature');
  fGrowth.add(config, 'maxLength', 40, 260, 5).name('max branch length');

  const fSyn = gui.addFolder('Synapses');
  fSyn.add(config, 'synapseDist', 10, 80, 1).name('synapse distance threshold');
  fSyn.add(config, 'synapseGlow', 0.0, 2.0, 0.1).name('synapse glow strength');

  const fPulse = gui.addFolder('Pulses');
  fPulse.add(config, 'pulseSpeed', 0.2, 3.0, 0.1).name('pulse speed');
  fPulse.add(config, 'pulseFreq', 0.002, 0.05, 0.001).name('pulse frequency');
  fPulse.add(config, 'pulseBrightness', 0.0, 2.0, 0.1).name('pulse brightness');

  const fVis = gui.addFolder('Visuals');
  fVis.addColor(config, 'bgColor').name('background color');
  fVis.addColor(config, 'branchColor').name('branch color');
  fVis.addColor(config, 'accentColor').name('accent branch color');
  fVis.addColor(config, 'synapseColor').name('synapse color');
  fVis.addColor(config, 'pulseColor').name('pulse color');

  gui.add({ action: () => { generateNetwork(); } }, 'action').name('regenerate network');
  gui.add({ action: () => { branches = []; synapses = []; pulses = []; } }, 'action').name('clear canvas');
  gui.add({ action: () => { paused = !paused; } }, 'action').name(paused ? 'resume animation' : 'pause animation');

  // ── Init ──
  generateNetwork();
  loop();
})();
</script>
</body>
</html>
