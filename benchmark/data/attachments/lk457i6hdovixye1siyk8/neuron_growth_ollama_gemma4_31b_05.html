<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px #101a3a;
            border: 2px solid #ffd400;
        }
        canvas {
            display: block;
            background-color: #05070f;
        }
        /* Scanline effect overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 800px;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.1) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.03), 
                rgba(0, 255, 0, 0.01), 
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 3px 100%;
            z-index: 1;
        }
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 800px;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(5, 7, 15, 0.8) 100%);
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="800"></canvas>
        <div id="overlay"></div>
        <div id="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const params = {
            // Growth
            neuronCount: 5,
            growthSpeed: 1.5,
            maxDepth: 6,
            splitChance: 0.3,
            curvature: 0.5,
            maxLength: 60,
            // Synapses
            synapseThreshold: 30,
            synapseGlow: 15,
            // Pulses
            pulseSpeed: 0.02,
            pulseFrequency: 0.01,
            pulseBrightness: 1.0,
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            // Actions
            regenerate: () => init(),
            clear: () => clearCanvas(),
            paused: false,
            togglePause: () => { params.paused = !params.paused; }
        };

        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let frameCount = 0;

        class Branch {
            constructor(parent, startX, startY, angle, depth) {
                this.parent = parent;
                this.startX = startX;
                this.startY = startY;
                this.angle = angle;
                this.depth = depth;
                this.length = 0;
                this.maxLength = Math.random() * params.maxLength + 20;
                this.targetX = startX + Math.cos(angle) * this.maxLength;
                this.targetY = startY + Math.sin(angle) * this.maxLength;
                this.currentX = startX;
                this.currentY = startY;
                this.finished = false;
                this.thickness = Math.max(0.5, (params.maxDepth - depth) * 0.8);
                this.color = Math.random() > 0.8 ? params.accentColor : params.branchColor;
                
                // For quadratic curve
                this.cpX = startX + Math.cos(angle + (Math.random() - 0.5) * params.curvature) * (this.maxLength / 2);
                this.cpY = startY + Math.sin(angle + (Math.random() - 0.5) * params.curvature) * (this.maxLength / 2);
            }

            update() {
                if (this.finished) return;

                this.length += params.growthSpeed;
                let t = this.length / this.maxLength;

                if (t >= 1) {
                    t = 1;
                    this.finished = true;
                    this.checkSplit();
                    this.checkSynapse();
                }

                // Quadratic Bezier interpolation
                this.currentX = (1 - t) * (1 - t) * this.startX + 2 * (1 - t) * t * this.cpX + t * t * this.targetX;
                this.currentY = (1 - t) * (1 - t) * this.startY + 2 * (1 - t) * t * this.cpY + t * t * this.targetY;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.quadraticCurveTo(this.cpX, this.cpY, this.currentX, this.currentY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            checkSplit() {
                if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                    const splitCount = Math.random() > 0.8 ? 3 : 2;
                    for (let i = 0; i < splitCount; i++) {
                        const newAngle = this.angle + (Math.random() - 0.5) * 1.5;
                        branches.push(new Branch(this, this.currentX, this.currentY, newAngle, this.depth + 1));
                    }
                }
            }

            checkSynapse() {
                branches.forEach(other => {
                    if (other === this || other.parent === this || this.parent === other) return;
                    if (!other.finished) return;

                    const dist = Math.hypot(this.currentX - other.currentX, this.currentY - other.currentY);
                    if (dist < params.synapseThreshold) {
                        // Avoid duplicates
                        const exists = synapses.some(s => (s.a === this && s.b === other) || (s.a === other && s.b === this));
                        if (!exists) {
                            synapses.push({ a: this, b: other, life: 0 });
                        }
                    }
                });
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) return false;
                return true;
            }

            draw() {
                const a = this.synapse.a;
                const b = this.synapse.b;
                
                // Interpolate position along the synapse line
                const x = a.currentX + (b.currentX - a.currentX) * this.progress;
                const y = a.currentY + (b.currentY - a.currentY) * this.progress;

                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.shadowBlur = 10 * params.pulseBrightness;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            
            for (let i = 0; i < params.neuronCount; i++) {
                const x = 400 + (Math.random() - 0.5) * 200;
                const y = 400 + (Math.random() - 0.5) * 200;
                neurons.push({ x, y });
                
                // Initial branches for each seed
                const branchCount = 3 + Math.floor(Math.random() * 3);
                for (let j = 0; j < branchCount; j++) {
                    branches.push(new Branch(null, x, y, (Math.PI * 2 / branchCount) * j, 0));
                }
            }
        }

        function clearCanvas() {
            branches = [];
            synapses = [];
            pulses = [];
        }

        function setupGUI() {
            const gui = new dat.GUI();
            
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(params, 'neuronCount', 1, 15, 1).onChange(init);
            growthFolder.add(params, 'growthSpeed', 0.1, 5.0);
            growthFolder.add(params, 'maxDepth', 1, 10, 1);
            growthFolder.add(params, 'splitChance', 0, 1);
            growthFolder.add(params, 'curvature', 0, 2);
            growthFolder.add(params, 'maxLength', 10, 150);
            growthFolder.open();

            const synapseFolder = gui.addFolder('Synapses');
            synapseFolder.add(params, 'synapseThreshold', 5, 100);
            synapseFolder.add(params, 'synapseGlow', 0, 30);
            synapseFolder.open();

            const pulseFolder = gui.addFolder('Pulses');
            pulseFolder.add(params, 'pulseSpeed', 0.001, 0.1);
            pulseFolder.add(params, 'pulseFrequency', 0, 0.1);
            pulseFolder.add(params, 'pulseBrightness', 0, 2);
            pulseFolder.open();

            const visualFolder = gui.addFolder('Visuals');
            visualFolder.addColor(params, 'bgColor');
            visualFolder.addColor(params, 'branchColor');
            visualFolder.addColor(params, 'accentColor');
            visualFolder.addColor(params, 'synapseColor');
            visualFolder.addColor(params, 'pulseColor');
            visualFolder.open();

            gui.add(params, 'regenerate').name('Regenerate Network');
            gui.add(params, 'clear').name('Clear Canvas');
            gui.add(params, 'togglePause').name('Pause/Resume');
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < 800; i += 40) {
                ctx.moveTo(i, 0); ctx.lineTo(i, 800);
                ctx.moveTo(0, i); ctx.lineTo(800, i);
            }
            ctx.stroke();
        }

        function loop() {
            if (!params.paused) {
                frameCount++;
                
                // Background
                ctx.fillStyle = params.bgColor;
                ctx.fillRect(0, 0, 800, 800);
                drawGrid();

                // Update and Draw Branches
                branches.forEach(b => {
                    b.update();
                    b.draw();
                });

                // Update and Draw Synapses
                synapses.forEach(s => {
                    s.life += 0.05;
                    const glow = Math.sin(s.life) * 5 + params.synapseGlow;
                    
                    ctx.beginPath();
                    ctx.moveTo(s.a.currentX, s.a.currentY);
                    ctx.lineTo(s.b.currentX, s.b.currentY);
                    ctx.strokeStyle = params.synapseColor;
                    ctx.lineWidth = 1;
                    ctx.shadowBlur = glow;
                    ctx.shadowColor = params.synapseColor;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                });

                // Handle Pulses
                if (Math.random() < params.pulseFrequency && synapses.length > 0) {
                    const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                    pulses.push(new Pulse(randomSynapse));
                }

                pulses = pulses.filter(p => {
                    const active = p.update();
                    if (active) p.draw();
                    return active;
                });
            }

            requestAnimationFrame(loop);
        }

        init();
        setupGUI();
        loop();
    </script>
</body>
</html>
