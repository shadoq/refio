<!DOCTYPE html>
<html>
<head>
    <title>Neuron Growth Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #101a3a;
            box-shadow: 0 0 20px #00e5ff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isPaused = false;
        let branches = [];
        let synapses = [];
        let pulses = [];

        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 6,
            branchSplitChance: 0.2,
            branchCurvature: 0.3,
            maxBranchLength: 100,
            // Synapses
            synapseDistanceThreshold: 20,
            synapseGlowStrength: 2,
            // Pulses
            pulseSpeed: 2,
            pulseFrequency: 1,
            pulseBrightness: 1,
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a'
        };

        config.regenerate = () => {
            init();
        };

        config.clear = () => {
            branches = [];
            synapses = [];
            pulses = [];
        };

        config.pause = () => {
            isPaused = !isPaused;
        };

        function init() {
            branches = [];
            synapses = [];
            pulses = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const neuronCount = config.neuronCount;
            for (let i = 0; i < neuronCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 50 + Math.random() * 50;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                branches.push({
                    start: [x, y],
                    end: [x, y],
                    length: 0,
                    maxLength: config.maxBranchLength,
                    angle: Math.random() * Math.PI * 2,
                    curvature: config.branchCurvature,
                    depth: 0,
                    parent: null
                });
            }
        }

        function growBranches() {
            for (let i = 0; i < branches.length; i++) {
                const branch = branches[i];
                if (branch.length >= branch.maxLength) continue;
                branch.length += config.branchGrowthSpeed;
                if (branch.length > branch.maxLength) {
                    branch.length = branch.maxLength;
                }
                const dx = Math.cos(branch.angle) * branch.length;
                const dy = Math.sin(branch.angle) * branch.length;
                branch.end = [
                    branch.start[0] + dx,
                    branch.start[1] + dy
                ];
                branch.angle += (Math.random() * 2 - 1) * branch.curvature;
                if (Math.random() < config.branchSplitChance && branch.depth < config.maxBranchDepth) {
                    const newAngle1 = branch.angle + Math.random() * 0.5 - 0.25;
                    const newAngle2 = branch.angle - Math.random() * 0.5 + 0.25;
                    branches.push({
                        start: branch.end,
                        end: branch.end,
                        length: 0,
                        maxLength: branch.maxLength,
                        angle: newAngle1,
                        curvature: branch.curvature,
                        depth: branch.depth + 1,
                        parent: branch
                    });
                    branches.push({
                        start: branch.end,
                        end: branch.end,
                        length: 0,
                        maxLength: branch.maxLength,
                        angle: newAngle2,
                        curvature: branch.curvature,
                        depth: branch.depth + 1,
                        parent: branch
                    });
                }
            }
        }

        function checkSynapses() {
            synapses = [];
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const branch1 = branches[i];
                    const branch2 = branches[j];
                    const x1 = branch1.end[0];
                    const y1 = branch1.end[1];
                    const x2 = branch2.end[0];
                    const y2 = branch2.end[1];
                    const distance = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                    if (distance < config.synapseDistanceThreshold) {
                        synapses.push({
                            start: [x1, y1],
                            end: [x2, y2],
                            length: distance
                        });
                    }
                }
            }
        }

        function updatePulses() {
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.position += config.pulseSpeed;
                if (pulse.position >= pulse.synapse.length) {
                    pulses.splice(i, 1);
                }
            }
            if (Math.random() < config.pulseFrequency * 0.1) {
                if (synapses.length > 0) {
                    const synapse = synapses[Math.floor(Math.random() * synapses.length)];
                    pulses.push({
                        synapse: synapse,
                        position: 0
                    });
                }
            }
        }

        function draw() {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = config.branchColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `${config.branchColor}80`;
            for (const branch of branches) {
                if (branch.depth === 0) {
                    ctx.strokeStyle = config.branchColor;
                } else {
                    ctx.strokeStyle = config.accentBranchColor;
                }
                ctx.beginPath();
                ctx.moveTo(branch.start[0], branch.start[1]);
                ctx.lineTo(branch.end[0], branch.end[1]);
                ctx.stroke();
            }
            
            ctx.strokeStyle = config.synapseColor;
            ctx.lineWidth = 1;
            ctx.shadowBlur = config.synapseGlowStrength * 10;
            ctx.shadowColor = `${config.synapseColor}80`;
            for (const synapse of synapses) {
                ctx.beginPath();
                ctx.moveTo(synapse.start[0], synapse.start[1]);
                ctx.lineTo(synapse.end[0], synapse.end[1]);
                ctx.stroke();
            }
            
            ctx.fillStyle = config.pulseColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = `${config.pulseColor}80`;
            for (const pulse of pulses) {
                const synapse = pulse.synapse;
                const ratio = pulse.position / synapse.length;
                const x = synapse.start[0] + (synapse.end[0] - synapse.start[0]) * ratio;
                const y = synapse.start[1] + (synapse.end[1] - synapse.start[1]) * ratio;
                const pulseSize = 3 * config.pulseBrightness;
                ctx.beginPath();
                ctx.arc(x, y, pulseSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            if (!isPaused) {
                growBranches();
                checkSynapses();
                updatePulses();
            }
            draw();
            requestAnimationFrame(animate);
        }

        const gui = new dat.GUI();
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
        growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5, 0.1).name('Growth Speed');
        growthFolder.add(config, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
        growthFolder.add(config, 'branchSplitChance', 0.0, 0.5, 0.01).name('Split Chance');
        growthFolder.add(config, 'branchCurvature', 0.0, 1.0, 0.01).name('Curvature');
        growthFolder.add(config, 'maxBranchLength', 50, 200, 5).name('Max Length');

        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 50, 1).name('Distance Threshold');
        synapsesFolder.add(config, 'synapseGlowStrength', 0.5, 5, 0.1).name('Glow Strength');

        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(config, 'pulseSpeed', 0.5, 5, 0.1).name('Speed');
        pulsesFolder.add(config, 'pulseFrequency', 0.1, 2, 0.1).name('Frequency');
        pulsesFolder.add(config, 'pulseBrightness', 0.5, 2, 0.1).name('Brightness');

        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'backgroundColor').name('Background Color');
        visualsFolder.addColor(config, 'branchColor').name('Branch Color');
        visualsFolder.addColor(config, 'accentBranchColor').name('Accent Branch Color');
        visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
        visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');

        gui.add(config, 'regenerate').name('Regenerate Network');
        gui.add(config, 'clear').name('Clear Canvas');
        gui.add(config, 'pause').name('Pause/Resume');

        init();
        animate();
    </script>
</body>
</html>
