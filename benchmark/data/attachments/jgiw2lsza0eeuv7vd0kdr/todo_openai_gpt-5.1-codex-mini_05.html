<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo App</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-light: #334155;
    --text: #e2e8f0;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --danger: #f87171;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .todo-app {
    width: min(600px, 100%);
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(2, 6, 23, 0.5);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  header {
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 2.5rem);
    letter-spacing: 0.2rem;
  }

  .input-group {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .input-group input {
    flex: 1;
    padding: 0.9rem 1rem;
    border-radius: 999px;
    border: 1px solid #475569;
    background: var(--card-light);
    color: var(--text);
    font-size: 1rem;
  }

  .input-group button {
    border: none;
    background: var(--accent);
    color: #021124;
    padding: 0 1.5rem;
    border-radius: 999px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .input-group button:hover {
    background: var(--accent-dark);
  }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-radius: 999px;
    background: var(--card-light);
    border: 1px solid transparent;
    transition: border 0.2s ease;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .todo-item:hover {
    border-color: rgba(255, 255, 255, 0.2);
  }

  .todo-text {
    flex: 1;
    margin: 0;
    padding: 0 1rem;
    font-size: 1rem;
    word-break: break-word;
  }

  .todo-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .todo-actions button {
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 0.2rem;
    font-size: 1.2rem;
    border-radius: 50%;
    transition: background 0.2s ease;
  }

  .todo-actions button:hover {
    background: rgba(148, 163, 184, 0.3);
  }

  .filters {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .filters button {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border 0.2s ease;
  }

  .filters button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #021124;
  }

  footer {
    text-align: center;
    font-size: 0.9rem;
    color: #94a3b8;
  }

  @media (max-width: 480px) {
    .todo-app {
      padding: 1.5rem;
    }

    .input-group button {
      width: 100%;
    }

    .input-group {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <main class="todo-app">
    <header>
      <h1>Todo</h1>
    </header>
    <section class="input-group">
      <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off" />
      <button id="addTodoBtn">Add</button>
    </section>
    <section class="filters" aria-label="Todo Filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </section>
    <ul class="todo-list" id="todoList"></ul>
    <footer>
      Todos persist locally — build small, ship often.
    </footer>
  </main>
  <script>
    const todoInput = document.getElementById("todoInput");
    const addTodoBtn = document.getElementById("addTodoBtn");
    const todoList = document.getElementById("todoList");
    const filterButtons = document.querySelectorAll(".filters button");

    const STORAGE_KEY = "todo_openai_app_items";
    let todos = [];
    let currentFilter = "all";

    const saveTodos = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    };

    const loadTodos = () => {
      const storedTodos = localStorage.getItem(STORAGE_KEY);
      if (storedTodos) {
        try {
          todos = JSON.parse(storedTodos);
        } catch (err) {
          todos = [];
        }
      }
    };

    const renderTodos = () => {
      todoList.innerHTML = "";
      const filteredTodos = todos.filter((todo) => {
        if (currentFilter === "active") return !todo.completed;
        if (currentFilter === "completed") return todo.completed;
        return true;
      });

      if (!filteredTodos.length) {
        const placeholder = document.createElement("li");
        placeholder.textContent = "No todos here.";
        placeholder.style.textAlign = "center";
        placeholder.style.opacity = "0.6";
        placeholder.style.padding = "1rem";
        todoList.appendChild(placeholder);
        return;
      }

      filteredTodos.forEach((todo) => {
        const listItem = document.createElement("li");
        listItem.className = "todo-item";
        if (todo.completed) {
          listItem.classList.add("completed");
        }

        const checkboxButton = document.createElement("button");
        checkboxButton.setAttribute("aria-label", "Toggle completion");
        checkboxButton.innerHTML = todo.completed ? "✅" : "⭕";
        checkboxButton.addEventListener("click", () => {
          todo.completed = !todo.completed;
          saveTodos();
          renderTodos();
        });

        const text = document.createElement("p");
        text.className = "todo-text";
        text.textContent = todo.text;

        const actions = document.createElement("div");
        actions.className = "todo-actions";

        const deleteBtn = document.createElement("button");
        deleteBtn.setAttribute("aria-label", "Delete todo");
        deleteBtn.innerHTML = "🗑️";
        deleteBtn.style.color = "var(--danger)";
        deleteBtn.addEventListener("click", () => {
          todos = todos.filter((item) => item.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        actions.appendChild(deleteBtn);
        listItem.appendChild(checkboxButton);
        listItem.appendChild(text);
        listItem.appendChild(actions);
        todoList.appendChild(listItem);
      });
    };

    const createTodo = (text) => ({
      id: crypto.randomUUID(),
      text: text.trim(),
      completed: false,
    });

    const addTodo = () => {
      const text = todoInput.value;
      if (!text.trim()) return;
      todos.push(createTodo(text));
      todoInput.value = "";
      saveTodos();
      renderTodos();
    };

    addTodoBtn.addEventListener("click", addTodo);
    todoInput.addEventListener("keypress", (event) => {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        filterButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        currentFilter = button.dataset.filter;
        renderTodos();
      });
    });

    loadTodos();
    renderTodos();
  </script>
</body>
</html>
