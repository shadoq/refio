<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            box-shadow: 0 0 50px #101a3a;
            background-color: #05070f;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
/**
 * NEURAL NETWORK GROWTH SIMULATION
 * A self-contained generative art piece.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// --- Configuration & State ---
const config = {
    // Growth
    neuronCount: 5,
    growthSpeed: 1.5,
    maxDepth: 5,
    splitChance: 0.15,
    curvature: 0.4,
    maxBranchLength: 60,
    
    // Synapses
    synapseThreshold: 35,
    synapseGlow: 10,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,
    
    // Visuals
    bgColor: '#05070f',
    bgGlow: '#101a3a',
    mainColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    gridColor: 'rgba(0, 229, 255, 0.08)',
    
    // Controls
    regenerate: () => simulation.init(),
    clear: () => simulation.clear(),
    pause: function() { this.paused = !this.paused; }
};
config.paused = false;

class Branch {
    constructor(x, y, angle, depth, thickness, parent = null) {
        this.startX = x;
        this.startY = y;
        this.endX = x;
        this.endY = y;
        this.angle = angle;
        this.depth = depth;
        this.thickness = thickness;
        this.parent = parent;
        this.progress = 0;
        this.isFinished = false;
        this.controlX = x;
        this.controlY = y;
        this.children = [];
    }

    update(speed) {
        if (this.isFinished) return;

        this.progress += speed;
        const stepLength = speed;
        
        const nextX = this.endX + Math.cos(this.angle) * stepLength;
        const nextY = this.endY + Math.sin(this.angle) * stepLength;

        // Smoothly update control point for quadratic curve
        this.controlX = (this.startX + nextX) / 2;
        this.controlY = (this.startY + nextY) / 2;

        this.endX = nextX;
        this.endY = nextY;

        // Check if branch reached max length for this segment
        if (this.progress >= 1) {
            this.isFinished = true;
            this.growChildren();
        }
    }

    growChildren() {
        if (this.depth >= config.maxDepth) return;

        // Chance to split
        if (Math.random() < config.splitChance) {
            const numSplits = Math.random() > 0.8 ? 2 : 1;
            for (let i = 0; i < numSplits; i++) {
                const newAngle = this.angle + (Math.random() - 0.5) * config.curvature * 2;
                const newThickness = this.thickness * 0.8;
                const child = new Branch(this.endX, this.endY, newAngle, this.depth + 1, newThickness, this);
                this.children.push(child);
                simulation.allBranches.push(child);
            }
        }
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = this.thickness;
        ctx.lineCap = 'round';
        ctx.strokeStyle = this.depth % 2 === 0 ? config.mainColor : config.accentColor;
        ctx.moveTo(this.startX, this.startY);
        ctx.quadraticCurveTo(this.controlX, this.controlY, this.endX, this.endY);
        ctx.stroke();
    }
}

class Synapse {
    constructor(branchA, branchB) {
        this.branchA = branchA;
        this.branchB = branchB;
        this.progress = 0;
        this.active = false;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = 1;
        ctx.strokeStyle = config.synapseColor;
        ctx.shadowBlur = config.synapseGlow;
        ctx.shadowColor = config.synapseColor;
        ctx.moveTo(this.branchA.endX, this.branchA.endY);
        ctx.lineTo(this.branchB.endX, this.branchB.endY);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
        this.speed = config.pulseSpeed;
    }

    update() {
        this.progress += this.speed;
        if (this.progress >= 1) return true; // Finished
        return false;
    }

    draw(ctx) {
        const x = this.synapse.branchA.endX + (this.synapse.branchB.endX - this.synapse.branchA.endX) * this.progress;
        const y = this.synapse.branchA.endY + (this.synapse.branchB.endY - this.synapse.branchA.endY) * this.progress;

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = config.pulseColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = config.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Simulation {
    constructor() {
        this.allBranches = [];
        this.neurons = [];
        this.synapses = [];
        this.pulses = [];
        this.init();
    }

    init() {
        this.clear();
        const count = Math.floor(Math.random() * 4) + 3; // 3-6
        for (let i = 0;
            i < count;
            i++) {
            const x = canvas.width / 2 + (Math.random() - 0.5) * 100;
            const y = canvas.height / 2 + (Math.random() - 0.5) * 100;
            const angle = Math.random() * Math.PI * 2;
            const root = new Branch(x, y, angle, 0, 4);
            this.neurons.push(root);
            this.allBranches.push(root);
        }
    }

    clear() {
        this.allBranches = [];
        this.neurons = [];
        this.synapses = [];
        this.pulses = [];
    }

    update() {
        if (config.paused) return;

        // Update branches
        this.allBranches.forEach(b => b.update(config.growthSpeed));

        // Check for new synapses
        for (let i = 0; i < this.allBranches.length; i++) {
            for (let j = i + 1; j < this.allBranches.length; j++) {
                const b1 = this.allBranches[i];
                const b2 = this.allBranches[j];
                
                if (b1.isFinished && b2.isFinished) {
                    const dist = Math.hypot(b1.endX - b2.endX, b1.endY - b2.endY);
                    if (dist < config.synapseThreshold) {
                        // Check if synapse already exists
                        const exists = this.synapses.some(s => 
                            (s.branchA === b1 && s.branchB === b2) || (s.branchA === b2 && s.branchB === b1)
                        );
                        if (!exists) {
                            const syn = new Synapse(b1, b2);
                            this.synapses.push(syn);
                            if (Math.random() < 0.5) {
                                this.pulses.push(new Pulse(syn));
                            }
                        }
                    }
                }
            }
        }

        // Update pulses
        this.pulses = this.pulses.filter(p => !p.update());

        // Randomly trigger pulses
        if (Math.random() < config.pulseFrequency && this.synapses.length > 0) {
            const syn = this.synapses[Math.floor(Math.random() * this.synapses.length)];
            this.pulses.push(new Pulse(syn));
        }
        
        // Pulse brightness oscillation
        config.pulseBrightness = 0.8 + Math.sin(Date.now() * 0.005) * 0.2;
    }

    draw() {
        // Background
        ctx.fillStyle = config.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Background Glow
        const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
        grad.addColorStop(0, config.bgGlow);
        grad.addColorStop(1, config.bgColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid/Scanlines
        ctx.strokeStyle = config.gridColor;
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Draw Branches
        this.allBranches.forEach(b => b.draw(ctx));

        // Draw Synapses
        this.synapses.forEach(s => s.draw(ctx));

        // Draw Pulses
        ctx.globalAlpha = config.pulseBrightness;
        this.pulses.forEach(p => p.draw(ctx));
        ctx.globalAlpha = 1.0;

        // Vignette
        const vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width/4, canvas.width/2, canvas.height/2, canvas.width/1.2);
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

const simulation = new Simulation();

// --- GUI Setup ---
const gui = new dat.GUI();
const fGrowth = gui.addFolder('Growth');
fGrowth.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
fGrowth.add(config, 'growthSpeed', 0.5, 5).name('Growth Speed');
fGrowth.add(config, 'maxDepth', 1, 10, 1).name('Max Depth');
fGrowth.add(config, 'splitChance', 0, 0.5).name('Split Chance');
fGrowth.add(config, 'curvature', 0, 2).name('Curvature');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(config, 'synapseThreshold', 10, 100).name('Threshold');
fSyn.add(config, 'synapseGlow', 0, 20).name('Glow Strength');
fSyn.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(config, 'pulseSpeed', 0.001, 0.05).name('Speed');
fPulse.add(config, 'pulseFrequency', 0, 0.05).name('Frequency');
fPulse.add(config, 'pulseBrightness', 0.1, 1.5).name('Brightness');
fPulse.open();

const fVis = gui.addFolder('Visuals');
fVis.addColor(config, 'bgColor').name('Background');
fVis.addColor(config, 'mainColor').name('Branch Color');
fVis.addColor(config, 'accentColor').name('Accent Color');
fVis.addColor(config, 'synapseColor').name('Synapse Color');
fVis.addColor(config, 'pulseColor').name('Pulse Color');
fVis.open();

const fActions = gui.addFolder('Actions');
fActions.add(config, 'regenerate').name('Regenerate');
fActions.add(config, 'clear').name('Clear Canvas');
fActions.add(config, 'pause').name('Pause/Resume');
fActions.open();

// --- Main Loop ---
function loop() {
    simulation.update();
    simulation.draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
