<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Growth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05070f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
}
.dg.ac { z-index: 100 !important; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = W / 2, CY = H / 2;

const params = {
  neuronCount: 5,
  growthSpeed: 2.5,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.4,
  maxBranchLength: 120,
  synapseThreshold: 30,
  synapseGlow: 15,
  pulseSpeed: 3,
  pulseFrequency: 0.015,
  pulseBrightness: 1.0,
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  regenerate: function() { initNetwork(); },
  clearCanvas: function() { neurons = []; branches = []; synapses = []; pulses = []; growingBranches = []; },
  pauseResume: function() { paused = !paused; }
};

const gui = new dat.GUI({ width: 280 });
const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
fGrowth.add(params, 'growthSpeed', 0.5, 8, 0.1).name('Growth Speed');
fGrowth.add(params, 'maxDepth', 2, 10, 1).name('Max Branch Depth');
fGrowth.add(params, 'splitChance', 0, 0.8, 0.01).name('Split Chance');
fGrowth.add(params, 'curvature', 0, 1, 0.01).name('Branch Curvature');
fGrowth.add(params, 'maxBranchLength', 30, 250, 1).name('Max Branch Length');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(params, 'synapseThreshold', 10, 80, 1).name('Distance Threshold');
fSyn.add(params, 'synapseGlow', 0, 40, 1).name('Glow Strength');
fSyn.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.5, 10, 0.1).name('Pulse Speed');
fPulse.add(params, 'pulseFrequency', 0.002, 0.05, 0.001).name('Pulse Frequency');
fPulse.add(params, 'pulseBrightness', 0.2, 2, 0.1).name('Pulse Brightness');
fPulse.open();

const fVis = gui.addFolder('Visuals');
fVis.addColor(params, 'bgColor').name('Background');
fVis.addColor(params, 'branchColor').name('Branch Color');
fVis.addColor(params, 'accentColor').name('Accent Branch');
fVis.addColor(params, 'synapseColor').name('Synapse Color');
fVis.addColor(params, 'pulseColor').name('Pulse Color');
fVis.open();

gui.add(params, 'regenerate').name('Regenerate Network');
gui.add(params, 'clearCanvas').name('Clear Canvas');
gui.add(params, 'pauseResume').name('Pause / Resume');

let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let growingBranches = [];
let paused = false;
let frameCount = 0;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function createNeuron(x, y) {
  return {
    x: x,
    y: y,
    radius: 4 + Math.random() * 3,
    pulsePhase: Math.random() * Math.PI * 2
  };
}

function createBranch(startX, startY, angle, depth, parentNeuron) {
  const length = (params.maxBranchLength * (0.5 + Math.random() * 0.5)) * Math.pow(0.75, depth);
  const thickness = Math.max(0.5, 3.5 - depth * 0.5 + (Math.random() - 0.5) * 0.6);
  const curveOffset = (Math.random() - 0.5) * params.curvature * length * 0.5;
  const endX = startX + Math.cos(angle) * length;
  const endY = startY + Math.sin(angle) * length;
  const cpX = (startX + endX) / 2 + Math.cos(angle + Math.PI / 2) * curveOffset;
  const cpY = (startY + endY) / 2 + Math.sin(angle + Math.PI / 2) * curveOffset;
  const isAccent = Math.random() < 0.2;

  const branch = {
    sx: startX, sy: startY,
    ex: endX, ey: endY,
    cpx: cpX, cpy: cpY,
    depth: depth,
    thickness: thickness,
    progress: 0,
    growing: true,
    parentNeuron: parentNeuron,
    isAccent: isAccent,
    hasSpawned: false,
    tipX: startX,
    tipY: startY
  };

  return branch;
}

function getPointOnQuadBezier(sx, sy, cpx, cpy, ex, ey, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * sx + 2 * mt * t * cpx + t * t * ex,
    y: mt * mt * sy + 2 * mt * t * cpy + t * t * ey
  };
}

function initNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  growingBranches = [];
  frameCount = 0;

  const count = params.neuronCount;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5;
    const dist = 40 + Math.random() * 80;
    const nx = CX + Math.cos(angle) * dist;
    const ny = CY + Math.sin(angle) * dist;
    const neuron = createNeuron(nx, ny);
    neurons.push(neuron);

    const numInitial = 2 + Math.floor(Math.random() * 3);
    for (let j = 0; j < numInitial; j++) {
      const bAngle = (Math.PI * 2 / numInitial) * j + (Math.random() - 0.5) * 0.6;
      const branch = createBranch(nx, ny, bAngle, 0, neuron);
      branches.push(branch);
      growingBranches.push(branch);
    }
  }
}

function spawnChildren(branch) {
  if (branch.depth >= params.maxDepth) return;
  if (branches.length > 600) return;

  if (Math.random() < params.splitChance) {
    const baseAngle = Math.atan2(branch.ey - branch.sy, branch.ex - branch.sx);
    const spread = 0.3 + Math.random() * 0.5;
    const child1 = createBranch(branch.ex, branch.ey, baseAngle - spread + (Math.random() - 0.5) * 0.2, branch.depth + 1, branch.parentNeuron);
    const child2 = createBranch(branch.ex, branch.ey, baseAngle + spread + (Math.random() - 0.5) * 0.2, branch.depth + 1, branch.parentNeuron);
    branches.push(child1, child2);
    growingBranches.push(child1, child2);
  } else {
    const baseAngle = Math.atan2(branch.ey - branch.sy, branch.ex - branch.sx);
    const drift = (Math.random() - 0.5) * 0.6;
    const child = createBranch(branch.ex, branch.ey, baseAngle + drift, branch.depth + 1, branch.parentNeuron);
    branches.push(child);
    growingBranches.push(child);
  }

  if (Math.random() < 0.15 && branch.depth < 2) {
    const baseAngle = Math.atan2(branch.ey - branch.sy, branch.ex - branch.sx);
    const sideAngle = baseAngle + (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 3 + Math.random() * Math.PI / 4);
    const sideBranch = createBranch(branch.ex, branch.ey, sideAngle, branch.depth + 2, branch.parentNeuron);
    sideBranch.thickness *= 0.6;
    branches.push(sideBranch);
    growingBranches.push(sideBranch);
  }
}

function checkSynapses() {
  const tips = growingBranches.filter(b => !b.growing);
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      if (a.parentNeuron === b.parentNeuron) continue;
      const dx = a.tipX - b.tipX;
      const dy = a.tipY - b.tipY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < params.synapseThreshold) {
        const key1 = a.parentNeuron + '-' + b.parentNeuron;
        const key2 = b.parentNeuron + '-' + a.parentNeuron;
        const exists = synapses.some(s => s.key === key1 || s.key === key2);
        if (!exists) {
          const key = a.parentNeuron < b.parentNeuron ? key1 : key2;
          const nA = a.parentNeuron < b.parentNeuron ? a : b;
          const nB = a.parentNeuron < b.parentNeuron ? b : a;
          synapses.push({
            ax: nA.tipX, ay: nA.tipY,
            bx: nB.tipX, by: nB.tipY,
            neuronA: nA.parentNeuron,
            neuronB: nB.parentNeuron,
            key: key,
            phase: Math.random() * Math.PI * 2,
            age: 0
          });
        }
      }
    }
  }
}

function spawnPulses() {
  if (synapses.length === 0) return;
  if (Math.random() < params.pulseFrequency) {
    const syn = synapses[Math.floor(Math.random() * synapses.length)];
    const forward = Math.random() < 0.5;
    pulses.push({
      sx: forward ? syn.ax : syn.bx,
      sy: forward ? syn.ay : syn.by,
      ex: forward ? syn.bx : syn.ax,
      ey: forward ? syn.by : syn.ay,
      t: 0,
      speed: params.pulseSpeed * 0.008,
      brightness: params.pulseBrightness
    });
  }
}

function updateGrowth() {
  const speed = params.growthSpeed * 0.008;
  for (let i = growingBranches.length - 1; i >= 0; i--) {
    const b = growingBranches[i];
    if (!b.growing) {
      growingBranches.splice(i, 1);
      continue;
    }
    b.progress += speed;
    if (b.progress >= 1) {
      b.progress = 1;
      b.growing = false;
      b.tipX = b.ex;
      b.tipY = b.ey;
      if (!b.hasSpawned) {
        b.hasSpawned = true;
        spawnChildren(b);
      }
    } else {
      const pt = getPointOnQuadBezier(b.sx, b.sy, b.cpx, b.cpy, b.ex, b.ey, b.progress);
      b.tipX = pt.x;
      b.tipY = pt.y;
    }
  }
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed;
    if (p.t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

function drawBackground() {
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
  ctx.lineWidth = 0.5;
  const gridSize = 40;
  for (let x = 0; x <= W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  const glowRgb = hexToRgb('#101a3a');
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 350);
  grad.addColorStop(0, 'rgba(' + glowRgb.r + ',' + glowRgb.g + ',' + glowRgb.b + ',0.35)');
  grad.addColorStop(1, 'rgba(' + glowRgb.r + ',' + glowRgb.g + ',' + glowRgb.b + ',0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
  ctx.restore();
}

function drawBranches() {
  const mainRgb = hexToRgb(params.branchColor);
  const accRgb = hexToRgb(params.accentColor);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const b of branches) {
    const rgb = b.isAccent ? accRgb : mainRgb;
    const alpha = Math.max(0.15, 1 - b.depth * 0.12);
    const color = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha + ')';

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 6 - b.depth * 0.5;
    ctx.strokeStyle = color;
    ctx.lineWidth = b.thickness;

    ctx.beginPath();
    if (b.growing) {
      const pt = getPointOnQuadBezier(b.sx, b.sy, b.cpx, b.cpy, b.ex, b.ey, b.progress);
      ctx.moveTo(b.sx, b.sy);
      ctx.quadraticCurveTo(
        b.sx + (b.cpx - b.sx) * b.progress,
        b.sy + (b.cpy - b.sy) * b.progress,
        pt.x, pt.y
      );
    } else {
      ctx.moveTo(b.sx, b.sy);
      ctx.quadraticCurveTo(b.cpx, b.cpy, b.ex, b.ey);
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawSynapses() {
  const synRgb = hexToRgb(params.synapseColor);
  const time = frameCount * 0.04;

  for (const s of synapses) {
    s.age += 0.016;
    const fadeIn = Math.min(1, s.age * 2);
    const pulse = 0.5 + 0.5 * Math.sin(time + s.phase);
    const alpha = (0.3 + pulse * 0.5) * fadeIn;
    const glow = params.synapseGlow * (0.5 + pulse * 0.5) * fadeIn;

    ctx.save();
    ctx.shadowColor = 'rgba(' + synRgb.r + ',' + synRgb.g + ',' + synRgb.b + ',' + alpha + ')';
    ctx.shadowBlur = glow;
    ctx.strokeStyle = 'rgba(' + synRgb.r + ',' + synRgb.g + ',' + synRgb.b + ',' + alpha * 0.6 + ')';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(s.ax, s.ay);
    ctx.lineTo(s.bx, s.by);
    ctx.stroke();
    ctx.setLineDash([]);

    const midX = (s.ax + s.bx) / 2;
    const midY = (s.ay + s.by) / 2;
    const dotAlpha = (0.4 + pulse * 0.6) * fadeIn;
    ctx.shadowBlur = glow * 1.5;
    ctx.fillStyle = 'rgba(' + synRgb.r + ',' + synRgb.g + ',' + synRgb.b + ',' + dotAlpha + ')';
    ctx.beginPath();
    ctx.arc(midX, midY, 2 + pulse * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPulses() {
  const pRgb = hexToRgb(params.pulseColor);

  for (const p of pulses) {
    const x = p.sx + (p.ex - p.sx) * p.t;
    const y = p.sy + (p.ey - p.sy) * p.t;
    const alpha = p.brightness * (1 - Math.abs(p.t - 0.5) * 0.6);
    const size = 3 + Math.sin(p.t * Math.PI) * 2;

    ctx.save();
    ctx.shadowColor = 'rgba(' + pRgb.r + ',' + pRgb.g + ',' + pRgb.b + ',' + alpha + ')';
    ctx.shadowBlur = 18 * alpha;
    ctx.fillStyle = 'rgba(' + pRgb.r + ',' + pRgb.g + ',' + pRgb.b + ',' + alpha + ')';
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.7) + ')';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(' + pRgb.r + ',' + pRgb.g + ',' + pRgb.b + ',' + (alpha * 0.15) + ')';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 4;
    ctx.shadowColor = 'rgba(' + pRgb.r + ',' + pRgb.g + ',' + pRgb.b + ',' + (alpha * 0.3) + ')';
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.restore();
  }
}

function drawNeurons() {
  const mainRgb = hexToRgb(params.branchColor);
  const accentRgb = hexToRgb('#ffd400');
  const time = frameCount * 0.04;

  for (const n of neurons) {
    const pulse = 0.7 + 0.3 * Math.sin(time + n.pulsePhase);
    const r = n.radius * (0.9 + pulse * 0.15);

    ctx.save();
    ctx.shadowColor = 'rgba(' + mainRgb.r + ',' + mainRgb.g + ',' + mainRgb.b + ',0.8)';
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = 'rgba(' + mainRgb.r + ',' + mainRgb.g + ',' + mainRgb.b + ',' + (0.6 + pulse * 0.3) + ')';
    ctx.beginPath();
    ctx.arc(n.x, n.y, r + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = 'rgba(' + accentRgb.r + ',' + accentRgb.g + ',' + accentRgb.b + ',0.6)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(' + accentRgb.r + ',' + accentRgb.g + ',' + accentRgb.b + ',' + (0.8 + pulse * 0.2) + ')';
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.7 + pulse * 0.3) + ')';
    ctx.beginPath();
    ctx.arc(n.x, n.y, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(' + mainRgb.r + ',' + mainRgb.g + ',' + mainRgb.b + ',' + (0.1 + pulse * 0.08) + ')';
    ctx.lineWidth = 0.5;
    const ringR = r + 6 + Math.sin(time * 1.5 + n.pulsePhase) * 3;
    ctx.beginPath();
    ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(CX, CY, W * 0.3, CX, CY, W * 0.72);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  requestAnimationFrame(animate);
  if (paused) return;

  frameCount++;

  updateGrowth();
  if (frameCount % 10 === 0) checkSynapses();
  spawnPulses();
  updatePulses();

  drawBackground();
  drawBranches();
  drawSynapses();
  drawPulses();
  drawNeurons();
  drawVignette();
}

initNetwork();
animate();
</script>
</body>
</html>
