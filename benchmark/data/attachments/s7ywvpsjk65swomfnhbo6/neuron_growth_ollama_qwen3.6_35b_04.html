<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        canvas {
            box-shadow: 0 0 50px rgba(16, 26, 58, 0.5);
        }

        /* dat.gui overrides for neon theme */
        .dg.ac {
            z-index: 10 !important;
        }
        .dg .cr.function .property-name {
            color: #ffd400 !important;
        }
        .dg .cr.function:hover .property-name {
            color: #fff !important;
        }
        .dg li.cr.function {
            border-top: 1px solid #101a3a !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // Palette
    const COLORS = {
        bg: '#05070f',
        bgGlow: '#101a3a',
        branch: '#00e5ff',
        accent: '#d6ff00',
        synapse: '#ff2bd6',
        pulse: '#fff36a',
        ui: '#ffd400',
        grid: 'rgba(0, 229, 255, 0.08)'
    };

    // Simulation Parameters
    const params = {
        // Growth
        neuronCount: 4,
        growthSpeed: 2,
        maxDepth: 6,
        splitChance: 0.05,
        curvature: 0.5,
        maxLength: 150,
        
        // Synapses
        synapseThreshold: 20,
        synapseGlow: 10,
        
        // Pulses
        pulseSpeed: 3,
        pulseFrequency: 0.02,
        pulseBrightness: 1.5,
        
        // Visuals
        bgColor: COLORS.bg,
        branchColor: COLORS.branch,
        accentColor: COLORS.accent,
        synapseColor: COLORS.synapse,
        pulseColor: COLORS.pulse,
        
        // Controls
        regenerate: () => initSimulation(),
        clear: () => {
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
            branches = [];
            synapses = [];
            pulses = [];
        },
        pause: () => { isPaused = !isPaused; }
    };

    let isPaused = false;
    let branches = [];
    let synapses = [];
    let pulses = [];
    let noiseOffset = 0;

    // --- Classes ---

    class Branch {
        constructor(x, y, angle, depth, parent = null) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.depth = depth;
            this.parent = parent;
            this.children = [];
            this.length = 0;
            this.maxLen = params.maxLength * (1 - (depth / params.maxDepth) * 0.5);
            this.thickness = Math.max(0.5, (params.maxDepth - depth) * 1.2);
            this.done = false;
            this.color = depth % 2 === 0 ? params.branchColor : params.accentColor;
            
            // For organic movement
            this.wobble = Math.random() * Math.PI * 2;
            this.wobbleSpeed = 0.02 + Math.random() * 0.03;
        }

        update() {
            if (this.done) return;

            // Grow
            this.length += params.growthSpeed;
            
            // Calculate new tip position based on angle + wobble
            const currentAngle = this.angle + Math.sin(this.wobble) * params.curvature;
            const nextX = this.x + Math.cos(currentAngle) * params.growthSpeed;
            const nextY = this.y + Math.sin(currentAngle) * params.growthSpeed;

            // Store segment for rendering
            this.segment = {
                x1: this.x,
                y1: this.y,
                x2: nextX,
                y2: nextY
            };

            this.x = nextX;
            this.y = nextY;
            this.wobble += this.wobbleSpeed;

            // Check bounds
            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                this.done = true;
                return;
            }

            // Check max length
            if (this.length >= this.maxLen) {
                this.done = true;
                return;
            }

            // Split logic
            if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                const splitAngle = (Math.random() - 0.5) * 1.5; // Random spread
                const child = new Branch(this.x, this.y, currentAngle + splitAngle, this.depth + 1, this);
                this.children.push(child);
                branches.push(child);
            }
        }

        draw(ctx) {
            if (!this.segment) return;
            
            ctx.beginPath();
            ctx.moveTo(this.segment.x1, this.segment.y1);
            ctx.lineTo(this.segment.x2, this.segment.y2);
            
            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.thickness;
            ctx.lineCap = 'round';
            
            // Glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            
            ctx.stroke();
            
            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }
    }

    class Synapse {
        constructor(branchA, branchB) {
            this.branchA = branchA;
            this.branchB = branchB;
            this.x1 = branchA.x;
            this.y1 = branchA.y;
            this.x2 = branchB.x;
            this.y2 = branchB.y;
            this.life = 0;
            this.maxLife = 100 + Math.random() * 100;
            this.active = true;
        }

        update() {
            this.life++;
            if (this.life > this.maxLife) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;
            
            const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.8;
            
            ctx.beginPath();
            ctx.moveTo(this.x1, this.y1);
            ctx.lineTo(this.x2, this.y2);
            
            ctx.strokeStyle = `rgba(255, 43, 214, ${alpha})`;
            ctx.lineWidth = 2;
            ctx.shadowBlur = params.synapseGlow;
            ctx.shadowColor = params.synapseColor;
            
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * 0.01;
            this.active = true;
        }

        update() {
            this.progress += this.speed;
            if (this.progress >= 1) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;

            const x = this.synapse.x1 + (this.synapse.x2 - this.synapse.x1) * this.progress;
            const y = this.synapse.y1 + (this.synapse.y2 - this.synapse.y1) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 3 * params.pulseBrightness, 0, Math.PI * 2);
            
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = params.pulseColor;
            
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // --- Simulation Logic ---

    function initSimulation() {
        branches = [];
        synapses = [];
        pulses = [];
        
        // Clear canvas
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Create seed neurons
        const centerX = width / 2;
        const centerY = height / 2;
        
        for (let i = 0; i < params.neuronCount; i++) {
            const angle = (Math.PI * 2 / params.neuronCount) * i + (Math.random() * 0.5);
            const dist = 50 + Math.random() * 100;
            const startX = centerX + Math.cos(angle) * dist;
            const startY = centerY + Math.sin(angle) * dist;
            
            const root = new Branch(startX, startY, Math.random() * Math.PI * 2, 0);
            branches.push(root);
        }
    }

    function checkSynapses() {
        // Only check tips (last branch in chain)
        const tips = branches.filter(b => b.done && b.children.length === 0);
        
        for (let i = 0; i < tips.length; i++) {
            for (let j = i + 1; j < tips.length; j++) {
                const b1 = tips[i];
                const b2 = tips[j];
                
                const dx = b1.x - b2.x;
                const dy = b1.y - b2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < params.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.branchA === b1 && s.branchB === b2) || 
                        (s.branchA === b2 && s.branchB === b1)
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(b1, b2));
                    }
                }
            }
        }
    }

    function spawnPulses() {
        if (Math.random() < params.pulseFrequency) {
            if (synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                if (randomSynapse.active) {
                    pulses.push(new Pulse(randomSynapse));
                }
            }
        }
    }

    function drawBackground() {
        // Base background
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Subtle grid/scanlines
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < width; x += 40) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
        }
        for (let y = 0; y < height; y += 40) {
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Vignette
        const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
    }

    function animate() {
        if (!isPaused) {
            // Update logic
            branches.forEach(b => b.update());
            synapses.forEach(s => s.update());
            pulses.forEach(p => p.update());
            
            // Cleanup inactive
            synapses = synapses.filter(s => s.active);
            pulses = pulses.filter(p => p.active);

            checkSynapses();
            spawnPulses();
        }

        // Draw
        drawBackground();

        // Draw branches
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        branches.forEach(b => b.draw(ctx));

        // Draw synapses
        synapses.forEach(s => s.draw(ctx));

        // Draw pulses
        pulses.forEach(p => p.draw(ctx));

        requestAnimationFrame(animate);
    }

    // --- Initialization ---

    // Setup dat.gui
    const gui = new dat.GUI();
    
    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
    fGrowth.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
    fGrowth.add(params, 'maxDepth', 3, 10, 1).name('Max Depth');
    fGrowth.add(params, 'splitChance', 0.01, 0.2, 0.01).name('Split Chance');
    fGrowth.add(params, 'curvature', 0, 2, 0.1).name('Curvature');
    fGrowth.add(params, 'maxLength', 50, 300, 10).name('Max Length');
    fGrowth.open();

    const fSynapses = gui.addFolder('Synapses');
    fSynapses.add(params, 'synapseThreshold', 10, 50, 1).name('Distance Threshold');
    fSynapses.add(params, 'synapseGlow', 0, 30, 1).name('Glow Strength');
    fSynapses.open();

    const fPulses = gui.addFolder('Pulses');
    fPulses.add(params, 'pulseSpeed', 1, 10, 0.1).name('Speed');
    fPulses.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Frequency');
    fPulses.add(params, 'pulseBrightness', 0.5, 3, 0.1).name('Brightness');
    fPulses.open();

    const fVisuals = gui.addFolder('Visuals');
    fVisuals.addColor(params, 'bgColor').name('Background Color');
    fVisuals.addColor(params, 'branchColor').name('Branch Color');
    fVisuals.addColor(params, 'accentColor').name('Accent Color');
    fVisuals.addColor(params, 'synapseColor').name('Synapse Color');
    fVisuals.addColor(params, 'pulseColor').name('Pulse Color');
    fVisuals.open();

    gui.add(params, 'regenerate').name('Regenerate Network');
    gui.add(params, 'clear').name('Clear Canvas');
    gui.add(params, 'pause').name('Pause/Resume');

    // Start
    initSimulation();
    animate();

</script>
</body>
</html>
