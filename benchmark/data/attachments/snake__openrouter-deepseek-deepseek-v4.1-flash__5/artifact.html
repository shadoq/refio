<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake — Classic &amp; CPU Modes</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111823;
    --grid: #1b2433;
    --snake1: #39ff88;
    --snake1-glow: rgba(57, 255, 136, 0.65);
    --snake2: #ff9f43;
    --snake2-glow: rgba(255, 159, 67, 0.65);
    --food: #ff3b5c;
    --food-glow: rgba(255, 59, 92, 0.75);
    --text: #d7e3f4;
    --accent: #4fc3f7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #101a28 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .score-box {
    flex: 1;
    background: var(--panel);
    border: 1px solid #223047;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 12px rgba(0,0,0,0.5) inset;
  }

  .score-box .label { font-weight: 700; }
  .score-box .value { font-variant-numeric: tabular-nums; font-weight: 700; }

  .p1 .label { color: var(--snake1); text-shadow: 0 0 8px var(--snake1-glow); }
  .p2 .label { color: var(--snake2); text-shadow: 0 0 8px var(--snake2-glow); }

  #mode-tag {
    text-align: center;
    font-size: 13px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.85;
  }

  /* ---------- Canvas ---------- */
  #board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #223047;
    box-shadow: 0 0 30px rgba(79, 195, 247, 0.15), 0 0 60px rgba(0,0,0,0.6);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #070a10;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 8, 13, 0.92);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    gap: 14px;
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 40px);
    letter-spacing: 3px;
    color: var(--snake1);
    text-shadow: 0 0 14px var(--snake1-glow);
  }

  .overlay h2 {
    margin: 0;
    font-size: clamp(18px, 4.5vw, 28px);
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(79,195,247,0.5);
  }

  .overlay p { margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.9; }

  .btn-row { display: flex; flex-direction: column; gap: 10px; width: min(320px, 90%); }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #2c3d59;
    background: linear-gradient(180deg, #16202f, #0e1622);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  button:hover {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(79,195,247,0.35);
    transform: translateY(-1px);
  }

  button:active { transform: translateY(0); }

  .controls-help {
    font-size: 13px;
    background: rgba(17, 24, 35, 0.8);
    border: 1px solid #223047;
    border-radius: 10px;
    padding: 10px 14px;
    max-width: 420px;
    text-align: left;
  }

  .controls-help b { color: var(--accent); }
  .kbd {
    display: inline-block;
    background: #1b2433;
    border: 1px solid #2c3d59;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 12px;
    font-family: monospace;
    color: #eaf2ff;
  }

  .final-scores { display: flex; gap: 24px; justify-content: center; }
  .final-scores div { font-size: 16px; }
  .final-scores .s1 { color: var(--snake1); }
  .final-scores .s2 { color: var(--snake2); }

  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0.25; } }

  #pause-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(79,195,247,0.7);
    pointer-events: none;
    display: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div class="score-box p1">
      <span class="label" id="p1-label">PLAYER 1</span>
      <span class="value" id="p1-score">0</span>
    </div>
    <div class="score-box p2">
      <span class="label" id="p2-label">PLAYER 2</span>
      <span class="value" id="p2-score">0</span>
    </div>
  </div>
  <div id="mode-tag">—</div>

  <!-- ===== BOARD ===== -->
  <div id="board-wrap">
    <canvas id="board" width="600" height="600"></canvas>
    <div id="pause-badge">PAUSED</div>

    <!-- Start menu -->
    <div class="overlay" id="menu">
      <h1>NEON SNAKE</h1>
      <p>Choose a game mode</p>
      <div class="btn-row">
        <button data-mode="hvh">Human vs Human</button>
        <button data-mode="cvh">CPU vs Human</button>
        <button data-mode="cvc">CPU vs CPU</button>
      </div>
      <div class="controls-help">
        <b>Controls</b><br>
        Player 1 (green): <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span><br>
        Player 2 (orange): <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span><br>
        Pause: <span class="kbd">P</span> &nbsp;•&nbsp; Restart: <span class="kbd">Space</span> / <span class="kbd">Enter</span><br>
        Back to menu: <span class="kbd">Esc</span>
      </div>
    </div>

    <!-- Game over -->
    <div class="overlay hidden" id="gameover">
      <h2 id="go-title">GAME OVER</h2>
      <div class="final-scores">
        <div class="s1"><span id="go-p1-label">PLAYER 1</span>: <span id="go-p1-score">0</span></div>
        <div class="s2"><span id="go-p2-label">PLAYER 2</span>: <span id="go-p2-score">0</span></div>
      </div>
      <p id="go-winner"></p>
      <p class="blink">Press <span class="kbd">SPACE</span> / <span class="kbd">ENTER</span> to restart</p>
      <p>Press <span class="kbd">ESC</span> to return to menu</p>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */
const GRID = 30;                 // 30 x 30 cells
const CELL = 20;                 // 20px per cell -> 600x600 canvas
const TICK_MS = 120;             // fixed movement interval
const START_LEN = 4;             // initial snake length

const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1  },
  left:  { x: -1, y: 0  },
  right: { x: 1,  y: 0  }
};

const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

/* =========================================================
   DOM REFERENCES
   ========================================================= */
const canvas      = document.getElementById("board");
const ctx         = canvas.getContext("2d");
const menuEl      = document.getElementById("menu");
const gameoverEl  = document.getElementById("gameover");
const pauseBadge  = document.getElementById("pause-badge");
const modeTag     = document.getElementById("mode-tag");

const p1LabelEl   = document.getElementById("p1-label");
const p2LabelEl   = document.getElementById("p2-label");
const p1ScoreEl   = document.getElementById("p1-score");
const p2ScoreEl   = document.getElementById("p2-score");

const goTitleEl   = document.getElementById("go-title");
const goP1Label   = document.getElementById("go-p1-label");
const goP2Label   = document.getElementById("go-p2-label");
const goP1Score   = document.getElementById("go-p1-score");
const goP2Score   = document.getElementById("go-p2-score");
const goWinnerEl  = document.getElementById("go-winner");

/* =========================================================
   GAME STATE
   ========================================================= */
const STATE = { MENU: "menu", PLAYING: "playing", PAUSED: "paused", OVER: "over" };

let gameState = STATE.MENU;
let currentMode = null;          // "hvh" | "cvh" | "cvc"
let snakes = [];                 // array of snake objects
let foods = [];                  // array of food objects {x,y}
let lastTick = 0;
let rafId = null;

/* =========================================================
   SNAKE FACTORY
   ========================================================= */
function createSnake(id, isCPU, color, glow, startX, startY, dir) {
  const body = [];
  for (let i = 0; i < START_LEN; i++) {
    body.push({ x: startX - i * DIRS[dir].x, y: startY - i * DIRS[dir].y });
  }
  return {
    id,
    isCPU,
    color,
    glow,
    body,                       // body[0] is the head
    dir,                        // current direction key
    pendingDir: dir,            // queued direction (applied next tick)
    score: 0,
    alive: true,
    food: null                  // this snake's own food
  };
}

/* =========================================================
   HELPERS
   ========================================================= */
function inBounds(x, y) {
  return x >= 0 && y >= 0 && x < GRID && y < GRID;
}

/** Returns true if (x,y) is occupied by any snake body (optionally ignoring a tail cell). */
function isOccupied(x, y, ignoreSnake, ignoreTail) {
  for (const s of snakes) {
    if (!s.alive) continue;
    const len = s.body.length;
    for (let i = 0; i < len; i++) {
      if (ignoreSnake === s && ignoreTail && i === len - 1) continue;
      if (s.body[i].x === x && s.body[i].y === y) return true;
    }
  }
  return false;
}

/** Random free cell not occupied by snakes or foods. */
function randomFreeCell() {
  const free = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (!isOccupied(x, y, null, false) && !foods.some(f => f.x === x && f.y === y)) {
        free.push({ x, y });
      }
    }
  }
  if (free.length === 0) return null;
  return free[Math.floor(Math.random() * free.length)];
}

/** Spawn a food for a given snake. */
function spawnFood(snake) {
  const cell = randomFreeCell();
  if (!cell) return;
  const food = { x: cell.x, y: cell.y, owner: snake.id };
  foods.push(food);
  snake.food = food;
}

/* =========================================================
   CPU AI  —  safe greedy with flood-fill lookahead
   ========================================================= */
/**
 * Choose the best direction for a CPU snake.
 * Strategy:
 *  1. Candidate moves = all directions except reverse, that are in-bounds and free.
 *  2. For each candidate, simulate the move and flood-fill the reachable free
 *     space from the new head. Prefer the move that:
 *       - keeps the largest reachable area (avoids trapping itself),
 *       - then minimizes Manhattan distance to its food.
 *  3. If no safe move exists, fall back to any non-reversing in-bounds move.
 */
function chooseCPUDirection(snake) {
  const head = snake.body[0];
  const food = snake.food;

  const candidates = [];
  for (const dirKey of Object.keys(DIRS)) {
    if (dirKey === OPPOSITE[snake.dir]) continue; // no reversing
    const d = DIRS[dirKey];
    const nx = head.x + d.x;
    const ny = head.y + d.y;
    if (!inBounds(nx, ny)) continue;
    if (isOccupied(nx, ny, snake, true)) continue; // ignore own tail (it moves away)
    candidates.push({ dirKey, nx, ny });
  }

  if (candidates.length === 0) {
    // No safe move — keep going (will likely die, but that's the game).
    return snake.dir;
  }

  // Score each candidate.
  let best = null;
  for (const c of candidates) {
    const space = floodFillSpace(c.nx, c.ny, snake);
    const dist = food ? Math.abs(c.nx - food.x) + Math.abs(c.ny - food.y) : 0;
    // Primary: more open space. Secondary: closer to food.
    const score = space * 1000 - dist;
    if (!best || score > best.score) {
      best = { dirKey: c.dirKey, score };
    }
  }
  return best.dirKey;
}

/**
 * Flood-fill from (sx, sy) counting reachable free cells.
 * Treats the snake's own tail as free (it will move), and all other
 * snake bodies as blocked.
 */
function floodFillSpace(sx, sy, snake) {
  const visited = new Uint8Array(GRID * GRID);
  const queue = [{ x: sx, y: sy }];
  let count = 0;
  visited[sy * GRID + sx] = 1;

  while (queue.length) {
    const { x, y } = queue.pop();
    count++;
    for (const d of Object.values(DIRS)) {
      const nx = x + d.x;
      const ny = y + d.y;
      if (!inBounds(nx, ny)) continue;
      const idx = ny * GRID + nx;
      if (visited[idx]) continue;
      if (isOccupied(nx, ny, snake, true)) continue;
      visited[idx] = 1;
      queue.push({ x: nx, y: ny });
    }
  }
  return count;
}

/* =========================================================
   GAME SETUP
   ========================================================= */
function startGame(mode) {
  currentMode = mode;
  gameState = STATE.PLAYING;
  foods = [];
  snakes = [];

  const p1CPU = (mode === "cvc");
  const p2CPU = (mode === "cvh" || mode === "cvc");

  // Player 1: green, starts left side moving right.
  const s1 = createSnake(1, p1CPU, "#39ff88", "rgba(57,255,136,0.65)",
                         5, Math.floor(GRID / 2), "right");
  // Player 2: orange, starts right side moving left.
  const s2 = createSnake(2, p2CPU, "#ff9f43", "rgba(255,159,67,0.65)",
                         GRID - 6, Math.floor(GRID / 2), "left");

  snakes.push(s1, s2);

  // Spawn one food per snake.
  spawnFood(s1);
  spawnFood(s2);

  // Update HUD labels.
  p1LabelEl.textContent = p1CPU ? "CPU 1" : "PLAYER 1";
  p2LabelEl.textContent = p2CPU ? "CPU 2" : "PLAYER 2";
  p1ScoreEl.textContent = "0";
  p2ScoreEl.textContent = "0";

  const modeNames = {
    hvh: "Human vs Human",
    cvh: "CPU vs Human",
    cvc: "CPU vs CPU"
  };
  modeTag.textContent = modeNames[mode];

  menuEl.classList.add("hidden");
  gameoverEl.classList.add("hidden");
  pauseBadge.style.display = "none";

  lastTick = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop(now) {
  rafId = requestAnimationFrame(loop);

  if (gameState !== STATE.PLAYING) {
    render();
    return;
  }

  if (now - lastTick >= TICK_MS) {
    lastTick = now;
    tick();
  }
  render();
}

/* =========================================================
   TICK  —  advance the game one step
   ========================================================= */
function tick() {
  // 1. CPU decisions.
  for (const s of snakes) {
    if (s.alive && s.isCPU) {
      s.pendingDir = chooseCPUDirection(s);
    }
  }

  // 2. Apply queued directions (no reversing).
  for (const s of snakes) {
    if (!s.alive) continue;
    if (s.pendingDir && s.pendingDir !== OPPOSITE[s.dir]) {
      s.dir = s.pendingDir;
    }
  }

  // 3. Compute new heads.
  const newHeads = [];
  for (const s of snakes) {
    if (!s.alive) { newHeads.push(null); continue; }
    const d = DIRS[s.dir];
    newHeads.push({ x: s.body[0].x + d.x, y: s.body[0].y + d.y });
  }

  // 4. Determine which snakes will eat (grow) this tick.
  const willEat = snakes.map((s, i) => {
    if (!s.alive || !newHeads[i]) return false;
    return s.food && newHeads[i].x === s.food.x && newHeads[i].y === s.food.y;
  });

  // 5. Collision detection.
  const dead = new Set();
  for (let i = 0; i < snakes.length; i++) {
    const s = snakes[i];
    if (!s.alive) continue;
    const h = newHeads[i];

    // Wall collision.
    if (!inBounds(h.x, h.y)) { dead.add(i); continue; }

    // Self / other collision. A tail cell that is moving away is safe
    // unless the snake is growing this tick.
    for (let j = 0; j < snakes.length; j++) {
      const o = snakes[j];
      if (!o.alive) continue;
      const len = o.body.length;
      for (let k = 0; k < len; k++) {
        const cell = o.body[k];
        if (cell.x !== h.x || cell.y !== h.y) continue;
        const isTail = (k === len - 1);
        const tailMovesAway = isTail && !willEat[j];
        if (isTail && tailMovesAway) continue; // safe
        dead.add(i);
        break;
      }
      if (dead.has(i)) break;
    }
  }

  // 6. Apply movement / growth / death.
  for (let i = 0; i < snakes.length; i++) {
    const s = snakes[i];
    if (!s.alive) continue;

    if (dead.has(i)) {
      s.alive = false;
      continue;
    }

    const h = newHeads[i];
    s.body.unshift(h);

    if (willEat[i]) {
      s.score++;
      // Remove eaten food and spawn a new one for this snake.
      foods = foods.filter(f => f !== s.food);
      s.food = null;
      spawnFood(s);
    } else {
      s.body.pop();
    }
  }

  // 7. Update HUD scores.
  p1ScoreEl.textContent = snakes[0].score;
  p2ScoreEl.textContent = snakes[1].score;

  // 8. Check for game over: round ends when ANY snake crashes.
  const anyDead = snakes.some(s => !s.alive);
  if (anyDead) {
    endGame();
  }
}

/* =========================================================
   GAME OVER
   ========================================================= */
function endGame() {
  gameState = STATE.OVER;

  const s1 = snakes[0];
  const s2 = snakes[1];

  goP1Label.textContent = p1LabelEl.textContent;
  goP2Label.textContent = p2LabelEl.textContent;
  goP1Score.textContent = s1.score;
  goP2Score.textContent = s2.score;

  let winnerText = "";
  if (!s1.alive && !s2.alive) {
    winnerText = "It's a draw — both snakes crashed!";
  } else if (!s1.alive) {
    winnerText = `${p2LabelEl.textContent} wins!`;
  } else if (!s2.alive) {
    winnerText = `${p1LabelEl.textContent} wins!`;
  }

  goTitleEl.textContent = "GAME OVER";
  goWinnerEl.textContent = winnerText;

  gameoverEl.classList.remove("hidden");
}

/* =========================================================
   RENDERING
   ========================================================= */
function render() {
  // Clear.
  ctx.fillStyle = "#070a10";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid lines.
  ctx.strokeStyle = "#141c29";
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    const p = i * CELL + 0.5;
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(canvas.width, p);
    ctx.stroke();
  }

  // Foods (glowing circles).
  for (const f of foods) {
    const cx = f.x * CELL + CELL / 2;
    const cy = f.y * CELL + CELL / 2;
    const r = CELL * 0.32;

    ctx.save();
    ctx.shadowColor = "rgba(255,59,92,0.9)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ff3b5c";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Inner highlight.
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  // Snakes.
  for (const s of snakes) {
    if (!s.alive) continue;
    drawSnake(s);
  }
}

function drawSnake(s) {
  const len = s.body.length;
  for (let i = 0; i < len; i++) {
    const cell = s.body[i];
    const x = cell.x * CELL;
    const y = cell.y * CELL;
    const isHead = (i === 0);

    // Fade the body slightly toward the tail.
    const t = len > 1 ? i / (len - 1) : 0;
    const alpha = 1 - t * 0.45;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = s.glow;
    ctx.shadowBlur = isHead ? 16 : 8;
    ctx.fillStyle = s.color;

    const pad = isHead ? 1 : 2;
    const size = CELL - pad * 2;
    roundRect(ctx, x + pad, y + pad, size, size, isHead ? 6 : 4);
    ctx.fill();
    ctx.restore();

    // Eyes on the head.
    if (isHead) {
      drawEyes(s, x, y);
    }
  }
}

function drawEyes(s, x, y) {
  const d = DIRS[s.dir];
  const cx = x + CELL / 2;
  const cy = y + CELL / 2;
  const eyeOffset = CELL * 0.22;
  const eyeR = CELL * 0.09;

  // Perpendicular axis.
  const px = d.y !== 0 ? 1 : 0;
  const py = d.x !== 0 ? 1 : 0;

  const e1x = cx + d.x * eyeOffset + px * eyeOffset;
  const e1y = cy + d.y * eyeOffset + py * eyeOffset;
  const e2x = cx + d.x * eyeOffset - px * eyeOffset;
  const e2y = cy + d.y * eyeOffset - py * eyeOffset;

  ctx.fillStyle = "#0a0e14";
  ctx.beginPath();
  ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* =========================================================
   INPUT HANDLING
   ========================================================= */
const KEY_DIR = {
  // Player 1 — WASD
  "w": { player: 0, dir: "up" },
  "a": { player: 0, dir: "left" },
  "s": { player: 0, dir: "down" },
  "d": { player: 0, dir: "right" },
  // Player 2 — Arrow keys
  "arrowup":    { player: 1, dir: "up" },
  "arrowleft":  { player: 1, dir: "left" },
  "arrowdown":  { player: 1, dir: "down" },
  "arrowright": { player: 1, dir: "right" }
};

document.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();

  // Prevent page scrolling on arrows / space.
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
    e.preventDefault();
  }

  // --- Menu / Game over / Restart handling ---
  if (gameState === STATE.MENU) {
    return; // menu uses buttons
  }

  if (gameState === STATE.OVER) {
    if (key === " " || key === "enter") {
      startGame(currentMode);
    } else if (key === "escape") {
      returnToMenu();
    }
    return;
  }

  // --- Pause toggle ---
  if (key === "p") {
    if (gameState === STATE.PLAYING) {
      gameState = STATE.PAUSED;
      pauseBadge.style.display = "block";
    } else if (gameState === STATE.PAUSED) {
      gameState = STATE.PLAYING;
      lastTick = performance.now();
      pauseBadge.style.display = "none";
    }
    return;
  }

  // --- Return to menu ---
  if (key === "escape") {
    returnToMenu();
    return;
  }

  // --- Directional input (only when playing) ---
  if (gameState !== STATE.PLAYING) return;

  const mapping = KEY_DIR[key];
  if (!mapping) return;

  const snake = snakes[mapping.player];
  if (!snake || !snake.alive || snake.isCPU) return;

  // Queue direction (no reversing).
  if (mapping.dir !== OPPOSITE[snake.dir]) {
    snake.pendingDir = mapping.dir;
  }
});

/* =========================================================
   MENU / NAVIGATION
   ========================================================= */
document.querySelectorAll("#menu button").forEach(btn => {
  btn.addEventListener("click", () => {
    startGame(btn.dataset.mode);
  });
});

function returnToMenu() {
  gameState = STATE.MENU;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  menuEl.classList.remove("hidden");
  gameoverEl.classList.add("hidden");
  pauseBadge.style.display = "none";
  modeTag.textContent = "—";
  p1LabelEl.textContent = "PLAYER 1";
  p2LabelEl.textContent = "PLAYER 2";
  p1ScoreEl.textContent = "0";
  p2ScoreEl.textContent = "0";
  snakes = [];
  foods = [];
  render();
}

/* =========================================================
   BOOT
   ========================================================= */
render();
</script>
