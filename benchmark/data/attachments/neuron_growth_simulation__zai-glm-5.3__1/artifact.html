<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Growth Simulation</title>
<style>
  html, body {
    margin: 0;
    background: #05070f;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { position: relative; }
  canvas {
    display: block;
    background: #05070f;
    box-shadow: 0 0 90px rgba(16, 26, 58, .9);
  }
  .label {
    position: absolute;
    top: 10px;
    left: 12px;
    color: #ffd400;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(255, 212, 0, .6);
    pointer-events: none;
  }
  .status {
    position: absolute;
    right: 10px;
    bottom: 8px;
    color: #00e5ff;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .7;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="net" width="800" height="800"></canvas>
  <div class="label">NEURAL GROWTH // LIVE</div>
  <div class="status" id="status">BOOT</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
'use strict';

// ===== SETUP =====
const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
const W = 800, H = 800;

// offscreen buffer accumulates finished branches for performance
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d');

// parameters exposed through dat.gui
const P = {
  neuronCount: 5,
  growthSpeed: 2.2,
  maxDepth: 5,
  splitChance: 0.75,
  curvature: 0.4,
  maxBranchLen: 120,
  synapseDist: 34,
  synapseGlow: 14,
  pulseSpeed: 1.6,
  pulseFreq: 1.2,
  pulseBrightness: 1.4,
  backgroundColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  scanlines: true
};

// simulation state
let neurons = [];   // seed cells
let branches = [];  // every branch ever created
let active = [];    // currently growing tips
let synapses = [];  // detected junctions
let pulses = [];    // traveling signals
let seen = new Set();   // duplicate synapse keys
let growing = false;
let paused = false;
let time = 0;
let lastPulse = 0;
let frame = 0;

const statusEl = document.getElementById('status');
let lastStatus = 'GROWING';

function rand(a, b) { return a + Math.random() * (b - a); }

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ===== GUI =====
const gui = new dat.GUI();

const fGrowth = gui.addFolder('Growth');
fGrowth.add(P, 'neuronCount', 3, 6, 1).name('neuron count').onFinishChange(regenerate);
fGrowth.add(P, 'growthSpeed', 0.5, 6, 0.1).name('growth speed');
fGrowth.add(P, 'maxDepth', 2, 8, 1).name('max branch depth');
fGrowth.add(P, 'splitChance', 0, 1, 0.01).name('branch split chance');
fGrowth.add(P, 'curvature', 0, 1, 0.01).name('branch curvature');
fGrowth.add(P, 'maxBranchLen', 40, 220, 1).name('max branch length');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(P, 'synapseDist', 8, 90, 1).name('distance threshold');
fSyn.add(P, 'synapseGlow', 0, 30, 0.5).name('glow strength');
fSyn.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(P, 'pulseSpeed', 0.2, 4, 0.05).name('pulse speed');
fPulse.add(P, 'pulseFreq', 0.1, 5, 0.05).name('pulse frequency');
fPulse.add(P, 'pulseBrightness', 0.2, 3, 0.05).name('pulse brightness');
fPulse.open();

const fVis = gui.addFolder('Visuals');
fVis.addColor(P, 'backgroundColor').name('background color');
fVis.addColor(P, 'branchColor').name('branch color').onChange(redrawBranches);
fVis.addColor(P, 'accentColor').name('accent branch color').onChange(redrawBranches);
fVis.addColor(P, 'synapseColor').name('synapse color');
fVis.addColor(P, 'pulseColor').name('pulse color');
fVis.add(P, 'scanlines').name('scanlines');
fVis.open();

const actions = {
  'regenerate network': function () { regenerate(); },
  'clear canvas': function () { clearAll(); },
  'pause/resume animation': function () { togglePause(); }
};
gui.add(actions, 'regenerate network');
gui.add(actions, 'clear canvas');
gui.add(actions, 'pause/resume animation');

function togglePause() {
  paused = !paused;
  setStatus(paused ? 'PAUSED' : lastStatus);
}

// ===== NEURON GROWTH =====
const MAX_BRANCHES = 900; // hard cap keeps performance stable

function spawnBranch(x, y, angle, neuron, depth, thick, accent) {
  if (branches.length >= MAX_BRANCHES) return;
  const b = {
    x, y, angle, depth, thick, accent, neuron,
    len: 0,
    points: [{ x, y }],
    synapseCount: 0,
    id: branches.length
  };
  branches.push(b);
  active.push(b);
}

function regenerate() {
  neurons = [];
  branches = [];
  active = [];
  synapses = [];
  pulses = [];
  seen = new Set();
  offCtx.clearRect(0, 0, W, H);

  const count = P.neuronCount | 0;
  for (let i = 0; i < count; i++) {
    const n = {
      x: W / 2 + rand(-130, 130),
      y: H / 2 + rand(-130, 130),
      r: rand(4, 7)
    };
    neurons.push(n);
    const roots = 2 + ((Math.random() * 2) | 0); // 2-3 root branches
    for (let k = 0; k < roots; k++) {
      spawnBranch(n.x, n.y, rand(0, Math.PI * 2), n, 0, rand(1.6, 2.6), Math.random() < 0.2);
    }
  }
  growing = true;
  setStatus('GROWING');
}

function stepGrowth() {
  for (let i = active.length - 1; i >= 0; i--) {
    const b = active[i];

    // organic wobble
    b.angle += rand(-1, 1) * (0.1 + 0.45 * P.curvature);
    const step = 1 + P.growthSpeed;
    b.x += Math.cos(b.angle) * step;
    b.y += Math.sin(b.angle) * step;
    b.points.push({ x: b.x, y: b.y });
    b.len += step;

    // occasional smaller side branch
    if (b.depth < P.maxDepth && b.len > 18 && Math.random() < 0.035) {
      spawnBranch(b.x, b.y,
        b.angle + (Math.random() < 0.5 ? 1 : -1) * rand(0.5, 1.1),
        b.neuron, b.depth + 1, b.thick * 0.55, Math.random() < 0.25);
    }

    // kill branches that leave the canvas
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      drawBranch(offCtx, b);
      active.splice(i, 1);
      continue;
    }

    // finished growing its allotted length
    if (b.len >= P.maxBranchLen) {
      drawBranch(offCtx, b);
      active.splice(i, 1);
      if (b.depth < P.maxDepth && branches.length < MAX_BRANCHES && Math.random() < P.splitChance) {
        spawnBranch(b.x, b.y, b.angle + rand(0.35, 0.8), b.neuron, b.depth + 1, b.thick * 0.72, Math.random() < 0.25);
        spawnBranch(b.x, b.y, b.angle - rand(0.35, 0.8), b.neuron, b.depth + 1, b.thick * 0.72, Math.random() < 0.25);
      }
    }
  }

  if (active.length === 0 && growing) {
    growing = false;
    setStatus('STABLE // PULSING');
  }
}

// ===== SYNAPSE DETECTION =====
function detectSynapses() {
  for (const a of active) {
    const pa = a.points[a.points.length - 1];
    for (const b of branches) {
      if (b.neuron === a.neuron) continue;
      const pb = b.points[b.points.length - 1];
      const dx = pa.x - pb.x, dy = pa.y - pb.y;
      if (dx * dx + dy * dy < P.synapseDist * P.synapseDist) {
        const key = Math.min(a.id, b.id) + '_' + Math.max(a.id, b.id);
        if (seen.has(key) || a.synapseCount > 2 || b.synapseCount > 2) continue;
        seen.add(key);
        a.synapseCount++;
        b.synapseCount++;
        synapses.push({
          a, b,
          x: (pa.x + pb.x) / 2,
          y: (pa.y + pb.y) / 2,
          phase: rand(0, Math.PI * 2)
        });
      }
    }
  }
}

// ===== PULSE ANIMATION =====
function spawnPulse() {
  if (!synapses.length) return;
  const s = synapses[(Math.random() * synapses.length) | 0];
  const path = [];
  // branch A: origin -> tip
  for (let i = 0; i < s.a.points.length; i++) path.push(s.a.points[i]);
  // synapse midpoint
  path.push({ x: s.x, y: s.y });
  // branch B reversed: tip -> origin
  for (let i = s.b.points.length - 1; i >= 0; i--) path.push(s.b.points[i]);
  pulses.push({ path, t: 0 });
}

function stepPulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].t += 0.010 * P.pulseSpeed;
    if (pulses[i].t >= 1) pulses.splice(i, 1);
  }
  if (synapses.length && time - lastPulse > 1 / P.pulseFreq) {
    lastPulse = time;
    spawnPulse();
  }
}

function pulsePos(p) {
  const f = p.t * (p.path.length - 1);
  const i = Math.floor(f);
  const j = Math.min(i + 1, p.path.length - 1);
  const u = f - i;
  const a = p.path[i], b = p.path[j];
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
}

// ===== RENDERING =====
function drawBranch(c, b) {
  const pts = b.points;
  if (pts.length < 2) return;
  const col = b.accent ? P.accentColor : P.branchColor;

  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for (let k = 2; k < pts.length; k++) {
    const mx = (pts[k - 1].x + pts[k].x) / 2;
    const my = (pts[k - 1].y + pts[k].y) / 2;
    c.quadraticCurveTo(pts[k - 1].x, pts[k - 1].y, mx, my);
  }
  c.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.strokeStyle = hexA(col, 0.85);
  c.lineWidth = b.thick;
  c.shadowColor = col;
  c.shadowBlur = 8;
  c.stroke();
  c.shadowBlur = 0;
}

function redrawBranches() {
  offCtx.clearRect(0, 0, W, H);
  for (const b of branches) drawBranch(offCtx, b);
}

function setStatus(txt) {
  statusEl.textContent = txt;
  if (txt !== 'PAUSED') lastStatus = txt;
}

// cached vignette gradient
const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.33, W / 2, H / 2, H * 0.72);
vig.addColorStop(0, 'rgba(5,7,15,0)');
vig.addColorStop(1, 'rgba(5,7,15,0.85)');

function render() {
  // 1. background
  ctx.fillStyle = P.backgroundColor;
  ctx.fillRect(0, 0, W, H);

  // 2. background glow
  const glow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 430);
  glow.addColorStop(0, '#101a3a');
  glow.addColorStop(1, 'rgba(16,26,58,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 3. faint grid
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 40; x < W; x += 40) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 40; y < H; y += 40) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();

  // 4. finished branches (offscreen buffer)
  ctx.drawImage(off, 0, 0);

  // 5. live growing branches
  for (const b of active) drawBranch(ctx, b);

  // 6. neuron somas
  for (const n of neurons) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = P.branchColor;
    ctx.shadowColor = P.branchColor;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 7. synapses (twinkling)
  for (const s of synapses) {
    const tw = 0.55 + 0.45 * Math.sin(time * 2.4 + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = hexA(P.synapseColor, 0.25);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = P.synapseColor;
    ctx.shadowColor = P.synapseColor;
    ctx.shadowBlur = P.synapseGlow * tw;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 8. pulses with trails
  for (const p of pulses) {
    const pos = pulsePos(p);
    const ti = Math.max(0, Math.floor(p.t * (p.path.length - 1)) - 6);
    const tp = p.path[ti];
    ctx.beginPath();
    ctx.moveTo(tp.x, tp.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.lineWidth = 2;
    ctx.strokeStyle = hexA(P.pulseColor, 0.5);
    ctx.shadowColor = P.pulseColor;
    ctx.shadowBlur = 10 * P.pulseBrightness;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 14 * P.pulseBrightness;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 9. scanlines
  if (P.scanlines) {
    ctx.fillStyle = 'rgba(0,229,255,0.03)';
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  }

  // 10. animated grain
  ctx.fillStyle = 'rgba(0,229,255,0.05)';
  for (let i = 0; i < 40; i++) {
    const s = Math.random() < 0.5 ? 1 : 2;
    ctx.fillRect(Math.random() * W, Math.random() * H, s, s);
  }

  // 11. vignette
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

// ===== MAIN LOOP =====
function loop() {
  requestAnimationFrame(loop);
  frame++;
  if (!paused) {
    time += 1 / 60;
    if (growing) {
      stepGrowth();
      if (frame % 4 === 0) detectSynapses();
    }
    stepPulses();
  }
  render(); // always render so pause freezes motion but keeps the frame
}

function clearAll() {
  neurons = [];
  branches = [];
  active = [];
  synapses = [];
  pulses = [];
  seen = new Set();
  offCtx.clearRect(0, 0, W, H);
  growing = false;
  setStatus('CLEARED');
}

// init
regenerate();
loop();
</script>
</body>
</html>
