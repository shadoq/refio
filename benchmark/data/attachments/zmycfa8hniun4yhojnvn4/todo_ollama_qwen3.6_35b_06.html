<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    color: #333;
  }
  .container {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 20px;
    color: #2c3e50;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus {
    border-color: #3498db;
  }
  .input-row button {
    padding: 10px 20px;
    background: #3498db;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  .input-row button:hover {
    background: #2980b9;
  }
  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
  }
  .filters button {
    flex: 1;
    padding: 8px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: #777;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .filters button:hover {
    background: #f0f0f0;
  }
  .filters button.active {
    color: #3498db;
    font-weight: 600;
    border-bottom: 2px solid #3498db;
    margin-bottom: -10px;
  }
  .todo-list {
    list-style: none;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px;
    border-bottom: 1px solid #eee;
    transition: background 0.15s;
  }
  .todo-item:hover {
    background: #fafafa;
  }
  .todo-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #3498db;
  }
  .todo-text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }
  .todo-text.completed {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    padding: 4px 10px;
    border: none;
    background: transparent;
    color: #e74c3c;
    cursor: pointer;
    font-size: 1.2rem;
    border-radius: 4px;
    transition: background 0.15s;
    opacity: 0;
  }
  .todo-item:hover .delete-btn {
    opacity: 1;
  }
  .delete-btn:hover {
    background: #fdecea;
  }
  .empty-state {
    text-align: center;
    padding: 32px 0;
    color: #aaa;
    font-size: 0.95rem;
  }
  .counter {
    text-align: center;
    margin-top: 12px;
    font-size: 0.85rem;
    color: #999;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Todos</h1>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="What needs to be done?" autofocus>
    <button id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
  <div class="counter" id="counter"></div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'todos_app_data';
  let todos = [];
  let currentFilter = 'all';

  // --- Persistence ---
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) todos = JSON.parse(raw);
    } catch(e) {
      todos = [];
    }
  }

  // --- Rendering ---
  function getFiltered() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const list = document.getElementById('todoList');
    const counter = document.getElementById('counter');
    const filtered = getFiltered();

    if (filtered.length === 0) {
      const messages = {
        all: 'No todos yet. Add one above!',
        active: 'No active todos. Well done!',
        completed: 'No completed todos yet.'
      };
      list.innerHTML = '<li class="empty-state">' + messages[currentFilter] + '</li>';
    } else {
      list.innerHTML = filtered.map(function(todo) {
        return '<li class="todo-item">' +
          '<input type="checkbox"' + (todo.completed ? ' checked' : '') + ' data-id="' + todo.id + '">' +
          '<span class="todo-text' + (todo.completed ? ' completed' : '') + '">' + escapeHtml(todo.text) + '</span>' +
          '<button class="delete-btn" data-id="' + todo.id + '" title="Delete">&times;</button>' +
          '</li>';
      }).join('');
    }

    const activeCount = todos.filter(function(t) { return !t.completed; }).length;
    const completedCount = todos.filter(function(t) { return t.completed; }).length;
    counter.textContent = activeCount + ' active · ' + completedCount + ' completed · ' + todos.length + ' total';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Actions ---
  function addTodo() {
    var input = document.getElementById('todoInput');
    var text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now().toString(), text: text, completed: false });
    input.value = '';
    save();
    render();
    input.focus();
  }

  function toggleTodo(id) {
    var todo = todos.find(function(t) { return t.id === id; });
    if (todo) {
      todo.completed = !todo.completed;
      save();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(function(t) { return t.id !== id; });
    save();
    render();
  }

  // --- Events ---
  document.getElementById('addBtn').addEventListener('click', addTodo);
  document.getElementById('todoInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addTodo();
  });

  document.getElementById('todoList').addEventListener('change', function(e) {
    if (e.target.type === 'checkbox') toggleTodo(e.target.dataset.id);
  });

  document.getElementById('todoList').addEventListener('click', function(e) {
    if (e.target.classList.contains('delete-btn')) deleteTodo(e.target.dataset.id);
  });

  document.querySelectorAll('.filters button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelector('.filters .active').classList.remove('active');
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // --- Init ---
  load();
  render();
})();
</script>
</body>
</html>
