<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #e0e0e0;
}

.container {
  text-align: center;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 1rem;
  color: #00ff88;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

#score-board {
  font-size: 1.2rem;
  margin-bottom: 1rem;
  color: #00ff88;
}

canvas {
  border: 2px solid #00ff88;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
  display: block;
  margin: 0 auto;
}

#menu, #game-over {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#menu h2, #game-over h2 {
  font-size: 2rem;
  margin-bottom: 1.5rem;
  color: #00ff88;
}

#menu p, #game-over p {
  font-size: 1.1rem;
  margin-bottom: 0.5rem;
}

#game-over p {
  color: #ff4444;
}

button {
  background: #00ff88;
  color: #1a1a2e;
  border: none;
  padding: 0.8rem 2rem;
  font-size: 1.1rem;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  cursor: pointer;
  margin: 0.5rem;
  border-radius: 5px;
  transition: all 0.2s;
}

button:hover {
  background: #00cc6a;
  transform: scale(1.05);
}

#mode-select {
  margin-bottom: 1.5rem;
}

#mode-select label {
  font-size: 1.1rem;
  display: block;
  margin-bottom: 0.5rem;
}

#mode-select select {
  background: #1a1a2e;
  color: #e0e0e0;
  border: 1px solid #00ff88;
  padding: 0.5rem;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  border-radius: 5px;
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>

<div class="container">
  <h1>SNAKE</h1>
  <div id="score-board">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>

  <div id="menu">
    <h2>SNAKE GAME</h2>
    <div id="mode-select">
      <label for="gameMode">Game Mode:</label>
      <select id="gameMode">
        <option value="human-human">Human vs Human</option>
        <option value="cpu-human">CPU vs Human</option>
        <option value="cpu-cpu">CPU vs CPU</option>
      </select>
    </div>
    <p>Use Arrow Keys or WASD to control the green snake.</p>
    <p>Red snake is controlled by CPU (if applicable).</p>
    <button id="startBtn">START GAME</button>
  </div>

  <div id="game-over" class="hidden">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID_SIZE = 30;
const COLS = canvas.width / GRID_SIZE;
const ROWS = canvas.height / GRID_SIZE;

const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('finalScore');
const menuEl = document.getElementById('menu');
const gameOverEl = document.getElementById('game-over');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const gameModeSelect = document.getElementById('gameMode');

let gameLoop;
let score = 0;
let gameMode = 'human-human';
let gameOver = false;
let human1, human2, cpu1, cpu2;
let food;

function initSnakes() {
  const startX = Math.floor(COLS / 2);
  const startY = Math.floor(ROWS / 2);

  human1 = {
    body: [[startX, startY], [startX - 1, startY], [startX - 2, startY]],
    direction: { x: 1, y: 0 },
    nextDirection: { x: 1, y: 0 }
  };

  human2 = {
    body: [[startX, startY + 2], [startX - 1, startY + 2], [startX - 2, startY + 2]],
    direction: { x: 1, y: 0 },
    nextDirection: { x: 1, y: 0 }
  };

  cpu1 = {
    body: [[startX, startY + 4], [startX - 1, startY + 4], [startX - 2, startY + 4]],
    direction: { x: -1, y: 0 },
    nextDirection: { x: -1, y: 0 }
  };

  cpu2 = {
    body: [[startX, startY - 4], [startX - 1, startY - 4], [startX - 2, startY - 4]],
    direction: { x: -1, y: 0 },
    nextDirection: { x: -1, y: 0 }
  };
}

function getRandomFoodPosition(exclude) {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (exclude.some(s => s.body.some(c => c.x === pos.x && c.y === pos.y)) ||
           (pos.x === food.x && pos.y === food.y));
  return pos;
}

function update() {
  if (gameOver) return;

  // Human 1
  human1.direction = human1.nextDirection;
  const head1 = { ...human1.body[0] };
  head1.x += human1.direction.x;
  head1.y += human1.direction.y;

  // Wrap around walls
  if (head1.x < 0) head1.x = COLS - 1;
  if (head1.x >= COLS) head1.x = 0;
  if (head1.y < 0) head1.y = ROWS - 1;
  if (head1.y >= ROWS) head1.y = 0;

  // Check collision with self
  if (human1.body.some(c => c.x === head1.x && c.y === head1.y)) {
    endGame();
    return;
  }

  human1.body.unshift(head1);

  if (head1.x === food.x && head1.y === food.y) {
    score++;
    scoreEl.textContent = score;
    food = getRandomFoodPosition([human1, human2, cpu1, cpu2]);
  } else {
    human1.body.pop();
  }

  // Human 2
  human2.direction = human2.nextDirection;
  const head2 = { ...human2.body[0] };
  head2.x += human2.direction.x;
  head2.y += human2.direction.y;

  if (head2.x < 0) head2.x = COLS - 1;
  if (head2.x >= COLS) head2.x = 0;
  if (head2.y < 0) head2.y = ROWS - 1;
  if (head2.y >= ROWS) head2.y = 0;

  if (human2.body.some(c => c.x === head2.x && c.y === head2.y)) {
    endGame();
    return;
  }

  human2.body.unshift(head2);

  if (head2.x === food.x && head2.y === food.y) {
    score++;
    scoreEl.textContent = score;
    food = getRandomFoodPosition([human1, human2, cpu1, cpu2]);
  } else {
    human2.body.pop();
  }

  // CPU 1 - AI that searches for food
  cpu1.direction = getCpuDirection(cpu1, food, [human1, human2, cpu2]);
  const headCpu1 = { ...cpu1.body[0] };
  headCpu1.x += cpu1.direction.x;
  headCpu1.y += cpu1.direction.y;

  if (headCpu1.x < 0) headCpu1.x = COLS - 1;
  if (headCpu1.x >= COLS) headCpu1.x = 0;
  if (headCpu1.y < 0) headCpu1.y = ROWS - 1;
  if (headCpu1.y >= ROWS) headCpu1.y = 0;

  if (cpu1.body.some(c => c.x === headCpu1.x && c.y === headCpu1.y)) {
    endGame();
    return;
  }

  cpu1.body.unshift(headCpu1);

  if (headCpu1.x === food.x && headCpu1.y === food.y) {
    score++;
    scoreEl.textContent = score;
    food = getRandomFoodPosition([human1, human2, cpu1, cpu2]);
  } else {
    cpu1.body.pop();
  }

  // CPU 2 - AI that searches for food
  cpu2.direction = getCpuDirection(cpu2, food, [human1, human2, cpu1]);
  const headCpu2 = { ...cpu2.body[0] };
  headCpu2.x += cpu2.direction.x;
  headCpu2.y += cpu2.direction.y;

  if (headCpu2.x < 0) headCpu2.x = COLS - 1;
  if (headCpu2.x >= COLS) headCpu2.x = 0;
  if (headCpu2.y < 0) headCpu2.y = ROWS - 1;
  if (headCpu2.y >= ROWS) headCpu2.y = 0;

  if (cpu2.body.some(c => c.x === headCpu2.x && c.y === headCpu2.y)) {
    endGame();
    return;
  }

  cpu2.body.unshift(headCpu2);

  if (headCpu2.x === food.x && headCpu2.y === food.y) {
    score++;
    scoreEl.textContent = score;
    food = getRandomFoodPosition([human1, human2, cpu1, cpu2]);
  } else {
    cpu2.body.pop();
  }
}

function getCpuDirection(snake, food, otherSnakes) {
  const head = snake.body[0];
  const directions = [
    { x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }
  ];

  // Try to move toward food
  let bestDir = { x: snake.direction.x, y: snake.direction.y };
  let bestDist = Infinity;

  for (const dir of directions) {
    const newHead = { x: head.x + dir.x, y: head.y + dir.y };

    // Wrap around
    if (newHead.x < 0) newHead.x = COLS - 1;
    if (newHead.x >= COLS) newHead.x = 0;
    if (newHead.y < 0) newHead.y = ROWS - 1;
    if (newHead.y >= ROWS) newHead.y = 0;

    // Check collision with self and others
    if (otherSnakes.some(s => s.body.some(c => c.x === newHead.x && c.y === newHead.y))) {
      continue;
    }

    const dist = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
    if (dist < bestDist) {
      bestDist = dist;
      bestDir = dir;
    }
  }

  return bestDir;
}

function draw() {
  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID_SIZE, 0);
    ctx.lineTo(i * GRID_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * GRID_SIZE);
    ctx.lineTo(canvas.width, i * GRID_SIZE);
    ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Human 1 (Green)
  ctx.fillStyle = '#00ff88';
  human1.body.forEach((cell, index) => {
    const x = cell.x * GRID_SIZE;
    const y = cell.y * GRID_SIZE;
    const size = GRID_SIZE - 2;
    if (index === 0) {
      ctx.fillRect(x + 2, y + 2, size, size);
    } else {
      ctx.fillRect(x + 3, y + 3, size - 4, size - 4);
    }
  });

  // Human 2 (Cyan)
  ctx.fillStyle = '#00ccff';
  human2.body.forEach((cell, index) => {
    const x = cell.x * GRID_SIZE;
    const y = cell.y * GRID_SIZE;
    const size = GRID_SIZE - 2;
    if (index === 0) {
      ctx.fillRect(x + 2, y + 2, size, size);
    } else {
      ctx.fillRect(x + 3, y + 3, size - 4, size - 4);
    }
  });

  // CPU 1 (Yellow)
  ctx.fillStyle = '#ffcc00';
  cpu1.body.forEach((cell, index) => {
    const x = cell.x * GRID_SIZE;
    const y = cell.y * GRID_SIZE;
    const size = GRID_SIZE - 2;
    if (index === 0) {
      ctx.fillRect(x + 2, y + 2, size, size);
    } else {
      ctx.fillRect(x + 3, y + 3, size - 4, size - 4);
    }
  });

  // CPU 2 (Purple)
  ctx.fillStyle = '#cc00ff';
  cpu2.body.forEach((cell, index) => {
    const x = cell.x * GRID_SIZE;
    const y = cell.y * GRID_SIZE;
    const size = GRID_SIZE - 2;
    if (index === 0) {
      ctx.fillRect(x + 2, y + 2, size, size);
    } else {
      ctx.fillRect(x + 3, y + 3, size - 4, size - 4);
    }
  });
}

function gameLoopFn() {
  update();
  draw();
}

function startGame() {
  gameMode = gameModeSelect.value;
  score = 0;
  scoreEl.textContent = '0';
  gameOver = false;
  initSnakes();
  food = getRandomFoodPosition([]);

  menuEl.classList.add('hidden');
  gameOverEl.classList.add('hidden');

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(gameLoopFn, 100);
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoop);
  finalScoreEl.textContent = score;
  gameOverEl.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown', (e) => {
  if (gameOver) return;

  if (gameMode === 'human-human') {
    // Human 1 controls
    if ((e.key === 'ArrowUp' || e.key === 'w') && human1.direction.y !== 1) {
      human1.nextDirection = { x: 0, y: -1 };
    } else if ((e.key === 'ArrowDown' || e.key === 's') && human1.direction.y !== -1) {
      human1.nextDirection = { x: 0, y: 1 };
    } else if ((e.key === 'ArrowLeft' || e.key === 'a') && human1.direction.x !== 1) {
      human1.nextDirection = { x: -1, y: 0 };
    } else if ((e.key === 'ArrowRight' || e.key === 'd') && human1.direction.x !== -1) {
      human1.nextDirection = { x: 1, y: 0 };
    }

    // Human 2 controls (shift + arrow keys)
    if ((e.key === 'Shift' && (e.key === 'ArrowUp' || e.key === 'w')) && human2.direction.y !== 1) {
      human2.nextDirection = { x: 0, y: -1 };
    } else if ((e.key === 'Shift' && (e.key === 'ArrowDown' || e.key === 's')) && human2.direction.y !== -1) {
      human2.nextDirection = { x: 0, y: 1 };
    } else if ((e.key === 'Shift' && (e.key === 'ArrowLeft' || e.key === 'a')) && human2.direction.x !== 1) {
      human2.nextDirection = { x: -1, y: 0 };
    } else if ((e.key === 'Shift' && (e.key === 'ArrowRight' || e.key === 'd')) && human2.direction.x !== -1) {
      human2.nextDirection = { x: 1, y: 0 };
    }
  }
});

// Initial draw
initSnakes();
food = getRandomFoodPosition([]);
draw();
</script>

</body>
</html>
