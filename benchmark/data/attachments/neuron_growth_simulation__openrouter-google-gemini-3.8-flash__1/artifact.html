<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neural Growth Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #030408;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    #canvas-container {
      position: relative;
      width: 800px;
      height: 800px;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.15), 0 0 100px rgba(16, 26, 58, 0.4);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    canvas {
      display: block;
      width: 800px;
      height: 800px;
      background: #05070f;
    }
    .dg.ac {
      z-index: 1000 !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="neuralCanvas" width="800" height="800"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');

    const params = {
      // Growth
      neuronCount: 4,
      growthSpeed: 2.2,
      maxDepth: 4,
      splitChance: 0.04,
      curvature: 0.22,
      maxBranchLength: 140,
      
      // Synapses
      synapseDistance: 38,
      synapseGlowStrength: 16,

      // Pulses
      pulseSpeed: 0.018,
      pulseFrequency: 0.35,
      pulseBrightness: 1.2,

      // Visuals
      bgColor: '#05070f',
      branchColor: '#00e5ff',
      accentBranchColor: '#d6ff00',
      synapseColor: '#ff2bd6',
      pulseColor: '#fff36a',

      // Actions
      regenerate: () => initNetwork(),
      clear: () => clearSimulation(),
      togglePause: () => {
        isPaused = !isPaused;
        pauseController.name(isPaused ? 'Resume' : 'Pause');
      }
    };

    let isPaused = false;
    let pauseController;

    // GUI Setup
    const gui = new dat.GUI({ width: 280, autoPlace: true });

    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 2, 8, 1).onChange(initNetwork);
    fGrowth.add(params, 'growthSpeed', 0.5, 6.0, 0.1);
    fGrowth.add(params, 'maxDepth', 1, 6, 1);
    fGrowth.add(params, 'splitChance', 0.01, 0.1, 0.005);
    fGrowth.add(params, 'curvature', 0.05, 0.6, 0.01);
    fGrowth.add(params, 'maxBranchLength', 50, 250, 5);
    fGrowth.open();

    const fSynapses = gui.addFolder('Synapses');
    fSynapses.add(params, 'synapseDistance', 15, 80, 1);
    fSynapses.add(params, 'synapseGlowStrength', 2, 40, 1);
    fSynapses.open();

    const fPulses = gui.addFolder('Pulses');
    fPulses.add(params, 'pulseSpeed', 0.005, 0.05, 0.001);
    fPulses.add(params, 'pulseFrequency', 0.05, 1.0, 0.01);
    fPulses.add(params, 'pulseBrightness', 0.5, 2.5, 0.1);
    fPulses.open();

    const fVisuals = gui.addFolder('Visuals');
    fVisuals.addColor(params, 'bgColor');
    fVisuals.addColor(params, 'branchColor');
    fVisuals.addColor(params, 'accentBranchColor');
    fVisuals.addColor(params, 'synapseColor');
    fVisuals.addColor(params, 'pulseColor');
    fVisuals.open();

    gui.add(params, 'regenerate').name('Regenerate');
    gui.add(params, 'clear').name('Clear Canvas');
    pauseController = gui.add(params, 'togglePause').name('Pause');

    // Network State
    let neurons = [];
    let allBranches = [];
    let synapses = [];
    let pulses = [];
    let globalBranchCounter = 0;
    const MAX_BRANCH_LIMIT = 450;

    class Branch {
      constructor(originNeuronId, x, y, angle, depth, maxLen, isAccent = false) {
        this.id = globalBranchCounter++;
        this.neuronId = originNeuronId;
        this.startX = x;
        this.startY = y;
        this.currentX = x;
        this.currentY = y;
        this.angle = angle;
        this.depth = depth;
        this.maxLen = maxLen;
        this.currentLen = 0;
        this.isAccent = isAccent;
        this.width = Math.max(1, (params.maxDepth - depth + 1) * 0.9);
        this.points = [{ x, y }];
        this.completed = false;
        this.curvePhase = Math.random() * Math.PI * 2;
      }

      grow(dt) {
        if (this.completed) return;

        const step = params.growthSpeed * dt * 45;
        this.currentLen += step;

        const wobble = Math.sin(this.curvePhase + this.currentLen * 0.035) * params.curvature;
        this.angle += wobble * 0.12;

        const nextX = this.currentX + Math.cos(this.angle) * step;
        const nextY = this.currentY + Math.sin(this.angle) * step;

        // Boundary reflection/limitation
        if (nextX < 20 || nextX > 780 || nextY < 20 || nextY > 780) {
          this.completed = true;
          return;
        }

        this.currentX = nextX;
        this.currentY = nextY;
        this.points.push({ x: nextX, y: nextY });

        // Branching logic
        if (this.depth < params.maxDepth && allBranches.length < MAX_BRANCH_LIMIT) {
          if (Math.random() < params.splitChance) {
            const splitAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.35 + Math.random() * 0.5);
            const childLen = this.maxLen * (0.6 + Math.random() * 0.35);
            const isAccent = Math.random() < 0.28;
            allBranches.push(new Branch(this.neuronId, this.currentX, this.currentY, splitAngle, this.depth + 1, childLen, isAccent));
          }
        }

        if (this.currentLen >= this.maxLen) {
          this.completed = true;
          // Chance to fork at terminal tip
          if (this.depth < params.maxDepth && allBranches.length < MAX_BRANCH_LIMIT) {
            const count = Math.random() < 0.5 ? 2 : 1;
            for (let i = 0; i < count; i++) {
              const forkAngle = this.angle + (i === 0 ? -1 : 1) * (0.2 + Math.random() * 0.5);
              const childLen = this.maxLen * 0.7;
              allBranches.push(new Branch(this.neuronId, this.currentX, this.currentY, forkAngle, this.depth + 1, childLen, Math.random() < 0.25));
            }
          }
        }
      }
    }

    class Synapse {
      constructor(p1, p2, b1, b2) {
        this.x1 = p1.x;
        this.y1 = p1.y;
        this.x2 = p2.x;
        this.y2 = p2.y;
        this.b1 = b1;
        this.b2 = b2;
        this.sparkPhase = Math.random() * Math.PI * 2;
        this.dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      }

      draw(time) {
        const flicker = Math.sin(time * 8 + this.sparkPhase) * 0.4 + 0.6;
        ctx.save();
        ctx.strokeStyle = params.synapseColor;
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = params.synapseGlowStrength * flicker;
        ctx.lineWidth = 1.2 * flicker;

        ctx.beginPath();
        ctx.moveTo(this.x1, this.y1);
        const midX = (this.x1 + this.x2) / 2 + Math.sin(time * 12 + this.sparkPhase) * 3;
        const midY = (this.y1 + this.y2) / 2 + Math.cos(time * 12 + this.sparkPhase) * 3;
        ctx.quadraticCurveTo(midX, midY, this.x2, this.y2);
        ctx.stroke();

        // Terminal endpoints
        ctx.fillStyle = '#ffd400';
        ctx.beginPath();
        ctx.arc(this.x1, this.y1, 1.8, 0, Math.PI * 2);
        ctx.arc(this.x2, this.y2, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    class Pulse {
      constructor(branch) {
        this.branch = branch;
        this.progress = 0;
        this.dead = false;
      }

      update(dt) {
        this.progress += params.pulseSpeed * dt * 50;
        if (this.progress >= 1) {
          this.dead = true;
          // Propagate to touching synapses or child branches
          if (Math.random() < 0.65) {
            triggerConnectedPulses(this.branch);
          }
        }
      }

      draw() {
        if (this.branch.points.length < 2) return;
        const idxFloat = this.progress * (this.branch.points.length - 1);
        const idx = Math.floor(idxFloat);
        const nextIdx = Math.min(idx + 1, this.branch.points.length - 1);
        const t = idxFloat - idx;

        const p1 = this.branch.points[idx];
        const p2 = this.branch.points[nextIdx];
        if (!p1 || !p2) return;

        const px = p1.x + (p2.x - p1.x) * t;
        const py = p1.y + (p2.y - p1.y) * t;

        ctx.save();
        ctx.fillStyle = params.pulseColor;
        ctx.shadowColor = params.pulseColor;
        ctx.shadowBlur = 18 * params.pulseBrightness;

        ctx.beginPath();
        ctx.arc(px, py, 2.5 * params.pulseBrightness, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(px, py, 1.2 * params.pulseBrightness, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }
    }

    function triggerConnectedPulses(sourceBranch) {
      // Find synapses connected to this branch tip
      const tip = sourceBranch.points[sourceBranch.points.length - 1];
      if (!tip) return;

      synapses.forEach(syn => {
        if (syn.b1 === sourceBranch && !syn.b2.completed) {
          pulses.push(new Pulse(syn.b2));
        } else if (syn.b2 === sourceBranch && !syn.b1.completed) {
          pulses.push(new Pulse(syn.b1));
        }
      });

      // Find children
      allBranches.forEach(b => {
        if (b !== sourceBranch && Math.hypot(b.startX - tip.x, b.startY - tip.y) < 5) {
          if (Math.random() < 0.6) {
            pulses.push(new Pulse(b));
          }
        }
      });
    }

    function initNetwork() {
      neurons = [];
      allBranches = [];
      synapses = [];
      pulses = [];
      globalBranchCounter = 0;

      const count = params.neuronCount;
      const centerDist = 130;

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const radius = 60 + Math.random() * centerDist;
        const nx = 400 + Math.cos(angle) * radius;
        const ny = 400 + Math.sin(angle) * radius;

        neurons.push({ id: i, x: nx, y: ny });

        // Seed 3-5 primary branches per neuron
        const branchCount = 3 + Math.floor(Math.random() * 3);
        for (let j = 0; j < branchCount; j++) {
          const bAngle = angle + ((j / branchCount) * Math.PI * 1.5 - Math.PI * 0.75) + (Math.random() - 0.5) * 0.4;
          const maxLen = params.maxBranchLength * (0.8 + Math.random() * 0.4);
          const branch = new Branch(i, nx, ny, bAngle, 1, maxLen, Math.random() < 0.2);
          allBranches.push(branch);
        }
      }
    }

    function clearSimulation() {
      neurons = [];
      allBranches = [];
      synapses = [];
      pulses = [];
      ctx.fillStyle = params.bgColor;
      ctx.fillRect(0, 0, 800, 800);
    }

    function updateSynapses() {
      // Connect tips or points that are close enough from different neurons
      const activeEndpoints = [];
      for (let i = 0; i < allBranches.length; i++) {
        const b = allBranches[i];
        if (b.points.length > 2) {
          activeEndpoints.push({
            pt: b.points[b.points.length - 1],
            branch: b
          });
        }
      }

      for (let i = 0; i < activeEndpoints.length; i++) {
        for (let j = i + 1; j < activeEndpoints.length; j++) {
          const e1 = activeEndpoints[i];
          const e2 = activeEndpoints[j];

          if (e1.branch.neuronId !== e2.branch.neuronId) {
            const dist = Math.hypot(e1.pt.x - e2.pt.x, e1.pt.y - e2.pt.y);
            if (dist < params.synapseDistance) {
              const exists = synapses.some(s => 
                (s.b1 === e1.branch && s.b2 === e2.branch) || 
                (s.b1 === e2.branch && s.b2 === e1.branch)
              );
              if (!exists && synapses.length < 80) {
                synapses.push(new Synapse(e1.pt, e2.pt, e1.branch, e2.branch));
              }
            }
          }
        }
      }
    }

    let lastTime = performance.now();
    let pulseTimer = 0;

    function render(currentTime) {
      requestAnimationFrame(render);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      if (isPaused) return;

      // Draw Background & Atmosphere
      ctx.fillStyle = params.bgColor;
      ctx.fillRect(0, 0, 800, 800);

      // Deep central glow
      const radialGlow = ctx.createRadialGradient(400, 400, 40, 400, 400, 450);
      radialGlow.addColorStop(0, '#101a3a');
      radialGlow.addColorStop(0.85, 'rgba(5, 7, 15, 0)');
      ctx.fillStyle = radialGlow;
      ctx.fillRect(0, 0, 800, 800);

      // Draw subtle background grid
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      ctx.beginPath();
      for (let x = gridSize; x < 800; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 800);
      }
      for (let y = gridSize; y < 800; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(800, y);
      }
      ctx.stroke();

      // Update Growth
      allBranches.forEach(b => b.grow(dt));

      // Periodic check for synapses
      if (Math.random() < 0.25) {
        updateSynapses();
      }

      // Draw Branches using smooth quadratic segments
      for (let b of allBranches) {
        if (b.points.length < 2) continue;

        ctx.save();
        const strokeColor = b.isAccent ? params.accentBranchColor : params.branchColor;
        ctx.strokeStyle = strokeColor;
        ctx.shadowColor = strokeColor;
        ctx.shadowBlur = 9;
        ctx.lineWidth = b.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(b.points[0].x, b.points[0].y);

        for (let i = 1; i < b.points.length - 1; i++) {
          const xc = (b.points[i].x + b.points[i + 1].x) / 2;
          const yc = (b.points[i].y + b.points[i + 1].y) / 2;
          ctx.quadraticCurveTo(b.points[i].x, b.points[i].y, xc, yc);
        }

        const last = b.points[b.points.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
        ctx.restore();
      }

      // Draw Soma / Neuron Centers
      for (let n of neurons) {
        ctx.save();
        ctx.shadowColor = params.accentBranchColor;
        ctx.shadowBlur = 25;
        ctx.fillStyle = params.accentBranchColor;
        ctx.beginPath();
        ctx.arc(n.x, n.y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(n.x, n.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Synapses
      const timeSec = currentTime * 0.001;
      synapses.forEach(s => s.draw(timeSec));

      // Pulse Spawning Logic
      pulseTimer += dt;
      if (pulseTimer > (1.1 - params.pulseFrequency)) {
        pulseTimer = 0;
        if (allBranches.length > 0) {
          const rootBranches = allBranches.filter(b => b.depth === 1);
          if (rootBranches.length > 0) {
            const picked = rootBranches[Math.floor(Math.random() * rootBranches.length)];
            pulses.push(new Pulse(picked));
          }
        }
      }

      // Update & Draw Pulses
      for (let i = pulses.length - 1; i >= 0; i--) {
        const p = pulses[i];
        p.update(dt);
        p.draw();
        if (p.dead) {
          pulses.splice(i, 1);
        }
      }

      // Gritty scanline and dark vignette overlay
      ctx.save();
      ctx.fillStyle = 'rgba(0, 229, 255, 0.015)';
      for (let y = 0; y < 800; y += 4) {
        ctx.fillRect(0, y, 800, 1.5);
      }

      // Vignette
      const vignette = ctx.createRadialGradient(400, 400, 280, 400, 400, 420);
      vignette.addColorStop(0, 'rgba(5, 7, 15, 0)');
      vignette.addColorStop(1, 'rgba(3, 4, 8, 0.85)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, 800, 800);
      ctx.restore();
    }

    // Start Simulation
    initNetwork();
    requestAnimationFrame(render);
  </script>
</body>
</html>
