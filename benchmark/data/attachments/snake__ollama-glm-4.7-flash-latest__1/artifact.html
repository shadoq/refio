<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            border: 3px solid #7c3aed;
            border-radius: 5px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 200px;
        }

        .score-board {
            margin-bottom: 20px;
        }

        .score-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .game-mode-select {
            margin-bottom: 20px;
        }

        .game-mode-select label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
        }

        .game-mode-select select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #7c3aed;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        .controls-info {
            margin-top: 20px;
        }

        .controls-info h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #7c3aed;
        }

        .controls-info p {
            font-size: 0.85rem;
            color: #a0a0a0;
            margin: 5px 0;
        }

        .controls-info kbd {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            font-family: monospace;
            margin: 0 3px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #a0a0a0;
        }

        .start-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.5);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .win-message {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .win-message span {
            color: #7c3aed;
        }
    </style>
