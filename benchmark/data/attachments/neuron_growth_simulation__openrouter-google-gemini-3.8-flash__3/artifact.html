<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Neural Network Growth Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 800px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.15), 0 0 20px rgba(16, 26, 58, 0.8);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
        canvas {
            display: block;
            width: 800px;
            height: 800px;
            background-color: #05070f;
        }
        /* Custom dat.GUI styling */
        .dg.ac {
            z-index: 100 !important;
        }
        .dg {
            color: #ffd400 !important;
            text-shadow: 0 0 3px rgba(255, 212, 0, 0.5) !important;
        }
        .dg.main {
            border: 1px solid rgba(0, 229, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15) !important;
        }
        .dg .c .slider {
            background: #101a3a !important;
        }
        .dg .c .slider:hover {
            background: #182756 !important;
        }
        .dg .c .slider-fg {
            background: #00e5ff !important;
        }
        .dg .cr.function:hover, .dg .cr.boolean:hover {
            background: #101a3a !important;
        }
        .dg .property-name {
            font-size: 11px !important;
        }
    </style>
    <!-- dat.gui CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="800"></canvas>
    </div>

    <script>
        // Parameters configuration
        const params = {
            // Growth
            neuronCount: 4,
            growthSpeed: 1.8,
            maxDepth: 4,
            splitChance: 0.035,
            curvature: 0.12,
            maxBranchLength: 140,
            
            // Synapses
            synapseDistance: 42,
            synapseGlow: 15,
            
            // Pulses
            pulseSpeed: 3.5,
            pulseFrequency: 0.05,
            pulseBrightness: 25,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            showScanlines: true,
            
            // Actions
            regenerate: () => initNetwork(),
            clear: () => clearSimulation(),
            togglePause: () => togglePause()
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 800;
        const HEIGHT = 800;

        let isPaused = false;
        let branches = [];
        let activeTips = [];
        let synapses = [];
        let pulses = [];
        let neurons = [];

        class Neuron {
            constructor(x, y, id) {
                this.x = x;
                this.y = y;
                this.id = id;
                this.radius = 4 + Math.random() * 3;
            }

            draw(context) {
                context.save();
                context.shadowColor = params.accentColor;
                context.shadowBlur = 12;
                context.fillStyle = params.accentColor;
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fill();

                context.shadowColor = params.branchColor;
                context.shadowBlur = 20;
                context.strokeStyle = params.branchColor;
                context.lineWidth = 1.5;
                context.beginPath();
                context.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
                context.stroke();
                context.restore();
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, neuronId, isAccent = false) {
                this.startX = startX;
                this.startY = startY;
                this.currentX = startX;
                this.currentY = startY;
                this.angle = angle;
                this.depth = depth;
                this.neuronId = neuronId;
                this.isAccent = isAccent;
                this.thickness = Math.max(1, (params.maxDepth - depth + 1) * 0.9);
                this.length = 0;
                this.targetLength = (params.maxBranchLength * 0.5) + Math.random() * (params.maxBranchLength * 0.5);
                this.points = [{ x: startX, y: startY }];
                this.completed = false;
                this.children = [];
            }

            step() {
                if (this.completed) return false;

                // Adjust angle organically
                this.angle += (Math.random() - 0.5) * params.curvature;
                const stepSize = params.growthSpeed;

                const nextX = this.currentX + Math.cos(this.angle) * stepSize;
                const nextY = this.currentY + Math.sin(this.angle) * stepSize;

                // Canvas boundaries bounce/halt
                if (nextX < 20 || nextX > WIDTH - 20 || nextY < 20 || nextY > HEIGHT - 20) {
                    this.completed = true;
                    return false;
                }

                this.currentX = nextX;
                this.currentY = nextY;
                this.length += stepSize;
                this.points.push({ x: nextX, y: nextY });

                // Check branching opportunity
                if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                    const splitAngle1 = this.angle + 0.35 + (Math.random() * 0.4);
                    const splitAngle2 = this.angle - 0.35 - (Math.random() * 0.4);
                    
                    const branchAccent = Math.random() < 0.25;
                    const child = new Branch(this.currentX, this.currentY, splitAngle1, this.depth + 1, this.neuronId, branchAccent);
                    activeTips.push(child);
                    branches.push(child);
                    this.children.push(child);

                    // Sometimes bifurcation
                    if (Math.random() < 0.6) {
                        const child2 = new Branch(this.currentX, this.currentY, splitAngle2, this.depth + 1, this.neuronId, !branchAccent && Math.random() < 0.3);
                        activeTips.push(child2);
                        branches.push(child2);
                        this.children.push(child2);
                        this.completed = true;
                        return false;
                    }
                }

                if (this.length >= this.targetLength) {
                    this.completed = true;
                    // End point side branch if depth allows
                    if (this.depth < params.maxDepth && Math.random() < 0.7) {
                        const childAngle = this.angle + (Math.random() - 0.5) * 1.2;
                        const child = new Branch(this.currentX, this.currentY, childAngle, this.depth + 1, this.neuronId, Math.random() < 0.3);
                        activeTips.push(child);
                        branches.push(child);
                        this.children.push(child);
                    }
                    return false;
                }

                return true;
            }

            draw(context) {
                if (this.points.length < 2) return;

                context.save();
                context.strokeStyle = this.isAccent ? params.accentColor : params.branchColor;
                context.shadowColor = this.isAccent ? params.accentColor : params.branchColor;
                context.shadowBlur = this.isAccent ? 10 : 8;
                context.lineWidth = this.thickness;
                context.lineCap = 'round';
                context.lineJoin = 'round';

                context.beginPath();
                context.moveTo(this.points[0].x, this.points[0].y);

                for (let i = 1; i < this.points.length - 1; i++) {
                    const xc = (this.points[i].x + this.points[i + 1].x) / 2;
                    const yc = (this.points[i].y + this.points[i + 1].y) / 2;
                    context.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
                }

                if (this.points.length > 1) {
                    const last = this.points[this.points.length - 1];
                    context.lineTo(last.x, last.y);
                }

                context.stroke();
                context.restore();
            }
        }

        class Synapse {
            constructor(p1, p2, b1, b2) {
                this.p1 = p1;
                this.p2 = p2;
                this.b1 = b1;
                this.b2 = b2;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                this.phase += 0.04;
            }

            draw(context) {
                const pulseScale = (Math.sin(this.phase) + 1) * 0.5;
                const glow = params.synapseGlow * (0.6 + 0.4 * pulseScale);

                context.save();
                context.strokeStyle = params.synapseColor;
                context.shadowColor = params.synapseColor;
                context.shadowBlur = glow;
                context.lineWidth = 1.2;

                // Subtle dashed bridge line
                context.setLineDash([3, 3]);
                context.beginPath();
                context.moveTo(this.p1.x, this.p1.y);
                context.lineTo(this.p2.x, this.p2.y);
                context.stroke();
                context.setLineDash([]);

                // Synaptic junction nodes
                context.fillStyle = '#ffffff';
                context.beginPath();
                context.arc(this.p1.x, this.p1.y, 2.2, 0, Math.PI * 2);
                context.arc(this.p2.x, this.p2.y, 2.2, 0, Math.PI * 2);
                context.fill();

                context.restore();
            }
        }

        class Pulse {
            constructor(branch) {
                this.branch = branch;
                this.progress = 0; // index inside points array
                this.speed = params.pulseSpeed;
                this.dead = false;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= this.branch.points.length - 1) {
                    // Check if synapse can jump or child branch
                    const currentPos = this.branch.points[this.branch.points.length - 1];
                    let jumped = false;

                    // Chance to jump through synapse
                    for (let s of synapses) {
                        const dist1 = Math.hypot(s.p1.x - currentPos.x, s.p1.y - currentPos.y);
                        const dist2 = Math.hypot(s.p2.x - currentPos.x, s.p2.y - currentPos.y);

                        if (dist1 < 6 && s.b2 && s.b2.points.length > 5) {
                            this.branch = s.b2;
                            this.progress = 0;
                            jumped = true;
                            break;
                        } else if (dist2 < 6 && s.b1 && s.b1.points.length > 5) {
                            this.branch = s.b1;
                            this.progress = 0;
                            jumped = true;
                            break;
                        }
                    }

                    if (!jumped) {
                        if (this.branch.children.length > 0) {
                            const nextBranch = this.branch.children[Math.floor(Math.random() * this.branch.children.length)];
                            this.branch = nextBranch;
                            this.progress = 0;
                        } else {
                            this.dead = true;
                        }
                    }
                }
            }

            draw(context) {
                const idx = Math.floor(this.progress);
                if (idx < 0 || idx >= this.branch.points.length) return;

                const pt = this.branch.points[idx];
                context.save();
                context.fillStyle = '#ffffff';
                context.shadowColor = params.pulseColor;
                context.shadowBlur = params.pulseBrightness;

                context.beginPath();
                context.arc(pt.x, pt.y, 2.8, 0, Math.PI * 2);
                context.fill();

                context.fillStyle = params.pulseColor;
                context.beginPath();
                context.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }
        }

        function checkSynapses() {
            // Check connections between close branches from different neurons or sufficiently spaced branches
            if (branches.length < 2) return;

            const sampleCandidate = activeTips.length > 0 
                ? activeTips[Math.floor(Math.random() * activeTips.length)] 
                : branches[Math.floor(Math.random() * branches.length)];

            if (!sampleCandidate || sampleCandidate.points.length === 0) return;
            const tipPoint = sampleCandidate.points[sampleCandidate.points.length - 1];

            for (let i = 0; i < branches.length; i++) {
                const target = branches[i];
                if (target === sampleCandidate) continue;

                // Check distance against multiple points of the other branch
                const checkStep = Math.max(1, Math.floor(target.points.length / 5));
                for (let j = 0; j < target.points.length; j += checkStep) {
                    const pt = target.points[j];
                    const dx = tipPoint.x - pt.x;
                    const dy = tipPoint.y - pt.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 8 && dist <= params.synapseDistance) {
                        // Check if synapse already exists near these points
                        const exists = synapses.some(s => 
                            (Math.hypot(s.p1.x - tipPoint.x, s.p1.y - tipPoint.y) < 15 && Math.hypot(s.p2.x - pt.x, s.p2.y - pt.y) < 15) ||
                            (Math.hypot(s.p2.x - tipPoint.x, s.p2.y - tipPoint.y) < 15 && Math.hypot(s.p1.x - pt.x, s.p1.y - pt.y) < 15)
                        );

                        if (!exists && synapses.length < 120) {
                            synapses.push(new Synapse(tipPoint, pt, sampleCandidate, target));
                            return;
                        }
                    }
                }
            }
        }

        function initNetwork() {
            branches = [];
            activeTips = [];
            synapses = [];
            pulses = [];
            neurons = [];

            const count = Math.round(params.neuronCount);
            const centerMargin = 220;

            for (let i = 0; i < count; i++) {
                // Generate around center with organic distribution
                const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                const radius = 60 + Math.random() * 140;
                const nx = WIDTH / 2 + Math.cos(angle) * radius;
                const ny = HEIGHT / 2 + Math.sin(angle) * radius;

                const neuron = new Neuron(nx, ny, i);
                neurons.push(neuron);

                // Initial primary branches
                const branchCount = 3 + Math.floor(Math.random() * 3);
                for (let b = 0; b < branchCount; b++) {
                    const bAngle = angle + (b - (branchCount - 1) / 2) * (Math.PI / 3) + (Math.random() - 0.5) * 0.4;
                    const isAccent = Math.random() < 0.2;
                    const branch = new Branch(nx, ny, bAngle, 1, i, isAccent);
                    branches.push(branch);
                    activeTips.push(branch);
                }
            }
        }

        function clearSimulation() {
            branches = [];
            activeTips = [];
            synapses = [];
            pulses = [];
            neurons = [];
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        function drawBackground() {
            // Main solid background
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Subtle neon radial glow
            const radialGrad = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, 50, WIDTH / 2, HEIGHT / 2, 500);
            radialGrad.addColorStop(0, '#101a3a');
            radialGrad.addColorStop(0.6, '#080d20');
            radialGrad.addColorStop(1, '#05070f');
            ctx.fillStyle = radialGrad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Dark grid overlay
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            ctx.beginPath();
            for (let x = 0; x <= WIDTH; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
            }
            for (let y = 0; y <= HEIGHT; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
            }
            ctx.stroke();

            // Scanlines effect
            if (params.showScanlines) {
                ctx.fillStyle = 'rgba(0, 229, 255, 0.025)';
                for (let y = 0; y < HEIGHT; y += 4) {
                    ctx.fillRect(0, y, WIDTH, 1);
                }
            }
        }

        function update() {
            if (isPaused) return;

            // Growth iteration
            if (activeTips.length > 0) {
                for (let i = activeTips.length - 1; i >= 0; i--) {
                    const tip = activeTips[i];
                    const growing = tip.step();
                    if (!growing && tip.completed) {
                        activeTips.splice(i, 1);
                    }
                }

                // Check for synaptic formation occasionally
                if (Math.random() < 0.6) {
                    checkSynapses();
                }
            }

            // Update synapses
            for (let i = 0; i < synapses.length; i++) {
                synapses[i].update();
            }

            // Trigger pulses
            if (branches.length > 0 && Math.random() < params.pulseFrequency) {
                const randBranch = branches[Math.floor(Math.random() * branches.length)];
                if (randBranch.points.length > 5) {
                    pulses.push(new Pulse(randBranch));
                }
            }

            // Update pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update();
                if (pulses[i].dead) {
                    pulses.splice(i, 1);
                }
            }
        }

        function render() {
            drawBackground();

            // Draw branches
            for (let i = 0; i < branches.length; i++) {
                branches[i].draw(ctx);
            }

            // Draw synapses
            for (let i = 0; i < synapses.length; i++) {
                synapses[i].draw(ctx);
            }

            // Draw pulses
            for (let i = 0; i < pulses.length; i++) {
                pulses[i].draw(ctx);
            }

            // Draw neuron bodies
            for (let i = 0; i < neurons.length; i++) {
                neurons[i].draw(ctx);
            }

            // Vignette edge blur / dark vignette
            const vignette = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, 300, WIDTH / 2, HEIGHT / 2, 450);
            vignette.addColorStop(0, 'rgba(5, 7, 15, 0)');
            vignette.addColorStop(1, 'rgba(5, 7, 15, 0.7)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // GUI Setup
        const gui = new dat.GUI({ autoPlace: true, width: 280 });

        // Growth Folder
        const fGrowth = gui.addFolder('Growth');
        fGrowth.add(params, 'neuronCount', 2, 7, 1).name('Neuron Count');
        fGrowth.add(params, 'growthSpeed', 0.5, 5.0, 0.1).name('Growth Speed');
        fGrowth.add(params, 'maxDepth', 1, 6, 1).name('Max Depth');
        fGrowth.add(params, 'splitChance', 0.01, 0.1, 0.005).name('Split Chance');
        fGrowth.add(params, 'curvature', 0.02, 0.35, 0.01).name('Curvature');
        fGrowth.add(params, 'maxBranchLength', 40, 260, 5).name('Max Branch Len');
        fGrowth.open();

        // Synapses Folder
        const fSynapses = gui.addFolder('Synapses');
        fSynapses.add(params, 'synapseDistance', 15, 90, 1).name('Distance Thresh');
        fSynapses.add(params, 'synapseGlow', 2, 35, 1).name('Glow Strength');
        fSynapses.open();

        // Pulses Folder
        const fPulses = gui.addFolder('Pulses');
        fPulses.add(params, 'pulseSpeed', 1.0, 8.0, 0.5).name('Pulse Speed');
        fPulses.add(params, 'pulseFrequency', 0.01, 0.25, 0.01).name('Frequency');
        fPulses.add(params, 'pulseBrightness', 5, 45, 1).name('Brightness');
        fPulses.open();

        // Visuals Folder
        const fVisuals = gui.addFolder('Visuals');
        fVisuals.addColor(params, 'bgColor').name('Background');
        fVisuals.addColor(params, 'branchColor').name('Branch Color');
        fVisuals.addColor(params, 'accentColor').name('Accent Branch');
        fVisuals.addColor(params, 'synapseColor').name('Synapse Color');
        fVisuals.addColor(params, 'pulseColor').name('Pulse Color');
        fVisuals.add(params, 'showScanlines').name('Scanlines');
        fVisuals.open();

        // Action Buttons
        gui.add(params, 'regenerate').name('⚡ Regenerate');
        gui.add(params, 'clear').name('✖ Clear Canvas');
        gui.add(params, 'togglePause').name('⏯ Pause / Resume');

        // Start initial simulation
        initNetwork();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
