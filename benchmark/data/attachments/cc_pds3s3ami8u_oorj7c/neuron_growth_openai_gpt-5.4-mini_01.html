<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Neuron Growth</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    width: 800px;
    height: 800px;
    background: radial-gradient(circle at center, #101a3a 0%, #05070f 72%);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.12);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const TAU = Math.PI * 2;

  const P = {
    neuronCount: 5,
    branchGrowthSpeed: 70,
    maxBranchDepth: 6,
    branchSplitChance: 0.16,
    branchCurvature: 0.32,
    maxBranchLength: 120,
    synapseDistanceThreshold: 26,
    synapseGlowStrength: 1.2,
    pulseSpeed: 0.36,
    pulseFrequency: 0.9,
    pulseBrightness: 1.2,
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a'
  };

  let neurons = [], synapses = [], pulses = [], paused = false, t = 0, clearNext = false;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  function makeNeuron(id, x, y) {
    const angle = rand(0, TAU);
    return {
      id, x, y,
      roots: [],
      branchCount: 0,
      seedAngle: angle
    };
  }

  function makeBranch(neuron, x, y, angle, depth, parent = null) {
    return {
      neuron,
      x, y,
      px: x, py: y,
      angle,
      depth,
      parent,
      len: 0,
      targetLen: rand(P.maxBranchLength * 0.45, P.maxBranchLength),
      width: rand(Math.max(0.8, 2.2 - depth * 0.18), Math.max(1.4, 3.8 - depth * 0.2)),
      points: [{ x, y }],
      alive: true,
      splitDone: false,
      lastSplitAt: 0
    };
  }

  function regenerate() {
    neurons = [];
    synapses = [];
    pulses = [];
    const count = Math.floor(rand(3, 7));
    for (let i = 0; i < count; i++) {
      const x = W * 0.5 + rand(-50, 50);
      const y = H * 0.5 + rand(-50, 50);
      const n = makeNeuron(i, x, y);
      neurons.push(n);
      const branches = 1 + Math.floor(rand(1, 3));
      for (let j = 0; j < branches; j++) {
        const a = n.seedAngle + rand(-0.9, 0.9) + (j / branches) * TAU * 0.5;
        n.roots.push(makeBranch(n, x, y, a, 0));
      }
    }
  }

  function addSplit(branch) {
    if (branch.depth >= P.maxBranchDepth) return;
    if (branch.neuron.branchCount > 160) return;
    if (Math.random() > P.branchSplitChance) return;
    branch.splitDone = true;
    const forks = Math.random() < 0.5 ? 1 : 2;
    for (let i = 0; i < forks; i++) {
      const delta = rand(-0.8, 0.8) + (i ? rand(0.2, 0.6) : 0);
      branch.neuron.roots.push(makeBranch(
        branch.neuron,
        branch.x, branch.y,
        branch.angle + delta,
        branch.depth + 1,
        branch
      ));
      branch.neuron.branchCount++;
    }
  }

  function updateBranch(b, dt) {
    if (!b.alive) return;
    const step = P.branchGrowthSpeed * dt * rand(0.85, 1.15);
    b.px = b.x; b.py = b.y;
    b.len += step;
    const f = clamp(b.len / b.targetLen, 0, 1);
    const curve = (Math.sin((b.len * 0.08) + b.depth) * 0.5 + 0.5) * P.branchCurvature;
    b.angle += rand(-1, 1) * 0.015 + curve * 0.03;
    const nx = b.x + Math.cos(b.angle) * step;
    const ny = b.y + Math.sin(b.angle) * step;
    b.x = nx; b.y = ny;
    b.points.push({ x: nx, y: ny });
    if (b.points.length > 10) b.points.shift();
    if (!b.splitDone && f > 0.35) addSplit(b);
    if (b.len >= b.targetLen) {
      b.alive = false;
      addSplit(b);
    }
  }

  function branchTips() {
    const tips = [];
    for (const n of neurons) for (const b of n.roots) if (b.points.length) tips.push(b);
    return tips;
  }

  function addSynapse(a, b) {
    for (const s of synapses) {
      if ((s.a === a && s.b === b) || (s.a === b && s.b === a)) return;
    }
    synapses.push({ a, b, age: 0, phase: Math.random() * TAU });
    if (synapses.length > 120) synapses.shift();
  }

  function updateSynapses(dt) {
    const tips = branchTips();
    const th = P.synapseDistanceThreshold;
    const th2 = th * th;
    for (let i = 0; i < tips.length; i++) {
      for (let j = i + 1; j < tips.length; j++) {
        const a = tips[i], b = tips[j];
        if (a.neuron === b.neuron) continue;
        if (dist2(a.x, a.y, b.x, b.y) < th2) addSynapse(a, b);
      }
    }
    for (const s of synapses) s.age += dt;
  }

  function updatePulses(dt) {
    if (Math.random() < P.pulseFrequency * dt * 0.7 && synapses.length) {
      const s = synapses[(Math.random() * synapses.length) | 0];
      pulses.push({ s, u: 0, dir: Math.random() < 0.5 ? 1 : -1, life: 0 });
    }
    for (const p of pulses) {
      p.life += dt;
      p.u += P.pulseSpeed * dt * p.dir;
    }
    pulses = pulses.filter(p => p.life < 2.5);
  }

  function drawGlowLine(x1, y1, x2, y2, color, width, alpha) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawBranch(b) {
    const pts = b.points;
    if (pts.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let pass = 0; pass < 3; pass++) {
      ctx.shadowBlur = pass === 0 ? 0 : 18 + pass * 6;
      ctx.shadowColor = pass < 2 ? P.branchColor : P.accentBranchColor;
      ctx.strokeStyle = pass < 2 ? P.branchColor : P.accentBranchColor;
      ctx.globalAlpha = pass === 0 ? 0.95 : 0.25;
      ctx.lineWidth = Math.max(0.6, b.width * (pass === 0 ? 1 : 1.7 - pass * 0.2));
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i];
        const mx = (p0.x + p1.x) * 0.5, my = (p0.y + p1.y) * 0.5;
        ctx.quadraticCurveTo(p0.x, p0.y, mx, my);
      }
      const last = pts[pts.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
    }
  }

  function drawSynapse(s) {
    const a = s.a, b = s.b;
    const pulse = (Math.sin(t * 3 + s.phase) * 0.5 + 0.5);
    const glow = P.synapseGlowStrength * (0.4 + pulse * 0.8);
    ctx.lineCap = 'round';
    ctx.shadowColor = P.synapseColor;
    ctx.shadowBlur = 22 * glow;
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = P.synapseColor;
    ctx.lineWidth = 1.1 + glow;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo((a.x + b.x) * 0.5 + Math.sin(s.phase) * 10, (a.y + b.y) * 0.5 + Math.cos(s.phase) * 10, b.x, b.y);
    ctx.stroke();
  }

  function drawPulse(p) {
    const s = p.s;
    const t01 = clamp((p.u + 1) * 0.5, 0, 1);
    const x = s.a.x + (s.b.x - s.a.x) * t01;
    const y = s.a.y + (s.b.y - s.a.y) * t01;
    ctx.shadowColor = P.pulseColor;
    ctx.shadowBlur = 24;
    ctx.globalAlpha = 0.9 * P.pulseBrightness;
    ctx.fillStyle = P.pulseColor;
    ctx.beginPath();
    ctx.arc(x, y, 2.4 + 2 * Math.sin(p.life * 8), 0, TAU);
    ctx.fill();
  }

  function drawBackground() {
    ctx.fillStyle = P.backgroundColor;
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.5, H * 0.5, 60, W * 0.5, H * 0.5, 420);
    g.addColorStop(0, 'rgba(16,26,58,0.8)');
    g.addColorStop(1, 'rgba(5,7,15,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,229,255,0.06)';
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = 'rgba(0,229,255,0.03)';
    for (let x = 0; x < W; x += 40) ctx.fillRect(x, 0, 1, H);
  }

  function drawUIEffects() {
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 250, W * 0.5, H * 0.5, 520);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function animate(now) {
    requestAnimationFrame(animate);
    if (clearNext) {
      ctx.clearRect(0, 0, W, H);
      clearNext = false;
    }
    const dt = Math.min(0.033, (now - (animate.last || now)) / 1000);
    animate.last = now;
    if (!paused) {
      t += dt;
      for (const n of neurons) {
        n.branchCount = n.roots.length;
        for (const b of n.roots) updateBranch(b, dt);
      }
      updateSynapses(dt);
      updatePulses(dt);
    }
    drawBackground();
    for (const n of neurons) for (const b of n.roots) drawBranch(b);
    for (const s of synapses) drawSynapse(s);
    for (const p of pulses) drawPulse(p);
    drawUIEffects();
  }

  const gui = new dat.GUI({ width: 320 });
  const growth = gui.addFolder('Growth');
  growth.add(P, 'neuronCount', 3, 6, 1).name('neuron count');
  growth.add(P, 'branchGrowthSpeed', 20, 150, 1).name('branch growth speed');
  growth.add(P, 'maxBranchDepth', 2, 10, 1).name('max branch depth');
  growth.add(P, 'branchSplitChance', 0.02, 0.5, 0.01).name('branch split chance');
  growth.add(P, 'branchCurvature', 0, 1, 0.01).name('branch curvature');
  growth.add(P, 'maxBranchLength', 30, 220, 1).name('max branch length');
  growth.add({ regenerateNetwork: regenerate, clearCanvas: () => { clearNext = true; }, pauseResumeAnimation: () => { paused = !paused; } }, 'regenerateNetwork').name('regenerate network');
  growth.add({ clearCanvas: () => { clearNext = true; } }, 'clearCanvas').name('clear canvas');
  growth.add({ pauseResumeAnimation: () => { paused = !paused; } }, 'pauseResumeAnimation').name('pause/resume animation');
  const syn = gui.addFolder('Synapses');
  syn.add(P, 'synapseDistanceThreshold', 6, 60, 1).name('synapse distance threshold');
  syn.add(P, 'synapseGlowStrength', 0, 3, 0.01).name('synapse glow strength');
  const pulses = gui.addFolder('Pulses');
  pulses.add(P, 'pulseSpeed', 0.05, 1, 0.01).name('pulse speed');
  pulses.add(P, 'pulseFrequency', 0, 5, 0.01).name('pulse frequency');
  pulses.add(P, 'pulseBrightness', 0, 3, 0.01).name('pulse brightness');
  const vis = gui.addFolder('Visuals');
  vis.addColor(P, 'backgroundColor').name('background color');
  vis.addColor(P, 'branchColor').name('branch color');
  vis.addColor(P, 'accentBranchColor').name('accent branch color');
  vis.addColor(P, 'synapseColor').name('synapse color');
  vis.addColor(P, 'pulseColor').name('pulse color');
  growth.open(); syn.open(); pulses.open(); vis.open();

  regenerate();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
