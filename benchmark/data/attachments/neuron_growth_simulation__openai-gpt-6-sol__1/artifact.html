<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Bloom</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: #05070f;
      color: #ffd400;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: #05070f;
    }

    main {
      width: min(800px, 100%);
    }

    header,
    footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    header {
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    header span,
    footer {
      color: rgba(255, 212, 0, 0.56);
    }

    footer {
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 0.17em;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #05070f;
      border: 1px solid rgba(255, 212, 0, 0.25);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.09), 0 0 80px #101a3a;
    }

    .dg.ac {
      z-index: 10;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 310px;
      }

      header,
      footer {
        font-size: 9px;
      }

      .dg.ac {
        width: min(300px, 100%) !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header><strong>Neural Bloom</strong><span>Growth / Connection / Signal</span></header>
    <canvas id="network" width="800" height="800" aria-label="Animated neon neuron network"></canvas>
    <footer><span id="status">Growing network</span><span>800 × 800 / Live simulation</span></footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("network");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");
      const size = 800;
      const maxSegments = 700;
      const maxFrontiers = 110;
      const maxConnections = 70;
      const maxPulses = 22;

      const settings = {
        neuronCount: 4,
        growthSpeed: 125,
        maxDepth: 4,
        splitChance: 0.52,
        curvature: 0.25,
        maxBranchLength: 95,
        synapseDistance: 42,
        synapseGlow: 22,
        pulseSpeed: 155,
        pulseFrequency: 2.8,
        pulseBrightness: 1.5,
        backgroundColor: "#05070f",
        branchColor: "#00e5ff",
        accentBranchColor: "#d6ff00",
        synapseColor: "#ff2bd6",
        pulseColor: "#fff36a"
      };

      let neurons = [];
      let nodes = [];
      let segments = [];
      let frontiers = [];
      let synapses = [];
      let synapsePairs = new Set();
      let pulses = [];
      let paused = false;
      let cleared = false;
      let clock = 0;
      let growthAccumulator = 0;
      let pulseAccumulator = 0;
      let lastFrame = 0;
      let nextNodeId = 0;

      const random = (min, max) => min + Math.random() * (max - min);

      // Network setup
      function addNode(x, y, owner, parent = null, segment = null) {
        const node = { id: nextNodeId++, x, y, owner, parent, segment, links: 0 };
        nodes.push(node);
        return node;
      }

      function addFrontier(node, angle, depth, width) {
        if (frontiers.length >= maxFrontiers || segments.length >= maxSegments) return;
        frontiers.push({
          node,
          angle,
          depth,
          width,
          remaining: random(settings.maxBranchLength * 0.55, settings.maxBranchLength)
        });
      }

      function regenerate() {
        neurons = [];
        nodes = [];
        segments = [];
        frontiers = [];
        synapses = [];
        synapsePairs = new Set();
        pulses = [];
        nextNodeId = 0;
        clock = 0;
        growthAccumulator = 0;
        pulseAccumulator = 0.8;
        paused = false;
        cleared = false;

        for (let i = 0; i < settings.neuronCount; i++) {
          const angle = (i / settings.neuronCount) * Math.PI * 2 + random(-0.35, 0.35);
          const radius = random(16, 65);
          const root = addNode(
            400 + Math.cos(angle) * radius,
            400 + Math.sin(angle) * radius,
            i
          );
          neurons.push(root);

          const arms = Math.floor(random(3, 6));
          for (let j = 0; j < arms; j++) {
            addFrontier(root, (j / arms) * Math.PI * 2 + random(-0.4, 0.4), 0, random(1.7, 2.8));
          }
        }

        status.textContent = "Growing network";
      }

      function clearNetwork() {
        neurons = [];
        nodes = [];
        segments = [];
        frontiers = [];
        synapses = [];
        synapsePairs = new Set();
        pulses = [];
        growthAccumulator = 0;
        pulseAccumulator = 0;
        cleared = true;
        status.textContent = "Canvas cleared";
      }

      // Controls
      function setupGUI() {
        if (typeof dat === "undefined") return;
        const gui = new dat.GUI({ width: 300 });
        const growth = gui.addFolder("Growth");
        growth.add(settings, "neuronCount", 3, 6, 1).name("neuron count").onFinishChange(regenerate);
        growth.add(settings, "growthSpeed", 20, 280, 1).name("branch growth speed");
        growth.add(settings, "maxDepth", 1, 7, 1).name("max branch depth");
        growth.add(settings, "splitChance", 0, 1, 0.01).name("branch split chance");
        growth.add(settings, "curvature", 0, 0.8, 0.01).name("branch curvature");
        growth.add(settings, "maxBranchLength", 25, 160, 1).name("max branch length");

        const connections = gui.addFolder("Synapses");
        connections.add(settings, "synapseDistance", 10, 100, 1).name("distance threshold");
        connections.add(settings, "synapseGlow", 0, 50, 1).name("glow strength");

        const signals = gui.addFolder("Pulses");
        signals.add(settings, "pulseSpeed", 30, 400, 1).name("pulse speed");
        signals.add(settings, "pulseFrequency", 0, 12, 0.1).name("pulse frequency");
        signals.add(settings, "pulseBrightness", 0.2, 3, 0.1).name("pulse brightness");

        const visuals = gui.addFolder("Visuals");
        visuals.addColor(settings, "backgroundColor").name("background color");
        visuals.addColor(settings, "branchColor").name("branch color");
        visuals.addColor(settings, "accentBranchColor").name("accent branch color");
        visuals.addColor(settings, "synapseColor").name("synapse color");
        visuals.addColor(settings, "pulseColor").name("pulse color");

        const actions = {
          "regenerate network": regenerate,
          "clear canvas": clearNetwork,
          "pause/resume animation": () => {
            paused = !paused;
            status.textContent = cleared ? "Canvas cleared" : paused ? "Animation paused" :
              frontiers.length ? "Growing network" : "Signals active";
          }
        };
        gui.add(actions, "regenerate network");
        gui.add(actions, "clear canvas");
        gui.add(actions, "pause/resume animation");
        growth.open();
      }

      // Incremental growth and connections
      function detectSynapse(node) {
        if (synapses.length >= maxConnections || node.links >= 2) return;

        let nearest = null;
        let bestDistance = settings.synapseDistance;
        for (const other of nodes) {
          if (other.owner === node.owner || other.links >= 2) continue;
          const dx = node.x - other.x;
          const dy = node.y - other.y;
          const distance = Math.hypot(dx, dy);
          const key = Math.min(node.id, other.id) + ":" + Math.max(node.id, other.id);
          if (distance < bestDistance && !synapsePairs.has(key)) {
            nearest = other;
            bestDistance = distance;
          }
        }

        if (nearest) {
          const key = Math.min(node.id, nearest.id) + ":" + Math.max(node.id, nearest.id);
          synapsePairs.add(key);
          node.links++;
          nearest.links++;
          synapses.push({ a: node, b: nearest, phase: random(0, Math.PI * 2) });
        }
      }

      function growStep() {
        if (!frontiers.length || segments.length >= maxSegments) {
          frontiers.length = 0;
          return;
        }

        const tip = frontiers.shift();
        const step = Math.min(random(4.5, 7.5), tip.remaining);
        tip.angle += random(-1, 1) * settings.curvature * 0.45;
        const x = tip.node.x + Math.cos(tip.angle) * step;
        const y = tip.node.y + Math.sin(tip.angle) * step;
        if (x < 27 || x > 773 || y < 27 || y > 773 || step < 1) return;

        const bend = random(-1, 1) * settings.curvature * step * 0.65;
        const segment = {
          a: tip.node,
          b: null,
          cx: (tip.node.x + x) / 2 - Math.sin(tip.angle) * bend,
          cy: (tip.node.y + y) / 2 + Math.cos(tip.angle) * bend,
          width: Math.max(0.5, tip.width * random(0.88, 1.12)),
          accent: Math.random() < 0.19
        };
        const node = addNode(x, y, tip.node.owner, tip.node, segment);
        segment.b = node;
        segments.push(segment);
        detectSynapse(node);

        tip.node = node;
        tip.remaining -= step;
        tip.width = Math.max(0.55, tip.width * 0.995);

        if (tip.depth < settings.maxDepth &&
            Math.random() < settings.splitChance * 0.055 &&
            frontiers.length < maxFrontiers - 1) {
          addFrontier(node, tip.angle + random(0.4, 1.1) * (Math.random() < 0.5 ? -1 : 1),
            tip.depth + 1, tip.width * 0.7);
        }

        if (tip.remaining > 1) {
          frontiers.push(tip);
        } else if (tip.depth < settings.maxDepth) {
          addFrontier(node, tip.angle + random(-0.45, 0.45), tip.depth + 1, tip.width * 0.82);
          if (Math.random() < settings.splitChance) {
            addFrontier(node, tip.angle + random(0.55, 1.15) * (Math.random() < 0.5 ? -1 : 1),
              tip.depth + 1, tip.width * 0.7);
          }
        }
      }

      // Pulse paths follow parent segments in both trees
      function curvePoint(segment, t) {
        const u = 1 - t;
        return {
          x: u * u * segment.a.x + 2 * u * t * segment.cx + t * t * segment.b.x,
          y: u * u * segment.a.y + 2 * u * t * segment.cy + t * t * segment.b.y
        };
      }

      function makeRoute(connection) {
        const forward = Math.random() < 0.5;
        const source = forward ? connection.a : connection.b;
        const target = forward ? connection.b : connection.a;
        const ascending = [];
        const points = [];

        for (let node = source; node.parent; node = node.parent) ascending.push(node);
        const root = ascending.length ? ascending[ascending.length - 1].parent : source;
        points.push({ x: root.x, y: root.y });

        for (let i = ascending.length - 1; i >= 0; i--) {
          for (let j = 1; j <= 4; j++) points.push(curvePoint(ascending[i].segment, j / 4));
        }

        points.push({ x: target.x, y: target.y });
        for (let node = target; node.parent; node = node.parent) {
          for (let j = 3; j >= 0; j--) points.push(curvePoint(node.segment, j / 4));
        }

        const distances = [0];
        for (let i = 1; i < points.length; i++) {
          distances.push(distances[i - 1] + Math.hypot(
            points[i].x - points[i - 1].x,
            points[i].y - points[i - 1].y
          ));
        }
        return { points, distances, length: distances[distances.length - 1], travel: 0 };
      }

      function pointOnRoute(route, distance) {
        const d = Math.max(0, Math.min(distance, route.length));
        let low = 1;
        let high = route.distances.length - 1;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (route.distances[mid] < d) low = mid + 1;
          else high = mid;
        }
        const span = route.distances[low] - route.distances[low - 1];
        const t = span ? (d - route.distances[low - 1]) / span : 0;
        const a = route.points[low - 1];
        const b = route.points[low];
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }

      function updatePulses(dt) {
        if (synapses.length && settings.pulseFrequency > 0) {
          pulseAccumulator = Math.min(2, pulseAccumulator + dt * settings.pulseFrequency);
          while (pulseAccumulator >= 1) {
            pulseAccumulator--;
            if (pulses.length < maxPulses) {
              const connection = synapses[Math.floor(Math.random() * synapses.length)];
              pulses.push(makeRoute(connection));
            }
          }
        }

        for (const pulse of pulses) pulse.travel += settings.pulseSpeed * dt;
        pulses = pulses.filter(pulse => pulse.travel <= pulse.length + 12);
      }

      // Canvas rendering
      function drawBackground() {
        ctx.fillStyle = settings.backgroundColor;
        ctx.fillRect(0, 0, size, size);

        const glow = ctx.createRadialGradient(400, 400, 25, 400, 400, 540);
        glow.addColorStop(0, "#101a3a");
        glow.addColorStop(0.55, "rgba(16, 26, 58, 0.45)");
        glow.addColorStop(1, "rgba(16, 26, 58, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 40; i < size; i += 40) {
          ctx.moveTo(i + 0.5, 0);
          ctx.lineTo(i + 0.5, size);
          ctx.moveTo(0, i + 0.5);
          ctx.lineTo(size, i + 0.5);
        }
        ctx.stroke();

        ctx.fillStyle = "rgba(0, 229, 255, 0.018)";
        for (let y = 3; y < size; y += 6) ctx.fillRect(0, y, size, 1);

        const vignette = ctx.createRadialGradient(400, 400, 230, 400, 400, 580);
        vignette.addColorStop(0, "rgba(5, 7, 15, 0)");
        vignette.addColorStop(1, "rgba(5, 7, 15, 0.83)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, size, size);
      }

      function drawBranches() {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const segment of segments) {
          const color = segment.accent ? settings.accentBranchColor : settings.branchColor;
          ctx.beginPath();
          ctx.moveTo(segment.a.x, segment.a.y);
          ctx.quadraticCurveTo(segment.cx, segment.cy, segment.b.x, segment.b.y);
          ctx.strokeStyle = color;
          ctx.lineWidth = segment.width;
          ctx.shadowColor = color;
          ctx.shadowBlur = segment.accent ? 12 : 10;
          ctx.stroke();
        }

        ctx.shadowBlur = 15;
        ctx.fillStyle = settings.branchColor;
        ctx.shadowColor = settings.branchColor;
        for (const root of neurons) {
          ctx.beginPath();
          ctx.arc(root.x, root.y, 3.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      function drawSynapses() {
        for (const connection of synapses) {
          const beat = 0.72 + 0.28 * Math.sin(clock * 3.4 + connection.phase);
          const x = (connection.a.x + connection.b.x) / 2;
          const y = (connection.a.y + connection.b.y) / 2;
          ctx.globalAlpha = beat;
          ctx.strokeStyle = settings.synapseColor;
          ctx.fillStyle = settings.synapseColor;
          ctx.shadowColor = settings.synapseColor;
          ctx.shadowBlur = settings.synapseGlow * (0.75 + beat * 0.65);
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(connection.a.x, connection.a.y);
          ctx.lineTo(connection.b.x, connection.b.y);
          ctx.stroke();
          for (const point of [connection.a, connection.b]) {
            ctx.beginPath();
            ctx.arc(point.x, point.y, 2.7 + beat * 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(x, y, 2 + beat * 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      function drawPulses() {
        ctx.fillStyle = settings.pulseColor;
        ctx.shadowColor = settings.pulseColor;
        ctx.lineCap = "round";
        for (const pulse of pulses) {
          const head = pointOnRoute(pulse, pulse.travel);
          const tail = pointOnRoute(pulse, pulse.travel - 13);
          ctx.globalAlpha = Math.min(1, settings.pulseBrightness * 0.65);
          ctx.shadowBlur = 17 * settings.pulseBrightness;
          ctx.strokeStyle = settings.pulseColor;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(tail.x, tail.y);
          ctx.lineTo(head.x, head.y);
          ctx.stroke();

          ctx.globalAlpha = Math.min(1, settings.pulseBrightness);
          ctx.beginPath();
          ctx.arc(head.x, head.y, 2.4 + settings.pulseBrightness * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      function drawLabels() {
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffd400";
        ctx.font = "10px monospace";
        ctx.textAlign = "left";
        ctx.fillText("NEURAL / 01", 30, 36);
        ctx.fillStyle = "rgba(255, 212, 0, 0.6)";
        ctx.fillText("NODES " + String(nodes.length).padStart(3, "0"), 30, 766);
        ctx.textAlign = "right";
        ctx.fillText("LINKS " + String(synapses.length).padStart(2, "0"), 770, 766);
        ctx.textAlign = "left";
      }

      function render() {
        drawBackground();
        if (cleared) return;
        drawBranches();
        drawSynapses();
        drawPulses();
        drawLabels();
      }

      function frame(timestamp) {
        const dt = Math.min((timestamp - (lastFrame || timestamp)) / 1000, 0.05);
        lastFrame = timestamp;

        if (!paused && !cleared) {
          clock += dt;
          growthAccumulator = Math.min(8, growthAccumulator + dt * settings.growthSpeed);
          while (growthAccumulator >= 1 && frontiers.length) {
            growStep();
            growthAccumulator--;
          }
          if (!frontiers.length) growthAccumulator = 0;
          updatePulses(dt);
          status.textContent = frontiers.length ? "Growing network" : "Signals active";
        }

        render();
        requestAnimationFrame(frame);
      }

      regenerate();
      setupGUI();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
