<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIP-8 Emulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #ccc;
    font-family: 'Courier New', monospace;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    display: flex;
    gap: 20px;
    max-width: 1200px;
  }
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 320px;
  }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #333;
    width: 512px;
    height: 256px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    width: 512px;
  }
  .keypad button {
    background: #222;
    color: #0f0;
    border: 1px solid #444;
    padding: 15px;
    font-size: 18px;
    font-family: monospace;
    cursor: pointer;
    user-select: none;
  }
  .keypad button:active, .keypad button.pressed {
    background: #0f0;
    color: #000;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls button {
    background: #333;
    color: #0f0;
    border: 1px solid #555;
    padding: 8px 12px;
    font-family: monospace;
    cursor: pointer;
  }
  .controls button:hover { background: #444; }
  .controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .controls input[type="range"] {
    width: 150px;
  }
  .debugger {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 10px;
    font-size: 12px;
    line-height: 1.6;
    max-height: 400px;
    overflow-y: auto;
  }
  .debugger h3 {
    color: #0f0;
    margin-bottom: 5px;
    font-size: 13px;
  }
  .debugger .row {
    display: flex;
    justify-content: space-between;
  }
  .debugger .label { color: #888; }
  .debugger .value { color: #0f0; }
  .debugger .section { margin-top: 8px; }
  .file-input { display: none; }
  .file-label {
    background: #333;
    color: #0f0;
    border: 1px solid #555;
    padding: 8px 12px;
    font-family: monospace;
    cursor: pointer;
    display: inline-block;
    text-align: center;
  }
  .file-label:hover { background: #444; }
</style>
</head>
<body>
<div class="container">
  <div class="left-col">
    <canvas id="display" width="64" height="32"></canvas>
    <div class="keypad" id="keypad"></div>
  </div>
  <div class="right-col">
    <div class="controls">
      <button id="btnRun">Run</button>
      <button id="btnPause">Pause</button>
      <button id="btnStep">Step</button>
      <button id="btnReset">Reset</button>
      <label class="file-label" for="fileInput">Load ROM</label>
      <input type="file" id="fileInput" class="file-input" accept=".ch8,.rom,.bin">
      <label>
        Speed: <span id="speedVal">10</span>
        <input type="range" id="speedSlider" min="1" max="1000" value="10">
      </label>
    </div>
    <div class="debugger" id="debugger">
      <h3>Registers</h3>
      <div id="regDisplay"></div>
      <div class="section">
        <h3>State</h3>
        <div id="stateDisplay"></div>
      </div>
      <div class="section">
        <h3>Stack</h3>
        <div id="stackDisplay"></div>
      </div>
      <div class="section">
        <h3>Current Instruction</h3>
        <div id="instrDisplay"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Standard CHIP-8 fontset (80 bytes, 5 bytes per hex digit 0-F)
const FONTSET = [
  0xF0, 0x90, 0x90, 0x90, 0xF0, // 0
  0x20, 0x60, 0x20, 0x20, 0x70, // 1
  0xF0, 0x10, 0xF0, 0x80, 0xF0, // 2
  0xF0, 0x10, 0xF0, 0x10, 0xF0, // 3
  0x90, 0x90, 0xF0, 0x10, 0x10, // 4
  0xF0, 0x80, 0xF0, 0x10, 0xF0, // 5
  0xF0, 0x80, 0xF0, 0x90, 0xF0, // 6
  0xF0, 0x10, 0x20, 0x40, 0x40, // 7
  0xF0, 0x90, 0xF0, 0x90, 0xF0, // 8
  0xF0, 0x90, 0xF0, 0x10, 0xF0, // 9
  0xF0, 0x90, 0xF0, 0x90, 0x90, // A
  0xE0, 0x90, 0xE0, 0x90, 0xE0, // B
  0xF0, 0x80, 0x80, 0x80, 0xF0, // C
  0xE0, 0x90, 0x90, 0x90, 0xE0, // D
  0xF0, 0x80, 0xF0, 0x80, 0xF0, // E
  0xF0, 0x80, 0xF0, 0x80, 0x80  // F
];

// Demo ROM: hand-assembled CHIP-8 program
// Code starts at 0x200. Sprite data placed after code.
// Program: clear, init x=0x20 y=0x10, loop: draw sprite, wait for key, dispatch movement, repeat.
// Key mapping: 4=left, 6=right, 2=up, 8=down, C=clear
//
// Address layout:
// 0x200: 00 E0       CLS
// 0x202: 64 20       LD V4, 0x20   (x)
// 0x204: 65 10       LD V5, 0x10   (y)
// 0x206: A2 3A       LD I, 0x23A   (sprite address)
// 0x208: D4 55       DR V4, V5, 5  (draw 5 rows at V4,V5)
// 0x20A: F1 0A       LD V1, K      (wait for keypress into V1)
// 0x20C: 31 04       SE V1, 0x04   (key 4?)
// 0x20E: 02 14       JP 0x214      (if not, skip left handler)
// 0x210: 74 FF       ADD V4, 0xFF  (x -= 1)
// 0x212: 02 06       JP 0x206      (back to draw)
// 0x214: 31 06       SE V1, 0x06   (key 6?)
// 0x216: 02 1C       JP 0x21C      (if not, skip right handler)
// 0x218: 74 01       ADD V4, 0x01  (x += 1)
// 0x21A: 02 06       JP 0x206
// 0x21C: 31 02       SE V1, 0x02   (key 2?)
// 0x21E: 02 24       JP 0x224      (if not, skip up handler)
// 0x220: 75 FF       ADD V5, 0xFF  (y -= 1)
// 0x222: 02 06       JP 0x206
// 0x224: 31 08       SE V1, 0x08   (key 8?)
// 0x226: 02 2C       JP 0x22C      (if not, skip down handler)
// 0x228: 75 01       ADD V5, 0x01  (y += 1)
// 0x22A: 02 06       JP 0x206
// 0x22C: 31 0C       SE V1, 0x0C   (key C?)
// 0x22E: 02 36       JP 0x236      (if not, skip clear handler)
// 0x230: 00 E0       CLS
// 0x232: 02 06       JP 0x206
// 0x234: 02 06       JP 0x206      (default: just redraw)
// 0x236: 02 06       JP 0x206
// 0x238: 00 00       padding
// 0x23A: sprite data (5 bytes for 5x5 ship)
//   0x23A: 04
//   0x23B: 0E
//   0x23C: 1F
//   0x23D: 0E
//   0x23E: 04
// Total ROM length: 0x23F - 0x200 = 0x3F = 63 bytes

const DEMO_ROM = [
  0x00, 0xE0, // 0x200: CLS
  0x64, 0x20, // 0x202: LD V4, 0x20
  0x65, 0x10, // 0x204: LD V5, 0x10
  0xA2, 0x3A, // 0x206: LD I, 0x23A
  0xD4, 0x55, // 0x208: DR V4, V5, 5
  0xF1, 0x0A, // 0x20A: LD V1, K
  0x31, 0x04, // 0x20C: SE V1, 0x04
  0x02, 0x14, // 0x20E: JP 0x214
  0x74, 0xFF, // 0x210: ADD V4, 0xFF
  0x02, 0x06, // 0x212: JP 0x206
  0x31, 0x06, // 0x214: SE V1, 0x06
  0x02, 0x1C, // 0x216: JP 0x21C
  0x74, 0x01, // 0x218: ADD V4, 0x01
  0x02, 0x06, // 0x21A: JP 0x206
  0x31, 0x02, // 0x21C: SE V1, 0x02
  0x02, 0x24, // 0x21E: JP 0x224
  0x75, 0xFF, // 0x220: ADD V5, 0xFF
  0x02, 0x06, // 0x222: JP 0x206
  0x31, 0x08, // 0x224: SE V1, 0x08
  0x02, 0x2C, // 0x226: JP 0x22C
  0x75, 0x01, // 0x228: ADD V5, 0x01
  0x02, 0x06, // 0x22A: JP 0x206
  0x31, 0x0C, // 0x22C: SE V1, 0x0C
  0x02, 0x36, // 0x22E: JP 0x236
  0x00, 0xE0, // 0x230: CLS
  0x02, 0x06, // 0x232: JP 0x206
  0x02, 0x06, // 0x234: JP 0x206
  0x02, 0x06, // 0x236: JP 0x206
  0x00, 0x00, // 0x238: padding
  0x00, 0x00, // 0x23A: sprite row 0 (actually at 0x23A)
  0x04,       // 0x23A: sprite row 0
  0x0E,       // 0x23B: sprite row 1
  0x1F,       // 0x23C: sprite row 2
  0x0E,       // 0x23D: sprite row 3
  0x04        // 0x23E: sprite row 4
];

// Wait, the sprite address in the code is 0x23A but the ROM array starts at index 0 which maps to 0x200.
// So sprite at ROM offset 0x3A = 0x200 + 0x3A = 0x23A. Let me recount the ROM bytes:
// 0x200-0x201: 00 E0 (2)
// 0x202-0x203: 64 20 (2)
// 0x204-0x205: 65 10 (2)
// 0x206-0x207: A2 3A (2)
// 0x208-0x209: D4 55 (2)
// 0x20A-0x20B: F1 0A (2)
// 0x20C-0x20D: 31 04 (2)
// 0x20E-0x20F: 02 14 (2)
// 0x210-0x211: 74 FF (2)
// 0x212-0x213: 02 06 (2)
// 0x214-0x215: 31 06 (2)
// 0x216-0x217: 02 1C (2)
// 0x218-0x219: 74 01 (2)
// 0x21A-0x21B: 02 06 (2)
// 0x21C-0x21D: 31 02 (2)
// 0x21E-0x21F: 02 24 (2)
// 0x220-0x221: 75 FF (2)
// 0x222-0x223: 02 06 (2)
// 0x224-0x225: 31 08 (2)
// 0x226-0x227: 02 2C (2)
// 0x228-0x229: 75 01 (2)
// 0x22A-0x22B: 02 06 (2)
// 0x22C-0x22D: 31 0C (2)
// 0x22E-0x22F: 02 36 (2)
// 0x230-0x231: 00 E0 (2)
// 0x232-0x233: 02 06 (2)
// 0x234-0x235: 02 06 (2)
// 0x236-0x237: 02 06 (2)
// 0x238-0x239: 00 00 (2)
// 0x23A: 04 (sprite row 0)
// 0x23B: 0E (sprite row 1)
// 0x23C: 1F (sprite row 2)
// 0x23D: 0E (sprite row 3)
// 0x23E: 04 (sprite row 4)
// Total: 29*2 + 5 = 58 + 5 = 63 bytes. ROM offset of sprite = 58 = 0x3A. Address = 0x200 + 0x3A = 0x23A. Correct.

class Chip8 {
  constructor() {
    this.memory = new Uint8Array(4096);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.pc = 0x200;
    this.stack = new Uint16Array(16);
    this.sp = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.keypad = new Array(16).fill(false);
    this.display = new Uint8Array(64 * 32);
    this.drawFlag = false;
    this.running = false;
    this.currentROM = null;
    this.loadFontset();
  }

  loadFontset() {
    for (let i = 0; i < FONTSET.length; i++) {
      this.memory[0x050 + i] = FONTSET[i];
    }
  }

  loadROM(rom) {
    this.currentROM = rom;
    for (let i = 0; i < rom.length; i++) {
      this.memory[0x200 + i] = rom[i];
    }
  }

  reset() {
    this.memory.fill(0);
    this.loadFontset();
    if (this.currentROM) {
      this.loadROM(this.currentROM);
    } else {
      this.loadROM(DEMO_ROM);
    }
    this.V.fill(0);
    this.I = 0;
    this.pc = 0x200;
    this.sp = 0;
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.keypad.fill(false);
    this.display.fill(0);
    this.drawFlag = true;
  }

  tick() {
    if (this.delayTimer > 0) this.delayTimer--;
    if (this.soundTimer > 0) {
      this.soundTimer--;
    }
  }

  executeCycle() {
    if (this.pc >= 0x1FFA) {
      this.pc = 0x200;
    }
    const opcode = (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
    this.pc += 2;

    const nnn = opcode & 0x0FFF;
    const nn = opcode & 0x00FF;
    const n = opcode & 0x000F;
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;

    switch (opcode & 0xF000) {
      case 0x0000:
        switch (opcode) {
          case 0x00E0: // CLS
            this.display.fill(0);
            this.drawFlag = true;
            break;
          case 0x00EE: // RET
            if (this.sp > 0) {
              this.sp--;
              this.pc = this.stack[this.sp];
            }
            break;
        }
        break;

      case 0x1000: // JP nnn
        this.pc = nnn;
        break;

      case 0x2000: // CALL nnn
        if (this.sp < 16) {
          this.stack[this.sp] = this.pc;
          this.sp++;
        }
        this.pc = nnn;
        break;

      case 0x3000: // SE Vx, kk
        if (this.V[x] === nn) this.pc += 2;
        break;

      case 0x4000: // SNE Vx, kk
        if (this.V[x] !== nn) this.pc += 2;
        break;

      case 0x5000: // SE Vx, Vy
        if (this.V[x] === this.V[y]) this.pc += 2;
        break;

      case 0x6000: // LD Vx, kk
        this.V[x] = nn;
        break;

      case 0x7000: // ADD Vx, kk
        this.V[x] = (this.V[x] + nn) & 0xFF;
        break;

      case 0x8000:
        switch (n) {
          case 0x0: // LD Vx, Vy
            this.V[x] = this.V[y];
            break;
          case 0x1: // OR Vx, Vy
            this.V[x] |= this.V[y];
            this.V[0xF] = 0;
            break;
          case 0x2: // AND Vx, Vy
            this.V[x] &= this.V[y];
            this.V[0xF] = 0;
            break;
          case 0x3: // XOR Vx, Vy
            this.V[x] ^= this.V[y];
            this.V[0xF] = 0;
            break;
          case 0x4: // ADD Vx, Vy
            const sum = this.V[x] + this.V[y];
            this.V[x] = sum & 0xFF;
            this.V[0xF] = sum > 0xFF ? 1 : 0;
            break;
          case 0x5: // SUB Vx, Vy (VF = NOT borrow)
            this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
            this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
            break;
          case 0x6: // SHR Vx
            this.V[0xF] = this.V[x] & 0x1;
            this.V[x] = this.V[x] >> 1;
            break;
          case 0x7: // SUBN Vx, Vy (VF = NOT borrow)
            this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
            this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
            break;
          case 0x8: // SHL Vx
            this.V[0xF] = (this.V[x] & 0x80) >> 7;
            this.V[x] = (this.V[x] << 1) & 0xFF;
            break;
          case 0x9: // SNE Vx, Vy
            if (this.V[x] !== this.V[y]) this.pc += 2;
            break;
        }
        break;

      case 0x9000: // SNE Vx, Vy (alternate encoding)
        if (this.V[x] !== this.V[y]) this.pc += 2;
        break;

      case 0xA000: // LD I, nnn
        this.I = nnn;
        break;

      case 0xB000: // JP V0, nnn
        this.pc = nnn + this.V[0];
        break;

      case 0xC000: // RND Vx, kk
        this.V[x] = (Math.floor(Math.random() * 256)) & nn;
        break;

      case 0xD000: // DR Vx, Vy, n
        const spriteX = this.V[x] & 0x3F;
        const spriteY = this.V[y] & 0x1F;
        this.V[0xF] = 0;
        for (let row = 0; row < n; row++) {
          if (this.I + row >= 4096) break;
          const spriteByte = this.memory[this.I + row];
          for (let bit = 0; bit < 8; bit++) {
            if (spriteByte & (0x80 >> bit)) {
              const px = (spriteX + bit) & 0x3F;
              const py = (spriteY + row) & 0x1F;
              const idx = py * 64 + px;
              if (this.display[idx]) {
                this.V[0xF] = 1;
              }
              this.display[idx] ^= 1;
            }
          }
        }
        this.drawFlag = true;
        break;

      case 0xE000:
        switch (nn) {
          case 0x9E: // SKP Vx
            if (this.keypad[this.V[x] & 0xF]) this.pc += 2;
            break;
          case 0xA1: // SKNP Vx
            if (!this.keypad[this.V[x] & 0xF]) this.pc += 2;
            break;
        }
        break;

      case 0xF000:
        switch (nn) {
          case 0x07: // LD Vx, DT
            this.V[x] = this.delayTimer;
            break;
          case 0x0A: // LD Vx, K
            let keyPressed = -1;
            for (let i = 0; i < 16; i++) {
              if (this.keypad[i]) {
                keyPressed = i;
                break;
              }
            }
            if (keyPressed === -1) {
              this.pc -= 2;
            } else {
              this.V[x] = keyPressed;
            }
            break;
          case 0x15: // LD DT, Vx
            this.delayTimer = this.V[x];
            break;
          case 0x18: // LD ST, Vx
            this.soundTimer = this.V[x];
            break;
          case 0x1E: // ADD I, Vx
            this.I = (this.I + this.V[x]) & 0xFFF;
            break;
          case 0x29: // LD F, Vx
            this.I = 0x050 + (this.V[x] & 0xF) * 5;
            break;
          case 0x33: // BCD Vx
            const val = this.V[x];
            this.memory[this.I] = Math.floor(val / 100);
            this.memory[this.I + 1] = Math.floor((val % 100) / 10);
            this.memory[this.I + 2] = val % 10;
            break;
          case 0x55: // LD [I], V0..Vx
            for (let i = 0; i <= x; i++) {
              if (this.I + i < 4096) {
                this.memory[this.I + i] = this.V[i];
              }
            }
            break;
          case 0x65: // LD V0..Vx, [I]
            for (let i = 0; i <= x; i++) {
              if (this.I + i < 4096) {
                this.V[i] = this.memory[this.I + i];
              }
            }
            break;
        }
        break;
    }
  }

  disassemble(pc) {
    if (pc >= 0x1FFA) return "???";
    const opcode = (this.memory[pc] << 8) | this.memory[pc + 1];
    const nnn = opcode & 0x0FFF;
    const nn = opcode & 0x00FF;
    const n = opcode & 0x000F;
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;

    switch (opcode & 0xF000) {
      case 0x0000:
        if (opcode === 0x00E0) return "CLS";
        if (opcode === 0x00EE) return "RET";
        return `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
      case 0x1000: return `JP 0x${nnn.toString(16).padStart(3, '0').toUpperCase()}`;
      case 0x2000: return `CALL 0x${nnn.toString(16).padStart(3, '0').toUpperCase()}`;
      case 0x3000: return `SE V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).padStart(2, '0').toUpperCase()}`;
      case 0x4000: return `SNE V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).padStart(2, '0').toUpperCase()}`;
      case 0x5000: return `SE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
      case 0x6000: return `LD V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).padStart(2, '0').toUpperCase()}`;
      case 0x7000: return `ADD V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).padStart(2, '0').toUpperCase()}`;
      case 0x8000:
        switch (n) {
          case 0x0: return `LD V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x1: return `OR V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x2: return `AND V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x3: return `XOR V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x4: return `ADD V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x5: return `SUB V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x6: return `SHR V${x.toString(16).toUpperCase()}`;
          case 0x7: return `SUBN V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
          case 0x8: return `SHL V${x.toString(16).toUpperCase()}`;
          case 0x9: return `SNE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
        }
        return `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
      case 0x9000: return `SNE V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}`;
      case 0xA000: return `LD I, 0x${nnn.toString(16).padStart(3, '0').toUpperCase()}`;
      case 0xB000: return `JP V0, 0x${nnn.toString(16).padStart(3, '0').toUpperCase()}`;
      case 0xC000: return `RND V${x.toString(16).toUpperCase()}, 0x${nn.toString(16).padStart(2, '0').toUpperCase()}`;
      case 0xD000: return `DR V${x.toString(16).toUpperCase()}, V${y.toString(16).toUpperCase()}, ${n}`;
      case 0xE000:
        if (nn === 0x9E) return `SKP V${x.toString(16).toUpperCase()}`;
        if (nn === 0xA1) return `SKNP V${x.toString(16).toUpperCase()}`;
        return `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
      case 0xF000:
        switch (nn) {
          case 0x07: return `LD V${x.toString(16).toUpperCase()}, DT`;
          case 0x0A: return `LD V${x.toString(16).toUpperCase()}, K`;
          case 0x15: return `LD DT, V${x.toString(16).toUpperCase()}`;
          case 0x18: return `LD ST, V${x.toString(16).toUpperCase()}`;
          case 0x1E: return `ADD I, V${x.toString(16).toUpperCase()}`;
          case 0x29: return `LD F, V${x.toString(16).toUpperCase()}`;
          case 0x33: return `BCD V${x.toString(16).toUpperCase()}`;
          case 0x55: return `LD [I], V0..V${x.toString(16).toUpperCase()}`;
          case 0x65: return `LD V0..V${x.toString(16).toUpperCase()}, [I]`;
        }
        return `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
      default:
        return `0x${opcode.toString(16).padStart(4, '0').toUpperCase()}`;
    }
  }
}

// UI and main loop
const chip8 = new Chip8();
chip8.loadROM(DEMO_ROM);

const canvas = document.getElementById('display');
const ctx = canvas.getContext('2d');
const debuggerEl = document.getElementById('debugger');
const regDisplay = document.getElementById('regDisplay');
const stateDisplay = document.getElementById('stateDisplay');
const stackDisplay = document.getElementById('stackDisplay');
const instrDisplay = document.getElementById('instrDisplay');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const btnRun = document.getElementById('btnRun');
const btnPause = document.getElementById('btnPause');
const btnStep = document.getElementById('btnStep');
const btnReset = document.getElementById('btnReset');
const fileInput = document.getElementById('fileInput');

let speed = 10;
let audioCtx = null;
let beepOsc = null;

// Keypad setup
const keyMap = {
  '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
  'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xA,
  'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xB,
  'z': 0xE, 'x': 0x0, 'c': 0xF, 'v': 0xD
};

const keyLabels = ['1','2','3','C','4','5','6','A','7','8','9','B','A','B','C','D'];
const keypadEl = document.getElementById('keypad');

for (let i = 0; i < 16; i++) {
  const btn = document.createElement('button');
  btn.textContent = keyLabels[i];
  btn.dataset.key = i;
  btn.addEventListener('mousedown', () => { chip8.keypad[i] = true; btn.classList.add('pressed'); });
  btn.addEventListener('mouseup', () => { chip8.keypad[i] = false; btn.classList.remove('pressed'); });
  btn.addEventListener('mouseleave', () => { chip8.keypad[i] = false; btn.classList.remove('pressed'); });
  keypadEl.appendChild(btn);
}

// Keyboard events
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (keyMap.hasOwnProperty(key)) {
    e.preventDefault();
    const hexKey = keyMap[key];
    if (!chip8.keypad[hexKey]) {
      chip8.keypad[hexKey] = true;
      const btn = keypadEl.children[hexKey];
      if (btn) btn.classList.add('pressed');
    }
  }
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (keyMap.hasOwnProperty(key)) {
    const hexKey = keyMap[key];
    chip8.keypad[hexKey] = false;
    const btn = keypadEl.children[hexKey];
    if (btn) btn.classList.remove('pressed');
  }
});

// Controls
btnRun.addEventListener('click', () => { chip8.running = true; });
btnPause.addEventListener('click', () => { chip8.running = false; });
btnStep.addEventListener('click', () => {
  chip8.running = false;
  chip8.executeCycle();
  chip8.tick();
  render();
  updateDebugger();
});
btnReset.addEventListener('click', () => {
  chip8.reset();
  render();
  updateDebugger();
});

speedSlider.addEventListener('input', () => {
  speed = parseInt(speedSlider.value);
  speedVal.textContent = speed;
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const rom = new Uint8Array(ev.target.result);
    chip8.reset();
    chip8.loadROM(rom);
    render();
    updateDebugger();
  };
  reader.readAsArrayBuffer(file);
});

// Audio
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBeep() {
  if (!audioCtx) return;
  if (!beepOsc) {
    beepOsc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.1;
    beepOsc.connect(gain);
    gain.connect(audioCtx.destination);
    beepOsc.frequency.value = 440;
    beepOsc.start();
  }
}

function stopBeep() {
  if (beepOsc) {
    beepOsc.stop();
    beepOsc = null;
  }
}

// Render display
function render() {
  const imageData = ctx.createImageData(64, 32);
  for (let i = 0; i < 64 * 32; i++) {
    const pixel = chip8.display[i];
    const idx = i * 4;
    if (pixel) {
      imageData.data[idx] = 0;
      imageData.data[idx + 1] = 255;
      imageData.data[idx + 2] = 0;
      imageData.data[idx + 3] = 255;
    } else {
      imageData.data[idx] = 0;
      imageData.data[idx + 1] = 0;
      imageData.data[idx + 2] = 0;
      imageData.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// Update debugger
function updateDebugger() {
  let regHtml = '';
  for (let i = 0; i < 16; i++) {
    regHtml += `<div class="row"><span class="label">V${i.toString(16).toUpperCase()}</span><span class="value">0x${chip8.V[i].toString(16).padStart(2, '0').toUpperCase()}</span></div>`;
  }
  regDisplay.innerHTML = regHtml;

  stateDisplay.innerHTML = `
    <div class="row"><span class="label">I</span><span class="value">0x${chip8.I.toString(16).padStart(3, '0').toUpperCase()}</span></div>
    <div class="row"><span class="label">PC</span><span class="value">0x${chip8.pc.toString(16).padStart(4, '0').toUpperCase()}</span></div>
    <div class="row"><span class="label">DT</span><span class="value">${chip8.delayTimer}</span></div>
    <div class="row"><span class="label">ST</span><span class="value">${chip8.soundTimer}</span></div>
    <div class="row"><span class="label">State</span><span class="value">${chip8.running ? 'RUNNING' : 'PAUSED'}</span></div>
  `;

  let stackHtml = '';
  for (let i = 0; i < 16; i++) {
    if (i < chip8.sp) {
      stackHtml += `<div class="row"><span class="label">SP-${chip8.sp - 1 - i}</span><span class="value">0x${chip8.stack[i].toString(16).padStart(4, '0').toUpperCase()}</span></div>`;
    }
  }
  if (!stackHtml) stackHtml = '<div class="row"><span class="label">Empty</span></div>';
  stackDisplay.innerHTML = stackHtml;

  const disasm = chip8.disassemble(chip8.pc - 2);
  const opcodeHex = (chip8.memory[chip8.pc - 2] << 8 | chip8.memory[chip8.pc - 1]).toString(16).padStart(4, '0').toUpperCase();
  instrDisplay.innerHTML = `<div class="row"><span class="label">0x${opcodeHex}</span><span class="value">${disasm}</span></div>`;
}

// Main loop
let lastTime = 0;
function mainLoop(timestamp) {
  if (chip8.running) {
    for (let i = 0; i < speed; i++) {
      chip8.executeCycle();
    }
    chip8.tick();

    if (chip8.soundTimer > 0) {
      initAudio();
      playBeep();
    } else {
      stopBeep();
    }

    if (chip8.drawFlag) {
      render();
      chip8.drawFlag = false;
    }
    updateDebugger();
  }
  requestAnimationFrame(mainLoop);
}

// Initial render
render();
updateDebugger();
requestAnimationFrame(mainLoop);
</script>
</body>
</html>
