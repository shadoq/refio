<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background-color: #05070f;
            box-shadow: 0 0 50px #101a3a;
            border: 1px solid rgba(0, 229, 255, 0.2);
            cursor: crosshair;
        }
        .dg.main {
            user-select: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <canvas id="simCanvas" width="800" height="800"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const params = {
            // Growth
            neuronCount: 5,
            growthSpeed: 1.5,
            maxDepth: 6,
            splitChance: 0.25,
            curvature: 0.5,
            maxLength: 60,
            // Synapses
            synapseDist: 40,
            synapseGlow: 15,
            // Pulses
            pulseSpeed: 0.02,
            pulseFreq: 0.01,
            pulseBrightness: 1.0,
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            // Controls
            paused: false
        };

        let neurons = [];
        let synapses = [];
        let pulses = [];
        let frameCount = 0;

        const gui = new dat.GUI();
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(params, 'neuronCount', 1, 15, 1).onFinishChange(init);
        growthFolder.add(params, 'growthSpeed', 0.1, 5.0);
        growthFolder.add(params, 'maxDepth', 1, 12, 1);
        growthFolder.add(params, 'splitChance', 0, 1);
        growthFolder.add(params, 'curvature', 0, 1);
        growthFolder.add(params, 'maxLength', 10, 150);
        growthFolder.open();

        const synapseFolder = gui.addFolder('Synapses');
        synapseFolder.add(params, 'synapseDist', 5, 100);
        synapseFolder.add(params, 'synapseGlow', 0, 30);
        synapseFolder.open();

        const pulseFolder = gui.addFolder('Pulses');
        pulseFolder.add(params, 'pulseSpeed', 0.001, 0.1);
        pulseFolder.add(params, 'pulseFreq', 0.001, 0.05);
        pulseFolder.add(params, 'pulseBrightness', 0, 2);
        pulseFolder.open();

        const visualFolder = gui.addFolder('Visuals');
        visualFolder.addColor(params, 'bgColor');
        visualFolder.addColor(params, 'branchColor');
        visualFolder.addColor(params, 'accentColor');
        visualFolder.addColor(params, 'synapseColor');
        visualFolder.addColor(params, 'pulseColor');
        visualFolder.open();

        const actions = {
            regenerate: () => init(),
            clear: () => {
                neurons = [];
                synapses = [];
                pulses = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            },
            togglePause: () => {
                params.paused = !params.paused;
            }
        };

        gui.add(actions, 'regenerate').name('Regenerate Network');
        gui.add(actions, 'clear').name('Clear Canvas');
        gui.add(params, 'paused').name('Pause Animation');

        class Branch {
            constructor(x, y, angle, depth, parent = null) {
                this.startX = x;
                this.startY = y;
                this.endX = x;
                this.endY = y;
                this.angle = angle;
                this.depth = depth;
                this.parent = parent;
                this.length = 0;
                this.targetLength = Math.random() * params.maxLength + 20;
                this.finished = false;
                this.children = [];
                this.cpX = x;
                this.cpY = y;
                this.thickness = Math.max(0.5, (params.maxDepth - depth) * 0.8);
                this.color = (depth % 3 === 0) ? params.accentColor : params.branchColor;
            }

            update() {
                if (this.finished) return;

                const step = params.growthSpeed;
                this.length += step;

                // Organic curvature using a control point
                const offset = (this.length / this.targetLength) * 0.5;
                const curveX = Math.cos(this.angle + (Math.random() - 0.5) * params.curvature);
                const curveY = Math.sin(this.angle + (Math.random() - 0.5) * params.curvature);
                
                this.endX = this.startX + Math.cos(this.angle) * this.length;
                this.endY = this.startY + Math.sin(this.angle) * this.length;
                
                // Simple quadratic approximation for the "bend"
                this.cpX = this.startX + Math.cos(this.angle) * (this.length * 0.5) + (Math.random() - 0.5) * 10;
                this.cpY = this.startY + Math.sin(this.angle) * (this.length * 0.5) + (Math.random() - 0.5) * 10;

                if (this.length >= this.targetLength) {
                    this.finished = true;
                    this.checkSynapses();
                    this.split();
                }
            }

            split() {
                if (this.depth >= params.maxDepth) return;

                const numChildren = Math.random() < params.splitChance ? 2 : 1;
                for (let i = 0; i < numChildren; i++) {
                    const newAngle = this.angle + (Math.random() - 0.5) * 1.5;
                    const child = new Branch(this.endX, this.endY, newAngle, this.depth + 1, this);
                    this.children.push(child);
                    neurons.push(child);
                }
            }

            checkSynapses() {
                neurons.forEach(other => {
                    if (other === this || other.parent === this) return;
                    if (!other.finished) return;

                    const dx = this.endX - other.endX;
                    const dy = this.endY - other.endY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < params.synapseDist) {
                        // Avoid duplicates
                        const exists = synapses.some(s => (s.a === this && s.b === other) || (s.a === other && s.b === this));
                        if (!exists) {
                            synapses.push({ a: this, b: other, life: 0 });
                        }
                    }
                });
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.quadraticCurveTo(this.cpX, this.cpY, this.endX, this.endY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) return false;
                return true;
            }

            draw() {
                const a = this.synapse.a;
                const b = this.synapse.b;
                
                // Interpolate position along the synapse line
                const x = a.endX + (b.endX - a.endX) * this.progress;
                const y = a.endY + (b.endY - a.endY) * this.progress;

                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = params.pulseColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = params.pulseColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            neurons = [];
            synapses = [];
            pulses = [];
            
            for (let i = 0; i < params.neuronCount; i++) {
                const x = 400 + (Math.random() - 0.5) * 200;
                const y = 400 + (Math.random() - 0.5) * 200;
                const angle = Math.random() * Math.PI * 2;
                const root = new Branch(x, y, angle, 0);
                neurons.push(root);
                // Root neurons start by splitting immediately
                root.split();
            }
        }

        function drawBackground() {
            // Background fill
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < 800; i += 40) {
                ctx.moveTo(i, 0); ctx.lineTo(i, 800);
                ctx.moveTo(0, i); ctx.lineTo(800, i);
            }
            ctx.stroke();

            // Vignette
            const grad = ctx.createRadialGradient(400, 400, 100, 400, 400, 500);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 800);
        }

        function drawScanlines() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let i = 0; i < 800; i += 4) {
                ctx.fillRect(0, i, 800, 1);
            }
        }

        function loop() {
            if (!params.paused) {
                frameCount++;
                
                // Update growth
                neurons.forEach(n => n.update());

                // Handle pulses
                if (Math.random() < params.pulseFreq) {
                    if (synapses.length > 0) {
                        const s = synapses[Math.floor(Math.random() * synapses.length)];
                        pulses.push(new Pulse(s));
                    }
                }
                pulses = pulses.filter(p => p.update());
            }

            drawBackground();

            // Draw Synapses
            ctx.shadowBlur = params.synapseGlow;
            ctx.shadowColor = params.synapseColor;
            ctx.strokeStyle = params.synapseColor;
            ctx.lineWidth = 1;
            synapses.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.a.endX, s.a.endY);
                ctx.lineTo(s.b.endX, s.b.endY);
                ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Branches
            ctx.shadowBlur = 5;
            neurons.forEach(n => {
                ctx.shadowColor = n.color;
                n.draw();
            });
            ctx.shadowBlur = 0;

            // Draw Pulses
            pulses.forEach(p => p.draw());

            drawScanlines();

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
