<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game 30x30</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1115;color:#e8e8e8;font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{margin-bottom:10px}
#ui{display:flex;gap:20px;align-items:center;margin-bottom:10px}
#score{font-weight:600}
#grid{width:600px;height:600px;display:grid;grid-template-columns:repeat(30,1fr);grid-template-rows:repeat(30,1fr);background:#1a1d24;border:2px solid #2a2f3a;position:relative}
.cell{width:100%;height:100%}
.snake1{background:#4ade80}
.snake2{background:#60a5fa}
.food{background:#f87171;border-radius:50%}
.head1{box-shadow:inset 0 0 0 3px #14532d}
.head2{box-shadow:inset 0 0 0 3px #1e3a8a}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#overlay.hidden{display:none}
button,select{background:#2a2f3a;border:1px solid #3a4150;color:#e8e8e8;padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{background:#353b48}
#modeSelect{margin:10px 0}
p{margin:6px 0}
</style>
</head>
<body>
<h1>Snake 30x30</h1>
<div id="ui">
<div id="score">Score: 0</div>
<div id="modeLabel">Mode: Human vs Human</div>
</div>
<div id="grid"></div>
<div id="overlay">
<h2 id="overlayTitle">Snake Game</h2>
<p id="overlayText">Choose mode and press Start</p>
<div id="modeSelect">
<select id="mode">
<option value="hh">Human vs Human</option>
<option value="ch">CPU vs Human</option>
<option value="cc">CPU vs CPU</option>
</select>
<button id="startBtn">Start</button>
</div>
<p style="opacity:.7;font-size:14px">WASD / Arrows = Player1, IJKL = Player2. R to restart</p>
</div>
<script>
const GRID_SIZE=30;
const gridEl=document.getElementById('grid');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle');
const overlayText=document.getElementById('overlayText');
const scoreEl=document.getElementById('score');
const modeLabel=document.getElementById('modeLabel');
const modeSelect=document.getElementById('mode');
const startBtn=document.getElementById('startBtn');

let cells=[];
for(let i=0;i<GRID_SIZE*GRID_SIZE;i++){
  const c=document.createElement('div');
  c.className='cell';
  gridEl.appendChild(c);
  cells.push(c);
}

let snakes=[], food=null, score=0, gameInterval=null, mode='hh', gameOver=false;

function randPos(){
  return {x:Math.floor(Math.random()*GRID_SIZE), y:Math.floor(Math.random()*GRID_SIZE)};
}
function posKey(p){return p.x+','+p.y}
function collides(p, snake, ignoreHead=false){
  for(let i=ignoreHead?1:0;i<snake.body.length;i++){
    if(snake.body[i].x===p.x && snake.body[i].y===p.y) return true;
  }
  return false;
}
function initGame(){
  clearInterval(gameInterval);
  gameOver=false;
  score=0;
  scoreEl.textContent='Score: 0';
  cells.forEach(c=>c.className='cell');
  snakes=[];
  const modeVal=modeSelect.value;
  mode=modeVal;
  modeLabel.textContent='Mode: '+modeSelect.options[modeSelect.selectedIndex].text;
  const start1={x:10,y:15};
  const start2={x:20,y:15};
  snakes.push({id:1, body:[{x:start1.x,y:start1.y},{x:start1.x-1,y:start1.y},{x:start1.x-2,y:start1.y}], dir:{x:1,y:0}, color:'snake1', controlled:true, ai:false});
  snakes.push({id:2, body:[{x:start2.x,y:start2.y},{x:start2.x+1,y:start2.y},{x:start2.x+2,y:start2.y}], dir:{x:-1,y:0}, color:'snake2', controlled:false, ai:false});
  if(modeVal==='hh'){
    snakes[0].controlled=true; snakes[0].ai=false;
    snakes[1].controlled=true; snakes[1].ai=false;
  }else if(modeVal==='ch'){
    snakes[0].controlled=true; snakes[0].ai=false;
    snakes[1].controlled=false; snakes[1].ai=true;
  }else if(modeVal==='cc'){
    snakes[0].controlled=false; snakes[0].ai=true;
    snakes[1].controlled=false; snakes[1].ai=true;
  }
  placeFood();
  overlay.classList.add('hidden');
  gameInterval=setInterval(tick,120);
}
function placeFood(){
  let p;
  do{
    p=randPos();
  }while(snakes.some(s=>collides(p,s)));
  food=p;
}
function draw(){
  cells.forEach(c=>c.className='cell');
  snakes.forEach(s=>{
    s.body.forEach((seg,i)=>{
      const idx=seg.y*GRID_SIZE+seg.x;
      if(idx<0||idx>=cells.length) return;
      cells[idx].className='cell '+s.color+(i===0?' head'+s.id:'');
    });
  });
  if(food){
    const idx=food.y*GRID_SIZE+food.x;
    cells[idx].className='cell food';
  }
}
function tick(){
  if(gameOver) return;
  snakes.forEach(s=>{
    if(s.ai) aiMove(s);
    const head={x:s.body[0].x+s.dir.x, y:s.body[0].y+s.dir.y};
    if(head.x<0||head.x>=GRID_SIZE||head.y<0||head.y>=GRID_SIZE){
      endGame('Wall hit');
      return;
    }
    if(collides(head,s,true)){
      endGame('Self hit');
      return;
    }
    for(const other of snakes){
      if(other===s) continue;
      if(collides(head,other)){
        endGame('Collision');
        return;
      }
    }
    s.body.unshift(head);
    if(food && head.x===food.x && head.y===food.y){
      score+=10;
      scoreEl.textContent='Score: '+score;
      placeFood();
    }else{
      s.body.pop();
    }
  });
  draw();
}
function aiMove(s){
  const head=s.body[0];
  const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  let best=null, bestDist=Infinity;
  for(const d of dirs){
    const nx=head.x+d.x, ny=head.y+d.y;
    if(nx<0||nx>=GRID_SIZE||ny<0||ny>=GRID_SIZE) continue;
    const next={x:nx,y:ny};
    if(collides(next,s,true)) continue;
    for(const other of snakes){
      if(other===s) continue;
      if(collides(next,other)) continue;
    }
    const dist=Math.abs(nx-food.x)+Math.abs(ny-food.y);
    if(dist<bestDist){
      bestDist=dist;
      best=d;
    }
  }
  if(best){
    s.dir=best;
  }else{
    const opposite={x:-s.dir.x,y:-s.dir.y};
    if(!dirs.some(d=>d.x===opposite.x&&d.y===opposite.y)) s.dir=dirs[0];
  }
}
function endGame(reason){
  gameOver=true;
  clearInterval(gameInterval);
  overlay.classList.remove('hidden');
  overlayTitle.textContent='Game Over';
  overlayText.textContent=reason+' - Score: '+score+' - Press R to restart';
  document.getElementById('modeSelect').style.display='none';
}
function handleKey(e){
  if(e.repeat) return;
  if(e.key==='r' || e.key==='R'){
    initGame();
    return;
  }
  const k=e.key.toLowerCase();
  if(snakes[0].controlled){
    if((k==='arrowup'||k==='w') && snakes[0].dir.y!==1) snakes[0].dir={x:0,y:-1};
    else if((k==='arrowdown'||k==='s') && snakes[0].dir.y!==-1) snakes[0].dir={x:0,y:1};
    else if((k==='arrowleft'||k==='a') && snakes[0].dir.x!==1) snakes[0].dir={x:-1,y:0};
    else if((k==='arrowright'||k==='d') && snakes[0].dir.x!==-1) snakes[0].dir={x:1,y:0};
  }
  if(snakes[1].controlled){
    if((k==='i') && snakes[1].dir.y!==1) snakes[1].dir={x:0,y:-1};
    else if((k==='k') && snakes[1].dir.y!==-1) snakes[1].dir={x:0,y:1};
    else if((k==='j') && snakes[1].dir.x!==1) snakes[1].dir={x:-1,y:0};
    else if((k==='l') && snakes[1].dir.x!==-1) snakes[1].dir={x:1,y:0};
  }
}
document.addEventListener('keydown',handleKey);
startBtn.addEventListener('click',initGame);
modeSelect.addEventListener('change',()=>{modeLabel.textContent='Mode: '+modeSelect.options[modeSelect.selectedIndex].text;});
draw();
</script>
</body>
</html>
