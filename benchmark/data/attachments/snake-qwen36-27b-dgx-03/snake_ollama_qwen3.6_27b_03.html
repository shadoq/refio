<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --p1-color: #4CAF50;
            --p2-color: #f44336;
            --food-color: #FFEB3B;
            --grid-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #444;
            border-radius: 8px;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            transition: all 0.2s;
            min-width: 250px;
        }

        button:hover {
            background-color: #444;
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
        }

        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        .winner-text {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--food-color);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="scoreBoard" class="score-board hidden">
            <div class="p1-score">P1: <span id="score1">0</span></div>
            <div class="p2-score">P2: <span id="score2">0</span></div>
        </div>

        <div id="startMenu" class="overlay">
            <h1>Snake Battle</h1>
            <div class="menu-buttons">
                <button onclick="startGame(1)">Human vs Human (1)</button>
                <button onclick="startGame(2)">CPU vs Human (2)</button>
                <button onclick="startGame(3)">CPU vs CPU (3)</button>
            </div>
            <div class="controls-hint">
                P1: WASD | P2: Arrow Keys
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h2>Game Over</h2>
            <div id="winnerText" class="winner-text"></div>
            <div id="finalScores"></div>
            <div class="controls-hint">Press 'R' to Restart</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game Constants
        const GRID_SIZE = 30;
        const TILE_COUNT = 30; // 30x30 grid
        const TILE_SIZE = canvas.width / TILE_COUNT;
        const GAME_SPEED = 100; // ms per frame

        // Game State
        let gameInterval;
        let gameMode = 0; // 1: HvsH, 2: CPUvsH, 3: CPUvsCPU
        let isGameOver = false;
        
        // Entities
        let snake1 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            score: 0,
            color: '#4CAF50',
            dead: false
        };

        let snake2 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            score: 0,
            color: '#f44336',
            dead: false
        };

        let food = { x: 0, y: 0 };

        // Input Handling
        document.addEventListener('keydown', handleInput);

        function handleInput(e) {
            if (isGameOver) {
                if (e.key.toLowerCase() === 'r') {
                    resetGame();
                }
                return;
            }

            // Menu Selection
            if (!document.getElementById('startMenu').classList.contains('hidden')) {
                if (e.key === '1') startGame(1);
                if (e.key === '2') startGame(2);
                if (e.key === '3') startGame(3);
                return;
            }

            // Player 1 Controls (WASD)
            if (gameMode === 1 || gameMode === 2) { // P1 is human in mode 1, P2 is human in mode 2. Wait, Mode 2 is CPU vs Human. Usually P1 is CPU? Let's assume P1 is always Green, P2 is Red.
                // Mode 1: H vs H
                // Mode 2: CPU (P1) vs Human (P2)
                // Mode 3: CPU vs CPU
                
                // Let's standardize:
                // P1 (Green) controls: WASD
                // P2 (Red) controls: Arrows
                
                if (gameMode === 1) {
                    if (e.key === 'w' && snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = -1; }
                    if (e.key === 's' && snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = 1; }
                    if (e.key === 'a' && snake1.dx === 0) { snake1.nextDx = -1; snake1.nextDy = 0; }
                    if (e.key === 'd' && snake1.dx === 0) { snake1.nextDx = 1; snake1.nextDy = 0; }
                }
            }

            // Player 2 Controls (Arrows)
            if (gameMode === 1 || gameMode === 2) {
                if (e.key === 'ArrowUp' && snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = -1; }
                if (e.key === 'ArrowDown' && snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = 1; }
                if (e.key === 'ArrowLeft' && snake2.dx === 0) { snake2.nextDx = -1; snake2.nextDy = 0; }
                if (e.key === 'ArrowRight' && snake2.dx === 0) { snake2.nextDx = 1; snake2.nextDy = 0; }
            }
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('scoreBoard').classList.remove('hidden');
            resetGame();
        }

        function resetGame() {
            isGameOver = false;
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            // Initialize Snakes
            snake1.body = [{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}];
            snake1.dx = 1; snake1.dy = 0;
            snake1.nextDx = 1; snake1.nextDy = 0;
            snake1.score = 0;
            snake1.dead = false;

            snake2.body = [{x: 24, y: 24}, {x: 25, y: 24}, {x: 26, y: 24}];
            snake2.dx = -1; snake2.dy = 0;
            snake2.nextDx = -1; snake2.nextDy = 0;
            snake2.score = 0;
            snake2.dead = false;

            updateScoreDisplay();
            spawnFood();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                
                valid = true;
                // Check collision with snake1
                for (let part of snake1.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
                // Check collision with snake2
                for (let part of snake2.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
            }
        }

        function gameLoop() {
            if (isGameOver) return;

            // CPU Logic
            if (gameMode === 2 || gameMode === 3) {
                cpuMove(snake1);
            }
            if (gameMode === 3) {
                cpuMove(snake2);
            }

            // Apply Inputs
            snake1.dx = snake1.nextDx;
            snake1.dy = snake1.nextDy;
            snake2.dx = snake2.nextDx;
            snake2.dy = snake2.nextDy;

            moveSnake(snake1);
            moveSnake(snake2);

            checkCollisions();
            
            if (!isGameOver) {
                draw();
            } else {
                endGame();
            }
        }

        function moveSnake(snake) {
            const head = { x: snake.body[0].x + snake.dx, y: snake.body[0].y + snake.dy };
            snake.body.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreDisplay();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollisions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];

            // Wall Collisions
            if (head1.x < 0 || head1.x >= TILE_COUNT || head1.y < 0 || head1.y >= TILE_COUNT) snake1.dead = true;
            if (head2.x < 0 || head2.x >= TILE_COUNT || head2.y < 0 || head2.y >= TILE_COUNT) snake2.dead = true;

            // Self Collisions
            for (let i = 1; i < snake1.body.length; i++) {
                if (head1.x === snake1.body[i].x && head1.y === snake1.body[i].y) snake1.dead = true;
            }
            for (let i = 1; i < snake2.body.length; i++) {
                if (head2.x === snake2.body[i].x && head2.y === snake2.body[i].y) snake2.dead = true;
            }

            // Head-to-Head Collision
            if (head1.x === head2.x && head1.y === head2.y) {
                snake1.dead = true;
                snake2.dead = true;
            }

            // Head vs Body Collision
            for (let part of snake2.body) {
                if (head1.x === part.x && head1.y === part.y) snake1.dead = true;
            }
            for (let part of snake1.body) {
                if (head2.x === part.x && head2.y === part.y) snake2.dead = true;
            }

            if (snake1.dead || snake2.dead) {
                isGameOver = true;
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            const winnerText = document.getElementById('winnerText');
            const finalScores = document.getElementById('finalScores');
            
            let winner = "";
            if (snake1.dead && snake2.dead) {
                winner = "Draw!";
            } else if (snake1.dead) {
                winner = "Player 2 Wins!";
            } else if (snake2.dead) {
                winner = "Player 1 Wins!";
            }

            winnerText.textContent = winner;
            finalScores.innerHTML = `P1 Score: ${snake1.score} | P2 Score: ${snake2.score}`;
            
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle)
            ctx.strokeStyle = '#111';
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_SIZE);
                ctx.lineTo(canvas.width, i * TILE_SIZE);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#FFEB3B';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FFEB3B';
            ctx.fillRect(food.x * TILE_SIZE + 1, food.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.shadowBlur = 0;

            // Draw Snake 1
            ctx.fillStyle = snake1.color;
            for (let i = 0; i < snake1.body.length; i++) {
                let part = snake1.body[i];
                ctx.fillRect(part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            }

            // Draw Snake 2
            ctx.fillStyle = snake2.color;
            for (let i = 0; i < snake2.body.length; i++) {
                let part = snake2.body[i];
                ctx.fillRect(part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score1').textContent = snake1.score;
            document.getElementById('score2').textContent = snake2.score;
        }

        // CPU AI Logic (BFS Pathfinding)
        function cpuMove(snake) {
            const head = snake.body[0];
            const path = bfs(head, food, snake);
            
            if (path.length > 0) {
                const nextMove = path[0];
                snake.nextDx = nextMove.x - head.x;
                snake.nextDy = nextMove.y - head.y;
            } else {
                // Fallback: Try to survive by moving to any valid neighbor
                const moves = [
                    {x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}
                ];
                let validMove = null;
                
                // Shuffle moves to avoid predictable patterns if stuck
                moves.sort(() => Math.random() - 0.5);

                for (let move of moves) {
                    const nextX = head.x + move.x;
                    const nextY = head.y + move.y;
                    
                    if (isValidMove(nextX, nextY, snake)) {
                        snake.nextDx = move.x;
                        snake.nextDy = move.y;
                        validMove = true;
                        break;
                    }
                }
                
                // If no valid move, keep current direction (will likely die)
                if (!validMove) {
                    // Do nothing, let it crash
                }
            }
        }

        function isValidMove(x, y, snake) {
            // Wall check
            if (x < 0 || x >= TILE_COUNT || y < 0 || y >= TILE_COUNT) return false;
            
            // Self collision check
            for (let part of snake.body) {
                if (x === part.x && y === part.y) return false;
            }
            
            // Other snake collision check
            const otherSnake = (snake === snake1) ? snake2 : snake1;
            for (let part of otherSnake.body) {
                if (x === part.x && y === part.y) return false;
            }
            
            return true;
        }

        function bfs(start, target, snake) {
            let queue = [{ pos: start, path: [] }];
            let visited = new Set();
            visited.add(`${start.x},${start.y}`);

            while (queue.length > 0) {
                let current = queue.shift();
                let { pos, path } = current;

                if (pos.x === target.x && pos.y === target.y) {
                    return path;
                }

                const moves = [
                    {x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}
                ];

                for (let move of moves) {
                    let nextX = pos.x + move.x;
                    let nextY = pos.y + move.y;
                    let key = `${nextX},${nextY}`;

                    if (isValidMove(nextX, nextY, snake) && !visited.has(key)) {
                        visited.add(key);
                        let newPath = [...path, {x: nextX, y: nextY}];
                        queue.push({ pos: {x: nextX, y: nextY}, path: newPath });
                    }
                }
            }
            return []; // No path found
        }

        // Initial Draw
        draw();
    </script>
</body>
</html>
