<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .controls {
            margin-bottom: 20px;
        }

        select {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid #4ade80;
            border-radius: 5px;
            background: #1a1a2e;
            color: #fff;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            border-color: #22c55e;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .score {
            background: rgba(74, 222, 128, 0.1);
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #4ade80;
        }

        .score span {
            color: #4ade80;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #4ade80;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            background: #0f0f23;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #4ade80;
            text-align: center;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
        }

        .menu-content h2 {
            color: #4ade80;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .menu-content p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #ccc;
        }

        .btn {
            background: #4ade80;
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #22c55e;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ef4444;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
        }

        .game-over-content h2 {
            color: #ef4444;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .game-over-content p {
            margin-bottom: 30px;
            font-size: 20px;
            color: #fff;
        }

        .winner {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Battle 🐍</h1>
        
        <div class="controls">
            <select id="gameMode">
                <option value="hvh">Human vs Human</option>
                <option value="cvh">CPU vs Human</option>
                <option value="cvc">CPU vs CPU</option>
            </select>
        </div>

        <div class="score-board">
            <div class="score">Player 1: <span id="score1">0</span></div>
            <div class="score">Player 2: <span id="score2">0</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div id="startMenu" class="menu-overlay">
        <div class="menu-content">
            <h2>🐍 Snake Battle 🐍</h2>
            <p>Classic Snake Game on a 30x30 Grid</p>
            <p>Controls: Arrow Keys or WASD to move</p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="gameOver" class="game-over hidden">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p id="winnerText"></p>
            <button class="btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const gridCount = 30;

        let gameInterval;
        let gameMode;
        let isGameOver = false;

        const snake1 = {
            body: [],
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            score: 0,
            color: '#4ade80',
            isCpu: false
        };

        const snake2 = {
            body: [],
            direction: { x: -1, y: 0 },
            nextDirection: { x: -1, y: 0 },
            score: 0,
            color: '#f87171',
            isCpu: false
        };

        let food = { x: 15, y: 15 };

        function initGame() {
            snake1.body = [
                { x: 5, y: 15 },
                { x: 4, y: 15 },
                { x: 3, y: 15 }
            ];
            snake1.direction = { x: 1, y: 0 };
            snake1.nextDirection = { x: 1, y: 0 };
            snake1.score = 0;

            snake2.body = [
                { x: 24, y: 15 },
                { x: 25, y: 15 },
                { x: 26, y: 15 }
            ];
            snake2.direction = { x: -1, y: 0 };
            snake2.nextDirection = { x: -1, y: 0 };
            snake2.score = 0;

            spawnFood();
            isGameOver = false;
            updateScore();
        }

        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * gridCount);
                food.y = Math.floor(Math.random() * gridCount);
                
                validPosition = true;
                for (let segment of snake1.body) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
                for (let segment of snake2.body) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function updateScore() {
            document.getElementById('score1').textContent = snake1.score;
            document.getElementById('score2').textContent = snake2.score;
        }

        function drawGame() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < gridCount; i++) {
                for (let j = 0; j < gridCount; j++) {
                    ctx.strokeStyle = '#1a1a2e';
                    ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
                }
            }

            ctx.fillStyle = snake1.color;
            for (let segment of snake1.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            }

            ctx.fillStyle = snake2.color;
            for (let segment of snake2.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            }

            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake(snake) {
            snake.direction = snake.nextDirection;
            
            const head = { 
                x: snake.body[0].x + snake.direction.x, 
                y: snake.body[0].y + snake.direction.y 
            };

            snake.body.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                snake.score++;
                updateScore();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollision(snake, otherSnake) {
            const head = snake.body[0];

            if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
                return true;
            }

            for (let i = 1; i < snake.body.length; i++) {
                if (snake.body[i].x === head.x && snake.body[i].y === head.y) {
                    return true;
                }
            }

            for (let segment of otherSnake.body) {
                if (segment.x === head.x && segment.y === head.y) {
                    return true;
                }
            }

            return false;
        }

        function getDistance(snake, food) {
            return Math.abs(snake.body[0].x - food.x) + Math.abs(snake.body[0].y - food.y);
        }

        function getBestDirection(snake, food, otherSnake) {
            const directions = [
                { x: 0, y: -1 },
                { x: 0, y: 1 },
                { x: -1, y: 0 },
                { x: 1, y: 0 }
            ];

            let bestDir = snake.direction;
            let minDistance = Infinity;

            for (let dir of directions) {
                const head = { 
                    x: snake.body[0].x + dir.x, 
                    y: snake.body[0].y + dir.y 
                };

                if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
                    continue;
                }

                let collision = false;
                for (let segment of snake.body) {
                    if (segment.x === head.x && segment.y === head.y) {
                        collision = true;
                        break;
                    }
                }
                for (let segment of otherSnake.body) {
                    if (segment.x === head.x && segment.y === head.y) {
                        collision = true;
                        break;
                    }
                }

                if (collision) continue;

                const distance = Math.abs(head.x - food.x) + Math.abs(head.y - food.y);
                if (distance < minDistance) {
                    minDistance = distance;
                    bestDir = dir;
                }
            }

            return bestDir;
        }

        function updateCpu(snake, otherSnake) {
            const food = { x: food.x, y: food.y };
            const bestDir = getBestDirection(snake, food, otherSnake);
            snake.nextDirection = bestDir;
        }

        function updateGame() {
            if (isGameOver) return;

            if (snake1.isCpu) {
                updateCpu(snake1, snake2);
            }
            if (snake2.isCpu) {
                updateCpu(snake2, snake1);
            }

            moveSnake(snake1);
            moveSnake(snake2);

            if (checkCollision(snake1, snake2) || checkCollision(snake2, snake1)) {
                endGame();
                return;
            }

            drawGame();
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);

            let winnerText = '';
            if (snake1.score > snake2.score) {
                winnerText = `🏆 ${snake1.isCpu ? 'CPU 1' : 'Player 1'} Wins!`;
            } else if (snake2.score > snake1.score) {
                winnerText = `🏆 ${snake2.isCpu ? 'CPU 2' : 'Player 2'} Wins!`;
            } else {
                winnerText = '🤝 It\'s a Draw!';
            }

            document.getElementById('winnerText').innerHTML = winnerText;
            document.getElementById('gameOver').classList.remove('hidden');
        }

        function startGame() {
            gameMode = document.getElementById('gameMode').value;
            
            snake1.isCpu = gameMode === 'cvh' || gameMode === 'cvc';
            snake2.isCpu = gameMode === 'cvh' || gameMode === 'cvc';

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOver').classList.add('hidden');
            
            initGame();
            drawGame();
            
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            gameInterval = setInterval(updateGame, 100);
        }

        function restartGame() {
            document.getElementById('gameOver').classList.add('hidden');
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                restartGame();
                return;
            }

            if (gameMode === 'hvh' || gameMode === 'cvh') {
                switch(e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (snake1.direction.y !== 1) {
                            snake1.nextDirection = { x: 0, y: -1 };
                        }
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (snake1.direction.y !== -1) {
                            snake1.nextDirection = { x: 0, y: 1 };
                        }
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (snake1.direction.x !== 1) {
                            snake1.nextDirection = { x: -1, y: 0 };
                        }
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (snake1.direction.x !== -1) {
                            snake1.nextDirection = { x: 1, y: 0 };
                        }
                        break;
                }
            }

            if (gameMode === 'hvh' || gameMode === 'cvh') {
                switch(e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (snake2.direction.y !== 1) {
                            snake2.nextDirection = { x: 0, y: -1 };
                        }
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (snake2.direction.y !== -1) {
                            snake2.nextDirection = { x: 0, y: 1 };
                        }
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (snake2.direction.x !== 1) {
                            snake2.nextDirection = { x: -1, y: 0 };
                        }
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (snake2.direction.x !== -1) {
                            snake2.nextDirection = { x: 1, y: 0 };
                        }
                        break;
                }
            }
        });

        drawGame();
    </script>
</body>
</html>
