<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Growth Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05070f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  border: 1px solid rgba(0, 229, 255, 0.15);
  box-shadow: 0 0 40px rgba(0, 229, 255, 0.08), inset 0 0 60px rgba(5, 7, 15, 0.5);
}
.dg.ac { z-index: 100; }
.dg .cr.color .c input[type=text] { font-size: 10px; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script>

// === SETUP ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800, CX = 400, CY = 400;

let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let paused = false;
let time = 0;
let totalBranches = 0;
let frameCount = 0;

const noiseCanvas = document.createElement('canvas');
noiseCanvas.width = 200;
noiseCanvas.height = 200;
const noiseCtx = noiseCanvas.getContext('2d');

// === GUI ===
const params = {
  neuronCount: 5,
  growthSpeed: 1.2,
  maxDepth: 6,
  splitChance: 0.35,
  curvature: 0.4,
  maxBranchLength: 120,
  synapseDistance: 30,
  synapseGlow: 20,
  pulseSpeed: 0.015,
  pulseFrequency: 0.02,
  pulseBrightness: 1.0,
  backgroundColor: '#05070f',
  branchColor: '#00e5ff',
  accentBranchColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  regenerate() { initNetwork(); },
  clearCanvas() { clearAll(); },
  pauseResume() { paused = !paused; }
};

function setupGUI() {
  const gui = new dat.GUI({ width: 280 });

  const growthFolder = gui.addFolder('Growth');
  growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
  growthFolder.add(params, 'growthSpeed', 0.5, 6, 0.1).name('Growth Speed');
  growthFolder.add(params, 'maxDepth', 2, 10, 1).name('Max Depth');
  growthFolder.add(params, 'splitChance', 0, 0.8, 0.05).name('Split Chance');
  growthFolder.add(params, 'curvature', 0, 1, 0.05).name('Curvature');
  growthFolder.add(params, 'maxBranchLength', 40, 250, 5).name('Max Branch Length');
  growthFolder.open();

  const synFolder = gui.addFolder('Synapses');
  synFolder.add(params, 'synapseDistance', 8, 60, 1).name('Distance Threshold');
  synFolder.add(params, 'synapseGlow', 0, 40, 1).name('Glow Strength');
  synFolder.open();

  const pulseFolder = gui.addFolder('Pulses');
  pulseFolder.add(params, 'pulseSpeed', 0.005, 0.05, 0.001).name('Pulse Speed');
  pulseFolder.add(params, 'pulseFrequency', 0.005, 0.08, 0.001).name('Pulse Frequency');
  pulseFolder.add(params, 'pulseBrightness', 0.2, 2, 0.1).name('Pulse Brightness');
  pulseFolder.open();

  const visFolder = gui.addFolder('Visuals');
  visFolder.addColor(params, 'backgroundColor').name('Background');
  visFolder.addColor(params, 'branchColor').name('Branch Color');
  visFolder.addColor(params, 'accentBranchColor').name('Accent Branch');
  visFolder.addColor(params, 'synapseColor').name('Synapse Color');
  visFolder.addColor(params, 'pulseColor').name('Pulse Color');
  visFolder.open();

  gui.add(params, 'regenerate').name('Regenerate Network');
  gui.add(params, 'clearCanvas').name('Clear Canvas');
  gui.add(params, 'pauseResume').name('Pause / Resume');
}

// === NEURON GROWTH ===
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function rand(a, b) {
  return a + Math.random() * (b - a);
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

function createNeuron() {
  const angle = rand(0, Math.PI * 2);
  const dist = rand(20, 100);
  return {
    x: CX + Math.cos(angle) * dist,
    y: CY + Math.sin(angle) * dist,
    radius: rand(5, 8),
    pulsePhase: rand(0, Math.PI * 2)
  };
}

function createBranch(x, y, angle, depth, parentNeuron) {
  if (depth > params.maxDepth || totalBranches >= 800) return null;

  const length = params.maxBranchLength * rand(0.4, 1.0) * Math.pow(0.75, depth);
  const thickness = Math.max(0.5, rand(1.5, 3.2) - depth * 0.3);
  const isAccent = Math.random() < 0.25;
  const curveOffset = rand(-params.curvature, params.curvature) * 60;
  const midAngle = angle + curveOffset * 0.01;

  const endX = x + Math.cos(angle) * length;
  const endY = y + Math.sin(angle) * length;
  const cpx = x + Math.cos(midAngle) * length * 0.55 + rand(-20, 20);
  const cpy = y + Math.sin(midAngle) * length * 0.55 + rand(-20, 20);

  const branch = {
    x, y, endX, endY, cpx, cpy,
    angle, depth, thickness, isAccent,
    progress: 0,
    growing: true,
    parentNeuron,
    children: [],
    synapsePartner: null,
    id: totalBranches
  };

  totalBranches++;
  branches.push(branch);
  return branch;
}

function growBranches() {
  const speed = params.growthSpeed;
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (!b.growing) continue;

    b.progress += speed * 0.008 + Math.random() * speed * 0.004;
    if (b.progress >= 1) {
      b.progress = 1;
      b.growing = false;

      if (totalBranches < 800) {
        const baseAngle = Math.atan2(b.endY - b.y, b.endX - b.x);
        if (Math.random() < params.splitChance) {
          const spread = rand(0.3, 0.8);
          const child1 = createBranch(b.endX, b.endY, baseAngle - spread, b.depth + 1, b.parentNeuron);
          const child2 = createBranch(b.endX, b.endY, baseAngle + spread, b.depth + 1, b.parentNeuron);
          if (child1) b.children.push(child1);
          if (child2) b.children.push(child2);
        } else if (Math.random() < 0.5) {
          const contAngle = baseAngle + rand(-0.4, 0.4);
          const child = createBranch(b.endX, b.endY, contAngle, b.depth + 1, b.parentNeuron);
          if (child) b.children.push(child);
        }
      }
    }
  }
}

// === SYNAPSE DETECTION ===
function checkSynapses() {
  const tips = [];
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    if (!b.growing && b.depth >= 1 && !b.synapsePartner) {
      tips.push(b);
    }
  }
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i];
      const bk = tips[j];
      if (a.parentNeuron === bk.parentNeuron) continue;
      if (a.synapsePartner || bk.synapsePartner) continue;
      const dx = a.endX - bk.endX;
      const dy = a.endY - bk.endY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < params.synapseDistance) {
        a.synapsePartner = bk;
        bk.synapsePartner = a;
        synapses.push({
          pointA: a,
          pointB: bk,
          phase: rand(0, Math.PI * 2),
          pulseTimer: rand(0, 1)
        });
      }
    }
  }
}

// === PULSE ANIMATION ===
function spawnPulses() {
  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    s.pulseTimer += params.pulseFrequency;
    if (s.pulseTimer >= 1) {
      s.pulseTimer -= 1;
      pulses.push({
        synapse: s,
        t: 0,
        reverse: Math.random() < 0.5
      });
    }
  }
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].t += params.pulseSpeed;
    if (pulses[i].t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

// === RENDERING ===
function drawBackground() {
  const bgRgb = hexToRgb(params.backgroundColor);
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 350);
  grad.addColorStop(0, 'rgba(16,26,58,0.4)');
  grad.addColorStop(1, `rgba(${bgRgb.r},${bgRgb.g},${bgRgb.b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 0.5;
  const spacing = 40;
  for (let x = spacing; x < W; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = spacing; y < H; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function generateNoiseFrame() {
  const imgData = noiseCtx.createImageData(200, 200);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = v;
    data[i + 1] = v;
    data[i + 2] = v;
    data[i + 3] = 255;
  }
  noiseCtx.putImageData(imgData, 0, 0);
}

function drawNoise() {
  if (frameCount % 4 === 0) {
    generateNoiseFrame();
  }
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(noiseCanvas, 0, 0, W, H);
  ctx.restore();
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawVignette() {
  const grad = ctx.createRadialGradient(CX, CY, W * 0.28, CX, CY, W * 0.58);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawBranch(b) {
  if (b.progress <= 0) return;

  const rgb = b.isAccent ? hexToRgb(params.accentBranchColor) : hexToRgb(params.branchColor);
  const alpha = Math.max(0.3, 1 - b.depth * 0.08);
  const t = b.progress;
  const t1 = 1 - t;
  const cpxDraw = b.x + (b.cpx - b.x) * t;
  const cpyDraw = b.y + (b.cpy - b.y) * t;
  const tipX = t1 * t1 * b.x + 2 * t1 * t * b.cpx + t * t * b.endX;
  const tipY = t1 * t1 * b.y + 2 * t1 * t * b.cpy + t * t * b.endY;

  ctx.save();
  ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha * 0.7})`;
  ctx.shadowBlur = b.isAccent ? 10 : 6;
  ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
  ctx.lineWidth = b.thickness;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.quadraticCurveTo(cpxDraw, cpyDraw, tipX, tipY);
  ctx.stroke();
  ctx.restore();
}

function drawNeuron(n) {
  const glow = 0.6 + 0.4 * Math.sin(time * 1.5 + n.pulsePhase);
  ctx.save();

  // Outer halo
  ctx.shadowColor = `rgba(255,212,0,${0.5 * glow})`;
  ctx.shadowBlur = 30 * glow;
  ctx.fillStyle = `rgba(255,212,0,${0.15 * glow})`;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.radius * 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Mid glow
  ctx.shadowColor = `rgba(255,212,0,${0.7 * glow})`;
  ctx.shadowBlur = 16 * glow;
  ctx.fillStyle = `rgba(255,212,0,${0.6 * glow})`;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.radius * 1.4, 0, Math.PI * 2);
  ctx.fill();

  // Core
  ctx.shadowColor = `rgba(255,212,0,${0.9 * glow})`;
  ctx.shadowBlur = 10 * glow;
  ctx.fillStyle = 'rgba(255,212,0,0.95)';
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
  ctx.fill();

  // White center
  ctx.shadowBlur = 4;
  ctx.fillStyle = `rgba(255,255,255,${0.6 * glow})`;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.radius * 0.35, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSynapses() {
  const synRgb = hexToRgb(params.synapseColor);
  const glowStrength = params.synapseGlow;

  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const pulse = 0.4 + 0.6 * (Math.sin(time * 2 + s.phase) * 0.5 + 0.5);
    const alpha = pulse * Math.min(1, glowStrength / 20);

    ctx.save();
    ctx.shadowColor = `rgba(${synRgb.r},${synRgb.g},${synRgb.b},${alpha})`;
    ctx.shadowBlur = Math.max(1, glowStrength * 0.5 * pulse);
    ctx.strokeStyle = `rgba(${synRgb.r},${synRgb.g},${synRgb.b},${alpha * 0.5})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(s.pointA.endX, s.pointA.endY);
    ctx.lineTo(s.pointB.endX, s.pointB.endY);
    ctx.stroke();

    ctx.fillStyle = `rgba(${synRgb.r},${synRgb.g},${synRgb.b},${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(s.pointA.endX, s.pointA.endY, 2 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.pointB.endX, s.pointB.endY, 2 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPulses() {
  const pulseRgb = hexToRgb(params.pulseColor);

  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const a = p.synapse.pointA;
    const b = p.synapse.pointB;
    const from = p.reverse ? b : a;
    const to = p.reverse ? a : b;
    const t = smoothstep(p.t);
    const x = from.endX + (to.endX - from.endX) * t;
    const y = from.endY + (to.endY - from.endY) * t;
    const fade = 1 - Math.abs(p.t - 0.5) * 2;
    const alpha = fade * params.pulseBrightness;

    ctx.save();
    // Outer glow
    ctx.shadowColor = `rgba(${pulseRgb.r},${pulseRgb.g},${pulseRgb.b},${alpha})`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `rgba(${pulseRgb.r},${pulseRgb.g},${pulseRgb.b},${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();

    // White center core
    ctx.shadowBlur = 6;
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.7})`;
    ctx.beginPath();
    ctx.arc(x, y, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// === MAIN LOOP ===
function initNetwork() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  totalBranches = 0;

  const count = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
  for (let i = 0; i < count; i++) {
    neurons.push(createNeuron());
  }

  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    const numInitial = Math.floor(rand(3, 7));
    for (let j = 0; j < numInitial; j++) {
      const angle = (Math.PI * 2 / numInitial) * j + rand(-0.3, 0.3);
      createBranch(n.x, n.y, angle, 0, n);
    }
  }
}

function clearAll() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  totalBranches = 0;
}

function animate() {
  requestAnimationFrame(animate);
  if (paused) return;

  time += 0.016;
  frameCount++;

  // 1. Background
  drawBackground();
  // 2. Grid
  drawGrid();
  // 3. Branches
  growBranches();
  for (let i = 0; i < branches.length; i++) {
    drawBranch(branches[i]);
  }
  // 4. Synapses
  checkSynapses();
  drawSynapses();
  // 5. Pulses
  spawnPulses();
  updatePulses();
  drawPulses();
  // 6. Neurons
  for (let i = 0; i < neurons.length; i++) {
    drawNeuron(neurons[i]);
  }
  // 7. Post-processing
  drawScanlines();
  drawVignette();
  drawNoise();
}

// === START ===
setupGUI();
generateNoiseFrame();
initNetwork();
animate();

</script>
</body>
</html>
