<head>

    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --border-color: #3e3e42;
            --highlight-color: #3a3d41;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.2rem; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        canvas {
            background-color: #000;
            image-rendering: pixelated;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 640px;
        }

        button, select, input[type="file"] {
            background-color: var(--highlight-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover { background-color: var(--accent-color); color: white; }
        
        .speed-control { display: flex; align-items: center; gap: 5px; }
        input[type="range"] { width: 100px; }

        .debugger-panel {
            flex: 1;
            background-color: var(--panel-bg);
            padding: 15px;
            overflow-y: auto;
            min-width: 300px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
        }

        .debug-section { margin-bottom: 20px; }
        .debug-section h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 0; }

        .reg-label { color: #888; font-size: 0.7rem; }

        .mem-line { white-space: pre; line-height: 1.2; }

            border-radius: 4px;

        this.reset();

    reset() {
        this.memory = new Uint8Array(MEMORY_SIZE);
        this.V = new Uint8Array(16); // V0 to VF
        this.I = 0; // Index register
        this.pc = PROGRAM_START; // Program Counter
        this.stack = new Array(STACK_SIZE).fill(0);
        this.sp = 0; // Stack Pointer
        
        this.delayTimer = 0;
        this.soundTimer = 0;
        
        this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
        this.keys = new Uint8Array(16); // Stores state of keys 0-F
        
        this.isRunning = false;
        this.hexMode = true;
        
        // Load fonts
        for (let i = 0; i < FONTS.length; i++) {
            this.memory[FONT_START + i] = FONTS[i];
        }
    }

    loadRom(romData) {
        // Clear memory first to avoid garbage
        this.reset();
        
        // Load ROM at PROGRAM_START
        for (let i = 0; i < romData.length; i++) {
            if (PROGRAM_START + i < MEMORY_SIZE) {
                this.memory[PROGRAM_START + i] = romData[i];
            }
        }
        this.pc = PROGRAM_START;
    }

    cycle() {
        if (!this.isRunning) return;

        // Fetch
        const opcode = (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
        
        // Decode and Execute
        switch (opcode & 0xF000) {
            case 0x0000:
                if (opcode === 0x00E0) {
                    // Clear Screen
                    this.display.fill(0);
                    this.pc += 2;
                } else if (opcode === 0x00EE) {
                    // Return from subroutine
                    this.sp--;
                    this.pc = this.stack[this.sp];
                    this.pc += 2;
                } else {
                    // CLS or other system calls (ignored for now)
                    this.pc += 2;
                }
                break;
            case 0x1000:
                // Jump to address NNN
                this.pc = opcode & 0x0FFF;
                break;
            case 0x2000:
                // Call subroutine at NNN
                this.stack[this.sp] = this.pc;
                this.sp++;
                this.pc = opcode & 0x0FFF;
                break;

                // Skip next if VX == NN
                if (this.V[(opcode & 0x0F00) >> 8] === (opcode & 0x00FF)) {
                    this.pc += 4;
                } else {
                    this.pc += 2;
                }
                break;
            case 0x4000:
                // Skip next if VX != NN
                if (this.V[(opcode & 0x0F00) >> 8] !== (opcode & 0x00FF)) {
                    this.pc += 4;
                } else {
                    this.pc += 2;
                }
                break;
            case 0x5000:
                // Skip next if VX == VY
                if (this.V[(opcode & 0x0F00) >> 8] === this.V[(opcode & 0x00F0) >> 4]) {
                    this.pc += 4;
                } else {
                    this.pc += 2;
                }
                break;
            case 0x6000:
                // Set VX = NN
                this.V[(opcode & 0x0F00) >> 8] = opcode & 0x00FF;
                this.pc += 2;
                break;
            case 0x7000:
                // Add NN to VX
                this.V[(opcode & 0x0F00) >> 8] += opcode & 0x00FF;
                this.pc += 2;
                break;
            case 0x8000:
                const VX = (opcode & 0x0F00) >> 8;
                const VY = (opcode & 0x00F0) >> 4;
                switch (opcode & 0x000F) {
                    case 0x0: this.V[VX] = this.V[VY]; break;
                    case 0x1: this.V[VX] |= this.V[VY]; break;
                    case 0x2: this.V[VX] &= this.V[VY]; break;
                    case 0x3: this.V[VX] ^= this.V[VY]; break;
                    case 0x4:
                        const sum = this.V[VX] + this.V[VY];
                        this.V[VX] = sum & 0xFF;
                        this.V[0xF] = sum > 0xFF ? 1 : 0;
                        break;
                    case 0x5:
                        const sub = this.V[VX] - this.V[VY];
                        this.V[VX] = sub & 0xFF;
                        this.V[0xF] = sub >= 0 ? 1 : 0;
                        break;
                    case 0x6:
                        this.V[VX] >>= 1;
                        this.V[0xF] = this.V[VX] & 1; // LSB was shifted out? No, MSB of original.
                        // Actually VF = LSB of VX before shift
                        break;
                    case 0x7:
                        const sub2 = this.V[VY] - this.V[VX];
                        this.V[VX] = sub2 & 0xFF;
                        this.V[0xF] = sub2 >= 0 ? 1 : 0;
                        break;
                    case 0xE:
                        this.V[VX] <<= 1;
                        this.V[0xF] = (this.V[VX] >> 8) & 1;
                        this.V[VX] &= 0xFF;
                        break;
                }
                this.pc += 2;
                break;
            case 0x9000:
                // Skip next if VX != VY
                if (this.V[(opcode & 0x0F00) >> 8] !== this.V[(opcode & 0x00F0) >> 4]) {
                    this.pc += 4;
                } else {
                    this.pc += 2;
                }
                break;
            case 0xA000:
                // Set I = NNN
                this.I = opcode & 0x0FFF;
                this.pc += 2;
                break;
            case 0xB000:
                // Jump to V0 + NNN
                this.pc = (opcode & 0x0FFF) + this.V[0];
                break;
            case 0xC000:
                // VX = Rand & NN
                const rand = Math.floor(Math.random() * 256);
                this.V[(opcode & 0x0F00) >> 8] = rand & (opcode & 0x00FF);
                this.pc += 2;
                break;
            case 0xD000:
                const VX = (opcode & 0x0F00) >> 8;
                const VY = (opcode & 0x00F0) >> 4;
                const height = opcode & 0x000F;
                
                this.V[0xF] = 0;
                
                for (let row = 0; row < height; row++) {
                    const spriteByte = this.memory[this.I + row];
                    const y = this.V[VY] + row;
                    
                    if (y >= DISPLAY_HEIGHT) continue; // Optimization
                    
                    for (let col = 0; col < 8; col++) {
                        const x = this.V[VX] + col;
                        if (x >= DISPLAY_WIDTH) continue;
                        
                        if ((spriteByte & (0x80 >> col)) !== 0) {
                            const idx = y * DISPLAY_WIDTH + x;
                            if (this.display[idx] === 1) {
                                this.V[0xF] = 1; // Collision
                            }
                            this.display[idx] ^= 1;
                        }
                    }
                }
                this.pc += 2;
                break;
            case 0xE000:
                if (opcode & 0x00FF === 0x9E) {
                    // Skip if key VX is pressed
                    const key = this.V[(opcode & 0x0F00) >> 8];
                    if (this.keys[key]) {
                        this.pc += 4;
                    } else {
                        this.pc += 2;
                    }
                } else if (opcode & 0x00FF === 0xA1) {
                    // Skip if key VX is NOT pressed
                    const key = this.V[(opcode & 0x0F00) >> 8];
                    if (!this.keys[key]) {
                        this.pc += 4;
                    } else {
                        this.pc += 2;
                    }
                } else {
                    this.pc += 2;
                }
                break;
            case 0xF000:
                const VX = (opcode & 0x0F00) >> 8;
                switch (opcode & 0x00FF) {
                    case 0x07: this.V[VX] = this.delayTimer; break;
                    case 0x0A: 
                        // Wait for key press
                        let pressed = false;
                        for(let k=0; k<16; k++) {
                            if(this.keys[k]) {
                                this.V[VX] = k;
                                pressed = true;
                                break;
                            }
                        }
                        if(!pressed) return; // Don't advance PC until key is pressed
                        this.pc += 2;
                        break;
                    case 0x15: this.delayTimer = this.V[VX]; break;
                    case 0x18: this.soundTimer = this.V[VX]; break;
                    case 0x1E: this.I += this.V[VX]; break;
                    case 0x29: 
                        // Set I to font location for digit VX
                        this.I = FONT_START + (this.V[VX] * 5);
                        break;
                    case 0x33:
                        // BCD of VX
                        this.memory[this.I] = Math.floor(this.V[VX] / 100);
                        this.memory[this.I + 1] = Math.floor((this.V[VX] % 100) / 10);
                        this.memory[this.I + 2] = this.V[VX] % 10;
                        break;
                    case 0x55:
                        // Store V0 to VX in memory starting at I
                        for (let j = 0; j <= VX; j++) {
                            this.memory[this.I + j] = this.V[j];
                        }
                        break;
                    case 0x65:
                        // Read from memory starting at I into V0 to VX
                        for (let j = 0; j <= VX; j++) {
                            this.V[j] = this.memory[this.I + j];
                        }
                        break;
                    default:
                        break;
                }
                this.pc += 2;
                break;
            default:
                this.pc += 2;
                break;
        }

        // Update Timers
        if (this.delayTimer > 0) this.delayTimer--;
        if (this.soundTimer > 0) this.soundTimer--;
    }
}

// --- UI and Logic ---

const canvas = document.getElementById('display');
const ctx = canvas.getContext('2d');
const chip8 = new Chip8();

// State
let isRunning = false;
let instructionCount = 0;
let speed = 50;
let lastTime = 0;

// DOM Elements
const btnRun = document.getElementById('btn-run');
const btnPause = document.getElementById('btn-pause');
const btnStep = document.getElementById('btn-step');
const btnReset = document.getElementById('btn-reset');
const romLoader = document.getElementById('rom-loader');
const speedRange = document.getElementById('speed-range');
const speedVal = document.getElementById('speed-val');

// Initialize Display
function updateDisplay() {
    const imageData = ctx.createImageData(DISPLAY_WIDTH, DISPLAY_HEIGHT);
    const data = imageData.data;
    
    for (let i = 0; i < chip8.display.length; i++) {
        const idx = i * 4;
        if (chip8.display[i]) {
            data[idx] = 0;     // R
            data[idx + 1] = 255; // G
            data[idx + 2] = 0;   // B
            data[idx + 3] = 255; // A
        } else {
            data[idx] = 0;
            data[idx + 1] = 0;
            data[idx + 2] = 0;
            data[idx + 3] = 255;
        }
    }
    
    // Scale up using temporary canvas or just drawImage with scaling
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = DISPLAY_WIDTH;
    tempCanvas.height = DISPLAY_HEIGHT;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
}

function updateDebugger() {
    // Registers
    const regContainer = document.getElementById('registers-display');
    regContainer.innerHTML = '';
    for (let i = 0; i < 16; i++) {
        const div = document.createElement('div');
        div.className = 'reg-item';
        div.innerHTML = `<span class="reg-label">V${i.toString(16).toUpperCase()}:</span> ${chip8.V[i].toString(16).toUpperCase().padStart(2,'0')}`;
        regContainer.appendChild(div);
    }

    // Special Registers
    document.getElementById('reg-i').textContent = '0x' + chip8.I.toString(16).toUpperCase().padStart(3, '0');
    document.getElementById('reg-pc').textContent = '0x' + chip8.pc.toString(16).toUpperCase().padStart(3, '0');
    document.getElementById('reg-dt').textContent = chip8.delayTimer;
    document.getElementById('reg-st').textContent = chip8.soundTimer;

    // Stack
    const stackContainer = document.getElementById('stack-display');
    stackContainer.innerHTML = '';
    for (let i = 0; i < STACK_SIZE; i++) {
        if (i < chip8.sp) {
            const div = document.createElement('div');
            div.className = 'reg-item';
            div.textContent = `SP[${i}]: 0x${chip8.stack[i].toString(16).toUpperCase().padStart(4, '0')}`;
            stackContainer.appendChild(div);
        }
    }

    // Current Instruction
    const opcode = (chip8.memory[chip8.pc] << 8) | chip8.memory[chip8.pc + 1];
    document.getElementById('current-instr').textContent = '0x' + opcode.toString(16).toUpperCase().padStart(4, '0');
    
    // Decode Instruction Text
    let decoded = '';
    const op1 = (opcode & 0xF000) >> 12;
    const vx = (opcode & 0x0F00) >> 8;
    const vy = (opcode & 0x00F0) >> 4;
    const nn = opcode & 0x00FF;
    const nnn = opcode & 0x0FFF;
    
    switch(op1) {
        case 0: decoded = `CLS/RET`; break;
        case 1: decoded = `JUMP 0x${nnn.toString(16).toUpperCase()}`; break;
        case 2: decoded = `CALL 0x${nnn.toString(16).toUpperCase()}`; break;
        case 3: decoded = `SE V${vx.toString(16)}, ${nn.toString(16)}`; break;
        case 4: decoded = `SNE V${vx.toString(16)}, ${nn.toString(16)}`; break;
        case 5: decoded = `SE V${vx.toString(16)}, V${vy.toString(16)}`; break;
        case 6: decoded = `LD V${vx.toString(16)}, ${nn.toString(16)}`; break;
        case 7: decoded = `ADD V${vx.toString(16)}, ${nn.toString(16)}`; break;
        case 8: 
            const op2 = opcode & 0x000F;
            if(op2===0) decoded=`LD V${vx.toString(16)}, V${vy.toString(16)}`;
            else if(op2===4) decoded=`ADD V${vx.toString(16)}, V${vy.toString(16)} (CF)`;
            else if(op2===5) decoded=`SUB V${vx.toString(16)}, V${vy.toString(16)} (BF)`;
            else if(op2===6) decoded=`SHR V${vx.toString(16)}`;
            else if(op2===7) decoded=`SUBN V${vx.toString(16)}, V${vy.toString(16)} (BF)`;
            else if(op2===E) decoded=`SHL V${vx.toString(16)}`;
            else decoded = `8XY${op2.toString(16)}`;
            break;
        case 9: decoded = `SNE V${vx.toString(16)}, V${vy.toString(16)}`; break;
        case 0xA: decoded = `LD I, 0x${nnn.toString(16).toUpperCase()}`; break;
        case 0xB: decoded = `JUMP V0 + 0x${nnn.toString(16).toUpperCase()}`; break;
        case 0xC: decoded = `RND V${vx.toString(16)}, ${nn.toString(16)}`; break;
        case 0xD: decoded = `DRW V${vx.toString(16)}, V${vy.toString(16)}, ${nn}`; break;
        case 0xE: 
            if(nn===0x9E) decoded=`SKP V${vx.toString(16)}`;
            else if(nn===0xA1) decoded=`SKNP V${vx.toString(16)}`;
            else decoded = `EX${nn.toString(16)}`;
            break;
        case 0xF: 
            const op3 = opcode & 0x00FF;
            if(op3===0x07) decoded=`LD V${vx.toString(16)}, DT`;
            else if(op3===0x0A) decoded=`LD V${vx.toString(16)}, KEY`;
            else if(op3===0x15) decoded=`LD DT, V${vx.toString(16)}`;
            else if(op3===0x18) decoded=`LD ST, V${vx.toString(16)}`;
            else if(op3===0x1E) decoded=`ADD I, V${vx.toString(16)}`;
            else if(op3===0x29) decoded=`LD F, V${vx.toString(16)}`;
            else if(op3===0x33) decoded=`BCD V${vx.toString(16)}`;
            else if(op3===0x55) decoded=`STOR [I], V${vx.toString(16)}`;
            else if(op3===0x65) decoded=`LD V${vx.toString(16)}, [I]`;
            else decoded = `FX${op3.toString(16).toUpperCase()}`;
            break;
    }
    document.getElementById('instr-decoded').textContent = decoded;

    // Memory View (0x200 - 0x2FF)
    const memContainer = document.getElementById('memory-display');
    memContainer.innerHTML = '';
    for (let i = 0; i < 16; i++) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'mem-line';
        let lineStr = `0x${(PROGRAM_START + i*16).toString(16).toUpperCase().padStart(3,'0')}: `;
        for (let j = 0; j < 16; j++) {
            const addr = PROGRAM_START + i*16 + j;
            const val = chip8.memory[addr];
            if (addr === chip8.pc) {
                lineStr += `<span class="mem-highlight">${val.toString(16).toUpperCase().padStart(2,'0')}</span> `;
            } else {
                lineStr += `${val.toString(16).toUpperCase().padStart(2,'0')} `;
            }
        }
        lineDiv.innerHTML = lineStr;
        memContainer.appendChild(lineDiv);
    }
}

// Input Handling
const keyMap = {
    '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
    'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
    'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
    'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
};

document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
        chip8.keys[keyMap[key]] = 1;
        updateKeypadUI(keyMap[key], true);
    }
});

document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (keyMap[key] !== undefined) {
        chip8.keys[keyMap[key]] = 0;
        updateKeypadUI(keyMap[key], false);
    }
});

function updateKeypadUI(keyIndex, isActive) {
    const keys = document.querySelectorAll('.key-btn');
    keys.forEach(k => {
        if (parseInt(k.dataset.key, 16) === keyIndex) {
            if (isActive) k.classList.add('active');
            else k.classList.remove('active');
        }
    });
}

// Controls
btnRun.addEventListener('click', () => {
    chip8.isRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

btnPause.addEventListener('click', () => {
    chip8.isRunning = false;
});

btnStep.addEventListener('click', () => {
    chip8.isRunning = false;
    chip8.cycle();
    updateDisplay();
    updateDebugger();
});

btnReset.addEventListener('click', () => {
    chip8.reset();
    updateDisplay();
    updateDebugger();
});

romLoader.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
        const romData = new Uint8Array(evt.target.result);
        chip8.loadRom(romData);
        updateDisplay();
        updateDebugger();
    };
    reader.readAsArrayBuffer(file);
});

speedRange.addEventListener('input', (e) => {
    speed = parseInt(e.target.value);
    speedVal.textContent = speed;
});

// Game Loop
function gameLoop(timestamp) {
    if (!chip8.isRunning) return;

    const interval = 1000 / (speed * 2); // Adjust speed multiplier
    
    if (timestamp - lastTime >= interval) {
        chip8.cycle();
        updateDisplay();
        updateDebugger();
        lastTime = timestamp;
    }
    
    requestAnimationFrame(gameLoop);
}

// Initial Load
chip8.loadDemoRom();
updateDisplay();
updateDebugger();

</script>
