<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #9ca3af;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --border: #e5e7eb;
    --done: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #todo-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s;
  }
  #todo-input:focus { border-color: var(--accent); }
  #add-btn {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  #add-btn:hover { background: var(--accent-hover); }
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    flex: 1;
    padding: 8px 0;
    font-size: .9rem;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text); }
  .filter-btn.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }
  ul#todo-list { list-style: none; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .todo-item:last-child { border-bottom: none; }
  .todo-checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--done);
    cursor: pointer;
  }
  .todo-text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
    cursor: pointer;
  }
  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .delete-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .delete-btn:hover { color: #fff; background: var(--danger); }
  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-size: .85rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  #clear-completed {
    background: none;
    border: none;
    color: var(--muted);
    font-size: .85rem;
    cursor: pointer;
  }
  #clear-completed:hover { color: var(--danger); text-decoration: underline; }
</style>
</head>
<body>
  <main class="app">
    <h1>Todos</h1>
    <section class="card">
      <form id="todo-form" class="input-row" autocomplete="off">
        <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="200" aria-label="New todo">
        <button id="add-btn" type="submit">Add</button>
      </form>
      <div class="filters" role="group" aria-label="Filter todos">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <ul id="todo-list"></ul>
      <div class="footer">
        <span id="items-left">0 items left</span>
        <button id="clear-completed">Clear completed</button>
      </div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todos.ollama-qwen3.8-flash-next-125b-a6b-q4_01';

  /** @type {{id:string,text:string,completed:boolean}[]} */
  var todos = load();
  var filter = 'all';

  var form = document.getElementById('todo-form');
  var input = document.getElementById('todo-input');
  var listEl = document.getElementById('todo-list');
  var itemsLeftEl = document.getElementById('items-left');
  var clearBtn = document.getElementById('clear-completed');
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll('.filter-btn'));

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter(function (t) {
        return t && typeof t.text === 'string';
      }) : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) { /* storage unavailable — app still works in-memory */ }
  }

  function addTodo(text) {
    todos.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      text: text,
      completed: false
    });
    save();
    render();
  }

  function toggleTodo(id) {
    todos.forEach(function (t) {
      if (t.id === id) t.completed = !t.completed;
    });
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    save();
    render();
  }

  function visibleTodos() {
    if (filter === 'active') return todos.filter(function (t) { return !t.completed; });
    if (filter === 'completed') return todos.filter(function (t) { return t.completed; });
    return todos;
  }

  function render() {
    listEl.innerHTML = '';
    var items = visibleTodos();

    if (items.length === 0) {
      var empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = filter === 'all'
        ? 'No todos yet. Add one above!'
        : (filter === 'active' ? 'Nothing active — nice work!' : 'No completed todos yet.');
      listEl.appendChild(empty);
    } else {
      items.forEach(function (t) {
        var li = document.createElement('li');
        li.className = 'todo-item' + (t.completed ? ' completed' : '');

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'todo-checkbox';
        cb.checked = t.completed;
        cb.setAttribute('aria-label', t.completed ? 'Mark as active' : 'Mark as complete');
        cb.addEventListener('change', function () { toggleTodo(t.id); });

        var span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = t.text;
        span.addEventListener('click', function () { toggleTodo(t.id); });

        var del = document.createElement('button');
        del.className = 'delete-btn';
        del.type = 'button';
        del.textContent = '\u00d7';
        del.setAttribute('aria-label', 'Delete todo');
        del.addEventListener('click', function () { deleteTodo(t.id); });

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    var activeCount = todos.filter(function (t) { return !t.completed; }).length;
    itemsLeftEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    var hasCompleted = todos.some(function (t) { return t.completed; });
    clearBtn.style.visibility = hasCompleted ? 'visible' : 'hidden';

    filterBtns.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addTodo(text);
    input.value = '';
    input.focus();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filter = btn.dataset.filter;
      render();
    });
  });

  clearBtn.addEventListener('click', clearCompleted);

  render();
})();
</script>
</body>
</html>
