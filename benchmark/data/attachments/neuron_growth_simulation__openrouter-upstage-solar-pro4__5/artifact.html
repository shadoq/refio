<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuron Growth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  canvas {
    display: block;
    box-shadow: 0 0 40px rgba(0,229,255,0.15), 0 0 80px rgba(0,229,255,0.05);
    border-radius: 2px;
  }
  #gui-container {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<div id="gui-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// ============================================================
// SETUP
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

// Neon palette
const PALETTE = {
  bg: '#05070f',
  bgGlow: '#101a3a',
  branch: '#00e5ff',
  accent: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  ui: '#ffd400',
  grid: 'rgba(0,229,255,0.08)'
};

// State
let paused = false;
let growthComplete = false;
let neurons = [];
let synapses = [];
let pulses = [];
let frameCount = 0;

// ============================================================
// GUI
// ============================================================
const gui = new dat.GUI({ container: document.getElementById('gui-container'), width: 280 });

const params = {
  // Growth
  neuronCount: 4,
  branchGrowthSpeed: 0.8,
  maxBranchDepth: 6,
  branchSplitChance: 0.35,
  branchCurvature: 0.4,
  maxBranchLength: 120,
  // Synapses
  synapseDistanceThreshold: 35,
  synapseGlowStrength: 1.0,
  // Pulses
  pulseSpeed: 2.5,
  pulseFrequency: 0.02,
  pulseBrightness: 1.0,
  // Visuals
  backgroundColor: '#05070f',
  branchColor: '#00e5ff',
  accentBranchColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a'
};

// Folders
const fGrowth = gui.addFolder('Growth');
const fSynapses = gui.addFolder('Synapses');
const fPulses = gui.addFolder('Pulses');
const fVisuals = gui.addFolder('Visuals');

// Growth controls
fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(regenerate);
fGrowth.add(params, 'branchGrowthSpeed', 0.1, 3.0, 0.1).name('Growth Speed');
fGrowth.add(params, 'maxBranchDepth', 2, 10, 1).name('Max Depth');
fGrowth.add(params, 'branchSplitChance', 0.05, 0.8, 0.05).name('Split Chance');
fGrowth.add(params, 'branchCurvature', 0.0, 1.0, 0.05).name('Curvature');
fGrowth.add(params, 'maxBranchLength', 30, 250, 5).name('Max Length');

// Synapse controls
fSynapses.add(params, 'synapseDistanceThreshold', 10, 80, 1).name('Distance Threshold');
fSynapses.add(params, 'synapseGlowStrength', 0.2, 2.5, 0.1).name('Glow Strength');

// Pulse controls
fPulses.add(params, 'pulseSpeed', 0.5, 6.0, 0.1).name('Pulse Speed');
fPulses.add(params, 'pulseFrequency', 0.005, 0.08, 0.005).name('Frequency');
fPulses.add(params, 'pulseBrightness', 0.2, 2.0, 0.1).name('Brightness');

// Visual controls
fVisuals.addColor(params, 'backgroundColor').name('Background').onChange(v => { PALETTE.bg = v; });
fVisuals.addColor(params, 'branchColor').name('Branch Color').onChange(v => { PALETTE.branch = v; });
fVisuals.addColor(params, 'accentBranchColor').name('Accent Color').onChange(v => { PALETTE.accent = v; });
fVisuals.addColor(params, 'synapseColor').name('Synapse Color').onChange(v => { PALETTE.synapse = v; });
fVisuals.addColor(params, 'pulseColor').name('Pulse Color').onChange(v => { PALETTE.pulse = v; });

// Buttons
const btnFolder = gui.addFolder('Actions');
btnFolder.add({ regenerate: regenerate }, 'regenerate').name('Regenerate Network');
btnFolder.add({ clear: clearCanvas }, 'clear').name('Clear Canvas');
btnFolder.add({ togglePause: togglePause }, 'togglePause').name(paused ? 'Resume' : 'Pause');

function togglePause() {
  paused = !paused;
  btnFolder.controllers[2].name(paused ? 'Resume' : 'Pause');
}

// ============================================================
// NEURON GROWTH
// ============================================================
class Branch {
  constructor(x, y, angle, depth, parent) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.depth = depth;
    this.parent = parent;
    this.length = 0;
    this.maxLength = params.maxBranchLength * (1 - depth * 0.08) + 20;
    this.thickness = Math.max(1.5, 4 - depth * 0.5);
    this.alive = true;
    this.tipX = x;
    this.tipY = y;
    this.points = [{ x, y }];
    this.curvatureOffset = (Math.random() - 0.5) * params.branchCurvature * 2;
    this.sideBranches = [];
    this.color = depth === 0 ? PALETTE.branch : (depth % 2 === 0 ? PALETTE.branch : PALETTE.accent);
  }

  grow() {
    if (!this.alive) return;
    const step = params.branchGrowthSpeed * (0.5 + Math.random() * 0.5);
    this.length += step;
    if (this.length >= this.maxLength) {
      this.alive = false;
      this.trySplit();
      return;
    }
    this.angle += this.curvatureOffset + (Math.random() - 0.5) * 0.15;
    const nx = this.x + Math.cos(this.angle) * step;
    const ny = this.y + Math.sin(this.angle) * step;
    this.tipX = nx;
    this.tipY = ny;
    this.points.push({ x: nx, y: ny });
  }

  trySplit() {
    if (this.depth >= params.maxBranchDepth) return;
    if (Math.random() < params.branchSplitChance) {
      const childAngle = this.angle + (Math.random() - 0.5) * 1.2;
      const child = new Branch(this.tipX, this.tipY, childAngle, this.depth + 1, this);
      this.sideBranches.push(child);
      neurons.push(child);
    }
  }

  draw() {
    if (this.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length - 1; i++) {
      const p0 = this.points[i - 1];
      const p1 = this.points[i];
      const p2 = this.points[i + 1];
      const cpx = p1.x + (p2.x - p0.x) * 0.15;
      const cpy = p1.y + (p2.y - p0.y) * 0.15;
      ctx.quadraticCurveTo(cpx, cpy, p2.x, p2.y);
    }
    const last = this.points[this.points.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
}

class Neuron {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.branches = [];
    this.radius = 6;
    this.seed = true;
  }

  growBranch() {
    const angle = Math.random() * Math.PI * 2;
    const branch = new Branch(this.x, this.y, angle, 0, null);
    this.branches.push(branch);
    neurons.push(branch);
  }

  draw() {
    // Glow
    ctx.shadowColor = PALETTE.branch;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.branch;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
}

function regenerate() {
  clearCanvas();
  neurons = [];
  synapses = [];
  pulses = [];
  growthComplete = false;

  const count = params.neuronCount;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const dist = 15 + Math.random() * 25;
    const nx = CX + Math.cos(angle) * dist;
    const ny = CY + Math.sin(angle) * dist;
    const neuron = new Neuron(nx, ny);
    neurons.push(neuron);
    // Initial branches
    for (let b = 0; b < 2; b++) {
      neuron.growBranch();
    }
  }
}

function clearCanvas() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
// SYNAPSE DETECTION
// ============================================================
function detectSynapses() {
  const threshold = params.synapseDistanceThreshold;
  const existing = new Set();

  for (let i = 0; i < neurons.length; i++) {
    for (let j = i + 1; j < neurons.length; j++) {
      const a = neurons[i];
      const b = neurons[j];
      const dx = a.tipX - b.tipX;
      const dy = a.tipY - b.tipY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < threshold) {
        const key = `${Math.min(i,j)}-${Math.max(i,j)}`;
        if (!existing.has(key)) {
          existing.add(key);
          synapses.push({
            a: a,
            b: b,
            x1: a.tipX,
            y1: a.tipY,
            x2: b.tipX,
            y2: b.tipY,
            glow: 0,
            active: true
          });
        }
      }
    }
  }
}

// ============================================================
// PULSE ANIMATION
// ============================================================
function spawnPulse() {
  if (synapses.length === 0) return;
  const syn = synapses[Math.floor(Math.random() * synapses.length)];
  pulses.push({
    x: syn.x1,
    y: syn.y1,
    targetX: syn.x2,
    targetY: syn.y2,
    progress: 0,
    speed: params.pulseSpeed * (0.7 + Math.random() * 0.6),
    brightness: params.pulseBrightness * (0.6 + Math.random() * 0.4),
    size: 3 + Math.random() * 4,
    color: PALETTE.pulse
  });
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.progress += p.speed * 0.016;
    if (p.progress >= 1) {
      pulses.splice(i, 1);
    }
  }
}

function drawPulses() {
  for (const p of pulses) {
    const x = p.x + (p.targetX - p.x) * p.progress;
    const y = p.y + (p.targetY - p.y) * p.progress;
    const alpha = p.brightness * (1 - Math.abs(p.progress - 0.5) * 1.2);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15 * p.brightness;
    ctx.beginPath();
    ctx.arc(x, y, p.size * p.brightness, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

// ============================================================
// RENDERING
// ============================================================
function drawBackground() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = PALETTE.grid;
  ctx.lineWidth = 0.5;
  const gridSize = 40;
  for (let x = 0; x <= W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Vignette
  const grad = ctx.createRadialGradient(CX, CY, 100, CX, CY, 500);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSynapses() {
  for (const syn of synapses) {
    syn.glow = Math.min(1, syn.glow + 0.02);
    const alpha = syn.glow * params.synapseGlowStrength;
    ctx.shadowColor = PALETTE.synapse;
    ctx.shadowBlur = 12 * alpha * params.synapseGlowStrength;
    ctx.beginPath();
    ctx.moveTo(syn.x1, syn.y1);
    ctx.lineTo(syn.x2, syn.y2);
    ctx.strokeStyle = PALETTE.synapse;
    ctx.globalAlpha = Math.min(1, alpha * 0.8);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Endpoint glow dots
    ctx.shadowColor = PALETTE.synapse;
    ctx.shadowBlur = 8 * alpha;
    ctx.beginPath();
    ctx.arc(syn.x1, syn.y1, 2 * alpha, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.synapse;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(syn.x2, syn.y2, 2 * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
function update() {
  if (paused) return;

  frameCount++;

  // Grow branches
  if (!growthComplete) {
    let anyAlive = false;
    for (const n of neurons) {
      if (n.branches) {
        for (const b of n.branches) {
          b.grow();
          if (b.alive) anyAlive = true;
          for (const sb of b.sideBranches) {
            sb.grow();
            if (sb.alive) anyAlive = true;
          }
        }
      } else if (n.seed) {
        // Seed neurons occasionally grow new branches
        if (Math.random() < 0.02) {
          n.growBranch();
        }
      }
    }
    if (!anyAlive && frameCount > 60) {
      growthComplete = true;
    }
    detectSynapses();
  }

  // Spawn pulses after growth or continuously
  if (growthComplete || Math.random() < params.pulseFrequency) {
    spawnPulse();
  }

  updatePulses();
}

function draw() {
  drawBackground();

  // Draw branches
  for (const n of neurons) {
    if (n.branches) {
      for (const b of n.branches) {
        b.draw();
        for (const sb of b.sideBranches) {
          sb.draw();
        }
      }
    }
  }

  // Draw seed neurons
  for (const n of neurons) {
    if (n.seed) n.draw();
  }

  drawSynapses();
  drawPulses();
  drawScanlines();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// INIT
// ============================================================
clearCanvas();
regenerate();
loop();
</script>
</body>
</html>
