<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle - 30x30</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #000;
            display: block;
            border: 4px solid #444;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #4CAF50;
            text-shadow: 2px 2px #000;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        #score-board {
            position: absolute;
            top: -40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        #game-over-text {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ff4444;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">
            <span id="score1">Player 1: 0</span>
            <span id="score2">Player 2: 0</span>
        </div>
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Start Menu -->
        <div id="start-menu" class="overlay">
            <h1>SNAKE BATTLE</h1>
            <div class="menu-buttons">
                <button onclick="startGame('hvH')">Human vs Human</button>
                <button onclick="startGame('cvH')">CPU vs Human</button>
                <button onclick="startGame('cvC')">CPU vs CPU</button>
            </div>
            <div class="instructions">
                P1: WASD | P2: Arrow Keys
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="overlay hidden">
            <div id="game-over-text">GAME OVER</div>
            <div id="winner-text" style="margin-bottom: 20px; font-size: 1.5rem;"></div>
            <button onclick="showMenu()">Main Menu</button>
            <div class="instructions">Press SPACE or ENTER to restart</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const tileSize = canvas.width / gridSize;

        let gameLoop;
        let gameRunning = false;
        let mode = ''; // 'hvH', 'cvH', 'cvC'
        let food = { x: 0, y: 0 };
        
        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        class Snake {
            constructor(x, y, color, id) {
                this.id = id;
                this.body = [{ x, y }];
                this.dir = DIRECTIONS.RIGHT;
                this.nextDir = DIRECTIONS.RIGHT;
                this.color = color;
                this.score = 0;
                this.alive = true;
            }

            update() {
                if (!this.alive) return;

                this.dir = this.nextDir;
                const head = { 
                    x: this.body[0].x + this.dir.x, 
                    y: this.body[0].y + this.dir.y 
                };

                // Wall Collision
                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    this.alive = false;
                    return;
                }

                // Self/Other Collision
                const snakes = [snake1, snake2];
                for (let s of snakes) {
                    for (let segment of s.body) {
                        if (head.x === segment.x && head.y === segment.y) {
                            this.alive = false;
                            return;
                        }
                    }
                }

                this.body.unshift(head);

                // Food Collision
                if (head.x === food.x && head.y === food.y) {
                    this.score++;
                    spawnFood();
                } else {
                    this.body.pop();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                this.body.forEach((seg, index) => {
                    ctx.fillRect(seg.x * tileSize, seg.y * tileSize, tileSize - 1, tileSize - 1);
                    // Draw head slightly differently
                    if (index === 0) {
                        ctx.strokeStyle = 'white';
                        ctx.strokeRect(seg.x * tileSize, seg.y * tileSize, tileSize - 1, tileSize - 1);
                    }
                });
            }

            aiMove() {
                const head = this.body[0];
                const dx = food.x - head.x;
                const dy = food.y - head.y;

                let preferredDir;
                if (Math.abs(dx) > Math.abs(dy)) {
                    preferredDir = dx > 0 ? DIRECTIONS.RIGHT : DIRECTIONS.LEFT;
                } else {
                    preferredDir = dy > 0 ? DIRECTIONS.DOWN : DIRECTIONS.UP;
                }

                // Basic collision avoidance for AI
                const candidates = [preferredDir, 
                    {x: -preferredDir.x, y: 0}, {x: 0, y: -preferredDir.y},
                    {x: preferredDir.x, y: 0}, {x: 0, y: preferredDir.y}
                ];

                for (let dir of candidates) {
                    const next = { x: head.x + dir.x, y: head.y + dir.y };
                    if (next.x >= 0 && next.x < gridSize && next.y >= 0 && next.y < gridSize) {
                        // Check if next move hits any snake body
                        let collision = false;
                        [snake1, snake2].forEach(s => {
                            s.body.forEach(seg => {
                                if (next.x === seg.x && next.y === seg.y) collision = true;
                            });
                        });
                        if (!collision) {
                            // Prevent 180 degree turns
                            if (!(dir.x === -this.dir.x && dir.y === -this.dir.y)) {
                                this.nextDir = dir;
                                return;
                            }
                        }
                    }
                }
            }
        }

        let snake1, snake2;

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            // Ensure food doesn't spawn on snakes
            const snakes = [snake1, snake2];
            for (let s of snakes) {
                for (let seg of s.body) {
                    if (food.x === seg.x && food.y === seg.y) {
                        spawnFood();
                        return;
                    }
                }
            }
        }

        function startGame(selectedMode) {
            mode = selectedMode;
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');

            snake1 = new Snake(5, 15, '#4CAF50', 1);
            snake2 = new Snake(24, 15, '#2196F3', 2);
            
            spawnFood();
            gameRunning = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameTick, 100);
        }

        function gameTick() {
            // AI Logic
            if (mode === 'cvH' || mode === 'cvC') snake1.aiMove();
            if (mode === 'cvH' || mode === 'cvC') {
                // In cvH, snake2 is human, so only snake1 is AI. 
                // Wait, the prompt says "CPU vs Human", usually P1 is CPU, P2 is Human.
                // Let's refine: 
                // hvH: S1 Human, S2 Human
                // cvH: S1 CPU, S2 Human
                // cvC: S1 CPU, S2 CPU
            }
            
            // Correcting AI assignment based on mode
            if (mode === 'cvH' || mode === 'cvC') snake1.aiMove();
            if (mode === 'cvC') snake2.aiMove();

            snake1.update();
            snake2.update();

            draw();
            updateScore();

            if (!snake1.alive || !snake2.alive) {
                endGame();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 1, tileSize - 1);

            snake1.draw();
            snake2.draw();
        }

        function updateScore() {
            document.getElementById('score1').innerText = `Player 1: ${snake1.score}`;
            document.getElementById('score2').innerText = `Player 2: ${snake2.score}`;
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            const gameOverScreen = document.getElementById('game-over');
            const winnerText = document.getElementById('winner-text');
            gameOverScreen.classList.remove('hidden');

            if (!snake1.alive && !snake2.alive) {
                winnerText.innerText = "It's a Draw!";
            } else if (!snake1.alive) {
                winnerText.innerText = "Player 2 Wins!";
            } else {
                winnerText.innerText = "Player 1 Wins!";
            }
        }

        function showMenu() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('start-menu').classList.remove('hidden');
        }

        window.addEventListener('keydown', e => {
            // P1 Controls (WASD)
            if (gameRunning) {
                if (e.code === 'KeyW' && snake1.dir !== DIRECTIONS.DOWN) snake1.nextDir = DIRECTIONS.UP;
                if (e.code === 'KeyS' && snake1.dir !== DIRECTIONS.UP) snake1.nextDir = DIRECTIONS.DOWN;
                if (e.code === 'KeyA' && snake1.dir !== DIRECTIONS.RIGHT) snake1.nextDir = DIRECTIONS.LEFT;
                if (e.code === 'KeyD' && snake1.dir !== DIRECTIONS.LEFT) snake1.nextDir = DIRECTIONS.RIGHT;

                // P2 Controls (Arrows)
                if (e.code === 'ArrowUp' && snake2.dir !== DIRECTIONS.DOWN) snake2.nextDir = DIRECTIONS.UP;
                if (e.code === 'ArrowDown' && snake2.dir !== DIRECTIONS.UP) snake2.nextDir = DIRECTIONS.DOWN;
                if (e.code === 'ArrowLeft' && snake2.dir !== DIRECTIONS.RIGHT) snake2.nextDir = DIRECTIONS.LEFT;
                if (e.code === 'ArrowRight' && snake2.dir !== DIRECTIONS.LEFT) snake2.nextDir = DIRECTIONS.RIGHT;
            }

            // Restart logic
            if (!gameRunning && (e.code === 'Space' || e.code === 'Enter')) {
                if (mode !== '') {
                    startGame(mode);
                }
            }
        });
    </script>
</body>
</html>
