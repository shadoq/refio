<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05070f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }
  #canvas-wrap {
    position: relative;
    width: 800px;
    height: 800px;
  }
  canvas {
    display: block;
    border: 1px solid rgba(0,229,255,0.15);
    box-shadow: 0 0 40px rgba(0,229,255,0.12), 0 0 80px rgba(0,229,255,0.06);
  }
  .dg.ac {
    z-index: 999 !important;
  }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="800" height="800"></canvas>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 800;

  // ── Parameters ──────────────────────────────────────────────────────────────
  const params = {
    // Growth
    neuronCount: 4,
    growthSpeed: 2.5,
    maxDepth: 6,
    splitChance: 0.35,
    curvature: 0.45,
    maxBranchLength: 120,
    // Synapses
    synapseDistance: 55,
    synapseGlow: 14,
    // Pulses
    pulseSpeed: 1.8,
    pulseFrequency: 0.018,
    pulseBrightness: 1.0,
    // Visuals
    bgColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    showScanlines: true,
    showVignette: true,
    showGrid: true,
    // Actions (buttons)
    regenerate: function(){},
    clearCanvas: function(){},
    pauseResume: function(){}
  };

  // ── State ────────────────────────────────────────────────────────────────────
  let branches = [];
  let tips = [];
  let synapses = [];
  let pulses = [];
  let paused = false;
  let animId = null;
  let frameCount = 0;
  let synapseSet = new Set();

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function rand(a, b){ return a + Math.random()*(b-a); }
  function randInt(a, b){ return Math.floor(rand(a, b+1)); }
  function dist(x1,y1,x2,y2){ return Math.sqrt((x2-x1)**2+(y2-y1)**2); }
  function hexToRgb(hex){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }
  function lerp(a,b,t){ return a+(b-a)*t; }

  // ── Branch class ─────────────────────────────────────────────────────────────
  class Branch {
    constructor(x, y, angle, depth, parentColor){
      this.x = x;
      this.y = y;
      this.angle = angle;
      this.depth = depth;
      this.length = 0;
      this.maxLen = rand(30, params.maxBranchLength) * (1 - depth * 0.1);
      this.speed = rand(0.6, 1.0);
      this.done = false;
      this.points = [{x, y}];
      this.thickness = Math.max(0.4, 2.2 - depth * 0.28);
      this.isAccent = Math.random() < 0.22;
      this.color = this.isAccent ? params.accentColor : params.branchColor;
      this.angleNoise = 0;
      this.children = [];
      this.spawned = false;
      this.cx = x + rand(-30,30);
      this.cy = y + rand(-30,30);
      this.segLen = 3.5;
      this.totalSegs = 0;
      this.maxSegs = Math.floor(this.maxLen / this.segLen);
    }

    step(){
      if(this.done) return;
      const steps = Math.ceil(params.growthSpeed * this.speed);
      for(let s=0; s<steps; s++){
        if(this.totalSegs >= this.maxSegs){
          this.done = true;
          tips.push(this);
          if(!this.spawned) this._trySpawn();
          return;
        }
        this.angleNoise += rand(-params.curvature, params.curvature) * 0.18;
        this.angleNoise *= 0.88;
        this.angle += this.angleNoise;
        const last = this.points[this.points.length-1];
        const nx = last.x + Math.cos(this.angle) * this.segLen;
        const ny = last.y + Math.sin(this.angle) * this.segLen;
        this.points.push({x: nx, y: ny});
        this.length += this.segLen;
        this.totalSegs++;
      }
    }

    _trySpawn(){
      this.spawned = true;
      if(this.depth >= params.maxDepth) return;
      const tip = this.points[this.points.length-1];
      const numChildren = Math.random() < params.splitChance ? 2 : (Math.random() < 0.15 ? 3 : 1);
      for(let i=0; i<numChildren; i++){
        const spread = (i===0) ? rand(-0.5,0.5) : rand(0.3,0.9)*(Math.random()<0.5?1:-1);
        const child = new Branch(tip.x, tip.y, this.angle + spread, this.depth+1, this.color);
        child.isAccent = this.isAccent && Math.random()<0.6;
        child.color = child.isAccent ? params.accentColor : params.branchColor;
        branches.push(child);
      }
      // occasional side branch
      if(Math.random() < 0.18 && this.points.length > 4){
        const idx = Math.floor(this.points.length * rand(0.3, 0.7));
        const pt = this.points[idx];
        const side = new Branch(pt.x, pt.y, this.angle + rand(0.8,1.4)*(Math.random()<0.5?1:-1), this.depth+2, this.color);
        side.maxLen *= 0.55;
        side.maxSegs = Math.floor(side.maxLen / side.segLen);
        branches.push(side);
      }
    }

    draw(){
      if(this.points.length < 2) return;
      const col = this.color;
      const rgb = hexToRgb(col);
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = this.thickness;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = col;
      ctx.shadowBlur = 8 + (this.isAccent ? 4 : 0);
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);
      for(let i=1; i<this.points.length-1; i++){
        const mx = (this.points[i].x + this.points[i+1].x)*0.5;
        const my = (this.points[i].y + this.points[i+1].y)*0.5;
        ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, mx, my);
      }
      const last = this.points[this.points.length-1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Synapse detection ────────────────────────────────────────────────────────
  function detectSynapses(){
    const threshold = params.synapseDistance;
    for(let i=0; i<tips.length; i++){
      for(let j=i+1; j<tips.length; j++){
        const a = tips[i];
        const b = tips[j];
        if(a === b) continue;
        const ta = a.points[a.points.length-1];
        const tb = b.points[b.points.length-1];
        const d = dist(ta.x, ta.y, tb.x, tb.y);
        if(d < threshold){
          const key = [i,j].sort().join('-');
          if(!synapseSet.has(key)){
            synapseSet.add(key);
            synapses.push({
              ax: ta.x, ay: ta.y,
              bx: tb.x, by: tb.y,
              phase: Math.random()*Math.PI*2,
              strength: rand(0.5,1.0)
            });
          }
        }
      }
    }
  }

  // ── Pulse spawning ───────────────────────────────────────────────────────────
  function spawnPulses(){
    if(synapses.length === 0) return;
    if(Math.random() < params.pulseFrequency){
      const syn = synapses[Math.floor(Math.random()*synapses.length)];
      const rev = Math.random()<0.5;
      pulses.push({
        syn,
        t: 0,
        rev,
        speed: params.pulseSpeed * rand(0.7,1.3) * 0.008
      });
    }
  }

  // ── Draw synapses ────────────────────────────────────────────────────────────
  function drawSynapses(){
    const now = frameCount * 0.04;
    for(const syn of synapses){
      const pulse = 0.4 + 0.6*Math.sin(now + syn.phase);
      const rgb = hexToRgb(params.synapseColor);
      ctx.save();
      ctx.strokeStyle = params.synapseColor;
      ctx.lineWidth = 0.8;
      ctx.globalAlpha = 0.25 * pulse * syn.strength;
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = params.synapseGlow * pulse;
      ctx.setLineDash([3,6]);
      ctx.beginPath();
      ctx.moveTo(syn.ax, syn.ay);
      ctx.lineTo(syn.bx, syn.by);
      ctx.stroke();
      ctx.setLineDash([]);
      // node dots
      ctx.globalAlpha = 0.7 * pulse;
      ctx.shadowBlur = params.synapseGlow * 1.5;
      ctx.fillStyle = params.synapseColor;
      ctx.beginPath();
      ctx.arc(syn.ax, syn.ay, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(syn.bx, syn.by, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Draw pulses ──────────────────────────────────────────────────────────────
  function drawPulses(){
    for(let i=pulses.length-1; i>=0; i--){
      const p = pulses[i];
      p.t += p.speed * params.pulseSpeed;
      if(p.t > 1){ pulses.splice(i,1); continue; }
      const t = p.rev ? 1-p.t : p.t;
      const x = lerp(p.syn.ax, p.syn.bx, t);
      const y = lerp(p.syn.ay, p.syn.by, t);
      const glow = 12 * params.pulseBrightness;
      ctx.save();
      ctx.shadowColor = params.pulseColor;
      ctx.shadowBlur = glow * 2;
      ctx.fillStyle = params.pulseColor;
      ctx.globalAlpha = (1 - Math.abs(p.t-0.5)*2) * params.pulseBrightness;
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI*2);
      ctx.fill();
      // trail
      ctx.shadowBlur = glow;
      ctx.globalAlpha *= 0.4;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Background ───────────────────────────────────────────────────────────────
  function drawBackground(){
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0,0,W,H);

    // subtle radial glow center
    const grad = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,420);
    grad.addColorStop(0,'rgba(16,26,58,0.55)');
    grad.addColorStop(1,'rgba(5,7,15,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // grid
    if(params.showGrid){
      ctx.save();
      ctx.strokeStyle = 'rgba(0,229,255,0.08)';
      ctx.lineWidth = 0.5;
      const step = 40;
      for(let x=0; x<=W; x+=step){
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
      }
      for(let y=0; y<=H; y+=step){
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Overlay effects ──────────────────────────────────────────────────────────
  function drawOverlays(){
    // scanlines
    if(params.showScanlines){
      ctx.save();
      ctx.globalAlpha = 0.045;
      ctx.fillStyle = '#000';
      for(let y=0; y<H; y+=3){
        ctx.fillRect(0,y,W,1);
      }
      ctx.restore();
    }
    // vignette
    if(params.showVignette){
      ctx.save();
      const vg = ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,560);
      vg.addColorStop(0,'rgba(0,0,0,0)');
      vg.addColorStop(1,'rgba(0,0,0,0.72)');
      ctx.fillStyle = vg;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }

  // ── Network generation ───────────────────────────────────────────────────────
  function generateNetwork(){
    branches = [];
    tips = [];
    synapses = [];
    pulses = [];
    synapseSet = new Set();
    frameCount = 0;

    const count = Math.max(3, Math.min(6, Math.round(params.neuronCount)));
    const cx = W/2, cy = H/2;
    const radius = 90;

    for(let i=0; i<count; i++){
      const angle = (i/count)*Math.PI*2 + rand(-0.3,0.3);
      const r = rand(0, radius);
      const sx = cx + Math.cos(angle)*r;
      const sy = cy + Math.sin(angle)*r;
      const numAxons = randInt(2,4);
      for(let a=0; a<numAxons; a++){
        const dir = rand(0, Math.PI*2);
        const b = new Branch(sx, sy, dir, 0, params.branchColor);
        branches.push(b);
      }
      // soma dot stored for drawing
      branches.push({
        _soma: true, x: sx, y: sy,
        draw(){
          ctx.save();
          ctx.shadowColor = params.branchColor;
          ctx.shadowBlur = 18;
          ctx.fillStyle = params.branchColor;
          ctx.globalAlpha = 0.9;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
          ctx.fill();
          ctx.shadowBlur = 6;
          ctx.fillStyle = '#fff';
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 1.5, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        },
        step(){}
      });
    }
  }

  // ── Main loop ────────────────────────────────────────────────────────────────
  function loop(){
    animId = requestAnimationFrame(loop);
    if(paused) return;
    frameCount++;

    drawBackground();

    let allDone = true;
    for(const b of branches){
      b.step();
      if(!b._soma && !b.done) allDone = false;
    }

    for(const b of branches) b.draw();

    if(frameCount % 8 === 0) detectSynapses();
    drawSynapses();
    spawnPulses();
    drawPulses();
    drawOverlays();
  }

  // ── dat.GUI ──────────────────────────────────────────────────────────────────
  function setupGUI(){
    const gui = new dat.GUI({ width: 260 });

    // Growth
    const gGrowth = gui.addFolder('Growth');
    gGrowth.add(params,'neuronCount',3,6,1).name('Neuron Count');
    gGrowth.add(params,'growthSpeed',0.5,6,0.1).name('Growth Speed');
    gGrowth.add(params,'maxDepth',2,10,1).name('Max Depth');
    gGrowth.add(params,'splitChance',0,1,0.01).name('Split Chance');
    gGrowth.add(params,'curvature',0,1,0.01).name('Curvature');
    gGrowth.add(params,'maxBranchLength',40,220,1).name('Max Branch Len');
    gGrowth.open();

    // Synapses
    const gSyn = gui.addFolder('Synapses');
    gSyn.add(params,'synapseDistance',20,150,1).name('Distance Thresh');
    gSyn.add(params,'synapseGlow',2,30,0.5).name('Glow Strength');
    gSyn.open();

    // Pulses
    const gPulse = gui.addFolder('Pulses');
    gPulse.add(params,'pulseSpeed',0.2,5,0.1).name('Pulse Speed');
    gPulse.add(params,'pulseFrequency',0.002,0.08,0.001).name('Pulse Frequency');
    gPulse.add(params,'pulseBrightness',0.1,2,0.05).name('Pulse Brightness');
    gPulse.open();

    // Visuals
    const gVis = gui.addFolder('Visuals');
    gVis.addColor(params,'bgColor').name('Background');
    gVis.addColor(params,'branchColor').name('Branch Color');
    gVis.addColor(params,'accentColor').name('Accent Color');
    gVis.addColor(params,'synapseColor').name('Synapse Color');
    gVis.addColor(params,'pulseColor').name('Pulse Color');
    gVis.add(params,'showGrid').name('Show Grid');
    gVis.add(params,'showScanlines').name('Scanlines');
    gVis.add(params,'showVignette').name('Vignette');
    gVis.open();

    // Buttons
    params.regenerate = function(){
      generateNetwork();
    };
    params.clearCanvas = function(){
      branches = [];
      tips = [];
      synapses = [];
      pulses = [];
      synapseSet = new Set();
      ctx.fillStyle = params.bgColor;
      ctx.fillRect(0,0,W,H);
    };
    params.pauseResume = function(){
      paused = !paused;
    };

    const actions = {
      'Regenerate': params.regenerate,
      'Clear Canvas': params.clearCanvas,
      'Pause / Resume': params.pauseResume
    };
    const gActions = gui.addFolder('Actions');
    gActions.add(actions,'Regenerate');
    gActions.add(actions,'Clear Canvas');
    gActions.add(actions,'Pause / Resume');
    gActions.open();
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  setupGUI();
  generateNetwork();
  loop();

})();
</script>
</body>
</html>
