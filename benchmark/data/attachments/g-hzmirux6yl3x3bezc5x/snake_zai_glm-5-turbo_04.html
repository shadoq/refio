<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
background: #1a1a2e;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
color: #fff;
overflow: hidden;
}
#gameContainer {
position: relative;
}
canvas {
display: block;
border: 2px solid #16213e;
background: #0f3460;
}
#overlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(0, 0, 0, 0.85);
z-index: 10;
}
#overlay.hidden {
display: none;
}
h1 {
font-size: 48px;
margin-bottom: 30px;
color: #e94560;
text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.menu-btn {
padding: 15px 40px;
margin: 8px;
font-size: 18px;
background: #16213e;
color: #fff;
border: 2px solid #e94560;
border-radius: 8px;
cursor: pointer;
transition: all 0.3s;
min-width: 280px;
}
.menu-btn:hover {
background: #e94560;
transform: scale(1.05);
}
#scoreDisplay {
position: absolute;
top: 10px;
left: 0;
width: 100%;
display: flex;
justify-content: space-between;
padding: 0 20px;
font-size: 18px;
z-index: 5;
pointer-events: none;
}
#scoreDisplay.hidden {
display: none;
}
.score-p1 {
color: #4ecca3;
}
.score-p2 {
color: #3498db;
}
.game-over-text {
font-size: 36px;
margin-bottom: 15px;
color: #e94560;
}
.winner-text {
font-size: 24px;
margin-bottom: 30px;
}
.restart-hint {
font-size: 16px;
color: #aaa;
margin-top: 20px;
}
.controls-info {
margin-top: 30px;
text-align: center;
font-size: 14px;
color: #888;
line-height: 1.8;
}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="scoreDisplay" class="hidden">
<span class="score-p1">P1: <span id="score1">0</span></span>
<span class="score-p2">P2: <span id="score2">0</span></span>
</div>
<div id="overlay">
<div id="menuContent">
<h1>SNAKE GAME</h1>
<button class="menu-btn" onclick="startGame('hvsh')">Human vs Human</button>
<button class="menu-btn" onclick="startGame('cpuvsh')">CPU vs Human</button>
<button class="menu-btn" onclick="startGame('cpuvscpu')">CPU vs CPU</button>
<div class="controls-info">
P1 Controls: W A S D<br>
P2 Controls: Arrow Keys
</div>
</div>
<div id="gameOverContent" style="display:none;">
<div class="game-over-text">GAME OVER</div>
<div class="winner-text" id="winnerText"></div>
<button class="menu-btn" onclick="showMenu()">Main Menu</button>
<div class="restart-hint">Press R to restart</div>
</div>
</div>
</div>
<script>
const GRID_SIZE = 30;
const CELL_SIZE = 20;
const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;
const overlay = document.getElementById('overlay');
const menuContent = document.getElementById('menuContent');
const gameOverContent = document.getElementById('gameOverContent');
const winnerText = document.getElementById('winnerText');
const scoreDisplay = document.getElementById('scoreDisplay');
const score1El = document.getElementById('score1');
const score2El = document.getElementById('score2');
let gameMode = null;
let gameLoop = null;
let snakes = [];
let food = null;
let gameOver = false;
const DIRECTIONS = {
UP: { x: 0, y: -1 },
DOWN: { x: 0, y: 1 },
LEFT: { x: -1, y: 0 },
RIGHT: { x: 1, y: 0 }
};
function createSnake(startX, startY, direction, color, isCPU) {
return {
body: [
{ x: startX, y: startY },
{ x: startX - direction.x, y: startY - direction.y },
{ x: startX - direction.x * 2, y: startY - direction.y * 2 }
],
direction: direction,
nextDirection: direction,
color: color,
score: 0,
alive: true,
isCPU: isCPU
};
}
function spawnFood() {
let emptyCells = [];
for (let x = 0; x < GRID_SIZE; x++) {
for (let y = 0; y < GRID_SIZE; y++) {
let occupied = false;
for (let snake of snakes) {
for (let segment of snake.body) {
if (segment.x === x && segment.y === y) {
occupied = true;
break;
}
}
if (occupied) break;
}
if (!occupied) {
emptyCells.push({ x, y });
}
}
}
if (emptyCells.length > 0) {
food = emptyCells[Math.floor(Math.random() * emptyCells.length)];
}
}
function getOppositeDirection(dir) {
if (dir.x === 1) return DIRECTIONS.LEFT;
if (dir.x === -1) return DIRECTIONS.RIGHT;
if (dir.y === 1) return DIRECTIONS.UP;
if (dir.y === -1) return DIRECTIONS.DOWN;
return null;
}
function bfs(start, target, obstacles) {
let queue = [{ pos: start, path: [] }];
let visited = new Set();
visited.add(`${start.x},${start.y}`);
while (queue.length > 0) {
let { pos, path } = queue.shift();
if (pos.x === target.x && pos.y === target.y) {
return path;
}
let dirs = [DIRECTIONS.UP, DIRECTIONS.DOWN, DIRECTIONS.LEFT, DIRECTIONS.RIGHT];
for (let dir of dirs) {
let newPos = { x: pos.x + dir.x, y: pos.y + dir.y };
let key = `${newPos.x},${newPos.y}`;
if (newPos.x >= 0 && newPos.x < GRID_SIZE &&
newPos.y >= 0 && newPos.y < GRID_SIZE &&
!visited.has(key) && !obstacles.has(key)) {
visited.add(key);
queue.push({ pos: newPos, path: [...path, dir] });
}
}
}
return null;
}
function cpuDecide(snake) {
if (!food || !snake.alive) return;
let head = snake.body[0];
let obstacles = new Set();
for (let s of snakes) {
for (let i = 0; i < s.body.length; i++) {
if (s === snake && i === s.body.length - 1) continue;
obstacles.add(`${s.body[i].x},${s.body[i].y}`);
}
}
let path = bfs(head, food, obstacles);
if (path && path.length > 0) {
let nextDir = path[0];
let opposite = getOppositeDirection(snake.direction);
if (!opposite || nextDir.x !== opposite.x || nextDir.y !== opposite.y) {
snake.nextDirection = nextDir;
return;
}
}
let safeDirs = [DIRECTIONS.UP, DIRECTIONS.DOWN, DIRECTIONS.LEFT, DIRECTIONS.RIGHT];
let opposite = getOppositeDirection(snake.direction);
for (let dir of safeDirs) {
let newX = head.x + dir.x;
let newY = head.y + dir.y;
if (newX >= 0 && newX < GRID_SIZE &&
newY >= 0 && newY < GRID_SIZE &&
!obstacles.has(`${newX},${newY}`)) {
if (!opposite || dir.x !== opposite.x || dir.y !== opposite.y) {
snake.nextDirection = dir;
return;
}
}
}
}
function moveSnake(snake) {
if (!snake.alive) return;
snake.direction = snake.nextDirection;
let head = snake.body[0];
let newHead = {
x: head.x + snake.direction.x,
y: head.y + snake.direction.y
};
if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
newHead.y < 0 || newHead.y >= GRID_SIZE) {
snake.alive = false;
return;
}
for (let s of snakes) {
for (let segment of s.body) {
if (segment.x === newHead.x && segment.y === newHead.y) {
snake.alive = false;
return;
}
}
}
}
function applyMove(snake) {
if (!snake.alive) return;
let head = snake.body[0];
let newHead = {
x: head.x + snake.direction.x,
y: head.y + snake.direction.y
};
snake.body.unshift(newHead);
if (food && newHead.x === food.x && newHead.y === food.y) {
snake.score++;
spawnFood();
} else {
snake.body.pop();
}
}
function update() {
if (gameOver) return;
for (let snake of snakes) {
if (snake.isCPU && snake.alive) {
cpuDecide(snake);
}
}
for (let snake of snakes) {
moveSnake(snake);
}
let anyAlive = snakes.filter(s => s.alive);
if (anyAlive.length < 2) {
gameOver = true;
for (let snake of snakes) {
if (snake.alive) {
applyMove(snake);
}
}
endGame();
return;
}
for (let snake of snakes) {
applyMove(snake);
}
score1El.textContent = snakes[0].score;
score2El.textContent = snakes[1].score;
}
function draw() {
ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
ctx.fillStyle = '#0f3460';
ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
for (let x = 0; x < GRID_SIZE; x++) {
for (let y = 0; y < GRID_SIZE; y++) {
if ((x + y) % 2 === 0) {
ctx.fillStyle = 'rgba(255,255,255,0.02)';
ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
}
}
}
if (food) {
ctx.fillStyle = '#e94560';
ctx.shadowColor = '#e94560';
ctx.shadowBlur = 10;
ctx.beginPath();
ctx.arc(food.x * CELL_SIZE + CELL_SIZE / 2,
food.y * CELL_SIZE + CELL_SIZE / 2,
CELL_SIZE / 2 - 2, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;
}
for (let snake of snakes) {
for (let i = snake.body.length - 1; i >= 0; i--) {
let segment = snake.body[i];
let alpha = snake.alive ? 1 : 0.4;
if (i === 0) {
ctx.fillStyle = snake.color;
ctx.shadowColor = snake.color;
ctx.shadowBlur = snake.alive ? 8 : 0;
} else {
ctx.fillStyle = snake.color;
ctx.globalAlpha = alpha * (0.5 + 0.5 * (1 - i / snake.body.length));
ctx.shadowBlur = 0;
}
let padding = i === 0 ? 1 : 2;
ctx.fillRect(
segment.x * CELL_SIZE + padding,
segment.y * CELL_SIZE + padding,
CELL_SIZE - padding * 2,
CELL_SIZE - padding * 2
);
ctx.globalAlpha = 1;
ctx.shadowBlur = 0;
}
}
}
function gameStep() {
update();
draw();
}
function startGame(mode) {
gameMode = mode;
gameOver = false;
let p1CPU = mode === 'cpuvsh' || mode === 'cpuvscpu';
let p2CPU = mode === 'cpuvscpu';
snakes = [
createSnake(5, 15, DIRECTIONS.RIGHT, '#4ecca3', p1CPU),
createSnake(24, 15, DIRECTIONS.LEFT, '#3498db', p2CPU)
];
spawnFood();
score1El.textContent = '0';
score2El.textContent = '0';
overlay.classList.add('hidden');
scoreDisplay.classList.remove('hidden');
menuContent.style.display = 'none';
gameOverContent.style.display = 'none';
if (gameLoop) clearInterval(gameLoop);
gameLoop = setInterval(gameStep, 100);
draw();
}
function endGame() {
if (gameLoop) clearInterval(gameLoop);
let p1Alive = snakes[0].alive;
let p2Alive = snakes[1].alive;
let result = '';
if (p1Alive && !p2Alive) {
result = 'Player 1 Wins!';
} else if (!p1Alive && p2Alive) {
result = 'Player 2 Wins!';
} else {
result = 'Draw!';
}
let p1Label = snakes[0].isCPU ? 'CPU (P1)' : 'Player 1';
let p2Label = snakes[1].isCPU ? 'CPU (P2)' : 'Player 2';
if (p1Alive && !p2Alive) {
result = `${p1Label} Wins!`;
} else if (!p1Alive && p2Alive) {
result = `${p2Label} Wins!`;
} else {
result = "It's a Draw!";
}
winnerText.textContent = result + ` (${snakes[0].score} - ${snakes[1].score})`;
overlay.classList.remove('hidden');
menuContent.style.display = 'none';
gameOverContent.style.display = 'block';
}
function showMenu() {
if (gameLoop) clearInterval(gameLoop);
overlay.classList.remove('hidden');
menuContent.style.display = 'block';
gameOverContent.style.display = 'none';
scoreDisplay.classList.add('hidden');
ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
ctx.fillStyle = '#0f3460';
ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
}
document.addEventListener('keydown', function(e) {
if (e.key === 'r' || e.key === 'R') {
if (gameOver && gameMode) {
startGame(gameMode);
return;
}
}
if (!snakes[0] || !snakes[0].alive) return;
let p1 = snakes[0];
switch (e.key.toLowerCase()) {
case 'w':
if (p1.direction !== DIRECTIONS.DOWN) p1.nextDirection = DIRECTIONS.UP;
break;
case 's':
if (p1.direction !== DIRECTIONS.UP) p1.nextDirection = DIRECTIONS.DOWN;
break;
case 'a':
if (p1.direction !== DIRECTIONS.RIGHT) p1.nextDirection = DIRECTIONS.LEFT;
break;
case 'd':
if (p1.direction !== DIRECTIONS.LEFT) p1.nextDirection = DIRECTIONS.RIGHT;
break;
}
if (!snakes[1] || !snakes[1].alive || snakes[1].isCPU) return;
let p2 = snakes[1];
switch (e.key) {
case 'ArrowUp':
if (p2.direction !== DIRECTIONS.DOWN) p2.nextDirection = DIRECTIONS.UP;
e.preventDefault();
break;
case 'ArrowDown':
if (p2.direction !== DIRECTIONS.UP) p2.nextDirection = DIRECTIONS.DOWN;
e.preventDefault();
break;
case 'ArrowLeft':
if (p2.direction !== DIRECTIONS.RIGHT) p2.nextDirection = DIRECTIONS.LEFT;
e.preventDefault();
break;
case 'ArrowRight':
if (p2.direction !== DIRECTIONS.LEFT) p2.nextDirection = DIRECTIONS.RIGHT;
e.preventDefault();
break;
}
});
showMenu();
</script>
</body>
</html>
