<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP-8 Emulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 16px;
    min-height: 100vh;
  }
  header {
    background: #2a2a2a;
    padding: 12px 20px;
    border-radius: 6px;
    margin-bottom: 16px;
    border-left: 4px solid #4caf50;
  }
  header h1 {
    font-size: 22px;
    color: #4caf50;
    font-family: 'Courier New', monospace;
  }
  header p {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
  }
  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .panel {
    background: #2a2a2a;
    padding: 16px;
    border-radius: 6px;
    border: 1px solid #333;
  }
  .panel h2 {
    font-size: 14px;
    color: #4caf50;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid #333;
    padding-bottom: 6px;
  }
  #screen {
    display: block;
    background: #000;
    margin: 0 auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid #4caf50;
    border-radius: 4px;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  button {
    background: #3a3a3a;
    color: #e0e0e0;
    border: 1px solid #555;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: #4a4a4a; }
  button:active { background: #2a2a2a; }
  button.primary { background: #4caf50; color: #000; border-color: #4caf50; }
  button.primary:hover { background: #5cbf60; }
  button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  button.danger:hover { background: #d04a3c; }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #4caf50;
  }
  input[type="file"] {
    font-size: 12px;
    color: #e0e0e0;
  }
  .status {
    margin-top: 10px;
    padding: 6px 10px;
    background: #1a1a1a;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
  }
  .status.running { color: #4caf50; }
  .status.paused { color: #f39c12; }
  .keypad {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
  }
  .key {
    background: #3a3a3a;
    border: 1px solid #555;
    padding: 10px 4px;
    text-align: center;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    transition: background 0.1s;
  }
  .key.active { background: #4caf50; color: #000; }
  .key small { display: block; color: #888; font-size: 10px; }
  .key.active small { color: #000; }
  .debug {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .debug-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    border-bottom: 1px dotted #333;
  }
  .debug-row span:first-child { color: #888; }
  .debug-row span:last-child { color: #4caf50; }
  .reg-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px 12px;
    margin: 8px 0;
  }
  .stack-list {
    background: #1a1a1a;
    padding: 6px;
    border-radius: 4px;
    margin-top: 4px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 11px;
  }
  .instr {
    background: #1a1a1a;
    padding: 8px;
    border-radius: 4px;
    margin-top: 8px;
    color: #f39c12;
    font-size: 12px;
    word-break: break-all;
  }
  @media (max-width: 800px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>CHIP-8 Emulator</h1>
  <p>A complete single-file implementation with debugger panel</p>
</header>

<div class="container">
  <div class="panel">
    <h2>Display & Controls</h2>
    <canvas id="screen" width="512" height="256"></canvas>
    <div class="controls">
      <button id="btnRun" class="primary">Run</button>
      <button id="btnStep">Step</button>
      <button id="btnReset" class="danger">Reset</button>
      <input type="file" id="fileInput" accept=".ch8,.rom,application/octet-stream">
    </div>
    <div class="slider-group">
      <label>Speed:</label>
      <input type="range" id="speedSlider" min="1" max="50" value="10">
      <span id="speedVal">10</span> inst/frame
    </div>
    <div class="status paused" id="status">Status: Paused</div>
    <div class="keypad" id="keypad"></div>
  </div>

  <div class="panel">
    <h2>Debugger</h2>
    <div class="debug">
      <div class="debug-row"><span>PC:</span><span id="dbgPC">0x200</span></div>
      <div class="debug-row"><span>I:</span><span id="dbgI">0x000</span></div>
      <div class="debug-row"><span>SP:</span><span id="dbgSP">0</span></div>
      <div class="debug-row"><span>Delay Timer:</span><span id="dbgDT">0</span></div>
      <div class="debug-row"><span>Sound Timer:</span><span id="dbgST">0</span></div>
      <div class="debug-row"><span>Cycles:</span><span id="dbgCycles">0</span></div>
      <div style="margin-top:10px;color:#888;">Registers:</div>
      <div class="reg-grid" id="regGrid"></div>
      <div style="margin-top:10px;color:#888;">Stack:</div>
      <div class="stack-list" id="stackList">(empty)</div>
      <div style="margin-top:10px;color:#888;">Current Instruction:</div>
      <div class="instr" id="dbgInstr">-</div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============ CHIP-8 CORE ============
class Chip8 {
  constructor() {
    this.memory = new Uint8Array(4096);
    this.V = new Uint8Array(16);
    this.I = 0;
    this.PC = 0x200;
    this.SP = -1;
    this.stack = new Uint16Array(16);
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display = new Uint8Array(64 * 32);
    this.keys = new Uint8Array(16);
    this.waitingForKey = false;
    this.keyTargetReg = 0;
    this.cycles = 0;
    this.loadFontset();
  }

  loadFontset() {
    const fontset = [
      0xF0,0x90,0x90,0x90,0xF0, // 0
      0x20,0x60,0x20,0x20,0x70, // 1
      0xF0,0x10,0xF0,0x80,0xF0, // 2
      0xF0,0x10,0xF0,0x10,0xF0, // 3
      0x90,0x90,0xF0,0x10,0x10, // 4
      0xF0,0x80,0xF0,0x10,0xF0, // 5
      0xF0,0x80,0xF0,0x90,0xF0, // 6
      0xF0,0x10,0x20,0x40,0x40, // 7
      0xF0,0x90,0xF0,0x90,0xF0, // 8
      0xF0,0x90,0xF0,0x10,0xF0, // 9
      0xF0,0x90,0xF0,0x90,0x90, // A
      0xE0,0x90,0xE0,0x90,0xE0, // B
      0xF0,0x80,0x80,0x80,0xF0, // C
      0xE0,0x90,0x90,0x90,0xE0, // D
      0xF0,0x80,0xF0,0x80,0xF0, // E
      0xF0,0x80,0xF0,0x80,0x80  // F
    ];
    for (let i = 0; i < fontset.length; i++) {
      this.memory[0x050 + i] = fontset[i];
    }
  }

  reset() {
    this.memory.fill(0);
    this.V.fill(0);
    this.I = 0;
    this.PC = 0x200;
    this.SP = -1;
    this.stack.fill(0);
    this.delayTimer = 0;
    this.soundTimer = 0;
    this.display.fill(0);
    this.keys.fill(0);
    this.waitingForKey = false;
    this.keyTargetReg = 0;
    this.cycles = 0;
    this.loadFontset();
  }

  loadROM(bytes) {
    this.reset();
    for (let i = 0; i < bytes.length && (0x200 + i) < 4096; i++) {
      this.memory[0x200 + i] = bytes[i];
    }
  }

  tickTimers() {
    if (this.delayTimer > 0) this.delayTimer--;
    if (this.soundTimer > 0) this.soundTimer--;
  }

  step() {
    if (this.waitingForKey) {
      for (let i = 0; i < 16; i++) {
        if (this.keys[i]) {
          this.V[this.keyTargetReg] = i;
          this.waitingForKey = false;
          break;
        }
      }
      if (this.waitingForKey) return null;
    }

    const opcode = (this.memory[this.PC] << 8) | this.memory[this.PC + 1];
    this.PC += 2;
    this.cycles++;

    const nnn = opcode & 0x0FFF;
    const nn = opcode & 0x00FF;
    const n = opcode & 0x000F;
    const x = (opcode & 0x0F00) >> 8;
    const y = (opcode & 0x00F0) >> 4;

    switch (opcode & 0xF000) {
      case 0x0000:
        switch (opcode) {
          case 0x00E0: // CLS
            this.display.fill(0);
            return 'CLS';
          case 0x00EE: // RET
            this.PC = this.stack[this.SP--];
            return 'RET';
          default:
            return `SYS ${hex(nnn)} (ignored)`;
        }
      case 0x1000: // JP addr
        this.PC = nnn;
        return `JP ${hex(nnn)}`;
      case 0x2000: // CALL addr
        this.stack[++this.SP] = this.PC;
        this.PC = nnn;
        return `CALL ${hex(nnn)}`;
      case 0x3000: // SE Vx, byte
        if (this.V[x] === nn) this.PC += 2;
        return `SE V${hex(x,1)}, ${hex(nn)}`;
      case 0x4000: // SNE Vx, byte
        if (this.V[x] !== nn) this.PC += 2;
        return `SNE V${hex(x,1)}, ${hex(nn)}`;
      case 0x5000: // SE Vx, Vy
        if (n === 0 && this.V[x] === this.V[y]) this.PC += 2;
        return `SE V${hex(x,1)}, V${hex(y,1)}`;
      case 0x6000: // LD Vx, byte
        this.V[x] = nn;
        return `LD V${hex(x,1)}, ${hex(nn)}`;
      case 0x7000: // ADD Vx, byte
        this.V[x] = (this.V[x] + nn) & 0xFF;
        return `ADD V${hex(x,1)}, ${hex(nn)}`;
      case 0x8000:
        switch (n) {
          case 0x0: this.V[x] = this.V[y]; return `LD V${hex(x,1)}, V${hex(y,1)}`;
          case 0x1: this.V[x] |= this.V[y]; return `OR V${hex(x,1)}, V${hex(y,1)}`;
          case 0x2: this.V[x] &= this.V[y]; return `AND V${hex(x,1)}, V${hex(y,1)}`;
          case 0x3: this.V[x] ^= this.V[y]; return `XOR V${hex(x,1)}, V${hex(y,1)}`;
          case 0x4: {
            const sum = this.V[x] + this.V[y];
            this.V[0xF] = sum > 0xFF ? 1 : 0;
            this.V[x] = sum & 0xFF;
            return `ADD V${hex(x,1)}, V${hex(y,1)}`;
          }
          case 0x5: {
            this.V[0xF] = this.V[x] >= this.V[y] ? 1 : 0;
            this.V[x] = (this.V[x] - this.V[y]) & 0xFF;
            return `SUB V${hex(x,1)}, V${hex(y,1)}`;
          }
          case 0x6: {
            this.V[0xF] = this.V[x] & 0x1;
            this.V[x] >>= 1;
            return `SHR V${hex(x,1)}`;
          }
          case 0x7: {
            this.V[0xF] = this.V[y] >= this.V[x] ? 1 : 0;
            this.V[x] = (this.V[y] - this.V[x]) & 0xFF;
            return `SUBN V${hex(x,1)}, V${hex(y,1)}`;
          }
          case 0xE: {
            this.V[0xF] = (this.V[x] & 0x80) >> 7;
            this.V[x] = (this.V[x] << 1) & 0xFF;
            return `SHL V${hex(x,1)}`;
          }
        }
        return `? 8XY${n}`;
      case 0x9000: // SNE Vx, Vy
        if (n === 0 && this.V[x] !== this.V[y]) this.PC += 2;
        return `SNE V${hex(x,1)}, V${hex(y,1)}`;
      case 0xA000: // LD I, addr
        this.I = nnn;
        return `LD I, ${hex(nnn)}`;
      case 0xB000: // JP V0, addr
        this.PC = nnn + this.V[0];
        return `JP V0, ${hex(nnn)}`;
      case 0xC000: // RND Vx, byte
        this.V[x] = Math.floor(Math.random() * 256) & nn;
        return `RND V${hex(x,1)}, ${hex(nn)}`;
      case 0xD000: { // DRW Vx, Vy, n
        const px = this.V[x] % 64;
        const py = this.V[y] % 32;
        this.V[0xF] = 0;
        for (let row = 0; row < n; row++) {
          const sprite = this.memory[this.I + row];
          for (let col = 0; col < 8; col++) {
            if ((sprite & (0x80 >> col)) !== 0) {
              const sx = (px + col) % 64;
              const sy = (py + row) % 32;
              const idx = sy * 64 + sx;
              if (this.display[idx] === 1) this.V[0xF] = 1;
              this.display[idx] ^= 1;
            }
          }
        }
        return `DRW V${hex(x,1)}, V${hex(y,1)}, ${n}`;
      }
      case 0xE000:
        switch (nn) {
          case 0x9E: // SKP Vx
            if (this.keys[this.V[x]]) this.PC += 2;
            return `SKP V${hex(x,1)}`;
          case 0xA1: // SKNP Vx
            if (!this.keys[this.V[x]]) this.PC += 2;
            return `SKNP V${hex(x,1)}`;
        }
        return `? EX${hex(nn)}`;
      case 0xF000:
        switch (nn) {
          case 0x07: this.V[x] = this.delayTimer; return `LD V${hex(x,1)}, DT`;
          case 0x0A:
            this.waitingForKey = true;
            this.keyTargetReg = x;
            this.PC -= 2; // re-execute when key pressed
            return `LD V${hex(x,1)}, K (waiting)`;
          case 0x15: this.delayTimer = this.V[x]; return `LD DT, V${hex(x,1)}`;
          case 0x18: this.soundTimer = this.V[x]; return `LD ST, V${hex(x,1)}`;
          case 0x1E: this.I = (this.I + this.V[x]) & 0xFFFF; return `ADD I, V${hex(x,1)}`;
          case 0x29: this.I = 0x050 + (this.V[x] & 0xF) * 5; return `LD F, V${hex(x,1)}`;
          case 0x33: {
            const v = this.V[x];
            this.memory[this.I] = Math.floor(v / 100);
            this.memory[this.I + 1] = Math.floor((v % 100) / 10);
            this.memory[this.I + 2] = v % 10;
            return `LD B, V${hex(x,1)}`;
          }
          case 0x55:
            for (let i = 0; i <= x; i++) this.memory[this.I + i] = this.V[i];
            return `LD [I], V${hex(x,1)}`;
          case 0x65:
            for (let i = 0; i <= x; i++) this.V[i] = this.memory[this.I + i];
            return `LD V${hex(x,1)}, [I]`;
        }
        return `? FX${hex(nn)}`;
    }
    return `? ${hex(opcode)}`;
  }
}

function hex(v, pad = 3) {
  return '0x' + v.toString(16).toUpperCase().padStart(pad, '0');
}

// ============ DEMO ROM ============
// Hand-assembled: draws "HELLO" using font sprites, waits for key, then animates a face
const demoROM = new Uint8Array([
  // Main program starts at 0x200
  // CLS
  0x00, 0xE0,
  // LD I, 0x050 (font 'H' location)
  0xA0, 0x50,
  // LD V0, 8 (x position)
  0x60, 0x08,
  // LD V1, 12 (y position)
  0x61, 0x0C,
  // LD V2, 5 (sprite height)
  0x62, 0x05,
  // Draw 'H' at (8,12)
  0xD0, 0x12,
  // LD I, 0x055 (font 'E')
  0xA0, 0x55,
  // LD V0, 16
  0x60, 0x10,
  // Draw 'E'
  0xD0, 0x12,
  // LD I, 0x05A (font 'L')
  0xA0, 0x5A,
  // LD V0, 24
  0x60, 0x18,
  // Draw 'L'
  0xD0, 0x12,
  // LD I, 0x05A (font 'L')
  0xA0, 0x5A,
  // LD V0, 32
  0x60, 0x20,
  // Draw 'L'
  0xD0, 0x12,
  // LD I, 0x060 (font 'O')
  0xA0, 0x60,
  // LD V0, 40
  0x60, 0x28,
  // Draw 'O'
  0xD0, 0x12,
  // Wait for key press (FX0A into V3)
  0xF3, 0x0A,
  // Clear screen
  0x00, 0xE0,
  // Draw a face sprite at (24,8) - 8x8 sprite defined below
  // LD I, 0x300 (sprite location)
  0xA3, 0x00,
  // LD V0, 24
  0x60, 0x18,
  // LD V1, 8
  0x61, 0x08,
  // LD V2, 8 (height)
  0x62, 0x08,
  // Draw face
  0xD0, 0x12,
  // Wait for any key
  0xF3, 0x0A,
  // Move face: add 4 to V0
  0x70, 0x04,
  // If V0 > 56, wrap to 0
  0x30, 0x38,
  // JP back to clear+draw
  0x12, 0x1E,
  // Jump target for wrap (0x21E)
  // Actually let's restructure: jump to clear
  0x12, 0x16,
  // NOP padding
  0x00, 0x00,

  // Sprite data at 0x300: smiley face (8x8)
  // 0x3C = ..####..
  // 0x42 = .#....#.
  // 0xA5 = #.#..#.#
  // 0xA5 = #.#..#.#
  // 0xA5 = #.#..#.#
  // 0xA5 = #.#..#.#
  // 0x42 = .#....#.
  // 0x3C = ..####..
  0x3C, 0x42, 0xA5, 0xA5, 0xA5, 0xA5, 0x42, 0x3C
]);

// ============ UI ============
const chip8 = new Chip8();
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const btnRun = document.getElementById('btnRun');
const btnStep = document.getElementById('btnStep');
const btnReset = document.getElementById('btnReset');
const fileInput = document.getElementById('fileInput');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const statusEl = document.getElementById('status');
const keypadEl = document.getElementById('keypad');
const regGrid = document.getElementById('regGrid');
const dbgPC = document.getElementById('dbgPC');
const dbgI = document.getElementById('dbgI');
const dbgSP = document.getElementById('dbgSP');
const dbgDT = document.getElementById('dbgDT');
const dbgST = document.getElementById('dbgST');
const dbgCycles = document.getElementById('dbgCycles');
const stackList = document.getElementById('stackList');
const dbgInstr = document.getElementById('dbgInstr');

let running = false;
let lastInstr = '-';

// Keypad layout: 4x4 grid
const keyMap = {
  '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
  'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
  'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
  'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
};

// Build keypad display
function buildKeypad() {
  keypadEl.innerHTML = '';
  const layout = [
    ['1','2','3','4'],
    ['Q','W','E','R'],
    ['A','S','D','F'],
    ['Z','X','C','V']
  ];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const k = layout[r][c];
      const div = document.createElement('div');
      div.className = 'key';
      div.id = 'key_' + k;
      div.innerHTML = `${k}<small>0x${keyMap[k.toLowerCase()].toString(16).toUpperCase()}</small>`;
      keypadEl.appendChild(div);
    }
  }
}
buildKeypad();

// Build register grid
function buildRegGrid() {
  regGrid.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const row = document.createElement('div');
    row.className = 'debug-row';
    row.innerHTML = `<span>V${i.toString(16).toUpperCase()}:</span><span id="reg${i}">0x00</span>`;
    regGrid.appendChild(row);
  }
}
buildRegGrid();

// Keyboard input
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (keyMap.hasOwnProperty(k)) {
    chip8.keys[keyMap[k]] = 1;
    const keyEl = document.getElementById('key_' + k.toUpperCase());
    if (keyEl) keyEl.classList.add('active');
  }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (keyMap.hasOwnProperty(k)) {
    chip8.keys[keyMap[k]] = 0;
    const keyEl = document.getElementById('key_' + k.toUpperCase());
    if (keyEl) keyEl.classList.remove('active');
  }
});

// Controls
btnRun.addEventListener('click', () => {
  running = !running;
  btnRun.textContent = running ? 'Pause' : 'Run';
  btnRun.classList.toggle('primary', !running);
  statusEl.textContent = 'Status: ' + (running ? 'Running' : 'Paused');
  statusEl.className = 'status ' + (running ? 'running' : 'paused');
});

btnStep.addEventListener('click', () => {
  if (running) return;
  lastInstr = chip8.step();
  chip8.tickTimers();
  render();
  updateDebugger();
});

btnReset.addEventListener('click', () => {
  running = false;
  btnRun.textContent = 'Run';
  btnRun.classList.add('primary');
  statusEl.textContent = 'Status: Paused';
  statusEl.className = 'status paused';
  loadDemoROM();
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const bytes = new Uint8Array(ev.target.result);
    chip8.loadROM(bytes);
    running = false;
    btnRun.textContent = 'Run';
    btnRun.classList.add('primary');
    statusEl.textContent = 'Status: Paused (loaded ' + file.name + ')';
    statusEl.className = 'status paused';
    render();
    updateDebugger();
  };
  reader.readAsArrayBuffer(file);
});

speedSlider.addEventListener('input', () => {
  speedVal.textContent = speedSlider.value;
});

function loadDemoROM() {
  chip8.loadROM(demoROM);
  render();
  updateDebugger();
}

// Rendering
function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 64; x++) {
      if (chip8.display[y * 64 + x]) {
        ctx.fillRect(x * 8, y * 8, 8, 8);
      }
    }
  }
}

// Debugger
function updateDebugger() {
  dbgPC.textContent = hex(chip8.PC);
  dbgI.textContent = hex(chip8.I);
  dbgSP.textContent = chip8.SP >= 0 ? chip8.SP : '(empty)';
  dbgDT.textContent = chip8.delayTimer;
  dbgST.textContent = chip8.soundTimer;
  dbgCycles.textContent = chip8.cycles;
  for (let i = 0; i < 16; i++) {
    document.getElementById('reg' + i).textContent = hex(chip8.V[i], 2);
  }
  if (chip8.SP >= 0) {
    let s = '';
    for (let i = 0; i <= chip8.SP; i++) {
      s += hex(chip8.stack[i]) + '<br>';
    }
    stackList.innerHTML = s;
  } else {
    stackList.textContent = '(empty)';
  }
  dbgInstr.textContent = lastInstr || '-';
}

// Audio context for beep
let audioCtx = null;
function beep(freq, duration) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'square';
    gain.gain.value = 0.1;
    osc.start();
    setTimeout(() => { osc.stop(); }, duration);
  } catch (e) {}
}

// Main loop
let lastBeep = 0;
function loop() {
  if (running) {
    const speed = parseInt(speedSlider.value);
    for (let i = 0; i < speed; i++) {
      lastInstr = chip8.step();
    }
    chip8.tickTimers();
    if (chip8.soundTimer > 0 && Date.now() - lastBeep > 200) {
      beep(440, 50);
      lastBeep = Date.now();
    }
    render();
    updateDebugger();
  }
  requestAnimationFrame(loop);
}

// Initialize
loadDemoROM();
loop();
</script>
