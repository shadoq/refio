<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px #101a3a;
            border: 2px solid #ffd400;
        }
        canvas {
            display: block;
            background-color: #05070f;
        }
        .dg.main {
            user-select: none;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const params = {
        // Growth
        neuronCount: 5,
        growthSpeed: 2,
        maxDepth: 5,
        splitChance: 0.3,
        curvature: 0.2,
        maxLength: 60,
        // Synapses
        synapseThreshold: 40,
        synapseGlow: 15,
        // Pulses
        pulseSpeed: 0.02,
        pulseFrequency: 0.01,
        pulseBrightness: 1.0,
        // Visuals
        bgColor: '#05070f',
        branchColor: '#00e5ff',
        accentColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a',
        // Actions
        regenerate: () => initSimulation(),
        clear: () => clearCanvas(),
        paused: false
    };

    let neurons = [];
    let branches = [];
    let synapses = [];
    let pulses = [];
    let animationId;

    class Branch {
        constructor(x, y, angle, depth, parent = null) {
            this.startX = x;
            this.startY = y;
            this.endX = x;
            this.endY = y;
            this.angle = angle;
            this.depth = depth;
            this.parent = parent;
            this.length = 0;
            this.targetLength = Math.random() * params.maxLength + 20;
            this.growthComplete = false;
            this.thickness = Math.max(1, (params.maxDepth - depth) * 1.5);
            this.color = (depth % 2 === 0) ? params.branchColor : params.accentColor;
            this.curveOffset = (Math.random() - 0.5) * params.curvature;
        }

        update() {
            if (this.growthComplete) return;

            this.length += params.growthSpeed;
            
            // Organic curvature
            this.angle += this.curveOffset;
            
            this.endX = this.startX + Math.cos(this.angle) * this.length;
            this.endY = this.startY + Math.sin(this.angle) * this.length;

            if (this.length >= this.targetLength) {
                this.growthComplete = true;
                this.checkSplit();
                this.checkSynapses();
            }
        }

        checkSplit() {
            if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
                const numSplits = Math.random() > 0.8 ? 3 : 2;
                for (let i = 0; i < numSplits; i++) {
                    const newAngle = this.angle + (Math.random() - 0.5) * 1.5;
                    branches.push(new Branch(this.endX, this.endY, newAngle, this.depth + 1, this));
                }
            }
        }

        checkSynapses() {
            branches.forEach(other => {
                if (other === this || other.parent === this || this.parent === other) return;
                if (!other.growthComplete) return;

                const dist = Math.hypot(this.endX - other.endX, this.endY - other.endY);
                if (dist < params.synapseThreshold) {
                    // Prevent duplicates
                    const exists = synapses.some(s => (s.a === this && s.b === other) || (s.a === other && s.b === this));
                    if (!exists) {
                        synapses.push({ a: this, b: other, life: 0 });
                    }
                }
            });
        }

        draw() {
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = this.thickness;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.moveTo(this.startX, this.startY);
            ctx.lineTo(this.endX, this.endY);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
        }

        update() {
            this.progress += this.speed;
            if (this.progress >= 1) return false;
            return true;
        }

        draw() {
            const x = this.synapse.a.endX + (this.synapse.b.endX - this.synapse.a.endX) * this.progress;
            const y = this.synapse.a.endY + (this.synapse.b.endY - this.synapse.a.endY) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 10 * params.pulseBrightness;
            ctx.shadowColor = params.pulseColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function initSimulation() {
        neurons = [];
        branches = [];
        synapses = [];
        pulses = [];
        
        for (let i = 0; i < params.neuronCount; i++) {
            const x = 400 + (Math.random() - 0.5) * 200;
            const y = 400 + (Math.random() - 0.5) * 200;
            neurons.push({ x, y });
            
            // Initial growth directions
            const directions = 4 + Math.floor(Math.random() * 4);
            for (let j = 0; j < directions; j++) {
                const angle = (Math.PI * 2 / directions) * j;
                branches.push(new Branch(x, y, angle, 0));
            }
        }
    }

    function clearCanvas() {
        branches = [];
        synapses = [];
        pulses = [];
    }

    function drawBackground() {
        // Base background
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle Grid/Scanlines
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
            ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        }
        ctx.stroke();

        // Vignette glow
        const grad = ctx.createRadialGradient(400, 400, 100, 400, 400, 500);
        grad.addColorStop(0, '#101a3a');
        grad.addColorStop(1, params.bgColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function loop() {
        if (!params.paused) {
            drawBackground();

            // Update and Draw Branches
            branches.forEach(b => {
                b.update();
                b.draw();
            });

            // Update and Draw Synapses
            synapses.forEach(s => {
                s.life += 0.05;
                const glow = Math.sin(s.life) * 5 + params.synapseGlow;
                ctx.beginPath();
                ctx.strokeStyle = params.synapseColor;
                ctx.lineWidth = 2;
                ctx.shadowBlur = glow;
                ctx.shadowColor = params.synapseColor;
                ctx.moveTo(s.a.endX, s.a.endY);
                ctx.lineTo(s.b.endX, s.b.endY);
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Handle Pulses
            if (Math.random() < params.pulseFrequency && synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse));
            }

            for (let i = pulses.length - 1; i >= 0; i--) {
                if (!pulses[i].update()) {
                    pulses.splice(i, 1);
                } else {
                    pulses[i].draw();
                }
            }
        }

        animationId = requestAnimationFrame(loop);
    }

    function setupGUI() {
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(params, 'neuronCount', 1, 15, 1).onFinishChange(initSimulation);
        growthFolder.add(params, 'growthSpeed', 0.1, 5, 0.1);
        growthFolder.add(params, 'maxDepth', 1, 10, 1).onFinishChange(initSimulation);
        growthFolder.add(params, 'splitChance', 0, 1, 0.01).onFinishChange(initSimulation);
        growthFolder.add(params, 'curvature', 0, 0.5, 0.01).onFinishChange(initSimulation);
        growthFolder.add(params, 'maxLength', 10, 150, 1).onFinishChange(initSimulation);
        growthFolder.open();

        const synapseFolder = gui.addFolder('Synapses');
        synapseFolder.add(params, 'synapseThreshold', 5, 100, 1);
        synapseFolder.add(params, 'synapseGlow', 0, 30, 1);
        synapseFolder.open();

        const pulseFolder = gui.addFolder('Pulses');
        pulseFolder.add(params, 'pulseSpeed', 0.001, 0.1, 0.001);
        pulseFolder.add(params, 'pulseFrequency', 0, 0.1, 0.001);
        pulseFolder.add(params, 'pulseBrightness', 0, 2, 0.1);
        pulseFolder.open();

        const visualFolder = gui.addFolder('Visuals');
        visualFolder.addColor(params, 'bgColor');
        visualFolder.addColor(params, 'branchColor');
        visualFolder.addColor(params, 'accentColor');
        visualFolder.addColor(params, 'synapseColor');
        visualFolder.addColor(params, 'pulseColor');
        visualFolder.open();

        gui.add(params, 'paused').name('Paused');
        gui.add(params, 'regenerate').name('Regenerate Network');
        gui.add(params, 'clear').name('Clear Canvas');
    }

    initSimulation();
    setupGUI();
    loop();

</script>
</body>
</html>
