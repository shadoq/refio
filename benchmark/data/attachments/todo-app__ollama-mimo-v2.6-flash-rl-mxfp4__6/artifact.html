<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #ef4444;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    height: fit-content;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    overflow: hidden;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  #todo-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
    transition: border-color .15s;
  }
  #todo-input:focus { border-color: var(--accent); }
  #add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  #add-btn:hover { opacity: 0.9; }
  ul#todo-list { list-style: none; }
  li.todo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  li.todo:last-child { border-bottom: none; }
  li.todo input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li.todo span.text {
    flex: 1;
    word-break: break-word;
    font-size: 1rem;
    line-height: 1.4;
    cursor: pointer;
  }
  li.todo.completed span.text {
    text-decoration: line-through;
    color: var(--muted);
  }
  li.todo button.delete {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
    opacity: 0.7;
    transition: background .15s, opacity .15s;
    flex-shrink: 0;
  }
  li.todo button.delete:hover {
    background: #fee2e2;
    opacity: 1;
  }
  .empty {
    padding: 28px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    flex-wrap: wrap;
  }
  .count { color: var(--muted); font-size: 0.85rem; }
  .filters { display: flex; gap: 6px; }
  .filters button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    font-size: 0.85rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .filters button:hover { border-color: var(--accent); color: var(--accent); }
  .filters button.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="app">
  <h1>📝 Todos</h1>
  <div class="card">
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="500">
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <div class="empty" id="empty-state" hidden>No todos here.</div>
    <div class="footer">
      <span class="count" id="count"></span>
      <div class="filters" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todo_ollama-mimo-v2.6-flash-rl-mxfp4_01';
  var todos = [];
  var filter = 'all';

  var input = document.getElementById('todo-input');
  var addBtn = document.getElementById('add-btn');
  var list = document.getElementById('todo-list');
  var emptyState = document.getElementById('empty-state');
  var countEl = document.getElementById('count');
  var filtersEl = document.getElementById('filters');

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        todos = parsed.filter(function (t) {
          return t && typeof t.text === 'string' && typeof t.completed === 'boolean';
        }).map(function (t) {
          return { id: t.id || String(Date.now()) + Math.random().toString(36).slice(2), text: t.text, completed: t.completed };
        });
      }
    } catch (e) { todos = []; }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch (e) {}
  }

  function addTodo() {
    var text = input.value.trim();
    if (!text) return;
    todos.push({ id: String(Date.now()) + Math.random().toString(36).slice(2), text: text, completed: false });
    input.value = '';
    save();
    render();
    input.focus();
  }

  function toggleTodo(id) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id === id) { todos[i].completed = !todos[i].completed; break; }
    }
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function visibleTodos() {
    if (filter === 'active') return todos.filter(function (t) { return !t.completed; });
    if (filter === 'completed') return todos.filter(function (t) { return t.completed; });
    return todos;
  }

  function render() {
    var visible = visibleTodos();
    list.innerHTML = '';

    visible.forEach(function (todo) {
      var li = document.createElement('li');
      li.className = 'todo' + (todo.completed ? ' completed' : '');

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.completed;
      checkbox.addEventListener('change', function () { toggleTodo(todo.id); });

      var span = document.createElement('span');
      span.className = 'text';
      span.textContent = todo.text;
      span.addEventListener('click', function () { toggleTodo(todo.id); });

      var del = document.createElement('button');
      del.className = 'delete';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Delete todo');
      del.title = 'Delete';
      del.addEventListener('click', function () { deleteTodo(todo.id); });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });

    emptyState.hidden = visible.length !== 0;

    var activeCount = todos.filter(function (t) { return !t.completed; }).length;
    var remainingLabel = activeCount === 1 ? '1 item left' : activeCount + ' items left';
    countEl.textContent = remainingLabel;

    var buttons = filtersEl.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-filter') === filter);
    }
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addTodo();
  });

  filtersEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    filter = btn.getAttribute('data-filter');
    render();
  });

  load();
  render();
})();
</script>
</body>
</html>
