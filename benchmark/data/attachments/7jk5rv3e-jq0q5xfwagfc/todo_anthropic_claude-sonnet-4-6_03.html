<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    h1 {
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: 3rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Input area */
    .input-row {
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .toggle-all {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #764ba2;
      flex-shrink: 0;
      margin-right: 14px;
    }

    #new-todo {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.1rem;
      padding: 20px 0;
      color: #333;
      background: transparent;
      caret-color: #764ba2;
    }

    #new-todo::placeholder { color: #ccc; font-style: italic; }

    /* Todo list */
    #todo-list {
      list-style: none;
      max-height: 420px;
      overflow-y: auto;
    }

    #todo-list::-webkit-scrollbar { width: 6px; }
    #todo-list::-webkit-scrollbar-track { background: #f9f9f9; }
    #todo-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #f5f5f5;
      animation: slideIn 0.2s ease;
      transition: background 0.15s;
    }

    .todo-item:hover { background: #fafafa; }
    .todo-item:hover .delete-btn { opacity: 1; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-check {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #764ba2;
      flex-shrink: 0;
      margin-right: 14px;
    }

    .todo-label {
      flex: 1;
      font-size: 1rem;
      color: #333;
      padding: 18px 0;
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
      cursor: default;
      line-height: 1.4;
    }

    .todo-item.completed .todo-label {
      text-decoration: line-through;
      color: #bbb;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: #e57373;
      opacity: 0;
      transition: opacity 0.2s, transform 0.15s;
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-btn:hover { transform: scale(1.2); }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .item-count {
      font-size: 0.85rem;
      color: #999;
      min-width: 80px;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.85rem;
      color: #777;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .filter-btn:hover { border-color: #ccc; }
    .filter-btn.active { border-color: #764ba2; color: #764ba2; font-weight: 600; }

    .clear-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      color: #999;
      cursor: pointer;
      transition: color 0.15s;
      min-width: 80px;
      text-align: right;
    }

    .clear-btn:hover { color: #e57373; }
    .clear-btn:disabled { opacity: 0; pointer-events: none; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #ccc;
      font-size: 0.95rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todos</h1>
    <div class="card">
      <div class="input-row">
        <input type="checkbox" class="toggle-all" id="toggle-all" title="Mark all complete" />
        <input type="text" id="new-todo" placeholder="What needs to be done?" maxlength="300" autocomplete="off" />
      </div>

      <ul id="todo-list"></ul>

      <div class="footer" id="footer" style="display:none;">
        <span class="item-count" id="item-count"></span>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="clear-btn" id="clear-completed">Clear completed</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo_app_todos';

    let todos = [];
    let filter = 'all';

    // --- Persistence ---
    function load() {
      try { todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { todos = []; }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // --- Render ---
    function render() {
      const list = document.getElementById('todo-list');
      const footer = document.getElementById('footer');
      const itemCount = document.getElementById('item-count');
      const clearBtn = document.getElementById('clear-completed');
      const toggleAll = document.getElementById('toggle-all');

      const activeCount = todos.filter(t => !t.completed).length;
      const completedCount = todos.filter(t => t.completed).length;

      // Filter todos
      const visible = todos.filter(t => {
        if (filter === 'active') return !t.completed;
        if (filter === 'completed') return t.completed;
        return true;
      });

      // Clear list
      list.innerHTML = '';

      if (visible.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty-state';
        empty.textContent = filter === 'completed'
          ? 'No completed todos yet.'
          : filter === 'active'
          ? 'No active todos — great job!'
          : 'Add your first todo above!';
        list.appendChild(empty);
      } else {
        visible.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.completed ? ' completed' : '');
          li.dataset.id = todo.id;

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'todo-check';
          cb.checked = todo.completed;
          cb.addEventListener('change', () => toggleTodo(todo.id));

          const label = document.createElement('span');
          label.className = 'todo-label';
          label.textContent = todo.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.innerHTML = '&#10005;';
          del.title = 'Delete';
          del.addEventListener('click', () => deleteTodo(todo.id));

          li.appendChild(cb);
          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      // Footer
      footer.style.display = todos.length ? 'flex' : 'none';
      itemCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
      clearBtn.disabled = completedCount === 0;

      // Toggle-all state
      toggleAll.checked = todos.length > 0 && activeCount === 0;
      toggleAll.indeterminate = activeCount > 0 && completedCount > 0;

      // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
    }

    // --- Actions ---
    function addTodo(text) {
      text = text.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, completed: false });
      save();
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) { todo.completed = !todo.completed; save(); render(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function toggleAll() {
      const allDone = todos.every(t => t.completed);
      todos.forEach(t => t.completed = !allDone);
      save();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      save();
      render();
    }

    // --- Event listeners ---
    document.getElementById('new-todo').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        addTodo(e.target.value);
        e.target.value = '';
      }
    });

    document.getElementById('toggle-all').addEventListener('change', toggleAll);
    document.getElementById('clear-completed').addEventListener('click', clearCompleted);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        render();
      });
    });

    // --- Init ---
    load();
    render();
  </script>
</body>
</html>
