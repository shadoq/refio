<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-strikethrough: #64748b;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .todo-form {
      display: flex;
      padding: 16px;
      gap: 10px;
      border-bottom: 1px solid var(--surface-border);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .todo-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .add-btn:hover {
      background: var(--primary-hover);
    }

    .add-btn:active {
      transform: scale(0.98);
    }

    .filters-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--surface-border);
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
    }

    .filter-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .todo-list {
      list-style: none;
      max-height: 420px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--surface-border);
      gap: 12px;
      transition: background-color 0.15s;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .checkbox-container {
      position: relative;
      width: 20px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-container input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 20px;
      width: 20px;
      background-color: #0f172a;
      border: 2px solid var(--surface-border);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .checkbox-container:hover input ~ .checkmark {
      border-color: var(--primary);
    }

    .checkbox-container input:checked ~ .checkmark {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checkbox-container input:checked ~ .checkmark:after {
      display: block;
    }

    .todo-text {
      flex: 1;
      font-size: 0.975rem;
      line-height: 1.4;
      color: var(--text-main);
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-strikethrough);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: opacity 0.2s, color 0.2s, background-color 0.2s;
    }

    .todo-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--surface-border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .clear-completed-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .clear-completed-btn:hover {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Task Manager</h1>
    </header>

    <main class="card">
      <form id="todoForm" class="todo-form">
        <input 
          type="text" 
          id="todoInput" 
          class="todo-input" 
          placeholder="What needs to be done?" 
          autocomplete="off"
          required
        />
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="filters-bar">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="todoList" class="todo-list"></ul>

      <div class="app-footer">
        <span id="itemsLeft">0 items left</span>
        <button type="button" id="clearCompletedBtn" class="clear-completed-btn">Clear Completed</button>
      </div>
    </main>
  </div>

  <script>
    // State management
    const STORAGE_KEY = 'todos_app_data';
    let todos = [];
    let currentFilter = 'all';

    // DOM Elements
    const form = document.getElementById('todoForm');
    const input = document.getElementById('todoInput');
    const list = document.getElementById('todoList');
    const itemsLeft = document.getElementById('itemsLeft');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Load from localStorage
    function loadTodos() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          todos = JSON.parse(data);
        } catch (e) {
          todos = [];
        }
      }
    }

    // Save to localStorage
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Render list
    function render() {
      list.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        const emptyEl = document.createElement('li');
        emptyEl.className = 'empty-state';
        emptyEl.textContent = todos.length === 0 
          ? 'No tasks yet. Add one above!' 
          : 'No tasks found in this view.';
        list.appendChild(emptyEl);
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

          // Checkbox container
          const label = document.createElement('label');
          label.className = 'checkbox-container';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.addEventListener('change', () => toggleTodo(todo.id));

          const checkmark = document.createElement('span');
          checkmark.className = 'checkmark';

          label.appendChild(checkbox);
          label.appendChild(checkmark);

          // Todo text
          const textSpan = document.createElement('span');
          textSpan.className = 'todo-text';
          textSpan.textContent = todo.text;

          // Delete button
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.title = 'Delete task';
          delBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          `;
          delBtn.addEventListener('click', () => deleteTodo(todo.id));

          li.appendChild(label);
          li.appendChild(textSpan);
          li.appendChild(delBtn);

          list.appendChild(li);
        });
      }

      // Update counters
      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;

      // Update clear button visibility
      const hasCompleted = todos.some(t => t.completed);
      clearCompletedBtn.style.visibility = hasCompleted ? 'visible' : 'hidden';
    }

    // Add new todo
    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const newTodo = {
        id: Date.now().toString(),
        text: trimmed,
        completed: false
      };

      todos.push(newTodo);
      saveTodos();
      render();
    }

    // Toggle complete
    function toggleTodo(id) {
      todos = todos.map(t => {
        if (t.id === id) {
          return { ...t, completed: !t.completed };
        }
        return t;
      });
      saveTodos();
      render();
    }

    // Delete todo
    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      render();
    }

    // Clear completed
    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      saveTodos();
      render();
    }

    // Event Listeners
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      addTodo(input.value);
      input.value = '';
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);

    // Initial load
    loadTodos();
    render();
  </script>
</body>
</html>
