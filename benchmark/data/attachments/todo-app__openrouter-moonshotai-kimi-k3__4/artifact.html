<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    color: #333;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }

  .card-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid #eee;
  }

  .card-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #2d3748;
    text-align: center;
  }

  .add-form {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
  }

  .add-form input {
    flex: 1;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-form input:focus {
    border-color: #667eea;
  }

  .btn {
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #667eea;
    color: #fff;
    font-weight: 600;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #5a67d8;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .todo-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s;
  }

  .todo-item:hover {
    background: #f7fafc;
  }

  .todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #667eea;
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 1rem;
    cursor: pointer;
    word-break: break-word;
    color: #2d3748;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #a0aec0;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #cbd5e0;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    line-height: 1;
    transition: color 0.2s, background 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    color: #e53e3e;
    background: #fff5f5;
  }

  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: #a0aec0;
    font-size: 0.95rem;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 24px;
    border-top: 1px solid #eee;
    background: #fafafa;
  }

  .items-left {
    font-size: 0.85rem;
    color: #718096;
  }

  .filters {
    display: flex;
    gap: 6px;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid transparent;
    padding: 5px 12px;
    font-size: 0.85rem;
    border-radius: 6px;
    cursor: pointer;
    color: #718096;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    color: #667eea;
    border-color: #c3dafe;
  }

  .filter-btn.active {
    color: #667eea;
    border-color: #667eea;
    font-weight: 600;
  }

  .clear-btn {
    background: transparent;
    border: none;
    font-size: 0.85rem;
    color: #718096;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }

  .clear-btn:hover {
    color: #e53e3e;
    background: #fff5f5;
  }

  @media (max-width: 480px) {
    .card-footer {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }

    .filters {
      justify-content: center;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Todo List</h1>
  </div>

  <form class="add-form" id="add-form">
    <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" autofocus>
    <button type="submit" class="btn">Add</button>
  </form>

  <ul class="todo-list" id="todo-list"></ul>

  <div class="card-footer">
    <span class="items-left" id="items-left"></span>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <button class="clear-btn" id="clear-completed">Clear completed</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todos';

  let todos = [];
  let currentFilter = 'all';

  const todoList = document.getElementById('todo-list');
  const addForm = document.getElementById('add-form');
  const todoInput = document.getElementById('todo-input');
  const itemsLeft = document.getElementById('items-left');
  const clearCompletedBtn = document.getElementById('clear-completed');
  const filterButtons = document.querySelectorAll('.filter-btn');

  function loadTodos() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      todos = stored ? JSON.parse(stored) : [];
      if (!Array.isArray(todos)) todos = [];
    } catch (e) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo(text) {
    todos.push({
      id: Date.now() + Math.random().toString(36).slice(2),
      text: text,
      completed: false
    });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.completed);
    saveTodos();
    render();
  }

  function getFilteredTodos() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    todoList.textContent = '';

    const filtered = getFilteredTodos();

    if (filtered.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      if (todos.length === 0) {
        empty.textContent = 'No todos yet. Add one above!';
      } else if (currentFilter === 'active') {
        empty.textContent = 'No active todos.';
      } else if (currentFilter === 'completed') {
        empty.textContent = 'No completed todos.';
      } else {
        empty.textContent = 'Nothing to show.';
      }
      todoList.appendChild(empty);
    } else {
      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;
        span.addEventListener('click', () => toggleTodo(todo.id));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', 'Delete todo');
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    const activeCount = todos.filter(t => !t.completed).length;
    itemsLeft.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    filterButtons.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === currentFilter);
    });
  }

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = todoInput.value.trim();
    if (text === '') return;
    addTodo(text);
    todoInput.value = '';
    todoInput.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearCompletedBtn.addEventListener('click', clearCompleted);

  loadTodos();
  render();
</script>

</body>
</html>
