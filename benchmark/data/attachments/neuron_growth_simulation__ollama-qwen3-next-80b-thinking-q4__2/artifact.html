<!DOCTYPE html>
<html>
<head>
  <title>Neuron Growth Simulation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #05070f;
      overflow: hidden;
    }
    canvas {
      width: 800px;
      height: 800px;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="800"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const config = {
      neuronCount: 4,
      branchGrowthSpeed: 1.5,
      maxBranchDepth: 5,
      branchSplitChance: 0.3,
      branchCurvature: 0.5,
      maxBranchLength: 150,
      synapseDistanceThreshold: 50,
      synapseGlowStrength: 0.8,
      pulseSpeed: 1.0,
      pulseFrequency: 0.5,
      pulseBrightness: 0.7,
      backgroundColor: '#05070f',
      branchColor: '#00e5ff',
      accentBranchColor: '#d6ff00',
      synapseColor: '#ff2bd6',
      pulseColor: '#fff36a',
      paused: false,
      regenerate: () => initSimulation(),
      clear: () => clearCanvas()
    };
    
    let neurons = [];
    let branches = [];
    let synapses = [];
    let pulses = [];
    let isGrowthComplete = false;
    
    function initSimulation() {
      neurons = [];
      branches = [];
      synapses = [];
      pulses = [];
      isGrowthComplete = false;
      
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 100;
      for (let i = 0; i < config.neuronCount; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        neurons.push({ x, y });
        const direction = Math.random() * 2 * Math.PI;
        branches.push({
          start: { x, y },
          end: { x, y },
          direction,
          length: 0,
          maxLength: config.maxBranchLength,
          depth: 0,
          color: config.branchColor,
          thickness: 1 + Math.random() * 2
        });
      }
    }
    
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      neurons = [];
      branches = [];
      synapses = [];
      pulses = [];
      isGrowthComplete = false;
    }
    
    function growBranches() {
      let allDone = true;
      for (let i = 0; i < branches.length; i++) {
        const branch = branches[i];
        if (branch.length < branch.maxLength) {
          allDone = false;
          branch.length += config.branchGrowthSpeed;
          branch.direction += (Math.random() - 0.5) * config.branchCurvature * 0.1;
          branch.end.x = branch.start.x + Math.cos(branch.direction) * branch.length;
          branch.end.y = branch.start.y + Math.sin(branch.direction) * branch.length;
          if (Math.random() < config.branchSplitChance && branch.depth < config.maxBranchDepth) {
            const newDirection1 = branch.direction + (Math.random() - 0.5) * 0.5;
            const newDirection2 = branch.direction - (Math.random() - 0.5) * 0.5;
            branches.push({
              start: { ...branch.end },
              end: { ...branch.end },
              direction: newDirection1,
              length: 0,
              maxLength: branch.maxLength,
              depth: branch.depth + 1,
              color: config.accentBranchColor,
              thickness: 0.5 + Math.random() * 1.5
            });
            branches.push({
              start: { ...branch.end },
              end: { ...branch.end },
              direction: newDirection2,
              length: 0,
              maxLength: branch.maxLength,
              depth: branch.depth + 1,
              color: config.accentBranchColor,
              thickness: 0.5 + Math.random() * 1.5
            });
          }
        }
      }
      if (allDone) {
        isGrowthComplete = true;
      }
    }
    
    function checkSynapses() {
      for (let i = 0; i < branches.length; i++) {
        const branch1 = branches[i];
        if (branch1.length >= branch1.maxLength) {
          for (let j = i + 1; j < branches.length; j++) {
            const branch2 = branches[j];
            if (branch2.length >= branch2.maxLength) {
              const dx = branch1.end.x - branch2.end.x;
              const dy = branch1.end.y - branch2.end.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              if (distance < config.synapseDistanceThreshold) {
                let exists = false;
                for (const synapse of synapses) {
                  if ((synapse.branch1 === branch1 && synapse.branch2 === branch2) ||
                      (synapse.branch1 === branch2 && synapse.branch2 === branch1)) {
                    exists = true;
                    break;
                  }
                }
                if (!exists) {
                  synapses.push({
                    branch1,
                    branch2,
                    distance,
                    pulseProgress: 0
                  });
                }
              }
            }
          }
        }
      }
    }
    
    function animatePulses() {
      for (let i = 0; i < pulses.length; i++) {
        const pulse = pulses[i];
        pulse.progress += config.pulseSpeed * 0.01;
        if (pulse.progress >= 1) {
          pulses.splice(i, 1);
          i--;
        }
      }
      
      if (Math.random() < config.pulseFrequency / 60 && synapses.length > 0) {
        const synapse = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push({
          synapse,
          progress: 0
        });
      }
    }
    
    function renderBranches() {
      for (const branch of branches) {
        ctx.strokeStyle = branch.color;
        ctx.lineWidth = branch.thickness;
        ctx.shadowColor = branch.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(branch.start.x, branch.start.y);
        ctx.lineTo(branch.end.x, branch.end.y);
        ctx.stroke();
      }
    }
    
    function renderSynapses() {
      for (const synapse of synapses) {
        const x = (synapse.branch1.end.x + synapse.branch2.end.x) / 2;
        const y = (synapse.branch1.end.y + synapse.branch2.end.y) / 2;
        ctx.fillStyle = config.synapseColor;
        ctx.shadowColor = config.synapseColor;
        ctx.shadowBlur = 20 * config.synapseGlowStrength;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function renderPulses() {
      for (const pulse of pulses) {
        const branch1 = pulse.synapse.branch1;
        const branch2 = pulse.synapse.branch2;
        const x = branch1.end.x + (branch2.end.x - branch1.end.x) * pulse.progress;
        const y = branch1.end.y + (branch2.end.y - branch1.end.y) * pulse.progress;
        ctx.fillStyle = config.pulseColor;
        ctx.shadowColor = config.pulseColor;
        ctx.shadowBlur = 10 * config.pulseBrightness;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function animate() {
      if (config.paused) {
        requestAnimationFrame(animate);
        return;
      }
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, Math.min(canvas.width, canvas.height)/2);
      gradient.addColorStop(0, 'transparent');
      gradient.addColorStop(1, '#101a3a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let y = 0; y < canvas.height; y += 2) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      
      if (!isGrowthComplete) {
        growBranches();
        checkSynapses();
      }
      
      animatePulses();
      renderBranches();
      renderSynapses();
      renderPulses();
      
      requestAnimationFrame(animate);
    }
    
    const gui = new dat.GUI();
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
    growthFolder.add(config, 'branchGrowthSpeed', 0.1, 5, 0.1).name('Growth Speed');
    growthFolder.add(config, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
    growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05).name('Split Chance');
    growthFolder.add(config, 'branchCurvature', 0, 1, 0.05).name('Curvature');
    growthFolder.add(config, 'maxBranchLength', 50, 200, 5).name('Max Length');
    growthFolder.open();
    
    const synapsesFolder = gui.addFolder('Synapses');
    synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 100, 5).name('Distance Threshold');
    synapsesFolder.add(config, 'synapseGlowStrength', 0, 1, 0.1).name('Glow Strength');
    synapsesFolder.open();
    
    const pulsesFolder = gui.addFolder('Pulses');
    pulsesFolder.add(config, 'pulseSpeed', 0.1, 5, 0.1).name('Speed');
    pulsesFolder.add(config, 'pulseFrequency', 0.1, 5, 0.1).name('Frequency');
    pulsesFolder.add(config, 'pulseBrightness', 0, 1, 0.1).name('Brightness');
    pulsesFolder.open();
    
    const visualsFolder = gui.addFolder('Visuals');
    visualsFolder.addColor(config, 'backgroundColor').name('Background Color');
    visualsFolder.addColor(config, 'branchColor').name('Branch Color');
    visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
    visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
    visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
    visualsFolder.open();
    
    gui.add(config, 'regenerate').name('Regenerate Network');
    gui.add(config, 'clear').name('Clear Canvas');
    gui.add(config, 'paused').name('Pause Animation');
    
    initSimulation();
    animate();
  </script>
</body>
</html>
