<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
        }

        .todo-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button.add-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button.add-btn:hover {
            background: #5568d3;
        }

        button.add-btn:active {
            transform: scale(0.96);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;\            background: white;
            color: #666;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .todo-item:hover {
            background: #f0f0f0;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-all;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #e04f4f;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 10px;
            font-size: 14px;
        }

        .stats {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 13px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="todo-container">
        <h1>Todo</h1>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Add a new todo..." autocomplete="off">
            <button class="add-btn" id="add-btn">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="stats" id="stats"></div>
    </div>

    <script>
        const STORAGE_KEY = 'todo-app-data';
        let todos = [];
        let currentFilter = 'all';

        function loadTodos() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                todos = stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Failed to load todos:', e);
                todos = [];
            }
            render();
        }

        function saveTodos() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            } catch (e) {
                console.error('Failed to save todos:', e);
            }
        }

        function addTodo(text) {
            const trimmed = text.trim();
            if (!trimmed) return;

            todos.unshift({
                id: Date.now(),
                text: trimmed,
                completed: false
            });
            saveTodos();
            render();
        }

        function toggleTodo(id) {
            todos = todos.map(todo => 
                todo.id === id ? { ...todo, completed: !todo.completed } : todo
            );
            saveTodos();
            render();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            render();
        }

        function getFilteredTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(todo => !todo.completed);
                case 'completed':
                    return todos.filter(todo => todo.completed);
                default:
                    return todos;
            }
        }

        function render() {
            const listEl = document.getElementById('todo-list');
            const statsEl = document.getElementById('stats');
            const filtered = getFilteredTodos();

            if (filtered.length === 0) {
                listEl.innerHTML = '<li class="empty-state">No todos yet. Add one above!</li>';
                statsEl.textContent = '';
                return;
            }

            listEl.innerHTML = filtered.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}"
                    data-id="${todo.id}">
                    <input type="checkbox" class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})">
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">&times;</button>
                </li>
            `).join('');

            const activeCount = todos.filter(t => !t.completed).length;
            statsEl.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} remaining`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('todo-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo(e.target.value);
                e.target.value = '';
            }
        });

        document.getElementById('add-btn').addEventListener('click', () => {
            const input = document.getElementById('todo-input');
            addTodo(input.value);
            input.value = '';
            input.focus();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        // Initialize
        loadTodos();
    </script>
</body>
</html>
