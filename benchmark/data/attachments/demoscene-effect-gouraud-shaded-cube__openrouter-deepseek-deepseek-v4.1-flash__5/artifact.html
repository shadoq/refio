<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gouraud-Shaded Cube — Canvas 2D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b0e14;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 8px;
    box-sizing: border-box;
    border: 1px solid #1c2230;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #9fb3c8;
    background: rgba(11, 14, 20, 0.55);
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #1c2230;
    pointer-events: none;
    white-space: pre;
    z-index: 10;
  }
  #hud .val { color: #e6edf3; }
  #hud .warn { color: #ffb454; }
  #hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px;
    color: #6b7d90;
    background: rgba(11, 14, 20, 0.55);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #1c2230;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">W = wireframe · P = pause</div>

<script>
"use strict";

/* ============================================================
 * Canvas setup
 * ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const hud = document.getElementById("hud");

let W = 0;          // logical width
let H = 0;          // logical height
let dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(W * dpr));
  canvas.height = Math.max(1, Math.floor(H * dpr));
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  // Reset transform so we can draw in device pixels directly.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // Reallocate buffers
  imageData = ctx.createImageData(canvas.width, canvas.height);
  pixels = new Uint32Array(imageData.data.buffer);
  zbuffer = new Float32Array(canvas.width * canvas.height);
}
window.addEventListener("resize", resize);

/* ============================================================
 * 3D math helpers
 * ============================================================ */

// 3x3 matrix stored row-major: [m00,m01,m02, m10,m11,m12, m20,m21,m22]
function mat3Mul(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      r[i * 3 + j] =
        a[i * 3 + 0] * b[0 * 3 + j] +
        a[i * 3 + 1] * b[1 * 3 + j] +
        a[i * 3 + 2] * b[2 * 3 + j];
    }
  }
  return r;
}

function mat3Apply(m, v) {
  return [
    m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
    m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
    m[6] * v[0] + m[7] * v[1] + m[8] * v[2]
  ];
}

function rotX(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [1, 0, 0, 0, c, -s, 0, s, c];
}
function rotY(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c, 0, s, 0, 1, 0, -s, 0, c];
}
function rotZ(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c, -s, 0, s, c, 0, 0, 0, 1];
}

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function length(a) { return Math.sqrt(dot(a, a)); }
function normalize(a) {
  const l = length(a);
  if (l < 1e-9) return [0, 0, 0];
  return [a[0] / l, a[1] / l, a[2] / l];
}

/* ============================================================
 * Geometry: cube vertices and faces
 * ============================================================ */
const CUBE_VERTS = [
  [-1, -1, -1], // 0
  [ 1, -1, -1], // 1
  [ 1,  1, -1], // 2
  [-1,  1, -1], // 3
  [-1, -1,  1], // 4
  [ 1, -1,  1], // 5
  [ 1,  1,  1], // 6
  [-1,  1,  1]  // 7
];

// Each face: quad indices (CCW when viewed from outside) + base color [r,g,b]
const CUBE_FACES = [
  { idx: [4, 5, 6, 7], color: [ 90, 200, 255] }, // +Z front  (cyan)
  { idx: [1, 0, 3, 2], color: [255, 120, 120] }, // -Z back   (red)
  { idx: [5, 1, 2, 6], color: [140, 255, 140] }, // +X right  (green)
  { idx: [0, 4, 7, 3], color: [255, 220, 120] }, // -X left   (yellow)
  { idx: [7, 6, 2, 3], color: [200, 140, 255] }, // +Y top    (violet)
  { idx: [0, 1, 5, 4], color: [255, 160, 220] }  // -Y bottom (pink)
];

/* ============================================================
 * Camera / projection
 * ============================================================ */
const CAM_DIST = 4.5;
const FOCAL = 3.2; // focal length in world units

// Project a view-space point to screen. Returns {x, y, z, scale} or null if behind camera.
function project(p) {
  const zc = p[2] + CAM_DIST;
  if (zc <= 0.001) return null;
  const scale = FOCAL / zc;
  return {
    x: W * 0.5 + p[0] * scale * (W * 0.5) / FOCAL * FOCAL / (W * 0.5) * (W * 0.5) / FOCAL * FOCAL, // simplified below
    y: 0,
    z: zc,
    scale: scale
  };
}

// Simpler, correct projection using pixel scale.
function projectPoint(p) {
  const zc = p[2] + CAM_DIST;
  if (zc <= 0.001) return null;
  const scale = FOCAL / zc;
  // Convert world units to pixels: use a reference so cube fills a good portion.
  const px = W * 0.5 + p[0] * scale * (Math.min(W, H) * 0.5) / FOCAL * FOCAL / (Math.min(W, H) * 0.5) * (Math.min(W, H) * 0.5) / FOCAL;
  // The above is convoluted; do it cleanly:
  const unit = Math.min(W, H) * 0.5;
  const sx = W * 0.5 + p[0] * scale * unit / FOCAL * FOCAL / unit * unit / FOCAL;
  // Final clean formula:
  const screenScale = unit * scale / FOCAL * FOCAL / unit; // = scale
  const x2d = W * 0.5 + p[0] * scale * unit / FOCAL * FOCAL / unit * unit / FOCAL;
  // Just use the straightforward version:
  const k = unit / FOCAL;
  const X = W * 0.5 + p[0] * scale * k;
  const Y = H * 0.5 - p[1] * scale * k;
  return { x: X, y: Y, z: zc, scale: scale };
}

/* ============================================================
 * Lighting
 * ============================================================ */
const AMBIENT = 0.15;
const DIFFUSE = 0.85;

// Light position animates over time (view space).
function lightPosition(t) {
  const r = 3.5;
  const x = Math.cos(t * 0.9) * r;
  const y = Math.sin(t * 1.3) * r * 0.7;
  const z = 2.5 + Math.sin(t * 0.5) * 1.5;
  return [x, y, z];
}

/* ============================================================
 * Rasterizer state
 * ============================================================ */
let imageData = null;
let pixels = null;   // Uint32Array view (ABGR little-endian)
let zbuffer = null;

// Pack r,g,b (0..255) into ABGR little-endian uint32 (alpha = 255).
function packColor(r, g, b) {
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

/* ============================================================
 * Triangle rasterizer with Gouraud shading + z-buffer
 * ============================================================ */
function rasterizeTriangle(
  x0, y0, z0, r0, g0, b0,
  x1, y1, z1, r1, g1, b1,
  x2, y2, z2, r2, g2, b2
) {
  // Bounding box
  let minX = Math.floor(Math.min(x0, x1, x2));
  let maxX = Math.ceil(Math.max(x0, x1, x2));
  let minY = Math.floor(Math.min(y0, y1, y2));
  let maxY = Math.ceil(Math.max(y0, y1, y2));

  // Clip to canvas
  if (minX < 0) minX = 0;
  if (minY < 0) minY = 0;
  if (maxX > canvas.width - 1) maxX = canvas.width - 1;
  if (maxY > canvas.height - 1) maxY = canvas.height - 1;
  if (minX > maxX || minY > maxY) return;

  // Edge function / signed area
  const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
  if (Math.abs(area) < 1e-9) return; // degenerate
  const invArea = 1 / area;

  const EPS = -1e-6;

  for (let py = minY; py <= maxY; py++) {
    const yc = py + 0.5;
    for (let px = minX; px <= maxX; px++) {
      const xc = px + 0.5;

      // Barycentric coordinates via edge functions
      const w0 = ((x1 - xc) * (y2 - yc) - (x2 - xc) * (y1 - yc)) * invArea;
      const w1 = ((x2 - xc) * (y0 - yc) - (x0 - xc) * (y2 - yc)) * invArea;
      const w2 = 1 - w0 - w1;

      if (w0 < EPS || w1 < EPS || w2 < EPS) continue;

      // Interpolate depth (view-space z)
      const z = w0 * z0 + w1 * z1 + w2 * z2;

      const idx = py * canvas.width + px;
      if (z >= zbuffer[idx]) continue; // farther than existing
      zbuffer[idx] = z;

      // Interpolate color
      let r = w0 * r0 + w1 * r1 + w2 * r2;
      let g = w0 * g0 + w1 * g1 + w2 * g2;
      let b = w0 * b0 + w1 * b1 + w2 * b2;

      if (r < 0) r = 0; else if (r > 255) r = 255;
      if (g < 0) g = 0; else if (g > 255) g = 255;
      if (b < 0) b = 0; else if (b > 255) b = 255;

      pixels[idx] = packColor(r | 0, g | 0, b | 0);
    }
  }
}

/* ============================================================
 * State
 * ============================================================ */
let paused = false;
let wireframe = false;
let rotAngleX = 0;
let rotAngleY = 0;
let rotAngleZ = 0;
let lightTime = 0;
let lastTime = performance.now();

// FPS tracking
let fps = 0;
let frameCount = 0;
let fpsAccum = 0;
let fpsTimer = 0;

/* ============================================================
 * Render
 * ============================================================ */
function render(dt) {
  const cw = canvas.width;
  const ch = canvas.height;

  // Clear image buffer to background color #0b0e14
  const bg = packColor(0x0b, 0x0e, 0x14);
  pixels.fill(bg);

  // Clear z-buffer
  zbuffer.fill(Infinity);

  // Compose rotation matrix
  const m = mat3Mul(mat3Mul(rotY(rotAngleY), rotX(rotAngleX)), rotZ(rotAngleZ));

  // Transform vertices to view space
  const viewVerts = CUBE_VERTS.map(v => mat3Apply(m, v));

  // Light position in view space
  const light = lightPosition(lightTime);

  // Camera position in view space
  const camPos = [0, 0, CAM_DIST];

  // Project all vertices
  const proj = viewVerts.map(p => projectPoint(p));

  // Collect visible triangles
  const triangles = [];

  for (const face of CUBE_FACES) {
    const [i0, i1, i2, i3] = face.idx;
    const v0 = viewVerts[i0], v1 = viewVerts[i1], v2 = viewVerts[i2], v3 = viewVerts[i3];

    // Face normal (world/view space) from two edges
    const e1 = sub(v1, v0);
    const e2 = sub(v2, v0);
    let normal = normalize(cross(e1, e2));

    // Centroid
    const centroid = [
      (v0[0] + v1[0] + v2[0] + v3[0]) * 0.25,
      (v0[1] + v1[1] + v2[1] + v3[1]) * 0.25,
      (v0[2] + v1[2] + v2[2] + v3[2]) * 0.25
    ];

    // View direction from face toward camera
    const viewDir = normalize(sub(camPos, centroid));

    // Backface culling
    if (dot(normal, viewDir) <= 0) continue;

    // Ensure normal points toward camera for lighting
    if (dot(normal, viewDir) < 0) normal = [-normal[0], -normal[1], -normal[2]];

    // Per-vertex lighting (Lambert)
    const base = face.color;
    const vertColors = [v0, v1, v2, v3].map(v => {
      const toLight = normalize(sub(light, v));
      let intensity = dot(normal, toLight);
      if (intensity < 0) intensity = 0;
      const shade = AMBIENT + DIFFUSE * intensity;
      return [
        Math.min(255, base[0] * shade),
        Math.min(255, base[1] * shade),
        Math.min(255, base[2] * shade)
      ];
    });

    // Projected points
    const p0 = proj[i0], p1 = proj[i1], p2 = proj[i2], p3 = proj[i3];
    if (!p0 || !p1 || !p2 || !p3) continue;

    // Off-screen cull: if all points outside, skip
    const allLeft = p0.x < 0 && p1.x < 0 && p2.x < 0 && p3.x < 0;
    const allRight = p0.x > cw && p1.x > cw && p2.x > cw && p3.x > cw;
    const allTop = p0.y < 0 && p1.y < 0 && p2.y < 0 && p3.y < 0;
    const allBottom = p0.y > ch && p1.y > ch && p2.y > ch && p3.y > ch;
    if (allLeft || allRight || allTop || allBottom) continue;

    // Split quad into two triangles
    triangles.push({
      pts: [p0, p1, p2],
      cols: [vertColors[0], vertColors[1], vertColors[2]]
    });
    triangles.push({
      pts: [p0, p2, p3],
      cols: [vertColors[0], vertColors[2], vertColors[3]]
    });
  }

  // Sort triangles by average depth (far to near) for better z-buffer behavior
  triangles.sort((a, b) => {
    const za = (a.pts[0].z + a.pts[1].z + a.pts[2].z) / 3;
    const zb = (b.pts[0].z + b.pts[1].z + b.pts[2].z) / 3;
    return zb - za;
  });

  // Rasterize
  for (const tri of triangles) {
    const [p0, p1, p2] = tri.pts;
    const [c0, c1, c2] = tri.cols;
    rasterizeTriangle(
      p0.x, p0.y, p0.z, c0[0], c0[1], c0[2],
      p1.x, p1.y, p1.z, c1[0], c1[1], c1[2],
      p2.x, p2.y, p2.z, c2[0], c2[1], c2[2]
    );
  }

  // Blit
  ctx.putImageData(imageData, 0, 0);

  // Wireframe overlay
  if (wireframe) {
    ctx.strokeStyle = "rgba(230, 237, 243, 0.55)";
    ctx.lineWidth = 1;
    for (const face of CUBE_FACES) {
      const [i0, i1, i2, i3] = face.idx;
      const p0 = proj[i0], p1 = proj[i1], p2 = proj[i2], p3 = proj[i3];
      if (!p0 || !p1 || !p2 || !p3) continue;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.stroke();
    }
  }

  // HUD
  const lightStr = `(${light[0].toFixed(1)}, ${light[1].toFixed(1)}, ${light[2].toFixed(1)})`;
  hud.innerHTML =
    `FPS: <span class="val">${fps.toFixed(0)}</span>\n` +
    `Wireframe: <span class="val">${wireframe ? "ON" : "OFF"}</span>\n` +
    `State: <span class="${paused ? "warn" : "val"}">${paused ? "PAUSED" : "RUNNING"}</span>\n` +
    `Light: <span class="val">${lightStr}</span>`;
}

/* ============================================================
 * Animation loop
 * ============================================================ */
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (!paused) {
    rotAngleX += dt * 0.7;
    rotAngleY += dt * 1.1;
    rotAngleZ += dt * 0.3;
    lightTime += dt;
  }

  render(dt);

  // FPS: rolling average over ~500ms
  frameCount++;
  fpsAccum += dt;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fps = frameCount / fpsAccum;
    frameCount = 0;
    fpsAccum = 0;
    fpsTimer = 0;
  }

  requestAnimationFrame(loop);
}

/* ============================================================
 * Input
 * ============================================================ */
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "w") {
    wireframe = !wireframe;
    e.preventDefault();
  } else if (k === "p") {
    paused = !paused;
    e.preventDefault();
  }
});

/* ============================================================
 * Boot
 * ============================================================ */
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
