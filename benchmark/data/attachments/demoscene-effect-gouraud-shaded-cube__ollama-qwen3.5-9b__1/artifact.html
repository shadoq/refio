<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gouraud-Shaded Rotating Cube</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; color: #eee; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; font-size: 13px; pointer-events: none; }
    .key { color: #ff79c6; font-weight: bold; }
  </style>
</head>
<body>
<div class="overlay">
  <div><span class="key">W</span>: toggle wireframe | <span class="key">P</span>: pause/resume</div>
  <div id="fpsDisplay" style="margin-top:4px;">FPS: --</div>
</div>

<canvas id="glc"></canvas>
