<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }

        /* dat.gui overrides for neon theme */
        .dg.ac {
            z-index: 1000 !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 11px !important;
        }
        .dg .cr.function .property-name {
            color: #ffd400 !important;
        }
        .dg .cr.function:hover .property-name {
            color: #fff36a !important;
        }
        .dg .cr.number input[type="text"] {
            color: #00e5ff !important;
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid #101a3a !important;
        }
        .dg .cr.color .picker {
            border: 1px solid #101a3a !important;
        }
        .dg .cr.color .swatch {
            border: 1px solid #101a3a !important;
        }
        .dg .close-button {
            color: #ff2bd6 !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<canvas id="neuralCanvas" width="800" height="800"></canvas>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // Palette
    const COLORS = {
        bg: '#05070f',
        bgGlow: '#101a3a',
        branch: '#00e5ff',
        accent: '#d6ff00',
        synapse: '#ff2bd6',
        pulse: '#fff36a',
        ui: '#ffd400'
    };

    // Simulation State
    let neurons = [];
    let synapses = [];
    let pulses = [];
    let isPaused = false;
    let animationId;

    // Parameters
    const params = {
        // Growth
        neuronCount: 4,
        growthSpeed: 2,
        maxDepth: 12,
        splitChance: 0.05,
        curvature: 0.5,
        maxBranchLength: 150,
        
        // Synapses
        synapseThreshold: 40,
        synapseGlow: 10,
        
        // Pulses
        pulseSpeed: 3,
        pulseFrequency: 0.005,
        pulseBrightness: 1.5,
        
        // Visuals
        bgColor: COLORS.bg,
        branchColor: COLORS.branch,
        accentColor: COLORS.accent,
        synapseColor: COLORS.synapse,
        pulseColor: COLORS.pulse,
        
        // Actions
        regenerate: () => initSimulation(),
        clear: () => {
            neurons = [];
            synapses = [];
            pulses = [];
            ctx.clearRect(0, 0, width, height);
        },
        pauseResume: () => {
            isPaused = !isPaused;
            if (!isPaused) animate();
        }
    };

    // --- Classes ---

    class Neuron {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.branches = [];
            this.growthProgress = 0;
            this.isDead = false;
            this.generateBranches();
        }

        generateBranches() {
            // Create a root branch
            const angle = Math.random() * Math.PI * 2;
            this.branches.push(new Branch(this.x, this.y, angle, params.maxDepth, 0));
        }

        update() {
            let allDead = true;
            this.branches.forEach(branch => {
                if (!branch.isDead) {
                    branch.update();
                    allDead = false;
                }
            });
            if (allDead) this.isDead = true;
        }

        draw(ctx) {
            this.branches.forEach(branch => branch.draw(ctx));
        }
    }

    class Branch {
        constructor(x, y, angle, depth, thickness) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.depth = depth;
            this.thickness = thickness;
            this.maxLen = params.maxBranchLength * (depth / params.maxDepth);
            this.currentLen = 0;
            this.isDead = false;
            this.points = [{x, y}];
            this.children = [];
            
            // Randomize thickness slightly
            this.thickness = Math.max(0.5, this.thickness * (0.8 + Math.random() * 0.4));
        }

        update() {
            if (this.isDead) return;

            // Grow
            this.currentLen += params.growthSpeed;
            
            // Calculate next point based on angle and curvature
            const nextX = this.x + Math.cos(this.angle) * params.growthSpeed;
            const nextY = this.y + Math.sin(this.angle) * params.growthSpeed;

            // Add slight random curvature
            const curvature = (Math.random() - 0.5) * params.curvature;
            this.angle += curvature;

            this.points.push({x: nextX, y: nextY});
            this.x = nextX;
            this.y = nextY;

            // Check if branch should die (max length or depth)
            if (this.currentLen >= this.maxLen || this.depth <= 0) {
                this.isDead = true;
                return;
            }

            // Chance to split
            if (Math.random() < params.splitChance) {
                const splitAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 4 + Math.random() * 0.5);
                const newThickness = this.thickness * 0.7;
                const child = new Branch(this.x, this.y, splitAngle, this.depth - 1, newThickness);
                this.children.push(child);
            }
        }

        draw(ctx) {
            if (this.points.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            
            // Draw smooth curve through points
            for (let i = 1; i < this.points.length - 1; i++) {
                const xc = (this.points[i].x + this.points[i + 1].x) / 2;
                const yc = (this.points[i].y + this.points[i + 1].y) / 2;
                ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
            }
            // Connect last point
            if (this.points.length > 1) {
                const last = this.points[this.points.length - 1];
                ctx.lineTo(last.x, last.y);
            }

            ctx.strokeStyle = this.depth < 3 ? params.accentColor : params.branchColor;
            ctx.lineWidth = this.thickness;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset for performance

            // Draw children
            this.children.forEach(child => child.draw(ctx));
        }

        getTip() {
            const last = this.points[this.points.length - 1];
            return { x: last.x, y: last.y };
        }
    }

    class Synapse {
        constructor(neuronA, neuronB, tipA, tipB) {
            this.neuronA = neuronA;
            this.neuronB = neuronB;
            this.tipA = tipA;
            this.tipB = tipB;
            this.age = 0;
            this.pulsePhase = Math.random() * Math.PI * 2;
        }

        update() {
            // Update tips to follow growing branches
            this.tipA = this.neuronA.branches[0].getTip(); // Simplified: connect to first branch tip
            this.tipB = this.neuronB.branches[0].getTip();
            this.age++;
        }

        draw(ctx) {
            const glow = Math.sin(this.age * 0.05 + this.pulsePhase) * 5 + params.synapseGlow;
            
            ctx.beginPath();
            ctx.moveTo(this.tipA.x, this.tipA.y);
            ctx.lineTo(this.tipB.x, this.tipB.y);
            
            ctx.strokeStyle = params.synapseColor;
            ctx.lineWidth = 1;
            ctx.shadowBlur = glow;
            ctx.shadowColor = params.synapseColor;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw node dots
            ctx.fillStyle = params.synapseColor;
            ctx.beginPath();
            ctx.arc(this.tipA.x, this.tipA.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.tipB.x, this.tipB.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * 0.01;
            this.direction = Math.random() > 0.5 ? 1 : -1;
            this.active = true;
        }

        update() {
            this.progress += this.speed * this.direction;
            if (this.progress >= 1 || this.progress <= 0) {
                this.active = false;
            }
        }

        draw(ctx) {
            const x = this.synapse.tipA.x + (this.synapse.tipB.x - this.synapse.tipA.x) * this.progress;
            const y = this.synapse.tipA.y + (this.synapse.tipB.y - this.synapse.tipA.y) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 3 * params.pulseBrightness, 0, Math.PI * 2);
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = params.pulseColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // --- Simulation Logic ---

    function initSimulation() {
        neurons = [];
        synapses = [];
        pulses = [];
        
        const centerX = width / 2;
        const centerY = height / 2;
        const spread = 100;

        for (let i = 0; i < params.neuronCount; i++) {
            const x = centerX + (Math.random() - 0.5) * spread;
            const y = centerY + (Math.random() - 0.5) * spread;
            neurons.push(new Neuron(x, y));
        }
    }

    function checkSynapses() {
        // Check tips of all neurons against each other
        // Simplified: Check first branch tip of each neuron for performance
        for (let i = 0; i < neurons.length; i++) {
            for (let j = i + 1; j < neurons.length; j++) {
                const tipA = neurons[i].branches[0].getTip();
                const tipB = neurons[j].branches[0].getTip();
                
                const dx = tipA.x - tipB.x;
                const dy = tipA.y - tipB.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < params.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.neuronA === neurons[i] && s.neuronB === neurons[j]) ||
                        (s.neuronA === neurons[j] && s.neuronB === neurons[i])
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(neurons[i], neurons[j], tipA, tipB));
                    }
                }
            }
        }
    }

    function spawnPulses() {
        if (Math.random() < params.pulseFrequency) {
            if (synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse));
            }
        }
    }

    // --- Rendering ---

    function drawBackground() {
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Vignette
        const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Scanlines
        ctx.fillStyle = 'rgba(0, 229, 255, 0.03)';
        for (let i = 0; i < height; i += 4) {
            ctx.fillRect(0, i, width, 1);
        }
    }

    function animate() {
        if (isPaused) return;

        drawBackground();

        // Update and draw neurons
        neurons.forEach(neuron => {
            neuron.update();
            neuron.draw(ctx);
        });

        // Check for new synapses periodically
        if (Math.random() < 0.1) {
            checkSynapses();
        }

        // Update and draw synapses
        synapses.forEach(synapse => {
            synapse.update();
            synapse.draw(ctx);
        });

        // Update and draw pulses
        spawnPulses();
        pulses = pulses.filter(p => p.active);
        pulses.forEach(pulse => {
            pulse.update();
            pulse.draw(ctx);
        });

        animationId = requestAnimationFrame(animate);
    }

    // --- Initialization ---

    // Setup dat.gui
    const gui = new dat.GUI();
    
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
    growthFolder.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
    growthFolder.add(params, 'maxDepth', 5, 20, 1).name('Max Depth');
    growthFolder.add(params, 'splitChance', 0.01, 0.2, 0.01).name('Split Chance');
    growthFolder.add(params, 'curvature', 0.1, 2.0, 0.1).name('Curvature');
    growthFolder.add(params, 'maxBranchLength', 50, 300, 10).name('Max Length');
    growthFolder.open();

    const synapseFolder = gui.addFolder('Synapses');
    synapseFolder.add(params, 'synapseThreshold', 10, 100, 1).name('Distance Threshold');
    synapseFolder.add(params, 'synapseGlow', 0, 30, 1).name('Glow Strength');
    synapseFolder.open();

    const pulseFolder = gui.addFolder('Pulses');
    pulseFolder.add(params, 'pulseSpeed', 1, 10, 0.1).name('Speed');
    pulseFolder.add(params, 'pulseFrequency', 0.001, 0.05, 0.001).name('Frequency');
    pulseFolder.add(params, 'pulseBrightness', 0.5, 3, 0.1).name('Brightness');
    pulseFolder.open();

    const visualFolder = gui.addFolder('Visuals');
    visualFolder.addColor(params, 'bgColor').name('Background Color');
    visualFolder.addColor(params, 'branchColor').name('Branch Color');
    visualFolder.addColor(params, 'accentColor').name('Accent Color');
    visualFolder.addColor(params, 'synapseColor').name('Synapse Color');
    visualFolder.addColor(params, 'pulseColor').name('Pulse Color');
    visualFolder.open();

    const actionsFolder = gui.addFolder('Actions');
    actionsFolder.add(params, 'regenerate').name('Regenerate Network');
    actionsFolder.add(params, 'clear').name('Clear Canvas');
    actionsFolder.add(params, 'pauseResume').name('Pause/Resume');
    actionsFolder.open();

    // Start
    initSimulation();
    animate();

</script>
</body>
</html>
