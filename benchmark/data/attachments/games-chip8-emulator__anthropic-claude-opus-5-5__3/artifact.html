<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CHIP-8 Emulator</title>
<style>
body{background:#1b1d23;color:#ddd;font-family:system-ui,sans-serif;margin:0;padding:16px}
h1{margin:0 0 10px;font-size:20px}
.wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
canvas{background:#000;image-rendering:pixelated;border:2px solid #444;width:640px;height:320px;display:block}
.bar{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#333a48;color:#eee;border:1px solid #556;padding:6px 12px;border-radius:4px;cursor:pointer}
button:hover{background:#445}button:disabled{opacity:.4;cursor:default}
.pad{display:grid;grid-template-columns:repeat(4,52px);gap:6px}
.key{height:46px;background:#2a2f3a;border:1px solid #556;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.key b{font-size:18px}.key small{color:#999;font-size:11px}
.key.down{background:#6a8;color:#000}.key.down small{color:#222}
.panel{background:#23262e;border:1px solid #444;border-radius:6px;padding:10px;font-family:monospace;font-size:13px;min-width:260px}
.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 10px}
.cur{color:#fd6;margin-top:8px}#status{color:#8c8}
</style></head><body>
<h1>CHIP-8 Emulator</h1>
<div class="wrap">
<div>
<canvas id="screen" width="64" height="32"></canvas>
<div class="bar">
<button id="run">Run</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button>
<button id="demo">Load Demo</button>
<label>Load ROM <input type="file" id="file" accept=".ch8,.c8,.rom,*/*"></label>
</div>
<div class="bar"><label>Instructions / frame: <input type="range" id="speed" min="1" max="50" value="10"> <span id="speedv">10</span></label>
<span id="status"></span></div>
<p style="font-size:13px;color:#aaa">Demo: move the sprite with W/A/S/D (CHIP-8 keys 5/7/8/9).</p>
</div>
<div>
<div class="pad" id="pad"></div>
<div class="panel" style="margin-top:12px" id="dbg"></div>
</div>
</div>
<script>
"use strict";
const FONT=[0xF0,0x90,0x90,0x90,0xF0,0x20,0x60,0x20,0x20,0x70,0xF0,0x10,0xF0,0x80,0xF0,0xF0,0x10,0xF0,0x10,0xF0,
0x90,0x90,0xF0,0x10,0x10,0xF0,0x80,0xF0,0x10,0xF0,0xF0,0x80,0xF0,0x90,0xF0,0xF0,0x10,0x20,0x40,0x40,
0xF0,0x90,0xF0,0x90,0xF0,0xF0,0x90,0xF0,0x10,0xF0,0xF0,0x90,0xF0,0x90,0x90,0xE0,0x90,0xE0,0x90,0xE0,
0xF0,0x80,0x80,0x80,0xF0,0xE0,0x90,0x90,0x90,0xE0,0xF0,0x80,0xF0,0x80,0xF0,0xF0,0x80,0xF0,0x80,0x80];
const FONT_ADDR=0x050;
/* Demo ROM (hand assembled):
200 6020 LD V0,32      202 610C LD V1,12     204 A238 LD I,sprite   206 D015 DRW V0,V1,5
208 D015 DRW (erase)   20A 6205 LD V2,5      20C E2A1 SKNP V2       20E 71FF ADD V1,-1 (up)
210 6208 LD V2,8       212 E2A1 SKNP V2      214 7101 ADD V1,1      216 6207 LD V2,7
218 E2A1 SKNP V2       21A 70FF ADD V0,-1    21C 6209 LD V2,9       21E E2A1 SKNP V2
220 7001 ADD V0,1      222 633F LD V3,63     224 8032 AND V0,V3     226 631F LD V3,31
228 8132 AND V1,V3     22A D015 DRW          22C 6403 LD V4,3       22E F415 LD DT,V4
230 F407 LD V4,DT      232 3400 SE V4,0      234 1230 JP 230        236 1208 JP 208
238 sprite 3C 7E DB FF 66 */
const DEMO=[0x60,0x20,0x61,0x0C,0xA2,0x38,0xD0,0x15,0xD0,0x15,0x62,0x05,0xE2,0xA1,0x71,0xFF,
0x62,0x08,0xE2,0xA1,0x71,0x01,0x62,0x07,0xE2,0xA1,0x70,0xFF,0x62,0x09,0xE2,0xA1,
0x70,0x01,0x63,0x3F,0x80,0x32,0x63,0x1F,0x81,0x32,0xD0,0x15,0x64,0x03,0xF4,0x15,
0xF4,0x07,0x34,0x00,0x12,0x30,0x12,0x08,0x3C,0x7E,0xDB,0xFF,0x66];

const C={mem:new Uint8Array(4096),V:new Uint8Array(16),I:0,pc:0x200,stack:[],dt:0,st:0,
 disp:new Uint8Array(64*32),keys:new Array(16).fill(false),waitKey:-1,rom:DEMO,dirty:true};
function reset(){
 C.mem.fill(0);C.mem.set(FONT,FONT_ADDR);C.mem.set(C.rom.slice(0,4096-0x200),0x200);
 C.V.fill(0);C.I=0;C.pc=0x200;C.stack=[];C.dt=0;C.st=0;C.disp.fill(0);C.waitKey=-1;C.dirty=true;
}
function hex(n,w){return n.toString(16).toUpperCase().padStart(w,"0")}
function disasm(op){
 const x=(op>>8)&15,y=(op>>4)&15,n=op&15,nn=op&255,nnn=op&4095,X="V"+hex(x,1),Y="V"+hex(y,1);
 switch(op>>12){
 case 0:return op===0x00E0?"CLS":op===0x00EE?"RET":"SYS "+hex(nnn,3);
 case 1:return "JP "+hex(nnn,3);case 2:return "CALL "+hex(nnn,3);
 case 3:return `SE ${X}, ${hex(nn,2)}`;case 4:return `SNE ${X}, ${hex(nn,2)}`;
 case 5:return `SE ${X}, ${Y}`;case 6:return `LD ${X}, ${hex(nn,2)}`;case 7:return `ADD ${X}, ${hex(nn,2)}`;
 case 8:return ({0:"LD",1:"OR",2:"AND",3:"XOR",4:"ADD",5:"SUB",6:"SHR",7:"SUBN",14:"SHL"}[n]||"???")+` ${X}, ${Y}`;
 case 9:return `SNE ${X}, ${Y}`;case 10:return "LD I, "+hex(nnn,3);case 11:return "JP V0, "+hex(nnn,3);
 case 12:return `RND ${X}, ${hex(nn,2)}`;case 13:return `DRW ${X}, ${Y}, ${n}`;
 case 14:return nn===0x9E?"SKP "+X:nn===0xA1?"SKNP "+X:"???";
 case 15:return ({7:`LD ${X}, DT`,0x0A:`LD ${X}, K`,0x15:`LD DT, ${X}`,0x18:`LD ST, ${X}`,0x1E:`ADD I, ${X}`,
  0x29:`LD F, ${X}`,0x33:`LD B, ${X}`,0x55:`LD [I], ${X}`,0x65:`LD ${X}, [I]`}[nn]||"???");
 }}
function step(){
 if(C.waitKey>=0)return;
 const m=C.mem,V=C.V,op=(m[C.pc&4095]<<8)|m[(C.pc+1)&4095];C.pc=(C.pc+2)&4095;
 const x=(op>>8)&15,y=(op>>4)&15,n=op&15,nn=op&255,nnn=op&4095;let f;
 switch(op>>12){
 case 0:if(op===0x00E0){C.disp.fill(0);C.dirty=true}else if(op===0x00EE){if(!C.stack.length)throw"Stack underflow";C.pc=C.stack.pop()}break; // 0NNN ignored
 case 1:C.pc=nnn;break;
 case 2:if(C.stack.length>=16)throw"Stack overflow";C.stack.push(C.pc);C.pc=nnn;break;
 case 3:if(V[x]===nn)C.pc+=2;break;case 4:if(V[x]!==nn)C.pc+=2;break;
 case 5:if(V[x]===V[y])C.pc+=2;break;case 6:V[x]=nn;break;case 7:V[x]=(V[x]+nn)&255;break;
 case 8:switch(n){
  case 0:V[x]=V[y];break;case 1:V[x]|=V[y];break;case 2:V[x]&=V[y];break;case 3:V[x]^=V[y];break;
  case 4:f=V[x]+V[y]>255?1:0;V[x]=(V[x]+V[y])&255;V[15]=f;break;
  case 5:f=V[x]>=V[y]?1:0;V[x]=(V[x]-V[y])&255;V[15]=f;break;
  case 6:f=V[x]&1;V[x]=V[x]>>1;V[15]=f;break;
  case 7:f=V[y]>=V[x]?1:0;V[x]=(V[y]-V[x])&255;V[15]=f;break;
  case 14:f=(V[x]>>7)&1;V[x]=(V[x]<<1)&255;V[15]=f;break;
  default:throw"Unknown opcode "+hex(op,4);}break;
 case 9:if(V[x]!==V[y])C.pc+=2;break;case 10:C.I=nnn;break;
 case 11:C.pc=(nnn+V[0])&4095;break;case 12:V[x]=Math.floor(Math.random()*256)&nn;break;
 case 13:{const sx=V[x]&63,sy=V[y]&31;V[15]=0;
  for(let r=0;r<n;r++){const py=sy+r;if(py>31)break;const b=m[(C.I+r)&4095];
   for(let c=0;c<8;c++){const px=sx+c;if(px>63)break;if(b&(0x80>>c)){const i=py*64+px;if(C.disp[i])V[15]=1;C.disp[i]^=1;}}}
  C.dirty=true;break;}
 case 14:if(nn===0x9E){if(C.keys[V[x]&15])C.pc+=2}else if(nn===0xA1){if(!C.keys[V[x]&15])C.pc+=2}else throw"Unknown opcode "+hex(op,4);break;
 case 15:switch(nn){
  case 0x07:V[x]=C.dt;break;case 0x0A:C.waitKey=x;break;case 0x15:C.dt=V[x];break;case 0x18:C.st=V[x];break;
  case 0x1E:C.I=(C.I+V[x])&0xFFFF;break;case 0x29:C.I=FONT_ADDR+(V[x]&15)*5;break;
  case 0x33:m[C.I&4095]=Math.floor(V[x]/100);m[(C.I+1)&4095]=Math.floor(V[x]/10)%10;m[(C.I+2)&4095]=V[x]%10;break;
  case 0x55:for(let i=0;i<=x;i++)m[(C.I+i)&4095]=V[i];break;
  case 0x65:for(let i=0;i<=x;i++)V[i]=m[(C.I+i)&4095];break;
  default:throw"Unknown opcode "+hex(op,4);}break;
 }}
// ---- UI ----
const cv=document.getElementById("screen"),ctx=cv.getContext("2d"),img=ctx.createImageData(64,32);
function draw(){if(!C.dirty)return;C.dirty=false;for(let i=0;i<2048;i++){const o=i*4,on=C.disp[i];
 img.data[o]=on?0x66:0x10;img.data[o+1]=on?0xFF:0x14;img.data[o+2]=on?0x99:0x10;img.data[o+3]=255}ctx.putImageData(img,0,0)}
const dbg=document.getElementById("dbg"),st=document.getElementById("status");
function updDbg(){let h='<div class="regs">';for(let i=0;i<16;i++)h+=`<span>V${hex(i,1)}=${hex(C.V[i],2)}</span>`;
 const op=(C.mem[C.pc&4095]<<8)|C.mem[(C.pc+1)&4095];
 h+=`</div><div>I=${hex(C.I,4)}  PC=${hex(C.pc,4)}</div><div>DT=${hex(C.dt,2)}  ST=${hex(C.st,2)}</div>`+
 `<div>Stack(${C.stack.length}): ${C.stack.map(a=>hex(a,3)).join(" ")||"-"}</div>`+
 `<div class="cur">${hex(C.pc,3)}: ${hex(op,4)}  ${disasm(op)}${C.waitKey>=0?" (waiting for key)":""}</div>`;dbg.innerHTML=h}
let running=false,ipf=10;
const AC=window.AudioContext||window.webkitAudioContext;let actx=null,osc=null;
function sound(on){try{if(on&&!osc){actx=actx||new AC();osc=actx.createOscillator();const g=actx.createGain();g.gain.value=0.05;
 osc.type="square";osc.frequency.value=440;osc.connect(g).connect(actx.destination);osc.start()}else if(!on&&osc){osc.stop();osc=null}}catch(e){}}
function setRun(r){running=r;document.getElementById("run").disabled=r;document.getElementById("pause").disabled=!r;
 document.getElementById("step").disabled=r;st.textContent=r?"Running":"Paused";if(!r)sound(false)}
function fail(e){setRun(false);st.textContent="Error: "+e;}
let last=performance.now(),acc=0;
function frame(t){acc+=t-last;last=t;if(acc>200)acc=200;
 while(acc>=1000/60){acc-=1000/60;if(running){try{for(let i=0;i<ipf&&C.waitKey<0;i++)step()}catch(e){fail(e)}
  if(C.dt>0)C.dt--;if(C.st>0)C.st--;}}
 if(running)sound(C.st>0);draw();updDbg();requestAnimationFrame(frame)}
document.getElementById("run").onclick=()=>setRun(true);
document.getElementById("pause").onclick=()=>setRun(false);
document.getElementById("step").onclick=()=>{try{step()}catch(e){fail(e)}};
document.getElementById("reset").onclick=()=>{reset()};
document.getElementById("demo").onclick=()=>{C.rom=DEMO;reset();setRun(true)};
const sp=document.getElementById("speed");sp.oninput=()=>{ipf=+sp.value;document.getElementById("speedv").textContent=ipf};
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>{
 C.rom=new Uint8Array(b);reset();setRun(true);st.textContent="Running "+f.name;e.target.blur()})};
// keypad
const LAYOUT=[[1,"1"],[2,"2"],[3,"3"],[12,"4"],[4,"Q"],[5,"W"],[6,"E"],[13,"R"],[7,"A"],[8,"S"],[9,"D"],[14,"F"],[10,"Z"],[0,"X"],[11,"C"],[15,"V"]];
const keyMap={},els=[],pad=document.getElementById("pad");
LAYOUT.forEach(([k,kb])=>{keyMap[kb.toLowerCase()]=k;const d=document.createElement("div");d.className="key";
 d.innerHTML=`<b>${hex(k,1)}</b><small>${kb}</small>`;els[k]=d;pad.appendChild(d);
 d.addEventListener("pointerdown",e=>{e.preventDefault();d.setPointerCapture(e.pointerId);setKey(k,true)});
 ["pointerup","pointercancel"].forEach(ev=>d.addEventListener(ev,()=>setKey(k,false)))});
function setKey(k,down){if(C.keys[k]===down)return;C.keys[k]=down;els[k].classList.toggle("down",down);
 if(!down&&C.waitKey>=0){C.V[C.waitKey]=k;C.waitKey=-1}} // FX0A completes on release
addEventListener("keydown",e=>{const k=keyMap[e.key.toLowerCase()];if(k!==undefined){e.preventDefault();setKey(k,true)}});
addEventListener("keyup",e=>{const k=keyMap[e.key.toLowerCase()];if(k!==undefined){e.preventDefault();setKey(k,false)}});
addEventListener("blur",()=>{for(let k=0;k<16;k++)setKey(k,false)});
reset();setRun(true);requestAnimationFrame(frame);
</script></body></html>
