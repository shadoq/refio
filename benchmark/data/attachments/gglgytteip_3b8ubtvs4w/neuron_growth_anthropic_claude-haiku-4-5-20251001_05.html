<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #05070f 0%, #101a3a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 800px;
            height: 800px;
            background: #05070f;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.3), inset 0 0 40px rgba(0, 229, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #05070f;
        }

        .dg.ac {
            z-index: 100;
            font-family: 'Courier New', monospace;
        }

        .dg .dg-title {
            background: linear-gradient(90deg, #00e5ff, #d6ff00);
            color: #05070f;
            text-shadow: none;
            font-weight: bold;
        }

        .dg .folder {
            border-left: 2px solid #00e5ff;
        }

        .dg .folder > .title {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .dg .folder > .title:hover {
            background: rgba(0, 229, 255, 0.2);
        }

        .dg li:not(.folder) {
            border-left: 1px solid rgba(0, 229, 255, 0.2);
            padding-left: 5px;
        }

        .dg .property-name {
            color: #ffd400;
            text-shadow: 0 0 5px rgba(255, 212, 0, 0.3);
        }

        .dg input[type="text"],
        .dg input[type="number"],
        .dg select {
            background: rgba(5, 7, 15, 0.8);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }

        .dg input[type="text"]:focus,
        .dg input[type="number"]:focus,
        .dg select:focus {
            background: rgba(5, 7, 15, 0.9);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .dg button {
            background: linear-gradient(90deg, #00e5ff, #d6ff00);
            color: #05070f;
            border: 1px solid #ffd400;
            font-weight: bold;
            text-shadow: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dg button:hover {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 10px rgba(214, 255, 0, 0.4);
            transform: scale(1.05);
        }

        .dg button:active {
            transform: scale(0.98);
        }

        .dg .cr.number input[type="slider"] {
            background: linear-gradient(90deg, #00e5ff, #d6ff00);
        }

        .dg .cr.number input[type="slider"]::-webkit-slider-thumb {
            background: #ffd400;
            box-shadow: 0 0 10px rgba(255, 212, 0, 0.8);
        }

        .dg .cr.number input[type="slider"]::-moz-range-thumb {
            background: #ffd400;
            box-shadow: 0 0 10px rgba(255, 212, 0, 0.8);
        }

        .dg .cr.color {
            background: rgba(5, 7, 15, 0.8);
        }

        .dg .cr.color input {
            border: 1px solid #00e5ff;
        }

        .dg .c input[type="color"] {
            width: 30px;
            height: 20px;
            border: 1px solid #00e5ff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" width="800" height="800"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuration object
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 8,
            branchSplitChance: 0.3,
            branchCurvature: 0.15,
            maxBranchLength: 80,

            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,

            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1,

            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',

            // State
            isAnimating: true
        };

        // Neural network data structures
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationFrame = 0;

        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
            }

            addBranch(branch) {
                this.branches.push(branch);
            }
        }

        class Branch {
            constructor(x, y, angle, depth, parentNeuron) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parentNeuron = parentNeuron;
                this.length = 0;
                this.maxLength = config.maxBranchLength + Math.random() * 20;
                this.thickness = Math.max(1, 3 - depth * 0.3);
                this.isGrowing = true;
                this.children = [];
                this.points = [{x: x, y: y}];
            }

            grow() {
                if (!this.isGrowing) return;

                const growthAmount = config.branchGrowthSpeed;
                const newLength = this.length + growthAmount;

                if (newLength > this.maxLength) {
                    this.isGrowing = false;
                    return;
                }

                // Apply curvature
                this.angle += (Math.random() - 0.5) * config.branchCurvature;

                const newX = this.x + Math.cos(this.angle) * growthAmount;
                const newY = this.y + Math.sin(this.angle) * growthAmount;

                this.x = newX;
                this.y = newY;
                this.length = newLength;
                this.points.push({x: newX, y: newY});

                // Chance to split
                if (this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                    const splitAngle1 = this.angle + (Math.random() - 0.5) * Math.PI * 0.6;
                    const splitAngle2 = this.angle - (Math.random() - 0.5) * Math.PI * 0.6;

                    const child1 = new Branch(newX, newY, splitAngle1, this.depth + 1, this.parentNeuron);
                    const child2 = new Branch(newX, newY, splitAngle2, this.depth + 1, this.parentNeuron);

                    this.children.push(child1, child2);
                    branches.push(child1, child2);
                }
            }

            draw() {
                if (this.points.length < 2) return;

                const color = this.depth % 2 === 0 ? config.branchColor : config.accentBranchColor;

                ctx.strokeStyle = color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = this.thickness * 2;

                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);

                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }

                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            getTip() {
                return {x: this.x, y: this.y};
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x1 = branch1.x;
                this.y1 = branch1.y;
                this.x2 = branch2.x;
                this.y2 = branch2.y;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.distance = Math.hypot(this.x2 - this.x1, this.y2 - this.y1);
            }

            update() {
                this.x1 = this.branch1.x;
                this.y1 = this.branch1.y;
                this.x2 = this.branch2.x;
                this.y2 = this.branch2.y;
                this.distance = Math.hypot(this.x2 - this.x1, this.y2 - this.y1);
                this.pulsePhase += config.pulseSpeed * 0.05;
            }

            draw() {
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;

                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();

                // Draw synapse nodes
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength * 1.5;
                ctx.beginPath();
                ctx.arc(this.x1, this.y1, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x2, this.y2, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.progress += config.pulseSpeed * 0.02;
            }

            draw() {
                if (this.progress > 1) return;

                const x = this.synapse.x1 + (this.synapse.x2 - this.synapse.x1) * this.progress;
                const y = this.synapse.y1 + (this.synapse.y2 - this.synapse.y1) * this.progress;

                const brightness = Math.sin(this.progress * Math.PI) * config.pulseBrightness;
                ctx.fillStyle = config.pulseColor;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 20 * brightness;

                ctx.beginPath();
                ctx.arc(x, y, 4 * brightness, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            isAlive() {
                return this.progress <= 1;
            }
        }

        function initializeNetwork() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (i / config.neuronCount) * Math.PI * 2;
                const distance = 80;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;

                const neuron = new Neuron(x, y);
                neurons.push(neuron);

                // Create initial branches
                for (let j = 0; j < 2; j++) {
                    const branchAngle = Math.random() * Math.PI * 2;
                    const branch = new Branch(x, y, branchAngle, 0, neuron);
                    neuron.addBranch(branch);
                    branches.push(branch);
                }
            }
        }

        function updateNetwork() {
            // Grow branches
            for (let branch of branches) {
                branch.grow();
            }

            // Check for new synapses
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    if (b1.parentNeuron === b2.parentNeuron) continue;

                    const dist = Math.hypot(b2.x - b1.x, b2.y - b1.y);

                    if (dist < config.synapseDistanceThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s =>
                            (s.branch1 === b1 && s.branch2 === b2) ||
                            (s.branch1 === b2 && s.branch2 === b1)
                        );

                        if (!exists) {
                            const synapse = new Synapse(b1, b2);
                            synapses.push(synapse);

                            // Create pulses
                            if (Math.random() < config.pulseFrequency) {
                                pulses.push(new Pulse(synapse));
                            }
                        }
                    }
                }
            }

            // Update synapses
            for (let synapse of synapses) {
                synapse.update();
            }

            // Update and filter pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update();
                if (!pulses[i].isAlive()) {
                    pulses.splice(i, 1);
                }
            }

            // Create new pulses occasionally
            if (Math.random() < config.pulseFrequency && synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse));
            }
        }

        function draw() {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid effect
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw branches
            for (let branch of branches) {
                branch.draw();
            }

            // Draw synapses
            for (let synapse of synapses) {
                synapse.draw();
            }

            // Draw pulses
            for (let pulse of pulses) {
                pulse.draw();
            }

            // Draw neurons
            for (let neuron of neurons) {
                ctx.fillStyle = config.branchColor;
                ctx.shadowColor = config.branchColor;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            if (config.isAnimating) {
                updateNetwork();
            }

            draw();
            animationFrame++;
            requestAnimationFrame(animate);
        }

        function setupGUI() {
            const gui = new dat.GUI({width: 300});

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 1, 10, 1).onChange(() => initializeNetwork());
            growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5, 0.5);
            growthFolder.add(config, 'maxBranchDepth', 2, 15, 1);
            growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05);
            growthFolder.add(config, 'branchCurvature', 0, 0.5, 0.05);
            growthFolder.add(config, 'maxBranchLength', 20, 200, 10);
            growthFolder.open();

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 150, 5);
            synapsesFolder.add(config, 'synapseGlowStrength', 5, 50, 1);
            synapsesFolder.open();

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 0.5, 10, 0.5);
            pulsesFolder.add(config, 'pulseFrequency', 0, 0.1, 0.01);
            pulsesFolder.add(config, 'pulseBrightness', 0.1, 2, 0.1);
            pulsesFolder.open();

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor');
            visualsFolder.addColor(config, 'branchColor');
            visualsFolder.addColor(config, 'accentBranchColor');
            visualsFolder.addColor(config, 'synapseColor');
            visualsFolder.addColor(config, 'pulseColor');
            visualsFolder.open();

            // Controls folder
            const controlsFolder = gui.addFolder('Controls');
            controlsFolder.add({
                regenerate: () => initializeNetwork()
            }, 'regenerate');
            controlsFolder.add({
                clear: () => {
                    ctx.fillStyle = config.backgroundColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }, 'clear');
            controlsFolder.add(config, 'isAnimating').name('Animate');
            controlsFolder.open();
        }

        // Initialize
        initializeNetwork();
        setupGUI();
        animate();
    </script>
</body>
</html>
