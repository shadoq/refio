<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
        }
        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(16, 26, 58, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuronCanvas" width="800" height="800"></canvas>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // ============ CONFIGURATION & STATE ============
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationId = null;
        let isPaused = false;
        let growthComplete = false;

        // Default configuration
        const config = {
            // Growth settings
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 8,
            branchSplitChance: 0.15,
            branchCurvature: 0.3,
            maxBranchLength: 200,
            
            // Synapse settings
            synapseDistanceThreshold: 60,
            synapseGlowStrength: 25,
            
            // Pulse settings
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.0,
            
            // Visual settings
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Buttons
            regenerateNetwork: function() { initSimulation(); },
            clearCanvas: function() {
                synapses = [];
                pulses = [];
                growthComplete = false;
            },
            pauseResume: function() {
                isPaused = !isPaused;
                if (!isPaused && !animationId) {
                    animate();
                }
            }
        };

        // ============ NEURON & BRANCH CLASSES ============
        class Neuron {
            constructor(x, y, id) {
                this.x = x;
                this.y = y;
                this.id = id;
                this.growing = true;
                this.branches = [];
                this.tipPositions = [];
            }
        }

        class Branch {
            constructor(startX, startY, startAngle, depth, parentNeuron, isAccent = false) {
                this.startX = startX;
                this.startY = startY;
                this.x = startX;
                this.y = startY;
                this.angle = startAngle;
                this.depth = depth;
                this.length = 0;
                this.targetLength = Math.random() * 30 + 20;
                this.parentNeuron = parentNeuron;
                this.isAccent = isAccent;
                this.thickness = Math.max(0.5, 2 - depth * 0.15);
                this.curvature = (Math.random() - 0.5) * config.branchCurvature;
                this.growthDirection = 0;
                this.points = [{x: startX, y: startY}];
                this.maxPoints = 5;
                this.isGrowing = true;
            }

            update() {
                if (!this.isGrowing) return;

                this.length += config.branchGrowthSpeed;
                
                // Smooth angle changes for organic curves
                this.growthDirection += (Math.random() - 0.5) * 0.15;
                this.angle += this.growthDirection + this.curvature * 0.02;

                const newX = this.x + Math.cos(this.angle) * config.branchGrowthSpeed;
                const newY = this.y + Math.sin(this.angle) * config.branchGrowthSpeed;

                this.x = newX;
                this.y = newY;

                // Store points for quadratic curve drawing
                this.points.push({x: newX, y: newY});
                if (this.points.length > this.maxPoints) {
                    this.points.shift();
                }

                // Check if branch should stop growing
                if (this.length >= this.targetLength || this.depth >= config.maxBranchDepth) {
                    this.isGrowing = false;
                    this.parentNeuron.tipPositions.push({x: this.x, y: this.y});
                }

                // Randomly create side branch
                if (!this.isAccent && this.depth < config.maxBranchDepth - 1 && 
                    Math.random() < config.branchSplitChance && this.length > 30) {
                    const sideBranch = new Branch(
                        this.x, this.y, 
                        this.angle + (Math.random() - 0.5) * 1.5,
                        this.depth + 1,
                        this.parentNeuron,
                        Math.random() > 0.7
                    );
                    this.parentNeuron.branches.push(sideBranch);
                    branches.push(sideBranch);
                }
            }

            draw() {
                ctx.beginPath();
                if (this.points.length >= 2) {
                    ctx.moveTo(this.points[0].x, this.points[0].y);
                    for (let i = 1; i < this.points.length - 1; i++) {
                        const xc = (this.points[i].x + this.points[i + 1].x) / 2;
                        const yc = (this.points[i].y + this.points[i + 1].y) / 2;
                        ctx.quadraticCurveTo(this.points[i].x, this.points[i].y, xc, yc);
                    }
                    ctx.lineTo(this.points[this.points.length - 1].x, this.points[this.points.length - 1].y);
                }

                ctx.strokeStyle = this.isAccent ? config.accentBranchColor : config.branchColor;
                ctx.lineWidth = this.thickness;
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.pulseProgress = 0;
                this.pulseActive = false;
                this.pulseTimer = 0;
            }

            update() {
                this.pulseTimer++;
                
                // Randomly activate pulses
                if (!this.pulseActive && this.pulseTimer > 100) {
                    if (Math.random() < config.pulseFrequency) {
                        this.pulseActive = true;
                        this.pulseProgress = 0;
                        this.pulseTimer = 0;
                    }
                }

                // Animate pulse
                if (this.pulseActive) {
                    this.pulseProgress += config.pulseSpeed * 0.02;
                    if (this.pulseProgress >= 1) {
                        this.pulseActive = false;
                        this.pulseTimer = 0;
                    }
                }
            }

            draw() {
                const x1 = this.neuron1.x;
                const y1 = this.neuron1.y;
                const x2 = this.neuron2.x;
                const y2 = this.neuron2.y;

                // Draw synapse connection
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.shadowColor = config.synapseColor;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw pulse if active
                if (this.pulseActive) {
                    const px = x1 + (x2 - x1) * this.pulseProgress;
                    const py = y1 + (y2 - y1) * this.pulseProgress;

                    ctx.beginPath();
                    ctx.arc(px, py, 3, 0, Math.PI * 2);
                    ctx.fillStyle = config.pulseColor;
                    ctx.shadowBlur = 20 * config.pulseBrightness;
                    ctx.shadowColor = config.pulseColor;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // ============ SIMULATION FUNCTIONS ============
        function initSimulation() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            growthComplete = false;

            // Create random seed neurons near center
            const numNeurons = Math.floor(config.neuronCount) + 1;
            for (let i = 0; i < numNeurons; i++) {
                const offsetX = (Math.random() - 0.5) * 100;
                const offsetY = (Math.random() - 0.5) * 100;
                const neuron = new Neuron(centerX + offsetX, centerY + offsetY, i);
                neurons.push(neuron);

                // Start branches from each neuron
                const numBranches = Math.floor(Math.random() * 3) + 2;
                for (let j = 0; j < numBranches; j++) {
                    const angle = (Math.PI * 2 / numBranches) * j + (Math.random() - 0.5) * 0.5;
                    const branch = new Branch(neuron.x, neuron.y, angle, 0, neuron);
                    neuron.branches.push(branch);
                    branches.push(branch);
                }
            }

            // Initial synapse detection
            detectSynapses();
        }

        function detectSynapses() {
            const newSynapses = [];
            
            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const n1 = neurons[i];
                    const n2 = neurons[j];

                    // Check if any tips are close enough
                    for (const tip1 of n1.tipPositions) {
                        for (const tip2 of n2.tipPositions) {
                            const dx = tip1.x - tip2.x;
                            const dy = tip1.y - tip2.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance <= config.synapseDistanceThreshold) {
                                const synapse = new Synapse(tip1, tip2);
                                newSynapses.push(synapse);
                                synapses.push(synapse);
                            }
                        }
                    }
                }
            }

            // Check if growth is complete
            const allGrowing = branches.every(b => !b.isGrowing);
            if (allGrowing && neurons.every(n => n.branches.every(b => !b.isGrowing))) {
                growthComplete = true;
            }
        }

        function drawBackground() {
            // Clear with background color
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid/scanlines
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw vignette effect
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 300,
                centerX, centerY, 600
            );
            gradient.addColorStop(0, 'rgba(16, 26, 58, 0)');
            gradient.addColorStop(1, 'rgba(16, 26, 58, 0.5)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function animate() {
            if (!isPaused) {
                drawBackground();

                // Update and draw neurons
                for (const neuron of neurons) {
                    for (const branch of neuron.branches) {
                        branch.update();
                        branch.draw();
                    }
                }

                // Detect new synapses
                if (!growthComplete) {
                    detectSynapses();
                }

                // Update and draw synapses
                for (const synapse of synapses) {
                    synapse.update();
                    synapse.draw();
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        // ============ GUI SETUP ============
        function setupGUI() {
            const gui = new dat.GUI({ width: 300 });

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count');
            growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config, 'maxBranchDepth', 5, 12, 1).name('Max Depth');
            growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
            growthFolder.add(config, 'branchCurvature', 0, 1).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 100, 400).name('Max Length');
            growthFolder.open();

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 20, 150, 5).name('Distance Threshold');
            synapsesFolder.add(config, 'synapseGlowStrength', 0, 50, 1).name('Glow Strength');
            synapsesFolder.open();

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 1, 10, 0.5).name('Pulse Speed');
            pulsesFolder.add(config, 'pulseFrequency', 0.001, 0.1).name('Frequency');
            pulsesFolder.add(config, 'pulseBrightness', 0.3, 2, 0.1).name('Brightness');
            pulsesFolder.open();

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor').name('Background');
            visualsFolder.addColor(config, 'branchColor').name('Branch Color');
            visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
            visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
            visualsFolder.open();

            // Buttons folder
            const buttonsFolder = gui.addFolder('Controls');
            buttonsFolder.add(config, 'regenerateNetwork').name('Regenerate Network');
            buttonsFolder.add(config, 'clearCanvas').name('Clear Canvas');
            buttonsFolder.add(config, 'pauseResume').name('Pause/Resume');
            buttonsFolder.open();
        }

        // ============ INITIALIZATION ============
        setupGUI();
        initSimulation();
        animate();
    </script>
</body>
</html>
