<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;}
  #gameContainer{display:grid;grid-template-columns:repeat(30,20px);grid-template-rows:repeat(30,20px);gap:0;border:2px solid #444;margin-top:20px;}
  .cell{width:20px;height:20px;background:#222;}
  .snake1{background:#0f0;}
  .snake2{background:#00f;}
  .food{background:#f00;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-size:1.2em;z-index:10;}
  #overlay.hidden{display:none;}
  #score{margin-top:10px;font-size:1.1em;}
  button{margin:5px;padding:5px 10px;font-size:1em;}
</style>
</head>
<body>
<div id="overlay">
  <div id="menu">
    <h1>Snake Game</h1>
    <p>Select Mode:</p>
    <button id="mode0">Human vs Human</button>
    <button id="mode1">CPU vs Human</button>
    <button id="mode2">CPU vs CPU</button>
  </div>
  <div id="gameOver" class="hidden">
    <h2 id="winnerText">Game Over</h2>
    <p>Press R to Restart</p>
  </div>
</div>
<div id="score">Score: 0</div>
<div id="gameContainer"></div>
<script>
const gridSize = 30;
const cellSize = 20;
let gameInterval = null;
let isGameRunning = false;
let mode = 0; // 0 human vs human, 1 cpu vs human, 2 cpu vs cpu

const directions = {
  ArrowUp: {dx:0,dy:-1,dir:'up'},
  ArrowDown: {dx:0,dy:1,dir:'down'},
  ArrowLeft: {dx:-1,dy:0,dir:'left'},
  ArrowRight: {dx:1,dy:0,dir:'right'},
  w: {dx:0,dy:-1,dir:'up'},
  s: {dx:0,dy:1,dir:'down'},
  a: {dx:-1,dy:0,dir:'left'},
  d: {dx:1,dy:0,dir:'right'}
};

function createGrid(){
  const container=document.getElementById('gameContainer');
  for(let i=0;i<gridSize*gridSize;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    container.appendChild(cell);
  }
}

function index(x,y){return y*gridSize+x;}

class Snake{
  constructor(isCPU, colorClass){
    this.isCPU=isCPU;
    this.colorClass=colorClass;
    this.body=[{x:Math.floor(gridSize/2),y:Math.floor(gridSize/2)}];
    this.dir={dx:1,dy:0};
    this.pendingDir=this.dir;
    this.score=0;
  }
  setDirection(key){
    if(this.isCPU)return;
    const d = directions[key];
    if(d && !this.isOpposite(d)){this.pendingDir=d;}
  }
  isOpposite(d){return this.dir.dx===-d.dx && this.dir.dy===-d.dy;}
  move(){
    this.dir=this.pendingDir;
    const newHead={x:this.body[0].x+this.dir.dx,y:this.body[0].y+this.dir.dy};
    this.body.unshift(newHead);
    this.body.pop();
  }
  grow(){
    const newHead={x:this.body[0].x+this.dir.dx,y:this.body[0].y+this.dir.dy};
    this.body.unshift(newHead);
  }
}

let snake1, snake2, food;

function initGame(){
  snake1=new Snake(false,'snake1');
  snake2=new Snake(mode===2 || mode===1,false,'snake2');
  if(mode===1) snake2.isCPU=true; // CPU vs Human
  if(mode===2) snake2.isCPU=true; // CPU vs CPU
  if(mode===2) snake1.isCPU=true; // CPU vs CPU
  spawnFood();
  render();
}

function spawnFood(){
  let x,y;
  do{x=Math.floor(Math.random()*gridSize);y=Math.floor(Math.random()*gridSize);}while(isOccupied(x,y));
  food={x,y};
}

function isOccupied(x,y){
  return snake1.body.some(p=>p.x===x&&p.y===y)||snake2.body.some(p=>p.x===x&&p.y===y);
}

function render(){
  const cells=document.querySelectorAll('.cell');
  cells.forEach(c=>{c.className='cell';});
  snake1.body.forEach(p=>{cells[index(p.x,p.y)].classList.add('snake1');});
  snake2.body.forEach(p=>{cells[index(p.x,p.y)].classList.add('snake2');});
  cells[index(food.x,food.y)].classList.add('food');
  document.getElementById('score').textContent=`Score: ${snake1.score} | ${snake2.score}`;
}

function update(){
  // Move snakes
  if(!snake1.isCPU) snake1.move();
  else snake1.autoMove();
  if(!snake2.isCPU) snake2.move();
  else snake2.autoMove();
  // Check collisions
  const heads=[snake1.body[0],snake2.body[0]];
  for(const h of heads){
    if(h.x<0||h.x>=gridSize||h.y<0||h.y>=gridSize){gameOver();return;}
    // Self collision
    const body = (h===snake1.body[0])?snake1.body.slice(1):snake2.body.slice(1);
    if(body.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return;}
    // Other snake collision
    const other = (h===snake1.body[0])?snake2.body:snake1.body;
    if(other.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return;}
  }
  // Food consumption
  if(heads[0].x===food.x&&heads[0].y===food.y){snake1.grow();snake1.score++;spawnFood();}
  if(heads[1].x===food.x&&heads[1].y===food.y){snake2.grow();snake2.score++;spawnFood();}
  render();
}

function gameOver(){
  clearInterval(gameInterval);
  isGameRunning=false;
  const winnerText=document.getElementById('winnerText');
  if(snake1.score>snake2.score) winnerText.textContent='Snake 1 Wins!';
  else if(snake2.score>snake1.score) winnerText.textContent='Snake 2 Wins!';
  else winnerText.textContent='Tie!';
  document.getElementById('gameOver').classList.remove('hidden');
}

function startGame(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameOver').classList.add('hidden');
  initGame();
  isGameRunning=true;
  gameInterval=setInterval(update,200);
}

function handleKey(e){
  if(!isGameRunning){
    if(e.key==='r'||e.key==='R'){startGame();return;}
    if(e.key==='1'){mode=0;startGame();return;}
    if(e.key==='2'){mode=1;startGame();return;}
    if(e.key==='3'){mode=2;startGame();return;}
    return;
  }
  if(e.key in directions){
    if(snake1.isCPU) return;
    snake1.setDirection(e.key);
    if(!snake2.isCPU){
      // map WASD to snake2
      if(['w','a','s','d'].includes(e.key)) snake2.setDirection(e.key);
    }
  }
}

// CPU movement logic
Snake.prototype.autoMove=function(){
  const target=food;
  const possible=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
  // filter out reverse
  const reverse={dx:-this.dir.dx,dy:-this.dir.dy};
  const options=possible.filter(d=>!(d.dx===reverse.dx&&d.dy===reverse.dy));
  // choose direction that reduces Manhattan distance and doesn't collide
  let best=null;
  for(const d of options){
    const nx=this.body[0].x+d.dx, ny=this.body[0].y+d.dy;
    if(nx<0||nx>=gridSize||ny<0||ny>=gridSize) continue;
    if(isOccupied(nx,ny)) continue;
    const dist=Math.abs(nx-target.x)+Math.abs(ny-target.y);
    if(best===null||dist<best.dist){best={dx:d.dx,dy:d.dy,dist};}
  }
  if(best){this.pendingDir={dx:best.dx,dy:best.dy,dir:''};this.move();}
  else {this.move();}
};

createGrid();
// Attach event listeners
document.addEventListener('keydown',handleKey);
// Show start menu
</script>
</body>
</html>
