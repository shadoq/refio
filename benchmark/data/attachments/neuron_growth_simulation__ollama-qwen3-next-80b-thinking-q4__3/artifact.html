<!DOCTYPE html>
<html>
<head>
    <title>Neural Network Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #101a3a;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }
    </style>
    <script src="https://unpkg.com/dat.gui/build/dat.gui.min.js"></script>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const params = {
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 5,
            branchSplitChance: 0.2,
            branchCurvature: 0.5,
            maxBranchLength: 150,
            synapseDistanceThreshold: 20,
            synapseGlowStrength: 15,
            pulseSpeed: 1.5,
            pulseFrequency: 0.05,
            pulseBrightness: 0.8,
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            regenerate: function() {
                branches = [];
                synapses = [];
                pulses = [];
                generateNeurons();
            },
            clearCanvas: function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            },
            pauseAnimation: function() {
                paused = !paused;
            }
        };
        
        let branches = [];
        let synapses = [];
        let pulses = [];
        let paused = false;
        
        function generateNeurons() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;
            for (let i = 0; i < params.neuronCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                branches.push({
                    start: { x, y },
                    end: { x, y },
                    direction: Math.random() * Math.PI * 2,
                    currentLength: 0,
                    maxLength: params.maxBranchLength,
                    depth: 0,
                    parent: null,
                    color: params.branchColor
                });
            }
        }
        
        function updateBranches() {
            for (let i = branches.length - 1; i >= 0; i--) {
                const branch = branches[i];
                if (branch.currentLength >= branch.maxLength) {
                    if (Math.random() < params.branchSplitChance && branch.depth < params.maxBranchDepth) {
                        const angle1 = branch.direction + (Math.random() - 0.5) * params.branchCurvature;
                        const angle2 = branch.direction - (Math.random() - 0.5) * params.branchCurvature;
                        branches.push({
                            start: { ...branch.end },
                            end: { ...branch.end },
                            direction: angle1,
                            currentLength: 0,
                            maxLength: params.maxBranchLength,
                            depth: branch.depth + 1,
                            parent: branch,
                            color: params.accentBranchColor
                        });
                        branches.push({
                            start: { ...branch.end },
                            end: { ...branch.end },
                            direction: angle2,
                            currentLength: 0,
                            maxLength: params.maxBranchLength,
                            depth: branch.depth + 1,
                            parent: branch,
                            color: params.accentBranchColor
                        });
                    }
                    branches.splice(i, 1);
                    continue;
                }
                branch.currentLength += params.branchGrowthSpeed;
                branch.end.x = branch.start.x + Math.cos(branch.direction) * branch.currentLength;
                branch.end.y = branch.start.y + Math.sin(branch.direction) * branch.currentLength;
                branch.direction += (Math.random() - 0.5) * params.branchCurvature;
            }
        }
        
        function checkSynapses() {
            synapses = [];
            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const branch1 = branches[i];
                    const branch2 = branches[j];
                    const dx = branch1.end.x - branch2.end.x;
                    const dy = branch1.end.y - branch2.end.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < params.synapseDistanceThreshold) {
                        const x = (branch1.end.x + branch2.end.x) / 2;
                        const y = (branch1.end.y + branch2.end.y) / 2;
                        synapses.push({ x, y });
                    }
                }
            }
        }
        
        function updatePulses() {
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.position += params.pulseSpeed;
                if (pulse.position >= pulse.branch.maxLength) {
                    pulses.splice(i, 1);
                    continue;
                }
                const ratio = pulse.position / pulse.branch.maxLength;
                pulse.x = pulse.branch.start.x + (pulse.branch.end.x - pulse.branch.start.x) * ratio;
                pulse.y = pulse.branch.start.y + (pulse.branch.end.y - pulse.branch.start.y) * ratio;
            }
            if (Math.random() < params.pulseFrequency) {
                if (branches.length > 0) {
                    const branch = branches[Math.floor(Math.random() * branches.length)];
                    pulses.push({
                        branch: branch,
                        position: 0,
                        x: branch.start.x,
                        y: branch.start.y
                    });
                }
            }
        }
        
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        function drawBranches() {
            for (const branch of branches) {
                ctx.beginPath();
                ctx.moveTo(branch.start.x, branch.start.y);
                ctx.lineTo(branch.end.x, branch.end.y);
                ctx.shadowBlur = 10;
                ctx.shadowColor = branch.color;
                ctx.strokeStyle = branch.color;
                ctx.stroke();
            }
        }
        
        function drawSynapses() {
            for (const synapse of synapses) {
                ctx.beginPath();
                ctx.arc(synapse.x, synapse.y, 5, 0, Math.PI * 2);
                ctx.shadowBlur = params.synapseGlowStrength;
                ctx.shadowColor = params.synapseColor;
                ctx.fillStyle = params.synapseColor;
                ctx.fill();
            }
        }
        
        function drawPulses() {
            for (const pulse of pulses) {
                const color = params.pulseColor;
                const alpha = params.pulseBrightness;
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(pulse.x, pulse.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function animate() {
            if (!paused) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid();
                updateBranches();
                checkSynapses();
                updatePulses();
                drawBranches();
                drawSynapses();
                drawPulses();
            }
            requestAnimationFrame(animate);
        }
        
        generateNeurons();
        const gui = new dat.GUI();
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
        growthFolder.add(params, 'branchGrowthSpeed', 0.5, 5, 0.1).name('Growth Speed');
        growthFolder.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
        growthFolder.add(params, 'branchSplitChance', 0, 1, 0.05).name('Split Chance');
        growthFolder.add(params, 'branchCurvature', 0, 1, 0.1).name('Curvature');
        growthFolder.add(params, 'maxBranchLength', 50, 300, 5).name('Max Length');
        
        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(params, 'synapseDistanceThreshold', 5, 50, 1).name('Distance Threshold');
        synapsesFolder.add(params, 'synapseGlowStrength', 5, 30, 1).name('Glow Strength');
        
        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(params, 'pulseSpeed', 0.5, 3, 0.1).name('Speed');
        pulsesFolder.add(params, 'pulseFrequency', 0.01, 0.2, 0.01).name('Frequency');
        pulsesFolder.add(params, 'pulseBrightness', 0.1, 1, 0.1).name('Brightness');
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(params, 'backgroundColor').onChange(value => {
            document.body.style.backgroundColor = value;
        }).name('Background');
        visualsFolder.addColor(params, 'branchColor').name('Branch');
        visualsFolder.addColor(params, 'accentBranchColor').name('Accent Branch');
        visualsFolder.addColor(params, 'synapseColor').name('Synapse');
        visualsFolder.addColor(params, 'pulseColor').name('Pulse');
        
        gui.add(params, 'regenerate').name('Regenerate Network');
        gui.add(params, 'clearCanvas').name('Clear Canvas');
        gui.add(params, 'pauseAnimation').name('Pause/Resume');
        
        animate();
    </script>
</body>
</html>
