<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuron Growth Network</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05070f;
    overflow: hidden;
    font-family: monospace;
  }
  canvas#scene {
    background: radial-gradient(circle at center, #101a3a 0%, #05070f 70%);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.35);
    border-radius: 6px;
    display: block;
  }
  .dg.main, .dg li, .dg .cr {
    color: #ffd400 !important;
  }
  .dg .property-name {
    color: #ffd400 !important;
  }
</style>
</head>
<body>
<canvas id="scene" width="800" height="800"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat.gui/0.7.9/dat.gui.min.js"></script>
<script>
// --- Setup ---
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const params = {
  neuronCount: 4,
  growthSpeed: 1.5,
  maxDepth: 6,
  splitChance: 0.25,
  curvature: 0.4,
  maxBranchLength: 90,
  synapseDistance: 28,
  synapseGlowStrength: 18,
  pulseSpeed: 0.02,
  pulseFrequency: 0.02,
  pulseBrightness: 1.0,
  backgroundColor: '#05070f',
  backgroundGlow: '#101a3a',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  uiColor: '#ffd400',
  gridColor: 'rgba(0, 229, 255, 0.08)'
};

let branches = [];       // finalized branch segments
let synapses = [];       // connections between nearby branch tips
let pulses = [];         // traveling sparks
let growthQueue = [];    // active growing tips
let paused = false;
let animationId = null;
let growing = true;
let frameTime = 0;
const MAX_BRANCHES = 260;
const MAX_PULSES = 40;
let seenPairs = new Set();

// --- GUI Setup ---
const gui = new dat.GUI();

const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1);
growthFolder.add(params, 'growthSpeed', 0.2, 5);
growthFolder.add(params, 'maxDepth', 2, 10, 1);
growthFolder.add(params, 'splitChance', 0, 1);
growthFolder.add(params, 'curvature', 0, 1);
growthFolder.add(params, 'maxBranchLength', 20, 200);
growthFolder.open();

const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDistance', 10, 80);
synapseFolder.add(params, 'synapseGlowStrength', 0, 40);
synapseFolder.open();

const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params, 'pulseSpeed', 0.002, 0.1);
pulseFolder.add(params, 'pulseFrequency', 0.001, 0.2);
pulseFolder.add(params, 'pulseBrightness', 0.2, 3);
pulseFolder.open();

const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'backgroundColor');
visualsFolder.addColor(params, 'branchColor');
visualsFolder.addColor(params, 'accentColor').name('Accent Branch Color');
visualsFolder.addColor(params, 'synapseColor');
visualsFolder.addColor(params, 'pulseColor');
visualsFolder.open();

const controls = {
  regenerate: function() {
    initNetwork();
    growing = true;
  },
  clear: function() {
    branches = [];
    synapses = [];
    pulses = [];
    growthQueue = [];
    seenPairs = new Set();
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, W, H);
  },
  pauseResume: function() {
    paused = !paused;
    if (!paused && animationId === null) {
      loop();
    }
  }
};

gui.add(controls, 'regenerate').name('Regenerate Network');
gui.add(controls, 'clear').name('Clear Canvas');
gui.add(controls, 'pauseResume').name('Pause / Resume');

// --- Neuron Growth ---
function initNetwork() {
  branches = [];
  synapses = [];
  pulses = [];
  growthQueue = [];
  seenPairs = new Set();

  const cx = W / 2, cy = H / 2;
  const count = Math.round(params.neuronCount);

  for (let i = 0; i < count; i++) {
    const jitterX = (Math.random() - 0.5) * 240;
    const jitterY = (Math.random() - 0.5) * 240;
    const x = cx + jitterX;
    const y = cy + jitterY;
    const angle = Math.random() * Math.PI * 2;

    growthQueue.push({
      x: x,
      y: y,
      angle: angle,
      depth: 0,
      segLen: 0,
      segTarget: 20 + Math.random() * 30,
      width: 1.5 + Math.random() * 1.0,
      colorType: 'main',
      curSegStart: { x: x, y: y },
      curSegAngle: angle,
      curCurveOffset: (Math.random() - 0.5) * params.curvature * 40
    });
  }
}

function spawnChildTip(parentX, parentY, parentAngle, depth, isSide) {
  if (branches.length >= MAX_BRANCHES) return;
  if (depth > params.maxDepth) return;

  const angleVariance = isSide ? 0.9 : 0.5;
  const newAngle = parentAngle + (Math.random() - 0.5) * angleVariance;
  const width = isSide ? (0.8 + Math.random() * 1.0) : (1.2 + Math.random() * 1.3);
  const colorType = Math.random() < 0.75 ? 'main' : 'accent';

  growthQueue.push({
    x: parentX,
    y: parentY,
    angle: newAngle,
    depth: depth,
    segLen: 0,
    segTarget: 15 + Math.random() * 35,
    width: width,
    colorType: colorType,
    curSegStart: { x: parentX, y: parentY },
    curSegAngle: newAngle,
    curCurveOffset: (Math.random() - 0.5) * params.curvature * 40
  });
}

function stepGrowth() {
  if (growthQueue.length === 0) {
    growing = false;
    return;
  }

  const stillGrowing = [];

  for (let i = 0; i < growthQueue.length; i++) {
    const tip = growthQueue[i];

    const stepLen = 2 * params.growthSpeed;
    tip.curSegAngle += (Math.random() - 0.5) * 0.15;

    const nx = tip.curSegStart.x + Math.cos(tip.curSegAngle) * stepLen;
    const ny = tip.curSegStart.y + Math.sin(tip.curSegAngle) * stepLen;

    tip.segLen += stepLen;

    const midX = (tip.curSegStart.x + nx) / 2;
    const midY = (tip.curSegStart.y + ny) / 2;
    const perpAngle = tip.curSegAngle + Math.PI / 2;
    const cx = midX + Math.cos(perpAngle) * tip.curCurveOffset;
    const cy = midY + Math.sin(perpAngle) * tip.curCurveOffset;

    if (tip.segLen >= tip.segTarget || branches.length >= MAX_BRANCHES) {
      // finalize this branch segment
      branches.push({
        x1: tip.curSegStart.x,
        y1: tip.curSegStart.y,
        x2: nx,
        y2: ny,
        cx: cx,
        cy: cy,
        depth: tip.depth,
        width: tip.width,
        colorType: tip.colorType,
        growProgress: 1,
        isTip: true
      });

      // check if this branch continues growing (respect maxBranchLength & maxDepth)
      const totalLen = tip.segLen; // approximate, single segment tracked
      const canContinue = tip.depth < params.maxDepth && totalLen < params.maxBranchLength && branches.length < MAX_BRANCHES;

      if (canContinue) {
        // main continuation
        if (Math.random() < 0.9) {
          spawnChildTip(nx, ny, tip.curSegAngle, tip.depth + 1, false);
        }
        // side branch
        if (Math.random() < params.splitChance) {
          spawnChildTip(nx, ny, tip.curSegAngle, tip.depth + 1, true);
        }
      }
      // this tip is done, do not push to stillGrowing
    } else {
      // still growing this segment - track as active partial branch
      tip.partial = {
        x1: tip.curSegStart.x,
        y1: tip.curSegStart.y,
        x2: nx,
        y2: ny,
        cx: cx,
        cy: cy,
        width: tip.width,
        colorType: tip.colorType
      };
      tip.curSegStart = tip.curSegStart; // keep same start until finalized
      tip.lastX = nx;
      tip.lastY = ny;
      stillGrowing.push(tip);
    }
  }

  growthQueue = stillGrowing;
  if (growthQueue.length === 0) {
    growing = false;
    detectSynapses();
  }
}

// --- Synapse Detection ---
function detectSynapses() {
  const tips = branches.filter(b => b.isTip);
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const a = tips[i], b = tips[j];
      const dx = a.x2 - b.x2;
      const dy = a.y2 - b.y2;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < params.synapseDistance && dist > 0.5) {
        const key = i < j ? i + '_' + j : j + '_' + i;
        if (!seenPairs.has(key)) {
          seenPairs.add(key);
          synapses.push({
            x1: a.x2,
            y1: a.y2,
            x2: b.x2,
            y2: b.y2,
            pulsePhase: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }
}

// --- Pulse Animation ---
function updatePulses() {
  if (!growing && synapses.length > 0 && pulses.length < MAX_PULSES) {
    if (Math.random() < params.pulseFrequency) {
      const idx = Math.floor(Math.random() * synapses.length);
      pulses.push({
        synapseIndex: idx,
        t: 0,
        speed: params.pulseSpeed * (0.7 + Math.random() * 0.6),
        reverse: Math.random() < 0.5
      });
    }
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed;
    if (p.t >= 1) {
      pulses.splice(i, 1);
    }
  }
}

// --- Rendering ---
function render() {
  // background fill
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, W, H);

  // subtle radial glow behind center
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grad.addColorStop(0, params.backgroundGlow);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // scanlines
  ctx.strokeStyle = params.gridColor;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  for (let y = 0; y < H; y += 4) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();

  // finalized branches
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    const color = b.colorType === 'accent' ? params.accentColor : params.branchColor;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.lineWidth = b.width;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.quadraticCurveTo(b.cx, b.cy, b.x2, b.y2);
    ctx.stroke();
  }

  // active growing tips (partial segments)
  for (let i = 0; i < growthQueue.length; i++) {
    const tip = growthQueue[i];
    if (!tip.partial) continue;
    const color = tip.partial.colorType === 'accent' ? params.accentColor : params.branchColor;
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.lineWidth = tip.partial.width;
    ctx.beginPath();
    ctx.moveTo(tip.partial.x1, tip.partial.y1);
    ctx.quadraticCurveTo(tip.partial.cx, tip.partial.cy, tip.partial.x2, tip.partial.y2);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // synapses
  for (let i = 0; i < synapses.length; i++) {
    const s = synapses[i];
    const pulseVal = Math.sin(frameTime * 0.05 + s.pulsePhase) * 0.5 + 0.5;
    const radius = 2 + pulseVal * 2;

    ctx.strokeStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlowStrength;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();

    ctx.fillStyle = params.synapseColor;
    ctx.beginPath();
    ctx.arc(s.x1, s.y1, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x2, s.y2, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // pulses
  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const syn = synapses[p.synapseIndex];
    if (!syn) continue;
    const t = p.reverse ? 1 - p.t : p.t;
    const px = syn.x1 + (syn.x2 - syn.x1) * t;
    const py = syn.y1 + (syn.y2 - syn.y1) * t;

    ctx.fillStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 15 * params.pulseBrightness;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, W / 3, W / 2, H / 2, W / 1.4);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

// --- Main Loop ---
function loop() {
  if (!paused) {
    frameTime++;
    if (growing) {
      stepGrowth();
    }
    updatePulses();
    render();
  }
  animationId = requestAnimationFrame(loop);
}

initNetwork();
loop();
</script>
</body>
</html>
