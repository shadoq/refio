<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game - Human vs Human / CPU vs Human / CPU vs CPU</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #gameContainer {
        position: relative;
    }
    canvas {
        background: #222;
        display: block;
        border: 2px solid #555;
    }
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }
    .overlay.hidden {
        display: none;
    }
    .overlay button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
    }
    .scoreBoard {
        position: absolute;
        top: 5px;
        left: 5px;
        font-size: 1rem;
        z-index: 5;
        display: flex;
        gap: 20px;
    }
    .scoreBoard span {
        background: rgba(0,0,0,0.5);
        padding: 4px 8px;
        border-radius: 4px;
    }
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="menuOverlay" class="overlay">
        <h2>Select Game Mode</h2>
        <label><input type="radio" name="mode" value="hvsh" checked> Human vs Human</label><br>
        <label><input type="radio" name="mode" value="cvsh"> CPU vs Human</label><br>
        <label><input type="radio" name="mode" value="cvs c"> CPU vs CPU</label><br>
        <button id="startBtn">Start Game</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h2 id="gameOverMessage">Game Over</h2>
        <p>Press any key to restart</p>
    </div>

    <div class="scoreBoard">
        <span id="score1">Player 1: 0</span>
        <span id="score2">Player 2: 0</span>
    </div>
</div>

<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 30;
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const FPS = 10;
    const DIRECTIONS = {
        ArrowUp:    {x:0, y:-1},
        ArrowDown:  {x:0, y:1},
        ArrowLeft:  {x:-1, y:0},
        ArrowRight: {x:1, y:0},
        w:          {x:0, y:-1},
        s:          {x:0, y:1},
        a:          {x:-1, y:0},
        d:          {x:1, y:0}
    };
    let gameInterval = null;
    let mode = 'hvsh';
    let food = null;
    const snakes = [];

    const menuOverlay = document.getElementById('menuOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gameOverMessage = document.getElementById('gameOverMessage');
    const startBtn = document.getElementById('startBtn');
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');

    class Snake {
        constructor(id, startPos, startDir, color, isHuman) {
            this.id = id;
            this.body = [startPos];
            this.dir = startDir;
            this.pendingDir = startDir;
            this.color = color;
            this.isHuman = isHuman;
            this.alive = true;
            this.growSegments = 0;
            this.score = 0;
        }

        setDirection(newDir) {
            // Prevent reverse direction
            if (this.dir.x + newDir.x === 0 && this.dir.y + newDir.y === 0) return;
            this.pendingDir = newDir;
        }

        move() {
            if (!this.alive) return;
            this.dir = this.pendingDir;
            const newHead = {
                x: (this.body[0].x + this.dir.x + GRID_SIZE) % GRID_SIZE,
                y: (this.body[0].y + this.dir.y + GRID_SIZE) % GRID_SIZE
            };
            // Collision with walls (handled by wrapping, but we consider wall collision as death)
            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                this.alive = false;
                return;
            }
            // Collision with self
            if (this.body.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                this.alive = false;
                return;
            }
            // Collision with other snake
            const other = snakes.find(s => s.id !== this.id);
            if (other && other.body.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                this.alive = false;
                return;
            }
            this.body.unshift(newHead);
            if (newHead.x === food.x && newHead.y === food.y) {
                this.growSegments += 2;
                this.score += 1;
                placeFood();
            }
            if (this.growSegments > 0) {
                this.growSegments--;
            } else {
                this.body.pop();
            }
        }
    }

    function initSnakes() {
        snakes.length = 0;
        const human1 = (mode === 'hvsh' || mode === 'cvsh');
        const human2 = (mode === 'hvsh');
        snakes.push(new Snake(1, {x:5, y:15}, {x:1, y:0}, '#0f0', human1));
        snakes.push(new Snake(2, {x:24, y:15}, {x:-1, y:0}, '#ff0', human2));
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            const x = Math.floor(Math.random() * GRID_SIZE);
            const y = Math.floor(Math.random() * GRID_SIZE);
            const occupied = snakes.some(s => s.body.some(seg => seg.x === x && seg.y === y));
            if (!occupied) {
                food = {x, y};
                valid = true;
            }
        }
    }

    function drawGrid() {
        ctx.strokeStyle = '#333';
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL_SIZE, 0);
            ctx.lineTo(i * CELL_SIZE, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * CELL_SIZE);
            ctx.lineTo(canvas.width, i * CELL_SIZE);
            ctx.stroke();
        }
    }

    function drawFood() {
        ctx.fillStyle = '#f00';
        ctx.fillRect(food.x * CELL_SIZE, food.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    }

    function drawSnakes() {
        snakes.forEach(snake => {
            ctx.fillStyle = snake.color;
            snake.body.forEach(seg => {
                ctx.fillRect(seg.x * CELL_SIZE, seg.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });
        });
    }

    function updateScores() {
        score1El.textContent = `Player 1: ${snakes[0].score}`;
        score2El.textContent = `Player 2: ${snakes[1].score}`;
    }

    function gameLoop() {
        // AI decisions
        snakes.forEach(snake => {
            if (!snake.isHuman && snake.alive) {
                const bestDir = computeAIDirection(snake);
                if (bestDir) snake.setDirection(bestDir);
            }
        });
        // Move snakes
        snakes.forEach(snake => snake.move());
        // Check game over
        const aliveSnakes = snakes.filter(s => s.alive);
        if (aliveSnakes.length < 2) {
            endGame(aliveSnakes[0]);
            return;
        }
        // Render
        ctx.clearRect(0,0,canvas.width,canvas.height);
        //drawGrid(); // optional grid
        drawFood();
        drawSnakes();
        updateScores();
    }

    function computeAIDirection(snake) {
        const possible = [
            {x:0, y:-1}, // up
            {x:0, y:1},  // down
            {x:-1, y:0}, // left
            {x:1, y:0}   // right
        ];
        // Filter out reverse direction
        const filtered = possible.filter(d => !(d.x + snake.dir.x === 0 && d.y + snake.dir.y === 0));
        // Evaluate each direction
        let best = null;
        let bestDist = Infinity;
        filtered.forEach(d => {
            const nx = snake.body[0].x + d.x;
            const ny = snake.body[0].y + d.y;
            // Wall check
            if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return;
            // Self collision check
            if (snake.body.some(seg => seg.x === nx && seg.y === ny)) return;
            // Other snake collision check
            const other = snakes.find(s => s.id !== snake.id);
            if (other && other.body.some(seg => seg.x === nx && seg.y === ny)) return;
            const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
            if (dist < bestDist) {
                bestDist = dist;
                best = d;
            }
        });
        // If no safe move towards food, pick any safe move
        if (!best) {
            for (let d of filtered) {
                const nx = snake.body[0].x + d.x;
                const ny = snake.body[0].y + d.y;
                if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                if (snake.body.some(seg => seg.x === nx && seg.y === ny)) continue;
                const other = snakes.find(s => s.id !== snake.id);
                if (other && other.body.some(seg => seg.x === nx && seg.y === ny)) continue;
                best = d;
                break;
            }
        }
        return best;
    }

    function startGame() {
        initSnakes();
        placeFood();
        updateScores();
        menuOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 1000 / FPS);
    }

    function endGame(winner) {
        clearInterval(gameInterval);
        let msg = 'Draw!';
        if (winner) {
            msg = winner.id === 1 ? 'Player 1 Wins!' : 'Player 2 Wins!';
        }
        gameOverMessage.textContent = `Game Over - ${msg}`;
        gameOverOverlay.classList.remove('hidden');
    }

    // Input handling
    document.addEventListener('keydown', e => {
        if (!gameOverOverlay.classList.contains('hidden')) {
            // Restart after game over
            startBtn.click();
            return;
        }
        const key = e.key;
        if (key in DIRECTIONS) {
            const dir = DIRECTIONS[key];
            // Player 1 (arrow keys)
            if (snakes[0].isHuman && (key.startsWith('Arrow'))) {
                snakes[0].setDirection(dir);
            }
            // Player 2 (WASD)
            if (snakes[1].isHuman && !key.startsWith('Arrow')) {
                snakes[1].setDirection(dir);
            }
        }
    });

    startBtn.addEventListener('click', () => {
        const selected = document.querySelector('input[name="mode"]:checked').value;
        mode = selected;
        startGame();
    });

    // Initial state
    menuOverlay.classList.remove('hidden');
})();
</script>
</body>
</html>
