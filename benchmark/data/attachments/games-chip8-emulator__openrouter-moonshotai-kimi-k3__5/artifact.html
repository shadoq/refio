<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIP-8 Emulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e11;
    color: #c9d1d9;
    font-family: "Consolas", "Menlo", "Courier New", monospace;
    min-height: 100vh;
    padding: 16px;
  }
  header {
    border-bottom: 1px solid #1f2a33;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    color: #39ff6a;
    text-shadow: 0 0 12px rgba(57, 255, 106, 0.35);
  }
  header p { font-size: 12px; color: #6b7a88; margin-top: 4px; }
  main {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .left { flex: 0 0 auto; max-width: 100%; }
  .right { flex: 1 1 300px; min-width: 300px; }
  canvas {
    display: block;
    width: 640px;
    height: 320px;
    max-width: 100%;
    background: #050805;
    border: 1px solid #1f2a33;
    border-radius: 4px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 24px rgba(57, 255, 106, 0.08);
  }
  .hint {
    font-size: 12px;
    color: #8b98a5;
    margin-top: 8px;
  }
  .hint b { color: #39ff6a; font-weight: normal; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 12px;
    padding: 10px;
    background: #10151b;
    border: 1px solid #1f2a33;
    border-radius: 4px;
  }
  button, .file-label {
    background: #16202a;
    color: #c9d1d9;
    border: 1px solid #2a3a48;
    border-radius: 3px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  button:hover, .file-label:hover { background: #1d2b38; border-color: #39ff6a; }
  button:active, .file-label:active { background: #243646; }
  button.primary { color: #39ff6a; border-color: #2c5a3c; }
  #romInput { display: none; }
  .speed-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-size: 12px;
    color: #8b98a5;
  }
  input[type="range"] {
    width: 140px;
    accent-color: #39ff6a;
    cursor: pointer;
  }
  #speedVal { color: #39ff6a; min-width: 30px; text-align: right; }
  .pad-section { margin-top: 14px; }
  .pad-section h2, .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6b7a88;
    margin-bottom: 8px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 72px);
    gap: 6px;
  }
  .pad-key {
    height: 52px;
    background: #10151b;
    border: 1px solid #2a3a48;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: background 0.08s, box-shadow 0.08s;
  }
  .pad-key .chip { font-size: 18px; color: #39ff6a; line-height: 1; }
  .pad-key .kb { font-size: 10px; color: #6b7a88; margin-top: 4px; }
  .pad-key.active {
    background: #1e3a28;
    border-color: #39ff6a;
    box-shadow: 0 0 10px rgba(57, 255, 106, 0.4);
  }
  .panel {
    background: #10151b;
    border: 1px solid #1f2a33;
    border-radius: 4px;
    padding: 14px;
  }
  .status-line {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 3px;
    background: #0b0e11;
    border: 1px solid #1f2a33;
    margin-bottom: 12px;
  }
  .status-line .st-running { color: #39ff6a; }
  .status-line .st-paused { color: #e3b341; }
  .status-line .st-waiting { color: #58a6ff; }
  .status-line .st-error { color: #f85149; }
  .reg-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .reg {
    background: #0b0e11;
    border: 1px solid #1f2a33;
    border-radius: 3px;
    padding: 4px 6px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .reg .name { color: #6b7a88; }
  .reg .val { color: #39ff6a; }
  .sys-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sys-item {
    background: #0b0e11;
    border: 1px solid #1f2a33;
    border-radius: 3px;
    padding: 5px 10px;
    font-size: 12px;
  }
  .sys-item .name { color: #6b7a88; margin-right: 6px; }
  .sys-item .val { color: #e3b341; }
  .instr-box {
    background: #0b0e11;
    border: 1px solid #2c5a3c;
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .instr-box .raw { color: #e3b341; margin-right: 10px; }
  .instr-box .mnem { color: #39ff6a; }
  .stack-box {
    background: #0b0e11;
    border: 1px solid #1f2a33;
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 12px;
    min-height: 34px;
    color: #58a6ff;
    word-spacing: 8px;
  }
  .stack-box .empty { color: #4a5560; }
</style>
</head>
<body>
<header>
  <h1>CHIP-8 Emulator</h1>
  <p>4KB memory &middot; 35 opcodes &middot; 64&times;32 display &middot; 60Hz timers</p>
</header>
<main>
  <div class="left">
    <canvas id="screen" width="640" height="320"></canvas>
    <div class="hint">Demo ROM: move the ship with CHIP-8 keys <b>2/4/6/8</b> (keyboard: <b>2 / Q / E / S</b>).</div>
    <div class="controls">
      <button id="btnRun" class="primary">Run</button>
      <button id="btnPause">Pause</button>
      <button id="btnStep">Step</button>
      <button id="btnReset">Reset</button>
      <label class="file-label" for="romInput">Load ROM&hellip;</label>
      <input type="file" id="romInput">
      <button id="btnDemo">Load Demo ROM</button>
      <div class="speed-group">
        <span>Speed</span>
        <input type="range" id="speed" min="1" max="200" value="15">
        <span id="speedVal">15</span>
      </div>
    </div>
    <div class="pad-section">
      <h2>Keypad (CHIP-8 / Keyboard)</h2>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
  <div class="right">
    <div class="panel">
      <h2>Debugger</h2>
      <div class="status-line">Status: <span id="status" class="st-paused">Paused</span></div>
      <h2>Registers V0&ndash;VF</h2>
      <div class="reg-grid" id="regGrid"></div>
      <div class="sys-row">
        <div class="sys-item"><span class="name">I</span><span class="val" id="dbgI">0000</span></div>
        <div class="sys-item"><span class="name">PC</span><span class="val" id="dbgPC">0200</span></div>
        <div class="sys-item"><span class="name">DT</span><span class="val" id="dbgDT">00</span></div>
        <div class="sys-item"><span class="name">ST</span><span class="val" id="dbgST">00</span></div>
      </div>
      <h2>Current Instruction</h2>
      <div class="instr-box"><span class="raw" id="dbgRaw">0000</span><span class="mnem" id="dbgMnem">-</span></div>
      <h2>Stack</h2>
      <div class="stack-box" id="dbgStack"><span class="empty">empty</span></div>
    </div>
  </div>
</main>

<script>
"use strict";

/* ===================== CONSTANTS ===================== */

const FONT_SET = [
  0xF0,0x90,0x90,0x90,0xF0, // 0
  0x20,0x60,0x20,0x20,0x70, // 1
  0xF0,0x10,0xF0,0x80,0xF0, // 2
  0xF0,0x10,0xF0,0x10,0xF0, // 3
  0x90,0x90,0xF0,0x10,0x10, // 4
  0xF0,0x80,0xF0,0x10,0xF0, // 5
  0xF0,0x80,0xF0,0x90,0xF0, // 6
  0xF0,0x10,0x20,0x40,0x40, // 7
  0xF0,0x90,0xF0,0x90,0xF0, // 8
  0xF0,0x90,0xF0,0x10,0xF0, // 9
  0xF0,0x90,0xF0,0x90,0x90, // A
  0xE0,0x90,0xE0,0x90,0xE0, // B
  0xF0,0x80,0x80,0x80,0xF0, // C
  0xE0,0x90,0x90,0x90,0xE0, // D
  0xF0,0x80,0xF0,0x80,0xF0, // E
  0xF0,0x80,0xF0,0x80,0x80  // F
];

/*
 * Built-in demo ROM — hand-assembled spaceship mover.
 *
 * Assembly listing:
 *   0x200  00E0   CLS                 ; clear screen
 *   0x202  601C   LD V0, 0x1C         ; V0 = x = 28
 *   0x204  610E   LD V1, 0x0E         ; V1 = y = 14
 *   0x206  A240   LD I, 0x240         ; I -> ship sprite
 *   0x208  D015   DRW V0, V1, 5       ; draw ship
 *   0x20A  A240   LD I, 0x240         ; loop: I -> ship sprite
 *   0x20C  D015   DRW V0, V1, 5       ; erase ship (XOR)
 *   0x20E  6204   LD V2, 0x04         ; key 4 = left
 *   0x210  E2A1   SKNP V2             ; skip if not pressed
 *   0x212  70FF   ADD V0, 0xFF        ; x--
 *   0x214  6206   LD V2, 0x06         ; key 6 = right
 *   0x216  E2A1   SKNP V2
 *   0x218  7001   ADD V0, 0x01        ; x++
 *   0x21A  6202   LD V2, 0x02         ; key 2 = up
 *   0x21C  E2A1   SKNP V2
 *   0x21E  71FF   ADD V1, 0xFF        ; y--
 *   0x220  6208   LD V2, 0x08         ; key 8 = down
 *   0x222  E2A1   SKNP V2
 *   0x224  7101   ADD V1, 0x01        ; y++
 *   0x226  A240   LD I, 0x240
 *   0x228  D015   DRW V0, V1, 5       ; redraw ship
 *   0x22A  6302   LD V3, 0x02         ; frame limiter: DT = 2
 *   0x22C  F315   LD DT, V3
 *   0x22E  F307   LD V3, DT           ; wait: read DT
 *   0x230  3300   SE V3, 0x00         ; skip jump when DT == 0
 *   0x232  122E   JP 0x22E            ; keep waiting
 *   0x234  120A   JP 0x20A            ; main loop
 *   0x236..0x23F  padding (zeros, keeps sprite aligned at 0x240)
 *   0x240  18 3C 7E DB FF             ; ship sprite (5 rows x 8 px)
 */
const DEMO_ROM = [
  0x00,0xE0, 0x60,0x1C, 0x61,0x0E, 0xA2,0x40, 0xD0,0x15,
  0xA2,0x40, 0xD0,0x15, 0x62,0x04, 0xE2,0xA1, 0x70,0xFF,
  0x62,0x06, 0xE2,0xA1, 0x70,0x01, 0x62,0x02, 0xE2,0xA1,
  0x71,0xFF, 0x62,0x08, 0xE2,0xA1, 0x71,0x01, 0xA2,0x40,
  0xD0,0x15, 0x63,0x02, 0xF3,0x15, 0xF3,0x07, 0x33,0x00,
  0x12,0x2E, 0x12,0x0A,
  0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
  0x18,0x3C,0x7E,0xDB,0xFF
];

/* ===================== EMULATOR STATE ===================== */

const memory = new Uint8Array(4096);
const V = new Uint8Array(16);
const gfx = new Uint8Array(64 * 32);
const keys = new Uint8Array(16);
let I = 0;
let pc = 0x200;
let stack = [];
let delayTimer = 0;
let soundTimer = 0;
let drawFlag = false;
let running = false;
let waitingForKey = null;   // register index while Fx0A blocks
let errorMsg = null;
let speed = 15;
let currentRom = DEMO_ROM;

/* ===================== HELPERS ===================== */

const hex2 = v => v.toString(16).toUpperCase().padStart(2, "0");
const hex3 = v => v.toString(16).toUpperCase().padStart(3, "0");
const hex4 = v => v.toString(16).toUpperCase().padStart(4, "0");

function unknownOpcode(op) {
  errorMsg = "Unknown opcode 0x" + hex4(op) + " at 0x" + hex4(pc);
  console.error(errorMsg);
  running = false;
}

/* ===================== CPU ===================== */

function cycle() {
  if (errorMsg) return;

  // Resolve a blocking Fx0A (LD Vx, K) from keyboard or on-screen pad.
  if (waitingForKey !== null) {
    for (let k = 0; k < 16; k++) {
      if (keys[k]) {
        V[waitingForKey] = k;
        waitingForKey = null;
        pc = (pc + 2) & 0xFFF;
        break;
      }
    }
    return;
  }

  if (pc < 0x200 || pc > 0xFFE) {
    errorMsg = "PC out of bounds: 0x" + hex4(pc);
    console.error(errorMsg);
    running = false;
    return;
  }

  const op = (memory[pc] << 8) | memory[pc + 1];
  execute(op);
}

function execute(op) {
  const nnn = op & 0x0FFF;
  const kk  = op & 0x00FF;
  const x   = (op >> 8) & 0xF;
  const y   = (op >> 4) & 0xF;
  const n   = op & 0xF;

  switch (op & 0xF000) {
    case 0x0000:
      if (op === 0x00E0) {              // CLS
        gfx.fill(0);
        drawFlag = true;
        pc += 2;
      } else if (op === 0x00EE) {       // RET
        if (stack.length === 0) { unknownOpcode(op); return; }
        pc = stack.pop();
      } else {
        unknownOpcode(op);
      }
      break;

    case 0x1000: pc = nnn; break;       // JP nnn

    case 0x2000:                        // CALL nnn
      stack.push((pc + 2) & 0xFFFF);
      pc = nnn;
      break;

    case 0x3000: pc += (V[x] === kk) ? 4 : 2; break;   // SE Vx, byte
    case 0x4000: pc += (V[x] !== kk) ? 4 : 2; break;   // SNE Vx, byte
    case 0x5000:                        // SE Vx, Vy
      if (n === 0) pc += (V[x] === V[y]) ? 4 : 2;
      else unknownOpcode(op);
      break;

    case 0x6000: V[x] = kk; pc += 2; break;            // LD Vx, byte
    case 0x7000: V[x] = (V[x] + kk) & 0xFF; pc += 2; break; // ADD Vx, byte (no flag)

    case 0x8000: {
      const vx = V[x], vy = V[y];
      switch (n) {
        case 0x0: V[x] = vy; break;                              // LD Vx, Vy
        case 0x1: V[x] = vx | vy; break;                         // OR
        case 0x2: V[x] = vx & vy; break;                         // AND
        case 0x3: V[x] = vx ^ vy; break;                         // XOR
        case 0x4: {                                              // ADD Vx, Vy
          const sum = vx + vy;
          V[x] = sum & 0xFF;
          V[0xF] = sum > 0xFF ? 1 : 0;
          break;
        }
        case 0x5:                                                // SUB Vx, Vy
          V[0xF] = vx >= vy ? 1 : 0;
          V[x] = (vx - vy) & 0xFF;
          break;
        case 0x6:                                                // SHR (Vx = Vy >> 1)
          V[0xF] = vy & 0x1;
          V[x] = vy >> 1;
          break;
        case 0x7:                                                // SUBN Vy - Vx
          V[0xF] = vy >= vx ? 1 : 0;
          V[x] = (vy - vx) & 0xFF;
          break;
        case 0xE:                                                // SHL (Vx = Vy << 1)
          V[0xF] = (vy >> 7) & 0x1;
          V[x] = (vy << 1) & 0xFF;
          break;
        default: unknownOpcode(op); return;
      }
      pc += 2;
      break;
    }

    case 0x9000:                        // SNE Vx, Vy
      if (n === 0) pc += (V[x] !== V[y]) ? 4 : 2;
      else unknownOpcode(op);
      break;

    case 0xA000: I = nnn; pc += 2; break;              // LD I, nnn
    case 0xB000: pc = (nnn + V[0]) & 0xFFF; break;     // JP V0 + nnn
    case 0xC000:                                       // RND Vx, kk
      V[x] = Math.floor(Math.random() * 256) & kk;
      pc += 2;
      break;

    case 0xD000: {                      // DRW Vx, Vy, n (XOR, clip, VF=collision)
      const sx = V[x] % 64;
      const sy = V[y] % 32;
      V[0xF] = 0;
      for (let row = 0; row < n; row++) {
        const py = sy + row;
        if (py >= 32) break;                       // clip bottom
        const spriteByte = memory[(I + row) & 0xFFF];
        for (let col = 0; col < 8; col++) {
          const px = sx + col;
          if (px >= 64) break;                     // clip right
          if (spriteByte & (0x80 >> col)) {
            const idx = py * 64 + px;
            if (gfx[idx] === 1) V[0xF] = 1;
            gfx[idx] ^= 1;
          }
        }
      }
      drawFlag = true;
      pc += 2;
      break;
    }

    case 0xE000:
      if (kk === 0x9E) pc += keys[V[x]] ? 4 : 2;       // SKP Vx
      else if (kk === 0xA1) pc += keys[V[x]] ? 2 : 4;  // SKNP Vx
      else unknownOpcode(op);
      break;

    case 0xF000:
      switch (kk) {
        case 0x07: V[x] = delayTimer & 0xFF; pc += 2; break;   // LD Vx, DT
        case 0x0A: {                                           // LD Vx, K (blocking)
          let pressed = -1;
          for (let k = 0; k < 16; k++) if (keys[k]) { pressed = k; break; }
          if (pressed >= 0) {
            V[x] = pressed;
            pc += 2;
          } else {
            waitingForKey = x;   // halt: pc not advanced
          }
          break;
        }
        case 0x15: delayTimer = V[x]; pc += 2; break;          // LD DT, Vx
        case 0x18: soundTimer = V[x]; pc += 2; break;          // LD ST, Vx
        case 0x1E: I = (I + V[x]) & 0xFFFF; pc += 2; break;    // ADD I, Vx
        case 0x29: I = 0x50 + V[x] * 5; pc += 2; break;        // LD F, Vx
        case 0x33: {                                           // BCD
          const val = V[x];
          memory[I & 0xFFF] = Math.floor(val / 100);
          memory[(I + 1) & 0xFFF] = Math.floor(val / 10) % 10;
          memory[(I + 2) & 0xFFF] = val % 10;
          pc += 2;
          break;
        }
        case 0x55:                                             // LD [I], V0..Vx
          for (let r = 0; r <= x; r++) memory[(I + r) & 0xFFF] = V[r];
          pc += 2;
          break;
        case 0x65:                                             // LD V0..Vx, [I]
          for (let r = 0; r <= x; r++) V[r] = memory[(I + r) & 0xFFF];
          pc += 2;
          break;
        default: unknownOpcode(op);
      }
      break;

    default:
      unknownOpcode(op);
  }
}

/* ===================== DISASSEMBLER ===================== */

function disassemble(op) {
  const nnn = op & 0x0FFF;
  const kk  = op & 0x00FF;
  const x   = (op >> 8) & 0xF;
  const y   = (op >> 4) & 0xF;
  const n   = op & 0xF;
  const VX = "V" + x.toString(16).toUpperCase();
  const VY = "V" + y.toString(16).toUpperCase();

  switch (op & 0xF000) {
    case 0x0000:
      if (op === 0x00E0) return "CLS";
      if (op === 0x00EE) return "RET";
      return "SYS 0x" + hex3(nnn);
    case 0x1000: return "JP 0x" + hex3(nnn);
    case 0x2000: return "CALL 0x" + hex3(nnn);
    case 0x3000: return "SE " + VX + ", 0x" + hex2(kk);
    case 0x4000: return "SNE " + VX + ", 0x" + hex2(kk);
    case 0x5000: return "SE " + VX + ", " + VY;
    case 0x6000: return "LD " + VX + ", 0x" + hex2(kk);
    case 0x7000: return "ADD " + VX + ", 0x" + hex2(kk);
    case 0x8000:
      switch (n) {
        case 0x0: return "LD " + VX + ", " + VY;
        case 0x1: return "OR " + VX + ", " + VY;
        case 0x2: return "AND " + VX + ", " + VY;
        case 0x3: return "XOR " + VX + ", " + VY;
        case 0x4: return "ADD " + VX + ", " + VY;
        case 0x5: return "SUB " + VX + ", " + VY;
        case 0x6: return "SHR " + VX;
        case 0x7: return "SUBN " + VX + ", " + VY;
        case 0xE: return "SHL " + VX;
        default:  return "???";
      }
    case 0x9000: return "SNE " + VX + ", " + VY;
    case 0xA000: return "LD I, 0x" + hex3(nnn);
    case 0xB000: return "JP V0, 0x" + hex3(nnn);
    case 0xC000: return "RND " + VX + ", 0x" + hex2(kk);
    case 0xD000: return "DRW " + VX + ", " + VY + ", " + n;
    case 0xE000:
      if (kk === 0x9E) return "SKP " + VX;
      if (kk === 0xA1) return "SKNP " + VX;
      return "???";
    case 0xF000:
      switch (kk) {
        case 0x07: return "LD " + VX + ", DT";
        case 0x0A: return "LD " + VX + ", K";
        case 0x15: return "LD DT, " + VX;
        case 0x18: return "LD ST, " + VX;
        case 0x1E: return "ADD I, " + VX;
        case 0x29: return "LD F, " + VX;
        case 0x33: return "LD B, " + VX;
        case 0x55: return "LD [I], " + VX;
        case 0x65: return "LD " + VX + ", [I]";
        default:   return "???";
      }
    default: return "???";
  }
}

/* ===================== RENDERING ===================== */

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

function render() {
  ctx.fillStyle = "#050805";
  ctx.fillRect(0, 0, 640, 320);
  ctx.fillStyle = "#39ff6a";
  for (let i = 0; i < gfx.length; i++) {
    if (gfx[i]) {
      ctx.fillRect((i % 64) * 10, Math.floor(i / 64) * 10, 10, 10);
    }
  }
}

/* ===================== AUDIO ===================== */

let audioCtx = null;
let osc = null;
let oscGain = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) {
    audioCtx = null;
  }
}

function updateSound() {
  if (!audioCtx) return;
  const shouldBeep = running && soundTimer > 0;
  if (shouldBeep && !osc) {
    try {
      osc = audioCtx.createOscillator();
      oscGain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440;
      oscGain.gain.value = 0.04;
      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start();
    } catch (e) { osc = null; oscGain = null; }
  } else if (!shouldBeep && osc) {
    try { osc.stop(); } catch (e) {}
    try { osc.disconnect(); oscGain.disconnect(); } catch (e) {}
    osc = null;
    oscGain = null;
  }
}

window.addEventListener("keydown", initAudio);
window.addEventListener("pointerdown", initAudio);

/* ===================== KEYBOARD / KEYPAD ===================== */

const KEY_MAP = {
  "1": 0x1, "2": 0x2, "3": 0x3, "4": 0xC,
  "q": 0x4, "w": 0x5, "e": 0x6, "r": 0xD,
  "a": 0x7, "s": 0x8, "d": 0x9, "f": 0xE,
  "z": 0xA, "x": 0x0, "c": 0xB, "v": 0xF
};

// CHIP-8 pad order: 1 2 3 C / 4 5 6 D / 7 8 9 E / A 0 B F
const PAD_LAYOUT = [
  { chip: 0x1, kb: "1" }, { chip: 0x2, kb: "2" }, { chip: 0x3, kb: "3" }, { chip: 0xC, kb: "4" },
  { chip: 0x4, kb: "Q" }, { chip: 0x5, kb: "W" }, { chip: 0x6, kb: "E" }, { chip: 0xD, kb: "R" },
  { chip: 0x7, kb: "A" }, { chip: 0x8, kb: "S" }, { chip: 0x9, kb: "D" }, { chip: 0xE, kb: "F" },
  { chip: 0xA, kb: "Z" }, { chip: 0x0, kb: "X" }, { chip: 0xB, kb: "C" }, { chip: 0xF, kb: "V" }
];

const keypadEl = document.getElementById("keypad");
const padCells = [];

PAD_LAYOUT.forEach(({ chip, kb }) => {
  const cell = document.createElement("div");
  cell.className = "pad-key";
  cell.innerHTML = '<span class="chip">' + chip.toString(16).toUpperCase() +
                   '</span><span class="kb">' + kb + '</span>';
  const press = e => { if (e) e.preventDefault(); initAudio(); keys[chip] = 1; };
  const release = e => { if (e) e.preventDefault(); keys[chip] = 0; };
  cell.addEventListener("mousedown", press);
  cell.addEventListener("mouseup", release);
  cell.addEventListener("mouseleave", release);
  cell.addEventListener("touchstart", press, { passive: false });
  cell.addEventListener("touchend", release, { passive: false });
  cell.addEventListener("touchcancel", release, { passive: false });
  keypadEl.appendChild(cell);
  padCells[chip] = cell;
});

window.addEventListener("keydown", e => {
  const k = KEY_MAP[e.key.toLowerCase()];
  if (k !== undefined) {
    e.preventDefault();
    keys[k] = 1;
  }
});

window.addEventListener("keyup", e => {
  const k = KEY_MAP[e.key.toLowerCase()];
  if (k !== undefined) {
    e.preventDefault();
    keys[k] = 0;
  }
});

function updatePad() {
  for (let k = 0; k < 16; k++) {
    padCells[k].classList.toggle("active", keys[k] === 1);
  }
}

/* ===================== DEBUGGER UI ===================== */

const regGrid = document.getElementById("regGrid");
const regVals = [];
for (let r = 0; r < 16; r++) {
  const div = document.createElement("div");
  div.className = "reg";
  div.innerHTML = '<span class="name">V' + r.toString(16).toUpperCase() +
                  '</span><span class="val">00</span>';
  regGrid.appendChild(div);
  regVals.push(div.querySelector(".val"));
}

const statusEl = document.getElementById("status");
const dbgI = document.getElementById("dbgI");
const dbgPC = document.getElementById("dbgPC");
const dbgDT = document.getElementById("dbgDT");
const dbgST = document.getElementById("dbgST");
const dbgRaw = document.getElementById("dbgRaw");
const dbgMnem = document.getElementById("dbgMnem");
const dbgStack = document.getElementById("dbgStack");

function updateDebugger() {
  for (let r = 0; r < 16; r++) regVals[r].textContent = hex2(V[r]);
  dbgI.textContent = hex4(I & 0xFFFF);
  dbgPC.textContent = hex4(pc);
  dbgDT.textContent = hex2(delayTimer & 0xFF);
  dbgST.textContent = hex2(soundTimer & 0xFF);

  const op = (memory[pc] << 8) | memory[pc + 1];
  dbgRaw.textContent = "0x" + hex4(op);
  dbgMnem.textContent = disassemble(op);

  if (stack.length === 0) {
    dbgStack.innerHTML = '<span class="empty">empty</span>';
  } else {
    dbgStack.textContent = stack.map(a => "0x" + hex3(a & 0xFFF)).join("  ");
  }

  let text, cls;
  if (errorMsg)            { text = errorMsg;          cls = "st-error"; }
  else if (waitingForKey !== null) { text = "Waiting for key"; cls = "st-waiting"; }
  else if (running)        { text = "Running";         cls = "st-running"; }
  else                     { text = "Paused";          cls = "st-paused"; }
  statusEl.textContent = text;
  statusEl.className = cls;
}

/* ===================== ROM LOADING / RESET ===================== */

function reset() {
  memory.fill(0);
  V.fill(0);
  gfx.fill(0);
  keys.fill(0);
  I = 0;
  pc = 0x200;
  stack = [];
  delayTimer = 0;
  soundTimer = 0;
  waitingForKey = null;
  errorMsg = null;
  memory.set(FONT_SET, 0x50);
  memory.set(currentRom, 0x200);
  drawFlag = true;
  render();
  drawFlag = false;
  updateDebugger();
  updatePad();
}

document.getElementById("btnRun").addEventListener("click", () => {
  initAudio();
  if (!errorMsg) running = true;
  updateDebugger();
});

document.getElementById("btnPause").addEventListener("click", () => {
  running = false;
  updateDebugger();
});

document.getElementById("btnStep").addEventListener("click", () => {
  if (running) running = false;
  cycle();
  if (drawFlag) { render(); drawFlag = false; }
  updateDebugger();
  updatePad();
});

document.getElementById("btnReset").addEventListener("click", () => {
  running = false;
  reset();
});

document.getElementById("btnDemo").addEventListener("click", () => {
  currentRom = DEMO_ROM;
  running = false;
  reset();
});

document.getElementById("romInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = new Uint8Array(reader.result);
    if (data.length > 4096 - 0x200) {
      errorMsg = "ROM too large (" + data.length + " bytes)";
      running = false;
      updateDebugger();
      return;
    }
    currentRom = data;
    running = false;
    reset();
  };
  reader.onerror = () => {
    errorMsg = "Failed to read ROM file";
    updateDebugger();
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
});

const speedSlider = document.getElementById("speed");
const speedVal = document.getElementById("speedVal");
speedSlider.addEventListener("input", () => {
  speed = parseInt(speedSlider.value, 10);
  speedVal.textContent = speed;
});

/* ===================== MAIN LOOP ===================== */

let lastTime = performance.now();
let timerAcc = 0;
const TIMER_INTERVAL = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - lastTime;
  lastTime = now;

  if (running && !errorMsg) {
    for (let i = 0; i < speed; i++) {
      cycle();
      if (errorMsg) break;
    }
  }

  if (running) {
    timerAcc += dt;
    while (timerAcc >= TIMER_INTERVAL) {
      timerAcc -= TIMER_INTERVAL;
      if (delayTimer > 0) delayTimer--;
      if (soundTimer > 0) soundTimer--;
    }
  } else {
    timerAcc = 0;
  }

  updateSound();

  if (drawFlag) {
    render();
    drawFlag = false;
  }

  updateDebugger();
  updatePad();
}

/* ===================== BOOT ===================== */

reset();
requestAnimationFrame(loop);
</script>
</body>
