<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Battle</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, sans-serif;
      background-color: #030d14;
      color: #e6edf3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0f1c2e, #030a13 60%);
    }

    #gameContainer {
      position: relative;
      width: min(90vw, 640px);
      padding: 1rem;
      border-radius: 18px;
      background: rgba(9, 18, 28, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    #hud {
      width: 100%;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    #scoreBoard {
      flex: 1;
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .score-slot {
      flex: 1;
      min-width: 140px;
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .score-slot strong {
      font-size: 1.2rem;
    }

    #modeLabel {
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #030d14;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 13, 20, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .overlay .panel {
      background: rgba(7, 13, 22, 0.95);
      border-radius: 18px;
      padding: 2rem;
      text-align: center;
      width: min(320px, 100%);
    }

    .overlay input[type="radio"] {
      margin-right: 0.5rem;
    }

    .overlay button {
      margin-top: 1rem;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #4effae, #4facfe);
      color: #03121c;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      #gameContainer {
        padding: 0.5rem;
      }

      .overlay .panel {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div id="scoreBoard">
        <div class="score-slot"><span>Ready</span><strong>0</strong><span class="status">Pick a mode</span></div>
      </div>
      <div id="modeLabel">Mode: Menu</div>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div class="overlay" id="menuOverlay">
      <div class="panel">
        <h1>Snake Battle</h1>
        <p>Select how you want to play:</p>
        <div>
          <label><input type="radio" name="mode" value="human_v_human" checked /> Human vs Human</label>
        </div>
        <div>
          <label><input type="radio" name="mode" value="cpu_v_human" /> CPU vs Human</label>
        </div>
        <div>
          <label><input type="radio" name="mode" value="cpu_v_cpu" /> CPU vs CPU</label>
        </div>
        <button id="startButton">Start Game</button>
        <p style="margin-top:1rem;font-size:0.85rem;color:#8da2bc;">Arrow keys control player 1, WASD controls player 2.</p>
      </div>
    </div>
    <div class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <h1 id="gameOverTitle">Game Over</h1>
        <p id="gameOverMessage">Beware of the walls and yourself.</p>
        <p style="margin-top:1rem;color:#8da2bc;">Press Enter or Space to restart.</p>
      </div>
    </div>
  </div>
  <script>
    const GRID_SIZE = 30;
    const CELL_SIZE = 20;
    const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreBoardEl = document.getElementById("scoreBoard");
    const modeLabelEl = document.getElementById("modeLabel");
    const menuOverlay = document.getElementById("menuOverlay");
    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const gameOverMessageEl = document.getElementById("gameOverMessage");
    const gameOverTitleEl = document.getElementById("gameOverTitle");
    const startButton = document.getElementById("startButton");

    const MODE_CONFIGS = {
      human_v_human: {
        label: "Human vs Human",
        snakes: [
          {
            name: "Player 1",
            type: "human",
            controls: "arrows",
            color: "#4effae",
            initialDirection: { x: 1, y: 0 }
          },
          {
            name: "Player 2",
            type: "human",
            controls: "wasd",
            color: "#ff6f61",
            initialDirection: { x: -1, y: 0 }
          }
        ]
      },
      cpu_v_human: {
        label: "CPU vs Human",
        snakes: [
          {
            name: "CPU Snake",
            type: "cpu",
            color: "#fbd86a",
            initialDirection: { x: -1, y: 0 }
          },
          {
            name: "Player",
            type: "human",
            controls: "arrows",
            color: "#4effae",
            initialDirection: { x: 1, y: 0 }
          }
        ]
      },
      cpu_v_cpu: {
        label: "CPU vs CPU",
        snakes: [
          {
            name: "CPU 1",
            type: "cpu",
            color: "#fbd86a",
            initialDirection: { x: 1, y: 0 }
          },
          {
            name: "CPU 2",
            type: "cpu",
            color: "#ff6f61",
            initialDirection: { x: -1, y: 0 }
          }
        ]
      }
    };

    const ARROW_KEYS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
    const WASD_KEYS = ["w", "a", "s", "d"];
    const DIRECTION_MAP = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      a: { x: -1, y: 0 },
      s: { x: 0, y: 1 },
      d: { x: 1, y: 0 }
    };

    const DIRECTIONS = [
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: 0 },
      { x: 1, y: 0 }
    ];

    let snakes = [];
    let food = { x: 0, y: 0 };
    let gameInterval = null;
    let state = "menu";
    let currentMode = "human_v_human";

    function createSnake(index, config) {
      const startPositions = [
        { x: 6, y: 15 },
        { x: 23, y: 15 }
      ];
      const start = startPositions[index % startPositions.length];
      const body = [];
      for (let i = 0; i < 4; i++) {
        body.push({
          x: start.x - i * config.initialDirection.x,
          y: start.y - i * config.initialDirection.y
        });
      }
      return {
        name: config.name,
        color: config.color,
        type: config.type,
        controls: config.controls,
        direction: { ...config.initialDirection },
        nextDirection: { ...config.initialDirection },
        body,
        score: 0,
        alive: true
      };
    }

    function startGame(modeKey) {
      currentMode = modeKey;
      const mode = MODE_CONFIGS[modeKey];
      snakes = mode.snakes.map((cfg, index) => createSnake(index, cfg));
      spawnFood();
      updateScoreBoard();
      modeLabelEl.textContent = `Mode: ${mode.label}`;
      state = "running";
      gameOverOverlay.classList.add("hidden");
      menuOverlay.classList.add("hidden");
      drawScene();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 120);
    }

    function spawnFood() {
      let candidate;
      do {
        candidate = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
      } while (isPositionOccupied(candidate));
      food = candidate;
    }

    function isPositionOccupied(pos) {
      return snakes.some((snake) =>
        snake.body.some((segment) => segment.x === pos.x && segment.y === pos.y)
      );
    }

    function updateGame() {
      if (state !== "running") return;
      for (const snake of snakes) {
        if (!snake.alive) continue;
        const newDirection = snake.type === "human" ? snake.nextDirection : getCpuDirection(snake);
        if (isOppositeDirection(newDirection, snake.direction)) {
          // avoid instant reversal
        } else {
          snake.direction = newDirection;
        }
        const head = snake.body[0];
        const newHead = {
          x: head.x + snake.direction.x,
          y: head.y + snake.direction.y
        };
        if (isWallCollision(newHead)) {
          return triggerGameOver(`${snake.name} hit the wall.`);
        }
        if (isSelfCollision(newHead, snake)) {
          return triggerGameOver(`${snake.name} ran into itself.`);
        }
        if (isOtherCollision(newHead, snake)) {
          return triggerGameOver(`${snake.name} hit another snake.`);
        }
        const ateFood = newHead.x === food.x && newHead.y === food.y;
        snake.body.unshift(newHead);
        if (!ateFood) {
          snake.body.pop();
        } else {
          snake.score += 1;
          spawnFood();
        }
      }
      updateScoreBoard();
      drawScene();
    }

    function isWallCollision(head) {
      return head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
    }

    function isSelfCollision(pos, snake) {
      return snake.body.some((segment) => segment.x === pos.x && segment.y === pos.y);
    }

    function isOtherCollision(pos, snake) {
      return snakes.some((other) =>
        other !== snake && other.body.some((segment) => segment.x === pos.x && segment.y === pos.y)
      );
    }

    function triggerGameOver(message) {
      if (gameInterval) clearInterval(gameInterval);
      state = "gameover";
      gameOverMessageEl.textContent = message;
      gameOverTitleEl.textContent = "Game Over";
      gameOverOverlay.classList.remove("hidden");
      drawScene();
    }

    function updateScoreBoard() {
      if (!snakes.length) {
        scoreBoardEl.innerHTML = `<div class="score-slot"><span>Ready</span><strong>0</strong><span class="status">Pick a mode</span></div>`;
        return;
      }
      scoreBoardEl.innerHTML = snakes
        .map((snake) => {
          const status = snake.alive ? "Alive" : "Crashed";
          return `
            <div class="score-slot" style="border: 1px solid ${snake.color};">
              <span>${snake.name}</span>
              <strong>${snake.score}</strong>
              <span class="status">${status}</span>
            </div>
          `;
        })
        .join("");
    }

    function drawScene() {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.fillStyle = "#030d14";
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        const offset = i * CELL_SIZE;
        ctx.beginPath();
        ctx.moveTo(offset, 0);
        ctx.lineTo(offset, CANVAS_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, offset);
        ctx.lineTo(CANVAS_SIZE, offset);
        ctx.stroke();
      }
      ctx.fillStyle = "#ffcc00";
      drawCell(food.x, food.y);
      for (const snake of snakes) {
        ctx.fillStyle = snake.color;
        snake.body.forEach((segment, index) => {
          if (index === 0) {
            ctx.fillStyle = shadeColor(snake.color, -15);
            drawCell(segment.x, segment.y);
            ctx.fillStyle = snake.color;
          } else {
            drawCell(segment.x, segment.y);
          }
        });
      }
    }

    function drawCell(x, y) {
      ctx.fillRect(x * CELL_SIZE + 1, y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    }

    function shadeColor(color, percent) {
      const f = parseInt(color.slice(1), 16);
      const t = percent < 0 ? 0 : 255;
      const p = Math.abs(percent) / 100;
      const R = f >> 16;
      const G = (f >> 8) & 0x00ff;
      const B = f & 0x0000ff;
      const newR = Math.round((t - R) * p + R);
      const newG = Math.round((t - G) * p + G);
      const newB = Math.round((t - B) * p + B);
      return `#${(newR << 16 | newG << 8 | newB).toString(16).padStart(6, "0")}`;
    }

    function isOppositeDirection(dirA, dirB) {
      return dirA.x === -dirB.x && dirA.y === -dirB.y;
    }

    function getCpuDirection(snake) {
      const path = findPathToFood(snake);
      if (path && path.length >= 2) {
        const next = path[1];
        const desired = { x: next.x - snake.body[0].x, y: next.y - snake.body[0].y };
        if (!isOppositeDirection(desired, snake.direction)) {
          return desired;
        }
      }
      const safeMoves = DIRECTIONS.filter((direction) => !isOppositeDirection(direction, snake.direction)).filter(
        (direction) => {
          const head = snake.body[0];
          const lookahead = { x: head.x + direction.x, y: head.y + direction.y };
          return (
            lookahead.x >= 0 &&
            lookahead.x < GRID_SIZE &&
            lookahead.y >= 0 &&
            lookahead.y < GRID_SIZE &&
            !isPositionOccupiedByAnySnake(lookahead, snake)
          );
        }
      );
      if (safeMoves.length) {
        return safeMoves[Math.floor(Math.random() * safeMoves.length)];
      }
      return snake.direction;
    }

    function isPositionOccupiedByAnySnake(position, ignoreSnake) {
      return snakes.some((snake) =>
        snake !== ignoreSnake && snake.body.some((segment) => segment.x === position.x && segment.y === position.y)
      ) || ignoreSnake.body.some((segment) => segment.x === position.x && segment.y === position.y);
    }

    function findPathToFood(snake) {
      const start = snake.body[0];
      const targetKey = `${food.x},${food.y}`;
      const queue = [{ x: start.x, y: start.y }];
      const visited = new Set([`${start.x},${start.y}`]);
      const parent = new Map();
      const blocked = new Set();
      snakes.forEach((other) =>
        other.body.forEach((segment) => blocked.add(`${segment.x},${segment.y}`))
      );
      blocked.delete(`${snake.body[snake.body.length - 1].x},${snake.body[snake.body.length - 1].y}`);
      while (queue.length) {
        const current = queue.shift();
        const key = `${current.x},${current.y}`;
        if (key === targetKey) {
          const path = [];
          let step = key;
          while (step) {
            const [x, y] = step.split(",").map(Number);
            path.unshift({ x, y });
            step = parent.get(step);
          }
          return path;
        }
        for (const direction of DIRECTIONS) {
          const next = { x: current.x + direction.x, y: current.y + direction.y };
          const nextKey = `${next.x},${next.y}`;
          if (
            next.x < 0 ||
            next.x >= GRID_SIZE ||
            next.y < 0 ||
            next.y >= GRID_SIZE ||
            visited.has(nextKey) ||
            blocked.has(nextKey)
          ) {
            continue;
          }
          visited.add(nextKey);
          parent.set(nextKey, key);
          queue.push(next);
        }
      }
      return null;
    }

    document.querySelectorAll("input[name=mode]").forEach((input) => {
      input.addEventListener("change", (event) => {
        currentMode = event.target.value;
        modeLabelEl.textContent = `Mode: ${MODE_CONFIGS[currentMode].label}`;
      });
    });

    startButton.addEventListener("click", () => startGame(currentMode));

    window.addEventListener("keydown", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (state === "menu" && event.key === "Enter") {
        startGame(currentMode);
        event.preventDefault();
        return;
      }
      if (state === "gameover" && (event.key === "Enter" || event.key === " ")) {
        startGame(currentMode);
        event.preventDefault();
        return;
      }
      if (state !== "running") return;
      if (ARROW_KEYS.includes(event.key)) {
        applyHumanInput(event.key);
        event.preventDefault();
      } else if (WASD_KEYS.includes(key)) {
        applyHumanInput(key);
        event.preventDefault();
      }
    });

    function applyHumanInput(normalizedKey) {
      for (const snake of snakes) {
        if (!snake.alive || snake.type !== "human") continue;
        const usesWasd = snake.controls === "wasd";
        const usesArrows = snake.controls === "arrows";
        if (usesWasd && WASD_KEYS.includes(normalizedKey)) {
          const direction = DIRECTION_MAP[normalizedKey];
          if (direction && !isOppositeDirection(direction, snake.direction)) {
            snake.nextDirection = direction;
          }
        } else if (usesArrows && ARROW_KEYS.includes(normalizedKey === "w" ? "" : normalizedKey)) {
          const direction = DIRECTION_MAP[normalizedKey];
          if (direction && !isOppositeDirection(direction, snake.direction)) {
            snake.nextDirection = direction;
          }
        }
      }
    }

    // Initial draw once
    drawScene();
  </script>
</body>
</html>
