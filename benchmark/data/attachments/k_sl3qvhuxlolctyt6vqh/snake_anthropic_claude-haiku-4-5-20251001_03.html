<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(30, 20px);
            grid-template-rows: repeat(30, 20px);
            gap: 1px;
            background-color: #1a1a2e;
            padding: 10px;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 20px;
            height: 20px;
            background-color: #16213e;
            border: 1px solid #0f3460;
        }

        .cell.snake1 {
            background-color: #00ff00;
            box-shadow: inset 0 0 3px rgba(0, 255, 0, 0.5);
        }

        .cell.snake1-head {
            background-color: #00cc00;
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.8);
        }

        .cell.snake2 {
            background-color: #ff6b6b;
            box-shadow: inset 0 0 3px rgba(255, 107, 107, 0.5);
        }

        .cell.snake2-head {
            background-color: #ff4444;
            box-shadow: inset 0 0 5px rgba(255, 68, 68, 0.8);
        }

        .cell.food {
            background-color: #ffd700;
            box-shadow: inset 0 0 5px rgba(255, 215, 0, 0.8);
            border-radius: 50%;
        }

        .info-panel {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            min-width: 200px;
        }

        .score-display {
            margin: 15px 0;
            font-size: 1.2em;
        }

        .score-display.player1 {
            color: #00cc00;
            font-weight: bold;
        }

        .score-display.player2 {
            color: #ff4444;
            font-weight: bold;
        }

        .mode-display {
            background-color: #667eea;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }

        .menu {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }

        .menu h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-human-vs-human {
            background-color: #667eea;
            color: white;
        }

        .btn-cpu-vs-human {
            background-color: #764ba2;
            color: white;
        }

        .btn-cpu-vs-cpu {
            background-color: #f093fb;
            color: white;
        }

        .btn-restart {
            background-color: #667eea;
            color: white;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        .game-over-screen {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
        }

        .game-over-screen h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .winner-text {
            font-size: 1.5em;
            margin: 20px 0;
            font-weight: bold;
        }

        .final-scores {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .final-scores p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .instructions {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .instructions h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .instructions p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 SNAKE GAME 🐍</h1>
        
        <div id="startMenu" class="menu">
            <h2>Select Game Mode</h2>
            <div class="menu-buttons">
                <button class="btn-human-vs-human" onclick="startGame('human-vs-human')">
                    👤 vs 👤 Human vs Human
                </button>
                <button class="btn-cpu-vs-human" onclick="startGame('cpu-vs-human')">
                    🤖 vs 👤 CPU vs Human
                </button>
                <button class="btn-cpu-vs-cpu" onclick="startGame('cpu-vs-cpu')">
                    🤖 vs 🤖 CPU vs CPU
                </button>
            </div>
            <div class="instructions">
                <h3>Controls:</h3>
                <p><strong>Player 1 (Green):</strong> Arrow Keys or WASD</p>
                <p><strong>Player 2 (Red):</strong> IJKL or Numpad</p>
                <p>CPU snakes automatically search for food</p>
            </div>
        </div>

        <div id="gameContainer" class="hidden">
            <div class="game-wrapper">
                <div class="game-board" id="gameBoard"></div>
                <div class="info-panel">
                    <div class="mode-display" id="modeDisplay"></div>
                    <div class="score-display player1">
                        🟢 Player 1: <span id="score1">0</span>
                    </div>
                    <div class="score-display player2">
                        🔴 Player 2: <span id="score2">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h2>GAME OVER!</h2>
            <div class="winner-text" id="winnerText"></div>
            <div class="final-scores">
                <p>🟢 Player 1 Score: <span id="finalScore1">0</span></p>
                <p>🔴 Player 2 Score: <span id="finalScore2">0</span></p>
            </div>
            <button class="btn-restart" onclick="returnToMenu()">Return to Menu</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 30;
        const CELL_SIZE = 20;
        const INITIAL_SPEED = 100;

        let gameState = {
            snake1: [{ x: 5, y: 15 }],
            snake2: [{ x: 25, y: 15 }],
            direction1: { x: 1, y: 0 },
            direction2: { x: -1, y: 0 },
            nextDirection1: { x: 1, y: 0 },
            nextDirection2: { x: -1, y: 0 },
            food: { x: 15, y: 15 },
            score1: 0,
            score2: 0,
            gameRunning: false,
            gameMode: null,
            gameSpeed: INITIAL_SPEED,
            gameLoopId: null
        };

        function startGame(mode) {
            gameState.gameMode = mode;
            gameState.gameRunning = true;
            gameState.snake1 = [{ x: 5, y: 15 }];
            gameState.snake2 = [{ x: 25, y: 15 }];
            gameState.direction1 = { x: 1, y: 0 };
            gameState.direction2 = { x: -1, y: 0 };
            gameState.nextDirection1 = { x: 1, y: 0 };
            gameState.nextDirection2 = { x: -1, y: 0 };
            gameState.score1 = 0;
            gameState.score2 = 0;
            gameState.gameSpeed = INITIAL_SPEED;
            
            generateFood();
            
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            updateModeDisplay();
            updateScoreDisplay();
            render();
            
            if (gameState.gameLoopId) clearInterval(gameState.gameLoopId);
            gameState.gameLoopId = setInterval(gameLoop, gameState.gameSpeed);
            
            document.addEventListener('keydown', handleKeyPress);
        }

        function updateModeDisplay() {
            const modeText = {
                'human-vs-human': '👤 Human vs Human',
                'cpu-vs-human': '🤖 CPU vs Human',
                'cpu-vs-cpu': '🤖 CPU vs CPU'
            };
            document.getElementById('modeDisplay').textContent = modeText[gameState.gameMode];
        }

        function handleKeyPress(e) {
            if (!gameState.gameRunning) return;

            const key = e.key.toLowerCase();
            
            // Player 1 controls (Arrow Keys or WASD)
            if (key === 'arrowup' || key === 'w') {
                if (gameState.direction1.y === 0) gameState.nextDirection1 = { x: 0, y: -1 };
            } else if (key === 'arrowdown' || key === 's') {
                if (gameState.direction1.y === 0) gameState.nextDirection1 = { x: 0, y: 1 };
            } else if (key === 'arrowleft' || key === 'a') {
                if (gameState.direction1.x === 0) gameState.nextDirection1 = { x: -1, y: 0 };
            } else if (key === 'arrowright' || key === 'd') {
                if (gameState.direction1.x === 0) gameState.nextDirection1 = { x: 1, y: 0 };
            }
            
            // Player 2 controls (IJKL or Numpad)
            if (key === 'i' || key === '8') {
                if (gameState.direction2.y === 0) gameState.nextDirection2 = { x: 0, y: -1 };
            } else if (key === 'k' || key === '2') {
                if (gameState.direction2.y === 0) gameState.nextDirection2 = { x: 0, y: 1 };
            } else if (key === 'j' || key === '4') {
                if (gameState.direction2.x === 0) gameState.nextDirection2 = { x: -1, y: 0 };
            } else if (key === 'l' || key === '6') {
                if (gameState.direction2.x === 0) gameState.nextDirection2 = { x: 1, y: 0 };
            }
        }

        function gameLoop() {
            if (!gameState.gameRunning) return;

            // Handle CPU movement
            if (gameState.gameMode === 'cpu-vs-human' || gameState.gameMode === 'cpu-vs-cpu') {
                if (gameState.gameMode === 'cpu-vs-human') {
                    gameState.nextDirection2 = getCPUDirection(gameState.snake2);
                } else {
                    gameState.nextDirection1 = getCPUDirection(gameState.snake1);
                    gameState.nextDirection2 = getCPUDirection(gameState.snake2);
                }
            }

            // Update directions
            gameState.direction1 = gameState.nextDirection1;
            gameState.direction2 = gameState.nextDirection2;

            // Move snakes
            moveSnake(1);
            moveSnake(2);

            // Check collisions
            if (checkCollisions()) {
                endGame();
                return;
            }

            // Check food collision
            checkFoodCollision(1);
            checkFoodCollision(2);

            render();
        }

        function getCPUDirection(snake) {
            const head = snake[0];
            const directions = [
                { x: 1, y: 0 },
                { x: -1, y: 0 },
                { x: 0, y: 1 },
                { x: 0, y: -1 }
            ];

            // Simple pathfinding: move towards food
            let bestDirection = directions[0];
            let bestDistance = Infinity;

            for (let dir of directions) {
                const newX = head.x + dir.x;
                const newY = head.y + dir.y;

                // Check if direction is valid (not going backwards)
                if (dir.x === -gameState.direction1.x && dir.y === -gameState.direction1.y && snake === gameState.snake1) continue;
                if (dir.x === -gameState.direction2.x && dir.y === -gameState.direction2.y && snake === gameState.snake2) continue;

                // Check if within bounds
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) continue;

                // Calculate distance to food
                const distance = Math.abs(newX - gameState.food.x) + Math.abs(newY - gameState.food.y);

                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestDirection = dir;
                }
            }

            return bestDirection;
        }

        function moveSnake(playerNum) {
            const snake = playerNum === 1 ? gameState.snake1 : gameState.snake2;
            const direction = playerNum === 1 ? gameState.direction1 : gameState.direction2;

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            snake.unshift(newHead);
            snake.pop();
        }

        function checkCollisions() {
            // Check wall collisions
            if (gameState.snake1[0].x < 0 || gameState.snake1[0].x >= GRID_SIZE ||
                gameState.snake1[0].y < 0 || gameState.snake1[0].y >= GRID_SIZE) {
                return true;
            }

            if (gameState.snake2[0].x < 0 || gameState.snake2[0].x >= GRID_SIZE ||
                gameState.snake2[0].y < 0 || gameState.snake2[0].y >= GRID_SIZE) {
                return true;
            }

            // Check self collision
            for (let i = 1; i < gameState.snake1.length; i++) {
                if (gameState.snake1[0].x === gameState.snake1[i].x &&
                    gameState.snake1[0].y === gameState.snake1[i].y) {
                    return true;
                }
            }

            for (let i = 1; i < gameState.snake2.length; i++) {
                if (gameState.snake2[0].x === gameState.snake2[i].x &&
                    gameState.snake2[0].y === gameState.snake2[i].y) {
                    return true;
                }
            }

            // Check head-to-head collision
            if (gameState.snake1[0].x === gameState.snake2[0].x &&
                gameState.snake1[0].y === gameState.snake2[0].y) {
                return true;
            }

            // Check if snake1 hits snake2's body
            for (let segment of gameState.snake2) {
                if (gameState.snake1[0].x === segment.x &&
                    gameState.snake1[0].y === segment.y) {
                    return true;
                }
            }

            // Check if snake2 hits snake1's body
            for (let segment of gameState.snake1) {
                if (gameState.snake2[0].x === segment.x &&
                    gameState.snake2[0].y === segment.y) {
                    return true;
                }
            }

            return false;
        }

        function checkFoodCollision(playerNum) {
            const snake = playerNum === 1 ? gameState.snake1 : gameState.snake2;

            if (snake[0].x === gameState.food.x && snake[0].y === gameState.food.y) {
                if (playerNum === 1) {
                    gameState.score1++;
                    snake.push({ ...snake[snake.length - 1] });
                } else {
                    gameState.score2++;
                    snake.push({ ...snake[snake.length - 1] });
                }

                generateFood();
                updateScoreDisplay();
            }
        }

        function generateFood() {
            let newFood;
            let validPosition = false;

            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };

                validPosition = true;

                // Check if food is on snake1
                for (let segment of gameState.snake1) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }

                // Check if food is on snake2
                if (validPosition) {
                    for (let segment of gameState.snake2) {
                        if (segment.x === newFood.x && segment.y === newFood.y) {
                            validPosition = false;
                            break;
                        }
                    }
                }
            }

            gameState.food = newFood;
        }

        function updateScoreDisplay() {
            document.getElementById('score1').textContent = gameState.score1;
            document.getElementById('score2').textContent = gameState.score2;
        }

        function render() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    // Check if food
                    if (gameState.food.x === x && gameState.food.y === y) {
                        cell.classList.add('food');
                    }

                    // Check if snake1
                    for (let i = 0; i < gameState.snake1.length; i++) {
                        if (gameState.snake1[i].x === x && gameState.snake1[i].y === y) {
                            if (i === 0) {
                                cell.classList.add('snake1-head');
                            } else {
                                cell.classList.add('snake1');
                            }
                        }
                    }

                    // Check if snake2
                    for (let i = 0; i < gameState.snake2.length; i++) {
                        if (gameState.snake2[i].x === x && gameState.snake2[i].y === y) {
                            if (i === 0) {
                                cell.classList.add('snake2-head');
                            } else {
                                cell.classList.add('snake2');
                            }
                        }
                    }

                    gameBoard.appendChild(cell);
                }
            }
        }

        function endGame() {
            gameState.gameRunning = false;
            clearInterval(gameState.gameLoopId);
            document.removeEventListener('keydown', handleKeyPress);

            let winnerText = '';
            if (gameState.score1 > gameState.score2) {
                winnerText = '🟢 Player 1 Wins!';
            } else if (gameState.score2 > gameState.score1) {
                winnerText = '🔴 Player 2 Wins!';
            } else {
                winnerText = "It's a Tie!";
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('finalScore1').textContent = gameState.score1;
            document.getElementById('finalScore2').textContent = gameState.score2;

            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function returnToMenu() {
            document.getElementById('startMenu').classList.remove('hidden');
            document.getElementById('gameContainer').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
        }
    </script>
</body>
</html>
