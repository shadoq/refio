<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gouraud-Shaded Rotating Cube (Canvas 2D)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 1px solid #555;
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            line-height: 1.4;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // State
        let wireframe = false;
        let paused = false;
        let lastTime = performance.now();
        let fps = 0;
        let frameCount = 0;

        // Light source position (moving)
        const light = { x: 5, y: 5, z: 5 };
        const lightColor = { r: 1, g: 1, b: 1 }; // white

        // Camera settings
        const fov = 250; // field of view (pixels)
        const eyeZ = 300; // distance from origin to camera plane

        // Cube vertices (local space)
        const vertices = [
            { x: -1, y: -1, z: -1 }, // 0
            { x:  1, y: -1, z: -1 }, // 1
            { x:  1, y:  1, z: -1 }, // 2
            { x: -1, y:  1, z: -1 }, // 3
            { x: -1, y: -1, z:  1 }, // 4
            { x:  1, y: -1, z:  1 }, // 5
            { x:  1, y:  1, z:  1 }, // 6
            { x: -1, y:  1, z:  1 }  // 7
        ];

        // Cube faces (each face is a quad, split into two triangles)
        const faces = [
            // front face (z = -1)
            { v0: 0, v1: 1, v2: 2, v3: 0, v4: 2, v5: 3 },
            // back face (z = 1)
            { v0: 4, v1: 5, v2: 6, v3: 4, v4: 6, v5: 7 },
            // left face (x = -1)
            { v0: 0, v1: 3, v2: 7, v3: 0, v4: 7, v5: 4 },
            // right face (x = 1)
            { v0: 1, v1: 2, v2: 6, v3: 1, v4: 6, v5: 5 },
            // top face (y = 1)
            { v0: 3, v1: 2, v2: 6, v3: 3, v4: 6, v5: 7 },
            // bottom face (y = -1)
            { v0: 0, v1: 1, v2: 5, v3: 0, v4: 5, v5: 4 }
        ];

        // Rotation state
        let angleX = 0;
        let angleY = 0;

        // Keyboard listeners
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') wireframe = !wireframe;
            if (key === 'p') paused = !paused;
        });

        // Animation loop
        function animate(now) {
            if (!paused) {
                // Update rotation
                angleX += 0.01;
                angleY += 0.01;

                // Update light position (simple movement)
                light.x = 5 * Math.sin(now / 1000);
                light.y = 5 * Math.cos(now / 1000);
                light.z = 5;
            }

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw cube
            drawCube();

            // Update FPS counter
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                frameCount = 0;
                lastTime = now;
                updateInfo();
            }

            requestAnimationFrame(animate);
        }

        // 3D pipeline functions
        function rotateX(vertex, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const y = vertex.y * cos - vertex.z * sin;
            const z = vertex.y * sin + vertex.z * cos;
            return { x: vertex.x, y, z };
        }

        function rotateY(vertex, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const x = vertex.x * cos + vertex.z * sin;
            const z = -vertex.x * sin + vertex.z * cos;
            return { x, y: vertex.y, z };
        }

        function project(vertex) {
            const scale = fov / (fov + vertex.z + eyeZ);
            const x = vertex.x * scale * 100 + canvas.width / 2;
            const y = vertex.y * scale * 100 + canvas.height / 2;
            return { x, y };
        }

        function dot(v1, v2) {
            return v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
        }

        function normalize(v) {
            const len = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
            return { x: v.x / len, y: v.y / len, z: v.z / len };
        }

        function subtract(v1, v2) {
            return { x: v1.x - v2.x, y: v1.y - v2.y, z: v1.z - v2.z };
        }

        // Draw the cube
        function drawCube() {
            // Transform vertices
            const transformed = vertices.map(v => {
                let tv = { x: v.x, y: v.y, z: v.z };
                tv = rotateX(tv, angleX);
                tv = rotateY(tv, angleY);
                return tv;
            });

            // Draw each face
            faces.forEach(face => {
                // Get triangle 1 vertices
                const v0 = transformed[face.v0];
                const v1 = transformed[face.v1];
                const v2 = transformed[face.v2];
                // Get triangle 2 vertices
                const v3 = transformed[face.v3];
                const v4 = transformed[face.v4];
                const v5 = transformed[face.v5];

                // Project to 2D
                const p0 = project(v0);
                const p1 = project(v1);
                const p2 = project(v2);
                const p3 = project(v3);
                const p4 = project(v4);
                const p5 = project(v5);

                // Backface culling: compute normal of triangle (v0,v1,v2)
                const edge1 = subtract(v1, v0);
                const edge2 = subtract(v2, v0);
                const normal = {
                    x: edge1.y * edge2.z - edge1.z * edge2.y,
                    y: edge1.z * edge2.x - edge1.x * edge2.z,
                    z: edge1.x * edge2.y - edge1.y * edge2.x
                };
                const lightDir = normalize(light);
                const dotProduct = dot(normal, lightDir);
                if (dotProduct <= 0) return; // back face

                // Compute per-vertex lighting for triangle 1
                const n0 = normalize(normal);
                const n1 = normalize(subtract(v2, v1));
                const n2 = normalize(subtract(v3, v0));
                const l0 = dot(n0, lightDir);
                const l1 = dot(n1, lightDir);
                const l2 = dot(n2, lightDir);

                // Interpolate colors across triangle 1 (Gouraud)
                drawTriangle(p0, p1, p2, l0, l1, l2);

                // Compute per-vertex lighting for triangle 2
                const n3 = normalize(subtract(v4, v2));
                const n4 = normalize(subtract(v5, v3));
                const n5 = normalize(subtract(v5, v4));
                const l3 = dot(n3, lightDir);
                const l4 = dot(n4, lightDir);
                const l5 = dot(n5, lightDir);

                // Interpolate colors across triangle 2
                drawTriangle(p3, p4, p5, l3, l4, l5);
            });

            // Draw wireframe if toggled
            if (wireframe) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                faces.forEach(face => {
                    const pts = [
                        project(transformed[face.v0]),
                        project(transformed[face.v1]),
                        project(transformed[face.v2]),
                        project(transformed[face.v3]),
                        project(transformed[face.v4]),
                        project(transformed[face.v5])
                    ];
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    ctx.lineTo(pts[1].x, pts[1].y);
                    ctx.lineTo(pts[2].x, pts[2].y);
                    ctx.lineTo(pts[0].x, pts[0].y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(pts[3].x, pts[3].y);
                    ctx.lineTo(pts[4].x, pts[4].y);
                    ctx.lineTo(pts[5].x, pts[5].y);
                    ctx.lineTo(pts[3].x, pts[3].y);
                    ctx.stroke();
                });
            }
        }

        // Draw a triangle with Gouraud shading
        function drawTriangle(p0, p1, p2, l0, l1, l2) {
            // Clamp lighting to [0,1]
            l0 = Math.max(0, Math.min(1, l0));
            l1 = Math.max(0, Math.min(1, l1));
            l2 = Math.max(0, Math.min(1, l2));

            // Interpolate colors across edges
            for (let y = Math.floor(Math.min(p0.y, p1.y, p2.y)); y <= Math.floor(Math.max(p0.y, p1.y, p2.y)); y++) {
                // Compute x intersections with edges
                const edge1 = lineIntersection(p0, p1, y);
                const edge2 = lineIntersection(p0, p2, y);
                const edge3 = lineIntersection(p1, p2, y);

                if (!edge1 || !edge2 || !edge3) continue;
                const xLeft = Math.min(edge1.x, edge2.x, edge3.x);
                const xRight = Math.max(edge1.x, edge2.x, edge3.x);

                // Interpolate lighting across scanline
                for (let x = Math.floor(xLeft); x < Math.floor(xRight); x++) {
                    // Barycentric coordinates
                    const w0 = area(p1, p2, { x, y }) / area(p0, p1, p2);
                    const w1 = area(p0, p2, { x, y }) / area(p0, p1, p2);
                    const w2 = area(p0, p1, { x, y }) / area(p0, p1, p2);

                    const l = w0 * l0 + w1 * l1 + w2 * l2;
                    ctx.fillStyle = `rgb(${l * 255}, ${l * 255}, ${l * 255})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }

        // Helper: line intersection at given y
        function lineIntersection(p1, p2, y) {
            if (p1.y === p2.y) return null;
            const t = (y - p1.y) / (p2.y - p1.y);
            const x = p1.x + t * (p2.x - p1.x);
            return { x, y };
        }

        // Helper: area of triangle (abs)
        function area(p1, p2, p3) {
            return Math.abs((p2.x - p1.x) * (p3.y - p1.y) - (p3.x - p1.x) * (p2.y - p1.y)) / 2;
        }

        // Update info panel
        function updateInfo() {
            const info = document.getElementById('info');
            info.innerHTML = `
                Wireframe: ${wireframe ? 'ON' : 'OFF'} (W)<br>
                Paused: ${paused ? 'YES' : 'NO'} (P)<br>
                Light: (${light.x.toFixed(2)}, ${light.y.toFixed(2)}, ${light.z.toFixed(2)})<br>
                FPS: ${fps}
            `;
        }

        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
