<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Battle - 30x30</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #0a0a0a;
        }

        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00ff88;
            text-align: center;
            z-index: 100;
        }

        .menu h2 {
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .menu button {
            display: block;
            width: 100%;
            padding: 15px 30px;
            margin: 10px 0;
            font-size: 1.1em;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .score-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .controls-info {
            color: #888;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .controls-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Snake Battle - 30x30</h1>
        <div class="score-display" id="scoreDisplay"></div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div class="menu" id="startMenu">
            <h2>Select Game Mode</h2>
            <button onclick="startGame('human_vs_human')">Human vs Human</button>
            <button onclick="startGame('cpu_vs_human')">CPU vs Human</button>
            <button onclick="startGame('cpu_vs_cpu')">CPU vs CPU</button>
            <div class="controls-info">
                <p>Player 1: WASD keys</p>
                <p>Player 2: Arrow keys</p>
                <p>Press any key to restart after game over</p>
            </div>
        </div>

        <div class="menu hidden" id="gameOverMenu">
            <h2>Game Over!</h2>
            <p id="winnerText" style="color: #fff; margin: 20px 0; font-size: 1.2em;"></p>
            <p id="finalScores" style="color: #00ff88; margin: 10px 0;"></p>
            <button onclick="restartGame()">Play Again</button>
            <button onclick="showMainMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20;
        const GRID_COUNT = 30;
        const GAME_SPEED = 100;

        let snake1, snake2, food;
        let gameLoop;
        let currentMode;
        let isGameOver = false;
        let score1 = 0, score2 = 0;

        function initGame() {
            snake1 = {
                body: [{x: 5, y: 15}, {x: 4, y: 15}, {x: 3, y: 15}],
                direction: 'right',
                nextDirection: 'right',
                color: '#00ff88',
                isCPU: false
            };

            snake2 = {
                body: [{x: 24, y: 15}, {x: 25, y: 15}, {x: 26, y: 15}],
                direction: 'left',
                nextDirection: 'left',
                color: '#ff6b6b',
                isCPU: false
            };

            score1 = 0;
            score2 = 0;
            isGameOver = false;
            
            spawnFood();
            updateScoreDisplay();
        }

        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT)
                };
                
                validPosition = true;
                
                for (let segment of snake1.body) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
                
                if (validPosition) {
                    for (let segment of snake2.body) {
                        if (segment.x === food.x && segment.y === food.y) {
                            validPosition = false;
                            break;
                        }
                    }
                }
            }
        }

        function updateSnake(snake) {
            const head = {x: snake.body[0].x, y: snake.body[0].y};
            
            switch (snake.direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                return false;
            }

            for (let i = 0; i < snake.body.length - 1; i++) {
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                    return false;
                }
            }

            snake.body.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                if (snake === snake1) score1 += 10;
                else score2 += 10;
                spawnFood();
            } else {
                snake.body.pop();
            }

            return true;
        }

        function checkCollision(snake1, snake2) {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];

            for (let i = 0; i < snake2.body.length; i++) {
                if (head1.x === snake2.body[i].x && head1.y === snake2.body[i].y) {
                    return true;
                }
            }

            for (let i = 0; i < snake1.body.length; i++) {
                if (head2.x === snake1.body[i].x && head2.y === snake1.body[i].y) {
                    return true;
                }
            }

            return false;
        }

        function cpuAI(snake, otherSnake) {
            const head = snake.body[0];
            const directions = ['up', 'down', 'left', 'right'];
            let bestDirection = snake.direction;
            let bestScore = -Infinity;

            for (let dir of directions) {
                const newHead = {x: head.x, y: head.y};
                
                switch (dir) {
                    case 'up': newHead.y--; break;
                    case 'down': newHead.y++; break;
                    case 'left': newHead.x--; break;
                    case 'right': newHead.x++; break;
                }

                if (newHead.x < 0 || newHead.x >= GRID_COUNT || newHead.y < 0 || newHead.y >= GRID_COUNT) {
                    continue;
                }

                let collision = false;
                for (let i = 0; i < snake.body.length - 1; i++) {
                    if (newHead.x === snake.body[i].x && newHead.y === snake.body[i].y) {
                        collision = true;
                        break;
                    }
                }

                if (collision) continue;

                for (let segment of otherSnake.body) {
                    if (newHead.x === segment.x && newHead.y === segment.y) {
                        collision = true;
                        break;
                    }
                }

                if (collision) continue;

                let score = 0;
                const distanceToFood = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
                score -= distanceToFood;

                score += 100;

                const availableMoves = countAvailableMoves({x: newHead.x, y: newHead.y}, snake);
                score += availableMoves * 0.5;

                if (score > bestScore) {
                    bestScore = score;
                    bestDirection = dir;
                }
            }

            snake.nextDirection = bestDirection;
        }

        function countAvailableMoves(head, snake) {
            let count = 0;
            const directions = ['up', 'down', 'left', 'right'];

            for (let dir of directions) {
                const newHead = {x: head.x, y: head.y};
                
                switch (dir) {
                    case 'up': newHead.y--; break;
                    case 'down': newHead.y++; break;
                    case 'left': newHead.x--; break;
                    case 'right': newHead.x++; break;
                }

                if (newHead.x >= 0 && newHead.x < GRID_COUNT && newHead.y >= 0 && newHead.y < GRID_COUNT) {
                    let collision = false;
                    for (let i = 0; i < snake.body.length - 1; i++) {
                        if (newHead.x === snake.body[i].x && newHead.y === snake.body[i].y) {
                            collision = true;
                            break;
                        }
                    }
                    if (!collision) count++;
                }
            }

            return count;
        }

        function update() {
            if (isGameOver) return;

            if (snake1.isCPU) {
                cpuAI(snake1, snake2);
            }
            if (snake2.isCPU) {
                cpuAI(snake2, snake1);
            }

            snake1.direction = snake1.nextDirection;
            snake2.direction = snake2.nextDirection;

            const snake1Alive = updateSnake(snake1);
            const snake2Alive = updateSnake(snake2);

            if (checkCollision(snake1, snake2)) {
                snake1Alive = false;
                snake2Alive = false;
            }

            if (!snake1Alive || !snake2Alive) {
                endGame(snake1Alive, snake2Alive);
                return;
            }

            updateScoreDisplay();
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < snake1.body.length; i++) {
                const segment = snake1.body[i];
                ctx.fillStyle = i === 0 ? '#00ff88' : '#00cc6a';
                ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 4, 4, 4);
                    ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 4, 4, 4);
                }
            }

            for (let i = 0; i < snake2.body.length; i++) {
                const segment = snake2.body[i];
                ctx.fillStyle = i === 0 ? '#ff6b6b' : '#cc5555';
                ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 4, 4, 4);
                    ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 4, 4, 4);
                }
            }
        }

        function gameStep() {
            update();
            draw();
        }

        function startGame(mode) {
            currentMode = mode;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');

            snake1.isCPU = (mode === 'cpu_vs_human' || mode === 'cpu_vs_cpu');
            snake2.isCPU = (mode === 'cpu_vs_cpu');

            initGame();
            gameLoop = setInterval(gameStep, GAME_SPEED);
        }

        function endGame(snake1Alive, snake2Alive) {
            clearInterval(gameLoop);
            isGameOver = true;

            const winnerText = document.getElementById('winnerText');
            const finalScores = document.getElementById('finalScores');

            if (snake1Alive && !snake2Alive) {
                winnerText.textContent = 'Player 1 Wins!';
            } else if (!snake1Alive && snake2Alive) {
                winnerText.textContent = 'Player 2 Wins!';
            } else {
                winnerText.textContent = "It's a Draw!";
            }

            finalScores.textContent = `Player 1: ${score1} | Player 2: ${score2}`;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('gameOverMenu').classList.add('hidden');
            startGame(currentMode);
        }

        function showMainMenu() {
            clearInterval(gameLoop);
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('startMenu').classList.remove('hidden');
        }

        function updateScoreDisplay() {
            const display = document.getElementById('scoreDisplay');
            display.textContent = `P1: ${score1} | P2: ${score2}`;
        }

        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                if (document.getElementById('gameOverMenu').classList.contains('hidden') === false) {
                    restartGame();
                    return;
                }
            }

            if (!document.getElementById('startMenu').classList.contains('hidden')) {
                return;
            }

            switch (e.key) {
                case 'w':
                case 'W':
                    if (snake1.direction !== 'down') snake1.nextDirection = 'up';
                    break;
                case 's':
                case 'S':
                    if (snake1.direction !== 'up') snake1.nextDirection = 'down';
                    break;
                case 'a':
                case 'A':
                    if (snake1.direction !== 'right') snake1.nextDirection = 'left';
                    break;
                case 'd':
                case 'D':
                    if (snake1.direction !== 'left') snake1.nextDirection = 'right';
                    break;
                case 'ArrowUp':
                    if (snake2.direction !== 'down') snake2.nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (snake2.direction !== 'up') snake2.nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (snake2.direction !== 'right') snake2.nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (snake2.direction !== 'left') snake2.nextDirection = 'right';
                    break;
            }
        });

        initGame();
        draw();
    </script>
</body>
</html>
