<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>
<style>
  body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4;}
  .container {max-width: 600px; margin: 2rem auto; background: #fff; padding: 1rem; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,.1);}
  h1 {text-align: center;}
  #new-todo {width: 80%; padding: .5rem; font-size: 1rem;}
  #add-btn {padding: .5rem 1rem; font-size: 1rem;}
  ul {list-style: none; padding: 0; margin-top: 1rem;}
  li {display: flex; align-items: center; padding: .5rem 0; border-bottom: 1px solid #eee;}
  li:last-child {border-bottom: none;}
  .todo-text {flex: 1; cursor: pointer;}
  .completed {text-decoration: line-through; color: #888;}
  .delete-btn {background: transparent; border: none; color: #c00; cursor: pointer; font-size: 1.2rem;}
  .filters {margin-top: 1rem; text-align: center;}
  .filters button {margin: 0 .2rem; padding: .3rem .6rem; font-size: .9rem;}
  .filters .active {background: #007bff; color: #fff; border-radius: 3px;}
</style>
</head>
<body>
<div class="container">
  <h1>Todo List</h1>
  <div>
    <input type="text" id="new-todo" placeholder="What needs to be done?" />
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
</div>
<script>
  const STORAGE_KEY = 'todos';
  let todos = [];
  let currentFilter = 'all';

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function load() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try { todos = JSON.parse(stored); } catch(e) { todos = []; }
    }
  }

  function render() {
    const list = document.getElementById('todo-list');
    list.innerHTML = '';
    const filtered = todos.filter(t => {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });
    filtered.forEach((todo, idx) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = todo.text;
      span.className = 'todo-text' + (todo.completed ? ' completed' : '');
      span.addEventListener('click', () => toggleComplete(idx));
      const del = document.createElement('button');
      del.textContent = '✖';
      del.className = 'delete-btn';
      del.addEventListener('click', () => deleteTodo(idx));
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function addTodo(text) {
    if (!text.trim()) return;
    todos.push({text: text.trim(), completed: false});
    save();
    render();
  }

  function toggleComplete(idx) {
    const todo = filteredIndexToFull(idx);
    if (todo !== null) {
      todo.completed = !todo.completed;
      save();
      render();
    }
  }

  function deleteTodo(idx) {
    const todo = filteredIndexToFull(idx);
    if (todo !== null) {
      todos.splice(todos.indexOf(todo), 1);
      save();
      render();
    }
  }

  function filteredIndexToFull(idx) {
    const filtered = todos.filter(t => {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });
    return filtered[idx] || null;
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.filters button[data-filter="${filter}"]`).classList.add('active');
    render();
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    const input = document.getElementById('new-todo');
    addTodo(input.value);
    input.value = '';
  });

  document.getElementById('new-todo').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('add-btn').click();
    }
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  load();
  render();
</script>
</body>
</html>
