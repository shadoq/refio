<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Branch Network</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    min-height: 100vh;
    background: #05070f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #canvas {
    width: 800px;
    height: 800px;
    border-radius: 10px;
    background: #05070f;
    box-shadow:
      0 0 40px 6px rgba(0, 229, 255, 0.25),
      0 0 90px 24px rgba(16, 26, 58, 0.65);
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
(function () {

  // ---------------- SETUP ----------------
  // Basic canvas/context references, tunable parameter set, and internal
  // safety limits used to keep the simulation performant.
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 800;
  canvas.height = 800;

  const params = {
    neuronCount: 5,
    growthSpeed: 1.2,
    maxDepth: 9,
    splitChance: 0.35,
    curvature: 0.6,
    maxBranchLength: 90,
    synapseDistance: 26,
    synapseGlow: 18,
    pulseSpeed: 0.02,
    pulseFrequency: 0.6,
    pulseBrightness: 1.0,
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    paused: false
  };

  // Fixed visual constants not exposed as direct color pickers.
  const backgroundGlow = '#101a3a';
  const gridColor = 'rgba(0, 229, 255, 0.08)';

  // Live color state, kept in sync with the GUI via onChange callbacks.
  const colors = {
    background: params.backgroundColor,
    branch: params.branchColor,
    accent: params.accentColor,
    synapse: params.synapseColor,
    pulse: params.pulseColor
  };

  const maxTotalBranches = 500;
  const maxSynapses = 120;

  let branches = [];
  let synapses = [];
  let pulses = [];
  let synapsePairs = new Set();
  let branchIdCounter = 0;
  let growthDone = false;
  let frameCount = 0;
  let lastTime = 0;

  // ---------------- color helpers ----------------
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  function lerpColor(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a.r + (b.r - a.r) * t);
    const g = Math.round(a.g + (b.g - a.g) * t);
    const bl = Math.round(a.b + (b.b - a.b) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function hexToRgba(hex, alpha) {
    const c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
  }
  function quadPoint(x1, y1, cx, cy, x2, y2, t) {
    const q1x = x1 + (cx - x1) * t, q1y = y1 + (cy - y1) * t;
    const q2x = cx + (x2 - cx) * t, q2y = cy + (y2 - cy) * t;
    return { x: q1x + (q2x - q1x) * t, y: q1y + (q2y - q1y) * t };
  }

  // ---------------- NEURON GROWTH ----------------
  // Builds seed neurons and recursively grows branch segments over time.
  // Each branch stores a quadratic curve (start, control point, end) and
  // animates a growProgress value from 0 to 1 before deciding whether to
  // spawn further child branches, respecting depth/length/count caps.

  function spawnBranch(neuronId, x1, y1, angle, depth, lineageLen, colorMix) {
    if (branches.length >= maxTotalBranches) return null;
    if (depth > params.maxDepth) return null;
    const remaining = params.maxBranchLength - lineageLen;
    if (remaining <= 2) return null;

    const segLen = Math.min(remaining, 15 + Math.random() * 25);
    const angleDelta = (Math.random() - 0.5) * 0.6 * params.curvature;
    const newAngle = angle + angleDelta;
    const midDist = segLen * 0.5;
    const curveOffset = (Math.random() - 0.5) * 24 * params.curvature;

    const cx = x1 + Math.cos(newAngle) * midDist - Math.sin(newAngle) * curveOffset;
    const cy = y1 + Math.sin(newAngle) * midDist + Math.cos(newAngle) * curveOffset;
    const x2 = x1 + Math.cos(newAngle) * segLen;
    const y2 = y1 + Math.sin(newAngle) * segLen;
    const width = 0.8 + Math.random() * 0.8;

    const b = {
      id: branchIdCounter++,
      neuronId, x1, y1, cx, cy, x2, y2,
      angle: newAngle,
      depth,
      lineageLen: lineageLen + segLen,
      width,
      growProgress: 0,
      growing: true,
      settled: false,
      colorMix
    };
    branches.push(b);
    return b;
  }

  function createNetwork() {
    branches = [];
    synapses = [];
    pulses = [];
    synapsePairs = new Set();
    branchIdCounter = 0;
    growthDone = false;
    frameCount = 0;

    const count = Math.round(params.neuronCount);
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.random() * 150;
      const x = 400 + Math.cos(ang) * r;
      const y = 400 + Math.sin(ang) * r;
      const initialCount = 1 + (Math.random() < 0.5 ? 1 : 0);
      for (let j = 0; j < initialCount; j++) {
        spawnBranch(i, x, y, Math.random() * Math.PI * 2, 0, 0, Math.random());
      }
    }
  }

  function updateGrowth(frameScale) {
    if (growthDone) return;
    const snapshotLen = branches.length;
    let anyGrowing = false;

    for (let i = 0; i < snapshotLen; i++) {
      const b = branches[i];
      if (!b.growing) continue;
      anyGrowing = true;
      b.growProgress += params.growthSpeed * 0.02 * frameScale;

      if (b.growProgress >= 1) {
        b.growProgress = 1;
        b.growing = false;
        b.settled = true;

        if (branches.length < maxTotalBranches && b.depth < params.maxDepth && b.lineageLen < params.maxBranchLength) {
          if (Math.random() < 0.9) {
            spawnBranch(b.neuronId, b.x2, b.y2, b.angle, b.depth + 1, b.lineageLen, b.colorMix);
            if (Math.random() < params.splitChance) {
              spawnBranch(
                b.neuronId, b.x2, b.y2,
                b.angle + (Math.random() - 0.5) * 1.2,
                b.depth + 1, b.lineageLen,
                Math.min(1, Math.max(0, b.colorMix + (Math.random() - 0.5) * 0.3))
              );
            }
          }
          if (Math.random() < 0.12) {
            const side = spawnBranch(
              b.neuronId, b.x2, b.y2,
              b.angle + (Math.random() < 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.6),
              b.depth + 1, b.lineageLen, b.colorMix
            );
            if (side) side.width *= 0.6;
          }
        }
      }
    }

    if (!anyGrowing) {
      growthDone = branches.length > 0 && branches.every(b => !b.growing);
    }
  }

  function getBranchTip(b) {
    const t = Math.min(b.growProgress, 1);
    return quadPoint(b.x1, b.y1, b.cx, b.cy, b.x2, b.y2, t);
  }

  // ---------------- SYNAPSE DETECTION ----------------
  // Periodically scans current branch tip positions across different
  // origin neurons; when two tips are close enough, a synapse link is
  // created (deduplicated by branch-id pair), bounded by maxSynapses.

  function checkSynapses() {
    if (synapses.length >= maxSynapses) return;
    const tips = [];
    for (const b of branches) {
      if (b.growProgress < 0.3) continue;
      const p = getBranchTip(b);
      tips.push({ branchId: b.id, neuronId: b.neuronId, x: p.x, y: p.y });
    }

    for (let i = 0; i < tips.length; i++) {
      if (synapses.length >= maxSynapses) break;
      for (let j = i + 1; j < tips.length; j++) {
        if (synapses.length >= maxSynapses) break;
        const a = tips[i], c = tips[j];
        if (a.neuronId === c.neuronId) continue;

        const key = a.branchId < c.branchId ? (a.branchId + '_' + c.branchId) : (c.branchId + '_' + a.branchId);
        if (synapsePairs.has(key)) continue;

        const dx = a.x - c.x, dy = a.y - c.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < params.synapseDistance) {
          synapsePairs.add(key);
          const midx = (a.x + c.x) / 2, midy = (a.y + c.y) / 2;
          const ddx = c.x - a.x, ddy = c.y - a.y;
          const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          const perpx = -ddy / len, perpy = ddx / len;
          const offset = (Math.random() - 0.5) * 10;
          synapses.push({
            aX: a.x, aY: a.y, bX: c.x, bY: c.y,
            cx: midx + perpx * offset, cy: midy + perpy * offset,
            pulsePhase: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }

  // ---------------- PULSE ANIMATION ----------------
  // Maintains small traveling markers that move along existing synapse
  // curves over time, spawned probabilistically based on pulseFrequency
  // and advanced each frame based on pulseSpeed.

  function updatePulses(dt, frameScale) {
    for (const s of synapses) s.pulsePhase += dt * 2;

    if (synapses.length > 0 && Math.random() < params.pulseFrequency * dt) {
      const idx = Math.floor(Math.random() * synapses.length);
      pulses.push({ synIndex: idx, t: 0 });
    }

    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.t += params.pulseSpeed * frameScale;
      if (p.t >= 1) pulses.splice(i, 1);
    }
  }

  // ---------------- RENDERING ----------------
  // Draws background, glow, faint grid, branches (partial curves based on
  // growProgress), synapses, pulses, and a vignette overlay, each frame.

  function render(time) {
    ctx.clearRect(0, 0, 800, 800);

    ctx.fillStyle = colors.background;
    ctx.fillRect(0, 0, 800, 800);

    const glowGrad = ctx.createRadialGradient(400, 400, 0, 400, 400, 480);
    glowGrad.addColorStop(0, hexToRgba(backgroundGlow, 0.55));
    glowGrad.addColorStop(1, hexToRgba(backgroundGlow, 0));
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, 800, 800);

    ctx.save();
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    const offset = (time * 0.01) % 20;
    for (let y = -20 + offset; y < 820; y += 20) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(800, y);
      ctx.stroke();
    }
    ctx.restore();

    for (const b of branches) {
      const t = Math.min(b.growProgress, 1);
      if (t <= 0) continue;
      const q1x = b.x1 + (b.cx - b.x1) * t, q1y = b.y1 + (b.cy - b.y1) * t;
      const q2x = b.cx + (b.x2 - b.cx) * t, q2y = b.cy + (b.y2 - b.cy) * t;
      const ex = q1x + (q2x - q1x) * t, ey = q1y + (q2y - q1y) * t;

      const strokeColor = lerpColor(colors.branch, colors.accent, b.colorMix);
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.quadraticCurveTo(q1x, q1y, ex, ey);
      ctx.lineWidth = b.width;
      ctx.strokeStyle = strokeColor;
      ctx.shadowColor = strokeColor;
      ctx.shadowBlur = 10;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    for (const s of synapses) {
      const brightness = 0.55 + 0.45 * Math.sin(s.pulsePhase);
      ctx.beginPath();
      ctx.moveTo(s.aX, s.aY);
      ctx.quadraticCurveTo(s.cx, s.cy, s.bX, s.bY);
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = colors.synapse;
      ctx.shadowColor = colors.synapse;
      ctx.shadowBlur = params.synapseGlow * brightness;
      ctx.globalAlpha = 0.5 + 0.3 * brightness;
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.arc(s.aX, s.aY, 2, 0, Math.PI * 2);
      ctx.fillStyle = colors.synapse;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s.bX, s.bY, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const p of pulses) {
      const s = synapses[p.synIndex];
      if (!s) continue;
      const pos = quadPoint(s.aX, s.aY, s.cx, s.cy, s.bX, s.bY, p.t);
      const trailT = Math.max(0, p.t - 0.06);
      const trailPos = quadPoint(s.aX, s.aY, s.cx, s.cy, s.bX, s.bY, trailT);

      ctx.beginPath();
      ctx.arc(trailPos.x, trailPos.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(colors.pulse, 0.35);
      ctx.shadowBlur = params.pulseBrightness * 10;
      ctx.shadowColor = colors.pulse;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = colors.pulse;
      ctx.shadowBlur = params.pulseBrightness * 20;
      ctx.shadowColor = colors.pulse;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const vg = ctx.createRadialGradient(400, 400, 300, 400, 400, 560);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, 800, 800);
  }

  // ---------------- MAIN LOOP ----------------
  // Drives time-based updates via requestAnimationFrame, clamping delta
  // time and skipping simulation updates (but not rendering) while paused.

  function animate(now) {
    requestAnimationFrame(animate);
    if (!lastTime) lastTime = now;

    if (params.paused) {
      lastTime = now;
      render(now);
      return;
    }

    let dt = (now - lastTime) / 1000;
    dt = Math.min(dt, 0.05);
    lastTime = now;
    const frameScale = dt * 60;

    updateGrowth(frameScale);
    frameCount++;
    if (frameCount % 15 === 0) checkSynapses();
    updatePulses(dt, frameScale);

    render(now);
  }

  // ---------------- GUI SETUP ----------------
  // dat.gui panel with grouped folders for growth, synapses, pulses, and
  // visual/color parameters, plus action buttons wired to core functions.

  const gui = new dat.GUI();

  const actions = {
    regenerate: function () { createNetwork(); },
    clear: function () {
      branches = [];
      synapses = [];
      pulses = [];
      synapsePairs = new Set();
      growthDone = false;
    },
    togglePause: function () {
      params.paused = !params.paused;
      if (!params.paused) lastTime = performance.now();
    }
  };

  const fGrowth = gui.addFolder('Growth');
  fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
  fGrowth.add(params, 'growthSpeed', 0.1, 5, 0.01).name('Growth Speed');
  fGrowth.add(params, 'maxDepth', 3, 14, 1).name('Max Depth');
  fGrowth.add(params, 'splitChance', 0, 1, 0.01).name('Split Chance');
  fGrowth.add(params, 'curvature', 0, 2, 0.01).name('Curvature');
  fGrowth.add(params, 'maxBranchLength', 20, 200, 1).name('Max Branch Length');
  fGrowth.add(actions, 'regenerate').name('Regenerate Network');
  fGrowth.add(actions, 'clear').name('Clear Canvas');
  fGrowth.open();

  const fSynapses = gui.addFolder('Synapses');
  fSynapses.add(params, 'synapseDistance', 5, 80, 1).name('Synapse Distance');
  fSynapses.add(params, 'synapseGlow', 0, 40, 1).name('Synapse Glow');
  fSynapses.open();

  const fPulses = gui.addFolder('Pulses');
  fPulses.add(params, 'pulseSpeed', 0.001, 0.1, 0.001).name('Pulse Speed');
  fPulses.add(params, 'pulseFrequency', 0, 3, 0.01).name('Pulse Frequency');
  fPulses.add(params, 'pulseBrightness', 0.2, 2, 0.01).name('Pulse Brightness');
  fPulses.open();

  const fVisuals = gui.addFolder('Visuals');
  fVisuals.addColor(params, 'backgroundColor').name('Background').onChange(function (v) { colors.background = v; });
  fVisuals.addColor(params, 'branchColor').name('Branch Color').onChange(function (v) { colors.branch = v; });
  fVisuals.addColor(params, 'accentColor').name('Accent Color').onChange(function (v) { colors.accent = v; });
  fVisuals.addColor(params, 'synapseColor').name('Synapse Color').onChange(function (v) { colors.synapse = v; });
  fVisuals.addColor(params, 'pulseColor').name('Pulse Color').onChange(function (v) { colors.pulse = v; });
  fVisuals.add(actions, 'togglePause').name('Pause / Resume');
  fVisuals.open();

  // ---------------- init ----------------
  createNetwork();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
