<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Neuron Growth</title>
<style>
  body {
    margin: 0;
    background: #05070f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    box-shadow: 0 0 90px #101a3a;
    border: 1px solid rgba(0, 229, 255, 0.15);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// ==== Setup ====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const glowGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 430);
glowGrad.addColorStop(0, 'rgba(16, 26, 58, 0.55)');
glowGrad.addColorStop(1, 'rgba(16, 26, 58, 0)');

const vignetteGrad = ctx.createRadialGradient(W/2, H/2, 320, W/2, H/2, 570);
vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.55)');

const params = {
  neuronCount: 4,
  growthSpeed: 1.6,
  maxDepth: 5,
  splitChance: 0.55,
  curvature: 0.5,
  maxBranchLength: 150,
  synapseDist: 26,
  synapseGlow: 18,
  pulseSpeed: 2.2,
  pulseFrequency: 1.2,
  pulseBrightness: 1.2,
  bgColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a',
  scanlines: true,
  vignette: true,
  paused: false
};

const MAX_BRANCHES = 260, MAX_SYNAPSES = 150, MAX_PULSES = 50;
const neurons = [], branches = [], synapses = [], pulses = [];
const synapseKeys = new Set();
let growing = false, frame = 0, pulseAcc = 0, branchId = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

// ==== GUI setup ====
const actions = {
  regenerate: () => spawnNetwork(),
  clearCanvas() {
    branches.length = 0;
    synapses.length = 0;
    pulses.length = 0;
    synapseKeys.clear();
    growing = false;
  },
  togglePause() { params.paused = !params.paused; }
};

const gui = new dat.GUI({ width: 300 });
const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 3, 6, 1).onFinishChange(spawnNetwork);
fGrowth.add(params, 'growthSpeed', 0.2, 5);
fGrowth.add(params, 'maxDepth', 2, 8, 1);
fGrowth.add(params, 'splitChance', 0, 1);
fGrowth.add(params, 'curvature', 0, 1);
fGrowth.add(params, 'maxBranchLength', 40, 260, 1);
const fSyn = gui.addFolder('Synapses');
fSyn.add(params, 'synapseDist', 5, 60, 1);
fSyn.add(params, 'synapseGlow', 0, 40, 1);
const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.2, 6);
fPulse.add(params, 'pulseFrequency', 0, 4);
fPulse.add(params, 'pulseBrightness', 0.1, 3);
const fVis = gui.addFolder('Visuals');
fVis.addColor(params, 'bgColor');
fVis.addColor(params, 'branchColor');
fVis.addColor(params, 'accentColor');
fVis.addColor(params, 'synapseColor');
fVis.addColor(params, 'pulseColor');
fVis.add(params, 'scanlines');
fVis.add(params, 'vignette');
fGrowth.open();
gui.add(actions, 'regenerate').name('regenerate network');
gui.add(actions, 'clearCanvas').name('clear canvas');
gui.add(actions, 'togglePause').name('pause / resume');

// ==== Neuron growth ====
function spawnNetwork() {
  branches.length = 0;
  synapses.length = 0;
  pulses.length = 0;
  synapseKeys.clear();
  neurons.length = 0;
  pulseAcc = 0;
  for (let i = 0; i < params.neuronCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 110;
    const n = { x: W/2 + Math.cos(a) * r, y: H/2 + Math.sin(a) * r };
    neurons.push(n);
    const roots = 2 + (Math.random() < 0.5 ? 1 : 0);
    const base = Math.random() * Math.PI * 2;
    for (let j = 0; j < roots; j++) {
      addBranch(n.x, n.y, base + (j / roots) * Math.PI * 2 + rand(-0.4, 0.4), 0, n, -1);
    }
  }
  growing = true;
}

function addBranch(x, y, angle, depth, neuron, parentId) {
  if (branches.length >= MAX_BRANCHES || depth > params.maxDepth) return null;
  const b = {
    id: branchId++,
    pts: [{ x, y }],
    x, y, angle,
    drift: 0,
    depth,
    thick: clamp(3 - depth * 0.45, 0.6, 3) + rand(-0.25, 0.25),
    maxLen: params.maxBranchLength * (depth === 0 ? 1 : rand(0.5, 0.95)),
    len: 0,
    done: false,
    accent: Math.random() < 0.22,
    neuron, parentId,
    cum: [0]
  };
  branches.push(b);
  return b;
}

function updateGrowth(dt) {
  if (!growing) return;
  const ext = params.growthSpeed * dt * 60;
  let active = false;
  for (const b of branches) {
    if (b.done) continue;
    active = true;
    const steps = Math.max(1, Math.ceil(ext / 3));
    const step = ext / steps;
    for (let s = 0; s < steps && !b.done; s++) {
      b.angle += b.drift + (Math.random() - 0.5) * 0.5 * params.curvature;
      b.drift += (Math.random() - 0.5) * 0.08 * params.curvature;
      b.drift *= 0.92;
      b.x += Math.cos(b.angle) * step;
      b.y += Math.sin(b.angle) * step;
      b.len += step;
      const lp = b.pts[b.pts.length - 1];
      const dx = b.x - lp.x, dy = b.y - lp.y;
      if (dx * dx + dy * dy >= 16) {
        b.pts.push({ x: b.x, y: b.y });
        b.cum.push(b.cum[b.cum.length - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      if (b.len >= b.maxLen || b.x < 15 || b.x > 785 || b.y < 15 || b.y > 785) {
        b.done = true;
        if (Math.random() < params.splitChance * 0.5 && b.depth < params.maxDepth) {
          const n = 1 + (Math.random() < 0.5 ? 1 : 0);
          for (let i = 0; i < n; i++) {
            const spread = (i - (n - 1) / 2) * 0.55 + rand(-0.2, 0.2);
            addBranch(b.x, b.y, b.angle + spread, b.depth + 1, b.neuron, b.id);
          }
        }
      }
    }
    if (!b.done && b.depth < params.maxDepth && Math.random() < params.splitChance * 0.04) {
      const side = Math.random() < 0.5 ? -1 : 1;
      addBranch(b.x, b.y, b.angle + side * rand(0.6, 1.2), b.depth + 1, b.neuron, b.id);
    }
  }
  if (!active) growing = false;
}

// ==== Synapse detection ====
function detectSynapses() {
  for (let i = 0; i < branches.length; i++) {
    for (let j = i + 1; j < branches.length; j++) {
      const a = branches[i], b = branches[j];
      if (a.neuron === b.neuron) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < params.synapseDist * params.synapseDist) {
        const key = Math.min(a.id, b.id) + '-' + Math.max(a.id, b.id);
        if (!synapseKeys.has(key) && synapses.length < MAX_SYNAPSES) {
          synapseKeys.add(key);
          synapses.push({ a, b, phase: Math.random() * 6.283, flash: 0 });
        }
      }
    }
  }
}

// ==== Pulse animation ====
function posAt(b, d) {
  const total = b.cum[b.cum.length - 1];
  d = clamp(d, 0, total);
  for (let i = 1; i < b.cum.length; i++) {
    if (b.cum[i] >= d) {
      const t = (d - b.cum[i - 1]) / (b.cum[i] - b.cum[i - 1] || 1);
      const p0 = b.pts[i - 1], p1 = b.pts[i];
      return { x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t };
    }
  }
  const p = b.pts[b.pts.length - 1];
  return { x: p.x, y: p.y };
}

function spawnPulse() {
  if (!branches.length) return;
  const b = branches[(Math.random() * branches.length) | 0];
  const dir = Math.random() < 0.5 ? 1 : -1;
  pulses.push({ b, dir, d: dir > 0 ? 0 : b.cum[b.cum.length - 1], hops: 3, dead: false });
}

function updatePulses(dt) {
  pulseAcc += dt * params.pulseFrequency;
  while (pulseAcc >= 1) {
    pulseAcc -= 1;
    if (pulses.length < MAX_PULSES) spawnPulse();
  }
  for (const p of pulses) {
    p.d += p.dir * params.pulseSpeed * dt * 60;
    const total = p.b.cum[p.b.cum.length - 1];
    if (p.dir > 0 && p.d >= total) {
      const options = [];
      for (const s of synapses) {
        const other = s.a === p.b ? s.b : (s.b === p.b ? s.a : null);
        if (other && other.pts.length >= 2) options.push([s, other]);
      }
      if (options.length) {
        const pick = options[(Math.random() * options.length) | 0];
        pick[0].flash = 1;
        p.b = pick[1];
        p.dir = -1;
        p.d = p.b.cum[p.b.cum.length - 1];
        p.hops--;
        if (p.hops <= 0) p.dead = true;
      } else {
        p.dead = true;
      }
    } else if (p.dir < 0 && p.d <= 0) {
      p.dead = true;
    }
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    if (pulses[i].dead) pulses.splice(i, 1);
  }
}

// ==== Rendering ====
function draw(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, W, H);

  if (params.scanlines) {
    ctx.fillStyle = 'rgba(0, 229, 255, 0.08)';
    ctx.globalAlpha = 0.5;
    const off = frame % 4;
    for (let y = off; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    ctx.globalAlpha = 1;
  }

  ctx.lineCap = 'round';
  for (const useAccent of [false, true]) {
    const col = useAccent ? params.accentColor : params.branchColor;
    ctx.strokeStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 10;
    for (const b of branches) {
      if (b.accent !== useAccent) continue;
      ctx.lineWidth = b.thick;
      ctx.beginPath();
      const pts = b.pts;
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
      }
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  ctx.fillStyle = '#ffd400'; // UI/accent color for neuron cores
  ctx.shadowColor = '#ffd400';
  ctx.shadowBlur = 18;
  for (const n of neurons) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 3.5, 0, 6.283);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const s of synapses) {
    ctx.strokeStyle = params.synapseColor;
    ctx.shadowColor = params.synapseColor;
    ctx.globalAlpha = 0.15 + 0.08 * Math.sin(t * 2 + s.phase);
    ctx.shadowBlur = 6;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();
    const mx = (s.a.x + s.b.x) / 2, my = (s.a.y + s.b.y) / 2;
    ctx.fillStyle = params.synapseColor;
    ctx.globalAlpha = 0.85;
    ctx.shadowBlur = params.synapseGlow;
    ctx.beginPath();
    ctx.arc(mx, my, 1.8 + 0.9 * Math.sin(t * 2.4 + s.phase) + 2 * s.flash, 0, 6.283);
    ctx.fill();
    s.flash *= 0.92;
  }

  for (const p of pulses) {
    const head = posAt(p.b, p.d);
    const tail = posAt(p.b, p.d - p.dir * 10);
    ctx.strokeStyle = params.pulseColor;
    ctx.shadowColor = params.pulseColor;
    ctx.globalAlpha = 0.6;
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tail.x, tail.y);
    ctx.lineTo(head.x, head.y);
    ctx.stroke();
    ctx.fillStyle = params.pulseColor;
    ctx.globalAlpha = Math.min(1, 0.7 * params.pulseBrightness);
    ctx.shadowBlur = 16 * params.pulseBrightness;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 2.2, 0, 6.283);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 26; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);

  if (params.vignette) {
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);
  }
}

// ==== Main loop ====
spawnNetwork();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (params.paused) return;
  frame++;
  updateGrowth(dt);
  if (frame % 6 === 0) detectSynapses();
  updatePulses(dt);
  draw(now / 1000);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
