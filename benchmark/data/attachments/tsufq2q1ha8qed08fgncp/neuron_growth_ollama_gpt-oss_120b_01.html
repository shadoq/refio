<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Neural Network</title>
<style>
html,body{
    margin:0;
    height:100%;
    background:#05070f;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:sans-serif;
}
canvas{
    background:#05070f;
    box-shadow:0 0 30px #101a3a;
}
body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(0,229,255,0.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,0.08) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
/* ==================== PARAMETERS ==================== */
const params = {
    neuronCount: 4,
    growthSpeed: 0.5,
    maxDepth: 5,
    splitChance: 0.3,
    curvature: 0.5,
    maxLength: 80,
    synapseDist: 30,
    synapseGlow: 0.8,
    pulseSpeed: 2,
    pulseFreq: 0.02,
    pulseBrightness: 1,
    bgColor: "#05070f",
    branchColor: "#00e5ff",
    accentColor: "#d6ff00",
    synapseColor: "#ff2bd6",
    pulseColor: "#fff36a"
};

/* ==================== CANVAS SETUP ==================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ==================== STATE ==================== */
let branches = [];          // {x0,y0,x1,y1,cx,cy,depth,thick,accent}
let tips = [];              // growing tips {x,y,angle,depth,thick,id}
let synapses = [];          // {a,b,glow,timer}
let pulses = [];            // {synapse,t}
let tipId = 0;
let paused = false;
let lastTime = 0;

/* ==================== UTILITIES ==================== */
function rand(min, max){ return Math.random()*(max-min)+min; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function lerp(a,b,t){ return a+(b-a)*t; }
function key(a,b){ return a<b ? `${a}-${b}` : `${b}-${a}`; }

/* ==================== NETWORK GENERATION ==================== */
function initNetwork(){
    branches = []; tips = []; synapses = []; pulses = []; tipId = 0;
    const center = {x:W/2, y:H/2};
    const seedCount = Math.round(rand(3,6));
    for(let i=0;i<seedCount;i++){
        const angle = rand(0, Math.PI*2);
        const r = rand(10,30);
        const x = center.x + Math.cos(angle)*r;
        const y = center.y + Math.sin(angle)*r;
        tips.push({x,y,angle:rand(0,Math.PI*2),depth:0,thick:3,id:tipId++});
    }
}

/* ==================== GROWTH LOGIC ==================== */
function growTips(){
    const newTips = [];
    const maxBranches = 2000;
    for(const tip of tips){
        if(tip.depth>=params.maxDepth) continue;
        if(branches.length>maxBranches) break;

        const len = params.maxLength*rand(0.5,1);
        const nx = tip.x + Math.cos(tip.angle)*len;
        const ny = tip.y + Math.sin(tip.angle)*len;

        // control point for curvature
        const cpOffset = len*params.curvature*rand(-0.5,0.5);
        const cx = tip.x + Math.cos(tip.angle)*len*0.5 + Math.cos(tip.angle+Math.PI/2)*cpOffset;
        const cy = tip.y + Math.sin(tip.angle)*len*0.5 + Math.sin(tip.angle+Math.PI/2)*cpOffset;

        const accent = (tip.depth%2===0);
        branches.push({
            x0:tip.x, y0:tip.y,
            x1:nx, y1:ny,
            cx,cy,
            depth:tip.depth,
            thick:tip.thick,
            accent
        });

        const newTip = {x:nx, y:ny,
            angle: tip.angle + rand(-params.curvature,params.curvature),
            depth: tip.depth+1,
            thick: tip.thick*0.9,
            id: tipId++};
        newTips.push(newTip);

        // possible split
        if(Math.random()<params.splitChance){
            const splitAngle = tip.angle + rand(-Math.PI/2, Math.PI/2);
            const splitTip = {x:nx, y:ny,
                angle: splitAngle,
                depth: tip.depth+1,
                thick: tip.thick*0.9,
                id: tipId++};
            newTips.push(splitTip);
        }

        // synapse detection
        for(const other of tips){
            if(other.id===tip.id) continue;
            if(dist(newTip, other)<params.synapseDist){
                const exists = synapses.some(s=> (s.a.id===newTip.id && s.b.id===other.id) ||
                                                (s.a.id===other.id && s.b.id===newTip.id));
                if(!exists){
                    synapses.push({a:newTip, b:other, glow:0, timer:rand(0,1/params.pulseFreq)});
                }
            }
        }
    }
    tips = newTips;
}

/* ==================== PULSE LOGIC ==================== */
function updatePulses(dt){
    // generate pulses from synapse timers
    for(const syn of synapses){
        syn.timer -= dt;
        if(syn.timer<=0){
            pulses.push({synapse:syn, t:0});
            syn.timer = rand(0,1/params.pulseFreq);
        }
        // glow oscillation
        syn.glow = Math.abs(Math.sin(performance.now()*0.001*params.pulseBrightness));
    }
    // advance existing pulses
    for(let i=pulses.length-1;i>=0;i--){
        const p = pulses[i];
        p.t += dt*params.pulseSpeed;
        if(p.t>1) pulses.splice(i,1);
    }
}

/* ==================== RENDERING ==================== */
function draw(){
    // background
    ctx.fillStyle = params.bgColor;
    ctx.fillRect(0,0,W,H);

    // branches
    for(const b of branches){
        ctx.beginPath();
        ctx.moveTo(b.x0,b.y0);
        ctx.quadraticCurveTo(b.cx,b.cy,b.x1,b.y1);
        ctx.strokeStyle = b.accent ? params.accentColor : params.branchColor;
        ctx.lineWidth = b.thick;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 12;
        ctx.stroke();
    }

    // synapses
    for(const s of synapses){
        ctx.beginPath();
        ctx.moveTo(s.a.x,s.a.y);
        ctx.lineTo(s.b.x,s.b.y);
        ctx.strokeStyle = params.synapseColor;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.4 + 0.6*s.glow*params.synapseGlow;
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    // pulses
    for(const p of pulses){
        const {a,b}=p.pulse ? p.pulse : p.synapse;
        const x = lerp(p.synapse.a.x, p.synapse.b.x, p.t);
        const y = lerp(p.synapse.a.y, p.synapse.b.y, p.t);
        ctx.beginPath();
        ctx.arc(x,y,4,0,Math.PI*2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowColor = params.pulseColor;
        ctx.shadowBlur = 20;
        ctx.fill();
    }

    // vignette
    const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)/2);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
}

/* ==================== MAIN LOOP ==================== */
function animate(timestamp){
    const dt = (timestamp-lastTime)/1000;
    lastTime = timestamp;
    if(!paused){
        for(let i=0;i<params.growthSpeed;i++) growTips();
        updatePulses(dt);
    }
    draw();
    requestAnimationFrame(animate);
}

/* ==================== GUI ==================== */
const gui = new dat.GUI({width:300});
gui.add(params,'neuronCount',1,10,1).name('Neuron count').onFinishChange(initNetwork);
gui.add(params,'growthSpeed',0.1,2,0.1).name('Growth speed');
gui.add(params,'maxDepth',1,8,1).name('Max depth');
gui.add(params,'splitChance',0,1,0.01).name('Split chance');
gui.add(params,'curvature',0,1,0.01).name('Curvature');
gui.add(params,'maxLength',20,150,1).name('Max length');

const synFolder = gui.addFolder('Synapses');
synFolder.add(params,'synapseDist',5,80,1).name('Dist threshold');
synFolder.add(params,'synapseGlow',0,2,0.01).name('Glow strength');

const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params,'pulseSpeed',0.5,5,0.1).name('Pulse speed');
pulseFolder.add(params,'pulseFreq',0.005,0.1,0.001).name('Pulse freq');
pulseFolder.add(params,'pulseBrightness',0.5,2,0.01).name('Pulse brightness');

const visualFolder = gui.addFolder('Visuals');
visualFolder.addColor(params,'bgColor').name('Background');
visualFolder.addColor(params,'branchColor').name('Branch');
visualFolder.addColor(params,'accentColor').name('Accent');
visualFolder.addColor(params,'synapseColor').name('Synapse');
visualFolder.addColor(params,'pulseColor').name('Pulse');

gui.add({regenerate: initNetwork},'regenerate').name('Regenerate network');
gui.add({clear:()=>{branches=[];tips=[];synapses=[];pulses=[];}},'clear').name('Clear canvas');
gui.add({pause:()=>{paused=!paused;}},'pause').name('Pause/Resume');

/* ==================== START ==================== */
initNetwork();
requestAnimationFrame(animate);
</script>
</body>
</html>
