<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      border: 1px solid var(--border);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.025em;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .todo-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .filters {
      display: flex;
      gap: 8px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .filter-btn {
      background: none;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text);
      background-color: #f1f5f9;
    }

    .filter-btn.active {
      background-color: #e0e7ff;
      color: var(--primary);
      font-weight: 600;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 120px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 8px;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      transition: background-color 0.2s;
    }

    .todo-item:hover {
      background-color: #f1f5f9;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .todo-text {
      font-size: 0.975rem;
      color: var(--text);
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .empty-state {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 120px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-style: italic;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .clear-completed-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
    }

    .clear-completed-btn:hover {
      color: var(--danger-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Todos</h1>
    </header>

    <form class="todo-form" id="todoForm">
      <input 
        type="text" 
        id="todoInput" 
        class="todo-input" 
        placeholder="What needs to be done?" 
        autocomplete="off"
        required
      />
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="footer">
      <span id="itemsLeft">0 items left</span>
      <button class="clear-completed-btn" id="clearCompletedBtn">Clear Completed</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo_app_todos';

    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';

    const todoForm = document.getElementById('todoForm');
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const itemsLeft = document.getElementById('itemsLeft');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      todoList.innerHTML = '';

      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = todos.length === 0 ? 'No todos yet. Add one above!' : 'No tasks in this view.';
        todoList.appendChild(empty);
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

          const left = document.createElement('div');
          left.className = 'todo-left';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'todo-checkbox';
          checkbox.checked = todo.completed;
          checkbox.addEventListener('change', () => toggleTodo(todo.id));

          const span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = todo.text;

          left.appendChild(checkbox);
          left.appendChild(span);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.innerHTML = '&times;';
          deleteBtn.title = 'Delete todo';
          deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

          li.appendChild(left);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'} left`;

      const completedCount = todos.filter(t => t.completed).length;
      clearCompletedBtn.style.visibility = completedCount > 0 ? 'visible' : 'hidden';
    }

    function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const newTodo = {
        id: Date.now().toString(),
        text: trimmed,
        completed: false
      };

      todos.push(newTodo);
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map(todo => 
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    function clearCompleted() {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      renderTodos();
    }

    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      addTodo(todoInput.value);
      todoInput.value = '';
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTodos();
      });
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);

    renderTodos();
  </script>
</body>
</html>
