<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Duel - AI & Human</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --text-color: #e94560;
            --accent-color: #0f3460;
            --snake1-color: #4ecca3;
            --snake2-color: #fca311;
            --food-color: #ff4d4d;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 5px solid var(--panel-color);
            border-radius: 8px;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 3px;
        }

        h1 {
            color: var(--text-color);
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px #000;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background: var(--accent-color);
            color: white;
            border: 2px solid var(--text-color);
            border-radius: 5px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--text-color);
            color: white;
            transform: scale(1.05);
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score-item {
            padding: 5px 15px;
            border-radius: 5px;
        }

        #p1-score { color: var(--snake1-color); }
        #p2-score { color: var(--snake2-color); }

        .hidden { display: none !important; }

        #game-over-text {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 1rem;
            text-align: center;
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="score-board">
        <div id="p1-score" class="score-item">Player 1: 0</div>
        <div id="p2-score" class="score-item">Player 2: 0</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Start Menu -->
        <div id="start-menu" class="overlay">
            <h1>SNAKE DUEL</h1>
            <div class="menu-buttons">
                <button onclick="startGame('Hvh')">Human vs Human</button>
                <button onclick="startGame('CvH')">CPU vs Human</button>
                <button onclick="startGame('CvC')">CPU vs CPU</button>
            </div>
            <div class="instructions">
                P1: WASD | P2: Arrow Keys<br>
                Press Enter/Space to restart after Game Over
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="overlay hidden">
            <div id="game-over-text">GAME OVER</div>
            <button onclick="showMenu()">Main Menu</button>
            <div class="instructions">Press Space or Enter to Restart</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 30;
        const tileSize = canvas.width / gridSize;

        let gameLoop;
        let gameRunning = false;
        let gameMode = ''; // 'Hvh', 'CvH', 'CvC'

        let snake1, snake2, food;
        let scores = { p1: 0, p2: 0 };

        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };

        class Snake {
            constructor(x, y, color, controls) {
                this.body = [{ x, y }];
                this.dir = DIRECTIONS.RIGHT;
                this.nextDir = DIRECTIONS.RIGHT;
                this.color = color;
                this.controls = controls;
                this.alive = true;
                this.score = 0;
            }

            update() {
                this.dir = this.nextDir;
                const head = { x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y };
                
                // Wall collision
                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    this.alive = false;
                    return;
                }

                // Self collision
                if (this.body.some(seg => seg.x === head.x && seg.y === head.y)) {
                    this.alive = false;
                    return;
                }

                this.body.unshift(head);

                // Food collision
                if (head.x === food.x && head.y === food.y) {
                    this.score++;
                    spawnFood();
                } else {
                    this.body.pop();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                this.body.forEach((seg, index) => {
                    ctx.fillRect(seg.x * tileSize, seg.y * tileSize, tileSize - 1, tileSize - 1);
                });
            }

            // Simple AI: Move towards food, avoid walls and bodies
            aiMove(otherSnake) {
                const head = this.body[0];
                const dx = food.x - head.x;
                const dy = food.y - head.y;

                let possibleDirs = Object.values(DIRECTIONS);
                
                // Filter out opposite direction
                possibleDirs = possibleDirs.filter(d => !(d.x === -this.dir.x && d.y === -this.dir.y));

                // Sort directions by distance to food
                possibleDirs.sort((a, b) => {
                    const distA = Math.abs((head.x + a.x) - food.x) + Math.abs((head.y + a.y) - food.y);
                    const distB = Math.abs((head.x + b.x) - food.x) + Math.abs((head.y + b.y) - food.y);
                    return distA - distB;
                });

                for (let dir of possibleDirs) {
                    const nextX = head.x + dir.x;
                    const nextY = head.y + dir.y;

                    // Check wall
                    if (nextX < 0 || nextX >= gridSize || nextY < 0 || nextY >= gridSize) continue;
                    
                    // Check self
                    if (this.body.some(seg => seg.x === nextX && seg.y === nextY)) continue;
                    
                    // Check other snake
                    if (otherSnake.body.some(seg => seg.x === nextX && seg.y === nextY)) continue;

                    this.nextDir = dir;
                    return;
                }
                // If no safe move, just keep going (and die)
            }
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            // Ensure food doesn't spawn on snakes
            if (snake1.body.some(s => s.x === food.x && s.y === food.y) || 
                snake2.body.some(s => s.x === food.x && s.y === food.y)) {
                spawnFood();
            }
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            
            snake1 = new Snake(5, 15, '#4ecca3', { up: 'w', down: 's', left: 'a', right: 'd' });
            snake2 = new Snake(24, 15, '#fca311', { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' });
            
            scores = { p1: 0, p2: 0 };
            updateScoreDisplay();
            spawnFood();
            
            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameTick, 120);
        }

        function gameTick() {
            // AI Logic
            if (gameMode === 'CvH' || gameMode === 'CvC') snake1.aiMove(snake2);
            if (gameMode === 'CvH' || gameMode === 'CvC') snake2.aiMove(snake1);

            snake1.update();
            snake2.update();

            // Check collision between snakes
            snake1.body.forEach(seg => {
                if (snake2.body.some(s => s.x === seg.x && s.y === seg.y)) {
                    snake1.alive = false;
                    snake2.alive = false;
                }
            });

            // Update scores
            scores.p1 = snake1.score;
            scores.p2 = snake2.score;
            updateScoreDisplay();

            draw();

            if (!snake1.alive || !snake2.alive) {
                endGame();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = '#ff4d4d';
            ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 1, tileSize - 1);

            snake1.draw();
            snake2.draw();
        }

        function updateScoreDisplay() {
            document.getElementById('p1-score').innerText = `Player 1: ${scores.p1}`;
            document.getElementById('p2-score').innerText = `Player 2: ${scores.p2}`;
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            const overText = document.getElementById('game-over-text');
            if (snake1.alive && !snake2.alive) overText.innerText = "PLAYER 1 WINS!";
            else if (!snake1.alive && snake2.alive) overText.innerText = "PLAYER 2 WINS!";
            else overText.innerText = "DRAW / BOTH CRASHED!";
            
            document.getElementById('game-over').classList.remove('hidden');
        }

        function showMenu() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('start-menu').classList.remove('hidden');
        }

        window.addEventListener('keydown', e => {
            if (!gameRunning) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (!document.getElementById('start-menu').classList.contains('hidden')) return;
                    startGame(gameMode);
                }
                return;
            }

            // P1 Controls
            if (e.key.toLowerCase() === 'w' && snake1.dir !== DIRECTIONS.DOWN) snake1.nextDir = DIRECTIONS.UP;
            if (e.key.toLowerCase() === 's' && snake1.dir !== DIRECTIONS.UP) snake1.nextDir = DIRECTIONS.DOWN;
            if (e.key.toLowerCase() === 'a' && snake1.dir !== DIRECTIONS.RIGHT) snake1.nextDir = DIRECTIONS.LEFT;
            if (e.key.toLowerCase() === 'd' && snake1.dir !== DIRECTIONS.LEFT) snake1.nextDir = DIRECTIONS.RIGHT;

            // P2 Controls
            if (e.key === 'ArrowUp' && snake2.dir !== DIRECTIONS.DOWN) snake2.nextDir = DIRECTIONS.UP;
            if (e.key === 'ArrowDown' && snake2.dir !== DIRECTIONS.UP) snake2.nextDir = DIRECTIONS.DOWN;
            if (e.key === 'ArrowLeft' && snake2.dir !== DIRECTIONS.RIGHT) snake2.nextDir = DIRECTIONS.LEFT;
            if (e.key === 'ArrowRight' && snake2.dir !== DIRECTIONS.LEFT) snake2.nextDir = DIRECTIONS.RIGHT;
        });
    </script>
</body>
</html>
