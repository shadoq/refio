<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neuron Growth Network</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at center, #101a3a 0%, #05070f 70%);
  }
  canvas {
    display: block;
    background: #05070f;
    border: 1px solid rgba(0, 229, 255, 0.15);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), 0 0 90px rgba(0, 229, 255, 0.08);
  }
  .dg.main {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999;
  }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// ===== SETUP =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
const CENTER = { x: 400, y: 400 };

// ===== CONFIG / STATE =====
// Tunable parameters bound to dat.gui
const params = {
  // Growth
  neuronCount: 4,
  growthSpeed: 1,
  maxDepth: 6,
  splitChance: 0.25,
  curvature: 0.4,
  maxBranchLength: 180,
  // Synapses
  synapseDistance: 35,
  synapseGlow: 18,
  // Pulses
  pulseSpeed: 0.012,
  pulseFrequency: 0.01,
  pulseBrightness: 1.5,
  // Visuals (color pickers)
  backgroundColor: '#05070f',
  branchColor: '#00e5ff',
  accentColor: '#d6ff00',
  synapseColor: '#ff2bd6',
  pulseColor: '#fff36a'
};

// Fixed accent constants not exposed to GUI
const UI_COLOR = '#ffd400';
const GRID_COLOR = 'rgba(0, 229, 255, 0.08)';
const BG_GLOW = '#101a3a';

// Simulation state
const state = {
  neurons: [],
  branches: [],
  synapses: [],
  synapsePairs: new Set(),
  pulses: [],
  growing: true,
  paused: false,
  frame: 0,
  branchIdCounter: 0
};

const MAX_BRANCHES = 220;
const MAX_PULSES = 60;

// ===== NEURON / BRANCH GROWTH =====
// Create a small cluster of seed neurons near the canvas center
function createSeedNeurons() {
  state.neurons = [];
  state.branches = [];
  state.synapses = [];
  state.synapsePairs = new Set();
  state.pulses = [];
  state.branchIdCounter = 0;

  const count = 3 + Math.floor(Math.random() * 4); // 3-6
  for (let i = 0; i < count; i++) {
    const r = 60 + Math.random() * 40;
    const a = Math.random() * Math.PI * 2;
    const nx = CENTER.x + Math.cos(a) * r;
    const ny = CENTER.y + Math.sin(a) * r;
    state.neurons.push({ x: nx, y: ny });

    // each seed starts one or two initial tips
    const tipCount = 1 + (Math.random() < 0.5 ? 1 : 0);
    for (let t = 0; t < tipCount; t++) {
      spawnTip(nx, ny, Math.random() * Math.PI * 2, 0, true);
    }
  }
  state.growing = true;
}

// Create a new growing branch tip
function spawnTip(x, y, angle, depth, colorMain) {
  if (state.branches.length >= MAX_BRANCHES) return null;
  const tip = {
    id: state.branchIdCounter++,
    x, y, angle,
    depth,
    length: 0,
    maxLength: params.maxBranchLength * (0.4 + Math.random() * 0.6),
    width: 1 + Math.random() * 1.5,
    points: [{ x, y }],
    colorMain: colorMain,
    alive: true
  };
  state.branches.push(tip);
  return tip;
}

// Advance all growing tips by one animation step
function growStep() {
  let anyAlive = false;
  const stepLen = 1.5 + params.growthSpeed * 2.2;

  for (const tip of state.branches) {
    if (!tip.alive) continue;
    anyAlive = true;

    // gentle steering back toward center if far out
    const dx = CENTER.x - tip.x;
    const dy = CENTER.y - tip.y;
    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
    if (distFromCenter > 380) {
      const toCenterAngle = Math.atan2(dy, dx);
      tip.angle += (toCenterAngle - tip.angle) * 0.05;
    }

    // organic random jitter
    tip.angle += (Math.random() - 0.5) * params.curvature * 0.6;

    tip.x += Math.cos(tip.angle) * stepLen;
    tip.y += Math.sin(tip.angle) * stepLen;
    tip.length += stepLen;
    tip.points.push({ x: tip.x, y: tip.y });

    // kill if far out of bounds
    if (tip.x < -20 || tip.x > 820 || tip.y < -20 || tip.y > 820) {
      tip.alive = false;
      continue;
    }

    // finish tip if it reached its length cap
    if (tip.length >= tip.maxLength) {
      tip.alive = false;
      continue;
    }

    // occasionally split into a side branch
    if (tip.depth + 1 <= params.maxDepth &&
        state.branches.length < MAX_BRANCHES &&
        Math.random() < params.splitChance * 0.03) {
      const childAngle = tip.angle + (Math.random() - 0.5) * 1.6;
      const isMain = Math.random() < 0.65;
      spawnTip(tip.x, tip.y, childAngle, tip.depth + 1, isMain);
    }
  }

  if (!anyAlive || state.branches.length >= MAX_BRANCHES) {
    state.growing = false;
  }
}

// ===== SYNAPSE DETECTION =====
// Periodically scan branch endpoints for close pairs and register synapses
function detectSynapses() {
  const branches = state.branches;
  const distThresh = params.synapseDistance;
  for (let i = 0; i < branches.length; i++) {
    const a = branches[i];
    const ap = a.points[a.points.length - 1];
    for (let j = i + 1; j < branches.length; j++) {
      const b = branches[j];
      const key = a.id < b.id ? a.id + '_' + b.id : b.id + '_' + a.id;
      if (state.synapsePairs.has(key)) continue;
      const bp = b.points[b.points.length - 1];
      const dx = ap.x - bp.x;
      const dy = ap.y - bp.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < distThresh) {
        state.synapsePairs.add(key);
        state.synapses.push({
          id: state.synapses.length,
          x1: ap.x, y1: ap.y,
          x2: bp.x, y2: bp.y
        });
      }
    }
  }
}

// ===== PULSE ANIMATION =====
// Spawn a new pulse traveling along a random synapse
function spawnPulse() {
  if (state.synapses.length === 0) return;
  if (state.pulses.length >= MAX_PULSES) return;
  if (Math.random() < params.pulseFrequency) {
    const s = state.synapses[Math.floor(Math.random() * state.synapses.length)];
    state.pulses.push({ synapse: s, t: 0, reverse: Math.random() < 0.5 });
  }
}

// Advance pulses along their synapse path, remove finished ones
function updatePulses() {
  for (let i = state.pulses.length - 1; i >= 0; i--) {
    const p = state.pulses[i];
    p.t += params.pulseSpeed;
    if (p.t >= 1) {
      state.pulses.splice(i, 1);
    }
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ===== RENDERING =====
function renderFrame() {
  const time = state.frame / 60;

  // background fill
  ctx.shadowBlur = 0;
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, 800, 800);

  // soft glow behind center
  const grad = ctx.createRadialGradient(400, 400, 50, 400, 400, 500);
  grad.addColorStop(0, BG_GLOW);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 800, 800);
  ctx.globalAlpha = 1;

  // faint scanline grid
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 1;
  for (let y = 0; y < 800; y += 20) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(800, y);
    ctx.stroke();
  }

  // draw branches as smooth curves
  for (const tip of state.branches) {
    const pts = tip.points;
    if (pts.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const cp = pts[i];
      const end = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
      ctx.quadraticCurveTo(cp.x, cp.y, end.x, end.y);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);

    const color = tip.colorMain ? params.branchColor : params.accentColor;
    ctx.strokeStyle = color;
    ctx.lineWidth = tip.width;
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // draw synapses
  for (const s of state.synapses) {
    const pulseFactor = 0.5 + 0.5 * Math.sin(time * 2 + s.id);
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.strokeStyle = params.synapseColor;
    ctx.lineWidth = 1;
    ctx.shadowBlur = params.synapseGlow * pulseFactor;
    ctx.shadowColor = params.synapseColor;
    ctx.globalAlpha = 0.4 + 0.4 * pulseFactor;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;

  // draw pulses traveling along synapses
  for (const p of state.pulses) {
    const s = p.synapse;
    let t = p.t;
    let x1 = s.x1, y1 = s.y1, x2 = s.x2, y2 = s.y2;
    if (p.reverse) { const tx = x1; x1 = x2; x2 = tx; const ty = y1; y1 = y2; y2 = ty; }
    const px = lerp(x1, x2, t);
    const py = lerp(y1, y2, t);
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fillStyle = params.pulseColor;
    ctx.shadowBlur = 12 * params.pulseBrightness;
    ctx.shadowColor = params.pulseColor;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // vignette overlay
  const vgn = ctx.createRadialGradient(400, 400, 250, 400, 400, 560);
  vgn.addColorStop(0, 'rgba(0,0,0,0)');
  vgn.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vgn;
  ctx.fillRect(0, 0, 800, 800);
}

// ===== GUI SETUP =====
const gui = new dat.GUI();

const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1);
growthFolder.add(params, 'growthSpeed', 0.2, 3);
growthFolder.add(params, 'maxDepth', 2, 9, 1);
growthFolder.add(params, 'splitChance', 0, 1);
growthFolder.add(params, 'curvature', 0, 1);
growthFolder.add(params, 'maxBranchLength', 50, 400);
growthFolder.open();

const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDistance', 10, 100);
synapseFolder.add(params, 'synapseGlow', 0, 40);
synapseFolder.open();

const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params, 'pulseSpeed', 0.002, 0.05);
pulseFolder.add(params, 'pulseFrequency', 0.001, 0.05);
pulseFolder.add(params, 'pulseBrightness', 0.5, 3);
pulseFolder.open();

const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'backgroundColor');
visualsFolder.addColor(params, 'branchColor');
visualsFolder.addColor(params, 'accentColor');
visualsFolder.addColor(params, 'synapseColor');
visualsFolder.addColor(params, 'pulseColor');
visualsFolder.open();

// action buttons
const actions = {
  regenerate: () => regenerateNetwork(),
  clear: () => clearCanvas(),
  pauseResume: () => togglePause()
};

gui.add(actions, 'regenerate').name('Regenerate Network');
gui.add(actions, 'clear').name('Clear Canvas');
const pauseController = gui.add(actions, 'pauseResume').name('Pause / Resume');

function regenerateNetwork() {
  createSeedNeurons();
}

function clearCanvas() {
  state.neurons = [];
  state.branches = [];
  state.synapses = [];
  state.synapsePairs = new Set();
  state.pulses = [];
  state.growing = false;
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, 800, 800);
}

function togglePause() {
  state.paused = !state.paused;
  pauseController.name(state.paused ? 'Resume' : 'Pause / Resume');
}

// ===== MAIN LOOP =====
function loop() {
  if (!state.paused) {
    if (state.growing) {
      growStep();
    }
    if (state.frame % 6 === 0) {
      detectSynapses();
    }
    updatePulses();
    spawnPulse();
    state.frame++;
  }
  renderFrame();
  requestAnimationFrame(loop);
}

// initialize simulation and start loop
createSeedNeurons();
requestAnimationFrame(loop);
</script>
</body>
</html>
