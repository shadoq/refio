<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      width: min(90vw, 510px);
      margin: 24px auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .app header {
      text-align: center;
      margin-bottom: 16px;
    }
    .app h1 {
      font-size: 1.9rem;
      margin: 0;
      color: #333;
    }
    form {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    form input {
      flex: 1;
      background: #fefefe;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 1rem;
    }
    form button {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    form button:hover {
      background: #1d4ed8;
    }
    .filters {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .filters button {
      padding: 8px 12px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: border 0.2s ease, background 0.2s ease;
    }
    .filters button.active {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.1);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #e5e7eb;
      gap: 12px;
    }
    li:last-child {
      border-bottom: none;
    }
    li span {
      flex: 1;
      color: #1f2937;
      cursor: default;
      word-break: break-word;
    }
    li span.completed {
      text-decoration: line-through;
      color: #6b7280;
    }
    .todo-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .todo-actions button {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #ef4444;
      font-size: 1.1rem;
      padding: 6px;
    }
    .todo-actions button:hover {
      color: #dc2626;
    }
    .todo-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
    }
    @media (max-width: 480px) {
      form {
        flex-direction: column;
      }
      form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <section class="app" aria-labelledby="todo-title">
    <header>
      <h1 id="todo-title">Todos</h1>
    </header>
    <form id="todo-form" aria-label="Add new todo">
      <input type="text" id="todo-input" aria-label="Todo description" placeholder="Add a new todo" autocomplete="off" required />
      <button type="submit'?"?>Add</button>
    </form>
    <div class="filters" aria-label="Todo filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <ul id="todo-list" aria-live="polite"></ul>
  </section>
  <script>
    const STORAGE_KEY = "todo_app_items";
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const filterButtons = document.querySelectorAll(".filters button");
    let todos = [];
    let filterStatus = "all";

    const saveTodos = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    const loadTodos = () => {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(data)) {
          todos = data;
        }
      } catch (error) {
        todos = [];
      }
    };

    const renderTodos = () => {
      list.innerHTML = "";
      const filtered = todos.filter((todo) => {
        if (filterStatus === "active") return !todo.completed;
        if (filterStatus === "completed") return todo.completed;
        return true;
      });
      if (!filtered.length) {
        const placeholder = document.createElement("li");
        placeholder.textContent = "No todos yet.";
        placeholder.style.textAlign = "center";
        placeholder.style.color = "#6b7280";
        placeholder.style.borderBottom = "none";
        list.appendChild(placeholder);
        return;
      }
      filtered.forEach((todo) => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = todo.text;
        span.className = todo.completed ? "completed" : "";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "todo-checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", "Toggle todo completion");
        checkbox.addEventListener("change", () => toggleTodo(todo.id));
        const deleteBtn = document.createElement("button");
        deleteBtn.setAttribute("aria-label", "Delete todo");
        deleteBtn.textContent = "✕";
        deleteBtn.addEventListener("click", () => deleteTodo(todo.id));
        const actions = document.createElement("div");
        actions.className = "todo-actions";
        actions.append(deleteBtn);
        li.append(checkbox, span, actions);
        list.appendChild(li);
      });
    };

    const addTodo = (text) => {
      todos.push({ id: crypto.randomUUID(), text, completed: false });
      saveTodos();
      renderTodos();
    };

    const toggleTodo = (id) => {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      renderTodos();
    };

    const deleteTodo = (id) => {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addTodo(value);
      input.value = "";
      input.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        filterButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        filterStatus = button.dataset.filter;
        renderTodos();
      });
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadTodos();
      renderTodos();
    });
  </script>
</body>
</html>
