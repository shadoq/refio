<!DOCTYPE html>
<html>
<head>
  <title>CHIP-8 Emulator</title>
  <style>
    canvas {
      image-rendering: pixelated;
      width: 640px;
      height: 320px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 50px);
      grid-template-rows: repeat(4, 50px);
      gap: 5px;
      margin: 10px;
    }
    .key {
      background: #ccc;
      border: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }
    .key:active {
      background: #999;
    }
    .controls {
      margin: 10px;
    }
    .debugger {
      margin-top: 20px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="display" width="64" height="32"></canvas>
  <div class="keypad">
    <div class="key" data-key="1">1</div>
    <div class="key" data-key="2">2</div>
    <div class="key" data-key="3">3</div>
    <div class="key" data-key="C">C</div>
    <div class="key" data-key="4">4</div>
    <div class="key" data-key="5">5</div>
    <div class="key" data-key="6">6</div>
    <div class="key" data-key="D">D</div>
    <div class="key" data-key="7">7</div>
    <div class="key" data-key="8">8</div>
    <div class="key" data-key="9">9</div>
    <div class="key" data-key="E">E</div>
    <div class="key" data-key="A">A</div>
    <div class="key" data-key="0">0</div>
    <div class="key" data-key="B">B</div>
    <div class="key" data-key="F">F</div>
  </div>
  <div class="controls">
    <button id="run">Run</button>
    <button id="pause">Pause</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <label for="speed">Speed: </label>
    <input type="range" id="speed" min="1" max="100" value="100">
  </div>
  <div class="debugger">
    <h3>Registers</h3>
    <div id="registers"></div>
    <h3>Index Register</h3>
    <div id="index"></div>
    <h3>Program Counter</h3>
    <div id="pc"></div>
    <h3>Stack</h3>
    <div id="stack"></div>
    <h3>Current Instruction</h3>
    <div id="current-instruction"></div>
  </div>
  <script>
    const memory = new Uint8Array(4096);
    const V = new Uint8Array(16);
    let I = 0;
    let PC = 0x200;
    let stack = [];
    let delayTimer = 0;
    let soundTimer = 0;
    let display = new Uint8Array(64 * 32);

    const font = [
      0xF0, 0x90, 0x90, 0x90, 0xF0,
      0x20, 0x60, 0x20, 0x20, 0x70,
      0xF0, 0x10, 0xF0, 0x80, 0xF0,
      0xF0, 0x10, 0xF0, 0x10, 0xF0,
      0x90, 0x90, 0xF0, 0x10, 0x10,
      0xF0, 0x80, 0xF0, 0x10, 0xF0,
      0xF0, 0x80, 0xF0, 0x90, 0xF0,
      0xF0, 0x10, 0x20, 0x40, 0x40,
      0xF0, 0x90, 0xF0, 0x90, 0xF0,
      0xF0, 0x90, 0xF0, 0x10, 0xF0,
      0xF0, 0x90, 0xF0, 0x90, 0x90,
      0xE0, 0x90, 0xE0, 0x90, 0xE0,
      0xF0, 0x80, 0x80, 0x80, 0xF0,
      0xE0, 0x90, 0x90, 0x90, 0xE0,
      0xF0, 0x80, 0xF0, 0x80, 0xF0,
      0xF0, 0x80, 0xF0, 0x80, 0x80
    ];

    for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 5; j++) {
        memory[0x050 + i * 5 + j] = font[i * 5 + j];
      }
    }

    const demoROM = [
      0x00, 0xE0, 0xA0, 0x73, 0x60, 0x00, 0x61, 0x00, 0xD0, 0x05, 0xF0, 0x0A, 0x12, 0x00
    ];

    for (let i = 0; i < demoROM.length; i++) {
      memory[0x200 + i] = demoROM[i];
    }

    const canvas = document.getElementById('display');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const keyMap = {
      '1': 0x1, '2': 0x2, '3': 0x3, '4': 0x4, '5': 0x5, '6': 0x6,
      '7': 0x7, '8': 0x8, '9': 0x9, '0': 0x0, 'A': 0xA, 'B': 0xB,
      'C': 0xC, 'D': 0xD, 'E': 0xE, 'F': 0xF
    };

    const keys = new Array(16).fill(false);

    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('mousedown', () => {
        const keyVal = keyMap[key.dataset.key];
        keys[keyVal] = true;
      });
      key.addEventListener('mouseup', () => {
        const keyVal = keyMap[key.dataset.key];
        keys[keyVal] = false;
      });
    });

    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key in keyMap) {
        keys[keyMap[key]] = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toUpperCase();
      if (key in keyMap) {
        keys[keyMap[key]] = false;
      }
    });

    const runButton = document.getElementById('run');
    const pauseButton = document.getElementById('pause');
    const stepButton = document.getElementById('step');
    const resetButton = document.getElementById('reset');
    const speedSlider = document.getElementById('speed');

    let running = false;
    let stepMode = false;
    let instructionsPerFrame = 100;

    function updateDebugger() {
      const registersDiv = document.getElementById('registers');
      let registersHTML = '';
      for (let i = 0; i < 16; i++) {
        registersHTML += `V${i.toString(16).toUpperCase()}: ${V[i].toString(16).padStart(2, '0')} `;
        if (i % 4 === 3) registersHTML += '<br>';
      }
      registersDiv.innerHTML = registersHTML;

      document.getElementById('index').textContent = `I: ${I.toString(16).toUpperCase().padStart(4, '0')}`;
      document.getElementById('pc').textContent = `PC: ${PC.toString(16).toUpperCase().padStart(4, '0')}`;
      
      let stackHTML = '';
      for (let i = 0; i < stack.length; i++) {
        stackHTML += `${stack[i].toString(16).toUpperCase().padStart(4, '0')} `;
      }
      document.getElementById('stack').textContent = stackHTML || 'Empty';

      const currentOp = (memory[PC] << 8) | memory[PC + 1];
      document.getElementById('current-instruction').textContent = `0x${currentOp.toString(16).toUpperCase().padStart(4, '0')}`;
    }

    function executeInstruction() {
      const opcode = (memory[PC] << 8) | memory[PC + 1];
      PC += 2;

      const x = (opcode & 0x0F00) >> 8;
      const y = (opcode & 0x00F0) >> 4;
      const n = opcode & 0x000F;
      const nn = opcode & 0x00FF;
      const nnn = opcode & 0x0FFF;

      switch (opcode & 0xF000) {
        case 0x0000:
          if (opcode === 0x00E0) {
            display.fill(0);
          } else if (opcode === 0x00EE) {
            PC = stack.pop();
          }
          break;
        case 0x1000:
          PC = nnn;
          break;
        case 0x2000:
          stack.push(PC);
          PC = nnn;
          break;
        case 0x3000:
          if (V[x] === nn) PC += 2;
          break;
        case 0x4000:
          if (V[x] !== nn) PC += 2;
          break;
        case 0x5000:
          if (V[x] === V[y]) PC += 2;
          break;
        case 0x6000:
          V[x] = nn;
          break;
        case 0x7000:
          V[x] = (V[x] + nn) & 0xFF;
          break;
        case 0x8000:
          switch (n) {
            case 0x0: V[x] = V[y]; break;
            case 0x1: V[x] |= V[y]; break;
            case 0x2: V[x] &= V[y]; break;
            case 0x3: V[x] ^= V[y]; break;
            case 0x4:
              const sum = V[x] + V[y];
              V[x] = sum & 0xFF;
              V[0xF] = sum > 0xFF ? 1 : 0;
              break;
            case 0x5:
              V[0xF] = V[x] > V[y] ? 1 : 0;
              V[x] = (V[x] - V[y]) & 0xFF;
              break;
            case 0x6:
              V[0xF] = V[x] & 1;
              V[x] >>= 1;
              break;
            case 0x7:
              V[0xF] = V[y] > V[x] ? 1 : 0;
              V[x] = (V[y] - V[x]) & 0xFF;
              break;
            case 0xE:
              V[0xF] = (V[x] >> 7) & 1;
              V[x] = (V[x] << 1) & 0xFF;
              break;
          }
          break;
        case 0x9000:
          if (V[x] !== V[y]) PC += 2;
          break;
        case 0xA000:
          I = nnn;
          break;
        case 0xB000:
          PC = nnn + V[0];
          break;
        case 0xC000:
          V[x] = Math.floor(Math.random() * 256) & nn;
          break;
        case 0xD000:
          let collision = 0;
          for (let row = 0; row < n; row++) {
            const spriteByte = memory[I + row];
            for (let col = 0; col < 8; col++) {
              if (spriteByte & (0x80 >> col)) {
                const px = (V[x] + col) % 64;
                const py = (V[y] + row) % 32;
                const index = py * 64 + px;
                if (display[index] === 1) collision = 1;
                display[index] ^= 1;
              }
            }
          }
          V[0xF] = collision;
          break;
        case 0xE000:
          switch (nn) {
            case 0x9E:
              if (keys[V[x]]) PC += 2;
              break;
            case 0xA1:
              if (!keys[V[x]]) PC += 2;
              break;
          }
          break;
        case 0xF000:
          switch (nn) {
            case 0x07: V[x] = delayTimer; break;
            case 0x0A:
              for (let i = 0; i < 16; i++) {
                if (keys[i]) {
                  V[x] = i;
                  break;
                }
              }
              if (!keys.some(k => k)) PC -= 2;
              break;
            case 0x15: delayTimer = V[x]; break;
            case 0x18: soundTimer = V[x]; break;
            case 0x1E: I += V[x]; break;
            case 0x29: I = 0x050 + V[x] * 5; break;
            case 0x33:
              const num = V[x];
              memory[I] = Math.floor(num / 100);
              memory[I + 1] = Math.floor((num % 100) / 10);
              memory[I + 2] = num % 10;
              break;
            case 0x55:
              for (let i = 0; i <= x; i++) {
                memory[I + i] = V[i];
              }
              break;
            case 0x65:
              for (let i = 0; i <= x; i++) {
                V[i] = memory[I + i];
              }
              break;
          }
          break;
      }
    }

    function drawScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < 32; y++) {
        for (let x = 0; x < 64; x++) {
          if (display[y * 64 + x]) {
            ctx.fillStyle = 'white';
            ctx.fillRect(x * 10, y * 10, 10, 10);
          }
        }
      }
    }

    function mainLoop() {
      if (running || stepMode) {
        if (delayTimer > 0) delayTimer--;
        if (soundTimer > 0) soundTimer--;

        for (let i = 0; i < instructionsPerFrame; i++) {
          executeInstruction();
        }

        drawScreen();
        updateDebugger();
      }

      requestAnimationFrame(mainLoop);
    }

    requestAnimationFrame(mainLoop);

    runButton.addEventListener('click', () => {
      running = true;
      stepMode = false;
    });

    pauseButton.addEventListener('click', () => {
      running = false;
    });

    stepButton.addEventListener('click', () => {
      running = false;
      stepMode = true;
      mainLoop();
    });

    resetButton.addEventListener('click', () => {
      memory.fill(0);
      V.fill(0);
      I = 0;
      PC = 0x200;
      stack = [];
      delayTimer = 0;
      soundTimer = 0;
      display.fill(0);
      for (let i = 0; i < demoROM.length; i++) {
        memory[0x200 + i] = demoROM[i];
      }
      updateDebugger();
    });

    speedSlider.addEventListener('input', (e) => {
      instructionsPerFrame = parseInt(e.target.value);
    });

    updateDebugger();
  </script>
</body>
</html>
