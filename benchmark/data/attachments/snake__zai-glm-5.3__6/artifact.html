<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SNAKE</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: rgba(255, 255, 255, 0.03);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #4ade80;
    --blue: #38bdf8;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #101a30, var(--bg)) fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 28px 16px; }
  header { text-align: center; margin-bottom: 16px; }
  h1 {
    margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 12px; text-indent: 12px;
    background: linear-gradient(90deg, var(--green), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
  #modeLabel { color: #94a3b8; font-weight: 600; letter-spacing: 1px; }

  /* HUD: one score panel per snake */
  .hud { display: flex; gap: 14px; width: 600px; margin-bottom: 12px; }
  .panel {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--green);
    box-shadow: 0 0 18px rgba(74, 222, 128, 0.10);
  }
  .panel.blue { border-left-color: var(--blue); box-shadow: 0 0 18px rgba(56, 189, 248, 0.10); }
  .p-name { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
  .p-stats { margin-top: 4px; font-size: 13px; color: #94a3b8; }
  .p-stats b { color: #fff; }

  /* Stage: 600x600 canvas with overlays on top */
  .stage {
    position: relative; width: 600px; height: 600px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.12), 0 0 90px rgba(74, 222, 128, 0.06);
  }
  canvas { display: block; background: #0d1526; }
  footer { margin-top: 12px; font-size: 12px; color: #475569; letter-spacing: 0.5px; }

  /* Overlays (start menu / game over / paused) */
  .overlay {
    position: absolute; inset: 0; z-index: 5; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(11, 18, 32, 0.90); backdrop-filter: blur(3px);
  }
  .hidden { display: none !important; }
  .ov-title { font-size: 52px; font-weight: 800; letter-spacing: 8px; text-indent: 8px; text-shadow: 0 0 24px rgba(74, 222, 128, 0.35); }
  .ov-title.small { font-size: 36px; text-shadow: 0 0 20px rgba(56, 189, 248, 0.30); }
  .ov-sub { color: #94a3b8; font-size: 14px; }
  .menu-btns { margin-top: 8px; }
  .menu-btns button {
    display: block; width: 290px; margin: 7px 0; padding: 12px; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-family: inherit; color: var(--text);
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .menu-btns button:hover { border-color: var(--green); box-shadow: 0 0 16px rgba(74, 222, 128, 0.25); transform: translateY(-1px); }
  .menu-btns button:nth-child(2):hover { border-color: var(--blue); box-shadow: 0 0 16px rgba(56, 189, 248, 0.25); }
  .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend b { color: #94a3b8; }
  .winner { font-size: 22px; font-weight: 700; color: #facc15; }
  .final { color: #cbd5e1; line-height: 1.8; white-space: pre-line; font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SNAKE</h1>
    <div class="sub"><span id="modeLabel">MENU</span> · <span id="controlsHint">pick a mode to start</span></div>
  </header>

  <!-- HUD -->
  <div class="hud">
    <div class="panel" id="panel1">
      <div class="p-name" id="name1">Player 1</div>
      <div class="p-stats">SCORE <b id="score1">0</b> · LEN <b id="len1">3</b></div>
    </div>
    <div class="panel blue" id="panel2">
      <div class="p-name" id="name2">Player 2</div>
      <div class="p-stats">SCORE <b id="score2">0</b> · LEN <b id="len2">3</b></div>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage" id="stage">
    <canvas id="game" width="600" height="600"></canvas>

    <!-- Start menu -->
    <div class="overlay" id="menuOverlay">
      <div class="ov-title">🐍 SNAKE</div>
      <div class="ov-sub">classic snake · 30×30 grid · two snakes</div>
      <div class="menu-btns">
        <button data-mode="hh">1 · Human vs Human</button>
        <button data-mode="ch">2 · CPU vs Human</button>
        <button data-mode="cc">3 · CPU vs CPU</button>
      </div>
      <div class="legend">
        <div><b>P1</b> WASD</div>
        <div><b>P2</b> Arrow keys</div>
        <div><b>P</b> Pause</div>
      </div>
    </div>

    <!-- Game over -->
    <div class="overlay hidden" id="overOverlay">
      <div class="ov-title small">GAME OVER</div>
      <div class="winner" id="winnerText">—</div>
      <div class="final" id="finalScores"></div>
      <div class="hint">ENTER / SPACE / R — restart · M — menu</div>
    </div>

    <!-- Paused -->
    <div class="overlay hidden" id="pauseOverlay">
      <div class="ov-title small">PAUSED</div>
      <div class="hint">press P to resume</div>
    </div>
  </div>

  <footer>1/2/3 — choose mode · P — pause · R — restart · M — menu</footer>
</div>

<script>
'use strict';

/* ============================================================
   Constants & canvas setup
   ============================================================ */
const GRID = 30;          // 30x30 cells
const CELL = 20;          // 20px per cell
const SIZE = GRID * CELL; // 600px board
const DIRS4 = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = SIZE * dpr;
canvas.height = SIZE * dpr;
canvas.style.width = SIZE + 'px';
canvas.style.height = SIZE + 'px';
ctx.scale(dpr, dpr); // crisp rendering on high-DPI screens

/* DOM references */
const menuOverlay = document.getElementById('menuOverlay');
const overOverlay = document.getElementById('overOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const modeLabel = document.getElementById('modeLabel');
const controlsHint = document.getElementById('controlsHint');
const name1 = document.getElementById('name1');
const name2 = document.getElementById('name2');
const score1 = document.getElementById('score1');
const score2 = document.getElementById('score2');
const len1 = document.getElementById('len1');
const len2 = document.getElementById('len2');
const winnerText = document.getElementById('winnerText');
const finalScores = document.getElementById('finalScores');

/* ============================================================
   Snake class
   ============================================================ */
class Snake {
  constructor(name, color, isCPU, cells, dir) {
    this.name = name;
    this.color = color;
    this.isCPU = isCPU;
    this.body = cells.slice();   // head is at index 0
    this.dir = { x: dir.x, y: dir.y };
    this.queue = [];             // buffered direction changes (max 2)
    this.score = 0;              // food eaten
  }

  /* Queue a direction change; ignore duplicates and 180° reversals */
  setDir(dx, dy) {
    const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
    if (dx === last.x && dy === last.y) return;          // duplicate
    if (dx === -last.x && dy === -last.y) return;        // 180° reversal
    if (this.queue.length >= 2) return;                  // queue full
    this.queue.push({ x: dx, y: dy });
  }

  /* Consume the next buffered direction (or keep current) */
  nextDir() {
    return this.queue.length ? this.queue.shift() : this.dir;
  }
}

/* ============================================================
   Game state
   ============================================================ */
let state = 'menu';      // 'menu' | 'playing' | 'paused' | 'over'
let mode = null;         // 'hh' | 'ch' | 'cc'
let snake1 = null;
let snake2 = null;
let snakes = [];
let food = null;
let lastTime = 0;
let acc = 0;             // time accumulator for the fixed-step loop

const MODES = {
  hh: { label: 'HUMAN VS HUMAN', hint: 'P1: WASD · P2: Arrow keys' },
  ch: { label: 'CPU VS HUMAN',   hint: 'You: Arrows / WASD · CPU: AI' },
  cc: { label: 'CPU VS CPU',     hint: 'CPU battle — sit back and watch' }
};

/* ============================================================
   Helpers
   ============================================================ */
function inBounds(x, y) {
  return x >= 0 && x < GRID && y >= 0 && y < GRID;
}
function cellKey(x, y) {
  return x + ',' + y;
}
function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

/* BFS shortest path; returns the FIRST STEP cell from start toward goal, or null */
function bfsPath(start, goal, blockedSet) {
  const startKey = cellKey(start.x, start.y);
  const parent = new Map([[startKey, null]]);
  const queue = [start];
  while (queue.length) {
    const cur = queue.shift();
    const curKey = cellKey(cur.x, cur.y);
    if (curKey === cellKey(goal.x, goal.y)) {
      // walk back through parents until we find the cell right after start
      let node = cur;
      while (parent.get(cellKey(node.x, node.y)) !== null) {
        const p = parent.get(cellKey(node.x, node.y));
        if (cellKey(p.x, p.y) === startKey) return node;
        node = p;
      }
      return null;
    }
    for (const d of DIRS4) {
      const nx = cur.x + d.x, ny = cur.y + d.y;
      const nk = cellKey(nx, ny);
      if (!inBounds(nx, ny) || blockedSet.has(nk) || parent.has(nk)) continue;
      parent.set(nk, cur);
      queue.push({ x: nx, y: ny });
    }
  }
  return null;
}

/* Flood fill: count cells reachable from start (blocked cells act as walls) */
function floodFill(start, blockedSet) {
  const seen = new Set([cellKey(start.x, start.y)]);
  const stack = [start];
  let count = 0;
  while (stack.length) {
    const cur = stack.pop();
    count++;
    for (const d of DIRS4) {
      const nx = cur.x + d.x, ny = cur.y + d.y;
      const nk = cellKey(nx, ny);
      if (!inBounds(nx, ny) || blockedSet.has(nk) || seen.has(nk)) continue;
      seen.add(nk);
      stack.push({ x: nx, y: ny });
    }
  }
  return count;
}

/* ============================================================
   CPU AI
   ============================================================ */
function cpuDir(snake) {
  const head = snake.body[0];

  // Obstacles: all cells of both snakes EXCEPT the AI snake's own tail (it vacates)
  const obstacles = new Set();
  for (const s of snakes) {
    for (let i = 0; i < s.body.length; i++) {
      if (s === snake && i === s.body.length - 1) continue;
      obstacles.add(cellKey(s.body[i].x, s.body[i].y));
    }
  }

  // Greedy: take the BFS first step toward food if it is safe and leaves room
  const step = bfsPath(head, food, obstacles);
  if (step) {
    const deadly = !inBounds(step.x, step.y) || obstacles.has(cellKey(step.x, step.y));
    const space = floodFill(step, obstacles);
    if (!deadly && space >= snake.body.length + 2) {
      return { x: step.x - head.x, y: step.y - head.y };
    }
  }

  // Survival mode: pick the immediately-safe direction with the most open space
  const nonReverse = DIRS4.filter(d => !(d.x === -snake.dir.x && d.y === -snake.dir.y));
  let best = null, bestSpace = -1;
  for (const d of nonReverse) {
    const nx = head.x + d.x, ny = head.y + d.y;
    if (!inBounds(nx, ny) || obstacles.has(cellKey(nx, ny))) continue;
    const space = floodFill({ x: nx, y: ny }, obstacles);
    const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
    const bestDist = best ? Math.abs(best.x - food.x) + Math.abs(best.y - food.y) : Infinity;
    if (space > bestSpace || (space === bestSpace && dist < bestDist)) {
      best = { x: nx, y: ny };
      bestSpace = space;
    }
  }
  if (best) return { x: best.x - head.x, y: best.y - head.y };
  return snake.dir; // trapped: keep going
}

/* ============================================================
   Game setup / flow
   ============================================================ */
function startGame(m) {
  mode = m;
  state = 'playing';

  const cpu1 = m === 'cc';
  const cpu2 = m !== 'hh';
  const name2 = m === 'hh' ? 'Player 2' : (m === 'ch' ? 'CPU' : 'CPU 2');

  snake1 = new Snake(cpu1 ? 'CPU 1' : 'Player 1', '#4ade80', cpu1,
    [{ x: 7, y: 15 }, { x: 6, y: 15 }, { x: 5, y: 15 }], { x: 1, y: 0 });
  snake2 = new Snake(name2, '#38bdf8', cpu2,
    [{ x: 22, y: 14 }, { x: 23, y: 14 }, { x: 24, y: 14 }], { x: -1, y: 0 });
  snakes = [snake1, snake2];

  spawnFood();
  acc = 0;

  menuOverlay.classList.add('hidden');
  overOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');

  modeLabel.textContent = MODES[m].label;
  controlsHint.textContent = MODES[m].hint;
  updateHUD();
}

function showMenu() {
  state = 'menu';
  menuOverlay.classList.remove('hidden');
  overOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  modeLabel.textContent = 'MENU';
  controlsHint.textContent = 'pick a mode to start';
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    pauseOverlay.classList.remove('hidden');
    acc = 0;
  } else if (state === 'paused') {
    state = 'playing';
    pauseOverlay.classList.add('hidden');
    acc = 0; // reset accumulator so there is no catch-up tick on resume
  }
}

function gameOver(winner) {
  state = 'over';
  winnerText.textContent = winner ? winner.name + ' wins! 🏆' : "It's a draw!";
  finalScores.textContent =
    snake1.name + ' — score ' + snake1.score + ' · length ' + snake1.body.length + '\n' +
    snake2.name + ' — score ' + snake2.score + ' · length ' + snake2.body.length;
  overOverlay.classList.remove('hidden');
}

/* Place food on a random empty cell; returns false when the board is full */
function spawnFood() {
  const occupied = new Set();
  for (const s of snakes) {
    for (const c of s.body) occupied.add(cellKey(c.x, c.y));
  }
  const free = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (!occupied.has(cellKey(x, y))) free.push({ x: x, y: y });
    }
  }
  if (!free.length) return false;
  food = free[Math.floor(Math.random() * free.length)];
  return true;
}

function updateHUD() {
  name1.textContent = snake1.name;
  name2.textContent = snake2.name;
  score1.textContent = snake1.score;
  score2.textContent = snake2.score;
  len1.textContent = snake1.body.length;
  len2.textContent = snake2.body.length;
}

/* Tick interval speeds up as food is eaten (110ms → min 75ms) */
function tickMs() {
  return Math.max(75, 110 - 2 * (snake1.score + snake2.score));
}

/* ============================================================
   Tick: one simultaneous simulation step
   ============================================================ */
function hitsBody(cell, body, eating) {
  for (let i = 0; i < body.length; i++) {
    // the tail cell vacates this tick unless that snake is eating (growing)
    if (i === body.length - 1 && !eating) continue;
    if (body[i].x === cell.x && body[i].y === cell.y) return true;
  }
  return false;
}

function tick() {
  // 1. compute intended direction + new head for each snake (no one moves yet)
  const moves = snakes.map(s => {
    const dir = s.isCPU ? cpuDir(s) : s.nextDir();
    s.dir = dir;
    return {
      snake: s,
      head: { x: s.body[0].x + dir.x, y: s.body[0].y + dir.y },
      eating: false,
      died: false
    };
  });
  const [mA, mB] = moves;

  // 2. eating flags
  for (const m of moves) m.eating = !!food && m.head.x === food.x && m.head.y === food.y;

  // 3. compute ALL deaths before applying any moves
  for (const [me, other] of [[mA, mB], [mB, mA]]) {
    if (!inBounds(me.head.x, me.head.y)) me.died = true;              // (a) wall
    if (hitsBody(me.head, me.snake.body, me.eating)) me.died = true;  // (b) self hit
    if (hitsBody(me.head, other.snake.body, other.eating)) me.died = true; // (c) other snake
  }
  // (d) head-to-head: both new heads land on the same cell
  if (mA.head.x === mB.head.x && mA.head.y === mB.head.y) { mA.died = true; mB.died = true; }
  // (e) head-swap: snakes pass through each other
  const hA = mA.snake.body[0], hB = mB.snake.body[0];
  if (mA.head.x === hB.x && mA.head.y === hB.y && mB.head.x === hA.x && mB.head.y === hA.y) {
    mA.died = true; mB.died = true;
  }

  // 4. apply moves
  for (const m of moves) {
    m.snake.body.unshift(m.head);
    if (m.eating) m.snake.score++; // grow: tail kept
    else m.snake.body.pop();
  }
  if (mA.eating || mB.eating) {
    const eater = mA.eating ? mA.snake : mB.snake;
    if (!spawnFood()) { // board full → eating snake wins
      updateHUD();
      gameOver(eater);
      return;
    }
  }
  updateHUD();

  // 5. resolve deaths
  if (mA.died || mB.died) {
    if (mA.died && mB.died) gameOver(null);             // both died: draw
    else gameOver(mA.died ? mB.snake : mA.snake);       // survivor wins
  }
}

/* ============================================================
   Rendering
   ============================================================ */
function drawFood(now) {
  if (!food) return;
  const pulse = (Math.sin(now / 180) + 1) / 2; // 0..1
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;
  ctx.shadowColor = '#f87171';
  ctx.shadowBlur = 10 + pulse * 14;
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(cx, cy, 5.5 + pulse * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // small specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(cx - 1.5, cy - 1.5, 1.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawSnake(s) {
  const len = s.body.length;
  // body first (tail → head) so the head ends up on top
  for (let i = len - 1; i >= 0; i--) {
    const seg = s.body[i];
    const t = len === 1 ? 0 : i / (len - 1);
    const alpha = 1 - t * 0.55; // fade toward the tail
    if (i === 0) {
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = hexA(s.color, 1); // brighter head
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = hexA(s.color, alpha);
    }
    rr(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, i === 0 ? 7 : 5);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // two small eyes on the head, oriented by direction
  const h = s.body[0];
  const cx = h.x * CELL + CELL / 2;
  const cy = h.y * CELL + CELL / 2;
  const d = s.dir;
  const fx = cx + d.x * 4, fy = cy + d.y * 4; // forward anchor
  const px = -d.y, py = d.x;                  // perpendicular axis
  for (const sgn of [1, -1]) {
    const ex = fx + px * 4.5 * sgn;
    const ey = fy + py * 4.5 * sgn;
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(ex, ey, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0b1220';
    ctx.beginPath();
    ctx.arc(ex + d.x * 0.9, ey + d.y * 0.9, 1.1, 0, Math.PI * 2);
    ctx.fill();
  }
}

function render(now) {
  // background
  ctx.fillStyle = '#0d1526';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // faint grid lines
  ctx.strokeStyle = 'rgba(148,163,184,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < GRID; i++) {
    ctx.moveTo(i * CELL + 0.5, 0);
    ctx.lineTo(i * CELL + 0.5, SIZE);
    ctx.moveTo(0, i * CELL + 0.5);
    ctx.lineTo(SIZE, i * CELL + 0.5);
  }
  ctx.stroke();

  drawFood(now);
  if (snakes.length) {
    drawSnake(snakes[0]);
    drawSnake(snakes[1]);
  }
}

/* ============================================================
   Main loop (fixed timestep via accumulator)
   ============================================================ */
function loop(now) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  const dt = Math.min(now - lastTime, 250); // clamp huge frame gaps
  lastTime = now;

  if (state === 'playing') {
    acc += dt;
    while (acc >= tickMs()) {
      acc -= tickMs();
      tick();
      if (state !== 'playing') { acc = 0; break; }
    }
  }
  render(now);
}
requestAnimationFrame(loop);

/* ============================================================
   Keyboard controls
   ============================================================ */
const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

function isWASD(k) {
  return k.length === 1 && 'wasdWASD'.includes(k);
}
function keyToDir(k) {
  switch (k) {
    case 'w': case 'W': case 'ArrowUp':    return { x: 0, y: -1 };
    case 's': case 'S': case 'ArrowDown':  return { x: 0, y: 1 };
    case 'a': case 'A': case 'ArrowLeft':  return { x: -1, y: 0 };
    case 'd': case 'D': case 'ArrowRight': return { x: 1, y: 0 };
  }
  return null;
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  // always swallow arrows and space so the page never scrolls
  if (ARROWS.includes(k) || k === ' ' || k === 'Spacebar') e.preventDefault();

  if (state === 'menu') {
    if (k === '1') startGame('hh');
    else if (k === '2') startGame('ch');
    else if (k === '3') startGame('cc');
    return;
  }

  if (state === 'over') {
    if (k === 'Enter' || k === ' ' || k === 'Spacebar' || k === 'r' || k === 'R') {
      startGame(mode); // restart the SAME mode
    } else if (k === 'm' || k === 'M' || k === 'Escape') {
      showMenu();
    }
    return;
  }

  if (state === 'paused') {
    if (k === 'p' || k === 'P') togglePause();
    return;
  }

  // state === 'playing'
  if (k === 'p' || k === 'P') {
    togglePause();
    return;
  }

  const dir = keyToDir(k);
  if (!dir) return;
  if (mode === 'hh') {
    if (isWASD(k)) snake1.setDir(dir.x, dir.y);
    else if (ARROWS.includes(k)) snake2.setDir(dir.x, dir.y);
  } else if (mode === 'ch') {
    // single human accepts BOTH arrow keys and WASD
    if (isWASD(k) || ARROWS.includes(k)) snake1.setDir(dir.x, dir.y);
  }
  // 'cc': no human input
});

/* Menu buttons (clickable alternative to keys 1/2/3) */
document.querySelectorAll('#menuOverlay button').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.blur(); // keep keyboard focus on the window
    startGame(btn.dataset.mode);
  });
});
</script>
