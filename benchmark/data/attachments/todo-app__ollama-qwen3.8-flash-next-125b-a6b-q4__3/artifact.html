<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a90a2;
    --accent: #5b6cff;
    --accent-dark: #4553d6;
    --danger: #ff5b6c;
    --border: #e6e8f0;
    --done: #b6bccb;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(160deg, #eef1ff 0%, var(--bg) 45%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .app {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---- Input row ---- */
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  #todo-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: #fbfcff;
    color: var(--text);
  }

  #todo-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91, 108, 255, 0.15);
  }

  #add-btn {
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  #add-btn:hover { background: var(--accent-dark); }
  #add-btn:active { transform: scale(0.97); }

  /* ---- Filters ---- */
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #fafbff;
  }

  .filter-btn {
    padding: 6px 14px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { color: var(--accent); border-color: var(--accent); }

  .filter-btn.active {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ---- Todo list ---- */
  #todo-list {
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    animation: slideIn 0.18s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .todo-item:last-child { border-bottom: none; }

  .todo-checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .todo-text {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
    cursor: pointer;
    user-select: none;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--done);
  }

  .delete-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .delete-btn:hover {
    color: #fff;
    background: var(--danger);
  }

  /* ---- Footer / empty state ---- */
  .empty-state {
    padding: 36px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--muted);
    background: #fafbff;
    border-top: 1px solid var(--border);
  }

  #clear-completed {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: color 0.15s;
  }

  #clear-completed:hover { color: var(--danger); }
  #clear-completed:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <main class="app">
    <h1>Todos</h1>
    <p class="subtitle">Stay organized. Your list is saved automatically.</p>

    <section class="card">
      <form id="todo-form" class="input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="300"
          aria-label="New todo"
        >
        <button type="submit" id="add-btn">Add</button>
      </form>

      <nav class="filters" aria-label="Filter todos">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </nav>

      <ul id="todo-list" aria-live="polite"></ul>

      <div class="stats">
        <span id="items-left">0 items left</span>
        <button id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todos.ollama-qwen3.8-flash-next-125b-a6b-q4_01';

  /** @type {{id:string,text:string,completed:boolean}[]} */
  var todos = loadTodos();
  var currentFilter = 'all';

  var form = document.getElementById('todo-form');
  var input = document.getElementById('todo-input');
  var listEl = document.getElementById('todo-list');
  var itemsLeftEl = document.getElementById('items-left');
  var clearBtn = document.getElementById('clear-completed');
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll('.filter-btn'));

  // ---------- Persistence ----------

  function loadTodos() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (t) {
        return t && typeof t.text === 'string';
      }).map(function (t) {
        return {
          id: typeof t.id === 'string' ? t.id : makeId(),
          text: t.text,
          completed: !!t.completed
        };
      });
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // Storage full or unavailable — app keeps working in-memory.
    }
  }

  function makeId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  // ---------- Actions ----------

  function addTodo(text) {
    todos.push({ id: makeId(), text: text, completed: false });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    todos.forEach(function (t) {
      if (t.id === id) t.completed = !t.completed;
    });
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    saveTodos();
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    filterBtns.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    render();
  }

  // ---------- Rendering ----------

  function visibleTodos() {
    if (currentFilter === 'active') {
      return todos.filter(function (t) { return !t.completed; });
    }
    if (currentFilter === 'completed') {
      return todos.filter(function (t) { return t.completed; });
    }
    return todos;
  }

  function render() {
    listEl.innerHTML = '';
    var items = visibleTodos();

    if (items.length === 0) {
      var empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent =
        todos.length === 0
          ? 'No todos yet. Add one above!'
          : currentFilter === 'active'
            ? 'Nothing active — nice work!'
            : 'No completed todos yet.';
      listEl.appendChild(empty);
    } else {
      items.forEach(function (todo) {
        listEl.appendChild(createTodoElement(todo));
      });
    }

    var activeCount = todos.filter(function (t) { return !t.completed; }).length;
    itemsLeftEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    var completedCount = todos.length - activeCount;
    clearBtn.disabled = completedCount === 0;
  }

  function createTodoElement(todo) {
    var li = document.createElement('li');
    li.className = 'todo-item' + (todo.completed ? ' completed' : '');
    li.dataset.id = todo.id;

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'todo-checkbox';
    checkbox.checked = todo.completed;
    checkbox.setAttribute('aria-label',
      (todo.completed ? 'Mark active: ' : 'Mark complete: ') + todo.text);
    checkbox.addEventListener('change', function () {
      toggleTodo(todo.id);
    });

    var span = document.createElement('span');
    span.className = 'todo-text';
    span.textContent = todo.text;
    span.addEventListener('click', function () {
      toggleTodo(todo.id);
    });

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'delete-btn';
    delBtn.textContent = '\u00D7';
    delBtn.setAttribute('aria-label', 'Delete: ' + todo.text);
    delBtn.addEventListener('click', function () {
      deleteTodo(todo.id);
    });

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(delBtn);
    return li;
  }

  // ---------- Events ----------

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addTodo(text);
    input.value = '';
    input.focus();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setFilter(btn.dataset.filter);
    });
  });

  clearBtn.addEventListener('click', clearCompleted);

  // Initial paint
  render();
})();
</script>
</body>
</html>
