<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Visualization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05070f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#canvas {
  border: 1px solid rgba(0, 229, 255, 0.2);
  box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
}
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
// ============================================================
// SETUP
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Color palette
const COLORS = {
  bg: '#05070f',
  bgGlow: '#101a3a',
  branch: '#00e5ff',
  accent: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  ui: '#ffd400',
  grid: 'rgba(0, 229, 255, 0.08)'
};

// ============================================================
// STATE
// ============================================================
let neurons = [];
let synapses = [];
let pulses = [];
let isPaused = false;
let animationId = null;

// ============================================================
// GUI SETUP
// ============================================================
const params = {
  // Growth
  neuronCount: 4,
  growthSpeed: 2,
  maxDepth: 6,
  splitChance: 0.3,
  curvature: 0.5,
  maxLength: 120,
  
  // Synapses
  synapseDistance: 80,
  synapseGlow: 15,
  
  // Pulses
  pulseSpeed: 3,
  pulseFrequency: 0.02,
  pulseBrightness: 1.0,
  
  // Visuals
  bgColor: COLORS.bg,
  branchColor: COLORS.branch,
  accentColor: COLORS.accent,
  synapseColor: COLORS.synapse,
  pulseColor: COLORS.pulse,
  
  // Buttons
  regenerate: () => regenerateNetwork(),
  clearCanvas: () => clearCanvas(),
  pauseResume: () => togglePause()
};

const gui = new dat.GUI();
const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count');
growthFolder.add(params, 'growthSpeed', 0.5, 5, 0.1).name('Growth Speed');
growthFolder.add(params, 'maxDepth', 3, 10, 1).name('Max Depth');
growthFolder.add(params, 'splitChance', 0, 1, 0.05).name('Split Chance');
growthFolder.add(params, 'curvature', 0, 1, 0.05).name('Curvature');
growthFolder.add(params, 'maxLength', 50, 200, 5).name('Max Length');
growthFolder.open();

const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDistance', 30, 150, 5).name('Distance Threshold');
synapseFolder.add(params, 'synapseGlow', 5, 30, 1).name('Glow Strength');
synapseFolder.open();

const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params, 'pulseSpeed', 1, 8, 0.1).name('Pulse Speed');
pulseFolder.add(params, 'pulseFrequency', 0.005, 0.05, 0.005).name('Frequency');
pulseFolder.add(params, 'pulseBrightness', 0.3, 2.0, 0.1).name('Brightness');
pulseFolder.open();

const visualFolder = gui.addFolder('Visuals');
visualFolder.addColor(params, 'bgColor').name('Background').onChange(() => drawBackground());
visualFolder.addColor(params, 'branchColor').name('Branch Color');
visualFolder.addColor(params, 'accentColor').name('Accent Color');
visualFolder.addColor(params, 'synapseColor').name('Synapse Color');
visualFolder.addColor(params, 'pulseColor').name('Pulse Color');
visualFolder.open();

gui.add(params, 'regenerate').name('Regenerate Network');
gui.add(params, 'clearCanvas').name('Clear Canvas');
gui.add(params, 'pauseResume').name('Pause/Resume');

// ============================================================
// NEURON GROWTH
// ============================================================
class Branch {
  constructor(x, y, angle, depth, parent) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.depth = depth;
    this.parent = parent;
    this.children = [];
    this.segments = [];
    this.growthProgress = 0;
    this.isGrowing = true;
    this.thickness = Math.max(1, 4 - depth * 0.5);
    this.isAccent = Math.random() < 0.2;
  }
  
  addSegment(x, y) {
    this.segments.push({ x, y });
  }
  
  update() {
    if (!this.isGrowing) return;
    
    const step = params.growthSpeed;
    const endX = this.x + Math.cos(this.angle) * step;
    const endY = this.y + Math.sin(this.angle) * step;
    
    this.addSegment(endX, endY);
    this.x = endX;
    this.y = endY;
    this.growthProgress += step;
    
    // Random curvature
    this.angle += (Math.random() - 0.5) * params.curvature * 0.3;
    
    // Check if should stop growing
    if (this.growthProgress >= params.maxLength || this.depth >= params.maxDepth) {
      this.isGrowing = false;
    }
    
    // Split chance
    if (this.isGrowing && Math.random() < params.splitChance && this.depth < params.maxDepth - 1) {
      const newAngle = this.angle + (Math.random() - 0.5) * Math.PI * 0.5;
      const child = new Branch(this.x, this.y, newAngle, this.depth + 1, this);
      this.children.push(child);
      neurons.push(child);
    }
  }
}

class Neuron {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.branches = [];
    this.isSeed = true;
    
    // Create initial branches
    for (let i = 0; i < 3; i++) {
      const angle = (Math.PI * 2 / 3) * i + Math.random() * 0.5;
      const branch = new Branch(x, y, angle, 0, null);
      this.branches.push(branch);
      neurons.push(branch);
    }
  }
  
  update() {
    this.branches.forEach(branch => branch.update());
  }
}

function generateNeurons() {
  neurons = [];
  synapses = [];
  pulses = [];
  
  const centerX = W / 2;
  const centerY = H / 2;
  const count = params.neuronCount;
  
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i;
    const dist = 50 + Math.random() * 100;
    const x = centerX + Math.cos(angle) * dist;
    const y = centerY + Math.sin(angle) * dist;
    const neuron = new Neuron(x, y);
    neurons.push(neuron);
  }
}

function regenerateNetwork() {
  generateNeurons();
}

function clearCanvas() {
  neurons = [];
  synapses = [];
  pulses = [];
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);
}

function togglePause() {
  isPaused = !isPaused;
}

// ============================================================
// SYNAPSE DETECTION
// ============================================================
function detectSynapses() {
  const tips = [];
  
  // Get all branch tips
  neurons.forEach(neuron => {
    if (neuron.isSeed) {
      neuron.branches.forEach(branch => {
        if (branch.segments.length > 0) {
          const last = branch.segments[branch.segments.length - 1];
          tips.push({ x: last.x, y: last.y, neuron });
        }
      });
    } else if (neuron.segments.length > 0) {
      const last = neuron.segments[neuron.segments.length - 1];
      tips.push({ x: last.x, y: last.y, neuron });
    }
  });
  
  // Check distances
  for (let i = 0; i < tips.length; i++) {
    for (let j = i + 1; j < tips.length; j++) {
      const dx = tips[i].x - tips[j].x;
      const dy = tips[i].y - tips[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < params.synapseDistance) {
        // Check if synapse already exists
        const exists = synapses.some(s => 
          (s.from === tips[i].neuron && s.to === tips[j].neuron) ||
          (s.from === tips[j].neuron && s.to === tips[i].neuron)
        );
        
        if (!exists) {
          synapses.push({
            from: tips[i].neuron,
            to: tips[j].neuron,
            fromTip: tips[i],
            toTip: tips[j],
            phase: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }
}

// ============================================================
// PULSE ANIMATION
// ============================================================
function spawnPulse() {
  if (synapses.length === 0) return;
  
  const synapse = synapses[Math.floor(Math.random() * synapses.length)];
  const startNode = Math.random() < 0.5 ? synapse.fromTip : synapse.toTip;
  const endNode = startNode === synapse.fromTip ? synapse.toTip : synapse.fromTip;
  
  pulses.push({
    x: startNode.x,
    y: startNode.y,
    targetX: endNode.x,
    targetY: endNode.y,
    progress: 0,
    synapse
  });
}

function updatePulses() {
  if (Math.random() < params.pulseFrequency) {
    spawnPulse();
  }
  
  pulses.forEach(pulse => {
    pulse.progress += params.pulseSpeed * 0.01;
    pulse.x = pulse.fromX + (pulse.targetX - pulse.fromX) * pulse.progress;
    pulse.y = pulse.fromY + (pulse.targetY - pulse.fromY) * pulse.progress;
  });
  
  // Remove completed pulses
  pulses = pulses.filter(p => p.progress < 1);
}

// ============================================================
// RENDERING
// ============================================================
function drawBackground() {
  ctx.fillStyle = params.bgColor;
  ctx.fillRect(0, 0, W, H);
  
  // Subtle vignette
  const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
  gradient.addColorStop(0, 'transparent');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
  
  // Scanlines
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 4) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawBranch(branch) {
  if (branch.segments.length < 2) return;
  
  const color = branch.isAccent ? params.accentColor : params.branchColor;
  
  ctx.strokeStyle = color;
  ctx.lineWidth = branch.thickness;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  ctx.beginPath();
  ctx.moveTo(branch.segments[0].x, branch.segments[0].y);
  
  for (let i = 1; i < branch.segments.length; i++) {
    const prev = branch.segments[i - 1];
    const curr = branch.segments[i];
    const midX = (prev.x + curr.x) / 2;
    const midY = (prev.y + curr.y) / 2;
    ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
  }
  
  const last = branch.segments[branch.segments.length - 1];
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
  
  // Draw children
  branch.children.forEach(child => drawBranch(child));
}

function drawSynapses() {
  synapses.forEach(synapse => {
    const pulse = Math.sin(Date.now() * 0.003 + synapse.phase) * 0.5 + 0.5;
    const alpha = 0.3 + pulse * 0.4;
    
    ctx.strokeStyle = `rgba(255, 43, 214, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.shadowColor = params.synapseColor;
    ctx.shadowBlur = params.synapseGlow;
    
    ctx.beginPath();
    ctx.moveTo(synapse.fromTip.x, synapse.fromTip.y);
    ctx.lineTo(synapse.toTip.x, synapse.toTip.y);
    ctx.stroke();
    
    // Glow point at midpoint
    const midX = (synapse.fromTip.x + synapse.toTip.x) / 2;
    const midY = (synapse.fromTip.y + synapse.toTip.y) / 2;
    
    ctx.fillStyle = `rgba(255, 43, 214, ${alpha * 0.8})`;
    ctx.shadowBlur = params.synapseGlow * 2;
    ctx.beginPath();
    ctx.arc(midX, midY, 3 + pulse * 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawPulses() {
  pulses.forEach(pulse => {
    const alpha = 1 - pulse.progress;
    
    ctx.fillStyle = `rgba(255, 243, 106, ${alpha * params.pulseBrightness})`;
    ctx.shadowColor = params.pulseColor;
    ctx.shadowBlur = 15;
    
    ctx.beginPath();
    ctx.arc(pulse.x, pulse.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawNeuronBodies() {
  neurons.forEach(neuron => {
    if (neuron.isSeed) {
      ctx.fillStyle = params.synapseColor;
      ctx.shadowColor = params.synapseColor;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(neuron.x, neuron.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

// ============================================================
// MAIN LOOP
// ============================================================
function animate() {
  if (!isPaused) {
    drawBackground();
    
    // Update neurons
    neurons.forEach(neuron => {
      if (neuron.isSeed) {
        neuron.update();
      } else if (neuron.isGrowing) {
        neuron.update();
      }
    });
    
    // Detect synapses
    detectSynapses();
    
    // Update pulses
    updatePulses();
    
    // Draw everything
    drawSynapses();
    
    neurons.forEach(neuron => {
      if (neuron.isSeed) {
        neuron.branches.forEach(branch => drawBranch(branch));
      } else if (neuron.segments.length > 0) {
        drawBranch(neuron);
      }
    });
    
    drawPulses();
    drawNeuronBodies();
  }
  
  animationId = requestAnimationFrame(animate);
}

// ============================================================
// INITIALIZATION
// ============================================================
generateNeurons();
drawBackground();
animate();
</script>
</body>
</html>
