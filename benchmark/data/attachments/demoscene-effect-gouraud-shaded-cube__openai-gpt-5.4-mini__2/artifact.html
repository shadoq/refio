<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gouraud Shaded Rotating Cube</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070c;
      color: #d8e2ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 12px;
      top: 10px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
      pointer-events: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud">FPS: 0.0
Wireframe: OFF
Pause: OFF
W toggle wireframe | P pause</div>
  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: false });
      const hud = document.getElementById('hud');

      const V3 = (x = 0, y = 0, z = 0) => ({ x, y, z });

      const add = (a, b) => V3(a.x + b.x, a.y + b.y, a.z + b.z);
      const sub = (a, b) => V3(a.x - b.x, a.y - b.y, a.z - b.z);
      const mul = (a, s) => V3(a.x * s, a.y * s, a.z * s);
      const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
      const cross = (a, b) => V3(
        a.y * b.z - a.z * b.y,
        a.z * b.x - a.x * b.z,
        a.x * b.y - a.y * b.x
      );
      const len = (a) => Math.hypot(a.x, a.y, a.z);
      const norm = (a) => {
        const l = len(a) || 1;
        return V3(a.x / l, a.y / l, a.z / l);
      };

      const vertices = [
        V3(-1, -1, -1), V3(1, -1, -1), V3(1, 1, -1), V3(-1, 1, -1),
        V3(-1, -1,  1), V3(1, -1,  1), V3(1, 1,  1), V3(-1, 1,  1)
      ];

      const faces = [
        [0, 1, 2, 3, V3(0, 0, -1)],
        [4, 5, 6, 7, V3(0, 0, 1)],
        [0, 4, 7, 3, V3(-1, 0, 0)],
        [1, 5, 6, 2, V3(1, 0, 0)],
        [3, 2, 6, 7, V3(0, 1, 0)],
        [0, 1, 5, 4, V3(0, -1, 0)]
      ];

      let wireframe = false;
      let paused = false;
      let lastTime = performance.now();
      let fpsSmoothed = 0;
      let angle = 0;

      function resize() {
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize, { passive: true });
      resize();

      addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') wireframe = !wireframe;
        if (e.code === 'KeyP') paused = !paused;
      });

      function rotateX(v, a) {
        const s = Math.sin(a), c = Math.cos(a);
        return V3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
      }
      function rotateY(v, a) {
        const s = Math.sin(a), c = Math.cos(a);
        return V3(v.x * c + v.z * s, v.y, -v.x * s + v.z * c);
      }
      function rotateZ(v, a) {
        const s = Math.sin(a), c = Math.cos(a);
        return V3(v.x * c - v.y * s, v.x * s + v.y * c, v.z);
      }

      function project(v) {
        const fov = 500;
        const z = v.z + 4.5;
        const s = fov / z;
        return {
          x: innerWidth * 0.5 + v.x * s,
          y: innerHeight * 0.5 - v.y * s,
          s,
          z
        };
      }

      function edgeFn(ax, ay, bx, by, cx, cy) {
        return (cx - ax) * (by - ay) - (cy - ay) * (bx - ax);
      }

      function fillTriangle(p0, p1, p2, c0, c1, c2) {
        const minX = Math.max(0, Math.floor(Math.min(p0.x, p1.x, p2.x)));
        const maxX = Math.min(innerWidth - 1, Math.ceil(Math.max(p0.x, p1.x, p2.x)));
        const minY = Math.max(0, Math.floor(Math.min(p0.y, p1.y, p2.y)));
        const maxY = Math.min(innerHeight - 1, Math.ceil(Math.max(p0.y, p1.y, p2.y)));
        const area = edgeFn(p0.x, p0.y, p1.x, p1.y, p2.x, p2.y);
        if (area === 0) return;
        const invArea = 1 / area;
        const img = ctx.getImageData(minX, minY, maxX - minX + 1, maxY - minY + 1);
        const data = img.data;
        const w = maxX - minX + 1;

        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            const w0 = edgeFn(p1.x, p1.y, p2.x, p2.y, x + 0.5, y + 0.5) * invArea;
            const w1 = edgeFn(p2.x, p2.y, p0.x, p0.y, x + 0.5, y + 0.5) * invArea;
            const w2 = 1 - w0 - w1;
            if (w0 >= 0 && w1 >= 0 && w2 >= 0) {
              const r = Math.max(0, Math.min(255, (c0.r * w0 + c1.r * w1 + c2.r * w2) * 255));
              const g = Math.max(0, Math.min(255, (c0.g * w0 + c1.g * w1 + c2.g * w2) * 255));
              const b = Math.max(0, Math.min(255, (c0.b * w0 + c1.b * w1 + c2.b * w2) * 255));
              const idx = ((y - minY) * w + (x - minX)) * 4;
              data[idx] = r;
              data[idx + 1] = g;
              data[idx + 2] = b;
              data[idx + 3] = 255;
            }
          }
        }
        ctx.putImageData(img, minX, minY);
      }

      function drawLine(a, b, color = '#fff') {
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function render(dt) {
        if (!paused) angle += dt * 0.0012;

        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        const rx = angle * 0.8;
        const ry = angle * 1.1;
        const rz = angle * 0.55;

        const light = V3(
          Math.cos(angle * 1.3) * 3.0,
          Math.sin(angle * 0.9) * 2.2,
          Math.sin(angle * 1.5) * 3.0
        );

        const transformed = vertices.map(v => {
          let p = v;
          p = rotateX(p, rx);
          p = rotateY(p, ry);
          p = rotateZ(p, rz);
          return p;
        });

        const projected = transformed.map(project);

        const tris = [];
        for (const face of faces) {
          const [i0, i1, i2, i3, nLocal] = face;
          const quad = [i0, i1, i2, i3];
          const normRot = norm(rotateZ(rotateY(rotateX(nLocal, rx), ry), rz));
          const center = mul(add(add(add(transformed[i0], transformed[i1]), transformed[i2]), transformed[i3]), 0.25);
          const viewDir = norm(mul(center, -1));
          if (dot(normRot, viewDir) <= 0) continue;

          const idxs = [[i0, i1, i2], [i0, i2, i3]];
          for (const [a, b, c] of idxs) {
            const pa = transformed[a], pb = transformed[b], pc = transformed[c];
            const faceN = norm(cross(sub(pb, pa), sub(pc, pa)));
            const triCenter = mul(add(add(pa, pb), pc), 1 / 3);
            if (dot(faceN, norm(mul(triCenter, -1))) <= 0) continue;

            const computeColor = (p, n) => {
              const l = norm(sub(light, p));
              const diff = Math.max(0, dot(n, l));
              const amb = 0.18;
              const intensity = Math.min(1, amb + diff * 0.82);
              return { r: 0.15 * intensity + 0.05, g: 0.55 * intensity + 0.08, b: 1.0 * intensity + 0.08 };
            };

            const ca = computeColor(pa, faceN);
            const cb = computeColor(pb, faceN);
            const cc = computeColor(pc, faceN);
            tris.push({
              p0: projected[a],
              p1: projected[b],
              p2: projected[c],
              c0: ca,
              c1: cb,
              c2: cc,
              z: (pa.z + pb.z + pc.z) / 3
            });
          }
        }

        tris.sort((a, b) => b.z - a.z);

        for (const t of tris) {
          fillTriangle(t.p0, t.p1, t.p2, t.c0, t.c1, t.c2);
          if (wireframe) {
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(t.p0.x, t.p0.y);
            ctx.lineTo(t.p1.x, t.p1.y);
            ctx.lineTo(t.p2.x, t.p2.y);
            ctx.closePath();
            ctx.stroke();
          }
        }

        const now = performance.now();
        const fps = 1000 / Math.max(1, dt);
        fpsSmoothed = fpsSmoothed ? fpsSmoothed * 0.9 + fps * 0.1 : fps;
        hud.textContent = `FPS: ${fpsSmoothed.toFixed(1)}\nWireframe: ${wireframe ? 'ON' : 'OFF'}\nPause: ${paused ? 'ON' : 'OFF'}\nW toggle wireframe | P pause`;
        lastTime = now;
        requestAnimationFrame(frame);
      }

      function frame(now) {
        const dt = now - lastTime;
        lastTime = now;
        render(dt);
      }

      requestAnimationFrame((now) => {
        lastTime = now;
        requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
