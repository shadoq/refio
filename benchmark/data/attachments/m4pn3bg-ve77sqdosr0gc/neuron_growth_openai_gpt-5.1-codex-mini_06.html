<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Neon Neural Bloom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-color: #05070f;
      --grid-color: rgba(0, 229, 255, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      color: #ffd400;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 15%, #101a3a 0%, rgba(5, 7, 15, 0.92) 45%, #05070f 80%);
      z-index: -2;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 4px;
      opacity: 0.65;
      mix-blend-mode: screen;
      z-index: -1;
      pointer-events: none;
    }
    .canvas-shell {
      position: relative;
      width: 820px;
      height: 820px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.04), transparent 55%);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 212, 0, 0.18);
    }
    canvas {
      width: 800px;
      height: 800px;
      border-radius: 12px;
      box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.4), 0 20px 60px rgba(0, 0, 0, 0.75);
      background-color: #05070f;
      image-rendering: optimizeSpeed;
    }
    .gui-shell {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 6;
      border-radius: 12px;
      overflow: hidden;
    }
    .gui-shell .dg.main {
      background: rgba(5, 7, 15, 0.92);
      border: 1px solid rgba(255, 212, 0, 0.45);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65);
    }
    .gui-shell .dg.main .close-button {
      border-radius: 50%;
      border: 1px solid rgba(255, 212, 0, 0.65);
    }
    .gui-shell .dg.main .dg {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="canvas-shell">
    <canvas id="neuronCanvas" width="800" height="800"></canvas>
  </div>
  <div class="gui-shell"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('neuronCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      const params = {
        neuronCount: 4,
        branchGrowthSpeed: 1.2,
        maxBranchDepth: 5,
        branchSplitChance: 0.35,
        branchCurvature: 0.75,
        maxBranchLength: 130,
        synapseDistanceThreshold: 30,
        synapseGlow: 0.9,
        pulseSpeed: 0.012,
        pulseFrequency: 0.03,
        pulseBrightness: 1.3,
        backgroundColor: '#05070f',
        branchColor: '#00e5ff',
        accentBranchColor: '#d6ff00',
        synapseColor: '#ff2bd6',
        pulseColor: '#fff36a'
      };

      const state = {
        segments: [],
        tips: [],
        synapses: [],
        pulses: [],
        staticEndpoints: new Map(),
        staticOrder: [],
        synapseKeys: new Set(),
        tipId: 0
      };

      let running = true;
      let lastTime = 0;

      const guiContainer = document.querySelector('.gui-shell');
      const gui = new dat.GUI({ autoPlace: false, width: 340 });
      guiContainer.appendChild(gui.domElement);

      const growthFolder = gui.addFolder('Growth');
      growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron count').onFinishChange(() => resetNetwork());
      growthFolder.add(params, 'branchGrowthSpeed', 0.1, 4, 0.05).name('Branch growth speed');
      growthFolder.add(params, 'maxBranchDepth', 2, 7, 1).name('Max branch depth');
      growthFolder.add(params, 'branchSplitChance', 0.05, 0.95, 0.01).name('Branch split chance');
      growthFolder.add(params, 'branchCurvature', 0, 1, 0.01).name('Branch curvature');
      growthFolder.add(params, 'maxBranchLength', 30, 220, 1).name('Max branch length');
      growthFolder.open();

      const synapseFolder = gui.addFolder('Synapses');
      synapseFolder.add(params, 'synapseDistanceThreshold', 10, 70, 1).name('Synapse distance threshold');
      synapseFolder.add(params, 'synapseGlow', 0.2, 1.8, 0.05).name('Synapse glow strength');
      synapseFolder.open();

      const pulseFolder = gui.addFolder('Pulses');
      pulseFolder.add(params, 'pulseSpeed', 0.001, 0.04, 0.001).name('Pulse speed');
      pulseFolder.add(params, 'pulseFrequency', 0.001, 0.2, 0.001).name('Pulse frequency');
      pulseFolder.add(params, 'pulseBrightness', 0.5, 2.5, 0.05).name('Pulse brightness');
      pulseFolder.open();

      const visualFolder = gui.addFolder('Visuals');
      visualFolder.addColor(params, 'backgroundColor').name('Background color').onChange(updateBackgroundColor);
      visualFolder.addColor(params, 'branchColor').name('Branch color');
      visualFolder.addColor(params, 'accentBranchColor').name('Accent branch color');
      visualFolder.addColor(params, 'synapseColor').name('Synapse color');
      visualFolder.addColor(params, 'pulseColor').name('Pulse color');
      visualFolder.open();

      const actions = {
        regenerate: () => resetNetwork(),
        clear: () => {
          state.segments = [];
          state.synapses = [];
          state.pulses = [];
          state.staticEndpoints = new Map();
          state.staticOrder = [];
          state.synapseKeys.clear();
        },
        pauseResume: () => {
          running = !running;
        }
      };

      gui.add(actions, 'regenerate').name('Regenerate network');
      gui.add(actions, 'clear').name('Clear canvas');
      gui.add(actions, 'pauseResume').name('Pause/Resume animation');

      function updateBackgroundColor(value = params.backgroundColor) {
        document.documentElement.style.setProperty('--bg-color', value);
        document.body.style.backgroundColor = value;
      }

      function randomRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function hexToRgb(hex) {
        const sanitized = hex.replace('#', '');
        const bigint = parseInt(sanitized, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255
        };
      }

      function mixColors(colorA, colorB, t) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return {
          r: Math.round(a.r + (b.r - a.r) * t),
          g: Math.round(a.g + (b.g - a.g) * t),
          b: Math.round(a.b + (b.b - a.b) * t)
        };
      }

      function rgbaString(color, alpha = 1) {
        return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      }

      function createTip(position, angle, depth) {
        const limitedDepth = clamp(depth, 0, params.maxBranchDepth);
        const lengthBase = clamp(params.maxBranchLength * (1 - limitedDepth * 0.08), 40, 220);
        return {
          id: state.tipId++,
          angle,
          prev: { x: position.x, y: position.y },
          length: 0,
          depth,
          maxLength: randomRange(lengthBase * 0.5, lengthBase),
          thickness: Math.max(0.4, 3.2 - depth * 0.6 + Math.random())
        };
      }

      function createSeeds() {
        const center = { x: width / 2, y: height / 2 };
        const count = clamp(Math.round(params.neuronCount), 3, 6);
        for (let i = 0; i < count; i++) {
          const offset = {
            x: center.x + randomRange(-50, 50),
            y: center.y + randomRange(-50, 50)
          };
          const angle = randomRange(0, Math.PI * 2);
          state.tips.push(createTip(offset, angle, 0));
        }
      }

      function resetNetwork() {
        state.segments = [];
        state.tips = [];
        state.synapses = [];
        state.pulses = [];
        state.staticEndpoints = new Map();
        state.staticOrder = [];
        state.synapseKeys.clear();
        state.tipId = 0;
        createSeeds();
      }

      function storeStaticEndpoint(tip) {
        state.staticEndpoints.set(tip.id, {
          kind: 'static',
          id: tip.id,
          pos: { x: tip.prev.x, y: tip.prev.y }
        });
        state.staticOrder.push(tip.id);
        if (state.staticOrder.length > 200) {
          const oldest = state.staticOrder.shift();
          state.staticEndpoints.delete(oldest);
        }
      }

      function spawnNewTips(tip) {
        if (tip.depth >= params.maxBranchDepth) {
          return;
        }
        if (state.segments.length > 2600) {
          return;
        }
        const splits = Math.random() < params.branchSplitChance ? 2 : 1;
        for (let i = 0; i < splits; i++) {
          const offset = (i === 0 ? -0.45 : 0.45) + (Math.random() - 0.5) * 0.4;
          const newAngle = tip.angle + offset;
          state.tips.push(createTip(tip.prev, newAngle, tip.depth + 1));
        }
      }

      function growBranches(delta) {
        const step = Math.max(0.3, params.branchGrowthSpeed * delta * 0.6);
        for (let i = state.tips.length - 1; i >= 0; i--) {
          const tip = state.tips[i];
          tip.length += step;
          const jitter = (Math.random() - 0.5) * 0.35 * params.branchCurvature;
          tip.angle += jitter;
          const dx = Math.cos(tip.angle) * step;
          const dy = Math.sin(tip.angle) * step;
          const nextPoint = {
            x: tip.prev.x + dx,
            y: tip.prev.y + dy
          };
          const control = {
            x: (tip.prev.x + nextPoint.x) * 0.5 + Math.cos(tip.angle + params.branchCurvature) * 12,
            y: (tip.prev.y + nextPoint.y) * 0.5 + Math.sin(tip.angle - params.branchCurvature) * 12
          };
          state.segments.push({
            start: { x: tip.prev.x, y: tip.prev.y },
            end: { x: nextPoint.x, y: nextPoint.y },
            control,
            thickness: tip.thickness,
            depth: tip.depth
          });
          tip.prev = nextPoint;
          if (state.segments.length > 2200) {
            state.segments.splice(0, state.segments.length - 2200);
          }
          if (
            tip.length >= tip.maxLength ||
            tip.depth >= params.maxBranchDepth ||
            tip.prev.x < 5 ||
            tip.prev.x > width - 5 ||
            tip.prev.y < 5 ||
            tip.prev.y > height - 5
          ) {
            state.tips.splice(i, 1);
            storeStaticEndpoint(tip);
            spawnNewTips(tip);
          }
        }
      }

      function getPointPosition(point) {
        if (point.kind === 'active') {
          return point.ref.prev;
        }
        return point.pos;
      }

      function detectSynapses() {
        const threshold = Math.max(6, params.synapseDistanceThreshold);
        const points = [...state.staticEndpoints.values()];
        for (const tip of state.tips) {
          points.push({ kind: 'active', ref: tip, id: tip.id });
        }
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const a = points[i];
            const b = points[j];
            if (a.id === b.id) {
              continue;
            }
            const posA = getPointPosition(a);
            const posB = getPointPosition(b);
            const dx = posA.x - posB.x;
            const dy = posA.y - posB.y;
            const dist = Math.hypot(dx, dy);
            if (dist > threshold) {
              continue;
            }
            const key = [Math.min(a.id, b.id), Math.max(a.id, b.id)].join('-');
            if (state.synapseKeys.has(key)) {
              continue;
            }
            state.synapseKeys.add(key);
            state.synapses.push({
              key,
              a,
              b,
              glowSeed: Math.random() * Math.PI * 2
            });
            if (state.synapses.length > 240) {
              const removed = state.synapses.shift();
              state.synapseKeys.delete(removed.key);
            }
          }
        }
      }

      function updatePulses(delta) {
        const step = Math.max(0.001, params.pulseSpeed * delta * 0.6);
        const nextPulses = [];
        for (const pulse of state.pulses) {
          pulse.progress += step;
          if (pulse.progress < 1) {
            nextPulses.push(pulse);
          }
        }
        state.pulses = nextPulses;
        if (state.synapses.length === 0) {
          return;
        }
        if (state.pulses.length > 140) {
          return;
        }
        for (const syn of state.synapses) {
          if (Math.random() < params.pulseFrequency * 0.5) {
            state.pulses.push({
              synapse: syn,
              progress: 0,
              direction: Math.random() < 0.5 ? 1 : -1
            });
            if (state.pulses.length > 140) {
              break;
            }
          }
        }
      }

      function drawScene(time) {
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createRadialGradient(width / 2, height / 2, 10, width / 2, height / 2, width * 0.9);
        gradient.addColorStop(0, params.backgroundColor);
        gradient.addColorStop(1, '#05070f');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.strokeStyle = 'var(--grid-color)';
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.45;
        for (let y = 0; y <= height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
        for (let x = 0; x <= width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        ctx.restore();

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        for (const segment of state.segments) {
          const depthRatio = clamp(segment.depth / (params.maxBranchDepth + 1), 0, 1);
          const colorPoint = mixColors(params.branchColor, params.accentBranchColor, depthRatio);
          const alpha = 0.4 + (1 - depthRatio) * 0.6;
          ctx.strokeStyle = rgbaString(colorPoint, alpha);
          ctx.lineWidth = segment.thickness;
          ctx.shadowColor = rgbaString(colorPoint, alpha);
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.moveTo(segment.start.x, segment.start.y);
          ctx.quadraticCurveTo(segment.control.x, segment.control.y, segment.end.x, segment.end.y);
          ctx.stroke();
        }

        ctx.lineWidth = 1.3;
        for (const syn of state.synapses) {
          const posA = getPointPosition(syn.a);
          const posB = getPointPosition(syn.b);
          const baseAlpha = 0.15 + Math.sin(time * 0.002 + syn.glowSeed) * 0.2;
          const glow = clamp(params.synapseGlow, 0.2, 1.8);
          const finalAlpha = clamp(baseAlpha, 0, 1) * glow * 0.6;
          const synColor = hexToRgb(params.synapseColor);
          ctx.strokeStyle = rgbaString(synColor, finalAlpha);
          ctx.shadowColor = rgbaString(synColor, finalAlpha * 1.4);
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.moveTo(posA.x, posA.y);
          ctx.lineTo(posB.x, posB.y);
          ctx.stroke();
        }

        for (const pulse of state.pulses) {
          const posA = getPointPosition(pulse.synapse.a);
          const posB = getPointPosition(pulse.synapse.b);
          const travel = pulse.direction === 1 ? pulse.progress : 1 - pulse.progress;
          const x = posA.x + (posB.x - posA.x) * travel;
          const y = posA.y + (posB.y - posA.y) * travel;
          const radius = 2.4 + params.pulseBrightness * 0.8;
          const alpha = 0.45 + params.pulseBrightness * 0.12;
          const pulseColor = hexToRgb(params.pulseColor);
          ctx.fillStyle = rgbaString(pulseColor, alpha);
          ctx.shadowColor = rgbaString(pulseColor, alpha);
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop(time) {
        const delta = lastTime ? (time - lastTime) / 16 : 1;
        lastTime = time;
        if (running) {
          growBranches(delta);
          detectSynapses();
          updatePulses(delta);
        }
        drawScene(time);
        requestAnimationFrame(loop);
      }

      updateBackgroundColor();
      resetNetwork();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
