<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Radiance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #05070f;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #ffd400;
      overflow: hidden;
    }
    #canvas-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #101a3a 0%, rgba(5, 7, 15, 0.95) 60%);
      box-shadow: inset 0 0 140px rgba(16, 26, 58, 0.9);
    }
    canvas {
      width: 800px;
      height: 800px;
      border-radius: 16px;
      background-color: #05070f;
      box-shadow: 0 0 60px rgba(16, 26, 58, 0.8), inset 0 0 30px rgba(0, 229, 255, 0.25);
      display: block;
    }
    .gui-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
    }
    .gui-container .dg.main {
      border-radius: 16px;
      background: rgba(5, 7, 15, 0.92);
      box-shadow: 0 15px 50px rgba(0, 229, 255, 0.35);
    }
    .gui-container .dg.main .dg {
      color: #ffd400;
    }
  </style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas width="800" height="800"></canvas>
  </div>
  <div class="gui-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script>
    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    const settings = {
      neuronCount: 4,
      branchGrowthSpeed: 1.1,
      maxBranchDepth: 6,
      branchSplitChance: 0.35,
      branchCurvature: 0.7,
      maxBranchLength: 120,
      synapseDistanceThreshold: 45,
      synapseGlowStrength: 1.3,
      pulseSpeed: 0.9,
      pulseFrequency: 0.45,
      pulseBrightness: 0.95,
      backgroundColor: "#05070f",
      branchColor: "#00e5ff",
      accentBranchColor: "#d6ff00",
      synapseColor: "#ff2bd6",
      pulseColor: "#fff36a"
    };
    const animationState = { paused: false };
    let branches = [];
    let tips = [];
    let synapses = [];
    let pulses = [];
    let synapseKeys = new Set();
    let branchCounter = 0;
    let lastTime = 0;
    const colorCache = {};
    function hexToRgb(value) {
      const hex = value.replace("#", "");
      const int = parseInt(hex, 16);
      return { r: (int >> 16) & 255, g: (int >> 8) & 255, b: int & 255 };
    }
    function toRgba(value, alpha) {
      const base = colorCache[value] || (colorCache[value] = hexToRgb(value));
      return `rgba(${base.r},${base.g},${base.b},${alpha})`;
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    class Branch {
      constructor(start, angle, depth, thickness) {
        this.start = { x: start.x, y: start.y };
        this.angle = angle;
        this.depth = depth;
        this.thickness = thickness;
        this.length = Math.max(32, settings.maxBranchLength * (0.5 + Math.random() * 0.5) * Math.max(0.35, 1 - depth / (settings.maxBranchDepth + 1)));
        this.end = {
          x: this.start.x + Math.cos(this.angle) * this.length,
          y: this.start.y + Math.sin(this.angle) * this.length
        };
        const baseControl = {
          x: this.start.x + Math.cos(this.angle) * this.length * 0.45,
          y: this.start.y + Math.sin(this.angle) * this.length * 0.45
        };
        this.control = {
          x: baseControl.x + (Math.random() - 0.5) * settings.branchCurvature * 110,
          y: baseControl.y + (Math.random() - 0.5) * settings.branchCurvature * 110
        };
        this.progress = 0;
        this.spawnedChildren = false;
        this.id = ++branchCounter;
      }
      update(delta) {
        if (this.progress >= 1) {
          if (!this.spawnedChildren) {
            this.finishBranch();
          }
          return;
        }
        this.progress += delta * 0.0022 * settings.branchGrowthSpeed * Math.max(0.6, 1 - this.depth * 0.12);
        if (this.progress >= 1) {
          this.progress = 1;
          this.finishBranch();
        }
      }
      finishBranch() {
        if (this.spawnedChildren) return;
        this.spawnedChildren = true;
        registerTip(this);
        this.spawnChildren();
      }
      spawnChildren() {
        if (this.depth >= settings.maxBranchDepth) return;
        if (branches.length > 600) return;
        const splits = Math.random() < settings.branchSplitChance ? 2 : 1;
        for (let i = 0; i < splits; i++) {
          const offset = ((i === 0 ? -0.25 : 0.25) + (Math.random() - 0.5) * settings.branchCurvature) * Math.PI * 0.25;
          const direction = this.angle + offset;
          const thickness = Math.max(0.7, this.thickness * 0.88);
          branches.push(new Branch(this.end, direction, this.depth + 1, thickness));
        }
      }
      draw(context) {
        const currentEndX = lerp(this.start.x, this.end.x, this.progress);
        const currentEndY = lerp(this.start.y, this.end.y, this.progress);
        const currentControlX = lerp(this.start.x, this.control.x, this.progress);
        const currentControlY = lerp(this.start.y, this.control.y, this.progress);
        const color = this.depth > settings.maxBranchDepth * 0.6 ? settings.accentBranchColor : settings.branchColor;
        context.lineWidth = Math.max(0.6, this.thickness * (1 - this.depth * 0.05));
        context.strokeStyle = color;
        context.shadowBlur = 18;
        context.shadowColor = color;
        context.beginPath();
        context.moveTo(this.start.x, this.start.y);
        context.quadraticCurveTo(currentControlX, currentControlY, currentEndX, currentEndY);
        context.stroke();
        context.shadowBlur = 0;
      }
    }
    class Synapse {
      constructor(a, b) {
        this.a = a;
        this.b = b;
        this.phase = Math.random() * Math.PI * 2;
      }
      draw(context, time) {
        const glow = (Math.sin(time * 0.002 + this.phase) + 1) * 0.5;
        const alpha = Math.min(1, 0.3 + glow * settings.synapseGlowStrength * 0.4);
        context.strokeStyle = toRgba(settings.synapseColor, alpha);
        context.lineWidth = 1.5;
        context.shadowBlur = 14 * settings.synapseGlowStrength;
        context.shadowColor = settings.synapseColor;
        context.beginPath();
        context.moveTo(this.a.pos.x, this.a.pos.y);
        context.lineTo(this.b.pos.x, this.b.pos.y);
        context.stroke();
        context.shadowBlur = 0;
      }
    }
    class Pulse {
      constructor(synapse) {
        this.from = Math.random() > 0.5 ? synapse.a : synapse.b;
        this.to = this.from === synapse.a ? synapse.b : synapse.a;
        this.progress = 0;
        this.finished = false;
        this.speed = settings.pulseSpeed * (0.0006 + Math.random() * 0.0006);
      }
      update(delta) {
        if (this.finished) return;
        this.progress += delta * this.speed;
        if (this.progress >= 1) {
          this.progress = 1;
          this.finished = true;
        }
      }
      draw(context) {
        const alpha = Math.min(1, settings.pulseBrightness);
        const x = lerp(this.from.pos.x, this.to.pos.x, this.progress);
        const y = lerp(this.from.pos.y, this.to.pos.y, this.progress);
        context.fillStyle = toRgba(settings.pulseColor, alpha);
        context.shadowBlur = 20;
        context.shadowColor = settings.pulseColor;
        context.beginPath();
        context.arc(x, y, 3 + settings.pulseBrightness * 2, 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
      }
    }
    function registerTip(branch) {
      const tip = { pos: { x: branch.end.x, y: branch.end.y }, branch };
      tips.push(tip);
      if (tips.length > 160) {
        tips.shift();
      }
      connectTip(tip);
    }
    function connectTip(tip) {
      const thresholdSq = settings.synapseDistanceThreshold * settings.synapseDistanceThreshold;
      for (const candidate of tips) {
        if (candidate === tip) continue;
        if (candidate.branch === tip.branch) continue;
        const dx = candidate.pos.x - tip.pos.x;
        const dy = candidate.pos.y - tip.pos.y;
        if (dx * dx + dy * dy > thresholdSq) continue;
        const key = synapseKey(tip.branch.id, candidate.branch.id);
        if (synapseKeys.has(key)) continue;
        synapses.push(new Synapse(tip, candidate));
        synapseKeys.add(key);
      }
    }
    function synapseKey(a, b) {
      return a < b ? `${a}-${b}` : `${b}-${a}`;
    }
    function spawnSeedNeurons() {
      const center = { x: width / 2, y: height / 2 };
      const count = Math.max(3, Math.round(settings.neuronCount));
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const distance = 24 + Math.random() * 42;
        const pos = {
          x: center.x + Math.cos(angle) * distance,
          y: center.y + Math.sin(angle) * distance
        };
        const seedAngle = Math.random() * Math.PI * 2;
        branches.push(new Branch(pos, seedAngle, 0, 3.8));
      }
    }
    function clearScene() {
      branches = [];
      tips = [];
      synapses = [];
      pulses = [];
      synapseKeys = new Set();
    }
    function resetNetwork() {
      clearScene();
      branchCounter = 0;
      lastTime = 0;
      spawnSeedNeurons();
    }
    function spawnPulse(delta) {
      if (!synapses.length) return;
      const chance = settings.pulseFrequency * delta * 0.0008;
      if (Math.random() < chance) {
        const synapse = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push(new Pulse(synapse));
      }
    }
    function updateBranches(delta) {
      for (const branch of branches) {
        branch.update(delta);
      }
    }
    function updatePulses(delta) {
      for (const pulse of pulses) {
        pulse.update(delta);
      }
      pulses = pulses.filter(p => !p.finished);
    }
    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.restore();
    }
    function renderBranches() {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const branch of branches) {
        branch.draw(ctx);
      }
    }
    function renderSynapses(time) {
      for (const synapse of synapses) {
        synapse.draw(ctx, time);
      }
    }
    function renderPulses() {
      for (const pulse of pulses) {
        pulse.draw(ctx);
      }
    }
    function animate(time) {
      if (!lastTime) {
        lastTime = time;
      }
      const delta = time - lastTime;
      lastTime = time;
      ctx.fillStyle = settings.backgroundColor;
      ctx.fillRect(0, 0, width, height);
      drawGrid();
      if (!animationState.paused) {
        updateBranches(delta);
        updatePulses(delta);
        spawnPulse(delta);
      }
      renderBranches();
      renderSynapses(time);
      renderPulses();
      requestAnimationFrame(animate);
    }
    function updateBackground() {
      document.body.style.backgroundColor = settings.backgroundColor;
      canvas.style.backgroundColor = settings.backgroundColor;
    }
    updateBackground();
    const gui = new dat.GUI({ autoPlace: false });
    document.querySelector(".gui-container").appendChild(gui.domElement);
    const growthFolder = gui.addFolder("Growth");
    growthFolder.add(settings, "neuronCount", 3, 6, 1).name("neuron count").onChange(resetNetwork);
    growthFolder.add(settings, "branchGrowthSpeed", 0.2, 2.4, 0.05).name("branch growth speed");
    growthFolder.add(settings, "maxBranchDepth", 3, 12, 1).name("max branch depth");
    growthFolder.add(settings, "branchSplitChance", 0.05, 0.7, 0.05).name("branch split chance");
    growthFolder.add(settings, "branchCurvature", 0.1, 1.3, 0.05).name("branch curvature");
    growthFolder.add(settings, "maxBranchLength", 60, 210, 5).name("max branch length");
    growthFolder.open();
    const synapseFolder = gui.addFolder("Synapses");
    synapseFolder.add(settings, "synapseDistanceThreshold", 20, 80, 1).name("synapse distance threshold");
    synapseFolder.add(settings, "synapseGlowStrength", 0.4, 2.2, 0.1).name("synapse glow strength");
    synapseFolder.open();
    const pulsesFolder = gui.addFolder("Pulses");
    pulsesFolder.add(settings, "pulseSpeed", 0.2, 1.5, 0.05).name("pulse speed");
    pulsesFolder.add(settings, "pulseFrequency", 0.1, 1, 0.05).name("pulse frequency");
    pulsesFolder.add(settings, "pulseBrightness", 0.3, 1.4, 0.05).name("pulse brightness");
    pulsesFolder.open();
    const visualsFolder = gui.addFolder("Visuals");
    visualsFolder.addColor(settings, "backgroundColor").name("background color").onChange(updateBackground);
    visualsFolder.addColor(settings, "branchColor").name("branch color");
    visualsFolder.addColor(settings, "accentBranchColor").name("accent branch color");
    visualsFolder.addColor(settings, "synapseColor").name("synapse color");
    visualsFolder.addColor(settings, "pulseColor").name("pulse color");
    visualsFolder.open();
    const controls = {
      regenerate() {
        resetNetwork();
      },
      clearCanvas() {
        clearScene();
        lastTime = 0;
      },
      pauseResume() {
        animationState.paused = !animationState.paused;
      }
    };
    gui.add(controls, "regenerate").name("regenerate network");
    gui.add(controls, "clearCanvas").name("clear canvas");
    gui.add(controls, "pauseResume").name("pause/resume animation");
    resetNetwork();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
