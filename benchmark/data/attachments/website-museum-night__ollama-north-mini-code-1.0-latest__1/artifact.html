<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIFACT: Museum Night | Premium Cultural Event</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="ARTIFACT: Museum Night">
    <meta property="og:description" content="A premium ticketed night museum event featuring after-hours exhibitions, live performances, and guided tours in the historic Old Gallery, Warsaw.">
    <meta property="og:image" content="https://source.unsplash.com/featured/1200x630/?museum,art,night">
    <meta property="og:url" content="https://artifact-museum-night.com">
    <meta property="og:type" content="event">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ARTIFACT: Museum Night">
    <meta name="twitter:description" content="Experience art after dark at ARTIFACT: Museum Night - a premium cultural event with ticketed access to exclusive exhibitions.">
    <meta name="twitter:image" content="https://source.unsplash.com/featured/1200x630/?museum,art,night">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d6ad60'><path d='M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z'/></svg>">
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Initial CSS Styles -->
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Color palette */
            --bg-primary: #070506;
            --bg-velvet: #1a0710;
            --bg-burgundy: #3a0f1d;
            --bg-navy: #07111f;
            --gold: #d6ad60;
            --soft-gold: #f3d79b;
            --ivory: #f8efe2;
            --muted: #b9a999;
            --panel: rgba(255, 244, 220, 0.06);
            --border: rgba(214, 173, 96, 0.28);
            
            /* Typography */
            --font-serif: Georgia, 'Times New Roman', serif;
            --font-sans: Inter, system-ui, 'Segoe UI', sans-serif;
            
            /* Spacing */
            --container-padding: 2rem;
            --section-spacing: 6rem;
            --card-gap: 2rem;
            
            /* Effects */
            --transition-base: 0.3s ease;
            --shadow-gold: 0 0 20px rgba(214, 173, 96, 0.3);
            --blur-sm: blur(8px);
        }
        
        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-velvet) 50%, var(--bg-burgundy) 100%);
            color: var(--ivory);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Subtle grain overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--container-padding);
            position: relative;
            z-index: 1;
        }
        
        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            font-weight: 400;
            line-height: 1.2;
            color: var(--ivory);
        }
        
        .serif {
            font-family: var(--font-serif);
        }
        
        .sans {
            font-family: var(--font-sans);
        }
        
        /* Utility Classes */
        .text-gold {
            color: var(--gold);
        }
        
        .text-soft-gold {
            color: var(--soft-gold);
        }
        
        .text-ivory {
            color: var(--ivory);
        }
        
        .text-muted {
            color: var(--muted);
        }
        
        .text-center {
            text-align: center;
        }
        
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .mb-4 { margin-bottom: 2rem; }
        .mb-5 { margin-bottom: 3rem; }
        
        .mt-0 { margin-top: 0; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mt-4 { margin-top: 2rem; }
        .mt-5 { margin-top: 3rem; }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }
        
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(214, 173, 96, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            background: rgba(214, 173, 96, 0.05);
            box-shadow: 0 0 20px rgba(214, 173, 96, 0.2);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: var(--gold);
            color: var(--bg-primary);
            border-color: var(--gold);
        }
        
        .btn-primary:hover {
            background: var(--soft-gold);
            box-shadow: 0 0 30px rgba(214, 173, 96, 0.4);
        }
        
        /* Glass-like panels */
        .panel {
            background: var(--panel);
            backdrop-filter: var(--blur-sm);
            -webkit-backdrop-filter: var(--blur-sm);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.3;
        }
        
        /* Grid Layouts */
        .grid {
            display: grid;
            gap: var(--card-gap);
        }
        
        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }
        
        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        /* Scroll behavior */
        html {
            scroll-behavior: smooth;
        }
        
        /* Selection styling */
        ::selection {
            background: var(--gold);
            color: var(--bg-primary);
        }
        
        /* Focus styles for accessibility */
        :focus {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }
        
        /* Hide elements initially for scroll reveal */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }
        
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Navigation Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(7, 5, 6, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1001;
            padding: 1rem 0;
            transition: all var(--transition-base);
        }
        
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--container-padding);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 2px;
            transition: all var(--transition-base);
        }
        
        .nav-logo:hover {
            text-shadow: 0 0 20px rgba(214, 173, 96, 0.5);
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-link {
            color: var(--ivory);
            text-decoration: none;
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all var(--transition-base);
            position: relative;
        }
        
        .nav-link::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width var(--transition-base);
        }
        
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: var(--gold);
        }
        
        .nav-cta {
            background: var(--gold);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            margin-left: 1rem;
        }
        
        .nav-cta:hover {
            background: var(--soft-gold);
            box-shadow: 0 0 20px rgba(214, 173, 96, 0.4);
        }
        
        .nav-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }
        
        .nav-toggle span {
            width: 25px;
            height: 2px;
            background: var(--gold);
            transition: all var(--transition-base);
        }
        
        .nav-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 6px);
        }
        
        .nav-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        
        .nav-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .nav-menu {
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(7, 5, 6, 0.98);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                transition: transform var(--transition-base);
                z-index: 1000;
            }
            
            .nav-menu.active {
                transform: translateY(0);
            }
            
            .nav-toggle {
                display: flex;
            }
            
            .nav-cta {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
        
        /* Offset for fixed navbar */
        body {
            padding-top: 80px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#home" class="nav-logo">ARTIFACT</a>
            
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#program" class="nav-link">Program</a></li>
                <li><a href="#artists" class="nav-link">Artists</a></li>
                <li><a href="#venue" class="nav-link">Venue</a></li>
                <li><a href="#tickets" class="nav-link">Tickets</a></li>
                <li><a href="#faq" class="nav-link">FAQ</a></li>
                <li><a href="#tickets" class="nav-link nav-cta">Get Tickets</a></li>
            </ul>
            
            <div class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>
    
    <!-- Main content will be added here -->
    
    <!-- Footer will be added here -->
    
    <script>
        // Navigation functionality
        const navbar = document.getElementById('navbar');
        const navMenu = document.getElementById('nav-menu');
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.querySelectorAll('.nav-link');
        
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(7, 5, 6, 0.95)';
                navbar.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.3)';
            } else {
                navbar.style.background = 'rgba(7, 5, 6, 0.9)';
                navbar.style.boxShadow = 'none';
            }
        });
        
        // Mobile menu toggle
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
        
        // Close mobile menu when clicking a link
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navToggle.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
        
        // Active navigation state on scroll
        window.addEventListener('scroll', () => {
            let current = '';
            const sections = document.querySelectorAll('section[id]');
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (window.pageYOffset >= sectionTop - 200) {
                    current = section.getAttribute('id');
                }
            });
            
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });
        
        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    const offsetTop = target.offsetTop - 80;
                    window.scrollTo({
                        top: offsetTop,
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // Scroll reveal animation
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.reveal').forEach(element => {
            observer.observe(element);
        });
    </script>
</body>
</html>
