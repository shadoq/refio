<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            box-shadow: 0 0 20px #101a3a;
            border: 1px solid #101a3a;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 229, 255, 0.03) 50%,
                rgba(0, 229, 255, 0.03)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <canvas id="simCanvas" width="800" height="800"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // --- Configuration & State ---
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2.0,
            maxBranchDepth: 6,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 150,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 4.0,
            pulseFrequency: 0.02,
            pulseBrightness: 1.0,
            
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            uiAccentColor: '#ffd400'
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let isPaused = false;
        let animationId;

        // --- Data Structures ---
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];

        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 3;
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, parentBranch = null) {
                this.x = startX;
                this.y = startY;
                this.angle = angle;
                this.depth = depth;
                this.parent = parentBranch;
                this.length = 0;
                this.maxLength = config.maxBranchLength + (Math.random() * 50 - 25);
                this.growthSpeed = config.branchGrowthSpeed;
                this.finished = false;
                this.color = config.branchColor;
                this.isAccent = Math.random() < 0.1;
                if (this.isAccent) this.color = config.accentBranchColor;
                
                // Path history for drawing curves
                this.path = [{x: startX, y: startY}];
                this.currentAngle = angle;
                this.targetAngle = angle;
            }

            update() {
                if (this.finished) return;

                // Organic movement: slightly randomize target angle
                this.targetAngle += (Math.random() - 0.5) * config.branchCurvature;
                
                // Smooth turn
                let diff = this.targetAngle - this.currentAngle;
                // Normalize angle
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.currentAngle += diff * 0.1;

                // Grow
                const step = this.growthSpeed;
                const nextX = this.x + Math.cos(this.currentAngle) * step;
                const nextY = this.y + Math.sin(this.currentAngle) * step;

                this.x = nextX;
                this.y = nextY;
                this.length += step;
                this.path.push({x: this.x, y: this.y});

                // Check bounds
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.finished = true;
                }

                // Check length limit
                if (this.length >= this.maxLength) {
                    this.finished = true;
                }

                // Split chance
                if (!this.finished && this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                    const newBranch = new Branch(this.x, this.y, this.currentAngle + (Math.random() - 0.5) * 1.5, this.depth + 1, this);
                    branches.push(newBranch);
                }
            }

            draw(ctx) {
                if (this.path.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(this.path[0].x, this.path[0].y);
                
                // Draw quadratic curves for smoothness
                for (let i = 1; i < this.path.length - 2; i++) {
                    const xc = (this.path[i].x + this.path[i+1].x) / 2;
                    const yc = (this.path[i].y + this.path[i+1].y) / 2;
                    ctx.quadraticCurveTo(this.path[i].x, this.path[i].y, xc, yc);
                }
                // Last segment
                if (this.path.length > 2) {
                    ctx.lineTo(this.path[this.path.length-1].x, this.path[this.path.length-1].y);
                }

                ctx.strokeStyle = this.color;
                ctx.lineWidth = Math.max(0.5, 2 - (this.depth * 0.2));
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.active = true;
                this.pulseTime = Math.random() * 100;
            }

            update() {
                // Check if branches are still valid (not finished or too far)
                // For simplicity, we keep synapses static once formed, but we could update endpoints
                // Here we just check if we should fire a pulse
                this.pulseTime += config.pulseFrequency * 100;
                if (this.pulseTime >= 100) {
                    this.pulseTime = 0;
                    this.firePulse();
                }
            }

            firePulse() {
                // Create pulse from branch1 tip to branch2 tip
                const start = this.branch1.path[this.branch1.path.length - 1];
                const end = this.branch2.path[this.branch2.path.length - 1];
                pulses.push(new Pulse(start, end));
            }

            draw(ctx) {
                const p1 = this.branch1.path[this.branch1.path.length - 1];
                const p2 = this.branch2.path[this.branch2.path.length - 1];
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.shadowColor = config.synapseColor;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw connection nodes
                ctx.fillStyle = config.synapseColor;
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, 2, 0, Math.PI * 2);
                ctx.arc(p2.x, p2.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Pulse {
            constructor(start, end) {
                this.x = start.x;
                this.y = start.y;
                this.targetX = end.x;
                this.targetY = end.y;
                this.progress = 0;
                this.speed = config.pulseSpeed / 10; // Normalized speed
                this.finished = false;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.finished = true;
                    return;
                }
                this.x = this.x + (this.targetX - this.x) * this.speed;
                this.y = this.y + (this.targetY - this.y) * this.speed;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = config.pulseColor;
                ctx.globalAlpha = config.pulseBrightness;
                ctx.shadowBlur = 15;
                ctx.shadowColor = config.pulseColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        // --- Initialization ---
        function init() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];

            // Generate seed neurons
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const count = Math.floor(config.neuronCount);
            
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const dist = 50 + Math.random() * 50;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                neurons.push(new Neuron(x, y));
                
                // Initial branch
                const branch = new Branch(x, y, Math.random() * Math.PI * 2, 0);
                branches.push(branch);
            }
        }

        // --- Logic ---
        function checkSynapses() {
            // Only check active branches against other active branches
            for (let i = 0; i < branches.length; i++) {
                const b1 = branches[i];
                if (b1.finished) continue;

                for (let j = i + 1; j < branches.length; j++) {
                    const b2 = branches[j];
                    if (b2.finished) continue;

                    // Check distance between tips
                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < config.synapseDistanceThreshold) {
                        // Prevent duplicates (simple check: do we already have a synapse between these?)
                        const exists = synapses.some(s => 
                            (s.branch1 === b1 && s.branch2 === b2) || 
                            (s.branch1 === b2 && s.branch2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                        }
                    }
                }
            }
        }

        function drawBackground() {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Optional grid
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function drawNeurons() {
            neurons.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = config.uiAccentColor;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.uiAccentColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function loop() {
            if (!isPaused) {
                drawBackground();
                
                // Update and Draw Branches
                branches.forEach(b => {
                    b.update();
                    b.draw(ctx);
                });

                // Remove finished branches that are too old? 
                // For now we keep them to maintain the network structure, 
                // but we stop updating them.
                
                checkSynapses();

                // Draw Synapses
                synapses.forEach(s => {
                    s.update();
                    s.draw(ctx);
                });

                // Update and Draw Pulses
                for (let i = pulses.length - 1; i >= 0; i--) {
                    const p = pulses[i];
                    p.update();
                    p.draw(ctx);
                    if (p.finished) {
                        pulses.splice(i, 1);
                    }
                }

                drawNeurons();
            }
            
            animationId = requestAnimationFrame(loop);
        }

        // --- GUI Setup ---
        const gui = new dat.GUI({ width: 300 });
        
        const folderGrowth = gui.addFolder('Growth');
        folderGrowth.add(config, 'neuronCount', 1, 10, 1).name('Neuron Count').onChange(init);
        folderGrowth.add(config, 'branchGrowthSpeed', 0.5, 10).name('Growth Speed');
        folderGrowth.add(config, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
        folderGrowth.add(config, 'branchSplitChance', 0.0, 0.5).name('Split Chance');
        folderGrowth.add(config, 'branchCurvature', 0.0, 2.0).name('Curvature');
        folderGrowth.add(config, 'maxBranchLength', 50, 300).name('Max Length');
        folderGrowth.open();

        const folderSynapses = gui.addFolder('Synapses');
        folderSynapses.add(config, 'synapseDistanceThreshold', 10, 100).name('Distance Threshold');
        folderSynapses.add(config, 'synapseGlowStrength', 0, 50).name('Glow Strength');
        folderSynapses.open();

        const folderPulses = gui.addFolder('Pulses');
        folderPulses.add(config, 'pulseSpeed', 1, 20).name('Speed');
        folderPulses.add(config, 'pulseFrequency', 0.001, 0.1).name('Frequency');
        folderPulses.add(config, 'pulseBrightness', 0, 1).name('Brightness');
        folderPulses.open();

        const folderVisuals = gui.addFolder('Visuals');
        folderVisuals.addColor(config, 'backgroundColor').name('Background').onChange(() => {
            // Trigger redraw immediately if paused
            if (isPaused) drawBackground();
        });
        folderVisuals.addColor(config, 'branchColor').name('Branch Color');
        folderVisuals.addColor(config, 'accentBranchColor').name('Accent Color');
        folderVisuals.addColor(config, 'synapseColor').name('Synapse Color');
        folderVisuals.addColor(config, 'pulseColor').name('Pulse Color');
        folderVisuals.open();

        const folderControls = gui.addFolder('Controls');
        folderControls.add({ regenerate: init }, 'regenerate').name('Regenerate Network');
        folderControls.add({ clear: () => { branches=[]; synapses=[]; pulses=[]; } }, 'clear').name('Clear Canvas');
        folderControls.add({ togglePause: () => { isPaused = !isPaused; } }, 'togglePause').name('Pause/Resume');
        folderControls.open();

        // Start
        init();
        loop();

    </script>
</body>
</html>
