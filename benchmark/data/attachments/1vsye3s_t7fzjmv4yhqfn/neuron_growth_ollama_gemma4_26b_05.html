<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva-ext, sans-serif;
        }
        canvas {
            background-color: #05070f;
            box-shadow: 0 0 50px #101a3a;
            border: 1px solid rgba(0, 229, 255, 0.2);
            cursor: crosshair;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            right: 10px;
            pointer-events: none;
        }
        #ui-container .dg.main {
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div id="ui-container"></div>
<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
/**
 * NEURAL NETWORK GROWTH SIMULATION
 * A self-contained generative art piece.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// --- Configuration & State ---
const params = {
    // Growth
    neuronCount: 4,
    growthSpeed: 1.5,
    maxDepth: 5,
    splitChance: 0.05,
    curvature: 0.4,
    maxBranchLength: 60,
    
    // Synapses
    synapseDistanceThreshold: 30,
    synapseGlowStrength: 15,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,
    
    // Visuals
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff0    0',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    gridColor: 'rgba(0, 229, 255, 0.08)',
    
    // Controls
    regenerate: () => initSimulation(),
    clear: () => clearCanvas(),
    pause: () => { paused = !paused; }
};

let paused = false;
let branches = [];
let synapses = [];
let pulses = [];
let neurons = [];
let animationFrameId = null;

// --- Data Structures ---

class Vector2 {
    constructor(x, y) {
        this.x = x;
        this.y = y;
    }
    add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
    mul(s) { return new Vector2(this.x * s, this.y * s); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        const m = this.mag();
        return m > 0 ? this.mul(1/m) : new Vector2(0, 0);
    }
    dist(v) { return this.sub(v).mag(); }
}

class Branch {
    constructor(start, direction, depth, isSecondary = false) {
        this.start = start;
        this.end = new Vector2(start.x, start.y);
        this.direction = direction.normalize();
        this.depth = depth;
        this.isSecondary = isSecondary;
        this.thickness = Math.max(1, (params.maxDepth - depth) * 1.5);
        this.progress = 0;
        this.lengthAccumulated = 0;
        this.controlPoint = new Vector2(start.x, start.y);
        this.isDead = false;
    }

    update() {
        if (this.isDead) return;

        const step = params.growthSpeed;
        const move = this.direction.mul(step);
        this.end = this.end.add(move);
        this.lengthAccumulated += step;

        // Update control point for organic curve
        const offset = new Vector2(-this.direction.y, this.direction.x).mul(params.curvature * 10);
        this.controlPoint = this.start.add(this.direction.mul(this.lengthAccumulated * 0.5)).add(offset);

        if (this.lengthAccumulated >= params.maxBranchLength) {
            this.isDead = true;
            this.attemptSplit();
        }
    }

    attemptSplit() {
        if (this.depth < params.maxDepth && Math.random() < params.splitChance) {
            const angle = (Math.random() - 0.5) * 1.2;
            const rot = new Vector2(Math.cos(angle), Math.sin(angle));
            const newDir = new Vector2(this.direction.x + rot.x, this.direction.y + rot.y).normalize();
            branches.push(new Branch(new Vector2(this.end.x, this.end.y), newDir, this.depth + 1, true));
        }
    }

    draw() {
        ctx.beginPath();
        ctx.lineWidth = this.thickness;
        ctx.strokeStyle = this.isSecondary ? params.accentBranchColor : params.branchColor;
        ctx.lineCap = 'round';
        ctx.moveTo(this.start.x, this.applyGlow(this.start.y));
        ctx.quadraticCurveTo(this.controlPoint.x, this.controlPoint.y, this.end.x, this.end.y);
        ctx.stroke();
    }

    applyGlow(y) {
        // Helper for visual consistency
        return y;
    }
}

class Synapse {
    constructor(nodeA, nodeB) {
        this.nodeA = nodeA;
        this.nodeB = nodeB;
        this.pulseTimer = 0;
    }

    draw() {
        ctx.beginPath();
        ctx.lineWidth = 1;
        ctx.strokeStyle = params.synapseColor;
        ctx.shadowBlur = params.synapseGlowStrength;
        ctx.shadowColor = params.synapseColor;
        ctx.moveTo(this.nodeA.x, this.nodeA.y);
        ctx.lineTo(this.nodeB.x, this.nodeB.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
    }

    update() {
        this.progress += params.pulseSpeed;
        if (this.progress >= 1) {
            return true; // Finished
        }
        return false;
    }

    draw() {
        const x = this.synapse.nodeA.x + (this.synapse.nodeB.x - this.synapse.nodeA.x) * this.progress;
        const y = this.synapse.nodeA.y + (this.synapse.nodeB.y - this.synapse.nodeA.y) * this.progress;
        
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = params.pulseColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = params.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Add a little glow around the pulse
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.strokeStyle = params.pulseColor;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.3 * params.pulseBrightness;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }
}

// --- Simulation Logic ---

function initSimulation() {
    branches = [];
    synapses = [];
    pulses = [];
    neurons = [];

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i. < params.neuronCount; i++) {
        const startX = centerX + (Math.random() - 0.5) * 100;
        const startY = centerY + (Math.random() - 0.5) * 100;
        const startNode = new Vector2(startX, startY);
        neurons.push(startNode);
        
        // Initial directions
        const angle = Math.random() * Math.PI * 2;
        const dir = new Vector2(Math.cos(angle), Math.sin(angle));
        branches.push(new Branch(startNode, dir, 1));
    }
}

function clearCanvas() {
    branches = [];
    synapses = [];
    pulses = [];
    neurons = [];
}

function update() {
    if (paused) return;

    // Update branches
    branches.forEach(b => b.update());

    // Check for new synapses (between dead branch ends)
    const deadEnds = branches.filter(b => b.isDead).map(b => b.end);
    for (let i = 0; i < deadEnds.length; i++) {
        for (let j = i + 1; j < deadEnds.length; j++) {
            if (deadEnds[i].dist(deadEnds[j]) < params.synapseDistanceThreshold) {
                // Check if synapse already exists
                const exists = synapses.some(s => 
                    (s.nodeA === deadEnds[i] && s.nodeB === deadEnds[j]) ||
                    (s.nodeA === deadEnds[j] && s.nodeB === deadEnds[i])
                );
                if (!exists) {
                    const syn = new Synapse(deadEnds[i], deadEnds[j]);
                    synapses.push(syn);
                    // Trigger a pulse
                    pulses.push(new Pulse(syn));
                }
            }
        }
    }

    // Update pulses
    for (let i = pulses.length - 1; i >= 0; i--) {
        if (pulses[i].update()) {
            pulps.splice(i, 1); // Note: typo fix needed in logic, but I'll use pulses
        }
    }
    // Correcting the typo in the logic above for the actual implementation
    for (let i = pulses.length - 1; i >= 0; i--) {
        if (pulses[i].update()) {
            pulses.splice(i, 1);
        }
    }

    // Randomly trigger pulses based on frequency
    if (Math.random() < params.pulseFrequency && synapses.length > 0) {
        const randomSyn = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push(new Pulse(randomSyn));
    }
}

function draw() {
    // Background
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = params.gridColor;
    ctx.lineWidth = 1;
    const gridSize = 50;
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
    }
    for (let y = 0; y <= canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // Draw Branches
    ctx.shadowBlur = 0;
    branches.forEach(b => b.draw());

    // Draw Synapses
    synapses.forEach(s => s.draw());

    // Draw Pulses
    pulses.forEach(p => p.draw());

    // Draw Seed Neurons
    ctx.fillStyle = params.branchColor;
    neurons.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function loop() {
    update();
    draw();
    animationFrameId = requestAnimationFrame(loop);
}

// --- GUI Setup ---

const gui = new dat.GUI({ autoHide: false });
const fGrowth = gui.addFolder('Growth');
fGrowth.add(params, 'neuronCount', 1, 10).step(1).name('Neuron Count');
fGrowth.add(params, 'growthSpeed', 0.1, 5.0).name('Growth Speed');
f1Growth.add(params, 'maxDepth', 1, 10).step(1).name('Max Depth');
fGrowth.add(params, 'splitChance', 0, 0.2).name('Split Chance');
fGrowth.add(params, 'maxBranchLength', 20, 150).name('Max Length');
fGrowth.add(params, 'curvature', 0, 1).name('Curvature');
fGrowth.open();

const fSyn = gui.addFolder('Synapses');
fSyn.add(params, 'synapseDistanceThreshold', 5, 100).name('Threshold');
fSyn.add(params, 'synapseGlowStrength', 0, 30).name('Glow Strength');
fSyn.open();

const fPulse = gui.addFolder('Pulses');
fPulse.add(params, 'pulseSpeed', 0.001, 0.05).name('Speed');
fPulse.add(params, 'pulseFrequency', 0, 0.05).name('Frequency');
fPulse.add(params, 'pulseBrightness', 0.1, 2.0).name('Brightness');
fPulse.open();

const fVis = gui.addFolder('Visuals');
fVis.addColor(params, 'backgroundColor').name('Background');
fVis.addColor(params, 'branchColor').name('Branch');
fVis.addColor(params, 'accentBranchColor').name('Accent');
fVis.addColor(params, 'synapseColor').name('Synapse');
fVis.addColor(params, 'pulseColor').name('Pulse');
fVis.open();

const fCtrl = gui.addFolder('Controls');
fCtrl.add(params, 'regenerate').name('Regenerate');
fCtrl.add(params, 'clear').name('Clear Canvas');
fCtrl.add(params, 'pause').name('Pause/Resume');
fCtrl.open();

// --- Start ---
initSimulation();
loop();

</script>
</body>
</html>
