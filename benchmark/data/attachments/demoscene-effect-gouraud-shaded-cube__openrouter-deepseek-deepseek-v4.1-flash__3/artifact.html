<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gouraud-Shaded Rotating Cube — Canvas 2D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0c10;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0a0c10;
    border: 1px solid rgba(127, 231, 255, 0.25);
    box-shadow: 0 0 40px rgba(127, 231, 255, 0.12),
                inset 0 0 60px rgba(127, 231, 255, 0.04);
    border-radius: 6px;
  }
  #hud {
    position: absolute;
    top: 14px;
    left: 16px;
    color: #7fe7ff;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    text-shadow: 0 0 8px rgba(127, 231, 255, 0.5);
    pointer-events: none;
    user-select: none;
  }
  #hud .dim {
    color: #4a6b78;
  }
  #hud .warn {
    color: #ffd479;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="fps">FPS: --</div>
    <div id="mode" class="dim">shaded · tris: 0</div>
    <div class="dim">W = wireframe toggle · P = pause</div>
  </div>
</div>
<script>
"use strict";

// ============================================================
// Setup: canvas, DPR, resize
// ============================================================
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d", { alpha: false });
const hudFps = document.getElementById("fps");
const hudMode = document.getElementById("mode");

let W = 0, H = 0;          // CSS pixel size
let DPR = 1;
let img = null;            // ImageData buffer
let buf = null;            // Uint8ClampedArray view

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const maxSide = Math.min(window.innerWidth, window.innerHeight) - 40;
  const side = Math.max(240, Math.min(maxSide, 900));
  W = side;
  H = side;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  img = ctx.createImageData(canvas.width, canvas.height);
  buf = img.data;
}
window.addEventListener("resize", resize);
resize();

// ============================================================
// --- math ---
// ============================================================
function mat3Mul(a, b) {
  // a, b are row-major 3x3 arrays [m00,m01,m02, m10,m11,m12, m20,m21,m22]
  const r = new Array(9);
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      r[i * 3 + j] =
        a[i * 3 + 0] * b[0 * 3 + j] +
        a[i * 3 + 1] * b[1 * 3 + j] +
        a[i * 3 + 2] * b[2 * 3 + j];
    }
  }
  return r;
}

function rotateX(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [1, 0, 0, 0, c, -s, 0, s, c];
}
function rotateY(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c, 0, s, 0, 1, 0, -s, 0, c];
}
function rotateZ(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c, -s, 0, s, c, 0, 0, 0, 1];
}

function transformPoint(m, v) {
  return [
    m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
    m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
    m[6] * v[0] + m[7] * v[1] + m[8] * v[2]
  ];
}

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function normalize(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}

// ============================================================
// --- geometry ---
// ============================================================
// Unit cube vertices at ±1
const CUBE_VERTICES = [
  [-1, -1, -1], // 0
  [ 1, -1, -1], // 1
  [ 1,  1, -1], // 2
  [-1,  1, -1], // 3
  [-1, -1,  1], // 4
  [ 1, -1,  1], // 5
  [ 1,  1,  1], // 6
  [-1,  1,  1]  // 7
];

// 6 faces, CCW when viewed from outside, with base colors.
// Each face is split into 2 triangles: [0,1,2] and [0,2,3].
const FACES = [
  { idx: [4, 5, 6, 7], color: [ 90, 200, 255] }, // +Z front
  { idx: [1, 0, 3, 2], color: [255, 120, 160] }, // -Z back
  { idx: [5, 1, 2, 6], color: [140, 255, 170] }, // +X right
  { idx: [0, 4, 7, 3], color: [255, 200, 110] }, // -X left
  { idx: [7, 6, 2, 3], color: [200, 150, 255] }, // +Y top
  { idx: [0, 1, 5, 4], color: [255, 160, 120] }  // -Y bottom
];

// 12 cube edges (pairs of vertex indices) for wireframe
const CUBE_EDGES = [
  [0, 1], [1, 2], [2, 3], [3, 0],
  [4, 5], [5, 6], [6, 7], [7, 4],
  [0, 4], [1, 5], [2, 6], [3, 7]
];

// ============================================================
// --- lighting ---
// ============================================================
const AMBIENT = 0.18;
const DIFFUSE = 0.85;

// For a cube we use the FACE normal for all three vertices of a face.
// This gives the classic faceted Gouraud look: a flat plane with a
// lighting gradient across it (since the light direction varies per vertex).
function shadeVertex(baseColor, normal, vertexPos, lightPos) {
  const L = normalize(sub(lightPos, vertexPos));
  const ndl = Math.max(0, dot(normal, L));
  const intensity = AMBIENT + DIFFUSE * ndl;
  return [
    Math.min(255, baseColor[0] * intensity),
    Math.min(255, baseColor[1] * intensity),
    Math.min(255, baseColor[2] * intensity)
  ];
}

// ============================================================
// --- projection ---
// ============================================================
const CAM_DIST = 4.5;
const FOCAL = 3.2;

function project(p, unit, cx, cy) {
  const denom = CAM_DIST - p[2];
  if (denom <= 0.1) return null;
  const scale = FOCAL / denom;
  return [
    cx + p[0] * scale * unit,
    cy - p[1] * scale * unit
  ];
}

// ============================================================
// --- rasterizer ---
// ============================================================
// Fill the whole buffer with the background color.
function clearBuffer(r, g, b) {
  const n = buf.length;
  for (let i = 0; i < n; i += 4) {
    buf[i] = r;
    buf[i + 1] = g;
    buf[i + 2] = b;
    buf[i + 3] = 255;
  }
}

// Gouraud-shaded triangle rasterization using edge functions.
// p0,p1,p2 are [x,y] in device pixels; c0,c1,c2 are [r,g,b].
function rasterTriangle(p0, p1, p2, c0, c1, c2) {
  const x0 = p0[0], y0 = p0[1];
  const x1 = p1[0], y1 = p1[1];
  const x2 = p2[0], y2 = p2[1];

  const area = (x1 - x0) * (y2 - y0) - (y1 - y0) * (x2 - x0);
  if (Math.abs(area) < 1e-6) return; // degenerate

  const invArea = 1 / area;

  // Bounding box clipped to canvas
  let minX = Math.floor(Math.min(x0, x1, x2));
  let maxX = Math.ceil(Math.max(x0, x1, x2));
  let minY = Math.floor(Math.min(y0, y1, y2));
  let maxY = Math.ceil(Math.max(y0, y1, y2));

  if (minX < 0) minX = 0;
  if (minY < 0) minY = 0;
  if (maxX > canvas.width - 1) maxX = canvas.width - 1;
  if (maxY > canvas.height - 1) maxY = canvas.height - 1;
  if (minX > maxX || minY > maxY) return;

  const stride = canvas.width * 4;

  for (let y = minY; y <= maxY; y++) {
    const py = y + 0.5;
    const rowBase = y * stride;

    for (let x = minX; x <= maxX; x++) {
      const px = x + 0.5;

      // Edge functions (barycentric weights, normalized by area)
      const w0 = ((x1 - px) * (y2 - py) - (y1 - py) * (x2 - px)) * invArea;
      const w1 = ((x2 - px) * (y0 - py) - (y2 - py) * (x0 - px)) * invArea;
      const w2 = 1 - w0 - w1;

      if (w0 < 0 || w1 < 0 || w2 < 0) continue;

      const r = w0 * c0[0] + w1 * c1[0] + w2 * c2[0];
      const g = w0 * c0[1] + w1 * c1[1] + w2 * c2[1];
      const b = w0 * c0[2] + w1 * c1[2] + w2 * c2[2];

      const o = rowBase + x * 4;
      buf[o] = r;
      buf[o + 1] = g;
      buf[o + 2] = b;
      buf[o + 3] = 255;
    }
  }
}

// ============================================================
// --- state ---
// ============================================================
let angleX = 0.4;
let angleY = 0.6;
let time = 0;
let paused = false;
let wireframe = false;

const ROT_Y_SPEED = 0.35; // rad/s
const ROT_X_SPEED = 0.22; // rad/s

// FPS tracking
let fpsAccum = 0;
let fpsFrames = 0;
let fpsValue = 0;
let lastFpsUpdate = 0;

// ============================================================
// --- main loop ---
// ============================================================
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (!paused) {
    time += dt;
    angleY += ROT_Y_SPEED * dt;
    angleX += ROT_X_SPEED * dt;
  }

  // FPS: rolling average updated ~4x/sec
  fpsAccum += dt;
  fpsFrames++;
  if (now - lastFpsUpdate > 250) {
    fpsValue = fpsFrames / fpsAccum;
    fpsAccum = 0;
    fpsFrames = 0;
    lastFpsUpdate = now;
    hudFps.textContent = "FPS: " + fpsValue.toFixed(0);
  }

  render();
  requestAnimationFrame(frame);
}

function render() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const unit = Math.min(canvas.width, canvas.height) * 0.22;

  // Compose rotation: rotateY * rotateX
  const rot = mat3Mul(rotateY(angleY), rotateX(angleX));

  // Transform vertices
  const worldVerts = CUBE_VERTICES.map(v => transformPoint(rot, v));

  // Moving light on a Lissajous path
  const lightPos = [
    2.6 * Math.cos(time * 0.9),
    2.2 * Math.sin(time * 1.3),
    2.6 * Math.sin(time * 0.7) + 1.5
  ];

  // Clear buffer to background
  clearBuffer(10, 12, 16);

  // Build triangle list with depth for back-to-front sort
  const tris = [];

  for (const face of FACES) {
    const [a, b, c, d] = face.idx;

    // Face normal in local space (CCW from outside)
    const vA = CUBE_VERTICES[a];
    const vB = CUBE_VERTICES[b];
    const vC = CUBE_VERTICES[c];
    const localNormal = normalize(cross(sub(vB, vA), sub(vC, vA)));

    // Transform normal by rotation
    const worldNormal = normalize(transformPoint(rot, localNormal));

    // Face center in world space
    const center = [
      (worldVerts[a][0] + worldVerts[b][0] + worldVerts[c][0] + worldVerts[d][0]) / 4,
      (worldVerts[a][1] + worldVerts[b][1] + worldVerts[c][1] + worldVerts[d][1]) / 4,
      (worldVerts[a][2] + worldVerts[b][2] + worldVerts[c][2] + worldVerts[d][2]) / 4
    ];

    // Backface culling: viewDir from face center to camera
    const viewDir = normalize(sub([0, 0, CAM_DIST], center));
    if (dot(worldNormal, viewDir) <= 0) continue;

    // Two triangles: [a,b,c] and [a,c,d]
    const triDefs = [
      [a, b, c],
      [a, c, d]
    ];

    for (const t of triDefs) {
      const p0 = worldVerts[t[0]];
      const p1 = worldVerts[t[1]];
      const p2 = worldVerts[t[2]];

      const s0 = project(p0, unit, cx, cy);
      const s1 = project(p1, unit, cx, cy);
      const s2 = project(p2, unit, cx, cy);
      if (!s0 || !s1 || !s2) continue;

      // Per-vertex Lambert lighting using the face normal
      const c0 = shadeVertex(face.color, worldNormal, p0, lightPos);
      const c1 = shadeVertex(face.color, worldNormal, p1, lightPos);
      const c2 = shadeVertex(face.color, worldNormal, p2, lightPos);

      const depth = (p0[2] + p1[2] + p2[2]) / 3;

      tris.push({ s0, s1, s2, c0, c1, c2, depth });
    }
  }

  // Sort back-to-front (smaller z is farther). Cube is convex so this is
  // mostly a robustness measure; backface culling already handles overlap.
  tris.sort((a, b) => a.depth - b.depth);

  for (const t of tris) {
    rasterTriangle(t.s0, t.s1, t.s2, t.c0, t.c1, t.c2);
  }

  // Blit buffer
  ctx.putImageData(img, 0, 0);

  // Wireframe overlay
  if (wireframe) {
    ctx.save();
    ctx.scale(DPR, DPR);
    ctx.strokeStyle = "#7fe7ff";
    ctx.lineWidth = 1.5;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (const e of CUBE_EDGES) {
      const p0 = project(worldVerts[e[0]], unit, cx / DPR, cy / DPR);
      const p1 = project(worldVerts[e[1]], unit, cx / DPR, cy / DPR);
      if (!p0 || !p1) continue;
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
    }
    ctx.stroke();
    ctx.restore();
  }

  // HUD mode line
  const modeStr = (wireframe ? "wireframe" : "shaded") +
    " · tris: " + tris.length +
    (paused ? " · PAUSED" : "");
  hudMode.textContent = modeStr;
  hudMode.className = paused ? "warn" : "dim";
}

// ============================================================
// --- input ---
// ============================================================
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "w") {
    wireframe = !wireframe;
    e.preventDefault();
  } else if (k === "p") {
    paused = !paused;
    e.preventDefault();
  }
});

// Bonus: click canvas to toggle pause
canvas.addEventListener("click", () => {
  paused = !paused;
});

requestAnimationFrame(frame);
</script>
</body>
</html>
