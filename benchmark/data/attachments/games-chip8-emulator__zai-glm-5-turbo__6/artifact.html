<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIP-8 Emulator</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24253a;
    --fg: #c0caf5;
    --accent: #7aa2f7;
    --green: #9ece6a;
    --red: #f7768e;
    --muted: #565f89;
    --border: #343a52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 12px; color: var(--accent); letter-spacing: 2px; }
  .wrap {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .left { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  canvas {
    background: #000;
    border: 2px solid var(--border);
    border-radius: 4px;
    image-rendering: pixelated;
    width: 640px;
    height: 320px;
    max-width: 95vw;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    background: var(--accent);
    color: #10121b;
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button#pauseBtn { background: #e0af68; }
  button#stepBtn  { background: #bb9af7; }
  button#resetBtn { background: var(--red); }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
  input[type=range] { flex: 1; }
  #speedVal { min-width: 110px; text-align: right; color: var(--green); }
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 56px);
    grid-template-rows: repeat(4, 56px);
    gap: 6px;
  }
  .kp {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .kp small { font-size: 9px; color: var(--muted); }
  .kp.active { background: var(--accent); color: #10121b; }
  .kp.active small { color: #10121b; }
  .file-row { margin-top: 10px; font-size: 13px; }
  .file-row input { color: var(--fg); font-size: 12px; max-width: 220px; }
  .debugger {
    width: 340px;
    max-width: 95vw;
    font-size: 12px;
  }
  .debugger h2 { font-size: 14px; color: var(--accent); margin-bottom: 8px; }
  .dbg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; }
  .dbg-grid span { color: var(--muted); }
  .dbg-grid b { color: var(--fg); font-weight: normal; }
  .dbg-line { margin-top: 8px; }
  .dbg-line b { color: var(--green); font-weight: normal; }
  #stackBox, #instrBox {
    margin-top: 8px;
    background: #10121b;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--fg);
    min-height: 20px;
  }
  #instrBox { color: var(--green); font-size: 13px; }
  .lbl { color: var(--muted); margin-top: 8px; display: block; }
  .status { margin-top: 6px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<h1>CHIP-8 EMULATOR</h1>
<div class="wrap">
  <div class="left">
    <canvas id="screen" width="64" height="32"></canvas>
    <div class="panel controls">
      <button id="runBtn">RUN</button>
      <button id="pauseBtn">PAUSE</button>
      <button id="stepBtn">STEP</button>
      <button id="resetBtn">RESET</button>
    </div>
    <div class="panel" style="width: 100%;">
      <div class="slider-row">
        <label for="speedSlider">Speed (instr/frame):</label>
        <input type="range" id="speedSlider" min="1" max="200" value="10">
        <span id="speedVal">10</span>
      </div>
      <div class="file-row">
        <label for="romFile">Load ROM:</label>
        <input type="file" id="romFile">
      </div>
      <div class="status" id="statusLine">Status: paused</div>
    </div>
    <div class="panel">
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
  <div class="panel debugger">
    <h2>DEBUGGER</h2>
    <div class="dbg-grid" id="regGrid"></div>
    <div class="dbg-line"><span>I:</span> <b id="dbgI">0x000</b> &nbsp; <span>PC:</span> <b id="dbgPC">0x200</b></div>
    <div class="dbg-line"><span>DT:</span> <b id="dbgDT">0</b> &nbsp; <span>ST:</span> <b id="dbgST">0</b></div>
    <span class="lbl">Stack:</span>
    <div id="stackBox">(empty)</div>
    <span class="lbl">Current instruction:</span>
    <div id="instrBox">----</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------- CHIP-8 core ----------------
  const MEM_SIZE = 4096;
  const PROG_START = 0x200;
  const FONT_ADDR = 0x050;
  const FONT = [
    0xF0,0x90,0x90,0x90,0xF0, // 0
    0x20,0x60,0x20,0x20,0x70, // 1
    0xF0,0x10,0xF0,0x80,0xF0, // 2
    0xF0,0x10,0xF0,0x10,0xF0, // 3
    0x90,0x90,0xF0,0x10,0x10, // 4
    0xF0,0x80,0xF0,0x10,0xF0, // 5
    0xF0,0x80,0xF0,0x90,0xF0, // 6
    0xF0,0x10,0x20,0x40,0x40, // 7
    0xF0,0x90,0xF0,0x90,0xF0, // 8
    0xF0,0x90,0xF0,0x10,0xF0, // 9
    0xF0,0x90,0xF0,0x90,0x90, // A
    0xE0,0x90,0xE0,0x90,0xE0, // B
    0xF0,0x80,0x80,0x80,0xF0, // C
    0xE0,0x90,0x90,0x90,0xE0, // D
    0xF0,0x80,0xF0,0x80,0xF0, // E
    0xF0,0x80,0xF0,0x80,0x80  // F
  ];

  const W = 64, H = 32;
  const KEY_MAP = {
    '1':0x1,'2':0x2,'3':0x3,'4':0xC,
    'q':0x4,'w':0x5,'e':0x6,'r':0xD,
    'a':0x7,'s':0x8,'d':0x9,'f':0xE,
    'z':0xA,'x':0x0,'c':0xB,'v':0xF
  };
  const KEYPAD_LAYOUT = [
    ['1',0x1],['2',0x2],['3',0x3],['C',0xC],
    ['4',0x4],['5',0x5],['6',0x6],['D',0xD],
    ['7',0x7],['8',0x8],['9',0x9],['E',0xE],
    ['A',0xA],['0',0x0],['B',0xB],['F',0xF]
  ];

  // Demo ROM: sprite at (10,10) moved by CHIP-8 keys 5/7/8 (Q/A/W on keyboard),
  // reacts to CHIP-8 key 6 (E key) which toggles/flashes a second sprite.
  const DEMO_ROM = new Uint8Array([
    0x00,0xE0,             // 200: CLS
    0xA2,0x2C,             // 202: I = 0x22C (sprite)
    0x62,0x0A,             // 204: V2 = 10 (x)
    0x63,0x0A,             // 206: V3 = 10 (y)
    // main loop @ 208
    0xD2,0x35,             // 208: draw sprite at V2,V3 (5 rows)
    0x65,0x05,             // 20A: V5 = 5 (key 5 = left, keyboard Q)
    0xE5,0xA1,             // 20C: skip if key 5 not pressed
    0x12,0x22,             // 20E: jump move-left
    0x67,0x07,             // 210: V7 = 7 (key 7 = down, keyboard A)
    0xE7,0xA1,             // 212: skip if key 7 not pressed
    0x12,0x2E,             // 214: jump move-down
    0x68,0x08,             // 216: V8 = 8 (key 8 = up, keyboard W)
    0xE8,0xA1,             // 218: skip if key 8 not pressed
    0x12,0x34,             // 21A: jump move-up
    0x66,0x06,             // 21C: V6 = 6 (key 6 = react, keyboard E)
    0xE6,0xA1,             // 21E: skip if key 6 not pressed -> loop
    0x12,0x3A,             // 220: jump flash
    0x12,0x08,             // 222: loop back to main
    // move-left @ 224
    0xD2,0x35,             // 224: erase (draw again)
    0x22,0x00,             // 226: (placeholder patched below) - use jump trick instead
    // (unused padding to keep addresses aligned)
    0x00,0x00,
    // 22A unused
    0x00,0x00
  ]);
  // Build demo ROM programmatically for clarity/robustness
  function buildDemoRom() {
    const rom = [];
    const push = (...b) => rom.push(...b);
    push(0x00,0xE0);              // CLS
    push(0xA2,0x40);              // I = sprite
    push(0x62,0x0A);              // V2 = 10 x
    push(0x63,0x0A);              // V3 = 10 y
    const loop = PROG_START + rom.length;
    push(0xD2,0x35);              // draw
    push(0x65,0x05); push(0xE5,0xA1);           // key 5 (Q) left
    push(0x12,0x00);              // patched: jump left
    const leftAddr = PROG_START + rom.length;
    push(0x67,0x07); push(0xE7,0xA1);           // key 7 (A) right (mirror; keep simple)
    push(0x12,0x00);
    const rightAddr = PROG_START + rom.length;
    push(0x68,0x08); push(0xE8,0xA1);           // key 8 (W) up
    push(0x12,0x00);
    const upAddr = PROG_START + rom.length;
    push(0x66,0x06); push(0xE6,0xA1);           // key 6 (E) react
    push(0x12,0x00);
    const flashAddr = PROG_START + rom.length;
    push(0x12, hi(loop), lo(loop));             // back to loop

    // left handler: erase, x--, wrap, redraw, back to loop
    const leftPos = rom.length;
    push(0xD2,0x35);              // erase
    push(0x72,0xFF);              // V2 -= 1
    push(0x32,0xFF);              // skip if x != 255 (underflow wrap check)
    push(0x62,0x3F);              // x = 63
    push(0x12, hi(loop), lo(loop));

    // right handler (key 7)
    const rightPos = rom.length;
    push(0xD2,0x35);
    push(0x72,0x01);              // V2 += 1
    push(0x32,0x40);              // skip if x == 64
    push(0x12, hi(loop), lo(loop));
    push(0x62,0x00);              // x = 0
    push(0x12, hi(loop), lo(loop));

    // up handler (key 8)
    const upPos = rom.length;
    push(0xD2,0x35);
    push(0x73,0xFF);              // V3 -= 1
    push(0x33,0xFF);
    push(0x63,0x1F);              // y = 31
    push(0x12, hi(loop), lo(loop));

    // down handler is folded into flash? Add explicit down via key 7? Keep key 7 = right.
    // flash handler (key 6): erase, invert flash sprite at fixed pos, redraw
    const flashPos = rom.length;
    push(0xD2,0x35);              // erase main sprite
    push(0xC4,0x1F);              // V4 = random & 31 (y)
    push(0x60,0x3C);              // V0 = 60 (x)
    push(0xA2,0x50);              // I = flash sprite (big block)
    push(0xD0,0x44);              // draw flash block (4x4 rows of 4 bytes wide? use 4-byte wide sprite)
    push(0x63,0x0A);              // V3 = 10 restore y
    push(0xA2,0x40);              // I = main sprite
    push(0xD2,0x35);              // redraw main sprite
    push(0x12, hi(loop), lo(loop));

    // patch jumps
    rom[10] = hi(leftAddr);  rom[11] = lo(leftAddr);
    rom[14] = hi(rightAddr); rom[15] = lo(rightAddr);
    rom[18] = hi(upAddr);    rom[19] = lo(upAddr);
    rom[22] = hi(flashAddr); rom[23] = lo(flashAddr);
    // fix data refs: sprite at offset 0x40 (64), flash sprite at 0x50 (80)
    rom[2] = 0xA2; rom[3] = 0x40;

    // sprite: small cross, 5 bytes
    push(0x20,0x70,0x20,0x70,0x20);
    while (rom.length < 0x50 - PROG_START) push(0x00);
    // flash sprite: 4 rows x 4 bytes
    push(0xF0,0xF0,0xF0,0xF0,
         0x0F,0x0F,0x0F,0x0F,
         0xF0,0xF0,0xF0,0xF0,
         0x0F,0x0F,0x0F,0x0F);

    function hi(a){return (a>>8)&0xFF;}
    function lo(a){return a&0xFF;}
    return new Uint8Array(rom);
  }

  class Chip8 {
    constructor() {
      this.reset();
    }
    reset(rom) {
      this.memory = new Uint8Array(MEM_SIZE);
      this.memory.set(FONT, FONT_ADDR);
      this.V = new Uint8Array(16);
      this.I = 0;
      this.pc = PROG_START;
      this.stack = [];
      this.delayTimer = 0;
      this.soundTimer = 0;
      this.display = new Uint8Array(W * H);
      this.keys = new Uint8Array(16);
      this.waitingForKey = -1;
      this.drawFlag = true;
      this.rom = rom || null;
      if (rom) this.loadRom(rom);
    }
    loadRom(rom) {
      const n = Math.min(rom.length, MEM_SIZE - PROG_START);
      this.memory.set(rom.subarray(0, n), PROG_START);
      this.pc = PROG_START;
      this.V.fill(0);
      this.I = 0;
      this.stack = [];
      this.delayTimer = 0;
      this.soundTimer = 0;
      this.display.fill(0);
      this.drawFlag = true;
      this.waitingForKey = -1;
    }
    setKey(idx, down) {
      this.keys[idx] = down ? 1 : 0;
      if (!down && this.waitingForKey === idx) {
        this.waitingForKey = -1;
      }
    }
    step() {
      if (this.waitingForKey >= 0) {
        // waiting: check keys
        for (let k = 0; k < 16; k++) {
          if (this.keys[k]) {
            this.V[this.waitingForKey] = k;
            this.waitingForKey = -1;
            break;
          }
        }
        if (this.waitingForKey >= 0) return;
      }
      const pc = this.pc;
      const hi = this.memory[pc], lo = this.memory[pc + 1];
      const op = (hi << 8) | lo;
      this.pc = (pc + 2) & 0xFFF;
      this.lastOp = op;
      this.lastPc = pc;

      const x = (op & 0x0F00) >> 8;
      const y = (op & 0x00F0) >> 4;
      const n = op & 0x0F;
      const nn = op & 0xFF;
      const nnn = op & 0x0FFF;
      const V = this.V;

      switch (op & 0xF000) {
        case 0x0000:
          if (op === 0x00E0) {
            this.display.fill(0);
            this.drawFlag = true;
          } else if (op === 0x00EE) {
            this.pc = this.stack.pop() || PROG_START;
          }
          break;
        case 0x1000:
          this.pc = nnn;
          break;
        case 0x2000:
          this.stack.push(this.pc);
          this.pc = nnn;
          break;
        case 0x3000:
          if (V[x] === nn) this.pc = (this.pc + 2) & 0xFFF;
          break;
        case 0x4000:
          if (V[x] !== nn) this.pc = (this.pc + 2) & 0xFFF;
          break;
        case 0x5000:
          if (V[x] === V[y]) this.pc = (this.pc + 2) & 0xFFF;
          break;
        case 0x6000:
          V[x] = nn;
          break;
        case 0x7000:
          V[x] = (V[x] + nn) & 0xFF;
          break;
        case 0x8000:
          switch (n) {
            case 0x0: V[x] = V[y]; break;
            case 0x1: V[x] |= V[y]; break;
            case 0x2: V[x] &= V[y]; break;
            case 0x3: V[x] ^= V[y]; break;
            case 0x4: {
              const s = V[x] + V[y];
              V[x] = s & 0xFF;
              V[0xF] = s > 0xFF ? 1 : 0;
              break;
            }
            case 0x5: {
              const d = V[x] - V[y];
              V[x] = d & 0xFF;
              V[0xF] = d < 0 ? 0 : 1;
              break;
            }
            case 0x6: {
              const lsb = V[x] & 1;
              V[x] = V[x] >> 1;
              V[0xF] = lsb;
              break;
            }
            case 0x7: {
              const d = V[y] - V[x];
              V[x] = d & 0xFF;
              V[0xF] = d < 0 ? 0 : 1;
              break;
            }
            case 0xE: {
              const msb = (V[x] >> 7) & 1;
              V[x] = (V[x] << 1) & 0xFF;
              V[0xF] = msb;
              break;
            }
          }
          break;
        case 0x9000:
          if (V[x] !== V[y]) this.pc = (this.pc + 2) & 0xFFF;
          break;
        case 0xA000:
          this.I = nnn;
          break;
        case 0xB000:
          this.pc = (nnn + V[0]) & 0xFFF;
          break;
        case 0xC000:
          V[x] = (Math.random() * 256 | 0) & nn;
          break;
        case 0xD000: {
          const startX = V[x] % W;
          const startY = V[y] % H;
          V[0xF] = 0;
          for (let row = 0; row < n; row++) {
            const py = startY + row;
            if (py >= H) break;
            const spriteByte = this.memory[(this.I + row) & 0xFFF];
            for (let col = 0; col < 8; col++) {
              const px = startX + col;
              if (px >= W) break;
              if ((spriteByte << col) & 0x80) {
                const idx = py * W + px;
                if (this.display[idx]) {
                  this.display[idx] = 0;
                  V[0xF] = 1;
                } else {
                  this.display[idx] = 1;
                }
              }
            }
          }
          this.drawFlag = true;
          break;
        }
        case 0xE000:
          if (nn === 0x9E) {
            if (this.keys[V[x] & 0xF]) this.pc = (this.pc + 2) & 0xFFF;
          } else if (nn === 0xA1) {
            if (!this.keys[V[x] & 0xF]) this.pc = (this.pc + 2) & 0xFFF;
          }
          break;
        case 0xF000:
          switch (nn) {
            case 0x07: V[x] = this.delayTimer; break;
            case 0x0A:
              this.waitingForKey = x;
              return; // don't advance until key
            case 0x15: this.delayTimer = V[x]; break;
            case 0x18: this.soundTimer = V[x]; break;
            case 0x1E: this.I = (this.I + V[x]) & 0xFFF; break;
            case 0x29: this.I = FONT_ADDR + (V[x] & 0xF) * 5; break;
            case 0x33: {
              let val = V[x];
              this.memory[this.I] = (val / 100 | 0);
              this.memory[(this.I + 1) & 0xFFF] = (val / 10 | 0) % 10;
              this.memory[(this.I + 2) & 0xFFF] = val % 10;
              break;
            }
            case 0x55:
              for (let i = 0; i <= x; i++) this.memory[(this.I + i) & 0xFFF] = V[i];
              break;
            case 0x65:
              for (let i = 0; i <= x; i++) V[i] = this.memory[(this.I + i) & 0xFFF];
              break;
          }
          break;
      }
    }
    tickTimers() {
      if (this.delayTimer > 0) this.delayTimer--;
      if (this.soundTimer > 0) {
        this.soundTimer--;
        if (this.soundTimer === 0) beepStop();
      } else if (this.soundTimer === 0) {
        beepStop();
      }
      if (this.soundTimer > 0) beepStart();
    }
    disasm(op) {
      if (op === undefined || op === null) return '----';
      const x = (op & 0x0F00) >> 8, y = (op & 0x00F0) >> 4;
      const n = op & 0xF, nn = op & 0xFF, nnn = op & 0xFFF;
      const hx = 'V' + x.toString(16).toUpperCase();
      const hy = 'V' + y.toString(16).toUpperCase();
      const h = (v, w) => '0x' + v.toString(16).toUpperCase().padStart(w, '0');
      switch (op & 0xF000) {
        case 0x0000:
          return op === 0x00E0 ? 'CLS' : (op === 0x00EE ? 'RET' : 'SYS ' + h(nnn,3));
        case 0x1000: return 'JP   ' + h(nnn,3);
        case 0x2000: return 'CALL ' + h(nnn,3);
        case 0x3000: return 'SE   ' + hx + ', ' + h(nn,2);
        case 0x4000: return 'SNE  ' + hx + ', ' + h(nn,2);
        case 0x5000: return 'SE   ' + hx + ', ' + hy;
        case 0x6000: return 'LD   ' + hx + ', ' + h(nn,2);
        case 0x7000: return 'ADD  ' + hx + ', ' + h(nn,2);
        case 0x8000:
          switch (n) {
            case 0x0: return 'LD   ' + hx + ', ' + hy;
            case 0x1: return 'OR   ' + hx + ', ' + hy;
            case 0x2: return 'AND  ' + hx + ', ' + hy;
            case 0x3: return 'XOR  ' + hx + ', ' + hy;
            case 0x4: return 'ADD  ' + hx + ', ' + hy + ' (carry)';
            case 0x5: return 'SUB  ' + hx + ', ' + hy;
            case 0x6: return 'SHR  ' + hx;
            case 0x7: return 'SUBN ' + hx + ', ' + hy;
            case 0xE: return 'SHL  ' + hx;
          }
          return 'UNK';
        case 0x9000: return 'SNE  ' + hx + ', ' + hy;
        case 0xA000: return 'LD   I, ' + h(nnn,3);
        case 0xB000: return 'JP   ' + h(nnn,3) + ' + V0';
        case 0xC000: return 'RND  ' + hx + ', ' + h(nn,2);
        case 0xD000: return 'DRW  ' + hx + ', ' + hy + ', ' + n;
        case 0xE000:
          return nn === 0x9E ? 'SKP  ' + hx : (nn === 0xA1 ? 'SKNP ' + hx : 'UNK');
        case 0xF000:
          switch (nn) {
            case 0x07: return 'LD   ' + hx + ', DT';
            case 0x0A: return 'LD   ' + hx + ', K';
            case 0x15: return 'LD   DT, ' + hx;
            case 0x18: return 'LD   ST, ' + hx;
            case 0x1E: return 'ADD  I, ' + hx;
            case 0x29: return 'LD   F, ' + hx;
            case 0x33: return 'LD   B, ' + hx;
            case 0x55: return 'LD   [I], ' + hx;
            case 0x65: return 'LD   ' + hx + ', [I]';
          }
          return 'UNK';
      }
      return 'UNK';
    }
  }

  // ---------------- Audio (sound timer beep) ----------------
  let audioCtx = null, osc = null, gain = null, beeping = false;
  function beepStart() {
    if (beeping) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 440;
      gain.gain.value = 0.05;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      beeping = true;
    } catch (e) { /* audio unavailable */ }
  }
  function beepStop() {
    if (!beeping) return;
    try {
      if (osc) { osc.stop(); osc.disconnect(); }
      if (gain) gain.disconnect();
    } catch (e) { /* ignore */ }
    osc = null; gain = null; beeping = false;
  }

  // ---------------- UI wiring ----------------
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const regGrid = document.getElementById('regGrid');
  const dbgI = document.getElementById('dbgI');
  const dbgPC = document.getElementById('dbgPC');
  const dbgDT = document.getElementById('dbgDT');
  const dbgST = document.getElementById('dbgST');
  const stackBox = document.getElementById('stackBox');
  const instrBox = document.getElementById('instrBox');
  const statusLine = document.getElementById('statusLine');
  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');
  const runBtn = document.getElementById('runBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stepBtn = document.getElementById('stepBtn');
  const resetBtn = document.getElementById('resetBtn');
  const romFile = document.getElementById('romFile');
  const keypadEl = document.getElementById('keypad');

  const chip = new Chip8();
  chip.loadRom(buildDemoRom());

  let running = false;
  let ips = parseInt(speedSlider.value, 10);
  let lastTimerTick = 0;

  // render loop ~60fps
  function frame(ts) {
    if (running) {
      if (ts - lastTimerTick >= 1000 / 60) {
        lastTimerTick = ts;
        chip.tickTimers();
      }
      for (let i = 0; i < ips; i++) chip.step();
    }
    render();
    updateDebug();
    requestAnimationFrame(frame);
  }

  function render() {
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let i = 0; i < W * H; i++) {
      const on = chip.display[i];
      d[i * 4] = on ? 192 : 0;
      d[i * 4 + 1] = on ? 202 : 0;
      d[i * 4 + 2] = on ? 245 : 0;
      d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  const hx = v => '0x' + v.toString(16).toUpperCase().padStart(2, '0');
  function updateDebug() {
    let html = '';
    for (let i = 0; i < 16; i++) {
      html += '<span>V' + i.toString(16).toUpperCase() + ':</span><b>' + hx(chip.V[i]) + '</b>';
    }
    regGrid.innerHTML = html;
    dbgI.textContent = '0x' + chip.I.toString(16).toUpperCase().padStart(3, '0');
    dbgPC.textContent = '0x' + chip.pc.toString(16).toUpperCase().padStart(3, '0');
    dbgDT.textContent = chip.delayTimer;
    dbgST.textContent = chip.soundTimer;
    stackBox.textContent = chip.stack.length
      ? chip.stack.map(v => '0x' + v.toString(16).toUpperCase().padStart(3, '0')).join(' -> ')
      : '(empty)';
    if (chip.lastOp !== undefined) {
      instrBox.textContent =
        '@ 0x' + chip.lastPc.toString(16).toUpperCase().padStart(3, '0') + ':  ' +
        chip.disasm(chip.lastOp) + '  [' + hx((chip.lastOp >> 8) & 0xFF) + ' ' + hx(chip.lastOp & 0xFF) + ']';
    }
    statusLine.textContent = 'Status: ' + (running ? 'running' : 'paused');
  }

  // Controls
  runBtn.addEventListener('click', () => { running = true; });
  pauseBtn.addEventListener('click', () => { running = false; });
  stepBtn.addEventListener('click', () => { running = false; chip.step(); });
  resetBtn.addEventListener('click', () => {
    running = false;
    chip.reset(chip.rom || buildDemoRom());
    beepStop();
  });
  speedSlider.addEventListener('input', () => {
    ips = parseInt(speedSlider.value, 10);
    speedVal.textContent = ips;
  });

  romFile.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const bytes = new Uint8Array(ev.target.result);
      if (bytes.length > MEM_SIZE - PROG_START) {
        alert('ROM too large (max ' + (MEM_SIZE - PROG_START) + ' bytes).');
        return;
      }
      running = false;
      chip.rom = bytes;
      chip.loadRom(bytes);
      beepStop();
    };
    reader.readAsArrayBuffer(f);
  });

  // Keyboard
  function keyFromEvent(e) {
    return Object.prototype.hasOwnProperty.call(KEY_MAP, e.key.toLowerCase())
      ? KEY_MAP[e.key.toLowerCase()] : -1;
  }
  window.addEventListener('keydown', e => {
    const k = keyFromEvent(e);
    if (k >= 0) {
      chip.setKey(k, true);
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    const k = keyFromEvent(e);
    if (k >= 0) {
      chip.setKey(k, false);
      e.preventDefault();
    }
  });

  // On-screen keypad
  const kpButtons = [];
  KEYPAD_LAYOUT.forEach(([label, code]) => {
    const btn = document.createElement('div');
    btn.className = 'kp';
    btn.innerHTML = label + '<small>' +
      (Object.keys(KEY_MAP).find(k => KEY_MAP[k] === code).toUpperCase()) + '</small>';
    const press = ev => {
      ev.preventDefault();
      chip.setKey(code, true);
      btn.classList.add('active');
    };
    const release = ev => {
      ev.preventDefault();
      chip.setKey(code, false);
      btn.classList.remove('active');
    };
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', ev => { chip.setKey(code, false); btn.classList.remove('active'); });
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('touchcancel', release, { passive: false });
    keypadEl.appendChild(btn);
    kpButtons.push([btn, code]);
  });

  // Highlight on-screen keys for physical presses
  window.addEventListener('keydown', e => {
    const k = keyFromEvent(e);
    if (k >= 0) kpButtons.forEach(([b, c]) => { if (c === k) b.classList.add('active'); });
  });
  window.addEventListener('keyup', e => {
    const k = keyFromEvent(e);
    if (k >= 0) kpButtons.forEach(([b, c]) => { if (c === k) b.classList.remove('active'); });
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
