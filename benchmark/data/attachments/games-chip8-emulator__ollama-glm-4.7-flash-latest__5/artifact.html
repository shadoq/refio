<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --accent-hover: #0062a3;
            --border-color: #3e3e42;
            --success-color: #4ec9b0;
            --warning-color: #ce9178;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1400px;
            width: 100%;
        }

        .display-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        canvas {
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            image-rendering: pixelated;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-wrapper button {
            width: 100%;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .key {
            background-color: #333;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }

        .key:hover {
            background-color: #444;
        }

        .key.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(0.98);
        }

        .key.pressed {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .debugger-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
        }

        .debugger-panel h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--success-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .debug-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .debug-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .debug-item label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }

        .debug-item .value {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-color);
            word-break: break-all;
        }

        .memory-view {
            margin-top: 20px;
        }

        .memory-view h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--warning-color);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 4px;
        }

        .memory-cell {
            background-color: #333;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 4px 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-align: center;
            color: #aaa;
        }

        .memory-cell.highlight {
            background-color: var(--accent-color);
            color: white;
        }

        .memory-cell.highlight-pc {
            background-color: var(--success-color);
            color: #1e1e1e;
        }

        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }

        .status-bar .status {
            color: var(--success-color);
            font-weight: 600;
        }

        .status-bar .error {
            color: var(--warning-color);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .debugger-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display-section">
            <canvas id="display" width="640" height="320"></canvas>
            <div class="keypad" id="keypad">
                <div class="key" data-key="0">1</div>
                <div class="key" data-key="1">2</div>
                <div class="key" data-key="2">3</div>
                <div class="key" data-key="3">C</div>
                <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div>
                <div class="key" data-key="6">6</div>
                <div class="key" data-key="7">D</div>
                <div class="key" data-key="8">7</div>
                <div class="key" data-key="9">8</div>
                <div class="key" data-key="A">9</div>
                <div class="key" data-key="B">E</div>
                <div class="key" data-key="C">A</div>
                <div class="key" data-key="D">B</div>
                <div class="key" data-key="E">F</div>
                <div class="key" data-key="F">0</div>
            </div>
        </div>

        <div class="controls-section">
            <div class="control-group">
                <label>Emulation Controls</label>
                <div class="button-row">
                    <button id="runBtn">Run</button>
                    <button id="pauseBtn" disabled>Pause</button>
                    <button id="stepBtn">Step</button>
                    <button id="resetBtn">Reset</button>
                </div>
            </div>

            <div class="control-group">
                <label>ROM Loading</label>
                <div class="file-input-wrapper">
                    <button>Load ROM File</button>
                    <input type="file" id="romInput" accept=".ch8,.rom">
                </div>
            </div>

            <div class="control-group">
                <label>Speed (Instructions/Frame)</label>
                <div class="speed-control">
                    <input type="range" id="speedSlider" min="1" max="10" value="5">
                    <span id="speedValue">5</span>
                </div>
            </div>

            <div class="status-bar">
                <span id="statusText" class="status">Ready</span>
            </div>
        </div>

        <div class="debugger-panel">
            <h2>Debugger</h2>
            <div class="debug-grid">
                <div class="debug-item">
                    <label>PC (Program Counter)</label>
                    <div class="value" id="debugPC">0x200</div>
                </div>
                <div class="debug-item">
                    <label>I (Index Register)</label>
                    <div class="value" id="debugI">0x000</div>
                </div>
                <div class="debug-item">
                    <label>SP (Stack Pointer)</label>
                    <div class="value" id="debugSP">0</div>
                </div>
                <div class="debug-item">
                    <label>DT (Delay Timer)</label>
                    <div class="value" id="debugDT">0</div>
                </div>
                <div class="debug-item">
                    <label>ST (Sound Timer)</label>
                    <div class="value" id="debugST">0</div>
                </div>
                <div class="debug-item">
                    <label>VF (Carry/Borrow)</label>
                    <div class="value" id="debugVF">0</div>
                </div>
            </div>

            <div class="memory-view">
                <h3>Current Instruction</h3>
                <div class="value" id="debugInstruction" style="font-size: 16px; margin-bottom: 10px;">0x0000</div>
                <div class="memory-grid" id="memoryGrid"></div>
            </div>
        </div>
    </div>

        class Chip8 {
            constructor() {
                this.memory = new Uint8Array(MEMORY_SIZE);
                this.v = new Uint8Array(16);
                this.i = 0;
                this.pc = PROGRAM_START;
                this.stack = [];
                this.sp = 0;
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.keypad = new Uint8Array(16);
                this.display = new Uint8Array(DISPLAY_WIDTH * DISPLAY_HEIGHT);
                this.drawFlag = false;
                this.running = false;
                this.speed = 5;
                this.lastFrameTime = 0;
            }

            reset() {
                this.memory.fill(0);
                this.v.fill(0);
                this.i = 0;
                this.pc = PROGRAM_START;
                this.stack = [];
                this.sp = 0;
                this.delayTimer = 0;
                this.soundTimer = 0;
                this.keypad.fill(0);
                this.display.fill(0);
                this.drawFlag = false;
                this.running = false;
                this.loadFontSet();
            }

            loadFontSet() {
                for (let i = 0; i < FONT_SET_SIZE; i++) {
                    this.memory[FONT_SET_START + i] = FONT_SET[i];
                }
            }

            loadROM(data) {
                this.reset();
                const bytesToLoad = Math.min(data.length, MEMORY_SIZE - PROGRAM_START);
                for (let i = 0; i < bytesToLoad; i++) {
                    this.memory[PROGRAM_START + i] = data[i];
                }
                this.pc = PROGRAM_START;
            }

            loadDemoROM() {
                this.loadROM(DEMO_ROM);
            }

            updateTimers() {
                if (this.delayTimer > 0) this.delayTimer--;
                if (this.soundTimer > 0) this.soundTimer--;
            }

            handleInput(key, pressed) {
                const keyIndex = KEYPAD_LAYOUT.indexOf(key);
                if (keyIndex !== -1) {
                    this.keypad[keyIndex] = pressed ? 1 : 0;
                }
            }

            cycle() {
                if (!this.running) return;

                const instructionsPerFrame = this.speed;
                for (let i = 0; i < instructionsPerFrame; i++) {
                    this.step();
                    if (this.pc === 0x00EE) {
                        this.pc -= 2;
                    }
                }
                this.updateTimers();
                this.drawFlag = false;
            }

            step() {
                const opcode = (this.memory[this.pc] << 8) | this.memory[this.pc + 1];
                this.pc += 2;

                switch (opcode & 0xF000) {
                    case 0x0000:
                        this.handleOp0NNN(opcode);
                        break;
                    case 0x1000:
                        this.pc = opcode & 0x0FFF;
                        break;
                    case 0x2000:
                        this.stack.push(this.pc);
                        this.sp++;
                        this.pc = opcode & 0x0FFF;
                        break;
                    case 0x3000:
                        if (this.v[(opcode >> 8) & 0xF] === (opcode & 0x00FF)) {
                            this.pc += 2;
                        }
                        break;
                    case 0x4000:
                        if (this.v[(opcode >> 8) & 0xF] !== (opcode & 0x00FF)) {
                            this.pc += 2;
                        }
                        break;
                    case 0x5000:
                        if (this.v[(opcode >> 8) & 0xF] === this.v[(opcode >> 4) & 0xF]) {
                            this.pc += 2;
                        }
                        break;
                    case 0x6000:
                        this.v[(opcode >> 8) & 0xF] = opcode & 0x00FF;
                        break;
                    case 0x7000:
                        this.v[(opcode >> 8) & 0xF] += opcode & 0x00FF;
                        break;
                    case 0x8000:
                        this.handleOp8NNN(opcode);
                        break;
                    case 0x9000:
                        if (this.v[(opcode >> 8) & 0xF] !== this.v[(opcode >> 4) & 0xF]) {
                            this.pc += 2;
                        }
                        break;
                    case 0xA000:
                        this.i = opcode & 0x0FFF;
                        break;
                    case 0xB000:
                        this.pc = (opcode & 0x0FFF) + this.v[0];
                        break;
                    case 0xC000:
                        this.v[(opcode >> 8) & 0xF] = Math.floor(Math.random() * 256) & (opcode & 0x00FF);
                        break;
                    case 0xD000:
                        this.handleOpDNNN(opcode);
                        break;
                    case 0xE000:
                        this.handleOpENNN(opcode);
                        break;
                    case 0xF000:
                        this.handleOpFNNN(opcode);
                        break;
                    default:
                        console.warn(`Unknown opcode: 0x${opcode.toString(16)}`);
                }
            }

            handleOp0NNN(opcode) {
                switch (opcode) {
                    case 0x00E0:
                        this.display.fill(0);
                        this.drawFlag = true;
                        break;
                    case 0x00EE:
                        if (this.sp > 0) {
                            this.sp--;
                            this.pc = this.stack.pop();
                        }
                        break;
                    default:
                        console.warn(`Unknown opcode: 0x${opcode.toString(16)}`);
                }
            }

            handleOp8NNN(opcode) {
                const x = (opcode >> 8) & 0xF;
                const y = (opcode >> 4) & 0xF;
                const nibble = opcode & 0xF;

                switch (nibble) {
                    case 0x0:
                        this.v[x] = this.v[y];
                        break;
                    case 0x1:
                        this.v[x] |= this.v[y];
                        break;
                    case 0x2:
                        this.v[x] &= this.v[y];
                        break;
                    case 0x3:
                        this.v[x] ^= this.v[y];
                        break;
                    case 0x4:
                        const sum = this.v[x] + this.v[y];
                        this.v[0xF] = sum > 255 ? 1 : 0;
                        this.v[x] = sum & 0xFF;
                        break;
                    case 0x5:
                        this.v[0xF] = this.v[x] >= this.v[y] ? 1 : 0;
                        this.v[x] -= this.v[y];
                        break;
                    case 0x6:
                        this.v[0xF] = this.v[x] & 1;
                        this.v[x] >>= 1;
                        break;
                    case 0x7:
                        this.v[0xF] = this.v[y] >= this.v[x] ? 1 : 0;
                        this.v[x] = this.v[y] - this.v[x];
                        break;
                    case 0xE:
                        this.v[0xF] = (this.v[x] >> 7) & 1;
                        this.v[x] <<= 1;
                        break;
                }
            }

            handleOpDNNN(opcode) {
                const x = this.v[(opcode >> 8) & 0xF];
                const y = this.v[(opcode >> 4) & 0xF];
                const n = opcode & 0xF;
                const height = n;

                let pixel = 0;
                let collision = 0;

                for (let row = 0; row < height; row++) {
                    const spriteByte = this.memory[this.i + row];
                    for (let col = 0; col < 8; col++) {
                        if ((spriteByte & (0x80 >> col)) !== 0) {
                            const px = (x + col) % DISPLAY_WIDTH;
                            const py = (y + row) % DISPLAY_HEIGHT;
                            const index = py * DISPLAY_WIDTH + px;

                            if (this.display[index] === 1) {
                                collision = 1;
                            }
                            this.display[index] ^= 1;
                        }
                    }
                }

                this.v[0xF] = collision;
                this.drawFlag = true;
            }

            handleOpENNN(opcode) {
                const x = (opcode >> 8) & 0xF;
                const nibble = opcode & 0xF;

                switch (nibble) {
                    case 0x9E:
                        if (this.keypad[x]) {
                            this.pc += 2;
                        }
                        break;
                    case 0xA1:
                        if (!this.keypad[x]) {
                            this.pc += 2;
                        }
                        break;
                }
            }

            handleOpFNNN(opcode) {
                const x = (opcode >> 8) & 0xF;
                const nibble = opcode & 0xF;

                switch (nibble) {
                    case 0x07:
                        this.v[x] = this.delayTimer;
                        break;
                    case 0x0A:
                        this.waitForKey();
                        break;
                    case 0x15:
                        this.delayTimer = this.v[x];
                        break;
                    case 0x18:
                        this.soundTimer = this.v[x];
                        break;
                    case 0x1E:
                        this.i += this.v[x];
                        break;
                    case 0x29:
                        this.i = this.v[x] * 5;
                        break;
                    case 0x33:
                        this.memory[this.i] = Math.floor(this.v[x] / 100);
                        this.memory[this.i + 1] = Math.floor((this.v[x] % 100) / 10);
                        this.memory[this.i + 2] = this.v[x] % 10;
                        break;
                    case 0x55:
                        for (let i = 0; i <= x; i++) {
                            this.memory[this.i + i] = this.v[i];
                        }
                        break;
                    case 0x65:
                        for (let i = 0; i <= x; i++) {
                            this.v[i] = this.memory[this.i + i];
                        }
                        break;
                }
            }

            waitForKey() {
                for (let i = 0; i < 16; i++) {
                    if (this.keypad[i]) {
                        this.v[x] = i;
                        return;
                    }
                }
                this.pc -= 2;
            }

            draw() {
                const canvas = document.getElementById('display');
                const ctx = canvas.getContext('2d');
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;

                for (let i = 0; i < this.display.length; i++) {
                    const pixel = this.display[i];
                    const x = i % DISPLAY_WIDTH;
                    const y = Math.floor(i / DISPLAY_WIDTH);
                    const canvasX = x * (canvas.width / DISPLAY_WIDTH);
                    const canvasY = y * (canvas.height / DISPLAY_HEIGHT);

                    const index = (canvasY * canvas.width + canvasX) * 4;
                    data[index] = pixel ? 255 : 0;
                    data[index + 1] = pixel ? 255 : 0;
                    data[index + 2] = pixel ? 255 : 0;
                    data[index + 3] = 255;
                }

                ctx.putImageData(imageData, 0, 0);
            }
        }

        // UI and Event Handling
        const emulator = new Chip8();
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const statusText = document.getElementById('statusText');
        const memoryGrid = document.getElementById('memoryGrid');

        // Initialize memory grid
        for (let i = 0; i < 256; i++) {
            const cell = document.createElement('div');
            cell.className = 'memory-cell';
            cell.id = `mem-${i}`;
            cell.textContent = '0x' + i.toString(16).padStart(2, '0');
            memoryGrid.appendChild(cell);
        }

        function updateDebugPanel() {
            document.getElementById('debugPC').textContent = '0x' + emulator.pc.toString(16).padStart(4, '0');
            document.getElementById('debugI').textContent = '0x' + emulator.i.toString(16).padStart(3, '0');
            document.getElementById('debugSP').textContent = emulator.sp;
            document.getElementById('debugDT').textContent = emulator.delayTimer;
            document.getElementById('debugST').textContent = emulator.soundTimer;
            document.getElementById('debugVF').textContent = emulator.v[0xF];

            const currentOpcode = (emulator.memory[emulator.pc] << 8) | emulator.memory[emulator.pc + 1];
            document.getElementById('debugInstruction').textContent = '0x' + currentOpcode.toString(16).padStart(4, '0');

            // Update memory grid highlights
            for (let i = 0; i < 256; i++) {
                const cell = document.getElementById(`mem-${i}`);
                cell.classList.remove('highlight', 'highlight-pc');
                if (i === emulator.pc) {
                    cell.classList.add('highlight-pc');
                } else if (i === emulator.i || i === emulator.i + 1 || i === emulator.i + 2) {
                    cell.classList.add('highlight');
                }
            }
        }

        function gameLoop() {
            emulator.cycle();
            emulator.draw();
            updateDebugPanel();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('runBtn').addEventListener('click', () => {
            emulator.running = true;
            document.getElementById('runBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            statusText.textContent = 'Running';
            statusText.className = 'status';
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            emulator.running = false;
            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            statusText.textContent = 'Paused';
            statusText.className = 'error';
        });

        document.getElementById('stepBtn').addEventListener('click', () => {
            emulator.running = false;
            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            emulator.step();
            emulator.draw();
            updateDebugPanel();
            statusText.textContent = 'Stepped';
            statusText.className = 'status';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            emulator.running = false;
            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            emulator.reset();
            emulator.draw();
            updateDebugPanel();
            statusText.textContent = 'Reset';
            statusText.className = 'status';
        });

        speedSlider.addEventListener('input', (e) => {
            emulator.speed = parseInt(e.target.value);
            speedValue.textContent = emulator.speed;
        });

        document.getElementById('romInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = new Uint8Array(event.target.result);
                    emulator.loadROM(data);
                    emulator.running = false;
                    document.getElementById('runBtn').disabled = false;
                    document.getElementById('pauseBtn').disabled = true;
                    emulator.draw();
                    updateDebugPanel();
                    statusText.textContent = 'ROM Loaded';
                    statusText.className = 'status';
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Keypad handling
        const keypad = document.getElementById('keypad');
        const keyElements = keypad.querySelectorAll('.key');

        keyElements.forEach(keyElement => {
            const key = keyElement.dataset.key;
            
            keyElement.addEventListener('mousedown', (e) => {
                e.preventDefault();
                keyElement.classList.add('pressed');
                emulator.handleInput(key, true);
            });

            keyElement.addEventListener('mouseup', (e) => {
                e.preventDefault();
                keyElement.classList.remove('pressed');
                emulator.handleInput(key, false);
            });

            keyElement.addEventListener('mouseleave', (e) => {
                keyElement.classList.remove('pressed');
                emulator.handleInput(key, false);
            });

            keyElement.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keyElement.classList.add('pressed');
                emulator.handleInput(key, true);
            });

            keyElement.addEventListener('touchend', (e) => {
                e.preventDefault();
                keyElement.classList.remove('pressed');
                emulator.handleInput(key, false);
            });
        });

        // Keyboard mapping
        const keyMap = {
            '1': '0', '2': '1', '3': '2', '4': '3',
            'q': '0', 'w': '1', 'e': '2', 'r': '3',
            'a': '4', 's': '5', 'd': '6', 'f': '7',
            'z': '8', 'x': '9', 'c': 'A', 'v': 'B',
            ' ': 'C', 'Enter': 'D',
            'i': 'E', 'o': 'F', 'p': '0'
        };

        document.addEventListener('keydown', (e) => {
            const key = keyMap[e.key] || e.key.toLowerCase();
            if (KEYPAD_LAYOUT.includes(key)) {
                emulator.handleInput(key, true);
                const keyElement = document.querySelector(`.key[data-key="${key}"]`);
                if (keyElement) keyElement.classList.add('active');
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = keyMap[e.key] || e.key.toLowerCase();
            if (KEYPAD_LAYOUT.includes(key)) {
                emulator.handleInput(key, false);
                const keyElement = document.querySelector(`.key[data-key="${key}"]`);
                if (keyElement) keyElement.classList.remove('active');
            }
        });

        // Initialize
        emulator.loadDemoROM();
        emulator.draw();
        updateDebugPanel();
        gameLoop();
    </script>
</body>
</html>
