<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neuron Growth Simulation</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070f;
    display: flex; justify-content: center; align-items: center;
    font-family: monospace, monospace;
    color: #ffd400;
  }
  #container {
    position: relative;
  }
  canvas {
    display: block;
    background: #05070f;
    box-shadow: 0 0 50px #101a3a inset;
    border-radius: 8px;
  }
  .dg.ac {
    position: fixed !important;
    top: 10px !important;
    right: 10px !important;
    z-index: 10;
    font-family: monospace, monospace;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas" width="800" height="800"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
// === Setup ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Neon palette colors
const palette = {
  background: '#05070f',
  backgroundGlow: '#101a3a',
  mainBranch: '#00e5ff',
  accentBranch: '#d6ff00',
  synapse: '#ff2bd6',
  pulse: '#fff36a',
  uiAccent: '#ffd400',
  gridScanline: 'rgba(0, 229, 255, 0.08)'
};

// Parameters with defaults
const params = {
  neuronCount: 5,
  branchGrowthSpeed: 0.8, // px per frame
  maxBranchDepth: 8,
  branchSplitChance: 0.3,
  branchCurvature: 0.35,
  maxBranchLength: 120,
  synapseDistanceThreshold: 12,
  synapseGlowStrength: 8,
  pulseSpeed: 2.8,
  pulseFrequency: 0.03,
  pulseBrightness: 0.85,
  backgroundColor: palette.background,
  branchColor: palette.mainBranch,
  accentBranchColor: palette.accentBranch,
  synapseColor: palette.synapse,
  pulseColor: palette.pulse
};

// === Data Structures ===
class Branch {
  constructor(startX, startY, angle, depth, parentBranch = null) {
    this.startX = startX;
    this.startY = startY;
    this.angle = angle; // radians
    this.depth = depth;
    this.length = 0; // grows over time
    this.maxLength = params.maxBranchLength * (0.7 + Math.random() * 0.6);
    this.children = [];
    this.parent = parentBranch;
    this.curveControl = null; // control point for quadratic curve
    this.thickness = 1 + Math.random() * 1.2; // slight thickness variation
    this.growing = true;
    this.endX = startX;
    this.endY = startY;
  }

  grow() {
    if (!this.growing) return false;
    this.length += params.branchGrowthSpeed * (0.7 + Math.random() * 0.6);
    if (this.length >= this.maxLength) {
      this.length = this.maxLength;
      this.growing = false;
    }
    // Calculate end point with slight curve
    const baseEndX = this.startX + this.length * Math.cos(this.angle);
    const baseEndY = this.startY + this.length * Math.sin(this.angle);
    // Control point for curve is perpendicular offset
    const curveOffset = params.branchCurvature * this.length * (Math.random() * 2 - 1);
    const midX = this.startX + this.length / 2 * Math.cos(this.angle);
    const midY = this.startY + this.length / 2 * Math.sin(this.angle);
    const normalAngle = this.angle + Math.PI / 2;
    this.curveControl = {
      x: midX + curveOffset * Math.cos(normalAngle),
      y: midY + curveOffset * Math.sin(normalAngle)
    };
    this.endX = baseEndX;
    this.endY = baseEndY;
    return true;
  }

  getTip() {
    return { x: this.endX, y: this.endY };
  }

  getThickness() {
    // Thickness tapers with depth
    return this.thickness * (1 - this.depth / (params.maxBranchDepth + 1));
  }
}

class Neuron {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.branches = [];
  }

  startGrowth() {
    // Start first branch in random direction
    const angle = Math.random() * 2 * Math.PI;
    const branch = new Branch(this.x, this.y, angle, 1);
    this.branches.push(branch);
  }
}

// Synapse connects two branch tips
class Synapse {
  constructor(branchA, branchB) {
    this.branchA = branchA;
    this.branchB = branchB;
    this.glowPhase = Math.random() * Math.PI * 2;
  }

  update(dt) {
    this.glowPhase += dt * 4;
  }

  getGlowAlpha() {
    return 0.4 + 0.6 * Math.sin(this.glowPhase) * params.synapseGlowStrength / 10;
  }
}

// Electric pulse traveling along synapse
class Pulse {
  constructor(synapse) {
    this.synapse = synapse;
    this.progress = 0; // 0..1
    this.speed = params.pulseSpeed * (0.7 + Math.random() * 0.6);
  }

  update() {
    this.progress += this.speed * params.pulseFrequency;
    if (this.progress > 1) return false;
    return true;
  }

  getPosition() {
    const { branchA, branchB } = this.synapse;
    const ax = branchA.endX;
    const ay = branchA.endY;
    const bx = branchB.endX;
    const by = branchB.endY;
    // Linear interpolation
    const x = ax + this.progress * (bx - ax);
    const y = ay + this.progress * (by - ay);
    return { x, y };
  }
}

// === Global State ===
let neurons = [];
let branches = [];
let synapses = [];
let pulses = [];
let growing = true;
let animationPaused = false;

// Max total branches to limit complexity
const MAX_TOTAL_BRANCHES = 300;

// === Setup functions ===
function randomSeedNeurons() {
  neurons = [];
  branches = [];
  synapses = [];
  pulses = [];
  const centerX = W / 2;
  const centerY = H / 2;
  const count = Math.floor(params.neuronCount);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const radius = 10 + Math.random() * 20;
    const x = centerX + radius * Math.cos(angle);
    const y = centerY + radius * Math.sin(angle);
    const neuron = new Neuron(x, y);
    neuron.startGrowth();
    neurons.push(neuron);
    branches.push(...neuron.branches);
  }
}

// === Neuron growth logic ===
function growBranches() {
  if (!growing) return;
  let newBranches = [];
  for (const branch of branches) {
    if (branch.growing) {
      const grew = branch.grow();
      if (!grew && branch.depth < params.maxBranchDepth) {
        // Possibly split
        if (Math.random() < params.branchSplitChance) {
          const angle1 = branch.angle + (Math.random() * 0.5 + 0.2);
          const angle2 = branch.angle - (Math.random() * 0.5 + 0.2);
          const tip = branch.getTip();
          // Main child branch
          const child1 = new Branch(tip.x, tip.y, angle1, branch.depth + 1, branch);
          newBranches.push(child1);
          // Secondary accent branch smaller and thinner
          if (Math.random() < 0.6) {
            const child2 = new Branch(tip.x, tip.y, angle2, branch.depth + 1, branch);
            child2.thickness *= 0.6;
            newBranches.push(child2);
          }
          branch.children.push(...newBranches.slice(-2));
        }
        branch.growing = false;
      }
    }
  }
  // Add new branches
  if (branches.length + newBranches.length > MAX_TOTAL_BRANCHES) {
    growing = false;
  } else {
    branches.push(...newBranches);
  }
  // Stop if no branch is growing
  if (!branches.some(b => b.growing)) {
    growing = false;
  }
}

// === Synapse detection ===
function detectSynapses() {
  synapses = [];
  // Check pairs of branch tips
  for (let i = 0; i < branches.length; i++) {
    const b1 = branches[i];
    if (b1.growing) continue; // only finished branches
    const tip1 = b1.getTip();
    for (let j = i + 1; j < branches.length; j++) {
      const b2 = branches[j];
      if (b2.growing) continue;
      const tip2 = b2.getTip();
      const dx = tip1.x - tip2.x;
      const dy = tip1.y - tip2.y;
      const distSq = dx*dx + dy*dy;
      if (distSq < params.synapseDistanceThreshold * params.synapseDistanceThreshold) {
        // Prevent duplicates
        if (!synapses.some(s => (s.branchA === b1 && s.branchB === b2) || (s.branchA === b2 && s.branchB === b1))) {
          synapses.push(new Synapse(b1, b2));
        }
      }
    }
  }
}

// === Pulse animation ===
function updatePulses() {
  // Update existing pulses
  pulses = pulses.filter(p => p.update());
  // Randomly add new pulses
  if (synapses.length > 0 && Math.random() < params.pulseFrequency * 0.5) {
    const syn = synapses[Math.floor(Math.random() * synapses.length)];
    pulses.push(new Pulse(syn));
  }
}

// === Rendering ===
function drawBackground() {
  ctx.fillStyle = params.backgroundColor;
  ctx.fillRect(0, 0, W, H);

  // Faint vignette
  const grad = ctx.createRadialGradient(W/2, H/2, W/2*0.7, W/2, H/2, W/2);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Optional grid/scanlines
  ctx.strokeStyle = palette.gridScanline;
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 10) {
    ctx.beginPath();
    ctx.moveTo(0, y + (Math.sin(Date.now() * 0.002 + y * 0.05) * 1));
    ctx.lineTo(W, y + (Math.sin(Date.now() * 0.002 + y * 0.05) * 1));
    ctx.stroke();
  }
}

function drawBranch(branch) {
  ctx.lineCap = 'round';
  ctx.shadowBlur = 12;
  ctx.shadowColor = params.branchColor;
  ctx.strokeStyle = branch.depth > params.maxBranchDepth * 0.7 ? params.accentBranchColor : params.branchColor;
  ctx.lineWidth = branch.getThickness();

  ctx.beginPath();
  ctx.moveTo(branch.startX, branch.startY);
  if (branch.curveControl) {
    ctx.quadraticCurveTo(branch.curveControl.x, branch.curveControl.y, branch.endX, branch.endY);
  } else {
    ctx.lineTo(branch.endX, branch.endY);
  }
  ctx.stroke();
}

function drawSynapse(s) {
  const glowAlpha = s.getGlowAlpha();
  ctx.shadowBlur = 15;
  ctx.shadowColor = params.synapseColor;
  ctx.fillStyle = hexToRgba(params.synapseColor, glowAlpha);
  const { x: x1, y: y1 } = s.branchA.getTip();
  const { x: x2, y: y2 } = s.branchB.getTip();

  // Draw a small glowing circle midpoint
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  ctx.beginPath();
  ctx.arc(mx, my, 4, 0, Math.PI * 2);
  ctx.fill();
}

function drawPulse(p) {
  const pos = p.getPosition();
  ctx.shadowBlur = 20;
  ctx.shadowColor = params.pulseColor;
  ctx.fillStyle = params.pulseColor;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
  ctx.fill();
}

function hexToRgba(hex, alpha) {
  const bigint = parseInt(hex.replace('#', ''), 16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

// === Animation Loop ===
function animate(time=0) {
  if (!animationPaused) {
    growBranches();
    detectSynapses();
    updatePulses();
  }

  // Draw everything
  drawBackground();

  // Draw branches
  for (const b of branches) {
    drawBranch(b);
  }

  // Draw synapses
  for (const s of synapses) {
    drawSynapse(s);
  }

  // Draw pulses
  for (const p of pulses) {
    drawPulse(p);
  }

  requestAnimationFrame(animate);
}

// === GUI Setup ===
const gui = new dat.GUI({ width: 320 });

// Growth folder
const growthFolder = gui.addFolder('Growth');
growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(() => regenerate());
growthFolder.add(params, 'branchGrowthSpeed', 0.1, 2, 0.05).name('Branch Growth Speed');
growthFolder.add(params, 'maxBranchDepth', 1, 12, 1).name('Max Branch Depth');
growthFolder.add(params, 'branchSplitChance', 0, 1, 0.01).name('Branch Split Chance');
growthFolder.add(params, 'branchCurvature', 0, 1, 0.01).name('Branch Curvature');
growthFolder.add(params, 'maxBranchLength', 20, 180, 1).name('Max Branch Length');
growthFolder.open();

// Synapses folder
const synapseFolder = gui.addFolder('Synapses');
synapseFolder.add(params, 'synapseDistanceThreshold', 4, 30, 1).name('Synapse Distance Threshold');
synapseFolder.add(params, 'synapseGlowStrength', 1, 12, 0.1).name('Synapse Glow Strength');
synapseFolder.open();

// Pulses folder
const pulseFolder = gui.addFolder('Pulses');
pulseFolder.add(params, 'pulseSpeed', 0.5, 6, 0.1).name('Pulse Speed');
pulseFolder.add(params, 'pulseFrequency', 0.001, 0.1, 0.001).name('Pulse Frequency');
pulseFolder.add(params, 'pulseBrightness', 0.1, 1, 0.01).name('Pulse Brightness');
pulseFolder.open();

// Visuals folder
const visualsFolder = gui.addFolder('Visuals');
visualsFolder.addColor(params, 'backgroundColor').name('Background Color');
visualsFolder.addColor(params, 'branchColor').name('Branch Color');
visualsFolder.addColor(params, 'accentBranchColor').name('Accent Branch Color');
visualsFolder.addColor(params, 'synapseColor').name('Synapse Color');
visualsFolder.addColor(params, 'pulseColor').name('Pulse Color');
visualsFolder.open();

// Buttons
const actions = {
  regenerateNetwork: () => regenerate(),
  clearCanvas: () => clearCanvas(),
  pauseResume: () => {
    animationPaused = !animationPaused;
    actions.pauseResume.name(animationPaused ? 'Resume Animation' : 'Pause Animation');
  }
};
gui.add(actions, 'regenerateNetwork').name('Regenerate Network');
gui.add(actions, 'clearCanvas').name('Clear Canvas');
gui.add(actions, 'pauseResume').name('Pause Animation');

// === Actions ===
function regenerate() {
  growing = true;
  randomSeedNeurons();
}

function clearCanvas() {
  branches = [];
  neurons = [];
  synapses = [];
  pulses = [];
  growing = false;
  ctx.clearRect(0, 0, W, H);
}

// Initialize
randomSeedNeurons();
animate();
</script>
</body>
</html>
