<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gouraud-Shaded Rotating Cube</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #444;
            background: #0f0f1a;
        }
        .info {
            margin-top: 15px;
            text-align: center;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width=600 height=500></canvas>
    <div class="info">
        <span id="fps">FPS: 0</span>
    </div>
    <div class="controls">
        [W] Toggle wireframe | [P] Pause/Resume | Light source moves automatically
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');

        // Cube vertices (centered at origin, size 100)
        const halfSize = 100;
        const vertices = [
            { x: -halfSize, y: -halfSize, z: -halfSize }, // 0: back-bottom-left
            { x: halfSize, y: -halfSize, z: -halfSize },  // 1: back-bottom-right
            { x: halfSize, y: halfSize, z: -halfSize },   // 2: back-top-right
            { x: -halfSize, y: halfSize, z: -halfSize },  // 3: back-top-left
            { x: -halfSize, y: -halfSize, z: halfSize },  // 4: front-bottom-left
            { x: halfSize, y: -halfSize, z: halfSize },   // 5: front-bottom-right
            { x: halfSize, y: halfSize, z: halfSize },    // 6: front-top-right
            { x: -halfSize, y: halfSize, z: halfSize }    // 7: front-top-left
        ];

        // Faces (defined by vertex indices, counter-clockwise order)
        const faces = [
            { vertices: [0, 1, 2, 3], normal: { x: 0, y: 0, z: -1 } }, // back
            { vertices: [5, 4, 7, 6], normal: { x: 0, y: 0, z: 1 } },  // front
            { vertices: [3, 2, 6, 7], normal: { x: 0, y: -1, z: 0 } }, // top
            { vertices: [4, 5, 1, 0], normal: { x: 0, y: 1, z: 0 } },  // bottom
            { vertices: [2, 1, 5, 6], normal: { x: -1, y: 0, z: 0 } }, // right
            { vertices: [4, 7, 3, 0] , normal: { x: 1, y: 0, z: 0 } }  // left
        ];

        // State
        let angleX = 0;
        let angleY = 0;
        let angleZ = 0;
        let wireframe = false;
        let paused = false;
        let lightAngle = 0;

        // Light source position (moving in a circle)
        function getLightPosition() {
            const dist = 300;
            return {
                x: Math.cos(lightAngle) * dist,
                y: Math.sin(lightAngle * 0.7) * 150,
                z: Math.sin(lightAngle) * dist
            };
        }

        // Rotation matrices
        function rotateX(v, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: v.x,
                y: v.y * cos - v.z * sin,
                z: v.y * sin + v.z * cos
            };
        }

        function rotateY(v, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: v.x * cos + v.z * sin,
                y: v.y,
                z: -v.x * sin + v.z * cos
            };
        }

        function rotateZ(v, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: v.x * cos - v.y * sin,
                y: v.x * sin + v.y * cos,
                z: v.z
            };
        }

        // Apply all rotations
        function transformVertex(v) {
            let rotated = rotateX(v, angleX);
            rotated = rotateY(rotated, angleY);
            rotated = rotateZ(rotated, angleZ);
            return rotated;
        }

        // Perspective projection
        const fov = 400;
        const cameraDistance = 500;

        function project(v) {
            const scale = fov / (cameraDistance - v.z);
            return {
                x: canvas.width / 2 + v.x * scale,
                y: canvas.height / 2 - v.y * scale,
                scale: scale
            };
        }

        // Calculate face normal after rotation
        function getRotatedNormal(normal) {
            let rotated = rotateX(normal, angleX);
            rotated = rotateY(rotated, angleY);
            rotated = rotateZ(rotated, angleZ);
            return rotated;
        }

        // Dot product
        function dot(a, b) {
            return a.x * b.x + a.y * b.y + a.z * b.z;
        }

        // Normalize vector
        function normalize(v) {
            const len = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
            if (len === 0) return { x: 0, y: 0, z: 0 };
            return { x: v.x / len, y: v.y / len, z: v.z / len };
        }

        // Lambertian lighting calculation
        function calculateLighting(vertexWorldPos, faceNormal, lightPos) {
            const lightDir = normalize({
                x: lightPos.x - vertexWorldPos.x,
                y: lightPos.y - vertexWorldPos.y,
                z: lightPos.z - vertexWorldPos.z
            });

            // Ambient + diffuse
            const ambient = 0.2;
            let diffuse = Math.max(0, dot(faceNormal, lightDir));
            
            // Add some specular-like highlight for visual interest
            const viewDir = normalize({ x: 0, y: 0, z: cameraDistance });
            const reflectDir = {
                x: 2 * dot(lightDir, faceNormal) * faceNormal.x - lightDir.x,
                y: 2 * dot(lightDir, faceNormal) * faceNormal.y - lightDir.y,
                z: 2 * dot(lightDir, faceNormal) * faceNormal.z - lightDir.z
            };
            const specular = Math.pow(Math.max(0, dot(reflectDir, viewDir)), 32) * 0.3;

            return ambient + diffuse * 0.8 + specular;
        }

        // Interpolate color across triangle
        function interpolateColor(v1, v2, v3, t, u) {
            const c1 = v1.color;
            const c2 = v2.color;
            const c3 = v3.color;

            return {
                r: Math.min(255, Math.max(0, c1.r + (c2.r - c1.r) * t + (c3.r - c1.r) * u)),
                g: Math.min(255, Math.max(0, c1.g + (c2.g - c1.g) * t + (c3.g - c1.g) * u)),
                b: Math.min(255, Math.max(0, c1.b + (c3.b - c1.b) * u))
            };
        }

        // Draw a filled triangle with Gouraud shading
        function drawTriangle(p1, p2, p3) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();

            // Create gradient for Gouraud-like effect
            const grad = ctx.createLinearGradient(
                (p1.x + p2.x + p3.x) / 3 - 50,
                (p1.y + p2.y + p3.y) / 3 - 50,
                (p1.x + p2.x + p3.x) / 3 + 50,
                (p1.y + p2.y + p3.y) / 3 + 50
            );

            // Use vertex colors for interpolation approximation
            grad.addColorStop(0, `rgb(${Math.floor(p1.color.r)}, ${Math.floor(p1.color.g)}, ${Math.floor(p1.color.b)})`);
            grad.addColorStop(0.5, `rgb(${Math.floor(p2.color.r)}, ${Math.floor(p2.color.g)}, ${Math.floor(p2.color.b)})`);
            grad.addColorStop(1, `rgb(${Math.floor(p3.color.r)}, ${Math.floor(p3.color.g)}, ${Math.floor(p3.color.b)})`);

            ctx.fillStyle = grad;
            ctx.fill();
        }

        // Draw wireframe triangle
        function drawWireframeTriangle(p1, p2, p3) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Main render function
        function render() {
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const lightPos = getLightPosition();

            // Transform all vertices
            const transformedVertices = vertices.map(v => transformVertex(v));

            // Calculate projected positions and colors for each vertex
            const vertexData = transformedVertices.map((v, i) => ({
                world: v,
                projected: project(v),
                baseColor: { r: 100 + (i * 20) % 80, g: 50 + (i * 30) % 100, b: 150 + (i * 10) % 60 }
            }));

            // Process faces
            const renderedFaces = [];

            for (const face of faces) {
                const vIndices = face.vertices;
                const p1 = vertexData[vIndices[0]];
                const p2 = vertexData[vIndices[1]];
                const p3 = vertexData[vIndices[2]];

                // Calculate transformed normal
                const rotatedNormal = getRotatedNormal(face.normal);
                rotatedNormal.x = normalize(rotatedNormal).x;
                rotatedNormal.y = normalize(rotatedNormal).y;
                rotatedNormal.z = normalize(rotatedNormal).z;

                // Backface culling - check if face is pointing away from camera
                const viewDot = dot(rotatedNormal, { x: 0, y: 0, z: -1 });
                if (viewDot > 0) continue; // Skip back-facing polygons

                // Calculate lighting for each vertex of this face
                const lightIntensityP1 = calculateLighting(p1.world, rotatedNormal, lightPos);
                const lightIntensityP2 = calculateLighting(p2.world, rotatedNormal, lightPos);
                const lightIntensityP3 = calculateLighting(p3.world, rotatedNormal, lightPos);

                // Apply lighting to colors
                p1.color = {
                    r: p1.baseColor.r * lightIntensityP1,
                    g: p1.baseColor.g * lightIntensityP1,
                    b: p1.baseColor.b * lightIntensityP1
                };
                p2.color = {
                    r: p2.baseColor.r * lightIntensityP2,
                    g: p2.baseColor.g * lightIntensityP2,
                    b: p2.baseColor.b * lightIntensityP2
                };
                p3.color = {
                    r: p3.baseColor.r * lightIntensityP3,
                    g: p3.baseColor.g * lightIntensityP3,
                    b: p3.baseColor.b * lightIntensityZ3
                };

                // Calculate depth for sorting (average z of vertices)
                const depth = (p1.world.z + p2.world.z + p3.world.z) / 3;

                renderedFaces.push({
                    vIndices: vIndices,
                    projected: [p1.projected, p2.projected, p3.projected],
                    colors: [p1.color, p2.color, p3.color],
                    depth: depth
                });
            }

            // Sort faces by depth (painter's algorithm)
            renderedFaces.sort((a, b) => b.depth - a.depth);

            // Render faces
            for (const face of renderedFaces) {
                const [p1, p2, p3] = face.projected;
                
                if (wireframe) {
                    drawWireframeTriangle(p1, p2, p3);
                } else {
                    // Create interpolated color object with colors at each vertex
                    const triangleVertexData = {
                        p1: { ...p1, color: face.colors[0] },
                        p2: { ...p2, color: face.colors[1] },
                        p3: { ...p3, color: face.colors[2] }
                    };
                    drawTriangle(triangleVertexData.p1, triangleVertexData.p2, triangleVertexData.p3);
                }
            }

            // Draw wireframe overlay if in wireframe mode
            if (wireframe) {
                for (const face of faces) {
                    const vIndices = face.vertices;
                    const p1 = vertexData[vIndices[0]];
                    const p2 = vertexData[vIndices[1]];
                    const p3 = vertexData[vIndices[2]];

                    // Calculate transformed normal for culling check
                    const rotatedNormal = getRotatedNormal(face.normal);
                    const viewDot = dot(rotatedNormal, { x: 0, y: 0, z: -1 });
                    if (viewDot > 0) continue;

                    ctx.beginPath();
                    ctx.moveTo(p1.projected.x, p1.projected.y);
                    ctx.lineTo(p2.projected.x, p2.projected.y);
                    ctx.lineTo(p3.projected.x, p3.projected.y);
                    ctx.closePath();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            // Draw light source indicator
            const lightProjected = project(transformVertex(lightPos));
            ctx.beginPath();
            ctx.arc(lightProjected.x, lightProjected.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffdd00';
            ctx.fill();
            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw light direction line from center
            const centerProjected = { x: canvas.width / 2, y: canvas.height / 2 };
            ctx.beginPath();
            ctx.moveTo(centerProjected.x, centerProjected.y);
            ctx.lineTo(lightProjected.x, lightProjected.y);
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Animation loop
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsUpdateTime = lastTime;

        function animate(currentTime) {
            if (!paused) {
                angleX += 0.01;
                angleY += 0.015;
                angleZ += 0.005;
                lightAngle += 0.02;
            }

            render();

            // FPS calculation
            frameCount++;
            if (currentTime - fpsUpdateTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (currentTime - fpsUpdateTime));
                fpsDisplay.textContent = `FPS: ${fps}`;
                frameCount = 0;
                fpsUpdateTime = currentTime;
            }

            requestAnimationFrame(animate);
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') {
                wireframe = !wireframe;
            } else if (e.key === 'p' || e.key === 'P') {
                paused = !paused;
            }
        });

        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
