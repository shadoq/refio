<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuron Growth Simulation</title>
<style>
  body, html {margin:0; padding:0; width:100%; height:100%; background:#05070f; overflow:hidden;}
  canvas {display:block; margin:auto; background:#05070f;}
  #gui {position:absolute; top:10px; right:10px; z-index:10;}
</style>
<script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<div id="gui"></div>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const guiContainer = document.getElementById('gui');

  // Neon palette
  const palette = {
    background: '#05070f',
    backgroundGlow: '#101a3a',
    branch: '#00e5ff',
    accentBranch: '#d6ff00',
    synapse: '#ff2bd6',
    pulse: '#fff36a',
    uiAccent: '#ffd400',
    grid: 'rgba(0,229,255,0.08)'
  };

  // Simulation parameters
  const params = {
    neuronCount: 4,
    branchGrowthSpeed: 0.5,
    maxBranchDepth: 6,
    branchSplitChance: 0.3,
    branchCurvature: 0.5,
    maxBranchLength: 120,
    synapseDistanceThreshold: 30,
    synapseGlowStrength: 8,
    pulseSpeed: 0.02,
    pulseFrequency: 2,
    pulseBrightness: 0.8,
    backgroundColor: palette.background,
    branchColor: palette.branch,
    accentBranchColor: palette.accentBranch,
    synapseColor: palette.synapse,
    pulseColor: palette.pulse
  };

  // Data structures
  let neurons = [];
  let branches = [];
  let synapses = [];
  let pulses = [];
  let animationId = null;
  let paused = false;
  let lastPulseTime = 0;

  // Utility functions
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function distance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

  // Branch class
  class Branch {
    constructor(start, dir, depth, length, thickness, curvature, isAccent=false) {
      this.start = start;
      this.dir = dir; // angle in radians
      this.depth = depth;
      this.length = length;
      this.progress = 0; // 0 to 1
      this.thickness = thickness;
      this.curvature = curvature;
      this.isAccent = isAccent;
      this.end = {x: start.x + Math.cos(dir) * length, y: start.y + Math.sin(dir) * length};
      this.split = false;
    }
    update() {
      if (this.progress < 1) {
        this.progress += params.branchGrowthSpeed / 100;
        if (this.progress > 1) this.progress = 1;
      }
    }
    draw() {
      const endX = lerp(this.start.x, this.end.x, this.progress);
      const endY = lerp(this.start.y, this.end.y, this.progress);
      const midX = (this.start.x + endX) / 2;
      const midY = (this.start.y + endY) / 2;
      const ctrlX = midX + Math.cos(this.dir + Math.PI / 2) * this.curvature * this.length;
      const ctrlY = midY + Math.sin(this.dir + Math.PI / 2) * this.curvature * this.length;
      ctx.beginPath();
      ctx.moveTo(this.start.x, this.start.y);
      ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
      ctx.lineWidth = this.thickness;
      ctx.strokeStyle = this.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.stroke();
    }
  }

  // Synapse class
  class Synapse {
    constructor(a, b) {
      this.a = a; // branch tip
      this.b = b;
      this.created = Date.now();
    }
    draw() {
      const dx = this.b.x - this.a.x;
      const dy = this.b.y - this.a.y;
      const dist = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.floor(dist / 10));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = lerp(this.a.x, this.b.x, t);
        const y = lerp(this.a.y, this.b.y, t);
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = params.synapseColor;
        ctx.shadowBlur = params.synapseGlowStrength;
        ctx.shadowColor = params.synapseColor;
        ctx.fill();
      }
    }
  }

  // Pulse class
  class Pulse {
    constructor(synapse) {
      this.synapse = synapse;
      this.t = 0;
    }
    update() {
      this.t += params.pulseSpeed;
      if (this.t > 1) this.t = 0;
    }
    draw() {
      const a = this.synapse.a;
      const b = this.synapse.b;
      const x = lerp(a.x, b.x, this.t);
      const y = lerp(a.y, b.y, this.t);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = params.pulseColor;
      ctx.globalAlpha = params.pulseBrightness;
      ctx.shadowBlur = 12;
      ctx.shadowColor = params.pulseColor;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Generate neurons
  function generateNeurons() {
    neurons = [];
    const center = {x: canvas.width / 2, y: canvas.height / 2};
    for (let i = 0; i < params.neuronCount; i++) {
      const angle = rand(0, Math.PI * 2);
      const radius = rand(50, 100);
      const pos = {x: center.x + Math.cos(angle) * radius, y: center.y + Math.sin(angle) * radius};
      neurons.push(pos);
    }
  }

  // Grow branches recursively
  function growBranches() {
    branches = [];
    synapses = [];
    pulses = [];
    neurons.forEach(neuron => {
      const initialDir = rand(0, Math.PI * 2);
      const initialLength = rand(20, params.maxBranchLength);
      const initialThickness = rand(2, 4);
      const branch = new Branch(neuron, initialDir, 0, initialLength, initialThickness, params.branchCurvature);
      branches.push(branch);
    });
  }

  // Update simulation
  function update() {
    if (!paused) {
      branches.forEach(b => b.update());
      // Handle splitting
      const newBranches = [];
      branches.forEach(b => {
        if (!b.split && b.progress >= 1 && b.depth < params.maxBranchDepth) {
          if (Math.random() < params.branchSplitChance) {
            const angle1 = b.dir + rand(-Math.PI / 4, Math.PI / 4);
            const angle2 = b.dir + rand(-Math.PI / 4, Math.PI / 4);
            const len1 = b.length * rand(0.6, 0.8);
            const len2 = b.length * rand(0.6, 0.8);
            const thick1 = b.thickness * rand(0.8, 1);
            const thick2 = b.thickness * rand(0.8, 1);
            const curv1 = b.curvature * rand(0.8, 1.2);
            const curv2 = b.curvature * rand(0.8, 1.2);
            const accent1 = Math.random() < 0.3;
            const accent2 = Math.random() < 0.3;
            const end1 = {x: b.end.x + Math.cos(angle1) * len1, y: b.end.y + Math.sin(angle1) * len1};
            const end2 = {x: b.end.x + Math.cos(angle2) * len2, y: b.end.y + Math.sin(angle2) * len2};
            const nb1 = new Branch(b.end, angle1, b.depth + 1, len1, thick1, curv1, accent1);
            const nb2 = new Branch(b.end, angle2, b.depth + 1, len2, thick2, curv2, accent2);
            newBranches.push(nb1, nb2);
            b.split = true;
          }
        }
      });
      branches.push(...newBranches);

      // Detect synapses
      const tips = branches.filter(b => b.progress >= 1).map(b => b.end);
      for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
          const d = distance(tips[i], tips[j]);
          if (d < params.synapseDistanceThreshold) {
            const exists = synapses.some(s => (s.a === tips[i] && s.b === tips[j]) || (s.a === tips[j] && s.b === tips[i]));
            if (!exists) {
              synapses.push(new Synapse(tips[i], tips[j]));
            }
          }
        }
      }

      // Pulse spawning
      const now = Date.now();
      if (now - lastPulseTime > 1000 / params.pulseFrequency) {
        if (synapses.length > 0) {
          const syn = synapses[Math.floor(rand(0, synapses.length))];
          pulses.push(new Pulse(syn));
        }
        lastPulseTime = now;
      }

      pulses.forEach(p => p.update());
    }
  }

  // Draw simulation
  function draw() {
    ctx.fillStyle = params.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Optional grid
    ctx.strokeStyle = palette.grid;
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= canvas.width; x += 20) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += 20) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
    // Draw branches
    branches.forEach(b => b.draw());
    // Draw synapses
    synapses.forEach(s => s.draw());
    // Draw pulses
    pulses.forEach(p => p.draw());
  }

  // Animation loop
  function loop() {
    update();
    draw();
    animationId = requestAnimationFrame(loop);
  }

  // GUI
  const gui = new dat.GUI({ autoPlace: false, width: 300 });
  gui.domElement.style.background = palette.backgroundGlow;
  gui.domElement.style.border = `1px solid ${palette.uiAccent}`;
  guiContainer.appendChild(gui.domElement);

  const growthFolder = gui.addFolder('Growth');
  growthFolder.add(params, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(() => { regenerate(); });
  growthFolder.add(params, 'branchGrowthSpeed', 0.1, 2, 0.1).name('Growth Speed');
  growthFolder.add(params, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
  growthFolder.add(params, 'branchSplitChance', 0, 1, 0.05).name('Split Chance');
  growthFolder.add(params, 'branchCurvature', 0, 1, 0.05).name('Curvature');
  growthFolder.add(params, 'maxBranchLength', 50, 200, 10).name('Max Length');
  growthFolder.open();

  const synapseFolder = gui.addFolder('Synapses');
  synapseFolder.add(params, 'synapseDistanceThreshold', 10, 60, 1).name('Distance Threshold');
  synapseFolder.add(params, 'synapseGlowStrength', 0, 20, 1).name('Glow Strength');
  synapseFolder.open();

  const pulseFolder = gui.addFolder('Pulses');
  pulseFolder.add(params, 'pulseSpeed', 0.005, 0.05, 0.001).name('Speed');
  pulseFolder.add(params, 'pulseFrequency', 0.5, 5, 0.1).name('Frequency');
  pulseFolder.add(params, 'pulseBrightness', 0.1, 1, 0.05).name('Brightness');
  pulseFolder.open();

  const visualFolder = gui.addFolder('Visuals');
  visualFolder.addColor(params, 'backgroundColor').name('Background');
  visualFolder.addColor(params, 'branchColor').name('Branch');
  visualFolder.addColor(params, 'accentBranchColor').name('Accent Branch');
  visualFolder.addColor(params, 'synapseColor').name('Synapse');
  visualFolder.addColor(params, 'pulseColor').name('Pulse');
  visualFolder.open();

  const actionsFolder = gui.addFolder('Actions');
  actionsFolder.add({ regenerate: () => regenerate() }, 'regenerate').name('Regenerate Network');
  actionsFolder.add({ clear: () => clearCanvas() }, 'clear').name('Clear Canvas');
  actionsFolder.add({ pause: () => togglePause() }, 'pause').name('Pause/Resume');
  actionsFolder.open();

  function regenerate() {
    generateNeurons();
    growBranches();
  }

  function clearCanvas() {
    branches = [];
    synapses = [];
    pulses = [];
  }

  function togglePause() {
    paused = !paused;
  }

  // Initialize
  regenerate();
  loop();
})();
</script>
</body>
</html>
