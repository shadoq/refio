<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
        }

        .menu {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .menu h2 {
            margin-bottom: 20px;
            color: #00ff88;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #00cc6a, #00ff88);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            background: #0a0a15;
        }

        .score-board {
            margin-top: 20px;
            font-size: 1.5em;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff4444;
            box-shadow: 0 0 50px rgba(255, 68, 68, 0.5);
            text-align: center;
            z-index: 100;
        }

        .game-over h2 {
            color: #ff4444;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(45deg, #ff4444, #cc3333);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }

        .instructions {
            margin-top: 20px;
            font-size: 0.9em;
            color: #aaa;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME 🐍</h1>
        
        <div class="menu" id="startMenu">
            <h2>Select Game Mode</h2>
            <div class="mode-buttons">
                <button class="mode-btn active" onclick="selectMode('hvh')">Human vs Human</button>
                <button class="mode-btn" onclick="selectMode('cvh')">CPU vs Human</button>
                <button class="mode-btn" onclick="selectMode('cvc')">CPU vs CPU</button>
            </div>
            <button class="mode-btn" onclick="startGame()">Start Game</button>
            <div class="instructions">
                <p>Arrow Keys: Move</p>
                <p>R or Enter: Restart</p>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="600" class="hidden"></canvas>
        
        <div class="score-board hidden" id="scoreBoard">
            <span id="score1">Player 1: 0</span> | 
            <span id="score2">Player 2: 0</span>
        </div>

        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p id="winnerText">Winner: Player 1</p>
            <button class="restart-btn" onclick="restartGame()">Play Again (R)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const gridCount = 30;
        
        let gameRunning = false;
        let gameMode = 'hvh';
        let gameLoop;
        let speed = 100;
        
        let snake1, snake2;
        let food;
        let direction1, direction2;
        let score1, score2;
        let player1Human, player2Human;
        
        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function initGame() {
            snake1 = {
                body: [{x: 5, y: 15}, {x: 4, y: 15}, {x: 3, y: 15}],
                color: '#00ff88',
                direction: 'right'
            };
            
            snake2 = {
                body: [{x: 24, y: 15}, {x: 25, y: 15}, {x: 26, y: 15}],
                color: '#ff4444',
                direction: 'left'
            };
            
            direction1 = 'right';
            direction2 = 'left';
            score1 = 0;
            score2 = 0;
            
            spawnFood();
            
            player1Human = gameMode === 'hvh';
            player2Human = gameMode === 'hvh' || gameMode === 'cvh';
        }
        
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * gridCount),
                    y: Math.floor(Math.random() * gridCount)
                };
                
                valid = true;
                for (let segment of snake1.body) {
                    if (segment.x === food.x && segment.y === food.y) valid = false;
                }
                for (let segment of snake2.body) {
                    if (segment.x === food.x && segment.y === food.y) valid = false;
                }
            }
        }
        
        function getDistance(snake, target) {
            let head = snake.body[0];
            return Math.abs(head.x - target.x) + Math.abs(head.y - target.y);
        }
        
        function findPath(snake, target) {
            let head = snake.body[0];
            let visited = new Set();
            let queue = [[head, []]];
            
            while (queue.length > 0) {
                let [current, path] = queue.shift();
                
                if (current.x === target.x && current.y === target.y) {
                    return path;
                }
                
                let key = `${current.x},${current.y}`;
                if (visited.has(key)) continue;
                visited.add(key);
                
                let directions = [
                    {x: 0, y: -1, dir: 'up'},
                    {x: 0, y: 1, dir: 'down'},
                    {x: -1, y: 0, dir: 'left'},
                    {x: 1, y: 0, dir: 'right'}
                ];
                
                for (let d of directions) {
                    let newX = current.x + d.x;
                    let newY = current.y + d.y;
                    
                    if (newX >= 0 && newX < gridCount && newY >= 0 && newY < gridCount) {
                        let collision = false;
                        for (let segment of snake.body) {
                            if (segment.x === newX && segment.y === newY) {
                                collision = true;
                                break;
                            }
                        }
                        
                        if (!collision) {
                            queue.push([{x: newX, y: newY}, [...path, d.dir]]);
                        }
                    }
                }
            }
            
            return null;
        }
        
        function updateCPUSnake(snake, target) {
            let path = findPath(snake, target);
            
            if (path && path.length > 0) {
                snake.direction = path[0];
            } else {
                let directions = ['up', 'down', 'left', 'right'];
                let bestDir = snake.direction;
                let bestDist = Infinity;
                
                for (let dir of directions) {
                    let head = snake.body[0];
                    let newX = head.x + (dir === 'right' ? 1 : dir === 'left' ? -1 : 0);
                    let newY = head.y + (dir === 'down' ? 1 : dir === 'up' ? -1 : 0);
                    
                    if (newX >= 0 && newX < gridCount && newY >= 0 && newY < gridCount) {
                        let collision = false;
                        for (let segment of snake.body) {
                            if (segment.x === newX && segment.y === newY) {
                                collision = true;
                                break;
                            }
                        }
                        
                        if (!collision) {
                            let dist = Math.abs(newX - target.x) + Math.abs(newY - target.y);
                            if (dist < bestDist) {
                                bestDist = dist;
                                bestDir = dir;
                            }
                        }
                    }
                }
                
                snake.direction = bestDir;
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            if (player1Human) {
                if (direction1 === 'up' && snake1.direction === 'down') direction1 = 'up';
                if (direction1 === 'down' && snake1.direction === 'up') direction1 = 'down';
                if (direction1 === 'left' && snake1.direction === 'right') direction1 = 'left';
                if (direction1 === 'right' && snake1.direction === 'left') direction1 = 'right';
                snake1.direction = direction1;
            } else {
                updateCPUSnake(snake1, food);
            }
            
            if (player2Human) {
                if (direction2 === 'up' && snake2.direction === 'down') direction2 = 'up';
                if (direction2 === 'down' && snake2.direction === 'up') direction2 = 'down';
                if (direction2 === 'left' && snake2.direction === 'right') direction2 = 'left';
                if (direction2 === 'right' && snake2.direction === 'left') direction2 = 'right';
                snake2.direction = direction2;
            } else {
                updateCPUSnake(snake2, food);
            }
            
            let head1 = {
                x: snake1.body[0].x + (snake1.direction === 'right' ? 1 : snake1.direction === 'left' ? -1 : 0),
                y: snake1.body[0].y + (snake1.direction === 'down' ? 1 : snake1.direction === 'up' ? -1 : 0)
            };
            
            let head2 = {
                x: snake2.body[0].x + (snake2.direction === 'right' ? 1 : snake2.direction === 'left' ? -1 : 0),
                y: snake2.body[0].y + (snake2.direction === 'down' ? 1 : snake2.direction === 'up' ? -1 : 0)
            };
            
            let gameOver = false;
            let winner = '';
            
            if (head1.x < 0 || head1.x >= gridCount || head1.y < 0 || head1.y >= gridCount ||
                snake1.body.some(seg => seg.x === head1.x && seg.y === head1.y)) {
                gameOver = true;
                winner = player2Human ? 'Player 2' : 'CPU 2';
            }
            
            if (head2.x < 0 || head2.x >= gridCount || head2.y < 0 || head2.y >= gridCount ||
                snake2.body.some(seg => seg.x === head2.x && seg.y === head2.y)) {
                gameOver = true;
                winner = player1Human ? 'Player 1' : 'CPU 1';
            }
            
            if (head1.x === head2.x && head1.y === head2.y) {
                gameOver = true;
                winner = 'Draw';
            }
            
            if (gameOver) {
                endGame(winner);
                return;
            }
            
            snake1.body.unshift(head1);
            snake2.body.unshift(head2);
            
            if (head1.x === food.x && head1.y === food.y) {
                score1++;
                spawnFood();
            } else {
                snake1.body.pop();
            }
            
            if (head2.x === food.x && head2.y === food.y) {
                score2++;
                spawnFood();
            } else {
                snake2.body.pop();
            }
            
            updateScore();
        }
        
        function updateScore() {
            document.getElementById('score1').textContent = `Player ${player1Human ? '1' : 'CPU 1'}: ${score1}`;
            document.getElementById('score2').textContent = `Player ${player2Human ? '2' : 'CPU 2'}: ${score2}`;
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < gridCount; i++) {
                for (let j = 0; j < gridCount; j++) {
                    ctx.strokeStyle = '#1a1a2e';
                    ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
                }
            }
            
            ctx.fillStyle = snake1.color;
            for (let segment of snake1.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                ctx.strokeStyle = '#00cc6a';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            }
            
            ctx.fillStyle = snake2.color;
            for (let segment of snake2.body) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                ctx.strokeStyle = '#cc3333';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            }
            
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffcc00';
            ctx.stroke();
        }
        
        function gameLoopFunc() {
            update();
            draw();
        }
        
        function startGame() {
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('scoreBoard').classList.remove('hidden');
            document.getElementById('gameCanvas').classList.remove('hidden');
            
            initGame();
            gameRunning = true;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameLoopFunc, speed);
            
            draw();
        }
        
        function endGame(winner) {
            gameRunning = false;
            clearInterval(gameLoop);
            
            document.getElementById('winnerText').textContent = `Winner: ${winner}`;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }
        
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) {
                if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
                    restartGame();
                }
                return;
            }
            
            if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
                restartGame();
                return;
            }
            
            if (player1Human) {
                switch(e.key) {
                    case 'ArrowUp':
                        if (snake1.direction !== 'down') direction1 = 'up';
                        break;
                    case 'ArrowDown':
                        if (snake1.direction !== 'up') direction1 = 'down';
                        break;
                    case 'ArrowLeft':
                        if (snake1.direction !== 'right') direction1 = 'left';
                        break;
                    case 'ArrowRight':
                        if (snake1.direction !== 'left') direction1 = 'right';
                        break;
                }
            }
            
            if (player2Human) {
                switch(e.key) {
                    case 'w':
                    case 'W':
                        if (snake2.direction !== 'down') direction2 = 'up';
                        break;
                    case 's':
                    case 'S':
                        if (snake2.direction !== 'up') direction2 = 'down';
                        break;
                    case 'a':
                    case 'A':
                        if (snake2.direction !== 'right') direction2 = 'left';
                        break;
                    case 'd':
                    case 'D':
                        if (snake2.direction !== 'left') direction2 = 'right';
                        break;
                }
            }
        });
        
        draw();
    </script>
</body>
</html>
