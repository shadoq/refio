<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            border: 1px solid #101a3a;
        }

        /* dat.gui overrides for neon theme */
        .dg.ac {
            z-index: 10 !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 11px !important;
        }
        .dg .cr.function {
            background-color: #101a3a !important;
        }
        .dg .cr.function:hover {
            background-color: #1a2b5e !important;
        }
        .dg li.cr {
            border-top: 1px solid #101a3a !important;
        }
        .dg .folder .folder .cr .property-name {
            color: #00e5ff !important;
        }
        .dg .folder .cr .property-name {
            color: #d6ff00 !important;
        }
        .dg .folder .cr .property-name:hover {
            color: #fff !important;
        }
        .dg .folder .cr .property-name {
            color: #ffd400 !important;
        }
    </style>
    <!-- Load dat.gui from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<canvas id="neuralCanvas" width="800" height="800"></canvas>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // Palette
    const COLORS = {
        bg: '#05070f',
        bgGlow: '#101a3a',
        main: '#00e5ff',
        accent: '#d6ff00',
        synapse: '#ff2bd6',
        pulse: '#fff36a',
        ui: '#ffd400',
        grid: 'rgba(0, 229, 255, 0.08)'
    };

    // Simulation Parameters
    const params = {
        // Growth
        neuronCount: 4,
        growthSpeed: 3,
        maxDepth: 12,
        splitChance: 0.03,
        curvature: 0.5,
        maxBranchLength: 150,
        
        // Synapses
        synapseThreshold: 20,
        synapseGlow: 10,
        
        // Pulses
        pulseSpeed: 2,
        pulseFrequency: 0.02,
        pulseBrightness: 1.5,
        
        // Visuals
        bgColor: COLORS.bg,
        branchColor: COLORS.main,
        accentColor: COLORS.accent,
        synapseColor: COLORS.synapse,
        pulseColor: COLORS.pulse,
        
        // Actions
        regenerate: () => initSimulation(),
        clear: () => {
            branches = [];
            synapses = [];
            pulses = [];
            ctx.fillStyle = params.bgColor;
            ctx.fillRect(0, 0, width, height);
        },
        pauseResume: () => {
            isPaused = !isPaused;
            params.pauseResume = isPaused ? "Resume" : "Pause";
        }
    };

    let isPaused = false;
    let branches = [];
    let synapses = [];
    let pulses = [];
    let neurons = [];
    let frameCount = 0;

    // --- Classes ---

    class Neuron {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = Math.random() * Math.PI * 2;
            this.depth = 0;
            this.length = 0;
            this.thickness = Math.random() * 2 + 1;
            this.isDead = false;
            this.children = [];
            this.color = Math.random() > 0.8 ? params.accentColor : params.branchColor;
        }

        grow() {
            if (this.isDead || this.depth >= params.maxDepth) {
                this.isDead = true;
                return;
            }

            // Calculate new tip position
            const stepSize = params.growthSpeed;
            const newAngle = this.angle + (Math.random() - 0.5) * params.curvature;
            
            const nextX = this.x + Math.cos(newAngle) * stepSize;
            const nextY = this.y + Math.sin(newAngle) * stepSize;

            // Check bounds
            if (nextX < 0 || nextX > width || nextY < 0 || nextY > height) {
                this.isDead = true;
                return;
            }

            // Check length limit
            this.length += stepSize;
            if (this.length > params.maxBranchLength) {
                this.isDead = true;
                return;
            }

            // Create branch segment
            const branch = {
                x1: this.x,
                y1: this.y,
                x2: nextX,
                y2: nextY,
                thickness: this.thickness,
                color: this.color,
                parent: this
            };
            branches.push(branch);

            // Update current node
            this.x = nextX;
            this.y = nextY;
            this.angle = newAngle;
            this.depth++;
            this.thickness *= 0.95; // Tapering

            // Chance to split
            if (Math.random() < params.splitChance && this.depth < params.maxDepth - 2) {
                const child = new Neuron(this.x, this.y);
                child.angle = this.angle + (Math.random() > 0.5 ? 0.5 : -0.5);
                child.thickness = this.thickness * 0.8;
                child.color = Math.random() > 0.7 ? params.accentColor : params.branchColor;
                this.children.push(child);
                neurons.push(child);
            }
        }
    }

    class Synapse {
        constructor(branch1, branch2) {
            this.b1 = branch1;
            this.b2 = branch2;
            this.alpha = 0;
            this.pulseOffset = Math.random() * 100;
        }

        update() {
            if (this.alpha < 1) {
                this.alpha += 0.05;
            }
        }

        draw(ctx) {
            const time = Date.now() * 0.002;
            const glow = Math.sin(time + this.pulseOffset) * 0.3 + 0.7;
            
            ctx.beginPath();
            ctx.moveTo(this.b1.x2, this.b1.y2);
            ctx.lineTo(this.b2.x2, this.b2.y2);
            
            ctx.strokeStyle = params.synapseColor;
            ctx.globalAlpha = this.alpha * glow * 0.6;
            ctx.lineWidth = 1;
            ctx.shadowBlur = params.synapseGlow;
            ctx.shadowColor = params.synapseColor;
            ctx.stroke();
            
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    }

    class Pulse {
        constructor(synapse) {
            this.synapse = synapse;
            this.progress = 0;
            this.speed = params.pulseSpeed * (0.8 + Math.random() * 0.4);
            this.active = true;
        }

        update() {
            this.progress += this.speed * 0.01;
            if (this.progress >= 1) {
                this.active = false;
            }
        }

        draw(ctx) {
            if (!this.active) return;

            const x = this.synapse.b1.x2 + (this.synapse.b2.x2 - this.synapse.b1.x2) * this.progress;
            const y = this.synapse.b1.y2 + (this.synapse.b2.y2 - this.synapse.b1.y2) * this.progress;

            ctx.beginPath();
            ctx.arc(x, y, 3 * params.pulseBrightness, 0, Math.PI * 2);
            ctx.fillStyle = params.pulseColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = params.pulseColor;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // --- Core Functions ---

    function initSimulation() {
        branches = [];
        synapses = [];
        pulses = [];
        neurons = [];
        
        // Create seed neurons
        const centerX = width / 2;
        const centerY = height / 2;
        const spread = 100;
        
        for (let i = 0; i < params.neuronCount; i++) {
            const x = centerX + (Math.random() - 0.5) * spread;
            const y = centerY + (Math.random() - 0.5) * spread;
            const neuron = new Neuron(x, y);
            neurons.push(neuron);
        }
    }

    function checkSynapses() {
        // Only check tips of branches that are "alive" or recently dead
        // For simplicity, we check all branch tips against each other
        // Optimization: Spatial grid would be better, but brute force is okay for < 1000 branches
        
        const tips = [];
        branches.forEach(b => {
            // Check if parent is still growing or just finished
            if (b.parent && !b.parent.isDead) {
                tips.push(b);
            }
        });

        for (let i = 0; i < tips.length; i++) {
            for (let j = i + 1; j < tips.length; j++) {
                const b1 = tips[i];
                const b2 = tips[j];
                
                // Distance squared
                const dx = b1.x2 - b2.x2;
                const dy = b1.y2 - b2.y2;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < params.synapseThreshold * params.synapseThreshold) {
                    // Check if synapse already exists
                    const exists = synapses.some(s => 
                        (s.b1 === b1 && s.b2 === b2) || (s.b1 === b2 && s.b2 === b1)
                    );
                    
                    if (!exists) {
                        synapses.push(new Synapse(b1, b2));
                    }
                }
            }
        }
    }

    function spawnPulses() {
        if (Math.random() < params.pulseFrequency) {
            if (synapses.length > 0) {
                const randomSynapse = synapses[Math.floor(Math.random() * synapses.length)];
                pulses.push(new Pulse(randomSynapse));
            }
        }
    }

    function drawBackground() {
        // Clear with background color
        ctx.fillStyle = params.bgColor;
        ctx.fillRect(0, 0, width, height);

        // Draw subtle grid
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 0.5;
        const gridSize = 40;
        
        ctx.beginPath();
        for (let x = 0; x <= width; x += gridSize) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
        }
        for (let y = 0; y <= height; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Vignette effect
        const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
    }

    function drawBranches() {
        branches.forEach(b => {
            ctx.beginPath();
            ctx.moveTo(b.x1, b.y1);
            ctx.lineTo(b.x2, b.y2);
            
            ctx.strokeStyle = b.color;
            ctx.lineWidth = b.thickness;
            ctx.lineCap = 'round';
            
            // Glow effect
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;
            
            ctx.stroke();
        });
        
        // Reset shadow for other elements
        ctx.shadowBlur = 0;
    }

    function update() {
        if (isPaused) return;

        frameCount++;

        // Grow neurons
        neurons.forEach(n => n.grow());
        
        // Clean up dead neurons that have no children
        neurons = neurons.filter(n => !n.isDead || n.children.length > 0);

        // Check for new synapses periodically
        if (frameCount % 10 === 0) {
            checkSynapses();
        }

        // Update synapses
        synapses.forEach(s => s.update());

        // Spawn and update pulses
        spawnPulses();
        pulses.forEach(p => p.update());
        pulses = pulses.filter(p => p.active);
    }

    function draw() {
        drawBackground();
        drawBranches();
        
        // Draw synapses
        synapses.forEach(s => s.draw(ctx));
        
        // Draw pulses
        pulses.forEach(p => p.draw(ctx));
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- Initialization ---

    // Setup dat.gui
    const gui = new dat.GUI();
    
    const growthFolder = gui.addFolder('Growth');
    growthFolder.add(params, 'neuronCount', 3, 6).step(1).name('Neuron Count');
    growthFolder.add(params, 'growthSpeed', 1, 10).name('Growth Speed');
    growthFolder.add(params, 'maxDepth', 5, 20).step(1).name('Max Depth');
    growthFolder.add(params, 'splitChance', 0.01, 0.1).name('Split Chance');
    growthFolder.add(params, 'curvature', 0.1, 1.0).name('Curvature');
    growthFolder.add(params, 'maxBranchLength', 50, 300).name('Max Length');
    growthFolder.open();

    const synapseFolder = gui.addFolder('Synapses');
    synapseFolder.add(params, 'synapseThreshold', 10, 50).name('Distance Threshold');
    synapseFolder.add(params, 'synapseGlow', 5, 20).name('Glow Strength');
    synapseFolder.open();

    const pulseFolder = gui.addFolder('Pulses');
    pulseFolder.add(params, 'pulseSpeed', 1, 5).name('Speed');
    pulseFolder.add(params, 'pulseFrequency', 0.01, 0.1).name('Frequency');
    pulseFolder.add(params, 'pulseBrightness', 1, 3).name('Brightness');
    pulseFolder.open();

    const visualFolder = gui.addFolder('Visuals');
    visualFolder.addColor(params, 'bgColor').name('Background').onChange(() => {
        document.body.style.backgroundColor = params.bgColor;
    });
    visualFolder.addColor(params, 'branchColor').name('Main Branch');
    visualFolder.addColor(params, 'accentColor').name('Accent Branch');
    visualFolder.addColor(params, 'synapseColor').name('Synapse');
    visualFolder.addColor(params, 'pulseColor').name('Pulse');
    visualFolder.open();

    const actionsFolder = gui.addFolder('Actions');
    actionsFolder.add(params, 'regenerate').name('Regenerate Network');
    actionsFolder.add(params, 'clear').name('Clear Canvas');
    actionsFolder.add(params, 'pauseResume').name('Pause').onChange((val) => {
        // Update button text logic handled in params object
    });
    actionsFolder.open();

    // Start
    initSimulation();
    loop();

</script>
</body>
</html>
