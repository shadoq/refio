<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(16, 26, 58, 0.5);
        }

        canvas {
            display: block;
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 229, 255, 0.03),
                rgba(0, 229, 255, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                transparent 60%,
                rgba(5, 7, 15, 0.8) 100%
            );
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuralCanvas" width="800" height="800"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <script>
        // Configuration and State
        const config = {
            growth: {
                neuronCount: 4,
                branchSpeed: 1.5,
                maxDepth: 8,
                splitChance: 0.3,
                curvature: 0.5,
                maxBranchLength: 200
            },
            synapses: {
                distanceThreshold: 60,
                glowStrength: 20
            },
            pulses: {
                pulseSpeed: 3,
                pulseFrequency: 0.02,
                pulseBrightness: 1.0
            },
            visuals: {
                bgColor: '#05070f',
                branchColor: '#00e5ff',
                accentColor: '#d6ff00',
                synapseColor: '#ff2bd6',
                pulseColor: '#fff36a'
            },
            buttons: {
                regenerate: () => initNetwork(),
                clear: () => clearCanvas(),
                pause: () => togglePause()
            }
        };

        let canvas, ctx;
        let neurons = [];
        let synapses = [];
        let pulses = [];
        let isPaused = false;
        let animationId;
        let time = 0;

        // Initialize
        function init() {
            canvas = document.getElementById('neuralCanvas');
            ctx = canvas.getContext('2d');
            
            setupGUI();
            initNetwork();
            animate();
        }

        // Setup dat.gui
        function setupGUI() {
            const gui = new dat.GUI({ width: 300 });
            
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config.growth, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(initNetwork);
            growthFolder.add(config.growth, 'branchSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config.growth, 'maxDepth', 4, 12, 1).name('Max Depth').onChange(initNetwork);
            growthFolder.add(config.growth, 'splitChance', 0.1, 0.8).name('Split Chance');
            growthFolder.add(config.growth, 'curvature', 0.1, 1.0).name('Curvature');
            growthFolder.add(config.growth, 'maxBranchLength', 100, 400).name('Max Length');
            
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config.synapses, 'distanceThreshold', 30, 100).name('Distance Threshold');
            synapsesFolder.add(config.synapses, 'glowStrength', 5, 50).name('Glow Strength');
            
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config.pulses, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulsesFolder.add(config.pulses, 'pulseFrequency', 0.01, 0.1).name('Pulse Frequency');
            pulsesFolder.add(config.pulses, 'pulseBrightness', 0.5, 2.0).name('Pulse Brightness');
            
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config.visuals, 'bgColor').name('Background').onChange(() => clearCanvas());
            visualsFolder.addColor(config.visuals, 'branchColor').name('Branch Color').onChange(() => clearCanvas());
            visualsFolder.addColor(config.visuals, 'accentColor').name('Accent Color').onChange(() => clearCanvas());
            visualsFolder.addColor(config.visuals, 'synapseColor').name('Synapse Color').onChange(() => clearCanvas());
            visualsFolder.addColor(config.visuals, 'pulseColor').name('Pulse Color').onChange(() => clearCanvas());
            
            const buttonsFolder = gui.addFolder('Controls');
            buttonsFolder.add(config.buttons, 'regenerate').name('Regenerate Network');
            buttonsFolder.add(config.buttons, 'clear').name('Clear Canvas');
            buttonsFolder.add(config.buttons, 'pause').name('Pause/Resume');
            
            growthFolder.open();
            synapsesFolder.open();
            pulsesFolder.open();
            visualsFolder.open();
            buttonsFolder.open();
        }

        // Initialize network
        function initNetwork() {
            neurons = [];
            synapses = [];
            pulses = [];
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < config.growth.neuronCount; i++) {
                const offsetX = (Math.random() - 0.5) * 100;
                const offsetY = (Math.random() - 0.5) * 100;
                neurons.push(new Neuron(centerX + offsetX, centerY + offsetY, i));
            }
        }

        // Clear canvas
        function clearCanvas() {
            ctx.fillStyle = config.visuals.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Toggle pause
        function togglePause() {
            isPaused = !isPaused;
        }

        // Neuron class
        class Neuron {
            constructor(x, y, id) {
                this.x = x;
                this.y = y;
                this.id = id;
                this.branches = [];
                this.growthProgress = 0;
                this.targetDepth = 0;
                this.maxDepth = config.growth.maxDepth;
                this.color = Math.random() > 0.7 ? config.visuals.accentColor : config.visuals.branchColor;
                this.initBranches();
            }

            initBranches() {
                this.branches.push({
                    x: this.x,
                    y: this.y,
                    angle: Math.random() * Math.PI * 2,
                    length: 0,
                    depth: 0,
                    curvature: (Math.random() - 0.5) * config.growth.curvature,
                    thickness: 2 + Math.random() * 2,
                    isAccent: this.color === config.visuals.accentColor
                });
            }

            update() {
                if (this.growthProgress < 1) {
                    this.growthProgress += config.growth.branchSpeed * 0.01;
                    if (this.growthProgress > 1) this.growthProgress = 1;
                }

                const currentBranches = [];
                
                for (let branch of this.branches) {
                    if (branch.length < config.growth.maxBranchLength * this.growthProgress) {
                        const speed = config.growth.branchSpeed;
                        const newAngle = branch.angle + branch.curvature * speed * 0.1;
                        const dx = Math.cos(newAngle) * speed;
                        const dy = Math.sin(newAngle) * speed;
                        
                        branch.x += dx;
                        branch.y += dy;
                        branch.angle = newAngle;
                        branch.length += speed;

                        // Splitting
                        if (branch.depth < this.maxDepth && 
                            Math.random() < config.growth.splitChance && 
                            branch.length > 50) {
                            
                            const newBranch = {
                                x: branch.x,
                                y: branch.y,
                                angle: branch.angle + (Math.random() - 0.5) * 1.5,
                                length: 0,
                                depth: branch.depth + 1,
                                curvature: (Math.random() - 0.5) * config.growth.curvature,
                                thickness: branch.thickness * 0.7,
                                isAccent: Math.random() > 0.8
                            };
                            
                            this.branches.push(newBranch);
                        }
                        
                        currentBranches.push(branch);
                    }
                }
                
                this.branches = currentBranches;
            }

            draw() {
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                for (let branch of this.branches) {
                    ctx.beginPath();
                    ctx.moveTo(branch.x, branch.y);
                    
                    // Draw segment
                    const prevX = branch.x - Math.cos(branch.angle) * 10;
                    const prevY = branch.y - Math.sin(branch.angle) * 10;
                    ctx.quadraticCurveTo(prevX, prevY, branch.x, branch.y);
                    
                    ctx.strokeStyle = branch.isAccent ? config.visuals.accentColor : config.visuals.branchColor;
                    ctx.lineWidth = branch.thickness;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.strokeStyle;
                    ctx.stroke();
                }
                
                // Draw neuron center
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = config.visuals.synapseColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = config.visuals.synapseColor;
                ctx.fill();
                
                ctx.restore();
            }

            getTips() {
                return this.branches.map(b => ({ x: b.x, y: b.y, neuron: this }));
            }
        }

        // Synapse class
        class Synapse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.progress = 0;
                this.maxProgress = 1;
                this.pulseTimer = Math.random() * 100;
            }

            update() {
                this.pulseTimer += config.pulses.pulseFrequency * 60;
                if (this.pulseTimer > 100) {
                    this.pulseTimer = 0;
                    pulses.push(new Pulse(this.neuron1, this.neuron2));
                }
            }

            draw() {
                const tip1 = this.neuron1.branches[this.neuron1.branches.length - 1];
                const tip2 = this.neuron2.branches[this.neuron2.branches.length - 1];
                
                if (!tip1 || !tip2) return;

                const dx = tip2.x - tip1.x;
                const dy = tip2.y - tip1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < config.synapses.distanceThreshold) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(tip1.x, tip1.y);
                    ctx.lineTo(tip2.x, tip2.y);
                    ctx.strokeStyle = config.visuals.synapseColor;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = config.synapses.glowStrength;
                    ctx.shadowColor = config.visuals.synapseColor;
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // Pulse class
        class Pulse {
            constructor(neuron1, neuron2) {
                this.neuron1 = neuron1;
                this.neuron2 = neuron2;
                this.progress = 0;
                this.speed = config.pulses.pulseSpeed;
                this.brightness = config.pulses.pulseBrightness;
            }

            update() {
                this.progress += this.speed * 0.02;
                return this.progress < 1;
            }

            draw() {
                const tip1 = this.neuron1.branches[this.neuron1.branches.length - 1];
                const tip2 = this.neuron2.branches[this.neuron2.branches.length - 1];
                
                if (!tip1 || !tip2) return;

                const currentX = tip1.x + (tip2.x - tip1.x) * this.progress;
                const currentY = tip1.y + (tip2.y - tip1.y) * this.progress;

                ctx.save();
                ctx.beginPath();
                ctx.arc(currentX, currentY, 3, 0, Math.PI * 2);
                ctx.fillStyle = config.visuals.pulseColor;
                ctx.shadowBlur = 15 * this.brightness;
                ctx.shadowColor = config.visuals.pulseColor;
                ctx.fill();
                ctx.restore();
            }
        }

        // Check for synapses
        function checkSynapses() {
            const tips = [];
            neurons.forEach(neuron => {
                neuron.getTips().forEach(tip => tips.push(tip));
            });

            for (let i = 0; i < tips.length; i++) {
                for (let j = i + 1; j < tips.length; j++) {
                    const tip1 = tips[i];
                    const tip2 = tips[j];
                    
                    if (tip1.neuron === tip2.neuron) continue;

                    const dx = tip1.x - tip2.x;
                    const dy = tip1.y - tip2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.synapses.distanceThreshold) {
                        const existingSynapse = synapses.find(s => 
                            (s.neuron1 === tip1.neuron && s.neuron2 === tip2.neuron) ||
                            (s.neuron1 === tip2.neuron && s.neuron2 === tip1.neuron)
                        );

                        if (!existingSynapse) {
                            synapses.push(new Synapse(tip1.neuron, tip2.neuron));
                        }
                    }
                }
            }
        }

        // Animation loop
        function animate() {
            if (!isPaused) {
                time += 0.016;
                
                // Clear canvas
                ctx.fillStyle = config.visuals.bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Update and draw neurons
                neurons.forEach(neuron => {
                    neuron.update();
                    neuron.draw();
                });

                // Check and draw synapses
                checkSynapses();
                synapses.forEach(synapse => {
                    synapse.update();
                    synapse.draw();
                });

                // Update and draw pulses
                pulses = pulses.filter(pulse => pulse.update());
                pulses.forEach(pulse => pulse.draw());
            }

            animationId = requestAnimationFrame(animate);
        }

        // Start
        init();
    </script>
</body>
</html>
