<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gouraud-Shaded Rotating Cube</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: monospace;
            color: #0f0;
        }
        #container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #0f0;
            font-size: 12px;
            line-height: 1.5;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #0f0;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="info">
            <div>FPS: <span id="fps">0</span></div>
            <div>Wireframe: <span id="wireframeStatus">OFF</span></div>
            <div>Paused: <span id="pauseStatus">NO</span></div>
        </div>
        <div id="controls">
            <div>W - Toggle Wireframe</div>
            <div>P - Pause/Resume</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;

        // ==================== Math Utilities ====================
        class Vec3 {
            constructor(x = 0, y = 0, z = 0) {
                this.x = x;
                this.y = y;
                this.z = z;
            }

            add(v) {
                return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z);
            }

            sub(v) {
                return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z);
            }

            mul(s) {
                return new Vec3(this.x * s, this.y * s, this.z * s);
            }

            dot(v) {
                return this.x * v.x + this.y * v.y + this.z * v.z;
            }

            cross(v) {
                return new Vec3(
                    this.y * v.z - this.z * v.y,
                    this.z * v.x - this.x * v.z,
                    this.x * v.y - this.y * v.x
                );
            }

            length() {
                return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
            }

            normalize() {
                const len = this.length();
                if (len === 0) return new Vec3(0, 0, 1);
                return new Vec3(this.x / len, this.y / len, this.z / len);
            }

            copy() {
                return new Vec3(this.x, this.y, this.z);
            }
        }

        class Matrix3 {
            constructor(m = null) {
                if (m) {
                    this.m = m.slice();
                } else {
                    this.m = [1, 0, 0, 0, 1, 0, 0, 0, 1];
                }
            }

            static identity() {
                return new Matrix3();
            }

            static rotationX(angle) {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                return new Matrix3([
                    1, 0, 0,
                    0, c, -s,
                    0, s, c
                ]);
            }

            static rotationY(angle) {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                return new Matrix3([
                    c, 0, s,
                    0, 1, 0,
                    -s, 0, c
                ]);
            }

            static rotationZ(angle) {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                return new Matrix3([
                    c, -s, 0,
                    s, c, 0,
                    0, 0, 1
                ]);
            }

            multiply(other) {
                const a = this.m;
                const b = other.m;
                const result = [];
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        result[i * 3 + j] = 
                            a[i * 3 + 0] * b[0 * 3 + j] +
                            a[i * 3 + 1] * b[1 * 3 + j] +
                            a[i * 3 + 2] * b[2 * 3 + j];
                    }
                }
                return new Matrix3(result);
            }

            transform(v) {
                const m = this.m;
                return new Vec3(
                    m[0] * v.x + m[1] * v.y + m[2] * v.z,
                    m[3] * v.x + m[4] * v.y + m[5] * v.z,
                    m[6] * v.x + m[7] * v.y + m[8] * v.z
                );
            }
        }

        // ==================== 3D Cube ====================
        class Cube {
            constructor() {
                const s = 100;
                this.vertices = [
                    new Vec3(-s, -s, -s), // 0
                    new Vec3(s, -s, -s),  // 1
                    new Vec3(s, s, -s),   // 2
                    new Vec3(-s, s, -s),  // 3
                    new Vec3(-s, -s, s),  // 4
                    new Vec3(s, -s, s),   // 5
                    new Vec3(s, s, s),    // 6
                    new Vec3(-s, s, s)    // 7
                ];

                // Each face split into 2 triangles
                this.faces = [
                    // Front face (z = -s)
                    { vertices: [0, 1, 2], normal: new Vec3(0, 0, -1) },
                    { vertices: [0, 2, 3], normal: new Vec3(0, 0, -1) },
                    // Back face (z = s)
                    { vertices: [5, 4, 7], normal: new Vec3(0, 0, 1) },
                    { vertices: [5, 7, 6], normal: new Vec3(0, 0, 1) },
                    // Top face (y = s)
                    { vertices: [3, 2, 6], normal: new Vec3(0, 1, 0) },
                    { vertices: [3, 6, 7], normal: new Vec3(0, 1, 0) },
                    // Bottom face (y = -s)
                    { vertices: [4, 5, 1], normal: new Vec3(0, -1, 0) },
                    { vertices: [4, 1, 0], normal: new Vec3(0, -1, 0) },
                    // Right face (x = s)
                    { vertices: [1, 5, 6], normal: new Vec3(1, 0, 0) },
                    { vertices: [1, 6, 2], normal: new Vec3(1, 0, 0) },
                    // Left face (x = -s)
                    { vertices: [4, 0, 3], normal: new Vec3(-1, 0, 0) },
                    { vertices: [4, 3, 7], normal: new Vec3(-1, 0, 0) }
                ];

                this.rotation = Matrix3.identity();
                this.transformedVertices = this.vertices.map(v => v.copy());
                this.vertexLights = new Array(this.vertices.length).fill(0);
            }

            update(angleX, angleY, angleZ) {
                const rotX = Matrix3.rotationX(angleX);
                const rotY = Matrix3.rotationY(angleY);
                const rotZ = Matrix3.rotationZ(angleZ);
                
                this.rotation = rotX.multiply(rotY).multiply(rotZ);

                for (let i = 0; i < this.vertices.length; i++) {
                    this.transformedVertices[i] = this.rotation.transform(this.vertices[i]);
                }
            }

            computeLighting(lightPos) {
                this.vertexLights.fill(0);

                for (let i = 0; i < this.vertices.length; i++) {
                    const vertexPos = this.transformedVertices[i];
                    const lightDir = lightPos.sub(vertexPos).normalize();

                    let totalLight = 0;
                    for (const face of this.faces) {
                        if (face.vertices.includes(i)) {
                            const normal = this.rotation.transform(face.normal).normalize();
                            const lambert = Math.max(0, normal.dot(lightDir));
                            totalLight += lambert;
                        }
                    }

                    this.vertexLights[i] = Math.min(1, totalLight / 3);
                }
            }

            getFacesToRender() {
                const faces = [];
                for (const face of this.faces) {
                    const v0 = this.transformedVertices[face.vertices[0]];
                    const v1 = this.transformedVertices[face.vertices[1]];
                    const v2 = this.transformedVertices[face.vertices[2]];

                    const normal = this.rotation.transform(face.normal);
                    const center = new Vec3(
                        (v0.x + v1.x + v2.x) / 3,
                        (v0.y + v1.y + v2.y) / 3,
                        (v0.z + v1.z + v2.z) / 3
                    );

                    if (normal.dot(center) < 0) {
                        faces.push({
                            vertices: face.vertices,
                            v0, v1, v2,
                            depth: (v0.z + v1.z + v2.z) / 3
                        });
                    }
                }

                faces.sort((a, b) => a.depth - b.depth);
                return faces;
            }
        }

        // ==================== Rasterizer ====================
        function perspectiveProject(v, fov = 45, aspect = canvas.width / canvas.height, near = 1, far = 1000) {
            const f = 1 / Math.tan(fov * Math.PI / 360);
            const nf = 1 / (near - far);

            const z = v.z;
            if (z <= 0) return null;

            const scale = f / z;
            const x = canvas.width / 2 + v.x * scale;
            const y = canvas.height / 2 - v.y * scale;

            return { x, y, z };
        }

        function interpolateColor(c0, c1, c2, w0, w1, w2) {
            const sum = w0 + w1 + w2;
            const r = Math.round((c0.r * w0 + c1.r * w1 + c2.r * w2) / sum);
            const g = Math.round((c0.g * w0 + c1.g * w1 + c2.g * w2) / sum);
            const b = Math.round((c0.b * w0 + c1.b * w1 + c2.b * w2) / sum);
            return { r: Math.max(0, Math.min(255, r)), g: Math.max(0, Math.min(255, g)), b: Math.max(0, Math.min(255, b)) };
        }

        function getLightColor(intensity) {
            const ambient = 0.3;
            const light = ambient + intensity * (1 - ambient);
            const r = Math.round(100 * light);
            const g = Math.round(200 * light);
            const b = Math.round(100 * light);
            return { r, g, b };
        }

        function rasterizeTriangle(p0, p1, p2, c0, c1, c2, wireframe = false) {
            const minX = Math.max(0, Math.floor(Math.min(p0.x, p1.x, p2.x)));
            const maxX = Math.min(canvas.width - 1, Math.ceil(Math.max(p0.x, p1.x, p2.x)));
            const minY = Math.max(0, Math.floor(Math.min(p0.y, p1.y, p2.y)));
            const maxY = Math.min(canvas.height - 1, Math.ceil(Math.max(p0.y, p1.y, p2.y)));

            const area = (p1.x - p0.x) * (p2.y - p0.y) - (p2.x - p0.x) * (p1.y - p0.y);
            if (Math.abs(area) < 0.01) return;

            const imageData = ctx.createImageData(maxX - minX + 1, maxY - minY + 1);
            const data = imageData.data;
            let pixelIndex = 0;

            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const w0 = ((p1.x - p2.x) * (y - p2.y) - (p1.y - p2.y) * (x - p2.x)) / area;
                    const w1 = ((p2.x - p0.x) * (y - p0.y) - (p2.y - p0.y) * (x - p0.x)) / area;
                    const w2 = 1 - w0 - w1;

                    if (w0 >= -0.01 && w1 >= -0.01 && w2 >= -0.01) {
                        const color = interpolateColor(c0, c1, c2, w0, w1, w2);
                        data[pixelIndex] = color.r;
                        data[pixelIndex + 1] = color.g;
                        data[pixelIndex + 2] = color.b;
                        data[pixelIndex + 3] = 255;
                    }
                    pixelIndex += 4;
                }
            }

            ctx.putImageData(imageData, minX, minY);

            if (wireframe) {
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.closePath();
                ctx.stroke();
            }
        }

        // ==================== Animation Loop ====================
        const cube = new Cube();
        let time = 0;
        let paused = false;
        let wireframe = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let fps = 0;

        function animate() {
            if (!paused) {
                time += 0.01;
                const angleX = time * 0.5;
                const angleY = time * 0.7;
                const angleZ = time * 0.3;
                cube.update(angleX, angleY, angleZ);
            }

            const lightX = Math.cos(time * 0.5) * 300;
            const lightY = Math.sin(time * 0.3) * 200 + 100;
            const lightZ = 300;
            const lightPos = new Vec3(lightX, lightY, lightZ);

            cube.computeLighting(lightPos);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const facesToRender = cube.getFacesToRender();
            for (const face of facesToRender) {
                const p0 = perspectiveProject(face.v0);
                const p1 = perspectiveProject(face.v1);
                const p2 = perspectiveProject(face.v2);

                if (p0 && p1 && p2) {
                    const c0 = getLightColor(cube.vertexLights[face.vertices[0]]);
                    const c1 = getLightColor(cube.vertexLights[face.vertices[1]]);
                    const c2 = getLightColor(cube.vertexLights[face.vertices[2]]);

                    rasterizeTriangle(p0, p1, p2, c0, c1, c2, wireframe);
                }
            }

            // Draw light source
            const lightProj = perspectiveProject(lightPos);
            if (lightProj) {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(lightProj.x, lightProj.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Update FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsTime = now;
                document.getElementById('fps').textContent = fps;
            }

            requestAnimationFrame(animate);
        }

        // ==================== Input Handling ====================
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') {
                wireframe = !wireframe;
                document.getElementById('wireframeStatus').textContent = wireframe ? 'ON' : 'OFF';
            }
            if (e.key.toLowerCase() === 'p') {
                paused = !paused;
                document.getElementById('pauseStatus').textContent = paused ? 'YES' : 'NO';
            }
        });

        animate();
    </script>
</body>
</html>
