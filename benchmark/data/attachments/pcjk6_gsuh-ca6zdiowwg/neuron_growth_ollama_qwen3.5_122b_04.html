<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }

        canvas {
            display: block;
            background-color: #05070f;
            border: 1px solid #101a3a;
        }

        .gui-folder {
            border: 1px solid #101a3a !important;
            background: rgba(5, 7, 15, 0.9) !important;
        }

        .gui-control-container {
            background: rgba(16, 26, 58, 0.5) !important;
        }

        .gui-button {
            background: #101a3a !important;
            color: #00e5ff !important;
            border: 1px solid #00e5ff !important;
            margin-top: 5px;
        }

        .gui-button:hover {
            background: #00e5ff !important;
            color: #05070f !important;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="neuronCanvas" width="800" height="800"></canvas>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION & STATE
        // ==========================================
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 800;
        const HEIGHT = 800;

        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 6,
            branchSplitChance: 0.15,
            branchCurvature: 0.3,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.02,
            pulseBrightness: 1.5,
            
            // Visuals
            bgColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            showScanlines: true
        };

        let neurons = [];
        let synapses = [];
        let pulses = [];
        let animationId = null;
        let isPaused = false;
        let growthComplete = false;

        // ==========================================
        // CLASSES
        // ==========================================
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.branches = [];
                this.id = Math.random().toString(36).substr(2, 9);
                this.growthProgress = 0;
                this.maxGrowthProgress = 100;
            }

            grow() {
                if (this.growthProgress < this.maxGrowthProgress) {
                    this.growthProgress += 1;
                    this.updateBranches();
                }
            }

            updateBranches() {
                // Initialize root branch if empty
                if (this.branches.length === 0) {
                    this.branches.push({
                        x: this.x,
                        y: this.y,
                        angle: Math.random() * Math.PI * 2,
                        length: 0,
                        maxLen: config.maxBranchLength * (0.5 + Math.random() * 0.5),
                        depth: 0,
                        children: [],
                        thickness: 2 + Math.random(),
                        color: Math.random() > 0.8 ? config.accentBranchColor : config.branchColor
                    });
                }

                // Process active branches
                const activeBranches = [];
                for (let i = 0; i < this.branches.length; i++) {
                    const branch = this.branches[i];
                    if (branch.length < branch.maxLen) {
                        // Grow branch
                        branch.length += config.branchGrowthSpeed;
                        
                        // Update angle with curvature
                        branch.angle += (Math.random() - 0.5) * config.branchCurvature;
                        
                        // Calculate new tip position
                        const dx = Math.cos(branch.angle) * config.branchGrowthSpeed;
                        const dy = Math.sin(branch.angle) * config.branchGrowthSpeed;
                        
                        // Store path points for rendering
                        if (!branch.path) branch.path = [];
                        branch.path.push({
                            x: branch.x + dx,
                            y: branch.y + dy
                        });
                        
                        // Update tip position
                        branch.x += dx;
                        branch.y += dy;
                        
                        activeBranches.push(branch);
                    }
                }

                // Attempt splits
                for (const branch of activeBranches) {
                    if (branch.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                        const newBranch = {
                            x: branch.x,
                            y: branch.y,
                            angle: branch.angle + (Math.random() - 0.5) * 1.5,
                            length: 0,
                            maxLen: branch.maxLen * 0.7,
                            depth: branch.depth + 1,
                            children: [],
                            thickness: Math.max(0.5, branch.thickness * 0.7),
                            color: Math.random() > 0.8 ? config.accentBranchColor : config.branchColor
                        };
                        this.branches.push(newBranch);
                    }
                }
            }

            getTips() {
                return this.branches.filter(b => b.length >= b.maxLen);
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.glow = 0;
                this.maxGlow = 1;
                this.pulseTimer = 0;
            }

            update() {
                this.pulseTimer += config.pulseFrequency;
                if (this.pulseTimer >= 1) {
                    this.pulseTimer = 0;
                    // Trigger pulse
                    pulses.push({
                        synapse: this,
                        progress: 0,
                        direction: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }
        }

        // ==========================================
        // SIMULATION LOGIC
        // ==========================================
        function initSimulation() {
            neurons = [];
            synapses = [];
            pulses = [];
            growthComplete = false;

            // Generate seed neurons near center
            const centerX = WIDTH / 2;
            const centerY = HEIGHT / 2;
            const count = Math.floor(config.neuronCount * (0.8 + Math.random() * 0.4));

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                neurons.push(new Neuron(x, y));
            }
        }

        function checkSynapses() {
            const tips = [];
            for (const neuron of neurons) {
                for (const branch of neuron.getTips()) {
                    tips.push({ x: branch.x, y: branch.y, branch });
                }
            }

            for (let i = 0; i < tips.length; i++) {
                for (let j = i + 1; j < tips.length; j++) {
                    const t1 = tips[i];
                    const t2 = tips[j];
                    const dx = t1.x - t2.x;
                    const dy = t1.y - t2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < config.synapseDistanceThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.branch1 === t1.branch && s.branch2 === t2.branch) ||
                            (s.branch1 === t2.branch && s.branch2 === t1.branch)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(t1.branch, t2.branch));
                        }
                    }
                }
            }
        }

        function updatePulses() {
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.progress += config.pulseSpeed / 100;
                
                if (p.progress >= 1) {
                    pulses.splice(i, 1);
                }
            }
        }

        // ==========================================
        // RENDERING
        // ==========================================
        function drawBackground() {
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw subtle grid
            if (config.showScanlines) {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                
                for (let x = 0; x < WIDTH; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, HEIGHT);
                    ctx.stroke();
                }
                
                for (let y = 0; y < HEIGHT; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(WIDTH, y);
                    ctx.stroke();
                }
            }

            // Vignette
            const gradient = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, 0, WIDTH/2, HEIGHT/2, WIDTH/2);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        function drawBranches() {
            for (const neuron of neurons) {
                for (const branch of neuron.branches) {
                    if (!branch.path || branch.path.length < 2) continue;

                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = branch.color;
                    ctx.strokeStyle = branch.color;
                    ctx.lineWidth = branch.thickness;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    ctx.beginPath();
                    ctx.moveTo(branch.path[0].x, branch.path[0].y);
                    
                    for (let i = 1; i < branch.path.length; i++) {
                        const p = branch.path[i];
                        ctx.lineTo(p.x, p.y);
                    }
                    
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        function drawSynapses() {
            for (const synapse of synapses) {
                const b1 = synapse.branch1;
                const b2 = synapse.branch2;
                
                ctx.save();
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.shadowColor = config.synapseColor;
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.6;

                ctx.beginPath();
                ctx.moveTo(b1.x, b1.y);
                ctx.lineTo(b2.x, b2.y);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawPulses() {
            for (const p of pulses) {
                const syn = p.synapse;
                const b1 = syn.branch1;
                const b2 = syn.branch2;
                
                const x = b1.x + (b2.x - b1.x) * p.progress;
                const y = b1.y + (b2.y - b1.y) * p.progress;
                
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = config.pulseColor;
                ctx.fillStyle = config.pulseColor;
                ctx.globalAlpha = config.pulseBrightness;
                
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function draw() {
            drawBackground();
            drawBranches();
            drawSynapses();
            drawPulses();
        }

        function animate() {
            if (!isPaused) {
                // Growth phase
                if (!growthComplete) {
                    let allGrown = true;
                    for (const neuron of neurons) {
                        if (neuron.growthProgress < neuron.maxGrowthProgress) {
                            neuron.grow();
                            allGrown = false;
                        }
                    }
                    
                    if (allGrown) {
                        growthComplete = true;
                    }
                    
                    checkSynapses();
                } else {
                    // Continuous animation phase
                    for (const synapse of synapses) {
                        synapse.update();
                    }
                    updatePulses();
                }
            }
            
            draw();
            animationId = requestAnimationFrame(animate);
        }

        // ==========================================
        // GUI SETUP
        // ==========================================
        function setupGUI() {
            const gui = new dat.GUI({ width: 300 });
            
            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 3, 6, 1).name('Neuron Count').onChange(initSimulation);
            growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
            growthFolder.add(config, 'maxBranchDepth', 1, 10, 1).name('Max Depth');
            growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
            growthFolder.add(config, 'branchCurvature', 0, 1).name('Curvature');
            growthFolder.add(config, 'maxBranchLength', 50, 200).name('Max Length');
            growthFolder.open();

            // Synapses folder
            const synapseFolder = gui.addFolder('Synapses');
            synapseFolder.add(config, 'synapseDistanceThreshold', 10, 100).name('Distance Threshold');
            synapseFolder.add(config, 'synapseGlowStrength', 0, 30).name('Glow Strength');
            synapseFolder.open();

            // Pulses folder
            const pulseFolder = gui.addFolder('Pulses');
            pulseFolder.add(config, 'pulseSpeed', 1, 10).name('Pulse Speed');
            pulseFolder.add(config, 'pulseFrequency', 0, 0.1).name('Pulse Frequency');
            pulseFolder.add(config, 'pulseBrightness', 0.5, 3).name('Pulse Brightness');
            pulseFolder.open();

            // Visuals folder
            const visualFolder = gui.addFolder('Visuals');
            visualFolder.addColor(config, 'bgColor').name('Background');
            visualFolder.addColor(config, 'branchColor').name('Branch Color');
            visualFolder.addColor(config, 'accentBranchColor').name('Accent Color');
            visualFolder.addColor(config, 'synapseColor').name('Synapse Color');
            visualFolder.addColor(config, 'pulseColor').name('Pulse Color');
            visualFolder.add(config, 'showScanlines').name('Show Scanlines');
            visualFolder.open();

            // Buttons
            const actionsFolder = gui.addFolder('Actions');
            actionsFolder.add({ regenerate: initSimulation }, 'regenerate').name('Regenerate Network');
            actionsFolder.add({ clear: () => { 
                neurons = []; 
                synapses = []; 
                pulses = []; 
                growthComplete = false; 
                drawBackground(); 
            }}, 'clear').name('Clear Canvas');
            actionsFolder.add({ togglePause: () => { isPaused = !isPaused; } }, 'togglePause').name('Pause/Resume');
            actionsFolder.open();
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        initSimulation();
        setupGUI();
        animate();

    </script>
</body>
</html>
