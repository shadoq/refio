<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neuron Growth Simulation</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:#05070f;box-shadow:0 0 80px #101a3a inset;image-rendering:pixelated}
  #gui{position:absolute;top:0;right:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="800"></canvas></div>
<div id="gui"></div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=800,H=800;

const params={
  neuronCount:4,
  branchGrowthSpeed:0.8,
  maxBranchDepth:6,
  branchSplitChance:0.35,
  branchCurvature:0.25,
  maxBranchLength:80,
  synapseDistanceThreshold:28,
  synapseGlowStrength:1.2,
  pulseSpeed:2.5,
  pulseFrequency:0.015,
  pulseBrightness:1.0,
  backgroundColor:'#05070f',
  branchColor:'#00e5ff',
  accentBranchColor:'#d6ff00',
  synapseColor:'#ff2bd6',
  pulseColor:'#fff36a',
  paused:false
};

let neurons=[],synapses=[],pulses=[],time=0,gridOffset=0;

function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.hypot(dx,dy)}

class Branch{
  constructor(x,y,angle,len,depth,parent=null){
    this.x=x;this.y=y;this.angle=angle;this.len=len;this.depth=depth;this.parent=parent;
    this.children=[];this.grown=0;this.thickness=Math.max(0.5,3/(depth+1)+Math.random()*0.8);
    this.curve=rand(-params.branchCurvature,params.branchCurvature);
    this.isAccent=Math.random()<0.25;
    this.endX=x+Math.cos(angle)*len;
    this.endY=y+Math.sin(angle)*len;
  }
  update(){
    if(this.grown<this.len){this.grown+=params.branchGrowthSpeed*2;}
    for(const c of this.children) c.update();
  }
  draw(){
    ctx.lineWidth=this.thickness;
    ctx.shadowBlur=12;
    ctx.strokeStyle=this.isAccent?params.accentBranchColor:params.branchColor;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    const cx=this.x+Math.cos(this.angle)*this.grown*0.5;
    const cy=this.y+Math.sin(this.angle)*this.grown*0.5+this.curve*20;
    const ex=this.x+Math.cos(this.angle)*this.grown;
    const ey=this.y+Math.sin(this.angle)*this.grown;
    ctx.quadraticCurveTo(cx,cy,ex,ey);
    ctx.stroke();
    for(const c of this.children) c.draw();
  }
  grow(){
    if(this.depth>=params.maxBranchDepth||this.grown>=this.len) return;
    if(this.grown>=this.len*0.9 && this.children.length===0){
      if(Math.random()<params.branchSplitChance){
        const n=1+Math.floor(Math.random()*2);
        for(let i=0;i<n;i++){
          const a=this.angle+rand(-0.8,0.8);
          const l=rand(this.len*0.5,this.len*0.9);
          const child=new Branch(this.endX,this.endY,a,l,this.depth+1,this);
          this.children.push(child);
        }
      }
    }
    for(const c of this.children) c.grow();
  }
  points(){const pts=[];pts.push({x:this.x,y:this.y});pts.push({x:this.endX,y:this.endY});for(const c of this.children) pts.push(...c.points());return pts;}
}

class Neuron{
  constructor(x,y){this.x=x;this.y=y;this.root=new Branch(x,y,rand(0,Math.PI*2),rand(40,params.maxBranchLength),0);}
  update(){this.root.update();this.root.grow();}
  draw(){this.root.draw();}
  allPoints(){return this.root.points();}
}

function createNetwork(){
  neurons=[];synapses=[];pulses=[];
  for(let i=0;i<params.neuronCount;i++){
    const a=rand(-120,120),b=rand(-120,120);
    neurons.push(new Neuron(W/2+a,H/2+b));
  }
}

function detectSynapses(){
  synapses=[];
  const all=[];
  neurons.forEach((n,i)=>{n.allPoints().forEach(p=>all.push({p,i}))});
  for(let i=0;i<all.length;i++){
    for(let j=i+1;j<all.length;j++){
      if(all[i].i===all[j].i) continue;
      if(dist(all[i].p,all[j].p)<params.synapseDistanceThreshold){
        synapses.push({x:(all[i].p.x+all[j].p.x)/2,y:(all[i].p.y+all[j].p.y)/2});
      }
    }
  }
}

function spawnPulse(){
  if(Math.random()<params.pulseFrequency){
    const n=neurons[Math.floor(Math.random()*neurons.length)];
    pulses.push({x:n.x,y:n.y,r:0,life:1});
  }
}

function updatePulses(){
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];
    p.r+=params.pulseSpeed;
    p.life-=0.02;
    if(p.life<=0) pulses.splice(i,1);
  }
}

function drawBackground(){
  ctx.fillStyle=params.backgroundColor;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,229,255,0.08)';
  ctx.lineWidth=1;
  gridOffset=(gridOffset+0.2)%40;
  for(let x=-40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x+gridOffset,0);ctx.lineTo(x+gridOffset,H);ctx.stroke();}
  for(let y=-40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y+gridOffset);ctx.lineTo(W,y+gridOffset);ctx.stroke();}
}

function render(){
  drawBackground();
  neurons.forEach(n=>n.draw());
  ctx.shadowBlur=20*params.synapseGlowStrength;
  ctx.fillStyle=params.synapseColor;
  synapses.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();});
  ctx.shadowBlur=0;
  ctx.shadowColor=params.pulseColor;
  ctx.shadowBlur=25*params.pulseBrightness;
  pulses.forEach(p=>{ctx.strokeStyle=params.pulseColor;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();});
  ctx.shadowBlur=0;
  const grad=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.7);
  grad.addColorStop(0,'rgba(5,7,15,0)');
  grad.addColorStop(1,'rgba(5,7,15,0.8)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function loop(){
  time+=0.016;
  if(!params.paused){
    neurons.forEach(n=>n.update());
    detectSynapses();
    spawnPulse();
    updatePulses();
  }
  render();
  requestAnimationFrame(loop);
}

function setupGUI(){
  const gui=new dat.GUI({autoPlace:false});
  document.getElementById('gui').appendChild(gui.domElement);
  const growth=gui.addFolder('Growth');
  growth.add(params,'neuronCount',1,6,1).onChange(createNetwork);
  growth.add(params,'branchGrowthSpeed',0.1,3,0.1);
  growth.add(params,'maxBranchDepth',2,10,1);
  growth.add(params,'branchSplitChance',0,1,0.01);
  growth.add(params,'branchCurvature',0,0.8,0.01);
  growth.add(params,'maxBranchLength',20,150,1);
  growth.open();
  const syn=gui.addFolder('Synapses');
  syn.add(params,'synapseDistanceThreshold',10,60,1);
  syn.add(params,'synapseGlowStrength',0,3,0.1);
  syn.open();
  const pul=gui.addFolder('Pulses');
  pul.add(params,'pulseSpeed',0.5,6,0.1);
  pul.add(params,'pulseFrequency',0,0.1,0.001);
  pul.add(params,'pulseBrightness',0,2,0.05);
  pul.open();
  const vis=gui.addFolder('Visuals');
  vis.addColor(params,'backgroundColor');
  vis.addColor(params,'branchColor');
  vis.addColor(params,'accentBranchColor');
  vis.addColor(params,'synapseColor');
  vis.addColor(params,'pulseColor');
  vis.open();
  gui.add({regenerate:()=>createNetwork()},'regenerate').name('regenerate network');
  gui.add({clear:()=>{neurons=[];synapses=[];pulses=[];}},'clear').name('clear canvas');
  gui.add(params,'paused').name('pause/resume animation');
}

createNetwork();
setupGUI();
loop();
</script>
</body>
</html>
