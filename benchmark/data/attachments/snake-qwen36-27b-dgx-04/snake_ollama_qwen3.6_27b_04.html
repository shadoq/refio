<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #444;
        }

        canvas {
            display: block;
            background-color: #111;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #4CAF50;
            text-shadow: 2px 2px 4px #000;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ff5252;
        }

        .menu-btn {
            background-color: #444;
            color: white;
            border: 2px solid #666;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 250px;
            text-align: center;
        }

        .menu-btn:hover {
            background-color: #666;
            border-color: #888;
            transform: scale(1.05);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
            background-color: #333;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .p1-score { color: #4CAF50; }
        .p2-score { color: #2196F3; }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }

        .winner-text {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board" class="score-board hidden">
            <div class="p1-score">P1 (Green): <span id="score1">0</span></div>
            <div class="p2-score">P2 (Blue): <span id="score2">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Start Menu -->
        <div id="start-menu" class="overlay">
            <h1>SNAKE BATTLE</h1>
            <p>Select Game Mode:</p>
            <button class="menu-btn" onclick="startGame('human')">Human vs Human</button>
            <button class="menu-btn" onclick="startGame('cpu-human')">CPU vs Human</button>
            <button class="menu-btn" onclick="startGame('cpu')">CPU vs CPU</button>
            <div class="controls-hint">
                P1: WASD | P2: Arrow Keys<br>
                Restart: Enter
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="overlay hidden">
            <h2>GAME OVER</h2>
            <div id="winner-display" class="winner-text"></div>
            <div id="final-scores"></div>
            <p>Press <strong>Enter</strong> to Restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game Constants
        const GRID_SIZE = 30;
        const TILE_COUNT = 20; // 600px / 30px = 20 tiles per side
        const GAME_SPEED = 100; // ms per frame

        // Game State
        let gameInterval;
        let isGameRunning = false;
        let currentMode = '';
        
        // Entities
        let snake1, snake2, food;

        // Input State
        const keys = {};

        // Initialization
        function init() {
            document.addEventListener('keydown', handleKeyPress);
            document.addEventListener('keyup', handleKeyUp);
        }

        function startGame(mode) {
            currentMode = mode;
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('score-board').classList.remove('hidden');
            
            resetGame();
            isGameRunning = true;
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function resetGame() {
            // Snake 1 (Green) - Starts Left
            snake1 = {
                body: [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}],
                dir: {x: 1, y: 0},
                nextDir: {x: 1, y: 0},
                color: '#4CAF50',
                score: 0,
                dead: false
            };

            // Snake 2 (Blue) - Starts Right
            snake2 = {
                body: [{x: 14, y: 10}, {x: 15, y: 10}, {x: 16, y: 10}],
                dir: {x: -1, y: 0},
                nextDir: {x: -1, y: 0},
                color: '#2196F3',
                score: 0,
                dead: false
            };

            spawnFood();
            updateScoreDisplay();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                
                valid = true;
                // Check collision with snake1
                for (let part of snake1.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
                // Check collision with snake2
                for (let part of snake2.body) {
                    if (part.x === food.x && part.y === food.y) valid = false;
                }
            }
        }

        function handleKeyPress(e) {
            keys[e.key] = true;

            if (e.key === 'Enter' && !isGameRunning) {
                startGame(currentMode);
                return;
            }

            if (!isGameRunning) return;

            // Human Controls for Snake 1 (WASD)
            if (currentMode === 'human' || currentMode === 'cpu-human') {
                if (e.key === 'w' && snake1.dir.y === 0) snake1.nextDir = {x: 0, y: -1};
                if (e.key === 's' && snake1.dir.y === 0) snake1.nextDir = {x: 0, y: 1};
                if (e.key === 'a' && snake1.dir.x === 0) snake1.nextDir = {x: -1, y: 0};
                if (e.key === 'd' && snake1.dir.x === 0) snake1.nextDir = {x: 1, y: 0};
            }

            // Human Controls for Snake 2 (Arrows)
            if (currentMode === 'human') {
                if (e.key === 'ArrowUp' && snake2.dir.y === 0) snake2.nextDir = {x: 0, y: -1};
                if (e.key === 'ArrowDown' && snake2.dir.y === 0) snake2.nextDir = {x: 0, y: 1};
                if (e.key === 'ArrowLeft' && snake2.dir.x === 0) snake2.nextDir = {x: -1, y: 0};
                if (e.key === 'ArrowRight' && snake2.dir.x === 0) snake2.nextDir = {x: 1, y: 0};
            }
        }

        function handleKeyUp(e) {
            keys[e.key] = false;
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // CPU Logic
            if (currentMode === 'cpu' || currentMode === 'cpu-human') {
                cpuMove(snake1);
            }
            if (currentMode === 'cpu') {
                cpuMove(snake2);
            }

            // Update Directions
            snake1.dir = snake1.nextDir;
            snake2.dir = snake2.nextDir;

            // Move Snakes
            moveSnake(snake1);
            moveSnake(snake2);

            // Check Collisions
            checkCollisions();

            // Draw
            draw();
        }

        function moveSnake(snake) {
            const head = {
                x: snake.body[0].x + snake.dir.x,
                y: snake.body[0].y + snake.dir.y
            };

            snake.body.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreDisplay();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollisions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];

            // Wall Collisions
            if (head1.x < 0 || head1.x >= TILE_COUNT || head1.y < 0 || head1.y >= TILE_COUNT) snake1.dead = true;
            if (head2.x < 0 || head2.x >= TILE_COUNT || head2.y < 0 || head2.y >= TILE_COUNT) snake2.dead = true;

            // Self Collisions
            for (let i = 1; i < snake1.body.length; i++) {
                if (head1.x === snake1.body[i].x && head1.y === snake1.body[i].y) snake1.dead = true;
            }
            for (let i = 1; i < snake2.body.length; i++) {
                if (head2.x === snake2.body[i].x && head2.y === snake2.body[i].y) snake2.dead = true;
            }

            // Head-to-Head Collision
            if (head1.x === head2.x && head1.y === head2.y) {
                snake1.dead = true;
                snake2.dead = true;
            }

            // Snake 1 hits Snake 2 body
            for (let part of snake2.body) {
                if (head1.x === part.x && head1.y === part.y) snake1.dead = true;
            }

            // Snake 2 hits Snake 1 body
            for (let part of snake1.body) {
                if (head2.x === part.x && head2.y === part.y) snake2.dead = true;
            }

            if (snake1.dead || snake2.dead) {
                endGame();
            }
        }

        function cpuMove(snake) {
            // Simple BFS Pathfinding to Food
            const start = snake.body[0];
            const path = bfs(start, food, snake);

            if (path.length > 0) {
                const nextStep = path[0];
                const dx = nextStep.x - start.x;
                const dy = nextStep.y - start.y;
                
                // Only change direction if it's valid (not reversing)
                if (dx !== -snake.dir.x || dy !== -snake.dir.y) {
                    snake.nextDir = {x: dx, y: dy};
                }
            } else {
                // Fallback: Try to survive by moving to any valid neighbor
                const neighbors = getNeighbors(start);
                let bestMove = null;
                
                for (let n of neighbors) {
                    if (isValidMove(n, snake)) {
                        bestMove = n;
                        break;
                    }
                }

                if (bestMove) {
                    const dx = bestMove.x - start.x;
                    const dy = bestMove.y - start.y;
                    snake.nextDir = {x: dx, y: dy};
                }
            }
        }

        function bfs(start, target, snake) {
            const queue = [[start]];
            const visited = new Set();
            visited.add(`${start.x},${start.y}`);

            while (queue.length > 0) {
                const path = queue.shift();
                const current = path[path.length - 1];

                if (current.x === target.x && current.y === target.y) {
                    return path.slice(1); // Return path excluding start
                }

                const neighbors = getNeighbors(current);
                for (let n of neighbors) {
                    const key = `${n.x},${n.y}`;
                    if (!visited.has(key) && isValidMove(n, snake)) {
                        visited.add(key);
                        queue.push([...path, n]);
                    }
                }
            }
            return [];
        }

        function getNeighbors(pos) {
            const dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];
            const neighbors = [];
            for (let d of dirs) {
                const nx = pos.x + d.x;
                const ny = pos.y + d.y;
                if (nx >= 0 && nx < TILE_COUNT && ny >= 0 && ny < TILE_COUNT) {
                    neighbors.push({x: nx, y: ny});
                }
            }
            return neighbors;
        }

        function isValidMove(pos, snake) {
            // Check walls
            if (pos.x < 0 || pos.x >= TILE_COUNT || pos.y < 0 || pos.y >= TILE_COUNT) return false;

            // Check self collision
            for (let part of snake.body) {
                if (pos.x === part.x && pos.y === part.y) return false;
            }

            // Check other snake collision
            const otherSnake = snake === snake1 ? snake2 : snake1;
            for (let part of otherSnake.body) {
                if (pos.x === part.x && pos.y === part.y) return false;
            }

            return true;
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE/2,
                food.y * GRID_SIZE + GRID_SIZE/2,
                GRID_SIZE/2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw Snake 1
            drawSnake(snake1);

            // Draw Snake 2
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            for (let i = 0; i < snake.body.length; i++) {
                const part = snake.body[i];
                // Head is slightly larger/different
                if (i === 0) {
                    ctx.fillStyle = lightenColor(snake.color, 20);
                } else {
                    ctx.fillStyle = snake.color;
                }
                
                ctx.fillRect(
                    part.x * GRID_SIZE + 1,
                    part.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            }
        }

        function lightenColor(color, percent) {
            // Simple hex color lightener
            const num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        function updateScoreDisplay() {
            document.getElementById('score1').innerText = snake1.score;
            document.getElementById('score2').innerText = snake2.score;
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(gameInterval);

            const gameOverScreen = document.getElementById('game-over');
            const winnerDisplay = document.getElementById('winner-display');
            const finalScores = document.getElementById('final-scores');

            let winnerText = '';
            let winnerColor = '';

            if (snake1.dead && snake2.dead) {
                winnerText = 'DRAW!';
                winnerColor = '#fff';
            } else if (snake1.dead) {
                winnerText = 'PLAYER 2 WINS!';
                winnerColor = snake2.color;
            } else {
                winnerText = 'PLAYER 1 WINS!';
                winnerColor = snake1.color;
            }

            winnerDisplay.innerText = winnerText;
            winnerDisplay.style.color = winnerColor;
            
            finalScores.innerHTML = `
                <p style="color:${snake1.color}">P1 Score: ${snake1.score}</p>
                <p style="color:${snake2.color}">P2 Score: ${snake2.score}</p>
            `;

            gameOverScreen.classList.remove('hidden');
        }

        // Start
        init();
    </script>
</body>
</html>
