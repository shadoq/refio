<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }

        #container {
            position: relative;
            width: 800px;
            height: 800px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.1);
        }

        canvas {
            display: block;
            background-color: #05070f;
            border-radius: 4px;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(5, 7, 15, 0.8) 100%);
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" width="800" height="800"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

    <script>
        // Configuration
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 1.5,
            maxBranchDepth: 6,
            branchSplitChance: 0.15,
            branchCurvature: 0.5,
            maxBranchLength: 120,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 4,
            pulseFrequency: 0.02,
            pulseBrightness: 1.0,
            
            // Visuals
            backgroundColor: '#05070f',
            branchColor: '#00e5ff',
            accentBranchColor: '#d6ff00',
            synapseColor: '#ff2bd6',
            pulseColor: '#fff36a',
            
            // Buttons
            regenerateNetwork: function() {
                init();
            },
            clearCanvas: function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                neurons = [];
                synapses = [];
                pulses = [];
                branches = [];
            },
            togglePause: function() {
                isPaused = !isPaused;
            }
        };

        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isPaused = false;

        // State
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let animationId;

        // Helper Functions
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomColor(baseColor, variation = 0.1) {
            // Simple color variation by adjusting brightness
            const hex = baseColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            
            const factor = 1 + (Math.random() * variation * 2 - variation);
            return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
        }

        // Classes
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = random(3, 6);
                this.color = config.branchColor;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Branch {
            constructor(startX, startY, angle, depth, parentBranch = null) {
                this.startX = startX;
                this.startY = startY;
                this.x = startX;
                this.y = startY;
                this.angle = angle;
                this.depth = depth;
                this.parentBranch = parentBranch;
                this.length = 0;
                this.maxLength = random(config.maxBranchLength * 0.5, config.maxBranchLength);
                this.growthSpeed = config.branchGrowthSpeed;
                this.active = true;
                this.finished = false;
                this.children = [];
                this.color = depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                this.width = Math.max(0.5, 2 - depth * 0.2);
                
                // For curve smoothing
                this.path = [{x: startX, y: startY}];
                this.curveControl = null;
            }

            update() {
                if (!this.active || this.finished) return;

                // Move forward
                const dx = Math.cos(this.angle) * this.growthSpeed;
                const dy = Math.sin(this.angle) * this.growthSpeed;
                
                this.x += dx;
                this.y += dy;
                this.length += this.growthSpeed;

                // Add point to path
                this.path.push({x: this.x, y: this.y});

                // Random angle variation
                this.angle += random(-0.1, 0.1) * config.branchCurvature;

                // Check if reached max length
                if (this.length >= this.maxLength) {
                    this.finished = true;
                    this.active = false;
                    return;
                }

                // Check for split
                if (Math.random() < config.branchSplitChance && this.depth < config.maxBranchDepth) {
                    const splitAngle = this.angle + random(-0.5, 0.5);
                    const childBranch = new Branch(this.x, this.y, splitAngle, this.depth + 1, this);
                    this.children.push(childBranch);
                    branches.push(childBranch);
                }
            }

            draw() {
                if (this.path.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(this.path[0].x, this.path[0].y);

                // Draw smooth curve through points
                for (let i = 1; i < this.path.length - 1; i++) {
                    const xc = (this.path[i].x + this.path[i + 1].x) / 2;
                    const yc = (this.path[i].y + this.path[i + 1].y) / 2;
                    ctx.quadraticCurveTo(this.path[i].x, this.path[i].y, xc, yc);
                }

                // Connect to last point
                const last = this.path[this.path.length - 1];
                ctx.lineTo(last.x, last.y);

                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Add glow
                ctx.shadowBlur = 5;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x1 = branch1.x;
                this.y1 = branch1.y;
                this.x2 = branch2.x;
                this.y2 = branch2.y;
                this.active = true;
                this.pulseTime = 0;
            }

            update() {
                // Update positions if branches are still growing
                if (this.branch1.active) {
                    this.x1 = this.branch1.x;
                    this.y1 = this.branch1.y;
                }
                if (this.branch2.active) {
                    this.x2 = this.branch2.x;
                    this.y2 = this.branch2.y;
                }

                // Random pulse generation
                if (Math.random() < config.pulseFrequency) {
                    this.triggerPulse();
                }
            }

            triggerPulse() {
                // Create pulse from branch1 to branch2
                pulses.push(new Pulse(this.x1, this.y1, this.x2, this.y2));
                // Occasionally create reverse pulse
                if (Math.random() > 0.5) {
                    pulses.push(new Pulse(this.x2, this.y2, this.x1, this.y1));
                }
            }

            draw() {
                // Draw connection line
                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.3;
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // Draw glowing endpoints
                const pulseFactor = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
                const glow = config.synapseGlowStrength * pulseFactor;
                
                ctx.beginPath();
                ctx.arc(this.x1, this.y1, 2, 0, Math.PI * 2);
                ctx.fillStyle = config.synapseColor;
                ctx.shadowBlur = glow;
                ctx.shadowColor = config.synapseColor;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x2, this.y2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Pulse {
            constructor(x1, y1, x2, y2) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
                this.progress = 0;
                this.speed = config.pulseSpeed / 100;
                this.active = true;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                }
            }

            draw() {
                const x = this.x1 + (this.x2 - this.x1) * this.progress;
                const y = this.y1 + (this.y2 - this.y1) * this.progress;

                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = config.pulseColor;
                ctx.globalAlpha = config.pulseBrightness;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.pulseColor;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        // Initialization
        function init() {
            // Clear existing
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Create seed neurons near center
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (Math.PI * 2 / config.neuronCount) * i;
                const radius = random(50, 100);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                const neuron = new Neuron(x, y);
                neurons.push(neuron);
                neuron.draw();
                
                // Start initial branches
                for (let j = 0; j < 3; j++) {
                    const branchAngle = angle + random(-0.5, 0.5);
                    const branch = new Branch(x, y, branchAngle, 0);
                    branches.push(branch);
                }
            }
        }

        // Check for synapses
        function checkSynapses() {
            // Only check active branch tips
            const activeBranches = branches.filter(b => b.active);
            
            for (let i = 0; i < activeBranches.length; i++) {
                for (let j = i + 1; j < activeBranches.length; j++) {
                    const b1 = activeBranches[i];
                    const b2 = activeBranches[j];
                    
                    // Don't connect parent-child branches
                    if (b1.parentBranch === b2 || b2.parentBranch === b1) continue;
                    
                    const dx = b1.x - b2.x;
                    const dy = b1.y - b2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < config.synapseDistanceThreshold) {
                        // Check if synapse already exists
                        const exists = synapses.some(s => 
                            (s.branch1 === b1 && s.branch2 === b2) ||
                            (s.branch1 === b2 && s.branch2 === b1)
                        );
                        
                        if (!exists) {
                            synapses.push(new Synapse(b1, b2));
                        }
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            if (!isPaused) {
                // Update branches
                branches.forEach(branch => branch.update());
                
                // Check for synapses
                checkSynapses();
                
                // Update synapses
                synapses.forEach(synapse => synapse.update());
                
                // Update pulses
                pulses.forEach(pulse => pulse.update());
                
                // Remove inactive pulses
                pulses = pulses.filter(p => p.active);
                
                // Redraw everything
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw neurons
                neurons.forEach(neuron => neuron.draw());
                
                // Draw branches
                branches.forEach(branch => branch.draw());
                
                // Draw synapses
                synapses.forEach(synapse => synapse.draw());
                
                // Draw pulses
                pulses.forEach(pulse => pulse.draw());
            }
            
            animationId = requestAnimationFrame(animate);
        }

        // Setup GUI
        const gui = new dat.GUI({ width: 300 });
        
        const growthFolder = gui.addFolder('Growth');
        growthFolder.add(config, 'neuronCount', 1, 10, 1).name('Neuron Count').onChange(init);
        growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5).name('Growth Speed');
        growthFolder.add(config, 'maxBranchDepth', 1, 10, 1).name('Max Depth').onChange(init);
        growthFolder.add(config, 'branchSplitChance', 0, 0.5).name('Split Chance');
        growthFolder.add(config, 'branchCurvature', 0, 1).name('Curvature');
        growthFolder.add(config, 'maxBranchLength', 50, 200).name('Max Length').onChange(init);
        
        const synapsesFolder = gui.addFolder('Synapses');
        synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 100).name('Distance Threshold');
        synapsesFolder.add(config, 'synapseGlowStrength', 0, 30).name('Glow Strength');
        
        const pulsesFolder = gui.addFolder('Pulses');
        pulsesFolder.add(config, 'pulseSpeed', 1, 10).name('Pulse Speed');
        pulsesFolder.add(config, 'pulseFrequency', 0, 0.1).name('Frequency');
        pulsesFolder.add(config, 'pulseBrightness', 0, 1).name('Brightness');
        
        const visualsFolder = gui.addFolder('Visuals');
        visualsFolder.addColor(config, 'backgroundColor').name('Background').onChange(() => {
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
        visualsFolder.addColor(config, 'branchColor').name('Branch Color');
        visualsFolder.addColor(config, 'accentBranchColor').name('Accent Color');
        visualsFolder.addColor(config, 'synapseColor').name('Synapse Color');
        visualsFolder.addColor(config, 'pulseColor').name('Pulse Color');
        
        const buttonsFolder = gui.addFolder('Controls');
        buttonsFolder.add(config, 'regenerateNetwork').name('Regenerate');
        buttonsFolder.add(config, 'clearCanvas').name('Clear');
        buttonsFolder.add(config, 'togglePause').name('Pause/Resume');
        
        // Open all folders
        growthFolder.open();
        synapsesFolder.open();
        pulsesFolder.open();
        visualsFolder.open();
        buttonsFolder.open();

        // Start
        init();
        animate();
    </script>
</body>
</html>
