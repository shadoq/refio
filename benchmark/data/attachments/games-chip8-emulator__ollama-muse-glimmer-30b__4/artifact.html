<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHIP-8 Emulator</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#0f1115;color:#e6e8ee;display:flex;flex-direction:column;align-items:center}
header{padding:12px 0;font-weight:600}
main{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
canvas{background:#000;border:4px solid #2a2f3a;image-rendering:pixelated;width:640px;height:320px}
.panel{background:#171b22;border:1px solid #2a2f3a;border-radius:8px;padding:12px;min-width:320px}
h2{margin:4px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#9aa4b2}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
button, input[type=file]{background:#232a36;color:#e6e8ee;border:1px solid #3a4352;border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#2c3442}
label{font-size:12px;color:#9aa4b2}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.key{aspect-ratio:1;background:#232a36;border:1px solid #3a4352;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:600;user-select:none}
.key.active{background:#4a7cff}
table{width:100%;border-collapse:collapse;font-family:monospace;font-size:12px}
td,th{padding:2px 4px;border-bottom:1px solid #222}
pre{background:#0b0e13;padding:6px;border-radius:4px;overflow:auto;font-size:11px}
</style>
</head>
<body>
<header>CHIP-8 Emulator</header>
<main>
<canvas id="screen" width="64" height="32"></canvas>
<div class="panel">
<h2>Controls</h2>
<div class="row">
<button id="run">Run</button>
<button id="pause">Pause</button>
<button id="step">Step</button>
<button id="reset">Reset</button>
<input type="file" id="load" accept=".ch8,.c8,.bin">
</div>
<div class="row">
<label>IPS: <input id="ips" type="range" min="1" max="1000" value="500"></label>
<span id="ipsVal">500</span>
</div>
<h2>Keypad</h2>
<div class="grid" id="keypad"></div>
<h2>Debugger</h2>
<table id="regs"></table>
<div class="row">
<label>I: <span id="regI"></span></label>
<label>PC: <span id="regPC"></span></label>
<label>DT: <span id="regDT"></span></label>
<label>ST: <span id="regST"></span></label>
</div>
<div class="row">
<label>Stack:</label><pre id="stack"></pre>
</div>
<div class="row">
<label>Instruction:</label><pre id="instr"></pre>
</div>
</div>
</main>
<script>
const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d');
const scale=10;
ctx.imageSmoothingEnabled=false;

const memory=new Uint8Array(4096);
const V=new Uint8Array(16);
const stack=new Uint16Array(16);
let sp=0, I=0, pc=0x200, dt=0, st=0;
let delayAcc=0, soundAcc=0;
let running=false, waitKey=-1;
let keys=new Set();
let drawFlag=false;

const font=[
0xF0,0x90,0x90,0x90,0xF0,
0x20,0x60,0x20,0x20,0x70,
0xF0,0x10,0xF0,0x80,0xF0,
0xF0,0x10,0xF0,0x10,0xF0,
0x90,0x90,0xF0,0x10,0x10,
0xF0,0x80,0xF0,0x10,0xF0,
0xF0,0x80,0xF0,0x90,0xF0,
0xF0,0x10,0x20,0x40,0x40,
0xF0,0x90,0xF0,0x90,0xF0,
0xF0,0x90,0xF0,0x10,0xF0,
0xF0,0x90,0xF0,0x90,0x90,
0xE0,0x90,0xE0,0x90,0xE0,
0xF0,0x80,0x80,0x80,0xF0,
0xE0,0x90,0x90,0x90,0xE0,
0xF0,0x80,0xF0,0x80,0xF0,
0xF0,0x80,0xF0,0x80,0x80
];
for(let i=0;i<font.length;i++) memory[0x50+i]=font[i];

const display=new Uint8Array(32*64);
function clearScreen(){display.fill(0);drawFlag=true;}
function drawSprite(x,y,n){
 let collision=false;
 for(let row=0;row<n;row++){
  const byte=memory[I+row];
  for(let bit=0;bit<8;bit++){
   if(byte&(0x80>>bit)){
    const px=(x+bit)&63;
    const py=(y+row)&31;
    const idx=py*64+px;
    if(display[idx]) collision=true;
    display[idx]^=1;
   }
  }
 }
 V[0xF]=collision?1:0;
 drawFlag=true;
}
function render(){
 if(!drawFlag) return;
 drawFlag=false;
 const img=ctx.createImageData(64,32);
 for(let y=0;y<32;y++){
  for(let x=0;x<64;x++){
   const v=display[y*64+x]?255:0;
   const i=(y*64+x)*4;
   img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;
  }
 }
 ctx.putImageData(img,0,0);
 const tmp=ctx.getImageData(0,0,64,32);
 ctx.putImageData(tmp,0,0);
}

const keyMap={
  '1':0x1,'2':0x2,'3':0x3,'4':0xC,
  'q':0x4,'w':0x5,'e':0x6,'r':0xD,
  'a':0x7,'s':0x8,'d':0x9,'f':0xE,
  'z':0xA,'x':0x0,'c':0xB,'v':0xF
};
const revMap={0:'x',1:'1',2:'2',3:'3',4:'q',5:'w',6:'e',7:'a',8:'s',9:'d',A:'z',B:'c',C:'4',D:'r',E:'f',F:'v'};
const keypadEl=document.getElementById('keypad');
for(let i=0;i<16;i++){
 const k=document.createElement('div');
 k.className='key';
 k.textContent=''+i.toString(16).toUpperCase();
 k.dataset.key=i;
 keypadEl.appendChild(k);
}
function updateKeypad(){
 [...keypadEl.children].forEach((el,i)=>el.classList.toggle('active',keys.has(i)));
}

document.addEventListener('keydown',e=>{
 const k=keyMap[e.key];
 if(k!==undefined){keys.add(k);updateKeypad();}
});
document.addEventListener('keyup',e=>{
 const k=keyMap[e.key];
 if(k!==undefined){keys.delete(k);updateKeypad();}
});

function loadROM(bytes){
 memory.fill(0);
 for(let i=0;i<font.length;i++) memory[0x50+i]=font[i];
 for(let i=0;i<bytes.length && 0x200+i<4096;i++) memory[0x200+i]=bytes[i];
 pc=0x200; sp=0; I=0; dt=0; st=0; V.fill(0); clearScreen();
}

const demoROM=new Uint8Array([
0x60,0x00,0x61,0x00,0xD0,0x15,0x12,0x0A,0x73,0x01,0x12,0x06
]);
loadROM(demoROM);

function step(){
 const opcode=memory[pc]<<8|memory[pc+1];
 const n1=(opcode&0xF000)>>12, n2=(opcode&0x0F00)>>8, n3=opcode&0x00FF;
 const n4=opcode&0x000F;
 let decoded='';
 switch(n1){
  case 0x0:
   if(opcode===0x00E0){clearScreen();decoded='CLS';}
   else if(opcode===0x00EE){pc=stack[--sp];decoded='RET';}
   break;
  case 0x1: pc=opcode&0x0FFF; decoded=`JP ${pc.toString(16)}`; return;
  case 0x2: stack[sp++]=pc+2; pc=opcode&0x0FFF; decoded=`CALL ${pc.toString(16)}`; return;
  case 0x3: if(V[n2]===n3){pc+=2;} decoded=`SE V${n2.toString(16)}, ${n3.toString(16)}`; break;
  case 0x4: if(V[n2]!==n3){pc+=2;} decoded=`SNE V${n2.toString(16)}, ${n3.toString(16)}`; break;
  case 0x5: if(n4===0 && V[n2]===V[n3]){pc+=2;} decoded=`SE V${n2.toString(16)}, V${n3.toString(16)}`; break;
  case 0x6: V[n2]=n3; decoded=`LD V${n2.toString(16)}, ${n3.toString(16)}`; break;
  case 0x7: V[n2]=(V[n2]+n3)&0xFF; decoded=`ADD V${n2.toString(16)}, ${n3.toString(16)}`; break;
  case 0x8:
   switch(n4){
    case 0x0:V[n2]=V[n3];decoded=`LD V${n2.toString(16)}, V${n3.toString(16)}`;break;
    case 0x1:V[n2]|=V[n3];decoded=`OR V${n2.toString(16)}, V${n3.toString(16)}`;break;
    case 0x2:V[n2]&=V[n3];decoded=`AND V${n2.toString(16)}, V${n3.toString(16)}`;break;
    case 0x3:V[n2]^=V[n3];decoded=`XOR V${n2.toString(16)}, V${n3.toString(16)}`;break;
    case 0x4:{const sum=V[n2]+V[n3];V[0xF]=sum>255?1:0;V[n2]=sum&0xFF;decoded=`ADD V${n2.toString(16)}, V${n3.toString(16)}`;break;}
    case 0x5:{V[0xF]=V[n2]>=V[n3]?1:0;V[n2]=(V[n2]-V[n3])&0xFF;decoded=`SUB V${n2.toString(16)}, V${n3.toString(16)}`;break;}
    case 0x6:{V[0xF]=V[n2]&1;V[n2]>>=1;decoded=`SHR V${n2.toString(16)}`;break;}
    case 0x7:{V[0xF]=V[n3]>=V[n2]?1:0;V[n2]=(V[n3]-V[n2])&0xFF;decoded=`SUBN V${n2.toString(16)}, V${n3.toString(16)}`;break;}
    case 0xE:{V[0xF]=(V[n2]&0x80)?1:0;V[n2]=(V[n2]<<1)&0xFF;decoded=`SHL V${n2.toString(16)}`;break;}
   }
   break;
  case 0x9: if(V[n2]!==V[n3]){pc+=2;} decoded=`SNE V${n2.toString(16)}, V${n3.toString(16)}`; break;
  case 0xA: I=opcode&0x0FFF; decoded=`LD I, ${I.toString(16)}`; break;
  case 0xB: pc=(opcode&0x0FFF)+V[0]; decoded=`JP V0, ${pc.toString(16)}`; return;
  case 0xC: V[n2]=Math.floor(Math.random()*256)&n3; decoded=`RND V${n2.toString(16)}, ${n3.toString(16)}`; break;
  case 0xD: drawSprite(V[n2],V[n3],n4); decoded=`DRW V${n2.toString(16)}, V${n3.toString(16)}, ${n4}`; break;
  case 0xE:
   if(n3===0x9E){if(keys.has(V[n2])){pc+=2;} decoded=`SKP V${n2.toString(16)}`;}
   else if(n3===0xA1){if(!keys.has(V[n2])){pc+=2;} decoded=`SKNP V${n2.toString(16)}`;}
   break;
  case 0xF:
   switch(n3){
    case 0x07:V[n2]=dt;decoded=`LD V${n2.toString(16)}, DT`;break;
    case 0x0A:{if(waitKey===-1){waitKey=n2;}else{V[n2]=waitKey;waitKey=-1;pc-=2;}decoded=`LD V${n2.toString(16)}, K`;break;}
    case 0x15:dt=V[n2];decoded=`LD DT, V${n2.toString(16)}`;break;
    case 0x18:st=V[n2];decoded=`LD ST, V${n2.toString(16)}`;break;
    case 0x1E:I=(I+V[n2])&0xFFF;decoded=`ADD I, V${n2.toString(16)}`;break;
    case 0x29:I=0x50+V[n2]*5;decoded=`LD F, V${n2.toString(16)}`;break;
    case 0x33:{const v=V[n2];memory[I]=Math.floor(v/100);memory[I+1]=Math.floor(v/10)%10;memory[I+2]=v%10;decoded=`LD B, V${n2.toString(16)}`;break;}
    case 0x55:{for(let i=0;i<=n2;i++) memory[I+i]=V[i];decoded=`LD [I], V${n2.toString(16)}`;break;}
    case 0x65:{for(let i=0;i<=n2;i++) V[i]=memory[I+i];decoded=`LD V${n2.toString(16)}, [I]`;break;}
   }
   break;
 }
 pc+=2;
 document.getElementById('instr').textContent=decoded+'  '+opcode.toString(16).padStart(4,'0');
}

let last=performance.now();
function loop(now){
 const dtMs=now-last; last=now;
 const ips=parseInt(document.getElementById('ips').value);
 const steps=Math.floor((dtMs/1000)*ips);
 for(let i=0;i<steps && running;i++) step();
 if(dt>0){delayAcc+=dtMs; if(delayAcc>=1000/60){dt--;delayAcc-=1000/60;}}
 if(st>0){soundAcc+=dtMs; if(soundAcc>=1000/60){st--;soundAcc-=1000/60;}}
 render();
 updateRegs();
 requestAnimationFrame(loop);
}
function updateRegs(){
 const rows=[];
 for(let i=0;i<16;i+=4){
  let r=`V${i.toString(16).toUpperCase()} ${V[i].toString(16).padStart(2,'0')} `;
  for(let j=1;j<4;j++){r+=`V${(i+j).toString(16).toUpperCase()} ${V[i+j].toString(16).padStart(2,'0')} `;}
  rows.push(r);
 }
 document.getElementById('regs').innerHTML='<tr><td colspan="4">'+rows.join('</td></tr><tr><td colspan="4">')+'</td></tr>';
 document.getElementById('regI').textContent='0x'+I.toString(16).padStart(3,'0');
 document.getElementById('regPC').textContent='0x'+pc.toString(16).padStart(3,'0');
 document.getElementById('regDT').textContent=dt;
 document.getElementById('regST').textContent=st;
 document.getElementById('stack').textContent=Array.from(stack.slice(0,sp)).map(v=>'0x'+v.toString(16)).join('\n');
}
document.getElementById('run').onclick=()=>running=true;
document.getElementById('pause').onclick=()=>running=false;
document.getElementById('step').onclick=()=>{running=false;step();render();updateRegs();};
document.getElementById('reset').onclick=()=>{loadROM(demoROM);};
document.getElementById('ips').oninput=e=>document.getElementById('ipsVal').textContent=e.target.value;
document.getElementById('load').onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=ev=>{loadROM(new Uint8Array(ev.target.result));};
 r.readAsArrayBuffer(f);
};
requestAnimationFrame(loop);
</script>
</body>
</html>
