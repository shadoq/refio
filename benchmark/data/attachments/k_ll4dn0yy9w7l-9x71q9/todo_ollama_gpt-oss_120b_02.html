<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
}
#todo-app {
  max-width: 500px;
  margin: auto;
}
input[type="text"] {
  width: 70%;
  padding: 8px;
  box-sizing: border-box;
}
button {
  padding: 8px 12px;
}
ul {
  list-style: none;
  padding: 0;
  margin-top: 10px;
}
li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid #ddd;
}
li.completed label {
  text-decoration: line-through;
  color: #777;
}
.filter {
  margin-top: 10px;
}
.filter a {
  margin-right: 10px;
  cursor: pointer;
  text-decoration: none;
  color: #00f;
}
.filter a.active {
  font-weight: bold;
  text-decoration: underline;
}
.delete-btn {
  background: none;
  border: none;
  color: red;
  cursor: pointer;
  font-size: 1.2em;
}
</style>
</head>
<body>
<div id="todo-app">
  <h2>Todo List</h2>
  <div>
    <input type="text" id="new-todo" placeholder="What needs to be done?">
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
  <div class="filter">
    <a href="#" data-filter="all" class="active">All</a>
    <a href="#" data-filter="active">Active</a>
    <a href="#" data-filter="completed">Completed</a>
  </div>
</div>

<script>
const STORAGE_KEY = 'todos-ollama-gpt-oss-120b-02';
let todos = [];
let currentFilter = 'all';

function saveTodos() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function loadTodos() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try {
      todos = JSON.parse(data);
    } catch (e) {
      todos = [];
    }
  }
}

function render() {
  const list = document.getElementById('todo-list');
  list.innerHTML = '';

  todos.forEach((todo, i) => {
    const show = currentFilter === 'all' ||
                 (currentFilter === 'active' && !todo.completed) ||
                 (currentFilter === 'completed' && todo.completed);
    if (!show) return;

    const li = document.createElement('li');
    li.className = todo.completed ? 'completed' : '';

    const leftDiv = document.createElement('div');
    leftDiv.style.display = 'flex';
    leftDiv.style.alignItems = 'center';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.completed;
    checkbox.addEventListener('change', () => {
      todo.completed = checkbox.checked;
      saveTodos();
      render();
    });

    const label = document.createElement('label');
    label.textContent = todo.text;
    label.style.marginLeft = '8px';

    leftDiv.appendChild(checkbox);
    leftDiv.appendChild(label);

    const deleteBtn = document.createElement('button');
    deleteBtn.innerHTML = '&times;';
    deleteBtn.className = 'delete-btn';
    deleteBtn.addEventListener('click', () => {
      todos.splice(i, 1);
      saveTodos();
      render();
    });

    li.appendChild(leftDiv);
    li.appendChild(deleteBtn);
    list.appendChild(li);
  });

  // Update filter link styles
  document.querySelectorAll('.filter a').forEach(a => {
    a.classList.toggle('active', a.dataset.filter === currentFilter);
  });
}

function addTodo() {
  const input = document.getElementById('new-todo');
  const text = input.value.trim();
  if (text) {
    todos.push({ text, completed: false });
    input.value = '';
    saveTodos();
    render();
  }
}

document.getElementById('add-btn').addEventListener('click', addTodo);
document.getElementById('new-todo').addEventListener('keypress', e => {
  if (e.key === 'Enter') addTodo();
});

document.querySelectorAll('.filter a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    currentFilter = a.dataset.filter;
    render();
  });
});

loadTodos();
render();
</script>
</body>
</html>
