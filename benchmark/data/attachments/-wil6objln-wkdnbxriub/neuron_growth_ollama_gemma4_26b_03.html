<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Growth Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            background-color: #05070f;
            box-shadow: 0 0 20px rgba(0, 213, 255, 0.2);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>

<canvas id="simCanvas" width="800" height="800"></canvas>

<script>
/**
 * NEURAL NETWORK GROWTH SIMULATION
 * A self-contained simulation of branching neurons and synaptic pulses.
 */

// --- Configuration & State ---
const config = {
    // Growth
    neuronCount: 5,
    growthSpeed: 2,
    maxDepth: 5,
    splitChance: 0-15,
    curvature: 0.5,
    maxBranchLength: 60,
    
    // Synapses
    synapseThreshold: 30,
    synapseGlow: 15,
    
    // Pulses
    pulseSpeed: 0.02,
    pulseFrequency: 0.01,
    pulseBrightness: 1.0,

    // Visuals
    backgroundColor: '#05070f',
    branchColor: '#00e5ff',
    accentBranchColor: '#d6ff00',
    synapseColor: '#ff2bd6',
    pulseColor: '#fff36a',
    gridColor: 'rgba(0, 229, 255, 0.08)',

    // Controls
    regenerate: () => initSimulation(),
    clear: () => clearCanvas(),
    pauseResume: () => { paused = !paused; }
};

let paused = false;
let neurons = [];
let synapses = [];
let pulses = [];
let canvas, ctx;
let gui;

// --- Classes ---

class Branch {
    constructor(x, y, angle, depth, parent = null) {
        this.startX = x;
        this.startY = y;
        this.currentX = x;
        this.currentY = y;
        this.angle = angle;
        this.depth = depth;
        this.parent = parent;
        this.lengthTraveled = 0;
        this.maxLength = config.maxBranchLength * (1 - depth * 0.15);
        this.children = [];
        this.isFinished = false;
        this.thickness = Math.max(1, 5 - depth);
        this.color = depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
        this.controlPoint = { x: x, y: y };
    }

    update() {
        if (this.isFinished) return;

        const step = config.growthSpeed;
        this.lengthTraveled += step;

        const oldX = this.currentX;
        const oldY = this.currentY;

        this.currentX += Math.cos(this.angle) * step;
        this.currentY += Math.sin(this.angle) * step;

        // Add slight curvature
        this.angle += (Math.random() - 0.5) * config.curvature * 0.2;

        // Update control point for quadratic curve
        this.controlPoint.x = (this.controlPoint.x + oldX) / 2;
        this.controlPoint.y = (this.controlPoint.y + oldY) / 2;

        if (this.lengthTraveled >= this.maxLength) {
            this.isFinished = true;
            this.checkSplit();
        }

        // Check for synapses with other branch tips
        checkSynapse(this.currentX, this.currentY);
    }

    checkSplit() {
        if (this.depth < config.maxDepth && Math.random() < config.splitChance) {
            const numChildren = Math.random() > 0.8 ? 2 : 1;
            for (let i = 0; i < numChildren; i++) {
                const newAngle = this.angle + (Math.random() - 0.5) * 1.2;
                const child = new Branch(this.currentX, this.currentY, newAngle, this.depth + 1, this);
                this.children.push(child);
                neurons.push(child); // Add to global tracking for update loop
            }
        }
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = this.thickness;
        ctx.strokeStyle = this.color;
        ctx.lineCap = 'round';
        ctx.moveTo(this.startX, this.startY);
        ctx.quadraticCurveTo(this.controlPoint.x, this.controlPoint.y, this.currentX, this.currentY);
        ctx.stroke();

        // Glow effect
        if (this.thickness > 1) {
            ctx.shadowBlur = 5;
            ctx.shadowColor = this.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        this.children.forEach(child => child.draw(ctx));
    }
}

class Synapse {
    constructor(start, end) {
        this.start = start; // {x, y}
        this.end = end;     // {x, y}
        this.progress = 0;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.lineWidth = 1;
        ctx.strokeStyle = config.synapseColor;
        ctx.shadowBlur = config.synapseGlow;
        ctx.shadowColor = config.synapseColor;
        ctx.moveTo(this.start.x, this.start.y);
        ctx.lineTo(this.end.x, this.end.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Pulse {
    constructor(synapse) {
        this.synapse = synapse;
        this.progress = 0;
        this.speed = config.pulseSpeed;
    }

    update() {
        this.progress += this.speed;
        if (this.progress >= 1) {
            return false; // Pulse finished
        }
        return true;
    }

    draw(ctx) {
        const x = this.synapse.start.x + (this.synapse.end.x - this.synapse.start.x) * this.progress;
        const y = this.synapse.start.y + (this.synapse.end.y - this.synapse.start.y) * this.progress;

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = config.pulseColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = config.pulseColor;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// --- Simulation Logic ---

function initSimulation() {
    neurons = [];
    synapses = [];
    pulses = [];
    const count = Math.floor(Math.random() * 4) + 3; // 3-6
    for (let i = 0; i < count; i++) {
        const startX = canvas.width / 2 + (Math.random() - 0.5) * 100;
        const startY = canvas.height / 2 + (Math.random() - 0.5) * 100;
        const angle = Math.random() * Math.PI * 2;
        const root = new Branch(startX, startY, angle, 0);
        neurons.push(root);
    }
}

function clearCanvas() {
    neurons = [];
    synapses = [];
    pulses = [];
}

function checkSynapse(x, y) {
    // Check against all other active branch tips
    for (let i = 0; i < neurons.length; i++) {
        const other = neurons[i];
        if (other === undefined) continue;
        
        const dx = x - other.currentX;
        const dy = y - other.currentY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.synapseThreshold && dist > 1) {
            // Check if synapse already exists
            const exists = synapses.some(s => 
                (Math.abs(s.start.x - x) < 5 && Math.abs(s.start.y - y) < 5) ||
                (Math.abs(s.end.x - x) < 5 && Math.abs(s.end.y - y) < 5)
            );

            if (!exists) {
                const newSynapse = new Synapse({x, y}, {x: other.currentX, y: other.currentY});
                synapses.push(newSynapse);
                if (Math.random() < 0.5) {
                    pulses.push(new Pulse(newSynapse));
                }
            }
        }
    }
}

function update() {
    if (paused) return;

    // Update branches
    for (let i = 0; i < neurons.length; i++) {
        neurons[i].update();
    }

    // Update pulses
    for (let i = pulses.length - 1; i >= 0; i--) {
        if (!pulses[i].update()) {
            pulses.splice(i, 1);
        }
    }

    // Randomly trigger new pulses
    if (Math.random() < config.pulseFrequency && synapses.length > 0) {
        const s = synapses[Math.floor(Math.random() * synapses.length)];
        pulses.push(new Pulse(s));
    }
}

function draw() {
    // Background
    ctx.fillStyle = config.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid/Scanlines
    ctx.strokeStyle = config.gridColor;
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let j=0; j<canvas.height; j+=40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    // Draw Synapses
    synapses.forEach(s => s.draw(ctx));

    // Draw Branches
    neurons.forEach(n => n.draw(ctx));

    // Draw Pulses
    pulses.forEach(p => p.draw(ctx));

    // Vignette effect
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 500);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// --- Initialization ---

window.onload = () => {
    canvas = document.getElementById('simCanvas');
    ctx = canvas.getContext('2d');

    // Setup GUI
    gui = new dat.GUI();
    
    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(config, 'neuronCount', 3, 10, 1);
    fGrowth.add(config, 'growthSpeed', 0.5, 5);
    fBranches = fGrowth.add(config, 'maxDepth', 1, 10, 1);
    fGrowth.add(config, 'splitChance', 0, 1);
    fGrowth.add(config, 'curvature', 0, 2);
    fGrowth.add(config, 'maxBranchLength', 20, 150);
    fGrowth.open();

    const fSyn = gui.addFolder('Synapses');
    fSyn.add(config, 'synapseThreshold', 5, 100);
    fSyn.add(config, 'synapseGlow', 0, 30);
    fSyn.open();

    const fPulse = gui.addFolder('Pulses');
    fPulse.add(config, 'pulseSpeed', 0.001, 0.05);
    fPulse.add(config, 'pulseFrequency', 0, 0.1);
    fPulse.add(config, 'pulseBrightness', 0.1, 2.0);
    fPulse.open();

    const fVis = gui.addFolder('Visuals');
    fVis.addColor(config, 'backgroundColor');
    fVis.addColor(config, 'branchColor');
    fVis.addColor(config, 'accentBranchColor');
    fVis.addColor(config, 'synapseColor');
    fVis.addColor(config, 'pulseColor');
    fVis.addColor(config, 'gridColor');
    fVis.open();

    const fCtrl = gui.addFolder('Controls');
    fCtrl.add(config, 'regenerate').name('Regenerate Network');
    fCtrl.add(config, 'clear').name('Clear Canvas');
    fCtrl.add(config, 'pauseResume').name('Pause/Resume');
    fCtrl.open();

    initSimulation();
    loop();
};
</script>
</body>
</html>
