<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --grid-bg: #000000;
            --text-color: #ffffff;
            --accent-color: #4CAF50;
            --p1-color: #00ff00;
            --p2-color: #00ffff;
            --food-color: #ff0055;
            --ui-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        canvas {
            background-color: var(--grid-bg);
            display: block;
            border: 2px solid #333;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ui-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 0px #000;
            color: var(--accent-color);
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            background-color: #333;
            color: white;
            border: 2px solid var(--accent-color);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: black;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }

        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        #controls-hint {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="score-board" class="hidden">
            <span class="p1-score">P1: <span id="score1">0</span></span>
            <span class="p2-score">P2: <span id="score2">0</span></span>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="overlay">
            <h1>SNAKE BATTLE</h1>
            <p>Select Game Mode</p>
            <div class="btn-group">
                <button onclick="startGame('pvp')">Human vs Human</button>
                <button onclick="startGame('cpu_vs_human')">CPU vs Human</button>
                <button onclick="startGame('cpu_vs_cpu')">CPU vs CPU</button>
            </div>
            <div id="controls-hint">
                <p><strong>P1 (Green):</strong> WASD Keys</p>
                <p><strong>P2 (Cyan):</strong> Arrow Keys</p>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="overlay hidden">
            <h1>GAME OVER</h1>
            <h2 id="winner-text">Player 1 Wins!</h2>
            <div class="btn-group">
                <button onclick="showStartMenu()">Main Menu</button>
                <button onclick="restartGame()">Restart</button>
            </div>
            <p style="margin-top: 1rem; font-size: 0.8rem;">Press any key to restart</p>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20;
        const TILE_COUNT = 30; // 600px / 20px = 30 tiles
        const FPS = 10;

        // --- Game State ---
        let gameMode = 'pvp'; // pvp, cpu_vs_human, cpu_vs_cpu
        let gameInterval;
        let isGameOver = false;
        let isPaused = false;

        // Snake 1 (Player 1)
        let snake1 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            score: 0,
            color: '#00ff00',
            isCpu: false
        };

        // Snake 2 (Player 2)
        let snake2 = {
            body: [],
            dx: 0,
            dy: 0,
            nextDx: 0,
            nextDy: 0,
            score: 0,
            color: '#00ffff',
            isCpu: false
        };

        let food = { x: 15, y: 15 };

        // --- Initialization ---
        function init() {
            document.addEventListener('keydown', handleInput);
            showStartMenu();
        }

        function showStartMenu() {
            document.getElementById('start-menu').classList.remove('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('score-board').classList.add('hidden');
            isGameOver = true; // Stop any running loop
            if (gameInterval) clearInterval(gameInterval);
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('score-board').classList.remove('hidden');
            
            isGameOver = false;
            isPaused = false;

            // Setup Snakes
            snake1 = {
                body: [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}],
                dx: 1, dy: 0, nextDx: 1, nextDy: 0,
                score: 0, color: '#00ff00', isCpu: false
            };

            snake2 = {
                body: [{x: 14, y: 10}, {x: 15, y: 10}, {x: 16, y: 10}],
                dx: -1, dy: 0, nextDx: -1, nextDy: 0,
                score: 0, color: '#00ffff', isCpu: false
            };

            // Configure Modes
            if (mode === 'cpu_vs_human') {
                snake2.isCpu = true;
            } else if (mode === 'cpu_vs_cpu') {
                snake1.isCpu = true;
                snake2.isCpu = true;
            }

            spawnFood();
            updateScoreBoard();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 1000 / FPS);
        }

        function restartGame() {
            startGame(gameMode);
        }

        // --- Game Loop ---
        function gameLoop() {
            if (isGameOver) return;

            update();
            draw();
        }

        // --- Update Logic ---
        function update() {
            // Handle CPU AI
            if (snake1.isCpu) {
                const move = getBestMove(snake1, snake2);
                if (move) {
                    snake1.nextDx = move.dx;
                    snake1.nextDy = move.dy;
                }
            }
            if (snake2.isCpu) {
                const move = getBestMove(snake2, snake1);
                if (move) {
                    snake2.nextDx = move.dx;
                    snake2.nextDy = move.dy;
                }
            }

            // Apply directions
            snake1.dx = snake1.nextDx;
            snake1.dy = snake1.nextDy;
            snake2.dx = snake2.nextDx;
            snake2.dy = snake2.nextDy;

            // Move Snakes
            moveSnake(snake1);
            moveSnake(snake2);

            // Check Collisions
            checkCollisions();
        }

        function moveSnake(snake) {
            const head = { x: snake.body[0].x + snake.dx, y: snake.body[0].y + snake.dy };
            snake.body.unshift(head);

            // Check Food
            if (head.x === food.x && head.y === food.y) {
                snake.score += 10;
                updateScoreBoard();
                spawnFood();
            } else {
                snake.body.pop();
            }
        }

        function checkCollisions() {
            const head1 = snake1.body[0];
            const head2 = snake2.body[0];

            let p1Died = false;
            let p2Died = false;

            // Wall Collision
            if (head1.x < 0 || head1.x >= TILE_COUNT || head1.y < 0 || head1.y >= TILE_COUNT) p1Died = true;
            if (head2.x < 0 || head2.x >= TILE_COUNT || head2.y < 0 || head2.y >= TILE_COUNT) p2Died = true;

            // Self Collision
            if (checkSelfCollision(snake1, head1)) p1Died = true;
            if (checkSelfCollision(snake2, head2)) p2Died = true;

            // Head-to-Head Collision
            if (head1.x === head2.x && head1.y === head2.y) {
                p1Died = true;
                p2Died = true;
            }

            if (p1Died && p2Died) {
                endGame('draw');
            } else if (p1Died) {
                endGame('p2');
            } else if (p2Died) {
                endGame('p1');
            }
        }

        function checkSelfCollision(snake, head) {
            // Start from index 1 to ignore the head itself
            for (let i = 1; i < snake.body.length; i++) {
                if (head.x === snake.body[i].x && head.y === snake.body[i].y) {
                    return true;
                }
            }
            return false;
        }

        function endGame(winner) {
            isGameOver = true;
            clearInterval(gameInterval);
            
            const winnerText = document.getElementById('winner-text');
            if (winner === 'p1') winnerText.innerText = "Player 1 Wins!";
            else if (winner === 'p2') winnerText.innerText = "Player 2 Wins!";
            else winnerText.innerText = "It's a Draw!";

            document.getElementById('game-over').classList.remove('hidden');
        }

        // --- AI Logic (BFS) ---
        function getBestMove(snake, opponent) {
            const head = snake.body[0];
            const moves = [
                { dx: 0, dy: -1 }, // Up
                { dx: 0, dy: 1 },  // Down
                { dx: -1, dy: 0 }, // Left
                { dx: 1, dy: 0 }   // Right
            ];

            // Filter out moves that kill immediately (walls or self/opponent body)
            const safeMoves = moves.filter(move => {
                const nx = head.x + move.dx;
                const ny = head.y + move.dy;
                
                // Wall check
                if (nx < 0 || nx >= TILE_COUNT || ny < 0 || ny >= TILE_COUNT) return false;

                // Self check
                for (let part of snake.body) {
                    if (nx === part.x && ny === part.y) return false;
                }

                // Opponent check (treat opponent body as obstacles)
                for (let part of opponent.body) {
                    if (nx === part.x && ny === part.y) return false;
                }

                return true;
            });

            if (safeMoves.length === 0) return null; // No moves, accept fate

            // BFS to find shortest path to food
            let bestMove = null;
            let minDistance = Infinity;

            for (let move of safeMoves) {
                const dist = bfsDistance(head, move, food, snake, opponent);
                if (dist !== -1 && dist < minDistance) {
                    minDistance = dist;
                    bestMove = move;
                }
            }

            // If no path to food found, pick any safe move that keeps us alive longest (simple heuristic: pick one that doesn't trap us immediately)
            if (!bestMove) {
                bestMove = safeMoves[0];
            }

            return bestMove;
        }

        function bfsDistance(start, firstMove, target, selfSnake, oppSnake) {
            const startNode = { x: start.x + firstMove.dx, y: start.y + firstMove.dy };
            const queue = [startNode];
            const visited = new Set();
            visited.add(`${startNode.x},${startNode.y}`);
            
            let steps = 0;
            const maxSteps = 400; // Prevent infinite loops in large grids

            while (queue.length > 0) {
                const size = queue.length;
                steps++;

                for (let i = 0; i < size; i++) {
                    const current = queue.shift();

                    if (current.x === target.x && current.y === target.y) {
                        return steps;
                    }

                    const neighbors = [
                        { x: current.x, y: current.y - 1 },
                        { x: current.x, y: current.y + 1 },
                        { x: current.x - 1, y: current.y },
                        { x: current.x + 1, y: current.y }
                    ];

                    for (let next of neighbors) {
                        const key = `${next.x},${next.y}`;
                        if (visited.has(key)) continue;

                        // Check walls
                        if (next.x < 0 || next.x >= TILE_COUNT || next.y < 0 || next.y >= TILE_COUNT) continue;

                        // Check self collision (simulate snake moving)
                        // Note: This is a simplified check. In reality, the tail moves.
                        // For this simple AI, we treat the current body state as static obstacles.
                        let isObstacle = false;
                        
                        // Check self
                        for (let part of selfSnake.body) {
                            if (next.x === part.x && next.y === part.y) {
                                // Allow moving into the tail if the tail will move away (simple heuristic)
                                // But for BFS stability, we usually treat tail as obstacle unless it's the very last step
                                isObstacle = true; 
                            }
                        }
                        
                        // Check opponent
                        for (let part of oppSnake.body) {
                            if (next.x === part.x && next.y === part.y) {
                                isObstacle = true;
                            }
                        }

                        if (!isObstacle) {
                            visited.add(key);
                            queue.push(next);
                        }
                    }
                }
                if (steps > maxSteps) return -1;
            }
            return -1;
        }

        // --- Input Handling ---
        function handleInput(e) {
            if (isGameOver) {
                restartGame();
                return;
            }

            // Player 1 Controls (WASD)
            if (!snake1.isCpu) {
                const key = e.key.toLowerCase();
                if (key === 'w' && snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = -1; }
                if (key === 's' && snake1.dy === 0) { snake1.nextDx = 0; snake1.nextDy = 1; }
                if (key === 'a' && snake1.dx === 0) { snake1.nextDx = -1; snake1.nextDy = 0; }
                if (key === 'd' && snake1.dx === 0) { snake1.nextDx = 1; snake1.nextDy = 0; }
            }

            // Player 2 Controls (Arrows)
            if (!snake2.isCpu) {
                const key = e.key;
                if (key === 'ArrowUp' && snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = -1; }
                if (key === 'ArrowDown' && snake2.dy === 0) { snake2.nextDx = 0; snake2.nextDy = 1; }
                if (key === 'ArrowLeft' && snake2.dx === 0) { snake2.nextDx = -1; snake2.nextDy = 0; }
                if (key === 'ArrowRight' && snake2.dx === 0) { snake2.nextDx = 1; snake2.nextDy = 0; }
            }
        }

        // --- Rendering ---
        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Optional, subtle)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
            ctx.shadowBlur = 0;

            // Draw Snake 1
            drawSnake(snake1);

            // Draw Snake 2
            drawSnake(snake2);
        }

        function drawSnake(snake) {
            ctx.fillStyle = snake.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = snake.color;
            
            snake.body.forEach((part, index) => {
                // Head is slightly larger or different shade
                if (index === 0) {
                    ctx.fillStyle = '#ffffff'; // White head
                } else {
                    ctx.fillStyle = snake.color;
                }
                ctx.fillRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0;
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                
                valid = true;
                // Check if food spawned on snake 1
                for (let part of snake1.body) {
                    if (food.x === part.x && food.y === part.y) valid = false;
                }
                // Check if food spawned on snake 2
                for (let part of snake2.body) {
                    if (food.x === part.x && food.y === part.y) valid = false;
                }
            }
        }

        function updateScoreBoard() {
            document.getElementById('score1').innerText = snake1.score;
            document.getElementById('score2').innerText = snake2.score;
        }

        // Start
        init();

    </script>
</body>
</html>
