<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gouraud Shaded Cube - Canvas 2D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }
        canvas {
            image-rendering: pixelated;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <div id="ui">
        FPS: <span id="fps">0</span><br>
        Wireframe: <span id="wireframe-status">OFF</span><br>
        Paused: <span id="pause-status">NO</span><br>
        Controls: [W] Toggle Wireframe, [P] Pause/Play
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        /** 3D MATH LIBRARY **/
        class Vector3 {
            constructor(x = 0, y = 0, z = 0) {
                this.x = x; this.y = y; this.z = z;
            }
            add(v) { return new Vector3(this.x + v.x, this.y + v.y, this.z + v.z); }
            sub(v) { return new Vector3(this.x - v.x, this.y - v.y, this.z - v.z); }
            mulScalar(s) { return new Vector3(this.mulScalar_internal(s), this.mulScalar_internal(s), this.mulScalar_internal(s)); } // Wait, simpler:
            mul(s) { return new Vector3(this.x * s, this.y * s, this.z * s); }
            dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
            cross(v) {
                return new Vector3(
                    this.y * v.z - this.z * v.y,
                    this.mask_z_v_y(v), // helper logic below
                    this.z * v.x - this.x * v.z
                );
            }
            // Correcting cross product implementation
            static crossProduct(a, b) {
                return new Vector3(
                    a.y * b.z - a.z * b.y,
                    a.z * b.x - a.x * b.z,
                    a.x * b.y - a.y * b.x
                );
            }
            normalize() {
                let mag = Math.sqrt(this.dot(this));
                return mag > 0 ? this.mul(1 / mag) : new Vector3();
            }
        }

        class Matrix4 {
            constructor() {
                this.elements = new Float32Array(16).fill(0);
                this.elements[0] = 1; this.elements[5] = 1; this.elements[10] = 1; this.elements[15] = 1;
            }

            static multiply(a, b) {
                let res = new Matrix4();
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        let sum = 0;
                        for (let k = 0; k < 4; k++) {
                            sum += a.elements[i * 4 + k] * b.elements[k * 4 + j];
                        }
                        res.elements[i * 4 + j] = sum;
                    }
                }
                return res;
            }

            static rotationX(angle) {
                let m = new Matrix4();
                let c = Math.cos(angle), s = Math.sin(angle);
                m.elements[5] = c; m.elements[6] = -s;
                m.elements[9] = s; m.elements[10] = c;
                return m;
            }

            static rotationY(angle) {
                let m = new Matrix4();
                let c = Math.cos(angle), s = Math.sin(angle);
                m.elements[0] = c; m.elements[2] = s;
                m.elements[8] = -s; m.elements[10] = c;
                return m;
            }

            static rotationZ(angle) {
                let m = new Matrix4();
                let c = Math.cos(angle), s = Math.sin(angle);
                m.elements[0] = c; m.elements[1] = -s;
                m.elements[4] = s; m.elements[5] = c;
                return m;
            }

            transformVec3(v) {
                let x = v.x, y = v.y, z = v.z;
                let e = this.elements;
                return new Vector3(
                    e[0]*x + e[1]*y + e[2]*z + e[3],
                    e[4]*x + e[5]*y + e[6]*z + e[7],
                    e[8]*x + e[9]*y + e[10]*z + e[11]
                );
            }
        }

        /** GEOMETRY **/
        const vertices = [
            new Vector3(-1, -1,  1), new Vector3( 1, -1,  1), new Vector3( 1,  1,  1), new Vector3(-1,  1,  1),
            new Vector3(-1, -1, -1), new Vector3( 1, -1, -1), new Vector3( 1,  1, -1), new Vector3(-1,  1, -1)
        ];

        // Faces defined as indices into vertices. Each face is a quad (2 triangles).
        const faces = [
            { indices: [0, 1, 2, 0, 2, 3], normal: new Vector3(0, 0, 1) },  // Front
            { indices: [5, 4, 7, 5, 7, 6], normal: new Vector3(0, 0, -1) }, // Back
            { indices: [4, 0, 3, 4, 3, 7], normal: new Vector3(-1, 0, 0) }, // Left
            { indices: [1, 5, 6, 1, 6, 2], normal: new Vector3(1, 0, 0) },  // Right
            { indices: [3, 2, 6, 3, 6, 7], normal: new Vector3(0, 1, 0) },  // Top
            { indices: [4, 5, 1, 4, 1, 0], normal: new				   0, -1, 0] } // Bottom (fixed typo in manual entry below)
        ];
        // Re-defining faces properly to avoid typos and ensure correct normals/winding
        const cubeFaces = [
            { idx: [0, 1, 2, 0, 2, 3], n: new Vector3(0, 0, 1) },
            { idx: [5, 4, 7, 5, 7, 6], n: new Vector3(0, 0, -1) },
            { idx: [4, 0, 3, 4, 3, 7], n: new Vector3(-1, 0, 0) },
            { idx: [1, 5, 6, 1, 6, 2], n: new Vector3(1, 0, 0) },
            { idx: [3, 2, 6, 3, 6, 7], n: new Vector3(0, 1, 0) },
            { idx: [4, 5, 1, 4, 1, 0], n: new Vector3(0, -1, 0) }
        ];

        /** RENDERER **/
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const fpsEl = document.getElementById('fps');
        const wireframeEl = document.getElementById('wireframe-status');
        const pauseEl = document.getElementById('pause-status');

        let width, height;
        let imageData;
        let frameCount = 0;
        let lastTime = performance.now();
        let isWireframe = false;
        let isPaused = false;
        let rotationX = 0;
        let rotationY = 0;
        let lightPos = new Vector3(2, 2, 2);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            imageData = ctx.createImageData(width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') isWireframe = !isWireframe;
            if (e.key.toLowerCase() === 'p') isPaused = !isPaused;
            wireframeEl.innerText = isWireframe ? "ON" : "OFF";
            pauseEl.innerText = isPaused ? "YES" : "NO";
        });

        function project(v, matrix, aspect) {
            let tv = matrix.transformVec3(v);
            let z = tv.z + 5; // Move camera back
            if (z <= 0) return null;
            let fov = 400;
            let scale = fov / z;
            return {
                x: width / 2 + tv.x * scale * aspect,
                y: height / 2 - tv.y * scale,
                z: z,
                scale: scale
            };
        }

        function render() {
            if (!isPaused) {
                rotationX += 0.01;
                rotationY += 0.015;
                lightPos.x = Math.sin(performance.now() * 0.002) * 3;
                lightPos.y = Math.cos(performance.now() * 0.0015) * 3;
                lightPos.z = Math.sin(performance.now() * 0.001) * 3;

                // Clear background
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, width, height);

                const aspect = width / height;
                const rotMat = Matrix4.multiply(Matrix4.rotationX(rotationX), Matrix4.rotationY(rotationY));

                // For Gouraud Shading (Rasterization)
                if (!isWireframe) {
                    // We use a simplified approach: Draw triangles with color interpolation via Canvas 2D gradients or pixel manipulation.
                    // Since true per-pixel software rasterization is heavy for JS, we'll use the "Triangle Fill" technique 
                    // by calculating vertex colors and using canvas gradient/fill if possible, but to strictly follow 
                    // "Gouraud shading via ImageData", we implement a basic scanline or fragment loop.
                    // However, for performance in a single file, we'll use the Canvas API's ability to draw paths 
                }

                const projectedVertices = vertices.map(v => project(v, rotMat, aspect));

                // Backface Culling & Rendering
                cubeFaces.forEach(face => {
                    const vIdx = face.idx;
                    const p1 = projectedVertices[vIdx[0]];
                    const p2 = projectedVertices[vIdx[1]];
                    const p3 = projectedVertices[vIdx[2]];

                    if (!p1 || !p2 || !p3) return;

                    // Backface culling check using normal and view vector
                    // Simplified: Check if the triangle is facing the camera (z-order/winding)
                    const area = (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
                    if (area <= 0) return;

                    // Calculate lighting for each vertex (Lambertian)
                    const getVertexColor = (vIdx) => {
                        const v = rotMat.transformVec3(vertices[vIdx]);
                        const L = lightPos.sub(v).normalize();
                        const N = face.n; // Use face normal for simplicity or compute per-vertex
                        // For true Gouraud, we need vertex normals. Let's assume cube vertices have precomputed normals.
                        // But since it's a cube, face normal is fine for a "flat" look, 
                        // but to show Gouraud, let's use the interpolated light intensity.
                        let dot = Math.max(0, N.dot(L));
                        return [255 * dot, 255 * dot, 255 * dot]; // Grayscale intensity
                    };

                    const c1 = getVertexColor(vIdx[0]);
                    const c2 = getVertexColor(vIdx[1]);
                    const c3 = getVertexColor(vIdx[2]);

                    if (isWireframe) {
                        ctx.strokeStyle = '#0f0';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.lineTo(p3.x, p3.y);
                        ctx.lineTo(pIdx_back(vIdx, projectedVertices, 0), pIdx_back(vIdx, projectedVertices, 1)); // This is getting messy
                        // Let's just draw the edges of the face
                    } else {
                        // Gouraud implementation via Canvas Gradient (Approximation of per-pixel interpolation)
                        // True software rasterization in JS loop is too slow for 60fps on large canvases.
                        // We use a trick: create a radial/linear gradient or just fill with calculated color.
                        // To strictly follow "Gouraud", we'll draw the triangle and use the vertex colors.
                        ctx.fillStyle = `rgb(${c1[0]}, ${c1[1]}, ${c1[2]})`; // Fallback to flat for performance if needed
                        // But let's try a path-based approach that looks shaded.
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.lineTo(p3.x, p3.y);
                        ctx.closePath();
                        // For a real Gouraud effect in Canvas 2D without WebGL:
                        // We use the vertex colors to create a color-interpolated look via a trick or just flat shading per face.
                        // Since the instruction asks for "Gouraud Shading", I will implement a small software rasterizer loop.
                    }
                });

                // RE-IMPLEMENTING RENDERER CORE FOR TRUE GOURAUD
                renderGouraud(rotMat, aspect);
            }

            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fpsEl.innerText = frameCount;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(render);
        }

        function renderGouraud(rotMat, aspect) {
            const projectedVertices = vertices.map(v => project(v, rotMat, aspect));
            
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            if (isWireframe) {
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                cubeFaces.forEach(face => {
                    // Draw edges of the quad (indices 0,1,2,3)
                    const idxs = face.idx.slice(0, 4); // simplified for cube faces
                    ctx.beginPath();
                    for(let i=0; i<4; i++) {
                        let v = vertices[face.idx[i % face.idx.length]]; // This is wrong logic, let's use fixed indices
                    }
                });
                // Correct wireframe: just draw the lines of the cube edges
                ctx.beginPath();
                const edgeIndices = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
                edgeIndices.forEach(pair => {
                    const pA = projectedVertices[pair[0]];
                    const pB = projectedVertices[pair[1]];
                    if (pA && pB) {
                        ctx.moveTo(pA.x, pA.y);
                        ctx.lineTo(pB.x, pB.y);
                    }
                });
                ctx.stroke();
            } else {
                // Software Rasterizer for Gouraud Shading
                const pixels = imageData.data;
                
                cubeFaces.forEach(face => {
                    const vIdxs = face.idx;
                    // Each face is 2 triangles: (0,1,2) and (0,2,3)
                    const tris = [[vIdxs[0], vIdxs[1], vIdxs[2]], [vIdxs[0], vIdxs[2], vIdxs[3]]];

                    tris.forEach(tri => {
                        const pA = projectedVertices[tri[0]];
                        const pB = projectedVertices[tri[1]];
                        const pC = projectedVertices[tri[2]];

                        if (!pA || !pB || !pC) return;

                        // Backface culling (2D cross product)
                        const area = (pB.x - pA.x) * (pT_y(pC) - pA.y) - (pB.y - pA.y) * (pT_x(pC) - pA.x);
                        // Wait, simpler:
                        const cross = (pB.x - pA.x) * (pC.y - pA.y) - (pB.y - pA.y) * (pC.x - pA.x);
                        if (cross <= 0) return;

                        // Calculate vertex colors (Lambertian)
                        const getCol = (vIdx) => {
                            const v = rotMat.transformVec3(vertices[vIdx]);
                            const L = lightPos.sub(v).normalize();
                            const N = face.n; 
                            let dot = Math.max(0.1, N.dot(L)); // 0.1 ambient
                            return [255 * dot, 255 * dot, 255 * dot];
                        };

                        const cA = getCol(tri[0]);
                        const cB = getCol(tri[1]);
                        const cC = getCol(tri[2]);

                        // Bounding box of triangle
                        const minX = Math.floor(Math.min(pA.x, pB.x, pC.x));
                        const maxX = Math.ceil(Math.max(pA.x, pB.x, pC.x));
                        const minY = Math.floor(Math.min(pA.y, pB.y, pC.y));
                        const maxY = Math.ceil(Math.max(pA.y, pB.y, pC.y));

                        // Clip to screen
                        const xStart = Math.max(0, minX);
                        const xEnd = Math.min(width - 1, maxX);
                        const yStart = Math.max(0, minY);
                        const yEnd = Math.min(height - 1, maxY);

                        for (let y = yStart; y <= yEnd; y++) {
                            for (let x = xStart; x <= xEnd; x++) {
                                // Barycentric coordinates check
                                const bary = barycentric(x, y, pA, pB, pC);
                                if (bary.w >= 0 && bary.u >= 0 && bary.v >= 0) {
                                    // Interpolate color
                                    const r = cA[0] * bary.u + cB[0] * bary.v + cC[0] * bary.w;
                                    const g = cA[1] * bary.u + cB[1] * bary.v + cC[1] * bary.w;
                                    const b = cA[2] * bary.u + cB[2] * bary.v + cC[2] * bary.w;

                                    const idx = (y * width + x) * 4;
                                    pixels[idx] = r;
                                    pixels[idx+1] = g;
                                    pixels[idx+2] = b;
                                    pixels[idx+3] = 255;
                                }
                            }
                        }
                    });
                });
                ctx.putImageData(imageData, 0, 0);
            }
        }

        function barycentric(px, py, pA, pB, pC) {
            const det = (pB.y - pC.y) * (pA.x - pC.x) + (pC.x - pB.x) * (pA.y - pC.y);
            const u = ((pB.y - pC.y) * (px - pC.x) + (pC.x - pB.x) * (py - pC.y)) / det;
            const v = ((pC.y - pA.y) * (px - pC.x) + (pA.x - pC.x) * (py - pC.y)) / det;
            const w = 1 - u - v;
            return { u, v, w };
        }

        // Helper functions to fix the broken logic in the draft above
        function pT_x(p) { return p.x; }
        function pT_y(p) { return p.y; }

        // Start loop
        requestAnimationFrame(render);

    </script>
</body>
