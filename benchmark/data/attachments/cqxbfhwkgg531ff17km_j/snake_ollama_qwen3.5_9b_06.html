<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - 30x30 Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        h1 {
            color: #4ecca3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .menu {
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #4ecca3;
            text-align: center;
            min-width: 600px;
        }
        
        .menu h2 {
            margin-bottom: 20px;
            color: #4ecca3;
        }
        
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .menu-buttons button {
            padding: 12px 25px;
            font-size: 16px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .menu-buttons button:hover {
            background: #3db892;
            transform: translateY(-2px);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(30, 1fr);
            grid-template-rows: repeat(30, 1fr);
            gap: 1px;
            background: #0f0f23;
            padding: 5px;
            border-radius: 8px;
            border: 3px solid #4ecca3;
        }
        
        .cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            transition: background-color 0.1s;
        }
        
        .snake {
            background: #4ecca3;
            box-shadow: 0 0 5px #4ecca3;
        }
        
        .snake-head {
            background: #5ff0c5;
            box-shadow: 0 0 8px #5ff0c5;
        }
        
        .food {
            background: #e94560;
            border-radius: 50%;
            box-shadow: 0 0 8px #e94560;
        }
        
        .info-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            gap: 15px;
        }
        
        .info-box {
            background: #16213e;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #4ecca3;
            flex: 1;
        }
        
        .info-box label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .info-box span {
            font-size: 20px;
            color: #4ecca3;
            font-weight: bold;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        
        .game-over.active {
            display: flex;
        }
        
        .game-over h2 {
            font-size: 48px;
            color: #e94560;
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .restart-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .restart-btn:hover {
            background: #3db892;
        }
        
        .controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        
        .score-display {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME 🐍</h1>
        
        <div class="menu" id="menu">
            <h2>Choose Game Mode:</h2>
            <div class="menu-buttons">
                <button onclick="startGame('PvP')">Player vs Player</button>
                <button onclick="startGame('PvCPU')">Player vs CPU</button>
                <button onclick="startGame('CPUvCPU')">CPU vs CPU</button>
            </div>
            <p class="controls-hint">Use Arrow Keys or WASD to control the snake</p>
        </div>
        
        <div class="score-display">
            <div class="info-panel">
                <div class="info-box">
                    <label>Player 1 Score</label>
                    <span id="score-p1">0</span>
                </div>
                <div class="info-box">
                    <label>Player 2 Score</label>
                    <span id="score-p2">0</span>
                </div>
                <div class="info-box">
                    <label>High Score</label>
                    <span id="high-score">0</span>
                </div>
            </div>
        </div>
        
        <div class="game-board" id="board"></div>
        
        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p id="final-score">Player 1: 0 | Player 2: 0</p>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const GRID_SIZE = 30;
        const CELL_SIZE = 12;
        const GAME_SPEED = 100; // ms
        const STORAGE_KEY = 'snake_highscore';
        
        // Game State
        let board = [];
        let snake1 = [];
        let snake2 = [];
        let food = null;
        let direction1 = { x: 1, y: 0 };
        let direction2 = { x: -1, y: 0 };
        let nextDirection1 = { x: 1, y: 0 };
        let nextDirection2 = { x: -1, y: 0 };
        let score1 = 0;
        let score2 = 0;
        let highScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
        let gameMode = null;
        let gameInterval = null;
        let isGameOver = false;
        let p1Controls = true;
        
        // DOM Elements
        const menu = document.getElementById('menu');
        const board = document.getElementById('board');
        const gameOver = document.getElementById('gameOver');
        const scoreP1 = document.getElementById('score-p1');
        const scoreP2 = document.getElementById('score-p2');
        const highScoreEl = document.getElementById('high-score');
        const finalScore = document.getElementById('final-score');
        
        // Initialize board
        function initBoard() {
            board.innerHTML = '';
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    board.appendChild(cell);
                }
            }
        }
        
        // Get cell element
        function getCell(x, y) {
            return document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
        }
        
        // Spawn food
        function spawnFood() {
            let valid = false;
            let x, y;
            do {
                x = Math.floor(Math.random() * GRID_SIZE);
                y = Math.floor(Math.random() * GRID_SIZE);
                valid = !isOccupied(x, y);
            } while (!valid);
            
            food = { x, y };
        }
        
        // Check if position is occupied
        function isOccupied(x, y) {
            if (snake1.some(s => s.x === x && s.y === y)) return true;
            if (snake2.some(s => s.x === x && s.y === y)) return true;
            return false;
        }
        
        // Move snake
        function moveSnake(snake, head, dir, grow) {
            const newHead = { x: head.x + dir.x, y: head.y + dir.y };
            
            // Check collision
            if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
                newHead.y < 0 || newHead.y >= GRID_SIZE ||
                snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                endGame();
                return;
            }
            
            snake.unshift(newHead);
            
            if (grow) {
                growScore = growScore || 0;
                growScore++;
            } else {
                snake.pop();
            }
        }
        
        // Update score
        function updateScore(grow) {
            if (grow) {
                score1++;
                score2++;
                scoreP1.textContent = score1;
                scoreP2.textContent = score2;
                
                if (score1 > highScore) {
                    highScore = score1;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem(STORAGE_KEY, highScore);
                }
            }
        }
        
        // AI decision for CPU
        function getAIMove(snake, food) {
            const head = snake[0];
            const moves = [
                { x: 0, y: -1 }, // Up
                { x: 0, y: 1 },  // Down
                { x: -1, y: 0 }, // Left
                { x: 1, y: 0 }   // Right
            ];
            
            // Sort moves by distance to food
            moves.sort((a, b) => {
                const distA = Math.abs(head.x + a.x - food.x) + Math.abs(head.y + a.y - food.y);
                const distB = Math.abs(head.x + b.x - food.x) + Math.abs(head.y + b.y - food.y);
                return distA - distB;
            });
            
            // Try to find a safe move
            for (const move of moves) {
                const newHead = { x: head.x + move.x, y: head.y + move.y };
                
                // Check boundaries
                if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
                    newHead.y < 0 || newHead.y >= GRID_SIZE) continue;
                
                // Check collision with own body
                if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) continue;
                
                // Check collision with opponent
                if (gameMode === 'PvCPU' || gameMode === 'CPUvCPU') {
                    if (snake2.some(s => s.x === newHead.x && s.y === newHead.y)) continue;
                    if (snake1.some(s => s.x === newHead.x && s.y === newHead.y)) continue;
                }
                
                return move;
            }
            
            // No safe move, return current direction
            return { x: dir.x, y: dir.y };
        }
        
        // Start game
        function startGame(mode) {
            gameMode = mode;
            menu.style.display = 'none';
            gameOver.classList.remove('active');
            
            // Initialize snakes
            snake1 = [];
            snake2 = [];
            
            // Player 1 starts at top-left
            for (let i = 0; i < 5; i++) {
                snake1.push({ x: 0, y: i });
            }
            
            // Player 2 starts at top-right
            for (let i = 0; i < 5; i++) {
                snake2.push({ x: GRID_SIZE - 1 - i, y: i });
            }
            
            // Set initial directions
            if (gameMode === 'PvP') {
                direction1 = { x: 1, y: 0 };
                direction2 = { x: -1, y: 0 };
                nextDirection1 = { x: 1, y: 0 };
                nextDirection2 = { x: -1, y: 0 };
                p1Controls = true;
            } else if (gameMode === 'PvCPU') {
                direction1 = { x: 1, y: 0 };
                direction2 = { x: 0, y: 1 };
                nextDirection1 = { x: 1, y: 0 };
                nextDirection2 = { x: 0, y: 1 };
                p1Controls = true;
            } else {
                direction1 = { x: 1, y: 0 };
                direction2 = { x: -1, y: 0 };
                nextDirection1 = { x: 1, y: 0 };
                nextDirection2 = { x: -1, y: 0 };
                p1Controls = false;
            }
            
            // Spawn food
            spawnFood();
            
            // Render initial state
            render();
            
            // Start game loop
            isGameOver = false;
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }
        
        // Game loop
        function gameLoop() {
            if (isGameOver) return;
            
            // AI move for CPU
            if (gameMode === 'PvCPU' || gameMode === 'CPUvCPU') {
                const currentDir = direction2;
                const aiMove = getAIMove(snake2, food);
                direction2 = aiMove;
            } else if (gameMode === 'CPUvCPU') {
                const currentDir = direction2;
                const aiMove = getAIMove(snake2, food);
                direction2 = aiMove;
            }
            
            // Handle player input
            if (p1Controls && !isGameOver) {
                // Check for valid direction change
                if (nextDirection1.x !== 0 || nextDirection1.y !== 0) {
                    direction1 = nextDirection1;
                    nextDirection1 = { x: 1, y: 0 }; // Reset
                }
            }
            
            // Move snakes
            moveSnake(snake1, snake1[0], direction1, food && snake1[0].x === food.x && snake1[0].y === food.y);
            moveSnake(snake2, snake2[0], direction2, food && snake2[0].x === food.x && snake2[0].y === food.y);
            
            // Check if food was eaten
            if (snake1[0].x === food.x && snake1[0].y === food.y) {
                updateScore(true);
                spawnFood();
            } else if (snake2[0].x === food.x && snake2[0].y === food.y) {
                updateScore(true);
                spawnFood();
            }
            
            render();
        }
        
        // Render game
        function render() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.className = 'cell';
                cell.textContent = '';
            });
            
            // Render snake 1
            snake1.forEach((segment, index) => {
                const cell = getCell(segment.x, segment.y);
                if (index === 0) {
                    cell.classList.add('snake-head');
                } else {
                    cell.classList.add('snake');
                }
            });
            
            // Render snake 2
            snake2.forEach((segment, index) => {
                const cell = getCell(segment.x, segment.y);
                if (index === 0) {
                    cell.classList.add('snake-head');
                } else {
                    cell.classList.add('snake');
                }
            });
            
            // Render food
            if (food) {
                const cell = getCell(food.x, food.y);
                cell.classList.add('food');
            }
        }
        
        // End game
        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            
            finalScore.textContent = `Player 1: ${score1} | Player 2: ${score2}`;
            gameOver.classList.add('active');
        }
        
        // Restart game
        function restartGame() {
            score1 = 0;
            score2 = 0;
            scoreP1.textContent = '0';
            scoreP2.textContent = '0';
            gameOver.classList.remove('active');
            startGame(gameMode);
        }
        
        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            if (isGameOver) {
                if (e.key === 'Enter' || e.key === ' ') {
                    restartGame();
                }
                return;
            }
            
            // Prevent default scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
            
            if (!p1Controls) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction1.y !== 1) {
                        nextDirection1 = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction1.y !== -1) {
                        nextDirection1 = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction1.x !== 1) {
                        nextDirection1 = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction1.x !== -1) {
                        nextDirection1 = { x: 1, y: 0 };
                    }
                    break;
            }
        });
        
        // Initialize
        initBoard();
        highScoreEl.textContent = highScore;
    </script>
</body>
</html>
