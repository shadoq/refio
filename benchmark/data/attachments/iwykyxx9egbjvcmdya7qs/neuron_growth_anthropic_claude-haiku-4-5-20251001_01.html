<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #05070f 0%, #101a3a 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 800px;
            height: 800px;
            background: #05070f;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3), inset 0 0 30px rgba(0, 229, 255, 0.1);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #05070f;
        }
        
        .gui-container {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 100;
        }
        
        .dg {
            font-size: 11px !important;
        }
        
        .dg.ac {
            z-index: 200 !important;
        }
        
        .dg .dg-main {
            background: rgba(5, 7, 15, 0.95) !important;
            border: 1px solid #00e5ff !important;
        }
        
        .dg .dg-main.width-fixed {
            width: 280px !important;
        }
        
        .dg .folder {
            border-left: 2px solid #d6ff00 !important;
        }
        
        .dg .folder.closed {
            border-left: 2px solid #00e5ff !important;
        }
        
        .dg .folder > .title {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.1), rgba(214, 255, 0, 0.05)) !important;
            color: #00e5ff !important;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5) !important;
        }
        
        .dg .folder > .title:hover {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.2), rgba(214, 255, 0, 0.1)) !important;
        }
        
        .dg .cr.boolean {
            border-left: 2px solid #ff2bd6 !important;
        }
        
        .dg .cr.number {
            border-left: 2px solid #ffd400 !important;
        }
        
        .dg .cr.color {
            border-left: 2px solid #fff36a !important;
        }
        
        .dg .cr.function {
            border-left: 2px solid #d6ff00 !important;
        }
        
        .dg .cr.function button {
            background: linear-gradient(90deg, #00e5ff, #d6ff00) !important;
            color: #05070f !important;
            border: 1px solid #00e5ff !important;
            text-shadow: none !important;
            font-weight: bold !important;
        }
        
        .dg .cr.function button:hover {
            background: linear-gradient(90deg, #d6ff00, #00e5ff) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6) !important;
        }
        
        .dg .property-name {
            color: #00e5ff !important;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.3) !important;
        }
        
        .dg .slider {
            background: rgba(0, 229, 255, 0.1) !important;
        }
        
        .dg .slider-fg {
            background: linear-gradient(90deg, #00e5ff, #d6ff00) !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5) !important;
        }
        
        .dg input[type="text"],
        .dg input[type="number"] {
            background: rgba(0, 229, 255, 0.05) !important;
            border: 1px solid #00e5ff !important;
            color: #00e5ff !important;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.3) !important;
        }
        
        .dg input[type="text"]:focus,
        .dg input[type="number"]:focus {
            background: rgba(0, 229, 255, 0.15) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5) !important;
        }
        
        .dg input[type="checkbox"] {
            margin-right: 5px !important;
        }
        
        .dg .c input[type="checkbox"] {
            margin-top: 2px !important;
        }
        
        .dg .color-picker {
            background: rgba(0, 229, 255, 0.05) !important;
            border: 1px solid #00e5ff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // NEURAL NETWORK VISUALIZATION
        // ============================================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 800;

        // ============================================================================
        // COLOR PALETTE
        // ============================================================================
        const colors = {
            background: '#05070f',
            backgroundGlow: '#101a3a',
            mainBranch: '#00e5ff',
            secondaryBranch: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            accent: '#ffd400',
            gridScanline: 'rgba(0, 229, 255, 0.08)'
        };

        // ============================================================================
        // CONFIGURATION
        // ============================================================================
        const config = {
            // Growth
            neuronCount: 4,
            branchGrowthSpeed: 2,
            maxBranchDepth: 8,
            branchSplitChance: 0.3,
            branchCurvature: 0.15,
            maxBranchLength: 80,
            
            // Synapses
            synapseDistanceThreshold: 40,
            synapseGlowStrength: 15,
            
            // Pulses
            pulseSpeed: 3,
            pulseFrequency: 0.05,
            pulseBrightness: 1.0,
            
            // Visuals
            backgroundColor: colors.background,
            branchColor: colors.mainBranch,
            accentBranchColor: colors.secondaryBranch,
            synapseColor: colors.synapse,
            pulseColor: colors.pulse,
            
            // Controls
            isAnimating: true,
            
            // Functions
            regenerateNetwork: function() {
                initializeNetwork();
            },
            clearCanvas: function() {
                ctx.fillStyle = config.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            },
            toggleAnimation: function() {
                config.isAnimating = !config.isAnimating;
            }
        };

        // ============================================================================
        // DATA STRUCTURES
        // ============================================================================
        let neurons = [];
        let branches = [];
        let synapses = [];
        let pulses = [];
        let growthQueue = [];

        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 4;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = config.branchColor;
                ctx.shadowBlur = config.synapseGlowStrength;
                ctx.fillStyle = config.branchColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Branch {
            constructor(x, y, angle, depth, parentNeuron) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parentNeuron = parentNeuron;
                this.length = 0;
                this.maxLength = config.maxBranchLength + Math.random() * 20 - 10;
                this.thickness = Math.max(0.5, 3 - depth * 0.3);
                this.isGrowing = true;
                this.color = depth % 2 === 0 ? config.branchColor : config.accentBranchColor;
                this.curvature = (Math.random() - 0.5) * config.branchCurvature;
            }

            grow() {
                if (!this.isGrowing) return;

                const speed = config.branchGrowthSpeed;
                this.length += speed;

                if (this.length >= this.maxLength) {
                    this.isGrowing = false;
                    
                    // Chance to create child branches
                    if (this.depth < config.maxBranchDepth && Math.random() < config.branchSplitChance) {
                        const childAngle1 = this.angle + (Math.random() - 0.5) * 0.6;
                        const childAngle2 = this.angle - (Math.random() - 0.5) * 0.6;
                        
                        growthQueue.push(new Branch(this.endX, this.endY, childAngle1, this.depth + 1, this.parentNeuron));
                        growthQueue.push(new Branch(this.endX, this.endY, childAngle2, this.depth + 1, this.parentNeuron));
                    }
                }
            }

            get endX() {
                return this.x + Math.cos(this.angle + this.curvature * this.length * 0.01) * this.length;
            }

            get endY() {
                return this.y + Math.sin(this.angle + this.curvature * this.length * 0.01) * this.length;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.endX, this.endY);
                ctx.stroke();
                
                ctx.restore();
            }
        }

        class Synapse {
            constructor(branch1, branch2) {
                this.branch1 = branch1;
                this.branch2 = branch2;
                this.x1 = branch1.endX;
                this.y1 = branch1.endY;
                this.x2 = branch2.endX;
                this.y2 = branch2.endY;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.x1 = this.branch1.endX;
                this.y1 = this.branch1.endY;
                this.x2 = this.branch2.endX;
                this.y2 = this.branch2.endY;
                this.pulsePhase += config.pulseFrequency;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = config.synapseColor;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = config.synapseColor;
                ctx.shadowBlur = config.synapseGlowStrength;
                
                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);
                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();
                
                // Draw synapse nodes
                ctx.fillStyle = config.synapseColor;
                ctx.beginPath();
                ctx.arc(this.x1, this.y1, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x2, this.y2, 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Pulse {
            constructor(synapse) {
                this.synapse = synapse;
                this.progress = 0;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.progress += config.pulseSpeed * 0.01;
            }

            draw() {
                if (this.progress > 1) return;

                const x = this.synapse.x1 + (this.synapse.x2 - this.synapse.x1) * this.progress;
                const y = this.synapse.y1 + (this.synapse.y2 - this.synapse.y1) * this.progress;

                ctx.save();
                ctx.fillStyle = config.pulseColor;
                ctx.shadowColor = config.pulseColor;
                ctx.shadowBlur = 15;
                ctx.globalAlpha = config.pulseBrightness * (1 - this.progress);
                
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            isComplete() {
                return this.progress > 1;
            }
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================
        function initializeNetwork() {
            neurons = [];
            branches = [];
            synapses = [];
            pulses = [];
            growthQueue = [];

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < config.neuronCount; i++) {
                const angle = (i / config.neuronCount) * Math.PI * 2;
                const distance = 80;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                
                const neuron = new Neuron(x, y);
                neurons.push(neuron);

                // Create initial branches from neuron
                for (let j = 0; j < 2; j++) {
                    const branchAngle = angle + (j - 0.5) * 0.8 + (Math.random() - 0.5) * 0.3;
                    growthQueue.push(new Branch(x, y, branchAngle, 0, neuron));
                }
            }
        }

        // ============================================================================
        // SYNAPSE DETECTION
        // ============================================================================
        function detectSynapses() {
            const threshold = config.synapseDistanceThreshold;
            const existingPairs = new Set();

            for (const synapse of synapses) {
                existingPairs.add(`${branches.indexOf(synapse.branch1)}-${branches.indexOf(synapse.branch2)}`);
                existingPairs.add(`${branches.indexOf(synapse.branch2)}-${branches.indexOf(synapse.branch1)}`);
            }

            for (let i = 0; i < branches.length; i++) {
                for (let j = i + 1; j < branches.length; j++) {
                    const b1 = branches[i];
                    const b2 = branches[j];

                    if (b1.parentNeuron === b2.parentNeuron) continue;
                    if (existingPairs.has(`${i}-${j}`)) continue;

                    const dx = b1.endX - b2.endX;
                    const dy = b1.endY - b2.endY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < threshold) {
                        const synapse = new Synapse(b1, b2);
                        synapses.push(synapse);
                        existingPairs.add(`${i}-${j}`);
                        existingPairs.add(`${j}-${i}`);
                    }
                }
            }
        }

        // ============================================================================
        // ANIMATION LOOP
        // ============================================================================
        function animate() {
            if (!config.isAnimating) {
                requestAnimationFrame(animate);
                return;
            }

            // Clear canvas
            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw scanlines
            ctx.strokeStyle = colors.gridScanline;
            ctx.lineWidth = 1;
            for (let y = 0; y < canvas.height; y += 4) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw vignette
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width * 0.7
            );
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and grow branches
            if (growthQueue.length > 0) {
                const branch = growthQueue.shift();
                branch.grow();
                branches.push(branch);
            }

            // Grow existing branches
            for (const branch of branches) {
                branch.grow();
                branch.draw();
            }

            // Detect synapses
            detectSynapses();

            // Update and draw synapses
            for (const synapse of synapses) {
                synapse.update();
                synapse.draw();

                // Create pulses occasionally
                if (Math.random() < config.pulseFrequency * 0.1) {
                    pulses.push(new Pulse(synapse));
                }
            }

            // Update and draw pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.update();
                pulse.draw();

                if (pulse.isComplete()) {
                    pulses.splice(i, 1);
                }
            }

            // Draw neurons
            for (const neuron of neurons) {
                neuron.draw();
            }

            requestAnimationFrame(animate);
        }

        // ============================================================================
        // DAT.GUI SETUP
        // ============================================================================
        function setupGUI() {
            const gui = new dat.GUI({ autoPlace: false });
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '0';
            gui.domElement.style.right = '0';
            document.querySelector('.container').appendChild(gui.domElement);

            // Growth folder
            const growthFolder = gui.addFolder('Growth');
            growthFolder.add(config, 'neuronCount', 1, 10, 1).onChange(() => initializeNetwork());
            growthFolder.add(config, 'branchGrowthSpeed', 0.5, 5, 0.5);
            growthFolder.add(config, 'maxBranchDepth', 2, 12, 1);
            growthFolder.add(config, 'branchSplitChance', 0, 1, 0.05);
            growthFolder.add(config, 'branchCurvature', 0, 0.5, 0.05);
            growthFolder.add(config, 'maxBranchLength', 30, 150, 10);
            growthFolder.open();

            // Synapses folder
            const synapsesFolder = gui.addFolder('Synapses');
            synapsesFolder.add(config, 'synapseDistanceThreshold', 10, 100, 5);
            synapsesFolder.add(config, 'synapseGlowStrength', 5, 30, 1);
            synapsesFolder.open();

            // Pulses folder
            const pulsesFolder = gui.addFolder('Pulses');
            pulsesFolder.add(config, 'pulseSpeed', 0.5, 10, 0.5);
            pulsesFolder.add(config, 'pulseFrequency', 0, 0.2, 0.01);
            pulsesFolder.add(config, 'pulseBrightness', 0, 1, 0.1);
            pulsesFolder.open();

            // Visuals folder
            const visualsFolder = gui.addFolder('Visuals');
            visualsFolder.addColor(config, 'backgroundColor');
            visualsFolder.addColor(config, 'branchColor');
            visualsFolder.addColor(config, 'accentBranchColor');
            visualsFolder.addColor(config, 'synapseColor');
            visualsFolder.addColor(config, 'pulseColor');
            visualsFolder.open();

            // Controls folder
            const controlsFolder = gui.addFolder('Controls');
            controlsFolder.add(config, 'regenerateNetwork').name('Regenerate Network');
            controlsFolder.add(config, 'clearCanvas').name('Clear Canvas');
            controlsFolder.add(config, 'toggleAnimation').name('Pause/Resume');
            controlsFolder.open();
        }

        // ============================================================================
        // STARTUP
        // ============================================================================
        initializeNetwork();
        setupGUI();
        animate();
    </script>
</body>
</html>
