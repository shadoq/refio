<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 500px;
    overflow: hidden;
  }

  .header {
    background: #5b5ea6;
    color: #fff;
    padding: 24px;
    text-align: center;
  }

  .header h1 {
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .input-section {
    display: flex;
    padding: 16px;
    gap: 8px;
    border-bottom: 1px solid #eee;
  }

  .input-section input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-section input:focus {
    border-color: #5b5ea6;
  }

  .input-section button {
    padding: 12px 20px;
    background: #5b5ea6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .input-section button:hover {
    background: #4a4d8f;
  }

  .filters {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    background: #fafafa;
  }

  .filters button {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    color: #666;
    transition: all 0.2s;
  }

  .filters button.active {
    background: #5b5ea6;
    color: #fff;
  }

  .filters button:hover:not(.active) {
    background: #e8e8e8;
  }

  .todo-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
  }

  .todo-list::-webkit-scrollbar {
    width: 6px;
  }

  .todo-list::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 3px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s;
  }

  .todo-item:hover {
    background: #f8f8ff;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #aaa;
  }

  .todo-checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid #ccc;
    border-radius: 50%;
    margin-right: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .todo-checkbox:hover {
    border-color: #5b5ea6;
  }

  .todo-item.completed .todo-checkbox {
    background: #5b5ea6;
    border-color: #5b5ea6;
  }

  .todo-item.completed .todo-checkbox::after {
    content: '✓';
    color: #fff;
    font-size: 14px;
    font-weight: bold;
  }

  .todo-text {
    flex: 1;
    font-size: 1rem;
    color: #333;
    word-break: break-word;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
    opacity: 0;
  }

  .todo-item:hover .delete-btn {
    opacity: 1;
  }

  .delete-btn:hover {
    color: #e74c3c;
    background: #ffeaea;
  }

  .footer {
    padding: 12px 16px;
    text-align: center;
    color: #999;
    font-size: 0.85rem;
    border-top: 1px solid #eee;
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: #bbb;
    font-size: 1rem;
  }

  @media (max-width: 500px) {
    .delete-btn {
      opacity: 1;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Todo App</h1>
  </div>
  <div class="input-section">
    <input type="text" id="todoInput" placeholder="What needs to be done?" autofocus>
    <button id="addBtn">Add</button>
  </div>
  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
  <div class="footer" id="footer"></div>
</div>

<script>
  const STORAGE_KEY = 'todos_zai_glm5';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  let currentFilter = 'all';

  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const footer = document.getElementById('footer');
  const filterBtns = document.querySelectorAll('.filters button');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, completed: false });
    todoInput.value = '';
    save();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.completed = !todo.completed;
    save();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function getFilteredTodos() {
    if (currentFilter === 'active') return todos.filter(t => !t.completed);
    if (currentFilter === 'completed') return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const filtered = getFilteredTodos();
    
    if (filtered.length === 0) {
      const messages = {
        all: 'No todos yet. Add one above!',
        active: 'No active todos. Great job!',
        completed: 'No completed todos yet.'
      };
      todoList.innerHTML = `<li class="empty-state">${messages[currentFilter]}</li>`;
    } else {
      todoList.innerHTML = filtered.map(todo => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
          <div class="todo-checkbox" onclick="toggleTodo(${todo.id})"></div>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">×</button>
        </li>
      `).join('');
    }

    const activeCount = todos.filter(t => !t.completed).length;
    const completedCount = todos.filter(t => t.completed).length;
    footer.textContent = `${activeCount} active · ${completedCount} completed · ${todos.length} total`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') addTodo();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
