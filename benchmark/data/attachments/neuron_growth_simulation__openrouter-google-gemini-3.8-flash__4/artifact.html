<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neural Network Growth Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070f;
      color: #ffd400;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      width: 800px;
      height: 800px;
      box-shadow: 0 0 50px rgba(16, 26, 58, 0.8), 0 0 20px rgba(0, 229, 255, 0.2);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    canvas {
      display: block;
      width: 800px;
      height: 800px;
      background-color: #05070f;
    }
    /* dat.gui custom styling for neon aesthetic */
    .dg.main {
      font-family: monospace !important;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
    }
    .dg.main .close-button {
      background-color: #101a3a !important;
      color: #ffd400 !important;
    }
    .dg li:not(.folder) {
      background: #090e1f !important;
      border-bottom: 1px solid rgba(0, 229, 255, 0.1) !important;
    }
    .dg li.title {
      background: #101a3a !important;
      color: #ffd400 !important;
      border-top: 1px solid rgba(255, 212, 0, 0.3) !important;
    }
    .dg .cr.number input[type=text] {
      color: #00e5ff !important;
    }
    .dg .c .slider {
      background: #05070f !important;
    }
    .dg .c .slider-fg {
      background: #00e5ff !important;
    }
  </style>
  <!-- dat.gui CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="simCanvas" width="800" height="800"></canvas>
  </div>

  <script>
    // --- SETUP & CONFIGURATION ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800;
    const H = 800;

    const params = {
      // Growth
      neuronCount: 4,
      growthSpeed: 1.8,
      maxDepth: 4,
      splitChance: 0.25,
      curvature: 0.18,
      maxBranchLength: 65,

      // Synapses
      synapseThreshold: 45,
      synapseGlow: 15,

      // Pulses
      pulseSpeed: 2.2,
      pulseFrequency: 0.08,
      pulseBrightness: 15,

      // Visuals
      bgColor: '#05070f',
      branchColor: '#00e5ff',
      accentBranchColor: '#d6ff00',
      synapseColor: '#ff2bd6',
      pulseColor: '#fff36a',

      // Actions
      regenerate: () => initNetwork(),
      clear: () => clearSimulation(),
      pauseResume: () => togglePause()
    };

    let isPaused = false;
    let neurons = [];
    let allBranches = [];
    let growingBranches = [];
    let synapses = [];
    let pulses = [];
    let pulseCooldown = 0;

    // --- GUI SETUP ---
    const gui = new dat.GUI({ autoPlace: true, width: 280 });

    const fGrowth = gui.addFolder('Growth');
    fGrowth.add(params, 'neuronCount', 3, 6, 1).name('Neurons');
    fGrowth.add(params, 'growthSpeed', 0.5, 4.0, 0.1).name('Speed');
    fGrowth.add(params, 'maxDepth', 2, 6, 1).name('Max Depth');
    fGrowth.add(params, 'splitChance', 0.05, 0.5, 0.01).name('Split Chance');
    fGrowth.add(params, 'curvature', 0.02, 0.4, 0.01).name('Curvature');
    fGrowth.add(params, 'maxBranchLength', 30, 120, 1).name('Max Length');
    fGrowth.open();

    const fSynapses = gui.addFolder('Synapses');
    fSynapses.add(params, 'synapseThreshold', 20, 80, 1).name('Distance Dist');
    fSynapses.add(params, 'synapseGlow', 5, 30, 1).name('Glow Strength');
    fSynapses.open();

    const fPulses = gui.addFolder('Pulses');
    fPulses.add(params, 'pulseSpeed', 0.8, 5.0, 0.1).name('Pulse Speed');
    fPulses.add(params, 'pulseFrequency', 0.01, 0.25, 0.01).name('Frequency');
    fPulses.add(params, 'pulseBrightness', 5, 30, 1).name('Brightness');
    fPulses.open();

    const fVisuals = gui.addFolder('Visuals');
    fVisuals.addColor(params, 'bgColor').name('Background');
    fVisuals.addColor(params, 'branchColor').name('Main Branch');
    fVisuals.addColor(params, 'accentBranchColor').name('Accent Branch');
    fVisuals.addColor(params, 'synapseColor').name('Synapse');
    fVisuals.addColor(params, 'pulseColor').name('Pulse');

    gui.add(params, 'regenerate').name('Regenerate');
    gui.add(params, 'clear').name('Clear Canvas');
    gui.add(params, 'pauseResume').name('Pause / Resume');

    function togglePause() {
      isPaused = !isPaused;
    }

    function clearSimulation() {
      neurons = [];
      allBranches = [];
      growingBranches = [];
      synapses = [];
      pulses = [];
    }

    // --- BRANCH & NEURON LOGIC ---
    class Branch {
      constructor(x, y, angle, depth, neuronId, parent = null) {
        this.x1 = x;
        this.y1 = y;
        this.x2 = x;
        this.y2 = y;
        this.angle = angle;
        this.targetAngle = angle;
        this.depth = depth;
        this.neuronId = neuronId;
        this.parent = parent;
        this.children = [];

        this.targetLength = (params.maxBranchLength * (0.6 + Math.random() * 0.8)) / (1 + depth * 0.2);
        this.currentLength = 0;
        this.isFinished = false;
        this.isAccent = Math.random() < 0.22;
        this.thickness = Math.max(1.0, (params.maxDepth - depth + 1.2) * 0.85);

        // Control point for smooth quadratic curve
        this.ctrlX = x;
        this.ctrlY = y;
      }

      grow(step) {
        if (this.isFinished) return;

        this.currentLength += step;
        this.angle += (Math.random() - 0.5) * params.curvature;

        const progress = Math.min(1.0, this.currentLength / this.targetLength);
        const curDist = this.currentLength;

        this.x2 = this.x1 + Math.cos(this.angle) * curDist;
        this.y2 = this.y1 + Math.sin(this.angle) * curDist;

        // Quadratic curve midpoint deviation
        const midDist = curDist * 0.5;
        const normAngle = this.angle + Math.PI / 2;
        const curveOffset = Math.sin(progress * Math.PI) * (this.targetLength * 0.15);
        this.ctrlX = this.x1 + Math.cos(this.angle) * midDist + Math.cos(normAngle) * curveOffset;
        this.ctrlY = this.y1 + Math.sin(this.angle) * midDist + Math.sin(normAngle) * curveOffset;

        // Out of bounds check
        if (this.x2 < 30 || this.x2 > W - 30 || this.y2 < 30 || this.y2 > H - 30) {
          this.isFinished = true;
          return;
        }

        if (this.currentLength >= this.targetLength) {
          this.isFinished = true;
          this.spawnSubBranches();
        }
      }

      spawnSubBranches() {
        if (this.depth >= params.maxDepth) {
          checkSynapsesForTip(this);
          return;
        }

        // Branching probability
        let branchesCount = 1;
        if (Math.random() < params.splitChance) {
          branchesCount = 2;
        }
        if (this.depth === 0 && Math.random() < 0.7) {
          branchesCount = 3;
        }

        const spread = 0.4 + Math.random() * 0.4;
        for (let i = 0; i < branchesCount; i++) {
          let branchAngle;
          if (branchesCount === 1) {
            branchAngle = this.angle + (Math.random() - 0.5) * 0.5;
          } else {
            const factor = (i / (branchesCount - 1)) - 0.5;
            branchAngle = this.angle + factor * spread + (Math.random() - 0.5) * 0.3;
          }

          const child = new Branch(this.x2, this.y2, branchAngle, this.depth + 1, this.neuronId, this);
          this.children.push(child);
          allBranches.push(child);
          growingBranches.push(child);
        }

        // Occasional minor side branch
        if (Math.random() < 0.35 && this.depth < params.maxDepth - 1) {
          const sideAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.4);
          const sideChild = new Branch(this.x2, this.y2, sideAngle, this.depth + 1, this.neuronId, this);
          sideChild.isAccent = true;
          sideChild.targetLength *= 0.65;
          this.children.push(sideChild);
          allBranches.push(sideChild);
          growingBranches.push(sideChild);
        }

        checkSynapsesForTip(this);
      }

      getPointAt(t) {
        // Quadratic bezier interpolation (x1,y1) -> (ctrlX, ctrlY) -> (x2, y2)
        const mt = 1 - t;
        const x = mt * mt * this.x1 + 2 * mt * t * this.ctrlX + t * t * this.x2;
        const y = mt * mt * this.y1 + 2 * mt * t * this.ctrlY + t * t * this.y2;
        return { x, y };
      }
    }

    class Synapse {
      constructor(b1, b2) {
        this.b1 = b1;
        this.b2 = b2;
        this.x1 = b1.x2;
        this.y1 = b1.y2;
        this.x2 = b2.x2;
        this.y2 = b2.y2;
        this.phase = Math.random() * Math.PI * 2;
      }

      draw(time) {
        const pulse = Math.sin(time * 0.005 + this.phase) * 0.5 + 0.5;
        const glow = params.synapseGlow * (0.8 + 0.6 * pulse);

        ctx.save();
        ctx.strokeStyle = params.synapseColor;
        ctx.fillStyle = params.synapseColor;
        ctx.shadowColor = params.synapseColor;
        ctx.shadowBlur = glow;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);

        ctx.beginPath();
        ctx.moveTo(this.x1, this.y1);
        ctx.lineTo(this.x2, this.y2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Small junction circles
        const r = 2.5 + pulse * 2.0;
        ctx.beginPath();
        ctx.arc(this.x1, this.y1, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x2, this.y2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Pulse {
      constructor(branch, reverse = false) {
        this.branch = branch;
        this.progress = reverse ? 1.0 : 0.0;
        this.speed = (params.pulseSpeed / (branch.targetLength || 40)) * (reverse ? -1 : 1);
        this.reverse = reverse;
        this.alive = true;
      }

      update() {
        this.progress += this.speed;

        if (!this.reverse && this.progress >= 1.0) {
          this.alive = false;
          // Propagate forward to children
          if (this.branch.children.length > 0) {
            for (let child of this.branch.children) {
              if (Math.random() < 0.85) {
                pulses.push(new Pulse(child, false));
              }
            }
          }
          // Check if pulse jumps through synapse
          for (let s of synapses) {
            if (s.b1 === this.branch && Math.random() < 0.6) {
              pulses.push(new Pulse(s.b2, false));
            } else if (s.b2 === this.branch && Math.random() < 0.6) {
              pulses.push(new Pulse(s.b1, false));
            }
          }
        } else if (this.reverse && this.progress <= 0.0) {
          this.alive = false;
          if (this.branch.parent && Math.random() < 0.75) {
            pulses.push(new Pulse(this.branch.parent, true));
          }
        }
      }

      draw() {
        const t = Math.max(0, Math.min(1, this.progress));
        const pt = this.branch.getPointAt(t);

        ctx.save();
        ctx.shadowColor = params.pulseColor;
        ctx.shadowBlur = params.pulseBrightness;
        ctx.fillStyle = params.pulseColor;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Extra white core
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- SYNAPSE DETECTION ---
    function checkSynapsesForTip(newBranch) {
      const threshSq = params.synapseThreshold * params.synapseThreshold;

      for (let b of allBranches) {
        if (b === newBranch || b.neuronId === newBranch.neuronId) continue;

        const dx = b.x2 - newBranch.x2;
        const dy = b.y2 - newBranch.y2;
        const distSq = dx * dx + dy * dy;

        if (distSq < threshSq && distSq > 4) {
          // Check if synapse already exists between these branches
          const exists = synapses.some(s =>
            (s.b1 === b && s.b2 === newBranch) ||
            (s.b1 === newBranch && s.b2 === b)
          );

          if (!exists && synapses.length < 150) {
            synapses.push(new Synapse(newBranch, b));
          }
        }
      }
    }

    // --- NETWORK INITIALIZATION ---
    function initNetwork() {
      clearSimulation();

      const count = params.neuronCount;
      const centerRadius = 80 + Math.random() * 40;

      for (let i = 0; i < count; i++) {
        const baseAngle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const dist = 30 + Math.random() * centerRadius;
        const nx = W / 2 + Math.cos(baseAngle) * dist;
        const ny = H / 2 + Math.sin(baseAngle) * dist;

        const neuron = {
          x: nx,
          y: ny,
          id: i,
          radius: 5 + Math.random() * 3,
          rootBranches: []
        };
        neurons.push(neuron);

        // 3-5 primary branches radiating outward
        const branchCount = 3 + Math.floor(Math.random() * 3);
        for (let j = 0; j < branchCount; j++) {
          const outwardAngle = baseAngle + ((j - branchCount / 2) * 0.7) + (Math.random() - 0.5) * 0.5;
          const rootBranch = new Branch(nx, ny, outwardAngle, 0, i, null);
          neuron.rootBranches.push(rootBranch);
          allBranches.push(rootBranch);
          growingBranches.push(rootBranch);
        }
      }
    }

    // --- RENDERING ROUTINES ---
    function drawBackground() {
      // Main dark background
      ctx.fillStyle = params.bgColor;
      ctx.fillRect(0, 0, W, H);

      // Deep radial glow in the center
      const grad = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.65);
      grad.addColorStop(0, '#101a3a');
      grad.addColorStop(0.7, 'rgba(16, 26, 58, 0.4)');
      grad.addColorStop(1, 'rgba(5, 7, 15, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Subtle cybernetic scanline / grid texture
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      ctx.beginPath();
      for (let x = 0; x <= W; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }
      for (let y = 0; y <= H; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();
    }

    function drawBranch(b) {
      const color = b.isAccent ? params.accentBranchColor : params.branchColor;
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = b.depth === 0 ? 12 : 6;
      ctx.lineWidth = b.thickness;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.quadraticCurveTo(b.ctrlX, b.ctrlY, b.x2, b.y2);
      ctx.stroke();
    }

    function drawNeuronSoma(n, time) {
      const pulse = Math.sin(time * 0.004 + n.id) * 0.5 + 0.5;
      const glow = 15 + pulse * 12;

      ctx.save();
      ctx.fillStyle = params.branchColor;
      ctx.shadowColor = params.branchColor;
      ctx.shadowBlur = glow;

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + pulse * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Bright nucleus
      ctx.shadowBlur = 4;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawVignette() {
      // Vignette effect to deepen borders
      const vGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.72);
      vGrad.addColorStop(0, 'rgba(5, 7, 15, 0)');
      vGrad.addColorStop(1, 'rgba(5, 7, 15, 0.85)');
      ctx.fillStyle = vGrad;
      ctx.fillRect(0, 0, W, H);

      // Delicate scanlines
      ctx.fillStyle = 'rgba(0, 229, 255, 0.015)';
      for (let y = 0; y < H; y += 4) {
        ctx.fillRect(0, y, W, 1.5);
      }
    }

    // --- MAIN ANIMATION LOOP ---
    function animate(currentTime) {
      requestAnimationFrame(animate);

      if (!isPaused) {
        // Step active growing branches
        if (growingBranches.length > 0) {
          for (let i = growingBranches.length - 1; i >= 0; i--) {
            const b = growingBranches[i];
            b.grow(params.growthSpeed);
            if (b.isFinished) {
              growingBranches.splice(i, 1);
            }
          }
        }

        // Spawn electrical pulses periodically
        pulseCooldown--;
        if (pulseCooldown <= 0) {
          pulseCooldown = Math.max(3, Math.floor(1 / (params.pulseFrequency || 0.01)));
          if (neurons.length > 0 && Math.random() < 0.8) {
            const rn = neurons[Math.floor(Math.random() * neurons.length)];
            if (rn.rootBranches.length > 0) {
              const rb = rn.rootBranches[Math.floor(Math.random() * rn.rootBranches.length)];
              pulses.push(new Pulse(rb, false));
            }
          }
        }

        // Update active pulses
        for (let i = pulses.length - 1; i >= 0; i--) {
          pulses[i].update();
          if (!pulses[i].alive) {
            pulses.splice(i, 1);
          }
        }
      }

      // Render
      drawBackground();

      // Render all branches
      for (let b of allBranches) {
        drawBranch(b);
      }

      // Render synapses
      for (let s of synapses) {
        s.draw(currentTime);
      }

      // Render neuron centers (somas)
      for (let n of neurons) {
        drawNeuronSoma(n, currentTime);
      }

      // Render pulses
      for (let p of pulses) {
        p.draw();
      }

      drawVignette();
    }

    // Start simulation
    initNetwork();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
