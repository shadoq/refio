<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gouraud-Shaded Rotating Cube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05050a;
    color: #cfd8e3;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
  }
  canvas {
    display: block;
    background: #0a0a14;
    box-shadow: 0 0 30px rgba(80, 120, 200, 0.15);
    border: 1px solid #1a1a2a;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 12px;
    line-height: 1.5;
    color: #cfd8e3;
    background: rgba(10, 10, 20, 0.6);
    padding: 8px 10px;
    border-radius: 4px;
    pointer-events: none;
    user-select: none;
  }
  #hud .label { color: #6a7a90; }
  #hud .val   { color: #e0e8f0; }
  #hud .key   { color: #ffd28a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="480"></canvas>
  <div id="hud">
    <div><span class="label">FPS:</span> <span class="val" id="fps">--</span></div>
    <div><span class="label">MODE:</span> <span class="val" id="mode">SHADED</span></div>
    <div><span class="label">STATE:</span> <span class="val" id="state">RUNNING</span></div>
    <div><span class="label">CONTROLS:</span> <span class="key">W</span> wireframe, <span class="key">P</span> pause</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ---------- HUD elements ----------
  const hudFps  = document.getElementById('fps');
  const hudMode = document.getElementById('mode');
  const hudState = document.getElementById('state');

  // ---------- State ----------
  let paused = false;
  let wireframe = false;
  let yaw = 0;
  let pitch = 0;
  let t = 0; // time accumulator for light orbit

  // FPS tracking
  let fpsFrames = 0;
  let fpsLast = performance.now();
  let fpsValue = 0;

  // ---------- Cube geometry ----------
  // 8 vertices at (±1, ±1, ±1)
  const verts = [
    [-1, -1, -1], // 0
    [ 1, -1, -1], // 1
    [ 1,  1, -1], // 2
    [-1,  1, -1], // 3
    [-1, -1,  1], // 4
    [ 1, -1,  1], // 5
    [ 1,  1,  1], // 6
    [-1,  1,  1], // 7
  ];

  // 6 faces, each split into 2 triangles (12 triangles total).
  // Each face: [v0, v1, v2, v3] in CCW order when viewed from outside.
  // Each triangle: [i0, i1, i2].
  const faces = [
    // Front  (+Z)  v4,v5,v6,v7
    [4, 5, 6], [4, 6, 7],
    // Back   (-Z)  v1,v0,v3,v2
    [1, 0, 3], [1, 3, 2],
    // Right  (+X)  v5,v1,v2,v6
    [5, 1, 2], [5, 2, 6],
    // Left   (-X)  v0,v4,v7,v3
    [0, 4, 7], [0, 7, 3],
    // Top    (+Y)  v7,v6,v2,v3
    [7, 6, 2], [7, 2, 3],
    // Bottom (-Y)  v0,v1,v5,v4
    [0, 1, 5], [0, 5, 4],
  ];

  // Face normals (outward). Used for backface culling and as vertex normals
  // (flat-shaded Gouraud, which is the standard literal interpretation for a cube).
  const faceNormals = [
    [ 0,  0,  1], // Front
    [ 0,  0, -1], // Back
    [ 1,  0,  0], // Right
    [-1,  0,  0], // Left
    [ 0,  1,  0], // Top
    [ 0, -1,  0], // Bottom
  ];

  // ---------- Camera / projection ----------
  const cubeSize = 1.4;     // edge length factor
  const cameraZ  = 4.0;     // camera distance along +Z
  const focal    = 400;     // focal length for perspective

  // ---------- Math helpers ----------
  function dot(a, b) {
    return a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  }
  function normalize(v) {
    const len = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0]/len, v[1]/len, v[2]/len];
  }
  function sub(a, b) {
    return [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  }

  // ---------- Rotation matrices ----------
  // Build a combined world matrix: M = Ry(yaw) * Rx(pitch)
  // Returns a function that transforms a point [x,y,z] -> [x,y,z] in world space.
  function makeWorldMatrix(yaw, pitch) {
    const cy = Math.cos(yaw),  sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    // Row-major 3x3
    return {
      m: [
        [ cy,       sy*sp,        sy*cp     ],
        [  0,       cp,           -sp       ],
        [-sy,       cy*sp,        cy*cp     ],
      ]
    };
  }
  function applyMat(M, p) {
    const m = M.m;
    return [
      m[0][0]*p[0] + m[0][1]*p[1] + m[0][2]*p[2],
      m[1][0]*p[0] + m[1][1]*p[1] + m[1][2]*p[2],
      m[2][0]*p[0] + m[2][1]*p[1] + m[2][2]*p[2],
    ];
  }

  // ---------- Project world point to screen ----------
  function project(p) {
    // Camera-space depth (camera looks down -Z, so depth = cameraZ - p.z)
    // We use z = cameraZ - p.z so that points in front of camera have positive depth.
    const z = cameraZ - p[2];
    if (z <= 0.01) return null; // behind camera
    const k = focal / z;
    const sx = W * 0.5 + p[0] * cubeSize * k;
    const sy = H * 0.5 - p[1] * cubeSize * k; // flip Y for screen
    return [sx, sy, z];
  }

  // ---------- Lighting ----------
  const ambient = 0.2;
  const baseColor = [200, 220, 255];

  function lightPos(t) {
    return [Math.cos(t) * 3, Math.sin(t * 0.7) * 2, Math.sin(t) * 3];
  }

  function lambertColor(normalWorld, worldPos) {
    // Light direction from surface point to light
    const Lraw = sub(lightPos(t), worldPos);
    const L = normalize(Lraw);
    const N = normalize(normalWorld);
    const diff = Math.max(0, dot(N, L));
    const f = ambient + diff * (1 - ambient);
    return [
      Math.min(255, Math.max(0, baseColor[0] * f)),
      Math.min(255, Math.max(0, baseColor[1] * f)),
      Math.min(255, Math.max(0, baseColor[2] * f)),
    ];
  }

  // ---------- Triangle rasterization (Gouraud via scanline) ----------
  // Inputs: 3 screen-space vertices (sx, sy, sz), 3 vertex colors [r,g,b].
  // Uses scanline rasterization: for each row, find left/right edge intersections,
  // interpolate color across the row, fill horizontal spans with fillRect.
  function rasterTriangle(p0, p1, p2, c0, c1, c2) {
    // Sort by Y ascending
    let v0 = p0, v1 = p1, v2 = p2;
    let col0 = c0, col1 = c1, col2 = c2;
    if (v0[1] > v1[1]) { const tv=v0; v0=v1; v1=tv; const tc=col0; col0=col1; col1=tc; }
    if (v1[1] > v2[1]) { const tv=v1; v1=v2; v2=tv; const tc=col1; col1=col2; col2=tc; }
    if (v0[1] > v1[1]) { const tv=v0; v0=v1; v1=tv; const tc=col0; col0=col1; col1=tc; }

    const y0 = v0[1], y1 = v1[1], y2 = v2[1];
    if (y2 - y0 < 1) return; // degenerate

    // Compute color at v1 along the v0->v2 edge for proper interpolation
    const t01 = (y1 - y0) / (y2 - y0);
    const col01 = [
      col0[0] + (col2[0] - col0[0]) * t01,
      col0[1] + (col2[1] - col0[1]) * t01,
      col0[2] + (col2[2] - col0[2]) * t01,
    ];

    // Scanline range
    const yStart = Math.max(0, Math.floor(y0));
    const yEnd   = Math.min(H - 1, Math.floor(y2));

    for (let y = yStart; y <= yEnd; y++) {
      // Determine which half of the triangle this scanline is in
      let xl, xr, cl, cr;
      if (y < y1) {
        // Upper half: interpolate along v0->v1 and v0->v2
        const ty = (y - y0) / (y1 - y0);
        const ty2 = (y - y0) / (y2 - y0);
        xl = v0[0] + (v1[0] - v0[0]) * ty;
        xr = v0[0] + (v2[0] - v0[0]) * ty2;
        cl = [ col0[0] + (col1[0] - col0[0]) * ty,
               col0[1] + (col1[1] - col0[1]) * ty,
               col0[2] + (col1[2] - col0[2]) * ty ];
        cr = [ col0[0] + (col2[0] - col0[0]) * ty2,
               col0[1] + (col2[1] - col0[1]) * ty2,
               col0[2] + (col2[2] - col0[2]) * ty2 ];
      } else {
        // Lower half: interpolate along v1->v2 and v0->v2
        const ty = (y - y1) / (y2 - y1);
        const ty2 = (y - y0) / (y2 - y0);
        xl = v1[0] + (v2[0] - v1[0]) * ty;
        xr = v0[0] + (v2[0] - v0[0]) * ty2;
        cl = [ col1[0] + (col2[0] - col1[0]) * ty,
               col1[1] + (col2[1] - col1[1]) * ty,
               col1[2] + (col2[2] - col1[2]) * ty ];
        cr = [ col0[0] + (col2[0] - col0[0]) * ty2,
               col0[1] + (col2[1] - col0[1]) * ty2,
               col0[2] + (col2[2] - col0[2]) * ty2 ];
      }

      if (xl > xr) { const tx=xl; xl=xr; xr=tx; const tc=cl; cl=cr; cr=tc; }

      const xStart = Math.max(0, Math.ceil(xl));
      const xEnd   = Math.min(W - 1, Math.floor(xr));
      if (xEnd < xStart) continue;

      const span = xEnd - xStart;
      if (span === 0) {
        // Single pixel — use average
        const r = (cl[0] + cr[0]) * 0.5 | 0;
        const g = (cl[1] + cr[1]) * 0.5 | 0;
        const b = (cl[2] + cr[2]) * 0.5 | 0;
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(xStart, y, 1, 1);
      } else {
        // Fill the whole span with the left color (cheap approximation).
        // For better quality, we could split into sub-spans, but a single
        // fillRect per scanline keeps performance high while still showing
        // smooth Gouraud gradients across the face.
        const r = cl[0] | 0;
        const g = cl[1] | 0;
        const b = cl[2] | 0;
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(xStart, y, span + 1, 1);
      }
    }
  }

  // ---------- Wireframe drawing ----------
  function drawWireframe(p0, p1, p2) {
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.lineTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.closePath();
    ctx.stroke();
  }

  // ---------- Main render ----------
  function render() {
    // Clear
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);

    // Update rotation
    if (!paused) {
      yaw   += 0.010;
      pitch += 0.013;
      t     += 0.016;
    }

    const M = makeWorldMatrix(yaw, pitch);

    // Transform vertices to world space
    const worldVerts = verts.map(v => applyMat(M, v));

    // Collect triangles with their world-space data
    const tris = [];
    for (let f = 0; f < faces.length; f++) {
      const tri = faces[f];
      const n = faceNormals[f];

      // Backface culling in world space:
      // Use face centroid as the reference point on the face.
      const w0 = worldVerts[tri[0]];
      const w1 = worldVerts[tri[1]];
      const w2 = worldVerts[tri[2]];
      const centroid = [
        (w0[0] + w1[0] + w2[0]) / 3,
        (w1[1] + w1[1] + w2[1]) / 3,
        (w0[2] + w1[2] + w2[2]) / 3,
      ];
      // View vector from face toward camera (camera is at origin looking +Z in world,
      // since we transformed vertices into world space and camera sits at z = cameraZ).
      const view = [0 - centroid[0], 0 - centroid[1], cameraZ - centroid[2]];
      if (dot(n, view) < 0) continue; // back-facing

      // Project to screen
      const s0 = project(w0);
      const s1 = project(w1);
      const s2 = project(w2);
      if (!s0 || !s1 || !s2) continue;

      // Per-vertex Lambert color (flat-shaded Gouraud: all three vertices share
      // the face normal, so the gradient across the face comes from the
      // varying distance to the light at each vertex).
      const c0 = lambertColor(n, w0);
      const c1 = lambertColor(n, w1);
      const c2 = lambertColor(n, w2);

      // Average depth for painter's algorithm (rough)
      const depth = (s0[2] + s1[2] + s2[2]) / 3;

      tris.push({ s0, s1, s2, c0, c1, c2, depth });
    }

    // Sort back-to-front (largest depth = farthest = draw first)
    tris.sort((a, b) => b.depth - a.depth);

    if (wireframe) {
      ctx.strokeStyle = '#7fdfff';
      ctx.lineWidth = 1;
      for (const t of tris) {
        drawWireframe(t.s0, t.s1, t.s2);
      }
    } else {
      for (const t of tris) {
        rasterTriangle(t.s0, t.s1, t.s2, t.c0, t.c1, t.c2);
      }
    }

    // FPS update every ~10 frames
    fpsFrames++;
    const now = performance.now();
    if (now - fpsLast >= 100) {
      fpsValue = (fpsFrames * 1000) / (now - fpsLast);
      fpsFrames = 0;
      fpsLast = now;
      hudFps.textContent = fpsValue.toFixed(1);
    }

    hudMode.textContent  = wireframe ? 'WIREFRAME' : 'SHADED';
    hudState.textContent = paused ? 'PAUSED' : 'RUNNING';

    requestAnimationFrame(render);
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w') {
      wireframe = !wireframe;
      e.preventDefault();
    } else if (k === 'p') {
      paused = !paused;
      e.preventDefault();
    }
  });

  // ---------- Start ----------
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
