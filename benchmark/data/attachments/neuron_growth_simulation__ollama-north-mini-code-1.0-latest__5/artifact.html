<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }
        #gui-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(0, 229, 255, 0.03) 0%,
                rgba(0, 229, 255, 0.03) 50%,
                rgba(0, 229, 255, 0.03) 100%
            );
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 998;
        }
        button {
            background: #101a3a;
            color: #00e5ff;
            border: 1px solid #00e5ff;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #00e5ff;
            color: #05070;
            box-shadow: 0 0 10px #00e5ff;
        }
        .gui-folder {
            color: #d6ff00;
        }
        .gui-folder > .title {
            color: #d6ff00 !important;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <div id="gui-container"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Color palette
        const colors = {
            background: '#05070',
            backgroundGlow: '#101a3a',
            mainBranch: '#00e5ff',
            secondaryAccent: '#d6ff00',
            synapse: '#ff2bd6',
            pulse: '#fff36a',
            ui: '#ffd400',
            grid: 'rgba(0, 229, 255, 0.08)'
        };

        // State
        let animationId = null;
        let isPaused = false;
        let branches = [];
        let synapses = [];
        let pulses = [];
        let frameCount = 0;
        
        // GUI controls
        const gui = new dat.GUI({ autoPlace: false });
        gui.domElement.id = 'gui-container';
        
        const folderGrowth = gui.addFolder('Growth');
        const folderSynapses = gui.addFolder('Synapses');
        const folderPulses = gui.addFolder('Pulses');
        const folderVisuals = gui.addFolder('Visuals');
        
        // Growth controls
        const growthControls = {
            neuronCount: 5,
            branchSpeed: 0.05,
            maxDepth: 6,
            splitChance: 0.3,
            curvature: 0.5,
            maxLength: 80,
            thickness: 1.0
        };
        
        folderGrowth.add(growthControls, 'neuronCount', 3, 10, 1).name('Neuron Count');
        folderGrowth.add(growthControls, 'branchSpeed', 0.01, 0.2).name('Growth Speed');
        folderGrowth.add(growthControls, 'maxDepth', 3, 10, 1).name('Max Depth');
        folderGrowth.add(growthControls, 'splitChance', 0, 1).name('Split Chance');
        folderGrowth.add(growthControls, 'curvature', 0, 1).name('Curvature');
        folderGrowth.add(growthControls, 'maxLength', 20, 200).name('Max Length');
        folderGrowth.add(growthControls, 'thickness', 0.5, 3).name('Branch Thickness');
        
        // Synapse controls
        const synapseControls = {
            distanceThreshold: 50,
            glowStrength: 1.0,
            detectionRadius: 30
        };
        
        folderSynapses.add(synapseControls, 'distanceThreshold', 10, 100).name('Distance Threshold');
        folderSynapses.add(synapseControls, 'glowStrength', 0.5, 3).name('Glow Strength');
        folderSynapses.add(synapseControls, 'detectionRadius', 10, 100).name('Detection Radius');
        
        // Pulse controls
        const pulseControls = {
            speed: 0.05,
            frequency: 0.02,
            brightness: 1.0,
            pulseRadius: 20
        };
        
        folderPulses.add(pulseControls, 'speed', 0.01, 0.2).name('Pulse Speed');
        folderPulses.add(pulseControls, 'frequency', 0.01, 0.1).name('Pulse Frequency');
        folderPulses.add(pulseControls, 'brightness', 0.5, 2).name('Pulse Brightness');
        folderPulses.add(pulseControls, 'pulseRadius', 5, 50).name('Pulse Radius');
        
        // Visual controls
        const visualControls = {
            backgroundColor: colors.background,
            branchColor: colors.mainBranch,
            accentColor: colors.secondaryAccent,
            synapseColor: colors.synapse,
            pulseColor: colors.pulse,
            showGrid: true,
            glowIntensity: 2.0
        };
        
        folderVisuals.addColor(visualControls, 'backgroundColor').name('Background');
        folderVisuals.addColor(visualControls, 'branchColor').name('Branch Color');
        folderVisuals.addColor(visualControls, 'accentColor').name('Accent Color');
        folderVisuals.addColor(visualControls, 'synapseColor').name('Synapse Color');
        folderVisuals.addColor(visualControls, 'pulseColor').name('Pulse Color');
        folderVisuals.add(visualControls, 'showGrid').name('Show Grid');
        folderVisuals.add(visualControls, 'glowIntensity', 1, 5).name('Glow Intensity');
        
        // Buttons
        const buttonControls = {
            regenerate: function() { regenerateNetwork(); },
            clear: function() { clearCanvas(); },
            pause: function() { togglePause(); }
        };
        
        folderVisuals.add(buttonControls, 'regenerate').name('Regenerate Network');
        folderVisuals.add(buttonControls, 'clear').name('Clear Canvas');
        folderVisuals.add(buttonControls, 'pause').name('Pause/Resume');
        
        folderGrowth.open();
        folderSynapses.open();
        folderPulses.open();
        folderVisuals.open();
        
        // Classes
        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
        }
        
        class Neuron {
            constructor(x, y) {
                this.pos = new Point(x, y);
                this.branches = [];
                this.grown = false;
                this.growthProgress = 0;
            }
        }
        
        class Branch {
            constructor(start, end, depth, parent = null) {
                this.start = start;
                this.end = end;
                this.depth = depth;
                this.parent = parent;
                this.length = Math.hypot(end.x - start.x, end.y - start.y);
                this.angle = Math.atan2(end.y - start.y, end.x - start.x);
                this.thickness = 1 + Math.random() * 0.8;
                this.color = Math.random() > 0.7 ? visualControls.accentColor : visualControls.branchColor;
                this.grown = false;
                this.growthProgress = 0;
                this.sideBranches = [];
            }
        }
        
        class Synapse {
            constructor(pos) {
                this.pos = pos;
                this.pulseActive = false;
                this.pulseTimer = 0;
                this.radius = pulseControls.pulseRadius;
            }
        }
        
        class Pulse {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = pulseControls.pulseRadius;
                this.alpha = 1;
                this.growing = true;
            }
        }
        
        // Helper functions
        function randomPointInCircle(center, radius) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * radius;
            return new Point(
                center.x + Math.cos(angle) * r,
                center.y + Math.sin(angle) * r
            );
        }
        
        function quadraticCurve(p0, p1, p2, t) {
            const x = Math.pow(1 - t) * p0.x + (1 - t) * t * p1.x + t * t * p2.x;
            const y = Math.pow(1 - t) * p0.y + (1 - t) * t * p1.y + t * t * p2.y;
            return new Point(x, y);
        }
        
        function drawLine(start, end, thickness, color, glow = false) {
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = thickness;
            
            if (glow) {
                ctx.shadowBlur = visualControls.glowIntensity * 10;
                ctx.shadowColor = color;
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
            ctx.closePath();
        }
        
        function drawCurve(p0, p1, p2, thickness, color, glow = false) {
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            
            const steps = 20;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const point = quadraticCurve(p0, p1, p2, t);
                if (i === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = thickness;
            
            if (glow) {
                ctx.shadowBlur = visualControls.glowIntensity * 10;
                ctx.shadowColor = color;
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
            ctx.closePath();
        }
        
        function updateBackground() {
            ctx.fillStyle = visualControls.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (visualControls.showGrid) {
                ctx.save();
                ctx.strokeStyle = colors.grid;
                ctx.lineWidth = 0.5;
                ctx.globalAlpha = 0.3;
                
                // Vertical lines
                for (let x = 0; x <= canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // Horizontal lines
                for (let y = 0; y <= canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }
        
        // Network generation
        function generateSeedNeurons(count) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 30;
            
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                branches.push(new Branch(new Point(x, y), new Point(x, y), 0));
            }
        }
        
        function growBranch(branch) {
            if (branch.grown || isPaused) return;
            
            branch.growthProgress += growthControls.branchSpeed;
            
            if (branch.growthProgress >= 1) {
                branch.grown = true;
                
                // Create side branches
                if (Math.random() < growthControls.splitChance && branch.depth < growthControls.maxDepth) {
                    const sideCount = Math.floor(Math.random() * 2) + 1;
                    for (let i = 0; i < sideCount; i++) {
                        const offsetAngle = (Math.random() - 0.5) * Math.PI * growthControls.curvature;
                        const sideAngle = branch.angle + offsetAngle;
                        const sideLength = branch.length * (0.6 + Math.random() * 0.4);
                        
                        const sideStart = new Point(branch.end.x, branch.end.y);
                        const sideEnd = new Point(
                            branch.end.x + Math.cos(sideAngle) * sideLength,
                            branch.end.y + Math.sin(sideAngle) * sideLength
                        );
                        
                        const sideBranch = new Branch(sideStart, sideEnd, branch.depth + 1, branch);
                        branch.sideBranches.push(sideBranch);
                        branches.push(sideBranch);
                    }
                }
                
                // Check for synapses
                checkSynapses(branch);
            }
        }
        
        function checkSynapses(branch) {
            for (let other of branches) {
                if (other === branch) continue;
                
                const dx = branch.end.x - other.end.x;
                const dy = branch.end.y - other.end.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < synapseControls.distanceThreshold) {
                    const synapsePos = new Point(
                        (branch.end.x + other.end.x) / 2,
                        (branch.end.y + other.end.y) / 2
                    );
                    
                    const synapse = new Synapse(synapsePos);
                    synapses.push(synapse);
                    
                    // Create pulse
                    const pulse = new Pulse(synapsePos.x, synapsePos.y);
                    pulses.push(pulse);
                }
            }
        }
        
        function animate() {
            if (isPaused) return;
            
            updateBackground();
            frameCount++;
            
            // Draw all branches
            for (let branch of branches) {
                if (branch.grown) {
                    drawCurve(
                        branch.start,
                        new Point((branch.start.x + branch.end.x) / 2, (branch.start.y + branch.end.y) / 2),
                        branch.end,
                        branch.thickness * growthControls.thickness,
                        branch.color,
                        true
                    );
                    
                    // Draw side branches
                    for (let side of branch.sideBranches) {
                        if (side.grown) {
                            drawCurve(
                                side.start,
                                new Point((side.start.x + side.end.x) / 2, (side.start.y + side.end.y) / 2),
                                side.end,
                                side.thickness * growthControls.thickness,
                                side.color,
                                true
                            );
                        } else {
                            growBranch(side);
                        }
                    }
                } else {
                    growBranch(branch);
                }
            }
            
            // Update and draw synapses
            for (let i = synapses.length - 1; i >= 0; i--) {
                const synapse = synapses[i];
                
                if (!synapse.pulseActive) {
                    drawLine(
                        synapse.pos,
                        new Point(synapse.pos.x, synapse.pos.y),
                        2,
                        visualControls.synapseColor,
                        true
                    );
                    
                    synapse.pulseActive = true;
                    setTimeout(() => { synapse.pulseActive = false; }, 100);
                }
                
                // Draw pulse
                ctx.save();
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = visualControls.pulseColor;
                ctx.lineWidth = 2;
                ctx.shadowBlur = visualControls.glowIntensity * 15;
                ctx.shadowColor = visualControls.pulseColor;
                
                ctx.beginPath();
                ctx.arc(synapse.pos.x, synapse.pos.y, pulseControls.pulseRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.closePath();
                ctx.restore();
            }
            
            // Update and draw pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                
                if (pulse.growing) {
                    pulse.radius += pulseControls.speed * pulseControls.brightness;
                    pulse.alpha -= 0.01;
                    
                    if (pulse.radius >= pulse.maxRadius * pulseControls.brightness) {
                        pulse.growing = false;
                    }
                } else {
                    pulse.radius -= pulseControls.speed * pulseControls.brightness;
                    pulse.alpha -= 0.01;
                }
                
                if (pulse.alpha <= 0 || pulse.radius <= 0) {
                    pulses.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = pulse.alpha;
                    ctx.strokeStyle = visualControls.pulseColor;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = visualControls.glowIntensity * 20;
                    ctx.shadowColor = visualControls.pulseColor;
                    
                    ctx.beginPath();
                    ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.closePath();
                    ctx.restore();
                }
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        function regenerateNetwork() {
            cancelAnimationFrame(animationId);
            branches = [];
            synapses = [];
            pulses = [];
            frameCount = 0;
            generateSeedNeurons(growthControls.neuronCount);
            animationId = requestAnimationFrame(animate);
        }
        
        function clearCanvas() {
            cancelAnimationFrame(animationId);
            branches = [];
            synapses = [];
            pulses = [];
            frameCount = 0;
            updateBackground();
        }
        
        function togglePause() {
            isPaused = !isPaused;
            if (!isPaused) {
                animationId = requestAnimationFrame(animate);
            }
        }
        
        // Initialize
        generateSeedNeurons(growthControls.neuronCount);
        animationId = requestAnimationFrame(animate);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = 800;
            canvas.height = 800;
            regenerateNetwork();
        });
    </script>
</body>
</html>
