name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 'check' runs tests plus the enforced gates: Jacoco coverage verification on :core
      # (35% instructions) and detectSensitiveLogging on :intellij-plugin. Running plain
      # 'test' here made those gates decorative on PRs.
      - name: Run checks (tests + coverage gate + sensitive-logging gate)
        run: ./gradlew check

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            core/build/reports/jacoco/test/html/
            intellij-plugin/build/reports/jacoco/test/html/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/build/reports/tests/test/
            intellij-plugin/build/reports/tests/test/
            cli/build/reports/tests/test/
          retention-days: 7

  # The e2e case catalog is the single source for the generated scenarios and prompts
  # under test_data/e2e. This job fails when a case was edited without regenerating
  # (or a generated file was hand-edited), so the two can never silently disagree.
  e2e-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/e2e/package-lock.json

      - name: Install e2e toolchain
        run: npm ci
        working-directory: tools/e2e

      - name: Unit tests (case schema + scenario emitter)
        run: npm test
        working-directory: tools/e2e

      - name: Catalog drift check
        run: npm run gen-catalog:check
        working-directory: tools/e2e

  plugin-verifier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-ides-${{ hashFiles('intellij-plugin/build.gradle.kts') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew :intellij-plugin:verifyPlugin -Dplugin.verifier.home.dir=$HOME/.pluginVerifier
