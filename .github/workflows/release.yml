name: Release

# Tag-triggered release: build the plugin ZIP, attach it to a GitHub release,
# and (when the Marketplace secrets are configured) sign + publish to the
# JetBrains Marketplace. Without the secrets the workflow still produces a
# GitHub release with the installable ZIP and says loudly what was skipped.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks
        run: ./gradlew check

      - name: Build plugin distribution
        run: ./gradlew :intellij-plugin:buildPlugin

      - name: Create GitHub release with plugin ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: intellij-plugin/build/distributions/*.zip
          generate_release_notes: true

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::notice::PUBLISH_TOKEN secret not set - skipping Marketplace publish. The plugin ZIP is attached to the GitHub release."
            exit 0
          fi
          if [ -z "$CERTIFICATE_CHAIN" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::warning::Signing secrets (CERTIFICATE_CHAIN / PRIVATE_KEY) not set - skipping Marketplace publish. The plugin ZIP is attached to the GitHub release."
            exit 0
          fi
          ./gradlew :intellij-plugin:publishPlugin
