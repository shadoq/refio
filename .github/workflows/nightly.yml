name: Nightly

# Nightly regression sweep. GitHub-hosted runners have no GPU and cannot serve a
# local model, so the model-backed e2e stabilization gate (tools/e2e/gate.sh)
# stays a manual / self-hosted concern. What CAN run here every night:
#   - the full Gradle 'check' (all module tests + coverage gate + sensitive-logging gate)
#   - the e2e harness assertion-engine self-test (offline, no LLM call)
#   - a syntax sanity pass over the benchmark shell scripts

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks (tests + coverage gate + sensitive-logging gate)
        run: ./gradlew check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: |
            core/build/reports/tests/test/
            intellij-plugin/build/reports/tests/test/
            cli/build/reports/tests/test/
          retention-days: 7

  e2e-harness-selftest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Benchmark scripts syntax check
        run: |
          bash -n tools/e2e/e2e-run.sh
          bash -n tools/e2e/gate.sh

      - name: E2E assertion-engine self-test (offline, no LLM)
        run: bash tools/e2e/e2e-run.sh --self-test
